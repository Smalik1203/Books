<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NCERT Mathematics — Class IX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#DCDAD6}
  body{display:flex;align-items:center;justify-content:center;
       font-family:'Poppins','Century Gothic','Segoe UI',system-ui,sans-serif}
  .frame{width:min(676px,96vw);aspect-ratio:676/776;overflow:hidden;
         box-shadow:0 10px 40px rgba(0,0,0,.18)}
  svg{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div class="frame">
<svg viewBox="0 0 676 776" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="NCERT Mathematics Textbook for Class IX, cover photograph">
<defs>
  <!-- the page overflows the right and bottom of the frame, exactly like the crop -->
  <clipPath id="page"><path d="M20 5 H730 V845 H20 Z"/></clipPath>

  <filter id="bookShadow" x="-40%" y="-40%" width="200%" height="200%">
    <feDropShadow dx="-7" dy="-4" stdDeviation="9"  flood-color="#3A3D45" flood-opacity=".28"/>
    <feDropShadow dx="0"  dy="0"  stdDeviation="20" flood-color="#3A3D45" flood-opacity=".13"/>
  </filter>

  <!-- warm stock with a cool sheen falling from the upper right -->
  <linearGradient id="paper" x1="1" y1="0" x2=".1" y2="1">
    <stop offset="0"   stop-color="#FCFBF8"/>
    <stop offset=".45" stop-color="#F5F3EE"/>
    <stop offset="1"   stop-color="#EDEBE4"/>
  </linearGradient>
  <linearGradient id="gutter" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#7E828B" stop-opacity=".42"/>
    <stop offset=".5"  stop-color="#7E828B" stop-opacity=".09"/>
    <stop offset="1"   stop-color="#7E828B" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#0F3570"/>
    <stop offset=".55" stop-color="#23589E"/>
    <stop offset="1"   stop-color="#1A4A8E"/>
  </linearGradient>

  <pattern id="grid" width="13" height="13" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.15" fill="#8FB8DF" opacity=".62"/>
  </pattern>

  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</defs>

<!-- studio backdrop -->
<rect width="676" height="776" fill="#E7E5E1"/>

<!-- the book, a hair off-square as a photographed object -->
<g transform="rotate(-0.35 338 388)">
  <path d="M20 5 H730 V845 H20 Z" fill="url(#paper)" filter="url(#bookShadow)"/>

  <g clip-path="url(#page)">

    <!-- ══════ decorative geometry, behind everything ══════ -->
    <circle cx="714" cy="580" r="152" fill="#CBE1F4"/>
    <circle cx="641" cy="470" r="31"  fill="#A9CFEC"/>
    <circle cx="678" cy="714" r="72"  fill="#F1B23F"/>

    <!-- nested discs sweeping out of the bottom-left corner -->
    <circle cx="-30" cy="850" r="290" fill="#CBE1F4"/>
    <circle cx="-30" cy="850" r="218" fill="#7EBBE4"/>
    <circle cx="-30" cy="850" r="148" fill="#2E80C4"/>

    <!-- ══════ bound edge: navy band + cyan rule ══════ -->
    <rect x="20" y="5" width="12" height="840" fill="url(#spine)"/>
    <rect x="37" y="5" width="4"  height="840" fill="#3FA5D9"/>

    <!-- ══════ NCERT emblem ══════ -->
    <g transform="translate(96,89)">
      <circle r="38" fill="none" stroke="#173B72" stroke-width="2.6"/>
      <g fill="none" stroke="#173B72" stroke-width="3.4" stroke-linecap="round">
        <g><circle cx="0" cy="-19.5" r="5.2" fill="#173B72" stroke="none"/>
           <path d="M-3.6 -11.6 C-16.8 -8 -21 5 -10.8 13 C-3.6 18.8 8 15.6 12.4 7.2"/></g>
        <g transform="rotate(120)"><circle cx="0" cy="-19.5" r="5.2" fill="#173B72" stroke="none"/>
           <path d="M-3.6 -11.6 C-16.8 -8 -21 5 -10.8 13 C-3.6 18.8 8 15.6 12.4 7.2"/></g>
        <g transform="rotate(240)"><circle cx="0" cy="-19.5" r="5.2" fill="#173B72" stroke="none"/>
           <path d="M-3.6 -11.6 C-16.8 -8 -21 5 -10.8 13 C-3.6 18.8 8 15.6 12.4 7.2"/></g>
      </g>
    </g>
    <text x="96" y="141" text-anchor="middle" font-family="'Noto Sans Devanagari',sans-serif"
          font-size="15.5" font-weight="600" fill="#173B72">एन सी ई आर टी</text>
    <text x="96" y="165" text-anchor="middle" font-size="20.5" font-weight="800"
          letter-spacing="1.6" fill="#173B72">NCERT</text>

    <!-- ══════ title — set to run past the right edge of the crop ══════ -->
    <text x="78" y="370" font-size="118" font-weight="800" fill="#173B72"
          textLength="731" lengthAdjust="spacingAndGlyphs">MATHEMATICS</text>
    <text x="82" y="430" font-size="31" font-weight="400" fill="#2E86C8"
          textLength="288" lengthAdjust="spacingAndGlyphs">Textbook for Class IX</text>

    <!-- ══════ graph: y = mx + c ══════ -->
    <g>
      <rect x="245" y="558" width="146" height="124" fill="url(#grid)"/>
      <text x="74" y="586" font-size="23" font-style="italic" font-weight="400" fill="#173B72">y = mx + c</text>
      <g stroke="#173B72" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M240 546 V706"/>
        <path d="M150 683 H408"/>
        <path d="M240 546 L233.8 559 M240 546 L246.2 559"/>
        <path d="M408 683 L396 677 M408 683 L396 689"/>
      </g>
      <text x="226" y="561" font-size="21" font-style="italic" font-weight="500" fill="#173B72">y</text>
      <text x="414" y="691" font-size="21" font-style="italic" font-weight="500" fill="#173B72">x</text>
      <text x="221" y="703" font-size="18" font-weight="400" fill="#173B72">O</text>
      <path d="M172 712 L390 568" stroke="#173B72" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <g stroke="#173B72" stroke-width="1.9" stroke-dasharray="6 5.5" opacity=".8">
        <path d="M240 615 H326"/><path d="M326 615 V683"/>
      </g>
      <circle cx="326" cy="615" r="6" fill="#173B72"/>
    </g>

    <!-- ══════ circle with inscribed triangle ABC ══════ -->
    <g>
      <circle cx="560" cy="578" r="85" fill="none" stroke="#173B72" stroke-width="2.8"/>
      <path d="M478 601 L645 590 L566 493 Z" fill="none" stroke="#173B72"
            stroke-width="2.8" stroke-linejoin="round"/>
      <g stroke="#173B72" stroke-width="2" opacity=".92">
        <path d="M560 578 L478 601"/><path d="M560 578 L645 590"/><path d="M560 578 L566 493"/>
      </g>
      <circle cx="560" cy="578" r="4.4" fill="#173B72"/>
      <text x="453" y="632" font-size="22" font-style="italic" font-weight="500" fill="#173B72">A</text>
      <text x="655" y="592" font-size="22" font-style="italic" font-weight="500" fill="#173B72">B</text>
      <text x="556" y="484" font-size="22" font-style="italic" font-weight="500" fill="#173B72">C</text>
      <text x="569" y="573" font-size="19" font-style="italic" font-weight="500" fill="#173B72">O</text>
    </g>

    <!-- ══════ microscope, cropped by the bottom edge ══════ -->
    <g transform="translate(408,660) scale(1.1)" fill="none" stroke="#173B72"
       stroke-linecap="round" stroke-linejoin="round">
      <!-- ribbed eyepiece -->
      <rect x="30" y="0" width="28" height="19" rx="1.5" stroke-width="3" fill="#CBE1F4"/>
      <g stroke-width="2" opacity=".7"><path d="M37 0V19"/><path d="M44 0V19"/><path d="M51 0V19"/></g>
      <!-- body tube -->
      <path d="M33 19 H55 V58 H33 Z" stroke-width="3" fill="#F5F3EE"/>
      <!-- arm -->
      <path d="M55 28 C78 32 82 62 69 75" stroke-width="3"/>
      <!-- objective lens -->
      <path d="M36 58 H52 L48 76 H40 Z" stroke-width="2.8" fill="#2E80C4"/>
      <!-- focus knob -->
      <circle cx="79" cy="66" r="9.5" stroke-width="2.8" fill="#CBE1F4"/>
      <!-- stage -->
      <path d="M2 82 H100" stroke-width="3.4"/>
      <path d="M21 82 V93 H77 V82" stroke-width="2.6"/>
      <!-- pillar and base, cropped by the frame edge -->
      <path d="M41 93 V114" stroke-width="3"/>
      <path d="M-4 120 C-4 107 98 107 98 120 V134 H-4 Z" stroke-width="3" fill="#CBE1F4"/>
    </g>

    <!-- ══════ photographic finish ══════ -->
    <rect x="20" y="5" width="28" height="840" fill="url(#gutter)"/>
    <rect x="20" y="5" width="710" height="840" filter="url(#grain)" opacity=".05"/>
  </g>
</g>
</svg>
</div>
</body>
</html>
