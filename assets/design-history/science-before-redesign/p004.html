<text class="food-text food-bold food-navy science-running" x="85" y="40">The Wonderful World of Science</text>
<line class="food-gold-rule" x1="422" y1="35" x2="957" y2="35"/>
<circle class="food-gold-tag" cx="957" cy="35" r="6"/>
<text class="food-text food-teal science-section" x="88" y="112">What This Book Will Ask You</text>
<g class="food-text science-copy">
<text x="89" y="153"><tspan x="89">Begin with the Earth — as far as we know, the only place in the universe where</tspan><tspan x="89" dy="31">anything is alive.</tspan></text>
<text x="89" y="241"><tspan x="89">A seed pushes a pale shoot up through dark soil. A caterpillar seals itself away and</tspan><tspan x="89" dy="31">comes out with wings. A calf that could barely stand in the morning is running</tspan><tspan x="89" dy="31">across the field by the end of the month. Growing is so ordinary that we stop noticing</tspan><tspan x="89" dy="31">it happening. But how does a plant build an entire body out of soil, water and air?</tspan></text>
<text x="89" y="391"><tspan x="89">Everything that grows has to eat. In a country this large, that alone is a</tspan><tspan x="89" dy="31">huge subject — pongal in one state, litti in another, a fish curry along the coast,</tspan><tspan x="89" dy="31">a plate of rajma somewhere north. What are these dishes actually made of? And</tspan><tspan x="89" dy="31">how could you find out for yourself, instead of being told?</tspan></text>
<text x="89" y="541"><tspan x="89">Then there is water. You have jumped into a puddle after rain. But where was that</tspan><tspan x="89" dy="31">water an hour before it fell on you, and how did it get up there? Cool it and it turns to</tspan><tspan x="89" dy="31">ice. Heat it and it leaves as steam. What is going on?</tspan></text>
<text x="89" y="660"><tspan x="89">And how hot is hot? When someone in your house has a fever, nobody wants a</tspan><tspan x="89" dy="31">guess. They want a number.</tspan></text>
<text x="89" y="748"><tspan x="89">Now look at what things are made of — paper, the metal of a key, a plastic scale, a</tspan><tspan x="89" dy="31">rubber eraser, the magnet holding a cupboard shut, the cloth of your shirt. Each one</tspan><tspan x="89" dy="31">was chosen for a reason. Could a key be made of rubber? Why not?</tspan></text>
<text x="89" y="867"><tspan x="89">And when the Earth runs out of questions, there is the sky above it.</tspan></text>
</g>
<text class="food-text food-teal food-bold science-lead" x="89" y="937">Every one of these has an answer. Not all of them are in this book.</text>
