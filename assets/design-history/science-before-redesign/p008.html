<line class="food-gold-rule" x1="422" y1="35" x2="957" y2="35"/><circle class="food-gold-tag" cx="957" cy="35" r="6"/>
<text class="food-text food-teal science-section" x="89" y="112"><tspan x="89">Curiosity, Company and a Long Road</tspan></text>
<text class="food-text science-copy" x="89" y="160"><tspan x="89">Everything in this chapter rests on one habit, and it is not a difficult one. Notice</tspan><tspan x="89" dy="29">things.</tspan></text><text class="food-text science-copy" x="89" y="230"><tspan x="89">Noticing sounds too simple to matter. It is not. Most people walk past a hundred</tspan><tspan x="89" dy="29">small oddities a day without registering a single one. The person who stops and says</tspan><tspan x="89" dy="29"><tspan class="science-italic">hold</tspan> <tspan class="science-italic">on,</tspan> <tspan class="science-italic">that's</tspan> <tspan class="science-italic">strange</tspan> has done the hardest part already. Everything else — the</tspan><tspan x="89" dy="29">questions, the guesses, the tests — follows from that pause.</tspan></text><text class="food-text science-copy" x="89" y="387"><tspan x="89">And you do not have to do any of it alone. Science has a reputation for lonely</tspan><tspan x="89" dy="29">geniuses, and it is mostly wrong. Discoveries today come from teams, often spread</tspan><tspan x="89" dy="29">across many countries, arguing with one another and checking each other's work.</tspan><tspan x="89" dy="29">Being told you are wrong by someone who has looked carefully at your evidence is</tspan><tspan x="89" dy="29">not an insult. It is one of the most useful things that can happen to you.</tspan></text><text class="food-text science-copy" x="89" y="573"><tspan x="89">So when you are stuck, ask someone. Compare what you saw with what your friend</tspan><tspan x="89" dy="29">saw. If you disagree about what happened, that disagreement is worth more than</tspan><tspan x="89" dy="29">either of your answers.</tspan></text><text class="food-text science-copy" x="89" y="672"><tspan x="89">One last thing, and it is important. You will not find the answers to all your questions</tspan><tspan x="89" dy="29">this year. Some of what you wonder about in Grade 6 you will only understand in</tspan><tspan x="89" dy="29">Grade 9, or later, or possibly never — because nobody has worked it out yet.</tspan></text><text class="food-text science-copy" x="89" y="800"><tspan x="89">That is not a warning. It is the best part.</tspan></text><text class="food-text food-teal food-bold science-lead" x="89" y="841"><tspan x="89">Activity 1.3 — Think and Write</tspan></text><text class="food-text science-copy" x="89" y="888"><tspan x="89">• Write down one "Why?" question about something you have noticed but never had</tspan><tspan x="89" dy="29">explained.</tspan></text><text class="food-text science-copy" x="89" y="954"><tspan x="89">• How might you begin to find the answer? Who could you ask, and what could you</tspan><tspan x="89" dy="29">test?</tspan></text><line class="science-answer-rule" x1="89" y1="1026" x2="963" y2="1026"/>
<line class="science-answer-rule" x1="89" y1="1054" x2="963" y2="1054"/>
<line class="science-answer-rule" x1="89" y1="1082" x2="963" y2="1082"/>
<line class="science-answer-rule" x1="89" y1="1110" x2="963" y2="1110"/>
<line class="science-answer-rule" x1="89" y1="1138" x2="963" y2="1138"/><text class="food-text food-teal food-bold science-lead" x="89" y="1178"><tspan x="89">Science begins with noticing. It continues with asking. And it never quite</tspan><tspan x="89" dy="29">ends.</tspan></text>
