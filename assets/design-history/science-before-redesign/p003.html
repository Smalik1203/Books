<line class="food-gold-rule" x1="422" y1="35" x2="957" y2="35"/>

<text class="food-text food-teal science-section" x="88" y="112">One Idea in Many Places</text>
<g class="food-text science-copy">
<text x="89" y="153"><tspan x="89">Some of what you learn in this book will be useful the same week you learn it. You will</tspan><tspan x="89" dy="31">understand why food spoils faster in May than in December, why a frayed electrical</tspan><tspan x="89" dy="31">wire is dangerous, why boiling water before drinking it makes it safe.</tspan></text>
<text x="89" y="263"><tspan x="89">But the real reward comes later, and it is stranger than that.</tspan></text>
<text x="89" y="311"><tspan x="89">Leave a wet shirt on a line and by evening it is dry. Pour water into an earthen <tspan class="science-italic">matka</tspan></tspan><tspan x="89" dy="31">and the water inside stays cool even on a hot afternoon. Watch the sky before the</tspan><tspan x="89" dy="31">monsoon and see clouds thickening where there was clear blue an hour ago.</tspan></text>
<text x="89" y="421"><tspan x="89">Three ordinary things. They seem to have nothing to do with each other.</tspan></text>
<text x="89" y="469"><tspan x="89">They are the same thing.</tspan></text>
<text x="89" y="517"><tspan x="89">In all three, water is leaving a liquid surface and moving into the air as an invisible</tspan><tspan x="89" dy="31">vapour. That is what dries the shirt. That is what cools the <tspan class="science-italic">matka</tspan> — water seeping</tspan><tspan x="89" dy="31">through the clay escapes from its surface and carries warmth with it. And that is</tspan><tspan x="89" dy="31">where clouds come from, as vapour rising from oceans and rivers gathers high in</tspan><tspan x="89" dy="31">the sky.</tspan></text>
<text x="89" y="818"><tspan x="89">This is what happens as you learn more science. At first it looks like a long list of</tspan><tspan x="89" dy="31">separate facts to be remembered. Then, slowly, the list starts folding in on itself. One</tspan><tspan x="89" dy="31">idea turns out to explain four things you thought were unrelated. Then ten.</tspan></text>
</g>
<rect class="food-prompt" x="84" y="681" width="879" height="98" rx="20"/>
<text class="food-text science-copy" x="106" y="720"><tspan x="106"><tspan class="food-bold food-teal">Can</tspan> <tspan class="food-bold food-teal">you</tspan> <tspan class="food-bold food-teal">explain</tspan> <tspan class="food-bold food-teal">why?</tspan> If evaporation cools the <tspan class="science-italic">matka</tspan>, what does that suggest</tspan><tspan x="106" dy="31">about why you feel cold when you step out of a swimming pool into the wind?</tspan></text>
<text class="food-text food-teal food-bold science-lead" x="89" y="939">The subject gets simpler as you go deeper, not harder.</text>
