<g class="food-text science-copy">
<text x="89" y="148"><tspan x="89">Science does not live in laboratories. Laboratories are useful,</tspan><tspan x="89" dy="31">but science is wherever something is happening.</tspan></text>
<text x="89" y="218"><tspan x="89">It is in the kitchen, where heat turns a soft batter into a firm,</tspan><tspan x="89" dy="31">holey dosa. It is on the cricket field, where a ball bends in the air</tspan><tspan x="89" dy="31">because of the way it was spun. It is in the soil under a mango</tspan><tspan x="89" dy="31">tree, where organisms too small to see are breaking down fallen</tspan><tspan x="89" dy="31">leaves. It is inside your own body, where your heart is beating</tspan><tspan x="89" dy="31">right now without being told to.</tspan></text>
<text x="89" y="466"><tspan x="89">Here is something surprising: science is not finished.</tspan></text>
<text x="89" y="505"><tspan x="89">Think of what we know as a map of a huge, mostly unexplored</tspan><tspan x="89" dy="31">land. Some regions are surveyed in fine detail. Others are</tspan><tspan x="89" dy="31">sketched roughly. Some are still blank. And every time explorers</tspan><tspan x="89" dy="31">map a new region, its edges open onto territory nobody knew</tspan><tspan x="89" dy="31">existed. The map does not shrink the unknown — it reveals</tspan><tspan x="89" dy="31">more of it.</tspan></text>
<text x="89" y="699"><tspan x="89">Sometimes the mapmakers get it wrong. For centuries people</tspan><tspan x="89" dy="31">were certain the Sun travelled around the Earth, because that is</tspan><tspan x="89" dy="31">exactly what it looks like. Careful observation showed otherwise,</tspan><tspan x="89" dy="31">and the map had to be redrawn. That correction was not a</tspan><tspan x="89" dy="31">failure of science. It was science working as it should.</tspan></text>
<text x="89" y="916"><tspan x="89">You will use many instruments in this book — thermometers,</tspan><tspan x="89" dy="31">magnets, lenses, balances. But the tool that matters most is not</tspan><tspan x="89" dy="31">one you can hold. It is <tspan class="food-bold">curiosity.</tspan></tspan></text>
<text x="89" y="1017"><tspan x="89">Curiosity is what makes you look up at a night sky and wonder</tspan><tspan x="89" dy="31">what the stars actually are, and how far away. It is what makes</tspan><tspan x="89" dy="31">you notice that a flower on your balcony is shut at dawn and</tspan><tspan x="89" dy="31">open by mid-morning, and then wonder how it knows.</tspan></text>
<text x="106" y="1173"><tspan x="106"><tspan class="food-bold food-teal">Why might this happen?</tspan> A flower has no eyes and no clock. What could it be</tspan><tspan x="106" dy="31">responding to? You do not need the right answer yet — only a reasonable guess.</tspan><tspan x="106" dy="31">That guess is called a <tspan class="science-italic">prediction</tspan>, and making one before you know the answer is a</tspan><tspan x="106" dy="31">genuinely scientific act.</tspan></text>
</g>
