<text class="food-text food-teal science-section" x="88" y="112">Working It Out Yourself</text>
<g class="food-text science-copy">
<text x="89" y="153"><tspan x="89">You already do science. You have simply never called it that.</tspan></text>
<text x="89" y="201"><tspan x="89">Suppose the clock on your wall has stopped. Both hands are frozen at ten past four.</tspan></text>
<text x="89" y="249"><tspan x="89">The first thing you do is ask a question, even if only in your head: <tspan class="science-italic">why</tspan> <tspan class="science-italic">has</tspan> <tspan class="science-italic">it</tspan> <tspan class="science-italic">stopped?</tspan></tspan></text>
<text x="89" y="297"><tspan x="89">Then, almost without noticing, you make a guess. The cell inside must be finished.</tspan></text>
<text x="89" y="345"><tspan x="89">Making a guess is the easy part. What matters is what you do next. You take the</tspan><tspan x="89" dy="31">clock down, open the back, and fit a new cell.</tspan></text>
<text x="89" y="424"><tspan x="89">If the hands begin to move, your guess was right and the job is done.</tspan></text>
<text x="89" y="472"><tspan x="89">But suppose they do not move.</tspan></text>
<text x="89" y="520"><tspan x="89">Now stop and notice something. The clock is still stopped, so it feels as though</tspan><tspan x="89" dy="31">nothing has been achieved. That is not true. You have learnt that the problem is <tspan class="science-italic">not</tspan></tspan><tspan x="89" dy="31">the cell — and a minute ago you did not know that. A test that proves you wrong still</tspan><tspan x="89" dy="31">tells you something real.</tspan></text>
<text x="89" y="661"><tspan x="89">So you make a second guess. Perhaps the cell is fine but is not pressing properly</tspan><tspan x="89" dy="31">against the metal contacts. You push it in firmly and give it a moment. Still nothing.</tspan></text>
<text x="89" y="740"><tspan x="89">A third guess, then: something inside is stuck. You look more closely and find the thin</tspan><tspan x="89" dy="31">second hand has caught against the minute hand and cannot pass it.</tspan></text>
<text x="89" y="924"><tspan x="89">Nobody sat you down and taught you that sequence. Yet it is very close to what a</tspan><tspan x="89" dy="31">scientist does when facing something no one has ever explained.</tspan></text>
</g>
<text class="food-text food-teal food-bold science-lead" x="89" y="836"><tspan x="89">Question. Guess. Test. Look honestly at what happened.</tspan><tspan x="89" dy="33">Guess again if you must.</tspan></text>
