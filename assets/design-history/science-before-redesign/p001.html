<text x="133" y="729"><tspan x="133">Look around you right now. Something is happening everywhere you turn.</tspan></text>
<text x="133" y="785"><tspan x="133">A fan is spinning. Sunlight is falling through a window and landing in a bright</tspan><tspan x="133" dy="31">patch on the floor. Somewhere nearby, water is boiling, or a bird is calling, or</tspan><tspan x="133" dy="31">dust is drifting through a beam of light. None of this is unusual. All of it is worth</tspan><tspan x="133" dy="31">a second look.</tspan></text>
<text x="133" y="934"><tspan x="133">You have been noticing things like this your whole life — why the moon seems</tspan><tspan x="133" dy="31">to follow the car, why ice feels wet, why your shadow stretches long in the</tspan><tspan x="133" dy="31">evening. Those questions were not childish. They were the beginning of</tspan><tspan x="133" dy="31">something.</tspan></text>
<text x="133" y="1083"><tspan x="133">Now you are ready to go further.</tspan></text>
<text x="133" y="1167"><tspan x="133">Science is not a pile of facts to memorise. Science is a way of working.</tspan><tspan x="133" dy="31">It means observing carefully, asking sharp questions, testing what you think</tspan><tspan x="133" dy="31">you know, and being willing to change your mind when the evidence says</tspan><tspan x="133" dy="31">you should.</tspan></text>
</g>
