<text class="food-text food-bold food-navy science-running" x="85" y="40">The Wonderful World of Science</text>
<line class="food-gold-rule" x1="422" y1="35" x2="957" y2="35"/><circle class="food-gold-tag" cx="957" cy="35" r="6"/>
<text class="food-text food-teal science-section" x="89" y="112"><tspan x="89">Everyone Does This</tspan></text>
<text class="food-text science-copy" x="89" y="160"><tspan x="89">Scientists follow the scientific method for a living. But nobody owns it, and it is used</tspan><tspan x="89" dy="29">every day by people who would never call themselves scientists.</tspan></text><text class="food-text science-copy" x="89" y="230"><tspan x="89">A cook lifts the lid off the idli batter in the morning and finds it flat instead of risen.</tspan><tspan x="89" dy="29">She asks why. Was the kitchen too cold overnight? Was the batter ground too thin?</tspan><tspan x="89" dy="29">She will not solve it by worrying — she will change one thing tomorrow and watch</tspan><tspan x="89" dy="29">what happens.</tspan></text><text class="food-text science-copy" x="89" y="358"><tspan x="89">A tailor's machine starts skipping stitches. He does not replace the whole machine.</tspan><tspan x="89" dy="29">He checks the needle first, then the thread tension, then the bobbin — one at a time,</tspan><tspan x="89" dy="29">because changing everything at once would tell him nothing.</tspan></text><text class="food-text science-copy" x="89" y="457"><tspan x="89">An electrician is called about a tubelight that flickers for a long time before it</tspan><tspan x="89" dy="29">steadies. Is it the tube, the starter, or the wiring? Each of those can be tested</tspan><tspan x="89" dy="29">separately.</tspan></text><text class="food-text science-copy" x="89" y="556"><tspan x="89">None of them are in a laboratory. All of them are doing exactly what step three and</tspan><tspan x="89" dy="29">step four describe: guess, then test — and crucially, test <tspan class="science-italic">one</tspan> <tspan class="science-italic">thing</tspan> <tspan class="science-italic">at</tspan> <tspan class="science-italic">a</tspan> <tspan class="science-italic">time</tspan>, so that</tspan><tspan x="89" dy="29">the result actually means something.</tspan></text><svg class="science-illustration" x="89" y="655" width="874" height="190" viewBox="0 0 2172 724" preserveAspectRatio="xMidYMid meet" overflow="hidden"><image href="../../figures/class-6/science/ch01-p007-everyday-science.png" width="2172" height="724"><title>A cook inspecting batter, a tailor checking a sewing machine, and an electrician inspecting a disconnected light fitting.</title></image></svg><text class="food-text food-bold science-running" x="336" y="869" text-anchor="middle">Cook</text><text class="food-text food-bold science-running" x="526" y="869" text-anchor="middle">Tailor</text><text class="food-text food-bold science-running" x="716" y="869" text-anchor="middle">Electrician</text><text class="food-text food-teal food-bold science-lead" x="89" y="914"><tspan x="89">Activity 1.2 — Watch and Record</tspan></text><text class="food-text science-copy" x="89" y="961"><tspan x="89">Choose one thing near your home that changes over time — a plant on a windowsill,</tspan><tspan x="89" dy="29">a puddle after rain, ants around a spill, the shadow of a pole.</tspan></text><text class="food-text science-copy" x="89" y="1031"><tspan x="89">• Watch it for five minutes without doing anything to it.</tspan></text><text class="food-text science-copy" x="89" y="1068"><tspan x="89">• Write down three things you actually saw. Not what you think should happen —</tspan><tspan x="89" dy="29">what happened.</tspan></text><text class="food-text science-copy" x="89" y="1134"><tspan x="89">• Write one question your observation raised.</tspan></text><line class="science-answer-rule" x1="89" y1="1177" x2="963" y2="1177"/>
