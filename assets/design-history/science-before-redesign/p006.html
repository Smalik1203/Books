<div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1369" aria-label="The Steps Behind It">
<text class="food-text food-bold food-navy science-running" x="85" y="40">The Wonderful World of Science</text>
<line class="food-gold-rule" x1="422" y1="35" x2="957" y2="35"/><circle class="food-gold-tag" cx="957" cy="35" r="6"/>
<text class="food-text food-teal science-section" x="89" y="112"><tspan x="89">The Steps Behind It</tspan></text>
<text class="food-text science-copy" x="89" y="160"><tspan x="89">What you did with the clock has a name. It is called the <tspan class="food-bold">scientific</tspan> <tspan class="food-bold">method</tspan>, and</tspan><tspan x="89" dy="29">written out plainly it looks like this:</tspan></text><text class="food-text science-copy" x="89" y="230"><tspan x="89">1. <tspan class="food-bold">Observe</tspan> something that puzzles you or catches your interest.</tspan></text><text class="food-text science-copy" x="89" y="271"><tspan x="89">2. <tspan class="food-bold">Ask</tspan> <tspan class="food-bold">a</tspan> <tspan class="food-bold">question</tspan> about it.</tspan></text><text class="food-text science-copy" x="89" y="312"><tspan x="89">3. <tspan class="food-bold">Guess</tspan> a possible answer.</tspan></text><text class="food-text science-copy" x="89" y="353"><tspan x="89">4. <tspan class="food-bold">Test</tspan> the guess, through an experiment or through further careful observation.</tspan></text><text class="food-text science-copy" x="89" y="423"><tspan x="89">5. <tspan class="food-bold">Examine</tspan> <tspan class="food-bold">the</tspan> <tspan class="food-bold">result</tspan> and decide whether it actually answers your question.</tspan></text><text class="food-text science-copy" x="89" y="464"><tspan x="89">That list looks tidier than real life ever is. Very often you finish step five only to</tspan><tspan x="89" dy="29">discover you are back at step three with a fresh guess. Sometimes the test throws up</tspan><tspan x="89" dy="29">something you were not even looking for, and that becomes a better question than</tspan><tspan x="89" dy="29">the one you started with.</tspan></text><text class="food-text science-copy" x="89" y="592"><tspan x="89">The order matters, but the neatness does not. What matters is that the guess comes</tspan><tspan x="89" dy="29"><tspan class="science-italic">before</tspan> the test, and that you accept the result even when it is not the one you</tspan><tspan x="89" dy="29">wanted.</tspan></text><rect class="food-panel" x="89" y="695" width="166" height="66" rx="12"/><text class="food-text food-bold science-running" x="101" y="723"><tspan x="101">Observe</tspan></text><path class="food-rule" d="M255 728h11m-5 -5 5 5 -5 5"/><rect class="food-panel" x="266" y="695" width="166" height="66" rx="12"/><text class="food-text food-bold science-running" x="278" y="723"><tspan x="278">Question</tspan></text><path class="food-rule" d="M432 728h11m-5 -5 5 5 -5 5"/><rect class="food-panel" x="443" y="695" width="166" height="66" rx="12"/><text class="food-text food-bold science-running" x="455" y="723"><tspan x="455">Guess</tspan></text><path class="food-rule" d="M609 728h11m-5 -5 5 5 -5 5"/><rect class="food-panel" x="620" y="695" width="166" height="66" rx="12"/><text class="food-text food-bold science-running" x="632" y="723"><tspan x="632">Test</tspan></text><path class="food-rule" d="M786 728h11m-5 -5 5 5 -5 5"/><rect class="food-panel" x="797" y="695" width="166" height="66" rx="12"/><text class="food-text food-bold science-running" x="809" y="723"><tspan x="809">Examine the</tspan><tspan x="809" dy="22">result</tspan></text><path class="food-rule food-dots" d="M880 761v28q0 18 -18 18H548q-18 0 -18 -18v-28"/><path class="food-rule" d="M525 768l5 -7 5 7"/><text class="food-text food-teal food-bold science-lead" x="89" y="849"><tspan x="89">Activity 1.1 — Think and Write</tspan></text><text class="food-text science-copy" x="89" y="896"><tspan x="89">• Write about a problem you worked out for yourself recently. It does not have to be a</tspan><tspan x="89" dy="29">science problem.</tspan></text><text class="food-text science-copy" x="89" y="962"><tspan x="89">• List the steps you took, in order.</tspan></text><text class="food-text science-copy" x="89" y="999"><tspan x="89">• Was there a point where you had to change your first guess?</tspan></text><line class="science-answer-rule" x1="89" y1="1042" x2="96
