<section class="page page--food page--science-editorial" data-folio="3" data-reference-page="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1369" aria-label="The Wonderful World of Science, page 3"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M31 63Q34 30 60 7"/><path class="se-botanical-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 1</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">The Wonderful World of Science</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header -->
<text class="se-heading" x="89" y="124">One Idea in Many Places</text>
<text class="se-copy " x="89" y="171"><tspan x="89">Some of what you learn in this book will be useful the same week you learn it. You</tspan><tspan x="89" dy="31">will understand why food spoils faster in May than in December, why a frayed</tspan><tspan x="89" dy="31">electrical wire is dangerous, why boiling water before drinking it makes it safe.</tspan></text>
<text class="se-copy " x="89" y="278"><tspan x="89">But the real reward comes later, and it is stranger than that.</tspan></text>
<text class="se-copy " x="89" y="323"><tspan x="89">Leave a wet shirt on a line and by evening it is dry. Pour water into an earthen <tspan class="se-italic">matka</tspan></tspan><tspan x="89" dy="31">and the water inside stays cool even on a hot afternoon. Watch the sky before the</tspan><tspan x="89" dy="31">monsoon and see clouds thickening where there was clear blue an hour ago.</tspan></text>
<text class="se-copy " x="89" y="430"><tspan x="89">Three ordinary things. They seem to have nothing to do with each other.</tspan></text>
<text class="se-copy " x="89" y="475"><tspan x="89">They are the same thing.</tspan></text>
<svg class="science-illustration" x="89" y="497" width="280" height="182" viewBox="51 1047 300 296" preserveAspectRatio="xMidYMid meet" overflow="hidden"><defs><clipPath id="se-art-clip-5"><rect x="51" y="1047" width="300" height="296"/></clipPath></defs><image clip-path="url(#se-art-clip-5)" href="../../figures/class-6/science/ch01-p003-one-idea-reference.png" x="0" y="0" width="1052" height="1495"><title>Drying</title></image></svg>
<text class="se-caption" x="149" y="704">Drying</text>
<svg class="science-illustration" x="386" y="497" width="280" height="182" viewBox="374 1047 300 296" preserveAspectRatio="xMidYMid meet" overflow="hidden"><defs><clipPath id="se-art-clip-6"><rect x="374" y="1047" width="300" height="296"/></clipPath></defs><image clip-path="url(#se-art-clip-6)" href="../../figures/class-6/science/ch01-p003-one-idea-reference.png" x="0" y="0" width="1052" height="1495"><title>Cooling</title></image></svg>
<text class="se-caption" x="446" y="704">Cooling</text>
<svg class="science-illustration" x="683" y="497" width="280" height="182" viewBox="702 1047 300 296" preserveAspectRatio="xMidYMid meet" overflow="hidden"><defs><clipPath id="se-art-clip-7"><rect x="702" y="1047" width="300" height="296"/></clipPath></defs><image clip-path="url(#se-art-clip-7)" href="../../figures/class-6/science/ch01-p003-one-idea-reference.png" x="0" y="0" width="1052" height="1495"><title>Cloud forming</title></image></svg>
<text class="se-caption" x="743" y="704">Cloud forming</text>
<text class="se-copy " x="89" y="758"><tspan x="89">In all three, water is leaving a liquid surface and moving into the air as an invisible</tspan><tspan x="89" dy="31">vapour. That is what dries the shirt. That is what cools the <tspan class="se-italic">matka</tspan> — water seeping</tspan><tspan x="89" dy="31">through the clay escapes from its surface and carries warmth away with it. And that</tspan><tspan x="89" dy="31">is where clouds come from, as vapour rising from oceans and rivers gathers high in</tspan><tspan x="89" dy="31">the sky.</tspan></text>
<rect class="se-prompt" x="89" y="904" width="874" height="102"/><text class="se-copy " x="113" y="945"><tspan x="113"><tspan class="se-bold">Can</tspan> <tspan class="se-bold">you</tspan> <tspan class="se-bold">explain</tspan> <tspan class="se-bold">why?</tspan> If evaporation cools the <tspan class="se-italic">matka</tspan>, what does that suggest</tspan><tspan x="113" dy="31">about why you feel cold when you step out of a swimming pool into the wind?</tspan></text>
<text class="se-copy " x="89" y="1049"><tspan x="89">This is what happens as you learn more science. At first it looks like a long list of</tspan><tspan x="89" dy="31">separate facts to be remembered. Then, slowly, the list starts folding in on itself. One</tspan><tspan x="89" dy="31">idea turns out to explain four things you thought were unrelated. Then ten.</tspan></text>
<text class="se-copy " x="89" y="1156"><tspan x="89">Clouds become visible when cooling water vapour condenses into tiny droplets or</tspan><tspan x="89" dy="31">forms ice crystals. Evaporation supplies the vapour; condensation helps form clouds.</tspan></text>
<text class="se-copy se-takeaway" x="89" y="1232"><tspan x="89">The subject gets simpler as you go deeper, not harder.</tspan></text>
