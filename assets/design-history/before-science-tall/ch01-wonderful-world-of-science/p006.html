<section class="page page--food page--science-editorial" data-folio="6" data-reference-page="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1369" aria-label="The Wonderful World of Science, page 6"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M31 63Q34 30 60 7"/><path class="se-botanical-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 1</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">The Wonderful World of Science</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header -->
<text class="se-heading" x="89" y="124">The Steps Behind It</text>
<text class="se-copy " x="89" y="171"><tspan x="89">What you did with the clock has a name. It is called the <tspan class="se-bold">scientific</tspan> <tspan class="se-bold">method</tspan>, and</tspan><tspan x="89" dy="31">written out plainly it looks like this:</tspan></text>
<text class="se-copy " x="89" y="247"><tspan x="89">1. <tspan class="se-bold">Observe</tspan> something that puzzles you or catches your interest.</tspan></text>
<text class="se-copy " x="89" y="287"><tspan x="89">2. <tspan class="se-bold">Ask</tspan> <tspan class="se-bold">a</tspan> <tspan class="se-bold">question</tspan> about it.</tspan></text>
<text class="se-copy " x="89" y="327"><tspan x="89">3. <tspan class="se-bold">Guess</tspan> a possible answer.</tspan></text>
<text class="se-copy " x="89" y="367"><tspan x="89">4. <tspan class="se-bold">Test</tspan> the guess, through an experiment or through further careful observation.</tspan></text>
<text class="se-copy " x="89" y="407"><tspan x="89">5. <tspan class="se-bold">Examine</tspan> <tspan class="se-bold">the</tspan> <tspan class="se-bold">result</tspan> and decide whether it actually answers your question.</tspan></text>
<text class="se-copy " x="89" y="447"><tspan x="89">That list looks tidier than real life ever is. Very often you finish step five only to</tspan><tspan x="89" dy="31">discover you are back at step three with a fresh guess. Sometimes the test throws up</tspan><tspan x="89" dy="31">something you were not even looking for, and that becomes a better question than</tspan><tspan x="89" dy="31">the one you started with.</tspan></text>
<text class="se-copy " x="89" y="585"><tspan x="89">The order matters, but the neatness does not. What matters is that the guess comes</tspan><tspan x="89" dy="31"><tspan class="se-italic">before</tspan> the test, and that you accept the result even when it is not the one you wanted.</tspan></text>
<rect class="se-process" x="89" y="646" width="166" height="64" rx="8"/><text class="se-caption" x="101" y="683">Observe</text>
<path class="se-accent" d="M256 678h10m-4 -4 4 4 -4 4"/><rect class="se-process" x="266" y="646" width="166" height="64" rx="8"/><text class="se-caption" x="278" y="683">Question</text>
<path class="se-accent" d="M433 678h10m-4 -4 4 4 -4 4"/><rect class="se-process" x="443" y="646" width="166" height="64" rx="8"/><text class="se-caption" x="455" y="683">Guess</text>
<path class="se-accent" d="M610 678h10m-4 -4 4 4 -4 4"/><rect class="se-process" x="620" y="646" width="166" height="64" rx="8"/><text class="se-caption" x="632" y="683">Test</text>
<path class="se-accent" d="M787 678h10m-4 -4 4 4 -4 4"/><rect class="se-process" x="797" y="646" width="166" height="64" rx="8"/><text class="se-caption" x="809" y="683">Examine result</text>
<path class="se-return" d="M880 710v18q0 18 -18 18H544q-14 0 -14 -14v-22"/><path class="se-accent" d="M525 717l5 -7 5 7"/><text class="se-copy " x="89" y="797"><tspan x="89">An observation describes what you notice: the clock hands have not moved. An</tspan><tspan x="89" dy="31">explanation suggests a reason: the cell may be used up. Keeping these separate helps</tspan><tspan x="89" dy="31">you test your idea honestly.</tspan></text>
<text class="se-copy " x="89" y="904"><tspan x="89">For a fair comparison, change one thing while keeping other conditions similar. If</tspan><tspan x="89" dy="31">you replace the cell and free the hands together, you will not know which change</tspan><tspan x="89" dy="31">mattered. Repeating a check can help you spot a result that happened only by chance.</tspan></text>
<rect class="se-activity-panel" x="89" y="1006" width="874" height="211" rx="20"/><rect class="se-activity-tab" x="89" y="992" width="308" height="40" rx="12"/><text class="se-activity-tab-text" x="105" y="1020">Activity 1.1 · Think and Write</text>
<g aria-label="Activity steps"><text class="se-activity-step" x="126" y="1074" text-anchor="end">1.</text><text class="se-copy " x="146" y="1074"><tspan x="146">Write about a problem you worked out for yourself recently. It does not have</tspan><tspan x="146" dy="31">to be a science problem.</tspan></text>
<text class="se-activity-step" x="126" y="1148" text-anchor="end">2.</text><text class="se-copy " x="146" y="1148"><tspan x="146">List the steps you took, in order.</tspan></text>
<text class="se-activity-step" x="126" y="1191" text-anchor="end">3.</text><text class="se-copy " x="146" y="1191"><tspan x="146">Was there a point where you had to change your first guess?</tspan></text>
</g>
