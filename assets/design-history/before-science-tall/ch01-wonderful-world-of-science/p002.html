<section class="page page--food page--science-editorial" data-folio="2" data-reference-page="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1369" aria-label="The Wonderful World of Science, page 2"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M31 63Q34 30 60 7"/><path class="se-botanical-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 1</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">The Wonderful World of Science</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header -->
<text class="se-heading" x="89" y="124">Science Is Not Kept in a Building</text>
<text class="se-copy " x="89" y="166"><tspan x="89">Science does not live in laboratories. Laboratories are useful, but science is wherever</tspan><tspan x="89" dy="31">something is happening.</tspan></text>
<svg class="science-illustration" x="809" y="215" width="154" height="156" viewBox="748 95 290 292" preserveAspectRatio="xMidYMid meet" overflow="hidden"><defs><clipPath id="se-art-clip-2"><rect x="748" y="95" width="290" height="292"/></clipPath></defs><image clip-path="url(#se-art-clip-2)" href="../../figures/class-6/science/ch01-p002-reference.png" x="0" y="0" width="1052" height="1494"><title>A dosa cooking in a pan.</title></image></svg>
<text class="se-copy " x="89" y="238"><tspan x="89">It is in the kitchen, where heat turns a soft batter into a firm, holey</tspan><tspan x="89" dy="31">dosa. It is on the cricket field, where a ball bends in the air because</tspan><tspan x="89" dy="31">of the way it was spun. It is in the soil under a mango tree, where</tspan><tspan x="89" dy="31">organisms too small to see are breaking down fallen leaves. It is</tspan><tspan x="89" dy="31">inside your own body, where your heart is beating right now without</tspan><tspan x="89" dy="31">being told to.</tspan></text>
<text class="se-heading" x="89" y="439">An Unfinished Map</text>
<text class="se-copy " x="89" y="481"><tspan x="89">Here is something surprising: science is not finished.</tspan></text>
<svg class="science-illustration" x="809" y="499" width="154" height="156" viewBox="715 474 326 307" preserveAspectRatio="xMidYMid meet" overflow="hidden"><defs><clipPath id="se-art-clip-3"><polygon points="810,474 1041,474 1041,781 950,781 715,720 715,705"/></clipPath></defs><image clip-path="url(#se-art-clip-3)" href="../../figures/class-6/science/ch01-p002-reference.png" x="0" y="0" width="1052" height="1494"><title>An unfinished map and pencil.</title></image></svg>
<text class="se-copy " x="89" y="522"><tspan x="89">Think of what we know as a map of a huge, mostly unexplored land.</tspan><tspan x="89" dy="31">Some regions are surveyed in fine detail. Others are sketched</tspan><tspan x="89" dy="31">roughly. Some are still blank. And every time explorers map a new</tspan><tspan x="89" dy="31">region, its edges open onto territory nobody knew existed. The map</tspan><tspan x="89" dy="31">does not shrink the unknown — it reveals more of it.</tspan></text>
<text class="se-copy " x="89" y="688"><tspan x="89">Sometimes the mapmakers get it wrong. For centuries people were certain the Sun</tspan><tspan x="89" dy="31">travelled around the Earth, because that is exactly what it looks like. Careful</tspan><tspan x="89" dy="31">observation showed otherwise, and the map had to be redrawn. That correction was</tspan><tspan x="89" dy="31">not a failure of science. It was science working as it should.</tspan></text>
<text class="se-heading" x="89" y="827">The Most Important Tool</text>
<text class="se-copy " x="89" y="869"><tspan x="89">You will use many instruments in this book — thermometers, magnets, lenses,</tspan><tspan x="89" dy="31">balances. But the tool that matters most is not one you can hold. It is <tspan class="se-bold">curiosity</tspan>.</tspan></text>
<svg class="science-illustration" x="809" y="918" width="154" height="156" viewBox="757 917 278 289" preserveAspectRatio="xMidYMid meet" overflow="hidden"><defs><clipPath id="se-art-clip-4"><rect x="757" y="917" width="278" height="289"/></clipPath></defs><image clip-path="url(#se-art-clip-4)" href="../../figures/class-6/science/ch01-p002-reference.png" x="0" y="0" width="1052" height="1494"><title>An open flower and a closed bud.</title></image></svg>
<text class="se-copy " x="89" y="941"><tspan x="89">Curiosity is what makes you look up at a night sky and wonder what</tspan><tspan x="89" dy="31">the stars actually are, and how far away. It is what makes you notice</tspan><tspan x="89" dy="31">that a flower on your balcony is shut at dawn and open by</tspan><tspan x="89" dy="31">mid-morning, and then wonder how it knows.</tspan></text>
<rect class="se-prompt" x="89" y="1084" width="874" height="164"/><text class="se-copy " x="113" y="1125"><tspan x="113"><tspan class="se-bold">Why</tspan> <tspan class="se-bold">might</tspan> <tspan class="se-bold">this</tspan> <tspan class="se-bold">happen?</tspan> A flower has no eyes and no clock. What could it be</tspan><tspan x="113" dy="31">responding to? You do not need the right answer yet — only a reasonable guess.</tspan><tspan x="113" dy="31">That guess is called a <tspan class="se-italic">prediction</tspan>, and making one before you know the answer is</tspan><tspan x="113" dy="31">a genuinely scientific act.</tspan></text>
