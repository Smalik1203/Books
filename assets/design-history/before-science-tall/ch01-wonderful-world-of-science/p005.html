<text class="se-heading" x="89" y="124">1.3 Working It Out Yourself</text>
<text class="se-copy " x="89" y="171"><tspan x="89">You already do science. You have simply never called it that.</tspan></text>
<text class="se-copy " x="89" y="216"><tspan x="89">Suppose the clock on your wall has stopped. Both hands are frozen at ten past four.</tspan></text>
<text class="se-copy " x="89" y="261"><tspan x="89">The first thing you do is ask a question, even if only in your head: <tspan class="se-italic">why</tspan> <tspan class="se-italic">has</tspan> <tspan class="se-italic">it</tspan> <tspan class="se-italic">stopped?</tspan></tspan></text>
<svg class="science-illustration" x="89" y="283" width="874" height="235" viewBox="80 1045 925 350" preserveAspectRatio="xMidYMid meet" overflow="hidden"><defs><clipPath id="se-art-clip-9"><rect x="80" y="1045" width="925" height="350"/></clipPath></defs><image clip-path="url(#se-art-clip-9)" href="../../figures/class-6/science/ch01-p005-reference.png" x="0" y="0" width="1052" height="1495"><title>Clock hands touching and a replacement cell.</title></image><rect class="food-white" x="603" y="1087" width="147" height="28"/><rect class="food-white" x="831" y="1090" width="47" height="28"/><text class="se-caption se-bold" x="608" y="1109">Hands touching</text><text class="se-caption se-bold" x="837" y="1112">Cell</text></svg>
<text class="se-copy " x="89" y="563"><tspan x="89">Then, almost without noticing, you make a guess. The cell inside must be finished.</tspan></text>
<text class="se-copy " x="89" y="608"><tspan x="89">Making a guess is the easy part. What matters is what you do next. You take the clock</tspan><tspan x="89" dy="31">down, open the back, and fit a new cell.</tspan></text>
<text class="se-copy " x="89" y="684"><tspan x="89">If the hands begin to move, your guess was right and the job is done.</tspan></text>
<text class="se-copy " x="89" y="729"><tspan x="89">But suppose they do not move.</tspan></text>
<text class="se-copy " x="89" y="774"><tspan x="89">Now stop and notice something. The clock is still stopped, so it feels as though</tspan><tspan x="89" dy="31">nothing has been achieved. That is not true. You have learnt that the problem is <tspan class="se-italic">not</tspan></tspan><tspan x="89" dy="31">the cell — and a minute ago you did not know that. A test that proves you wrong still</tspan><tspan x="89" dy="31">tells you something real.</tspan></text>
<text class="se-copy " x="89" y="912"><tspan x="89">So you make a second guess. Perhaps the cell is fine but is not pressing properly</tspan><tspan x="89" dy="31">against the metal contacts. You push it in firmly and give it a moment. Still nothing.</tspan></text>
<text class="se-copy " x="89" y="988"><tspan x="89">A third guess, then: something inside is stuck. You look more closely and find the</tspan><tspan x="89" dy="31">thin second hand has caught against the minute hand and cannot pass it.</tspan></text>
<text class="se-copy " x="89" y="1064"><tspan x="89">A useful test narrows the possibilities. Even a new cell needs to be fitted correctly</tspan><tspan x="89" dy="31">and make good contact. Check those conditions before ruling it out. Keep track of</tspan><tspan x="89" dy="31">what each test actually shows.</tspan></text>
<text class="se-copy se-takeaway" x="89" y="1171"><tspan x="89">Question. Guess. Test. Look honestly at what happened. Guess again if you must.</tspan></text>
<text class="se-copy " x="89" y="1216"><tspan x="89">Nobody sat you down and taught you that sequence. Yet it is very close to what a</tspan><tspan x="89" dy="31">scientist does when facing something no one has ever explained.</tspan></text>
