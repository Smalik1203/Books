<section class="page page--food page--science-editorial" data-folio="7" data-reference-page="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1369" aria-label="The Wonderful World of Science, page 7"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M31 63Q34 30 60 7"/><path class="se-botanical-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 1</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">The Wonderful World of Science</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header -->
<text class="se-heading" x="89" y="114">Everyone Does This</text>
<text class="se-copy " x="89" y="161"><tspan x="89">Scientists follow the scientific method for a living. But nobody owns it, and it is used</tspan><tspan x="89" dy="31">every day by people who would never call themselves scientists.</tspan></text>
<svg class="science-illustration" x="777" y="214" width="186" height="133" viewBox="0 0 680 724" preserveAspectRatio="xMidYMid meet" overflow="hidden"><defs><clipPath id="se-art-clip-10"><rect x="0" y="0" width="680" height="724"/></clipPath></defs><image clip-path="url(#se-art-clip-10)" href="../../figures/class-6/science/ch01-p007-everyday-science.png" x="0" y="0" width="2172" height="724"><title>Cook inspecting batter</title></image></svg>
<text class="se-copy " x="89" y="237"><tspan x="89">A cook lifts the lid off the idli batter in the morning and finds it</tspan><tspan x="89" dy="31">flat instead of risen. She asks why. Was the kitchen too cold</tspan><tspan x="89" dy="31">overnight? Was the batter ground too thin? She will not solve it</tspan><tspan x="89" dy="31">by worrying — she will change one thing tomorrow and watch</tspan><tspan x="89" dy="31">what happens.</tspan></text>
<svg class="science-illustration" x="777" y="383" width="186" height="133" viewBox="690 0 758 724" preserveAspectRatio="xMidYMid meet" overflow="hidden"><defs><clipPath id="se-art-clip-11"><rect x="690" y="0" width="758" height="724"/></clipPath></defs><image clip-path="url(#se-art-clip-11)" href="../../figures/class-6/science/ch01-p007-everyday-science.png" x="0" y="0" width="2172" height="724"><title>Tailor checking a needle</title></image></svg>
<text class="se-copy " x="89" y="406"><tspan x="89">A tailor's machine starts skipping stitches. He does not replace</tspan><tspan x="89" dy="31">the whole machine. He checks the needle first, then the thread</tspan><tspan x="89" dy="31">tension, then the bobbin — one at a time, because changing</tspan><tspan x="89" dy="31">everything at once would tell him nothing.</tspan></text>
<svg class="science-illustration" x="777" y="529" width="186" height="133" viewBox="1448 0 724 724" preserveAspectRatio="xMidYMid meet" overflow="hidden"><defs><clipPath id="se-art-clip-12"><rect x="1448" y="0" width="724" height="724"/></clipPath></defs><image clip-path="url(#se-art-clip-12)" href="../../figures/class-6/science/ch01-p007-everyday-science.png" x="0" y="0" width="2172" height="724"><title>Electrician checking a disconnected fitting</title></image></svg>
<text class="se-copy " x="89" y="552"><tspan x="89">An electrician is called about a tubelight that flickers for a long</tspan><tspan x="89" dy="31">time before it steadies. Is it the tube, the starter, or the wiring?</tspan><tspan x="89" dy="31">Each of those can be tested separately.</tspan></text>
<text class="se-copy " x="89" y="698"><tspan x="89">None of them are in a laboratory. All of them are doing exactly what step three and</tspan><tspan x="89" dy="31">step four describe: guess, then test — and crucially, test <tspan class="se-italic">one</tspan> <tspan class="se-italic">thing</tspan> <tspan class="se-italic">at</tspan> <tspan class="se-italic">a</tspan> <tspan class="se-italic">time</tspan>, so that the</tspan><tspan x="89" dy="31">result actually means something.</tspan></text>
<text class="se-copy " x="89" y="805"><tspan x="89">A useful record is specific. Describe which part of a puddle’s edge moved and when.</tspan><tspan x="89" dy="31">A sketch can preserve details that memory loses. Keep what you observed separate</tspan><tspan x="89" dy="31">from your explanation of why it happened.</tspan></text>
<rect class="se-activity-panel" x="89" y="907" width="874" height="289" rx="20"/><rect class="se-activity-tab" x="89" y="893" width="338" height="40" rx="12"/><text class="se-activity-tab-text" x="105" y="921">Activity 1.2 · Watch and Record</text>
<text class="se-copy " x="113" y="975"><tspan x="113">Choose one thing near your home that changes over time — a plant on a</tspan><tspan x="113" dy="31">windowsill, a puddle after rain, ants around a spill, the shadow of a pole.</tspan></text>
<g aria-label="Activity steps"><text class="se-activity-step" x="126" y="1053" text-anchor="end">1.</text><text class="se-copy " x="146" y="1053"><tspan x="146">Watch it for five minutes without doing anything to it.</tspan></text>
<text class="se-activity-step" x="126" y="1096" text-anchor="end">2.</text><text class="se-copy " x="146" y="1096"><tspan x="146">Write down three things you actually saw. Not what you think should happen</tspan><tspan x="146" dy="31">— what happened.</tspan></text>
<text class="se-activity-step" x="126" y="1170" text-anchor="end">3.</text><text class="se-copy " x="146" y="1170"><tspan x="146">Write one question your observation raised.</tspan></text>
</g>
