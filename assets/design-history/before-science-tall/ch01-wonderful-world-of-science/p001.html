<text class="se-heading" x="89" y="693">1.1 What Is Science?</text>
<text class="se-copy " x="89" y="740"><tspan x="89">Look around you right now. Something is happening everywhere you turn.</tspan></text>
<text class="se-copy " x="89" y="785"><tspan x="89">A fan is spinning. Sunlight is falling through a window and landing in a bright patch</tspan><tspan x="89" dy="31">on the floor. Somewhere nearby, water is boiling, or a bird is calling, or dust is</tspan><tspan x="89" dy="31">drifting through a beam of light. None of this is unusual. All of it is worth a second</tspan><tspan x="89" dy="31">look.</tspan></text>
<text class="se-copy " x="89" y="923"><tspan x="89">You have been noticing things like this your whole life — why the moon seems to</tspan><tspan x="89" dy="31">follow the car, why ice feels wet, why your shadow stretches long in the evening.</tspan><tspan x="89" dy="31">Those questions were not childish. They were the beginning of something.</tspan></text>
<text class="se-copy " x="89" y="1030"><tspan x="89">Now you are ready to go further.</tspan></text>
<text class="se-copy " x="89" y="1075"><tspan x="89">An ordinary event can become a scientific question when you look closely.</tspan></text>
<rect class="se-prompt" x="89" y="1097" width="874" height="133"/><text class="se-copy " x="113" y="1138"><tspan x="113">Science is not a pile of facts to memorise. Science is a way of working. It means</tspan><tspan x="113" dy="31">observing carefully, asking sharp questions, testing what you think you know,</tspan><tspan x="113" dy="31">and being willing to change your mind when the evidence says you should.</tspan></text>
