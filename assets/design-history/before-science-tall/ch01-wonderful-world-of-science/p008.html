<text class="se-heading" x="89" y="124">1.4 Curiosity, Company and a Long Road</text>
<text class="se-copy " x="89" y="171"><tspan x="89">Everything in this chapter rests on one habit, and it is not a difficult one. Notice</tspan><tspan x="89" dy="31">things.</tspan></text>
<text class="se-copy " x="89" y="247"><tspan x="89">Noticing sounds too simple to matter. It is not. Most people walk past a hundred</tspan><tspan x="89" dy="31">small oddities a day without registering a single one. The person who stops and says</tspan><tspan x="89" dy="31"><tspan class="se-italic">hold</tspan> <tspan class="se-italic">on,</tspan> <tspan class="se-italic">that's</tspan> <tspan class="se-italic">strange</tspan> has done the hardest part already. Everything else — the</tspan><tspan x="89" dy="31">questions, the guesses, the tests — follows from that pause.</tspan></text>
<text class="se-copy " x="89" y="385"><tspan x="89">And you do not have to do any of it alone. Science has a reputation for lonely</tspan><tspan x="89" dy="31">geniuses, and it is mostly wrong. Discoveries today come from teams, often spread</tspan><tspan x="89" dy="31">across many countries, arguing with one another and checking each other's work.</tspan><tspan x="89" dy="31">Being told you are wrong by someone who has looked carefully at your evidence is</tspan><tspan x="89" dy="31">not an insult. It is one of the most useful things that can happen to you.</tspan></text>
<text class="se-copy " x="89" y="554"><tspan x="89">So when you are stuck, ask someone. Compare what you saw with what your friend</tspan><tspan x="89" dy="31">saw. If you disagree about what happened, that disagreement is worth more than</tspan><tspan x="89" dy="31">either of your answers.</tspan></text>
<text class="se-copy " x="89" y="661"><tspan x="89">One last thing, and it is important. You will not find the answers to all your questions</tspan><tspan x="89" dy="31">this year. Some of what you wonder about in Grade 6 you will only understand in</tspan><tspan x="89" dy="31">Grade 9, or later, or possibly never — because nobody has worked it out yet.</tspan></text>
<text class="se-copy " x="89" y="768"><tspan x="89">That is not a warning. It is the best part.</tspan></text>
<text class="se-copy " x="89" y="813"><tspan x="89">Describe an event separately from a friend, then compare your accounts. Did you</tspan><tspan x="89" dy="31">notice the same details? Which statements describe what you saw, and which suggest</tspan><tspan x="89" dy="31">a reason? Differences give you something to check together. Finding an answer may</tspan><tspan x="89" dy="31">need longer observation, a better comparison, or a more precise question.</tspan></text>
<rect class="se-activity-panel" x="89" y="946" width="874" height="199" rx="20"/><rect class="se-activity-tab" x="89" y="932" width="312" height="40" rx="12"/><text class="se-activity-tab-text" x="105" y="960">Activity 1.3 · Think and Write</text>
<g aria-label="Activity steps"><text class="se-activity-step" x="126" y="1014" text-anchor="end">1.</text><text class="se-copy " x="146" y="1014"><tspan x="146">Write down one "Why?" question about something you have noticed but</tspan><tspan x="146" dy="31">never had explained.</tspan></text>
<text class="se-activity-step" x="126" y="1088" text-anchor="end">2.</text><text class="se-copy " x="146" y="1088"><tspan x="146">How might you begin to find the answer? Who could you ask, and what could</tspan><tspan x="146" dy="31">you test?</tspan></text>
</g><text class="se-copy se-takeaway" x="89" y="1182"><tspan x="89">Science begins with noticing. It continues with asking. And it never quite ends.</tspan></text>
