<text class="se-heading" x="89" y="124">1.2 What This Book Will Ask You</text>
<text class="se-copy " x="89" y="171"><tspan x="89">Begin with the Earth — as far as we know, the only place in the universe where</tspan><tspan x="89" dy="31">anything is alive.</tspan></text>
<svg class="science-illustration" x="89" y="224" width="874" height="170" viewBox="30 1080 994 270" preserveAspectRatio="xMidYMid meet" overflow="hidden"><defs><clipPath id="se-art-clip-8"><rect x="30" y="1080" width="994" height="270"/></clipPath></defs><image clip-path="url(#se-art-clip-8)" href="../../figures/class-6/science/ch01-p003-reference.png" x="0" y="0" width="1052" height="1495"><title>A seedling, food, water, everyday materials and the Moon.</title></image></svg>
<text class="se-copy " x="89" y="445"><tspan x="89">A seed pushes a pale shoot up through dark soil. A caterpillar seals itself away and</tspan><tspan x="89" dy="31">comes out with wings. A calf that could barely stand in the morning is running</tspan><tspan x="89" dy="31">across the field by the end of the month. Growing is so ordinary that we stop</tspan><tspan x="89" dy="31">noticing it happening. But how does a plant build an entire body out of soil, water</tspan><tspan x="89" dy="31">and air?</tspan></text>
<text class="se-copy " x="89" y="614"><tspan x="89">Everything that grows has to eat. In a country this large, that alone is a huge subject</tspan><tspan x="89" dy="31">— pongal in one state, litti in another, a fish curry along the coast, a plate of rajma</tspan><tspan x="89" dy="31">somewhere north. What are these dishes actually made of? And how could you find</tspan><tspan x="89" dy="31">out for yourself, instead of being told?</tspan></text>
<text class="se-copy " x="89" y="752"><tspan x="89">Then there is water. You have jumped into a puddle after rain. But where was that</tspan><tspan x="89" dy="31">water an hour before it fell on you, and how did it get up there? Cool it and it turns to</tspan><tspan x="89" dy="31">ice. Heat it and it leaves as steam. What is going on?</tspan></text>
<text class="se-copy " x="89" y="859"><tspan x="89">And how hot is hot? When someone in your house has a fever, nobody wants a guess.</tspan><tspan x="89" dy="31">They want a number.</tspan></text>
<text class="se-copy " x="89" y="935"><tspan x="89">Now look at what things are made of — paper, the metal of a key, a plastic scale, a</tspan><tspan x="89" dy="31">rubber eraser, the magnet holding a cupboard shut, the cloth of your shirt. Each one</tspan><tspan x="89" dy="31">was chosen for a reason. Could a key be made of rubber? Why not?</tspan></text>
<text class="se-copy " x="89" y="1042"><tspan x="89">And when the Earth runs out of questions, there is the sky above it.</tspan></text>
<text class="se-copy " x="89" y="1087"><tspan x="89">These questions connect different parts of science. Following water leads from a</tspan><tspan x="89" dy="31">puddle to the weather. Studying a plant leads to light, air and food. Comparing</tspan><tspan x="89" dy="31">materials leads to the design of useful objects. Look for these connections as you</tspan><tspan x="89" dy="31">read. Ask what changes something, and what evidence could help explain it.</tspan></text>
<text class="se-copy se-takeaway" x="89" y="1225"><tspan x="89">Every one of these has an answer. Not all of them are in this book.</tspan></text>
