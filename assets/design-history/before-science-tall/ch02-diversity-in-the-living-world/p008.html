<text class="se-heading" x="89" y="124"><tspan x="89">2.2.1 Grouping Plants</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">Look at Table 2.1 again. The features you wrote there — stem, leaves, flowers — are</tspan><tspan x="89" dy="31">the same features we can use to sort plants.</tspan></text>
<text class="se-copy" x="89" y="250"><tspan x="89">Begin with the stem. It is the easiest one to test with your hands.</tspan></text>
<rect class="se-activity-panel" x="89" y="286" width="874" height="490" rx="20"/><rect class="se-activity-tab" x="89" y="272" width="367" height="40" rx="12"/><text class="se-activity-tab-text" x="105" y="300" text-anchor="start">Activity 2.4 · Tall, Short, Hard, Soft</text><text class="se-activity-step" x="128" y="348" text-anchor="end">1.</text><text class="se-copy" x="146" y="348"><tspan x="146">Go out to the same place as before. Choose six plants of clearly different</tspan><tspan x="146" dy="31">sizes.</tspan></text><text class="se-activity-step" x="128" y="422" text-anchor="end">2.</text><text class="se-copy" x="146" y="422"><tspan x="146">Stand next to each one. Is it shorter than you, about your height, or taller?</tspan></text><text class="se-activity-step" x="128" y="465" text-anchor="end">3.</text><text class="se-copy" x="146" y="465"><tspan x="146">Look at the stem near the ground. Is it green or brown?</tspan></text><text class="se-activity-step" x="128" y="508" text-anchor="end">4.</text><text class="se-copy" x="146" y="508"><tspan x="146">Bend the stem very gently with one finger. Does it bend, or is it stiff? <tspan class="se-bold">Stop</tspan> <tspan class="se-bold">as</tspan></tspan><tspan x="146" dy="31"><tspan class="se-bold">soon</tspan> <tspan class="se-bold">as</tspan> <tspan class="se-bold">you</tspan> <tspan class="se-bold">feel</tspan> <tspan class="se-bold">it</tspan> <tspan class="se-bold">resist.</tspan> <tspan class="se-bold">A</tspan> <tspan class="se-bold">broken</tspan> <tspan class="se-bold">stem</tspan> <tspan class="se-bold">can</tspan> <tspan class="se-bold">kill</tspan> <tspan class="se-bold">the</tspan> <tspan class="se-bold">plant.</tspan></tspan></text><text class="se-activity-step" x="128" y="582" text-anchor="end">5.</text><text class="se-copy" x="146" y="582"><tspan x="146">See where the branches start. Near the ground, or higher up?</tspan></text><text class="se-activity-step" x="128" y="625" text-anchor="end">6.</text><text class="se-copy" x="146" y="625"><tspan x="146">Use the headings in Table 2.3 to make your own notebook table. Leave the</tspan><tspan x="146" dy="31">last column empty for now.</tspan></text><text class="se-copy" x="113" y="699"><tspan x="113"><tspan class="se-bold">Predict:</tspan> Before you fill the last column, guess which plants will end up in the</tspan><tspan x="113" dy="31">same group.</tspan></text>
<text class="se-copy se-note" x="89" y="819"><tspan x="89">Copy the headings into your notebook and add your own observations. The rows</tspan><tspan x="89" dy="31">below are examples, not a complete record.</tspan></text>
<rect class="se-table-band" x="89" y="868" width="874" height="40" rx="3"/><rect class="se-table-number" x="89" y="868" width="149" height="40" rx="3"/><text class="se-caption se-table-number-text" x="109" y="895">Table 2.3</text><text class="se-caption se-bold" x="260" y="895">Grouping plants by height and stem</text><rect class="se-table-head" x="89" y="914" width="874" height="97"/><line class="se-rule" x1="89" x2="963" y1="1011" y2="1011"/><text class="se-copy se-table-copy se-bold" x="101" y="941.4"><tspan x="101">Plant</tspan></text><text class="se-copy se-table-copy se-bold" x="246.66666666666666" y="941.4"><tspan x="246.66666666666666">Height</tspan><tspan x="246.66666666666666" dy="25">compared with</tspan><tspan x="246.66666666666666" dy="25">you</tspan></text><text class="se-copy se-table-copy se-bold" x="392.3333333333333" y="941.4"><tspan x="392.3333333333333">Stem colour</tspan></text><text class="se-copy se-table-copy se-bold" x="538" y="941.4"><tspan x="538">Stem texture</tspan></text><text class="se-copy se-table-copy se-bold" x="683.6666666666666" y="941.4"><tspan x="683.6666666666666">Branching</tspan></text><text class="se-copy se-table-copy se-bold" x="829.3333333333333" y="941.4"><tspan x="829.3333333333333">Group</tspan></text><line class="se-rule" x1="89" x2="963" y1="1058" y2="1058"/><text class="se-copy se-table-copy" x="101" y="1038.4"><tspan x="101">Mango</tspan></text><text class="se-copy se-table-copy" x="246.66666666666666" y="1038.4"><tspan x="246.66666666666666">Taller</tspan></text><text class="se-copy se-table-copy" x="392.3333333333333" y="1038.4"><tspan x="392.3333333333333">Brown</tspan></text><text class="se-copy se-table-copy" x="538" y="1038.4"><tspan x="538">Hard</tspan></text><text class="se-copy se-table-copy" x="683.6666666666666" y="1038.4"><tspan x="683.6666666666666">High</tspan></text><text class="se-copy se-table-copy" x="829.3333333333333" y="1038.4"><tspan x="829.3333333333333">Tree</tspan></text><line class="se-rule" x1="89" x2="963" y1="1130" y2="1130"/><text class="se-copy se-table-copy" x="101" y="1085.4"><tspan x="101">Rose</tspan></text><text class="se-copy se-table-copy" x="246.66666666666666" y="1085.4"><tspan x="246.66666666666666">About the</tspan><tspan x="246.66666666666666" dy="25">same</tspan></text><text class="se-copy se-table-copy" x="392.3333333333333" y="1085.4"><tspan x="392.3333333333333">Brown</tspan></text><text class="se-copy se-table-copy" x="538" y="1085.4"><tspan x="538">Hard</tspan></text><text class="se-copy se-table-copy" x="683.6666666666666" y="1085.4"><tspan x="683.6666666666666">Low</tspan></text><text class="se-copy se-table-copy" x="829.3333333333333" y="1085.4"><tspan x="829.3333333333333">Shrub</tspan></text><line class="se-rule" x1="89" x2="963" y1="1177" y2="1177"/><text class="se-copy se-table-copy" x="101" y="1157.4"><tspan x="101">Tomato</tspan></text><text class="se-copy se-table-copy" x="246.66666666666666" y="1157.4"><tspan x="246.66666666666666">Shorter</tspan></text><text class="se-copy se-table-copy" x="392.3333333333333" y="1157.4"><tspan x="392.3333333333333">Green</tspan></text><text class="se-copy se-table-copy" x="538" y="1157.4"><tspan x="538">Soft</tspan></text><text class="se-copy se-table-copy" x="683.6666666666666" y="1157.4"><tspan x="683.6666666666666">Low</tspan></text><text class="se-copy se-table-copy" x="829.3333333333333" y="1157.4"><tspan x="829.3333333333333">Herb</tspan></text>
