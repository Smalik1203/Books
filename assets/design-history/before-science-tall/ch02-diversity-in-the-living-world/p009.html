<text class="se-heading" x="89" y="124"><tspan x="89">Herbs, Shrubs and Trees</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">Read down your table. Three groups appear on their own.</tspan></text>
<text class="se-copy" x="89" y="219"><tspan x="89">Some plants are small. They have soft green stems that bend easily. These are called</tspan><tspan x="89" dy="31"><tspan class="se-bold">herbs</tspan>. A tomato plant is a herb. So are mint and coriander, and most small plants in</tspan><tspan x="89" dy="31">an open field.</tspan></text>
<text class="se-copy" x="89" y="326"><tspan x="89">Some plants are taller. They have several hard brown stems. The branches start close</tspan><tspan x="89" dy="31">to the ground. These stems are not as thick or as tall as a tree's. Such plants are</tspan><tspan x="89" dy="31">called <tspan class="se-bold">shrubs</tspan>. A rose plant is a shrub.</tspan></text>
<text class="se-copy" x="89" y="433"><tspan x="89">Some plants grow very tall. They have one thick, hard, brown stem. The branches</tspan><tspan x="89" dy="31">start well above the ground. These are <tspan class="se-bold">trees</tspan>. A mango is a tree.</tspan></text>
<text class="se-copy" x="89" y="509"><tspan x="89">Now think about what the stem has to do. A tomato plant holds up a few leaves and</tspan><tspan x="89" dy="31">some fruit. A mango tree holds up a heavy top of branches, ten metres above the</tspan><tspan x="89" dy="31">ground, for many years, through wind and rain. A soft green stem could never do that</tspan><tspan x="89" dy="31">job.</tspan></text>
<image class="science-illustration" href="../../figures/class-6/science/ch02/forms.png" x="89" y="624" width="874" height="437" preserveAspectRatio="xMidYMid meet"><title>Mango · tree                 Rose · shrub                 Tomato · herb</title></image><text class="se-caption" x="307.5" y="1089" text-anchor="middle">Mango · tree</text><text class="se-caption" x="639.62" y="1089" text-anchor="middle">Rose · shrub</text><text class="se-caption" x="875.6" y="1089" text-anchor="middle">Tomato · herb</text>
<text class="se-copy" x="89" y="1133"><tspan x="89">Height alone is not enough. Compare a young mango plant with a mature tomato</tspan><tspan x="89" dy="31">plant: their present heights may be similar, but their stems and later growth differ.</tspan></text>
