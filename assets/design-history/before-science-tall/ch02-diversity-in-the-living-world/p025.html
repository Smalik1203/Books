<text class="se-heading" x="89" y="124"><tspan x="89">Keywords</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">Adaptation · Amphibian · Aquatic · Biodiversity · Climber · Cotyledon · Creeper ·</tspan><tspan x="89" dy="31">Dicot · Fibrous root · Grouping · Habitat · Herb · Monocot · Parallel venation ·</tspan><tspan x="89" dy="31">Reticulate venation · Sacred grove · Shrub · Taproot · Terrestrial · Tree · Venation</tspan></text>
<text class="se-heading" x="89" y="286"><tspan x="89">Summary</tspan></text>
<text class="se-copy" x="89" y="336"><tspan x="89">• The variety of living things found in a region is called its biodiversity. Even an</tspan><tspan x="89" dy="31">ordinary place has much more of it than a quick look suggests.</tspan></text>
<text class="se-copy" x="89" y="410"><tspan x="89">• Living things in a place depend on each other for food, shelter and other needs.</tspan></text>
<text class="se-copy" x="89" y="453"><tspan x="89">• Grouping means arranging things by the features they share. There is no one</tspan><tspan x="89" dy="31">correct grouping. The useful one depends on the question being asked.</tspan></text>
<text class="se-copy" x="89" y="527"><tspan x="89">• Plants can be grouped by stem and height into herbs, shrubs and trees. Plants with</tspan><tspan x="89" dy="31">weak stems are climbers or creepers.</tspan></text>
<text class="se-copy" x="89" y="601"><tspan x="89">• The pattern of veins in a leaf is called venation. Two common patterns are</tspan><tspan x="89" dy="31">reticulate and parallel.</tspan></text>
<text class="se-copy" x="89" y="675"><tspan x="89">• Roots are of two kinds. A taproot has one main root. Fibrous roots form a</tspan><tspan x="89" dy="31">spreading bunch.</tspan></text>
<text class="se-copy" x="89" y="749"><tspan x="89">• Among flowering plants, dicots have two cotyledons and monocots have one.</tspan></text>
<text class="se-copy" x="89" y="792"><tspan x="89">• These three features go together. Dicots generally have reticulate venation and a</tspan><tspan x="89" dy="31">taproot. Monocots generally have parallel venation and fibrous roots. This is what</tspan><tspan x="89" dy="31">makes the grouping useful — one observation lets you predict others.</tspan></text>
<text class="se-copy" x="89" y="897"><tspan x="89">• Animals can be grouped by how they move and which body parts they use. They</tspan><tspan x="89" dy="31">can also be grouped in many other ways.</tspan></text>
<text class="se-copy" x="89" y="971"><tspan x="89">• Features that make a living thing fit to survive in a particular place are called</tspan><tspan x="89" dy="31">adaptations.</tspan></text>
<text class="se-copy" x="89" y="1045"><tspan x="89">• The place where a living thing lives is its habitat. Habitats are terrestrial or aquatic.</tspan><tspan x="89" dy="31">Many amphibians use both land and water, but not all animals that do so are</tspan><tspan x="89" dy="31">amphibians.</tspan></text>
<text class="se-copy" x="89" y="1150"><tspan x="89">• Damage to habitats causes loss of biodiversity. This is why habitats are protected</tspan><tspan x="89" dy="31">— by governments, and by communities.</tspan></text>
