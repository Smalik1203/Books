<text class="se-copy" x="89" y="119"><tspan x="89">The answer is not in the leaf. It is not in the root. It is in the seed.</tspan></text>
<rect class="se-activity-panel" x="89" y="155" width="874" height="299" rx="20"/><rect class="se-activity-tab" x="89" y="141" width="283" height="40" rx="12"/><text class="se-activity-tab-text" x="105" y="169" text-anchor="start">Activity 2.8 · Open a Seed</text><text class="se-activity-step" x="128" y="217" text-anchor="end">1.</text><text class="se-copy" x="146" y="217"><tspan x="146">Soak a few chana seeds and a few maize seeds in water for two days, until</tspan><tspan x="146" dy="31">they are soft and swollen.</tspan></text><text class="se-activity-step" x="128" y="291" text-anchor="end">2.</text><text class="se-copy" x="146" y="291"><tspan x="146">Peel the thin outer coat off a soaked chana. Now try to split the seed with</tspan><tspan x="146" dy="31">your thumbnail.</tspan></text><text class="se-activity-step" x="128" y="365" text-anchor="end">3.</text><text class="se-copy" x="146" y="365"><tspan x="146">Try to split a soaked maize seed in the same way.</tspan></text><text class="se-copy" x="113" y="408"><tspan x="113"><tspan class="se-bold">Observe:</tspan> Which seed comes apart neatly into two halves? Which one does not?</tspan></text>
<text class="se-heading" x="89" y="502"><tspan x="89">What Is Inside a Seed</tspan></text>
<text class="se-copy" x="89" y="552"><tspan x="89">A soaked chana splits neatly into two equal halves. Each half is called a <tspan class="se-bold">cotyledon</tspan>.</tspan><tspan x="89" dy="31">Look carefully between the two halves. You will see a tiny root and a tiny shoot</tspan><tspan x="89" dy="31">already formed. That is the start of the new plant, with food packed around it.</tspan></text>
<text class="se-copy" x="89" y="659"><tspan x="89">A maize seed does not split like that. It has only one thin cotyledon.</tspan></text>
<text class="se-copy" x="89" y="704"><tspan x="89">This gives us a third way to sort plants. And this one explains the other two.</tspan></text>
<text class="se-copy" x="89" y="749"><tspan x="89">Plants whose seeds have two cotyledons are called <tspan class="se-bold">dicotyledons</tspan>. We say <tspan class="se-bold">dicots</tspan> for</tspan><tspan x="89" dy="31">short. Plants whose seeds have one cotyledon are called <tspan class="se-bold">monocotyledons</tspan>, or</tspan><tspan x="89" dy="31"><tspan class="se-bold">monocots</tspan>.</tspan></text>
