<text class="se-copy" x="89" y="119"><tspan x="89">Camels save water in other ways. They pass very little urine. Their dung is dry</tspan><tspan x="89" dy="31">enough to burn. They can allow their body temperature to rise during the day,</tspan><tspan x="89" dy="31">reducing the water needed for cooling. They do sweat when necessary. So a camel can</tspan><tspan x="89" dy="31">go many days without drinking.</tspan></text>
<text class="se-heading" x="89" y="262"><tspan x="89">Adaptations</tspan></text>
<text class="se-copy" x="89" y="312"><tspan x="89">The cactus stem, the deodar's sloping branches, the camel's padded feet and hump —</tspan><tspan x="89" dy="31">all of these are examples of one idea.</tspan></text>
<text class="se-copy" x="89" y="388"><tspan x="89">Features that make a living thing fit to survive in a particular place are called</tspan><tspan x="89" dy="31"><tspan class="se-bold">adaptations</tspan>.</tspan></text>
<text class="se-copy" x="89" y="464"><tspan x="89">Adaptations are not always about extreme places, and they are not always easy to</tspan><tspan x="89" dy="31">spot. A fish has a smooth body that slips through water easily, and fins to steer and</tspan><tspan x="89" dy="31">push with. A duck has skin joining its toes. That turns each foot into a paddle. A</tspan><tspan x="89" dy="31">pigeon's foot has no such skin, because a pigeon is not a swimmer.</tspan></text>
<text class="se-copy" x="89" y="602"><tspan x="89">Rhododendrons include low shrubs and tall trees in different mountain regions.</tspan><tspan x="89" dy="31">Their features reflect both inherited differences and growing conditions. Even plants</tspan><tspan x="89" dy="31">of the same species may grow differently in a windy, exposed place and in a sheltered</tspan><tspan x="89" dy="31">one. A change in one plant's growth is not the same as an inherited adaptation</tspan><tspan x="89" dy="31">developing over generations.</tspan></text>
<rect class="se-prompt" x="89" y="748" width="874" height="98" rx="10"/><text class="se-copy" x="113" y="787"><tspan x="113"><tspan class="se-bold">What</tspan> <tspan class="se-bold">do</tspan> <tspan class="se-bold">you</tspan> <tspan class="se-bold">predict?</tspan> One plant grows on a windy seashore. The same kind of</tspan><tspan x="113" dy="31">plant grows in a sheltered valley. Which one would you expect to be taller?</tspan></text>
