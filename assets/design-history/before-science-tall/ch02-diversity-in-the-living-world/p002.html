<text class="se-heading" x="89" y="124"><tspan x="89">2.1 The Variety Around Us</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">Most of us walk past living things without really seeing them. We see a tree. But we</tspan><tspan x="89" dy="31">do not see that its leaves are pointed, and the next tree's leaves are round. We hear</tspan><tspan x="89" dy="31">birds. But we do not hear that three different birds are calling.</tspan></text>
<text class="se-copy" x="89" y="281"><tspan x="89">Looking carefully is a skill. Like any skill, it gets better with practice.</tspan></text>
<text class="se-copy" x="89" y="326"><tspan x="89">That is what the first activity is for.</tspan></text>
<rect class="se-activity-panel" x="89" y="362" width="874" height="669" rx="20"/><rect class="se-activity-tab" x="89" y="348" width="278" height="40" rx="12"/><text class="se-activity-tab-text" x="105" y="376" text-anchor="start">Activity 2.1 · Look Closely</text><text class="se-copy" x="113" y="424"><tspan x="113"><tspan class="se-bold">You</tspan> <tspan class="se-bold">will</tspan> <tspan class="se-bold">need:</tspan> a notebook, a pencil, a water bottle.</tspan></text><text class="se-activity-step" x="128" y="467" text-anchor="end">1.</text><text class="se-copy" x="146" y="467"><tspan x="146">With your teacher, spend one period in a park, a garden, a field or any open</tspan><tspan x="146" dy="31">ground near your school.</tspan></text><text class="se-activity-step" x="128" y="541" text-anchor="end">2.</text><text class="se-copy" x="146" y="541"><tspan x="146">Walk slowly. People who are in a hurry find very little.</tspan></text><text class="se-activity-step" x="128" y="584" text-anchor="end">3.</text><text class="se-copy" x="146" y="584"><tspan x="146">Look, and also listen. Close your eyes for thirty seconds. How many different</tspan><tspan x="146" dy="31">sounds can you count?</tspan></text><text class="se-activity-step" x="128" y="658" text-anchor="end">4.</text><text class="se-copy" x="146" y="658"><tspan x="146">Do not pluck leaves or flowers. Do not disturb any animal. You may pick up</tspan><tspan x="146" dy="31">leaves that have already fallen.</tspan></text><text class="se-activity-step" x="128" y="732" text-anchor="end">5.</text><text class="se-copy" x="146" y="732"><tspan x="146">Copy the headings of Tables 2.1 and 2.2 into your notebook. Add a row for</tspan><tspan x="146" dy="31">each plant or animal you observe.</tspan></text><text class="se-copy" x="113" y="806"><tspan x="113"><tspan class="se-bold">Observe:</tspan> Write down what you really see, not what you think you should see. If</tspan><tspan x="113" dy="31">you do not know the name of a plant, describe it instead. For example: &quot;small</tspan><tspan x="113" dy="31">plant, three leaves together, near the water tap&quot;.</tspan></text><text class="se-copy" x="113" y="911"><tspan x="113"><tspan class="se-bold">Think:</tspan> Was it harder to spot the plants or the animals? Why?</tspan></text><text class="se-copy" x="113" y="954"><tspan x="113"><tspan class="se-bold">Safety:</tspan> Stay with your group. Do not touch any animal. Do not put your fingers</tspan><tspan x="113" dy="31">into holes or under stones.</tspan></text>
<text class="se-copy" x="89" y="1074"><tspan x="89">Record the place and date as well as the living thing. A garden after rain may look</tspan><tspan x="89" dy="31">different from the same garden in a dry week. These details help someone else</tspan><tspan x="89" dy="31">understand what you observed.</tspan></text>
