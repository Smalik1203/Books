<rect class="se-prompt" x="89" y="96" width="874" height="98" rx="10"/><text class="se-copy" x="113" y="135"><tspan x="113"><tspan class="se-bold">Can</tspan> <tspan class="se-bold">you</tspan> <tspan class="se-bold">explain</tspan> <tspan class="se-bold">why?</tspan> A banana plant is taller than you and its stem is thick.</tspan><tspan x="113" dy="31">But the stem is soft and green. Which group does it belong to?</tspan></text>
<text class="se-heading" x="89" y="240"><tspan x="89">Plants That Cannot Stand Up</tspan></text>
<text class="se-copy" x="89" y="290"><tspan x="89">Not every plant can hold itself up.</tspan></text>
<text class="se-copy" x="89" y="335"><tspan x="89">Some plants have stems that are too weak to stand. So they climb up something else</tspan><tspan x="89" dy="31">— a wall, a fence, a stick, or another plant. These are called <tspan class="se-bold">climbers</tspan>. A money plant</tspan><tspan x="89" dy="31">is a climber. So is a grape vine.</tspan></text>
<text class="se-copy" x="89" y="442"><tspan x="89">Other plants also have weak stems. But instead of climbing, they spread flat along</tspan><tspan x="89" dy="31">the ground. These are called <tspan class="se-bold">creepers</tspan>. Pumpkin and watermelon plants are creepers.</tspan></text>
<text class="se-copy" x="89" y="518"><tspan x="89">Both kinds have the same problem. A weak stem cannot lift leaves up to the sunlight.</tspan><tspan x="89" dy="31">A climber solves this by using another plant's height. A creeper solves it in a</tspan><tspan x="89" dy="31">different way. It gives up on height and spreads sideways instead.</tspan></text>
<image class="science-illustration" href="../../figures/class-6/science/ch02/climbers.png" x="89" y="602" width="874" height="393" preserveAspectRatio="xMidYMid meet"><title>Climber · grape vine                       Creeper · pumpkin</title></image><text class="se-caption" x="329.5" y="1023" text-anchor="middle">Climber · grape vine</text><text class="se-caption" x="722.5" y="1023" text-anchor="middle">Creeper · pumpkin</text>
