<text class="se-heading" x="89" y="124"><tspan x="89">Know a scientist</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89"><tspan class="se-bold">Janaki</tspan> <tspan class="se-bold">Ammal</tspan> <tspan class="se-bold">(1897–1984)</tspan> was one of the first Indian women to work as a</tspan><tspan x="89" dy="31">professional botanist. She studied sugarcane and worked on making plant varieties</tspan><tspan x="89" dy="31">better. In 1952 she became Officer on Special Duty at the Botanical Survey of India</tspan><tspan x="89" dy="31">and helped reorganise its work. In her eighties she joined the fight to save the forest</tspan><tspan x="89" dy="31">at Silent Valley in Kerala. Her whole life was spent doing the two things this chapter</tspan><tspan x="89" dy="31">is about — looking closely at plants, and finding order in what she saw.</tspan></text>
<text class="se-heading" x="89" y="379"><tspan x="89">2.3 Living Things and Their Surroundings</tspan></text>
<text class="se-copy" x="89" y="429"><tspan x="89">Something in your tables may have struck you already. The living things you wrote</tspan><tspan x="89" dy="31">down are the ones that live <tspan class="se-italic">here</tspan>. A class in Ladakh would fill in a completely</tspan><tspan x="89" dy="31">different table. So would a class in the Sundarbans, or on the coast of Kerala.</tspan></text>
<text class="se-copy" x="89" y="536"><tspan x="89">Why? Why do different places have different living things?</tspan></text>
<rect class="se-activity-panel" x="89" y="572" width="874" height="256" rx="20"/><rect class="se-activity-tab" x="89" y="558" width="357" height="40" rx="12"/><text class="se-activity-tab-text" x="105" y="586" text-anchor="start">Activity 2.10 · Where Does It Live?</text><text class="se-activity-step" x="128" y="634" text-anchor="end">1.</text><text class="se-copy" x="146" y="634"><tspan x="146">Copy Table 2.6 onto the blackboard.</tspan></text><text class="se-activity-step" x="128" y="677" text-anchor="end">2.</text><text class="se-copy" x="146" y="677"><tspan x="146">As a class, fill it with plants and animals you have seen, read about, or heard</tspan><tspan x="146" dy="31">about at home.</tspan></text><text class="se-activity-step" x="128" y="751" text-anchor="end">3.</text><text class="se-copy" x="146" y="751"><tspan x="146">Now look at each column. Ask: what is that place like? Hot or cold? Wet or</tspan><tspan x="146" dy="31">dry? Windy? Is water easy to find there?</tspan></text>
<text class="se-copy se-note" x="89" y="871"><tspan x="89">Copy the headings into your notebook and add your own observations. The rows</tspan><tspan x="89" dy="31">below are examples, not a complete record.</tspan></text>

<text class="se-copy" x="89" y="1097"><tspan x="89">A record becomes more useful when another observer can check it. Include the place,</tspan><tspan x="89" dy="31">date and the feature you used to recognise the animal. If you are unsure of its name,</tspan><tspan x="89" dy="31">say so and add a sketch or description.</tspan></text>
