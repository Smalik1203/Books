<text class="se-heading" x="89" y="124"><tspan x="89">When a Habitat Is Lost</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">Ask your parents, your grandparents, or an older neighbour one simple question.</tspan><tspan x="89" dy="31">Which birds, insects or plants did they see often as children, but rarely see now?</tspan></text>
<text class="se-copy" x="89" y="250"><tspan x="89">Many of them will be able to name several.</tspan></text>
<text class="se-copy" x="89" y="295"><tspan x="89">When a habitat is damaged or destroyed, the living things there lose everything at</tspan><tspan x="89" dy="31">once — their food, their shelter, and the place where they raise their young. They</tspan><tspan x="89" dy="31">usually cannot move somewhere else, because there is often nowhere else that suits</tspan><tspan x="89" dy="31">them. They simply become fewer. Then they are gone. This is how biodiversity is</tspan><tspan x="89" dy="31">lost.</tspan></text>
<text class="se-copy" x="89" y="464"><tspan x="89">Habitat loss has threatened animals such as the Bengal tiger and the Great Indian</tspan><tspan x="89" dy="31">bustard. Project Tiger began in 1973 to protect tigers and their habitats. The cheetah</tspan><tspan x="89" dy="31">was declared extinct in India in 1952; a reintroduction programme began in 2022.</tspan><tspan x="89" dy="31">Protecting suitable habitat is essential to conservation.</tspan></text>
<text class="se-copy" x="89" y="602"><tspan x="89">Governments are not the only ones who protect habitats. <tspan class="se-bold">Sacred</tspan> <tspan class="se-bold">groves</tspan> are patches</tspan><tspan x="89" dy="31">of forest that communities across India have left untouched for many generations.</tspan><tspan x="89" dy="31">Nobody cuts trees there. Nobody hunts. Some groves are tiny and some are large.</tspan><tspan x="89" dy="31">Many hold rare plants that have disappeared from the land all around them.</tspan><tspan x="89" dy="31">Community traditions and agreements protect many groves; some also have legal</tspan><tspan x="89" dy="31">protection. Find out if there is one near you.</tspan></text>
