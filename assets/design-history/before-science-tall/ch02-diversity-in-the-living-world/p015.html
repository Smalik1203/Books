<section class="page page--food page--science-editorial" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1369" aria-label="Diversity in the Living World, page 15"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M31 63Q34 30 60 7"/><path class="se-botanical-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 2</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Diversity in the Living World</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header -->
<rect class="se-activity-panel" x="89" y="110" width="874" height="342" rx="20"/><rect class="se-activity-tab" x="89" y="96" width="329" height="40" rx="12"/><text class="se-activity-tab-text" x="105" y="124" text-anchor="start">Activity 2.7 · Above and Below</text><text class="se-activity-step" x="128" y="172" text-anchor="end">1.</text><text class="se-copy" x="146" y="172"><tspan x="146">Choose five plants you can see fully, roots and all. Young seedlings from a</tspan><tspan x="146" dy="31">nursery tray work best.</tspan></text><text class="se-activity-step" x="128" y="246" text-anchor="end">2.</text><text class="se-copy" x="146" y="246"><tspan x="146">For each plant, look at the leaf first. Write down its venation.</tspan></text><text class="se-activity-step" x="128" y="289" text-anchor="end">3.</text><text class="se-copy" x="146" y="289"><tspan x="146"><tspan class="se-bold">Now,</tspan> <tspan class="se-bold">before</tspan> <tspan class="se-bold">you</tspan> <tspan class="se-bold">look</tspan> <tspan class="se-bold">at</tspan> <tspan class="se-bold">the</tspan> <tspan class="se-bold">roots,</tspan> <tspan class="se-bold">guess</tspan> whether it will have a taproot or</tspan><tspan x="146" dy="31">fibrous roots. Write your guess down.</tspan></text><text class="se-activity-step" x="128" y="363" text-anchor="end">4.</text><text class="se-copy" x="146" y="363"><tspan x="146">Then look at the roots. Write down what you actually find.</tspan></text><text class="se-activity-step" x="128" y="406" text-anchor="end">5.</text><text class="se-copy" x="146" y="406"><tspan x="146">Plant the seedlings back carefully afterwards.</tspan></text>
<text class="se-copy se-note" x="89" y="495"><tspan x="89">Copy the headings into your notebook and add your own observations. The rows</tspan><tspan x="89" dy="31">below are examples, not a complete record.</tspan></text>
<rect class="se-table-band" x="89" y="544" width="874" height="40" rx="3"/><rect class="se-table-number" x="89" y="544" width="149" height="40" rx="3"/><text class="se-caption se-table-number-text" x="109" y="571">Table 2.4</text><text class="se-caption se-bold" x="260" y="571">Leaf venation and root type</text><rect class="se-table-head" x="89" y="590" width="874" height="47"/><line class="se-rule" x1="89" x2="963" y1="637" y2="637"/><text class="se-copy se-table-copy se-bold" x="101" y="617.4"><tspan x="101">Plant</tspan></text><text class="se-copy se-table-copy se-bold" x="319.5" y="617.4"><tspan x="319.5">Venation</tspan></text><text class="se-copy se-table-copy se-bold" x="538" y="617.4"><tspan x="538">Root — my guess</tspan></text><text class="se-copy se-table-copy se-bold" x="756.5" y="617.4"><tspan x="756.5">Root — what I found</tspan></text><line class="se-rule" x1="89" x2="963" y1="684" y2="684"/><text class="se-copy se-table-copy" x="101" y="664.4"><tspan x="101">Lemongrass</tspan></text><text class="se-copy se-table-copy" x="319.5" y="664.4"><tspan x="319.5">Parallel</tspan></text><text class="se-copy se-table-copy" x="538" y="664.4"><tspan x="538">—</tspan></text><text class="se-copy se-table-copy" x="756.5" y="664.4"><tspan x="756.5">Fibrous</tspan></text>
<rect class="se-prompt" x="89" y="698" width="874" height="98" rx="10"/><text class="se-copy" x="113" y="737"><tspan x="113"><tspan class="se-bold">Think:</tspan> How many of your five guesses were right? If you had to guess for a sixth</tspan><tspan x="113" dy="31">plant now, would you feel more sure?</tspan></text>
<text class="se-heading" x="89" y="842"><tspan x="89">The Two Go Together</tspan></text>
<text class="se-copy" x="89" y="892"><tspan x="89">Compare answers across the whole class. The pattern is easy to see.</tspan></text>
<text class="se-copy" x="89" y="937"><tspan x="89">Plants with reticulate venation almost always have a taproot. Plants with parallel</tspan><tspan x="89" dy="31">venation almost always have fibrous roots.</tspan></text>
<text class="se-copy" x="89" y="1013"><tspan x="89"><tspan class="se-italic">Sadabahar</tspan> has net-like veins and a taproot. Chana has net-like veins and a taproot.</tspan><tspan x="89" dy="31">Lemongrass has parallel veins and fibrous roots. Wheat has parallel veins and fibrous</tspan><tspan x="89" dy="31">roots.</tspan></text>
<text class="se-copy" x="89" y="1120"><tspan x="89">Notice the word <tspan class="se-italic">almost</tspan>. A rule that is true nearly every time is still very useful. But</tspan><tspan x="89" dy="31">we should say &quot;almost always&quot;, not &quot;always&quot;. That is more honest.</tspan></text>
<text class="se-copy" x="89" y="1196"><tspan x="89">Now a question should be troubling you. Why should the veins in a leaf have</tspan><tspan x="89" dy="31">anything to do with the shape of a root? They are at opposite ends of the plant.</tspan></text>
