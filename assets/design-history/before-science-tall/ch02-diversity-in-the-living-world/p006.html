<text class="se-heading" x="89" y="124"><tspan x="89">2.2 Making Sense of the Variety</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">Your two tables now hold a long, untidy list. Nature really is like that. But it is hard</tspan><tspan x="89" dy="31">to study anything from an untidy list.</tspan></text>
<text class="se-copy" x="89" y="250"><tspan x="89">Think of a shop that sells stationery. Suppose everything was thrown into one big</tspan><tspan x="89" dy="31">heap. Finding one pen would take an hour. Shops do not do this. Pens are kept with</tspan><tspan x="89" dy="31">pens. Notebooks are kept with notebooks. Geometry boxes are kept together.</tspan></text>
<text class="se-copy" x="89" y="357"><tspan x="89">Once things are in groups, two things become easy. You can find what you want. And</tspan><tspan x="89" dy="31">you can see what the shop has.</tspan></text>
<text class="se-copy" x="89" y="433"><tspan x="89">Scientists do the same with living things. Putting things into groups by the features</tspan><tspan x="89" dy="31">they share is called <tspan class="se-bold">grouping</tspan>.</tspan></text>
<rect class="se-activity-panel" x="89" y="500" width="874" height="514" rx="20"/><rect class="se-activity-tab" x="89" y="486" width="275" height="40" rx="12"/><text class="se-activity-tab-text" x="105" y="514" text-anchor="start">Activity 2.3 · Sort the Pile</text><text class="se-copy" x="113" y="562"><tspan x="113"><tspan class="se-bold">You</tspan> <tspan class="se-bold">will</tspan> <tspan class="se-bold">need:</tspan> old magazines or newspapers, scissors, glue, small cards.</tspan></text><text class="se-activity-step" x="128" y="605" text-anchor="end">1.</text><text class="se-copy" x="146" y="605"><tspan x="146">Cut out pictures of plants and animals. Paste one on each card. Try to make</tspan><tspan x="146" dy="31">at least thirty cards in the class.</tspan></text><text class="se-activity-step" x="128" y="679" text-anchor="end">2.</text><text class="se-copy" x="146" y="679"><tspan x="146">Work in groups of five or six. Put all your cards together.</tspan></text><text class="se-activity-step" x="128" y="722" text-anchor="end">3.</text><text class="se-copy" x="146" y="722"><tspan x="146">Sort the pile into groups. You decide what the groups will be.</tspan></text><text class="se-activity-step" x="128" y="765" text-anchor="end">4.</text><text class="se-copy" x="146" y="765"><tspan x="146">Write down, in one line, the rule you used.</tspan></text><text class="se-activity-step" x="128" y="808" text-anchor="end">5.</text><text class="se-copy" x="146" y="808"><tspan x="146">Now mix all the cards again. Sort them a second time, using a completely</tspan><tspan x="146" dy="31">different rule.</tspan></text><text class="se-copy" x="113" y="882"><tspan x="113"><tspan class="se-bold">Observe:</tspan> Compare both your sortings with another group's.</tspan></text><text class="se-copy" x="113" y="925"><tspan x="113"><tspan class="se-bold">Think:</tspan> Did any two groups in the class use the same rule?</tspan></text><text class="se-copy" x="113" y="968"><tspan x="113"><tspan class="se-bold">Safety:</tspan> Use scissors carefully, with your teacher’s guidance.</tspan></text>
<text class="se-copy" x="89" y="1057"><tspan x="89">Keep your sorting rule visible. If a card is difficult to place, explain what makes it</tspan><tspan x="89" dy="31">difficult instead of hiding it in a convenient pile. An awkward example can show you</tspan><tspan x="89" dy="31">how to make the rule clearer.</tspan></text>
