<section class="page page--food page--science-editorial" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1369" aria-label="Diversity in the Living World, page 11"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M31 63Q34 30 60 7"/><path class="se-botanical-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 2</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Diversity in the Living World</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header -->
<text class="se-copy" x="89" y="119"><tspan x="89">So far you have grouped plants using only the stem. Leaves give us another way to</tspan><tspan x="89" dy="31">sort the same plants. That way turns out to be more useful.</tspan></text>
<text class="se-heading" x="89" y="200"><tspan x="89">Lines on a Leaf</tspan></text>
<text class="se-copy" x="89" y="250"><tspan x="89">Hold a leaf up against the light. You will see thin lines running through it. These</tspan><tspan x="89" dy="31">lines are <tspan class="se-bold">veins</tspan>. The pattern the veins make is called <tspan class="se-bold">venation</tspan>.</tspan></text>
<text class="se-copy" x="89" y="326"><tspan x="89">Veins are not just for decoration. They are pipes. They carry water into the leaf, and</tspan><tspan x="89" dy="31">carry food away from it. They also make the leaf stiff, so it holds its shape instead of</tspan><tspan x="89" dy="31">hanging loose.</tspan></text>
<rect class="se-activity-panel" x="89" y="424" width="874" height="533" rx="20"/><rect class="se-activity-tab" x="89" y="410" width="322" height="40" rx="12"/><text class="se-activity-tab-text" x="105" y="438" text-anchor="start">Activity 2.5 · Take a Leaf Print</text><text class="se-copy" x="113" y="486"><tspan x="113"><tspan class="se-bold">You</tspan> <tspan class="se-bold">will</tspan> <tspan class="se-bold">need:</tspan> fallen leaves of at least four different plants, thin paper, a pencil</tspan><tspan x="113" dy="31">with soft lead.</tspan></text><text class="se-activity-step" x="128" y="560" text-anchor="end">1.</text><text class="se-copy" x="146" y="560"><tspan x="146">Put a leaf on the desk with its back side facing up. The veins stand out more</tspan><tspan x="146" dy="31">on that side.</tspan></text><text class="se-activity-step" x="128" y="634" text-anchor="end">2.</text><text class="se-copy" x="146" y="634"><tspan x="146">Place a sheet of thin paper over the leaf.</tspan></text><text class="se-activity-step" x="128" y="677" text-anchor="end">3.</text><text class="se-copy" x="146" y="677"><tspan x="146">Hold the paper still. Rub the side of the pencil lead flat across it, using light</tspan><tspan x="146" dy="31">strokes.</tspan></text><text class="se-activity-step" x="128" y="751" text-anchor="end">4.</text><text class="se-copy" x="146" y="751"><tspan x="146">The pattern of veins will appear on the paper.</tspan></text><text class="se-activity-step" x="128" y="794" text-anchor="end">5.</text><text class="se-copy" x="146" y="794"><tspan x="146">Do this for every leaf. Write the plant's name next to each print.</tspan></text><text class="se-copy" x="113" y="837"><tspan x="113"><tspan class="se-bold">Observe:</tspan> Put all your prints side by side.</tspan></text><text class="se-copy" x="113" y="880"><tspan x="113"><tspan class="se-bold">Think:</tspan> Sort your prints into two piles, using the pattern only. What rule did you</tspan><tspan x="113" dy="31">use?</tspan></text>
<text class="se-copy" x="89" y="1000"><tspan x="89">Choose leaves whose veins are easy to feel. If a print looks faint, first check that the</tspan><tspan x="89" dy="31">raised veins face the paper and that the paper is held still. A poor print need not</tspan><tspan x="89" dy="31">mean that the leaf has no veins.</tspan></text>
<text class="se-copy" x="89" y="1107"><tspan x="89">Try the same method on another leaf before changing how you make the print.</tspan><tspan x="89" dy="31">Compare the patterns, not just their darkness.</tspan></text>
