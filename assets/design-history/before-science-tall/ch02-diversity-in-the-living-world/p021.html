<rect class="se-prompt" x="89" y="96" width="874" height="98" rx="10"/><text class="se-copy" x="113" y="135"><tspan x="113"><tspan class="se-bold">Can</tspan> <tspan class="se-bold">you</tspan> <tspan class="se-bold">explain</tspan> <tspan class="se-bold">why?</tspan> A cactus planted on a Himalayan slope would probably</tspan><tspan x="113" dy="31">die. Give two reasons from what you have just read.</tspan></text>
<text class="se-heading" x="89" y="240"><tspan x="89">The Same Animal, Two Deserts</tspan></text>
<text class="se-copy" x="89" y="290"><tspan x="89">The clearest example of this is an animal you already know well.</tspan></text>
<text class="se-copy" x="89" y="335"><tspan x="89">Camels live in the hot sandy desert of Rajasthan. Camels also live in the cold, high,</tspan><tspan x="89" dy="31">rocky desert of Ladakh. Both places are deserts. Both are dry, with little food and</tspan><tspan x="89" dy="31">little shelter. But they are dry in very different ways. And the two camels are not the</tspan><tspan x="89" dy="31">same.</tspan></text>
<text class="se-copy" x="89" y="473"><tspan x="89">The Rajasthan camel is tall, with long legs. Its two-toed feet have broad, spreading</tspan><tspan x="89" dy="31">pads. They spread its weight, so it does not sink into loose sand. It has one hump. Its</tspan><tspan x="89" dy="31">coat is thin.</tspan></text>
<text class="se-copy" x="89" y="580"><tspan x="89">The Ladakh camel is shorter and heavier. Its sturdy legs also end in broad, padded,</tspan><tspan x="89" dy="31">two-toed feet. It has two humps. It grows a thick shaggy coat, especially at the head</tspan><tspan x="89" dy="31">and neck, for winters that fall far below freezing.</tspan></text>
<image class="science-illustration" href="../../figures/class-6/science/ch02/camels.png" x="89" y="664" width="874" height="310" preserveAspectRatio="xMidYMid meet"><title>Dromedary · one hump                         Bactrian · two humps</title></image><text class="se-caption" x="371" y="1002" text-anchor="middle">Dromedary · one hump</text><text class="se-caption" x="681" y="1002" text-anchor="middle">Bactrian · two humps</text>
<text class="se-copy" x="89" y="1046"><tspan x="89">You may have heard that a camel stores water in its hump. That is not true. The</tspan><tspan x="89" dy="31">hump stores fat. The camel lives off that fat when there is no food. By the end of</tspan><tspan x="89" dy="31">winter, the humps of a Ladakh camel become smaller and lean over to one side.</tspan></text>
