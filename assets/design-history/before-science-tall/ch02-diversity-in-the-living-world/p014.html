<text class="se-copy" x="89" y="119"><tspan x="89">As the wheat seedling develops, several thin roots appear. Later, more roots grow</tspan><tspan x="89" dy="31">from the base of the stem, forming a spreading bunch without one dominant main</tspan><tspan x="89" dy="31">root. These are called <tspan class="se-bold">fibrous</tspan> <tspan class="se-bold">roots</tspan>. Grass, maize and lemongrass have them.</tspan></text>
<image class="science-illustration" href="../../figures/class-6/science/ch02/roots.png" x="89" y="203" width="874" height="428" preserveAspectRatio="xMidYMid meet"><title>Chana · taproot                              Wheat · fibrous roots</title></image><text class="se-caption" x="312" y="659" text-anchor="middle">Chana · taproot</text><text class="se-caption" x="740" y="659" text-anchor="middle">Wheat · fibrous roots</text>
<text class="se-copy" x="89" y="703"><tspan x="89">The two shapes do two different jobs.</tspan></text>
<text class="se-copy" x="89" y="748"><tspan x="89">A taproot can grow deep and reach water below the surface. A deep root system can</tspan><tspan x="89" dy="31">help a plant through a dry spell, although root depth also depends on the species and</tspan><tspan x="89" dy="31">the soil.</tspan></text>
<text class="se-copy" x="89" y="855"><tspan x="89">Many fibrous root systems spread through the upper soil. A dense network helps</tspan><tspan x="89" dy="31">hold loose soil together and take up water near the surface. Some fibrous roots also</tspan><tspan x="89" dy="31">reach deep into the ground.</tspan></text>
<text class="se-heading" x="89" y="967"><tspan x="89">A Pattern Appears</tspan></text>
<text class="se-copy" x="89" y="1017"><tspan x="89">You now know two ways to sort plants. One uses leaves. One uses roots.</tspan></text>
<text class="se-copy" x="89" y="1062"><tspan x="89">Leaves are above the ground. Roots are below it. There seems to be no reason why</tspan><tspan x="89" dy="31">one should tell you anything about the other.</tspan></text>
<text class="se-copy" x="89" y="1138"><tspan x="89">Let us test that.</tspan></text>
