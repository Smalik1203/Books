<g aria-label="Chapter 2"><path class="food-gold-tag" d="M92 45H215V163Q215 230 147 230Q81 230 81 165V70Q81 45 92 45Z"/><path class="food-navy" d="M105 45H206V164Q206 234 143 234Q81 234 81 164V73Q81 45 105 45Z"/><text class="food-text food-white science-chapter-label" x="143" y="94" text-anchor="middle">CHAPTER</text><text class="food-text food-white science-chapter-number" x="143" y="211" text-anchor="middle">2</text></g><text class="se-title" x="248" y="137" text-anchor="start">Diversity in the</text><text class="se-title" x="248" y="204" text-anchor="start">Living World</text><image class="science-illustration" href="../../figures/class-6/science/ch02/opener.png" x="89" y="280" width="874" height="409" preserveAspectRatio="xMidYMid meet"><title>Living things in a schoolyard</title></image>
<text class="se-copy" x="89" y="732"><tspan x="89">Go outside your classroom. Stand still for two minutes.</tspan></text>
<text class="se-copy" x="89" y="777"><tspan x="89">The place may look very ordinary. But living things are all around you. Grass is</tspan><tspan x="89" dy="31">growing through a crack in the path. A crow sits on the wall. Ants move in a line</tspan><tspan x="89" dy="31">along the edge of a step. One tree has wide leaves. The tree next to it has thin ones.</tspan></text>
<text class="se-copy" x="89" y="884"><tspan x="89">Nobody planted most of these. Nobody arranged them. And no two of them are</tspan><tspan x="89" dy="31">exactly the same.</tspan></text>
<text class="se-copy" x="89" y="960"><tspan x="89">This chapter is about that variety. How much of it is there? How do we make sense of</tspan><tspan x="89" dy="31">it? And why are the living things in one place so different from the living things in</tspan><tspan x="89" dy="31">another?</tspan></text>
<rect class="se-prompt" x="89" y="1044" width="874" height="98" rx="10"/><text class="se-copy" x="113" y="1083"><tspan x="113">Observe the illustration. How many kinds of living things can you find? Which</tspan><tspan x="113" dy="31">might you miss if you were walking quickly?</tspan></text>
