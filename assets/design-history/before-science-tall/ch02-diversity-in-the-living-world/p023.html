<text class="se-heading" x="89" y="124"><tspan x="89">Habitat</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">The place where a living thing lives is called its <tspan class="se-bold">habitat</tspan>.</tspan></text>
<text class="se-copy" x="89" y="219"><tspan x="89">A habitat gives a plant or animal what it needs — food, water, air, shelter, and a safe</tspan><tspan x="89" dy="31">place for its young. The habitat of a camel is the desert. The habitat of a sea turtle is</tspan><tspan x="89" dy="31">the ocean. The habitat of a rhododendron is the mountains.</tspan></text>
<text class="se-copy" x="89" y="326"><tspan x="89">Many different living things share one habitat. That is why habitats are where we</tspan><tspan x="89" dy="31">find biodiversity.</tspan></text>
<text class="se-copy" x="89" y="402"><tspan x="89">Habitats can be sorted into two broad kinds.</tspan></text>
<text class="se-copy" x="89" y="447"><tspan x="89">Living things on land live in <tspan class="se-bold">terrestrial</tspan> habitats. Forests, deserts, grasslands and</tspan><tspan x="89" dy="31">mountains are terrestrial habitats. So is the ground under your feet.</tspan></text>
<text class="se-copy" x="89" y="523"><tspan x="89">Living things in water live in <tspan class="se-bold">aquatic</tspan> habitats. Ponds, lakes, rivers and oceans are</tspan><tspan x="89" dy="31">aquatic habitats.</tspan></text>
<text class="se-copy" x="89" y="599"><tspan x="89">Some animals use both land and water. Frogs belong to a group called <tspan class="se-bold">amphibians</tspan>;</tspan><tspan x="89" dy="31">many amphibians spend part of their lives in each. But using both habitats does not</tspan><tspan x="89" dy="31">make every animal an amphibian. A crocodile does so too, and it is a reptile.</tspan></text>
<text class="se-heading" x="89" y="711"><tspan x="89">Know a scientist</tspan></text>
<text class="se-copy" x="89" y="761"><tspan x="89"><tspan class="se-bold">Salim</tspan> <tspan class="se-bold">Ali</tspan> <tspan class="se-bold">(1896–1987)</tspan> spent many years travelling across India, watching birds. He</tspan><tspan x="89" dy="31">recorded where they lived, when they arrived, and where they went next. Watching</tspan><tspan x="89" dy="31">carefully like this, year after year, is how scattered sightings turn into real</tspan><tspan x="89" dy="31">knowledge. His fieldwork and advocacy helped strengthen bird conservation in</tspan><tspan x="89" dy="31">India. His books also made it possible for ordinary people to name the birds around</tspan><tspan x="89" dy="31">them. He is remembered as the Birdman of India.</tspan></text>
<text class="se-copy" x="89" y="961"><tspan x="89">A habitat can be small. The damp soil beneath a fallen log may shelter living things</tspan><tspan x="89" dy="31">that cannot survive on the dry path beside it. Looking at these small differences can</tspan><tspan x="89" dy="31">reveal variety within a single garden.</tspan></text>
<text class="se-copy" x="89" y="1068"><tspan x="89">Land and water are broad starting groups. Fresh water and salty water, or a shady</tspan><tspan x="89" dy="31">forest and an open grassland, present very different conditions. Naming a habitat is</tspan><tspan x="89" dy="31">the beginning of an explanation, not the whole explanation.</tspan></text>
