<text class="se-heading" x="89" y="124"><tspan x="89">Two Patterns</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">However many leaves you print, the patterns almost always fall into two kinds.</tspan></text>
<text class="se-copy" x="89" y="219"><tspan x="89">In some leaves, one thick vein runs down the middle. Thinner veins branch off it on</tspan><tspan x="89" dy="31">both sides. Those branch again, and again, until the whole leaf is covered with a net.</tspan><tspan x="89" dy="31">This pattern is called <tspan class="se-bold">reticulate</tspan> <tspan class="se-bold">venation</tspan>. You can see it clearly in a hibiscus leaf.</tspan><tspan x="89" dy="31">Mango, neem and peepal leaves have it too.</tspan></text>
<text class="se-copy" x="89" y="357"><tspan x="89">In other leaves, many veins run alongside one another. This pattern is called <tspan class="se-bold">parallel</tspan></tspan><tspan x="89" dy="31"><tspan class="se-bold">venation</tspan>. In a grass blade they run along the length of the leaf. A banana leaf has a</tspan><tspan x="89" dy="31">strong middle vein, with many parallel side veins running out towards its edges.</tspan><tspan x="89" dy="31">Parallel venation does not mean that a leaf has no middle vein.</tspan></text>
<image class="science-illustration" href="../../figures/class-6/science/ch02/veins.png" x="89" y="472" width="874" height="371" preserveAspectRatio="xMidYMid meet"><title>Hibiscus · reticulate             Banana · parallel             Grass · parallel</title></image><text class="se-caption" x="278.66666666666663" y="871" text-anchor="middle">Hibiscus · reticulate</text><text class="se-caption" x="526" y="871" text-anchor="middle">Banana · parallel</text><text class="se-caption" x="773.3333333333334" y="871" text-anchor="middle">Grass · parallel</text>
<text class="se-copy" x="89" y="915"><tspan x="89">These two patterns help you compare many of the leaves around you. Look closely:</tspan><tspan x="89" dy="31">real leaves sometimes show exceptions.</tspan></text>
<rect class="se-prompt" x="89" y="968" width="874" height="98" rx="10"/><text class="se-copy" x="113" y="1007"><tspan x="113"><tspan class="se-bold">What</tspan> <tspan class="se-bold">do</tspan> <tspan class="se-bold">you</tspan> <tspan class="se-bold">predict?</tspan> Maize and wheat both have long thin leaves, like grass.</tspan><tspan x="113" dy="31">What venation would you expect in them?</tspan></text>
<text class="se-copy" x="89" y="1107"><tspan x="89">Keep that answer in your mind. We are now going to look at a part of the plant you</tspan><tspan x="89" dy="31">cannot see at all.</tspan></text>
