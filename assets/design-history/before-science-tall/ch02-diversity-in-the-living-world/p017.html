<text class="se-copy" x="89" y="119"><tspan x="89">Now put all three findings together.</tspan></text>
<text class="se-caption se-bold" x="89" y="164" text-anchor="start">Comparing flowering plants — typical features</text><rect class="se-table-head" x="89" y="183" width="874" height="47"/><line class="se-rule" x1="89" x2="963" y1="230" y2="230"/><text class="se-copy se-table-copy se-bold" x="101" y="210.4"><tspan x="101">—</tspan></text><text class="se-copy se-table-copy se-bold" x="392.3333333333333" y="210.4"><tspan x="392.3333333333333">Dicots</tspan></text><text class="se-copy se-table-copy se-bold" x="683.6666666666666" y="210.4"><tspan x="683.6666666666666">Monocots</tspan></text><line class="se-rule" x1="89" x2="963" y1="277" y2="277"/><text class="se-copy se-table-copy" x="101" y="257.4"><tspan x="101">Cotyledons in the seed</tspan></text><text class="se-copy se-table-copy" x="392.3333333333333" y="257.4"><tspan x="392.3333333333333">Two</tspan></text><text class="se-copy se-table-copy" x="683.6666666666666" y="257.4"><tspan x="683.6666666666666">One</tspan></text><line class="se-rule" x1="89" x2="963" y1="324" y2="324"/><text class="se-copy se-table-copy" x="101" y="304.4"><tspan x="101">Leaf venation</tspan></text><text class="se-copy se-table-copy" x="392.3333333333333" y="304.4"><tspan x="392.3333333333333">Reticulate</tspan></text><text class="se-copy se-table-copy" x="683.6666666666666" y="304.4"><tspan x="683.6666666666666">Parallel</tspan></text><line class="se-rule" x1="89" x2="963" y1="371" y2="371"/><text class="se-copy se-table-copy" x="101" y="351.4"><tspan x="101">Roots</tspan></text><text class="se-copy se-table-copy" x="392.3333333333333" y="351.4"><tspan x="392.3333333333333">Taproot</tspan></text><text class="se-copy se-table-copy" x="683.6666666666666" y="351.4"><tspan x="683.6666666666666">Fibrous</tspan></text><line class="se-rule" x1="89" x2="963" y1="443" y2="443"/><text class="se-copy se-table-copy" x="101" y="398.4"><tspan x="101">Examples</tspan></text><text class="se-copy se-table-copy" x="392.3333333333333" y="398.4"><tspan x="392.3333333333333">Chana, mustard, hibiscus,</tspan><tspan x="392.3333333333333" dy="25">mango</tspan></text><text class="se-copy se-table-copy" x="683.6666666666666" y="398.4"><tspan x="683.6666666666666">Wheat, maize, grass, banana</tspan></text>
<text class="se-copy" x="89" y="480"><tspan x="89">This is the grouping worth having. Split one seed, and you can say two more things</tspan><tspan x="89" dy="31">about a plant you have never seen before.</tspan></text>
<text class="se-copy" x="89" y="556"><tspan x="89">That is what makes a grouping really useful. It lets you say something new. It does</tspan><tspan x="89" dy="31">not just tidy up what you already knew.</tspan></text>
<text class="se-heading" x="89" y="637"><tspan x="89">2.2.2 Grouping Animals</tspan></text>
<text class="se-copy" x="89" y="687"><tspan x="89">Animals vary as much as plants do. So the same question comes up. Which feature</tspan><tspan x="89" dy="31">should we use to group them?</tspan></text>
<text class="se-copy" x="89" y="763"><tspan x="89">Colour is easy to see, but it tells us very little. Size is not much better. A big animal</tspan><tspan x="89" dy="31">and a small one may live in exactly the same way.</tspan></text>
<text class="se-copy" x="89" y="839"><tspan x="89">A better starting point is something you have already written down in Table 2.2 —</tspan><tspan x="89" dy="31">how the animal moves.</tspan></text>
<rect class="se-activity-panel" x="89" y="906" width="874" height="237" rx="20"/><rect class="se-activity-tab" x="89" y="892" width="342" height="40" rx="12"/><text class="se-activity-tab-text" x="105" y="920" text-anchor="start">Activity 2.9 · How Does It Move?</text><text class="se-activity-step" x="128" y="968" text-anchor="end">1.</text><text class="se-copy" x="146" y="968"><tspan x="146">List every animal from Table 2.2. Add any others you know well.</tspan></text><text class="se-activity-step" x="128" y="1011" text-anchor="end">2.</text><text class="se-copy" x="146" y="1011"><tspan x="146">For each one, write how it moves and which body part it uses.</tspan></text><text class="se-activity-step" x="128" y="1054" text-anchor="end">3.</text><text class="se-copy" x="146" y="1054"><tspan x="146">Use Table 2.5 as a guide for your notebook table.</tspan></text><text class="se-activity-step" x="128" y="1097" text-anchor="end">4.</text><text class="se-copy" x="146" y="1097"><tspan x="146">Now sort your animals into groups, using the &quot;body part&quot; column only.</tspan></text>
