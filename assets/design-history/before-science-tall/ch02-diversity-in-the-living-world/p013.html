<text class="se-heading" x="89" y="124"><tspan x="89">Under the Ground</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">Roots do two jobs. They hold the plant firmly in place against wind and rain. And</tspan><tspan x="89" dy="31">they pull water and minerals out of the soil.</tspan></text>
<text class="se-copy" x="89" y="250"><tspan x="89">Roots are buried, so most people never see them. But roots differ from plant to plant,</tspan><tspan x="89" dy="31">just as leaves do. And you can watch them grow yourself.</tspan></text>
<rect class="se-activity-panel" x="89" y="317" width="874" height="595" rx="20"/><rect class="se-activity-tab" x="89" y="303" width="372" height="40" rx="12"/><text class="se-activity-tab-text" x="105" y="331" text-anchor="start">Activity 2.6 · Grow Your Own Roots</text><text class="se-copy" x="113" y="379"><tspan x="113"><tspan class="se-bold">You</tspan> <tspan class="se-bold">will</tspan> <tspan class="se-bold">need:</tspan> a handful of chana (chickpea) seeds, a handful of wheat or maize</tspan><tspan x="113" dy="31">seeds, two shallow trays or plates, cotton cloth or cotton wool, water.</tspan></text><text class="se-activity-step" x="128" y="453" text-anchor="end">1.</text><text class="se-copy" x="146" y="453"><tspan x="146">Soak both kinds of seed in water overnight.</tspan></text><text class="se-activity-step" x="128" y="496" text-anchor="end">2.</text><text class="se-copy" x="146" y="496"><tspan x="146">Spread a wet cloth in each tray. Put the chana seeds in one tray. Put the</tspan><tspan x="146" dy="31">wheat seeds in the other.</tspan></text><text class="se-activity-step" x="128" y="570" text-anchor="end">3.</text><text class="se-copy" x="146" y="570"><tspan x="146">Keep the cloth wet for the next five or six days. Wet, not flooded. Check it</tspan><tspan x="146" dy="31">every morning.</tspan></text><text class="se-activity-step" x="128" y="644" text-anchor="end">4.</text><text class="se-copy" x="146" y="644"><tspan x="146">From day three, take out one seed from each tray every day. Look at what has</tspan><tspan x="146" dy="31">grown from it.</tspan></text><text class="se-activity-step" x="128" y="718" text-anchor="end">5.</text><text class="se-copy" x="146" y="718"><tspan x="146">On day six, wash the roots gently. Lay them on paper, side by side.</tspan></text><text class="se-copy" x="113" y="761"><tspan x="113"><tspan class="se-bold">Observe:</tspan> Draw what grew from each kind of seed in your notebook. Use the</tspan><tspan x="113" dy="31">same scale for both drawings.</tspan></text><text class="se-copy" x="113" y="835"><tspan x="113"><tspan class="se-bold">Think:</tspan> Which of your two root systems would be easier to pull out of soil? What</tspan><tspan x="113" dy="31">would that mean for the plant?</tspan></text>
<text class="se-heading" x="89" y="960"><tspan x="89">Two Kinds of Root</tspan></text>
<text class="se-copy" x="89" y="1010"><tspan x="89">Your two trays will have grown two very different things.</tspan></text>
<text class="se-copy" x="89" y="1055"><tspan x="89">From the chana seed, one thick root will have gone straight down. Much thinner</tspan><tspan x="89" dy="31">roots will have branched off it. That main root is called a <tspan class="se-bold">taproot</tspan>. Mustard, hibiscus,</tspan><tspan x="89" dy="31">mango and radish all have taproots. In fact, a radish <tspan class="se-italic">is</tspan> a taproot. It is swollen with</tspan><tspan x="89" dy="31">stored food. That is why we eat it.</tspan></text>
