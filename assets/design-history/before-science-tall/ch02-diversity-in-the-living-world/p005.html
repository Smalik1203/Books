<section class="page page--food page--science-editorial" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1369" aria-label="Diversity in the Living World, page 5"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M31 63Q34 30 60 7"/><path class="se-botanical-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 2</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Diversity in the Living World</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header -->
<text class="se-copy" x="89" y="119"><tspan x="89">Your school ground has its own biodiversity. So does a pond. So does a forest, a</tspan><tspan x="89" dy="31">seashore, and even the soil in a flowerpot.</tspan></text>
<rect class="se-prompt" x="89" y="172" width="874" height="98" rx="10"/><text class="se-copy" x="113" y="211"><tspan x="113"><tspan class="se-bold">Think:</tspan> You looked for one period. Do you think you found most of the living</tspan><tspan x="113" dy="31">things there? Or only a small part of them?</tspan></text>
<text class="se-heading" x="89" y="316"><tspan x="89">Living Things Need Each Other</tspan></text>
<text class="se-copy" x="89" y="366"><tspan x="89">The living things in a place are not just sharing space. They are joined to each other.</tspan></text>
<text class="se-copy" x="89" y="411"><tspan x="89">A tree gives shade. Small plants that cannot take strong sunlight grow in that shade.</tspan><tspan x="89" dy="31">Birds build nests in its branches. They eat insects from its bark. A bird eats a fruit,</tspan><tspan x="89" dy="31">flies away, and drops the seed far from the tree. The seed grows into a new tree there.</tspan><tspan x="89" dy="31">Old leaves fall and rot into the soil. That soil feeds the next plant.</tspan></text>
<text class="se-copy" x="89" y="549"><tspan x="89">Now take one part away. The others feel it. If the insects go, the birds have less food.</tspan><tspan x="89" dy="31">If the tree goes, the shade goes, the nests go, and the falling leaves go too.</tspan></text>
<rect class="se-activity-panel" x="89" y="616" width="874" height="311" rx="20"/><rect class="se-activity-tab" x="89" y="602" width="370" height="40" rx="12"/><text class="se-activity-tab-text" x="105" y="630" text-anchor="start">Activity 2.2 · One Thread at a Time</text><text class="se-activity-step" x="128" y="678" text-anchor="end">1.</text><text class="se-copy" x="146" y="678"><tspan x="146">Choose any one living thing from Table 2.1 or Table 2.2.</tspan></text><text class="se-activity-step" x="128" y="721" text-anchor="end">2.</text><text class="se-copy" x="146" y="721"><tspan x="146">Write two things it needs from other living things.</tspan></text><text class="se-activity-step" x="128" y="764" text-anchor="end">3.</text><text class="se-copy" x="146" y="764"><tspan x="146">Write two things that other living things get from it.</tspan></text><text class="se-activity-step" x="128" y="807" text-anchor="end">4.</text><text class="se-copy" x="146" y="807"><tspan x="146">Compare your answers with a partner who chose something else.</tspan></text><text class="se-copy" x="113" y="850"><tspan x="113"><tspan class="se-bold">Think:</tspan> Could the living thing you chose stay alive on its own, in an empty place</tspan><tspan x="113" dy="31">with nothing else living there?</tspan></text>
<text class="se-copy" x="89" y="970"><tspan x="89">One connection can lead to another. Fallen leaves provide food for small organisms</tspan><tspan x="89" dy="31">in the soil. As those leaves break down, nutrients return to the soil and can be taken</tspan><tspan x="89" dy="31">up by roots.</tspan></text>
<text class="se-copy" x="89" y="1077"><tspan x="89">When you compare answers, draw arrows in your notebook between the living things</tspan><tspan x="89" dy="31">you chose. Write a word beside each arrow, such as food or shelter, to explain the</tspan><tspan x="89" dy="31">connection.</tspan></text>
