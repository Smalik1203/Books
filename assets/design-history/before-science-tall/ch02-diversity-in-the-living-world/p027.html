<text class="se-copy" x="89" y="119"><tspan x="89"><tspan class="se-bold">5.</tspan> Sort these animals into two groups, using any feature <tspan class="se-italic">not</tspan> used in this chapter —</tspan><tspan x="89" dy="31">cow, cockroach, pigeon, bat, tortoise, whale, fish, grasshopper, lizard. Write your rule</tspan><tspan x="89" dy="31">clearly.</tspan></text>

<text class="se-copy" x="89" y="877"><tspan x="89"><tspan class="se-bold">8.</tspan> One student says a hibiscus is a shrub. Another student disagrees. What three</tspan><tspan x="89" dy="31">questions should they ask about the plant to settle it? What answer would each</tspan><tspan x="89" dy="31">student be hoping for?</tspan></text>
<text class="se-copy" x="89" y="984"><tspan x="89"><tspan class="se-bold">9.</tspan> A plant grows on an open, windy hilltop. It is short, with small tough leaves. The</tspan><tspan x="89" dy="31">same kind of plant grows in a sheltered valley below. There it is twice as tall, with</tspan><tspan x="89" dy="31">bigger leaves. Suggest how wind and shelter could affect its growth. Explain why this</tspan><tspan x="89" dy="31">observation alone does not prove that a new inherited <tspan class="se-italic">adaptation</tspan> has developed.</tspan></text>
<text class="se-copy" x="89" y="1122"><tspan x="89"><tspan class="se-bold">10.</tspan> A duck and a pigeon are both birds. But their feet are different. Describe the</tspan><tspan x="89" dy="31">difference. What can the duck do because of it?</tspan></text>
