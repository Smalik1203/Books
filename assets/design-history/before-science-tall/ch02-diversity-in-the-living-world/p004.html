<text class="se-copy" x="89" y="119"><tspan x="89">Some stems bend easily between two fingers. Some do not bend at all. Some leaves</tspan><tspan x="89" dy="31">grow one at a time along the stem. Others grow in pairs, facing each other. Flowers</tspan><tspan x="89" dy="31">are different in colour, in shape and in smell.</tspan></text>
<rect class="se-prompt" x="89" y="203" width="874" height="98" rx="10"/><text class="se-copy" x="113" y="242"><tspan x="113"><tspan class="se-bold">What</tspan> <tspan class="se-bold">do</tspan> <tspan class="se-bold">you</tspan> <tspan class="se-bold">notice?</tspan> Were any two plants in your table the same in every</tspan><tspan x="113" dy="31">column?</tspan></text>
<text class="se-copy se-note" x="89" y="342"><tspan x="89">Copy the headings into your notebook and add your own observations. The rows</tspan><tspan x="89" dy="31">below are examples, not a complete record.</tspan></text>
<rect class="se-table-band" x="89" y="391" width="874" height="40" rx="3"/><rect class="se-table-number" x="89" y="391" width="149" height="40" rx="3"/><text class="se-caption se-table-number-text" x="109" y="418">Table 2.2</text><text class="se-caption se-bold" x="260" y="418">Animals you observed</text><rect class="se-table-head" x="89" y="437" width="874" height="72"/><line class="se-rule" x1="89" x2="963" y1="509" y2="509"/><text class="se-copy se-table-copy se-bold" x="101" y="464.4"><tspan x="101">Name /</tspan><tspan x="101" dy="25">description</tspan></text><text class="se-copy se-table-copy se-bold" x="275.8" y="464.4"><tspan x="275.8">Where you saw it</tspan></text><text class="se-copy se-table-copy se-bold" x="450.6" y="464.4"><tspan x="450.6">Doing / eating</tspan></text><text class="se-copy se-table-copy se-bold" x="625.4000000000001" y="464.4"><tspan x="625.4000000000001">How it moved</tspan></text><text class="se-copy se-table-copy se-bold" x="800.2" y="464.4"><tspan x="800.2">Anything else</tspan></text><line class="se-rule" x1="89" x2="963" y1="581" y2="581"/><text class="se-copy se-table-copy" x="101" y="536.4"><tspan x="101">Crow</tspan></text><text class="se-copy se-table-copy" x="275.8" y="536.4"><tspan x="275.8">On a wall, then a</tspan><tspan x="275.8" dy="25">tree</tspan></text><text class="se-copy se-table-copy" x="450.6" y="536.4"><tspan x="450.6">Pecking at</tspan><tspan x="450.6" dy="25">something</tspan></text><text class="se-copy se-table-copy" x="625.4000000000001" y="536.4"><tspan x="625.4000000000001">Walks, then flies</tspan></text><text class="se-copy se-table-copy" x="800.2" y="536.4"><tspan x="800.2">Carried a twig</tspan><tspan x="800.2" dy="25">away</tspan></text><line class="se-rule" x1="89" x2="963" y1="653" y2="653"/><text class="se-copy se-table-copy" x="101" y="608.4"><tspan x="101">Ant</tspan></text><text class="se-copy se-table-copy" x="275.8" y="608.4"><tspan x="275.8">Along the edge of</tspan><tspan x="275.8" dy="25">a step</tspan></text><text class="se-copy se-table-copy" x="450.6" y="608.4"><tspan x="450.6">Carrying a crumb</tspan></text><text class="se-copy se-table-copy" x="625.4000000000001" y="608.4"><tspan x="625.4000000000001">Walks</tspan></text><text class="se-copy se-table-copy" x="800.2" y="608.4"><tspan x="800.2">Six legs; followed</tspan><tspan x="800.2" dy="25">the ant in front</tspan></text>
<text class="se-copy" x="89" y="690"><tspan x="89">Animals are harder to record than plants. The reason is simple. They move, and</tspan><tspan x="89" dy="31">many of them move away from you. So sitting still and watching finds more than</tspan><tspan x="89" dy="31">walking about.</tspan></text>
<text class="se-copy" x="89" y="797"><tspan x="89">Now look down your table. Some animals live on the ground. Some live in trees.</tspan><tspan x="89" dy="31">Some live in water, and some under stones. They eat very different things. They move</tspan><tspan x="89" dy="31">in different ways — walking, flying, crawling, swimming, hopping.</tspan></text>
<text class="se-copy" x="89" y="904"><tspan x="89">The variety of living things found in one region is called its <tspan class="se-bold">biodiversity</tspan>.</tspan></text>
<text class="se-copy" x="89" y="949"><tspan x="89">Seeing many individuals is different from seeing many kinds. Twenty ants may</tspan><tspan x="89" dy="31">belong to one kind, while three birds may belong to three different kinds. Keep both</tspan><tspan x="89" dy="31">questions in mind: how many did you see, and how many different kinds did you</tspan><tspan x="89" dy="31">recognise?</tspan></text>
<text class="se-copy" x="89" y="1087"><tspan x="89">A sound is useful evidence too. You may hear a bird hidden in a tree even when you</tspan><tspan x="89" dy="31">cannot see its colour or shape.</tspan></text>
