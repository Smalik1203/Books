<text class="se-heading" x="89" y="124"><tspan x="89">There Is No One Correct Sorting</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">When the class compares answers, something surprising happens. Almost every</tspan><tspan x="89" dy="31">group sorted the same cards differently. And none of them were wrong.</tspan></text>
<text class="se-copy" x="89" y="250"><tspan x="89">One group may have put plants on one side and animals on the other. Another may</tspan><tspan x="89" dy="31">have used size. Another may have used where the living thing lives, or what it eats, or</tspan><tspan x="89" dy="31">whether it has flowers.</tspan></text>
<text class="se-heading" x="198" y="378" text-anchor="middle">Flowers</text><text class="se-heading" x="415" y="378" text-anchor="middle">Stem</text><text class="se-heading" x="632" y="378" text-anchor="middle">Food</text><text class="se-heading" x="849" y="378" text-anchor="middle">Habitat</text><line class="se-accent" x1="89" x2="963" y1="398" y2="398"/><text class="se-caption" x="526" y="432" text-anchor="middle">Some ways of grouping</text>
<text class="se-copy" x="89" y="477"><tspan x="89">This is important to understand. It is easy to think that living things come with</tspan><tspan x="89" dy="31">group names already fixed on them. They do not. We make the groups. And we make</tspan><tspan x="89" dy="31">them to suit the question we are asking.</tspan></text>
<text class="se-copy" x="89" y="584"><tspan x="89">A gardener may sort plants by height. That helps a gardening question. A doctor may</tspan><tspan x="89" dy="31">sort plants by which ones are used as medicine. That helps a different question. Both</tspan><tspan x="89" dy="31">sortings are useful. Neither one is the &quot;true&quot; grouping of plants.</tspan></text>
<text class="se-copy" x="89" y="691"><tspan x="89">Scientists look for a grouping that is useful again and again. The best kind is this:</tspan><tspan x="89" dy="31">when you know that something belongs to a group, you can say several other things</tspan><tspan x="89" dy="31">about it. You will meet a grouping like that later in this chapter. Watch for it.</tspan></text>
<rect class="se-prompt" x="89" y="775" width="874" height="98" rx="10"/><text class="se-copy" x="113" y="814"><tspan x="113"><tspan class="se-bold">Think:</tspan> Your school library keeps books in a certain order. What is easy to find</tspan><tspan x="113" dy="31">because of that order? What is hard to find?</tspan></text>
<text class="se-copy" x="89" y="914"><tspan x="89">A useful rule must be clear enough for someone else to use. “Plants I like” depends</tspan><tspan x="89" dy="31">on the person doing the sorting. “Plants with woody stems” asks everyone to inspect</tspan><tspan x="89" dy="31">the same feature.</tspan></text>
<text class="se-copy" x="89" y="1021"><tspan x="89">Also separate an observation from a guess. “No flowers seen today” is an observation.</tspan><tspan x="89" dy="31">“This plant never flowers” is a much bigger claim. You would need evidence from</tspan><tspan x="89" dy="31">other times of year before putting the plant in that group.</tspan></text>
<text class="se-copy" x="89" y="1128"><tspan x="89">A good grouping invites you to check its rule against a new example.</tspan></text>
