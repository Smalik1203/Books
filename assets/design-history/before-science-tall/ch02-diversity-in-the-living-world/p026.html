<text class="se-heading" x="89" y="124"><tspan x="89">Let Us Enhance Our Learning</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89"><tspan class="se-bold">1.</tspan> Here are two seeds — a wheat grain and a kidney bean. Without planting either</tspan><tspan x="89" dy="31">one, say what kind of root and what kind of leaf venation each plant will have.</tspan><tspan x="89" dy="31">Explain how you decided.</tspan></text>

<text class="se-copy" x="89" y="597"><tspan x="89"><tspan class="se-bold">2.</tspan> Sort these animals by habitat. Draw the diagram in your notebook. Put the aquatic</tspan><tspan x="89" dy="31">ones in region A, the terrestrial ones in region B, and any that use both in the middle</tspan><tspan x="89" dy="31">part, C.</tspan></text>
<text class="se-copy" x="89" y="704"><tspan x="89">Horse · Dolphin · Frog · Sheep · Crocodile · Squirrel · Whale · Earthworm · Pigeon ·</tspan><tspan x="89" dy="31">Tortoise</tspan></text>

<text class="se-copy" x="89" y="1000"><tspan x="89"><tspan class="se-bold">3.</tspan> A radish is pulled out of a kitchen garden. Examine one. What kind of root is it?</tspan><tspan x="89" dy="31">Now predict the venation of a radish leaf. Then check whether you were right.</tspan></text>
<text class="se-copy" x="89" y="1076"><tspan x="89"><tspan class="se-bold">4.</tspan> A shopkeeper arranges her stock by price. A customer who wants a birthday gift</tspan><tspan x="89" dy="31">finds this arrangement unhelpful. Neither of them is wrong. Explain why, using what</tspan><tspan x="89" dy="31">you learnt about grouping.</tspan></text>
