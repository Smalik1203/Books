<text class="se-copy" x="89" y="1025"><tspan x="89">When your table has a few rows, read down the columns. Do not read across. The</tspan><tspan x="89" dy="31">differences show up in the columns.</tspan></text>
<text class="se-copy" x="89" y="1101"><tspan x="89">A dash in a sample table means that the observation has not been recorded. It does</tspan><tspan x="89" dy="31">not prove that the feature is absent. A plant without visible flowers today may flower</tspan><tspan x="89" dy="31">in another season.</tspan></text>
<text class="se-copy" x="89" y="1208"><tspan x="89">The drawings help you compare the plants. They are not drawn to a common scale;</tspan><tspan x="89" dy="31">use your own observations to compare their actual heights.</tspan></text>
