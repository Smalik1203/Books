<rect class="se-table-band" x="89" y="168" width="874" height="40" rx="3"/><rect class="se-table-number" x="89" y="168" width="149" height="40" rx="3"/><text class="se-caption se-table-number-text" x="109" y="195">Table 2.5</text><text class="se-caption se-bold" x="260" y="195">How animals move</text><rect class="se-table-head" x="89" y="214" width="874" height="47"/><line class="se-rule" x1="89" x2="963" y1="261" y2="261"/><text class="se-copy se-table-copy se-bold" x="101" y="241.4"><tspan x="101">Animal</tspan></text><text class="se-copy se-table-copy se-bold" x="392.3333333333333" y="241.4"><tspan x="392.3333333333333">How it moves</tspan></text><text class="se-copy se-table-copy se-bold" x="683.6666666666666" y="241.4"><tspan x="683.6666666666666">Body part used</tspan></text><line class="se-rule" x1="89" x2="963" y1="308" y2="308"/><text class="se-copy se-table-copy" x="101" y="288.4"><tspan x="101">Ant</tspan></text><text class="se-copy se-table-copy" x="392.3333333333333" y="288.4"><tspan x="392.3333333333333">Walks</tspan></text><text class="se-copy se-table-copy" x="683.6666666666666" y="288.4"><tspan x="683.6666666666666">Legs</tspan></text><line class="se-rule" x1="89" x2="963" y1="355" y2="355"/><text class="se-copy se-table-copy" x="101" y="335.4"><tspan x="101">Goat</tspan></text><text class="se-copy se-table-copy" x="392.3333333333333" y="335.4"><tspan x="392.3333333333333">Walks and jumps</tspan></text><text class="se-copy se-table-copy" x="683.6666666666666" y="335.4"><tspan x="683.6666666666666">Legs</tspan></text><line class="se-rule" x1="89" x2="963" y1="402" y2="402"/><text class="se-copy se-table-copy" x="101" y="382.4"><tspan x="101">Pigeon</tspan></text><text class="se-copy se-table-copy" x="392.3333333333333" y="382.4"><tspan x="392.3333333333333">Walks and flies</tspan></text><text class="se-copy se-table-copy" x="683.6666666666666" y="382.4"><tspan x="683.6666666666666">Legs and wings</tspan></text><line class="se-rule" x1="89" x2="963" y <rect class="se-prompt" x="89" y="557" width="874" height="98" rx="10"/><text class="se-copy" x="113" y="596"><tspan x="113"><tspan class="se-bold">Think:</tspan> Some animals use more than one body part. They will fall into more than</tspan><tspan x="113" dy="31">one group. Is that a problem with the animals, or with the grouping?</tspan></text>
<text class="se-heading" x="89" y="701"><tspan x="89">What Movement Tells Us</tspan></text>
<text class="se-copy" x="89" y="751"><tspan x="89">Animals move in many ways. They walk, run, hop, crawl, fly, swim and glide. Some</tspan><tspan x="89" dy="31">do more than one, like a pigeon.</tspan></text>
<text class="se-copy" x="89" y="827"><tspan x="89">Sorting them this way shows us something interesting. Animals that are not alike at</tspan><tspan x="89" dy="31">all may still move in the same way, using similar body parts. A housefly and a pigeon</tspan><tspan x="89" dy="31">are very different creatures. But both have wings, and both fly. A fish and a dolphin</tspan><tspan x="89" dy="31">look alike in water, even though a dolphin is not a fish.</tspan></text>
<text class="se-copy" x="89" y="965"><tspan x="89">That is a clue about something you will meet soon in this chapter. The way an animal</tspan><tspan x="89" dy="31">is built has a lot to do with <tspan class="se-italic">where</tspan> it lives.</tspan></text>
<text class="se-copy" x="89" y="1041"><tspan x="89">Movement is not the only way to group animals. We can also group them by what</tspan><tspan x="89" dy="31">they eat, by where they live, or by what covers the body — scales, feathers, fur, or</tspan><tspan x="89" dy="31">nothing at all. As with plants, the best grouping depends on the question we are</tspan><tspan x="89" dy="31">asking.</tspan></text>
