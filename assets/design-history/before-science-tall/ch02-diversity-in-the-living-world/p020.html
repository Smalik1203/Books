<section class="page page--food page--science-editorial" data-folio="20"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1369" aria-label="Diversity in the Living World, page 20"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M31 63Q34 30 60 7"/><path class="se-botanical-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 2</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Diversity in the Living World</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header -->
<rect class="se-prompt" x="89" y="96" width="874" height="98" rx="10"/><text class="se-copy" x="113" y="135"><tspan x="113"><tspan class="se-bold">Think:</tspan> Take any one animal from the desert column. What would happen to it</tspan><tspan x="113" dy="31">in the conditions of the mountain column?</tspan></text>
<text class="se-copy" x="89" y="235"><tspan x="89">Some living things occur in several surroundings; others have a much narrower</tspan><tspan x="89" dy="31">range. Compare the conditions in each column. The features of a living thing help</tspan><tspan x="89" dy="31">explain where it can survive.</tspan></text>
<text class="se-heading" x="89" y="347"><tspan x="89">Built for the Place</tspan></text>
<text class="se-copy" x="89" y="397"><tspan x="89">Look at a plant from a hot desert.</tspan></text>
<text class="se-copy" x="89" y="442"><tspan x="89">Water is hard to find there. The sun is very strong all day. The nights turn cold. A</tspan><tspan x="89" dy="31">cactus meets all this with a thick, fleshy stem. The stem stores water through the</tspan><tspan x="89" dy="31">long dry spells. Its outer surface is tough, so very little water escapes. Its leaves are</tspan><tspan x="89" dy="31">only spines. A spine loses far less water than a wide flat leaf would.</tspan></text>
<text class="se-copy" x="89" y="580"><tspan x="89">Now look at a deodar tree, high in the Himalayas.</tspan></text>
<text class="se-copy" x="89" y="625"><tspan x="89">Here the problem is not heat. It is snow. Snow piling up on branches gets heavy</tspan><tspan x="89" dy="31">enough to break them. A deodar is shaped like a cone. Its branches slope downward</tspan><tspan x="89" dy="31">and bend easily. So the snow slides off instead of piling up.</tspan></text>
<image class="science-illustration" href="../../figures/class-6/science/ch02/desert.png" x="89" y="709" width="874" height="300" preserveAspectRatio="xMidYMid meet"><title>Cactus · hot desert                         Deodar · cold mountain</title></image><text class="se-caption" x="376" y="1037" text-anchor="middle">Cactus · hot desert</text><text class="se-caption" x="676" y="1037" text-anchor="middle">Deodar · cold mountain</text>
<text class="se-copy" x="89" y="1081"><tspan x="89">Neither plant chose its shape. But each one has features that suit the place it grows</tspan><tspan x="89" dy="31">in. Plants without those features do not last long there.</tspan></text>
