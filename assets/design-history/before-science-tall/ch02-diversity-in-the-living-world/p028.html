<text class="se-heading" x="89" y="124"><tspan x="89">Learning Further</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">• Walk around your school with your teacher or the gardener. Label the plants with</tspan><tspan x="89" dy="31">their local names. Make a list in your notebook. Next to each name, write its group —</tspan><tspan x="89" dy="31">herb, shrub, tree, climber or creeper.</tspan></text>
<text class="se-copy" x="89" y="279"><tspan x="89">• Over one term, build a <tspan class="se-bold">class</tspan> <tspan class="se-bold">biodiversity</tspan> <tspan class="se-bold">register</tspan>. Every student adds what they see</tspan><tspan x="89" dy="31">on field visits and on the way to school. Write the date and the place each time. A</tspan><tspan x="89" dy="31">register kept for several years becomes very valuable, because it shows what is</tspan><tspan x="89" dy="31">disappearing.</tspan></text>
<text class="se-copy" x="89" y="415"><tspan x="89">• Talk to the oldest person you know well. Ask which plants, birds and insects were</tspan><tspan x="89" dy="31">common when they were your age. Write down what they say. Then find out what has</tspan><tspan x="89" dy="31">changed in that area since then.</tspan></text>
<text class="se-copy" x="89" y="520"><tspan x="89">• Find out if there is a sacred grove, a protected forest or a bird sanctuary near your</tspan><tspan x="89" dy="31">district. Who protects it? What is it being protected from?</tspan></text>
<text class="se-copy" x="89" y="594"><tspan x="89">• Read about one Indian scientist working on biodiversity today. Write a short</tspan><tspan x="89" dy="31">report. You could start with Divya Mudappa, Vidya Athreya, Uma Ramakrishnan,</tspan><tspan x="89" dy="31">Nandini Velho, Ghazala Shahabuddin, Usha Lachungpa or Divya Karnad.</tspan></text>
<text class="se-copy" x="89" y="699"><tspan x="89">• Grow chana and wheat again. For each kind of seed, keep one tray in bright light</tspan><tspan x="89" dy="31">and another in a dark cupboard. Water all trays equally. Predict what will happen</tspan><tspan x="89" dy="31">before you start. Then record what actually happens.</tspan></text>
