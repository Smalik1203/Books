<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="19"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 19"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124"><tspan x="89">Let Us Enhance Our Learning</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">Answer the questions and complete the tables in your notebook.</tspan></text>
<text class="se-copy" x="89" y="219"><tspan x="89"><tspan class="se-bold">1.</tspan> Fill in the blanks.</tspan></text>
<text class="se-copy" x="89" y="264"><tspan x="89">(i) Unlike poles of two magnets __________ each other, while like poles __________</tspan><tspan x="89" dy="31">each other.</tspan></text>
<text class="se-copy" x="89" y="336"><tspan x="89">(ii) Materials that are pulled towards a magnet are called __________ materials.</tspan></text>
<text class="se-copy" x="89" y="377"><tspan x="89">(iii) The needle of a magnetic compass comes to rest along the __________ direction.</tspan></text>
<text class="se-copy" x="89" y="418"><tspan x="89">(iv) A magnet always has __________ poles.</tspan></text>
<text class="se-copy" x="89" y="459"><tspan x="89"><tspan class="se-bold">2.</tspan> Write True or False.</tspan></text>
<text class="se-copy" x="89" y="504"><tspan x="89">(i) A magnet can be broken to get a piece with only one pole. [ ]</tspan></text>
<text class="se-copy" x="89" y="545"><tspan x="89">(ii) Two North poles brought near each other will push apart. [ ]</tspan></text>
<text class="se-copy" x="89" y="586"><tspan x="89">(iii) Iron filings gather mostly in the middle of a bar magnet. [ ]</tspan></text>
<text class="se-copy" x="89" y="627"><tspan x="89">(iv) A magnet hanging freely comes to rest along the north-south line. [ ]</tspan></text>
<text class="se-copy" x="89" y="668"><tspan x="89">(v) Every metal is a magnetic material. [ ]</tspan></text>
