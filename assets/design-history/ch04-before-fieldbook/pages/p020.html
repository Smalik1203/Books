<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="20"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 20"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-copy" x="89" y="119"><tspan x="89"><tspan class="se-bold">5.</tspan> You are given three metal bars that look exactly alike. Two of them are magnets.</tspan><tspan x="89" dy="31">One is a plain iron bar. You have nothing else to help you. How will you find out</tspan><tspan x="89" dy="31">which one is the plain iron bar?</tspan></text>
<text class="se-copy" x="89" y="226"><tspan x="89"><tspan class="se-bold">6.</tspan> A magnet has no N or S marked on it. You also have a second magnet with its</tspan><tspan x="89" dy="31">poles clearly marked. How will you use the second magnet to find the poles of the</tspan><tspan x="89" dy="31">first?</tspan></text>
<text class="se-copy" x="89" y="333"><tspan x="89"><tspan class="se-bold">7.</tspan> Now suppose you have no second magnet at all. You have only a piece of thread.</tspan><tspan x="89" dy="31">How will you find which end of the unmarked magnet is its North pole?</tspan></text>
<text class="se-copy" x="89" y="409"><tspan x="89"><tspan class="se-bold">8.</tspan> The north end of a compass needle is a North pole. It turns towards the Earth's</tspan><tspan x="89" dy="31">north. But you learnt that like poles repel and unlike poles attract. So what kind of</tspan><tspan x="89" dy="31">magnetic pole must the Earth have near its geographic north? This answer surprises</tspan><tspan x="89" dy="31">most people.</tspan></text>
<text class="se-copy" x="89" y="547"><tspan x="89"><tspan class="se-bold">9.</tspan> A mechanic is repairing a machine in a narrow space. The small steel screws keep</tspan><tspan x="89" dy="31">slipping off his screwdriver and falling inside. Suggest a way to solve his problem,</tspan><tspan x="89" dy="31">using what you have learnt.</tspan></text>
<text class="se-copy" x="89" y="654"><tspan x="89"><tspan class="se-bold">10.</tspan> Two ring magnets, X and Y, are put on a vertical wooden stick, one above the</tspan><tspan x="89" dy="31">other. Magnet X floats above magnet Y and remains suspended. Why? Now suggest a</tspan><tspan x="89" dy="31">way to make X touch Y, without pushing either magnet with your hand.</tspan></text><svg class="science-illustration" x="89" y="738" width="874" height="240" viewBox="0 0 874 240"><rect class="se-process" x="290" y="208" width="290" height="15" rx="3"/><rect class="se-process" x="427" y="14" width="18" height="194" rx="3"/><ellipse class="mg-body" cx="437" cy="88" rx="88" ry="23"/><ellipse class="mg-hole" cx="437" cy="88" rx="20" ry="8"/><ellipse class="mg-body" cx="437" cy="181" rx="88" ry="23"/><ellipse class="mg-hole" cx="437" cy="181" rx="20" ry="8"/><rect class="se-process" x="427" y="14" width="18" height="74" rx="3"/><rect class="se-process" x="427" y="112" width="18" height="69" rx="3"/><text class="se-caption" x="552" y="95" text-anchor="middle">X</text><text class="se-caption" x="552" y="187" text-anchor="middle">Y</text><line class="se-accent" x1="580" y1="109" x2="580" y2="158"/><text class="se-caption" x="621" y="143" text-anchor="middle">Gap</text></svg>
<text class="se-copy" x="89" y="1029"><tspan x="89"><tspan class="se-bold">11.</tspan> Three bar magnets are arranged end to end on a table in a zigzag shape. Each</tspan><tspan x="89" dy="31">pair of neighbouring ends attracts. One end is marked N. Work out whether each of</tspan><tspan x="89" dy="31">the other ends is N or S, and explain the rule you used.</tspan></text><svg class="science-illustration" x="89" y="1113" width="874" height="190" viewBox="0 0 874 190"><g transform="translate(110 70)"><rect class="mg-north" x="0" y="0" width="97.5" height="44" rx="3"/><rect class="mg-south" x="97.5" y="0" width="97.5" height="44" rx="3"/><text class="se-caption" x="20" y="28" text-anchor="middle">1</text><text class="se-caption" x="174" y="28" text-anchor="middle">2</text></g><g transform="translate(326 71) rotate(22)"><rect class="mg-north" x="0" y="0" width="97.5" height="44" rx="3"/><rect class="mg-south" x="97.5" y="0" width="97.5" height="44" rx="3"/><text class="se-caption" x="20" y="28" text-anchor="middle">3</text><text class="se-caption" x="174" y="28" text-anchor="middle">4</text></g><g transform="translate(536 151) rotate(-22)"><rect class="mg-north" x="0" y="0" width="97.5" height="44" rx="3"/><rect class="mg-south" x="97.5" y="0" width="97.5" height="44" rx="3"/><text class="se-caption" x="40" y="28" text-anchor="middle">5 · N</text><text class="se-caption" x="174" y="28" text-anchor="middle">6</text></g><text class="se-caption" x="437" y="36" text-anchor="middle">Neighbouring ends attract. Copy and complete in your notebook.</text></svg><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">20</text></g><!-- /botanical-footer --></svg></div></div></section>
