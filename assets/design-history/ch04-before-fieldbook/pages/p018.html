<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 18"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124"><tspan x="89">Keywords</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">Artificial magnet · Attraction · Bar magnet · Lodestone · Magnetic compass ·</tspan><tspan x="89" dy="31">Magnetic material · Non-magnetic material · North pole · Poles · Repulsion · Ring</tspan><tspan x="89" dy="31">magnet · South pole · U-shaped magnet</tspan></text>
<text class="se-heading" x="89" y="286"><tspan x="89">Summary</tspan></text>
<text class="se-copy" x="89" y="336"><tspan x="89">• A magnet pulls certain materials towards itself. The first magnets were pieces of a</tspan><tspan x="89" dy="31">rock called lodestone, found in the ground. The magnets we use today are made by</tspan><tspan x="89" dy="31">people.</tspan></text>
<text class="se-copy" x="89" y="441"><tspan x="89">• Materials pulled towards a magnet are called magnetic materials. Iron, nickel,</tspan><tspan x="89" dy="31">cobalt and many kinds of steel are magnetic. Materials not pulled towards a magnet</tspan><tspan x="89" dy="31">are non-magnetic. Not every metal is magnetic.</tspan></text>
<text class="se-copy" x="89" y="546"><tspan x="89">• A bar magnet pulls most strongly near its two ends, called the North pole and the</tspan><tspan x="89" dy="31">South pole.</tspan></text>
<text class="se-copy" x="89" y="620"><tspan x="89">• Poles always come in pairs. Break a magnet and each piece has both poles. Each</tspan><tspan x="89" dy="31">broken piece still has both poles.</tspan></text>
<text class="se-copy" x="89" y="694"><tspan x="89">• A magnet that is free to turn always comes to rest along the north-south line. This</tspan><tspan x="89" dy="31">happens because the Earth itself behaves like a giant magnet.</tspan></text>
<text class="se-copy" x="89" y="768"><tspan x="89">• A magnetic compass uses this. Its needle is a magnet that can turn freely, so it</tspan><tspan x="89" dy="31">settles along the north-south line and shows us direction.</tspan></text>
<text class="se-copy" x="89" y="842"><tspan x="89">• Unlike poles attract each other. Like poles repel each other.</tspan></text>
<text class="se-copy" x="89" y="885"><tspan x="89">• A magnet attracts plain iron as well, so attraction does not prove that something is</tspan><tspan x="89" dy="31">a magnet. Only a magnet can repel another magnet, so repulsion is the sure test.</tspan></text>
<text class="se-copy" x="89" y="959"><tspan x="89">• The effect of a magnet passes through non-magnetic materials such as wood,</tspan><tspan x="89" dy="31">cardboard, plastic and glass.</tspan></text>
<text class="se-copy" x="89" y="1033"><tspan x="89">Check the evidence behind each idea. For magnetic materials, recall the object test.</tspan><tspan x="89" dy="31">For pole strength, recall the filings. For direction, recall the freely hanging magnet.</tspan><tspan x="89" dy="31">For attraction and repulsion, recall the two magnets on pencils.</tspan></text>
<text class="se-copy" x="89" y="1140"><tspan x="89">Explain these differences to a partner: a magnet and a magnetic material; attraction</tspan><tspan x="89" dy="31">and repulsion; a prediction and an observation. Give one example from an activity for</tspan><tspan x="89" dy="31">each pair.</tspan></text>
<text class="se-copy" x="89" y="1247"><tspan x="89">Finally, choose one result that surprised you. State what you predicted, what you</tspan><tspan x="89" dy="31">observed and how the observation changed your explanation. Use the result itself as</tspan><tspan x="89" dy="31">your reason.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">18</text></g><!-- /botanical-footer --></svg></div></div></section>
