<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 10"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124"><tspan x="89">Make Your Own Compass</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">You do not need to buy a compass. You can make one.</tspan></text>
<rect class="se-activity-panel" x="89" y="210" width="874" height="1094" rx="20"/><rect class="se-activity-tab" x="89" y="196" width="372" height="40" rx="12"/><text class="se-activity-tab-text" x="107" y="224" text-anchor="start">Activity 4.4 · A Compass in a Bowl</text><text class="se-copy" x="113" y="276"><tspan x="113"><tspan class="se-bold">You</tspan> <tspan class="se-bold">will</tspan> <tspan class="se-bold">need:</tspan> a steel sewing needle, a bar magnet, a small piece of cork, a bowl</tspan><tspan x="113" dy="31">of water, a few steel pins.</tspan></text><text class="se-activity-step" x="130" y="350" text-anchor="end">1.</text><text class="se-copy" x="146" y="350"><tspan x="146">Lay the needle flat on a wooden table.</tspan></text><text class="se-activity-step" x="130" y="393" text-anchor="end">2.</text><text class="se-copy" x="146" y="393"><tspan x="146">Hold one pole of the bar magnet at one end of the needle. Press lightly and</tspan><tspan x="146" dy="31">slide it along the needle to the other end.</tspan></text><text class="se-activity-step" x="130" y="467" text-anchor="end">3.</text><text class="se-copy" x="146" y="467"><tspan x="146">At the end of the needle, <tspan class="se-bold">lift</tspan> <tspan class="se-bold">the</tspan> <tspan class="se-bold">magnet</tspan> <tspan class="se-bold">right</tspan> <tspan class="se-bold">up</tspan> and away.</tspan></text><text class="se-activity-step" x="130" y="510" text-anchor="end">4.</text><text class="se-copy" x="146" y="510"><tspan x="146">Bring the same pole back to the same starting end. Slide it along again in the</tspan><tspan x="146" dy="31">same direction.</tspan></text><text class="se-activity-step" x="130" y="584" text-anchor="end">5.</text><text class="se-copy" x="146" y="584"><tspan x="146">Repeat this thirty to forty times. Always stroke in one direction only. Always</tspan><tspan x="146" dy="31">lift the magnet clear at the end of each stroke.</tspan></text><text class="se-activity-step" x="130" y="658" text-anchor="end">6.</text><text class="se-copy" x="146" y="658"><tspan x="146">Test the needle. Bring it near some steel pins. If the pins cling to it, the</tspan><tspan x="146" dy="31">needle has become a magnet.</tspan></text><text class="se-activity-step" x="130" y="732" text-anchor="end">7.</text><text class="se-copy" x="146" y="732"><tspan x="146">Ask an adult to secure the needle flat on top of the cork with a small piece of</tspan><tspan x="146" dy="31">tape, so it stays level.</tspan></text><text class="se-activity-step" x="130" y="806" text-anchor="end">8.</text><text class="se-copy" x="146" y="806"><tspan x="146">Float the cork in the bowl of water. The needle should stay above the water.</tspan></text><text class="se-activity-step" x="130" y="849" text-anchor="end">9.</text><text class="se-copy" x="146" y="849"><tspan x="146">Wait for it to stop turning.</tspan></text><text class="se-copy" x="113" y="892"><tspan x="113"><tspan class="se-bold">Observe:</tspan> Note which way each end of the needle points. Now spin the cork</tspan><tspan x="113" dy="31">gently and let it settle again. Do the ends point the same way as before?</tspan></text><text class="se-copy" x="113" y="966"><tspan x="113"><tspan class="se-bold">Safety:</tspan> Sewing needles are sharp. Ask an adult to tape the needle to the cork.</tspan><tspan x="113" dy="31">Keep its point away from hands.</tspan></text><svg class="science-illustration" x="113" y="1017" width="826" height="240" viewBox="0 0 874 240"><rect class="mg-north" x="75" y="40" width="67.5" height="40" rx="3"/><rect class="mg-south" x="142.5" y="40" width="67.5" height="40" rx="3"/><text class="se-caption" x="100" y="66" text-anchor="middle">N</text><text class="se-caption" x="185" y="66" text-anchor="middle">S</text><line class="se-accent" x1="60" y1="112" x2="275" y2="112"/><path class="se-accent" d="M92 87h133m-10 -7l10 7l-10 7"/><text class="se-caption" x="185" y="192" text-anchor="middle">Stroke in one direction; lift to return.</text><ellipse class="se-process" cx="640" cy="116" rx="148" ry="67"/><rect class="se-process" x="601" y="93" width="79" height="42" rx="3"/><line class="se-accent" x1="546" y1="114" x2="735" y2="114"/><text class="se-caption" x="640" y="217" text-anchor="middle">Needle taped onto cork</text></svg><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">10</text></g><!-- /botanical-footer --></svg></div></div></section>
