<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 2"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124"><tspan x="89">Magnets Around You</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">You have already met magnets many times, even if you did not notice them.</tspan></text>
<text class="se-copy" x="89" y="219"><tspan x="89">Some pencil boxes shut with a soft click. A magnet is doing that. The duster on a</tspan><tspan x="89" dy="31">writing board may stay stuck to the board. A magnet is doing that too. Fridge doors,</tspan><tspan x="89" dy="31">cupboard doors, purses, toys, stickers — all of these may have magnets hidden in</tspan><tspan x="89" dy="31">them.</tspan></text>
<text class="se-copy" x="89" y="357"><tspan x="89">A magnet is a thing that pulls certain materials towards itself.</tspan></text>
<text class="se-copy" x="89" y="402"><tspan x="89">The first magnets were not made by people. They were found in the ground. They are</tspan><tspan x="89" dy="31">pieces of a special rock called <tspan class="se-bold">lodestone</tspan>. A piece of lodestone pulls small bits of iron</tspan><tspan x="89" dy="31">towards it. People discovered this a very long time ago.</tspan></text>
<text class="se-copy" x="89" y="509"><tspan x="89">Later, people learnt to make magnets from pieces of iron. Today magnets are made</tspan><tspan x="89" dy="31">from several different materials.</tspan></text>
<text class="se-copy" x="89" y="585"><tspan x="89">The magnets in your school laboratory are made by people. So are the ones in pencil</tspan><tspan x="89" dy="31">boxes and toys. All of these are <tspan class="se-bold">artificial</tspan> <tspan class="se-bold">magnets</tspan>.</tspan></text>
<text class="se-copy" x="89" y="661"><tspan x="89">Magnets are made in many shapes. Each shape suits a different job.</tspan></text>
<svg class="science-illustration" x="89" y="683" width="874" height="200" viewBox="0 0 874 200"><rect class="mg-north" x="25" y="62" width="77.5" height="48" rx="3"/><rect class="mg-south" x="102.5" y="62" width="77.5" height="48" rx="3"/><text class="se-caption" x="50" y="92" text-anchor="middle">N</text><text class="se-caption" x="155" y="92" text-anchor="middle">S</text><text class="se-caption" x="102" y="158" text-anchor="middle">Bar</text><path class="mg-body" d="M235 35v60q0 42 40 42t40 -42V35h-24v60q0 18 -16 18t-16 -18V35Z"/><text class="se-caption" x="247" y="57" text-anchor="middle">N</text><text class="se-caption" x="303" y="57" text-anchor="middle">S</text><text class="se-caption" x="275" y="175" text-anchor="middle">U-shaped</text><ellipse class="mg-body" cx="435" cy="85" rx="57" ry="35"/><ellipse class="mg-hole" cx="435" cy="85" rx="27" ry="15"/><text class="se-caption" x="435" y="158" text-anchor="middle">Ring</text><ellipse class="mg-body" cx="600" cy="85" rx="52" ry="30"/><text class="se-caption" x="600" y="158" text-anchor="middle">Disc</text><rect class="mg-body" x="731" y="57" width="85" height="62" rx="3"/><ellipse class="mg-body" cx="773" cy="57" rx="42" ry="18"/><text class="se-caption" x="773" y="158" text-anchor="middle">Cylinder</text></svg>
<rect class="se-prompt" x="89" y="911" width="874" height="98" rx="10"/><text class="se-copy" x="113" y="950"><tspan x="113"><tspan class="se-bold">Think:</tspan> Look around your classroom and your home. Where can you find a</tspan><tspan x="113" dy="31">magnet doing a job?</tspan></text>
<text class="se-copy" x="89" y="1050"><tspan x="89">A magnet’s shape gives a clue to its use. A long bar is easy to hold and turn. A ring</tspan><tspan x="89" dy="31">can slide over a rod. Shape alone, however, does not tell you how strong a magnet is.</tspan><tspan x="89" dy="31">Compare what the magnets can actually do.</tspan></text>
<text class="se-copy" x="89" y="1157"><tspan x="89">The drawings show shapes, not actual sizes. The N and S markings identify poles; the</tspan><tspan x="89" dy="31">paint itself does not make a magnet work.</tspan></text>
<text class="se-copy" x="89" y="1233"><tspan x="89">A fridge seal can contain a flexible magnetic strip. A school bar magnet is rigid.</tspan><tspan x="89" dy="31">These are different designs, but both use magnetic attraction to do a job. Look for</tspan><tspan x="89" dy="31">the material the magnet pulls on as well as the magnet itself.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">2</text></g><!-- /botanical-footer --></svg></div></div></section>
