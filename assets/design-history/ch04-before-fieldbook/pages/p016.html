<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 16"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124"><tspan x="89">4.5 Things to Try</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">Now that you know how magnets behave, here are some things to make and try.</tspan><tspan x="89" dy="31">Work out for yourself why each one works.</tspan></text>
<text class="se-copy" x="89" y="250"><tspan x="89"><tspan class="se-bold">A</tspan> <tspan class="se-bold">magnetic</tspan> <tspan class="se-bold">garland.</tspan> Hold a bar magnet above a heap of steel U-clips. Touch one clip</tspan><tspan x="89" dy="31">to the magnet. Now touch a second clip to the first one. Keep going. How long a</tspan><tspan x="89" dy="31">chain can you hang?</tspan></text>
<text class="se-copy" x="89" y="357"><tspan x="89"><tspan class="se-bold">A</tspan> <tspan class="se-bold">ball</tspan> <tspan class="se-bold">in</tspan> <tspan class="se-bold">a</tspan> <tspan class="se-bold">maze.</tspan> Draw a maze on a sheet of card and glue thin strips along the lines</tspan><tspan x="89" dy="31">to make walls. Put a small steel ball inside. Now hold a magnet under the card and</tspan><tspan x="89" dy="31">move it. Can you steer the ball out without touching it?</tspan></text>
<text class="se-copy" x="89" y="464"><tspan x="89"><tspan class="se-bold">A</tspan> <tspan class="se-bold">clip</tspan> <tspan class="se-bold">in</tspan> <tspan class="se-bold">water.</tspan> Drop a steel paper clip into a glass of water. Get it out using a</tspan><tspan x="89" dy="31">magnet, without wetting your fingers or the magnet.</tspan></text>
<text class="se-copy" x="89" y="540"><tspan x="89"><tspan class="se-bold">Two</tspan> <tspan class="se-bold">racing</tspan> <tspan class="se-bold">cars.</tspan> Glue a bar magnet on top of each of two matchbox cars. Push them</tspan><tspan x="89" dy="31">towards each other. Now turn one magnet around and try again. What changes?</tspan></text>
<svg class="science-illustration" x="89" y="593" width="874" height="330" viewBox="0 0 874 330"><rect class="mg-north" x="90" y="15" width="60" height="35" rx="3"/><rect class="mg-south" x="150" y="15" width="60" height="35" rx="3"/><text class="se-caption" x="115" y="38.5" text-anchor="middle">N</text><text class="se-caption" x="185" y="38.5" text-anchor="middle">S</text><ellipse class="se-accent" cx="150" cy="62" rx="7" ry="15"/><ellipse class="se-accent" cx="150" cy="83" rx="7" ry="15"/><ellipse class="se-accent" cx="150" cy="104" rx="7" ry="15"/><ellipse class="se-accent" cx="150" cy="125" rx="7" ry="15"/><text class="se-caption" x="170" y="166" text-anchor="middle">(a) Clip chain</text><rect class="se-process" x="465" y="18" width="250" height="110" rx="3"/><path class="se-accent" d="M500 18v70h80V50h95v78"/><circle class="mg-body" cx="485" cy="38" r="8"/><rect class="mg-north" x="735" y="70" width="50" height="30" rx="3"/><rect class="mg-south" x="785" y="70" width="50" height="30" rx="3"/><text class="se-caption" x="760" y="91" text-anchor="middle">N</text><text class="se-caption" x="810" y="91" text-anchor="middle">S</text><text class="se-caption" x="645" y="166" text-anchor="middle">(b) Magnet beneath a maze</text><rect class="se-process" x="100" y="205" width="110" height="84" rx="3"/><line class="se-accent" x1="110" y1="230" x2="200" y2="230"/><ellipse class="se-accent" cx="195" cy="251" rx="5" ry="12"/><rect class="mg-north" x="220" y="220" width="47.5" height="32" rx="3"/><rect class="mg-south" x="267.5" y="220" width="47.5" height="32" rx="3"/><text class="se-caption" x="245" y="242" text-anchor="middle">N</text><text class="se-caption" x="290" y="242" text-anchor="middle">S</text><text class="se-caption" x="207" y="323" text-anchor="middle">(c) Clip through glass</text><rect class="se-process" x="495" y="237" width="105" height="35" rx="3"/><rect class="se-process" x="719" y="237" width="105" height="35" rx="3"/><rect class="mg-north" x="500" y="207" width="47.5" height="30" rx="3"/><rect class="mg-south" x="547.5" y="207" width="47.5" height="30" rx="3"/><text class="se-caption" x="525" y="228" text-anchor="middle">N</text><text class="se-caption" x="570" y="228" text-anchor="middle">S</text><rect class="mg-north" x="724" y="207" width="47.5" height="30" rx="3"/><rect class="mg-south" x="771.5" y="207" width="47.5" height="30" rx="3"/><text class="se-caption" x="749" y="228" text-anchor="middle">N</text><text class="se-caption" x="794" y="228" text-anchor="middle">S</text><circle class="mg-body" cx="514" cy="278" r="11"/><circle class="mg-body" cx="580" cy="278" r="11"/><circle class="mg-body" cx="738" cy="278" r="11"/><circle class="mg-body" cx="804" cy="278" r="11"/><text class="se-caption" x="661" y="323" text-anchor="middle">(d) Magnetic cars</text></svg>
<rect class="se-prompt" x="89" y="951" width="874" height="98" rx="10"/><text class="se-copy" x="113" y="990"><tspan x="113"><tspan class="se-bold">Think:</tspan> In the maze and in the glass of water, the magnet never touches the</tspan><tspan x="113" dy="31">thing it moves. Which activity in this chapter already explained that?</tspan></text>
<text class="se-copy" x="89" y="1090"><tspan x="89">In each game, name the object that feels the magnetic force. The card, water or glass</tspan><tspan x="89" dy="31">can lie between the magnet and that object. Moving the magnet farther away may</tspan><tspan x="89" dy="31">make the effect too weak to move the object, even when the material between them</tspan><tspan x="89" dy="31">has not changed.</tspan></text>
<text class="se-copy" x="89" y="1228"><tspan x="89">For the racing cars, identify the two ends that face each other before you let the cars</tspan><tspan x="89" dy="31">move. Then turn just one magnet around. This changes the facing poles while</tspan><tspan x="89" dy="31">keeping the cars and their wheels the same.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">16</text></g><!-- /botanical-footer --></svg></div></div></section>
