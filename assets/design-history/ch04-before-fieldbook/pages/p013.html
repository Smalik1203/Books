<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 13"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124"><tspan x="89">Like Poles and Unlike Poles</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">The result is always the same.</tspan></text>
<text class="se-copy" x="89" y="219"><tspan x="89">When the North pole of one magnet faces the South pole of another, the two are</tspan><tspan x="89" dy="31">pulled together. This pulling together is called <tspan class="se-bold">attraction</tspan>.</tspan></text>
<text class="se-copy" x="89" y="295"><tspan x="89">When two North poles face each other, they push apart. Two South poles do the</tspan><tspan x="89" dy="31">same. This pushing apart is called <tspan class="se-bold">repulsion</tspan>.</tspan></text>
<text class="se-copy" x="89" y="371"><tspan x="89">So we can say it simply:</tspan></text>
<text class="se-copy" x="89" y="416"><tspan x="89">• <tspan class="se-bold">Unlike</tspan> <tspan class="se-bold">poles</tspan> <tspan class="se-bold">attract.</tspan> North and South pull together.</tspan></text>
<text class="se-copy" x="89" y="459"><tspan x="89">• <tspan class="se-bold">Like</tspan> <tspan class="se-bold">poles</tspan> <tspan class="se-bold">repel.</tspan> North and North push apart. South and South push apart.</tspan></text>
<text class="se-copy" x="89" y="502"><tspan x="89">Now repeat the activity, but use a plain iron bar in place of magnet B.</tspan></text>
<text class="se-copy" x="89" y="547"><tspan x="89">Something different happens. The iron bar attracts magnet A whichever end you use.</tspan><tspan x="89" dy="31">It never pushes it away.</tspan></text>
<text class="se-copy" x="89" y="623"><tspan x="89">This is more useful than it looks. Think carefully about what it means.</tspan></text>
<text class="se-copy" x="89" y="668"><tspan x="89">A magnet attracts a plain piece of iron. A magnet also attracts the unlike pole of</tspan><tspan x="89" dy="31">another magnet. So attraction alone cannot tell you whether the thing in your hand is</tspan><tspan x="89" dy="31">a magnet or just a piece of iron. Both would attract.</tspan></text>
<text class="se-copy" x="89" y="775"><tspan x="89">But only a magnet can push another magnet away. A plain piece of iron never repels</tspan><tspan x="89" dy="31">anything.</tspan></text>
<text class="se-copy" x="89" y="851"><tspan x="89">For the magnets and plain iron bars in these experiments, repulsion is the sure test.</tspan><tspan x="89" dy="31"><tspan class="se-bold">A</tspan> <tspan class="se-bold">bar</tspan> <tspan class="se-bold">that</tspan> <tspan class="se-bold">repels</tspan> <tspan class="se-bold">one</tspan> <tspan class="se-bold">pole</tspan> <tspan class="se-bold">of</tspan> <tspan class="se-bold">a</tspan> <tspan class="se-bold">magnet</tspan> <tspan class="se-bold">is</tspan> <tspan class="se-bold">itself</tspan> <tspan class="se-bold">magnetised.</tspan></tspan></text>
<svg class="science-illustration" x="89" y="904" width="874" height="260" viewBox="0 0 874 260"><rect class="mg-north" x="35" y="35" width="80" height="48" rx="3"/><rect class="mg-south" x="115" y="35" width="80" height="48" rx="3"/><text class="se-caption" x="60" y="65" text-anchor="middle">N</text><text class="se-caption" x="170" y="65" text-anchor="middle">S</text><rect class="mg-north" x="270" y="35" width="80" height="48" rx="3"/><rect class="mg-south" x="350" y="35" width="80" height="48" rx="3"/><text class="se-caption" x="295" y="65" text-anchor="middle">N</text><text class="se-caption" x="405" y="65" text-anchor="middle">S</text><path class="se-accent" d="M205 60h52m-10 -7l10 7l-10 7"/><text class="se-caption" x="232" y="126" text-anchor="middle">Unlike poles attract</text><rect class="mg-south" x="465" y="35" width="80" height="48" rx="3"/><rect class="mg-north" x="545" y="35" width="80" height="48" rx="3"/><text class="se-caption" x="490" y="65" text-anchor="middle">S</text><text class="se-caption" x="600" y="65" text-anchor="middle">N</text><rect class="mg-north" x="710" y="35" width="70" height="48" rx="3"/><rect class="mg-south" x="780" y="35" width="70" height="48" rx="3"/><text class="se-caption" x="735" y="65" text-anchor="middle">N</text><text class="se-caption" x="825" y="65" text-anchor="middle">S</text><path class="se-accent" d="M698 60h-57m10 -7l-10 7l10 7"/><text class="se-caption" x="667" y="126" text-anchor="middle">Like poles repel</text><circle class="se-accent" cx="60" cy="94" r="10"/><circle class="se-accent" cx="105" cy="94" r="10"/><circle class="se-accent" cx="150" cy="94" r="10"/><circle class="se-accent" cx="490" cy="94" r="10"/><circle class="se-accent" cx="535" cy="94" r="10"/><circle class="se-accent" cx="580" cy="94" r="10"/><text class="se-caption" x="437" y="200" text-anchor="middle">Round pencils allow the first magnet to move.</text></svg>
<text class="se-copy" x="89" y="1215"><tspan x="89">Test both ends. If the first end attracts, turn the test bar around and try its other end</tspan><tspan x="89" dy="31">against the same pole of your known magnet. Repulsion in either trial identifies a</tspan><tspan x="89" dy="31">magnet. This is why a single observation of attraction is not enough.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">13</text></g><!-- /botanical-footer --></svg></div></div></section>
