<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 3"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124"><tspan x="89">4.1 Magnetic and Non-magnetic Materials</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">Bring a magnet near a steel pin and the pin jumps to it. Bring the same magnet near</tspan><tspan x="89" dy="31">a rubber eraser and nothing happens.</tspan></text>
<text class="se-copy" x="89" y="250"><tspan x="89">So a magnet does not pull everything. It pulls only some things. Which ones?</tspan></text>
<rect class="se-activity-panel" x="89" y="286" width="874" height="633" rx="20"/><rect class="se-activity-tab" x="89" y="272" width="475" height="40" rx="12"/><text class="se-activity-tab-text" x="107" y="300" text-anchor="start">Activity 4.1 · What Sticks and What Does Not</text><text class="se-copy" x="113" y="352"><tspan x="113"><tspan class="se-bold">You</tspan> <tspan class="se-bold">will</tspan> <tspan class="se-bold">need:</tspan> a magnet, and many small objects made of different materials —</tspan><tspan x="113" dy="31">a pencil, an eraser, a steel paper clip, a plastic scale, an iron nail, a glass marble,</tspan><tspan x="113" dy="31">a coin, a piece of cloth, a key, a rubber band, a piece of wood, a sharpener.</tspan></text><text class="se-activity-step" x="130" y="457" text-anchor="end">1.</text><text class="se-copy" x="146" y="457"><tspan x="146">Look at each object. Write down what material it is made of.</tspan></text><text class="se-activity-step" x="130" y="500" text-anchor="end">2.</text><text class="se-copy" x="146" y="500"><tspan x="146"><tspan class="se-bold">Now</tspan> <tspan class="se-bold">predict.</tspan> Before you test anything, write down whether you think it will</tspan><tspan x="146" dy="31">stick to the magnet. Write Yes or No for every object.</tspan></text><text class="se-activity-step" x="130" y="574" text-anchor="end">3.</text><text class="se-copy" x="146" y="574"><tspan x="146">Only after all your predictions are written, bring the magnet near each</tspan><tspan x="146" dy="31">object, one by one.</tspan></text><text class="se-activity-step" x="130" y="648" text-anchor="end">4.</text><text class="se-copy" x="146" y="648"><tspan x="146">Write down what really happened.</tspan></text><text class="se-copy" x="113" y="691"><tspan x="113"><tspan class="se-bold">Observe:</tspan> Compare the two columns. Where were you right? Where were you</tspan><tspan x="113" dy="31">wrong?</tspan></text><text class="se-copy" x="113" y="765"><tspan x="113"><tspan class="se-bold">Think:</tspan> Look only at the objects that stuck. What do those objects have in</tspan><tspan x="113" dy="31">common?</tspan></text><text class="se-copy" x="113" y="839"><tspan x="113"><tspan class="se-bold">Safety:</tspan> Keep small magnets and objects away from young children. Never put a</tspan><tspan x="113" dy="31">magnet in your mouth.</tspan></text>
<text class="se-copy" x="89" y="961"><tspan x="89">Test a part of the object whose material you know. A pencil may have a metal ferrule,</tspan><tspan x="89" dy="31">and a sharpener may have a steel blade inside a plastic body. If only one part sticks,</tspan><tspan x="89" dy="31">record that part rather than calling the whole object magnetic.</tspan></text>
<text class="se-copy" x="89" y="1068"><tspan x="89">A prediction is your idea before a test. An observation is what you actually see. Keep</tspan><tspan x="89" dy="31">both entries, even when they disagree: that difference is something you have learnt.</tspan></text>
<text class="se-copy" x="89" y="1144"><tspan x="89">An object that does not stick may simply be too far from the magnet. Bring the</tspan><tspan x="89" dy="31">magnet close without forcing the object against it. If a result surprises you, repeat</tspan><tspan x="89" dy="31">the test and compare it with a known steel paper clip.</tspan></text>
<text class="se-copy" x="89" y="1251"><tspan x="89">Record what you tested precisely: “steel blade” is more useful than “sharpener”.</tspan><tspan x="89" dy="31">Another group can then repeat your test on the same material.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">3</text></g><!-- /botanical-footer --></svg></div></div></section>
