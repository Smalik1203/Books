<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 4"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-copy" x="89" y="119"><tspan x="89">Copy these headings into your notebook and record your observations.</tspan></text>
<rect class="se-table-band" x="89" y="137" width="874" height="40" rx="3"/><rect class="se-table-number" x="89" y="137" width="149" height="40" rx="3"/><text class="se-caption se-table-number-text" x="109" y="164">Table 4.1</text><text class="se-caption se-bold" x="260" y="164">Which materials does a magnet pull?</text><rect class="se-table-head" x="89" y="183" width="874" height="47"/><line class="se-rule" x1="89" x2="963" y1="230" y2="230"/><text class="se-copy se-table-copy se-bold" x="101" y="210.4"><tspan x="101">Object</tspan></text><text class="se-copy se-table-copy se-bold" x="319.5" y="210.4"><tspan x="319.5">Material</tspan></text><text class="se-copy se-table-copy se-bold" x="538" y="210.4"><tspan x="538">Prediction</tspan></text><text class="se-copy se-table-copy se-bold" x="756.5" y="210.4"><tspan x="756.5">Observation</tspan></text><line class="se-rule" x1="89" x2="963" y1="277" y2="277"/><text class="se-copy se-table-copy" x="101" y="257.4"><tspan x="101">Pencil</tspan></text><text class="se-copy se-table-copy" x="319.5" y="257.4"><tspan x="319.5">Wood</tspan></text><text class="se-copy se-table-copy" x="538" y="257.4"><tspan x="538">—</tspan></text><text class="se-copy se-table-copy" x="756.5" y="257.4"><tspan x="756.5">—</tspan></text><line class="se-rule" x1="89" x2="963" y1="324" y2="324"/><text class="se-copy se-table-copy" x="101" y="304.4"><tspan x="101">Eraser</tspan></text><text class="se-copy se-table-copy" x="319.5" y="304.4"><tspan x="319.5">Rubber</tspan></text><text class="se-copy se-table-copy" x="538" y="304.4"><tspan x="538">—</tspan></text><text class="se-copy se-table-copy" x="756.5" y="304.4"><tspan x="756.5">—</tspan></text><line class="se-rule" x1="89" x2="963" y1="371" y2="371"/><text class="se-copy se-table-copy" x="101" y="351.4"><tspan x="101">Paper clip</tspan></text><text class="se-copy se-table-copy" x="319.5" y="351.4"><tspan x="319.5">Steel</tspan></text><text class="se-copy se-table-copy" x="538" y="351.4"><tspan x="538">—</tspan></text><text class="se-copy se-table-copy" x="756.5" y="351.4"><tspan x="756.5">—</tspan></text>
<text class="se-copy" x="89" y="408"><tspan x="89">Now read down the last two columns.</tspan></text>
<text class="se-copy" x="89" y="453"><tspan x="89">Some objects were pulled towards the magnet and stuck to it. Others were not pulled</tspan><tspan x="89" dy="31">at all.</tspan></text>
<text class="se-copy" x="89" y="529"><tspan x="89">Materials that are pulled towards a magnet are called <tspan class="se-bold">magnetic</tspan> <tspan class="se-bold">materials</tspan>.</tspan></text>
<text class="se-copy" x="89" y="574"><tspan x="89">Iron is a magnetic material. Steel is made mostly of iron. Many kinds of steel are</tspan><tspan x="89" dy="31">magnetic, though some stainless steels are not. That is why a steel paper clip sticks.</tspan><tspan x="89" dy="31">Two other metals, <tspan class="se-bold">nickel</tspan> and <tspan class="se-bold">cobalt</tspan>, are also magnetic. So are some mixtures of</tspan><tspan x="89" dy="31">these metals with others.</tspan></text>
<text class="se-copy" x="89" y="712"><tspan x="89">Materials that are not pulled towards a magnet are called <tspan class="se-bold">non-magnetic</tspan> <tspan class="se-bold">materials</tspan>.</tspan><tspan x="89" dy="31">Wood, rubber, plastic, glass, paper and cloth are all non-magnetic.</tspan></text>
<text class="se-copy" x="89" y="788"><tspan x="89">Here is something worth noticing. Not every metal is magnetic. Try a magnet on an</tspan><tspan x="89" dy="31">aluminium vessel or a copper wire. Neither will stick. So &quot;metal&quot; and &quot;magnetic&quot; do</tspan><tspan x="89" dy="31">not mean the same thing.</tspan></text>
<rect class="se-prompt" x="89" y="872" width="874" height="67" rx="10"/><text class="se-copy" x="113" y="911"><tspan x="113"><tspan class="se-bold">Think:</tspan> Which materials in your table were non-magnetic?</tspan></text>
<text class="se-copy" x="89" y="980"><tspan x="89">Coins and keys can give different results because they are made from different</tspan><tspan x="89" dy="31">metals or mixtures. Test your own examples rather than guessing from their colour.</tspan><tspan x="89" dy="31">A shiny surface does not tell you whether the material underneath is magnetic.</tspan></text>
<text class="se-copy" x="89" y="1087"><tspan x="89">Compare two objects using the same magnet at the same distance. If you change</tspan><tspan x="89" dy="31">both the object and the magnet, you cannot tell which change caused a different</tspan><tspan x="89" dy="31">result.</tspan></text>
<text class="se-copy" x="89" y="1194"><tspan x="89">A non-magnetic covering can hide a magnetic material. For example, a plastic-coated</tspan><tspan x="89" dy="31">steel clip may still be attracted. This does not show that the plastic is magnetic; it</tspan><tspan x="89" dy="31">shows that the magnet can act on the steel inside.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">4</text></g><!-- /botanical-footer --></svg></div></div></section>
