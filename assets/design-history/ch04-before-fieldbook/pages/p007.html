<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 7"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124"><tspan x="89">4.3 Finding Directions</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">We can now go back to the sailors in the storm.</tspan></text>
<rect class="se-activity-panel" x="89" y="210" width="874" height="870" rx="20"/><rect class="se-activity-tab" x="89" y="196" width="392" height="40" rx="12"/><text class="se-activity-tab-text" x="107" y="224" text-anchor="start">Activity 4.3 · Let the Magnet Choose</text><text class="se-copy" x="113" y="276"><tspan x="113"><tspan class="se-bold">You</tspan> <tspan class="se-bold">will</tspan> <tspan class="se-bold">need:</tspan> a bar magnet, thread, a table or a stand, a sheet of paper.</tspan></text><text class="se-activity-step" x="130" y="319" text-anchor="end">1.</text><text class="se-copy" x="146" y="319"><tspan x="146">Tie the thread around the middle of the bar magnet.</tspan></text><text class="se-activity-step" x="130" y="362" text-anchor="end">2.</text><text class="se-copy" x="146" y="362"><tspan x="146">Hang it from the edge of a table, or from a stand. Move the thread a little</tspan><tspan x="146" dy="31">until the magnet hangs level.</tspan></text><text class="se-activity-step" x="130" y="436" text-anchor="end">3.</text><text class="se-copy" x="146" y="436"><tspan x="146">Make sure nothing made of iron or steel is nearby. Move away steel chairs,</tspan><tspan x="146" dy="31">keys and pencil boxes.</tspan></text><text class="se-activity-step" x="130" y="510" text-anchor="end">4.</text><text class="se-copy" x="146" y="510"><tspan x="146">Wait until the magnet stops turning on its own.</tspan></text><text class="se-activity-step" x="130" y="553" text-anchor="end">5.</text><text class="se-copy" x="146" y="553"><tspan x="146">On the floor below, mark the spot under each end of the magnet. Join the two</tspan><tspan x="146" dy="31">marks with a straight line.</tspan></text><text class="se-activity-step" x="130" y="627" text-anchor="end">6.</text><text class="se-copy" x="146" y="627"><tspan x="146">Now give the magnet a gentle push so that it spins. Wait until it stops again.</tspan></text><text class="se-copy" x="113" y="670"><tspan x="113"><tspan class="se-bold">Observe:</tspan> Does it stop along the same line as before? Try it four or five times.</tspan></text><text class="se-copy" x="113" y="713"><tspan x="113"><tspan class="se-bold">Predict:</tspan> Before you push it a sixth time, say out loud where it will stop.</tspan></text><svg class="science-illustration" x="113" y="733" width="826" height="300" viewBox="0 0 874 300"><line class="se-accent" x1="130" y1="28" x2="690" y2="28"/><line class="se-accent" x1="690" y1="28" x2="690" y2="258"/><line class="se-accent" x1="437" y1="28" x2="437" y2="116"/><rect class="mg-north" x="317" y="116" width="120" height="48" rx="3"/><rect class="mg-south" x="437" y="116" width="120" height="48" rx="3"/><text class="se-caption" x="342" y="146" text-anchor="middle">N</text><text class="se-caption" x="532" y="146" text-anchor="middle">S</text><line class="se-accent" x1="285" y1="241" x2="588" y2="241"/><text class="se-caption" x="253" y="247" text-anchor="middle">North</text><text class="se-caption" x="628" y="247" text-anchor="middle">South</text><text class="se-caption" x="485" y="84" text-anchor="middle">Thread</text><text class="se-caption" x="437" y="289" text-anchor="middle">The magnet must turn freely.</text></svg>
<text class="se-copy" x="89" y="1122"><tspan x="89">Let the magnet turn without touching the table, floor or stand. A twisted thread can</tspan><tspan x="89" dy="31">pull it away from its resting direction. If the result changes between trials, check the</tspan><tspan x="89" dy="31">suspension and remove nearby magnetic objects before deciding that the magnet</tspan><tspan x="89" dy="31">behaves differently.</tspan></text>
<text class="se-copy" x="89" y="1260"><tspan x="89">Repeated observations are useful because one trial can be disturbed. Draw the line</tspan><tspan x="89" dy="31">after each trial in your notebook and compare your records.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">7</text></g><!-- /botanical-footer --></svg></div></div></section>
