<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 11"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124"><tspan x="89">An Old Indian Compass</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">Your floating needle is not a new idea.</tspan></text>
<text class="se-copy" x="89" y="219"><tspan x="89">Accounts of Indian navigation describe a fish-shaped magnetised iron device placed</tspan><tspan x="89" dy="31">in oil so that it could turn towards north-south. This is often compared with a</tspan><tspan x="89" dy="31">floating compass.</tspan></text>
<text class="se-copy" x="89" y="326"><tspan x="89">It was called the <tspan class="se-bold">matsya-yantra</tspan>, which means &quot;fish instrument&quot;. Some people called</tspan><tspan x="89" dy="31">it the <tspan class="se-italic">machchh-yantra</tspan>.</tspan></text>
<text class="se-copy" x="89" y="402"><tspan x="89">A liquid can slow down a turning magnet. The essential idea is to support the</tspan><tspan x="89" dy="31">magnet so it can turn freely. A solid piece of iron will sink unless its shape or a</tspan><tspan x="89" dy="31">floating support keeps it at the surface.</tspan></text>
<svg class="science-illustration" x="89" y="486" width="874" height="205" viewBox="0 0 874 205"><ellipse class="se-process" cx="437" cy="91" rx="177" ry="66"/><path class="mg-body" d="M365 91q65 -52 129 0q-64 52 -129 0l-34 26V65Z"/><text class="se-caption" x="437" y="186" text-anchor="middle">Fish-shaped compass: a schematic reconstruction</text></svg>
<rect class="se-prompt" x="89" y="719" width="874" height="98" rx="10"/><text class="se-copy" x="113" y="758"><tspan x="113"><tspan class="se-bold">Think:</tspan> Your floating needle settles north-south. So does a bought compass. So</tspan><tspan x="113" dy="31">did the <tspan class="se-italic">matsya-yantra</tspan>. What do all three have inside them?</tspan></text>
<text class="se-copy" x="89" y="858"><tspan x="89">Notice that all three solve the same problem in the same way. A magnet is allowed to</tspan><tspan x="89" dy="31">turn freely, and then it is left alone to find its own direction. Everything else — the</tspan><tspan x="89" dy="31">cork, the oil, the pin, the dial — is there only to let the magnet turn easily and to help</tspan><tspan x="89" dy="31">us read the answer.</tspan></text>
<text class="se-copy" x="89" y="996"><tspan x="89">The support and the magnetic needle have different jobs. The cork supports the</tspan><tspan x="89" dy="31">needle on water. A pivot supports the needle in a modern compass. In either design,</tspan><tspan x="89" dy="31">rubbing against the support must be small enough for the needle to turn.</tspan></text>
<text class="se-copy" x="89" y="1103"><tspan x="89">Compare the two designs by asking the same questions: what is magnetised, what</tspan><tspan x="89" dy="31">supports it, and what prevents it from turning freely? These questions explain why a</tspan><tspan x="89" dy="31">floating needle fails if its cork touches the side of the bowl.</tspan></text>
<text class="se-copy" x="89" y="1210"><tspan x="89">A model helps us understand a working principle without reproducing every</tspan><tspan x="89" dy="31">historical detail. Your bowl compass demonstrates free turning and magnetic</tspan><tspan x="89" dy="31">alignment. It does not establish exactly how a particular old instrument was built.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">11</text></g><!-- /botanical-footer --></svg></div></div></section>
