<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 15"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124"><tspan x="89">Can a Magnet Work Through Things?</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">A magnet pulls a paper clip across a gap of air. But what if something is put in the</tspan><tspan x="89" dy="31">way?</tspan></text>
<rect class="se-activity-panel" x="89" y="241" width="874" height="725" rx="20"/><rect class="se-activity-tab" x="89" y="227" width="424" height="40" rx="12"/><text class="se-activity-tab-text" x="107" y="255" text-anchor="start">Activity 4.7 · Put Something in Between</text><text class="se-copy" x="113" y="307"><tspan x="113"><tspan class="se-bold">You</tspan> <tspan class="se-bold">will</tspan> <tspan class="se-bold">need:</tspan> a compass, a bar magnet, and flat sheets of wood, cardboard,</tspan><tspan x="113" dy="31">plastic and glass.</tspan></text><text class="se-activity-step" x="130" y="381" text-anchor="end">1.</text><text class="se-copy" x="146" y="381"><tspan x="146">Set up the compass and magnet as in Activity 4.6, so the needle is clearly</tspan><tspan x="146" dy="31">turned aside.</tspan></text><text class="se-activity-step" x="130" y="455" text-anchor="end">2.</text><text class="se-copy" x="146" y="455"><tspan x="146"><tspan class="se-bold">Predict</tspan> what will happen if you slide a piece of wood into the gap between</tspan><tspan x="146" dy="31">them. Write your prediction first.</tspan></text><text class="se-activity-step" x="130" y="529" text-anchor="end">3.</text><text class="se-copy" x="146" y="529"><tspan x="146">Stand the wood in the gap. Keep both the magnet and compass still.</tspan></text><text class="se-activity-step" x="130" y="572" text-anchor="end">4.</text><text class="se-copy" x="146" y="572"><tspan x="146">Watch the needle.</tspan></text><text class="se-activity-step" x="130" y="615" text-anchor="end">5.</text><text class="se-copy" x="146" y="615"><tspan x="146">Take the wood away. Try cardboard, then plastic, then glass.</tspan></text><text class="se-copy" x="113" y="658"><tspan x="113"><tspan class="se-bold">Safety:</tspan> Use only smooth-edged glass handled by your teacher; do not use</tspan><tspan x="113" dy="31">broken glass.</tspan></text><svg class="science-illustration" x="113" y="709" width="826" height="210" viewBox="0 0 874 210"><rect class="mg-north" x="80" y="75" width="115" height="48" rx="3"/><rect class="mg-south" x="195" y="75" width="115" height="48" rx="3"/><text class="se-caption" x="105" y="105" text-anchor="middle">N</text><text class="se-caption" x="285" y="105" text-anchor="middle">S</text><rect class="se-process" x="400" y="22" width="28" height="132" rx="3"/><circle class="se-process" cx="617" cy="100" r="75"/><circle class="se-accent" cx="617" cy="100" r="67"/><g transform="rotate(-60 617 100)"><path class="mg-needle-n" d="M617 50l-10 50h20Z"/><path class="mg-south" d="M617 150l-10 -50h20Z"/></g><text class="se-caption" x="617" y="44" text-anchor="middle">N</text><text class="se-caption" x="617" y="166" text-anchor="middle">S</text><text class="se-caption" x="559" y="106" text-anchor="middle">W</text><text class="se-caption" x="675" y="106" text-anchor="middle">E</text><text class="se-caption" x="190" y="190" text-anchor="middle">Magnet</text><text class="se-caption" x="432" y="190" text-anchor="middle">Thin non-magnetic sheet</text><text class="se-caption" x="617" y="190" text-anchor="middle">Compass</text></svg>
<rect class="se-table-band" x="89" y="981" width="874" height="40" rx="3"/><rect class="se-table-number" x="89" y="981" width="149" height="40" rx="3"/><text class="se-caption se-table-number-text" x="109" y="1008">Table 4.2</text><text class="se-caption se-bold" x="260" y="1008">Does the magnet still work?</text><rect class="se-table-head" x="89" y="1027" width="874" height="47"/><line class="se-rule" x1="89" x2="963" y1="1074" y2="1074"/><text class="se-copy se-table-copy se-bold" x="101" y="1054.4"><tspan x="101">Material</tspan></text><text class="se-copy se-table-copy se-bold" x="538" y="1054.4"><tspan x="538">Needle observation</tspan></text><line class="se-rule" x1="89" x2="963" y1="1121" y2="1121"/><text class="se-copy se-table-copy" x="101" y="1101.4"><tspan x="101">Wood</tspan></text><text class="se-copy se-table-copy" x="538" y="1101.4"><tspan x="538">—</tspan></text><line class="se-rule" x1="89" x2="963" y1="1168" y2="1168"/><text class="se-copy se-table-copy" x="101" y="1148.4"><tspan x="101">Cardboard</tspan></text><text class="se-copy se-table-copy" x="538" y="1148.4"><tspan x="538">—</tspan></text><line class="se-rule" x1="89" x2="963" y1="1215" y2="1215"/><text class="se-copy se-table-copy" x="101" y="1195.4"><tspan x="101">Plastic</tspan></text><text class="se-copy se-table-copy" x="538" y="1195.4"><tspan x="538">—</tspan></text><line class="se-rule" x1="89" x2="963" y1="1262" y2="1262"/><text class="se-copy se-table-copy" x="101" y="1242.4"><tspan x="101">Glass</tspan></text><text class="se-copy se-table-copy" x="538" y="1242.4"><tspan x="538">—</tspan></text>
<text class="se-copy" x="89" y="1299"><tspan x="89">The needle hardly changes at all. Whatever you put in the way, the magnet still turns</tspan><tspan x="89" dy="31">the needle.</tspan></text>
<text class="se-copy" x="89" y="1375"><tspan x="89">So the effect of a magnet passes straight through non-magnetic materials.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">15</text></g><!-- /botanical-footer --></svg></div></div></section>
