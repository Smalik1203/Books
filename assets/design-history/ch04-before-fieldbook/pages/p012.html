<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 12"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124"><tspan x="89">4.4 Pushing and Pulling</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">So far, magnets have pulled things towards them. Now let us see what a magnet does</tspan><tspan x="89" dy="31">to another magnet.</tspan></text>
<rect class="se-activity-panel" x="89" y="241" width="874" height="892" rx="20"/><rect class="se-activity-tab" x="89" y="227" width="298" height="40" rx="12"/><text class="se-activity-tab-text" x="107" y="255" text-anchor="start">Activity 4.5 · Two Magnets</text><text class="se-copy" x="113" y="307"><tspan x="113"><tspan class="se-bold">You</tspan> <tspan class="se-bold">will</tspan> <tspan class="se-bold">need:</tspan> two bar magnets with their poles marked, five or six round</tspan><tspan x="113" dy="31">pencils, a flat table.</tspan></text><text class="se-activity-step" x="130" y="381" text-anchor="end">1.</text><text class="se-copy" x="146" y="381"><tspan x="146">Call the magnets A and B.</tspan></text><text class="se-activity-step" x="130" y="424" text-anchor="end">2.</text><text class="se-copy" x="146" y="424"><tspan x="146">Lay the round pencils side by side on the table. Rest magnet A across them,</tspan><tspan x="146" dy="31">so it can roll easily.</tspan></text><text class="se-activity-step" x="130" y="498" text-anchor="end">3.</text><text class="se-copy" x="146" y="498"><tspan x="146">Hold magnet B in your hand. Slowly bring one end of it near one end of</tspan><tspan x="146" dy="31">magnet A. <tspan class="se-bold">Do</tspan> <tspan class="se-bold">not</tspan> <tspan class="se-bold">let</tspan> <tspan class="se-bold">them</tspan> <tspan class="se-bold">touch.</tspan></tspan></text><text class="se-activity-step" x="130" y="572" text-anchor="end">4.</text><text class="se-copy" x="146" y="572"><tspan x="146">Watch magnet A carefully. Which way does it move?</tspan></text><text class="se-activity-step" x="130" y="615" text-anchor="end">5.</text><text class="se-copy" x="146" y="615"><tspan x="146">Now turn magnet B around. Bring its other end near the same end of magnet</tspan><tspan x="146" dy="31">A.</tspan></text><text class="se-activity-step" x="130" y="689" text-anchor="end">6.</text><text class="se-copy" x="146" y="689"><tspan x="146">Watch again.</tspan></text><text class="se-copy" x="113" y="732"><tspan x="113"><tspan class="se-bold">Observe:</tspan> Did magnet A move towards magnet B both times? Or did it move</tspan><tspan x="113" dy="31">away one of those times?</tspan></text><text class="se-copy" x="113" y="806"><tspan x="113"><tspan class="se-bold">Think:</tspan> Look at the pole markings. What was different between the two tries?</tspan></text><svg class="science-illustration" x="113" y="826" width="826" height="260" viewBox="0 0 874 260"><rect class="mg-north" x="35" y="35" width="80" height="48" rx="3"/><rect class="mg-south" x="115" y="35" width="80" height="48" rx="3"/><text class="se-caption" x="60" y="65" text-anchor="middle">N</text><text class="se-caption" x="170" y="65" text-anchor="middle">S</text><rect class="mg-north" x="270" y="35" width="80" height="48" rx="3"/><rect class="mg-south" x="350" y="35" width="80" height="48" rx="3"/><text class="se-caption" x="295" y="65" text-anchor="middle">N</text><text class="se-caption" x="405" y="65" text-anchor="middle">S</text><path class="se-accent" d="M205 60h52m-10 -7l10 7l-10 7"/><text class="se-caption" x="232" y="126" text-anchor="middle">Unlike poles attract</text><rect class="mg-south" x="465" y="35" width="80" height="48" rx="3"/><rect class="mg-north" x="545" y="35" width="80" height="48" rx="3"/><text class="se-caption" x="490" y="65" text-anchor="middle">S</text><text class="se-caption" x="600" y="65" text-anchor="middle">N</text><rect class="mg-north" x="710" y="35" width="70" height="48" rx="3"/><rect class="mg-south" x="780" y="35" width="70" height="48" rx="3"/><text class="se-caption" x="735" y="65" text-anchor="middle">N</text><text class="se-caption" x="825" y="65" text-anchor="middle">S</text><path class="se-accent" d="M698 60h-57m10 -7l-10 7l10 7"/><text class="se-caption" x="667" y="126" text-anchor="middle">Like poles repel</text><circle class="se-accent" cx="60" cy="94" r="10"/><circle class="se-accent" cx="105" cy="94" r="10"/><circle class="se-accent" cx="150" cy="94" r="10"/><circle class="se-accent" cx="490" cy="94" r="10"/><circle class="se-accent" cx="535" cy="94" r="10"/><circle class="se-accent" cx="580" cy="94" r="10"/><text class="se-caption" x="437" y="200" text-anchor="middle">Round pencils allow the first magnet to move.</text></svg>
<text class="se-copy" x="89" y="1175"><tspan x="89">The round pencils reduce rubbing between magnet A and the table. Without them,</tspan><tspan x="89" dy="31">the magnetic force might be present but too weak to overcome the friction. A magnet</tspan><tspan x="89" dy="31">that does not move immediately has not necessarily stopped exerting a force.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">12</text></g><!-- /botanical-footer --></svg></div></div></section>
