<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 8"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124"><tspan x="89">Always the Same Line</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">However many times you spin it, the magnet stops along the same line.</tspan></text>
<text class="se-copy" x="89" y="219"><tspan x="89">Now find out what that line is. If you know where the sun rises, you know roughly</tspan><tspan x="89" dy="31">where east is. Face east and stretch out your arms. North is on your left. South is on</tspan><tspan x="89" dy="31">your right.</tspan></text>
<text class="se-copy" x="89" y="326"><tspan x="89">Away from nearby magnets and iron objects, it settles along the magnetic</tspan><tspan x="89" dy="31">north-south line. This is usually close to geographic north-south, but not exactly the</tspan><tspan x="89" dy="31">same.</tspan></text>
<text class="se-copy" x="89" y="433"><tspan x="89">One end always turns towards the north. That end is the <tspan class="se-bold">North</tspan> <tspan class="se-bold">pole</tspan> of the magnet.</tspan><tspan x="89" dy="31">The other end always turns towards the south. That is the <tspan class="se-bold">South</tspan> <tspan class="se-bold">pole</tspan>. Now the</tspan><tspan x="89" dy="31">names make sense. They are named after the direction each end looks for.</tspan></text>
<text class="se-copy" x="89" y="540"><tspan x="89">But why does this happen at all?</tspan></text>
<text class="se-copy" x="89" y="585"><tspan x="89">The reason is surprising. The Earth itself behaves like an enormous magnet. A</tspan><tspan x="89" dy="31">hanging magnet is being pulled around by the Earth's own magnetism, until it settles</tspan><tspan x="89" dy="31">along the north-south line.</tspan></text>
<text class="se-copy" x="89" y="692"><tspan x="89">Now do the activity once more, but hang a plain iron bar instead of a magnet. The</tspan><tspan x="89" dy="31">iron bar stops wherever it likes. Sometimes east-west, sometimes in between. It has</tspan><tspan x="89" dy="31">no fixed direction.</tspan></text>
<text class="se-copy" x="89" y="799"><tspan x="89">This gives us a useful test. Hang a metal bar freely. If the same end repeatedly points</tspan><tspan x="89" dy="31">towards magnetic north, that is evidence that the bar is magnetised. Check that it</tspan><tspan x="89" dy="31">turns freely and that no nearby magnet is disturbing it.</tspan></text>
<svg class="science-illustration" x="89" y="883" width="874" height="300" viewBox="0 0 874 300"><line class="se-accent" x1="130" y1="28" x2="690" y2="28"/><line class="se-accent" x1="690" y1="28" x2="690" y2="258"/><line class="se-accent" x1="437" y1="28" x2="437" y2="116"/><rect class="mg-north" x="317" y="116" width="120" height="48" rx="3"/><rect class="mg-south" x="437" y="116" width="120" height="48" rx="3"/><text class="se-caption" x="342" y="146" text-anchor="middle">N</text><text class="se-caption" x="532" y="146" text-anchor="middle">S</text><line class="se-accent" x1="285" y1="241" x2="588" y2="241"/><text class="se-caption" x="253" y="247" text-anchor="middle">North</text><text class="se-caption" x="628" y="247" text-anchor="middle">South</text><text class="se-caption" x="485" y="84" text-anchor="middle">Thread</text><text class="se-caption" x="437" y="289" text-anchor="middle">The magnet must turn freely.</text></svg>
<text class="se-copy" x="89" y="1234"><tspan x="89">A compass direction is a local observation. Nearby iron and other magnets can</tspan><tspan x="89" dy="31">change it. That is why checking the surroundings is part of the experiment, just as</tspan><tspan x="89" dy="31">important as waiting for the magnet to stop.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">8</text></g><!-- /botanical-footer --></svg></div></div></section>
