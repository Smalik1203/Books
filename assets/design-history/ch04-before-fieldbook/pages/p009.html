<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 9"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124"><tspan x="89">The Magnetic Compass</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">A hanging magnet works, but it is not much use on a rolling ship. It needs to be</tspan><tspan x="89" dy="31">small, steady, and easy to read.</tspan></text>
<text class="se-copy" x="89" y="250"><tspan x="89">That is exactly what a <tspan class="se-bold">magnetic</tspan> <tspan class="se-bold">compass</tspan> is.</tspan></text>
<text class="se-copy" x="89" y="295"><tspan x="89">Inside a compass there is a thin magnet shaped like a needle. The needle sits</tspan><tspan x="89" dy="31">balanced on a sharp pin, so it can turn very easily. Under the needle is a dial with the</tspan><tspan x="89" dy="31">directions marked on it. A clear cover keeps out wind and rain.</tspan></text>
<text class="se-copy" x="89" y="402"><tspan x="89">Leave the compass on a flat surface and wait. The needle swings and then settles</tspan><tspan x="89" dy="31">along the north-south line, just as the hanging magnet did. The end that points north</tspan><tspan x="89" dy="31">is usually painted red, or marked in some other way.</tspan></text>
<text class="se-copy" x="89" y="509"><tspan x="89">To read it, turn the whole compass box gently — not the needle — until the N and S</tspan><tspan x="89" dy="31">printed on the dial line up with the needle. Once they match, every direction on the</tspan><tspan x="89" dy="31">dial is correct for that place.</tspan></text>
<text class="se-copy" x="89" y="616"><tspan x="89">This small device changed the world. With a compass, a ship could hold its course</tspan><tspan x="89" dy="31">through cloud, fog and night. Sailors could cross open sea far from land, and still</tspan><tspan x="89" dy="31">know which way was home.</tspan></text>
<svg class="science-illustration" x="89" y="700" width="874" height="280" viewBox="0 0 874 280"><circle class="se-process" cx="275" cy="127" r="108"/><circle class="se-accent" cx="275" cy="127" r="100"/><g transform="rotate(0 275 127)"><path class="mg-needle-n" d="M275 44l-10 83h20Z"/><path class="mg-south" d="M275 210l-10 -83h20Z"/></g><text class="se-caption" x="275" y="38" text-anchor="middle">N</text><text class="se-caption" x="275" y="226" text-anchor="middle">S</text><text class="se-caption" x="184" y="133" text-anchor="middle">W</text><text class="se-caption" x="366" y="133" text-anchor="middle">E</text><text class="se-caption" x="275" y="267" text-anchor="middle">Top view</text><line class="se-accent" x1="582" y1="152" x2="770" y2="152"/><path class="mg-body" d="M674 154l-12 68h24Z"/><text class="se-caption" x="672" y="125" text-anchor="middle">Needle</text><text class="se-caption" x="731" y="206" text-anchor="middle">Pivot</text><text class="se-caption" x="675" y="267" text-anchor="middle">Side view</text></svg>
<text class="se-copy" x="89" y="1031"><tspan x="89">The compass needle turns; the letters printed on the dial do not. Turning the case</tspan><tspan x="89" dy="31">brings those letters into line with the settled needle. If you carry the compass to</tspan><tspan x="89" dy="31">another place or turn yourself around, let the needle settle and check the dial again.</tspan></text>
<text class="se-copy" x="89" y="1138"><tspan x="89">A compass shows direction relative to the local magnetic field. Accurate map</tspan><tspan x="89" dy="31">navigation also allows for the difference between magnetic north and geographic</tspan><tspan x="89" dy="31">north.</tspan></text>
<text class="se-copy" x="89" y="1245"><tspan x="89">Keep the compass level while reading it. A tilted needle may catch against its support</tspan><tspan x="89" dy="31">or case. If it seems stuck, put the compass on a flat surface and wait before trusting</tspan><tspan x="89" dy="31">the direction it shows.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">9</text></g><!-- /botanical-footer --></svg></div></div></section>
