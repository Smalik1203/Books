<section class="page page--food page--science-editorial page--opener" data-science-chapter="4" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 1"><g aria-label="Chapter 4"><path class="food-gold-tag" d="M92 45H215V163Q215 230 147 230Q81 230 81 165V70Q81 45 92 45Z"/><path class="food-navy" d="M105 45H206V164Q206 234 143 234Q81 234 81 164V73Q81 45 105 45Z"/><text class="food-text food-white science-chapter-label" x="143" y="94" text-anchor="middle">CHAPTER</text><text class="food-text food-white science-chapter-number" x="143" y="211" text-anchor="middle">4</text></g><text class="se-title" x="248" y="137" text-anchor="start">Exploring</text><text class="se-title" x="248" y="204" text-anchor="start">Magnets</text><image class="science-illustration" href="../../figures/class-6/science/ch04/opener.png" x="89" y="265" width="874" height="515" preserveAspectRatio="xMidYMid meet"/>
<text class="se-copy" x="89" y="823"><tspan x="89">Long ago, ships sailed from the coast of Kerala carrying pepper, cardamom and</tspan><tspan x="89" dy="31">ginger. They went to lands far across the sea.</tspan></text>
<text class="se-copy" x="89" y="899"><tspan x="89">Those sailing ships had no engines, and finding a course across open water was</tspan><tspan x="89" dy="31">difficult. So how did a sailor know which way to go?</tspan></text>
<text class="se-copy" x="89" y="975"><tspan x="89">By day, he watched the sun. By night, he watched the stars. Sailors learnt the night</tspan><tspan x="89" dy="31">sky so well that they could tell their direction from it.</tspan></text>
<text class="se-copy" x="89" y="1051"><tspan x="89">But now think about a storm. Thick clouds cover the sky for two days. There is no</tspan><tspan x="89" dy="31">sun. There are no stars. There is water in every direction, and every direction looks</tspan><tspan x="89" dy="31">the same.</tspan></text>
<text class="se-copy" x="89" y="1158"><tspan x="89">Which way is home?</tspan></text>
<text class="se-copy" x="89" y="1203"><tspan x="89">For hundreds of years, this was a real and frightening problem. Then people found an</tspan><tspan x="89" dy="31">answer. The answer was a small piece of stone that always turned the same way.</tspan></text>
<text class="se-copy" x="89" y="1279"><tspan x="89">This chapter is about that stone, and about the magnets we use today.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">1</text></g><!-- /botanical-footer --></svg></div></div></section>
