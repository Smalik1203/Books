<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 5"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124"><tspan x="89">4.2 The Poles of a Magnet</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">Does a magnet pull equally hard everywhere along its length? Or are some parts</tspan><tspan x="89" dy="31">stronger than others?</tspan></text>
<text class="se-copy" x="89" y="250"><tspan x="89">There is a neat way to find out. Iron filings are tiny bits of iron. They are light, so</tspan><tspan x="89" dy="31">even a small pull will move them.</tspan></text>
<rect class="se-activity-panel" x="89" y="317" width="874" height="779" rx="20"/><rect class="se-activity-tab" x="89" y="303" width="441" height="40" rx="12"/><text class="se-activity-tab-text" x="107" y="331" text-anchor="start">Activity 4.2 · Where Is the Pull Strongest?</text><text class="se-copy" x="113" y="383"><tspan x="113"><tspan class="se-bold">You</tspan> <tspan class="se-bold">will</tspan> <tspan class="se-bold">need:</tspan> iron filings, a sheet of paper, a bar magnet.</tspan></text><text class="se-activity-step" x="130" y="426" text-anchor="end">1.</text><text class="se-copy" x="146" y="426"><tspan x="146">Place the bar magnet flat on the desk.</tspan></text><text class="se-activity-step" x="130" y="469" text-anchor="end">2.</text><text class="se-copy" x="146" y="469"><tspan x="146">Cover it completely with the sheet of paper.</tspan></text><text class="se-activity-step" x="130" y="512" text-anchor="end">3.</text><text class="se-copy" x="146" y="512"><tspan x="146">Sprinkle iron filings lightly over the paper, above the magnet.</tspan></text><text class="se-activity-step" x="130" y="555" text-anchor="end">4.</text><text class="se-copy" x="146" y="555"><tspan x="146">Tap the paper gently a few times.</tspan></text><text class="se-activity-step" x="130" y="598" text-anchor="end">5.</text><text class="se-copy" x="146" y="598"><tspan x="146">Watch where the filings gather.</tspan></text><text class="se-copy" x="113" y="641"><tspan x="113"><tspan class="se-bold">Observe:</tspan> Are the filings spread evenly? Or do they collect in some places more</tspan><tspan x="113" dy="31">than others?</tspan></text><text class="se-copy" x="113" y="715"><tspan x="113"><tspan class="se-bold">Think:</tspan> What does this tell you about the magnet underneath?</tspan></text><text class="se-copy" x="113" y="758"><tspan x="113"><tspan class="se-bold">Safety:</tspan> Do not touch your eyes or breathe in iron filings. Keep them on the</tspan><tspan x="113" dy="31">paper, collect them carefully and wash your hands afterwards.</tspan></text><svg class="science-illustration" x="113" y="809" width="826" height="240" viewBox="0 0 874 240"><rect class="mg-north" x="287" y="88" width="150" height="65" rx="3"/><rect class="mg-south" x="437" y="88" width="150" height="65" rx="3"/><text class="se-caption" x="312" y="126.5" text-anchor="middle">N</text><text class="se-caption" x="562" y="126.5" text-anchor="middle">S</text><line class="se-accent" x1="313" y1="120" x2="323" y2="120"/><line class="se-accent" x1="263.4042657144283" y1="141.61576562430062" x2="256.0305987501871" y2="148.37069238189457"/><line class="se-accent" x1="290.32193301965145" y1="82.1454789884623" x2="291.19612591955973" y2="72.18376293279448"/><line class="se-accent" x1="313.77164821300454" y1="154.91817366299574" x2="319.85611371596013" y2="162.8541222227675"/><line class="se-accent" x1="237.76421322625004" y1="111.29153855323287" x2="227.91705587150005" y2="109.54984626387945"/><line class="se-accent" x1="334.2498111272616" y1="89.94246602866254" x2="342.68727739998684" y2="84.57504924806656"/><line class="se-accent" x1="270.9056933662541" y1="179.87464650400003" x2="268.30983745758545" y2="189.5318475530323"/><line class="se-accent" x1="255.6569580079136" y1="59.65421540254606" x2="251.04768712672444" y2="50.77983531468519"/><line class="se-accent" x1="356.5104317944261" y1="145.38306269449055" x2="365.9037333882675" y2="148.81320630185414"/><line class="se-accent" x1="262.9673039143077" y1="129.92116519632393" x2="253.7239592659645" y2="133.7369979641408"/><line class="se-accent" x1="300.5621357461611" y1="91.0160652429195" x2="304.80030316683644" y2="81.95858563133184"/><line class="se-accent" x1="298.3740749886489" y1="156.25783250764712" x2="301.3672526172407" y2="165.79936737808058"/><line class="se-accent" x1="248.92985175074176" y1="97.93954188418793" x2="240.27754533045578" y2="92.92580140332156"/><line class="se-accent" x1="335.83333787279525" y1="109.2619781988757 <text class="se-copy" x="89" y="1138"><tspan x="89">The filings help you locate the strongest regions of this bar magnet. The visible</tspan><tspan x="89" dy="31">grains are pieces of iron, not pieces of the magnet’s force. Keep the paper still as you</tspan><tspan x="89" dy="31">compare the ends with the middle; moving it may disturb the pattern.</tspan></text>
<text class="se-copy" x="89" y="1245"><tspan x="89">Compare the pattern before and after gently tapping the paper. Tapping helps the</tspan><tspan x="89" dy="31">grains move; it does not create the magnetic poles.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">5</text></g><!-- /botanical-footer --></svg></div></div></section>
