<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="21" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 21"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124"><tspan x="89">Learning Further</tspan></text><text class="se-copy" x="89" y="174"><tspan x="89">• Collect three or four different magnets. Use each one to pick up steel pins, and</tspan><tspan x="89" dy="31">count how many pins each magnet can hold. Which magnet is strongest? Discuss</tspan><tspan x="89" dy="31">with your friends why some magnets are stronger than others.</tspan></text><text class="se-copy" x="89" y="279"><tspan x="89">• Make a flying butterfly. Cut a butterfly out of paper and glue a steel paper clip to its</tspan><tspan x="89" dy="31">body. Tie a thread to the clip and tape the other end of the thread to a table. Now</tspan><tspan x="89" dy="31">hold a magnet above the butterfly, just far enough that the thread pulls tight. The</tspan><tspan x="89" dy="31">butterfly will hang in the air without anything touching it. Move the magnet slowly</tspan><tspan x="89" dy="31">and watch what happens.</tspan></text><text class="se-copy" x="89" y="446"><tspan x="89">• Find out about the Maglev train. It floats above its track instead of resting on rails.</tspan><tspan x="89" dy="31">Which idea from this chapter is it using?</tspan></text><text class="se-copy" x="89" y="520"><tspan x="89">• Magnets are made in many shapes — bar, ring, disc, cylinder, horseshoe and</tspan><tspan x="89" dy="31">sphere. Find out why. What job does each shape do well?</tspan></text><text class="se-copy" x="89" y="594"><tspan x="89">• Find out how magnets are used in hospitals. Start by finding out what the letters</tspan><tspan x="89" dy="31">MRI stand for.</tspan></text><text class="se-copy" x="89" y="668"><tspan x="89">• Take your homemade compass outside. Use it to find which direction your</tspan><tspan x="89" dy="31">classroom window faces. Then check your answer against where the sun rises.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">21</text></g><!-- /botanical-footer --></svg></div></div></section>
