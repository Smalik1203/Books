<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="17"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 17"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124"><tspan x="89">Looking After Magnets</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">A magnet does not stay strong for ever. Treated badly, it grows weak and finally stops</tspan><tspan x="89" dy="31">working. Treated well, it lasts for years.</tspan></text>
<text class="se-copy" x="89" y="250"><tspan x="89"><tspan class="se-bold">Do</tspan> <tspan class="se-bold">not</tspan> <tspan class="se-bold">drop</tspan> <tspan class="se-bold">a</tspan> <tspan class="se-bold">magnet,</tspan> <tspan class="se-bold">hammer</tspan> <tspan class="se-bold">it,</tspan> <tspan class="se-bold">or</tspan> <tspan class="se-bold">heat</tspan> <tspan class="se-bold">it.</tspan> Any of these will weaken it, and hard</tspan><tspan x="89" dy="31">knocks or strong heat can ruin it completely.</tspan></text>
<text class="se-copy" x="89" y="326"><tspan x="89"><tspan class="se-bold">Store</tspan> <tspan class="se-bold">bar</tspan> <tspan class="se-bold">magnets</tspan> <tspan class="se-bold">in</tspan> <tspan class="se-bold">pairs.</tspan> Lay the two magnets side by side, with the North pole of</tspan><tspan x="89" dy="31">one next to the South pole of the other. Place a small piece of wood between them so</tspan><tspan x="89" dy="31">they do not snap together. Then lay a small piece of soft iron across each end. Stored</tspan><tspan x="89" dy="31">this way, a pair of magnets keeps its strength much longer.</tspan></text>
<text class="se-copy" x="89" y="464"><tspan x="89"><tspan class="se-bold">Keep</tspan> <tspan class="se-bold">magnets</tspan> <tspan class="se-bold">away</tspan> <tspan class="se-bold">from</tspan> <tspan class="se-bold">certain</tspan> <tspan class="se-bold">things.</tspan> Keep strong magnets away from</tspan><tspan x="89" dy="31">compasses, mechanical watches, magnetic-stripe cards and magnetically stored data.</tspan><tspan x="89" dy="31">Follow the maker’s advice for electronic devices; not every device is affected in the</tspan><tspan x="89" dy="31">same way.</tspan></text>
<svg class="science-illustration" x="89" y="579" width="874" height="225" viewBox="0 0 874 225"><rect class="mg-north" x="247" y="45" width="190" height="45" rx="3"/><rect class="mg-south" x="437" y="45" width="190" height="45" rx="3"/><text class="se-caption" x="272" y="73.5" text-anchor="middle">N</text><text class="se-caption" x="602" y="73.5" text-anchor="middle">S</text><rect class="mg-south" x="247" y="116" width="190" height="45" rx="3"/><rect class="mg-north" x="437" y="116" width="190" height="45" rx="3"/><text class="se-caption" x="272" y="144.5" text-anchor="middle">S</text><text class="se-caption" x="602" y="144.5" text-anchor="middle">N</text><rect class="se-process" x="249" y="94" width="376" height="16" rx="3"/><rect class="mg-body" x="223" y="43" width="23" height="120" rx="3"/><rect class="mg-body" x="628" y="43" width="23" height="120" rx="3"/><text class="se-caption" x="139" y="112" text-anchor="middle">Soft-iron keeper</text><text class="se-caption" x="748" y="112" text-anchor="middle">Soft-iron keeper</text><text class="se-caption" x="437" y="212" text-anchor="middle">Wooden spacer</text><line class="se-accent" x1="437" y1="183" x2="437" y2="107"/></svg>
<rect class="se-prompt" x="89" y="832" width="874" height="67" rx="10"/><text class="se-copy" x="113" y="871"><tspan x="113"><tspan class="se-bold">Think:</tspan> Why should a compass never be stored right next to a strong magnet?</tspan></text>
<text class="se-copy" x="89" y="940"><tspan x="89">The soft-iron pieces used for storage are called keepers. They join unlike poles across</tspan><tspan x="89" dy="31">each end of the pair. This arrangement is useful for traditional school bar magnets;</tspan><tspan x="89" dy="31">different modern magnets may come with their own storage instructions.</tspan></text>
<text class="se-copy" x="89" y="1047"><tspan x="89">Store the magnets in a secure container so they cannot snap onto tools or slide off a</tspan><tspan x="89" dy="31">shelf. Keep the keeper pieces together with their magnets. A missing keeper cannot</tspan><tspan x="89" dy="31">do its job if it is left at the bottom of a drawer.</tspan></text>
<text class="se-copy" x="89" y="1154"><tspan x="89">Use a separate place for the compass. Its needle is a small magnet, and a nearby</tspan><tspan x="89" dy="31">strong magnet can disturb its direction. Put the compass away only after you have</tspan><tspan x="89" dy="31">moved the experimental magnets back to their storage place.</tspan></text>
<text class="se-copy" x="89" y="1261"><tspan x="89">Handle magnets gently when taking them out for the next lesson.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">17</text></g><!-- /botanical-footer --></svg></div></div></section>
