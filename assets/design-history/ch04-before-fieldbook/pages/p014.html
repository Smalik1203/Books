<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 14"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124"><tspan x="89">A Magnet Near a Compass</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">A compass needle is a magnet too. So it should follow the same rules.</tspan></text>
<rect class="se-activity-panel" x="89" y="210" width="874" height="832" rx="20"/><rect class="se-activity-tab" x="89" y="196" width="410" height="40" rx="12"/><text class="se-activity-tab-text" x="107" y="224" text-anchor="start">Activity 4.6 · Making the Needle Move</text><text class="se-copy" x="113" y="276"><tspan x="113"><tspan class="se-bold">You</tspan> <tspan class="se-bold">will</tspan> <tspan class="se-bold">need:</tspan> a magnetic compass, a bar magnet with poles marked.</tspan></text><text class="se-activity-step" x="130" y="319" text-anchor="end">1.</text><text class="se-copy" x="146" y="319"><tspan x="146">Put the compass on a flat table, away from anything made of iron or steel.</tspan></text><text class="se-activity-step" x="130" y="362" text-anchor="end">2.</text><text class="se-copy" x="146" y="362"><tspan x="146">Wait for the needle to settle along the north-south line.</tspan></text><text class="se-activity-step" x="130" y="405" text-anchor="end">3.</text><text class="se-copy" x="146" y="405"><tspan x="146">Slowly bring the North pole of the bar magnet towards the north end of the</tspan><tspan x="146" dy="31">needle.</tspan></text><text class="se-activity-step" x="130" y="479" text-anchor="end">4.</text><text class="se-copy" x="146" y="479"><tspan x="146">Watch the needle. Does it turn? Which way?</tspan></text><text class="se-activity-step" x="130" y="522" text-anchor="end">5.</text><text class="se-copy" x="146" y="522"><tspan x="146">Move the magnet away. Let the needle settle again.</tspan></text><text class="se-activity-step" x="130" y="565" text-anchor="end">6.</text><text class="se-copy" x="146" y="565"><tspan x="146">Now bring the South pole of the bar magnet towards the north end of the</tspan><tspan x="146" dy="31">needle.</tspan></text><text class="se-activity-step" x="130" y="639" text-anchor="end">7.</text><text class="se-copy" x="146" y="639"><tspan x="146">Watch again.</tspan></text><text class="se-copy" x="113" y="682"><tspan x="113"><tspan class="se-bold">Observe:</tspan> The needle behaves differently in the two cases. Describe each one.</tspan></text><text class="se-copy" x="113" y="725"><tspan x="113"><tspan class="se-bold">Think:</tspan> Does this match what you found in Activity 4.5?</tspan></text><svg class="science-illustration" x="113" y="745" width="826" height="250" viewBox="0 0 874 250"><rect class="mg-south" x="24" y="92" width="87.5" height="40" rx="3"/><rect class="mg-north" x="111.5" y="92" width="87.5" height="40" rx="3"/><text class="se-caption" x="49" y="118" text-anchor="middle">S</text><text class="se-caption" x="174" y="118" text-anchor="middle">N</text><circle class="se-process" cx="310" cy="112" r="74"/><circle class="se-accent" cx="310" cy="112" r="66"/><g transform="rotate(90 310 112)"><path class="mg-needle-n" d="M310 63l-10 49h20Z"/><path class="mg-south" d="M310 161l-10 -49h20Z"/></g><text class="se-caption" x="310" y="57" text-anchor="middle">N</text><text class="se-caption" x="310" y="177" text-anchor="middle">S</text><text class="se-caption" x="253" y="118" text-anchor="middle">W</text><text class="se-caption" x="367" y="118" text-anchor="middle">E</text><rect class="mg-north" x="460" y="92" width="87.5" height="40" rx="3"/><rect class="mg-south" x="547.5" y="92" width="87.5" height="40" rx="3"/><text class="se-caption" x="485" y="118" text-anchor="middle">N</text><text class="se-caption" x="610" y="118" text-anchor="middle">S</text><circle class="se-process" cx="746" cy="112" r="74"/><circle class="se-accent" cx="746" cy="112" r="66"/><g transform="rotate(-90 746 112)"><path class="mg-needle-n" d="M746 63l-10 49h20Z"/><path class="mg-south" d="M746 161l-10 -49h20Z"/></g><text class="se-caption" x="746" y="57" text-anchor="middle">N</text><text class="se-caption" x="746" y="177" text-anchor="middle">S</text><text class="se-caption" x="689" y="118" text-anchor="middle">W</text><text class="se-caption" x="803" y="118" text-anchor="middle">E</text><text class="se-caption" x="220" y="236" text-anchor="middle">N approaches: north end turns away</text><text class="se-caption" x="654" y="236" text-anchor="middle">S approaches: north end turns towards</text></svg>
<text class="se-copy" x="89" y="1084"><tspan x="89">When the North pole of the magnet came close to the north end of the needle, the</tspan><tspan x="89" dy="31">needle swung away. Two like poles repelled each other.</tspan></text>
<text class="se-copy" x="89" y="1160"><tspan x="89">When the South pole came close to the north end of the needle, the needle swung</tspan><tspan x="89" dy="31">towards it. Two unlike poles attracted each other.</tspan></text>
<text class="se-copy" x="89" y="1236"><tspan x="89">The compass needle follows exactly the same rule as any other magnet. This is also</tspan><tspan x="89" dy="31">why a compass gives a wrong reading when a magnet, or a large piece of iron, is kept</tspan><tspan x="89" dy="31">near it.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">14</text></g><!-- /botanical-footer --></svg></div></div></section>
