<section class="page page--food page--science-editorial" data-science-chapter="4" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 6"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124"><tspan x="89">Two Ends, Two Poles</tspan></text>
<text class="se-copy" x="89" y="174"><tspan x="89">The filings do not spread evenly. They gather in thick bunches at the two ends of the</tspan><tspan x="89" dy="31">bar magnet. In the middle, there are hardly any.</tspan></text>
<text class="se-copy" x="89" y="250"><tspan x="89">For this bar magnet, the pull is strongest near its two ends.</tspan></text>
<text class="se-copy" x="89" y="295"><tspan x="89">These two ends are called the <tspan class="se-bold">poles</tspan> of the magnet. Every magnet has two poles. One</tspan><tspan x="89" dy="31">is called the <tspan class="se-bold">North</tspan> <tspan class="se-bold">pole</tspan>. The other is called the <tspan class="se-bold">South</tspan> <tspan class="se-bold">pole</tspan>. You will find out in a</tspan><tspan x="89" dy="31">moment why those names were chosen.</tspan></text>
<svg class="science-illustration" x="89" y="379" width="874" height="185" viewBox="0 0 874 185"><rect class="mg-north" x="90" y="20" width="130" height="48" rx="3"/><rect class="mg-south" x="220" y="20" width="130" height="48" rx="3"/><text class="se-caption" x="115" y="50" text-anchor="middle">N</text><text class="se-caption" x="325" y="50" text-anchor="middle">S</text><path class="se-accent" d="M388 44h85m-10 -7l10 7l-10 7"/><rect class="mg-north" x="510" y="20" width="62.5" height="48" rx="3"/><rect class="mg-south" x="572.5" y="20" width="62.5" height="48" rx="3"/><text class="se-caption" x="535" y="50" text-anchor="middle">N</text><text class="se-caption" x="610" y="50" text-anchor="middle">S</text><rect class="mg-north" x="674" y="20" width="62.5" height="48" rx="3"/><rect class="mg-south" x="736.5" y="20" width="62.5" height="48" rx="3"/><text class="se-caption" x="699" y="50" text-anchor="middle">N</text><text class="se-caption" x="774" y="50" text-anchor="middle">S</text><text class="se-caption" x="220" y="113" text-anchor="middle">One bar magnet</text><text class="se-caption" x="654" y="113" text-anchor="middle">Each piece has both poles.</text><text class="se-caption" x="437" y="164" text-anchor="middle">A thought experiment — do not break a magnet.</text></svg>
<text class="se-copy" x="89" y="615"><tspan x="89">A U-shaped magnet has poles at its two tips. In many school ring magnets, one flat</tspan><tspan x="89" dy="31">face is North and the other is South. Pole positions depend on how a magnet is made;</tspan><tspan x="89" dy="31">they need not look like the ends of a bar.</tspan></text>
<text class="se-copy" x="89" y="722"><tspan x="89">Now here is a question. Suppose you break a bar magnet in half. Would you get one</tspan><tspan x="89" dy="31">piece with only a North pole, and another with only a South pole?</tspan></text>
<text class="se-copy" x="89" y="798"><tspan x="89">You would not.</tspan></text>
<text class="se-copy" x="89" y="843"><tspan x="89">Each broken piece turns out to be a complete magnet, with a North pole and a South</tspan><tspan x="89" dy="31">pole of its own. Break those pieces again and the same thing happens. Poles always</tspan><tspan x="89" dy="31">come in pairs. Breaking an ordinary magnet does not give a piece with just one pole.</tspan></text>
<text class="se-copy" x="89" y="950"><tspan x="89">Do not confuse a pole with a separate piece attached to the end. The magnet is one</tspan><tspan x="89" dy="31">object. When a bar is broken, new poles appear at the broken surfaces too. The</tspan><tspan x="89" dy="31">pieces may be smaller, but each is still a complete magnet.</tspan></text>
<text class="se-copy" x="89" y="1057"><tspan x="89">A ring magnet deserves a closer look. In a common school ring magnet, the poles are</tspan><tspan x="89" dy="31">on the two broad faces, not on the inside and outside edges. Two such rings on a rod</tspan><tspan x="89" dy="31">can attract or repel depending on which faces meet.</tspan></text>
<text class="se-copy" x="89" y="1164"><tspan x="89">The letters N and S are a useful record of the poles. If the letters rub off, the poles</tspan><tspan x="89" dy="31">remain. You can identify them again by comparing the magnet with a marked</tspan><tspan x="89" dy="31">magnet or by letting it turn freely.</tspan></text>
<text class="se-copy" x="89" y="1271"><tspan x="89">Size and pole identity are different properties of a magnet.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">6</text></g><!-- /botanical-footer --></svg></div></div></section>
