<!-- ══════════════════ FRONT — Class 7 Part 1, direction: zoom ══════════════════
     The whole panel is one idea from this volume: place value, read as a zoom.
     A number line from 0 to 10; the stretch from 3 to 4 opens out into the
     next line, which counts in tenths; the stretch from 3.1 to 3.2 opens out
     again into hundredths, where 3.14 is marked. Every step down is ten
     times finer, which is what the "× 10" beside each opening says. It is
     Chapters 1 and 3 of the book (Large Numbers Around Us, A Peek Beyond the
     Point) in one drawing, and the comparison at the foot is how Chapter 3
     orders decimals. One user unit is one printed millimetre.
     ============================================================ -->
