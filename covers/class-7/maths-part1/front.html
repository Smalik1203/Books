<!-- ══════════════════ FRONT — Class 7 Part 1, direction: ribbon ══════════════════
     Type in the upper third on a cerulean ground; below it five parallel
     ribbons rise across the panel and run off both edges, and one line cuts
     them all. That is Chapter 5, Parallel and Intersecting Lines: a
     transversal across parallel lines, with the two corresponding angles
     marked equal. The ribbons are the drawing, not a pattern laid behind one.

     Two more figures sit in the clearings the ribbons leave: a decimal number
     line (Chapters 1 and 3) above them, and a triangle whose angles add up to
     180° (Chapter 7) below. One user unit is one printed millimetre.
     ============================================================ -->

                     with its two corresponding angles marked a; a decimal number line from
                     0 to 1.5 with a hop of 0.75; a strip with three quarters shaded; and a
                     triangle with angles a, b and c adding up to 180 degrees.">
