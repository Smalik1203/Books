<!-- ══════════════════ FRONT — Class 7 Part 2, direction: mobile ══════════════════
     A hanging toy from Chapter 7, Finding the Unknown, drawn large and hung
     from the top edge of the cover. It is a real problem and it balances:
     the disc says the whole toy weighs 36, so each side carries 18. On the
     right, two weights x and a 4 give 2x + 4 = 18. On the left a smaller bar
     carries 9 on one end and x with a 2 on the other, which is 9 again when
     x = 7. The equation is set under the toy and the answer is left to the
     reader.

     The arrangement is Part 1's turned over: the drawing hangs from the top
     and the title stands at the foot, so the two volumes are two different
     covers and not one cover in two colours. One user unit is one printed
     millimetre.
     ============================================================ -->
<div class="jacket__front">

  <div class="front__art">
    <svg class="jk-art" viewBox="0 0 189 246" preserveAspectRatio="xMidYMid slice"
         xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="A balanced hanging toy hung from the top of the cover. A disc marked 36 sits
                     above the main bar. From its right end hang two triangles marked x and a
                     circle marked 4. From its left end hangs a smaller bar carrying a square
                     marked 9 on one side, and a triangle marked x above a circle marked 2 on the
                     other. Under the toy: 2x + 4 = 18, x = ?">

      <!-- the hook, the total, the main bar -->
      <path class="mb-string" d="M112 -2 V43 M112 61 V70"/>
      <circle class="mb-disc" cx="112" cy="52" r="9"/>
      <text class="mb-num mb-num--ink" x="112" y="55" text-anchor="middle">36</text>
      <path class="mb-bar" d="M52 70 H172"/>
      <circle class="mb-knot" cx="112" cy="70" r="1.2"/>

      <!-- left: a smaller bar, 9 against x and 2 -->
      <path class="mb-string" d="M52 70 V100 M30 100 V112 M74 100 V109 M74 124 V133"/>
      <path class="mb-bar" d="M30 100 H74"/>
      <circle class="mb-knot" cx="52" cy="100" r="1"/>
      <rect class="mb-sq" x="22" y="112" width="16" height="16" rx="1.2"/>
      <text class="mb-num" x="30" y="123.2" text-anchor="middle">9</text>
      <path class="mb-tri" d="M74 109 L83 124 L65 124 Z"/>
      <text class="mb-x" x="74" y="121.6" text-anchor="middle">x</text>
      <circle class="mb-circ" cx="74" cy="140" r="7"/>
      <text class="mb-num" x="74" y="142.6" text-anchor="middle">2</text>

      <!-- right: x, x and 4 -->
      <path class="mb-string" d="M172 70 V81 M172 96 V103 M172 118 V126"/>
      <path class="mb-tri" d="M172 81 L181 96 L163 96 Z"/>
      <text class="mb-x" x="172" y="93.6" text-anchor="middle">x</text>
      <path class="mb-tri" d="M172 103 L181 118 L163 118 Z"/>
      <text class="mb-x" x="172" y="115.6" text-anchor="middle">x</text>
      <circle class="mb-circ" cx="172" cy="133" r="7"/>
      <text class="mb-num" x="172" y="135.6" text-anchor="middle">4</text>

      <!-- the equation the right side makes, and the question -->
      <text class="mb-eq" x="112" y="163" text-anchor="middle">2x + 4 = 18</text>
      <text class="mb-eq mb-eq--q" x="112" y="174" text-anchor="middle">x = ?</text>
    </svg>
  </div>

  <div class="c7-head">
    <div>
      <div class="wordmark">Class<em>Bridge</em></div>
      <p class="front__tagline">Textbooks for school mathematics.</p>
    </div>
    <div class="c7-badge">

    </div>
  </div>
