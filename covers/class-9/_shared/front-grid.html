<!-- ══════════════════ FRONT — direction: grid ══════════════════
     Graph paper and a number. The class numeral is set past two
     edges so the trim crops it; a numeral that fits inside the
     margins reads as a caption, not as artwork.
     ============================================================ -->
<div class="jacket__front">

  <div class="front__art">
    <svg class="jk-art" viewBox="0 0 176 250" preserveAspectRatio="xMidYMid slice"
         xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="A plotted field of graph-paper squares.">
      <defs>
        <pattern id="jk-grid-sm" width="5" height="5" patternUnits="userSpaceOnUse">
          <path class="jk-grid-line" d="M5 0H0V5"/>
        </pattern>
        <pattern id="jk-grid-lg" width="25" height="25" patternUnits="userSpaceOnUse">
          <path class="jk-grid-line jk-grid-line--major" d="M25 0H0V25"/>
        </pattern>
      </defs>
      <rect x="-12" y="-12" width="200" height="274" fill="url(#jk-grid-sm)"/>
      <rect x="-12" y="-12" width="200" height="274" fill="url(#jk-grid-lg)"/>
    </svg>
  </div>

  <div class="front__bleedbox"><span class="dir-num" aria-hidden="true">9</span></div>

  <div class="front__head">
    <div>
      <div class="wordmark">Class<em>Bridge</em></div>
      <p class="front__tagline">Building strong foundations.</p>
    </div>
    <div class="classmark">
      <span class="jk-label">Class 9</span>
      <span class="classmark__part"><span class="jk-label">Part 1</span></span>
    </div>
  </div>

  <div class="front__title">
    <span class="dir-rule" aria-hidden="true"></span>
    <h1>MATHEMATICS</h1>
    <p class="front__subtitle">Textbook for Class IX</p>
    <span class="jk-label jk-label--terra">Based on NCERT</span>
  </div>

  <div class="front__foot">
    <p class="jk-kicker">Powered by</p>
    <div class="learnlab">Learn<em>Lab</em></div>
    <p class="front__promise">Interactive learning.<br>In the classroom. At home. Everywhere.</p>
  </div>
</div>
