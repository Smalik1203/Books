<!-- ══════════ FRONT — Class 8 Part 2, direction: tile ══════════
     The volume's own idea, drawn as its proof: two squares make one.
     Two equal squares of side a + b hold the same four right triangles,
     legs a and b. Set one way, the triangles leave two squares uncovered,
     a² and b²; set the other way, they leave one tilted square, c². The
     four triangles are the same pieces, so the space they leave is the same
     area, and a² + b² = c². That is Chapter 2 (Two Squares Make One), and
     it is the method of Chapters 4 and 7 as well: take a shape apart and
     move the pieces without changing the area.

     It replaces a copy of arc's composition — translucent discs with small
     figures floating on them — which belonged to Class 9 and said nothing
     about this book. The wine, amber and cream are unchanged.

     Side 68, a = 23, b = 45; left square at x 16, right at x 105, both
     from y 104. One user unit is one printed millimetre.
     ============================================================ -->
