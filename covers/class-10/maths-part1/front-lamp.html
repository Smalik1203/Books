     (Triangles). A lamp 3.6 m above level ground; a girl 0.9 m tall who

     which the similar triangles make 1.6 m.

     to the metre. Ground at y 214. The lamp is at (44, 142), 72 above the
     ground; the girl's head is at (140, 196), 18 above it; the ray through
     both meets the ground at (172, 214). Its slope is 54/96 = 72/128, so
     the drawing is the answer, not an illustration of it. The houses,
