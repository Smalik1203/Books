       Prime Time                    the factor tree of 12
       Symmetry                      a shape and its mirror line
       Perimeter and Area            a rectangle counted in unit squares
       Number Play                   7641 − 1467 = 6174, Kaprekar's number
       The Other Side of Zero        a number line from −3 to 3
       Playing with Constructions    two circles and where they cross
       Data Handling                 a bar chart
