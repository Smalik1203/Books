<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="churn-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">9.7 Churning and Magnetic Separation</tspan></text></g>
<g class="v2-reading-block" data-block="churn-art" transform="translate(0 170)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">In Madhya Pradesh, the children see a mathni</tspan><tspan x="89" dy="32" data-narrow-prose="true">used to churn full-fat curd. <tspan class="se-bold">Churning</tspan> agitates</tspan><tspan x="89" dy="32" data-narrow-prose="true">the mixture so that small fat droplets join into</tspan><tspan x="89" dy="32" data-narrow-prose="true">larger butter grains or clumps. These can be</tspan><tspan x="89" dy="32" data-narrow-prose="true">collected, leaving a more watery liquid called</tspan><tspan x="89" dy="32" data-paragraph-end="true">buttermilk.</tspan></text><text class="se-copy" x="89" y="232" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">The butter may gather near the top, but</tspan><tspan x="89" dy="32" data-narrow-prose="true">churning does more than let a lighter</tspan><tspan x="89" dy="32" data-narrow-prose="true">substance float: it helps the fat join together.</tspan><tspan x="89" dy="32" data-narrow-prose="true">Churning cream or suitable curd produces</tspan><tspan x="89" dy="32" data-narrow-prose="true">butter. It is not the usual method for</tspan><tspan x="89" dy="32" data-paragraph-end="true">separating cream from milk.</tspan></text><image class="science-illustration" data-photo="churning" href="../../figures/class-6/science/ch09/churning.png" x="645.2665895061729" y="0" width="285.46682098765433" height="305" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="448.88"><tspan x="89">Fig. 9.5 · A mathni and pot, with collected butter beside them.</tspan></text></g>
<g class="v2-reading-block" data-block="milk-0" transform="translate(0 647)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.73076" data-space-ratio="1.667">An<tspan dx="3.73076"> adult</tspan><tspan dx="3.73076"> can</tspan><tspan dx="3.73076"> demonstrate</tspan><tspan dx="3.73076"> curdling</tspan><tspan dx="3.73076"> fresh</tspan><tspan dx="3.73076"> pasteurised</tspan><tspan dx="3.73076"> milk</tspan><tspan dx="3.73076"> with</tspan><tspan dx="3.73076"> a</tspan><tspan dx="3.73076"> suitable</tspan><tspan dx="3.73076"> food</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="6.77048" data-space-ratio="2.211">acid,<tspan dx="6.77048"> then</tspan><tspan dx="6.77048"> straining</tspan><tspan dx="6.77048"> the</tspan><tspan dx="6.77048"> curds</tspan><tspan dx="6.77048"> from</tspan><tspan dx="6.77048"> the</tspan><tspan dx="6.77048"> liquid.</tspan><tspan dx="6.77048"> Curdling</tspan><tspan dx="6.77048"> creates</tspan><tspan dx="6.77048"> the</tspan><tspan dx="6.77048"> clumps;</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="milk-1" transform="translate(0 711)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.29024" data-space-ratio="1.588">straining<tspan dx="3.29024"> separates</tspan><tspan dx="3.29024"> them.</tspan><tspan dx="3.29024"> Milk</tspan><tspan dx="3.29024"> that</tspan><tspan dx="3.29024"> has</tspan><tspan dx="3.29024"> spoiled</tspan><tspan dx="3.29024"> accidentally</tspan><tspan dx="3.29024"> is</tspan><tspan dx="3.29024"> different:</tspan><tspan dx="3.29024"> do</tspan><tspan dx="3.29024"> not</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">taste it or assume cooking will make it safe. An adult should discard suspect milk.</tspan></text></g>
<g class="v2-reading-block" data-block="appliance-0" transform="translate(0 791)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.52181" data-space-ratio="1.093">A<tspan dx="0.52181"> hand</tspan><tspan dx="0.52181"> churner</tspan><tspan dx="0.52181"> or</tspan><tspan dx="0.52181"> an</tspan><tspan dx="0.52181"> appropriate</tspan><tspan dx="0.52181"> electric</tspan><tspan dx="0.52181"> churner</tspan><tspan dx="0.52181"> can</tspan><tspan dx="0.52181"> supply</tspan><tspan dx="0.52181"> agitation.</tspan><tspan dx="0.52181"> Name</tspan><tspan dx="0.52181"> an</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.68055" data-space-ratio="1.301">appliance<tspan dx="1.68055"> used</tspan><tspan dx="1.68055"> for</tspan><tspan dx="1.68055"> this</tspan><tspan dx="1.68055"> job</tspan><tspan dx="1.68055"> at</tspan><tspan dx="1.68055"> home,</tspan><tspan dx="1.68055"> if</tspan><tspan dx="1.68055"> there</tspan><tspan dx="1.68055"> is</tspan><tspan dx="1.68055"> one,</tspan><tspan dx="1.68055"> and</tspan><tspan dx="1.68055"> explain</tspan><tspan dx="1.68055"> its</tspan><tspan dx="1.68055"> role.</tspan><tspan dx="1.68055"> Observe</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="appliance-1" transform="translate(0 855)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.76215" data-space-ratio="1.673">only<tspan dx="3.76215"> while</tspan><tspan dx="3.76215"> an</tspan><tspan dx="3.76215"> adult</tspan><tspan dx="3.76215"> operates</tspan><tspan dx="3.76215"> it;</tspan><tspan dx="3.76215"> do</tspan><tspan dx="3.76215"> not</tspan><tspan dx="3.76215"> insert</tspan><tspan dx="3.76215"> fingers</tspan><tspan dx="3.76215"> or</tspan><tspan dx="3.76215"> utensils</tspan><tspan dx="3.76215"> into</tspan><tspan dx="3.76215"> a</tspan><tspan dx="3.76215"> moving</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">appliance.</tspan></text></g>
<g class="v2-reading-block" data-block="magnet-art" transform="translate(0 935)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">In Shillong, a carpenter spills iron nails into</tspan><tspan x="89" dy="32" data-narrow-prose="true">wood shavings. A magnet can attract the iron</tspan><tspan x="89" dy="32" data-narrow-prose="true">while leaving most of the wood behind. This is</tspan><tspan x="89" dy="32" data-narrow-prose="true"><tspan class="se-bold">magnetic</tspan> <tspan class="se-bold">separation</tspan>: it uses a difference in</tspan><tspan x="89" dy="32" data-paragraph-end="true">magnetic response.</tspan></text><text class="se-copy" x="89" y="200" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">Use large steel paper clips mixed with paper</tspan><tspan x="89" dy="32" data-narrow-prose="true">pieces for a classroom model. Test one clip</tspan><tspan x="89" dy="32" data-narrow-prose="true">first with the magnet, then try the mixture. Do</tspan><tspan x="89" dy="32" data-narrow-prose="true">not use iron powder, sharp nails or dusty</tspan><tspan x="89" dy="32" data-narrow-prose="true">sawdust. Keep magnets away from electronic</tspan><tspan x="89" dy="32" data-paragraph-end="true">devices.</tspan></text><image class="science-illustration" data-photo="magnet" href="../../figures/class-6/science/ch09/magnet.png" x="613" y="0.20304568527919287" width="350" height="289.5939086294416" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="416.88"><tspan x="89">Fig. 9.6 · Iron nails contact the magnet; most wood shavings remain in the tray.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
