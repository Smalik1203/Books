<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="magnet-art" transform="translate(0 112)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">In Shillong, a carpenter spills iron nails into</tspan><tspan x="89" dy="32" data-narrow-prose="true">wood shavings. A magnet can attract the iron</tspan><tspan x="89" dy="32" data-narrow-prose="true">while leaving most of the wood behind. This is</tspan><tspan x="89" dy="32" data-narrow-prose="true"><tspan class="se-bold">magnetic</tspan> <tspan class="se-bold">separation</tspan>: it uses a difference in</tspan><tspan x="89" dy="32" data-paragraph-end="true">magnetic response.</tspan></text><text class="se-copy" x="89" y="200" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">Use large steel paper clips mixed with paper</tspan><tspan x="89" dy="32" data-narrow-prose="true">pieces for a classroom model. Test one clip</tspan><tspan x="89" dy="32" data-narrow-prose="true">first with the magnet, then try the mixture. Do</tspan><tspan x="89" dy="32" data-narrow-prose="true">not use iron powder, sharp nails or dusty</tspan><tspan x="89" dy="32" data-narrow-prose="true">sawdust. Keep magnets away from electronic</tspan><tspan x="89" dy="32" data-paragraph-end="true">devices.</tspan></text><image class="science-illustration" data-photo="magnet" href="../../figures/class-6/science/ch09/magnet.png" x="613" y="0.20304568527919287" width="350" height="289.5939086294416" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="416.88"><tspan x="89">Fig. 9.6 · Iron nails contact the magnet; most wood shavings remain in the tray.</tspan></text></g>
<g class="v2-reading-block" data-block="magnet-limit" transform="translate(0 557)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.50178" data-space-ratio="1.090">Not<tspan dx="0.50178"> every</tspan><tspan dx="0.50178"> metal</tspan><tspan dx="0.50178"> is</tspan><tspan dx="0.50178"> strongly</tspan><tspan dx="0.50178"> attracted</tspan><tspan dx="0.50178"> to</tspan><tspan dx="0.50178"> a</tspan><tspan dx="0.50178"> classroom</tspan><tspan dx="0.50178"> magnet.</tspan><tspan dx="0.50178"> Iron</tspan><tspan dx="0.50178"> and</tspan><tspan dx="0.50178"> many</tspan><tspan dx="0.50178"> steels</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="10.66180" data-space-ratio="2.907">are;<tspan dx="10.66180"> aluminium</tspan><tspan dx="10.66180"> and</tspan><tspan dx="10.66180"> copper</tspan><tspan dx="10.66180"> are</tspan><tspan dx="10.66180"> not.</tspan><tspan dx="10.66180"> A</tspan><tspan dx="10.66180"> magnet</tspan><tspan dx="10.66180"> also</tspan><tspan dx="10.66180"> cannot</tspan><tspan dx="10.66180"> separate</tspan><tspan dx="10.66180"> two</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.72475" data-space-ratio="1.130">components<tspan dx="0.72475"> if</tspan><tspan dx="0.72475"> both</tspan><tspan dx="0.72475"> respond</tspan><tspan dx="0.72475"> similarly.</tspan><tspan dx="0.72475"> Some</tspan><tspan dx="0.72475"> non-magnetic</tspan><tspan dx="0.72475"> pieces</tspan><tspan dx="0.72475"> may</tspan><tspan dx="0.72475"> be</tspan><tspan dx="0.72475"> carried</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">along when caught between attracted objects, so inspect the recovered material.</tspan></text></g>
<g class="v2-reading-block" data-block="recycling" transform="translate(0 701)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="9.43168" data-space-ratio="2.687">Recyclers<tspan dx="9.43168"> use</tspan><tspan dx="9.43168"> large</tspan><tspan dx="9.43168"> magnets</tspan><tspan dx="9.43168"> to</tspan><tspan dx="9.43168"> lift</tspan><tspan dx="9.43168"> iron</tspan><tspan dx="9.43168"> and</tspan><tspan dx="9.43168"> steel</tspan><tspan dx="9.43168"> from</tspan><tspan dx="9.43168"> mixed</tspan><tspan dx="9.43168"> scrap.</tspan><tspan dx="9.43168"> The</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.67413" data-space-ratio="1.836">recovered<tspan dx="4.67413"> metal</tspan><tspan dx="4.67413"> can</tspan><tspan dx="4.67413"> be</tspan><tspan dx="4.67413"> sorted</tspan><tspan dx="4.67413"> and</tspan><tspan dx="4.67413"> processed</tspan><tspan dx="4.67413"> for</tspan><tspan dx="4.67413"> reuse.</tspan><tspan dx="4.67413"> Other</tspan><tspan dx="4.67413"> materials</tspan><tspan dx="4.67413"> need</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.94365" data-space-ratio="1.705">other<tspan dx="3.94365"> methods.</tspan><tspan dx="3.94365"> A</tspan><tspan dx="3.94365"> magnetic</tspan><tspan dx="3.94365"> crane</tspan><tspan dx="3.94365"> is</tspan><tspan dx="3.94365"> an</tspan><tspan dx="3.94365"> industrial</tspan><tspan dx="3.94365"> machine;</tspan><tspan dx="3.94365"> watch</tspan><tspan dx="3.94365"> only</tspan><tspan dx="3.94365"> from</tspan><tspan dx="3.94365"> a</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">permitted safe area, never from beneath its load.</tspan></text></g>
<g class="v2-reading-block" data-block="sequence-heading" transform="translate(0 857)"><text class="v2-title" x="89" y="38"><tspan x="89">9.8 Choosing a Sequence</tspan></text></g>
<g class="v2-reading-block" data-block="sequence" transform="translate(0 915)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="7.43859" data-space-ratio="2.330">Ask<tspan dx="7.43859"> three</tspan><tspan dx="7.43859"> questions</tspan><tspan dx="7.43859"> before</tspan><tspan dx="7.43859"> choosing:</tspan><tspan dx="7.43859"> What</tspan><tspan dx="7.43859"> components</tspan><tspan dx="7.43859"> are</tspan><tspan dx="7.43859"> present?</tspan><tspan dx="7.43859"> Which</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.40465" data-space-ratio="1.609">properties<tspan dx="3.40465"> differ?</tspan><tspan dx="3.40465"> What</tspan><tspan dx="3.40465"> must</tspan><tspan dx="3.40465"> be</tspan><tspan dx="3.40465"> recovered?</tspan><tspan dx="3.40465"> To</tspan><tspan dx="3.40465"> recover</tspan><tspan dx="3.40465"> salt</tspan><tspan dx="3.40465"> from</tspan><tspan dx="3.40465"> sand</tspan><tspan dx="3.40465"> and</tspan><tspan dx="3.40465"> salt,</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.98708" data-space-ratio="1.534">for<tspan dx="2.98708"> example,</tspan><tspan dx="2.98708"> dissolve</tspan><tspan dx="2.98708"> the</tspan><tspan dx="2.98708"> salt</tspan><tspan dx="2.98708"> in</tspan><tspan dx="2.98708"> water,</tspan><tspan dx="2.98708"> filter</tspan><tspan dx="2.98708"> off</tspan><tspan dx="2.98708"> the</tspan><tspan dx="2.98708"> sand,</tspan><tspan dx="2.98708"> then</tspan><tspan dx="2.98708"> evaporate</tspan><tspan dx="2.98708"> water</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.42984" data-space-ratio="1.256">from<tspan dx="1.42984"> the</tspan><tspan dx="1.42984"> filtrate.</tspan><tspan dx="1.42984"> Filtering</tspan><tspan dx="1.42984"> first</tspan><tspan dx="1.42984"> without</tspan><tspan dx="1.42984"> adding</tspan><tspan dx="1.42984"> water</tspan><tspan dx="1.42984"> would</tspan><tspan dx="1.42984"> not</tspan><tspan dx="1.42984"> use</tspan><tspan dx="1.42984"> the</tspan><tspan dx="1.42984"> solubility</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">difference.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
