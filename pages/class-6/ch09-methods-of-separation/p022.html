<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="22"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 22"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q9" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">9.</text><text class="se-copy" x="132" y="24"><tspan x="132">You have a dry mixture of whole potatoes, common salt and sawdust. Plan</tspan><tspan x="132" dy="32">how to recover all three, explaining each step and where each component</tspan><tspan x="132" dy="32">goes. You may add water. Which component would not be retained by</tspan><tspan x="132" dy="32">ordinary filter paper after dissolving? Keep this as a written plan; an adult</tspan><tspan x="132" dy="32">would handle any heating.</tspan></text></g>
<g class="v2-reading-block" data-block="q10" transform="translate(0 302)"><text class="se-copy" x="111" y="24" text-anchor="end">10.</text><text class="se-copy" x="132" y="24"><tspan x="132">Read the story and supply the choices that describe what happened. Then</tspan><tspan x="132" dy="32">challenge the final claim. Give the story a suitable title.</tspan></text><g transform="translate(0 80)"><g data-comparison-table="q10-matching"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Leela’s water story</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Part of the story</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="697.32" y="70.08"><tspan x="697.32">Choose words</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Before her father became ___, Leela collected ___ from a</tspan><tspan x="103" dy="28">pond.</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="697.32" y="110.08"><tspan x="697.32">thirsty / hungry; water /</tspan><tspan x="697.32" dy="28">grain</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">It looked muddy, so she judged it ___ for drinking</tspan><tspan x="103" dy="28">without suitable treatment.</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="697.32" y="178.07999999999998"><tspan x="697.32">fit / unfit</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="218" y2="218"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="246.07999999999998"><tspan x="103">She let particles settle, poured off the upper liquid, then</tspan><tspan x="103" dy="28">___ it through ___.</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="697.32" y="246.07999999999998"><tspan x="697.32">filtered / churned; clean</tspan><tspan x="697.32" dy="28">cloth / a solid metal</tspan><tspan x="697.32" dy="28">sheet</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="314" y2="314"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="342.08"><tspan x="103">An adult ___ the water and then let it ___ in a clean</tspan><tspan x="103" dy="28">covered vessel.</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="697.32" y="342.08"><tspan x="697.32">boiled / froze; cool / boil</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="382" y2="382"/><rect class="v2-table-frame" x="89" y="42" width="874" height="340"/><line class="v2-table-rule" x1="683.32" x2="683.32" y1="42" y2="382"/><text class="v2-table-note" x="89" y="414.88"><tspan x="89">Leela says, “It looks clear now, so it must be safe.” Is this enough evidence? Explain why</tspan><tspan x="89" dy="26">boiling cannot remove every harmful chemical. This is a story to evaluate, not an instruction</tspan><tspan x="89" dy="26">to collect or drink pond water.</tspan></text></g></g></g><g transform="translate(0 884)"><g data-page-illustration="figures/class-6/science/ch09/filtration.png"><image class="science-illustration" href="../../figures/class-6/science/ch09/filtration.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>A filtration setup.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">A filtration setup.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text c
