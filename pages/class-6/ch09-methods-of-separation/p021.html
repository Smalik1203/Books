<g class="v2-reading-block" data-block="q6" transform="translate(0 542)"><text class="se-copy" x="111" y="24" text-anchor="end">6.</text><text class="se-copy" x="132" y="24"><tspan x="132">When might you use decantation instead of filtration for a solid–liquid</tspan><tspan x="132" dy="32">mixture? Explain what you would need to observe first, and describe a</tspan><tspan x="132" dy="32">limitation of the recovered liquid.</tspan></text></g>
<g class="v2-reading-block" data-block="q7" transform="translate(0 668)"><text class="se-copy" x="111" y="24" text-anchor="end">7.</text><text class="se-copy" x="132" y="24"><tspan x="132">How are nasal hairs loosely similar to a filter? Explain why this comparison</tspan><tspan x="132" dy="32">does not mean that they stop every airborne particle or make polluted air</tspan><tspan x="132" dy="32">safe.</tspan></text></g>
<g class="v2-reading-block" data-block="q8" transform="translate(0 794)"><text class="se-copy" x="111" y="24" text-anchor="end">8.</text><text class="se-copy" x="132" y="24"><tspan x="132">Cloth masks may use woven fabrics; medical masks commonly use layers of</tspan><tspan x="132" dy="32">non-woven material. How does filtering breathed-out or breathed-in</tspan><tspan x="132" dy="32">particles help reduce the spread of respiratory infections? Why do material,</tspan><tspan x="132" dy="32">fit and gaps matter? Do not test a mask with smoke or powders.</tspan></text></g><g transform="translate(0 952)"><g data-page-illustration="figures/class-6/science/ch09/filtration.png"><image class="science-illustration" href="../../figures/class-6/science/ch09/filtration.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>A filtration setup.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">A filtration setup.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">21</text></g></svg></div></div></section>
