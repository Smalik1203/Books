<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="settling-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">9.5 Settling and Pouring Off</tspan></text></g>
<g class="v2-reading-block" data-block="settling-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">In Puducherry, the family compares ways of removing tea leaves from tea. Some</tspan><tspan x="89" dy="32">leaves may settle when the liquid is left still; others can float or remain</tspan></text></g>
<g class="v2-reading-block" data-block="settling-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">suspended. Use a cool mixture for classroom comparisons. Do not handle hot tea</tspan><tspan x="89" dy="32">or water.</tspan></text></g>
<g class="v2-reading-block" data-block="sediment-0" transform="translate(0 314)"><text class="se-copy" x="89" y="24"><tspan x="89">When suspended insoluble particles settle under gravity, the process is</tspan><tspan x="89" dy="32"><tspan class="se-bold">sedimentation</tspan>. It works well for some particles, such as coarse sand in water, but</tspan></text></g>
<g class="v2-reading-block" data-block="sediment-1" transform="translate(0 378)"><text class="se-copy" x="89" y="24"><tspan x="89">very fine particles may remain suspended for a long time. A substance dissolved</tspan><tspan x="89" dy="32">in water does not simply settle out like sand.</tspan></text></g>
<g class="v2-reading-block" data-block="decant-0" transform="translate(0 458)"><text class="se-copy" x="89" y="24"><tspan x="89">Carefully pouring off the liquid without greatly disturbing a settled solid is</tspan><tspan x="89" dy="32"><tspan class="se-bold">decantation</tspan>. Some liquid is usually left with the solid, and fine particles may</tspan></text></g>
<g class="v2-reading-block" data-block="decant-1" transform="translate(0 522)"><text class="se-copy" x="89" y="24"><tspan x="89">pour out too. The method can still be useful; incomplete separation does not</tspan><tspan x="89" dy="32">make it an invalid method.</tspan></text></g>
<g class="v2-reading-block" data-block="settle-task" transform="translate(0 602)"><rect class="se-activity-panel" x="89" y="0" width="874" height="338" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Stir clean sand into water in a clear container. Leave it still and record</tspan><tspan x="146" dy="32">what changes. Keep an identical, freshly stirred sample for comparison.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Once particles have settled, slowly pour some upper liquid into another</tspan><tspan x="146" dy="32">container. Stop before the sediment reaches the lip. Compare the poured</tspan><tspan x="146" dy="32">liquid, the residue and the stirred sample.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Record which material you recovered and what remains mixed. Do not</tspan><tspan x="146" dy="32">drink any of the samples.</tspan></text></g>
<g class="v2-reading-block" data-block="oil-water-0" transform="translate(0 962)"><text class="se-copy" x="89" y="24"><tspan x="89">Oil and water can form separate liquid layers when left still. One layer can be</tspan><tspan x="89" dy="32">carefully poured away from the other, although pouring by hand often leaves</tspan></text></g>
<g class="v2-reading-block" data-block="oil-water-1" transform="translate(0 1026)"><text class="se-copy" x="89" y="24"><tspan x="89">some mixing near the boundary. A separating funnel gives better control. The</tspan><tspan x="89" dy="32">useful property here is that the liquids do not mix into one uniform liquid, not</tspan><tspan x="89" dy="32">that either is a solid.</tspan></text></g><g transform="translate(0 1138)"><g data-page-illustration="figures/class-6/science/ch09/filtration.png"><image class="science-illustration" href="../../figures/class-6/science/ch09/filtration.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A filtration setup.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A filtration setup.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
