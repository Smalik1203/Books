<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="assessment-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Let Us Enhance Our Learning</tspan></text></g>
<g class="v2-reading-block" data-block="assessment-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Answer in your notebook, giving reasons.</tspan></text></g>
<g class="v2-reading-block" data-block="q1" transform="translate(0 218)"><text class="se-copy" x="111" y="24" text-anchor="end">1.</text><text class="se-copy" x="132" y="24"><tspan x="132">Handpicking is used for: (a) filtration, (b) sorting, (c) evaporation or (d)</tspan><tspan x="132" dy="32">decantation. Explain your choice.</tspan></text></g>
<g class="v2-reading-block" data-block="q2" transform="translate(0 312)"><text class="se-copy" x="111" y="24" text-anchor="end">2.</text><text class="se-copy" x="132" y="24"><tspan x="132">Churning commonly separates: (a) oil from water, (b) sand from water, (c)</tspan><tspan x="132" dy="32">butter from cream or suitable curd, or (d) oxygen from air. Explain your</tspan><tspan x="132" dy="32">choice.</tspan></text></g>
<g class="v2-reading-block" data-block="q3" transform="translate(0 438)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24"><tspan x="132">Which matters especially in filtration: (a) apparatus size, (b) air alone, (c)</tspan><tspan x="132" dy="32">pore structure relative to particles, or (d) vessel colour? Give a reason.</tspan></text></g>
<g class="v2-reading-block" data-block="q4" transform="translate(0 532)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24"><tspan x="132">Judge each claim and correct it if needed. Give reasons.</tspan></text><g transform="translate(0 48)"><g data-comparison-table="q4-matching"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Claims to examine</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Claim</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">A. Salt can be recovered from salt solution by leaving it in sunlight.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="122" y2="122"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="150.07999999999998"><tspan x="103">B. Handpicking can only be used when one component is present in a small quantity.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="162" y2="162"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="190.07999999999998"><tspan x="103">C. Puffed rice and loose rice grains are separated by threshing.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="202" y2="202"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="230.07999999999998"><tspan x="103">D. Mustard oil and lemon water can be separated by decantation after distinct layers</tspan><tspan x="103" dy="28">form.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="270" y2="270"/><g data-comparison-row="5"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="298.08"><tspan x="103">E. A dry sieve is the appropriate method for separating rice flour mixed into water.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="310" y2="310"/><rect class="v2-table-frame" x="89" y="42" width="874" height="268"/><text class="v2-table-note" x="89" y="342.88"><tspan x="89">Distinguish a convenient method from a rule that says no other situation is possible.</tspan></text></g></g></g>
<g class="v2-reading-block" data-block="q5" transform="translate(0 958)"><text class="se-copy" x="111" y="24" text-anchor="end">5.</text><text class="se-copy" x="132" y="24"><tspan x="132">Match mixtures with suitable methods. Explain the property used in two</tspan><tspan x="132" dy="32">matches; options are out of order.</tspan></text><g transform="translate(0 80)"><g data-comparison-table="q5-matching"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Mixtures and method options</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Mixture</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="627.4" y="70.08"><tspan x="627.4">Method option</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">1. Gram flour and whole black gram</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="627.4" y="110.08"><tspan x="627.4">A. Handpicking</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="122" y2="122"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="150.07999999999998"><tspan x="103">2. Chalk powder suspended in water</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="627.4" y="150.07999999999998"><tspan x="627.4">B. Magnetic separation</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="162" y2="162"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="190.07999999999998"><tspan x="103">3. Loose corn kernels and whole potatoes</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="627.4" y="190.07999999999998"><tspan x="627.4">C. Decantation</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="202" y2="202"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="230.07999999999998"><tspan x="103">4. Iron powder and sawdust</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="627.4" y="230.07999999999998"><tspan x="627.4">D. Sieving</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="242" y2="242"/><g data-comparison-row="5"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="270.08"><tspan x="103">5. Oil and water in separate layers</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="627.4" y="270.08"><tspan x="627.4">E. Filtration</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="282" y2="282"/><rect class="v2-table-frame" x="89" y="42" width="874" height="240"/><line class="v2-table-rule" x1="613.4" x2="613.4" y1="42" y2="282"/><text class="v2-table-note" x="89" y="314.88"><tspan x="89">This is a reasoning question. Do not handle iron powder or dusty mixtures.</tspan></text></g></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
