<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="games-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Let Us Play</tspan></text></g>
<g class="v2-reading-block" data-block="wise-fish" transform="translate(0 170)"><text class="se-heading" x="89" y="30"><tspan x="89">Wise Fish: match a method to an idea</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Write method names on red paper fish and descriptions on blue cards, using the</tspan><tspan x="89" dy="32">table below. Attach a large steel clip to each. An adult should secure a large</tspan><tspan x="89" dy="32">magnet to a short string on a cardboard rod. Fish out a method and its matching</tspan><tspan x="89" dy="32">description, then explain the match. Keep magnets and clips away from mouths</tspan><tspan x="89" dy="32">and younger children; do not swing the rod.</tspan></text></g>
<g class="v2-reading-block" data-block="fish-cards" transform="translate(0 406)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Make two separate sets of cards</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Method cards</tspan></text><text class="v2-table-heading" x="391.42" y="76.08"><tspan x="391.42">Description cards, mixed order</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Filtration</tspan></text><text class="se-copy se-table-copy" x="391.42" y="128.07999999999998"><tspan x="391.42">A. Grains loosen from stalks.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="146" y2="146"/><text class="se-copy se-table-copy" x="103" y="180.07999999999998"><tspan x="103">Decantation</tspan></text><text class="se-copy se-table-copy" x="391.42" y="180.07999999999998"><tspan x="391.42">B. Vapour changes to liquid.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="198" y2="198"/><text class="se-copy se-table-copy" x="103" y="232.07999999999998"><tspan x="103">Condensation</tspan></text><text class="se-copy se-table-copy" x="391.42" y="232.07999999999998"><tspan x="391.42">C. Recognisable pieces are picked out.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="250" y2="250"/><text class="se-copy se-table-copy" x="103" y="284.08"><tspan x="103">Handpicking</tspan></text><text class="se-copy se-table-copy" x="391.42" y="284.08"><tspan x="391.42">D. Water leaves as vapour, leaving dissolved salt.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="302" y2="302"/><text class="se-copy se-table-copy" x="103" y="336.08"><tspan x="103">Churning</tspan></text><text class="se-copy se-table-copy" x="391.42" y="336.08"><tspan x="391.42">E. Magnetic response differs.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="354" y2="354"/><text class="se-copy se-table-copy" x="103" y="388.08"><tspan x="103">Evaporation</tspan></text><text class="se-copy se-table-copy" x="391.42" y="388.08"><tspan x="391.42">F. Butter clumps form through agitation.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="406" y2="406"/><text class="se-copy se-table-copy" x="103" y="440.08"><tspan x="103">Winnowing</tspan></text><text class="se-copy se-table-copy" x="391.42" y="440.08"><tspan x="391.42">G. Solid particles pass or remain according to mesh</tspan><tspan x="391.42" dy="28">size.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="486" y2="486"/><text class="se-copy se-table-copy" x="103" y="520.08"><tspan x="103">Sedimentation</tspan></text><text class="se-copy se-table-copy" x="391.42" y="520.08"><tspan x="391.42">H. Insoluble particles are retained by a filter.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="538" y2="538"/><text class="se-copy se-table-copy" x="103" y="572.08"><tspan x="103">Sieving</tspan></text><text class="se-copy se-table-copy" x="391.42" y="572.08"><tspan x="391.42">I. Suspended particles settle under gravity.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="590" y2="590"/><text class="se-copy se-table-copy" x="103" y="624.08"><tspan x="103">Threshing</tspan></text><text class="se-copy se-table-copy" x="391.42" y="624.08"><tspan x="391.42">J. Moving air carries some components farther.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="642" y2="642"/><text class="se-copy se-table-copy" x="103" y="676.08"><tspan x="103">Magnetic separation</tspan></text><text class="se-copy se-table-copy" x="391.42" y="676.08"><tspan x="391.42">K. One separated liquid layer is poured from another.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="694" y2="694"/><rect class="v2-table-frame" x="89" y="42" width="874" height="652"/><line class="v2-table-rule" x1="377.42" x2="377.42" y1="42" y2="694"/><text class="v2-table-note" x="89" y="726.88"><tspan x="89">Items across a row are not matching pairs. Match by the mechanism, not the position.</tspan></text></g><g transform="translate(0 1158)"><g data-page-illustration="figures/class-6/science/ch09/magnet.png"><image class="science-illustration" href="../../figures/class-6/science/ch09/magnet.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Magnetic separation equipment.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Magnetic separation equipment.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
