<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204"><tspan x="112">Choose a separation method from the components’ properties and the</tspan><tspan x="112" dy="32">purpose. More than one component may be useful.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278"><tspan x="112">Handpicking suits recognisable pieces. Threshing releases grains attached to</tspan><tspan x="112" dy="32">stalks.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352"><tspan x="112">Winnowing uses different responses to moving air. Sieving uses particle size</tspan><tspan x="112" dy="32">relative to mesh openings.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426"><tspan x="112">Evaporation can recover a dissolved solid such as salt. Recovering the water too</tspan><tspan x="112" dy="32">requires collecting and condensing its vapour.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500"><tspan x="112">Sedimentation lets suitable suspended particles settle. Decantation pours off</tspan><tspan x="112" dy="32">liquid without greatly disturbing the settled solid or another liquid layer.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574"><tspan x="112">Filtration retains some insoluble particles. The retained solid is residue; the</tspan><tspan x="112" dy="32">liquid that passes through is filtrate.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648"><tspan x="112">Ordinary filter paper does not remove dissolved salt. Clear-looking water is not</tspan><tspan x="112" dy="32">necessarily safe drinking water.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722"><tspan x="112">Churning helps fat droplets join into butter clumps. Magnetic separation uses</tspan><tspan x="112" dy="32">different magnetic responses; not every metal is strongly attracted.</tspan></text><text class="se-copy" x="89" y="796" text-anchor="start">•</text><text class="se-copy" x="112" y="796"><tspan x="112">Mixtures with several components may require several methods in sequence.</tspan><tspan x="112" dy="32">Consider solubility before filtering.</tspan></text><text class="se-copy" x="89" y="870" text-anchor="start">•</text><text class="se-copy" x="112" y="870"><tspan x="112">Predict, observe and compare. Report incomplete separation and limits rather</tspan><tspan x="112" dy="32">than assuming that a method always works perfectly.</tspan></text><image class="science-illustration" data-photo="magnet" href="../../figures/class-6/science/ch09/magnet.png" x="393.0552147239264" y="955" width="265.88957055214723" height="220" preserveAspectRatio="xMidYMid meet"/><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">15</text></g></svg></div></div></section>
