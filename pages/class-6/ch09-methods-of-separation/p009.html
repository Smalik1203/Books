<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="filter-compare-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Use clean collecting vessels and similar volumes. Record the clarity and how long</tspan><tspan x="89" dy="32">each takes. More cloth layers may improve retention but slow the flow.</tspan></text></g>
<g class="v2-reading-block" data-block="filter-task" transform="translate(0 192)"><rect class="se-activity-panel" x="89" y="0" width="874" height="914" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Fold circular filter paper in half, then in half again. Open one side so the</tspan><tspan x="146" dy="32">cone has one layer on one side and three on the other. Fit it into a funnel</tspan><tspan x="146" dy="32">and moisten it lightly with clean water.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Support the funnel securely above a collecting flask. Stir the</tspan><tspan x="146" dy="32">teacher-prepared muddy-water sample and pour a small amount slowly</tspan><tspan x="146" dy="32">into the paper. Keep the liquid level below the paper’s top edge.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Observe what stays on the paper and what passes through. Compare the</tspan><tspan x="146" dy="32">collected liquid with the starting sample. If it is still cloudy, check the</tspan><tspan x="146" dy="32">paper, gaps and pouring level.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Record the result without tasting. Wash your hands afterwards.</tspan><tspan x="146" dy="32">Clear-looking water from this activity is not drinking water.</tspan></text><image class="science-illustration" data-photo="filtration" href="../../figures/class-6/science/ch09/filtration.png" x="361.5030487804878" y="468" width="328.9939024390244" height="360" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="858.88"><tspan x="113">Fig. 9.4 · Filter-paper cone inside a supported funnel, with an empty flask below; the</tspan><tspan x="113" dy="27">sample has not yet been poured.</tspan></text></g>
<g class="v2-reading-block" data-block="filter-results-0" transform="translate(0 1128)"><text class="se-copy" x="89" y="24"><tspan x="89">The retained solid is the <tspan class="se-bold">residue</tspan>. The liquid that passes through is the <tspan class="se-bold">filtrate</tspan>.</tspan><tspan x="89" dy="32">Filter paper can retain particles that pass through a coarse strainer, but very fine</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
