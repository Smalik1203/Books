<g class="v2-reading-block" data-block="air-task" transform="translate(0 256)"><rect class="se-activity-panel" x="89" y="0" width="874" height="488" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Activity 9.1"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Activity 9.1</text></g><text class="se-activity-step" x="132" y="102" text-anchor="end">1.</text><text class="se-copy" x="146" y="102" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="8.14754" data-space-ratio="2.457">Your<tspan dx="8.14754"> teacher</tspan><tspan dx="8.14754"> may</tspan><tspan dx="8.14754"> provide</tspan><tspan dx="8.14754"> roasted</tspan><tspan dx="8.14754"> peanuts</tspan><tspan dx="8.14754"> only</tspan><tspan dx="8.14754"> if</tspan><tspan dx="8.14754"> they</tspan><tspan dx="8.14754"> are</tspan><tspan dx="8.14754"> safe</tspan><tspan dx="8.14754"> for</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="1.46321" data-space-ratio="1.262">everyone<tspan dx="1.46321"> present.</tspan><tspan dx="1.46321"> Otherwise</tspan><tspan dx="1.46321"> use</tspan><tspan dx="1.46321"> clean</tspan><tspan dx="1.46321"> dry</tspan><tspan dx="1.46321"> grain</tspan><tspan dx="1.46321"> mixed</tspan><tspan dx="1.46321"> with</tspan><tspan dx="1.46321"> a</tspan><tspan dx="1.46321"> few</tspan><tspan dx="1.46321"> pieces</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">of light dry husk. Do not taste investigation materials.</tspan></text><text class="se-activity-step" x="132" y="210" text-anchor="end">2.</text><text class="se-copy" x="146" y="210" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="3.05155" data-space-ratio="1.546">For<tspan dx="3.05155"> peanuts,</tspan><tspan dx="3.05155"> rub</tspan><tspan dx="3.05155"> a</tspan><tspan dx="3.05155"> few</tspan><tspan dx="3.05155"> gently</tspan><tspan dx="3.05155"> between</tspan><tspan dx="3.05155"> your</tspan><tspan dx="3.05155"> palms</tspan><tspan dx="3.05155"> over</tspan><tspan dx="3.05155"> a</tspan><tspan dx="3.05155"> tray</tspan><tspan dx="3.05155"> to</tspan><tspan dx="3.05155"> loosen</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="1.16658" data-space-ratio="1.209">the<tspan dx="1.16658"> skins.</tspan><tspan dx="1.16658"> Examine</tspan><tspan dx="1.16658"> how</tspan><tspan dx="1.16658"> the</tspan><tspan dx="1.16658"> pieces</tspan><tspan dx="1.16658"> differ.</tspan><tspan dx="1.16658"> Predict</tspan><tspan dx="1.16658"> whether</tspan><tspan dx="1.16658"> moving</tspan><tspan dx="1.16658"> air</tspan><tspan dx="1.16658"> will</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">separate them from the kernels.</tspan></text><text class="se-activity-step" x="132" y="318" text-anchor="end">3.</text><text class="se-copy" x="146" y="318" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="1.56117" data-space-ratio="1.279">Place<tspan dx="1.56117"> the</tspan><tspan dx="1.56117"> mixture</tspan><tspan dx="1.56117"> on</tspan><tspan dx="1.56117"> a</tspan><tspan dx="1.56117"> large</tspan><tspan dx="1.56117"> tray.</tspan><tspan dx="1.56117"> Gently</tspan><tspan dx="1.56117"> fan</tspan><tspan dx="1.56117"> it</tspan><tspan dx="1.56117"> with</tspan><tspan dx="1.56117"> a</tspan><tspan dx="1.56117"> piece</tspan><tspan dx="1.56117"> of</tspan><tspan dx="1.56117"> card,</tspan><tspan dx="1.56117"> away</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="3.98181" data-space-ratio="1.712">from<tspan dx="3.98181"> faces.</tspan><tspan dx="3.98181"> Do</tspan><tspan dx="3.98181"> not</tspan><tspan dx="3.98181"> blow</tspan><tspan dx="3.98181"> by</tspan><tspan dx="3.98181"> mouth</tspan><tspan dx="3.98181"> or</tspan><tspan dx="3.98181"> raise</tspan><tspan dx="3.98181"> dust.</tspan><tspan dx="3.98181"> Observe</tspan><tspan dx="3.98181"> which</tspan><tspan dx="3.98181"> pieces</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">move and where they collect.</tspan></text><text class="se-activity-step" x="132" y="426" text-anchor="end">4.</text><text class="se-copy" x="146" y="426" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="4.14791" data-space-ratio="1.742">Record<tspan dx="4.14791"> your</tspan><tspan dx="4.14791"> observations.</tspan><tspan dx="4.14791"> Try</tspan><tspan dx="4.14791"> a</tspan><tspan dx="4.14791"> second</tspan><tspan dx="4.14791"> gentle</tspan><tspan dx="4.14791"> airflow</tspan><tspan dx="4.14791"> and</tspan><tspan dx="4.14791"> compare.</tspan><tspan dx="4.14791"> If</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">the separation is incomplete, describe what remained mixed.</tspan></text></g>
<g class="v2-reading-block" data-block="winnowing" transform="translate(0 776)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-narrow-prose="true"><tspan class="se-bold">Winnowing</tspan> uses moving air to separate</tspan><tspan x="89" dy="32" data-narrow-prose="true">components that are carried differently by it.</tspan><tspan x="89" dy="32" data-narrow-prose="true">Light husk with a broad surface is often</tspan><tspan x="89" dy="32" data-narrow-prose="true">carried farther than compact grains. Both</tspan><tspan x="89" dy="32" data-narrow-prose="true">mass and shape affect the response; air does</tspan><tspan x="89" dy="32" data-narrow-prose="true">not sort every material simply into “light” and</tspan><tspan x="89" dy="32" data-paragraph-end="true">“heavy”.</tspan></text><text class="se-copy" x="89" y="264" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">A farmer lets a mixture fall from a soop, or</tspan><tspan x="89" dy="32" data-narrow-prose="true">bamboo tray, across a breeze. The grains and</tspan><tspan x="89" dy="32" data-narrow-prose="true">husk tend to land in different places. This</tspan><tspan x="89" dy="32" data-narrow-prose="true">follows threshing when husk is mixed with</tspan><tspan x="89" dy="32" data-paragraph-end="true">the released grain.</tspan></text><image class="science-illustration" data-photo="winnowing" href="../../figures/class-6/science/ch09/winnowing.png" x="613" y="50.83333333333333" width="350" height="233.33333333333334" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="448.88"><tspan x="89">Fig. 9.1 · A breeze carries the husk farther sideways than the falling grains.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1
