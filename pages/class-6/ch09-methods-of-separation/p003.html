<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="air-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="478" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Your teacher may provide roasted peanuts only if they are safe for</tspan><tspan x="146" dy="32">everyone present. Otherwise use clean dry grain mixed with a few pieces</tspan><tspan x="146" dy="32">of light dry husk. Do not taste investigation materials.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">For peanuts, rub a few gently between your palms over a tray to loosen</tspan><tspan x="146" dy="32">the skins. Examine how the pieces differ. Predict whether moving air will</tspan><tspan x="146" dy="32">separate them from the kernels.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Place the mixture on a large tray. Gently fan it with a piece of card, away</tspan><tspan x="146" dy="32">from faces. Do not blow by mouth or raise dust. Observe which pieces</tspan><tspan x="146" dy="32">move and where they collect.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Record your observations. Try a second gentle airflow and compare. If</tspan><tspan x="146" dy="32">the separation is incomplete, describe what remained mixed.</tspan></text></g>
<g class="v2-reading-block" data-block="winnowing" transform="translate(0 612)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Winnowing</tspan> uses moving air to separate</tspan><tspan x="89" dy="32">components that are carried differently by it.</tspan><tspan x="89" dy="32">Light husk with a broad surface is often</tspan><tspan x="89" dy="32">carried farther than compact grains. Both</tspan><tspan x="89" dy="32">mass and shape affect the response; air does</tspan><tspan x="89" dy="32">not sort every material simply into “light” and</tspan><tspan x="89" dy="32">“heavy”.</tspan></text><text class="se-copy" x="89" y="264"><tspan x="89">A farmer lets a mixture fall from a soop, or</tspan><tspan x="89" dy="32">bamboo tray, across a breeze. The grains and</tspan><tspan x="89" dy="32">husk tend to land in different places. This</tspan><tspan x="89" dy="32">follows threshing when husk is mixed with</tspan><tspan x="89" dy="32">the released grain.</tspan></text><image class="science-illustration" data-photo="winnowing" href="../../figures/class-6/science/ch09/winnowing.png" x="613" y="50.83333333333333" width="350" height="233.33333333333334" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="448.88"><tspan x="89">Fig. 9.1 · A breeze carries the husk farther sideways than the falling grains.</tspan></text></g>
<g class="v2-reading-block" data-block="air-think" transform="translate(0 1089)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="218" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Valli tries winnowing in a still room and finds little separation. What</tspan><tspan x="113" dy="32">condition is missing? How could she supply it safely? Would a mixture of</tspan><tspan x="113" dy="32">puffed rice and chana dal respond in the same way? Explain what you would</tspan><tspan x="113" dy="32">test before choosing this method.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
