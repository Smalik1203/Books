<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="salt-art-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">A deposit in the salt-solution area, compared with the plain-water area, supports</tspan><tspan x="89" dy="32">the idea that dissolved material was left behind as water evaporated. The water</tspan></text></g>
<g class="v2-reading-block" data-block="salt-art-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">entered the air as invisible vapour. White patches on clothes can similarly remain</tspan><tspan x="89" dy="32">after salty sweat dries, although a patch’s appearance alone does not identify its</tspan><tspan x="89" dy="32">contents.</tspan></text></g>
<g class="v2-reading-block" data-block="heat-task" transform="translate(0 288)"><rect class="se-activity-panel" x="89" y="0" width="874" height="762" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Watch your teacher place a small amount of salt solution in a heat-safe</tspan><tspan x="146" dy="32">evaporating dish on approved heating equipment. Predict what may</tspan><tspan x="146" dy="32">remain when most of the water has left.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Observe from a safe distance while the teacher heats gently. The teacher</tspan><tspan x="146" dy="32">controls the heat to prevent vigorous spitting and switches it off before</tspan><tspan x="146" dy="32">the dish is heated dry.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Let the remaining water evaporate and the apparatus cool completely.</tspan><tspan x="146" dy="32">The teacher decides when the dish may be examined. Do not touch hot</tspan><tspan x="146" dy="32">glass, the heater or the residue, and do not taste anything.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Describe the changes in the liquid and the material left behind. Compare</tspan><tspan x="146" dy="32">this result with the paper investigation.</tspan></text><image class="science-illustration" data-photo="salt" href="../../figures/class-6/science/ch09/salt.png" x="349.75" y="468" width="352.5" height="235" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="733.88"><tspan x="113">Fig. 9.3 · Evaporating dish and electric heater before the teacher begins.</tspan></text></g>
<g class="v2-reading-block" data-block="heat-evidence-0" transform="translate(0 1072)"><text class="se-copy" x="89" y="24"><tspan x="89">Heating can speed up water loss. Salt remains because it does not leave with</tspan><tspan x="89" dy="32">water vapour under these conditions. Evaporation can occur without boiling;</tspan></text></g>
<g class="v2-reading-block" data-block="heat-evidence-1" transform="translate(0 1136)"><text class="se-copy" x="89" y="24"><tspan x="89">boiling is rapid vaporisation throughout a liquid. The open-dish procedure</tspan><tspan x="89" dy="32">recovers salt but does not collect the water.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
