<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="17"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 17"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="866" rx="18"/><text class="se-copy" x="113" y="222" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Mixture</tspan> — Two or more substances</tspan><tspan x="113" dy="32" data-paragraph-end="true">present together.</tspan></text><text class="se-copy" x="113" y="306" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Component</tspan> — One of the</tspan><tspan x="113" dy="32" data-paragraph-end="true">substances making up a mixture.</tspan></text><text class="se-copy" x="113" y="390" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Handpicking</tspan> — Sorting</tspan><tspan x="113" dy="32" data-paragraph-end="true">recognisable solid pieces by hand.</tspan></text><text class="se-copy" x="113" y="474" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Threshing</tspan> — Loosening grains from</tspan><tspan x="113" dy="32" data-paragraph-end="true">harvested stalks.</tspan></text><text class="se-copy" x="113" y="558" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Winnowing</tspan> — Separating</tspan><tspan x="113" dy="32" data-narrow-prose="true">components carried differently by</tspan><tspan x="113" dy="32" data-paragraph-end="true">moving air.</tspan></text><text class="se-copy" x="113" y="674" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Sieving</tspan> — Separating solid particles</tspan><tspan x="113" dy="32" data-paragraph-end="true">using openings of a suitable size.</tspan></text><text class="se-copy" x="113" y="758" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Evaporation</tspan> — Change from liquid</tspan><tspan x="113" dy="32" data-paragraph-end="true">into vapour at its surface.</tspan></text><text class="se-copy" x="113" y="842" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Sedimentation</tspan> — Settling of</tspan><tspan x="113" dy="32" data-paragraph-end="true">suspended particles under gravity.</tspan></text><text class="se-copy" x="541" y="222" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Decantation</tspan> — Carefully pouring off</tspan><tspan x="541" dy="32" data-narrow-prose="true">a liquid from a settled solid or</tspan><tspan x="541" dy="32" data-paragraph-end="true">another liquid layer.</tspan></text><text class="se-copy" x="541" y="338" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Filtration</tspan> — Passing a fluid through</tspan><tspan x="541" dy="32" data-narrow-prose="true">material that retains some</tspan><tspan x="541" dy="32" data-paragraph-end="true">suspended solids.</tspan></text><text class="se-copy" x="541" y="454" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Residue</tspan> — Material left on a filter, or</tspan><tspan x="541" dy="32" data-paragraph-end="true">after a liquid has been removed.</tspan></text><text class="se-copy" x="541" y="538" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Filtrate</tspan> — The liquid that passes</tspan><tspan x="541" dy="32" data-paragraph-end="true">through a filter.</tspan></text><text class="se-copy" x="541" y="622" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Churning</tspan> — Agitation that helps fat</tspan><tspan x="541" dy="32" data-paragraph-end="true">droplets join into butter clumps.</tspan></text><text class="se-copy" x="541" y="706" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Magnetic</tspan> <tspan class="se-bold">separation</tspan> — Using</tspan><tspan x="541" dy="32" data-narrow-prose="true">different magnetic responses to</tspan><tspan x="541" dy="32" data-paragraph-end="true">separate components.</tspan></text><text class="se-copy" x="541" y="822" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Solubility</tspan> — The ability of a</tspan><tspan x="541" dy="32" data-narrow-prose="true">substance to dissolve in a given</tspan><tspan x="541" dy="32" data-paragraph-end="true">liquid under stated conditions.</tspan></text><text class="se-copy" x="541" y="938" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Distillation</tspan> — Vaporising a liquid</tspan><tspan x="541" dy="32" data-narrow-prose="true">and collecting it again by</tspan><tspan x="541" dy="32" data-paragraph-end="true">condensation.</tspan></text><g transform="translate(0 1040)"><g data-page-illustration="figures/class-6/science/review/salt-crystals.png"><image class="science-illustration" href="../../figures/class-6/science/review/salt-crystals.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Salt crystals.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Salt crystals.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">17</text></g></svg></div></div></section>
