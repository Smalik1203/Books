<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="sieve-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">9.3 Separating by Particle Size</tspan></text></g>
<g class="v2-reading-block" data-block="sieve-start-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Before preparing food, the family examines a sieve. Its mesh has many small</tspan><tspan x="89" dy="32">openings. Compare an empty sieve with rice mixed with smaller semolina grains.</tspan></text></g>
<g class="v2-reading-block" data-block="sieve-start-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">Choose openings that let the smaller pieces through while holding back most of</tspan><tspan x="89" dy="32">the rice. What would happen if the holes were larger than both?</tspan></text></g>
<g class="v2-reading-block" data-block="sieve-art" transform="translate(0 314)"><text class="se-copy" x="89" y="24"><tspan x="89">With the teacher’s permission, gently move</tspan><tspan x="89" dy="32">the dry mixture in the sieve over a plate.</tspan><tspan x="89" dy="32">Compare the material above and below the</tspan><tspan x="89" dy="32">mesh. Avoid flour dust. Try a second mesh if</tspan><tspan x="89" dy="32">available, keeping the mixture the same.</tspan><tspan x="89" dy="32">Record what passes through instead of</tspan><tspan x="89" dy="32">assuming a perfect separation.</tspan></text><image class="science-illustration" data-photo="sieve" href="../../figures/class-6/science/ch09/sieve.png" x="613" y="18.33333333333333" width="350" height="233.33333333333334" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="302.88"><tspan x="89">Fig. 9.2 · An empty sieve and collecting plate, ready for a particle-size comparison.</tspan></text></g>
<g class="v2-reading-block" data-block="sieving-0" transform="translate(0 645)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Sieving</tspan> separates solid particles by size relative to the openings. Fine flour can</tspan><tspan x="89" dy="32">pass through a suitable sieve while coarse bran remains; builders use screens to</tspan></text></g>
<g class="v2-reading-block" data-block="sieving-1" transform="translate(0 709)"><text class="se-copy" x="89" y="24"><tspan x="89">separate stones from sand. Bran is part of the grain and can supply dietary fibre.</tspan><tspan x="89" dy="32">Removing it is a choice for a particular use, not proof that it is harmful.</tspan></text></g>
<g class="v2-reading-block" data-block="dry-table" transform="translate(0 789)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 9.1 · Different jobs in a dry mixture</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="80"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Method</tspan></text><text class="v2-table-heading" x="277.8" y="76.08"><tspan x="277.8">Useful difference or</tspan><tspan x="277.8" dy="28">condition</tspan></text><text class="v2-table-heading" x="592.44" y="76.08"><tspan x="592.44">Example and limit</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="122" y2="122"/><text class="se-copy se-table-copy" x="103" y="156.07999999999998"><tspan x="103">Handpicking</tspan></text><text class="se-copy se-table-copy" x="277.8" y="156.07999999999998"><tspan x="277.8">Recognisable, manageable</tspan><tspan x="277.8" dy="28">pieces</tspan></text><text class="se-copy se-table-copy" x="592.44" y="156.07999999999998"><tspan x="592.44">A few stones in grain; slow for very</tspan><tspan x="592.44" dy="28">small pieces</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="202" y2="202"/><text class="se-copy se-table-copy" x="103" y="236.07999999999998"><tspan x="103">Threshing</tspan></text><text class="se-copy se-table-copy" x="277.8" y="236.07999999999998"><tspan x="277.8">Grains attached to stalks</tspan></text><text class="se-copy se-table-copy" x="592.44" y="236.07999999999998"><tspan x="592.44">Loosens grains; husk may remain</tspan><tspan x="592.44" dy="28">mixed with them</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="282" y2="282"/><text class="se-copy se-table-copy" x="103" y="316.08"><tspan x="103">Winnowing</tspan></text><text class="se-copy se-table-copy" x="277.8" y="316.08"><tspan x="277.8">Different responses to</tspan><tspan x="277.8" dy="28">moving air</tspan></text><text class="se-copy se-table-copy" x="592.44" y="316.08"><tspan x="592.44">Husk and grain; needs suitable</tspan><tspan x="592.44" dy="28">airflow</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="362" y2="362"/><text class="se-copy se-table-copy" x="103" y="396.08"><tspan x="103">Sieving</tspan></text><text class="se-copy se-table-copy" x="277.8" y="396.08"><tspan x="277.8">Particle size relative to mesh</tspan></text><text class="se-copy se-table-copy" x="592.44" y="396.08"><tspan x="592.44">Sand and pebbles; both may pass if</tspan><tspan x="592.44" dy="28">openings are too large</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="442" y2="442"/><rect class="v2-table-frame" x="89" y="42" width="874" height="400"/><line class="v2-table-rule" x1="263.8" x2="263.8" y1="42" y2="442"/><line class="v2-table-rule" x1="578.44" x2="578.44" y1="42" y2="442"/><text class="v2-table-note" x="89" y="474.88"><tspan x="89">Choose the method from the mixture’s properties and the component you need.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
