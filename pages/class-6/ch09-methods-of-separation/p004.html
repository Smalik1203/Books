soop, or</tspan><tspan x="89" dy="32" data-narrow-prose="true">bamboo tray, across a breeze. The grains and</tspan><tspan x="89" dy="32" data-narrow-prose="true">husk tend to land in different places. This</tspan><tspan x="89" dy="32" data-narrow-prose="true">follows threshing when husk is mixed with</tspan><tspan x="89" dy="32" data-paragraph-end="true">the released grain.</tspan></text><image class="science-illustration" data-photo="winnowing" href="../../figures/class-6/science/ch09/winnowing.png" x="613" y="50.83333333333333" width="350" height="233.33333333333334" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="448.88"><tspan x="89">Fig. 9.1 · A breeze carries the husk farther sideways than the falling grains.</tspan></text></g>

<g class="v2-reading-block" data-block="sieve-art" transform="translate(0 1063)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">With the teacher’s permission, gently move</tspan><tspan x="89" dy="32" data-narrow-prose="true">the dry mixture in the sieve over a plate.</tspan><tspan x="89" dy="32" data-narrow-prose="true">Compare the material above and below the</tspan><tspan x="89" dy="32" data-narrow-prose="true">mesh. Avoid flour dust. Try a second mesh if</tspan><tspan x="89" dy="32" data-narrow-prose="true">available, keeping the mixture the same.</tspan><tspan x="89" dy="32" data-narrow-prose="true">Record what passes through instead of</tspan><tspan x="89" dy="32" data-paragraph-end="true">assuming a perfect separation.</tspan></text><image class="science-illustration" data-photo="sieve" href="../../figures/class-6/science/ch09/sieve.png" x="613" y="18.33333333333333" width="350" height="233.33333333333334" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="302.88"><tspan x="89">Fig. 9.2 · An empty sieve and collecting plate, ready for a particle-size comparison.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
