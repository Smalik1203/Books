<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="design-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Washed sand, cloth and other media can retain some particles. Activated carbon</tspan><tspan x="89" dy="32">in suitable commercial filters can also hold some dissolved substances on its</tspan></text></g>
<g class="v2-reading-block" data-block="design-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">surfaces; that is not the same mechanism as simple sieving. A homemade filter</tspan><tspan x="89" dy="32">has no tested claim to remove every germ or chemical. A drinking-water system</tspan><tspan x="89" dy="32">needs treatment appropriate to its source.</tspan></text></g>
<g class="v2-reading-block" data-block="tea-net-0" transform="translate(0 288)"><text class="se-copy" x="89" y="24"><tspan x="89">A tea bag retains leaves while water and dissolved flavouring substances pass</tspan><tspan x="89" dy="32">through it. A fishing net also separates by size, but its much larger openings</tspan></text></g>
<g class="v2-reading-block" data-block="tea-net-1" transform="translate(0 352)"><text class="se-copy" x="89" y="24"><tspan x="89">retain fish or large debris. These examples show a shared idea; they do not make</tspan><tspan x="89" dy="32">a net a fine water filter.</tspan></text></g>
<g class="v2-reading-block" data-block="pollution-0" transform="translate(0 432)"><text class="se-copy" x="89" y="24"><tspan x="89">Malli notices plastic litter caught in a fishing net. Removing litter can help, but</tspan><tspan x="89" dy="32">preventing it from entering water is better. Write a short original poem about this</tspan></text></g>
<g class="v2-reading-block" data-block="pollution-1" transform="translate(0 496)"><text class="se-copy" x="89" y="24"><tspan x="89">problem. Give one action people can take and check that the poem does not</tspan><tspan x="89" dy="32">imply that a net removes dissolved pollution.</tspan></text></g>
<g class="v2-reading-block" data-block="churn-heading" transform="translate(0 588)"><text class="v2-title" x="89" y="38"><tspan x="89">9.7 Churning and Magnetic Separation</tspan></text></g>
<g class="v2-reading-block" data-block="churn-art" transform="translate(0 646)"><text class="se-copy" x="89" y="24"><tspan x="89">In Madhya Pradesh, the children see a mathni</tspan><tspan x="89" dy="32">used to churn full-fat curd. <tspan class="se-bold">Churning</tspan> agitates</tspan><tspan x="89" dy="32">the mixture so that small fat droplets join into</tspan><tspan x="89" dy="32">larger butter grains or clumps. These can be</tspan><tspan x="89" dy="32">collected, leaving a more watery liquid called</tspan><tspan x="89" dy="32">buttermilk.</tspan></text><text class="se-copy" x="89" y="232"><tspan x="89">The butter may gather near the top, but</tspan><tspan x="89" dy="32">churning does more than let a lighter</tspan><tspan x="89" dy="32">substance float: it helps the fat join together.</tspan><tspan x="89" dy="32">Churning cream or suitable curd produces</tspan><tspan x="89" dy="32">butter. It is not the usual method for</tspan><tspan x="89" dy="32">separating cream from milk.</tspan></text><image class="science-illustration" data-photo="churning" href="../../figures/class-6/science/ch09/churning.png" x="645.2665895061729" y="0" width="285.46682098765433" height="305" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="448.88"><tspan x="89">Fig. 9.5 · A mathni and pot, with collected butter beside them.</tspan></text></g>
<g class="v2-reading-block" data-block="milk-0" transform="translate(0 1123)"><text class="se-copy" x="89" y="24"><tspan x="89">An adult can demonstrate curdling fresh pasteurised milk with a suitable food</tspan><tspan x="89" dy="32">acid, then straining the curds from the liquid. Curdling creates the clumps;</tspan></text></g>
<g class="v2-reading-block" data-block="milk-1" transform="translate(0 1187)"><text class="se-copy" x="89" y="24"><tspan x="89">straining separates them. Milk that has spoiled accidentally is different: do not</tspan><tspan x="89" dy="32">taste it or assume cooking will make it safe. An adult should discard suspect milk.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
