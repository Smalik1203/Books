<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="design-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="510" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Design a small model filter using teacher-approved materials such as</tspan><tspan x="146" dy="32">cloth, washed sand and washed gravel. Sketch a stable arrangement in</tspan><tspan x="146" dy="32">your notebook before building it. Any container cutting is an adult’s job.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Test with a prepared sand-and-soil water sample, not collected pond</tspan><tspan x="146" dy="32">water. Measure equal sample volumes. Keep a little unfiltered mixture for</tspan><tspan x="146" dy="32">comparison.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Collect the output and record its appearance, volume and the time taken.</tspan><tspan x="146" dy="32">Change one feature, such as the cloth layers, and repeat with a fresh</tspan><tspan x="146" dy="32">comparable sample.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Explain what improved and what your test cannot establish. Do not drink</tspan><tspan x="146" dy="32">the output, even if it looks clear. Keep it away from food and wash hands</tspan><tspan x="146" dy="32">and equipment afterwards.</tspan></text></g>
<g class="v2-reading-block" data-block="design-evidence-0" transform="translate(0 644)"><text class="se-copy" x="89" y="24"><tspan x="89">Washed sand, cloth and other media can retain some particles. Activated carbon</tspan><tspan x="89" dy="32">in suitable commercial filters can also hold some dissolved substances on its</tspan></text></g>
<g class="v2-reading-block" data-block="design-evidence-1" transform="translate(0 708)"><text class="se-copy" x="89" y="24"><tspan x="89">surfaces; that is not the same mechanism as simple sieving. A homemade filter</tspan><tspan x="89" dy="32">has no tested claim to remove every germ or chemical. A drinking-water system</tspan><tspan x="89" dy="32">needs treatment appropriate to its source.</tspan></text></g>
<g class="v2-reading-block" data-block="tea-net-0" transform="translate(0 820)"><text class="se-copy" x="89" y="24"><tspan x="89">A tea bag retains leaves while water and dissolved flavouring substances pass</tspan><tspan x="89" dy="32">through it. A fishing net also separates by size, but its much larger openings</tspan></text></g>
<g class="v2-reading-block" data-block="tea-net-1" transform="translate(0 884)"><text class="se-copy" x="89" y="24"><tspan x="89">retain fish or large debris. These examples show a shared idea; they do not make</tspan><tspan x="89" dy="32">a net a fine water filter.</tspan></text></g>
<g class="v2-reading-block" data-block="pollution-0" transform="translate(0 964)"><text class="se-copy" x="89" y="24"><tspan x="89">Malli notices plastic litter caught in a fishing net. Removing litter can help, but</tspan><tspan x="89" dy="32">preventing it from entering water is better. Write a short original poem about this</tspan></text></g>
<g class="v2-reading-block" data-block="pollution-1" transform="translate(0 1028)"><text class="se-copy" x="89" y="24"><tspan x="89">problem. Give one action people can take and check that the poem does not</tspan><tspan x="89" dy="32">imply that a net removes dissolved pollution.</tspan></text></g><g transform="translate(0 1108)"><g data-page-illustration="figures/class-6/science/ch09/filtration.png"><image class="science-illustration" href="../../figures/class-6/science/ch09/filtration.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A filtration setup.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A filtration setup.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
