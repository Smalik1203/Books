<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="filter-results-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">particles may still pass. Torn paper or liquid going over the rim can also spoil the</tspan><tspan x="89" dy="32">separation.</tspan></text></g>
<g class="v2-reading-block" data-block="dissolved-limit-0" transform="translate(0 192)"><text class="se-copy" x="89" y="24"><tspan x="89">Ordinary filter paper does not remove dissolved common salt from water. The</tspan><tspan x="89" dy="32">dissolved material passes through with the water. A filter’s performance depends</tspan></text></g>
<g class="v2-reading-block" data-block="dissolved-limit-1" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">on its material and structure as well as the particles involved. Clear filtrate is</tspan><tspan x="89" dy="32">evidence about visible particles, not proof that germs or dissolved chemicals are</tspan><tspan x="89" dy="32">absent.</tspan></text></g>
<g class="v2-reading-block" data-block="wet-table" transform="translate(0 368)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 9.2 · Three ways to separate a sandy mixture</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Method</tspan></text><text class="v2-table-heading" x="295.28" y="76.08"><tspan x="295.28">What happens</tspan></text><text class="v2-table-heading" x="627.4" y="76.08"><tspan x="627.4">What it may leave behind</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Sedimentation</tspan></text><text class="se-copy se-table-copy" x="295.28" y="128.07999999999998"><tspan x="295.28">Suitable particles settle while</tspan><tspan x="295.28" dy="28">the vessel stands still</tspan></text><text class="se-copy se-table-copy" x="627.4" y="128.07999999999998"><tspan x="627.4">Fine suspended particles and</tspan><tspan x="627.4" dy="28">dissolved substances</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="174" y2="174"/><text class="se-copy se-table-copy" x="103" y="208.07999999999998"><tspan x="103">Decantation</tspan></text><text class="se-copy se-table-copy" x="295.28" y="208.07999999999998"><tspan x="295.28">The upper liquid is poured off</tspan><tspan x="295.28" dy="28">gently</tspan></text><text class="se-copy se-table-copy" x="627.4" y="208.07999999999998"><tspan x="627.4">Some liquid with the sediment;</tspan><tspan x="627.4" dy="28">some fine particles in the</tspan><tspan x="627.4" dy="28">poured liquid</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="282" y2="282"/><text class="se-copy se-table-copy" x="103" y="316.08"><tspan x="103">Filtration</tspan></text><text class="se-copy se-table-copy" x="295.28" y="316.08"><tspan x="295.28">Liquid passes through a filter</tspan><tspan x="295.28" dy="28">that retains some solids</tspan></text><text class="se-copy se-table-copy" x="627.4" y="316.08"><tspan x="627.4">Particles smaller than the filter</tspan><tspan x="627.4" dy="28">can retain; dissolved salt</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="362" y2="362"/><rect class="v2-table-frame" x="89" y="42" width="874" height="320"/><line class="v2-table-rule" x1="281.28" x2="281.28" y1="42" y2="362"/><line class="v2-table-rule" x1="613.4" x2="613.4" y1="42" y2="362"/><text class="v2-table-note" x="89" y="394.88"><tspan x="89">Often settling, decanting and filtering are used in sequence, rather than as competing</tspan><tspan x="89" dy="26">answers.</tspan></text></g><g transform="translate(0 814)"><g data-page-illustration="figures/class-6/science/ch09/filtration.png"><image class="science-illustration" href="../../figures/class-6/science/ch09/filtration.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>A filtration setup.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">A filtration setup.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
