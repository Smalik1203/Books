<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="settle-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="338" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Stir clean sand into water in a clear container. Leave it still and record</tspan><tspan x="146" dy="32">what changes. Keep an identical, freshly stirred sample for comparison.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Once particles have settled, slowly pour some upper liquid into another</tspan><tspan x="146" dy="32">container. Stop before the sediment reaches the lip. Compare the poured</tspan><tspan x="146" dy="32">liquid, the residue and the stirred sample.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Record which material you recovered and what remains mixed. Do not</tspan><tspan x="146" dy="32">drink any of the samples.</tspan></text></g>
<g class="v2-reading-block" data-block="oil-water-0" transform="translate(0 472)"><text class="se-copy" x="89" y="24"><tspan x="89">Oil and water can form separate liquid layers when left still. One layer can be</tspan><tspan x="89" dy="32">carefully poured away from the other, although pouring by hand often leaves</tspan></text></g>
<g class="v2-reading-block" data-block="oil-water-1" transform="translate(0 536)"><text class="se-copy" x="89" y="24"><tspan x="89">some mixing near the boundary. A separating funnel gives better control. The</tspan><tspan x="89" dy="32">useful property here is that the liquids do not mix into one uniform liquid, not</tspan><tspan x="89" dy="32">that either is a solid.</tspan></text></g>
<g class="v2-reading-block" data-block="filter-heading" transform="translate(0 660)"><text class="v2-title" x="89" y="38"><tspan x="89">9.6 Choosing a Filter</tspan></text></g>
<g class="v2-reading-block" data-block="filter-start-0" transform="translate(0 718)"><text class="se-copy" x="89" y="24"><tspan x="89">A tea strainer lets liquid through its openings while retaining larger leaves.</tspan><tspan x="89" dy="32">Compare it with woven cloth: the spaces between threads may be smaller than</tspan></text></g>
<g class="v2-reading-block" data-block="filter-start-1" transform="translate(0 782)"><text class="se-copy" x="89" y="24"><tspan x="89">the strainer’s mesh. <tspan class="se-bold">Filtration</tspan> separates suspended insoluble solids from a fluid</tspan><tspan x="89" dy="32">using a material that retains some particles while allowing the fluid through.</tspan></text></g>
<g class="v2-reading-block" data-block="filter-compare-0" transform="translate(0 862)"><text class="se-copy" x="89" y="24"><tspan x="89">Use a teacher-prepared mixture of clean sand and a little soil in water, not pond</tspan><tspan x="89" dy="32">or drain water. Compare equal samples through a strainer and a piece of cloth.</tspan></text></g><g transform="translate(0 926)"><g data-page-illustration="figures/class-6/science/ch09/filtration.png"><image class="science-illustration" href="../../figures/class-6/science/ch09/filtration.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>A filtration setup.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">A filtration setup.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
