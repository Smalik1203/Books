<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="settling-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">9.5 Settling and Pouring Off</tspan></text></g>
<g class="v2-reading-block" data-block="settling" transform="translate(0 170)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.55033" data-space-ratio="1.277">In<tspan dx="1.55033"> Puducherry,</tspan><tspan dx="1.55033"> the</tspan><tspan dx="1.55033"> family</tspan><tspan dx="1.55033"> compares</tspan><tspan dx="1.55033"> ways</tspan><tspan dx="1.55033"> of</tspan><tspan dx="1.55033"> removing</tspan><tspan dx="1.55033"> tea</tspan><tspan dx="1.55033"> leaves</tspan><tspan dx="1.55033"> from</tspan><tspan dx="1.55033"> tea.</tspan><tspan dx="1.55033"> Some</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="9.40909" data-space-ratio="2.683">leaves<tspan dx="9.40909"> may</tspan><tspan dx="9.40909"> settle</tspan><tspan dx="9.40909"> when</tspan><tspan dx="9.40909"> the</tspan><tspan dx="9.40909"> liquid</tspan><tspan dx="9.40909"> is</tspan><tspan dx="9.40909"> left</tspan><tspan dx="9.40909"> still;</tspan><tspan dx="9.40909"> others</tspan><tspan dx="9.40909"> can</tspan><tspan dx="9.40909"> float</tspan><tspan dx="9.40909"> or</tspan><tspan dx="9.40909"> remain</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.83694" data-space-ratio="1.150">suspended.<tspan dx="0.83694"> Use</tspan><tspan dx="0.83694"> a</tspan><tspan dx="0.83694"> cool</tspan><tspan dx="0.83694"> mixture</tspan><tspan dx="0.83694"> for</tspan><tspan dx="0.83694"> classroom</tspan><tspan dx="0.83694"> comparisons.</tspan><tspan dx="0.83694"> Do</tspan><tspan dx="0.83694"> not</tspan><tspan dx="0.83694"> handle</tspan><tspan dx="0.83694"> hot</tspan><tspan dx="0.83694"> tea</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">or water.</tspan></text></g>
<g class="v2-reading-block" data-block="sediment" transform="translate(0 314)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="13.12528" data-space-ratio="3.347">When<tspan dx="13.12528"> suspended</tspan><tspan dx="13.12528"> insoluble</tspan><tspan dx="13.12528"> particles</tspan><tspan dx="13.12528"> settle</tspan><tspan dx="13.12528"> under</tspan><tspan dx="13.12528"> gravity,</tspan><tspan dx="13.12528"> the</tspan><tspan dx="13.12528"> process</tspan><tspan dx="13.12528"> is</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.34272" data-space-ratio="1.061"><tspan class="se-bold">sedimentation</tspan>.<tspan dx="0.34272"> It</tspan><tspan dx="0.34272"> works</tspan><tspan dx="0.34272"> well</tspan><tspan dx="0.34272"> for</tspan><tspan dx="0.34272"> some</tspan><tspan dx="0.34272"> particles,</tspan><tspan dx="0.34272"> such</tspan><tspan dx="0.34272"> as</tspan><tspan dx="0.34272"> coarse</tspan><tspan dx="0.34272"> sand</tspan><tspan dx="0.34272"> in</tspan><tspan dx="0.34272"> water,</tspan><tspan dx="0.34272"> but</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.52692" data-space-ratio="1.273">very<tspan dx="1.52692"> fine</tspan><tspan dx="1.52692"> particles</tspan><tspan dx="1.52692"> may</tspan><tspan dx="1.52692"> remain</tspan><tspan dx="1.52692"> suspended</tspan><tspan dx="1.52692"> for</tspan><tspan dx="1.52692"> a</tspan><tspan dx="1.52692"> long</tspan><tspan dx="1.52692"> time.</tspan><tspan dx="1.52692"> A</tspan><tspan dx="1.52692"> substance</tspan><tspan dx="1.52692"> dissolved</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">in water does not simply settle out like sand.</tspan></text></g>
<g class="v2-reading-block" data-block="decant" transform="translate(0 458)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="7.67838" data-space-ratio="2.373">Carefully<tspan dx="7.67838"> pouring</tspan><tspan dx="7.67838"> off</tspan><tspan dx="7.67838"> the</tspan><tspan dx="7.67838"> liquid</tspan><tspan dx="7.67838"> without</tspan><tspan dx="7.67838"> greatly</tspan><tspan dx="7.67838"> disturbing</tspan><tspan dx="7.67838"> a</tspan><tspan dx="7.67838"> settled</tspan><tspan dx="7.67838"> solid</tspan><tspan dx="7.67838"> is</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.56385" data-space-ratio="1.816"><tspan class="se-bold">decantation</tspan>.<tspan dx="4.56385"> Some</tspan><tspan dx="4.56385"> liquid</tspan><tspan dx="4.56385"> is</tspan><tspan dx="4.56385"> usually</tspan><tspan dx="4.56385"> left</tspan><tspan dx="4.56385"> with</tspan><tspan dx="4.56385"> the</tspan><tspan dx="4.56385"> solid,</tspan><tspan dx="4.56385"> and</tspan><tspan dx="4.56385"> fine</tspan><tspan dx="4.56385"> particles</tspan><tspan dx="4.56385"> may</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.97201" data-space-ratio="1.889">pour<tspan dx="4.97201"> out</tspan><tspan dx="4.97201"> too.</tspan><tspan dx="4.97201"> The</tspan><tspan dx="4.97201"> method</tspan><tspan dx="4.97201"> can</tspan><tspan dx="4.97201"> still</tspan><tspan dx="4.97201"> be</tspan><tspan dx="4.97201"> useful;</tspan><tspan dx="4.97201"> incomplete</tspan><tspan dx="4.97201"> separation</tspan><tspan dx="4.97201"> does</tspan><tspan dx="4.97201"> not</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">make it an invalid method.</tspan></text></g>
<g class="v2-reading-block" data-block="settle-task" transform="translate(0 602)"><rect class="se-activity-panel" x="89" y="0" width="874" height="348" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Activity 9.4"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Activity 9.4</text></g><text class="se-activity-step" x="132" y="102" text-anchor="end">1.</text><text class="se-copy" x="146" y="102" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="3.75534" data-space-ratio="1.672">Stir<tspan dx="3.75534"> clean</tspan><tspan dx="3.75534"> sand</tspan><tspan dx="3.75534"> into</tspan><tspan dx="3.75534"> water</tspan><tspan dx="3.75534"> in</tspan><tspan dx="3.75534"> a</tspan><tspan dx="3.75534"> clear</tspan><tspan dx="3.75534"> container.</tspan><tspan dx="3.75534"> Leave</tspan><tspan dx="3.75534"> it</tspan><tspan dx="3.75534"> still</tspan><tspan dx="3.75534"> and</tspan><tspan dx="3.75534"> record</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">what changes. Keep an identical, freshly stirred sample for comparison.</tspan></text><text class="se-activity-step" x="132" y="178" text-anchor="end">2.</text><text class="se-copy" x="146" y="178" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="2.94139" data-space-ratio="1.526">Once<tspan dx="2.94139"> particles</tspan><tspan dx="2.94139"> have</tspan><tspan dx="2.94139"> settled,</tspan><tspan dx="2.94139"> slowly</tspan><tspan dx="2.94139"> pour</tspan><tspan dx="2.94139"> some</tspan><tspan dx="2.94139"> upper</tspan><tspan dx="2.94139"> liquid</tspan><tspan dx="2.94139"> into</tspan><tspan dx="2.94139"> another</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="1.67682" data-space-ratio="1.300">container.<tspan dx="1.67682"> Stop</tspan><tspan dx="1.67682"> before</tspan><tspan dx="1.67682"> the</tspan><tspan dx="1.67682"> sediment</tspan><tspan dx="1.67682"> reaches</tspan><tspan dx="1.67682"> the</tspan><tspan dx="1.67682"> lip.</tspan><tspan dx="1.67682"> Compare</tspan><tspan dx="1.67682"> the</tspan><tspan dx="1.67682"> poured</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">liquid, the residue and the stirred sample.</tspan></text><text class="se-activity-step" x="132" y="286" text-anchor="end">3.</text><text class="se-copy" x="146" y="286" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="3.87925" data-space-ratio="1.694">Record<tspan dx="3.87925"> which</tspan><tspan dx="3.87925"> material</tspan><tspan dx="3.87925"> you</tspan><tspan dx="3.87925"> recovered</tspan><tspan dx="3.87925"> and</tspan><tspan dx="3.87925"> what</tspan><tspan dx="3.87925"> remains</tspan><tspan dx="3.87925"> mixed.</tspan><tspan dx="3.87925"> Do</tspan><tspan dx="3.87925"> not</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">drink any of the samples.</tspan></text></g><g transform="translate(0 982)"><g data-page-illustration="figures/class-6/science/review/decanting.png"><image class="science-illustration" href="../../figures/class-6/science/review/decanting.png" x="261.25" y="10" width="529.5" height="353" preserveAspectRatio="xMidYMid meet"><title>Pour off the clearer liquid without disturbing the sediment.</title></image><text class="se-caption" x="526" y="401" text-anchor="middle"><tspan x="526">Pour off the clearer liquid without disturbing the sediment.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text
