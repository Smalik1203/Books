<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="salt-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">9.4 Recovering a Dissolved Solid</tspan></text></g>
<g class="v2-reading-block" data-block="salt-start-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">In Ahmedabad, Malli and Valli learn about the Salt March that began at</tspan><tspan x="89" dy="32">Sabarmati Ashram in 1930. Their question turns to the material itself: where does</tspan></text></g>
<g class="v2-reading-block" data-block="salt-start-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">salt come from? Seawater contains dissolved salts. Salty inland waters, such as</tspan><tspan x="89" dy="32">Sambhar Lake in Rajasthan, are another source.</tspan></text></g>
<g class="v2-reading-block" data-block="salt-pans-0" transform="translate(0 314)"><text class="se-copy" x="89" y="24"><tspan x="89">In salt works, water evaporates from shallow ponds exposed to air and sunlight.</tspan><tspan x="89" dy="32">Dissolved salts become more concentrated and solids can form. Further</tspan></text></g>
<g class="v2-reading-block" data-block="salt-pans-1" transform="translate(0 378)"><text class="se-copy" x="89" y="24"><tspan x="89">processing is needed to obtain common salt of suitable purity. Seawater is not a</tspan><tspan x="89" dy="32">solution of just one pure salt.</tspan></text></g>
<g class="v2-reading-block" data-block="salt-art-task" transform="translate(0 458)"><rect class="se-activity-panel" x="89" y="0" width="874" height="478" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Stir a small spoonful of common salt into water until it dissolves. If some</tspan><tspan x="146" dy="32">remains, add a little more water and stir. Keep a separate sample of plain</tspan><tspan x="146" dy="32">water.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Mark two areas on dark, thick paper. Put a few drops of salt solution in</tspan><tspan x="146" dy="32">one and plain water in the other. You may make a small pattern, using</tspan><tspan x="146" dy="32">only a little solution.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Leave both areas undisturbed to dry. Record what each looks like before</tspan><tspan x="146" dy="32">and after drying. Do not taste the paper or use touch alone to identify a</tspan><tspan x="146" dy="32">residue.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Compare the areas. What evidence would help you connect a remaining</tspan><tspan x="146" dy="32">deposit with the material you added?</tspan></text></g>
<g class="v2-reading-block" data-block="salt-art-evidence-0" transform="translate(0 958)"><text class="se-copy" x="89" y="24"><tspan x="89">A deposit in the salt-solution area, compared with the plain-water area, supports</tspan><tspan x="89" dy="32">the idea that dissolved material was left behind as water evaporated. The water</tspan></text></g>
<g class="v2-reading-block" data-block="salt-art-evidence-1" transform="translate(0 1022)"><text class="se-copy" x="89" y="24"><tspan x="89">entered the air as invisible vapour. White patches on clothes can similarly remain</tspan><tspan x="89" dy="32">after salty sweat dries, although a patch’s appearance alone does not identify its</tspan><tspan x="89" dy="32">contents.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">5</text></g></svg></div></div></section>
