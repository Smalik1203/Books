<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="mixture-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">9.1 Why Separate a Mixture?</tspan></text></g>
<g class="v2-reading-block" data-block="mixture" transform="translate(0 170)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.55318" data-space-ratio="1.099">A<tspan dx="0.55318"> <tspan class="se-bold">mixture</tspan></tspan><tspan dx="0.55318"> contains</tspan><tspan dx="0.55318"> two</tspan><tspan dx="0.55318"> or</tspan><tspan dx="0.55318"> more</tspan><tspan dx="0.55318"> substances</tspan><tspan dx="0.55318"> together.</tspan><tspan dx="0.55318"> Grains</tspan><tspan dx="0.55318"> and</tspan><tspan dx="0.55318"> stones</tspan><tspan dx="0.55318"> form</tspan><tspan dx="0.55318"> one</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.89820" data-space-ratio="1.876">mixture;<tspan dx="4.89820"> salt</tspan><tspan dx="4.89820"> dissolved</tspan><tspan dx="4.89820"> in</tspan><tspan dx="4.89820"> water</tspan><tspan dx="4.89820"> forms</tspan><tspan dx="4.89820"> another.</tspan><tspan dx="4.89820"> In</tspan><tspan dx="4.89820"> a</tspan><tspan dx="4.89820"> mixture,</tspan><tspan dx="4.89820"> the</tspan><tspan dx="4.89820"> components</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.07034" data-space-ratio="1.370">may<tspan dx="2.07034"> be</tspan><tspan dx="2.07034"> easy</tspan><tspan dx="2.07034"> to</tspan><tspan dx="2.07034"> see</tspan><tspan dx="2.07034"> separately,</tspan><tspan dx="2.07034"> or</tspan><tspan dx="2.07034"> they</tspan><tspan dx="2.07034"> may</tspan><tspan dx="2.07034"> not.</tspan><tspan dx="2.07034"> Dissolving</tspan><tspan dx="2.07034"> does</tspan><tspan dx="2.07034"> not</tspan><tspan dx="2.07034"> mean</tspan><tspan dx="2.07034"> that</tspan><tspan dx="2.07034"> a</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">substance has disappeared.</tspan></text></g>
<g class="v2-reading-block" data-block="purpose" transform="translate(0 314)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="6.07795" data-space-ratio="2.087">We<tspan dx="6.07795"> may</tspan><tspan dx="6.07795"> separate</tspan><tspan dx="6.07795"> a</tspan><tspan dx="6.07795"> mixture</tspan><tspan dx="6.07795"> to</tspan><tspan dx="6.07795"> remove</tspan><tspan dx="6.07795"> an</tspan><tspan dx="6.07795"> unwanted</tspan><tspan dx="6.07795"> component,</tspan><tspan dx="6.07795"> to</tspan><tspan dx="6.07795"> obtain</tspan><tspan dx="6.07795"> a</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.20595" data-space-ratio="1.216">useful<tspan dx="1.20595"> one,</tspan><tspan dx="1.20595"> or</tspan><tspan dx="1.20595"> to</tspan><tspan dx="1.20595"> recover</tspan><tspan dx="1.20595"> several</tspan><tspan dx="1.20595"> useful</tspan><tspan dx="1.20595"> components.</tspan><tspan dx="1.20595"> “Unwanted”</tspan><tspan dx="1.20595"> depends</tspan><tspan dx="1.20595"> on</tspan><tspan dx="1.20595"> the</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.08093" data-space-ratio="1.551">purpose.<tspan dx="3.08093"> Husk</tspan><tspan dx="3.08093"> is</tspan><tspan dx="3.08093"> unwanted</tspan><tspan dx="3.08093"> in</tspan><tspan dx="3.08093"> grain</tspan><tspan dx="3.08093"> prepared</tspan><tspan dx="3.08093"> for</tspan><tspan dx="3.08093"> cooking,</tspan><tspan dx="3.08093"> but</tspan><tspan dx="3.08093"> it</tspan><tspan dx="3.08093"> may</tspan><tspan dx="3.08093"> be</tspan><tspan dx="3.08093"> useful</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">elsewhere. Separation does not always mean throwing something away.</tspan></text></g>
<g class="v2-reading-block" data-block="hand-heading" transform="translate(0 470)"><text class="v2-title" x="89" y="38"><tspan x="89">9.2 Picking, Threshing and Winnowing</tspan></text></g>
<g class="v2-reading-block" data-block="handpicking" transform="translate(0 528)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.55424" data-space-ratio="1.278">Look<tspan dx="1.55424"> closely</tspan><tspan dx="1.55424"> at</tspan><tspan dx="1.55424"> a</tspan><tspan dx="1.55424"> small</tspan><tspan dx="1.55424"> mixture</tspan><tspan dx="1.55424"> of</tspan><tspan dx="1.55424"> clean</tspan><tspan dx="1.55424"> rice</tspan><tspan dx="1.55424"> and</tspan><tspan dx="1.55424"> a</tspan><tspan dx="1.55424"> few</tspan><tspan dx="1.55424"> large</tspan><tspan dx="1.55424"> dry</tspan><tspan dx="1.55424"> pulses.</tspan><tspan dx="1.55424"> Can</tspan><tspan dx="1.55424"> you</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="14.25122" data-space-ratio="3.549">recognise<tspan dx="14.25122"> and</tspan><tspan dx="14.25122"> pick</tspan><tspan dx="14.25122"> out</tspan><tspan dx="14.25122"> each</tspan><tspan dx="14.25122"> pulse?</tspan><tspan dx="14.25122"> Sorting</tspan><tspan dx="14.25122"> visible</tspan><tspan dx="14.25122"> pieces</tspan><tspan dx="14.25122"> by</tspan><tspan dx="14.25122"> hand</tspan><tspan dx="14.25122"> is</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.99234" data-space-ratio="1.893"><tspan class="se-bold">handpicking</tspan>.<tspan dx="4.99234"> Differences</tspan><tspan dx="4.99234"> in</tspan><tspan dx="4.99234"> size,</tspan><tspan dx="4.99234"> shape</tspan><tspan dx="4.99234"> or</tspan><tspan dx="4.99234"> colour</tspan><tspan dx="4.99234"> help.</tspan><tspan dx="4.99234"> Keep</tspan><tspan dx="4.99234"> your</tspan><tspan dx="4.99234"> eyes</tspan><tspan dx="4.99234"> open;</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">never handle sharp, unknown or dirty fragments.</tspan></text></g>
<g class="v2-reading-block" data-block="hand-limits" transform="translate(0 672)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.92095" data-space-ratio="1.701">Handpicking<tspan dx="3.92095"> is</tspan><tspan dx="3.92095"> convenient</tspan><tspan dx="3.92095"> when</tspan><tspan dx="3.92095"> the</tspan><tspan dx="3.92095"> pieces</tspan><tspan dx="3.92095"> are</tspan><tspan dx="3.92095"> large</tspan><tspan dx="3.92095"> enough</tspan><tspan dx="3.92095"> to</tspan><tspan dx="3.92095"> recognise</tspan><tspan dx="3.92095"> and</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.26490" data-space-ratio="1.226">there<tspan dx="1.26490"> are</tspan><tspan dx="1.26490"> relatively</tspan><tspan dx="1.26490"> few</tspan><tspan dx="1.26490"> to</tspan><tspan dx="1.26490"> remove.</tspan><tspan dx="1.26490"> It</tspan><tspan dx="1.26490"> becomes</tspan><tspan dx="1.26490"> slow</tspan><tspan dx="1.26490"> for</tspan><tspan dx="1.26490"> a</tspan><tspan dx="1.26490"> large</tspan><tspan dx="1.26490"> heap</tspan><tspan dx="1.26490"> or</tspan><tspan dx="1.26490"> many</tspan><tspan dx="1.26490"> tiny</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.61751" data-space-ratio="1.647">pieces.<tspan dx="3.61751"> Malli’s</tspan><tspan dx="3.61751"> removal</tspan><tspan dx="3.61751"> of</tspan><tspan dx="3.61751"> a</tspan><tspan dx="3.61751"> whole</tspan><tspan dx="3.61751"> peppercorn</tspan><tspan dx="3.61751"> from</tspan><tspan dx="3.61751"> cooked</tspan><tspan dx="3.61751"> rice</tspan><tspan dx="3.61751"> uses</tspan><tspan dx="3.61751"> the</tspan><tspan dx="3.61751"> same</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">idea, although a spoon is more suitable for food.</tspan></text></g>
<g class="v2-reading-block" data-block="threshing" transform="translate(0 816)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.60950" data-space-ratio="1.288">In<tspan dx="1.60950"> the</tspan><tspan dx="1.60950"> field,</tspan><tspan dx="1.60950"> grains</tspan><tspan dx="1.60950"> are</tspan><tspan dx="1.60950"> still</tspan><tspan dx="1.60950"> attached</tspan><tspan dx="1.60950"> to</tspan><tspan dx="1.60950"> harvested</tspan><tspan dx="1.60950"> stalks.</tspan><tspan dx="1.60950"> Beating</tspan><tspan dx="1.60950"> or</tspan><tspan dx="1.60950"> mechanically</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.77268" data-space-ratio="1.853">working<tspan dx="4.77268"> suitably</tspan><tspan dx="4.77268"> dried</tspan><tspan dx="4.77268"> stalks</tspan><tspan dx="4.77268"> loosens</tspan><tspan dx="4.77268"> the</tspan><tspan dx="4.77268"> grains.</tspan><tspan dx="4.77268"> This</tspan><tspan dx="4.77268"> is</tspan><tspan dx="4.77268"> <tspan class="se-bold">threshing</tspan>.</tspan><tspan dx="4.77268"> It</tspan><tspan dx="4.77268"> releases</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.63425" data-space-ratio="1.471">attached<tspan dx="2.63425"> grains;</tspan><tspan dx="2.63425"> it</tspan><tspan dx="2.63425"> is</tspan><tspan dx="2.63425"> not</tspan><tspan dx="2.63425"> the</tspan><tspan dx="2.63425"> method</tspan><tspan dx="2.63425"> for</tspan><tspan dx="2.63425"> separating</tspan><tspan dx="2.63425"> an</tspan><tspan dx="2.63425"> already</tspan><tspan dx="2.63425"> loose</tspan><tspan dx="2.63425"> mixture</tspan><tspan dx="2.63425"> of</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">two kinds of grain.</tspan></text></g><g transform="translate(0 960)"><g data-page-illustration="figures/class-6/science/revie
