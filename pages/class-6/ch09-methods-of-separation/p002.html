<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="mixture-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">9.1 Why Separate a Mixture?</tspan></text></g>
<g class="v2-reading-block" data-block="mixture-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">mixture</tspan> contains two or more substances together. Grains and stones form one</tspan><tspan x="89" dy="32">mixture; salt dissolved in water forms another. In a mixture, the components</tspan></text></g>
<g class="v2-reading-block" data-block="mixture-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">may be easy to see separately, or they may not. Dissolving does not mean that a</tspan><tspan x="89" dy="32">substance has disappeared.</tspan></text></g>
<g class="v2-reading-block" data-block="purpose-0" transform="translate(0 314)"><text class="se-copy" x="89" y="24"><tspan x="89">We may separate a mixture to remove an unwanted component, to obtain a</tspan><tspan x="89" dy="32">useful one, or to recover several useful components. “Unwanted” depends on the</tspan></text></g>
<g class="v2-reading-block" data-block="purpose-1" transform="translate(0 378)"><text class="se-copy" x="89" y="24"><tspan x="89">purpose. Husk is unwanted in grain prepared for cooking, but it may be useful</tspan><tspan x="89" dy="32">elsewhere. Separation does not always mean throwing something away.</tspan></text></g>
<g class="v2-reading-block" data-block="hand-heading" transform="translate(0 470)"><text class="v2-title" x="89" y="38"><tspan x="89">9.2 Picking, Threshing and Winnowing</tspan></text></g>
<g class="v2-reading-block" data-block="handpicking-0" transform="translate(0 528)"><text class="se-copy" x="89" y="24"><tspan x="89">Look closely at a small mixture of clean rice and a few large dry pulses. Can you</tspan><tspan x="89" dy="32">recognise and pick out each pulse? Sorting visible pieces by hand is</tspan></text></g>
<g class="v2-reading-block" data-block="handpicking-1" transform="translate(0 592)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">handpicking</tspan>. Differences in size, shape or colour help. Keep your eyes open;</tspan><tspan x="89" dy="32">never handle sharp, unknown or dirty fragments.</tspan></text></g>
<g class="v2-reading-block" data-block="hand-limits-0" transform="translate(0 672)"><text class="se-copy" x="89" y="24"><tspan x="89">Handpicking is convenient when the pieces are large enough to recognise and</tspan><tspan x="89" dy="32">there are relatively few to remove. It becomes slow for a large heap or many tiny</tspan></text></g>
<g class="v2-reading-block" data-block="hand-limits-1" transform="translate(0 736)"><text class="se-copy" x="89" y="24"><tspan x="89">pieces. Malli’s removal of a whole peppercorn from cooked rice uses the same</tspan><tspan x="89" dy="32">idea, although a spoon is more suitable for food.</tspan></text></g>
<g class="v2-reading-block" data-block="threshing-0" transform="translate(0 816)"><text class="se-copy" x="89" y="24"><tspan x="89">In the field, grains are still attached to harvested stalks. Beating or mechanically</tspan><tspan x="89" dy="32">working suitably dried stalks loosens the grains. This is <tspan class="se-bold">threshing</tspan>. It releases</tspan></text></g>
<g class="v2-reading-block" data-block="threshing-1" transform="translate(0 880)"><text class="se-copy" x="89" y="24"><tspan x="89">attached grains; it is not the method for separating an already loose mixture of</tspan><tspan x="89" dy="32">two kinds of grain.</tspan></text></g>
<g class="v2-reading-block" data-block="machines-0" transform="translate(0 960)"><text class="se-copy" x="89" y="24"><tspan x="89">Farmers may use threshers with mechanisms that also clean the released grain</tspan><tspan x="89" dy="32">using air and screens. The beating or rubbing, air separation and screening do</tspan></text></g>
<g class="v2-reading-block" data-block="machines-1" transform="translate(0 1024)"><text class="se-copy" x="89" y="24"><tspan x="89">different jobs, even when one machine performs them. Watch from a safe</tspan><tspan x="89" dy="32">distance; do not approach moving machinery or handle its feed.</tspan></text></g><g transform="translate(0 1104)"><g data-page-illustration="figures/class-6/science/ch09/winnowing.png"><image class="science-illustration" href="../../figures/class-6/science/ch09/winnowing.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Winnowing grain.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Winnowing grain.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
