<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="churn-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">9.7 Churning and Magnetic Separation</tspan></text></g>
<g class="v2-reading-block" data-block="churn-art" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">In Madhya Pradesh, the children see a mathni</tspan><tspan x="89" dy="32">used to churn full-fat curd. <tspan class="se-bold">Churning</tspan> agitates</tspan><tspan x="89" dy="32">the mixture so that small fat droplets join into</tspan><tspan x="89" dy="32">larger butter grains or clumps. These can be</tspan><tspan x="89" dy="32">collected, leaving a more watery liquid called</tspan><tspan x="89" dy="32">buttermilk.</tspan></text><text class="se-copy" x="89" y="232"><tspan x="89">The butter may gather near the top, but</tspan><tspan x="89" dy="32">churning does more than let a lighter</tspan><tspan x="89" dy="32">substance float: it helps the fat join together.</tspan><tspan x="89" dy="32">Churning cream or suitable curd produces</tspan><tspan x="89" dy="32">butter. It is not the usual method for</tspan><tspan x="89" dy="32">separating cream from milk.</tspan></text><image class="science-illustration" data-photo="churning" href="../../figures/class-6/science/ch09/churning.png" x="645.2665895061729" y="0" width="285.46682098765433" height="305" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="448.88"><tspan x="89">Fig. 9.5 · A mathni and pot, with collected butter beside them.</tspan></text></g>
<g class="v2-reading-block" data-block="milk-0" transform="translate(0 647)"><text class="se-copy" x="89" y="24"><tspan x="89">An adult can demonstrate curdling fresh pasteurised milk with a suitable food</tspan><tspan x="89" dy="32">acid, then straining the curds from the liquid. Curdling creates the clumps;</tspan></text></g>
<g class="v2-reading-block" data-block="milk-1" transform="translate(0 711)"><text class="se-copy" x="89" y="24"><tspan x="89">straining separates them. Milk that has spoiled accidentally is different: do not</tspan><tspan x="89" dy="32">taste it or assume cooking will make it safe. An adult should discard suspect milk.</tspan></text></g>
<g class="v2-reading-block" data-block="appliance-0" transform="translate(0 791)"><text class="se-copy" x="89" y="24"><tspan x="89">A hand churner or an appropriate electric churner can supply agitation. Name an</tspan><tspan x="89" dy="32">appliance used for this job at home, if there is one, and explain its role. Observe</tspan></text></g>
<g class="v2-reading-block" data-block="appliance-1" transform="translate(0 855)"><text class="se-copy" x="89" y="24"><tspan x="89">only while an adult operates it; do not insert fingers or utensils into a moving</tspan><tspan x="89" dy="32">appliance.</tspan></text></g>
<g class="v2-reading-block" data-block="magnet-art" transform="translate(0 935)"><text class="se-copy" x="89" y="24"><tspan x="89">In Shillong, a carpenter spills iron nails into</tspan><tspan x="89" dy="32">wood shavings. A magnet can attract the iron</tspan><tspan x="89" dy="32">while leaving most of the wood behind. This is</tspan><tspan x="89" dy="32"><tspan class="se-bold">magnetic</tspan> <tspan class="se-bold">separation</tspan>: it uses a difference in</tspan><tspan x="89" dy="32">magnetic response.</tspan></text><text class="se-copy" x="89" y="200"><tspan x="89">Use large steel paper clips mixed with paper</tspan><tspan x="89" dy="32">pieces for a classroom model. Test one clip</tspan><tspan x="89" dy="32">first with the magnet, then try the mixture. Do</tspan><tspan x="89" dy="32">not use iron powder, sharp nails or dusty</tspan><tspan x="89" dy="32">sawdust. Keep magnets away from electronic</tspan><tspan x="89" dy="32">devices.</tspan></text><image class="science-illustration" data-photo="magnet" href="../../figures/class-6/science/ch09/magnet.png" x="613" y="0.20304568527919287" width="350" height="289.5939086294416" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="416.88"><tspan x="89">Fig. 9.6 · Iron nails contact the magnet; most wood shavings remain in the tray.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
