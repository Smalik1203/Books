span dx="0.49824"> water</tspan><tspan dx="0.49824"> is</tspan><tspan dx="0.49824"> better.</tspan><tspan dx="0.49824"> Write</tspan><tspan dx="0.49824"> a</tspan><tspan dx="0.49824"> short</tspan><tspan dx="0.49824"> original</tspan><tspan dx="0.49824"> poem</tspan><tspan dx="0.49824"> about</tspan><tspan dx="0.49824"> this</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.16837" data-space-ratio="1.924">problem.<tspan dx="5.16837"> Give</tspan><tspan dx="5.16837"> one</tspan><tspan dx="5.16837"> action</tspan><tspan dx="5.16837"> people</tspan><tspan dx="5.16837"> can</tspan><tspan dx="5.16837"> take</tspan><tspan dx="5.16837"> and</tspan><tspan dx="5.16837"> check</tspan><tspan dx="5.16837"> that</tspan><tspan dx="5.16837"> the</tspan><tspan dx="5.16837"> poem</tspan><tspan dx="5.16837"> does</tspan><tspan dx="5.16837"> not</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">imply that a net removes dissolved pollution.</tspan></text></g>
<g class="v2-reading-block" data-block="churn-heading" transform="translate(0 268)"><text class="v2-title" x="89" y="38"><tspan x="89">9.7 Churning and Magnetic Separation</tspan></text></g>
<g class="v2-reading-block" data-block="churn-art" transform="translate(0 326)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">In Madhya Pradesh, the children see a mathni</tspan><tspan x="89" dy="32" data-narrow-prose="true">used to churn full-fat curd. <tspan class="se-bold">Churning</tspan> agitates</tspan><tspan x="89" dy="32" data-narrow-prose="true">the mixture so that small fat droplets join into</tspan><tspan x="89" dy="32" data-narrow-prose="true">larger butter grains or clumps. These can be</tspan><tspan x="89" dy="32" data-narrow-prose="true">collected, leaving a more watery liquid called</tspan><tspan x="89" dy="32" data-paragraph-end="true">buttermilk.</tspan></text><text class="se-copy" x="89" y="232" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">The butter may gather near the top, but</tspan><tspan x="89" dy="32" data-narrow-prose="true">churning does more than let a lighter</tspan><tspan x="89" dy="32" data-narrow-prose="true">substance float: it helps the fat join together.</tspan><tspan x="89" dy="32" data-narrow-prose="true">Churning cream or suitable curd produces</tspan><tspan x="89" dy="32" data-narrow-prose="true">butter. It is not the usual method for</tspan><tspan x="89" dy="32" data-paragraph-end="true">separating cream from milk.</tspan></text><image class="science-illustration" data-photo="churning" href="../../figures/class-6/science/ch09/churning.png" x="645.2665895061729" y="0" width="285.46682098765433" height="305" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="448.88"><tspan x="89">Fig. 9.5 · A mathni and pot, with collected butter beside them.</tspan></text></g>
<g class="v2-reading-block" data-block="milk" transform="translate(0 803)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.73076" data-space-ratio="1.667">An<tspan dx="3.73076"> adult</tspan><tspan dx="3.73076"> can</tspan><tspan dx="3.73076"> demonstrate</tspan><tspan dx="3.73076"> curdling</tspan><tspan dx="3.73076"> fresh</tspan><tspan dx="3.73076"> pasteurised</tspan><tspan dx="3.73076"> milk</tspan><tspan dx="3.73076"> with</tspan><tspan dx="3.73076"> a</tspan><tspan dx="3.73076"> suitable</tspan><tspan dx="3.73076"> food</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="6.77048" data-space-ratio="2.211">acid,<tspan dx="6.77048"> then</tspan><tspan dx="6.77048"> straining</tspan><tspan dx="6.77048"> the</tspan><tspan dx="6.77048"> curds</tspan><tspan dx="6.77048"> from</tspan><tspan dx="6.77048"> the</tspan><tspan dx="6.77048"> liquid.</tspan><tspan dx="6.77048"> Curdling</tspan><tspan dx="6.77048"> creates</tspan><tspan dx="6.77048"> the</tspan><tspan dx="6.77048"> clumps;</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.29025" data-space-ratio="1.588">straining<tspan dx="3.29025"> separates</tspan><tspan dx="3.29025"> them.</tspan><tspan dx="3.29025"> Milk</tspan><tspan dx="3.29025"> that</tspan><tspan dx="3.29025"> has</tspan><tspan dx="3.29025"> spoiled</tspan><tspan dx="3.29025"> accidentally</tspan><tspan dx="3.29025"> is</tspan><tspan dx="3.29025"> different:</tspan><tspan dx="3.29025"> do</tspan><tspan dx="3.29025"> not</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">taste it or assume cooking will make it safe. An adult should discard suspect milk.</tspan></text></g>
<g class="v2-reading-block" data-block="appliance" transform="translate(0 947)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.52181" data-space-ratio="1.093">A<tspan dx="0.52181"> hand</tspan><tspan dx="0.52181"> churner</tspan><tspan dx="0.52181"> or</tspan><tspan dx="0.52181"> an</tspan><tspan dx="0.52181"> appropriate</tspan><tspan dx="0.52181"> electric</tspan><tspan dx="0.52181"> churner</tspan><tspan dx="0.52181"> can</tspan><tspan dx="0.52181"> supply</tspan><tspan dx="0.52181"> agitation.</tspan><tspan dx="0.52181"> Name</tspan><tspan dx="0.52181"> an</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.68055" data-space-ratio="1.301">appliance<tspan dx="1.68055"> used</tspan><tspan dx="1.68055"> for</tspan><tspan dx="1.68055"> this</tspan><tspan dx="1.68055"> job</tspan><tspan dx="1.68055"> at</tspan><tspan dx="1.68055"> home,</tspan><tspan dx="1.68055"> if</tspan><tspan dx="1.68055"> there</tspan><tspan dx="1.68055"> is</tspan><tspan dx="1.68055"> one,</tspan><tspan dx="1.68055"> and</tspan><tspan dx="1.68055"> explain</tspan><tspan dx="1.68055"> its</tspan><tspan dx="1.68055"> role.</tspan><tspan dx="1.68055"> Observe</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.76215" data-space-ratio="1.673">only<tspan dx="3.76215"> while</tspan><tspan dx="3.76215"> an</tspan><tspan dx="3.76215"> adult</tspan><tspan dx="3.76215"> operates</tspan><tspan dx="3.76215"> it;</tspan><tspan dx="3.76215"> do</tspan><tspan dx="3.76215"> not</tspan><tspan dx="3.76215"> insert</tspan><tspan dx="3.76215"> fingers</tspan><tspan dx="3.76215"> or</tspan><tspan dx="3.76215"> utensils</tspan><tspan dx="3.76215"> into</tspan><tspan dx="3.76215"> a</tspan><tspan dx="3.76215"> moving</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">appliance.</tspan><
