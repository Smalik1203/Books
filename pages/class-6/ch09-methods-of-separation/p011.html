building it. Any container cutting is an adult’s job.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Test with a prepared sand-and-soil water sample, not collected pond</tspan><tspan x="146" dy="32">water. Measure equal sample volumes. Keep a little unfiltered mixture for</tspan><tspan x="146" dy="32">comparison.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Collect the output and record its appearance, volume and the time taken.</tspan><tspan x="146" dy="32">Change one feature, such as the cloth layers, and repeat with a fresh</tspan><tspan x="146" dy="32">comparable sample.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Explain what improved and what your test cannot establish. Do not drink</tspan><tspan x="146" dy="32">the output, even if it looks clear. Keep it away from food and wash hands</tspan><tspan x="146" dy="32">and equipment afterwards.</tspan></text></g><g transform="translate(0 644)"><g data-page-illustration="figures/class-6/science/ch09/filtration.png"><image class="science-illustration" href="../../figures/class-6/science/ch09/filtration.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>A filtration setup.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">A filtration setup.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="14
