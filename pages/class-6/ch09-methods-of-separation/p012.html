<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="magnet-limit-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Not every metal is strongly attracted to a classroom magnet. Iron and many steels</tspan><tspan x="89" dy="32">are; aluminium and copper are not. A magnet also cannot separate two</tspan></text></g>
<g class="v2-reading-block" data-block="magnet-limit-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">components if both respond similarly. Some non-magnetic pieces may be carried</tspan><tspan x="89" dy="32">along when caught between attracted objects, so inspect the recovered material.</tspan></text></g>
<g class="v2-reading-block" data-block="recycling-0" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">Recyclers use large magnets to lift iron and steel from mixed scrap. The</tspan><tspan x="89" dy="32">recovered metal can be sorted and processed for reuse. Other materials need</tspan></text></g>
<g class="v2-reading-block" data-block="recycling-1" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89">other methods. A magnetic crane is an industrial machine; watch only from a</tspan><tspan x="89" dy="32">permitted safe area, never from beneath its load.</tspan></text></g>
<g class="v2-reading-block" data-block="sequence-heading" transform="translate(0 412)"><text class="v2-title" x="89" y="38"><tspan x="89">9.8 Choosing a Sequence</tspan></text></g>
<g class="v2-reading-block" data-block="sequence-0" transform="translate(0 470)"><text class="se-copy" x="89" y="24"><tspan x="89">Ask three questions before choosing: What components are present? Which</tspan><tspan x="89" dy="32">properties differ? What must be recovered? To recover salt from sand and salt,</tspan></text></g>
<g class="v2-reading-block" data-block="sequence-1" transform="translate(0 534)"><text class="se-copy" x="89" y="24"><tspan x="89">for example, dissolve the salt in water, filter off the sand, then evaporate water</tspan><tspan x="89" dy="32">from the filtrate. Filtering first without adding water would not use the solubility</tspan><tspan x="89" dy="32">difference.</tspan></text></g>
<g class="v2-reading-block" data-block="purpose-task" transform="translate(0 646)"><rect class="se-activity-panel" x="89" y="0" width="874" height="338" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Make slips for the ten situations listed below. Provide two baskets labelled</tspan><tspan x="146" dy="32">“Remove an unwanted component” and “Recover useful components”.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Take turns placing a slip and explaining the intended use, the method</tspan><tspan x="146" dy="32">and a property it uses. A team may put the same situation in either basket</tspan><tspan x="146" dy="32">if it clearly states a different purpose.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Discuss cases that need more information. Award credit for a justified</tspan><tspan x="146" dy="32">choice, not only for matching another group’s basket.</tspan></text></g><g transform="translate(0 1006)"><g data-page-illustration="figures/class-6/science/ch09/magnet.png"><image class="science-illustration" href="../../figures/class-6/science/ch09/magnet.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Magnetic separation equipment.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Magnetic separation equipment.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
