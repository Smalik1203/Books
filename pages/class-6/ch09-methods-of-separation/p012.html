"132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Take turns placing a slip and explaining the intended use, the method</tspan><tspan x="146" dy="32">and a property it uses. A team may put the same situation in either basket</tspan><tspan x="146" dy="32">if it clearly states a different purpose.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Discuss cases that need more information. Award credit for a justified</tspan><tspan x="146" dy="32">choice, not only for matching another group’s basket.</tspan></text></g>

<g class="v2-reading-block" data-block="sequence-close-0" transform="translate(0 1144)"><text class="se-copy" x="89" y="24"><tspan x="89">A method is useful when it exploits a difference that is actually present. Check</tspan><tspan x="89" dy="32">what was recovered, what remained mixed and what may have been lost. Two</tspan></text></g>
<g class="v2-reading-block" data-block="sequence-close-1" transform="translate(0 1208)"><text class="se-copy" x="89" y="24"><tspan x="89">sensible sequences may exist, but a claim of complete separation needs</tspan><tspan x="89" dy="32">evidence, not just a list of method names.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
