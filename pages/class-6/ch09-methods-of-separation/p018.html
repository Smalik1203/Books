<g class="v2-reading-block" data-block="wise-fish" transform="translate(0 170)"><text class="se-heading" x="89" y="30"><tspan x="89">Wise Fish: match a method to an idea</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Write method names on red paper fish and descriptions on blue cards, using the</tspan><tspan x="89" dy="32">table below. Attach a large steel clip to each. An adult should secure a large</tspan><tspan x="89" dy="32">magnet to a short string on a cardboard rod. Fish out a method and its matching</tspan><tspan x="89" dy="32">description, then explain the match. Keep magnets and clips away from mouths</tspan><tspan x="89" dy="32">and younger children; do not swing the rod.</tspan></text></g><g transform="translate(0 406)"><g data-page-illustration="figures/class-6/science/ch09/magnet.png"><image class="science-illustration" href="../../figures/class-6/science/ch09/magnet.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Magnetic separation equipment.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Magnetic separation equipment.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
