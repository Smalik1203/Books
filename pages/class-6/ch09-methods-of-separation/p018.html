<section class="page page--food page--science-editorial page--science-v2 page--g6-ch09" data-folio="18" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Methods of Separation in Everyday Life, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Methods of Separation in Everyday Life</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Explore Further</tspan></text></g>
<g class="v2-reading-block" data-block="project-kitchen" transform="translate(0 170)"><text class="se-heading" x="89" y="30"><tspan x="89">1. Follow a kitchen separation</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">With an adult, observe a food or familiar herbal drink being prepared. Record</tspan><tspan x="89" dy="32">dissolving, straining and evaporation. Only the adult handles hot equipment. Do</tspan><tspan x="89" dy="32">not prepare remedies for illness or assume that “herbal” means safe.</tspan></text></g>
<g class="v2-reading-block" data-block="project-play" transform="translate(0 342)"><text class="se-heading" x="89" y="30"><tspan x="89">2. Put the journey on stage</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Act out Malli and Valli’s five stops. Show each mixture, method and useful</tspan><tspan x="89" dy="32">property. Include an unsuccessful attempt and a revision. Use drawings and</tspan><tspan x="89" dy="32">clean props, without heat, sharp tools or powders.</tspan></text></g>
<g class="v2-reading-block" data-block="project-week" transform="translate(0 514)"><text class="se-heading" x="89" y="30"><tspan x="89">3. Keep a separation diary</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">For a week, record the mixture, desired component, method and evidence of</tspan><tspan x="89" dy="32">separation in everyday examples. Compare with classmates. Which method</tspan><tspan x="89" dy="32">appears most often? Could your observation times have affected that result?</tspan></text></g>
<g class="v2-reading-block" data-block="project-community" transform="translate(0 686)"><text class="se-heading" x="89" y="30"><tspan x="89">4. Learn from a recycling worker</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Ask a teacher to arrange a respectful interview with an adult waste-sorting</tspan><tspan x="89" dy="32">worker about their methods. Do not enter waste piles, handle discarded objects</tspan><tspan x="89" dy="32">or photograph without permission. Report accurately and discuss how the</tspan><tspan x="89" dy="32">community can support children’s schooling.</tspan></text></g>
<g class="v2-reading-block" data-block="project-reporter" transform="translate(0 890)"><text class="se-heading" x="89" y="30"><tspan x="89">5. Report on methods around you</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Collect dated reports about separation in farming or construction. A teacher may</tspan><tspan x="89" dy="32">arrange a farmer interview about machinery and human decisions. Also research</tspan><tspan x="89" dy="32">the Salt March for a poster, or collect a harvest song with permission and</tspan><tspan x="89" dy="32">describe its setting.</tspan></text></g>
<g class="v2-reading-block" data-block="project-mixture" transform="translate(0 1094)"><text class="se-heading" x="89" y="30"><tspan x="89">6. Plan a six-component separation</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Plan to recover iron nails, sand, whole black pepper, stones, salt and water from</tspan><tspan x="89" dy="32">a mixture. State the particle sizes and other information needed. Has the salt</tspan><tspan x="89" dy="32">dissolved? Trace each component through your steps. Compare two sequences</tspan><tspan x="89" dy="32">and possible losses. How would you recover the water too? Keep this a written</tspan><tspan x="89" dy="32">plan unless your teacher directs a safe demonstration.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
