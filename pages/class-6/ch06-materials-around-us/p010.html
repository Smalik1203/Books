<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="light-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">6.5 Seeing Through Materials</tspan></text></g>
<g class="v2-reading-block" data-block="hide-story-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Ghulan hides behind a wall, Sheeta behind a tree and Sara behind a frosted-glass</tspan><tspan x="89" dy="32">door. Sheeta’s brother watches from a clear window. Which barriers hide a</tspan></text></g>
<g class="v2-reading-block" data-block="hide-story-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">person completely, and which might leave a visible outline? Consider the</tspan><tspan x="89" dy="32">material between observer and object.</tspan></text></g>
<g class="v2-reading-block" data-block="light-task" transform="translate(0 314)"><rect class="se-activity-panel" x="89" y="0" width="874" height="478" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Gather safe examples of a clear tumbler, butter paper, eraser, wooden</tspan><tspan x="146" dy="32">board and clear or frosted plastic. A teacher may show glass samples with</tspan><tspan x="146" dy="32">protected edges.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Put the same coloured object behind each sample in the same light and at</tspan><tspan x="146" dy="32">the same distance. Look from the front. Do not look at the Sun or use a</tspan><tspan x="146" dy="32">laser.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Record Sample, Can I see the object clearly?, Can I see a hazy shape? and</tspan><tspan x="146" dy="32">Does light pass through? in your notebook. Use these observations to</tspan><tspan x="146" dy="32">make three groups.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Compare groupings and explain uncertain cases. Does doubling the</tspan><tspan x="146" dy="32">paper layer change what you see? Keep the object and lighting the same.</tspan></text></g>
<g class="v2-reading-block" data-block="light-evidence-0" transform="translate(0 814)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">transparent</tspan> sample transmits light so that an object can be seen clearly</tspan><tspan x="89" dy="32">through it. A <tspan class="se-bold">translucent</tspan> sample transmits light but scatters it enough to prevent</tspan></text></g><g transform="translate(0 878)"><g data-page-illustration="figures/class-6/science/ch06/pottery.png"><image class="science-illustration" href="../../figures/class-6/science/ch06/pottery.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Clay vessels.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Clay vessels.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
