<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="dissolve-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="510" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Label five identical clear containers Sugar, Salt, Chalk, Sand and Sawdust.</tspan><tspan x="146" dy="32">Add the same amount of water at the same temperature to each. A</tspan><tspan x="146" dy="32">teacher supplies small samples and handles any dusty powder.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Predict what will happen before adding anything. Add the same small</tspan><tspan x="146" dy="32">level spoonful of the named material to each container. Use a clean spoon</tspan><tspan x="146" dy="32">for each sample to avoid mixing them together.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Stir for the same length of time, then let the containers stand for several</tspan><tspan x="146" dy="32">minutes. Record visible grains, cloudiness, floating material or sediment.</tspan><tspan x="146" dy="32">Do not taste any sample.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Make a notebook table headed Material, Prediction, Observation after</tspan><tspan x="146" dy="32">stirring, Observation after standing and Interpretation. If a sample is</tspan><tspan x="146" dy="32">uncertain, repeat with less material and explain why.</tspan></text></g>
<g class="v2-reading-block" data-block="dissolve-evidence-0" transform="translate(0 644)"><text class="se-copy" x="89" y="24"><tspan x="89">When salt or sugar <tspan class="se-bold">dissolves</tspan>, it spreads through the water at a scale too small to</tspan><tspan x="89" dy="32">see as separate grains. The substance remains present. A <tspan class="se-bold">solution</tspan> can be clear</tspan></text></g>
<g class="v2-reading-block" data-block="dissolve-evidence-1" transform="translate(0 708)"><text class="se-copy" x="89" y="24"><tspan x="89">even though it contains dissolved material. “No grains visible” is an observation;</tspan><tspan x="89" dy="32">“the material no longer exists” is an incorrect conclusion.</tspan></text></g>
<g class="v2-reading-block" data-block="solubility-table" transform="translate(0 788)"><g data-comparison-table="solubility-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Dissolving is different from floating or settling</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="96"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Sample in</tspan><tspan x="103" dy="28">room-temperature</tspan><tspan x="103" dy="28">water</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="347.72" y="70.08"><tspan x="347.72">Usual observation with a</tspan><tspan x="347.72" dy="28">small amount</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="671.1" y="70.08"><tspan x="671.1">Interpretation</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="138" y2="138"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="166.07999999999998"><tspan x="103">Sugar or salt</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="166.07999999999998"><tspan x="347.72">Separate grains are no longer</tspan><tspan x="347.72" dy="28">visible after stirring</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="166.07999999999998"><tspan x="671.1">Soluble in these conditions;</tspan><tspan x="671.1" dy="28">remains in solution</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="206" y2="206"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="234.07999999999998"><tspan x="103">Sand</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="234.07999999999998"><tspan x="347.72">Grains remain and</tspan><tspan x="347.72" dy="28">commonly settle</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="234.07999999999998"><tspan x="671.1">Does not dissolve</tspan><tspan x="671.1" dy="28">appreciably</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="274" y2="274"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="302.08"><tspan x="103">Chalk powder</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="302.08"><tspan x="347.72">Water may become cloudy;</tspan><tspan x="347.72" dy="28">some material settles</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="302.08"><tspan x="671.1">Mostly remains as</tspan><tspan x="671.1" dy="28">undissolved particles</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="342" y2="342"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="370.08"><tspan x="103">Sawdust</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="370.08"><tspan x="347.72">Pieces remain; some may</tspan><tspan x="347.72" dy="28">float</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="370.08"><tspan x="671.1">Floating is not dissolving</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="410" y2="410"/><rect class="v2-table-frame" x="89" y="42" width="874" height="368"/><line class="v2-table-rule" x1="333.72" x2="333.72" y1="42" y2="410"/><line class="v2-table-rule" x1="657.1" x2="657.1" y1="42" y2="410"/><text class="v2-table-note" x="89" y="442.88"><tspan x="89">Record your own observations first. Amount, temperature, stirring time and the exact sample</tspan><tspan x="89" dy="26">can affect what you see.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
