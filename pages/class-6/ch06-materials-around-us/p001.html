<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06 page--opener" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 1"><g class="chapter-opener" data-opener="science-g6-ch06"><defs><linearGradient id="science-g6-ch06-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop class="chapter-opener__gradient-start" offset="0%"/><stop class="chapter-opener__gradient-end" offset="100%"/></linearGradient></defs><path class="chapter-opener__band" fill="url(#science-g6-ch06-gradient)" d="M-17 -17H1069V300H-17Z"/><path class="chapter-opener__edge" d="M-17 296H1069V300H-17Z"/><g class="science-header-art" data-header-art="6-6" aria-hidden="true" transform="translate(886 26)"><g data-art-element="jar" transform="translate(7 82) scale(1.12) rotate(-6 50 50)"><path class="science-header-art__soft" d="M30 9H71V19L65 23V34C98 46 98 82 74 91H26C2 82 2 46 35 34V23L30 19Z"/><path d="M34 28H66M13 63H87M20 78H80"/></g><g data-art-element="cube" transform="translate(72 0) scale(0.62) rotate(8 50 50)"><path class="science-header-art__soft" d="M13 27L50 8L88 27V73L50 94L13 73Z"/><path d="M13 27L50 47L88 27M50 47V94"/></g><g data-art-element="tumbler" transform="translate(64 184) scale(0.65) rotate(7 50 50)"><path class="science-header-art__soft" d="M18 16H83L75 88Q50 99 25 88Z"/><path d="M19 19Q50 34 82 19M30 77Q50 85 70 77"/></g></g><line class="chapter-opener__divider" x1="240" x2="240" y1="94" y2="252"/><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number se-running" x="151" y="242" text-anchor="middle">6</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">Materials</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">Around Us</text><image class="science-illustration chapter-opener__image" href="../../figures/class-6/science/ch06/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Teacher and students comparing everyday objects and their materials</title></image></g><text class="se-copy v2-intro" x="89" y="981"><tspan x="89">A notebook, a tumbler and a school bag serve different purposes. What</tspan><tspan x="89" dy="34">makes their materials right for the job?</tspan></text><text class="se-copy" x="89" y="1067"><tspan x="89">Ghulan and Sheeta bring new notebooks and pens to class after the summer</tspan><tspan x="89" dy="32">break. Madam Vidya asks everyone to look more closely: Which objects shine?</tspan><tspan x="89" dy="32">Which can bend? Which let you see through them? The same classroom now</tspan><tspan x="89" dy="32">offers many questions to investigate.</tspan></text><text class="se-copy" x="89" y="1211"><tspan x="89">Begin by naming objects and their materials. Choose a property, make a careful</tspan><tspan x="89" dy="32">comparison and explain your grouping. Then test how materials behave with</tspan><tspan x="89" dy="32">light and water, and discover two properties shared by all matter: mass and</tspan><tspan x="89" dy="32">volume.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
