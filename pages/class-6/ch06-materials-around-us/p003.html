<g class="v2-reading-block" data-block="clay-head" transform="translate(0 448)"><text class="se-heading" x="89" y="30"><tspan x="89">From Clay to a Useful Vessel</tspan></text></g>
<g class="v2-reading-block" data-block="clay-story-0" transform="translate(0 496)"><text class="se-copy" x="89" y="24"><tspan x="89">People have chosen and worked materials for a very long time. Clay can be</tspan><tspan x="89" dy="32">cleaned, mixed with water, shaped and fired in a kiln. Fired clay is called</tspan></text></g>
<g class="v2-reading-block" data-block="clay-story-1" transform="translate(0 560)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">terracotta</tspan>. Harappan pottery includes red surfaces with painted patterns. Jars,</tspan><tspan x="89" dy="32">bowls and dishes show how one material can serve cooking, storage and other</tspan><tspan x="89" dy="32">purposes.</tspan></text></g>
<g class="v2-reading-block" data-block="pottery-picture" transform="translate(0 672)"><image class="science-illustration" data-photo="pottery" href="../../figures/class-6/science/ch06/pottery.png" x="301" y="0" width="450" height="300" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="330.88"><tspan x="89">A clay jar and bowl illustrate different forms made from one material. This is a craft</tspan><tspan x="89" dy="27">illustration, not a reconstruction of a particular museum object.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
