<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 11"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="light-evidence-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">a clear view. An <tspan class="se-bold">opaque</tspan> sample blocks a view through it; it transmits no</tspan><tspan x="89" dy="32">appreciable light under the test conditions.</tspan></text></g>
<g class="v2-reading-block" data-block="panes-picture" transform="translate(0 192)"><image class="science-illustration" data-photo="panes" href="../../figures/class-6/science/ch06/panes.png" x="88.99999999999994" y="4.333333333333314" width="874.0000000000001" height="291.33333333333337" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="243" y="334" text-anchor="middle">Clear glass</text><text class="se-caption" x="526" y="334" text-anchor="middle">Frosted glass</text><text class="se-caption" x="809" y="334" text-anchor="middle">Wood</text><text class="se-caption" x="89" y="372.88"><tspan x="89">Clear glass gives a clear view; frosted glass gives a diffuse view; wood blocks the view.</tspan><tspan x="89" dy="27">Compare equally thick samples under the same lighting.</tspan></text></g>
<g class="v2-reading-block" data-block="light-table" transform="translate(0 626)"><g data-comparison-table="light-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Compare the view through each sample</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="68"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Group</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="304.02" y="70.08"><tspan x="304.02">View of an object behind it</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="653.62" y="70.08"><tspan x="653.62">Examples in ordinary</tspan><tspan x="653.62" dy="28">thicknesses</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="110" y2="110"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="138.07999999999998"><tspan x="103">Transparent</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="304.02" y="138.07999999999998"><tspan x="304.02">Clear details</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="653.62" y="138.07999999999998"><tspan x="653.62">Clear window glass, clean</tspan><tspan x="653.62" dy="28">water, air</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="206.07999999999998"><tspan x="103">Translucent</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="304.02" y="206.07999999999998"><tspan x="304.02">Hazy light or shape; no clear</tspan><tspan x="304.02" dy="28">details</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="653.62" y="206.07999999999998"><tspan x="653.62">Frosted glass, butter paper</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="246" y2="246"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="274.08"><tspan x="103">Opaque</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="304.02" y="274.08"><tspan x="304.02">No view through the sample</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="653.62" y="274.08"><tspan x="653.62">Wood, cardboard, a metal</tspan><tspan x="653.62" dy="28">sheet</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="314" y2="314"/><rect class="v2-table-frame" x="89" y="42" width="874" height="272"/><line class="v2-table-rule" x1="290.02" x2="290.02" y1="42" y2="314"/><line class="v2-table-rule" x1="639.62" x2="639.62" y1="42" y2="314"/><text class="v2-table-note" x="89" y="346.88"><tspan x="89">Thickness, coatings and suspended particles can change the result. A material name alone</tspan><tspan x="89" dy="26">does not describe every sample.</tspan></text></g></g>
<g class="v2-reading-block" data-block="hide-explain-0" transform="translate(0 1020)"><text class="se-copy" x="89" y="24"><tspan x="89">The wall and tree trunk block the view of Ghulan and Sheeta. Frosted glass may</tspan><tspan x="89" dy="32">show Sara’s blurred outline, while clear window glass lets the brother look out.</tspan></text></g>
<g class="v2-reading-block" data-block="hide-explain-1" transform="translate(0 1084)"><text class="se-copy" x="89" y="24"><tspan x="89">Clean water is transparent in a shallow clear container; adding suspended chalk</tspan><tspan x="89" dy="32">can make the mixture cloudy and, at sufficient concentration, prevent a view</tspan><tspan x="89" dy="32">through it.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">11</text></g></svg></div></div></section>
