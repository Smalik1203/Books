<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="25"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 25"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Explore Further</tspan></text></g>
<g class="v2-reading-block" data-block="project1" transform="translate(0 170)"><text class="se-heading" x="89" y="30"><tspan x="89">Find out what is recycled locally</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">With an adult, consult your local collection service, a reliable local website or</tspan><tspan x="89" dy="32">community information. List materials accepted for recycling, how they should</tspan><tspan x="89" dy="32">be cleaned or separated, and which are not accepted. Record the source and date.</tspan><tspan x="89" dy="32">A recyclable material is not necessarily collected everywhere, so distinguish</tspan><tspan x="89" dy="32">material properties from local facilities.</tspan></text><image class="science-illustration" data-photo="reuse" href="../../figures/class-6/science/ch06/reuse.png" x="316" y="224" width="420" height="280" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="534.88"><tspan x="89">Reusing an object and recycling its material are different ways to reduce waste.</tspan></text></g>
<g class="v2-reading-block" data-block="project2" transform="translate(0 735)"><text class="se-heading" x="89" y="30"><tspan x="89">Ask a recycler about sorting</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">With an adult, interview a recycler about the properties used to sort and value</tspan><tspan x="89" dy="32">old objects. Ask whether contamination, mixed materials, coatings or damage</tspan><tspan x="89" dy="32">affect acceptance. Record reasons for materials they do not buy. Observe from a</tspan><tspan x="89" dy="32">safe place; do not handle sharp scrap, batteries, electronic waste or unknown</tspan><tspan x="89" dy="32">containers.</tspan></text><image class="science-illustration" data-photo="hardness" href="../../figures/class-6/science/ch06/hardness.png" x="276" y="280.6666666666667" width="500" height="166.66666666666666" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="534.88"><tspan x="89">The material, its condition and the possibility of separating it can matter more than the</tspan><tspan x="89" dy="27">object’s old use.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">25</text></g></svg></div></div></section>
