<g class="v2-reading-block" data-block="q3" transform="translate(0 502)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24"><tspan x="132">Why are many storage containers transparent? Suggest one situation where</tspan><tspan x="132" dy="32">an opaque container would be a better choice, and explain why.</tspan></text></g>
<g class="v2-reading-block" data-block="q4" transform="translate(0 596)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24"><tspan x="132">Decide whether each statement is true or false for the samples described,</tspan><tspan x="132" dy="32">and correct false statements. (a) A wooden board is translucent while clear</tspan><tspan x="132" dy="32">window glass is opaque. (b) Clean aluminium foil is lustrous while an</tspan><tspan x="132" dy="32">ordinary uncoated eraser is non-lustrous. (c) A small amount of sugar</tspan><tspan x="132" dy="32">dissolves in enough water, while sawdust remains as pieces. (d) An apple is</tspan><tspan x="132" dy="32">matter because it has mass but occupies no space.</tspan></text></g>
<g class="v2-reading-block" data-block="q5" transform="translate(0 818)"><text class="se-copy" x="111" y="24" text-anchor="end">5.</text><text class="se-copy" x="132" y="24"><tspan x="132">Compare wood, iron, plastic, bamboo, concrete and stone for making a chair.</tspan><tspan x="132" dy="32">Use a table with the criteria: supports a seated person without bending or</tspan><tspan x="132" dy="32">shaking, easy to lift, comfortable to touch in winter, and easy to clean.</tspan><tspan x="132" dy="32">Explain how thickness, joints, coatings and chair design affect your choices.</tspan><tspan x="132" dy="32">Why is resistance to bending not the same as surface hardness?</tspan></text></g><g transform="translate(0 1008)"><g data-page-illustration="figures/class-6/science/ch06/panes.png"><image class="science-illustration" href="../../figures/class-6/science/ch06/panes.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Different viewing materials.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Different viewing materials.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">23</text></g></svg></div></div></section>
