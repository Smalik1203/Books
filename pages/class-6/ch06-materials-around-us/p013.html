<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="volume-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">6.8 Space, Volume and Capacity</tspan></text></g>
<g class="v2-reading-block" data-block="bags-story-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Madam Vidya asks the class to put school bags on their seats. There is no longer</tspan><tspan x="89" dy="32">room to sit: the bags occupy space. Water occupies space too. Two identical</tspan></text></g>
<g class="v2-reading-block" data-block="bags-story-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">tumblers may hold different amounts of water even though the containers are the</tspan><tspan x="89" dy="32">same size.</tspan></text></g>
<g class="v2-reading-block" data-block="volume-picture" transform="translate(0 314)"><g class="v2-material-diagram" data-diagram="volume"><path class="v2-material-glass" d="M244 30V240Q322 264 400 240V30"/><path class="v2-material-water" d="M247 145.5H397V237Q322 259 247 237Z"/><ellipse class="v2-material-water" cx="322" cy="145.5" rx="75" ry="11"/><ellipse class="v2-material-rim" cx="322" cy="30" rx="78" ry="12"/><path class="v2-material-glass" d="M652 30V240Q730 264 808 240V30"/><path class="v2-material-water" d="M655 61.5H805V237Q730 259 655 237Z"/><ellipse class="v2-material-water" cx="730" cy="61.5" rx="75" ry="11"/><ellipse class="v2-material-rim" cx="730" cy="30" rx="78" ry="12"/><text class="v2-material-label" x="322" y="289" text-anchor="middle">Smaller water volume</text><text class="v2-material-label" x="730" y="289" text-anchor="middle">Larger water volume</text></g><text class="se-caption" x="89" y="335.88"><tspan x="89">The containers have the same capacity, but the water occupies different volumes.</tspan></text></g>
<g class="v2-reading-block" data-block="volume-evidence-0" transform="translate(0 678)"><text class="se-copy" x="89" y="24"><tspan x="89">The space occupied by something is its <tspan class="se-bold">volume</tspan>. A container’s <tspan class="se-bold">capacity</tspan> is the</tspan><tspan x="89" dy="32">volume it can hold up to a specified limit. A half-filled tumbler has the same</tspan></text></g>
<g class="v2-reading-block" data-block="volume-evidence-1" transform="translate(0 742)"><text class="se-copy" x="89" y="24"><tspan x="89">capacity as when it is full, but contains a smaller volume of water. A jug’s</tspan><tspan x="89" dy="32">contents cannot all fit in a bottle if they exceed its available capacity.</tspan></text></g>
<g class="v2-reading-block" data-block="mass-volume-table" transform="translate(0 822)"><g data-comparison-table="mass-volume-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Do not confuse the quantities</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Quantity</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="304.02" y="70.08"><tspan x="304.02">What it describes</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="706.0600000000001" y="70.08"><tspan x="706.0600000000001">Common units</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Mass</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="304.02" y="110.08"><tspan x="304.02">A property compared using a balance</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="706.0600000000001" y="110.08"><tspan x="706.0600000000001">gram (g), kilogram (kg)</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="122" y2="122"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="150.07999999999998"><tspan x="103">Volume</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="304.02" y="150.07999999999998"><tspan x="304.02">Space occupied by a substance or</tspan><tspan x="304.02" dy="28">object</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="706.0600000000001" y="150.07999999999998"><tspan x="706.0600000000001">millilitre (mL), litre (L),</tspan><tspan x="706.0600000000001" dy="28">cubic metre (m³)</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="190" y2="190"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="218.07999999999998"><tspan x="103">Capacity</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="304.02" y="218.07999999999998"><tspan x="304.02">How much a container can hold</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="706.0600000000001" y="218.07999999999998"><tspan x="706.0600000000001">mL or L, for many</tspan><tspan x="706.0600000000001" dy="28">everyday containers</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="258" y2="258"/><rect class="v2-table-frame" x="89" y="42" width="874" height="216"/><line class="v2-table-rule" x1="290.02" x2="290.02" y1="42" y2="258"/><line class="v2-table-rule" x1="692.0600000000001" x2="692.0600000000001" y1="42" y2="258"/></g></g>
<g class="v2-reading-block" data-block="labels-0" transform="translate(0 1096)"><text class="se-copy" x="89" y="24"><tspan x="89">A milk carton and a water bottle may each say 500 mL. That states equal volumes</tspan><tspan x="89" dy="32">of contents, not equal masses or necessarily equal container capacities. To</tspan></text></g>
<g class="v2-reading-block" data-block="labels-1" transform="translate(0 1160)"><text class="se-copy" x="89" y="24"><tspan x="89">compare masses, use a balance. To compare volumes, use a suitable graduated</tspan><tspan x="89" dy="32">container.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
