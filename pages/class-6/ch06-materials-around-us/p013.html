<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="dissolve-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">When salt or sugar <tspan class="se-bold">dissolves</tspan>, it spreads through the water at a scale too small to</tspan><tspan x="89" dy="32">see as separate grains. The substance remains present. A <tspan class="se-bold">solution</tspan> can be clear</tspan></text></g>
<g class="v2-reading-block" data-block="dissolve-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">even though it contains dissolved material. “No grains visible” is an observation;</tspan><tspan x="89" dy="32">“the material no longer exists” is an incorrect conclusion.</tspan></text></g>
<g class="v2-reading-block" data-block="solubility-table" transform="translate(0 256)"><g data-comparison-table="solubility-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Dissolving is different from floating or settling</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="96"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Sample in</tspan><tspan x="103" dy="28">room-temperature</tspan><tspan x="103" dy="28">water</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="347.72" y="70.08"><tspan x="347.72">Usual observation with a</tspan><tspan x="347.72" dy="28">small amount</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="671.1" y="70.08"><tspan x="671.1">Interpretation</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="138" y2="138"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="166.07999999999998"><tspan x="103">Sugar or salt</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="166.07999999999998"><tspan x="347.72">Separate grains are no longer</tspan><tspan x="347.72" dy="28">visible after stirring</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="166.07999999999998"><tspan x="671.1">Soluble in these conditions;</tspan><tspan x="671.1" dy="28">remains in solution</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="206" y2="206"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="234.07999999999998"><tspan x="103">Sand</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="234.07999999999998"><tspan x="347.72">Grains remain and</tspan><tspan x="347.72" dy="28">commonly settle</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="234.07999999999998"><tspan x="671.1">Does not dissolve</tspan><tspan x="671.1" dy="28">appreciably</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="274" y2="274"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="302.08"><tspan x="103">Chalk powder</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="302.08"><tspan x="347.72">Water may become cloudy;</tspan><tspan x="347.72" dy="28">some material settles</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="302.08"><tspan x="671.1">Mostly remains as</tspan><tspan x="671.1" dy="28">undissolved particles</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="342" y2="342"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="370.08"><tspan x="103">Sawdust</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="370.08"><tspan x="347.72">Pieces remain; some may</tspan><tspan x="347.72" dy="28">float</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="370.08"><tspan x="671.1">Floating is not dissolving</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="410" y2="410"/><rect class="v2-table-frame" x="89" y="42" width="874" height="368"/><line class="v2-table-rule" x1="333.72" x2="333.72" y1="42" y2="410"/><line class="v2-table-rule" x1="657.1" x2="657.1" y1="42" y2="410"/><text class="v2-table-note" x="89" y="442.88"><tspan x="89">Record your own observations first. Amount, temperature, stirring time and the exact sample</tspan><tspan x="89" dy="26">can affect what you see.</tspan></text></g></g>
<g class="v2-reading-block" data-block="limits-0" transform="translate(0 746)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Soluble</tspan> means a material can dissolve in the specified liquid. <tspan class="se-bold">Insoluble</tspan> usually</tspan><tspan x="89" dy="32">means that so little dissolves that it is negligible for the situation. A fixed amount</tspan></text></g><g transform="translate(0 810)"><g data-page-illustration="figures/class-6/science/ch06/mixing.png"><image class="science-illustration" href="../../figures/class-6/science/ch06/mixing.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Materials for a mixing test.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Materials for a mixing test.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
