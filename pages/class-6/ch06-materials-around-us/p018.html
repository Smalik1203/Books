<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="air-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">A teacher can lower an inverted empty cup straight down into water. Much of the</tspan><tspan x="89" dy="32">water is kept out by the trapped air. Tilting the cup allows bubbles to escape and</tspan></text></g>
<g class="v2-reading-block" data-block="air-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">water to enter. This shows that air occupies space; by itself, it does not measure</tspan><tspan x="89" dy="32">air’s mass. A suitable balance and controlled experiment are needed for that</tspan><tspan x="89" dy="32">separate claim.</tspan></text></g>
<g class="v2-reading-block" data-block="plastic-think" transform="translate(0 288)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="218" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Plastic can make objects light, durable and resistant to water. The same</tspan><tspan x="113" dy="32">durability can make discarded plastic persist. Choose one use and compare</tspan><tspan x="113" dy="32">benefits, waste and available alternatives. Can one label, “good” or “bad”,</tspan><tspan x="113" dy="32">answer every material-choice question?</tspan></text></g>
<g class="v2-reading-block" data-block="classification-close-0" transform="translate(0 528)"><text class="se-copy" x="89" y="24"><tspan x="89">Grouping helps us find patterns, whether we study materials, rocks or living</tspan><tspan x="89" dy="32">things. It also helps us choose objects for a purpose. Keep the rule explicit, test</tspan></text></g>
<g class="v2-reading-block" data-block="classification-close-1" transform="translate(0 592)"><text class="se-copy" x="89" y="24"><tspan x="89">more than one property and revise a grouping when new evidence gives a better</tspan><tspan x="89" dy="32">explanation.</tspan></text></g>
<g class="v2-reading-block" data-block="historical-head" transform="translate(0 684)"><text class="se-heading" x="89" y="30"><tspan x="89">Ways of Describing Properties</tspan></text></g>
<g class="v2-reading-block" data-block="historical-0" transform="translate(0 732)"><text class="se-copy" x="89" y="24"><tspan x="89">Historical Indian traditions also used paired descriptions. The Ayurvedic text</tspan><tspan x="89" dy="32">Ashtanga Hridaya lists ten pairs of qualities, including heavy–light and soft–hard.</tspan></text></g>
<g class="v2-reading-block" data-block="historical-1" transform="translate(0 796)"><text class="se-copy" x="89" y="24"><tspan x="89">The table gives their everyday English senses. These are historical descriptive</tspan><tspan x="89" dy="32">categories, not a replacement for defined measurements or controlled scientific</tspan><tspan x="89" dy="32">tests.</tspan></text></g><g transform="translate(0 908)"><g data-page-illustration="figures/class-6/science/ch06/mass.png"><image class="science-illustration" href="../../figures/class-6/science/ch06/mass.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Comparing mass.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Comparing mass.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
