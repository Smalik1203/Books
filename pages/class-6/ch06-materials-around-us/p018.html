<g class="v2-reading-block" data-block="matter-head" transform="translate(0 679)"><text class="v2-title" x="89" y="38"><tspan x="89">6.9 What Is Matter?</tspan></text></g>

<g class="v2-reading-block" data-block="matter-1" transform="translate(0 801)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.19243" data-space-ratio="1.213">objects.<tspan dx="1.19243"> Air</tspan><tspan dx="1.19243"> is</tspan><tspan dx="1.19243"> matter</tspan><tspan dx="1.19243"> too,</tspan><tspan dx="1.19243"> even</tspan><tspan dx="1.19243"> though</tspan><tspan dx="1.19243"> we</tspan><tspan dx="1.19243"> usually</tspan><tspan dx="1.19243"> cannot</tspan><tspan dx="1.19243"> see</tspan><tspan dx="1.19243"> it:</tspan><tspan dx="1.19243"> it</tspan><tspan dx="1.19243"> occupies</tspan><tspan dx="1.19243"> space</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">and has mass.</tspan></text></g>
