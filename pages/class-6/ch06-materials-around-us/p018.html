<g class="v2-reading-block" data-block="game1" transform="translate(0 170)"><text class="se-heading" x="89" y="30"><tspan x="89">Find a companion</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Write these words on separate cards: iron, copper, glass, wood, plastic, bottle,</tspan><tspan x="89" dy="32">solid, transparent, opaque and lustrous. Connect pairs that can have a</tspan><tspan x="89" dy="32">meaningful relationship and explain each connection. There can be more than</tspan><tspan x="89" dy="32">one valid link; qualify claims such as “plastic is transparent” by naming a</tspan><tspan x="89" dy="32">particular sample.</tspan></text></g>
<g class="v2-reading-block" data-block="game2" transform="translate(0 406)"><text class="se-heading" x="89" y="30"><tspan x="89">Play Word-hub</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Choose nine words from lustrous, non-lustrous, soluble, insoluble, hard, soft,</tspan><tspan x="89" dy="32">matter, mass, transparent, opaque, volume and translucent. Write them in a</tspan><tspan x="89" dy="32">three-by-three notebook grid. A facilitator randomly reads a word or definition.</tspan><tspan x="89" dy="32">Mark a matching word and explain it when asked. The first player with nine</tspan><tspan x="89" dy="32">checked entries wins after the group verifies the meanings.</tspan></text></g>
<g class="v2-reading-block" data-block="assessment-heading" transform="translate(0 654)"><text class="v2-title" x="89" y="38"><tspan x="89">Let Us Enhance Our Learning</tspan></text></g>
<g class="v2-reading-block" data-block="assessment-intro-0" transform="translate(0 712)"><text class="se-copy" x="89" y="24"><tspan x="89">Use your notebook. Support each answer with evidence and explain any</tspan><tspan x="89" dy="32">uncertainty.</tspan></text></g>
<g class="v2-reading-block" data-block="q1" transform="translate(0 792)"><text class="se-copy" x="111" y="24" text-anchor="end">1.</text><text class="se-copy" x="132" y="24"><tspan x="132">Observe with an adult how edible items are organised in your kitchen.</tspan><tspan x="132" dy="32">Describe the present rule, suggest another useful sorting method and explain</tspan><tspan x="132" dy="32">why it would help. Do not rearrange stored food without permission.</tspan></text></g>

998"><tspan x="478.82">Shiny appearance</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="202" y2="202"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="230.07999999999998"><tspan x="103">E R U S T L</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="478.82" y="230.07999999999998"><tspan x="478.82">Can dissolve in water</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="242" y2="242"/><rect class="v2-table-frame" x="89" y="42" width="874" height="200"/><line class="v2-table-rule" x1="464.82" x2="464.82" y1="42" y2="242"/><text class="v2-table-note" x="89" y="274.88"><tspan x="89">Write the words and matching descriptions in your notebook.</tspan></text></g></g></g>
<g class="v2-reading-block" data-block="q3" transform="translate(0 1308)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24"><tspan x="132">Why are many storage containers transparent? Suggest one situation where</tspan><tspan x="132" dy="32">an opaque container would be a better choice, and explain why.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
