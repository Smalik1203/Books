<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="shine-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">A shiny surface is evidence about how that surface reflects light, not a complete</tspan><tspan x="89" dy="32">identification of its material. Plastic, wax and polished surfaces can shine too.</tspan></text></g>
<g class="v2-reading-block" data-block="shine-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">Compare several relevant properties before deciding what an unknown object is</tspan><tspan x="89" dy="32">made from.</tspan></text></g>
<g class="v2-reading-block" data-block="hardness-head" transform="translate(0 268)"><text class="v2-title" x="89" y="38"><tspan x="89">6.4 Hard, Soft or Easy to Bend?</tspan></text></g>
<g class="v2-reading-block" data-block="hardness-task" transform="translate(0 326)"><rect class="se-activity-panel" x="89" y="0" width="874" height="510" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Examine a brick, water bottle, pillow, tumbler, table and sweater, using</tspan><tspan x="146" dy="32">safe examples chosen by your teacher. Identify the part and material you</tspan><tspan x="146" dy="32">are comparing.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Press gently where appropriate. Record whether the part changes shape</tspan><tspan x="146" dy="32">easily. Do not press glass, crush containers, scrape furniture or break</tspan><tspan x="146" dy="32">materials.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Make a notebook table headed Object or part, Material, What I did and</tspan><tspan x="146" dy="32">Observation. Compare the same kind of test with a friend. Keep “easy to</tspan><tspan x="146" dy="32">squeeze” separate from “easy to scratch”.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">If your teacher demonstrates scratching, use small approved samples and</tspan><tspan x="146" dy="32">a blunt tool, not a sharp key. Observe without making dust. Which</tspan><tspan x="146" dy="32">surface is marked more easily?</tspan></text></g><g transform="translate(0 858)"><g data-page-illustration="figures/class-6/science/ch06/panes.png"><image class="science-illustration" href="../../figures/class-6/science/ch06/panes.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Different viewing materials.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Different viewing materials.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
