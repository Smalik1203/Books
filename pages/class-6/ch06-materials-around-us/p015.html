<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="air-evidence-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">water to enter. This shows that air occupies space; by itself, it does not measure</tspan><tspan x="89" dy="32">air’s mass. A suitable balance and controlled experiment are needed for that</tspan><tspan x="89" dy="32">separate claim.</tspan></text></g>
<g class="v2-reading-block" data-block="plastic-think" transform="translate(0 224)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="218" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Plastic can make objects light, durable and resistant to water. The same</tspan><tspan x="113" dy="32">durability can make discarded plastic persist. Choose one use and compare</tspan><tspan x="113" dy="32">benefits, waste and available alternatives. Can one label, “good” or “bad”,</tspan><tspan x="113" dy="32">answer every material-choice question?</tspan></text></g>
<g class="v2-reading-block" data-block="classification-close-0" transform="translate(0 464)"><text class="se-copy" x="89" y="24"><tspan x="89">Grouping helps us find patterns, whether we study materials, rocks or living</tspan><tspan x="89" dy="32">things. It also helps us choose objects for a purpose. Keep the rule explicit, test</tspan></text></g>
<g class="v2-reading-block" data-block="classification-close-1" transform="translate(0 528)"><text class="se-copy" x="89" y="24"><tspan x="89">more than one property and revise a grouping when new evidence gives a better</tspan><tspan x="89" dy="32">explanation.</tspan></text></g>
<g class="v2-reading-block" data-block="historical-head" transform="translate(0 620)"><text class="se-heading" x="89" y="30"><tspan x="89">Ways of Describing Properties</tspan></text></g>
<g class="v2-reading-block" data-block="historical-0" transform="translate(0 668)"><text class="se-copy" x="89" y="24"><tspan x="89">Historical Indian traditions also used paired descriptions. The Ayurvedic text</tspan><tspan x="89" dy="32">Ashtanga Hridaya lists ten pairs of qualities, including heavy–light and soft–hard.</tspan></text></g>
<g class="v2-reading-block" data-block="historical-1" transform="translate(0 732)"><text class="se-copy" x="89" y="24"><tspan x="89">The table gives their everyday English senses. These are historical descriptive</tspan><tspan x="89" dy="32">categories, not a replacement for defined measurements or controlled scientific</tspan><tspan x="89" dy="32">tests.</tspan></text></g>
<g class="v2-reading-block" data-block="historical-table" transform="translate(0 844)"><g data-comparison-table="historical-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Ten traditional pairs of descriptions</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">One description</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="540" y="70.08"><tspan x="540">Contrasting description</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Heavy</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="110.08"><tspan x="540">Light</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="122" y2="122"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="150.07999999999998"><tspan x="103">Slow</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="150.07999999999998"><tspan x="540">Quick or sharp</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="162" y2="162"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="190.07999999999998"><tspan x="103">Cold</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="190.07999999999998"><tspan x="540">Hot</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="202" y2="202"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="230.07999999999998"><tspan x="103">Oily or unctuous</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="230.07999999999998"><tspan x="540">Dry</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="242" y2="242"/><g data-comparison-row="5"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="270.08"><tspan x="103">Smooth</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="270.08"><tspan x="540">Rough</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="282" y2="282"/><g data-comparison-row="6"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="310.08"><tspan x="103">Dense or solid</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="310.08"><tspan x="540">Fluid or liquid</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="322" y2="322"/><g data-comparison-row="7"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="350.08"><tspan x="103">Soft</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="350.08"><tspan x="540">Hard</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="362" y2="362"/><g data-comparison-row="8"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="390.08"><tspan x="103">Stable</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="390.08"><tspan x="540">Moving or unstable</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="402" y2="402"/><g data-comparison-row="9"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="430.08"><tspan x="103">Subtle or small</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="430.08"><tspan x="540">Large or gross</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="442" y2="442"/><g data-comparison-row="10"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="470.08"><tspan x="103">Non-slimy</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="470.08"><tspan x="540">Slimy</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="482" y2="482"/><rect class="v2-table-frame" x="89" y="42" width="874" height="440"/><line class="v2-table-rule" x1="526" x2="526" y1="42" y2="482"/><text class="v2-table-note" x="89" y="514.88"><tspan x="89">Meanings depend on their historical context; the pairs do not establish an object’s</tspan><tspan x="89" dy="26">composition or a medical effect.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">15</text></g></svg></div></div></section>
