<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="mass-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">6.7 Comparing Mass</tspan></text></g>
<g class="v2-reading-block" data-block="mass-task" transform="translate(0 170)"><rect class="se-activity-panel" x="89" y="0" width="874" height="806" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Take three identical cups and mark each at the same halfway height.</tspan><tspan x="146" dy="32">Label them A, B and C. Fill A to the mark with water, B with sand and C</tspan><tspan x="146" dy="32">with pebbles. Predict their relative masses.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Check that the balance is level and reads zero. Measure each filled cup in</tspan><tspan x="146" dy="32">the same unit. Record Cup, Contents, Empty-cup mass, Filled-cup mass</tspan><tspan x="146" dy="32">and Difference in your notebook. Use the tare function only after your</tspan><tspan x="146" dy="32">teacher explains it.</tspan></text><text class="se-activity-step" x="132" y="340" text-anchor="end">3.</text><text class="se-copy" x="146" y="340"><tspan x="146">Compare the measured contents masses by subtracting the empty-cup</tspan><tspan x="146" dy="32">mass. Repeat a doubtful reading. Keep spills away from the balance and</tspan><tspan x="146" dy="32">do not exceed its capacity.</tspan></text><text class="se-activity-step" x="132" y="448" text-anchor="end">4.</text><text class="se-copy" x="146" y="448"><tspan x="146">Explain which prediction the readings support. Notice the gaps between</tspan><tspan x="146" dy="32">pebbles and sand grains. Does filling to the same height guarantee that</tspan><tspan x="146" dy="32">the solid material alone occupies equal volumes?</tspan></text><image class="science-illustration" data-photo="mass" href="../../figures/class-6/science/ch06/mass.png" x="364.75" y="532" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="777.88"><tspan x="113">Read your own balance; the illustration deliberately supplies no measurement.</tspan></text></g>
<g class="v2-reading-block" data-block="mass-evidence-0" transform="translate(0 998)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Mass</tspan> is a measurable property of an object, reported in units such as grams and</tspan><tspan x="89" dy="32">kilograms. Under the same local conditions, an object that is heavier has more</tspan></text></g>
<g class="v2-reading-block" data-block="mass-evidence-1" transform="translate(0 1062)"><text class="se-copy" x="89" y="24"><tspan x="89">mass. A balance makes the comparison more reliable than judging by hand.</tspan><tspan x="89" dy="32">Larger-looking objects do not always have more mass.</tspan></text></g>
<g class="v2-reading-block" data-block="mass-weight-0" transform="translate(0 1142)"><text class="se-copy" x="89" y="24"><tspan x="89">People often use “weight” for a reading in kilograms. In science, mass and weight</tspan><tspan x="89" dy="32">are different quantities: weight is the gravitational force on an object. Here, use</tspan></text></g>
<g class="v2-reading-block" data-block="mass-weight-1" transform="translate(0 1206)"><text class="se-copy" x="89" y="24"><tspan x="89">the balance’s mass reading and state the unit. Equal-size cups and subtraction of</tspan><tspan x="89" dy="32">their masses make the comparison clearer.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">15</text></g></svg></div></div></section>
