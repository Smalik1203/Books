<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="appearance-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">6.3 Appearance and Surface</tspan></text></g>
<g class="v2-reading-block" data-block="appearance-task-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Try a sorting challenge with paper, cardboard, wood, chalk, copper wire and</tspan><tspan x="89" dy="32">aluminium foil. Include brass, bronze or steel only if a teacher has a safe sample.</tspan></text></g>
<g class="v2-reading-block" data-block="appearance-task-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">Observe under the same light. Record colour, texture and whether a surface</tspan><tspan x="89" dy="32">shines. Do not cut metal or use sharp wire ends to expose a fresh surface.</tspan></text></g>
<g class="v2-reading-block" data-block="samples-picture" transform="translate(0 314)"><image class="science-illustration" data-photo="hardness" href="../../figures/class-6/science/ch06/hardness.png" x="173.5" y="1.4210854715202004e-14" width="705" height="234.99999999999997" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="278" y="269" text-anchor="middle">Sponge</text><text class="se-caption" x="450" y="269" text-anchor="middle">Eraser</text><text class="se-caption" x="622" y="269" text-anchor="middle">Wood</text><text class="se-caption" x="805" y="269" text-anchor="middle">Steel spoon</text><text class="se-caption" x="89" y="307.88"><tspan x="89">Material samples can be compared in several ways. Describe the particular surface you</tspan><tspan x="89" dy="27">inspect, rather than judging by colour alone.</tspan></text></g>
<g class="v2-reading-block" data-block="lustre-0" transform="translate(0 683)"><text class="se-copy" x="89" y="24"><tspan x="89">A shiny appearance is called <tspan class="se-bold">lustre</tspan>. Many clean metal surfaces are lustrous,</tspan><tspan x="89" dy="32">including copper, aluminium, iron and zinc. A surface may become dull after</tspan></text></g>
<g class="v2-reading-block" data-block="lustre-1" transform="translate(0 747)"><text class="se-copy" x="89" y="24"><tspan x="89">reacting with air or moisture. Paper, untreated wood and jute usually look</tspan><tspan x="89" dy="32">non-lustrous, but coatings can change their appearance.</tspan></text></g>
<g class="v2-reading-block" data-block="shine-think" transform="translate(0 827)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="186" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A polished wooden table and a piece of aluminium foil both shine. Is shine</tspan><tspan x="113" dy="32">enough to identify a metal? Suggest another observation and explain why a</tspan><tspan x="113" dy="32">coating could make appearance misleading.</tspan></text></g>
<g class="v2-reading-block" data-block="shine-evidence-0" transform="translate(0 1035)"><text class="se-copy" x="89" y="24"><tspan x="89">A shiny surface is evidence about how that surface reflects light, not a complete</tspan><tspan x="89" dy="32">identification of its material. Plastic, wax and polished surfaces can shine too.</tspan></text></g>
<g class="v2-reading-block" data-block="shine-evidence-1" transform="translate(0 1099)"><text class="se-copy" x="89" y="24"><tspan x="89">Compare several relevant properties before deciding what an unknown object is</tspan><tspan x="89" dy="32">made from.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
