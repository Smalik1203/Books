<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="26" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 26"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project3" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Sort a larger collection</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Choose 20–30 safe household objects with permission. Classify them by one</tspan><tspan x="89" dy="32">property, then by another. Make a table linking Object, Material or parts,</tspan><tspan x="89" dy="32">Observed properties and Use. Show where groups overlap and where more</tspan><tspan x="89" dy="32">information is needed. Explain one choice of material using at least two</tspan><tspan x="89" dy="32">properties.</tspan></text><image class="science-illustration" data-photo="opener" href="../../figures/class-6/science/ch06/opener.png" x="316" y="224" width="420" height="280" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="534.88"><tspan x="89">An object with several parts can belong to several material groups.</tspan></text></g>
<g class="v2-reading-block" data-block="project4" transform="translate(0 677)"><text class="se-heading" x="89" y="30"><tspan x="89">Make, test and improve</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Use clean discarded materials to make a useful object, such as a cardboard</tspan><tspan x="89" dy="32">organiser. Ask an adult to do any cutting; avoid broken glass, sharp cans and</tspan><tspan x="89" dy="32">containers that held chemicals. Test whether the object performs its intended</tspan><tspan x="89" dy="32">task. Ask a partner for specific feedback on stability, durability and usefulness,</tspan><tspan x="89" dy="32">then revise one feature and explain the improvement.</tspan></text><image class="science-illustration" data-photo="reuse" href="../../figures/class-6/science/ch06/reuse.png" x="316" y="224" width="420" height="280" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="534.88"><tspan x="89">Choose materials for the task, then use a test to decide what to improve.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">26</text></g></svg></div></div></section>
