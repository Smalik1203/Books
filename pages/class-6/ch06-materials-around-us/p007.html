<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="hardness-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">6.4 Hard, Soft or Easy to Bend?</tspan></text></g>
<g class="v2-reading-block" data-block="hardness-task" transform="translate(0 170)"><rect class="se-activity-panel" x="89" y="0" width="874" height="510" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Examine a brick, water bottle, pillow, tumbler, table and sweater, using</tspan><tspan x="146" dy="32">safe examples chosen by your teacher. Identify the part and material you</tspan><tspan x="146" dy="32">are comparing.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Press gently where appropriate. Record whether the part changes shape</tspan><tspan x="146" dy="32">easily. Do not press glass, crush containers, scrape furniture or break</tspan><tspan x="146" dy="32">materials.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Make a notebook table headed Object or part, Material, What I did and</tspan><tspan x="146" dy="32">Observation. Compare the same kind of test with a friend. Keep “easy to</tspan><tspan x="146" dy="32">squeeze” separate from “easy to scratch”.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">If your teacher demonstrates scratching, use small approved samples and</tspan><tspan x="146" dy="32">a blunt tool, not a sharp key. Observe without making dust. Which</tspan><tspan x="146" dy="32">surface is marked more easily?</tspan></text></g>
<g class="v2-reading-block" data-block="hardness-evidence-0" transform="translate(0 702)"><text class="se-copy" x="89" y="24"><tspan x="89">In everyday speech, hard and soft describe several feelings. In a scratch</tspan><tspan x="89" dy="32">comparison, <tspan class="se-bold">hardness</tspan> means resistance to scratching or indentation. A sponge</tspan></text></g>
<g class="v2-reading-block" data-block="hardness-evidence-1" transform="translate(0 766)"><text class="se-copy" x="89" y="24"><tspan x="89">is easy to compress; a rubber eraser may be less easy; a metal block hardly</tspan><tspan x="89" dy="32">compresses under a hand. Always say which comparison you made.</tspan></text></g>
<g class="v2-reading-block" data-block="mechanical-table" transform="translate(0 846)"><g data-comparison-table="mechanical-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Different tests answer different questions</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="68"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Observation</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="382.68" y="70.08"><tspan x="382.68">Property being</tspan><tspan x="382.68" dy="28">compared</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="644.88" y="70.08"><tspan x="644.88">Why the distinction matters</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="110" y2="110"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="138.07999999999998"><tspan x="103">A surface is difficult to</tspan><tspan x="103" dy="28">scratch</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="382.68" y="138.07999999999998"><tspan x="382.68">Hardness</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="138.07999999999998"><tspan x="644.88">A surface can resist</tspan><tspan x="644.88" dy="28">scratching yet the object may</tspan><tspan x="644.88" dy="28">still break</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="206" y2="206"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="234.07999999999998"><tspan x="103">An object changes shape</tspan><tspan x="103" dy="28">little when pressed</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="382.68" y="234.07999999999998"><tspan x="382.68">Stiffness or resistance</tspan><tspan x="382.68" dy="28">to deformation</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="234.07999999999998"><tspan x="644.88">Shape and thickness, as well</tspan><tspan x="644.88" dy="28">as material, affect the result</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="274" y2="274"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="302.08"><tspan x="103">A sponge squeezes easily</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="382.68" y="302.08"><tspan x="382.68">Compressibility</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="302.08"><tspan x="644.88">Air spaces help the whole</tspan><tspan x="644.88" dy="28">sponge change volume</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="342" y2="342"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="370.08"><tspan x="103">Thin metal foil bends</tspan><tspan x="103" dy="28">easily</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="382.68" y="370.08"><tspan x="382.68">Flexibility of this thin</tspan><tspan x="382.68" dy="28">sheet</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="370.08"><tspan x="644.88">Easy bending does not mean</tspan><tspan x="644.88" dy="28">that metal is a soft sponge</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="410" y2="410"/><rect class="v2-table-frame" x="89" y="42" width="874" height="368"/><line class="v2-table-rule" x1="368.68" x2="368.68" y1="42" y2="410"/><line class="v2-table-rule" x1="630.88" x2="630.88" y1="42" y2="410"/></g></g>
<g class="v2-reading-block" data-block="relative-0" transform="translate(0 1272)"><text class="se-copy" x="89" y="24"><tspan x="89">Comparisons need a reference: “softer than a metal block” is more informative</tspan><tspan x="89" dy="32">than “soft” alone. Hardness does not by itself tell you whether a chair is strong</tspan><tspan x="89" dy="32">enough to support a person. Its design, joints and thickness matter too.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
