<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="clay-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Shape is only one part of the choice. A storage jar must hold its contents; a vessel</tspan><tspan x="89" dy="32">used for heating must tolerate the conditions. The historical text</tspan></text></g>
<g class="v2-reading-block" data-block="clay-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">Rasaratnasamuchchaya mentions clay and iron as materials for crucibles, vessels</tspan><tspan x="89" dy="32">used to heat substances strongly. Historical examples raise questions about</tspan><tspan x="89" dy="32">materials; heating tests belong with trained adults.</tspan></text></g>
<g class="v2-reading-block" data-block="group-head" transform="translate(0 300)"><text class="v2-title" x="89" y="38"><tspan x="89">6.2 Grouping for a Purpose</tspan></text></g>
<g class="v2-reading-block" data-block="group-task" transform="translate(0 358)"><rect class="se-activity-panel" x="89" y="0" width="874" height="338" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Collect safe objects such as a notebook, spoon, eraser, wooden block,</tspan><tspan x="146" dy="32">plastic lid and piece of cloth. Choose one property for grouping: shape,</tspan><tspan x="146" dy="32">colour, surface texture or material.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">State your rule before you sort. Make groups and explain where each</tspan><tspan x="146" dy="32">object belongs. Mark uncertain examples instead of guessing.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Ask a partner to choose a different rule for the same collection. Record</tspan><tspan x="146" dy="32">both groupings in your notebook. Which objects move into new groups?</tspan></text></g>
<g class="v2-reading-block" data-block="group-evidence-0" transform="translate(0 718)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Classification</tspan> means arranging things into groups using a stated basis. The same</tspan><tspan x="89" dy="32">collection can be classified in more than one useful way. A grocer groups grains</tspan></text></g>
<g class="v2-reading-block" data-block="group-evidence-1" transform="translate(0 782)"><text class="se-copy" x="89" y="24"><tspan x="89">and spices to help customers find them. A kitchen may group utensils by use or</tspan><tspan x="89" dy="32">size. A good rule tells another person how to repeat the grouping.</tspan></text></g><g transform="translate(0 862)"><g data-page-illustration="figures/class-6/science/ch06/balls.png"><image class="science-illustration" href="../../figures/class-6/science/ch06/balls.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Balls made from different materials.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Balls made from different materials.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
