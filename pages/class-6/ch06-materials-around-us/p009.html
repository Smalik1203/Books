<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="hardness-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">In everyday speech, hard and soft describe several feelings. In a scratch</tspan><tspan x="89" dy="32">comparison, <tspan class="se-bold">hardness</tspan> means resistance to scratching or indentation. A sponge</tspan></text></g>
<g class="v2-reading-block" data-block="hardness-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">is easy to compress; a rubber eraser may be less easy; a metal block hardly</tspan><tspan x="89" dy="32">compresses under a hand. Always say which comparison you made.</tspan></text></g>
<g class="v2-reading-block" data-block="mechanical-table" transform="translate(0 256)"><g data-comparison-table="mechanical-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Different tests answer different questions</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="68"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Observation</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="382.68" y="70.08"><tspan x="382.68">Property being</tspan><tspan x="382.68" dy="28">compared</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="644.88" y="70.08"><tspan x="644.88">Why the distinction matters</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="110" y2="110"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="138.07999999999998"><tspan x="103">A surface is difficult to</tspan><tspan x="103" dy="28">scratch</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="382.68" y="138.07999999999998"><tspan x="382.68">Hardness</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="138.07999999999998"><tspan x="644.88">A surface can resist</tspan><tspan x="644.88" dy="28">scratching yet the object may</tspan><tspan x="644.88" dy="28">still break</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="206" y2="206"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="234.07999999999998"><tspan x="103">An object changes shape</tspan><tspan x="103" dy="28">little when pressed</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="382.68" y="234.07999999999998"><tspan x="382.68">Stiffness or resistance</tspan><tspan x="382.68" dy="28">to deformation</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="234.07999999999998"><tspan x="644.88">Shape and thickness, as well</tspan><tspan x="644.88" dy="28">as material, affect the result</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="274" y2="274"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="302.08"><tspan x="103">A sponge squeezes easily</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="382.68" y="302.08"><tspan x="382.68">Compressibility</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="302.08"><tspan x="644.88">Air spaces help the whole</tspan><tspan x="644.88" dy="28">sponge change volume</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="342" y2="342"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="370.08"><tspan x="103">Thin metal foil bends</tspan><tspan x="103" dy="28">easily</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="382.68" y="370.08"><tspan x="382.68">Flexibility of this thin</tspan><tspan x="382.68" dy="28">sheet</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="370.08"><tspan x="644.88">Easy bending does not mean</tspan><tspan x="644.88" dy="28">that metal is a soft sponge</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="410" y2="410"/><rect class="v2-table-frame" x="89" y="42" width="874" height="368"/><line class="v2-table-rule" x1="368.68" x2="368.68" y1="42" y2="410"/><line class="v2-table-rule" x1="630.88" x2="630.88" y1="42" y2="410"/></g></g>
<g class="v2-reading-block" data-block="relative-0" transform="translate(0 682)"><text class="se-copy" x="89" y="24"><tspan x="89">Comparisons need a reference: “softer than a metal block” is more informative</tspan><tspan x="89" dy="32">than “soft” alone. Hardness does not by itself tell you whether a chair is strong</tspan><tspan x="89" dy="32">enough to support a person. Its design, joints and thickness matter too.</tspan></text></g><g transform="translate(0 794)"><g data-page-illustration="figures/class-6/science/ch06/mass.png"><image class="science-illustration" href="../../figures/class-6/science/ch06/mass.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Comparing mass.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Comparing mass.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
