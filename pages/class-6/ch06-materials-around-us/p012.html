<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="dissolve-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">6.6 Mixing Materials with Water</tspan></text></g>
<g class="v2-reading-block" data-block="lemonade-story-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">After playing, Ghulan watches his mother stir salt and sugar into water for</tspan><tspan x="89" dy="32">shikanji. The crystals become difficult to see. Have they stopped existing, or has</tspan></text></g>
<g class="v2-reading-block" data-block="lemonade-story-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">something else happened? Keep food preparation separate from classroom</tspan><tspan x="89" dy="32">experiments: never taste an experimental mixture.</tspan></text></g>
<g class="v2-reading-block" data-block="mixing-picture" transform="translate(0 314)"><image class="science-illustration" data-photo="mixing" href="../../figures/class-6/science/ch06/mixing.png" x="98.5" y="0" width="855" height="285" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="190" y="319" text-anchor="middle">Sugar</text><text class="se-caption" x="344" y="319" text-anchor="middle">Salt</text><text class="se-caption" x="499" y="319" text-anchor="middle">Chalk powder</text><text class="se-caption" x="653" y="319" text-anchor="middle">Sand</text><text class="se-caption" x="806" y="319" text-anchor="middle">Sawdust</text><text class="se-caption" x="89" y="357.88"><tspan x="89">Prepare separate samples and equal amounts of water before mixing. The tumblers shown</tspan><tspan x="89" dy="27">here contain only water.</tspan></text></g>
<g class="v2-reading-block" data-block="dissolve-task" transform="translate(0 733)"><rect class="se-activity-panel" x="89" y="0" width="874" height="510" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Label five identical clear containers Sugar, Salt, Chalk, Sand and Sawdust.</tspan><tspan x="146" dy="32">Add the same amount of water at the same temperature to each. A</tspan><tspan x="146" dy="32">teacher supplies small samples and handles any dusty powder.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Predict what will happen before adding anything. Add the same small</tspan><tspan x="146" dy="32">level spoonful of the named material to each container. Use a clean spoon</tspan><tspan x="146" dy="32">for each sample to avoid mixing them together.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Stir for the same length of time, then let the containers stand for several</tspan><tspan x="146" dy="32">minutes. Record visible grains, cloudiness, floating material or sediment.</tspan><tspan x="146" dy="32">Do not taste any sample.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Make a notebook table headed Material, Prediction, Observation after</tspan><tspan x="146" dy="32">stirring, Observation after standing and Interpretation. If a sample is</tspan><tspan x="146" dy="32">uncertain, repeat with less material and explain why.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
