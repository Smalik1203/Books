<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="tumbler-think" transform="translate(0 112)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="326" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Suggest materials for a drinking tumbler. For each suggestion, explain how it</tspan><tspan x="113" dy="32">could hold water, keep its shape and be cleaned. Would a bag sewn from</tspan><tspan x="113" dy="32">ordinary uncoated cloth do the same job? What extra layer might change</tspan><tspan x="113" dy="32">your answer?</tspan></text><text class="se-copy" x="113" y="232"><tspan x="113">Now consider a cooking vessel. Why is holding water alone not enough?</tspan><tspan x="113" dy="32">Explain why ordinary paper or cloth should not be used as a cooking vessel</tspan><tspan x="113" dy="32">over a flame.</tspan></text></g>
<g class="v2-reading-block" data-block="purpose-evidence-0" transform="translate(0 460)"><text class="se-copy" x="89" y="24"><tspan x="89">Choose materials by the conditions of use, not one attractive property. Ordinary</tspan><tspan x="89" dy="32">woven cloth has spaces through which water can pass. A waterproof lining</tspan></text></g>
<g class="v2-reading-block" data-block="purpose-evidence-1" transform="translate(0 524)"><text class="se-copy" x="89" y="24"><tspan x="89">changes the construction. Glass and steel can both form tumblers, but differ in</tspan><tspan x="89" dy="32">how they break, conduct heat and allow a view of the contents.</tspan></text></g>
<g class="v2-reading-block" data-block="tumbler-table" transform="translate(0 604)"><g data-comparison-table="tumbler-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">One purpose, different material choices</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="68"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Material or</tspan><tspan x="103" dy="28">construction</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="347.72" y="70.08"><tspan x="347.72">Useful feature</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="644.8800000000001" y="70.08"><tspan x="644.8800000000001">A limitation to consider</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="110" y2="110"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="138.07999999999998"><tspan x="103">Clear glass</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="138.07999999999998"><tspan x="347.72">Contents can be seen;</tspan><tspan x="347.72" dy="28">rigid walls hold the shape</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.8800000000001" y="138.07999999999998"><tspan x="644.8800000000001">Can break into sharp pieces</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="206.07999999999998"><tspan x="103">Stainless steel</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="206.07999999999998"><tspan x="347.72">Durable and holds liquids</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.8800000000001" y="206.07999999999998"><tspan x="644.8800000000001">Opaque; can become hot with</tspan><tspan x="644.8800000000001" dy="28">a hot drink</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="246" y2="246"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="274.08"><tspan x="103">Suitable reusable</tspan><tspan x="103" dy="28">plastic</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="274.08"><tspan x="347.72">Often light and resistant to</tspan><tspan x="347.72" dy="28">breaking</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.8800000000001" y="274.08"><tspan x="644.8800000000001">Suitability for hot food varies;</tspan><tspan x="644.8800000000001" dy="28">follow its label</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="314" y2="314"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="342.08"><tspan x="103">Ordinary uncoated</tspan><tspan x="103" dy="28">cloth</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="342.08"><tspan x="347.72">Flexible and easy to fold</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.8800000000001" y="342.08"><tspan x="644.8800000000001">Usually lets water pass</tspan><tspan x="644.8800000000001" dy="28">through or soak in</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="382" y2="382"/><rect class="v2-table-frame" x="89" y="42" width="874" height="340"/><line class="v2-table-rule" x1="333.72" x2="333.72" y1="42" y2="382"/><line class="v2-table-rule" x1="630.8800000000001" x2="630.8800000000001" y1="42" y2="382"/></g></g><g transform="translate(0 1002)"><g data-page-illustration="figures/class-6/science/ch06/mixing.png"><image class="science-illustration" href="../../figures/class-6/science/ch06/mixing.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Materials f
