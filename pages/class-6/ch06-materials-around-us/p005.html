<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="balls-picture" transform="translate(0 112)"><image class="science-illustration" data-photo="balls" href="../../figures/class-6/science/ch06/balls.png" x="143.5" y="0" width="765" height="255" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="284" y="289" text-anchor="middle">Tennis ball</text><text class="se-caption" x="525" y="289" text-anchor="middle">Cricket ball</text><text class="se-caption" x="768" y="289" text-anchor="middle">Hand-exercise ball</text><text class="se-caption" x="89" y="327.88"><tspan x="89">A tennis ball, a cricket ball and a hand-exercise ball have different constructions. Compare</tspan><tspan x="89" dy="27">the actual sizes of the balls you use.</tspan></text></g>
<g class="v2-reading-block" data-block="bounce-task" transform="translate(0 501)"><rect class="se-activity-panel" x="89" y="0" width="874" height="542" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">With a teacher, select a tennis ball, a cricket ball and a hand-exercise ball,</tspan><tspan x="146" dy="32">or safe available alternatives. Note their sizes and surfaces. Keep feet and</tspan><tspan x="146" dy="32">other people away from the landing area.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Release each ball without pushing from the same marked height above</tspan><tspan x="146" dy="32">the same firm floor. Measure the starting height from the bottom of the</tspan><tspan x="146" dy="32">ball. A partner observes the highest point of the first rebound.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Repeat each drop three times. Record Ball, Release height, Rebound</tspan><tspan x="146" dy="32">observations and Repeat in a notebook table. Compare actual heights if</tspan><tspan x="146" dy="32">you can measure them; otherwise use clearly defined high, medium and</tspan><tspan x="146" dy="32">low categories.</tspan></text><text class="se-activity-step" x="132" y="448" text-anchor="end">4.</text><text class="se-copy" x="146" y="448"><tspan x="146">Compare the results. Which conditions did you keep the same? What</tspan><tspan x="146" dy="32">could make two trials differ? Do not assume in advance which ball will</tspan><tspan x="146" dy="32">bounce highest.</tspan></text></g>
<g class="v2-reading-block" data-block="bounce-evidence-0" transform="translate(0 1065)"><text class="se-copy" x="89" y="24"><tspan x="89">A bounce depends on the material and the ball’s construction, as well as the</tspan><tspan x="89" dy="32">surface and release conditions. Real sports balls may differ in size, mass, seams</tspan></text></g>
<g class="v2-reading-block" data-block="bounce-evidence-1" transform="translate(0 1129)"><text class="se-copy" x="89" y="24"><tspan x="89">and internal pressure. This comparison investigates the balls you used; it does</tspan><tspan x="89" dy="32">not isolate the effect of material alone.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">5</text></g></svg></div></div></section>
