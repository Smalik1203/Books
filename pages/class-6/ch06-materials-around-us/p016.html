<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="mass-weight-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">People often use “weight” for a reading in kilograms. In science, mass and weight</tspan><tspan x="89" dy="32">are different quantities: weight is the gravitational force on an object. Here, use</tspan></text></g>
<g class="v2-reading-block" data-block="mass-weight-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">the balance’s mass reading and state the unit. Equal-size cups and subtraction of</tspan><tspan x="89" dy="32">their masses make the comparison clearer.</tspan></text></g>
<g class="v2-reading-block" data-block="volume-head" transform="translate(0 268)"><text class="v2-title" x="89" y="38"><tspan x="89">6.8 Space, Volume and Capacity</tspan></text></g>
<g class="v2-reading-block" data-block="bags-story-0" transform="translate(0 326)"><text class="se-copy" x="89" y="24"><tspan x="89">Madam Vidya asks the class to put school bags on their seats. There is no longer</tspan><tspan x="89" dy="32">room to sit: the bags occupy space. Water occupies space too. Two identical</tspan></text></g>
<g class="v2-reading-block" data-block="bags-story-1" transform="translate(0 390)"><text class="se-copy" x="89" y="24"><tspan x="89">tumblers may hold different amounts of water even though the containers are the</tspan><tspan x="89" dy="32">same size.</tspan></text></g>
<g class="v2-reading-block" data-block="volume-picture" transform="translate(0 470)"><g class="v2-material-diagram" data-diagram="volume"><path class="v2-material-glass" d="M244 30V240Q322 264 400 240V30"/><path class="v2-material-water" d="M247 145.5H397V237Q322 259 247 237Z"/><ellipse class="v2-material-water" cx="322" cy="145.5" rx="75" ry="11"/><ellipse class="v2-material-rim" cx="322" cy="30" rx="78" ry="12"/><path class="v2-material-glass" d="M652 30V240Q730 264 808 240V30"/><path class="v2-material-water" d="M655 61.5H805V237Q730 259 655 237Z"/><ellipse class="v2-material-water" cx="730" cy="61.5" rx="75" ry="11"/><ellipse class="v2-material-rim" cx="730" cy="30" rx="78" ry="12"/><text class="v2-material-label" x="322" y="289" text-anchor="middle">Smaller water volume</text><text class="v2-material-label" x="730" y="289" text-anchor="middle">Larger water volume</text></g><text class="se-caption" x="89" y="335.88"><tspan x="89">The containers have the same capacity, but the water occupies different volumes.</tspan></text></g>
<g class="v2-reading-block" data-block="volume-evidence-0" transform="translate(0 834)"><text class="se-copy" x="89" y="24"><tspan x="89">The space occupied by something is its <tspan class="se-bold">volume</tspan>. A container’s <tspan class="se-bold">capacity</tspan> is the</tspan><tspan x="89" dy="32">volume it can hold up to a specified limit. A half-filled tumbler has the same</tspan></text></g>
<g class="v2-reading-block" data-block="volume-evidence-1" transform="translate(0 898)"><text class="se-copy" x="89" y="24"><tspan x="89">capacity as when it is full, but contains a smaller volume of water. A jug’s</tspan><tspan x="89" dy="32">contents cannot all fit in a bottle if they exceed its available capacity.</tspan></text></g><g transform="translate(0 978)"><g data-page-illustration="figures/class-6/science/ch06/mass.png"><image class="science-illustration" href="../../figures/class-6/science/ch06/mass.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Comparing mass.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Comparing mass.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
