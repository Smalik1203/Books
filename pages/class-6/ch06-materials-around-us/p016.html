<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="770" rx="18"/><text class="se-copy" x="113" y="222"><tspan x="113"><tspan class="se-bold">Material</tspan> — A substance or mixture</tspan><tspan x="113" dy="32">used to make an object.</tspan></text><text class="se-copy" x="113" y="306"><tspan x="113"><tspan class="se-bold">Classification</tspan> — Grouping using a</tspan><tspan x="113" dy="32">stated basis or property.</tspan></text><text class="se-copy" x="113" y="390"><tspan x="113"><tspan class="se-bold">Lustre</tspan> — A shiny surface</tspan><tspan x="113" dy="32">appearance.</tspan></text><text class="se-copy" x="113" y="474"><tspan x="113"><tspan class="se-bold">Non-lustrous</tspan> — Without a shiny</tspan><tspan x="113" dy="32">appearance in the conditions</tspan><tspan x="113" dy="32">observed.</tspan></text><text class="se-copy" x="113" y="590"><tspan x="113"><tspan class="se-bold">Hardness</tspan> — Resistance to</tspan><tspan x="113" dy="32">scratching or indentation.</tspan></text><text class="se-copy" x="113" y="674"><tspan x="113"><tspan class="se-bold">Transparent</tspan> — Transmits light and</tspan><tspan x="113" dy="32">permits a clear view through it.</tspan></text><text class="se-copy" x="113" y="758"><tspan x="113"><tspan class="se-bold">Translucent</tspan> — Transmits light but</tspan><tspan x="113" dy="32">prevents a clear view through it.</tspan></text><text class="se-copy" x="113" y="842"><tspan x="113"><tspan class="se-bold">Opaque</tspan> — Does not transmit</tspan><tspan x="113" dy="32">appreciable light through the</tspan><tspan x="113" dy="32">sample.</tspan></text><text class="se-copy" x="541" y="222"><tspan x="541"><tspan class="se-bold">Soluble</tspan> — Able to dissolve in a</tspan><tspan x="541" dy="32">specified liquid.</tspan></text><text class="se-copy" x="541" y="306"><tspan x="541"><tspan class="se-bold">Insoluble</tspan> — Dissolves only</tspan><tspan x="541" dy="32">negligibly in the stated conditions.</tspan></text><text class="se-copy" x="541" y="390"><tspan x="541"><tspan class="se-bold">Mass</tspan> — A physical quantity</tspan><tspan x="541" dy="32">measured in grams or kilograms</tspan><tspan x="541" dy="32">using a balance.</tspan></text><text class="se-copy" x="541" y="506"><tspan x="541"><tspan class="se-bold">Volume</tspan> — The space occupied by</tspan><tspan x="541" dy="32">something.</tspan></text><text class="se-copy" x="541" y="590"><tspan x="541"><tspan class="se-bold">Capacity</tspan> — The volume a container</tspan><tspan x="541" dy="32">can hold to a stated limit.</tspan></text><text class="se-copy" x="541" y="674"><tspan x="541"><tspan class="se-bold">Matter</tspan> — Anything that has mass</tspan><tspan x="541" dy="32">and occupies space.</tspan></text><text class="se-copy" x="541" y="758"><tspan x="541"><tspan class="se-bold">Soft</tspan> — Easily scratched or indented</tspan><tspan x="541" dy="32">compared with another material;</tspan><tspan x="541" dy="32">state the test.</tspan></text><text class="se-copy" x="541" y="874"><tspan x="541"><tspan class="se-bold">Solution</tspan> — A uniform mixture</tspan><tspan x="541" dy="32">containing a dissolved substance.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
