<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="21"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 21"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204"><tspan x="112">Objects can be made from one material or several. The same material can be</tspan><tspan x="112" dy="32">used for many objects, and different materials can serve a similar purpose.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278"><tspan x="112">Classification groups things using a stated rule. Colour, texture, lustre and</tspan><tspan x="112" dy="32">other properties provide different possible groupings.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352"><tspan x="112">Select a material by its purpose and conditions of use. A single property is</tspan><tspan x="112" dy="32">seldom enough.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426"><tspan x="112">Shiny does not always mean metallic. Hardness, stiffness and compressibility</tspan><tspan x="112" dy="32">describe different comparisons.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500"><tspan x="112">Transparent samples allow a clear view, translucent samples scatter light and</tspan><tspan x="112" dy="32">give a hazy view, and opaque samples block a view through them.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574"><tspan x="112">Dissolving does not destroy a substance. Solubility depends on the substance,</tspan><tspan x="112" dy="32">liquid and conditions; floating or settling is not dissolving.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648"><tspan x="112">Mass is compared using a balance. Volume is occupied space; capacity is how</tspan><tspan x="112" dy="32">much a container can hold.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722"><tspan x="112">Matter has mass and occupies space. Solids, liquids and gases, including air,</tspan><tspan x="112" dy="32">are matter.</tspan></text><image class="science-illustration" data-photo="hardness" href="../../figures/class-6/science/ch06/hardness.png" x="196" y="807" width="660" height="220" preserveAspectRatio="xMidYMid meet"/><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">21</text></g></svg></div></div></section>
