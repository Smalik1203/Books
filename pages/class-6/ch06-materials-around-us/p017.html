class="se-copy se-table-copy" x="706.0600000000001" y="110.08"><tspan x="706.0600000000001">gram (g), kilogram (kg)</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="122" y2="122"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="150.07999999999998"><tspan x="103">Volume</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="304.02" y="150.07999999999998"><tspan x="304.02">Space occupied by a substance or</tspan><tspan x="304.02" dy="28">object</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="706.0600000000001" y="150.07999999999998"><tspan x="706.0600000000001">millilitre (mL), litre (L),</tspan><tspan x="706.0600000000001" dy="28">cubic metre (m³)</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="190" y2="190"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="218.07999999999998"><tspan x="103">Capacity</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="304.02" y="218.07999999999998"><tspan x="304.02">How much a container can hold</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="706.0600000000001" y="218.07999999999998"><tspan x="706.0600000000001">mL or L, for many</tspan><tspan x="706.0600000000001" dy="28">everyday containers</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="258" y2="258"/><rect class="v2-table-frame" x="89" y="42" width="874" height="216"/><line class="v2-table-rule" x1="290.02" x2="290.02" y1="42" y2="258"/><line class="v2-table-rule" x1="692.0600000000001" x2="692.0600000000001" y1="42" y2="258"/></g></g>
<g class="v2-reading-block" data-block="labels-0" transform="translate(0 386)"><text class="se-copy" x="89" y="24"><tspan x="89">A milk carton and a water bottle may each say 500 mL. That states equal volumes</tspan><tspan x="89" dy="32">of contents, not equal masses or necessarily equal container capacities. To</tspan></text></g>
<g class="v2-reading-block" data-block="labels-1" transform="translate(0 450)"><text class="se-copy" x="89" y="24"><tspan x="89">compare masses, use a balance. To compare volumes, use a suitable graduated</tspan><tspan x="89" dy="32">container.</tspan></text></g>
<g class="v2-reading-block" data-block="labels-picture" transform="translate(0 530)"><g class="v2-material-diagram" data-diagram="bottles"><path class="v2-material-glass" d="M295 21H371V58L410 98V255Q333 275 256 255V98L295 58Z"/><path class="v2-material-water" d="M259 126H407V252Q333 268 259 252Z"/><path class="v2-material-cap" d="M294 11H372V29H294Z"/><text class="v2-material-label" x="333" y="187" text-anchor="middle">Water</text><text class="v2-material-label" x="333" y="222" text-anchor="middle">500 mL</text><path class="v2-material-glass" d="M681 21H757V58L796 98V255Q719 275 642 255V98L681 58Z"/><path class="v2-material-milk" d="M645 126H793V252Q719 268 645 252Z"/><path class="v2-material-cap" d="M680 11H758V29H680Z"/><text class="v2-material-label" x="719" y="187" text-anchor="middle">Milk</text><text class="v2-material-label" x="719" y="222" text-anchor="middle">500 mL</text><text class="v2-material-label" x="526" y="310" text-anchor="middle">Volume of contents</text></g><text class="se-caption" x="89" y="350.88"><tspan x="89">Both labels state 500 mL of contents. Equal volume does not by itself establish equal mass.</tspan></text></g>
<g class="v2-reading-block" data-block="units-0" transform="translate(0 909)"><text class="se-copy" x="89" y="24"><tspan x="89">The SI base unit of mass is the kilogram (kg); 1 kg = 1000 g. The SI unit of volume</tspan><tspan x="89" dy="32">is the cubic metre (m³). For everyday liquids, litres and millilitres are convenient:</tspan></text></g>
<g class="v2-reading-block" data-block="units-1" transform="translate(0 973)"><text class="se-copy" x="89" y="24"><tspan x="89">1 L = 1000 mL and 1 m³ = 1000 L. Write a space between number and symbol, as</tspan><tspan x="89" dy="32">in 7 kg and 500 mL. Do not add a plural s or a full stop unless it ends the</tspan><tspan x="89" dy="32">sentence.</tspan></text></g><g transform="translate(0 1085)"><g data-page-illustration="figures/class-6/science/ch06/mass.png"><image class="science-illustration" href="../../figures/class-6/science/ch06/mass.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Comparing mass.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Comparing mass.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">17</text></g></svg></div></div></section>
