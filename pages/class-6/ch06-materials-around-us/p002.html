<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="objects-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">6.1 Objects and Their Materials</tspan></text></g>
<g class="v2-reading-block" data-block="objects-story-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Look around your classroom. A table, a pen and a notebook are objects with</tspan><tspan x="89" dy="32">different uses. Wood, metal, plastic, paper, glass, cloth and clay are examples of</tspan></text></g>
<g class="v2-reading-block" data-block="objects-story-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">materials used to make objects. A <tspan class="se-bold">material</tspan> is a substance or mixture of</tspan><tspan x="89" dy="32">substances from which an object can be made.</tspan></text></g>
<g class="v2-reading-block" data-block="identify-task" transform="translate(0 314)"><rect class="se-activity-panel" x="89" y="0" width="874" height="402" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Choose several safe objects around you. Look at each whole object, then</tspan><tspan x="146" dy="32">at its separate parts. Do not pull electrical equipment apart or handle</tspan><tspan x="146" dy="32">broken objects.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Make a notebook table headed Object, Part, Material and Evidence.</tspan><tspan x="146" dy="32">Record what you can identify. If appearance is not enough, write</tspan><tspan x="146" dy="32">“uncertain” and ask your teacher or check a label.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Compare with a partner. Did you name a material, such as wood, or only</tspan><tspan x="146" dy="32">describe a property, such as brown? Can one object belong to several</tspan><tspan x="146" dy="32">material groups?</tspan></text></g>
<g class="v2-reading-block" data-block="identify-evidence-0" transform="translate(0 738)"><text class="se-copy" x="89" y="24"><tspan x="89">A notebook combines paper pages with a cover and a binding. A pen may contain</tspan><tspan x="89" dy="32">plastic, metal and ink. Naming just one material can miss important parts.</tspan></text></g><g transform="translate(0 802)"><g data-page-illustration="figures/class-6/science/ch06/mixing.png"><image class="science-illustration" href="../../figures/class-6/science/ch06/mixing.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Materials for a mixing test.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Materials for a mixing test.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
