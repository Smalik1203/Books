x="89" dy="27">do not mix completely.</tspan></text></g>
<g class="v2-reading-block" data-block="gases-0" transform="translate(0 503)"><text class="se-copy" x="89" y="24"><tspan x="89">Some gases dissolve in water too. Dissolved oxygen is important for many aquatic</tspan><tspan x="89" dy="32">living things. It is different from a visible air bubble and from the oxygen</tspan></text></g>
<g class="v2-reading-block" data-block="gases-1" transform="translate(0 567)"><text class="se-copy" x="89" y="24"><tspan x="89">chemically combined with hydrogen in water itself. Water dissolves many</tspan><tspan x="89" dy="32">substances, but it does not dissolve everything.</tspan></text></g>
<g class="v2-reading-block" data-block="ors-head" transform="translate(0 659)"><text class="se-heading" x="89" y="30"><tspan x="89">When Accurate Mixing Matters</tspan></text></g>
<g class="v2-reading-block" data-block="ors" transform="translate(0 707)"><text class="se-copy" x="89" y="24"><tspan x="89">Oral rehydration solution (ORS) helps replace water and salts lost during</tspan><tspan x="89" dy="32">diarrhoea. An adult should follow a health worker’s advice and the packet’s exact</tspan><tspan x="89" dy="32">water quantity; do not assume every packet makes one litre. If packets are</tspan><tspan x="89" dy="32">unavailable, WHO describes an emergency home mixture of six level teaspoons</tspan><tspan x="89" dy="32">of sugar and half a level teaspoon of salt in one litre of safe drinking water.</tspan><tspan x="89" dy="32">Accurate level measures matter: do not guess, heap the spoons or add extra salt.</tspan><tspan x="89" dy="32">This is not a classroom tasting activity or a substitute for medical care. Its</tspan><tspan x="89" dy="32">connection to this lesson is precise measurement and dissolved substances.</tspan></text></g><g transform="translate(0 979)"><g data-page-illustration="figures/class-6/science/ch06/mixing.png"><image class="science-illustration" href="../../figures/class-6/science/ch06/mixing.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Materials for a mixing test.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Materials for a mixing test.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
