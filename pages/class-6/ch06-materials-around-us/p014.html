<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="solubility-table" transform="translate(0 112)"><g data-table-spacing="airy" data-comparison-table="solubility-table"><text class="v2-table-caption" x="89" y="33.6"><tspan x="89">Dissolving is different from floating or settling</tspan></text><rect class="se-table-head" x="89" y="54" width="874" height="104"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="86.08"><tspan x="103">Sample in</tspan><tspan x="103" dy="28">room-temperature</tspan><tspan x="103" dy="28">water</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="347.72" y="86.08"><tspan x="347.72">Usual observation with a</tspan><tspan x="347.72" dy="28">small amount</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="671.1" y="86.08"><tspan x="671.1">Interpretation</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="158" y2="158"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="190.07999999999998"><tspan x="103">Sugar or salt</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="190.07999999999998"><tspan x="347.72">Separate grains are no longer</tspan><tspan x="347.72" dy="28">visible after stirring</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="190.07999999999998"><tspan x="671.1">Soluble in these conditions;</tspan><tspan x="671.1" dy="28">remains in solution</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="234" y2="234"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="266.08"><tspan x="103">Sand</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="266.08"><tspan x="347.72">Grains remain and</tspan><tspan x="347.72" dy="28">commonly settle</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="266.08"><tspan x="671.1">Does not dissolve</tspan><tspan x="671.1" dy="28">appreciably</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="310" y2="310"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="342.08"><tspan x="103">Chalk powder</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="342.08"><tspan x="347.72">Water may become cloudy;</tspan><tspan x="347.72" dy="28">some material settles</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="342.08"><tspan x="671.1">Mostly remains as</tspan><tspan x="671.1" dy="28">undissolved particles</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="386" y2="386"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="418.08"><tspan x="103">Sawdust</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="418.08"><tspan x="347.72">Pieces remain; some may</tspan><tspan x="347.72" dy="28">float</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="418.08"><tspan x="671.1">Floating is not dissolving</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="462" y2="462"/><rect class="v2-table-frame" x="89" y="54" width="874" height="408"/><line class="v2-table-rule" x1="333.72" x2="333.72" y1="54" y2="462"/><line class="v2-table-rule" x1="657.1" x2="657.1" y1="54" y2="462"/><text class="v2-table-note" x="89" y="502.88"><tspan x="89">Record your own observations first. Amount, temperature, stirring time and the exact sample</tspan><tspan x="89" dy="26">can affect what you see.</tspan></text></g></g>
<g class="v2-reading-block" data-block="limits" transform="translate(0 674)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.45564" data-space-ratio="1.439"><tspan class="se-bold">Soluble</tspan><tspan dx="2.45564"> means</tspan><tspan dx="2.45564"> a</tspan><tspan dx="2.45564"> material</tspan><tspan dx="2.45564"> can</tspan><tspan dx="2.45564"> dissolve</tspan><tspan dx="2.45564"> in</tspan><tspan dx="2.45564"> the</tspan><tspan dx="2.45564"> specified</tspan><tspan dx="2.45564"> liquid.</tspan><tspan dx="2.45564"> <tspan class="se-bold">Insoluble</tspan></tspan><tspan dx="2.45564"> usually</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.98034" data-space-ratio="1.175">means<tspan dx="0.98034"> that</tspan><tspan dx="0.98034"> so</tspan><tspan dx="0.98034"> little</tspan><tspan dx="0.98034"> dissolves</tspan><tspan dx="0.98034"> that</tspan><tspan dx="0.98034"> it</tspan><tspan dx="0.98034"> is</tspan><tspan dx="0.98034"> negligible</tspan><tspan dx="0.98034"> for</tspan><tspan dx="0.98034"> the</tspan><tspan dx="0.98034"> situation.</tspan><tspan dx="0.98034"> A</tspan><tspan dx="0.98034"> fixed</tspan><tspan dx="0.98034"> amount</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.89353" data-space-ratio="1.339">of<tspan dx="1.89353"> water</tspan><tspan dx="1.89353"> cannot</tspan><tspan dx="1.89353"> dissolve</tspan><tspan dx="1.89353"> unlimited</tspan><tspan dx="1.89353"> salt</tspan><tspan dx="1.89353"> or</tspan><tspan dx="1.89353"> sugar.</tspan><tspan dx="1.89353"> Undissolved</tspan><tspan dx="1.89353"> grains</tspan><tspan dx="1.89353"> after</tspan><tspan dx="1.89353"> adding</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">a large amount do not prove that the substance is insoluble.</tspan></text></g>
<g class="v2-reading-block" data-block="liquids" transform="translate(0 818)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="6.65556" data-space-ratio="2.190">Try<tspan dx="6.65556"> a</tspan><tspan dx="6.65556"> teacher-approved</tspan><tspan dx="6.65556"> comparison</tspan><tspan dx="6.65556"> of</tspan><tspan dx="6.65556"> small</tspan><tspan dx="6.65556"> amounts</tspan><tspan dx="6.65556"> of</tspan><tspan dx="6.65556"> vinegar,</tspan><tspan dx="6.65556"> honey</tspan><tspan dx="6.65556"> and</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="9.61979" data-space-ratio="2.720">mustard<tspan dx="9.61979"> oil</tspan><tspan dx="9.61979"> added</tspan><tspan dx="9.61979"> separately</tspan><tspan dx="9.61979"> to</tspan><tspan dx="9.61979"> water.</tspan><tspan dx="9.61979"> Vinegar</tspan><tspan dx="9.61979"> mixes</tspan><tspan dx="9.61979"> with</tspan><tspan dx="9.61979"> water.</tspan><tspan dx="9.61979"> Honey’s</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.92629" data-space-ratio="1.344">dissolved<tspan dx="1.92629"> sugars</tspan><tspan dx="1.92629"> can</tspan><tspan dx="1.92629"> spread</tspan><tspan dx="1.92629"> through</tspan><tspan dx="1.92629"> water</tspan><tspan dx="1.92629"> when</tspan><tspan dx="1.92629"> stirred.</tspan><tspan dx="1.92629"> Oil</tspan><tspan dx="1.92629"> may</tspan><tspan dx="1.92629"> break</tspan><tspan dx="1.92629"> into</tspan><tspan dx="1.92629"> tiny</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.73932" data-space-ratio="2.026">droplets<tspan dx="5.73932"> during</tspan><tspan dx="5.73932"> stirring,</tspan><tspan dx="5.73932"> but</tspan><tspan dx="5.73932"> commonly</tspan><tspan dx="5.73932"> separates</tspan><tspan dx="5.73932"> into</tspan><tspan dx="5.73932"> a</tspan><tspan dx="5.73932"> layer</tspan><tspan dx="5.73932"> on</tspan><tspan dx="5.73932"> standing.</tspan><tspan dx="5.73932"> A</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">temporary cloudy mixture is not the same as a solution.</tspan></text></g><g transform="translate(0 994)"><g data-page-illustration="figures/class-6/science/review/settling-jars.png"><image class="science-illustration" href="../../figures/class-6/science/review/settling-jars.png" x="270.25" y="10" width="511.5" height="341" preserveAspectRatio="xMidYMid meet"><title>A settled mixture is not a solution.</title></image><text class="se-caption" x="526" y="389" text-anchor="middle"><tspan x="526">A settled mixture is not a solution.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
