<g class="v2-reading-block" data-block="solubility-table" transform="translate(0 256)"><g data-table-spacing="airy" data-comparison-table="solubility-table"><text class="v2-table-caption" x="89" y="33.6"><tspan x="89">Dissolving is different from floating or settling</tspan></text><rect class="se-table-head" x="89" y="54" width="874" height="104"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="86.08"><tspan x="103">Sample in</tspan><tspan x="103" dy="28">room-temperature</tspan><tspan x="103" dy="28">water</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="347.72" y="86.08"><tspan x="347.72">Usual observation with a</tspan><tspan x="347.72" dy="28">small amount</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="671.1" y="86.08"><tspan x="671.1">Interpretation</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="158" y2="158"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="190.07999999999998"><tspan x="103">Sugar or salt</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="190.07999999999998"><tspan x="347.72">Separate grains are no longer</tspan><tspan x="347.72" dy="28">visible after stirring</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="190.07999999999998"><tspan x="671.1">Soluble in these conditions;</tspan><tspan x="671.1" dy="28">remains in solution</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="234" y2="234"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="266.08"><tspan x="103">Sand</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="266.08"><tspan x="347.72">Grains remain and</tspan><tspan x="347.72" dy="28">commonly settle</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="266.08"><tspan x="671.1">Does not dissolve</tspan><tspan x="671.1" dy="28">appreciably</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="310" y2="310"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="342.08"><tspan x="103">Chalk powder</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="342.08"><tspan x="347.72">Water may become cloudy;</tspan><tspan x="347.72" dy="28">some material settles</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="342.08"><tspan x="671.1">Mostly remains as</tspan><tspan x="671.1" dy="28">undissolved particles</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="386" y2="386"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="418.08"><tspan x="103">Sawdust</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="347.72" y="418.08"><tspan x="347.72">Pieces remain; some may</tspan><tspan x="347.72" dy="28">float</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="418.08"><tspan x="671.1">Floating is not dissolving</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="462" y2="462"/><rect class="v2-table-frame" x="89" y="54" width="874" height="408"/><line class="v2-table-rule" x1="333.72" x2="333.72" y1="54" y2="462"/><line class="v2-table-rule" x1="657.1" x2="657.1" y1="54" y2="462"/><text class="v2-table-note" x="89" y="502.88"><tspan x="89">Record your own observations first. Amount, temperature, stirring time and the exact sample</tspan><tspan x="89" dy="26">can affect what you see.</tspan></text></g></g>
