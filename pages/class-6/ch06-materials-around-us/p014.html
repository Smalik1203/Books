<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="labels-picture" transform="translate(0 112)"><g class="v2-material-diagram" data-diagram="bottles"><path class="v2-material-glass" d="M295 21H371V58L410 98V255Q333 275 256 255V98L295 58Z"/><path class="v2-material-water" d="M259 126H407V252Q333 268 259 252Z"/><path class="v2-material-cap" d="M294 11H372V29H294Z"/><text class="v2-material-label" x="333" y="187" text-anchor="middle">Water</text><text class="v2-material-label" x="333" y="222" text-anchor="middle">500 mL</text><path class="v2-material-glass" d="M681 21H757V58L796 98V255Q719 275 642 255V98L681 58Z"/><path class="v2-material-milk" d="M645 126H793V252Q719 268 645 252Z"/><path class="v2-material-cap" d="M680 11H758V29H680Z"/><text class="v2-material-label" x="719" y="187" text-anchor="middle">Milk</text><text class="v2-material-label" x="719" y="222" text-anchor="middle">500 mL</text><text class="v2-material-label" x="526" y="310" text-anchor="middle">Volume of contents</text></g><text class="se-caption" x="89" y="350.88"><tspan x="89">Both labels state 500 mL of contents. Equal volume does not by itself establish equal mass.</tspan></text></g>
<g class="v2-reading-block" data-block="units-0" transform="translate(0 491)"><text class="se-copy" x="89" y="24"><tspan x="89">The SI base unit of mass is the kilogram (kg); 1 kg = 1000 g. The SI unit of volume</tspan><tspan x="89" dy="32">is the cubic metre (m³). For everyday liquids, litres and millilitres are convenient:</tspan></text></g>
<g class="v2-reading-block" data-block="units-1" transform="translate(0 555)"><text class="se-copy" x="89" y="24"><tspan x="89">1 L = 1000 mL and 1 m³ = 1000 L. Write a space between number and symbol, as</tspan><tspan x="89" dy="32">in 7 kg and 500 mL. Do not add a plural s or a full stop unless it ends the</tspan><tspan x="89" dy="32">sentence.</tspan></text></g>
<g class="v2-reading-block" data-block="matter-head" transform="translate(0 679)"><text class="v2-title" x="89" y="38"><tspan x="89">6.9 What Is Matter?</tspan></text></g>
<g class="v2-reading-block" data-block="matter-0" transform="translate(0 737)"><text class="se-copy" x="89" y="24"><tspan x="89">Anything that has mass and occupies space is called <tspan class="se-bold">matter</tspan>. The cup, its water,</tspan><tspan x="89" dy="32">sand and pebbles are matter. Materials are kinds of matter selected to make</tspan></text></g>
<g class="v2-reading-block" data-block="matter-1" transform="translate(0 801)"><text class="se-copy" x="89" y="24"><tspan x="89">objects. Air is matter too, even though we usually cannot see it: it occupies space</tspan><tspan x="89" dy="32">and has mass.</tspan></text></g>
<g class="v2-reading-block" data-block="air-picture" transform="translate(0 881)"><g class="v2-material-diagram" data-diagram="air-space"><path class="v2-material-glass" d="M240 86V269Q526 293 812 269V86"/><path class="v2-material-water" d="M245 132H807V264Q526 286 245 264Z"/><path class="v2-material-glass" d="M424 231V46Q526 24 628 46V231"/><path class="v2-material-air" d="M428 224V50Q526 30 624 50V224Z"/><line class="v2-material-line" x1="628" y1="72" x2="704" y2="41"/><text class="v2-material-label" x="713" y="38" text-anchor="start">Inverted cup</text><text class="v2-material-label" x="526" y="114" text-anchor="middle">Trapped air</text><line class="v2-material-line" x1="629" y1="199" x2="704" y2="221"/><text class="v2-material-label" x="717" y="230" text-anchor="start">Water</text><text class="v2-material-label" x="526" y="324" text-anchor="middle">Opening faces down</text><line class="v2-material-line" x1="526" y1="298" x2="526" y2="236"/></g><text class="se-caption" x="89" y="365.88"><tspan x="89">A model of air trapped in an inverted cup. The trapped air occupies space; it is not an empty</tspan><tspan x="89" dy="27">region.</tspan></text></g>
<g class="v2-reading-block" data-block="air-evidence-0" transform="translate(0 1302)"><text class="se-copy" x="89" y="24"><tspan x="89">A teacher can lower an inverted empty cup straight down into water. Much of the</tspan><tspan x="89" dy="32">water is kept out by the trapped air. Tilting the cup allows bubbles to escape and</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
