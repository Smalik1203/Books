<section class="page page--food page--science-editorial page--science-v2 page--g6-ch06" data-folio="24"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Materials Around Us, page 24"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M12 28L50 8L87 28L50 48ZM12 28V75L50 97L87 75V28M50 48V97"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Materials Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q6" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">6.</text><text class="se-copy" x="132" y="24"><tspan x="132">Choose container materials for food waste, broken glass and wastepaper. For</tspan><tspan x="132" dy="32">each, state the properties needed. Explain why broken glass must be handled</tspan><tspan x="132" dy="32">by an adult and placed in a rigid, puncture-resistant, clearly marked</tspan><tspan x="132" dy="32">container rather than a thin bag.</tspan></text></g>
<g class="v2-reading-block" data-block="q7" transform="translate(0 270)"><text class="se-copy" x="111" y="24" text-anchor="end">7.</text><text class="se-copy" x="132" y="24"><tspan x="132">Air does not usually prevent us from seeing one another, but a wooden door</tspan><tspan x="132" dy="32">does. Choose the correct pair describing air and the door: (a) transparent,</tspan><tspan x="132" dy="32">opaque; (b) translucent, transparent; (c) opaque, translucent; (d) transparent,</tspan><tspan x="132" dy="32">translucent. Explain your choice.</tspan></text></g>
<g class="v2-reading-block" data-block="q8" transform="translate(0 428)"><text class="se-copy" x="111" y="24" text-anchor="end">8.</text><text class="se-copy" x="132" y="24"><tspan x="132">Sample X resists gentle pressing and dissolves in enough water. Sample Y</tspan><tspan x="132" dy="32">changes shape easily when pressed and remains as a separate sample in</tspan><tspan x="132" dy="32">water. Suggest possible materials, and describe X and Y using the tests</tspan><tspan x="132" dy="32">performed. Do these observations uniquely identify either material? Would</tspan><tspan x="132" dy="32">they alone establish scratch hardness?</tspan></text></g>
<g class="v2-reading-block" data-block="q9" transform="translate(0 618)"><text class="se-copy" x="111" y="24" text-anchor="end">9.</text><text class="se-copy" x="132" y="24"><tspan x="132">Give a possible example for each clue: (a) has lustre; (b) compresses easily;</tspan><tspan x="132" dy="32">(c) is hard and soluble in water; (d) lets some light through but no clear</tspan><tspan x="132" dy="32">image; (e) has mass and volume but is usually invisible. Explain why some</tspan><tspan x="132" dy="32">clues allow several answers. Then write a “Who am I?” riddle using enough</tspan><tspan x="132" dy="32">properties to narrow the choices.</tspan></text></g>
<g class="v2-reading-block" data-block="q10" transform="translate(0 808)"><text class="se-copy" x="111" y="24" text-anchor="end">10.</text><text class="se-copy" x="132" y="24"><tspan x="132">Consider vinegar, honey, mustard oil, water, glucose and wheat flour. Give</tspan><tspan x="132" dy="32">two pairs that can form a uniform solution when mixed in suitable amounts,</tspan><tspan x="132" dy="32">and two pairs that leave a separate layer or undissolved particles after</tspan><tspan x="132" dy="32">standing. State the liquid and the material added in each case. Explain why a</tspan><tspan x="132" dy="32">briefly cloudy mixture is not necessarily a solution.</tspan></text></g><g transform="translate(0 998)"><g data-page-illustration="figures/class-6/science/ch06/panes.png"><image class="science-illustration" href="../../figures/class-6/science/ch06/panes.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Different viewing materials.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Different viewing materials.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">24</text></g></svg></div></div></section>
