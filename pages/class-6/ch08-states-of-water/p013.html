<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="cloud-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="478" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Watch a teacher-led cloud-chamber demonstration, or a teacher-selected</tspan><tspan x="146" dy="32">recording showing a clear view before and after a pressure change. The</tspan><tspan x="146" dy="32">teacher operates approved apparatus; pupils do not burn paper or handle</tspan><tspan x="146" dy="32">smoke, sprays or pressurised containers.</tspan></text><text class="se-activity-step" x="132" y="232" text-anchor="end">2.</text><text class="se-copy" x="146" y="232"><tspan x="146">Predict what you might see when the moist air expands and cools. Record</tspan><tspan x="146" dy="32">what actually changes and when it changes.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Compare a demonstration with few added particles and one with added</tspan><tspan x="146" dy="32">condensation nuclei, if the teacher can provide comparable observations.</tspan><tspan x="146" dy="32">Note which other conditions were kept the same.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Explain what the observations support. If no mist appears, discuss the</tspan><tspan x="146" dy="32">apparatus and conditions rather than reporting an expected result.</tspan></text></g>
<g class="v2-reading-block" data-block="cloud-evidence-0" transform="translate(0 612)"><text class="se-copy" x="89" y="24"><tspan x="89">Expansion and cooling can make liquid droplets form in moist air. Tiny particles</tspan><tspan x="89" dy="32">can provide surfaces on which droplets form. A cloudy appearance alone does</tspan></text></g>
<g class="v2-reading-block" data-block="cloud-evidence-1" transform="translate(0 676)"><text class="se-copy" x="89" y="24"><tspan x="89">not identify its cause: dust or smoke may also be visible. The timing of the</tspan><tspan x="89" dy="32">change and a comparison help distinguish evidence from a guess.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-art" transform="translate(0 756)"><image class="science-illustration" data-photo="cycle" href="../../figures/class-6/science/ch08/cycle.png" x="121.91346153846155" y="0" width="808.1730769230769" height="450" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="480.88"><tspan x="89">Fig. 8.6 · Water is stored and moves in many places. Follow the lake and river towards the</tspan><tspan x="89" dy="27">ocean, and locate the water below ground.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
