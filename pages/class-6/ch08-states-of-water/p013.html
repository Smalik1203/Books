<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="cooling-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">8.7 Why Does Evaporation Cool?</tspan></text></g>
<g class="v2-reading-block" data-block="cooling-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Evaporation requires energy. Water that evaporates from a wet surface takes</tspan><tspan x="89" dy="32">energy from the remaining water and its surroundings. If this energy is not</tspan></text></g>
<g class="v2-reading-block" data-block="cooling-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">replaced as quickly, the surface cools. A fan can help sweat evaporate from skin</tspan><tspan x="89" dy="32">by replacing nearby moist air.</tspan></text></g>
<g class="v2-reading-block" data-block="earthen-pot" transform="translate(0 314)"><text class="se-copy" x="89" y="24"><tspan x="89">An unglazed earthen pot has tiny connected</tspan><tspan x="89" dy="32">pores. A little water seeps to its outer surface</tspan><tspan x="89" dy="32">and evaporates, taking energy from the pot</tspan><tspan x="89" dy="32">and its contents. A steel pot does not have the</tspan><tspan x="89" dy="32">same porous wall. A surahi uses this same</tspan><tspan x="89" dy="32">evaporative-cooling principle; shape alone</tspan><tspan x="89" dy="32">does not produce the cooling.</tspan></text><image class="science-illustration" data-photo="cooler" href="../../figures/class-6/science/ch08/cooler.png" x="613" y="10.670731707317088" width="350" height="363.6585365853658" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="417.88"><tspan x="89">Fig. 8.5 · A cooler cutaway: moist sand surrounds the inner pot, within the porous outer pot.</tspan></text></g>
<g class="v2-reading-block" data-block="cooler-task" transform="translate(0 760)"><rect class="se-activity-panel" x="89" y="0" width="874" height="478" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">With an adult, choose two sound unglazed earthen pots that fit one inside</tspan><tspan x="146" dy="32">the other with a gap. Put clean sand under the smaller pot and in the gap</tspan><tspan x="146" dy="32">between the walls.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Moisten the sand with water. Cover the inner pot with a lid or damp clean</tspan><tspan x="146" dy="32">jute cloth. Keep the cooler in a shaded, ventilated place on a stable tray.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Measure its inner temperature and nearby air temperature using suitable</tspan><tspan x="146" dy="32">thermometers at the start and regularly over four to five hours. Keep the</tspan><tspan x="146" dy="32">sand moist, but do not let water reach electronic equipment.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">4.</text><text class="se-copy" x="146" y="384"><tspan x="146">Compare the readings. If observing vegetables daily for a week, compare</tspan><tspan x="146" dy="32">similar samples kept in the same shade outside the cooler. Do not taste</tspan><tspan x="146" dy="32">the test food; ask an adult to discard any spoiled material.</tspan></text></g>
<g class="v2-reading-block" data-block="cooler-evidence-0" transform="translate(0 1260)"><text class="se-copy" x="89" y="24"><tspan x="89">The wet outer surface must lose water by evaporation for this cooling to work</tspan><tspan x="89" dy="32">well. Dry moving air can help; very humid air can limit the effect. A pot-in-pot</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
