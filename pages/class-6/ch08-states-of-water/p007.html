<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="humidity-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Humidity</tspan> describes water vapour in the air. Weather reports often give relative</tspan><tspan x="89" dy="32">humidity as a percentage; its meaning depends on temperature. If you collect</tspan></text></g>
<g class="v2-reading-block" data-block="humidity-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">humidity records, note the place, time and kind of humidity reported. A cold</tspan><tspan x="89" dy="32">surface tends to collect more condensate when enough vapour is available.</tspan></text></g>
<g class="v2-reading-block" data-block="awg" transform="translate(0 256)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="218" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Some water-harvesting machines cool moist air and collect condensed</tspan><tspan x="113" dy="32">water. How is this similar to droplets on a glass? Why would collecting water</tspan><tspan x="113" dy="32">alone not prove that it is safe to drink? Explain the need for clean equipment</tspan><tspan x="113" dy="32">and suitable treatment.</tspan></text></g>
<g class="v2-reading-block" data-block="states-heading" transform="translate(0 508)"><text class="v2-title" x="89" y="38"><tspan x="89">8.4 Comparing the Three States</tspan></text></g>
<g class="v2-reading-block" data-block="states-task" transform="translate(0 566)"><rect class="se-activity-panel" x="89" y="0" width="874" height="446" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Move an ice cube between two containers of different shapes. Work</tspan><tspan x="146" dy="32">quickly enough to distinguish a change caused by moving it from a</tspan><tspan x="146" dy="32">change caused by melting.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Transfer a measured amount of water between the same containers</tspan><tspan x="146" dy="32">without spilling. Compare its shape and the space it occupies.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Spread a little water on a clean, level tray. Observe its shape. Explain why</tspan><tspan x="146" dy="32">spreading out is not the same as producing more water.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352"><tspan x="146">In your notebook, compare shape, volume and flow for ice and liquid</tspan><tspan x="146" dy="32">water. Use the evaporation evidence to discuss gaseous water; do not</tspan><tspan x="146" dy="32">claim that you directly saw the vapour.</tspan></text></g><g transform="translate(0 1034)"><g data-page-illustration="figures/class-6/science/ch08/condensation.png"><image class="science-illustration" href="../../figures/class-6/science/ch08/condensation.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>A cool surface and droplets.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">A cool surface and droplets.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
