<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="states-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">8.4 Comparing the Three States</tspan></text></g>
<g class="v2-reading-block" data-block="states-task" transform="translate(0 170)"><rect class="se-activity-panel" x="89" y="0" width="874" height="446" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Move an ice cube between two containers of different shapes. Work</tspan><tspan x="146" dy="32">quickly enough to distinguish a change caused by moving it from a</tspan><tspan x="146" dy="32">change caused by melting.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Transfer a measured amount of water between the same containers</tspan><tspan x="146" dy="32">without spilling. Compare its shape and the space it occupies.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Spread a little water on a clean, level tray. Observe its shape. Explain why</tspan><tspan x="146" dy="32">spreading out is not the same as producing more water.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352"><tspan x="146">In your notebook, compare shape, volume and flow for ice and liquid</tspan><tspan x="146" dy="32">water. Use the evaporation evidence to discuss gaseous water; do not</tspan><tspan x="146" dy="32">claim that you directly saw the vapour.</tspan></text></g>
<g class="v2-reading-block" data-block="states-table" transform="translate(0 638)"><g data-comparison-table="states-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 8.2 · The three states of water</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Property</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="242.84" y="70.08"><tspan x="242.84">Ice: solid</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="478.82000000000005" y="70.08"><tspan x="478.82000000000005">Water: liquid</tspan></text></g><g data-comparison-cell="3"><text class="v2-table-heading" x="723.5400000000001" y="70.08"><tspan x="723.5400000000001">Water vapour: gas</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Shape</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="242.84" y="110.08"><tspan x="242.84">Keeps its own shape</tspan><tspan x="242.84" dy="28">until it deforms or</tspan><tspan x="242.84" dy="28">melts</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="478.82000000000005" y="110.08"><tspan x="478.82000000000005">Takes the shape of</tspan><tspan x="478.82000000000005" dy="28">the part of a</tspan><tspan x="478.82000000000005" dy="28">container it occupies</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="723.5400000000001" y="110.08"><tspan x="723.5400000000001">Spreads through the</tspan><tspan x="723.5400000000001" dy="28">available space</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="206.07999999999998"><tspan x="103">Volume of</tspan><tspan x="103" dy="28">a fixed</tspan><tspan x="103" dy="28">sample</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="242.84" y="206.07999999999998"><tspan x="242.84">Approximately fixed</tspan><tspan x="242.84" dy="28">under the same</tspan><tspan x="242.84" dy="28">conditions</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="478.82000000000005" y="206.07999999999998"><tspan x="478.82000000000005">Approximately fixed</tspan><tspan x="478.82000000000005" dy="28">under the same</tspan><tspan x="478.82000000000005" dy="28">conditions</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="723.5400000000001" y="206.07999999999998"><tspan x="723.5400000000001">Changes with the</tspan><tspan x="723.5400000000001" dy="28">space and conditions</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="274" y2="274"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="302.08"><tspan x="103">Flow</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="242.84" y="302.08"><tspan x="242.84">Does not pour like a</tspan><tspan x="242.84" dy="28">liquid in this test</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="478.82000000000005" y="302.08"><tspan x="478.82000000000005">Flows and can be</tspan><tspan x="478.82000000000005" dy="28">poured</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="723.5400000000001" y="302.08"><tspan x="723.5400000000001">Flows and mixes with</tspan><tspan x="723.5400000000001" dy="28">air</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="342" y2="342"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="370.08"><tspan x="103">Visibility</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="242.84" y="370.08"><tspan x="242.84">Usually visible</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="478.82000000000005" y="370.08"><tspan x="478.82000000000005">Visible in a container</tspan><tspan x="478.82000000000005" dy="28">or drops</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="723.5400000000001" y="370.08"><tspan x="723.5400000000001">Invisible; mist is</tspan><tspan x="723.5400000000001" dy="28">liquid droplets</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="410" y2="410"/><rect class="v2-table-frame" x="89" y="42" width="874" height="368"/><line class="v2-table-rule" x1="228.84" x2="228.84" y1="42" y2="410"/><line class="v2-table-rule" x1="464.82000000000005" x2="464.82000000000005" y1="42" y2="410"/><line class="v2-table-rule" x1="709.5400000000001" x2="709.5400000000001" y1="42" y2="410"/><text class="v2-table-note" x="89" y="442.88"><tspan x="89">The volume comparison concerns a sample staying in one state under similar conditions.</tspan><tspan x="89" dy="26">Water changes volume when it freezes or melts.</tspan></text></g></g>
<g class="v2-reading-block" data-block="other-states-0" transform="translate(0 1128)"><text class="se-copy" x="89" y="24"><tspan x="89">Stones, wood and glass are everyday solids. Milk and cooking oil are liquids.</tspan><tspan x="89" dy="32">Oxygen and carbon dioxide are gases. Smells can spread because some</tspan></text></g>
<g class="v2-reading-block" data-block="other-states-1" transform="translate(0 1192)"><text class="se-copy" x="89" y="24"><tspan x="89">substances enter the air and move with it; smell is not a way to identify water</tspan><tspan x="89" dy="32">vapour. Never sniff an unknown substance to test its state.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
