ing" x="151" y="242" text-anchor="middle">8</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">A Journey through</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">States of Water</text><image class="science-illustration chapter-opener__image" href="../../figures/class-6/science/ch08/opener.png" x="89" y="336" width="874" height="485.55555555555554" preserveAspectRatio="xMidYMid meet"><title>Aavi, Thirav and an adult studying ice in lemonade</title></image></g><text class="se-copy v2-intro" x="89" y="884" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.56399" data-extra-space="13.88965" data-space-ratio="3.496">An<tspan dx="13.88965"> ice</tspan><tspan dx="13.88965"> cube</tspan><tspan dx="13.88965"> disappears</tspan><tspan dx="13.88965"> in</tspan><tspan dx="13.88965"> a</tspan><tspan dx="13.88965"> glass</tspan><tspan dx="13.88965"> of</tspan><tspan dx="13.88965"> lemonade.</tspan><tspan dx="13.88965"> Has</tspan><tspan dx="13.88965"> the</tspan><tspan dx="13.88965"> water</tspan></tspan><tspan x="89" dy="34" data-paragraph-end="true">disappeared too?</tspan></text><text class="se-copy" x="89" y="970" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.40997" data-space-ratio="1.431">On<tspan dx="2.40997"> a</tspan><tspan dx="2.40997"> warm</tspan><tspan dx="2.40997"> afternoon,</tspan><tspan dx="2.40997"> Aavi</tspan><tspan dx="2.40997"> and</tspan><tspan dx="2.40997"> Thirav</tspan><tspan dx="2.40997"> watch</tspan><tspan dx="2.40997"> the</tspan><tspan dx="2.40997"> ice</tspan><tspan dx="2.40997"> in</tspan><tspan dx="2.40997"> their</tspan><tspan dx="2.40997"> drinks.</tspan><tspan dx="2.40997"> Ice</tspan><tspan dx="2.40997"> is</tspan><tspan dx="2.40997"> hard</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.69018" data-space-ratio="1.302">and<tspan dx="1.69018"> holds</tspan><tspan dx="1.69018"> its</tspan><tspan dx="1.69018"> shape;</tspan><tspan dx="1.69018"> the</tspan><tspan dx="1.69018"> drink</tspan><tspan dx="1.69018"> flows</tspan><tspan dx="1.69018"> when</tspan><tspan dx="1.69018"> poured.</tspan><tspan dx="1.69018"> Thirav</tspan><tspan dx="1.69018"> wonders</tspan><tspan dx="1.69018"> whether</tspan><tspan dx="1.69018"> such</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">different-looking things can be the same substance.</tspan></text><text class="se-copy" x="89" y="1082" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.75743" data-space-ratio="1.135">Aavi<tspan dx="0.75743"> suggests</tspan><tspan dx="0.75743"> a</tspan><tspan dx="0.75743"> test:</tspan><tspan dx="0.75743"> let</tspan><tspan dx="0.75743"> an</tspan><tspan dx="0.75743"> ice</tspan><tspan dx="0.75743"> cube</tspan><tspan dx="0.75743"> warm</tspan><tspan dx="0.75743"> in</tspan><tspan dx="0.75743"> a</tspan><tspan dx="0.75743"> cup,</tspan><tspan dx="0.75743"> then</tspan><tspan dx="0.75743"> ask</tspan><tspan dx="0.75743"> an</tspan><tspan dx="0.75743"> adult</tspan><tspan dx="0.75743"> to</tspan><tspan dx="0.75743"> freeze</tspan><tspan dx="0.75743"> the</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">water again. Would anything need to be added to turn one form into the other?</tspan></text><text class="se-copy" x="89" y="1162" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.65586" data-space-ratio="1.654">Follow<tspan dx="3.65586"> water</tspan><tspan dx="3.65586"> from</tspan><tspan dx="3.65586"> ice</tspan><tspan dx="3.65586"> to</tspan><tspan dx="3.65586"> liquid</tspan><tspan dx="3.65586"> to</tspan><tspan dx="3.65586"> invisible</tspan><tspan dx="3.65586"> vapour,</tspan><tspan dx="3.65586"> and</tspan><tspan dx="3.65586"> back</tspan><tspan dx="3.65586"> again.</tspan><tspan dx="3.65586"> Investigate</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="7.03084" data-space-ratio="2.257">drying,<tspan dx="7.03084"> droplets</tspan><tspan dx="7.03084"> and</tspan><tspan dx="7.03084"> cooling,</tspan><tspan dx="7.03084"> then</tspan><tspan dx="7.03084"> use</tspan><tspan dx="7.03084"> your</tspan><tspan dx="7.03084"> evidence</tspan><tspan dx="7.03084"> to</tspan><tspan dx="7.03084"> explain</tspan><tspan dx="7.03084"> part</tspan><tspan dx="7.03084"> of</tspan><tspan dx="7.03084"> the</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">journey from Earth’s surface to clouds and rain.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
