<g class="v2-reading-block" data-block="changes" transform="translate(0 170)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.35286" data-space-ratio="1.421"><tspan class="se-bold">Melting</tspan><tspan dx="2.35286"> changes</tspan><tspan dx="2.35286"> a</tspan><tspan dx="2.35286"> solid</tspan><tspan dx="2.35286"> into</tspan><tspan dx="2.35286"> a</tspan><tspan dx="2.35286"> liquid.</tspan><tspan dx="2.35286"> <tspan class="se-bold">Freezing</tspan></tspan><tspan dx="2.35286"> changes</tspan><tspan dx="2.35286"> a</tspan><tspan dx="2.35286"> liquid</tspan><tspan dx="2.35286"> into</tspan><tspan dx="2.35286"> a</tspan><tspan dx="2.35286"> solid.</tspan><tspan dx="2.35286"> Ice</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.95086" data-space-ratio="1.707">melts<tspan dx="3.95086"> when</tspan><tspan dx="3.95086"> it</tspan><tspan dx="3.95086"> gains</tspan><tspan dx="3.95086"> enough</tspan><tspan dx="3.95086"> energy</tspan><tspan dx="3.95086"> from</tspan><tspan dx="3.95086"> its</tspan><tspan dx="3.95086"> surroundings;</tspan><tspan dx="3.95086"> water</tspan><tspan dx="3.95086"> freezes</tspan><tspan dx="3.95086"> when</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.63124" data-space-ratio="1.113">enough<tspan dx="0.63124"> energy</tspan><tspan dx="0.63124"> is</tspan><tspan dx="0.63124"> removed.</tspan><tspan dx="0.63124"> Evaporation</tspan><tspan dx="0.63124"> and</tspan><tspan dx="0.63124"> condensation</tspan><tspan dx="0.63124"> connect</tspan><tspan dx="0.63124"> the</tspan><tspan dx="0.63124"> liquid</tspan><tspan dx="0.63124"> and</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">gaseous states.</tspan></text></g>
<g class="v2-reading-block" data-block="wax-oil" transform="translate(0 314)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.31712" data-space-ratio="1.772">Other<tspan dx="4.31712"> substances</tspan><tspan dx="4.31712"> can</tspan><tspan dx="4.31712"> change</tspan><tspan dx="4.31712"> state</tspan><tspan dx="4.31712"> too.</tspan><tspan dx="4.31712"> Candle</tspan><tspan dx="4.31712"> wax</tspan><tspan dx="4.31712"> can</tspan><tspan dx="4.31712"> melt</tspan><tspan dx="4.31712"> on</tspan><tspan dx="4.31712"> warming</tspan><tspan dx="4.31712"> and</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="8.32478" data-space-ratio="2.489">solidify<tspan dx="8.32478"> on</tspan><tspan dx="8.32478"> cooling.</tspan><tspan dx="8.32478"> Coconut</tspan><tspan dx="8.32478"> oil</tspan><tspan dx="8.32478"> may</tspan><tspan dx="8.32478"> partly</tspan><tspan dx="8.32478"> solidify</tspan><tspan dx="8.32478"> in</tspan><tspan dx="8.32478"> cool</tspan><tspan dx="8.32478"> weather.</tspan><tspan dx="8.32478"> These</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="12.03168" data-space-ratio="3.152">examples<tspan dx="12.03168"> do</tspan><tspan dx="12.03168"> not</tspan><tspan dx="12.03168"> mean</tspan><tspan dx="12.03168"> that</tspan><tspan dx="12.03168"> every</tspan><tspan dx="12.03168"> substance</tspan><tspan dx="12.03168"> changes</tspan><tspan dx="12.03168"> state</tspan><tspan dx="12.03168"> at</tspan><tspan dx="12.03168"> the</tspan><tspan dx="12.03168"> same</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">temperature. Leave demonstrations with flames or hot wax to the teacher.</tspan></text></g>
<g class="v2-reading-block" data-block="state-map-task" transform="translate(0 458)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="304" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="102" data-prose-align="justify"><tspan x="113" data-justify-width="826" data-natural-space="5.59200" data-extra-space="2.10540" data-space-ratio="1.377">The<tspan dx="2.10540"> diagram</tspan><tspan dx="2.10540"> shows</tspan><tspan dx="2.10540"> three</tspan><tspan dx="2.10540"> states</tspan><tspan dx="2.10540"> joined</tspan><tspan dx="2.10540"> by</tspan><tspan dx="2.10540"> opposite</tspan><tspan dx="2.10540"> changes.</tspan><tspan dx="2.10540"> Copy</tspan><tspan dx="2.10540"> it</tspan><tspan dx="2.10540"> in</tspan><tspan dx="2.10540"> your</tspan></tspan><tspan x="113" dy="32" data-justify-width="826" data-natural-space="5.59200" data-extra-space="1.74272" data-space-ratio="1.312">notebook.<tspan dx="1.74272"> Use</tspan><tspan dx="1.74272"> each</tspan><tspan dx="1.74272"> word</tspan><tspan dx="1.74272"> once</tspan><tspan dx="1.74272"> to</tspan><tspan dx="1.74272"> replace</tspan><tspan dx="1.74272"> A,</tspan><tspan dx="1.74272"> B</tspan><tspan dx="1.74272"> and</tspan><tspan dx="1.74272"> 1–3:</tspan><tspan dx="1.74272"> liquid,</tspan><tspan dx="1.74272"> gas,</tspan><tspan dx="1.74272"> freezing,</tspan></tspan><tspan x="113" dy="32" data-paragraph-end="true">evaporation, condensation. “Solid” and “melting” are already given.</tspan></text><text class="se-copy" x="113" y="210" data-prose-align="justify"><tspan x="113" data-justify-width="826" data-natural-space="5.59200" data-extra-space="3.66749" data-space-ratio="1.656">For<tspan dx="3.66749"> each</tspan><tspan dx="3.66749"> arrow,</tspan><tspan dx="3.66749"> state</tspan><tspan dx="3.66749"> whether</tspan><tspan dx="3.66749"> water</tspan><tspan dx="3.66749"> gains</tspan><tspan dx="3.66749"> energy</tspan><tspan dx="3.66749"> or</tspan><tspan dx="3.66749"> releases</tspan><tspan dx="3.66749"> energy</tspan><tspan dx="3.66749"> to</tspan><tspan dx="3.66749"> its</tspan></tspan><tspan x="113" dy="32" data-justify-width="826" data-natural-space="5.59200" data-extra-space="4.62656" data-space-ratio="1.827">surroundings.<tspan dx="4.62656"> Explain</tspan><tspan dx="4.62656"> why</tspan><tspan dx="4.62656"> you</tspan><tspan dx="4.62656"> can</tspan><tspan dx="4.62656"> trace</tspan><tspan dx="4.62656"> a</tspan><tspan dx="4.62656"> return</tspan><tspan dx="4.62656"> route</tspan><tspan dx="4.62656"> without</tspan><tspan dx="4.62656"> adding</tspan><tspan dx="4.62656"> a</tspan></tspan><tspan x="113" dy="32" data-paragraph-end="true">new substance.</tspan></text></g>
