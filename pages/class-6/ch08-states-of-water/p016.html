<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="802" rx="18"/><text class="se-copy" x="113" y="222"><tspan x="113"><tspan class="se-bold">State</tspan> — A physical form of matter,</tspan><tspan x="113" dy="32">such as solid, liquid or gas.</tspan></text><text class="se-copy" x="113" y="306"><tspan x="113"><tspan class="se-bold">Solid</tspan> — Matter with its own shape</tspan><tspan x="113" dy="32">and approximately fixed volume</tspan><tspan x="113" dy="32">under the same conditions.</tspan></text><text class="se-copy" x="113" y="422"><tspan x="113"><tspan class="se-bold">Liquid</tspan> — Matter that flows, with no</tspan><tspan x="113" dy="32">fixed shape but approximately fixed</tspan><tspan x="113" dy="32">volume.</tspan></text><text class="se-copy" x="113" y="538"><tspan x="113"><tspan class="se-bold">Gas</tspan> — Matter that spreads through</tspan><tspan x="113" dy="32">available space and has no fixed</tspan><tspan x="113" dy="32">shape or volume.</tspan></text><text class="se-copy" x="113" y="654"><tspan x="113"><tspan class="se-bold">Water</tspan> <tspan class="se-bold">vapour</tspan> — Water in its</tspan><tspan x="113" dy="32">invisible gaseous state.</tspan></text><text class="se-copy" x="113" y="738"><tspan x="113"><tspan class="se-bold">Evaporation</tspan> — Change from liquid</tspan><tspan x="113" dy="32">to gas at an exposed surface.</tspan></text><text class="se-copy" x="113" y="822"><tspan x="113"><tspan class="se-bold">Condensation</tspan> — Change from a gas</tspan><tspan x="113" dy="32">into a liquid.</tspan></text><text class="se-copy" x="113" y="906"><tspan x="113"><tspan class="se-bold">Melting</tspan> — Change from a solid into</tspan><tspan x="113" dy="32">a liquid.</tspan></text><text class="se-copy" x="541" y="222"><tspan x="541"><tspan class="se-bold">Freezing</tspan> — Change from a liquid</tspan><tspan x="541" dy="32">into a solid.</tspan></text><text class="se-copy" x="541" y="306"><tspan x="541"><tspan class="se-bold">Humidity</tspan> — A description of water</tspan><tspan x="541" dy="32">vapour in the air.</tspan></text><text class="se-copy" x="541" y="390"><tspan x="541"><tspan class="se-bold">Dew</tspan> — Liquid water that condenses</tspan><tspan x="541" dy="32">on a sufficiently cooled surface.</tspan></text><text class="se-copy" x="541" y="474"><tspan x="541"><tspan class="se-bold">Precipitation</tspan> — Water falling from</tspan><tspan x="541" dy="32">clouds as rain, snow or hail.</tspan></text><text class="se-copy" x="541" y="558"><tspan x="541"><tspan class="se-bold">Groundwater</tspan> — Water in spaces</tspan><tspan x="541" dy="32">within soil and rock below ground.</tspan></text><text class="se-copy" x="541" y="642"><tspan x="541"><tspan class="se-bold">Water</tspan> <tspan class="se-bold">cycle</tspan> — The movement of</tspan><tspan x="541" dy="32">water through surface, underground</tspan><tspan x="541" dy="32">and atmospheric stores.</tspan></text><text class="se-copy" x="541" y="758"><tspan x="541"><tspan class="se-bold">Exposed</tspan> <tspan class="se-bold">surface</tspan> — The part of a</tspan><tspan x="541" dy="32">material directly in contact with its</tspan><tspan x="541" dy="32">surroundings.</tspan></text><text class="se-copy" x="541" y="874"><tspan x="541"><tspan class="se-bold">Evaporative</tspan> <tspan class="se-bold">cooling</tspan> — Cooling</tspan><tspan x="541" dy="32">when evaporation takes energy from</tspan><tspan x="541" dy="32">water and its surroundings.</tspan></text><g transform="translate(0 976)"><g data-page-illustration="figures/class-6/science/ch08/balance.png"><image class="science-illustration" href="../../figures/class-6/science/ch08/balance.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Comparing quantities of water.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Comparing quantities of water.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
