<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="cycle-task" transform="translate(0 112)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="326" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">In your notebook, sketch the landscape in Fig. 8.6 and label cloud, lake,</tspan><tspan x="113" dy="32">ocean, river, groundwater and snow. Add arrows for evaporation,</tspan><tspan x="113" dy="32">condensation and rain. Use the water already shown; vapour should not be</tspan><tspan x="113" dy="32">drawn as a white cloud.</tspan></text><text class="se-copy" x="113" y="232"><tspan x="113">Trace two possible journeys: one returning through a river and another</tspan><tspan x="113" dy="32">soaking into the ground. Explain each state change. Then check your map</tspan><tspan x="113" dy="32">with a partner and identify one part you still need to understand.</tspan></text></g>
<g class="v2-reading-block" data-block="water-cycle-0" transform="translate(0 460)"><text class="se-copy" x="89" y="24"><tspan x="89">The <tspan class="se-bold">water</tspan> <tspan class="se-bold">cycle</tspan> is water’s continuing movement between Earth’s surface,</tspan><tspan x="89" dy="32">below-ground stores and the atmosphere. Water evaporates from oceans, lakes</tspan></text></g>
<g class="v2-reading-block" data-block="water-cycle-1" transform="translate(0 524)"><text class="se-copy" x="89" y="24"><tspan x="89">and wet ground; plants also release water vapour. It can condense into droplets</tspan><tspan x="89" dy="32">and return as precipitation. Some water flows over land and some soaks into it.</tspan></text></g>
<g class="v2-reading-block" data-block="groundwater-0" transform="translate(0 604)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Groundwater</tspan> occupies spaces in soil and rock below ground. It is not always an</tspan><tspan x="89" dy="32">underground river or a large cavern of water. Water can remain in snow, ice,</tspan></text></g>
<g class="v2-reading-block" data-block="groundwater-1" transform="translate(0 668)"><text class="se-copy" x="89" y="24"><tspan x="89">lakes or underground for different lengths of time. There is no single fixed route</tspan><tspan x="89" dy="32">or starting point for every drop.</tspan></text></g>
<g class="v2-reading-block" data-block="water-care-0" transform="translate(0 748)"><text class="se-copy" x="89" y="24"><tspan x="89">Most of Earth’s water is salty ocean water. Much of the fresh water is frozen or</tspan><tspan x="89" dy="32">stored below ground, and accessible water may be polluted. Cycling water is not</tspan></text></g>
<g class="v2-reading-block" data-block="water-care-1" transform="translate(0 812)"><text class="se-copy" x="89" y="24"><tspan x="89">the same as providing unlimited clean water wherever people need it. Repair</tspan><tspan x="89" dy="32">leaks, avoid waste and keep pollutants out of water bodies.</tspan></text></g>
<g class="v2-reading-block" data-block="poem-0" transform="translate(0 892)"><text class="se-copy" x="89" y="24"><tspan x="89">Write a short poem in your notebook from the viewpoint of water changing state.</tspan><tspan x="89" dy="32">Include one invisible stage and one return to liquid or solid. Check that the</tspan><tspan x="89" dy="32">science remains correct even when you give the water a voice.</tspan></text></g><g transform="translate(0 1004)"><g data-page-illustration="figures/class-6/science/ch08/cycle.png"><image class="science-illustration" href="../../figures/class-6/science/ch08/cycle.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Water moving through nature.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Water moving through nature.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
