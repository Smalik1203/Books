<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 11"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="area-evidence-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">contact with the air. The cap-and-plate comparison is useful, but different</tspan><tspan x="89" dy="32">containers may also affect temperature; acknowledge that limit.</tspan></text></g>
<g class="v2-reading-block" data-block="milk-0" transform="translate(0 192)"><text class="se-copy" x="89" y="24"><tspan x="89">If milk replaces water, water can evaporate while other milk components remain.</tspan><tspan x="89" dy="32">A residue does not mean that no water evaporated. Use the same liquid when</tspan></text></g>
<g class="v2-reading-block" data-block="milk-1" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">testing evaporation conditions; changing the liquid too makes interpretation</tspan><tspan x="89" dy="32">harder.</tspan></text></g>
<g class="v2-reading-block" data-block="sun-task" transform="translate(0 336)"><rect class="se-activity-panel" x="89" y="0" width="874" height="478" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Put equal amounts of water in two identical caps. Place one in sunlight</tspan><tspan x="146" dy="32">and the other in shade. Begin together and prevent rain, splashing or</tspan><tspan x="146" dy="32">people moving the samples.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Check every 15 minutes and record the first time each appears dry.</tspan><tspan x="146" dy="32">Compare the conditions: besides sunshine, was the air movement</tspan><tspan x="146" dy="32">similar?</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Repeat on another day if possible. Record cloud cover, temperature and</tspan><tspan x="146" dy="32">wind each time.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">4.</text><text class="se-copy" x="146" y="384"><tspan x="146">Plan a separate test of moving air using equal wet cloth pieces in</tspan><tspan x="146" dy="32">otherwise similar positions. Ask your teacher before using a guarded fan;</tspan><tspan x="146" dy="32">keep water away from electrical equipment.</tspan></text></g><g transform="translate(0 836)"><g data-page-illustration="figures/class-6/science/ch08/evaporation.png"><image class="science-illustration" href="../../figures/class-6/science/ch08/evaporation.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Observing water in a container.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Observing water in a container.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">11</text></g></svg></div></div></section>
