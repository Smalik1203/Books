<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="speed-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">8.6 What Changes the Rate of Evaporation?</tspan></text></g>
<g class="v2-reading-block" data-block="speed-start-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Clothes dry differently on different days. To investigate a reason, change one</tspan><tspan x="89" dy="32">condition at a time as far as possible. Record what you change, what you keep the</tspan></text></g>
<g class="v2-reading-block" data-block="speed-start-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">same and what you measure. An unexpected result is useful if you can describe</tspan><tspan x="89" dy="32">the conditions carefully.</tspan></text></g>
<g class="v2-reading-block" data-block="evaporation-art" transform="translate(0 314)"><image class="science-illustration" data-photo="evaporation" href="../../figures/class-6/science/ch08/evaporation.png" x="244.26481257557435" y="0" width="563.4703748488513" height="245" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="275.88"><tspan x="89">Fig. 8.4 · A bottle cap and a shallow plate before water is added. Compare equal starting</tspan><tspan x="89" dy="27">amounts of water.</tspan></text></g>
<g class="v2-reading-block" data-block="area-task" transform="translate(0 651)"><rect class="se-activity-panel" x="89" y="0" width="874" height="446" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Measure equal small amounts of water into a bottle cap and a shallow</tspan><tspan x="146" dy="32">plate. Keep them next to each other in the same place, away from spills</tspan><tspan x="146" dy="32">and direct disturbance.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Predict which will dry first. Note which sample has more water surface</tspan><tspan x="146" dy="32">exposed to air. Keep the starting water temperature as similar as possible.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Start together and check at equal intervals. Record the time each first</tspan><tspan x="146" dy="32">appears dry. If neither dries during the lesson, continue observations</tspan><tspan x="146" dy="32">later; do not invent an end time.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">4.</text><text class="se-copy" x="146" y="384"><tspan x="146">Repeat if possible. Compare results and identify differences besides</tspan><tspan x="146" dy="32">exposed area, such as the containers’ materials or temperatures.</tspan></text></g>
<g class="v2-reading-block" data-block="area-evidence-0" transform="translate(0 1119)"><text class="se-copy" x="89" y="24"><tspan x="89">For equal amounts under otherwise similar conditions, spreading water over a</tspan><tspan x="89" dy="32">larger exposed area usually makes it evaporate faster. More liquid surface is in</tspan></text></g>
<g class="v2-reading-block" data-block="area-evidence-1" transform="translate(0 1183)"><text class="se-copy" x="89" y="24"><tspan x="89">contact with the air. The cap-and-plate comparison is useful, but different</tspan><tspan x="89" dy="32">containers may also affect temperature; acknowledge that limit.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
