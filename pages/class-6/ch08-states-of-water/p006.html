<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="mass-evidence" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">A measurable gain in the total assembly’s</tspan><tspan x="89" dy="32">mass is consistent with water arriving from</tspan><tspan x="89" dy="32">the air. Water merely leaking from inside to</tspan><tspan x="89" dy="32">the outside, while remaining on the weighed</tspan><tspan x="89" dy="32">tray, would not add mass to the assembly. A</tspan><tspan x="89" dy="32">gain supports condensation, but by itself does</tspan><tspan x="89" dy="32">not rule out a leak happening at the same</tspan><tspan x="89" dy="32">time.</tspan></text><image class="science-illustration" data-photo="balance" href="../../figures/class-6/science/ch08/balance.png" x="613" y="1.0070892410341798" width="350" height="382.98582151793164" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="417.88"><tspan x="89">Fig. 8.2 · Weigh the complete assembly, including the drip tray. The display here does not</tspan><tspan x="89" dy="27">show a result.</tspan></text></g>
<g class="v2-reading-block" data-block="mass-limits-0" transform="translate(0 585)"><text class="se-copy" x="89" y="24"><tspan x="89">Melting ice and changing temperature can alter the level inside, so a marked</tspan><tspan x="89" dy="32">level is not a decisive test on its own. Use a sound vessel, prevent spills and</tspan></text></g>
<g class="v2-reading-block" data-block="mass-limits-1" transform="translate(0 649)"><text class="se-copy" x="89" y="24"><tspan x="89">compare the room-temperature sample. A small change may be below the</tspan><tspan x="89" dy="32">balance’s resolution. If the data are unclear, explain the limits rather than forcing</tspan><tspan x="89" dy="32">a conclusion.</tspan></text></g>
<g class="v2-reading-block" data-block="humidity-0" transform="translate(0 761)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Humidity</tspan> describes water vapour in the air. Weather reports often give relative</tspan><tspan x="89" dy="32">humidity as a percentage; its meaning depends on temperature. If you collect</tspan></text></g>
<g class="v2-reading-block" data-block="humidity-1" transform="translate(0 825)"><text class="se-copy" x="89" y="24"><tspan x="89">humidity records, note the place, time and kind of humidity reported. A cold</tspan><tspan x="89" dy="32">surface tends to collect more condensate when enough vapour is available.</tspan></text></g>
<g class="v2-reading-block" data-block="awg" transform="translate(0 905)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="218" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Some water-harvesting machines cool moist air and collect condensed</tspan><tspan x="113" dy="32">water. How is this similar to droplets on a glass? Why would collecting water</tspan><tspan x="113" dy="32">alone not prove that it is safe to drink? Explain the need for clean equipment</tspan><tspan x="113" dy="32">and suitable treatment.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
