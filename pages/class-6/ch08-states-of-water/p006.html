<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="dew-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">the lid. These are liquid droplets, while the vapour before condensation is</tspan><tspan x="89" dy="32">invisible. Do not lift a hot lid yourself.</tspan></text></g>
<g class="v2-reading-block" data-block="mass-heading" transform="translate(0 204)"><text class="se-heading" x="89" y="30"><tspan x="89">Testing an Explanation with Measurements</tspan></text></g>
<g class="v2-reading-block" data-block="mass-task" transform="translate(0 252)"><rect class="se-activity-panel" x="89" y="0" width="874" height="510" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">With your teacher, place a half-filled cold-water tumbler with ice on a dry</tspan><tspan x="146" dy="32">tray. Cover it with a small plate. Dry all external surfaces and record the</tspan><tspan x="146" dy="32">mass of the entire assembly: tumbler, contents, cover and tray.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Predict whether this total mass will change. Place the assembly on a</tspan><tspan x="146" dy="32">suitable digital balance, protecting its electronics from water. Keep any</tspan><tspan x="146" dy="32">drips on the weighed tray.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Record time and total mass at 0, 5, 10, 15, 20, 25 and 30 minutes. Do not</tspan><tspan x="146" dy="32">add, remove or wipe anything between readings. Record the unit and the</tspan><tspan x="146" dy="32">smallest change the balance displays.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Compare your readings with the prediction. Repeat with a covered</tspan><tspan x="146" dy="32">room-temperature sample as a comparison. Note any handling, spills or</tspan><tspan x="146" dy="32">unstable readings.</tspan></text></g>
<g class="v2-reading-block" data-block="mass-evidence" transform="translate(0 784)"><text class="se-copy" x="89" y="24"><tspan x="89">A measurable gain in the total assembly’s</tspan><tspan x="89" dy="32">mass is consistent with water arriving from</tspan><tspan x="89" dy="32">the air. Water merely leaking from inside to</tspan><tspan x="89" dy="32">the outside, while remaining on the weighed</tspan><tspan x="89" dy="32">tray, would not add mass to the assembly. A</tspan><tspan x="89" dy="32">gain supports condensation, but by itself does</tspan><tspan x="89" dy="32">not rule out a leak happening at the same</tspan><tspan x="89" dy="32">time.</tspan></text><image class="science-illustration" data-photo="balance" href="../../figures/class-6/science/ch08/balance.png" x="613" y="1.0070892410341798" width="350" height="382.98582151793164" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="417.88"><tspan x="89">Fig. 8.2 · Weigh the complete assembly, including the drip tray. The display here does not</tspan><tspan x="89" dy="27">show a result.</tspan></text></g>
<g class="v2-reading-block" data-block="mass-limits-0" transform="translate(0 1257)"><text class="se-copy" x="89" y="24"><tspan x="89">Melting ice and changing temperature can alter the level inside, so a marked</tspan><tspan x="89" dy="32">level is not a decisive test on its own. Use a sound vessel, prevent spills and</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
