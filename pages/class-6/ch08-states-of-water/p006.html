<g class="v2-reading-block" data-block="condensation-art" transform="translate(0 192)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">Air commonly contains invisible water</tspan><tspan x="89" dy="32" data-narrow-prose="true">vapour. At a sufficiently cold surface, some</tspan><tspan x="89" dy="32" data-narrow-prose="true">vapour changes into liquid droplets. This</tspan><tspan x="89" dy="32" data-narrow-prose="true">change is <tspan class="se-bold">condensation</tspan>. The water has</tspan><tspan x="89" dy="32" data-narrow-prose="true">changed state; the glass has not made new</tspan><tspan x="89" dy="32" data-narrow-prose="true">water. The surface must be cold enough for</tspan><tspan x="89" dy="32" data-narrow-prose="true">the conditions, so not every glass becomes</tspan><tspan x="89" dy="32" data-paragraph-end="true">wet.</tspan></text><image class="science-illustration" data-photo="condensation" href="../../figures/class-6/science/ch08/condensation.png" x="623" y="0" width="330" height="330" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="362.88"><tspan x="89">Fig. 8.1 · Droplets outside a cold glass can come from the surrounding air.</tspan></text></g>
<g class="v2-reading-block" data-block="dew-0" transform="translate(0 583)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.11028" data-space-ratio="1.377">Dew<tspan dx="2.11028"> can</tspan><tspan dx="2.11028"> form</tspan><tspan dx="2.11028"> when</tspan><tspan dx="2.11028"> a</tspan><tspan dx="2.11028"> leaf</tspan><tspan dx="2.11028"> or</tspan><tspan dx="2.11028"> another</tspan><tspan dx="2.11028"> surface</tspan><tspan dx="2.11028"> cools</tspan><tspan dx="2.11028"> sufficiently,</tspan><tspan dx="2.11028"> often</tspan><tspan dx="2.11028"> overnight.</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.65527" data-space-ratio="1.296">On<tspan dx="1.65527"> a</tspan><tspan dx="1.65527"> covered</tspan><tspan dx="1.65527"> hot-water</tspan><tspan dx="1.65527"> vessel,</tspan><tspan dx="1.65527"> vapour</tspan><tspan dx="1.65527"> may</tspan><tspan dx="1.65527"> condense</tspan><tspan dx="1.65527"> on</tspan><tspan dx="1.65527"> the</tspan><tspan dx="1.65527"> cooler</tspan><tspan dx="1.65527"> underside</tspan><tspan dx="1.65527"> of</tspan></tspan></text></g>
