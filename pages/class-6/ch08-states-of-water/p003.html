<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="plate-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="446" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Put a spoonful of water on a clean, dry, uncracked steel plate. Predict</tspan><tspan x="146" dy="32">whether the underside will become wet.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Keep the plate level in a place where it will not be knocked or splashed.</tspan><tspan x="146" dy="32">Check the water and the underside at regular intervals.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Record the time and what changes. If the water becomes difficult to see,</tspan><tspan x="146" dy="32">explain how you would check whether any remains without tipping it</tspan><tspan x="146" dy="32">away.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352"><tspan x="146">Compare the evidence with your prediction. Which explanation does a</tspan><tspan x="146" dy="32">dry underside make less likely? Which possible route for the water still</tspan><tspan x="146" dy="32">needs explaining?</tspan></text></g>
<g class="v2-reading-block" data-block="evaporation-0" transform="translate(0 580)"><text class="se-copy" x="89" y="24"><tspan x="89">Liquid water can change into <tspan class="se-bold">water</tspan> <tspan class="se-bold">vapour</tspan>, its gaseous state, at an exposed</tspan><tspan x="89" dy="32">surface. This process is <tspan class="se-bold">evaporation</tspan>. It occurs at room temperature as well as in</tspan></text></g>
<g class="v2-reading-block" data-block="evaporation-1" transform="translate(0 644)"><text class="se-copy" x="89" y="24"><tspan x="89">warmer conditions. The water is still present as a substance, although it may</tspan><tspan x="89" dy="32">have mixed with the air and moved away.</tspan></text></g>
<g class="v2-reading-block" data-block="plate-evidence-0" transform="translate(0 724)"><text class="se-copy" x="89" y="24"><tspan x="89">If the top becomes dry while the underside stays dry, evaporation is a reasonable</tspan><tspan x="89" dy="32">explanation for this plate. Check for spills, cracks or someone moving the water</tspan></text></g>
<g class="v2-reading-block" data-block="plate-evidence-1" transform="translate(0 788)"><text class="se-copy" x="89" y="24"><tspan x="89">before drawing a conclusion. A puddle may lose water both by evaporation and</tspan><tspan x="89" dy="32">by soaking into the ground.</tspan></text></g>
<g class="v2-reading-block" data-block="invisible-vapour-0" transform="translate(0 868)"><text class="se-copy" x="89" y="24"><tspan x="89">Water vapour is invisible. The white mist above hot water is made of tiny liquid</tspan><tspan x="89" dy="32">droplets formed when vapour cools; it is not a picture of the gas itself. Observe</tspan></text></g>
<g class="v2-reading-block" data-block="invisible-vapour-1" transform="translate(0 932)"><text class="se-copy" x="89" y="24"><tspan x="89">hot pans or boiling water only from a safe distance in an adult-led</tspan><tspan x="89" dy="32">demonstration.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
