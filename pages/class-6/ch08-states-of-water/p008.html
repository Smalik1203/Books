<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="changing-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">8.5 Changing from One State to Another</tspan></text></g>
<g class="v2-reading-block" data-block="changes-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Melting</tspan> changes a solid into a liquid. <tspan class="se-bold">Freezing</tspan> changes a liquid into a solid. Ice</tspan><tspan x="89" dy="32">melts when it gains enough energy from its surroundings; water freezes when</tspan></text></g>
<g class="v2-reading-block" data-block="changes-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">enough energy is removed. Evaporation and condensation connect the liquid and</tspan><tspan x="89" dy="32">gaseous states.</tspan></text></g>
<g class="v2-reading-block" data-block="wax-oil-0" transform="translate(0 314)"><text class="se-copy" x="89" y="24"><tspan x="89">Other substances can change state too. Candle wax can melt on warming and</tspan><tspan x="89" dy="32">solidify on cooling. Coconut oil may partly solidify in cool weather. These</tspan></text></g>
<g class="v2-reading-block" data-block="wax-oil-1" transform="translate(0 378)"><text class="se-copy" x="89" y="24"><tspan x="89">examples do not mean that every substance changes state at the same</tspan><tspan x="89" dy="32">temperature. Leave demonstrations with flames or hot wax to the teacher.</tspan></text></g>
<g class="v2-reading-block" data-block="state-map-task" transform="translate(0 458)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">The diagram shows three states joined by opposite changes. Copy it in your</tspan><tspan x="113" dy="32">notebook. Use each word once to replace A, B and 1–3: liquid, gas, freezing,</tspan><tspan x="113" dy="32">evaporation, condensation. “Solid” and “melting” are already given.</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">For each arrow, state whether water gains energy or releases energy to its</tspan><tspan x="113" dy="32">surroundings. Explain why you can trace a return route without adding a</tspan><tspan x="113" dy="32">new substance.</tspan></text></g>
<g class="v2-reading-block" data-block="state-map" transform="translate(0 774)"><g class="v2-water-diagram" data-diagram="state-map"><rect class="v2-water-card" x="151" y="86" width="158" height="76" rx="14"/><text class="v2-water-label" x="230" y="133" text-anchor="middle">Solid</text><rect class="v2-water-card" x="447" y="86" width="158" height="76" rx="14"/><text class="v2-water-label" x="526" y="133" text-anchor="middle">A</text><rect class="v2-water-card" x="743" y="86" width="158" height="76" rx="14"/><text class="v2-water-label" x="822" y="133" text-anchor="middle">B</text><path class="v2-water-arrow" d="M317 96H439M428 89L439 96L428 103"/><text class="v2-water-label" x="378" y="62" text-anchor="middle">Melting</text><path class="v2-water-arrow" d="M439 151H317M328 144L317 151L328 158"/><text class="v2-water-label" x="378" y="199" text-anchor="middle">1</text><path class="v2-water-arrow" d="M613 96H735M724 89L735 96L724 103"/><text class="v2-water-label" x="674" y="62" text-anchor="middle">2</text><path class="v2-water-arrow" d="M735 151H613M624 144L613 151L624 158"/><text class="v2-water-label" x="674" y="199" text-anchor="middle">3</text><text class="v2-water-label" x="526" y="243" text-anchor="middle">Use each word once in your notebook.</text></g><text class="se-caption" x="89" y="282.88"><tspan x="89">Fig. 8.3 · Follow the direction of each arrow; opposite arrows represent different changes.</tspan></text></g>
<g class="v2-reading-block" data-block="state-map-explain-0" transform="translate(0 1085)"><text class="se-copy" x="89" y="24"><tspan x="89">Melting leads from solid to liquid; freezing leads back. Evaporation leads from</tspan><tspan x="89" dy="32">liquid to gas; condensation leads back. In each case the substance is still water.</tspan></text></g>
<g class="v2-reading-block" data-block="state-map-explain-1" transform="translate(0 1149)"><text class="se-copy" x="89" y="24"><tspan x="89">Changing its state does not destroy it, although it may move somewhere that is</tspan><tspan x="89" dy="32">hard to observe.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
