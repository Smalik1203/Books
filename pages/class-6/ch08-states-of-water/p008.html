<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="states-table" transform="translate(0 112)"><g data-comparison-table="states-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 8.2 · The three states of water</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Property</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="242.84" y="70.08"><tspan x="242.84">Ice: solid</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="478.82000000000005" y="70.08"><tspan x="478.82000000000005">Water: liquid</tspan></text></g><g data-comparison-cell="3"><text class="v2-table-heading" x="723.5400000000001" y="70.08"><tspan x="723.5400000000001">Water vapour: gas</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Shape</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="242.84" y="110.08"><tspan x="242.84">Keeps its own shape</tspan><tspan x="242.84" dy="28">until it deforms or</tspan><tspan x="242.84" dy="28">melts</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="478.82000000000005" y="110.08"><tspan x="478.82000000000005">Takes the shape of</tspan><tspan x="478.82000000000005" dy="28">the part of a</tspan><tspan x="478.82000000000005" dy="28">container it occupies</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="723.5400000000001" y="110.08"><tspan x="723.5400000000001">Spreads through the</tspan><tspan x="723.5400000000001" dy="28">available space</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="206.07999999999998"><tspan x="103">Volume of</tspan><tspan x="103" dy="28">a fixed</tspan><tspan x="103" dy="28">sample</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="242.84" y="206.07999999999998"><tspan x="242.84">Approximately fixed</tspan><tspan x="242.84" dy="28">under the same</tspan><tspan x="242.84" dy="28">conditions</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="478.82000000000005" y="206.07999999999998"><tspan x="478.82000000000005">Approximately fixed</tspan><tspan x="478.82000000000005" dy="28">under the same</tspan><tspan x="478.82000000000005" dy="28">conditions</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="723.5400000000001" y="206.07999999999998"><tspan x="723.5400000000001">Changes with the</tspan><tspan x="723.5400000000001" dy="28">space and conditions</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="274" y2="274"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="302.08"><tspan x="103">Flow</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="242.84" y="302.08"><tspan x="242.84">Does not pour like a</tspan><tspan x="242.84" dy="28">liquid in this test</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="478.82000000000005" y="302.08"><tspan x="478.82000000000005">Flows and can be</tspan><tspan x="478.82000000000005" dy="28">poured</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="723.5400000000001" y="302.08"><tspan x="723.5400000000001">Flows and mixes with</tspan><tspan x="723.5400000000001" dy="28">air</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="342" y2="342"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="370.08"><tspan x="103">Visibility</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="242.84" y="370.08"><tspan x="242.84">Usually visible</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="478.82000000000005" y="370.08"><tspan x="478.82000000000005">Visible in a container</tspan><tspan x="478.82000000000005" dy="28">or drops</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="723.5400000000001" y="370.08"><tspan x="723.5400000000001">Invisible; mist is</tspan><tspan x="723.5400000000001" dy="28">liquid droplets</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="410" y2="410"/><rect class="v2-table-frame" x="89" y="42" width="874" height="368"/><line class="v2-table-rule" x1="228.84" x2="228.84" y1="42" y2="410"/><line class="v2-table-rule" x1="464.82000000000005" x2="464.82000000000005" y1="42" y2="410"/><line class="v2-table-rule" x1="709.5400000000001" x2="709.5400000000001" y1="42" y2="410"/><text class="v2-table-note" x="89" y="442.88"><tspan x="89">The volume comparison concerns a sample staying in one state under similar conditions.</tspan><tspan x="89" dy="26">Water changes volume when it freezes or melts.</tspan></text></g></g>
<g class="v2-reading-block" data-block="other-states-0" transform="translate(0 602)"><text class="se-copy" x="89" y="24"><tspan x="89">Stones, wood and glass are everyday solids. Milk and cooking oil are liquids.</tspan><tspan x="89" dy="32">Oxygen and carbon dioxide are gases. Smells can spread because some</tspan></text></g>
<g class="v2-reading-block" data-block="other-states-1" transform="translate(0 666)"><text class="se-copy" x="89" y="24"><tspan x="89">substances enter the air and move with it; smell is not a way to identify water</tspan><tspan x="89" dy="32">vapour. Never sniff an unknown substance to test its state.</tspan></text></g>
<g class="v2-reading-block" data-block="changing-heading" transform="translate(0 758)"><text class="v2-title" x="89" y="38"><tspan x="89">8.5 Changing from One State to Another</tspan></text></g>
<g class="v2-reading-block" data-block="changes-0" transform="translate(0 816)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Melting</tspan> changes a solid into a liquid. <tspan class="se-bold">Freezing</tspan> changes a liquid into a solid. Ice</tspan><tspan x="89" dy="32">melts when it gains enough energy from its surroundings; water freezes when</tspan></text></g>
<g class="v2-reading-block" data-block="changes-1" transform="translate(0 880)"><text class="se-copy" x="89" y="24"><tspan x="89">enough energy is removed. Evaporation and condensation connect the liquid and</tspan><tspan x="89" dy="32">gaseous states.</tspan></text></g>
<g class="v2-reading-block" data-block="wax-oil-0" transform="translate(0 960)"><text class="se-copy" x="89" y="24"><tspan x="89">Other substances can change state too. Candle wax can melt on warming and</tspan><tspan x="89" dy="32">solidify on cooling. Coconut oil may partly solidify in cool weather. These</tspan></text></g><g transform="translate(0 1024)"><g data-page-illustration="figures/class-6/science/ch08/balance.png"><image class="science-illustration" href="../../figures/class-6/science/ch08/balance.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Comparing quantities of water.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Comparing quantities of water.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
