<g class="v2-reading-block" data-block="cold-intro" transform="translate(0 170)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.25884" data-space-ratio="1.225">While<tspan dx="1.25884"> preparing</tspan><tspan dx="1.25884"> lemonade,</tspan><tspan dx="1.25884"> the</tspan><tspan dx="1.25884"> children</tspan><tspan dx="1.25884"> notice</tspan><tspan dx="1.25884"> a</tspan><tspan dx="1.25884"> change</tspan><tspan dx="1.25884"> on</tspan><tspan dx="1.25884"> the</tspan><tspan dx="1.25884"> outside</tspan><tspan dx="1.25884"> of</tspan><tspan dx="1.25884"> a</tspan><tspan dx="1.25884"> cold</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="8.24774" data-space-ratio="2.475">tumbler.<tspan dx="8.24774"> The</tspan><tspan dx="8.24774"> water</tspan><tspan dx="8.24774"> is</tspan><tspan dx="8.24774"> inside</tspan><tspan dx="8.24774"> the</tspan><tspan dx="8.24774"> glass,</tspan><tspan dx="8.24774"> so</tspan><tspan dx="8.24774"> an</tspan><tspan dx="8.24774"> outside</tspan><tspan dx="8.24774"> change</tspan><tspan dx="8.24774"> raises</tspan><tspan dx="8.24774"> a</tspan><tspan dx="8.24774"> new</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">question. Begin by observing before choosing an explanation.</tspan></text></g>
<g class="v2-reading-block" data-block="cold-task" transform="translate(0 282)"><rect class="se-activity-panel" x="89" y="0" width="874" height="424" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Activity 8.3"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Activity 8.3</text></g><text class="se-activity-step" x="132" y="102" text-anchor="end">1.</text><text class="se-copy" x="146" y="102" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="0.76591" data-space-ratio="1.137">Put<tspan dx="0.76591"> cold</tspan><tspan dx="0.76591"> water</tspan><tspan dx="0.76591"> and</tspan><tspan dx="0.76591"> a</tspan><tspan dx="0.76591"> few</tspan><tspan dx="0.76591"> ice</tspan><tspan dx="0.76591"> cubes</tspan><tspan dx="0.76591"> in</tspan><tspan dx="0.76591"> a</tspan><tspan dx="0.76591"> sound</tspan><tspan dx="0.76591"> glass</tspan><tspan dx="0.76591"> tumbler.</tspan><tspan dx="0.76591"> Carefully</tspan><tspan dx="0.76591"> dry</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">its outside and stand it on a dry tray. Wipe up any filling splashes.</tspan></text><text class="se-activity-step" x="132" y="178" text-anchor="end">2.</text><text class="se-copy" x="146" y="178" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="2.43623" data-space-ratio="1.436">Leave<tspan dx="2.43623"> it</tspan><tspan dx="2.43623"> undisturbed</tspan><tspan dx="2.43623"> for</tspan><tspan dx="2.43623"> about</tspan><tspan dx="2.43623"> five</tspan><tspan dx="2.43623"> minutes.</tspan><tspan dx="2.43623"> Record</tspan><tspan dx="2.43623"> what</tspan><tspan dx="2.43623"> you</tspan><tspan dx="2.43623"> see</tspan><tspan dx="2.43623"> on</tspan><tspan dx="2.43623"> the</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">outside under two notebook headings: “I observe” and “I wonder”.</tspan></text><text class="se-activity-step" x="132" y="254" text-anchor="end">3.</text><text class="se-copy" x="146" y="254" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="6.12453" data-space-ratio="2.095">Suggest<tspan dx="6.12453"> more</tspan><tspan dx="6.12453"> than</tspan><tspan dx="6.12453"> one</tspan><tspan dx="6.12453"> explanation</tspan><tspan dx="6.12453"> for</tspan><tspan dx="6.12453"> any</tspan><tspan dx="6.12453"> droplets.</tspan><tspan dx="6.12453"> Compare</tspan><tspan dx="6.12453"> with</tspan><tspan dx="6.12453"> a</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="5.92381" data-space-ratio="2.059">similar,<tspan dx="5.92381"> externally</tspan><tspan dx="5.92381"> dry</tspan><tspan dx="5.92381"> tumbler</tspan><tspan dx="5.92381"> holding</tspan><tspan dx="5.92381"> room-temperature</tspan><tspan dx="5.92381"> water.</tspan><tspan dx="5.92381"> Keep</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">the place and observation time the same.</tspan></text><text class="se-activity-step" x="132" y="362" text-anchor="end">4.</text><text class="se-copy" x="146" y="362" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="0.89630" data-space-ratio="1.160">Discuss<tspan dx="0.89630"> what</tspan><tspan dx="0.89630"> this</tspan><tspan dx="0.89630"> comparison</tspan><tspan dx="0.89630"> can</tspan><tspan dx="0.89630"> show</tspan><tspan dx="0.89630"> and</tspan><tspan dx="0.89630"> what</tspan><tspan dx="0.89630"> it</tspan><tspan dx="0.89630"> cannot.</tspan><tspan dx="0.89630"> If</tspan><tspan dx="0.89630"> droplets</tspan><tspan dx="0.89630"> do</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">not appear, record that result too.</tspan></text></g>
<g class="v2-reading-block" data-block="cold-evidence" transform="translate(0 738)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.42912" data-space-ratio="1.256">Droplets<tspan dx="1.42912"> may</tspan><tspan dx="1.42912"> appear</tspan><tspan dx="1.42912"> on</tspan><tspan dx="1.42912"> the</tspan><tspan dx="1.42912"> cold</tspan><tspan dx="1.42912"> glass</tspan><tspan dx="1.42912"> even</tspan><tspan dx="1.42912"> though</tspan><tspan dx="1.42912"> no</tspan><tspan dx="1.42912"> water</tspan><tspan dx="1.42912"> was</tspan><tspan dx="1.42912"> poured</tspan><tspan dx="1.42912"> onto</tspan><tspan dx="1.42912"> its</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.03342" data-space-ratio="1.721">outside.<tspan dx="4.03342"> Compare</tspan><tspan dx="4.03342"> your</tspan><tspan dx="4.03342"> observations</tspan><tspan dx="4.03342"> with</tspan><tspan dx="4.03342"> the</tspan><tspan dx="4.03342"> illustration.</tspan><tspan dx="4.03342"> An</tspan><tspan dx="4.03342"> unchanged</tspan><tspan dx="4.03342"> water</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.47063" data-space-ratio="1.263">level<tspan dx="1.47063"> alone</tspan><tspan dx="1.47063"> is</tspan><tspan dx="1.47063"> weak</tspan><tspan dx="1.47063"> evidence</tspan><tspan dx="1.47063"> against</tspan><tspan dx="1.47063"> leakage:</tspan><tspan dx="1.47063"> a</tspan><tspan dx="1.47063"> small</tspan><tspan dx="1.47063"> change</tspan><tspan dx="1.47063"> may</tspan><tspan dx="1.47063"> be</tspan><tspan dx="1.47063"> too</tspan><tspan dx="1.47063"> small</tspan><tspan dx="1.47063"> to</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">notice.</tspan></text></g>
<g class="v2-reading-block" data-block="condensation-art" transform="translate(0 882)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">Air commonly contains invisible water</tspan><tspan x="89" dy="32" data-narrow-prose="true">vapour. At a sufficiently cold surface, some</tspan><tspan x="89" dy="32" data-narrow-prose="true">vapour changes into liquid droplets. This</tspan><tspan x="89" dy="32" data-narrow-prose="true">change is <tspan class="se-bold">condensation</tspan>. The water has</tspan><tspan x="89" dy="32" data-narrow-prose="true">changed state; the glass has not made new</tspan><tspan x="89" dy="32" data-narrow-prose="true">water. The surface must be cold enough for</tspan><tspan x="89" dy="32" data-narrow-prose="true">the conditions, so not every glass becomes</tspan><tspan x="89" dy="32" data-paragraph-end="true">wet.</tspan></text><image class="science-illustration" data-photo="condensation" href="../../figures/class-6/science/ch08/condensation.png" x="623" y="0" width="330" height="330" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="362.88"><tspan x="89">Fig. 8.1 · Droplets outside a cold glass can come from the surrounding air.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">5</text></g></svg></div></div></section>
