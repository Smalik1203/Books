<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="droplets-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">8.3 Droplets Outside a Cold Glass</tspan></text></g>
<g class="v2-reading-block" data-block="cold-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">While preparing lemonade, the children notice a change on the outside of a cold</tspan><tspan x="89" dy="32">tumbler. The water is inside the glass, so an outside change raises a new</tspan><tspan x="89" dy="32">question. Begin by observing before choosing an explanation.</tspan></text></g>
<g class="v2-reading-block" data-block="cold-task" transform="translate(0 282)"><rect class="se-activity-panel" x="89" y="0" width="874" height="414" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Put cold water and a few ice cubes in a sound glass tumbler. Carefully dry</tspan><tspan x="146" dy="32">its outside and stand it on a dry tray. Wipe up any filling splashes.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Leave it undisturbed for about five minutes. Record what you see on the</tspan><tspan x="146" dy="32">outside under two notebook headings: “I observe” and “I wonder”.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Suggest more than one explanation for any droplets. Compare with a</tspan><tspan x="146" dy="32">similar, externally dry tumbler holding room-temperature water. Keep</tspan><tspan x="146" dy="32">the place and observation time the same.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352"><tspan x="146">Discuss what this comparison can show and what it cannot. If droplets do</tspan><tspan x="146" dy="32">not appear, record that result too.</tspan></text></g>
<g class="v2-reading-block" data-block="cold-evidence-0" transform="translate(0 718)"><text class="se-copy" x="89" y="24"><tspan x="89">Droplets may appear on the cold glass even though no water was poured onto its</tspan><tspan x="89" dy="32">outside. Compare your observations with the illustration. An unchanged water</tspan></text></g>
<g class="v2-reading-block" data-block="cold-evidence-1" transform="translate(0 782)"><text class="se-copy" x="89" y="24"><tspan x="89">level alone is weak evidence against leakage: a small change may be too small to</tspan><tspan x="89" dy="32">notice.</tspan></text></g>
<g class="v2-reading-block" data-block="condensation-art" transform="translate(0 862)"><text class="se-copy" x="89" y="24"><tspan x="89">Air commonly contains invisible water</tspan><tspan x="89" dy="32">vapour. At a sufficiently cold surface, some</tspan><tspan x="89" dy="32">vapour changes into liquid droplets. This</tspan><tspan x="89" dy="32">change is <tspan class="se-bold">condensation</tspan>. The water has</tspan><tspan x="89" dy="32">changed state; the glass has not made new</tspan><tspan x="89" dy="32">water. The surface must be cold enough for</tspan><tspan x="89" dy="32">the conditions, so not every glass becomes</tspan><tspan x="89" dy="32">wet.</tspan></text><image class="science-illustration" data-photo="condensation" href="../../figures/class-6/science/ch08/condensation.png" x="623" y="0" width="330" height="330" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="362.88"><tspan x="89">Fig. 8.1 · Droplets outside a cold glass can come from the surrounding air.</tspan></text></g>
<g class="v2-reading-block" data-block="dew-0" transform="translate(0 1253)"><text class="se-copy" x="89" y="24"><tspan x="89">Dew can form when a leaf or another surface cools sufficiently, often overnight.</tspan><tspan x="89" dy="32">On a covered hot-water vessel, vapour may condense on the cooler underside of</tspan></text></g>
<g class="v2-reading-block" data-block="dew-1" transform="translate(0 1317)"><text class="se-copy" x="89" y="24"><tspan x="89">the lid. These are liquid droplets, while the vapour before condensation is</tspan><tspan x="89" dy="32">invisible. Do not lift a hot lid yourself.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">5</text></g></svg></div></div></section>
