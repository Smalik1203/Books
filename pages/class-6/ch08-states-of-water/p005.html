<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="cold-evidence-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">level alone is weak evidence against leakage: a small change may be too small to</tspan><tspan x="89" dy="32">notice.</tspan></text></g>
<g class="v2-reading-block" data-block="condensation-art" transform="translate(0 192)"><text class="se-copy" x="89" y="24"><tspan x="89">Air commonly contains invisible water</tspan><tspan x="89" dy="32">vapour. At a sufficiently cold surface, some</tspan><tspan x="89" dy="32">vapour changes into liquid droplets. This</tspan><tspan x="89" dy="32">change is <tspan class="se-bold">condensation</tspan>. The water has</tspan><tspan x="89" dy="32">changed state; the glass has not made new</tspan><tspan x="89" dy="32">water. The surface must be cold enough for</tspan><tspan x="89" dy="32">the conditions, so not every glass becomes</tspan><tspan x="89" dy="32">wet.</tspan></text><image class="science-illustration" data-photo="condensation" href="../../figures/class-6/science/ch08/condensation.png" x="623" y="0" width="330" height="330" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="362.88"><tspan x="89">Fig. 8.1 · Droplets outside a cold glass can come from the surrounding air.</tspan></text></g>
<g class="v2-reading-block" data-block="dew-0" transform="translate(0 583)"><text class="se-copy" x="89" y="24"><tspan x="89">Dew can form when a leaf or another surface cools sufficiently, often overnight.</tspan><tspan x="89" dy="32">On a covered hot-water vessel, vapour may condense on the cooler underside of</tspan></text></g>
<g class="v2-reading-block" data-block="dew-1" transform="translate(0 647)"><text class="se-copy" x="89" y="24"><tspan x="89">the lid. These are liquid droplets, while the vapour before condensation is</tspan><tspan x="89" dy="32">invisible. Do not lift a hot lid yourself.</tspan></text></g>
<g class="v2-reading-block" data-block="mass-heading" transform="translate(0 739)"><text class="se-heading" x="89" y="30"><tspan x="89">Testing an Explanation with Measurements</tspan></text></g>
<g class="v2-reading-block" data-block="mass-task" transform="translate(0 787)"><rect class="se-activity-panel" x="89" y="0" width="874" height="510" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">With your teacher, place a half-filled cold-water tumbler with ice on a dry</tspan><tspan x="146" dy="32">tray. Cover it with a small plate. Dry all external surfaces and record the</tspan><tspan x="146" dy="32">mass of the entire assembly: tumbler, contents, cover and tray.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Predict whether this total mass will change. Place the assembly on a</tspan><tspan x="146" dy="32">suitable digital balance, protecting its electronics from water. Keep any</tspan><tspan x="146" dy="32">drips on the weighed tray.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Record time and total mass at 0, 5, 10, 15, 20, 25 and 30 minutes. Do not</tspan><tspan x="146" dy="32">add, remove or wipe anything between readings. Record the unit and the</tspan><tspan x="146" dy="32">smallest change the balance displays.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Compare your readings with the prediction. Repeat with a covered</tspan><tspan x="146" dy="32">room-temperature sample as a comparison. Note any handling, spills or</tspan><tspan x="146" dy="32">unstable readings.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">5</text></g></svg></div></div></section>
