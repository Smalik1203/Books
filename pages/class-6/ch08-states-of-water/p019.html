<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="19" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 19"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Explore Further</tspan></text></g>
<g class="v2-reading-block" data-block="project-hands" transform="translate(0 170)"><text class="se-heading" x="89" y="30"><tspan x="89">1. Compare cooling at your hands</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Wet one hand with clean water and leave the other dry. Gently blow air across</tspan><tspan x="89" dy="32">each, or fan them in the same way. Record how they feel and explain a possible</tspan><tspan x="89" dy="32">reason. Swap the wet hand and repeat. Which conditions should stay the same,</tspan><tspan x="89" dy="32">and why is a sensation not an exact temperature measurement?</tspan></text></g>
<g class="v2-reading-block" data-block="project-game" transform="translate(0 374)"><text class="se-heading" x="89" y="30"><tspan x="89">2. Design a water-journey game</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Make a board or card game with stores such as a lake, cloud, ocean, ice and</tspan><tspan x="89" dy="32">groundwater. Let players move only when they explain a possible movement or</tspan><tspan x="89" dy="32">state change. Include cards about evaporation, condensation, freezing and water</tspan><tspan x="89" dy="32">conservation. Allow more than one route, and test the rules with another group.</tspan></text><g transform="translate(0 192)"><g class="v2-water-diagram" data-diagram="game"><rect class="v2-water-card" x="119" y="12" width="256" height="192" rx="14"/><text class="v2-water-card-title" x="247" y="52" text-anchor="middle">Lake</text><text class="v2-water-label" x="247" y="107" text-anchor="middle">Name a change</text><text class="v2-water-label" x="247" y="137" text-anchor="middle">that takes water</text><text class="v2-water-label" x="247" y="167" text-anchor="middle">into the air.</text><rect class="v2-water-card" x="397" y="12" width="256" height="192" rx="14"/><text class="v2-water-card-title" x="525" y="52" text-anchor="middle">Cloud</text><text class="v2-water-label" x="525" y="107" text-anchor="middle">Name one way</text><text class="v2-water-label" x="525" y="137" text-anchor="middle">water can return</text><text class="v2-water-label" x="525" y="167" text-anchor="middle">to the surface.</text><rect class="v2-water-card" x="675" y="12" width="256" height="192" rx="14"/><text class="v2-water-card-title" x="803" y="52" text-anchor="middle">Groundwater</text><text class="v2-water-label" x="803" y="107" text-anchor="middle">Describe a store</text><text class="v2-water-label" x="803" y="137" text-anchor="middle">where water may</text><text class="v2-water-label" x="803" y="167" text-anchor="middle">remain for a while.</text></g></g><text class="se-caption" x="89" y="442.88"><tspan x="89">A card can name a starting store and ask the player to explain a possible next step.</tspan></text></g>
<g class="v2-reading-block" data-block="project-roleplay" transform="translate(0 847)"><text class="se-heading" x="89" y="30"><tspan x="89">3. Act out a water cycle</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">With your teacher, assign roles for water stores, energy from sunlight, air</tspan><tspan x="89" dy="32">movement and gravity. Act out two different routes rather than one compulsory</tspan><tspan x="89" dy="32">circle. Explain where water changes state and where it only moves. Include a</tspan><tspan x="89" dy="32">pause underground or as snow, and make clear that the actors representing</tspan><tspan x="89" dy="32">vapour are a model of something invisible.</tspan></text></g>
<g class="v2-reading-block" data-block="project-humidity" transform="translate(0 1083)"><text class="se-heading" x="89" y="30"><tspan x="89">4. Read a humidity record</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Collect monthly humidity data for one place from a reliable weather source.</tspan><tspan x="89" dy="32">Record the type of humidity, time of observation and the accompanying</tspan><tspan x="89" dy="32">temperature where available. Look for a pattern and explain the limits of the</tspan><tspan x="89" dy="32">comparison. What would you still need to predict how quickly a particular wet</tspan><tspan x="89" dy="32">cloth will dry?</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">19</text></g></svg></div></div></section>
