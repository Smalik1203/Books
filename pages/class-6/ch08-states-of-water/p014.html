<g class="v2-reading-block" data-block="cooling" transform="translate(0 170)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="6.23254" data-space-ratio="2.115">Evaporation<tspan dx="6.23254"> requires</tspan><tspan dx="6.23254"> energy.</tspan><tspan dx="6.23254"> Water</tspan><tspan dx="6.23254"> that</tspan><tspan dx="6.23254"> evaporates</tspan><tspan dx="6.23254"> from</tspan><tspan dx="6.23254"> a</tspan><tspan dx="6.23254"> wet</tspan><tspan dx="6.23254"> surface</tspan><tspan dx="6.23254"> takes</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="6.03053" data-space-ratio="2.078">energy<tspan dx="6.03053"> from</tspan><tspan dx="6.03053"> the</tspan><tspan dx="6.03053"> remaining</tspan><tspan dx="6.03053"> water</tspan><tspan dx="6.03053"> and</tspan><tspan dx="6.03053"> its</tspan><tspan dx="6.03053"> surroundings.</tspan><tspan dx="6.03053"> If</tspan><tspan dx="6.03053"> this</tspan><tspan dx="6.03053"> energy</tspan><tspan dx="6.03053"> is</tspan><tspan dx="6.03053"> not</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.10739" data-space-ratio="1.377">replaced<tspan dx="2.10739"> as</tspan><tspan dx="2.10739"> quickly,</tspan><tspan dx="2.10739"> the</tspan><tspan dx="2.10739"> surface</tspan><tspan dx="2.10739"> cools.</tspan><tspan dx="2.10739"> A</tspan><tspan dx="2.10739"> fan</tspan><tspan dx="2.10739"> can</tspan><tspan dx="2.10739"> help</tspan><tspan dx="2.10739"> sweat</tspan><tspan dx="2.10739"> evaporate</tspan><tspan dx="2.10739"> from</tspan><tspan dx="2.10739"> skin</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">by replacing nearby moist air.</tspan></text></g>
<g class="v2-reading-block" data-block="earthen-pot" transform="translate(0 314)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">An unglazed earthen pot has tiny connected</tspan><tspan x="89" dy="32" data-narrow-prose="true">pores. A little water seeps to its outer surface</tspan><tspan x="89" dy="32" data-narrow-prose="true">and evaporates, taking energy from the pot</tspan><tspan x="89" dy="32" data-narrow-prose="true">and its contents. A steel pot does not have the</tspan><tspan x="89" dy="32" data-narrow-prose="true">same porous wall. A surahi uses this same</tspan><tspan x="89" dy="32" data-narrow-prose="true">evaporative-cooling principle; shape alone</tspan><tspan x="89" dy="32" data-paragraph-end="true">does not produce the cooling.</tspan></text><image class="science-illustration" data-photo="cooler" href="../../figures/class-6/science/ch08/cooler.png" x="613" y="10.670731707317088" width="350" height="363.6585365853658" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="417.88"><tspan x="89">Fig. 8.5 · A cooler cutaway: moist sand surrounds the inner pot, within the porous outer pot.</tspan></text></g>

/tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">sand moist, but do not let water reach electronic equipment.</tspan></text><text class="se-activity-step" x="132" y="394" text-anchor="end">4.</text><text class="se-copy" x="146" y="394" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="1.87416" data-space-ratio="1.335">Compare<tspan dx="1.87416"> the</tspan><tspan dx="1.87416"> readings.</tspan><tspan dx="1.87416"> If</tspan><tspan dx="1.87416"> observing</tspan><tspan dx="1.87416"> vegetables</tspan><tspan dx="1.87416"> daily</tspan><tspan dx="1.87416"> for</tspan><tspan dx="1.87416"> a</tspan><tspan dx="1.87416"> week,</tspan><tspan dx="1.87416"> compare</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="3.40269" data-space-ratio="1.608">similar<tspan dx="3.40269"> samples</tspan><tspan dx="3.40269"> kept</tspan><tspan dx="3.40269"> in</tspan><tspan dx="3.40269"> the</tspan><tspan dx="3.40269"> same</tspan><tspan dx="3.40269"> shade</tspan><tspan dx="3.40269"> outside</tspan><tspan dx="3.40269"> the</tspan><tspan dx="3.40269"> cooler.</tspan><tspan dx="3.40269"> Do</tspan><tspan dx="3.40269"> not</tspan><tspan dx="3.40269"> taste</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">the test food; ask an adult to discard any spoiled material.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
