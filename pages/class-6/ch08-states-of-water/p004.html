<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="drying-table" transform="translate(0 112)"><g data-comparison-table="drying-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 8.1 · Following water as something dries</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="68"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Observation</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="365.2" y="70.08"><tspan x="365.2">Possible movement of</tspan><tspan x="365.2" dy="28">water</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="671.0999999999999" y="70.08"><tspan x="671.0999999999999">What to check</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="110" y2="110"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="138.07999999999998"><tspan x="103">A puddle gets smaller</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="365.2" y="138.07999999999998"><tspan x="365.2">Evaporation and soaking</tspan><tspan x="365.2" dy="28">into the ground</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.0999999999999" y="138.07999999999998"><tspan x="671.0999999999999">Ground material, weather</tspan><tspan x="671.0999999999999" dy="28">and any runoff</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="206.07999999999998"><tspan x="103">A steel plate becomes</tspan><tspan x="103" dy="28">dry</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="365.2" y="206.07999999999998"><tspan x="365.2">Evaporation from its upper</tspan><tspan x="365.2" dy="28">surface</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.0999999999999" y="206.07999999999998"><tspan x="671.0999999999999">No spills or leaks; check</tspan><tspan x="671.0999999999999" dy="28">the underside</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="246" y2="246"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="274.08"><tspan x="103">Wet clothes dry</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="365.2" y="274.08"><tspan x="365.2">Water evaporates into the</tspan><tspan x="365.2" dy="28">surrounding air</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.0999999999999" y="274.08"><tspan x="671.0999999999999">Air movement, weather</tspan><tspan x="671.0999999999999" dy="28">and exposed cloth</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="314" y2="314"/><rect class="v2-table-frame" x="89" y="42" width="874" height="272"/><line class="v2-table-rule" x1="351.2" x2="351.2" y1="42" y2="314"/><line class="v2-table-rule" x1="657.0999999999999" x2="657.0999999999999" y1="42" y2="314"/><text class="v2-table-note" x="89" y="346.88"><tspan x="89">A disappearing patch of liquid is an observation. Its cause needs evidence.</tspan></text></g></g>
<g class="v2-reading-block" data-block="other-liquids-0" transform="translate(0 480)"><text class="se-copy" x="89" y="24"><tspan x="89">Liquids other than water can evaporate too. Alcohol in some hand sanitisers</tspan><tspan x="89" dy="32">evaporates readily. Do not use sanitiser, perfume, petrol or other volatile liquids</tspan></text></g>
<g class="v2-reading-block" data-block="other-liquids-1" transform="translate(0 544)"><text class="se-copy" x="89" y="24"><tspan x="89">for these investigations: some are flammable or harmful. Use water for</tspan><tspan x="89" dy="32">classroom comparisons.</tspan></text></g>
<g class="v2-reading-block" data-block="droplets-heading" transform="translate(0 636)"><text class="v2-title" x="89" y="38"><tspan x="89">8.3 Droplets Outside a Cold Glass</tspan></text></g>
<g class="v2-reading-block" data-block="cold-intro-0" transform="translate(0 694)"><text class="se-copy" x="89" y="24"><tspan x="89">While preparing lemonade, the children notice a change on the outside of a cold</tspan><tspan x="89" dy="32">tumbler. The water is inside the glass, so an outside change raises a new</tspan><tspan x="89" dy="32">question. Begin by observing before choosing an explanation.</tspan></text></g>
<g class="v2-reading-block" data-block="cold-task" transform="translate(0 806)"><rect class="se-activity-panel" x="89" y="0" width="874" height="414" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Put cold water and a few ice cubes in a sound glass tumbler. Carefully dry</tspan><tspan x="146" dy="32">its outside and stand it on a dry tray. Wipe up any filling splashes.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Leave it undisturbed for about five minutes. Record what you see on the</tspan><tspan x="146" dy="32">outside under two notebook headings: “I observe” and “I wonder”.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Suggest more than one explanation for any droplets. Compare with a</tspan><tspan x="146" dy="32">similar, externally dry tumbler holding room-temperature water. Keep</tspan><tspan x="146" dy="32">the place and observation time the same.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352"><tspan x="146">Discuss what this comparison can show and what it cannot. If droplets do</tspan><tspan x="146" dy="32">not appear, record that result too.</tspan></text></g>
<g class="v2-reading-block" data-block="cold-evidence-0" transform="translate(0 1242)"><text class="se-copy" x="89" y="24"><tspan x="89">Droplets may appear on the cold glass even though no water was poured onto its</tspan><tspan x="89" dy="32">outside. Compare your observations with the illustration. An unchanged water</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
