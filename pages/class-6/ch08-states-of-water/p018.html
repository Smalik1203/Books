<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="802" rx="18"/><text class="se-copy" x="113" y="222" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">State</tspan> — A physical form of matter,</tspan><tspan x="113" dy="32" data-paragraph-end="true">such as solid, liquid or gas.</tspan></text><text class="se-copy" x="113" y="306" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Solid</tspan> — Matter with its own shape</tspan><tspan x="113" dy="32" data-narrow-prose="true">and approximately fixed volume</tspan><tspan x="113" dy="32" data-paragraph-end="true">under the same conditions.</tspan></text><text class="se-copy" x="113" y="422" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Liquid</tspan> — Matter that flows, with no</tspan><tspan x="113" dy="32" data-narrow-prose="true">fixed shape but approximately fixed</tspan><tspan x="113" dy="32" data-paragraph-end="true">volume.</tspan></text><text class="se-copy" x="113" y="538" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Gas</tspan> — Matter that spreads through</tspan><tspan x="113" dy="32" data-narrow-prose="true">available space and has no fixed</tspan><tspan x="113" dy="32" data-paragraph-end="true">shape or volume.</tspan></text><text class="se-copy" x="113" y="654" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Water</tspan> <tspan class="se-bold">vapour</tspan> — Water in its</tspan><tspan x="113" dy="32" data-paragraph-end="true">invisible gaseous state.</tspan></text><text class="se-copy" x="113" y="738" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Evaporation</tspan> — Change from liquid</tspan><tspan x="113" dy="32" data-paragraph-end="true">to gas at an exposed surface.</tspan></text><text class="se-copy" x="113" y="822" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Condensation</tspan> — Change from a gas</tspan><tspan x="113" dy="32" data-paragraph-end="true">into a liquid.</tspan></text><text class="se-copy" x="113" y="906" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Melting</tspan> — Change from a solid into</tspan><tspan x="113" dy="32" data-paragraph-end="true">a liquid.</tspan></text><text class="se-copy" x="541" y="222" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Freezing</tspan> — Change from a liquid</tspan><tspan x="541" dy="32" data-paragraph-end="true">into a solid.</tspan></text><text class="se-copy" x="541" y="306" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Humidity</tspan> — A description of water</tspan><tspan x="541" dy="32" data-paragraph-end="true">vapour in the air.</tspan></text><text class="se-copy" x="541" y="390" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Dew</tspan> — Liquid water that condenses</tspan><tspan x="541" dy="32" data-paragraph-end="true">on a sufficiently cooled surface.</tspan></text><text class="se-copy" x="541" y="474" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Precipitation</tspan> — Water falling from</tspan><tspan x="541" dy="32" data-paragraph-end="true">clouds as rain, snow or hail.</tspan></text><text class="se-copy" x="541" y="558" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Groundwater</tspan> — Water in spaces</tspan><tspan x="541" dy="32" data-paragraph-end="true">within soil and rock below ground.</tspan></text><text class="se-copy" x="541" y="642" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Water</tspan> <tspan class="se-bold">cycle</tspan> — The movement of</tspan><tspan x="541" dy="32" data-narrow-prose="true">water through surface, underground</tspan><tspan x="541" dy="32" data-paragraph-end="true">and atmospheric stores.</tspan></text><text class="se-copy" x="541" y="758" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Exposed</tspan> <tspan class="se-bold">surface</tspan> — The part of a</tspan><tspan x="541" dy="32" data-narrow-prose="true">material directly in contact with its</tspan><tspan x="541" dy="32" data-paragraph-end="true">surroundings.</tspan></text><text class="se-copy" x="541" y="874" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Evaporative</tspan> <tspan class="se-bold">cooling</tspan> — Cooling</tspan><tspan x="541" dy="32" data-narrow-prose="true">when evaporation takes energy from</tspan><tspan x="541" dy="32" data-paragraph-end="true">water and its surroundings.</tspan></text><g transform="translate(0 976)"><g data-page-illustration="figures/class-7/science/ch07/water-cycle.png"><image class="science-illustration" href="../../figures/class-7/science/ch07/water-cycle.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Water cycle.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Water cycle.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
