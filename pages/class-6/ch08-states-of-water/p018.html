<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204"><tspan x="112">Ice, liquid water and water vapour are different states of the same substance.</tspan><tspan x="112" dy="32">Water vapour is invisible.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278"><tspan x="112">Melting changes solid to liquid; freezing changes liquid to solid. Heating and</tspan><tspan x="112" dy="32">cooling can cause changes of state.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352"><tspan x="112">Evaporation changes surface liquid into gas and can happen at room</tspan><tspan x="112" dy="32">temperature. Water is not destroyed when it dries from a surface.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426"><tspan x="112">Condensation changes vapour into liquid. Outside droplets on a cold glass can</tspan><tspan x="112" dy="32">come from the air.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500"><tspan x="112">A solid retains its shape, a liquid takes the shape of its container, and a gas</tspan><tspan x="112" dy="32">spreads through available space. Compare volumes under stated conditions.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574"><tspan x="112">Larger exposed area, higher temperature and moving air usually speed</tspan><tspan x="112" dy="32">evaporation. Higher humidity at the same temperature usually slows net</tspan><tspan x="112" dy="32">evaporation.</tspan></text><text class="se-copy" x="89" y="680" text-anchor="start">•</text><text class="se-copy" x="112" y="680"><tspan x="112">Evaporation requires energy and can cause cooling. Earthen pots and</tspan><tspan x="112" dy="32">pot-in-pot coolers use this effect.</tspan></text><text class="se-copy" x="89" y="754" text-anchor="start">•</text><text class="se-copy" x="112" y="754"><tspan x="112">Clouds contain droplets, ice crystals or both. Cooling moist air and particle</tspan><tspan x="112" dy="32">growth help explain cloud formation and precipitation.</tspan></text><text class="se-copy" x="89" y="828" text-anchor="start">•</text><text class="se-copy" x="112" y="828"><tspan x="112">Water moves between the surface, the ground and the atmosphere. Clean</tspan><tspan x="112" dy="32">accessible water is limited, so use it carefully.</tspan></text><text class="se-copy" x="89" y="902" text-anchor="start">•</text><text class="se-copy" x="112" y="902"><tspan x="112">Separate observations from explanations. Predict, record actual results,</tspan><tspan x="112" dy="32">compare fairly and state the limits of the evidence.</tspan></text><image class="science-illustration" data-photo="cycle" href="../../figures/class-6/science/ch08/cycle.png" x="328.4465811965812" y="987" width="395.1068376068376" height="220" preserveAspectRatio="xMidYMid meet"/><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
