<g class="v2-reading-block" data-block="q1" transform="translate(0 250)"><text class="se-copy" x="111" y="24" text-anchor="end">1.</text><text class="se-copy" x="132" y="24"><tspan x="132">Which best defines condensation? (a)</tspan><tspan x="132" dy="32">Water soaking into soil. (b) Liquid water</tspan><tspan x="132" dy="32">changing into gas. (c) Ice changing into</tspan><tspan x="132" dy="32">liquid water. (d) Water vapour changing</tspan><tspan x="132" dy="32">into liquid water.</tspan></text><image class="science-illustration" data-photo="condensation" href="../../figures/class-6/science/ch08/condensation.png" x="650" y="5" width="290" height="290" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="332.88"><tspan x="89">Use the droplets on the outside of this cold glass to explain your choice.</tspan></text></g>

<g class="v2-reading-block" data-block="q3" transform="translate(0 957)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24"><tspan x="132">An area around natural grass often feels cooler than a similar area covered in</tspan><tspan x="132" dy="32">plastic grass. Explain how water loss from plants and soil could contribute.</tspan><tspan x="132" dy="32">What other conditions should be compared before concluding that</tspan><tspan x="132" dy="32">evaporation alone caused the difference?</tspan></text></g>
