<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q4" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24"><tspan x="132">Name two liquids other than water that can evaporate, using familiar</tspan><tspan x="132" dy="32">examples or a reliable source. Explain why you should not test unknown or</tspan><tspan x="132" dy="32">flammable liquids in this chapter’s activities.</tspan></text></g>
<g class="v2-reading-block" data-block="q5" transform="translate(0 238)"><text class="se-copy" x="111" y="24" text-anchor="end">5.</text><text class="se-copy" x="132" y="24"><tspan x="132">A fan can help dry wet clothes and also make sweaty skin feel cooler. Explain</tspan><tspan x="132" dy="32">how moving air can produce both effects, even though the fan does not need</tspan><tspan x="132" dy="32">to warm the clothes.</tspan></text></g>
<g class="v2-reading-block" data-block="q6" transform="translate(0 364)"><text class="se-copy" x="111" y="24" text-anchor="end">6.</text><text class="se-copy" x="132" y="24"><tspan x="132">Dewatering and drying can reduce the mass of wet drain sludge that must be</tspan><tspan x="132" dy="32">transported. Explain why. Does leaving sludge in a heap for a few days</tspan><tspan x="132" dy="32">guarantee that it is safe to handle or use on food-growing soil? Give a reason.</tspan><tspan x="132" dy="32">Do not touch or collect drain sludge.</tspan></text></g>
<g class="v2-reading-block" data-block="q7" transform="translate(0 522)"><text class="se-copy" x="111" y="24" text-anchor="end">7.</text><text class="se-copy" x="132" y="24"><tspan x="132">Observe ordinary household activities for a day from a safe distance. Identify</tspan><tspan x="132" dy="32">three involving evaporation. For each, explain how changing one condition</tspan><tspan x="132" dy="32">could make drying faster or slower, and whether that change would be</tspan><tspan x="132" dy="32">useful.</tspan></text></g>
<g class="v2-reading-block" data-block="q8" transform="translate(0 680)"><text class="se-copy" x="111" y="24" text-anchor="end">8.</text><text class="se-copy" x="132" y="24"><tspan x="132">Give examples of water in its solid state in nature. Distinguish these from</tspan><tspan x="132" dy="32">visible clouds or mist, which may contain liquid droplets.</tspan></text></g>
<g class="v2-reading-block" data-block="q9" transform="translate(0 774)"><text class="se-copy" x="111" y="24" text-anchor="end">9.</text><text class="se-copy" x="132" y="24"><tspan x="132">Discuss the statement “Water is our responsibility before it is our right.”</tspan><tspan x="132" dy="32">Suggest two practical ways to reduce waste or pollution, while recognising</tspan><tspan x="132" dy="32">everyone’s need for safe water.</tspan></text></g>
<g class="v2-reading-block" data-block="q10" transform="translate(0 900)"><text class="se-copy" x="111" y="24" text-anchor="end">10.</text><text class="se-copy" x="132" y="24"><tspan x="132">A two-wheeler’s seat becomes very hot in the Sun. With an adult moving the</tspan><tspan x="132" dy="32">vehicle into shade, how might you cool the seat before use? Explain the role</tspan><tspan x="132" dy="32">of a damp cloth and evaporation. Keep water away from electrical parts and</tspan><tspan x="132" dy="32">allow the seat to dry; do not test a very hot surface with bare skin.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
