<g class="v2-reading-block" data-block="ice-evidence-0" transform="translate(0 662)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.53504" data-space-ratio="1.096">An<tspan dx="0.53504"> ice</tspan><tspan dx="0.53504"> cube</tspan><tspan dx="0.53504"> left</tspan><tspan dx="0.53504"> in</tspan><tspan dx="0.53504"> a</tspan><tspan dx="0.53504"> warm</tspan><tspan dx="0.53504"> room</tspan><tspan dx="0.53504"> usually</tspan><tspan dx="0.53504"> becomes</tspan><tspan dx="0.53504"> liquid</tspan><tspan dx="0.53504"> water.</tspan><tspan dx="0.53504"> Cooling</tspan><tspan dx="0.53504"> that</tspan><tspan dx="0.53504"> water</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.66906" data-space-ratio="1.120">sufficiently<tspan dx="0.66906"> turns</tspan><tspan dx="0.66906"> it</tspan><tspan dx="0.66906"> back</tspan><tspan dx="0.66906"> into</tspan><tspan dx="0.66906"> ice.</tspan><tspan dx="0.66906"> No</tspan><tspan dx="0.66906"> extra</tspan><tspan dx="0.66906"> substance</tspan><tspan dx="0.66906"> needs</tspan><tspan dx="0.66906"> to</tspan><tspan dx="0.66906"> be</tspan><tspan dx="0.66906"> added</tspan><tspan dx="0.66906"> for</tspan><tspan dx="0.66906"> either</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">change. Ice and liquid water are different <tspan class="se-bold">states</tspan> of the same substance.</tspan></text></g>
