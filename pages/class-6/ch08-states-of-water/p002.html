<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="same-water-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">8.1 Ice and Water: One Substance</tspan></text></g>
<g class="v2-reading-block" data-block="ice-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Ice and liquid water behave differently. That difference does not by itself prove</tspan><tspan x="89" dy="32">that they are different substances. We can follow one sample through a change</tspan><tspan x="89" dy="32">and look for evidence of what happens.</tspan></text></g>
<g class="v2-reading-block" data-block="ice-task" transform="translate(0 282)"><rect class="se-activity-panel" x="89" y="0" width="874" height="338" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Put an ice cube in a clean, dry cup on a stable table. Predict what you will</tspan><tspan x="146" dy="32">see after it has been left in the room for a while.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Observe at regular intervals. Sketch the ice and any liquid you notice,</tspan><tspan x="146" dy="32">adding the time beside each sketch. Do not add more water.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Describe the change. With an adult’s help, place the resulting water in a</tspan><tspan x="146" dy="32">suitable freezer-safe container. Compare it after freezing. Never use a</tspan><tspan x="146" dy="32">sealed glass container in a freezer.</tspan></text></g>
<g class="v2-reading-block" data-block="ice-evidence-0" transform="translate(0 642)"><text class="se-copy" x="89" y="24"><tspan x="89">An ice cube left in a warm room usually becomes liquid water. Cooling that water</tspan><tspan x="89" dy="32">sufficiently turns it back into ice. No extra substance needs to be added for either</tspan><tspan x="89" dy="32">change. Ice and liquid water are different <tspan class="se-bold">states</tspan> of the same substance.</tspan></text></g>
<g class="v2-reading-block" data-block="ice-change-0" transform="translate(0 754)"><text class="se-copy" x="89" y="24"><tspan x="89">The ice takes in energy from its warmer surroundings as it melts. In a freezer,</tspan><tspan x="89" dy="32">energy is removed from the water as it freezes. The changes are linked to heating</tspan><tspan x="89" dy="32">and cooling, even when there is no flame or heater next to the cup.</tspan></text></g><g transform="translate(0 866)"><g data-page-illustration="figures/class-6/science/ch08/balance.png"><image class="science-illustration" href="../../figures/class-6/science/ch08/balance.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Comparing quantities of water.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Comparing quantities of water.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
