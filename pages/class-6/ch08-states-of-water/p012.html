<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="cooler-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">The wet outer surface must lose water by evaporation for this cooling to work</tspan><tspan x="89" dy="32">well. Dry moving air can help; very humid air can limit the effect. A pot-in-pot</tspan></text></g>
<g class="v2-reading-block" data-block="cooler-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">cooler is not a refrigerator and does not guarantee that food remains safe for any</tspan><tspan x="89" dy="32">fixed number of days.</tspan></text></g>
<g class="v2-reading-block" data-block="cooler-think" transform="translate(0 256)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="218" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A group finds almost no cooling in its pot-in-pot model. Before rejecting the</tspan><tspan x="113" dy="32">idea, what would you check about the outer pot, moisture, airflow, weather</tspan><tspan x="113" dy="32">and thermometer placement? If you replace sand with another material,</tspan><tspan x="113" dy="32">how will you make the comparison fair?</tspan></text></g>
<g class="v2-reading-block" data-block="clouds-heading" transform="translate(0 508)"><text class="v2-title" x="89" y="38"><tspan x="89">8.8 Clouds, Rain and the Water Cycle</tspan></text></g>
<g class="v2-reading-block" data-block="clouds-0" transform="translate(0 566)"><text class="se-copy" x="89" y="24"><tspan x="89">Water vapour travels with moving air. When moist air rises, it often expands as</tspan><tspan x="89" dy="32">the pressure falls and cools. If it cools sufficiently, vapour condenses onto tiny</tspan></text></g>
<g class="v2-reading-block" data-block="clouds-1" transform="translate(0 630)"><text class="se-copy" x="89" y="24"><tspan x="89">particles to form droplets. Clouds can contain liquid droplets, ice crystals or</tspan><tspan x="89" dy="32">both. Their visible part is not water vapour.</tspan></text></g>
<g class="v2-reading-block" data-block="rising-air-0" transform="translate(0 710)"><text class="se-copy" x="89" y="24"><tspan x="89">Air may be lifted by warming near the ground, by winds meeting, or by being</tspan><tspan x="89" dy="32">pushed over hills. Do not picture water vapour rising on its own like a separate</tspan></text></g>
<g class="v2-reading-block" data-block="rising-air-1" transform="translate(0 774)"><text class="se-copy" x="89" y="24"><tspan x="89">balloon. It is mixed with the air, and cloud formation depends on cooling and</tspan><tspan x="89" dy="32">moisture, not just on being high above the ground.</tspan></text></g>
<g class="v2-reading-block" data-block="rain-0" transform="translate(0 854)"><text class="se-copy" x="89" y="24"><tspan x="89">Cloud droplets and ice particles can grow. When precipitation particles become</tspan><tspan x="89" dy="32">large enough to fall through the surrounding air, they may reach the ground as</tspan></text></g>
<g class="v2-reading-block" data-block="rain-1" transform="translate(0 918)"><text class="se-copy" x="89" y="24"><tspan x="89">rain or, in suitable conditions, snow or hail. Snow and hail are solid water; they</tspan><tspan x="89" dy="32">are not simply larger liquid drops.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
