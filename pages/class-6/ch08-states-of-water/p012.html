<section class="page page--food page--science-editorial page--science-v2 page--g6-ch08" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="A Journey through States of Water, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5ZM29 61Q23 77 41 82"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">A Journey through States of Water</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="rate-table" transform="translate(0 112)"><g data-comparison-table="rate-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 8.3 · Conditions that can affect evaporation</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="68"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Condition changed</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="365.2" y="70.08"><tspan x="365.2">Usual effect, other</tspan><tspan x="365.2" dy="28">conditions similar</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="644.88" y="70.08"><tspan x="644.88">Reason</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="110" y2="110"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="138.07999999999998"><tspan x="103">Larger exposed surface</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="365.2" y="138.07999999999998"><tspan x="365.2">Faster evaporation</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="138.07999999999998"><tspan x="644.88">More liquid surface is</tspan><tspan x="644.88" dy="28">exposed</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="206.07999999999998"><tspan x="103">Higher water</tspan><tspan x="103" dy="28">temperature</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="365.2" y="206.07999999999998"><tspan x="365.2">Faster evaporation</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="206.07999999999998"><tspan x="644.88">More energy is available for</tspan><tspan x="644.88" dy="28">water to leave the liquid</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="246" y2="246"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="274.08"><tspan x="103">More air movement</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="365.2" y="274.08"><tspan x="365.2">Faster evaporation</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="274.08"><tspan x="644.88">Moist air near the surface is</tspan><tspan x="644.88" dy="28">replaced</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="314" y2="314"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="342.08"><tspan x="103">Higher relative</tspan><tspan x="103" dy="28">humidity at the same</tspan><tspan x="103" dy="28">temperature</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="365.2" y="342.08"><tspan x="365.2">Slower net evaporation</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="342.08"><tspan x="644.88">The surrounding air already</tspan><tspan x="644.88" dy="28">contains more water vapour</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="410" y2="410"/><rect class="v2-table-frame" x="89" y="42" width="874" height="368"/><line class="v2-table-rule" x1="351.2" x2="351.2" y1="42" y2="410"/><line class="v2-table-rule" x1="630.88" x2="630.88" y1="42" y2="410"/><text class="v2-table-note" x="89" y="442.88"><tspan x="89">Real weather changes several conditions together. One sunny-day comparison does not</tspan><tspan x="89" dy="26">isolate all of them.</tspan></text></g></g>
<g class="v2-reading-block" data-block="rainy-day-0" transform="translate(0 602)"><text class="se-copy" x="89" y="24"><tspan x="89">Clothes often dry slowly on a humid rainy day. They may dry faster when spread</tspan><tspan x="89" dy="32">out where air can move around them. Shelter them from new rain and keep wet</tspan></text></g>
<g class="v2-reading-block" data-block="rainy-day-1" transform="translate(0 666)"><text class="se-copy" x="89" y="24"><tspan x="89">fabric away from heaters and electrical parts. A fan moves air; it does not have to</tspan><tspan x="89" dy="32">make the cloth hotter to help it dry.</tspan></text></g><g transform="translate(0 746)"><g data-page-illustration="figures/class-6/science/ch08/evaporation.png"><image class="science-illustration" href="../../figures/class-6/science/ch08/evaporation.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Observing water in a container.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Observing water in a container.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
