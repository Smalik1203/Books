<section class="page page--food page--science-editorial" data-science-chapter="2" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World, page 7"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M31 63Q34 30 60 7"/><path class="se-botanical-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 2</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Diversity in the Living World</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header -->
<text class="se-heading" x="89" y="124"><tspan x="89">2.2.1 Grouping Plants</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="174"><tspan x="89">Look<tspan data-gap="" dx="1.29375"> </tspan>at<tspan data-gap="" dx="1.29375"> </tspan>Table<tspan data-gap="" dx="1.29375"> </tspan>2.1<tspan data-gap="" dx="1.29375"> </tspan>again.<tspan data-gap="" dx="1.29375"> </tspan>The<tspan data-gap="" dx="1.29375"> </tspan>features<tspan data-gap="" dx="1.29375"> </tspan>you<tspan data-gap="" dx="1.29375"> </tspan>wrote<tspan data-gap="" dx="1.29375"> </tspan>there<tspan data-gap="" dx="1.29375"> </tspan>—<tspan data-gap="" dx="1.29375"> </tspan>stem,<tspan data-gap="" dx="1.29375"> </tspan>leaves,<tspan data-gap="" dx="1.29375"> </tspan>flowers<tspan data-gap="" dx="1.29375"> </tspan>—<tspan data-gap="" dx="1.29375"> </tspan>are</tspan><tspan x="89" dy="31">the same features we can use to sort plants.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="250"><tspan x="89">Begin with the stem. It is the easiest one to test with your hands.</tspan></text>
<rect class="se-activity-panel" x="89" y="286" width="874" height="416"/><path class="se-activity-tab" d="M109 272H943Q963 272 963 292V315H89V292Q89 272 109 272Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="278" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="300" text-anchor="start">The setup</text><text class="se-activity-step" x="128" y="348" text-anchor="end">1.</text><text class="se-copy" x="146" y="348"><tspan x="146">Go out to the same place as before. Choose six plants of clearly different</tspan><tspan x="146" dy="31">sizes.</tspan></text><text class="se-activity-step" x="128" y="422" text-anchor="end">2.</text><text class="se-copy" x="146" y="422"><tspan x="146">Stand next to each one. Is it shorter than you, about your height, or taller?</tspan></text><text class="se-activity-step" x="128" y="465" text-anchor="end">3.</text><text class="se-copy" x="146" y="465"><tspan x="146">Look at the stem near the ground. Is it green or brown?</tspan></text><text class="se-activity-step" x="128" y="508" text-anchor="end">4.</text><text class="se-copy" x="146" y="508"><tspan x="146">Bend the stem very gently with one finger. Does it bend, or is it stiff? Stop as</tspan><tspan x="146" dy="31">soon as you feel it resist. A broken stem can kill the plant.</tspan></text><text class="se-activity-step" x="128" y="582" text-anchor="end">5.</text><text class="se-copy" x="146" y="582"><tspan x="146">See where the branches start. Near the ground, or higher up?</tspan></text><text class="se-activity-step" x="128" y="625" text-anchor="end">6.</text><text class="se-copy" x="146" y="625"><tspan x="146">Use the headings in Table 2.3 to make your own notebook table. Leave the</tspan><tspan x="146" dy="31">last column empty for now.</tspan></text>
<rect class="se-prompt" x="89" y="722" width="874" height="154"/><line class="se-think-rule" x1="89" x2="963" y1="722" y2="722"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What you saw"><svg class="se-feature-icon se-feature--observe" x="113" y="731" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="760">What you saw</text></g><text class="se-copy" x="113" y="817"><tspan x="113">Before you fill the last column, guess which plants will end up in the same</tspan><tspan x="113" dy="31">group.</tspan></text>
<text class="se-copy se-note" data-measure="874" x="89" y="917"><tspan x="89">Copy<tspan data-gap="" dx="4.38000"> </tspan>the<tspan data-gap="" dx="4.38000"> </tspan>headings<tspan data-gap="" dx="4.38000"> </tspan>into<tspan data-gap="" dx="4.38000"> </tspan>your<tspan data-gap="" dx="4.38000"> </tspan>notebook<tspan data-gap="" dx="4.38000"> </tspan>and<tspan data-gap="" dx="4.38000"> </tspan>add<tspan data-gap="" dx="4.38000"> </tspan>your<tspan data-gap="" dx="4.38000"> </tspan>own<tspan data-gap="" dx="4.38000"> </tspan>observations.<tspan data-gap="" dx="4.38000"> </tspan>The<tspan data-gap="" dx="4.38000"> </tspan>rows</tspan><tspan x="89" dy="31">below are examples, not a complete record.</tspan></text>
