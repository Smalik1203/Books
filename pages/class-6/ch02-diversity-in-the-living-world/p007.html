6.2517162471396" y="801.6666666666667" text-anchor="middle">Tomato · herb</text><text class="se-copy" x="89" y="848.6666666666667"><tspan x="89"><tspan class="se-bold">Trees</tspan> are woody plants</tspan><tspan x="89" dy="31">that usually develop a</tspan><tspan x="89" dy="31">main trunk supporting a</tspan><tspan x="89" dy="31">crown of branches.</tspan><tspan x="89" dy="31">Mango is an example. A</tspan><tspan x="89" dy="31">young mango is still a</tspan><tspan x="89" dy="31">tree even when it is</tspan><tspan x="89" dy="31">shorter than a mature</tspan><tspan x="89" dy="31">tomato plant.</tspan></text><text class="se-copy" x="391" y="848.6666666666667"><tspan x="391"><tspan class="se-bold">Shrubs</tspan> are woody plants</tspan><tspan x="391" dy="31">that usually branch close</tspan><tspan x="391" dy="31">to the ground, often with</tspan><tspan x="391" dy="31">several main stems. A</tspan><tspan x="391" dy="31">rose bush is an example.</tspan><tspan x="391" dy="31">Observe the branching as</tspan><tspan x="391" dy="31">well as the height.</tspan></text><text class="se-copy" x="693" y="848.6666666666667"><tspan x="693">Plants with soft,</tspan><tspan x="693" dy="31">non-woody stems are</tspan><tspan x="693" dy="31">called <tspan class="se-bold">herbs</tspan>. Many are</tspan><tspan x="693" dy="31">small, such as mint,</tspan><tspan x="693" dy="31">coriander and tomato,</tspan><tspan x="693" dy="31">but height alone does not</tspan><tspan x="693" dy="31">define a herb.</tspan></text><line class="se-editorial-divider" x1="89" x2="963" y1="1130.6666666666667" y2="1130.6666666666667"/><text class="se-copy" data-measure="874" x="89" y="1177.6666666666667"><tspan x="89">Woody<tspan data-gap="" dx="0.38965"> </tspan>stems<tspan data-gap="" dx="0.38965"> </tspan>support<tspan data-gap="" dx="0.38965"> </tspan>branches<tspan data-gap="" dx="0.38965"> </tspan>and<tspan data-gap="" dx="0.38965"> </tspan>can<tspan data-gap="" dx="0.38965"> </tspan>thicken<tspan data-gap="" dx="0.38965"> </tspan>as<tspan data-gap="" dx="0.38965"> </tspan>a<tspan data-gap="" dx="0.38965"> </tspan>plant<tspan data-gap="" dx="0.38965"> </tspan>grows.<tspan data-gap="" dx="0.38965"> </tspan>Look<tspan data-gap="" dx="0.38965"> </tspan>at<tspan data-gap="" dx="0.38965"> </tspan>the<tspan data-gap="" dx="0.38965"> </tspan>base<tspan data-gap="" dx="0.38965"> </tspan>of</tspan><tspan x="89" dy="31">a tree and then a herb: what differences can you describe without damaging either?</tspan></text><!-- table-frame --><line class="se-table-column-rule" x1="263.8" x2="263.8" y1="138" y2="351"/><line class="se-table-column-rule" x1="438.6" x2="438.6" y1="138" y2="351"/><line class="se-table-column-rule" x1="613.4000000000001" x2="613.4000000000001" y1="138" y2="351"/><line class="se-table-column-rule" x1="788.2" x2="788.2" y1="138" y2="351"/><rect class="se-table-frame" x="89" y="138" width="874" height="213"/><!-- /table-frame -->
