<text class="se-copy" data-measure="874" x="89" y="119"><tspan x="89">A<tspan data-gap="" dx="1.87003"> </tspan>banana<tspan data-gap="" dx="1.87003"> </tspan>plant<tspan data-gap="" dx="1.87003"> </tspan>is<tspan data-gap="" dx="1.87003"> </tspan>a<tspan data-gap="" dx="1.87003"> </tspan>large<tspan data-gap="" dx="1.87003"> </tspan>herb.<tspan data-gap="" dx="1.87003"> </tspan>Its<tspan data-gap="" dx="1.87003"> </tspan>trunk-like<tspan data-gap="" dx="1.87003"> </tspan>structure<tspan data-gap="" dx="1.87003"> </tspan>is<tspan data-gap="" dx="1.87003"> </tspan>a<tspan data-gap="" dx="1.87003"> </tspan><tspan class="se-bold">pseudostem</tspan>,<tspan data-gap="" dx="1.87003"> </tspan>made<tspan data-gap="" dx="1.87003"> </tspan>from</tspan><tspan x="89" dy="31">tightly<tspan data-gap="" dx="1.00556"> </tspan>overlapping<tspan data-gap="" dx="1.00556"> </tspan>leaf<tspan data-gap="" dx="1.00556"> </tspan>bases<tspan data-gap="" dx="1.00556"> </tspan>rather<tspan data-gap="" dx="1.00556"> </tspan>than<tspan data-gap="" dx="1.00556"> </tspan>a<tspan data-gap="" dx="1.00556"> </tspan>woody<tspan data-gap="" dx="1.00556"> </tspan>trunk.<tspan data-gap="" dx="1.00556"> </tspan>Its<tspan data-gap="" dx="1.00556"> </tspan>height<tspan data-gap="" dx="1.00556"> </tspan>does<tspan data-gap="" dx="1.00556"> </tspan>not<tspan data-gap="" dx="1.00556"> </tspan>make<tspan data-gap="" dx="1.00556"> </tspan>it</tspan><tspan x="89" dy="31">a tree.</tspan></text><line class="se-editorial-divider" x1="89" x2="963" y1="207" y2="207"/><text class="se-heading" x="89" y="259"><tspan x="89">Plants That Cannot Stand Up</tspan></text><text class="se-copy" data-measure="874" x="89" y="309"><tspan x="89">Not every plant can hold itself up.</tspan></text><image class="science-illustration" href="../../figures/class-6/science/ch02/climbers.png" x="89" y="335" width="874" height="325" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="363.87185354691076" y="685" text-anchor="middle">Climber · grape vine</text><text class="se-caption" x="688.1281464530892" y="685" text-anchor="middle">Creeper · pumpkin</text><text class="se-copy" x="89" y="732"><tspan x="89">Some plants have stems that are too</tspan><tspan x="89" dy="31">weak to stand. So they climb up</tspan><tspan x="89" dy="31">something else — a wall, a fence, a stick,</tspan><tspan x="89" dy="31">or another plant. These are called</tspan><tspan x="89" dy="31"><tspan class="se-bold">climbers</tspan>. A money plant is a climber. So</tspan><tspan x="89" dy="31">is a grape vine.</tspan></text><text class="se-copy" x="542" y="732"><tspan x="542">Other plants also have weak stems. But</tspan><tspan x="542" dy="31">instead of climbing, they spread flat</tspan><tspan x="542" dy="31">along the ground. These are called</tspan><tspan x="542" dy="31"><tspan class="se-bold">creepers</tspan>. Pumpkin and watermelon</tspan><tspan x="542" dy="31">plants are creepers.</tspan></text><line class="se-editorial-divider" x1="89" x2="963" y1="921" y2="921"/><text class="se-copy" data-measure="874" x="89" y="968"><tspan x="89">Climbing<tspan data-gap="" dx="6.79553"> </tspan>and<tspan data-gap="" dx="6.79553"> </tspan>trailing<tspan data-gap="" dx="6.79553"> </tspan>describe<tspan data-gap="" dx="6.79553"> </tspan>growth<tspan data-gap="" dx="6.79553"> </tspan>habits,<tspan data-gap="" dx="6.79553"> </tspan>not<tspan data-gap="" dx="6.79553"> </tspan>a<tspan data-gap="" dx="6.79553"> </tspan>separate<tspan data-gap="" dx="6.79553"> </tspan>woody/non-woody</tspan><tspan x="89" dy="31">division.<tspan data-gap="" dx="1.37879"> </tspan>A<tspan data-gap="" dx="1.37879"> </tspan>grape<tspan data-gap="" dx="1.37879"> </tspan>vine<tspan data-gap="" dx="1.37879"> </tspan>is<tspan data-gap="" dx="1.37879"> </tspan>a<tspan data-gap="" dx="1.37879"> </tspan>woody<tspan data-gap="" dx="1.37879"> </tspan>climber;<tspan data-gap="" dx="1.37879"> </tspan>a<tspan data-gap="" dx="1.37879"> </tspan>pumpkin<tspan data-gap="" dx="1.37879"> </tspan>has<tspan data-gap="" dx="1.37879"> </tspan>non-woody<tspan data-gap="" dx="1.37879"> </tspan>trailing<tspan data-gap="" dx="1.37879"> </tspan>stems.</tspan><tspan x="89" dy="31">A plant can therefore be described in more than one way.</tspan></text><text class="se-copy" data-measure="874" x="89" y="1079"><tspan x="89">A<tspan data-gap="" dx="4.81163"> </tspan>climber<tspan data-gap="" dx="4.81163"> </tspan>and<tspan data-gap="" dx="4.81163"> </tspan>a<tspan data-gap="" dx="4.81163"> </tspan>creeper<tspan data-gap="" dx="4.81163"> </tspan>both<tspan data-gap="" dx="4.81163"> </tspan>have<tspan data-gap="" dx="4.81163"> </tspan>stems<tspan data-gap="" dx="4.81163"> </tspan>that<tspan data-gap="" dx="4.81163"> </tspan>need<tspan data-gap="" dx="4.81163"> </tspan>support<tspan data-gap="" dx="4.81163"> </tspan>or<tspan data-gap="" dx="4.81163"> </tspan>spread<tspan data-gap="" dx="4.81163"> </tspan>along<tspan data-gap="" dx="4.81163"> </tspan>the</tspan><tspan x="89" dy="31">ground.<tspan data-gap="" dx="5.02617"> </tspan>What<tspan data-gap="" dx="5.02617"> </tspan>observations<tspan data-gap="" dx="5.02617"> </tspan>would<tspan data-gap="" dx="5.02617"> </tspan>you<tspan data-gap="" dx="5.02617"> </tspan>need<tspan data-gap="" dx="5.02617"> </tspan>before<tspan data-gap="" dx="5.02617"> </tspan>deciding<tspan data-gap="" dx="5.02617"> </tspan>which<tspan data-gap="" dx="5.02617"> </tspan>receives<tspan data-gap="" dx="5.02617"> </tspan>more</tspan><tspan x="89" dy="31">light?</tspan></text><text class="se-copy" data-measure="874" x="89" y="1190"><tspan x="89">So<tspan data-gap="" dx="2.54170"> </tspan>far<tspan data-gap="" dx="2.54170"> </tspan>you<tspan data-gap="" dx="2.54170"> </tspan>have<tspan data-gap="" dx="2.54170"> </tspan>grouped<tspan data-gap="" dx="2.54170"> </tspan>plants<tspan data-gap="" dx="2.54170"> </tspan>using<tspan data-gap="" dx="2.54170"> </tspan>only<tspan data-gap="" dx="2.54170"> </tspan>the<tspan data-gap="" dx="2.54170"> </tspan>stem.<tspan data-gap="" dx="2.54170"> </tspan>Leaves<tspan data-gap="" dx="2.54170"> </tspan>give<tspan data-gap="" dx="2.54170"> </tspan>us<tspan data-gap="" dx="2.54170"> </tspan>another<tspan data-gap="" dx="2.54170"> </tspan>way<tspan data-gap="" dx="2.54170"> </tspan>to</tspan><tspan x="89" dy="31">sort the same plants. We can compare these groups with the stem groups.</tspan></text>
