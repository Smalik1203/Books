<text class="se-heading" x="89" y="124"><tspan x="89">Herbs, Shrubs and Trees</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="174"><tspan x="89">Read down your table. Three groups appear on their own.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="219"><tspan x="89">Some<tspan data-gap="" dx="1.24829"> </tspan>plants<tspan data-gap="" dx="1.24829"> </tspan>are<tspan data-gap="" dx="1.24829"> </tspan>small.<tspan data-gap="" dx="1.24829"> </tspan>They<tspan data-gap="" dx="1.24829"> </tspan>have<tspan data-gap="" dx="1.24829"> </tspan>soft<tspan data-gap="" dx="1.24829"> </tspan>green<tspan data-gap="" dx="1.24829"> </tspan>stems<tspan data-gap="" dx="1.24829"> </tspan>that<tspan data-gap="" dx="1.24829"> </tspan>bend<tspan data-gap="" dx="1.24829"> </tspan>easily.<tspan data-gap="" dx="1.24829"> </tspan>These<tspan data-gap="" dx="1.24829"> </tspan>are<tspan data-gap="" dx="1.24829"> </tspan>called</tspan><tspan x="89" dy="31"><tspan class="se-bold">herbs</tspan>.<tspan data-gap="" dx="1.00930"> </tspan>A<tspan data-gap="" dx="1.00930"> </tspan>tomato<tspan data-gap="" dx="1.00930"> </tspan>plant<tspan data-gap="" dx="1.00930"> </tspan>is<tspan data-gap="" dx="1.00930"> </tspan>a<tspan data-gap="" dx="1.00930"> </tspan>herb.<tspan data-gap="" dx="1.00930"> </tspan>So<tspan data-gap="" dx="1.00930"> </tspan>are<tspan data-gap="" dx="1.00930"> </tspan>mint<tspan data-gap="" dx="1.00930"> </tspan>and<tspan data-gap="" dx="1.00930"> </tspan>coriander,<tspan data-gap="" dx="1.00930"> </tspan>and<tspan data-gap="" dx="1.00930"> </tspan>most<tspan data-gap="" dx="1.00930"> </tspan>small<tspan data-gap="" dx="1.00930"> </tspan>plants<tspan data-gap="" dx="1.00930"> </tspan>in</tspan><tspan x="89" dy="31">an open field.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="326"><tspan x="89">Some<tspan data-gap="" dx="0.68708"> </tspan>plants<tspan data-gap="" dx="0.68708"> </tspan>are<tspan data-gap="" dx="0.68708"> </tspan>taller.<tspan data-gap="" dx="0.68708"> </tspan>They<tspan data-gap="" dx="0.68708"> </tspan>have<tspan data-gap="" dx="0.68708"> </tspan>several<tspan data-gap="" dx="0.68708"> </tspan>hard<tspan data-gap="" dx="0.68708"> </tspan>brown<tspan data-gap="" dx="0.68708"> </tspan>stems.<tspan data-gap="" dx="0.68708"> </tspan>The<tspan data-gap="" dx="0.68708"> </tspan>branches<tspan data-gap="" dx="0.68708"> </tspan>start<tspan data-gap="" dx="0.68708"> </tspan>close</tspan><tspan x="89" dy="31">to<tspan data-gap="" dx="3.79460"> </tspan>the<tspan data-gap="" dx="3.79460"> </tspan>ground.<tspan data-gap="" dx="3.79460"> </tspan>These<tspan data-gap="" dx="3.79460"> </tspan>stems<tspan data-gap="" dx="3.79460"> </tspan>are<tspan data-gap="" dx="3.79460"> </tspan>not<tspan data-gap="" dx="3.79460"> </tspan>as<tspan data-gap="" dx="3.79460"> </tspan>thick<tspan data-gap="" dx="3.79460"> </tspan>or<tspan data-gap="" dx="3.79460"> </tspan>as<tspan data-gap="" dx="3.79460"> </tspan>tall<tspan data-gap="" dx="3.79460"> </tspan>as<tspan data-gap="" dx="3.79460"> </tspan>a<tspan data-gap="" dx="3.79460"> </tspan>tree's.<tspan data-gap="" dx="3.79460"> </tspan>Such<tspan data-gap="" dx="3.79460"> </tspan>plants<tspan data-gap="" dx="3.79460"> </tspan>are</tspan><tspan x="89" dy="31">called <tspan class="se-bold">shrubs</tspan>. A rose plant is a shrub.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="433"><tspan x="89">Some<tspan data-gap="" dx="3.40912"> </tspan>plants<tspan data-gap="" dx="3.40912"> </tspan>grow<tspan data-gap="" dx="3.40912"> </tspan>very<tspan data-gap="" dx="3.40912"> </tspan>tall.<tspan data-gap="" dx="3.40912"> </tspan>They<tspan data-gap="" dx="3.40912"> </tspan>have<tspan data-gap="" dx="3.40912"> </tspan>one<tspan data-gap="" dx="3.40912"> </tspan>thick,<tspan data-gap="" dx="3.40912"> </tspan>hard,<tspan data-gap="" dx="3.40912"> </tspan>brown<tspan data-gap="" dx="3.40912"> </tspan>stem.<tspan data-gap="" dx="3.40912"> </tspan>The<tspan data-gap="" dx="3.40912"> </tspan>branches</tspan><tspan x="89" dy="31">start well above the ground. These are <tspan class="se-bold">trees</tspan>. A mango is a tree.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="509"><tspan x="89">Now<tspan data-gap="" dx="1.25549"> </tspan>think<tspan data-gap="" dx="1.25549"> </tspan>about<tspan data-gap="" dx="1.25549"> </tspan>what<tspan data-gap="" dx="1.25549"> </tspan>the<tspan data-gap="" dx="1.25549"> </tspan>stem<tspan data-gap="" dx="1.25549"> </tspan>has<tspan data-gap="" dx="1.25549"> </tspan>to<tspan data-gap="" dx="1.25549"> </tspan>do.<tspan data-gap="" dx="1.25549"> </tspan>A<tspan data-gap="" dx="1.25549"> </tspan>tomato<tspan data-gap="" dx="1.25549"> </tspan>plant<tspan data-gap="" dx="1.25549"> </tspan>holds<tspan data-gap="" dx="1.25549"> </tspan>up<tspan data-gap="" dx="1.25549"> </tspan>a<tspan data-gap="" dx="1.25549"> </tspan>few<tspan data-gap="" dx="1.25549"> </tspan>leaves<tspan data-gap="" dx="1.25549"> </tspan>and</tspan><tspan x="89" dy="31">some<tspan data-gap="" dx="3.59495"> </tspan>fruit.<tspan data-gap="" dx="3.59495"> </tspan>A<tspan data-gap="" dx="3.59495"> </tspan>mango<tspan data-gap="" dx="3.59495"> </tspan>tree<tspan data-gap="" dx="3.59495"> </tspan>holds<tspan data-gap="" dx="3.59495"> </tspan>up<tspan data-gap="" dx="3.59495"> </tspan>a<tspan data-gap="" dx="3.59495"> </tspan>heavy<tspan data-gap="" dx="3.59495"> </tspan>top<tspan data-gap="" dx="3.59495"> </tspan>of<tspan data-gap="" dx="3.59495"> </tspan>branches,<tspan data-gap="" dx="3.59495"> </tspan>ten<tspan data-gap="" dx="3.59495"> </tspan>metres<tspan data-gap="" dx="3.59495"> </tspan>above<tspan data-gap="" dx="3.59495"> </tspan>the</tspan><tspan x="89" dy="31">ground,<tspan data-gap="" dx="0.12251"> </tspan>for<tspan data-gap="" dx="0.12251"> </tspan>many<tspan data-gap="" dx="0.12251"> </tspan>years,<tspan data-gap="" dx="0.12251"> </tspan>through<tspan data-gap="" dx="0.12251"> </tspan>wind<tspan data-gap="" dx="0.12251"> </tspan>and<tspan data-gap="" dx="0.12251"> </tspan>rain.<tspan data-gap="" dx="0.12251"> </tspan>A<tspan data-gap="" dx="0.12251"> </tspan>soft<tspan data-gap="" dx="0.12251"> </tspan>green<tspan data-gap="" dx="0.12251"> </tspan>stem<tspan data-gap="" dx="0.12251"> </tspan>could<tspan data-gap="" dx="0.12251"> </tspan>never<tspan data-gap="" dx="0.12251"> </tspan>do<tspan data-gap="" dx="0.12251"> </tspan>that</tspan><tspan x="89" dy="31">job.</tspan></text>

<rect class="se-prompt" x="89" y="1110" width="874" height="154"/><line class="se-think-rule" x1="89" x2="963" y1="1110" y2="1110"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What you saw"><svg class="se-feature-icon se-feature--observe" x="113" y="1119" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="1148">What you saw</text></g><text class="se-copy" x="113" y="1205"><tspan x="113">Can you explain why? A banana plant is taller than you and its stem is thick.</tspan><tspan x="113" dy="31">But the stem is soft and green. Which group does it belong to?</tspan></text>
<text class="se-copy" x="89" y="1305"><tspan x="89">Height alone is not enough. Compare a young mango plant with a mature tomato</tspan><tspan x="89" dy="31">plant: their present heights may be similar, but their stems and later growth differ.</tspan></text>
