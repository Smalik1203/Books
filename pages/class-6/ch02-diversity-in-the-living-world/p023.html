<section class="page page--food page--science-editorial" data-science-chapter="2" data-folio="23"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World, page 23"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M31 63Q34 30 60 7"/><path class="se-botanical-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 2</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Diversity in the Living World</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header -->
<text class="se-heading" x="89" y="124"><tspan x="89">Keywords</tspan></text>
<rect class="se-glossary-panel" x="89" y="151" width="874" height="1147" rx="20"/><text class="se-copy" x="113" y="199"><tspan x="113"><tspan class="se-bold">Adaptation</tspan> — An inherited feature</tspan><tspan x="113" dy="31">that helps an organism survive and</tspan><tspan x="113" dy="31">reproduce in its usual environment.</tspan></text><text class="se-copy" x="113" y="304"><tspan x="113"><tspan class="se-bold">Amphibian</tspan> — An animal belonging to</tspan><tspan x="113" dy="31">the group that includes frogs and</tspan><tspan x="113" dy="31">toads; many use water and land during</tspan><tspan x="113" dy="31">their lives.</tspan></text><text class="se-copy" x="113" y="440"><tspan x="113"><tspan class="se-bold">Aquatic</tspan> — Living in water, or</tspan><tspan x="113" dy="31">describing a habitat in water.</tspan></text><text class="se-copy" x="113" y="514"><tspan x="113"><tspan class="se-bold">Biodiversity</tspan> — The variety of living</tspan><tspan x="113" dy="31">things found in a region.</tspan></text><text class="se-copy" x="113" y="588"><tspan x="113"><tspan class="se-bold">Climber</tspan> — A plant that grows</tspan><tspan x="113" dy="31">upwards using external support.</tspan></text><text class="se-copy" x="113" y="662"><tspan x="113"><tspan class="se-bold">Cotyledon</tspan> — A seed leaf that is part</tspan><tspan x="113" dy="31">of the embryo inside a seed.</tspan></text><text class="se-copy" x="113" y="736"><tspan x="113"><tspan class="se-bold">Creeper</tspan> — A plant with stems that</tspan><tspan x="113" dy="31">trail along the ground.</tspan></text><text class="se-copy" x="113" y="810"><tspan x="113"><tspan class="se-bold">Dicot</tspan> — A flowering plant whose seed</tspan><tspan x="113" dy="31">has two cotyledons.</tspan></text><text class="se-copy" x="113" y="884"><tspan x="113"><tspan class="se-bold">Endosperm</tspan> — Food-storing tissue in</tspan><tspan x="113" dy="31">a seed that nourishes the developing</tspan><tspan x="113" dy="31">embryo.</tspan></text><text class="se-copy" x="113" y="989"><tspan x="113"><tspan class="se-bold">Fibrous</tspan> <tspan class="se-bold">root</tspan> <tspan class="se-bold">system</tspan> — A spreading</tspan><tspan x="113" dy="31">bunch of roots without one dominant</tspan><tspan x="113" dy="31">main root.</tspan></text><text class="se-copy" x="113" y="1094"><tspan x="113"><tspan class="se-bold">Grouping</tspan> — Arranging things by</tspan><tspan x="113" dy="31">features they share, using a stated</tspan><tspan x="113" dy="31">rule.</tspan></text><text class="se-copy" x="113" y="1199"><tspan x="113"><tspan class="se-bold">Habitat</tspan> — The place where an</tspan><tspan x="113" dy="31">organism lives, including its</tspan><tspan x="113" dy="31">conditions and resources.</tspan></text><text class="se-copy" x="541" y="199"><tspan x="541"><tspan class="se-bold">Herb</tspan> — A plant with soft, non-woody</tspan><tspan x="541" dy="31">stems; it need not be small.</tspan></text><text class="se-copy" x="541" y="273"><tspan x="541"><tspan class="se-bold">Monocot</tspan> — A flowering plant whose</tspan><tspan x="541" dy="31">seed has one cotyledon.</tspan></text><text class="se-copy" x="541" y="347"><tspan x="541"><tspan class="se-bold">Parallel</tspan> <tspan class="se-bold">venation</tspan> — A leaf-vein</tspan><tspan x="541" dy="31">pattern in which many veins run</tspan><tspan x="541" dy="31">alongside one another.</tspan></text><text class="se-copy" x="541" y="452"><tspan x="541"><tspan class="se-bold">Pseudostem</tspan> — A trunk-like structure</tspan><tspan x="541" dy="31">formed by overlapping leaf bases, as in</tspan><tspan x="541" dy="31">banana.</tspan></text><text class="se-copy" x="541" y="557"><tspan x="541"><tspan class="se-bold">Reticulate</tspan> <tspan class="se-bold">venation</tspan> — A leaf-vein</tspan><tspan x="541" dy="31">pattern in which veins branch and join</tspan><tspan x="541" dy="31">to form a network.</tspan></text><text class="se-copy" x="541" y="662"><tspan x="541"><tspan class="se-bold">Sacred</tspan> <tspan class="se-bold">grove</tspan> — A patch of vegetation</tspan><tspan x="541" dy="31">protected through local cultural or</tspan><tspan x="541" dy="31">religious traditions.</tspan></text><text class="se-copy" x="541" y="767"><tspan x="541"><tspan class="se-bold">Shrub</tspan> — A woody plant that usually</tspan><tspan x="541" dy="31">branches near the ground, often with</tspan><tspan x="541" dy="31">several main stems.</tspan></text><text class="se-copy" x="541" y="872"><tspan x="541"><tspan class="se-bold">Taproot</tspan> — The main root of a root</tspan><tspan x="541" dy="31">system, with smaller roots branching</tspan><tspan x="541" dy="31">from it.</tspan></text><text class="se-copy" x="541" y="977"><tspan x="541"><tspan class="se-bold">Terrestrial</tspan> — Living on land, or</tspan><tspan x="541" dy="31">describing a habitat on land.</tspan></text><text class="se-copy" x="541" y="1051"><tspan x="541"><tspan class="se-bold">Tree</tspan> — A woody plant that usually</tspan><tspan x="541" dy="31">develops a main trunk supporting a</tspan><tspan x="541" dy="31">crown of branches.</tspan></text><text class="se-copy" x="541" y="1156"><tspan x="541"><tspan class="se-bold">Venation</tspan> — The pattern of veins in a</tspan><tspan x="541" dy="31">leaf.</tspan></text>
