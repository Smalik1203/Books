<text class="se-heading" x="89" y="124"><tspan x="89">Two Kinds of Root</tspan></text><text class="se-copy" data-measure="874" x="89" y="174"><tspan x="89">Compare<tspan data-gap="" dx="1.44824"> </tspan>several<tspan data-gap="" dx="1.44824"> </tspan>seedlings<tspan data-gap="" dx="1.44824"> </tspan>of<tspan data-gap="" dx="1.44824"> </tspan>each<tspan data-gap="" dx="1.44824"> </tspan>kind.<tspan data-gap="" dx="1.44824"> </tspan>Did<tspan data-gap="" dx="1.44824"> </tspan>they<tspan data-gap="" dx="1.44824"> </tspan>germinate<tspan data-gap="" dx="1.44824"> </tspan>at<tspan data-gap="" dx="1.44824"> </tspan>the<tspan data-gap="" dx="1.44824"> </tspan>same<tspan data-gap="" dx="1.44824"> </tspan>time?<tspan data-gap="" dx="1.44824"> </tspan>Root</tspan><tspan x="89" dy="31">systems change as seedlings develop, so record the age as well as the shape.</tspan></text><image class="science-illustration" href="../../figures/class-6/science/ch02/roots.png" x="89" y="231" width="874" height="350" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="351.4004576659039" y="606" text-anchor="middle">Chana · taproot</text><text class="se-caption" x="700.5995423340961" y="606" text-anchor="middle">Wheat · fibrous roots</text><text class="se-copy" x="89" y="653"><tspan x="89">A chana seedling usually develops one</tspan><tspan x="89" dy="31">main root with smaller side roots. A</tspan><tspan x="89" dy="31">main root of this kind is a <tspan class="se-bold">taproot</tspan>.</tspan><tspan x="89" dy="31">Mustard and radish also develop</tspan><tspan x="89" dy="31">taproots. The enlarged edible part of a</tspan><tspan x="89" dy="31">radish includes a swollen taproot that</tspan><tspan x="89" dy="31">stores food.</tspan></text><text class="se-copy" x="542" y="653"><tspan x="542">As the wheat seedling develops, several</tspan><tspan x="542" dy="31">thin roots appear. Later, more roots</tspan><tspan x="542" dy="31">grow from the base of the stem, forming</tspan><tspan x="542" dy="31">a spreading bunch without one</tspan><tspan x="542" dy="31">dominant main root. These are called</tspan><tspan x="542" dy="31"><tspan class="se-bold">fibrous</tspan> <tspan class="se-bold">roots</tspan>. Grass, maize and</tspan><tspan x="542" dy="31">lemongrass have them.</tspan></text><line class="se-editorial-divider" x1="89" x2="963" y1="873" y2="873"/><text class="se-copy" data-measure="874" x="89" y="920"><tspan x="89">Both<tspan data-gap="" dx="3.88981"> </tspan>root<tspan data-gap="" dx="3.88981"> </tspan>systems<tspan data-gap="" dx="3.88981"> </tspan>anchor<tspan data-gap="" dx="3.88981"> </tspan>plants<tspan data-gap="" dx="3.88981"> </tspan>and<tspan data-gap="" dx="3.88981"> </tspan>take<tspan data-gap="" dx="3.88981"> </tspan>up<tspan data-gap="" dx="3.88981"> </tspan>water<tspan data-gap="" dx="3.88981"> </tspan>and<tspan data-gap="" dx="3.88981"> </tspan>dissolved<tspan data-gap="" dx="3.88981"> </tspan>minerals.<tspan data-gap="" dx="3.88981"> </tspan>Their</tspan><tspan x="89" dy="31">branching patterns differ; their jobs overlap.</tspan></text><text class="se-copy" x="89" y="1000"><tspan x="89">A taproot can grow deep and reach</tspan><tspan x="89" dy="31">water below the surface. A deep root</tspan><tspan x="89" dy="31">system can help a plant through a dry</tspan><tspan x="89" dy="31">spell, although root depth also depends</tspan><tspan x="89" dy="31">on the species and the soil.</tspan></text><text class="se-copy" x="542" y="1000"><tspan x="542">Many fibrous root systems spread</tspan><tspan x="542" dy="31">through the upper soil. A dense network</tspan><tspan x="542" dy="31">helps hold loose soil together and take</tspan><tspan x="542" dy="31">up water near the surface. Some fibrous</tspan><tspan x="542" dy="31">roots also reach deep into the ground.</tspan></text>
