<text class="se-heading" x="89" y="124"><tspan x="89">Under the Ground</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="174"><tspan x="89">Roots<tspan data-gap="" dx="2.12956"> </tspan>do<tspan data-gap="" dx="2.12956"> </tspan>two<tspan data-gap="" dx="2.12956"> </tspan>jobs.<tspan data-gap="" dx="2.12956"> </tspan>They<tspan data-gap="" dx="2.12956"> </tspan>hold<tspan data-gap="" dx="2.12956"> </tspan>the<tspan data-gap="" dx="2.12956"> </tspan>plant<tspan data-gap="" dx="2.12956"> </tspan>firmly<tspan data-gap="" dx="2.12956"> </tspan>in<tspan data-gap="" dx="2.12956"> </tspan>place<tspan data-gap="" dx="2.12956"> </tspan>against<tspan data-gap="" dx="2.12956"> </tspan>wind<tspan data-gap="" dx="2.12956"> </tspan>and<tspan data-gap="" dx="2.12956"> </tspan>rain.<tspan data-gap="" dx="2.12956"> </tspan>They</tspan><tspan x="89" dy="31">take up water and dissolved minerals from the soil.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="250"><tspan x="89">Roots<tspan data-gap="" dx="0.39534"> </tspan>are<tspan data-gap="" dx="0.39534"> </tspan>buried,<tspan data-gap="" dx="0.39534"> </tspan>so<tspan data-gap="" dx="0.39534"> </tspan>most<tspan data-gap="" dx="0.39534"> </tspan>people<tspan data-gap="" dx="0.39534"> </tspan>never<tspan data-gap="" dx="0.39534"> </tspan>see<tspan data-gap="" dx="0.39534"> </tspan>them.<tspan data-gap="" dx="0.39534"> </tspan>But<tspan data-gap="" dx="0.39534"> </tspan>roots<tspan data-gap="" dx="0.39534"> </tspan>differ<tspan data-gap="" dx="0.39534"> </tspan>from<tspan data-gap="" dx="0.39534"> </tspan>plant<tspan data-gap="" dx="0.39534"> </tspan>to<tspan data-gap="" dx="0.39534"> </tspan>plant,</tspan><tspan x="89" dy="31">just as leaves do. And you can watch them grow yourself.</tspan></text>
<rect class="se-activity-panel" x="89" y="317" width="874" height="447"/><path class="se-activity-tab" d="M109 303H943Q963 303 963 323V346H89V323Q89 303 109 303Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="309" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="331" text-anchor="start">The setup</text><text class="se-copy" x="113" y="379"><tspan x="113">You will need: a handful of chana (chickpea) seeds, a handful of wheat or maize</tspan><tspan x="113" dy="31">seeds, two shallow trays or plates, cotton cloth or cotton wool, water.</tspan></text><text class="se-activity-step" x="128" y="453" text-anchor="end">1.</text><text class="se-copy" x="146" y="453"><tspan x="146">Soak both kinds of seed in water overnight.</tspan></text><text class="se-activity-step" x="128" y="496" text-anchor="end">2.</text><text class="se-copy" x="146" y="496"><tspan x="146">Spread a wet cloth in each tray. Put the chana seeds in one tray. Put the</tspan><tspan x="146" dy="31">wheat seeds in the other.</tspan></text><text class="se-activity-step" x="128" y="570" text-anchor="end">3.</text><text class="se-copy" x="146" y="570"><tspan x="146">Keep the cloth wet for the next five or six days. Wet, not flooded. Check it</tspan><tspan x="146" dy="31">every morning.</tspan></text><text class="se-activity-step" x="128" y="644" text-anchor="end">4.</text><text class="se-copy" x="146" y="644"><tspan x="146">From day three, take out one seed from each tray every day. Look at what has</tspan><tspan x="146" dy="31">grown from it.</tspan></text><text class="se-activity-step" x="128" y="718" text-anchor="end">5.</text><text class="se-copy" x="146" y="718"><tspan x="146">On day six, wash the roots gently. Lay them on paper, side by side.</tspan></text>
<rect class="se-prompt" x="89" y="784" width="874" height="185"/><line class="se-think-rule" x1="89" x2="963" y1="784" y2="784"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What you saw"><svg class="se-feature-icon se-feature--observe" x="113" y="793" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="822">What you saw</text></g><text class="se-copy" x="113" y="879"><tspan x="113">Draw what grew from each kind of seed in your notebook. Use the same scale</tspan><tspan x="113" dy="31">for both drawings. Could drawings alone tell you which plant is harder to pull</tspan><tspan x="113" dy="31">out? What would you need to keep alike in a comparison of root anchorage?</tspan></text>
<text class="se-heading" x="89" y="1015"><tspan x="89">Two Kinds of Root</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1065"><tspan x="89">Your two trays will have grown two very different things.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1110"><tspan x="89">From<tspan data-gap="" dx="3.86818"> </tspan>the<tspan data-gap="" dx="3.86818"> </tspan>chana<tspan data-gap="" dx="3.86818"> </tspan>seed,<tspan data-gap="" dx="3.86818"> </tspan>one<tspan data-gap="" dx="3.86818"> </tspan>thick<tspan data-gap="" dx="3.86818"> </tspan>root<tspan data-gap="" dx="3.86818"> </tspan>will<tspan data-gap="" dx="3.86818"> </tspan>have<tspan data-gap="" dx="3.86818"> </tspan>gone<tspan data-gap="" dx="3.86818"> </tspan>straight<tspan data-gap="" dx="3.86818"> </tspan>down.<tspan data-gap="" dx="3.86818"> </tspan>Much<tspan data-gap="" dx="3.86818"> </tspan>thinner</tspan><tspan x="89" dy="31">roots<tspan data-gap="" dx="0.61148"> </tspan>will<tspan data-gap="" dx="0.61148"> </tspan>have<tspan data-gap="" dx="0.61148"> </tspan>branched<tspan data-gap="" dx="0.61148"> </tspan>off<tspan data-gap="" dx="0.61148"> </tspan>it.<tspan data-gap="" dx="0.61148"> </tspan>That<tspan data-gap="" dx="0.61148"> </tspan>main<tspan data-gap="" dx="0.61148"> </tspan>root<tspan data-gap="" dx="0.61148"> </tspan>is<tspan data-gap="" dx="0.61148"> </tspan>called<tspan data-gap="" dx="0.61148"> </tspan>a<tspan data-gap="" dx="0.61148"> </tspan><tspan class="se-bold">taproot</tspan>.<tspan data-gap="" dx="0.61148"> </tspan>Mustard,<tspan data-gap="" dx="0.61148"> </tspan>hibiscus,</tspan><tspan x="89" dy="31">mango<tspan data-gap="" dx="2.17434"> </tspan>and<tspan data-gap="" dx="2.17434"> </tspan>radish<tspan data-gap="" dx="2.17434"> </tspan>all<tspan data-gap="" dx="2.17434"> </tspan>have<tspan data-gap="" dx="2.17434"> </tspan>taproots.<tspan data-gap="" dx="2.17434"> </tspan>In<tspan data-gap="" dx="2.17434"> </tspan>fact,<tspan data-gap="" dx="2.17434"> </tspan>a<tspan data-gap="" dx="2.17434"> </tspan>radish<tspan data-gap="" dx="2.17434"> </tspan><tspan class="se-italic">is</tspan><tspan data-gap="" dx="2.17434"> </tspan>a<tspan data-gap="" dx="2.17434"> </tspan>taproot.<tspan data-gap="" dx="2.17434"> </tspan>It<tspan data-gap="" dx="2.17434"> </tspan>is<tspan data-gap="" dx="2.17434"> </tspan>swollen<tspan data-gap="" dx="2.17434"> </tspan>with</tspan><tspan x="89" dy="31">stored food. That is why we eat it.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1248"><tspan x="89">As<tspan data-gap="" dx="3.62599"> </tspan>the<tspan data-gap="" dx="3.62599"> </tspan>wheat<tspan data-gap="" dx="3.62599"> </tspan>seedling<tspan data-gap="" dx="3.62599"> </tspan>develops,<tspan data-gap="" dx="3.62599"> </tspan>several<tspan data-gap="" dx="3.62599"> </tspan>thin<tspan data-gap="" dx="3.62599"> </tspan>roots<tspan data-gap="" dx="3.62599"> </tspan>appear.<tspan data-gap="" dx="3.62599"> </tspan>Later,<tspan data-gap="" dx="3.62599"> </tspan>more<tspan data-gap="" dx="3.62599"> </tspan>roots<tspan data-gap="" dx="3.62599"> </tspan>grow</tspan><tspan x="89" dy="31">from<tspan data-gap="" dx="2.45704"> </tspan>the<tspan data-gap="" dx="2.45704"> </tspan>base<tspan data-gap="" dx="2.45704"> </tspan>of<tspan data-gap="" dx="2.45704"> </tspan>the<tspan data-gap="" dx="2.45704"> </tspan>stem,<tspan data-gap="" dx="2.45704"> </tspan>forming<tspan data-gap="" dx="2.45704"> </tspan>a<tspan data-gap="" dx="2.45704"> </tspan>spreading<tspan data-gap="" dx="2.45704"> </tspan>bunch<tspan data-gap="" dx="2.45704"> </tspan>without<tspan data-gap="" dx="2.45704"> </tspan>one<tspan data-gap="" dx="2.45704"> </tspan>dominant<tspan data-gap="" dx="2.45704"> </tspan>main</tspan><tspan x="89" dy="31">root. These are called <tspan class="se-bold">fibrous</tspan> <tspan class="se-bold">roots</tspan>. Grass, maize and lemongrass have them.</tspan></text>
