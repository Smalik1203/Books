<text class="se-heading" x="89" y="124"><tspan x="89">Habitat</tspan></text><text class="se-copy" data-measure="874" x="89" y="174"><tspan x="89">The place where a living thing lives is called its <tspan class="se-bold">habitat</tspan>.</tspan></text><text class="se-copy" data-measure="874" x="89" y="223"><tspan x="89">A<tspan data-gap="" dx="0.97510"> </tspan>habitat<tspan data-gap="" dx="0.97510"> </tspan>includes<tspan data-gap="" dx="0.97510"> </tspan>the<tspan data-gap="" dx="0.97510"> </tspan>conditions<tspan data-gap="" dx="0.97510"> </tspan>and<tspan data-gap="" dx="0.97510"> </tspan>resources<tspan data-gap="" dx="0.97510"> </tspan>an<tspan data-gap="" dx="0.97510"> </tspan>organism<tspan data-gap="" dx="0.97510"> </tspan>uses.<tspan data-gap="" dx="0.97510"> </tspan>Plants<tspan data-gap="" dx="0.97510"> </tspan>need<tspan data-gap="" dx="0.97510"> </tspan>light,</tspan><tspan x="89" dy="31">water<tspan data-gap="" dx="0.95936"> </tspan>and<tspan data-gap="" dx="0.95936"> </tspan>minerals;<tspan data-gap="" dx="0.95936"> </tspan>animals<tspan data-gap="" dx="0.95936"> </tspan>need<tspan data-gap="" dx="0.95936"> </tspan>food<tspan data-gap="" dx="0.95936"> </tspan>as<tspan data-gap="" dx="0.95936"> </tspan>well<tspan data-gap="" dx="0.95936"> </tspan>as<tspan data-gap="" dx="0.95936"> </tspan>suitable<tspan data-gap="" dx="0.95936"> </tspan>conditions.<tspan data-gap="" dx="0.95936"> </tspan>A<tspan data-gap="" dx="0.95936"> </tspan>habitat<tspan data-gap="" dx="0.95936"> </tspan>need</tspan><tspan x="89" dy="31">not be safe at all times, and an animal may use different places to feed or breed.</tspan></text><text class="se-copy" data-measure="874" x="89" y="334"><tspan x="89">A<tspan data-gap="" dx="4.50077"> </tspan>habitat<tspan data-gap="" dx="4.50077"> </tspan>can<tspan data-gap="" dx="4.50077"> </tspan>be<tspan data-gap="" dx="4.50077"> </tspan>small:<tspan data-gap="" dx="4.50077"> </tspan>damp<tspan data-gap="" dx="4.50077"> </tspan>soil<tspan data-gap="" dx="4.50077"> </tspan>beneath<tspan data-gap="" dx="4.50077"> </tspan>a<tspan data-gap="" dx="4.50077"> </tspan>fallen<tspan data-gap="" dx="4.50077"> </tspan>log<tspan data-gap="" dx="4.50077"> </tspan>differs<tspan data-gap="" dx="4.50077"> </tspan>from<tspan data-gap="" dx="4.50077"> </tspan>the<tspan data-gap="" dx="4.50077"> </tspan>dry<tspan data-gap="" dx="4.50077"> </tspan>path</tspan><tspan x="89" dy="31">beside<tspan data-gap="" dx="2.34599"> </tspan>it.<tspan data-gap="" dx="2.34599"> </tspan>Such<tspan data-gap="" dx="2.34599"> </tspan>differences<tspan data-gap="" dx="2.34599"> </tspan>help<tspan data-gap="" dx="2.34599"> </tspan>explain<tspan data-gap="" dx="2.34599"> </tspan>why<tspan data-gap="" dx="2.34599"> </tspan>nearby<tspan data-gap="" dx="2.34599"> </tspan>places<tspan data-gap="" dx="2.34599"> </tspan>can<tspan data-gap="" dx="2.34599"> </tspan>hold<tspan data-gap="" dx="2.34599"> </tspan>different<tspan data-gap="" dx="2.34599"> </tspan>living</tspan><tspan x="89" dy="31">things.</tspan></text><text class="se-copy" data-measure="874" x="89" y="445"><tspan x="89">Habitats can be sorted into two broad kinds.</tspan></text><text class="se-copy" x="89" y="494"><tspan x="89">Living things on land live in <tspan class="se-bold">terrestrial</tspan></tspan><tspan x="89" dy="31">habitats. Forests, deserts, grasslands and</tspan><tspan x="89" dy="31">mountains are terrestrial habitats. So is</tspan><tspan x="89" dy="31">the ground under your feet.</tspan></text><text class="se-copy" x="542" y="494"><tspan x="542">Living things in water live in <tspan class="se-bold">aquatic</tspan></tspan><tspan x="542" dy="31">habitats. Ponds, lakes, rivers and oceans</tspan><tspan x="542" dy="31">are aquatic habitats.</tspan></text><text class="se-copy" data-measure="874" x="89" y="644"><tspan x="89">Some<tspan data-gap="" dx="1.89307"> </tspan>animals<tspan data-gap="" dx="1.89307"> </tspan>use<tspan data-gap="" dx="1.89307"> </tspan>both<tspan data-gap="" dx="1.89307"> </tspan>land<tspan data-gap="" dx="1.89307"> </tspan>and<tspan data-gap="" dx="1.89307"> </tspan>water.<tspan data-gap="" dx="1.89307"> </tspan>Frogs<tspan data-gap="" dx="1.89307"> </tspan>belong<tspan data-gap="" dx="1.89307"> </tspan>to<tspan data-gap="" dx="1.89307"> </tspan>a<tspan data-gap="" dx="1.89307"> </tspan>group<tspan data-gap="" dx="1.89307"> </tspan>called<tspan data-gap="" dx="1.89307"> </tspan><tspan class="se-bold">amphibians</tspan>;</tspan><tspan x="89" dy="31">many<tspan data-gap="" dx="1.29448"> </tspan>amphibians<tspan data-gap="" dx="1.29448"> </tspan>spend<tspan data-gap="" dx="1.29448"> </tspan>part<tspan data-gap="" dx="1.29448"> </tspan>of<tspan data-gap="" dx="1.29448"> </tspan>their<tspan data-gap="" dx="1.29448"> </tspan>lives<tspan data-gap="" dx="1.29448"> </tspan>in<tspan data-gap="" dx="1.29448"> </tspan>each.<tspan data-gap="" dx="1.29448"> </tspan>But<tspan data-gap="" dx="1.29448"> </tspan>using<tspan data-gap="" dx="1.29448"> </tspan>both<tspan data-gap="" dx="1.29448"> </tspan>habitats<tspan data-gap="" dx="1.29448"> </tspan>does<tspan data-gap="" dx="1.29448"> </tspan>not</tspan><tspan x="89" dy="31">make every animal an amphibian. A crocodile does so too, and it is a reptile.</tspan></text><line class="se-editorial-divider" x1="89" x2="963" y1="732" y2="732"/><text class="se-heading" x="89" y="784"><tspan x="89">When a Habitat Is Lost</tspan></text><text class="se-copy" data-measure="874" x="89" y="834"><tspan x="89">Ask<tspan data-gap="" dx="4.39970"> </tspan>your<tspan data-gap="" dx="4.39970"> </tspan>parents,<tspan data-gap="" dx="4.39970"> </tspan>your<tspan data-gap="" dx="4.39970"> </tspan>grandparents,<tspan data-gap="" dx="4.39970"> </tspan>or<tspan data-gap="" dx="4.39970"> </tspan>an<tspan data-gap="" dx="4.39970"> </tspan>older<tspan data-gap="" dx="4.39970"> </tspan>neighbour<tspan data-gap="" dx="4.39970"> </tspan>one<tspan data-gap="" dx="4.39970"> </tspan>simple<tspan data-gap="" dx="4.39970"> </tspan>question.</tspan><tspan x="89" dy="31">Which birds, insects or plants did they see often as children, but rarely see now?</tspan></text><text class="se-copy" data-measure="874" x="89" y="914"><tspan x="89">Record<tspan data-gap="" dx="0.58666"> </tspan>what<tspan data-gap="" dx="0.58666"> </tspan>the<tspan data-gap="" dx="0.58666"> </tspan>person<tspan data-gap="" dx="0.58666"> </tspan>remembers<tspan data-gap="" dx="0.58666"> </tspan>and<tspan data-gap="" dx="0.58666"> </tspan>where<tspan data-gap="" dx="0.58666"> </tspan>they<tspan data-gap="" dx="0.58666"> </tspan>lived.<tspan data-gap="" dx="0.58666"> </tspan>Memory<tspan data-gap="" dx="0.58666"> </tspan>is<tspan data-gap="" dx="0.58666"> </tspan>a<tspan data-gap="" dx="0.58666"> </tspan>starting<tspan data-gap="" dx="0.58666"> </tspan>point</tspan><tspan x="89" dy="31">for<tspan data-gap="" dx="6.14727"> </tspan>a<tspan data-gap="" dx="6.14727"> </tspan>question,<tspan data-gap="" dx="6.14727"> </tspan>not<tspan data-gap="" dx="6.14727"> </tspan>proof<tspan data-gap="" dx="6.14727"> </tspan>of<tspan data-gap="" dx="6.14727"> </tspan>a<tspan data-gap="" dx="6.14727"> </tspan>change<tspan data-gap="" dx="6.14727"> </tspan>in<tspan data-gap="" dx="6.14727"> </tspan>population.<tspan data-gap="" dx="6.14727"> </tspan>Look<tspan data-gap="" dx="6.14727"> </tspan>for<tspan data-gap="" dx="6.14727"> </tspan>dated<tspan data-gap="" dx="6.14727"> </tspan>records<tspan data-gap="" dx="6.14727"> </tspan>or</tspan><tspan x="89" dy="31">photographs to compare.</tspan></text><text class="se-copy" data-measure="874" x="89" y="1025"><tspan x="89">Habitat<tspan data-gap="" dx="4.86954"> </tspan>damage<tspan data-gap="" dx="4.86954"> </tspan>can<tspan data-gap="" dx="4.86954"> </tspan>reduce<tspan data-gap="" dx="4.86954"> </tspan>food,<tspan data-gap="" dx="4.86954"> </tspan>shelter<tspan data-gap="" dx="4.86954"> </tspan>or<tspan data-gap="" dx="4.86954"> </tspan>breeding<tspan data-gap="" dx="4.86954"> </tspan>sites.<tspan data-gap="" dx="4.86954"> </tspan>Some<tspan data-gap="" dx="4.86954"> </tspan>organisms<tspan data-gap="" dx="4.86954"> </tspan>may</tspan><tspan x="89" dy="31">move;<tspan data-gap="" dx="3.60567"> </tspan>others<tspan data-gap="" dx="3.60567"> </tspan>may<tspan data-gap="" dx="3.60567"> </tspan>not<tspan data-gap="" dx="3.60567"> </tspan>be<tspan data-gap="" dx="3.60567"> </tspan>able<tspan data-gap="" dx="3.60567"> </tspan>to<tspan data-gap="" dx="3.60567"> </tspan>reach<tspan data-gap="" dx="3.60567"> </tspan>suitable<tspan data-gap="" dx="3.60567"> </tspan>places.<tspan data-gap="" dx="3.60567"> </tspan>Populations<tspan data-gap="" dx="3.60567"> </tspan>can<tspan data-gap="" dx="3.60567"> </tspan>decline<tspan data-gap="" dx="3.60567"> </tspan>or</tspan><tspan x="89" dy="31">disappear<tspan data-gap="" dx="3.00211"> </tspan>locally.<tspan data-gap="" dx="3.00211"> </tspan>To<tspan data-gap="" dx="3.00211"> </tspan>investigate<tspan data-gap="" dx="3.00211"> </tspan>a<tspan data-gap="" dx="3.00211"> </tspan>decline,<tspan data-gap="" dx="3.00211"> </tspan>check<tspan data-gap="" dx="3.00211"> </tspan>both<tspan data-gap="" dx="3.00211"> </tspan>changes<tspan data-gap="" dx="3.00211"> </tspan>in<tspan data-gap="" dx="3.00211"> </tspan>habitat<tspan data-gap="" dx="3.00211"> </tspan>and<tspan data-gap="" dx="3.00211"> </tspan>how</tspan><tspan x="89" dy="31">the observations were made.</tspan></text>
