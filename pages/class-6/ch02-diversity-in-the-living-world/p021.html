<text class="se-heading" x="89" y="124"><tspan x="89">Habitat</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="174"><tspan x="89">The place where a living thing lives is called its <tspan class="se-bold">habitat</tspan>.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="219"><tspan x="89">A<tspan data-gap="" dx="0.97824"> </tspan>habitat<tspan data-gap="" dx="0.97824"> </tspan>gives<tspan data-gap="" dx="0.97824"> </tspan>a<tspan data-gap="" dx="0.97824"> </tspan>plant<tspan data-gap="" dx="0.97824"> </tspan>or<tspan data-gap="" dx="0.97824"> </tspan>animal<tspan data-gap="" dx="0.97824"> </tspan>what<tspan data-gap="" dx="0.97824"> </tspan>it<tspan data-gap="" dx="0.97824"> </tspan>needs<tspan data-gap="" dx="0.97824"> </tspan>—<tspan data-gap="" dx="0.97824"> </tspan>food,<tspan data-gap="" dx="0.97824"> </tspan>water,<tspan data-gap="" dx="0.97824"> </tspan>air,<tspan data-gap="" dx="0.97824"> </tspan>shelter,<tspan data-gap="" dx="0.97824"> </tspan>and<tspan data-gap="" dx="0.97824"> </tspan>a<tspan data-gap="" dx="0.97824"> </tspan>safe</tspan><tspan x="89" dy="31">place<tspan data-gap="" dx="0.89716"> </tspan>for<tspan data-gap="" dx="0.89716"> </tspan>its<tspan data-gap="" dx="0.89716"> </tspan>young.<tspan data-gap="" dx="0.89716"> </tspan>The<tspan data-gap="" dx="0.89716"> </tspan>habitat<tspan data-gap="" dx="0.89716"> </tspan>of<tspan data-gap="" dx="0.89716"> </tspan>a<tspan data-gap="" dx="0.89716"> </tspan>camel<tspan data-gap="" dx="0.89716"> </tspan>is<tspan data-gap="" dx="0.89716"> </tspan>the<tspan data-gap="" dx="0.89716"> </tspan>desert.<tspan data-gap="" dx="0.89716"> </tspan>The<tspan data-gap="" dx="0.89716"> </tspan>habitat<tspan data-gap="" dx="0.89716"> </tspan>of<tspan data-gap="" dx="0.89716"> </tspan>a<tspan data-gap="" dx="0.89716"> </tspan>sea<tspan data-gap="" dx="0.89716"> </tspan>turtle<tspan data-gap="" dx="0.89716"> </tspan>is</tspan><tspan x="89" dy="31">the ocean. The habitat of a rhododendron is the mountains.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="326"><tspan x="89">Many<tspan data-gap="" dx="3.26616"> </tspan>different<tspan data-gap="" dx="3.26616"> </tspan>living<tspan data-gap="" dx="3.26616"> </tspan>things<tspan data-gap="" dx="3.26616"> </tspan>share<tspan data-gap="" dx="3.26616"> </tspan>one<tspan data-gap="" dx="3.26616"> </tspan>habitat.<tspan data-gap="" dx="3.26616"> </tspan>That<tspan data-gap="" dx="3.26616"> </tspan>is<tspan data-gap="" dx="3.26616"> </tspan>why<tspan data-gap="" dx="3.26616"> </tspan>habitats<tspan data-gap="" dx="3.26616"> </tspan>are<tspan data-gap="" dx="3.26616"> </tspan>where<tspan data-gap="" dx="3.26616"> </tspan>we</tspan><tspan x="89" dy="31">find biodiversity.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="402"><tspan x="89">Habitats can be sorted into two broad kinds.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="447"><tspan x="89">Living<tspan data-gap="" dx="4.66399"> </tspan>things<tspan data-gap="" dx="4.66399"> </tspan>on<tspan data-gap="" dx="4.66399"> </tspan>land<tspan data-gap="" dx="4.66399"> </tspan>live<tspan data-gap="" dx="4.66399"> </tspan>in<tspan data-gap="" dx="4.66399"> </tspan><tspan class="se-bold">terrestrial</tspan><tspan data-gap="" dx="4.66399"> </tspan>habitats.<tspan data-gap="" dx="4.66399"> </tspan>Forests,<tspan data-gap="" dx="4.66399"> </tspan>deserts,<tspan data-gap="" dx="4.66399"> </tspan>grasslands<tspan data-gap="" dx="4.66399"> </tspan>and</tspan><tspan x="89" dy="31">mountains are terrestrial habitats. So is the ground under your feet.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="523"><tspan x="89">Living<tspan data-gap="" dx="3.11773"> </tspan>things<tspan data-gap="" dx="3.11773"> </tspan>in<tspan data-gap="" dx="3.11773"> </tspan>water<tspan data-gap="" dx="3.11773"> </tspan>live<tspan data-gap="" dx="3.11773"> </tspan>in<tspan data-gap="" dx="3.11773"> </tspan><tspan class="se-bold">aquatic</tspan><tspan data-gap="" dx="3.11773"> </tspan>habitats.<tspan data-gap="" dx="3.11773"> </tspan>Ponds,<tspan data-gap="" dx="3.11773"> </tspan>lakes,<tspan data-gap="" dx="3.11773"> </tspan>rivers<tspan data-gap="" dx="3.11773"> </tspan>and<tspan data-gap="" dx="3.11773"> </tspan>oceans<tspan data-gap="" dx="3.11773"> </tspan>are</tspan><tspan x="89" dy="31">aquatic habitats.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="599"><tspan x="89">Some<tspan data-gap="" dx="1.89307"> </tspan>animals<tspan data-gap="" dx="1.89307"> </tspan>use<tspan data-gap="" dx="1.89307"> </tspan>both<tspan data-gap="" dx="1.89307"> </tspan>land<tspan data-gap="" dx="1.89307"> </tspan>and<tspan data-gap="" dx="1.89307"> </tspan>water.<tspan data-gap="" dx="1.89307"> </tspan>Frogs<tspan data-gap="" dx="1.89307"> </tspan>belong<tspan data-gap="" dx="1.89307"> </tspan>to<tspan data-gap="" dx="1.89307"> </tspan>a<tspan data-gap="" dx="1.89307"> </tspan>group<tspan data-gap="" dx="1.89307"> </tspan>called<tspan data-gap="" dx="1.89307"> </tspan><tspan class="se-bold">amphibians</tspan>;</tspan><tspan x="89" dy="31">many<tspan data-gap="" dx="1.29448"> </tspan>amphibians<tspan data-gap="" dx="1.29448"> </tspan>spend<tspan data-gap="" dx="1.29448"> </tspan>part<tspan data-gap="" dx="1.29448"> </tspan>of<tspan data-gap="" dx="1.29448"> </tspan>their<tspan data-gap="" dx="1.29448"> </tspan>lives<tspan data-gap="" dx="1.29448"> </tspan>in<tspan data-gap="" dx="1.29448"> </tspan>each.<tspan data-gap="" dx="1.29448"> </tspan>But<tspan data-gap="" dx="1.29448"> </tspan>using<tspan data-gap="" dx="1.29448"> </tspan>both<tspan data-gap="" dx="1.29448"> </tspan>habitats<tspan data-gap="" dx="1.29448"> </tspan>does<tspan data-gap="" dx="1.29448"> </tspan>not</tspan><tspan x="89" dy="31">make every animal an amphibian. A crocodile does so too, and it is a reptile.</tspan></text>
<text class="se-heading" x="89" y="711"><tspan x="89">Know a scientist</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="761"><tspan x="89">Salim<tspan data-gap="" dx="2.92297"> </tspan>Ali<tspan data-gap="" dx="2.92297"> </tspan>(1896–1987)<tspan data-gap="" dx="2.92297"> </tspan>spent<tspan data-gap="" dx="2.92297"> </tspan>many<tspan data-gap="" dx="2.92297"> </tspan>years<tspan data-gap="" dx="2.92297"> </tspan>travelling<tspan data-gap="" dx="2.92297"> </tspan>across<tspan data-gap="" dx="2.92297"> </tspan>India,<tspan data-gap="" dx="2.92297"> </tspan>watching<tspan data-gap="" dx="2.92297"> </tspan>birds.<tspan data-gap="" dx="2.92297"> </tspan>He</tspan><tspan x="89" dy="31">recorded<tspan data-gap="" dx="2.38957"> </tspan>where<tspan data-gap="" dx="2.38957"> </tspan>they<tspan data-gap="" dx="2.38957"> </tspan>lived,<tspan data-gap="" dx="2.38957"> </tspan>when<tspan data-gap="" dx="2.38957"> </tspan>they<tspan data-gap="" dx="2.38957"> </tspan>arrived,<tspan data-gap="" dx="2.38957"> </tspan>and<tspan data-gap="" dx="2.38957"> </tspan>where<tspan data-gap="" dx="2.38957"> </tspan>they<tspan data-gap="" dx="2.38957"> </tspan>went<tspan data-gap="" dx="2.38957"> </tspan>next.<tspan data-gap="" dx="2.38957"> </tspan>Watching</tspan><tspan x="89" dy="31">carefully<tspan data-gap="" dx="10.06512"> </tspan>like<tspan data-gap="" dx="10.06512"> </tspan>this,<tspan data-gap="" dx="10.06512"> </tspan>year<tspan data-gap="" dx="10.06512"> </tspan>after<tspan data-gap="" dx="10.06512"> </tspan>year,<tspan data-gap="" dx="10.06512"> </tspan>is<tspan data-gap="" dx="10.06512"> </tspan>how<tspan data-gap="" dx="10.06512"> </tspan>scattered<tspan data-gap="" dx="10.06512"> </tspan>sightings<tspan data-gap="" dx="10.06512"> </tspan>turn<tspan data-gap="" dx="10.06512"> </tspan>into<tspan data-gap="" dx="10.06512"> </tspan>real</tspan><tspan x="89" dy="31">knowledge.<tspan data-gap="" dx="7.08945"> </tspan>His<tspan data-gap="" dx="7.08945"> </tspan>fieldwork<tspan data-gap="" dx="7.08945"> </tspan>and<tspan data-gap="" dx="7.08945"> </tspan>advocacy<tspan data-gap="" dx="7.08945"> </tspan>helped<tspan data-gap="" dx="7.08945"> </tspan>strengthen<tspan data-gap="" dx="7.08945"> </tspan>bird<tspan data-gap="" dx="7.08945"> </tspan>conservation<tspan data-gap="" dx="7.08945"> </tspan>in</tspan><tspan x="89" dy="31">India.<tspan data-gap="" dx="1.42502"> </tspan>His<tspan data-gap="" dx="1.42502"> </tspan>books<tspan data-gap="" dx="1.42502"> </tspan>also<tspan data-gap="" dx="1.42502"> </tspan>made<tspan data-gap="" dx="1.42502"> </tspan>it<tspan data-gap="" dx="1.42502"> </tspan>possible<tspan data-gap="" dx="1.42502"> </tspan>for<tspan data-gap="" dx="1.42502"> </tspan>ordinary<tspan data-gap="" dx="1.42502"> </tspan>people<tspan data-gap="" dx="1.42502"> </tspan>to<tspan data-gap="" dx="1.42502"> </tspan>name<tspan data-gap="" dx="1.42502"> </tspan>the<tspan data-gap="" dx="1.42502"> </tspan>birds<tspan data-gap="" dx="1.42502"> </tspan>around</tspan><tspan x="89" dy="31">them. He is remembered as the Birdman of India.</tspan></text>
<text class="se-heading" x="89" y="966"><tspan x="89">When a Habitat Is Lost</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1016"><tspan x="89">Ask<tspan data-gap="" dx="4.39970"> </tspan>your<tspan data-gap="" dx="4.39970"> </tspan>parents,<tspan data-gap="" dx="4.39970"> </tspan>your<tspan data-gap="" dx="4.39970"> </tspan>grandparents,<tspan data-gap="" dx="4.39970"> </tspan>or<tspan data-gap="" dx="4.39970"> </tspan>an<tspan data-gap="" dx="4.39970"> </tspan>older<tspan data-gap="" dx="4.39970"> </tspan>neighbour<tspan data-gap="" dx="4.39970"> </tspan>one<tspan data-gap="" dx="4.39970"> </tspan>simple<tspan data-gap="" dx="4.39970"> </tspan>question.</tspan><tspan x="89" dy="31">Which birds, insects or plants did they see often as children, but rarely see now?</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1092"><tspan x="89">Many of them will be able to name several.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1137"><tspan x="89">When<tspan data-gap="" dx="2.85154"> </tspan>a<tspan data-gap="" dx="2.85154"> </tspan>habitat<tspan data-gap="" dx="2.85154"> </tspan>is<tspan data-gap="" dx="2.85154"> </tspan>damaged<tspan data-gap="" dx="2.85154"> </tspan>or<tspan data-gap="" dx="2.85154"> </tspan>destroyed,<tspan data-gap="" dx="2.85154"> </tspan>the<tspan data-gap="" dx="2.85154"> </tspan>living<tspan data-gap="" dx="2.85154"> </tspan>things<tspan data-gap="" dx="2.85154"> </tspan>there<tspan data-gap="" dx="2.85154"> </tspan>lose<tspan data-gap="" dx="2.85154"> </tspan>everything<tspan data-gap="" dx="2.85154"> </tspan>at</tspan><tspan x="89" dy="31">once<tspan data-gap="" dx="3.14952"> </tspan>—<tspan data-gap="" dx="3.14952"> </tspan>their<tspan data-gap="" dx="3.14952"> </tspan>food,<tspan data-gap="" dx="3.14952"> </tspan>their<tspan data-gap="" dx="3.14952"> </tspan>shelter,<tspan data-gap="" dx="3.14952"> </tspan>and<tspan data-gap="" dx="3.14952"> </tspan>the<tspan data-gap="" dx="3.14952"> </tspan>place<tspan data-gap="" dx="3.14952"> </tspan>where<tspan data-gap="" dx="3.14952"> </tspan>they<tspan data-gap="" dx="3.14952"> </tspan>raise<tspan data-gap="" dx="3.14952"> </tspan>their<tspan data-gap="" dx="3.14952"> </tspan>young.<tspan data-gap="" dx="3.14952"> </tspan>They</tspan><tspan x="89" dy="31">usually<tspan data-gap="" dx="1.91203"> </tspan>cannot<tspan data-gap="" dx="1.91203"> </tspan>move<tspan data-gap="" dx="1.91203"> </tspan>somewhere<tspan data-gap="" dx="1.91203"> </tspan>else,<tspan data-gap="" dx="1.91203"> </tspan>because<tspan data-gap="" dx="1.91203"> </tspan>there<tspan data-gap="" dx="1.91203"> </tspan>is<tspan data-gap="" dx="1.91203"> </tspan>often<tspan data-gap="" dx="1.91203"> </tspan>nowhere<tspan data-gap="" dx="1.91203"> </tspan>else<tspan data-gap="" dx="1.91203"> </tspan>that<tspan data-gap="" dx="1.91203"> </tspan>suits</tspan><tspan x="89" dy="31">them.<tspan data-gap="" dx="3.74690"> </tspan>They<tspan data-gap="" dx="3.74690"> </tspan>simply<tspan data-gap="" dx="3.74690"> </tspan>become<tspan data-gap="" dx="3.74690"> </tspan>fewer.<tspan data-gap="" dx="3.74690"> </tspan>Then<tspan data-gap="" dx="3.74690"> </tspan>they<tspan data-gap="" dx="3.74690"> </tspan>are<tspan data-gap="" dx="3.74690"> </tspan>gone.<tspan data-gap="" dx="3.74690"> </tspan>This<tspan data-gap="" dx="3.74690"> </tspan>is<tspan data-gap="" dx="3.74690"> </tspan>how<tspan data-gap="" dx="3.74690"> </tspan>biodiversity<tspan data-gap="" dx="3.74690"> </tspan>is</tspan><tspan x="89" dy="31">lost.</tspan></text>
