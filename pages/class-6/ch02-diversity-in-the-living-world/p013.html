<text class="se-heading" x="89" y="124"><tspan x="89">A Pattern Appears</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="174"><tspan x="89">You now know two ways to sort plants. One uses leaves. One uses roots.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="219"><tspan x="89">Can<tspan data-gap="" dx="2.21773"> </tspan>a<tspan data-gap="" dx="2.21773"> </tspan>record<tspan data-gap="" dx="2.21773"> </tspan>of<tspan data-gap="" dx="2.21773"> </tspan>leaf<tspan data-gap="" dx="2.21773"> </tspan>venation<tspan data-gap="" dx="2.21773"> </tspan>help<tspan data-gap="" dx="2.21773"> </tspan>you<tspan data-gap="" dx="2.21773"> </tspan>predict<tspan data-gap="" dx="2.21773"> </tspan>root<tspan data-gap="" dx="2.21773"> </tspan>type?<tspan data-gap="" dx="2.21773"> </tspan>First<tspan data-gap="" dx="2.21773"> </tspan>collect<tspan data-gap="" dx="2.21773"> </tspan>observations,</tspan><tspan x="89" dy="31">then test any pattern against another plant.</tspan></text>
<rect class="se-activity-panel" x="89" y="286" width="874" height="466"/><path class="se-activity-tab" d="M109 272H943Q963 272 963 292V315H89V292Q89 272 109 272Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="278" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="300" text-anchor="start">Investigate</text><text class="se-activity-step" x="128" y="348" text-anchor="end">1.</text><text class="se-copy" x="146" y="348"><tspan x="146">With your teacher or gardener, select five kinds of flowering plants with</tspan><tspan x="146" dy="31">developed leaves and visible roots. Use spare nursery plants, not plants</tspan><tspan x="146" dy="31">pulled from the wild.</tspan></text><text class="se-activity-step" x="128" y="453" text-anchor="end">2.</text><text class="se-copy" x="146" y="453"><tspan x="146">Make a notebook table using the headings in Table 2.4. Examine four kinds</tspan><tspan x="146" dy="31">first and record their venation and root type. Mark unclear features as</tspan><tspan x="146" dy="31">uncertain.</tspan></text><text class="se-activity-step" x="128" y="558" text-anchor="end">3.</text><text class="se-copy" x="146" y="558"><tspan x="146">Look for a connection in these four records. Use it to predict the root type of</tspan><tspan x="146" dy="31">the fifth kind from its leaf. Record the prediction before examining its roots.</tspan></text><text class="se-activity-step" x="128" y="632" text-anchor="end">4.</text><text class="se-copy" x="146" y="632"><tspan x="146">Check the roots of the fifth kind. Does this new observation support your</tspan><tspan x="146" dy="31">proposed pattern? Compare results across the class.</tspan></text><text class="se-activity-step" x="128" y="706" text-anchor="end">5.</text><text class="se-copy" x="146" y="706"><tspan x="146">Handle the roots gently and replant the plants with your teacher’s help.</tspan></text>
<rect class="se-table-band" x="89" y="768" width="874" height="40" rx="3"/><rect class="se-table-number" x="89" y="768" width="149" height="40" rx="3"/><text class="se-caption se-table-number-text" x="109" y="795">Table 2.4</text><text class="se-caption se-bold" x="260" y="795">Leaf venation and root type</text><rect class="se-table-head" x="89" y="814" width="874" height="72"/><line class="se-table-row-rule" x1="89" x2="963" y1="886" y2="886"/><text class="se-copy se-table-copy se-bold" x="101" y="841.4"><tspan x="101">Plant</tspan></text><text class="se-copy se-table-copy se-bold" x="319.5" y="841.4"><tspan x="319.5">Venation</tspan></text><text class="se-copy se-table-copy se-bold" x="538" y="841.4"><tspan x="538">Root prediction (fifth</tspan><tspan x="538" dy="25">plant)</tspan></text><text class="se-copy se-table-copy se-bold" x="756.5" y="841.4"><tspan x="756.5">Root observed</tspan></text><line class="se-table-row-rule" x1="89" x2="963" y1="933" y2="933"/><text class="se-copy se-table-copy" x="101" y="913.4"><tspan x="101">Lemongrass</tspan></text><text class="se-copy se-table-copy" x="319.5" y="913.4"><tspan x="319.5">Parallel</tspan></text><text class="se-copy se-table-copy" x="538" y="913.4"><tspan x="538">—</tspan></text><text class="se-copy se-table-copy" x="756.5" y="913.4"><tspan x="756.5">Fibrous</tspan></text><!-- table-frame --><line class="se-table-column-rule" x1="307.5" x2="307.5" y1="814" y2="933"/><line class="se-table-column-rule" x1="526" x2="526" y1="814" y2="933"/><line class="se-table-column-rule" x1="744.5" x2="744.5" y1="814" y2="933"/><rect class="se-table-frame" x="89" y="814" width="874" height="119"/><!-- /table-frame -->
<text class="se-copy" data-measure="874" x="89" y="970"><tspan x="89">What<tspan data-gap="" dx="0.47429"> </tspan>happened<tspan data-gap="" dx="0.47429"> </tspan>with<tspan data-gap="" dx="0.47429"> </tspan>the<tspan data-gap="" dx="0.47429"> </tspan>fifth<tspan data-gap="" dx="0.47429"> </tspan>plant?<tspan data-gap="" dx="0.47429"> </tspan>An<tspan data-gap="" dx="0.47429"> </tspan>unclear<tspan data-gap="" dx="0.47429"> </tspan>root<tspan data-gap="" dx="0.47429"> </tspan>or<tspan data-gap="" dx="0.47429"> </tspan>leaf<tspan data-gap="" dx="0.47429"> </tspan>is<tspan data-gap="" dx="0.47429"> </tspan>a<tspan data-gap="" dx="0.47429"> </tspan>reason<tspan data-gap="" dx="0.47429"> </tspan>to<tspan data-gap="" dx="0.47429"> </tspan>examine<tspan data-gap="" dx="0.47429"> </tspan>it</tspan><tspan x="89" dy="31">again, not to change the record so it fits.</tspan></text>
<text class="se-heading" x="89" y="1051"><tspan x="89">The Two Go Together</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1101"><tspan x="89">Pool<tspan data-gap="" dx="0.86441"> </tspan>the<tspan data-gap="" dx="0.86441"> </tspan>class<tspan data-gap="" dx="0.86441"> </tspan>records.<tspan data-gap="" dx="0.86441"> </tspan>Count<tspan data-gap="" dx="0.86441"> </tspan>how<tspan data-gap="" dx="0.86441"> </tspan>many<tspan data-gap="" dx="0.86441"> </tspan>support<tspan data-gap="" dx="0.86441"> </tspan>a<tspan data-gap="" dx="0.86441"> </tspan>connection<tspan data-gap="" dx="0.86441"> </tspan>and<tspan data-gap="" dx="0.86441"> </tspan>how<tspan data-gap="" dx="0.86441"> </tspan>many<tspan data-gap="" dx="0.86441"> </tspan>do<tspan data-gap="" dx="0.86441"> </tspan>not.</tspan><tspan x="89" dy="31">Compare the result with these common patterns in flowering plants.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1177"><tspan x="89">Many<tspan data-gap="" dx="0.87868"> </tspan>familiar<tspan data-gap="" dx="0.87868"> </tspan>flowering<tspan data-gap="" dx="0.87868"> </tspan>plants<tspan data-gap="" dx="0.87868"> </tspan>with<tspan data-gap="" dx="0.87868"> </tspan>reticulate<tspan data-gap="" dx="0.87868"> </tspan>venation<tspan data-gap="" dx="0.87868"> </tspan>develop<tspan data-gap="" dx="0.87868"> </tspan>taproots;<tspan data-gap="" dx="0.87868"> </tspan>those<tspan data-gap="" dx="0.87868"> </tspan>with</tspan><tspan x="89" dy="31">parallel venation commonly develop fibrous root systems.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1253"><tspan x="89"><tspan class="se-italic">Sadabahar</tspan><tspan data-gap="" dx="2.68281"> </tspan>has<tspan data-gap="" dx="2.68281"> </tspan>net-like<tspan data-gap="" dx="2.68281"> </tspan>veins<tspan data-gap="" dx="2.68281"> </tspan>and<tspan data-gap="" dx="2.68281"> </tspan>a<tspan data-gap="" dx="2.68281"> </tspan>taproot.<tspan data-gap="" dx="2.68281"> </tspan>Chana<tspan data-gap="" dx="2.68281"> </tspan>has<tspan data-gap="" dx="2.68281"> </tspan>net-like<tspan data-gap="" dx="2.68281"> </tspan>veins<tspan data-gap="" dx="2.68281"> </tspan>and<tspan data-gap="" dx="2.68281"> </tspan>a<tspan data-gap="" dx="2.68281"> </tspan>taproot.</tspan><tspan x="89" dy="31">Lemongrass<tspan data-gap="" dx="0.15170"> </tspan>has<tspan data-gap="" dx="0.15170"> </tspan>parallel<tspan data-gap="" dx="0.15170"> </tspan>veins<tspan data-gap="" dx="0.15170"> </tspan>and<tspan data-gap="" dx="0.15170"> </tspan>fibrous<tspan data-gap="" dx="0.15170"> </tspan>roots.<tspan data-gap="" dx="0.15170"> </tspan>Wheat<tspan data-gap="" dx="0.15170"> </tspan>has<tspan data-gap="" dx="0.15170"> </tspan>parallel<tspan data-gap="" dx="0.15170"> </tspan>veins<tspan data-gap="" dx="0.15170"> </tspan>and<tspan data-gap="" dx="0.15170"> </tspan>fibrous</tspan><tspan x="89" dy="31">roots.</tspan></text>
