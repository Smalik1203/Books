<text class="se-heading" x="89" y="124"><tspan x="89">2.2 Making Sense of the Variety</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="174"><tspan x="89">Your<tspan data-gap="" dx="1.68417"> </tspan>records<tspan data-gap="" dx="1.68417"> </tspan>may<tspan data-gap="" dx="1.68417"> </tspan>contain<tspan data-gap="" dx="1.68417"> </tspan>many<tspan data-gap="" dx="1.68417"> </tspan>kinds<tspan data-gap="" dx="1.68417"> </tspan>of<tspan data-gap="" dx="1.68417"> </tspan>living<tspan data-gap="" dx="1.68417"> </tspan>things.<tspan data-gap="" dx="1.68417"> </tspan>Grouping<tspan data-gap="" dx="1.68417"> </tspan>them<tspan data-gap="" dx="1.68417"> </tspan>can<tspan data-gap="" dx="1.68417"> </tspan>help<tspan data-gap="" dx="1.68417"> </tspan>you</tspan><tspan x="89" dy="31">compare a feature without searching through every entry.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="250"><tspan x="89">In<tspan data-gap="" dx="1.95670"> </tspan>a<tspan data-gap="" dx="1.95670"> </tspan>stationery<tspan data-gap="" dx="1.95670"> </tspan>shop,<tspan data-gap="" dx="1.95670"> </tspan>keeping<tspan data-gap="" dx="1.95670"> </tspan>pens<tspan data-gap="" dx="1.95670"> </tspan>together<tspan data-gap="" dx="1.95670"> </tspan>helps<tspan data-gap="" dx="1.95670"> </tspan>a<tspan data-gap="" dx="1.95670"> </tspan>customer<tspan data-gap="" dx="1.95670"> </tspan>find<tspan data-gap="" dx="1.95670"> </tspan>a<tspan data-gap="" dx="1.95670"> </tspan>pen.<tspan data-gap="" dx="1.95670"> </tspan>Arranging</tspan><tspan x="89" dy="31">goods<tspan data-gap="" dx="4.22583"> </tspan>by<tspan data-gap="" dx="4.22583"> </tspan>price<tspan data-gap="" dx="4.22583"> </tspan>answers<tspan data-gap="" dx="4.22583"> </tspan>a<tspan data-gap="" dx="4.22583"> </tspan>different<tspan data-gap="" dx="4.22583"> </tspan>question:<tspan data-gap="" dx="4.22583"> </tspan>what<tspan data-gap="" dx="4.22583"> </tspan>can<tspan data-gap="" dx="4.22583"> </tspan>I<tspan data-gap="" dx="4.22583"> </tspan>buy<tspan data-gap="" dx="4.22583"> </tspan>with<tspan data-gap="" dx="4.22583"> </tspan>this<tspan data-gap="" dx="4.22583"> </tspan>amount<tspan data-gap="" dx="4.22583"> </tspan>of</tspan><tspan x="89" dy="31">money?</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="357"><tspan x="89">Scientists<tspan data-gap="" dx="1.41166"> </tspan>do<tspan data-gap="" dx="1.41166"> </tspan>the<tspan data-gap="" dx="1.41166"> </tspan>same<tspan data-gap="" dx="1.41166"> </tspan>with<tspan data-gap="" dx="1.41166"> </tspan>living<tspan data-gap="" dx="1.41166"> </tspan>things.<tspan data-gap="" dx="1.41166"> </tspan>Putting<tspan data-gap="" dx="1.41166"> </tspan>things<tspan data-gap="" dx="1.41166"> </tspan>into<tspan data-gap="" dx="1.41166"> </tspan>groups<tspan data-gap="" dx="1.41166"> </tspan>by<tspan data-gap="" dx="1.41166"> </tspan>the<tspan data-gap="" dx="1.41166"> </tspan>features</tspan><tspan x="89" dy="31">they share is called <tspan class="se-bold">grouping</tspan>.</tspan></text>
<rect class="se-activity-panel" x="89" y="424" width="874" height="514"/><path class="se-activity-tab" d="M109 410H943Q963 410 963 430V453H89V430Q89 410 109 410Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="416" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="438" text-anchor="start">Investigate</text><text class="se-copy" x="113" y="486"><tspan x="113">You will need: old magazines or newspapers, scissors, glue, small cards.</tspan></text><text class="se-activity-step" x="128" y="529" text-anchor="end">1.</text><text class="se-copy" x="146" y="529"><tspan x="146">Cut out pictures of plants and animals. Paste one on each card. Try to make</tspan><tspan x="146" dy="31">at least thirty cards in the class.</tspan></text><text class="se-activity-step" x="128" y="603" text-anchor="end">2.</text><text class="se-copy" x="146" y="603"><tspan x="146">Work in groups of five or six. Put all your cards together.</tspan></text><text class="se-activity-step" x="128" y="646" text-anchor="end">3.</text><text class="se-copy" x="146" y="646"><tspan x="146">Sort the pile into groups. You decide what the groups will be.</tspan></text><text class="se-activity-step" x="128" y="689" text-anchor="end">4.</text><text class="se-copy" x="146" y="689"><tspan x="146">Write down, in one line, the rule you used.</tspan></text><text class="se-activity-step" x="128" y="732" text-anchor="end">5.</text><text class="se-copy" x="146" y="732"><tspan x="146">Now mix all the cards again. Sort them a second time, using a completely</tspan><tspan x="146" dy="31">different rule.</tspan></text><text class="se-copy" x="113" y="806"><tspan x="113">Compare both your sortings with another group's.</tspan></text><text class="se-copy" x="113" y="849"><tspan x="113">Did any two groups in the class use the same rule?</tspan></text><text class="se-copy" x="113" y="892"><tspan x="113">Safety: Use scissors carefully, with your teacher’s guidance.</tspan></text>
<text class="se-heading" x="89" y="986"><tspan x="89">A Grouping Needs a Clear Rule</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1036"><tspan x="89">Take<tspan data-gap="" dx="1.21534"> </tspan>one<tspan data-gap="" dx="1.21534"> </tspan>sorted<tspan data-gap="" dx="1.21534"> </tspan>group<tspan data-gap="" dx="1.21534"> </tspan>and<tspan data-gap="" dx="1.21534"> </tspan>check<tspan data-gap="" dx="1.21534"> </tspan>every<tspan data-gap="" dx="1.21534"> </tspan>card<tspan data-gap="" dx="1.21534"> </tspan>against<tspan data-gap="" dx="1.21534"> </tspan>its<tspan data-gap="" dx="1.21534"> </tspan>rule.<tspan data-gap="" dx="1.21534"> </tspan>Two<tspan data-gap="" dx="1.21534"> </tspan>different<tspan data-gap="" dx="1.21534"> </tspan>rules<tspan data-gap="" dx="1.21534"> </tspan>can</tspan><tspan x="89" dy="31">both be useful, but a card can still be placed incorrectly.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1112"><tspan x="89">Different<tspan data-gap="" dx="7.35218"> </tspan>groups<tspan data-gap="" dx="7.35218"> </tspan>may<tspan data-gap="" dx="7.35218"> </tspan>use<tspan data-gap="" dx="7.35218"> </tspan>size,<tspan data-gap="" dx="7.35218"> </tspan>food<tspan data-gap="" dx="7.35218"> </tspan>or<tspan data-gap="" dx="7.35218"> </tspan>surroundings.<tspan data-gap="" dx="7.35218"> </tspan>Check<tspan data-gap="" dx="7.35218"> </tspan>what<tspan data-gap="" dx="7.35218"> </tspan>the<tspan data-gap="" dx="7.35218"> </tspan>pictures</tspan><tspan x="89" dy="31">actually show before using these features.</tspan></text>
