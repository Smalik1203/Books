<section class="page page--food page--science-editorial" data-science-chapter="2" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World, page 11"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M31 63Q34 30 60 7"/><path class="se-botanical-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 2</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Diversity in the Living World</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header -->
<text class="se-heading" x="89" y="124"><tspan x="89">Under the Ground</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="174"><tspan x="89">Roots<tspan data-gap="" dx="0.19275"> </tspan>hold<tspan data-gap="" dx="0.19275"> </tspan>plants<tspan data-gap="" dx="0.19275"> </tspan>in<tspan data-gap="" dx="0.19275"> </tspan>place<tspan data-gap="" dx="0.19275"> </tspan>and<tspan data-gap="" dx="0.19275"> </tspan>take<tspan data-gap="" dx="0.19275"> </tspan>up<tspan data-gap="" dx="0.19275"> </tspan>water<tspan data-gap="" dx="0.19275"> </tspan>and<tspan data-gap="" dx="0.19275"> </tspan>dissolved<tspan data-gap="" dx="0.19275"> </tspan>minerals.<tspan data-gap="" dx="0.19275"> </tspan>You<tspan data-gap="" dx="0.19275"> </tspan>can<tspan data-gap="" dx="0.19275"> </tspan>observe</tspan><tspan x="89" dy="31">their growth as seeds germinate.</tspan></text>
<rect class="se-activity-panel" x="89" y="249" width="874" height="721"/><path class="se-activity-tab" d="M109 235H943Q963 235 963 255V278H89V255Q89 235 109 235Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="241" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="263" text-anchor="start">Investigate</text><text class="se-copy" x="113" y="311"><tspan x="113">You will need: a handful of chana (chickpea) seeds, a handful of wheat seeds,</tspan><tspan x="113" dy="31">two shallow trays or plates, cotton cloth or cotton wool, water.</tspan></text><text class="se-activity-step" x="128" y="393" text-anchor="end">1.</text><text class="se-copy" x="146" y="393"><tspan x="146">Soak both kinds of seed in water overnight.</tspan></text><text class="se-activity-step" x="128" y="444" text-anchor="end">2.</text><text class="se-copy" x="146" y="444"><tspan x="146">Spread a wet cloth in each tray. Put the chana seeds in one tray. Put the</tspan><tspan x="146" dy="31">wheat seeds in the other.</tspan></text><text class="se-activity-step" x="128" y="526" text-anchor="end">3.</text><text class="se-copy" x="146" y="526"><tspan x="146">Keep both trays in the same place. Keep the cloth damp, not flooded, and</tspan><tspan x="146" dy="31">check it every morning for six days.</tspan></text><text class="se-activity-step" x="128" y="608" text-anchor="end">4.</text><text class="se-copy" x="146" y="608"><tspan x="146">From day three, inspect the seedlings daily. Record when each germinates</tspan><tspan x="146" dy="31">and sketch the roots without tearing them.</tspan></text><text class="se-activity-step" x="128" y="690" text-anchor="end">5.</text><text class="se-copy" x="146" y="690"><tspan x="146">On day six, compare several seedlings of each kind. Keep any that</tspan><tspan x="146" dy="31">germinated late and observe them for a few more days. Do not pull roots out</tspan><tspan x="146" dy="31">of the cloth; examine them gently.</tspan></text><text class="se-copy" x="113" y="803"><tspan x="113">Draw what grew from each kind of seed in your notebook. Use the same scale</tspan><tspan x="113" dy="31">for both drawings.</tspan></text><text class="se-copy" x="113" y="885"><tspan x="113">Could drawings alone tell you which plant is harder to pull out? What would you</tspan><tspan x="113" dy="31">need to keep alike in a comparison of root anchorage?</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1013"><tspan x="89">Give<tspan data-gap="" dx="5.30932"> </tspan>each<tspan data-gap="" dx="5.30932"> </tspan>seedling<tspan data-gap="" dx="5.30932"> </tspan>a<tspan data-gap="" dx="5.30932"> </tspan>small<tspan data-gap="" dx="5.30932"> </tspan>identifying<tspan data-gap="" dx="5.30932"> </tspan>label<tspan data-gap="" dx="5.30932"> </tspan>and<tspan data-gap="" dx="5.30932"> </tspan>date<tspan data-gap="" dx="5.30932"> </tspan>each<tspan data-gap="" dx="5.30932"> </tspan>sketch.<tspan data-gap="" dx="5.30932"> </tspan>This<tspan data-gap="" dx="5.30932"> </tspan>lets<tspan data-gap="" dx="5.30932"> </tspan>you</tspan><tspan x="89" dy="31">follow<tspan data-gap="" dx="0.71116"> </tspan>one<tspan data-gap="" dx="0.71116"> </tspan>seedling<tspan data-gap="" dx="0.71116"> </tspan>through<tspan data-gap="" dx="0.71116"> </tspan>time<tspan data-gap="" dx="0.71116"> </tspan>instead<tspan data-gap="" dx="0.71116"> </tspan>of<tspan data-gap="" dx="0.71116"> </tspan>mistaking<tspan data-gap="" dx="0.71116"> </tspan>differences<tspan data-gap="" dx="0.71116"> </tspan>between<tspan data-gap="" dx="0.71116"> </tspan>seedlings</tspan><tspan x="89" dy="31">for<tspan data-gap="" dx="0.72187"> </tspan>changes<tspan data-gap="" dx="0.72187"> </tspan>in<tspan data-gap="" dx="0.72187"> </tspan>one<tspan data-gap="" dx="0.72187"> </tspan>plant.<tspan data-gap="" dx="0.72187"> </tspan>Place<tspan data-gap="" dx="0.72187"> </tspan>a<tspan data-gap="" dx="0.72187"> </tspan>ruler<tspan data-gap="" dx="0.72187"> </tspan>beside<tspan data-gap="" dx="0.72187"> </tspan>it<tspan data-gap="" dx="0.72187"> </tspan>without<tspan data-gap="" dx="0.72187"> </tspan>disturbing<tspan data-gap="" dx="0.72187"> </tspan>the<tspan data-gap="" dx="0.72187"> </tspan>roots;<tspan data-gap="" dx="0.72187"> </tspan>include</tspan><tspan x="89" dy="31">a scale in your drawing.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1159"><tspan x="89">Count<tspan data-gap="" dx="5.32061"> </tspan>age<tspan data-gap="" dx="5.32061"> </tspan>from<tspan data-gap="" dx="5.32061"> </tspan>germination<tspan data-gap="" dx="5.32061"> </tspan>as<tspan data-gap="" dx="5.32061"> </tspan>well<tspan data-gap="" dx="5.32061"> </tspan>as<tspan data-gap="" dx="5.32061"> </tspan>recording<tspan data-gap="" dx="5.32061"> </tspan>the<tspan data-gap="" dx="5.32061"> </tspan>calendar<tspan data-gap="" dx="5.32061"> </tspan>date.<tspan data-gap="" dx="5.32061"> </tspan>If<tspan data-gap="" dx="5.32061"> </tspan>one<tspan data-gap="" dx="5.32061"> </tspan>seed</tspan><tspan x="89" dy="31">germinated<tspan data-gap="" dx="3.81354"> </tspan>on<tspan data-gap="" dx="3.81354"> </tspan>Monday<tspan data-gap="" dx="3.81354"> </tspan>and<tspan data-gap="" dx="3.81354"> </tspan>another<tspan data-gap="" dx="3.81354"> </tspan>on<tspan data-gap="" dx="3.81354"> </tspan>Thursday,<tspan data-gap="" dx="3.81354"> </tspan>drawings<tspan data-gap="" dx="3.81354"> </tspan>made<tspan data-gap="" dx="3.81354"> </tspan>on<tspan data-gap="" dx="3.81354"> </tspan>Friday<tspan data-gap="" dx="3.81354"> </tspan>show</tspan><tspan x="89" dy="31">different<tspan data-gap="" dx="2.22533"> </tspan>stages<tspan data-gap="" dx="2.22533"> </tspan>of<tspan data-gap="" dx="2.22533"> </tspan>growth.<tspan data-gap="" dx="2.22533"> </tspan>Compare<tspan data-gap="" dx="2.22533"> </tspan>seedlings<tspan data-gap="" dx="2.22533"> </tspan>of<tspan data-gap="" dx="2.22533"> </tspan>similar<tspan data-gap="" dx="2.22533"> </tspan>age<tspan data-gap="" dx="2.22533"> </tspan>before<tspan data-gap="" dx="2.22533"> </tspan>deciding<tspan data-gap="" dx="2.22533"> </tspan>that<tspan data-gap="" dx="2.22533"> </tspan>a</tspan><tspan x="89" dy="31">difference belongs to the two kinds of plant.</tspan></text>
