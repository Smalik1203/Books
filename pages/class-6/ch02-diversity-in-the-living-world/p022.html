<text class="se-copy" data-measure="874" x="89" y="119"><tspan x="89">Habitat<tspan data-gap="" dx="2.78745"> </tspan>loss<tspan data-gap="" dx="2.78745"> </tspan>has<tspan data-gap="" dx="2.78745"> </tspan>threatened<tspan data-gap="" dx="2.78745"> </tspan>animals<tspan data-gap="" dx="2.78745"> </tspan>such<tspan data-gap="" dx="2.78745"> </tspan>as<tspan data-gap="" dx="2.78745"> </tspan>the<tspan data-gap="" dx="2.78745"> </tspan>Bengal<tspan data-gap="" dx="2.78745"> </tspan>tiger<tspan data-gap="" dx="2.78745"> </tspan>and<tspan data-gap="" dx="2.78745"> </tspan>the<tspan data-gap="" dx="2.78745"> </tspan>Great<tspan data-gap="" dx="2.78745"> </tspan>Indian</tspan><tspan x="89" dy="31">bustard.<tspan data-gap="" dx="0.35094"> </tspan>Project<tspan data-gap="" dx="0.35094"> </tspan>Tiger<tspan data-gap="" dx="0.35094"> </tspan>began<tspan data-gap="" dx="0.35094"> </tspan>in<tspan data-gap="" dx="0.35094"> </tspan>1973<tspan data-gap="" dx="0.35094"> </tspan>to<tspan data-gap="" dx="0.35094"> </tspan>protect<tspan data-gap="" dx="0.35094"> </tspan>tigers<tspan data-gap="" dx="0.35094"> </tspan>and<tspan data-gap="" dx="0.35094"> </tspan>their<tspan data-gap="" dx="0.35094"> </tspan>habitats.<tspan data-gap="" dx="0.35094"> </tspan>The<tspan data-gap="" dx="0.35094"> </tspan>cheetah</tspan><tspan x="89" dy="31">was<tspan data-gap="" dx="3.50049"> </tspan>declared<tspan data-gap="" dx="3.50049"> </tspan>extinct<tspan data-gap="" dx="3.50049"> </tspan>in<tspan data-gap="" dx="3.50049"> </tspan>India<tspan data-gap="" dx="3.50049"> </tspan>in<tspan data-gap="" dx="3.50049"> </tspan>1952;<tspan data-gap="" dx="3.50049"> </tspan>a<tspan data-gap="" dx="3.50049"> </tspan>reintroduction<tspan data-gap="" dx="3.50049"> </tspan>programme<tspan data-gap="" dx="3.50049"> </tspan>began<tspan data-gap="" dx="3.50049"> </tspan>in<tspan data-gap="" dx="3.50049"> </tspan>2022.</tspan><tspan x="89" dy="31">Protecting suitable habitat is essential to conservation.</tspan></text>
<text class="se-copy" x="89" y="257"><tspan x="89">Governments are not the only ones who protect</tspan><tspan x="89" dy="31">habitats. Sacred groves are patches of forest that</tspan><tspan x="89" dy="31">communities across India have left untouched for</tspan><tspan x="89" dy="31">many generations. Nobody cuts trees there. Nobody</tspan><tspan x="89" dy="31">hunts. Some groves are tiny and some are large.</tspan><tspan x="89" dy="31">Many hold rare plants that have disappeared from</tspan><tspan x="89" dy="31">the land all around them. Community traditions and</tspan><tspan x="89" dy="31">agreements protect many groves; some also have</tspan><tspan x="89" dy="31">legal protection. Find out if there is one near you.</tspan></text><image class="science-illustration" href="../../figures/class-6/science/ch02/grove.png" x="657" y="234" width="306" height="240" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="810" y="504" text-anchor="middle">A sacred grove</text>
<text class="se-heading" x="89" y="575"><tspan x="89">Keywords</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="625"><tspan x="89">Adaptation<tspan data-gap="" dx="3.82425"> </tspan>·<tspan data-gap="" dx="3.82425"> </tspan>Amphibian<tspan data-gap="" dx="3.82425"> </tspan>·<tspan data-gap="" dx="3.82425"> </tspan>Aquatic<tspan data-gap="" dx="3.82425"> </tspan>·<tspan data-gap="" dx="3.82425"> </tspan>Biodiversity<tspan data-gap="" dx="3.82425"> </tspan>·<tspan data-gap="" dx="3.82425"> </tspan>Climber<tspan data-gap="" dx="3.82425"> </tspan>·<tspan data-gap="" dx="3.82425"> </tspan>Cotyledon<tspan data-gap="" dx="3.82425"> </tspan>·<tspan data-gap="" dx="3.82425"> </tspan>Creeper<tspan data-gap="" dx="3.82425"> </tspan>·</tspan><tspan x="89" dy="31">Dicot<tspan data-gap="" dx="5.26263"> </tspan>·<tspan data-gap="" dx="5.26263"> </tspan>Fibrous<tspan data-gap="" dx="5.26263"> </tspan>root<tspan data-gap="" dx="5.26263"> </tspan>·<tspan data-gap="" dx="5.26263"> </tspan>Grouping<tspan data-gap="" dx="5.26263"> </tspan>·<tspan data-gap="" dx="5.26263"> </tspan>Habitat<tspan data-gap="" dx="5.26263"> </tspan>·<tspan data-gap="" dx="5.26263"> </tspan>Herb<tspan data-gap="" dx="5.26263"> </tspan>·<tspan data-gap="" dx="5.26263"> </tspan>Monocot<tspan data-gap="" dx="5.26263"> </tspan>·<tspan data-gap="" dx="5.26263"> </tspan>Parallel<tspan data-gap="" dx="5.26263"> </tspan>venation<tspan data-gap="" dx="5.26263"> </tspan>·</tspan><tspan x="89" dy="31">Reticulate venation · Sacred grove · Shrub · Taproot · Terrestrial · Tree · Venation</tspan></text>
<text class="se-heading" x="89" y="737"><tspan x="89">Summary</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="787"><tspan x="89">•<tspan data-gap="" dx="3.79985"> </tspan>The<tspan data-gap="" dx="3.79985"> </tspan>variety<tspan data-gap="" dx="3.79985"> </tspan>of<tspan data-gap="" dx="3.79985"> </tspan>living<tspan data-gap="" dx="3.79985"> </tspan>things<tspan data-gap="" dx="3.79985"> </tspan>found<tspan data-gap="" dx="3.79985"> </tspan>in<tspan data-gap="" dx="3.79985"> </tspan>a<tspan data-gap="" dx="3.79985"> </tspan>region<tspan data-gap="" dx="3.79985"> </tspan>is<tspan data-gap="" dx="3.79985"> </tspan>called<tspan data-gap="" dx="3.79985"> </tspan>its<tspan data-gap="" dx="3.79985"> </tspan>biodiversity.<tspan data-gap="" dx="3.79985"> </tspan>Even<tspan data-gap="" dx="3.79985"> </tspan>an</tspan><tspan x="89" dy="31">ordinary place has much more of it than a quick look suggests.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="861"><tspan x="89">• Living things in a place depend on each other for food, shelter and other needs.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="904"><tspan x="89">•<tspan data-gap="" dx="5.39978"> </tspan>Grouping<tspan data-gap="" dx="5.39978"> </tspan>means<tspan data-gap="" dx="5.39978"> </tspan>arranging<tspan data-gap="" dx="5.39978"> </tspan>things<tspan data-gap="" dx="5.39978"> </tspan>by<tspan data-gap="" dx="5.39978"> </tspan>the<tspan data-gap="" dx="5.39978"> </tspan>features<tspan data-gap="" dx="5.39978"> </tspan>they<tspan data-gap="" dx="5.39978"> </tspan>share.<tspan data-gap="" dx="5.39978"> </tspan>There<tspan data-gap="" dx="5.39978"> </tspan>is<tspan data-gap="" dx="5.39978"> </tspan>no<tspan data-gap="" dx="5.39978"> </tspan>one</tspan><tspan x="89" dy="31">correct grouping. The useful one depends on the question being asked.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="978"><tspan x="89">•<tspan data-gap="" dx="0.60726"> </tspan>Plants<tspan data-gap="" dx="0.60726"> </tspan>can<tspan data-gap="" dx="0.60726"> </tspan>be<tspan data-gap="" dx="0.60726"> </tspan>grouped<tspan data-gap="" dx="0.60726"> </tspan>by<tspan data-gap="" dx="0.60726"> </tspan>stem<tspan data-gap="" dx="0.60726"> </tspan>and<tspan data-gap="" dx="0.60726"> </tspan>height<tspan data-gap="" dx="0.60726"> </tspan>into<tspan data-gap="" dx="0.60726"> </tspan>herbs,<tspan data-gap="" dx="0.60726"> </tspan>shrubs<tspan data-gap="" dx="0.60726"> </tspan>and<tspan data-gap="" dx="0.60726"> </tspan>trees.<tspan data-gap="" dx="0.60726"> </tspan>Plants<tspan data-gap="" dx="0.60726"> </tspan>with</tspan><tspan x="89" dy="31">weak stems are climbers or creepers.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1052"><tspan x="89">•<tspan data-gap="" dx="7.01733"> </tspan>The<tspan data-gap="" dx="7.01733"> </tspan>pattern<tspan data-gap="" dx="7.01733"> </tspan>of<tspan data-gap="" dx="7.01733"> </tspan>veins<tspan data-gap="" dx="7.01733"> </tspan>in<tspan data-gap="" dx="7.01733"> </tspan>a<tspan data-gap="" dx="7.01733"> </tspan>leaf<tspan data-gap="" dx="7.01733"> </tspan>is<tspan data-gap="" dx="7.01733"> </tspan>called<tspan data-gap="" dx="7.01733"> </tspan>venation.<tspan data-gap="" dx="7.01733"> </tspan>Two<tspan data-gap="" dx="7.01733"> </tspan>common<tspan data-gap="" dx="7.01733"> </tspan>patterns<tspan data-gap="" dx="7.01733"> </tspan>are</tspan><tspan x="89" dy="31">reticulate and parallel.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1126"><tspan x="89">•<tspan data-gap="" dx="6.96392"> </tspan>Roots<tspan data-gap="" dx="6.96392"> </tspan>are<tspan data-gap="" dx="6.96392"> </tspan>of<tspan data-gap="" dx="6.96392"> </tspan>two<tspan data-gap="" dx="6.96392"> </tspan>kinds.<tspan data-gap="" dx="6.96392"> </tspan>A<tspan data-gap="" dx="6.96392"> </tspan>taproot<tspan data-gap="" dx="6.96392"> </tspan>has<tspan data-gap="" dx="6.96392"> </tspan>one<tspan data-gap="" dx="6.96392"> </tspan>main<tspan data-gap="" dx="6.96392"> </tspan>root.<tspan data-gap="" dx="6.96392"> </tspan>Fibrous<tspan data-gap="" dx="6.96392"> </tspan>roots<tspan data-gap="" dx="6.96392"> </tspan>form<tspan data-gap="" dx="6.96392"> </tspan>a</tspan><tspan x="89" dy="31">spreading bunch.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1200"><tspan x="89">• Among flowering plants, dicots have two cotyledons and monocots have one.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1243"><tspan x="89">•<tspan data-gap="" dx="2.80253"> </tspan>These<tspan data-gap="" dx="2.80253"> </tspan>three<tspan data-gap="" dx="2.80253"> </tspan>features<tspan data-gap="" dx="2.80253"> </tspan>go<tspan data-gap="" dx="2.80253"> </tspan>together.<tspan data-gap="" dx="2.80253"> </tspan>Dicots<tspan data-gap="" dx="2.80253"> </tspan>generally<tspan data-gap="" dx="2.80253"> </tspan>have<tspan data-gap="" dx="2.80253"> </tspan>reticulate<tspan data-gap="" dx="2.80253"> </tspan>venation<tspan data-gap="" dx="2.80253"> </tspan>and<tspan data-gap="" dx="2.80253"> </tspan>a</tspan><tspan x="89" dy="31">taproot.<tspan data-gap="" dx="3.25344"> </tspan>Monocots<tspan data-gap="" dx="3.25344"> </tspan>generally<tspan data-gap="" dx="3.25344"> </tspan>have<tspan data-gap="" dx="3.25344"> </tspan>parallel<tspan data-gap="" dx="3.25344"> </tspan>venation<tspan data-gap="" dx="3.25344"> </tspan>and<tspan data-gap="" dx="3.25344"> </tspan>fibrous<tspan data-gap="" dx="3.25344"> </tspan>roots.<tspan data-gap="" dx="3.25344"> </tspan>This<tspan data-gap="" dx="3.25344"> </tspan>is<tspan data-gap="" dx="3.25344"> </tspan>what</tspan><tspan x="89" dy="31">makes the grouping useful — one observation lets you predict others.</tspan></text>
