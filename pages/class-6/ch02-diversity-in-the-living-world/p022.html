<text class="se-heading" x="89" y="124" text-anchor="start">Know a scientist</text><text class="se-copy" data-measure="874" x="89" y="174"><tspan x="89">Salim<tspan data-gap="" dx="2.92297"> </tspan>Ali<tspan data-gap="" dx="2.92297"> </tspan>(1896–1987)<tspan data-gap="" dx="2.92297"> </tspan>spent<tspan data-gap="" dx="2.92297"> </tspan>many<tspan data-gap="" dx="2.92297"> </tspan>years<tspan data-gap="" dx="2.92297"> </tspan>travelling<tspan data-gap="" dx="2.92297"> </tspan>across<tspan data-gap="" dx="2.92297"> </tspan>India,<tspan data-gap="" dx="2.92297"> </tspan>watching<tspan data-gap="" dx="2.92297"> </tspan>birds.<tspan data-gap="" dx="2.92297"> </tspan>He</tspan><tspan x="89" dy="31">recorded<tspan data-gap="" dx="2.38957"> </tspan>where<tspan data-gap="" dx="2.38957"> </tspan>they<tspan data-gap="" dx="2.38957"> </tspan>lived,<tspan data-gap="" dx="2.38957"> </tspan>when<tspan data-gap="" dx="2.38957"> </tspan>they<tspan data-gap="" dx="2.38957"> </tspan>arrived,<tspan data-gap="" dx="2.38957"> </tspan>and<tspan data-gap="" dx="2.38957"> </tspan>where<tspan data-gap="" dx="2.38957"> </tspan>they<tspan data-gap="" dx="2.38957"> </tspan>went<tspan data-gap="" dx="2.38957"> </tspan>next.<tspan data-gap="" dx="2.38957"> </tspan>Watching</tspan><tspan x="89" dy="31">carefully<tspan data-gap="" dx="10.06512"> </tspan>like<tspan data-gap="" dx="10.06512"> </tspan>this,<tspan data-gap="" dx="10.06512"> </tspan>year<tspan data-gap="" dx="10.06512"> </tspan>after<tspan data-gap="" dx="10.06512"> </tspan>year,<tspan data-gap="" dx="10.06512"> </tspan>is<tspan data-gap="" dx="10.06512"> </tspan>how<tspan data-gap="" dx="10.06512"> </tspan>scattered<tspan data-gap="" dx="10.06512"> </tspan>sightings<tspan data-gap="" dx="10.06512"> </tspan>turn<tspan data-gap="" dx="10.06512"> </tspan>into<tspan data-gap="" dx="10.06512"> </tspan>real</tspan><tspan x="89" dy="31">knowledge.<tspan data-gap="" dx="7.08945"> </tspan>His<tspan data-gap="" dx="7.08945"> </tspan>fieldwork<tspan data-gap="" dx="7.08945"> </tspan>and<tspan data-gap="" dx="7.08945"> </tspan>advocacy<tspan data-gap="" dx="7.08945"> </tspan>helped<tspan data-gap="" dx="7.08945"> </tspan>strengthen<tspan data-gap="" dx="7.08945"> </tspan>bird<tspan data-gap="" dx="7.08945"> </tspan>conservation<tspan data-gap="" dx="7.08945"> </tspan>in</tspan><tspan x="89" dy="31">India.<tspan data-gap="" dx="1.42502"> </tspan>His<tspan data-gap="" dx="1.42502"> </tspan>books<tspan data-gap="" dx="1.42502"> </tspan>also<tspan data-gap="" dx="1.42502"> </tspan>made<tspan data-gap="" dx="1.42502"> </tspan>it<tspan data-gap="" dx="1.42502"> </tspan>possible<tspan data-gap="" dx="1.42502"> </tspan>for<tspan data-gap="" dx="1.42502"> </tspan>ordinary<tspan data-gap="" dx="1.42502"> </tspan>people<tspan data-gap="" dx="1.42502"> </tspan>to<tspan data-gap="" dx="1.42502"> </tspan>name<tspan data-gap="" dx="1.42502"> </tspan>the<tspan data-gap="" dx="1.42502"> </tspan>birds<tspan data-gap="" dx="1.42502"> </tspan>around</tspan><tspan x="89" dy="31">them. He is remembered as the Birdman of India.</tspan></text><line class="se-editorial-divider" x1="89" x2="963" y1="355" y2="355"/><text class="se-heading" x="89" y="407" text-anchor="start">Protecting habitats</text><text class="se-copy" data-measure="874" x="89" y="457"><tspan x="89">Habitat<tspan data-gap="" dx="2.78745"> </tspan>loss<tspan data-gap="" dx="2.78745"> </tspan>has<tspan data-gap="" dx="2.78745"> </tspan>threatened<tspan data-gap="" dx="2.78745"> </tspan>animals<tspan data-gap="" dx="2.78745"> </tspan>such<tspan data-gap="" dx="2.78745"> </tspan>as<tspan data-gap="" dx="2.78745"> </tspan>the<tspan data-gap="" dx="2.78745"> </tspan>Bengal<tspan data-gap="" dx="2.78745"> </tspan>tiger<tspan data-gap="" dx="2.78745"> </tspan>and<tspan data-gap="" dx="2.78745"> </tspan>the<tspan data-gap="" dx="2.78745"> </tspan>Great<tspan data-gap="" dx="2.78745"> </tspan>Indian</tspan><tspan x="89" dy="31">bustard.<tspan data-gap="" dx="0.35094"> </tspan>Project<tspan data-gap="" dx="0.35094"> </tspan>Tiger<tspan data-gap="" dx="0.35094"> </tspan>began<tspan data-gap="" dx="0.35094"> </tspan>in<tspan data-gap="" dx="0.35094"> </tspan>1973<tspan data-gap="" dx="0.35094"> </tspan>to<tspan data-gap="" dx="0.35094"> </tspan>protect<tspan data-gap="" dx="0.35094"> </tspan>tigers<tspan data-gap="" dx="0.35094"> </tspan>and<tspan data-gap="" dx="0.35094"> </tspan>their<tspan data-gap="" dx="0.35094"> </tspan>habitats.<tspan data-gap="" dx="0.35094"> </tspan>The<tspan data-gap="" dx="0.35094"> </tspan>cheetah</tspan><tspan x="89" dy="31">was<tspan data-gap="" dx="3.50049"> </tspan>declared<tspan data-gap="" dx="3.50049"> </tspan>extinct<tspan data-gap="" dx="3.50049"> </tspan>in<tspan data-gap="" dx="3.50049"> </tspan>India<tspan data-gap="" dx="3.50049"> </tspan>in<tspan data-gap="" dx="3.50049"> </tspan>1952;<tspan data-gap="" dx="3.50049"> </tspan>a<tspan data-gap="" dx="3.50049"> </tspan>reintroduction<tspan data-gap="" dx="3.50049"> </tspan>programme<tspan data-gap="" dx="3.50049"> </tspan>began<tspan data-gap="" dx="3.50049"> </tspan>in<tspan data-gap="" dx="3.50049"> </tspan>2022.</tspan><tspan x="89" dy="31">Protecting suitable habitat is essential to conservation.</tspan></text><line class="se-editorial-divider" x1="89" x2="963" y1="576" y2="576"/><image class="science-illustration" href="../../figures/class-6/science/ch02/grove.png" x="89" y="600" width="421" height="280" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="299.5" y="905" text-anchor="middle">A sacred grove</text><text class="se-copy" x="542" y="623"><tspan x="542">Governments and communities both</tspan><tspan x="542" dy="31">protect habitats. <tspan class="se-bold">Sacred</tspan> groves are</tspan><tspan x="542" dy="31">patches of vegetation protected through</tspan><tspan x="542" dy="31">local cultural or religious traditions.</tspan><tspan x="542" dy="31">Rules about cutting, collecting and</tspan><tspan x="542" dy="31">hunting vary. Some groves preserve old</tspan><tspan x="542" dy="31">trees and habitat missing from nearby</tspan><tspan x="542" dy="31">cleared land. Some also have legal</tspan><tspan x="542" dy="31">protection. Find out how a grove near</tspan><tspan x="542" dy="31">you is protected.</tspan></text><text class="se-heading" x="89" y="982" text-anchor="start">Checking Whether Protection Helps</text><text class="se-copy" data-measure="874" x="89" y="1032"><tspan x="89">Suppose<tspan data-gap="" dx="3.03736"> </tspan>a<tspan data-gap="" dx="3.03736"> </tspan>class<tspan data-gap="" dx="3.03736"> </tspan>records<tspan data-gap="" dx="3.03736"> </tspan>more<tspan data-gap="" dx="3.03736"> </tspan>kinds<tspan data-gap="" dx="3.03736"> </tspan>of<tspan data-gap="" dx="3.03736"> </tspan>birds<tspan data-gap="" dx="3.03736"> </tspan>in<tspan data-gap="" dx="3.03736"> </tspan>a<tspan data-gap="" dx="3.03736"> </tspan>protected<tspan data-gap="" dx="3.03736"> </tspan>grove<tspan data-gap="" dx="3.03736"> </tspan>than<tspan data-gap="" dx="3.03736"> </tspan>in<tspan data-gap="" dx="3.03736"> </tspan>a<tspan data-gap="" dx="3.03736"> </tspan>nearby</tspan><tspan x="89" dy="31">clearing. Does that record alone show that protection caused the difference?</tspan></text><text class="se-copy" data-measure="874" x="89" y="1112"><tspan x="89">Check<tspan data-gap="" dx="0.74128"> </tspan>how<tspan data-gap="" dx="0.74128"> </tspan>the<tspan data-gap="" dx="0.74128"> </tspan>records<tspan data-gap="" dx="0.74128"> </tspan>were<tspan data-gap="" dx="0.74128"> </tspan>made.<tspan data-gap="" dx="0.74128"> </tspan>Were<tspan data-gap="" dx="0.74128"> </tspan>both<tspan data-gap="" dx="0.74128"> </tspan>places<tspan data-gap="" dx="0.74128"> </tspan>watched<tspan data-gap="" dx="0.74128"> </tspan>for<tspan data-gap="" dx="0.74128"> </tspan>the<tspan data-gap="" dx="0.74128"> </tspan>same<tspan data-gap="" dx="0.74128"> </tspan>length<tspan data-gap="" dx="0.74128"> </tspan>of</tspan><tspan x="89" dy="31">time,<tspan data-gap="" dx="4.42638"> </tspan>at<tspan data-gap="" dx="4.42638"> </tspan>similar<tspan data-gap="" dx="4.42638"> </tspan>times<tspan data-gap="" dx="4.42638"> </tspan>of<tspan data-gap="" dx="4.42638"> </tspan>day?<tspan data-gap="" dx="4.42638"> </tspan>Could<tspan data-gap="" dx="4.42638"> </tspan>differences<tspan data-gap="" dx="4.42638"> </tspan>in<tspan data-gap="" dx="4.42638"> </tspan>area,<tspan data-gap="" dx="4.42638"> </tspan>water<tspan data-gap="" dx="4.42638"> </tspan>or<tspan data-gap="" dx="4.42638"> </tspan>vegetation<tspan data-gap="" dx="4.42638"> </tspan>also</tspan><tspan x="89" dy="31">matter?</tspan></text><text class="se-copy" data-measure="874" x="89" y="1223"><tspan x="89">Plan<tspan data-gap="" dx="6.35574"> </tspan>repeated<tspan data-gap="" dx="6.35574"> </tspan>visits<tspan data-gap="" dx="6.35574"> </tspan>using<tspan data-gap="" dx="6.35574"> </tspan>the<tspan data-gap="" dx="6.35574"> </tspan>same<tspan data-gap="" dx="6.35574"> </tspan>method.<tspan data-gap="" dx="6.35574"> </tspan>Decide<tspan data-gap="" dx="6.35574"> </tspan>what<tspan data-gap="" dx="6.35574"> </tspan>to<tspan data-gap="" dx="6.35574"> </tspan>record<tspan data-gap="" dx="6.35574"> </tspan>so<tspan data-gap="" dx="6.35574"> </tspan>another</tspan><tspan x="89" dy="31">class<tspan data-gap="" dx="2.78127"> </tspan>could<tspan data-gap="" dx="2.78127"> </tspan>check<tspan data-gap="" dx="2.78127"> </tspan>your<tspan data-gap="" dx="2.78127"> </tspan>comparison.<tspan data-gap="" dx="2.78127"> </tspan>A<tspan data-gap="" dx="2.78127"> </tspan>useful<tspan data-gap="" dx="2.78127"> </tspan>conclusion<tspan data-gap="" dx="2.78127"> </tspan>must<tspan data-gap="" dx="2.78127"> </tspan>account<tspan data-gap="" dx="2.78127"> </tspan>for<tspan data-gap="" dx="2.78127"> </tspan>both<tspan data-gap="" dx="2.78127"> </tspan>the</tspan><tspan x="89" dy="31">evidence and its limits.</tspan></text>
