<text class="se-heading" x="89" y="124"><tspan x="89">Lines on a Leaf</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="174"><tspan x="89">Hold<tspan data-gap="" dx="3.22553"> </tspan>a<tspan data-gap="" dx="3.22553"> </tspan>leaf<tspan data-gap="" dx="3.22553"> </tspan>up<tspan data-gap="" dx="3.22553"> </tspan>against<tspan data-gap="" dx="3.22553"> </tspan>the<tspan data-gap="" dx="3.22553"> </tspan>light.<tspan data-gap="" dx="3.22553"> </tspan>You<tspan data-gap="" dx="3.22553"> </tspan>will<tspan data-gap="" dx="3.22553"> </tspan>see<tspan data-gap="" dx="3.22553"> </tspan>thin<tspan data-gap="" dx="3.22553"> </tspan>lines<tspan data-gap="" dx="3.22553"> </tspan>running<tspan data-gap="" dx="3.22553"> </tspan>through<tspan data-gap="" dx="3.22553"> </tspan>it.<tspan data-gap="" dx="3.22553"> </tspan>These</tspan><tspan x="89" dy="31">lines are <tspan class="se-bold">veins</tspan>. The pattern the veins make is called <tspan class="se-bold">venation</tspan>.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="250"><tspan x="89">Veins<tspan data-gap="" dx="6.10071"> </tspan>contain<tspan data-gap="" dx="6.10071"> </tspan>tissues<tspan data-gap="" dx="6.10071"> </tspan>that<tspan data-gap="" dx="6.10071"> </tspan>transport<tspan data-gap="" dx="6.10071"> </tspan>water<tspan data-gap="" dx="6.10071"> </tspan>and<tspan data-gap="" dx="6.10071"> </tspan>dissolved<tspan data-gap="" dx="6.10071"> </tspan>substances.<tspan data-gap="" dx="6.10071"> </tspan>They<tspan data-gap="" dx="6.10071"> </tspan>carry</tspan><tspan x="89" dy="31">water<tspan data-gap="" dx="1.32199"> </tspan>into<tspan data-gap="" dx="1.32199"> </tspan>the<tspan data-gap="" dx="1.32199"> </tspan>leaf<tspan data-gap="" dx="1.32199"> </tspan>and<tspan data-gap="" dx="1.32199"> </tspan>sugars<tspan data-gap="" dx="1.32199"> </tspan>made<tspan data-gap="" dx="1.32199"> </tspan>in<tspan data-gap="" dx="1.32199"> </tspan>the<tspan data-gap="" dx="1.32199"> </tspan>leaf<tspan data-gap="" dx="1.32199"> </tspan>to<tspan data-gap="" dx="1.32199"> </tspan>other<tspan data-gap="" dx="1.32199"> </tspan>parts<tspan data-gap="" dx="1.32199"> </tspan>of<tspan data-gap="" dx="1.32199"> </tspan>the<tspan data-gap="" dx="1.32199"> </tspan>plant.<tspan data-gap="" dx="1.32199"> </tspan>They<tspan data-gap="" dx="1.32199"> </tspan>also</tspan><tspan x="89" dy="31">help support the leaf.</tspan></text>
<rect class="se-activity-panel" x="89" y="348" width="874" height="636"/><path class="se-activity-tab" d="M109 334H943Q963 334 963 354V377H89V354Q89 334 109 334Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="340" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="362" text-anchor="start">Investigate</text><text class="se-copy" x="113" y="410"><tspan x="113">You will need: fallen leaves of at least four different plants, thin paper, a pencil</tspan><tspan x="113" dy="31">with soft lead.</tspan></text><text class="se-activity-step" x="128" y="489.125" text-anchor="end">1.</text><text class="se-copy" x="146" y="489.125"><tspan x="146">Put a leaf on the desk with its back side facing up. The veins stand out more</tspan><tspan x="146" dy="31">on that side.</tspan></text><text class="se-activity-step" x="128" y="568.25" text-anchor="end">2.</text><text class="se-copy" x="146" y="568.25"><tspan x="146">Place a sheet of thin paper over the leaf.</tspan></text><text class="se-activity-step" x="128" y="616.375" text-anchor="end">3.</text><text class="se-copy" x="146" y="616.375"><tspan x="146">Hold the paper still. Rub the side of the pencil lead flat across it, using light</tspan><tspan x="146" dy="31">strokes.</tspan></text><text class="se-activity-step" x="128" y="695.5" text-anchor="end">4.</text><text class="se-copy" x="146" y="695.5"><tspan x="146">Check the print against the leaf. If the veins are unclear, adjust the paper or</tspan><tspan x="146" dy="31">pressure and try again.</tspan></text><text class="se-activity-step" x="128" y="774.625" text-anchor="end">5.</text><text class="se-copy" x="146" y="774.625"><tspan x="146">Do this for every leaf. Write the plant's name next to each print.</tspan></text><text class="se-copy" x="113" y="822.75"><tspan x="113">Put all your prints side by side.</tspan></text><text class="se-copy" x="113" y="870.875"><tspan x="113">Group the prints by their vein patterns. How many groups does your sample</tspan><tspan x="113" dy="31">support? Explain your rule. If all the patterns look alike, compare with another</tspan><tspan x="113" dy="31">group’s leaves.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1027"><tspan x="89">A<tspan data-gap="" dx="0.16649"> </tspan>rubbing<tspan data-gap="" dx="0.16649"> </tspan>is<tspan data-gap="" dx="0.16649"> </tspan>a<tspan data-gap="" dx="0.16649"> </tspan>record<tspan data-gap="" dx="0.16649"> </tspan>made<tspan data-gap="" dx="0.16649"> </tspan>by<tspan data-gap="" dx="0.16649"> </tspan>a<tspan data-gap="" dx="0.16649"> </tspan>method.<tspan data-gap="" dx="0.16649"> </tspan>A<tspan data-gap="" dx="0.16649"> </tspan>faint<tspan data-gap="" dx="0.16649"> </tspan>patch<tspan data-gap="" dx="0.16649"> </tspan>may<tspan data-gap="" dx="0.16649"> </tspan>mean<tspan data-gap="" dx="0.16649"> </tspan>the<tspan data-gap="" dx="0.16649"> </tspan>paper<tspan data-gap="" dx="0.16649"> </tspan>moved<tspan data-gap="" dx="0.16649"> </tspan>or</tspan><tspan x="89" dy="31">the<tspan data-gap="" dx="1.68587"> </tspan>pencil<tspan data-gap="" dx="1.68587"> </tspan>missed<tspan data-gap="" dx="1.68587"> </tspan>it.<tspan data-gap="" dx="1.68587"> </tspan>Check<tspan data-gap="" dx="1.68587"> </tspan>that<tspan data-gap="" dx="1.68587"> </tspan>patch<tspan data-gap="" dx="1.68587"> </tspan>on<tspan data-gap="" dx="1.68587"> </tspan>the<tspan data-gap="" dx="1.68587"> </tspan>actual<tspan data-gap="" dx="1.68587"> </tspan>leaf<tspan data-gap="" dx="1.68587"> </tspan>before<tspan data-gap="" dx="1.68587"> </tspan>describing<tspan data-gap="" dx="1.68587"> </tspan>its<tspan data-gap="" dx="1.68587"> </tspan>veins.</tspan><tspan x="89" dy="31">Keep<tspan data-gap="" dx="0.55149"> </tspan>an<tspan data-gap="" dx="0.55149"> </tspan>unclear<tspan data-gap="" dx="0.55149"> </tspan>print<tspan data-gap="" dx="0.55149"> </tspan>beside<tspan data-gap="" dx="0.55149"> </tspan>your<tspan data-gap="" dx="0.55149"> </tspan>improved<tspan data-gap="" dx="0.55149"> </tspan>one<tspan data-gap="" dx="0.55149"> </tspan>so<tspan data-gap="" dx="0.55149"> </tspan>you<tspan data-gap="" dx="0.55149"> </tspan>can<tspan data-gap="" dx="0.55149"> </tspan>explain<tspan data-gap="" dx="0.55149"> </tspan>why<tspan data-gap="" dx="0.55149"> </tspan>you<tspan data-gap="" dx="0.55149"> </tspan>changed</tspan><tspan x="89" dy="31">the record.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1165"><tspan x="89">Compare<tspan data-gap="" dx="5.48238"> </tspan>the<tspan data-gap="" dx="5.48238"> </tspan>vein<tspan data-gap="" dx="5.48238"> </tspan>pattern<tspan data-gap="" dx="5.48238"> </tspan>separately<tspan data-gap="" dx="5.48238"> </tspan>from<tspan data-gap="" dx="5.48238"> </tspan>the<tspan data-gap="" dx="5.48238"> </tspan>leaf<tspan data-gap="" dx="5.48238"> </tspan>outline.<tspan data-gap="" dx="5.48238"> </tspan>Two<tspan data-gap="" dx="5.48238"> </tspan>leaves<tspan data-gap="" dx="5.48238"> </tspan>can<tspan data-gap="" dx="5.48238"> </tspan>have</tspan><tspan x="89" dy="31">different<tspan data-gap="" dx="6.01302"> </tspan>outlines<tspan data-gap="" dx="6.01302"> </tspan>yet<tspan data-gap="" dx="6.01302"> </tspan>share<tspan data-gap="" dx="6.01302"> </tspan>a<tspan data-gap="" dx="6.01302"> </tspan>vein<tspan data-gap="" dx="6.01302"> </tspan>pattern.<tspan data-gap="" dx="6.01302"> </tspan>Point<tspan data-gap="" dx="6.01302"> </tspan>to<tspan data-gap="" dx="6.01302"> </tspan>the<tspan data-gap="" dx="6.01302"> </tspan>lines<tspan data-gap="" dx="6.01302"> </tspan>that<tspan data-gap="" dx="6.01302"> </tspan>support<tspan data-gap="" dx="6.01302"> </tspan>your</tspan><tspan x="89" dy="31">grouping;<tspan data-gap="" dx="4.61641"> </tspan>another<tspan data-gap="" dx="4.61641"> </tspan>group<tspan data-gap="" dx="4.61641"> </tspan>should<tspan data-gap="" dx="4.61641"> </tspan>be<tspan data-gap="" dx="4.61641"> </tspan>able<tspan data-gap="" dx="4.61641"> </tspan>to<tspan data-gap="" dx="4.61641"> </tspan>follow<tspan data-gap="" dx="4.61641"> </tspan>your<tspan data-gap="" dx="4.61641"> </tspan>rule<tspan data-gap="" dx="4.61641"> </tspan>without<tspan data-gap="" dx="4.61641"> </tspan>knowing<tspan data-gap="" dx="4.61641"> </tspan>the</tspan><tspan x="89" dy="31">plant names.</tspan></text>
