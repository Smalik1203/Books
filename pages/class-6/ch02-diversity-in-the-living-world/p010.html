<section class="page page--food page--science-editorial" data-science-chapter="2" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World, page 10"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M31 63Q34 30 60 7"/><path class="se-botanical-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 2</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Diversity in the Living World</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header -->
<text class="se-copy" data-measure="874" x="89" y="119"><tspan x="89">So<tspan data-gap="" dx="2.54170"> </tspan>far<tspan data-gap="" dx="2.54170"> </tspan>you<tspan data-gap="" dx="2.54170"> </tspan>have<tspan data-gap="" dx="2.54170"> </tspan>grouped<tspan data-gap="" dx="2.54170"> </tspan>plants<tspan data-gap="" dx="2.54170"> </tspan>using<tspan data-gap="" dx="2.54170"> </tspan>only<tspan data-gap="" dx="2.54170"> </tspan>the<tspan data-gap="" dx="2.54170"> </tspan>stem.<tspan data-gap="" dx="2.54170"> </tspan>Leaves<tspan data-gap="" dx="2.54170"> </tspan>give<tspan data-gap="" dx="2.54170"> </tspan>us<tspan data-gap="" dx="2.54170"> </tspan>another<tspan data-gap="" dx="2.54170"> </tspan>way<tspan data-gap="" dx="2.54170"> </tspan>to</tspan><tspan x="89" dy="31">sort the same plants. That way turns out to be more useful.</tspan></text>
<text class="se-heading" x="89" y="200"><tspan x="89">Lines on a Leaf</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="250"><tspan x="89">Hold<tspan data-gap="" dx="3.22553"> </tspan>a<tspan data-gap="" dx="3.22553"> </tspan>leaf<tspan data-gap="" dx="3.22553"> </tspan>up<tspan data-gap="" dx="3.22553"> </tspan>against<tspan data-gap="" dx="3.22553"> </tspan>the<tspan data-gap="" dx="3.22553"> </tspan>light.<tspan data-gap="" dx="3.22553"> </tspan>You<tspan data-gap="" dx="3.22553"> </tspan>will<tspan data-gap="" dx="3.22553"> </tspan>see<tspan data-gap="" dx="3.22553"> </tspan>thin<tspan data-gap="" dx="3.22553"> </tspan>lines<tspan data-gap="" dx="3.22553"> </tspan>running<tspan data-gap="" dx="3.22553"> </tspan>through<tspan data-gap="" dx="3.22553"> </tspan>it.<tspan data-gap="" dx="3.22553"> </tspan>These</tspan><tspan x="89" dy="31">lines are <tspan class="se-bold">veins</tspan>. The pattern the veins make is called <tspan class="se-bold">venation</tspan>.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="326"><tspan x="89">Veins<tspan data-gap="" dx="1.25874"> </tspan>are<tspan data-gap="" dx="1.25874"> </tspan>not<tspan data-gap="" dx="1.25874"> </tspan>just<tspan data-gap="" dx="1.25874"> </tspan>for<tspan data-gap="" dx="1.25874"> </tspan>decoration.<tspan data-gap="" dx="1.25874"> </tspan>They<tspan data-gap="" dx="1.25874"> </tspan>are<tspan data-gap="" dx="1.25874"> </tspan>pipes.<tspan data-gap="" dx="1.25874"> </tspan>They<tspan data-gap="" dx="1.25874"> </tspan>carry<tspan data-gap="" dx="1.25874"> </tspan>water<tspan data-gap="" dx="1.25874"> </tspan>into<tspan data-gap="" dx="1.25874"> </tspan>the<tspan data-gap="" dx="1.25874"> </tspan>leaf,<tspan data-gap="" dx="1.25874"> </tspan>and</tspan><tspan x="89" dy="31">carry<tspan data-gap="" dx="0.90149"> </tspan>food<tspan data-gap="" dx="0.90149"> </tspan>away<tspan data-gap="" dx="0.90149"> </tspan>from<tspan data-gap="" dx="0.90149"> </tspan>it.<tspan data-gap="" dx="0.90149"> </tspan>They<tspan data-gap="" dx="0.90149"> </tspan>also<tspan data-gap="" dx="0.90149"> </tspan>make<tspan data-gap="" dx="0.90149"> </tspan>the<tspan data-gap="" dx="0.90149"> </tspan>leaf<tspan data-gap="" dx="0.90149"> </tspan>stiff,<tspan data-gap="" dx="0.90149"> </tspan>so<tspan data-gap="" dx="0.90149"> </tspan>it<tspan data-gap="" dx="0.90149"> </tspan>holds<tspan data-gap="" dx="0.90149"> </tspan>its<tspan data-gap="" dx="0.90149"> </tspan>shape<tspan data-gap="" dx="0.90149"> </tspan>instead<tspan data-gap="" dx="0.90149"> </tspan>of</tspan><tspan x="89" dy="31">hanging loose.</tspan></text>
<rect class="se-activity-panel" x="89" y="424" width="874" height="416"/><path class="se-activity-tab" d="M109 410H943Q963 410 963 430V453H89V430Q89 410 109 410Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="416" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="438" text-anchor="start">The setup</text><text class="se-copy" x="113" y="486"><tspan x="113">You will need: fallen leaves of at least four different plants, thin paper, a pencil</tspan><tspan x="113" dy="31">with soft lead.</tspan></text><text class="se-activity-step" x="128" y="560" text-anchor="end">1.</text><text class="se-copy" x="146" y="560"><tspan x="146">Put a leaf on the desk with its back side facing up. The veins stand out more</tspan><tspan x="146" dy="31">on that side.</tspan></text><text class="se-activity-step" x="128" y="634" text-anchor="end">2.</text><text class="se-copy" x="146" y="634"><tspan x="146">Place a sheet of thin paper over the leaf.</tspan></text><text class="se-activity-step" x="128" y="677" text-anchor="end">3.</text><text class="se-copy" x="146" y="677"><tspan x="146">Hold the paper still. Rub the side of the pencil lead flat across it, using light</tspan><tspan x="146" dy="31">strokes.</tspan></text><text class="se-activity-step" x="128" y="751" text-anchor="end">4.</text><text class="se-copy" x="146" y="751"><tspan x="146">The pattern of veins will appear on the paper.</tspan></text><text class="se-activity-step" x="128" y="794" text-anchor="end">5.</text><text class="se-copy" x="146" y="794"><tspan x="146">Do this for every leaf. Write the plant's name next to each print.</tspan></text>
<rect class="se-prompt" x="89" y="860" width="874" height="154"/><line class="se-think-rule" x1="89" x2="963" y1="860" y2="860"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What you saw"><svg class="se-feature-icon se-feature--observe" x="113" y="869" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="898">What you saw</text></g><text class="se-copy" x="113" y="955"><tspan x="113">Put all your prints side by side. Sort your prints into two piles, using the pattern</tspan><tspan x="113" dy="31">only. What rule did you use?</tspan></text>
<text class="se-copy" x="89" y="1055"><tspan x="89">Choose leaves whose veins are easy to feel. If a print looks faint, first check that the</tspan><tspan x="89" dy="31">raised veins face the paper and that the paper is held still. A poor print need not</tspan><tspan x="89" dy="31">mean that the leaf has no veins.</tspan></text>
<text class="se-copy" x="89" y="1162"><tspan x="89">Try the same method on another leaf before changing how you make the print.</tspan><tspan x="89" dy="31">Compare the patterns, not just their darkness.</tspan></text>
