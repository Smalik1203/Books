<text class="se-heading" x="89" y="124"><tspan x="89">Two Patterns</tspan></text><text class="se-copy" data-measure="874" x="89" y="174"><tspan x="89">Compare<tspan data-gap="" dx="3.43572"> </tspan>your<tspan data-gap="" dx="3.43572"> </tspan>prints<tspan data-gap="" dx="3.43572"> </tspan>with<tspan data-gap="" dx="3.43572"> </tspan>these<tspan data-gap="" dx="3.43572"> </tspan>examples.<tspan data-gap="" dx="3.43572"> </tspan>Two<tspan data-gap="" dx="3.43572"> </tspan>common<tspan data-gap="" dx="3.43572"> </tspan>patterns<tspan data-gap="" dx="3.43572"> </tspan>are<tspan data-gap="" dx="3.43572"> </tspan>shown<tspan data-gap="" dx="3.43572"> </tspan>here;</tspan><tspan x="89" dy="31">your sample may contain only one.</tspan></text><image class="science-illustration" href="../../figures/class-6/science/ch02/veins.png" x="89" y="231" width="874" height="325" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="309.5812356979405" y="581" text-anchor="middle">Hibiscus · reticulate</text><text class="se-caption" x="526" y="581" text-anchor="middle">Banana · parallel</text><text class="se-caption" x="742.4187643020596" y="581" text-anchor="middle">Grass · parallel</text><text class="se-copy" x="89" y="628"><tspan x="89">In <tspan class="se-bold">reticulate</tspan> <tspan class="se-bold">venation</tspan>, veins branch to</tspan><tspan x="89" dy="31">form a net. A thick middle vein is visible</tspan><tspan x="89" dy="31">in the hibiscus leaf; finer veins branch</tspan><tspan x="89" dy="31">and join around it. Mango, neem and</tspan><tspan x="89" dy="31">peepal also have net-like venation.</tspan></text><text class="se-copy" x="542" y="628"><tspan x="542">In other leaves, many veins run</tspan><tspan x="542" dy="31">alongside one another. This pattern is</tspan><tspan x="542" dy="31">called <tspan class="se-bold">parallel</tspan> <tspan class="se-bold">venation</tspan>. In a grass blade</tspan><tspan x="542" dy="31">they run along the length of the leaf. A</tspan><tspan x="542" dy="31">banana leaf has a strong middle vein,</tspan><tspan x="542" dy="31">with many parallel side veins running</tspan><tspan x="542" dy="31">out towards its edges. Parallel venation</tspan><tspan x="542" dy="31">does not mean that a leaf has no middle</tspan><tspan x="542" dy="31">vein.</tspan></text><line class="se-editorial-divider" x1="89" x2="963" y1="910" y2="910"/><text class="se-copy" data-measure="874" x="89" y="957"><tspan x="89">These<tspan data-gap="" dx="2.31772"> </tspan>two<tspan data-gap="" dx="2.31772"> </tspan>patterns<tspan data-gap="" dx="2.31772"> </tspan>help<tspan data-gap="" dx="2.31772"> </tspan>you<tspan data-gap="" dx="2.31772"> </tspan>compare<tspan data-gap="" dx="2.31772"> </tspan>many<tspan data-gap="" dx="2.31772"> </tspan>of<tspan data-gap="" dx="2.31772"> </tspan>the<tspan data-gap="" dx="2.31772"> </tspan>leaves<tspan data-gap="" dx="2.31772"> </tspan>around<tspan data-gap="" dx="2.31772"> </tspan>you.<tspan data-gap="" dx="2.31772"> </tspan>Look<tspan data-gap="" dx="2.31772"> </tspan>closely:</tspan><tspan x="89" dy="31">real leaves sometimes show exceptions.</tspan></text><text class="se-copy" data-measure="874" x="89" y="1037"><tspan x="89">Predict<tspan data-gap="" dx="1.99503"> </tspan>the<tspan data-gap="" dx="1.99503"> </tspan>venation<tspan data-gap="" dx="1.99503"> </tspan>of<tspan data-gap="" dx="1.99503"> </tspan>wheat<tspan data-gap="" dx="1.99503"> </tspan>or<tspan data-gap="" dx="1.99503"> </tspan>maize<tspan data-gap="" dx="1.99503"> </tspan>from<tspan data-gap="" dx="1.99503"> </tspan>the<tspan data-gap="" dx="1.99503"> </tspan>examples.<tspan data-gap="" dx="1.99503"> </tspan>Then<tspan data-gap="" dx="1.99503"> </tspan>inspect<tspan data-gap="" dx="1.99503"> </tspan>a<tspan data-gap="" dx="1.99503"> </tspan>leaf<tspan data-gap="" dx="1.99503"> </tspan>or<tspan data-gap="" dx="1.99503"> </tspan>a</tspan><tspan x="89" dy="31">clear<tspan data-gap="" dx="2.39507"> </tspan>photograph.<tspan data-gap="" dx="2.39507"> </tspan>Was<tspan data-gap="" dx="2.39507"> </tspan>your<tspan data-gap="" dx="2.39507"> </tspan>prediction<tspan data-gap="" dx="2.39507"> </tspan>supported?<tspan data-gap="" dx="2.39507"> </tspan>Leaf<tspan data-gap="" dx="2.39507"> </tspan>shape<tspan data-gap="" dx="2.39507"> </tspan>alone<tspan data-gap="" dx="2.39507"> </tspan>is<tspan data-gap="" dx="2.39507"> </tspan>not<tspan data-gap="" dx="2.39507"> </tspan>proof<tspan data-gap="" dx="2.39507"> </tspan>of</tspan><tspan x="89" dy="31">its vein pattern.</tspan></text><text class="se-copy" data-measure="874" x="89" y="1148"><tspan x="89">Leaves are only part of the comparison. Next, examine roots.</tspan></text>
