<text class="se-heading" x="89" y="124"><tspan x="89">2.2.2 Grouping Animals</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="174"><tspan x="89">Animals<tspan data-gap="" dx="2.30776"> </tspan>vary<tspan data-gap="" dx="2.30776"> </tspan>as<tspan data-gap="" dx="2.30776"> </tspan>much<tspan data-gap="" dx="2.30776"> </tspan>as<tspan data-gap="" dx="2.30776"> </tspan>plants<tspan data-gap="" dx="2.30776"> </tspan>do.<tspan data-gap="" dx="2.30776"> </tspan>So<tspan data-gap="" dx="2.30776"> </tspan>the<tspan data-gap="" dx="2.30776"> </tspan>same<tspan data-gap="" dx="2.30776"> </tspan>question<tspan data-gap="" dx="2.30776"> </tspan>comes<tspan data-gap="" dx="2.30776"> </tspan>up.<tspan data-gap="" dx="2.30776"> </tspan>Which<tspan data-gap="" dx="2.30776"> </tspan>feature</tspan><tspan x="89" dy="31">should we use to group them?</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="250"><tspan x="89">Colour<tspan data-gap="" dx="1.21273"> </tspan>or<tspan data-gap="" dx="1.21273"> </tspan>size<tspan data-gap="" dx="1.21273"> </tspan>may<tspan data-gap="" dx="1.21273"> </tspan>be<tspan data-gap="" dx="1.21273"> </tspan>useful<tspan data-gap="" dx="1.21273"> </tspan>for<tspan data-gap="" dx="1.21273"> </tspan>some<tspan data-gap="" dx="1.21273"> </tspan>questions.<tspan data-gap="" dx="1.21273"> </tspan>To<tspan data-gap="" dx="1.21273"> </tspan>compare<tspan data-gap="" dx="1.21273"> </tspan>movement,<tspan data-gap="" dx="1.21273"> </tspan>we<tspan data-gap="" dx="1.21273"> </tspan>need<tspan data-gap="" dx="1.21273"> </tspan>to</tspan><tspan x="89" dy="31">record how an animal moves and which body parts it uses.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="326"><tspan x="89">Use<tspan data-gap="" dx="1.75635"> </tspan>your<tspan data-gap="" dx="1.75635"> </tspan>animal<tspan data-gap="" dx="1.75635"> </tspan>records<tspan data-gap="" dx="1.75635"> </tspan>as<tspan data-gap="" dx="1.75635"> </tspan>a<tspan data-gap="" dx="1.75635"> </tspan>starting<tspan data-gap="" dx="1.75635"> </tspan>point.<tspan data-gap="" dx="1.75635"> </tspan>Add<tspan data-gap="" dx="1.75635"> </tspan>observations<tspan data-gap="" dx="1.75635"> </tspan>from<tspan data-gap="" dx="1.75635"> </tspan>direct<tspan data-gap="" dx="1.75635"> </tspan>watching</tspan><tspan x="89" dy="31">or a reliable video, and identify which source you used.</tspan></text>
<rect class="se-activity-panel" x="89" y="393" width="874" height="299"/><path class="se-activity-tab" d="M109 379H943Q963 379 963 399V422H89V399Q89 379 109 379Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="385" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="407" text-anchor="start">Investigate</text><text class="se-activity-step" x="128" y="455" text-anchor="end">1.</text><text class="se-copy" x="146" y="455"><tspan x="146">Choose four animals you can safely watch or observe in a reliable video.</tspan><tspan x="146" dy="31">Include one that moves in more than one way.</tspan></text><text class="se-activity-step" x="128" y="529" text-anchor="end">2.</text><text class="se-copy" x="146" y="529"><tspan x="146">For each one, write how it moves and which body part it uses.</tspan></text><text class="se-activity-step" x="128" y="572" text-anchor="end">3.</text><text class="se-copy" x="146" y="572"><tspan x="146">Use Table 2.5 as a guide for your notebook table.</tspan></text><text class="se-activity-step" x="128" y="615" text-anchor="end">4.</text><text class="se-copy" x="146" y="615"><tspan x="146">Group your animals using the body parts you observed in use. Allow a record</tspan><tspan x="146" dy="31">to appear in more than one group if your rule requires it.</tspan></text>
