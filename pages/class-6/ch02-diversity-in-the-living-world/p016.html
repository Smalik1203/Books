<text class="se-copy" data-measure="874" x="89" y="119"><tspan x="89">That<tspan data-gap="" dx="2.23211"> </tspan>is<tspan data-gap="" dx="2.23211"> </tspan>what<tspan data-gap="" dx="2.23211"> </tspan>makes<tspan data-gap="" dx="2.23211"> </tspan>a<tspan data-gap="" dx="2.23211"> </tspan>grouping<tspan data-gap="" dx="2.23211"> </tspan>really<tspan data-gap="" dx="2.23211"> </tspan>useful.<tspan data-gap="" dx="2.23211"> </tspan>It<tspan data-gap="" dx="2.23211"> </tspan>lets<tspan data-gap="" dx="2.23211"> </tspan>you<tspan data-gap="" dx="2.23211"> </tspan>say<tspan data-gap="" dx="2.23211"> </tspan>something<tspan data-gap="" dx="2.23211"> </tspan>new.<tspan data-gap="" dx="2.23211"> </tspan>It<tspan data-gap="" dx="2.23211"> </tspan>does</tspan><tspan x="89" dy="31">not just tidy up what you already knew.</tspan></text>
<text class="se-heading" x="89" y="200"><tspan x="89">2.2.2 Grouping Animals</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="250"><tspan x="89">Animals<tspan data-gap="" dx="2.30776"> </tspan>vary<tspan data-gap="" dx="2.30776"> </tspan>as<tspan data-gap="" dx="2.30776"> </tspan>much<tspan data-gap="" dx="2.30776"> </tspan>as<tspan data-gap="" dx="2.30776"> </tspan>plants<tspan data-gap="" dx="2.30776"> </tspan>do.<tspan data-gap="" dx="2.30776"> </tspan>So<tspan data-gap="" dx="2.30776"> </tspan>the<tspan data-gap="" dx="2.30776"> </tspan>same<tspan data-gap="" dx="2.30776"> </tspan>question<tspan data-gap="" dx="2.30776"> </tspan>comes<tspan data-gap="" dx="2.30776"> </tspan>up.<tspan data-gap="" dx="2.30776"> </tspan>Which<tspan data-gap="" dx="2.30776"> </tspan>feature</tspan><tspan x="89" dy="31">should we use to group them?</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="326"><tspan x="89">Colour<tspan data-gap="" dx="1.53935"> </tspan>is<tspan data-gap="" dx="1.53935"> </tspan>easy<tspan data-gap="" dx="1.53935"> </tspan>to<tspan data-gap="" dx="1.53935"> </tspan>see,<tspan data-gap="" dx="1.53935"> </tspan>but<tspan data-gap="" dx="1.53935"> </tspan>it<tspan data-gap="" dx="1.53935"> </tspan>tells<tspan data-gap="" dx="1.53935"> </tspan>us<tspan data-gap="" dx="1.53935"> </tspan>very<tspan data-gap="" dx="1.53935"> </tspan>little.<tspan data-gap="" dx="1.53935"> </tspan>Size<tspan data-gap="" dx="1.53935"> </tspan>is<tspan data-gap="" dx="1.53935"> </tspan>not<tspan data-gap="" dx="1.53935"> </tspan>much<tspan data-gap="" dx="1.53935"> </tspan>better.<tspan data-gap="" dx="1.53935"> </tspan>A<tspan data-gap="" dx="1.53935"> </tspan>big<tspan data-gap="" dx="1.53935"> </tspan>animal</tspan><tspan x="89" dy="31">and a small one may live in exactly the same way.</tspan></text>
