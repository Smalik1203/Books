<text class="se-copy" data-measure="874" x="89" y="119"><tspan x="89">Suppose<tspan data-gap="" dx="2.36238"> </tspan>a<tspan data-gap="" dx="2.36238"> </tspan>cactus<tspan data-gap="" dx="2.36238"> </tspan>from<tspan data-gap="" dx="2.36238"> </tspan>a<tspan data-gap="" dx="2.36238"> </tspan>frost-free<tspan data-gap="" dx="2.36238"> </tspan>desert<tspan data-gap="" dx="2.36238"> </tspan>is<tspan data-gap="" dx="2.36238"> </tspan>moved<tspan data-gap="" dx="2.36238"> </tspan>to<tspan data-gap="" dx="2.36238"> </tspan>a<tspan data-gap="" dx="2.36238"> </tspan>place<tspan data-gap="" dx="2.36238"> </tspan>with<tspan data-gap="" dx="2.36238"> </tspan>freezing<tspan data-gap="" dx="2.36238"> </tspan>winters</tspan><tspan x="89" dy="31">and<tspan data-gap="" dx="8.35016"> </tspan>persistently<tspan data-gap="" dx="8.35016"> </tspan>wet<tspan data-gap="" dx="8.35016"> </tspan>soil.<tspan data-gap="" dx="8.35016"> </tspan>Which<tspan data-gap="" dx="8.35016"> </tspan>new<tspan data-gap="" dx="8.35016"> </tspan>conditions<tspan data-gap="" dx="8.35016"> </tspan>would<tspan data-gap="" dx="8.35016"> </tspan>you<tspan data-gap="" dx="8.35016"> </tspan>investigate<tspan data-gap="" dx="8.35016"> </tspan>before</tspan><tspan x="89" dy="31">deciding<tspan data-gap="" dx="7.67757"> </tspan>whether<tspan data-gap="" dx="7.67757"> </tspan>it<tspan data-gap="" dx="7.67757"> </tspan>could<tspan data-gap="" dx="7.67757"> </tspan>survive?<tspan data-gap="" dx="7.67757"> </tspan>The<tspan data-gap="" dx="7.67757"> </tspan>word<tspan data-gap="" dx="7.67757"> </tspan>"mountain"<tspan data-gap="" dx="7.67757"> </tspan>alone<tspan data-gap="" dx="7.67757"> </tspan>is<tspan data-gap="" dx="7.67757"> </tspan>not<tspan data-gap="" dx="7.67757"> </tspan>enough</tspan><tspan x="89" dy="31">information.</tspan></text><text class="se-heading" x="89" y="266"><tspan x="89">Two Camels, Two Deserts</tspan></text><text class="se-copy" data-measure="874" x="89" y="316"><tspan x="89">Compare<tspan data-gap="" dx="1.82804"> </tspan>the<tspan data-gap="" dx="1.82804"> </tspan>two<tspan data-gap="" dx="1.82804"> </tspan>kinds<tspan data-gap="" dx="1.82804"> </tspan>of<tspan data-gap="" dx="1.82804"> </tspan>camel<tspan data-gap="" dx="1.82804"> </tspan>in<tspan data-gap="" dx="1.82804"> </tspan>the<tspan data-gap="" dx="1.82804"> </tspan>illustration.<tspan data-gap="" dx="1.82804"> </tspan>Which<tspan data-gap="" dx="1.82804"> </tspan>visible<tspan data-gap="" dx="1.82804"> </tspan>differences<tspan data-gap="" dx="1.82804"> </tspan>could</tspan><tspan x="89" dy="31">matter in cold weather?</tspan></text><text class="se-copy" data-measure="874" x="89" y="396"><tspan x="89">Camels<tspan data-gap="" dx="1.82774"> </tspan>live<tspan data-gap="" dx="1.82774"> </tspan>in<tspan data-gap="" dx="1.82774"> </tspan>the<tspan data-gap="" dx="1.82774"> </tspan>hot<tspan data-gap="" dx="1.82774"> </tspan>sandy<tspan data-gap="" dx="1.82774"> </tspan>desert<tspan data-gap="" dx="1.82774"> </tspan>of<tspan data-gap="" dx="1.82774"> </tspan>Rajasthan.<tspan data-gap="" dx="1.82774"> </tspan>Camels<tspan data-gap="" dx="1.82774"> </tspan>also<tspan data-gap="" dx="1.82774"> </tspan>live<tspan data-gap="" dx="1.82774"> </tspan>in<tspan data-gap="" dx="1.82774"> </tspan>the<tspan data-gap="" dx="1.82774"> </tspan>cold,<tspan data-gap="" dx="1.82774"> </tspan>high,</tspan><tspan x="89" dy="31">rocky<tspan data-gap="" dx="3.31939"> </tspan>desert<tspan data-gap="" dx="3.31939"> </tspan>of<tspan data-gap="" dx="3.31939"> </tspan>Ladakh.<tspan data-gap="" dx="3.31939"> </tspan>Both<tspan data-gap="" dx="3.31939"> </tspan>places<tspan data-gap="" dx="3.31939"> </tspan>are<tspan data-gap="" dx="3.31939"> </tspan>deserts.<tspan data-gap="" dx="3.31939"> </tspan>Both<tspan data-gap="" dx="3.31939"> </tspan>are<tspan data-gap="" dx="3.31939"> </tspan>dry,<tspan data-gap="" dx="3.31939"> </tspan>with<tspan data-gap="" dx="3.31939"> </tspan>little<tspan data-gap="" dx="3.31939"> </tspan>food<tspan data-gap="" dx="3.31939"> </tspan>and</tspan><tspan x="89" dy="31">little<tspan data-gap="" dx="1.11373"> </tspan>shelter.<tspan data-gap="" dx="1.11373"> </tspan>But<tspan data-gap="" dx="1.11373"> </tspan>they<tspan data-gap="" dx="1.11373"> </tspan>are<tspan data-gap="" dx="1.11373"> </tspan>dry<tspan data-gap="" dx="1.11373"> </tspan>in<tspan data-gap="" dx="1.11373"> </tspan>very<tspan data-gap="" dx="1.11373"> </tspan>different<tspan data-gap="" dx="1.11373"> </tspan>ways.<tspan data-gap="" dx="1.11373"> </tspan>And<tspan data-gap="" dx="1.11373"> </tspan>the<tspan data-gap="" dx="1.11373"> </tspan>two<tspan data-gap="" dx="1.11373"> </tspan>camels<tspan data-gap="" dx="1.11373"> </tspan>are<tspan data-gap="" dx="1.11373"> </tspan>not<tspan data-gap="" dx="1.11373"> </tspan>the</tspan><tspan x="89" dy="31">same.</tspan></text><image class="science-illustration" href="../../figures/class-6/science/ch02/camels.png" x="89" y="515" width="874" height="280" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="386.3203661327231" y="820" text-anchor="middle">Dromedary · one hump</text><text class="se-caption" x="665.6796338672768" y="820" text-anchor="middle">Bactrian · two humps</text><text class="se-copy" x="89" y="867"><tspan x="89">The Rajasthan camel is tall, with long</tspan><tspan x="89" dy="31">legs. Its two-toed feet have broad,</tspan><tspan x="89" dy="31">spreading pads. They spread its weight,</tspan><tspan x="89" dy="31">so it does not sink into loose sand. It has</tspan><tspan x="89" dy="31">one hump. Its coat is thin.</tspan></text><text class="se-copy" x="542" y="867"><tspan x="542">The Ladakh camel is shorter and</tspan><tspan x="542" dy="31">heavier. Its sturdy legs also end in broad,</tspan><tspan x="542" dy="31">padded, two-toed feet. It has two</tspan><tspan x="542" dy="31">humps. It grows a thick shaggy coat,</tspan><tspan x="542" dy="31">especially at the head and neck, for</tspan><tspan x="542" dy="31">winters that fall far below freezing.</tspan></text><line class="se-editorial-divider" x1="89" x2="963" y1="1056" y2="1056"/><text class="se-copy" data-measure="874" x="89" y="1103"><tspan x="89">You<tspan data-gap="" dx="3.79354"> </tspan>may<tspan data-gap="" dx="3.79354"> </tspan>have<tspan data-gap="" dx="3.79354"> </tspan>heard<tspan data-gap="" dx="3.79354"> </tspan>that<tspan data-gap="" dx="3.79354"> </tspan>a<tspan data-gap="" dx="3.79354"> </tspan>camel<tspan data-gap="" dx="3.79354"> </tspan>stores<tspan data-gap="" dx="3.79354"> </tspan>water<tspan data-gap="" dx="3.79354"> </tspan>in<tspan data-gap="" dx="3.79354"> </tspan>its<tspan data-gap="" dx="3.79354"> </tspan>hump.<tspan data-gap="" dx="3.79354"> </tspan>That<tspan data-gap="" dx="3.79354"> </tspan>is<tspan data-gap="" dx="3.79354"> </tspan>not<tspan data-gap="" dx="3.79354"> </tspan>true.<tspan data-gap="" dx="3.79354"> </tspan>The</tspan><tspan x="89" dy="31">hump<tspan data-gap="" dx="2.78395"> </tspan>stores<tspan data-gap="" dx="2.78395"> </tspan>fat.<tspan data-gap="" dx="2.78395"> </tspan>The<tspan data-gap="" dx="2.78395"> </tspan>camel<tspan data-gap="" dx="2.78395"> </tspan>lives<tspan data-gap="" dx="2.78395"> </tspan>off<tspan data-gap="" dx="2.78395"> </tspan>that<tspan data-gap="" dx="2.78395"> </tspan>fat<tspan data-gap="" dx="2.78395"> </tspan>when<tspan data-gap="" dx="2.78395"> </tspan>there<tspan data-gap="" dx="2.78395"> </tspan>is<tspan data-gap="" dx="2.78395"> </tspan>no<tspan data-gap="" dx="2.78395"> </tspan>food.<tspan data-gap="" dx="2.78395"> </tspan>When<tspan data-gap="" dx="2.78395"> </tspan>a<tspan data-gap="" dx="2.78395"> </tspan>camel</tspan><tspan x="89" dy="31">uses much of this stored fat, its humps can become smaller and less upright.</tspan></text>
