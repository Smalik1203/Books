<text class="se-copy" data-measure="874" x="89" y="174"><tspan x="89">Animals<tspan data-gap="" dx="2.16859"> </tspan>move<tspan data-gap="" dx="2.16859"> </tspan>in<tspan data-gap="" dx="2.16859"> </tspan>many<tspan data-gap="" dx="2.16859"> </tspan>ways.<tspan data-gap="" dx="2.16859"> </tspan>They<tspan data-gap="" dx="2.16859"> </tspan>walk,<tspan data-gap="" dx="2.16859"> </tspan>run,<tspan data-gap="" dx="2.16859"> </tspan>hop,<tspan data-gap="" dx="2.16859"> </tspan>crawl,<tspan data-gap="" dx="2.16859"> </tspan>fly,<tspan data-gap="" dx="2.16859"> </tspan>swim<tspan data-gap="" dx="2.16859"> </tspan>and<tspan data-gap="" dx="2.16859"> </tspan>glide.<tspan data-gap="" dx="2.16859"> </tspan>Some</tspan><tspan x="89" dy="31">do more than one, like a pigeon.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="250"><tspan x="89">Sorting<tspan data-gap="" dx="1.20712"> </tspan>them<tspan data-gap="" dx="1.20712"> </tspan>this<tspan data-gap="" dx="1.20712"> </tspan>way<tspan data-gap="" dx="1.20712"> </tspan>shows<tspan data-gap="" dx="1.20712"> </tspan>us<tspan data-gap="" dx="1.20712"> </tspan>something<tspan data-gap="" dx="1.20712"> </tspan>interesting.<tspan data-gap="" dx="1.20712"> </tspan>Animals<tspan data-gap="" dx="1.20712"> </tspan>that<tspan data-gap="" dx="1.20712"> </tspan>are<tspan data-gap="" dx="1.20712"> </tspan>not<tspan data-gap="" dx="1.20712"> </tspan>alike<tspan data-gap="" dx="1.20712"> </tspan>at</tspan><tspan x="89" dy="31">all<tspan data-gap="" dx="0.60093"> </tspan>may<tspan data-gap="" dx="0.60093"> </tspan>still<tspan data-gap="" dx="0.60093"> </tspan>move<tspan data-gap="" dx="0.60093"> </tspan>in<tspan data-gap="" dx="0.60093"> </tspan>the<tspan data-gap="" dx="0.60093"> </tspan>same<tspan data-gap="" dx="0.60093"> </tspan>way,<tspan data-gap="" dx="0.60093"> </tspan>using<tspan data-gap="" dx="0.60093"> </tspan>similar<tspan data-gap="" dx="0.60093"> </tspan>body<tspan data-gap="" dx="0.60093"> </tspan>parts.<tspan data-gap="" dx="0.60093"> </tspan>A<tspan data-gap="" dx="0.60093"> </tspan>housefly<tspan data-gap="" dx="0.60093"> </tspan>and<tspan data-gap="" dx="0.60093"> </tspan>a<tspan data-gap="" dx="0.60093"> </tspan>pigeon</tspan><tspan x="89" dy="31">are<tspan data-gap="" dx="1.51912"> </tspan>very<tspan data-gap="" dx="1.51912"> </tspan>different<tspan data-gap="" dx="1.51912"> </tspan>creatures.<tspan data-gap="" dx="1.51912"> </tspan>But<tspan data-gap="" dx="1.51912"> </tspan>both<tspan data-gap="" dx="1.51912"> </tspan>have<tspan data-gap="" dx="1.51912"> </tspan>wings,<tspan data-gap="" dx="1.51912"> </tspan>and<tspan data-gap="" dx="1.51912"> </tspan>both<tspan data-gap="" dx="1.51912"> </tspan>fly.<tspan data-gap="" dx="1.51912"> </tspan>A<tspan data-gap="" dx="1.51912"> </tspan>fish<tspan data-gap="" dx="1.51912"> </tspan>and<tspan data-gap="" dx="1.51912"> </tspan>a<tspan data-gap="" dx="1.51912"> </tspan>dolphin</tspan><tspan x="89" dy="31">look alike in water, even though a dolphin is not a fish.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="388"><tspan x="89">That<tspan data-gap="" dx="0.18283"> </tspan>is<tspan data-gap="" dx="0.18283"> </tspan>a<tspan data-gap="" dx="0.18283"> </tspan>clue<tspan data-gap="" dx="0.18283"> </tspan>about<tspan data-gap="" dx="0.18283"> </tspan>something<tspan data-gap="" dx="0.18283"> </tspan>you<tspan data-gap="" dx="0.18283"> </tspan>will<tspan data-gap="" dx="0.18283"> </tspan>meet<tspan data-gap="" dx="0.18283"> </tspan>soon<tspan data-gap="" dx="0.18283"> </tspan>in<tspan data-gap="" dx="0.18283"> </tspan>this<tspan data-gap="" dx="0.18283"> </tspan>chapter.<tspan data-gap="" dx="0.18283"> </tspan>The<tspan data-gap="" dx="0.18283"> </tspan>way<tspan data-gap="" dx="0.18283"> </tspan>an<tspan data-gap="" dx="0.18283"> </tspan>animal</tspan><tspan x="89" dy="31">is built has a lot to do with <tspan class="se-italic">where</tspan> it lives.</tspan></text>

<text class="se-heading" x="89" y="607"><tspan x="89">Know a scientist</tspan></text>

<text class="se-heading" x="89" y="862"><tspan x="89">2.3 Living Things and Their Surroundings</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="912"><tspan x="89">Something<tspan data-gap="" dx="2.38511"> </tspan>in<tspan data-gap="" dx="2.38511"> </tspan>your<tspan data-gap="" dx="2.38511"> </tspan>tables<tspan data-gap="" dx="2.38511"> </tspan>may<tspan data-gap="" dx="2.38511"> </tspan>have<tspan data-gap="" dx="2.38511"> </tspan>struck<tspan data-gap="" dx="2.38511"> </tspan>you<tspan data-gap="" dx="2.38511"> </tspan>already.<tspan data-gap="" dx="2.38511"> </tspan>The<tspan data-gap="" dx="2.38511"> </tspan>living<tspan data-gap="" dx="2.38511"> </tspan>things<tspan data-gap="" dx="2.38511"> </tspan>you<tspan data-gap="" dx="2.38511"> </tspan>wrote</tspan><tspan x="89" dy="31">down<tspan data-gap="" dx="6.20183"> </tspan>are<tspan data-gap="" dx="6.20183"> </tspan>the<tspan data-gap="" dx="6.20183"> </tspan>ones<tspan data-gap="" dx="6.20183"> </tspan>that<tspan data-gap="" dx="6.20183"> </tspan>live<tspan data-gap="" dx="6.20183"> </tspan><tspan class="se-italic">here</tspan>.<tspan data-gap="" dx="6.20183"> </tspan>A<tspan data-gap="" dx="6.20183"> </tspan>class<tspan data-gap="" dx="6.20183"> </tspan>in<tspan data-gap="" dx="6.20183"> </tspan>Ladakh<tspan data-gap="" dx="6.20183"> </tspan>would<tspan data-gap="" dx="6.20183"> </tspan>fill<tspan data-gap="" dx="6.20183"> </tspan>in<tspan data-gap="" dx="6.20183"> </tspan>a<tspan data-gap="" dx="6.20183"> </tspan>completely</tspan><tspan x="89" dy="31">different table. So would a class in the Sundarbans, or on the coast of Kerala.</tspan></text>
