tep</tspan></text><text class="se-copy se-table-copy" x="450.6" y="309.4"><tspan x="450.6">Carrying a crumb</tspan></text><text class="se-copy se-table-copy" x="625.4000000000001" y="309.4"><tspan x="625.4000000000001">Walks</tspan></text><text class="se-copy se-table-copy" x="800.2" y="309.4"><tspan x="800.2">Six legs; followed</tspan><tspan x="800.2" dy="25">the ant in front</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="391"><tspan x="89">Animals<tspan data-gap="" dx="4.66865"> </tspan>are<tspan data-gap="" dx="4.66865"> </tspan>harder<tspan data-gap="" dx="4.66865"> </tspan>to<tspan data-gap="" dx="4.66865"> </tspan>record<tspan data-gap="" dx="4.66865"> </tspan>than<tspan data-gap="" dx="4.66865"> </tspan>plants.<tspan data-gap="" dx="4.66865"> </tspan>The<tspan data-gap="" dx="4.66865"> </tspan>reason<tspan data-gap="" dx="4.66865"> </tspan>is<tspan data-gap="" dx="4.66865"> </tspan>simple.<tspan data-gap="" dx="4.66865"> </tspan>They<tspan data-gap="" dx="4.66865"> </tspan>move,<tspan data-gap="" dx="4.66865"> </tspan>and</tspan><tspan x="89" dy="31">many<tspan data-gap="" dx="3.53035"> </tspan>of<tspan data-gap="" dx="3.53035"> </tspan>them<tspan data-gap="" dx="3.53035"> </tspan>move<tspan data-gap="" dx="3.53035"> </tspan>away<tspan data-gap="" dx="3.53035"> </tspan>from<tspan data-gap="" dx="3.53035"> </tspan>you.<tspan data-gap="" dx="3.53035"> </tspan>So<tspan data-gap="" dx="3.53035"> </tspan>sitting<tspan data-gap="" dx="3.53035"> </tspan>still<tspan data-gap="" dx="3.53035"> </tspan>and<tspan data-gap="" dx="3.53035"> </tspan>watching<tspan data-gap="" dx="3.53035"> </tspan>finds<tspan data-gap="" dx="3.53035"> </tspan>more<tspan data-gap="" dx="3.53035"> </tspan>than</tspan><tspan x="89" dy="31">walking about.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="498"><tspan x="89">Now<tspan data-gap="" dx="4.29910"> </tspan>look<tspan data-gap="" dx="4.29910"> </tspan>down<tspan data-gap="" dx="4.29910"> </tspan>your<tspan data-gap="" dx="4.29910"> </tspan>table.<tspan data-gap="" dx="4.29910"> </tspan>Some<tspan data-gap="" dx="4.29910"> </tspan>animals<tspan data-gap="" dx="4.29910"> </tspan>live<tspan data-gap="" dx="4.29910"> </tspan>on<tspan data-gap="" dx="4.29910"> </tspan>the<tspan data-gap="" dx="4.29910"> </tspan>ground.<tspan data-gap="" dx="4.29910"> </tspan>Some<tspan data-gap="" dx="4.29910"> </tspan>live<tspan data-gap="" dx="4.29910"> </tspan>in<tspan data-gap="" dx="4.29910"> </tspan>trees.</tspan><tspan x="89" dy="31">Some<tspan data-gap="" dx="0.20100"> </tspan>live<tspan data-gap="" dx="0.20100"> </tspan>in<tspan data-gap="" dx="0.20100"> </tspan>water,<tspan data-gap="" dx="0.20100"> </tspan>and<tspan data-gap="" dx="0.20100"> </tspan>some<tspan data-gap="" dx="0.20100"> </tspan>under<tspan data-gap="" dx="0.20100"> </tspan>stones.<tspan data-gap="" dx="0.20100"> </tspan>They<tspan data-gap="" dx="0.20100"> </tspan>eat<tspan data-gap="" dx="0.20100"> </tspan>very<tspan data-gap="" dx="0.20100"> </tspan>different<tspan data-gap="" dx="0.20100"> </tspan>things.<tspan data-gap="" dx="0.20100"> </tspan>They<tspan data-gap="" dx="0.20100"> </tspan>move</tspan><tspan x="89" dy="31">in different ways — walking, flying, crawling, swimming, hopping.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="605"><tspan x="89">The variety of living things found in one region is called its <tspan class="se-bold">biodiversity</tspan>.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="650"><tspan x="89">Your<tspan data-gap="" dx="4.29155"> </tspan>school<tspan data-gap="" dx="4.29155"> </tspan>ground<tspan data-gap="" dx="4.29155"> </tspan>has<tspan data-gap="" dx="4.29155"> </tspan>its<tspan data-gap="" dx="4.29155"> </tspan>own<tspan data-gap="" dx="4.29155"> </tspan>biodiversity.<tspan data-gap="" dx="4.29155"> </tspan>So<tspan data-gap="" dx="4.29155"> </tspan>does<tspan data-gap="" dx="4.29155"> </tspan>a<tspan data-gap="" dx="4.29155"> </tspan>pond.<tspan data-gap="" dx="4.29155"> </tspan>So<tspan data-gap="" dx="4.29155"> </tspan>does<tspan data-gap="" dx="4.29155"> </tspan>a<tspan data-gap="" dx="4.29155"> </tspan>forest,<tspan data-gap="" dx="4.29155"> </tspan>a</tspan><tspan x="89" dy="31">seashore, and even the soil in a flowerpot.</tspan></text>
<rect class="se-prompt" x="89" y="703" width="874" height="154"/><line class="se-think-rule" x1="89" x2="963" y1="703" y2="703"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What you saw"><svg class="se-feature-icon se-feature--observe" x="113" y="712" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="741">What you saw</text></g><text class="se-copy" x="113" y="798"><tspan x="113">You looked for one period. Do you think you found most of the living things</tspan><tspan x="113" dy="31">there? Or only a small part of them?</tspan></text>
<text class="se-heading" x="89" y="903"><tspan x="89">Living Things Need Each Other</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="953"><tspan x="89">The living things in a place are not just sharing space. They are joined to each other.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="998"><tspan x="89">A<tspan data-gap="" dx="0.97458"> </tspan>tree<tspan data-gap="" dx="0.97458"> </tspan>gives<tspan data-gap="" dx="0.97458"> </tspan>shade.<tspan data-gap="" dx="0.97458"> </tspan>Small<tspan data-gap="" dx="0.97458"> </tspan>plants<tspan data-gap="" dx="0.97458"> </tspan>that<tspan data-gap="" dx="0.97458"> </tspan>cannot<tspan data-gap="" dx="0.97458"> </tspan>take<tspan data-gap="" dx="0.97458"> </tspan>strong<tspan data-gap="" dx="0.97458"> </tspan>sunlight<tspan data-gap="" dx="0.97458"> </tspan>grow<tspan data-gap="" dx="0.97458"> </tspan>in<tspan data-gap="" dx="0.97458"> </tspan>that<tspan data-gap="" dx="0.97458"> </tspan>shade.</tspan><tspan x="89" dy="31">Birds<tspan data-gap="" dx="1.87167"> </tspan>build<tspan data-gap="" dx="1.87167"> </tspan>nests<tspan data-gap="" dx="1.87167"> </tspan>in<tspan data-gap="" dx="1.87167"> </tspan>its<tspan data-gap="" dx="1.87167"> </tspan>branches.<tspan data-gap="" dx="1.87167"> </tspan>They<tspan data-gap="" dx="1.87167"> </tspan>eat<tspan data-gap="" dx="1.87167"> </tspan>insects<tspan data-gap="" dx="1.87167"> </tspan>from<tspan data-gap="" dx="1.87167"> </tspan>its<tspan data-gap="" dx="1.87167"> </tspan>bark.<tspan data-gap="" dx="1.87167"> </tspan>A<tspan data-gap="" dx="1.87167"> </tspan>bird<tspan data-gap="" dx="1.87167"> </tspan>eats<tspan data-gap="" dx="1.87167"> </tspan>a<tspan data-gap="" dx="1.87167"> </tspan>fruit,</tspan><tspan x="89" dy="31">flies<tspan data-gap="" dx="0.20399"> </tspan>away,<tspan data-gap="" dx="0.20399"> </tspan>and<tspan data-gap="" dx="0.20399"> </tspan>drops<tspan data-gap="" dx="0.20399"> </tspan>the<tspan data-gap="" dx="0.20399"> </tspan>seed<tspan data-gap="" dx="0.20399"> </tspan>far<tspan data-gap="" dx="0.20399"> </tspan>from<tspan data-gap="" dx="0.20399"> </tspan>the<tspan data-gap="" dx="0.20399"> </tspan>tree.<tspan data-gap="" dx="0.20399"> </tspan>The<tspan data-gap="" dx="0.20399"> </tspan>seed<tspan data-gap="" dx="0.20399"> </tspan>grows<tspan data-gap="" dx="0.20399"> </tspan>into<tspan data-gap="" dx="0.20399"> </tspan>a<tspan data-gap="" dx="0.20399"> </tspan>new<tspan data-gap="" dx="0.20399"> </tspan>tree<tspan data-gap="" dx="0.20399"> </tspan>there.</tspan><tspan x="89" dy="31">Old leaves fall and rot into the soil. That soil feeds the next plant.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1136"><tspan x="89">Now<tspan data-gap="" dx="0.62998"> </tspan>take<tspan data-gap="" dx="0.62998"> </tspan>one<tspan data-gap="" dx="0.62998"> </tspan>part<tspan data-gap="" dx="0.62998"> </tspan>away.<tspan data-gap="" dx="0.62998"> </tspan>The<tspan data-gap="" dx="0.62998"> </tspan>others<tspan data-gap="" dx="0.62998"> </tspan>feel<tspan data-gap="" dx="0.62998"> </tspan>it.<tspan data-gap="" dx="0.62998"> </tspan>If<tspan data-gap="" dx="0.62998"> </tspan>the<tspan data-gap="" dx="0.62998"> </tspan>insects<tspan data-gap="" dx="0.62998"> </tspan>go,<tspan data-gap="" dx="0.62998"> </tspan>the<tspan data-gap="" dx="0.62998"> </tspan>birds<tspan data-gap="" dx="0.62998"> </tspan>have<tspan data-gap="" dx="0.62998"> </tspan>less<tspan data-gap="" dx="0.62998"> </tspan>food.</tspan><tspan x="89" dy="31">If the tree goes, the shade goes, the nests go, and the falling leaves go too.</tspan></text>
<text class="se-copy" x="89" y="1212"><tspan x="89">One connection can lead to another. Fallen leaves provide food for small organisms</tspan><tspan x="89" dy="31">in the soil. As those leaves break down, nutrients return to the soil and can be taken</tspan><tspan x="89" dy="31">up by roots.</tspan></text>
<text class="se-copy" x="89" y="1319"><tspan x="89">When you compare answers, draw arrows in your notebook between the living things</tspan><tspan x="89" dy="31">you chose. Write a word beside each arrow, such as food or shelter, to explain the</tspan><tspan x="89" dy="31">connection.</tspan></text>
