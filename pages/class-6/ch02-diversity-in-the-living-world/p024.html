<text class="se-copy" data-measure="874" x="89" y="174"><tspan x="89">•<tspan data-gap="" dx="3.79985"> </tspan>The<tspan data-gap="" dx="3.79985"> </tspan>variety<tspan data-gap="" dx="3.79985"> </tspan>of<tspan data-gap="" dx="3.79985"> </tspan>living<tspan data-gap="" dx="3.79985"> </tspan>things<tspan data-gap="" dx="3.79985"> </tspan>found<tspan data-gap="" dx="3.79985"> </tspan>in<tspan data-gap="" dx="3.79985"> </tspan>a<tspan data-gap="" dx="3.79985"> </tspan>region<tspan data-gap="" dx="3.79985"> </tspan>is<tspan data-gap="" dx="3.79985"> </tspan>called<tspan data-gap="" dx="3.79985"> </tspan>its<tspan data-gap="" dx="3.79985"> </tspan>biodiversity.<tspan data-gap="" dx="3.79985"> </tspan>Even<tspan data-gap="" dx="3.79985"> </tspan>an</tspan><tspan x="89" dy="31">ordinary place has much more of it than a quick look suggests.</tspan></text>

<text class="se-copy" data-measure="874" x="89" y="323.54545454545456"><tspan x="89">•<tspan data-gap="" dx="7.09827"> </tspan>Grouping<tspan data-gap="" dx="7.09827"> </tspan>means<tspan data-gap="" dx="7.09827"> </tspan>arranging<tspan data-gap="" dx="7.09827"> </tspan>things<tspan data-gap="" dx="7.09827"> </tspan>by<tspan data-gap="" dx="7.09827"> </tspan>the<tspan data-gap="" dx="7.09827"> </tspan>features<tspan data-gap="" dx="7.09827"> </tspan>they<tspan data-gap="" dx="7.09827"> </tspan>share.<tspan data-gap="" dx="7.09827"> </tspan>Different<tspan data-gap="" dx="7.09827"> </tspan>rules</tspan><tspan x="89" dy="31">answer different questions; each must be applied consistently.</tspan></text>

<text class="se-copy" data-measure="874" x="89" y="535.0909090909091"><tspan x="89">•<tspan data-gap="" dx="7.01733"> </tspan>The<tspan data-gap="" dx="7.01733"> </tspan>pattern<tspan data-gap="" dx="7.01733"> </tspan>of<tspan data-gap="" dx="7.01733"> </tspan>veins<tspan data-gap="" dx="7.01733"> </tspan>in<tspan data-gap="" dx="7.01733"> </tspan>a<tspan data-gap="" dx="7.01733"> </tspan>leaf<tspan data-gap="" dx="7.01733"> </tspan>is<tspan data-gap="" dx="7.01733"> </tspan>called<tspan data-gap="" dx="7.01733"> </tspan>venation.<tspan data-gap="" dx="7.01733"> </tspan>Two<tspan data-gap="" dx="7.01733"> </tspan>common<tspan data-gap="" dx="7.01733"> </tspan>patterns<tspan data-gap="" dx="7.01733"> </tspan>are</tspan><tspan x="89" dy="31">reticulate and parallel.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="625.3636363636364"><tspan x="89">•<tspan data-gap="" dx="0.83919"> </tspan>Two<tspan data-gap="" dx="0.83919"> </tspan>common<tspan data-gap="" dx="0.83919"> </tspan>root<tspan data-gap="" dx="0.83919"> </tspan>systems<tspan data-gap="" dx="0.83919"> </tspan>are<tspan data-gap="" dx="0.83919"> </tspan>taproot<tspan data-gap="" dx="0.83919"> </tspan>and<tspan data-gap="" dx="0.83919"> </tspan>fibrous<tspan data-gap="" dx="0.83919"> </tspan>root<tspan data-gap="" dx="0.83919"> </tspan>systems.<tspan data-gap="" dx="0.83919"> </tspan>A<tspan data-gap="" dx="0.83919"> </tspan>taproot<tspan data-gap="" dx="0.83919"> </tspan>has<tspan data-gap="" dx="0.83919"> </tspan>one</tspan><tspan x="89" dy="31">main root. Fibrous roots form a spreading bunch.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="715.6363636363636"><tspan x="89">• Among flowering plants, dicots have two cotyledons and monocots have one.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="774.9090909090909"><tspan x="89">•<tspan data-gap="" dx="2.80253"> </tspan>These<tspan data-gap="" dx="2.80253"> </tspan>three<tspan data-gap="" dx="2.80253"> </tspan>features<tspan data-gap="" dx="2.80253"> </tspan>go<tspan data-gap="" dx="2.80253"> </tspan>together.<tspan data-gap="" dx="2.80253"> </tspan>Dicots<tspan data-gap="" dx="2.80253"> </tspan>generally<tspan data-gap="" dx="2.80253"> </tspan>have<tspan data-gap="" dx="2.80253"> </tspan>reticulate<tspan data-gap="" dx="2.80253"> </tspan>venation<tspan data-gap="" dx="2.80253"> </tspan>and<tspan data-gap="" dx="2.80253"> </tspan>a</tspan><tspan x="89" dy="31">taproot.<tspan data-gap="" dx="11.07756"> </tspan>Monocots<tspan data-gap="" dx="11.07756"> </tspan>generally<tspan data-gap="" dx="11.07756"> </tspan>have<tspan data-gap="" dx="11.07756"> </tspan>parallel<tspan data-gap="" dx="11.07756"> </tspan>venation<tspan data-gap="" dx="11.07756"> </tspan>and<tspan data-gap="" dx="11.07756"> </tspan>fibrous<tspan data-gap="" dx="11.07756"> </tspan>roots.<tspan data-gap="" dx="11.07756"> </tspan>These</tspan><tspan x="89" dy="31">associations support predictions that must be checked.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="896.1818181818181"><tspan x="89">•<tspan data-gap="" dx="2.57445"> </tspan>Animals<tspan data-gap="" dx="2.57445"> </tspan>can<tspan data-gap="" dx="2.57445"> </tspan>be<tspan data-gap="" dx="2.57445"> </tspan>grouped<tspan data-gap="" dx="2.57445"> </tspan>by<tspan data-gap="" dx="2.57445"> </tspan>how<tspan data-gap="" dx="2.57445"> </tspan>they<tspan data-gap="" dx="2.57445"> </tspan>move<tspan data-gap="" dx="2.57445"> </tspan>and<tspan data-gap="" dx="2.57445"> </tspan>which<tspan data-gap="" dx="2.57445"> </tspan>body<tspan data-gap="" dx="2.57445"> </tspan>parts<tspan data-gap="" dx="2.57445"> </tspan>they<tspan data-gap="" dx="2.57445"> </tspan>use.<tspan data-gap="" dx="2.57445"> </tspan>They</tspan><tspan x="89" dy="31">can also be grouped in many other ways.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="986.4545454545454"><tspan x="89">•<tspan data-gap="" dx="5.72244"> </tspan>Adaptations<tspan data-gap="" dx="5.72244"> </tspan>are<tspan data-gap="" dx="5.72244"> </tspan>inherited<tspan data-gap="" dx="5.72244"> </tspan>features<tspan data-gap="" dx="5.72244"> </tspan>that<tspan data-gap="" dx="5.72244"> </tspan>help<tspan data-gap="" dx="5.72244"> </tspan>organisms<tspan data-gap="" dx="5.72244"> </tspan>survive<tspan data-gap="" dx="5.72244"> </tspan>and<tspan data-gap="" dx="5.72244"> </tspan>reproduce.</tspan><tspan x="89" dy="31">They<tspan data-gap="" dx="5.01398"> </tspan>develop<tspan data-gap="" dx="5.01398"> </tspan>in<tspan data-gap="" dx="5.01398"> </tspan>populations<tspan data-gap="" dx="5.01398"> </tspan>over<tspan data-gap="" dx="5.01398"> </tspan>generations,<tspan data-gap="" dx="5.01398"> </tspan>not<tspan data-gap="" dx="5.01398"> </tspan>because<tspan data-gap="" dx="5.01398"> </tspan>an<tspan data-gap="" dx="5.01398"> </tspan>individual<tspan data-gap="" dx="5.01398"> </tspan>tries<tspan data-gap="" dx="5.01398"> </tspan>to</tspan><tspan x="89" dy="31">change.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1107.7272727272727"><tspan x="89">•<tspan data-gap="" dx="0.06385"> </tspan>The<tspan data-gap="" dx="0.06385"> </tspan>place<tspan data-gap="" dx="0.06385"> </tspan>where<tspan data-gap="" dx="0.06385"> </tspan>a<tspan data-gap="" dx="0.06385"> </tspan>living<tspan data-gap="" dx="0.06385"> </tspan>thing<tspan data-gap="" dx="0.06385"> </tspan>lives<tspan data-gap="" dx="0.06385"> </tspan>is<tspan data-gap="" dx="0.06385"> </tspan>its<tspan data-gap="" dx="0.06385"> </tspan>habitat.<tspan data-gap="" dx="0.06385"> </tspan>Habitats<tspan data-gap="" dx="0.06385"> </tspan>are<tspan data-gap="" dx="0.06385"> </tspan>terrestrial<tspan data-gap="" dx="0.06385"> </tspan>or<tspan data-gap="" dx="0.06385"> </tspan>aquatic.</tspan><tspan x="89" dy="31">Many<tspan data-gap="" dx="6.59820"> </tspan>amphibians<tspan data-gap="" dx="6.59820"> </tspan>use<tspan data-gap="" dx="6.59820"> </tspan>both<tspan data-gap="" dx="6.59820"> </tspan>land<tspan data-gap="" dx="6.59820"> </tspan>and<tspan data-gap="" dx="6.59820"> </tspan>water,<tspan data-gap="" dx="6.59820"> </tspan>but<tspan data-gap="" dx="6.59820"> </tspan>not<tspan data-gap="" dx="6.59820"> </tspan>all<tspan data-gap="" dx="6.59820"> </tspan>animals<tspan data-gap="" dx="6.59820"> </tspan>that<tspan data-gap="" dx="6.59820"> </tspan>do<tspan data-gap="" dx="6.59820"> </tspan>so<tspan data-gap="" dx="6.59820"> </tspan>are</tspan><tspan x="89" dy="31">amphibians.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1229"><tspan x="89">•<tspan data-gap="" dx="2.22860"> </tspan>Damage<tspan data-gap="" dx="2.22860"> </tspan>to<tspan data-gap="" dx="2.22860"> </tspan>habitats<tspan data-gap="" dx="2.22860"> </tspan>causes<tspan data-gap="" dx="2.22860"> </tspan>loss<tspan data-gap="" dx="2.22860"> </tspan>of<tspan data-gap="" dx="2.22860"> </tspan>biodiversity.<tspan data-gap="" dx="2.22860"> </tspan>This<tspan data-gap="" dx="2.22860"> </tspan>is<tspan data-gap="" dx="2.22860"> </tspan>why<tspan data-gap="" dx="2.22860"> </tspan>habitats<tspan data-gap="" dx="2.22860"> </tspan>are<tspan data-gap="" dx="2.22860"> </tspan>protected</tspan><tspan x="89" dy="31">— by governments, and by communities.</tspan></text>
