ta-gap="" dx="2.69372"> </tspan>help</tspan><tspan x="89" dy="31">explain where it can survive.</tspan></text><text class="se-heading" x="89" y="496.625"><tspan x="89">Built for the Place</tspan></text><image class="science-illustration" href="../../figures/class-6/science/ch02/desert.png" x="89" y="523.625" width="874" height="240" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="406.2745995423341" y="788.625" text-anchor="middle">Cactus · hot desert</text><text class="se-caption" x="645.725400457666" y="788.625" text-anchor="middle">Deodar · cold mountain</text><text class="se-copy" x="89" y="835.625"><tspan x="89">Look at a plant from a hot desert.</tspan></text><text class="se-copy" x="89" y="884.625"><tspan x="89">Consider a cactus adapted to a hot, dry</tspan><tspan x="89" dy="31">habitat. Its fleshy stem stores water and</tspan><tspan x="89" dy="31">its waxy surface reduces water loss. In</tspan><tspan x="89" dy="31">many cacti, leaves are reduced to spines</tspan><tspan x="89" dy="31">and the green stem carries out</tspan><tspan x="89" dy="31">photosynthesis.</tspan></text><text class="se-copy" x="542" y="835.625"><tspan x="542">Now look at a deodar tree, high in the</tspan><tspan x="542" dy="31">Himalayas.</tspan></text><text class="se-copy" x="542" y="915.625"><tspan x="542">On snowy mountain slopes, snow can</tspan><tspan x="542" dy="31">load branches heavily. The conical form</tspan><tspan x="542" dy="31">and sloping branches of a deodar can</tspan><tspan x="542" dy="31">help shed snow. Temperature, soil and</tspan><tspan x="542" dy="31">water also affect where a tree can grow.</tspan></text><line class="se-editorial-divider" x1="89" x2="963" y1="1073.625" y2="1073.625"/><text class="se-copy" data-measure="874" x="89" y="1120.625"><tspan x="89">These<tspan data-gap="" dx="4.90454"> </tspan>features<tspan data-gap="" dx="4.90454"> </tspan>were<tspan data-gap="" dx="4.90454"> </tspan>not<tspan data-gap="" dx="4.90454"> </tspan>chosen<tspan
