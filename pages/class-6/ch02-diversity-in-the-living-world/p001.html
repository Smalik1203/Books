<text class="se-copy" data-measure="874" x="89" y="760"><tspan x="89">Go outside your classroom. Stand still for two minutes.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="805"><tspan x="89">The<tspan data-gap="" dx="4.93719"> </tspan>place<tspan data-gap="" dx="4.93719"> </tspan>may<tspan data-gap="" dx="4.93719"> </tspan>look<tspan data-gap="" dx="4.93719"> </tspan>very<tspan data-gap="" dx="4.93719"> </tspan>ordinary.<tspan data-gap="" dx="4.93719"> </tspan>But<tspan data-gap="" dx="4.93719"> </tspan>living<tspan data-gap="" dx="4.93719"> </tspan>things<tspan data-gap="" dx="4.93719"> </tspan>are<tspan data-gap="" dx="4.93719"> </tspan>all<tspan data-gap="" dx="4.93719"> </tspan>around<tspan data-gap="" dx="4.93719"> </tspan>you.<tspan data-gap="" dx="4.93719"> </tspan>Grass<tspan data-gap="" dx="4.93719"> </tspan>is</tspan><tspan x="89" dy="31">growing<tspan data-gap="" dx="2.90705"> </tspan>through<tspan data-gap="" dx="2.90705"> </tspan>a<tspan data-gap="" dx="2.90705"> </tspan>crack<tspan data-gap="" dx="2.90705"> </tspan>in<tspan data-gap="" dx="2.90705"> </tspan>the<tspan data-gap="" dx="2.90705"> </tspan>path.<tspan data-gap="" dx="2.90705"> </tspan>A<tspan data-gap="" dx="2.90705"> </tspan>crow<tspan data-gap="" dx="2.90705"> </tspan>sits<tspan data-gap="" dx="2.90705"> </tspan>on<tspan data-gap="" dx="2.90705"> </tspan>the<tspan data-gap="" dx="2.90705"> </tspan>wall.<tspan data-gap="" dx="2.90705"> </tspan>Ants<tspan data-gap="" dx="2.90705"> </tspan>move<tspan data-gap="" dx="2.90705"> </tspan>in<tspan data-gap="" dx="2.90705"> </tspan>a<tspan data-gap="" dx="2.90705"> </tspan>line</tspan><tspan x="89" dy="31">along the edge of a step. One tree has wide leaves. The tree next to it has thin ones.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="912"><tspan x="89">Nobody<tspan data-gap="" dx="5.00642"> </tspan>planted<tspan data-gap="" dx="5.00642"> </tspan>most<tspan data-gap="" dx="5.00642"> </tspan>of<tspan data-gap="" dx="5.00642"> </tspan>these.<tspan data-gap="" dx="5.00642"> </tspan>Nobody<tspan data-gap="" dx="5.00642"> </tspan>arranged<tspan data-gap="" dx="5.00642"> </tspan>them.<tspan data-gap="" dx="5.00642"> </tspan>And<tspan data-gap="" dx="5.00642"> </tspan>no<tspan data-gap="" dx="5.00642"> </tspan>two<tspan data-gap="" dx="5.00642"> </tspan>of<tspan data-gap="" dx="5.00642"> </tspan>them<tspan data-gap="" dx="5.00642"> </tspan>are</tspan><tspan x="89" dy="31">exactly the same.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="988"><tspan x="89">This<tspan data-gap="" dx="0.03654"> </tspan>chapter<tspan data-gap="" dx="0.03654"> </tspan>is<tspan data-gap="" dx="0.03654"> </tspan>about<tspan data-gap="" dx="0.03654"> </tspan>that<tspan data-gap="" dx="0.03654"> </tspan>variety.<tspan data-gap="" dx="0.03654"> </tspan>How<tspan data-gap="" dx="0.03654"> </tspan>much<tspan data-gap="" dx="0.03654"> </tspan>of<tspan data-gap="" dx="0.03654"> </tspan>it<tspan data-gap="" dx="0.03654"> </tspan>is<tspan data-gap="" dx="0.03654"> </tspan>there?<tspan data-gap="" dx="0.03654"> </tspan>How<tspan data-gap="" dx="0.03654"> </tspan>do<tspan data-gap="" dx="0.03654"> </tspan>we<tspan data-gap="" dx="0.03654"> </tspan>make<tspan data-gap="" dx="0.03654"> </tspan>sense<tspan data-gap="" dx="0.03654"> </tspan>of</tspan><tspan x="89" dy="31">it?<tspan data-gap="" dx="1.80463"> </tspan>And<tspan data-gap="" dx="1.80463"> </tspan>why<tspan data-gap="" dx="1.80463"> </tspan>are<tspan data-gap="" dx="1.80463"> </tspan>the<tspan data-gap="" dx="1.80463"> </tspan>living<tspan data-gap="" dx="1.80463"> </tspan>things<tspan data-gap="" dx="1.80463"> </tspan>in<tspan data-gap="" dx="1.80463"> </tspan>one<tspan data-gap="" dx="1.80463"> </tspan>place<tspan data-gap="" dx="1.80463"> </tspan>so<tspan data-gap="" dx="1.80463"> </tspan>different<tspan data-gap="" dx="1.80463"> </tspan>from<tspan data-gap="" dx="1.80463"> </tspan>the<tspan data-gap="" dx="1.80463"> </tspan>living<tspan data-gap="" dx="1.80463"> </tspan>things<tspan data-gap="" dx="1.80463"> </tspan>in</tspan><tspan x="89" dy="31">another?</tspan></text>
