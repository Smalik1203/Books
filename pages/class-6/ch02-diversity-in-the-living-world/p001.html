<text class="se-copy" data-measure="874" x="89" y="931"><tspan x="89">Go outside your classroom. Stand still for two minutes.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="984"><tspan x="89">Look<tspan data-gap="" dx="1.69380"> </tspan>for<tspan data-gap="" dx="1.69380"> </tspan>grass<tspan data-gap="" dx="1.69380"> </tspan>in<tspan data-gap="" dx="1.69380"> </tspan>a<tspan data-gap="" dx="1.69380"> </tspan>crack,<tspan data-gap="" dx="1.69380"> </tspan>insects<tspan data-gap="" dx="1.69380"> </tspan>near<tspan data-gap="" dx="1.69380"> </tspan>a<tspan data-gap="" dx="1.69380"> </tspan>wall,<tspan data-gap="" dx="1.69380"> </tspan>or<tspan data-gap="" dx="1.69380"> </tspan>birds<tspan data-gap="" dx="1.69380"> </tspan>overhead.<tspan data-gap="" dx="1.69380"> </tspan>Choose<tspan data-gap="" dx="1.69380"> </tspan>two<tspan data-gap="" dx="1.69380"> </tspan>plants.</tspan><tspan x="89" dy="31">Compare their leaves. What differences can you describe?</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1068"><tspan x="89">A<tspan data-gap="" dx="3.15583"> </tspan>planted<tspan data-gap="" dx="3.15583"> </tspan>tree<tspan data-gap="" dx="3.15583"> </tspan>and<tspan data-gap="" dx="3.15583"> </tspan>a<tspan data-gap="" dx="3.15583"> </tspan>plant<tspan data-gap="" dx="3.15583"> </tspan>growing<tspan data-gap="" dx="3.15583"> </tspan>without<tspan data-gap="" dx="3.15583"> </tspan>anyone<tspan data-gap="" dx="3.15583"> </tspan>sowing<tspan data-gap="" dx="3.15583"> </tspan>it<tspan data-gap="" dx="3.15583"> </tspan>both<tspan data-gap="" dx="3.15583"> </tspan>belong<tspan data-gap="" dx="3.15583"> </tspan>in<tspan data-gap="" dx="3.15583"> </tspan>your</tspan><tspan x="89" dy="31">record. You do not need to know how something arrived before you can observe it.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1152"><tspan x="89">This<tspan data-gap="" dx="0.03654"> </tspan>chapter<tspan data-gap="" dx="0.03654"> </tspan>is<tspan data-gap="" dx="0.03654"> </tspan>about<tspan data-gap="" dx="0.03654"> </tspan>that<tspan data-gap="" dx="0.03654"> </tspan>variety.<tspan data-gap="" dx="0.03654"> </tspan>How<tspan data-gap="" dx="0.03654"> </tspan>much<tspan data-gap="" dx="0.03654"> </tspan>of<tspan data-gap="" dx="0.03654"> </tspan>it<tspan data-gap="" dx="0.03654"> </tspan>is<tspan data-gap="" dx="0.03654"> </tspan>there?<tspan data-gap="" dx="0.03654"> </tspan>How<tspan data-gap="" dx="0.03654"> </tspan>do<tspan data-gap="" dx="0.03654"> </tspan>we<tspan data-gap="" dx="0.03654"> </tspan>make<tspan data-gap="" dx="0.03654"> </tspan>sense<tspan data-gap="" dx="0.03654"> </tspan>of</tspan><tspan x="89" dy="31">it?<tspan data-gap="" dx="1.80463"> </tspan>And<tspan data-gap="" dx="1.80463"> </tspan>why<tspan data-gap="" dx="1.80463"> </tspan>are<tspan data-gap="" dx="1.80463"> </tspan>the<tspan data-gap="" dx="1.80463"> </tspan>living<tspan data-gap="" dx="1.80463"> </tspan>things<tspan data-gap="" dx="1.80463"> </tspan>in<tspan data-gap="" dx="1.80463"> </tspan>one<tspan data-gap="" dx="1.80463"> </tspan>place<tspan data-gap="" dx="1.80463"> </tspan>so<tspan data-gap="" dx="1.80463"> </tspan>different<tspan data-gap="" dx="1.80463"> </tspan>from<tspan data-gap="" dx="1.80463"> </tspan>the<tspan data-gap="" dx="1.80463"> </tspan>living<tspan data-gap="" dx="1.80463"> </tspan>things<tspan data-gap="" dx="1.80463"> </tspan>in</tspan><tspan x="89" dy="31">another?</tspan></text>
