<section class="page page--food page--science-editorial" data-science-chapter="2" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World, page 2"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M31 63Q34 30 60 7"/><path class="se-botanical-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 2</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Diversity in the Living World</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header -->
<text class="se-heading" x="89" y="124"><tspan x="89">2.1 The Variety Around Us</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="174"><tspan x="89">Most<tspan data-gap="" dx="1.27309"> </tspan>of<tspan data-gap="" dx="1.27309"> </tspan>us<tspan data-gap="" dx="1.27309"> </tspan>walk<tspan data-gap="" dx="1.27309"> </tspan>past<tspan data-gap="" dx="1.27309"> </tspan>living<tspan data-gap="" dx="1.27309"> </tspan>things<tspan data-gap="" dx="1.27309"> </tspan>without<tspan data-gap="" dx="1.27309"> </tspan>really<tspan data-gap="" dx="1.27309"> </tspan>seeing<tspan data-gap="" dx="1.27309"> </tspan>them.<tspan data-gap="" dx="1.27309"> </tspan>We<tspan data-gap="" dx="1.27309"> </tspan>see<tspan data-gap="" dx="1.27309"> </tspan>a<tspan data-gap="" dx="1.27309"> </tspan>tree.<tspan data-gap="" dx="1.27309"> </tspan>But<tspan data-gap="" dx="1.27309"> </tspan>we</tspan><tspan x="89" dy="31">do<tspan data-gap="" dx="1.96745"> </tspan>not<tspan data-gap="" dx="1.96745"> </tspan>see<tspan data-gap="" dx="1.96745"> </tspan>that<tspan data-gap="" dx="1.96745"> </tspan>its<tspan data-gap="" dx="1.96745"> </tspan>leaves<tspan data-gap="" dx="1.96745"> </tspan>are<tspan data-gap="" dx="1.96745"> </tspan>pointed,<tspan data-gap="" dx="1.96745"> </tspan>and<tspan data-gap="" dx="1.96745"> </tspan>the<tspan data-gap="" dx="1.96745"> </tspan>next<tspan data-gap="" dx="1.96745"> </tspan>tree's<tspan data-gap="" dx="1.96745"> </tspan>leaves<tspan data-gap="" dx="1.96745"> </tspan>are<tspan data-gap="" dx="1.96745"> </tspan>round.<tspan data-gap="" dx="1.96745"> </tspan>We<tspan data-gap="" dx="1.96745"> </tspan>hear</tspan><tspan x="89" dy="31">birds. But we do not hear that three different birds are calling.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="281"><tspan x="89">Looking carefully is a skill. Like any skill, it gets better with practice.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="326"><tspan x="89">That is what the first activity is for.</tspan></text>
<rect class="se-activity-panel" x="89" y="362" width="874" height="521"/><path class="se-activity-tab" d="M109 348H943Q963 348 963 368V391H89V368Q89 348 109 348Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="354" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="376" text-anchor="start">The setup</text><text class="se-copy" x="113" y="424"><tspan x="113">You will need: a notebook, a pencil, a water bottle.</tspan></text><text class="se-activity-step" x="128" y="467" text-anchor="end">1.</text><text class="se-copy" x="146" y="467"><tspan x="146">With your teacher, spend one period in a park, a garden, a field or any open</tspan><tspan x="146" dy="31">ground near your school.</tspan></text><text class="se-activity-step" x="128" y="541" text-anchor="end">2.</text><text class="se-copy" x="146" y="541"><tspan x="146">Walk slowly. People who are in a hurry find very little.</tspan></text><text class="se-activity-step" x="128" y="584" text-anchor="end">3.</text><text class="se-copy" x="146" y="584"><tspan x="146">Look, and also listen. Close your eyes for thirty seconds. How many different</tspan><tspan x="146" dy="31">sounds can you count?</tspan></text><text class="se-activity-step" x="128" y="658" text-anchor="end">4.</text><text class="se-copy" x="146" y="658"><tspan x="146">Do not pluck leaves or flowers. Do not disturb any animal. You may pick up</tspan><tspan x="146" dy="31">leaves that have already fallen.</tspan></text><text class="se-activity-step" x="128" y="732" text-anchor="end">5.</text><text class="se-copy" x="146" y="732"><tspan x="146">Copy the headings of Tables 2.1 and 2.2 into your notebook. Add a row for</tspan><tspan x="146" dy="31">each plant or animal you observe.</tspan></text><text class="se-copy" x="113" y="806"><tspan x="113">Safety: Stay with your group. Do not touch any animal. Do not put your fingers</tspan><tspan x="113" dy="31">into holes or under stones.</tspan></text>
<rect class="se-prompt" x="89" y="903" width="874" height="216"/><line class="se-think-rule" x1="89" x2="963" y1="903" y2="903"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What you saw"><svg class="se-feature-icon se-feature--observe" x="113" y="912" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="941">What you saw</text></g><text class="se-copy" x="113" y="998"><tspan x="113">Write down what you really see, not what you think you should see. If you do not</tspan><tspan x="113" dy="31">know the name of a plant, describe it instead. For example: &quot;small plant, three</tspan><tspan x="113" dy="31">leaves together, near the water tap&quot;. Was it harder to spot the plants or the</tspan><tspan x="113" dy="31">animals? Why?</tspan></text>
<text class="se-copy se-note" data-measure="874" x="89" y="1160"><tspan x="89">Copy<tspan data-gap="" dx="4.38000"> </tspan>the<tspan data-gap="" dx="4.38000"> </tspan>headings<tspan data-gap="" dx="4.38000"> </tspan>into<tspan data-gap="" dx="4.38000"> </tspan>your<tspan data-gap="" dx="4.38000"> </tspan>notebook<tspan data-gap="" dx="4.38000"> </tspan>and<tspan data-gap="" dx="4.38000"> </tspan>add<tspan data-gap="" dx="4.38000"> </tspan>your<tspan data-gap="" dx="4.38000"> </tspan>own<tspan data-gap="" dx="4.38000"> </tspan>observations.<tspan data-gap="" dx="4.38000"> </tspan>The<tspan data-gap="" dx="4.38000"> </tspan>rows</tspan><tspan x="89" dy="31">below are examples, not a complete record.</tspan></text>
<text class="se-copy" x="89" y="1236"><tspan x="89">A dash in a sample table means that the observation has not been recorded. It does</tspan><tspan x="89" dy="31">not prove that the feature is absent. A plant without visible flowers today may flower</tspan><tspan x="89" dy="31">in another season.</tspan></text>
<text class="se-copy" x="89" y="1343"><tspan x="89">The drawings help you compare the plants. They are not drawn to a common scale;</tspan><tspan x="89" dy="31">use your own observations to compare their actual heights.</tspan></text>
