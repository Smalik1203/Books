<text class="se-heading" x="89" y="124"><tspan x="89">2.1 The Variety Around Us</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="174"><tspan x="89">A<tspan data-gap="" dx="0.66220"> </tspan>quick<tspan data-gap="" dx="0.66220"> </tspan>glance<tspan data-gap="" dx="0.66220"> </tspan>may<tspan data-gap="" dx="0.66220"> </tspan>tell<tspan data-gap="" dx="0.66220"> </tspan>you<tspan data-gap="" dx="0.66220"> </tspan>that<tspan data-gap="" dx="0.66220"> </tspan>a<tspan data-gap="" dx="0.66220"> </tspan>tree<tspan data-gap="" dx="0.66220"> </tspan>is<tspan data-gap="" dx="0.66220"> </tspan>there.<tspan data-gap="" dx="0.66220"> </tspan>A<tspan data-gap="" dx="0.66220"> </tspan>closer<tspan data-gap="" dx="0.66220"> </tspan>look<tspan data-gap="" dx="0.66220"> </tspan>can<tspan data-gap="" dx="0.66220"> </tspan>reveal<tspan data-gap="" dx="0.66220"> </tspan>the<tspan data-gap="" dx="0.66220"> </tspan>shape<tspan data-gap="" dx="0.66220"> </tspan>of</tspan><tspan x="89" dy="31">its<tspan data-gap="" dx="3.15332"> </tspan>leaves,<tspan data-gap="" dx="3.15332"> </tspan>where<tspan data-gap="" dx="3.15332"> </tspan>its<tspan data-gap="" dx="3.15332"> </tspan>branches<tspan data-gap="" dx="3.15332"> </tspan>begin,<tspan data-gap="" dx="3.15332"> </tspan>or<tspan data-gap="" dx="3.15332"> </tspan>insects<tspan data-gap="" dx="3.15332"> </tspan>on<tspan data-gap="" dx="3.15332"> </tspan>its<tspan data-gap="" dx="3.15332"> </tspan>bark.<tspan data-gap="" dx="3.15332"> </tspan>Listening<tspan data-gap="" dx="3.15332"> </tspan>may<tspan data-gap="" dx="3.15332"> </tspan>reveal<tspan data-gap="" dx="3.15332"> </tspan>a</tspan><tspan x="89" dy="31">bird you cannot see.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="289"><tspan x="89">Looking carefully is a skill. Like any skill, it gets better with practice.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="342"><tspan x="89">Practise<tspan data-gap="" dx="1.56192"> </tspan>looking<tspan data-gap="" dx="1.56192"> </tspan>closely<tspan data-gap="" dx="1.56192"> </tspan>in<tspan data-gap="" dx="1.56192"> </tspan>the<tspan data-gap="" dx="1.56192"> </tspan>investigation<tspan data-gap="" dx="1.56192"> </tspan>below.<tspan data-gap="" dx="1.56192"> </tspan>Tables<tspan data-gap="" dx="1.56192"> </tspan>2.1<tspan data-gap="" dx="1.56192"> </tspan>and<tspan data-gap="" dx="1.56192"> </tspan>2.2<tspan data-gap="" dx="1.56192"> </tspan>show<tspan data-gap="" dx="1.56192"> </tspan>possible</tspan><tspan x="89" dy="31">records; your own entries may be different.</tspan></text>
<rect class="se-activity-panel" x="89" y="417" width="874" height="721"/><path class="se-activity-tab" d="M109 403H943Q963 403 963 423V446H89V423Q89 403 109 403Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="409" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="431" text-anchor="start">Investigate</text><text class="se-copy" x="113" y="479"><tspan x="113">You will need: a notebook, a pencil, a water bottle.</tspan></text><text class="se-activity-step" x="128" y="530" text-anchor="end">1.</text><text class="se-copy" x="146" y="530"><tspan x="146">Before the visit, copy the headings of Tables 2.1 and 2.2 into your notebook.</tspan><tspan x="146" dy="31">Leave room for your own rows.</tspan></text><text class="se-activity-step" x="128" y="612" text-anchor="end">2.</text><text class="se-copy" x="146" y="612"><tspan x="146">With your teacher, spend one period in a garden, park or school ground.</tspan><tspan x="146" dy="31">Record the place, date and time.</tspan></text><text class="se-activity-step" x="128" y="694" text-anchor="end">3.</text><text class="se-copy" x="146" y="694"><tspan x="146">Walk slowly, then stop at a safe place. Stand still and listen for thirty seconds.</tspan><tspan x="146" dy="31">What different sounds can you hear?</tspan></text><text class="se-activity-step" x="128" y="776" text-anchor="end">4.</text><text class="se-copy" x="146" y="776"><tspan x="146">Add a row for each kind of plant or animal you observe. If you do not know</tspan><tspan x="146" dy="31">its name, describe or sketch it. For example: &quot;small plant, three leaves</tspan><tspan x="146" dy="31">together, near the tap&quot;.</tspan></text><text class="se-activity-step" x="128" y="889" text-anchor="end">5.</text><text class="se-copy" x="146" y="889"><tspan x="146">Record only what you can establish. Write &quot;not seen&quot; for a feature you looked</tspan><tspan x="146" dy="31">for but did not see. Do not pluck leaves or flowers or disturb animals.</tspan></text><text class="se-copy" x="113" y="971"><tspan x="113">Compare your records with a partner. Which living things were difficult to find</tspan><tspan x="113" dy="31">or describe? What made them difficult?</tspan></text><text class="se-copy" x="113" y="1053"><tspan x="113">Safety: Stay with your group. Do not touch any animal. Do not put your fingers</tspan><tspan x="113" dy="31">into holes or under stones.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1181"><tspan x="89">In<tspan data-gap="" dx="2.43461"> </tspan>these<tspan data-gap="" dx="2.43461"> </tspan>two<tspan data-gap="" dx="2.43461"> </tspan>example<tspan data-gap="" dx="2.43461"> </tspan>tables,<tspan data-gap="" dx="2.43461"> </tspan>a<tspan data-gap="" dx="2.43461"> </tspan>dash<tspan data-gap="" dx="2.43461"> </tspan>means<tspan data-gap="" dx="2.43461"> </tspan>that<tspan data-gap="" dx="2.43461"> </tspan>a<tspan data-gap="" dx="2.43461"> </tspan>feature<tspan data-gap="" dx="2.43461"> </tspan>was<tspan data-gap="" dx="2.43461"> </tspan>not<tspan data-gap="" dx="2.43461"> </tspan>recorded.<tspan data-gap="" dx="2.43461"> </tspan>It<tspan data-gap="" dx="2.43461"> </tspan>does</tspan><tspan x="89" dy="31">not<tspan data-gap="" dx="1.11838"> </tspan>mean<tspan data-gap="" dx="1.11838"> </tspan>the<tspan data-gap="" dx="1.11838"> </tspan>feature<tspan data-gap="" dx="1.11838"> </tspan>is<tspan data-gap="" dx="1.11838"> </tspan>absent.<tspan data-gap="" dx="1.11838"> </tspan>A<tspan data-gap="" dx="1.11838"> </tspan>plant<tspan data-gap="" dx="1.11838"> </tspan>without<tspan data-gap="" dx="1.11838"> </tspan>flowers<tspan data-gap="" dx="1.11838"> </tspan>today<tspan data-gap="" dx="1.11838"> </tspan>may<tspan data-gap="" dx="1.11838"> </tspan>flower<tspan data-gap="" dx="1.11838"> </tspan>in<tspan data-gap="" dx="1.11838"> </tspan>another</tspan><tspan x="89" dy="31">season.</tspan></text>
