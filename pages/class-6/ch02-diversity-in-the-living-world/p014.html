<text class="se-copy" data-measure="874" x="89" y="119"><tspan x="89">These<tspan data-gap="" dx="3.22094"> </tspan>are<tspan data-gap="" dx="3.22094"> </tspan>typical<tspan data-gap="" dx="3.22094"> </tspan>associations,<tspan data-gap="" dx="3.22094"> </tspan>not<tspan data-gap="" dx="3.22094"> </tspan>rules<tspan data-gap="" dx="3.22094"> </tspan>without<tspan data-gap="" dx="3.22094"> </tspan>exceptions.<tspan data-gap="" dx="3.22094"> </tspan>Age,<tspan data-gap="" dx="3.22094"> </tspan>how<tspan data-gap="" dx="3.22094"> </tspan>a<tspan data-gap="" dx="3.22094"> </tspan>plant<tspan data-gap="" dx="3.22094"> </tspan>was</tspan><tspan x="89" dy="31">propagated,<tspan data-gap="" dx="0.14841"> </tspan>and<tspan data-gap="" dx="0.14841"> </tspan>unusual<tspan data-gap="" dx="0.14841"> </tspan>features<tspan data-gap="" dx="0.14841"> </tspan>can<tspan data-gap="" dx="0.14841"> </tspan>affect<tspan data-gap="" dx="0.14841"> </tspan>what<tspan data-gap="" dx="0.14841"> </tspan>you<tspan data-gap="" dx="0.14841"> </tspan>observe.<tspan data-gap="" dx="0.14841"> </tspan>Keep<tspan data-gap="" dx="0.14841"> </tspan>exceptions<tspan data-gap="" dx="0.14841"> </tspan>in<tspan data-gap="" dx="0.14841"> </tspan>the</tspan><tspan x="89" dy="31">record.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="234"><tspan x="89">Could another feature help us recognise these groups? Look inside a seed.</tspan></text>
<rect class="se-activity-panel" x="89" y="278" width="874" height="393"/><path class="se-activity-tab" d="M109 264H943Q963 264 963 284V307H89V284Q89 264 109 264Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="270" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="292" text-anchor="start">Investigate</text><text class="se-activity-step" x="128" y="340" text-anchor="end">1.</text><text class="se-copy" x="146" y="340"><tspan x="146">Soak a few chana seeds and a few maize seeds in water for two days, until</tspan><tspan x="146" dy="31">they are soft and swollen.</tspan></text><text class="se-activity-step" x="128" y="422" text-anchor="end">2.</text><text class="se-copy" x="146" y="422"><tspan x="146">Peel the thin outer coat off a soaked chana. Now try to split the seed with</tspan><tspan x="146" dy="31">your thumbnail.</tspan></text><text class="se-activity-step" x="128" y="504" text-anchor="end">3.</text><text class="se-copy" x="146" y="504"><tspan x="146">Try gently to separate a soaked maize grain. Do not use a knife or force it</tspan><tspan x="146" dy="31">apart. Record what you can see; compare with the labelled section</tspan><tspan x="146" dy="31">afterwards.</tspan></text><text class="se-copy" x="113" y="617"><tspan x="113">Which seed comes apart neatly into two halves? Which one does not?</tspan></text>
<text class="se-heading" x="89" y="719"><tspan x="89">What Is Inside a Seed</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="769"><tspan x="89">A<tspan data-gap="" dx="4.48943"> </tspan>soaked<tspan data-gap="" dx="4.48943"> </tspan>chana<tspan data-gap="" dx="4.48943"> </tspan>can<tspan data-gap="" dx="4.48943"> </tspan>separate<tspan data-gap="" dx="4.48943"> </tspan>into<tspan data-gap="" dx="4.48943"> </tspan>two<tspan data-gap="" dx="4.48943"> </tspan>fleshy<tspan data-gap="" dx="4.48943"> </tspan>seed<tspan data-gap="" dx="4.48943"> </tspan>leaves<tspan data-gap="" dx="4.48943"> </tspan>called<tspan data-gap="" dx="4.48943"> </tspan><tspan class="se-bold">cotyledons</tspan>.<tspan data-gap="" dx="4.48943"> </tspan>They</tspan><tspan x="89" dy="31">store<tspan data-gap="" dx="1.87231"> </tspan>food<tspan data-gap="" dx="1.87231"> </tspan>for<tspan data-gap="" dx="1.87231"> </tspan>the<tspan data-gap="" dx="1.87231"> </tspan>young<tspan data-gap="" dx="1.87231"> </tspan>plant.<tspan data-gap="" dx="1.87231"> </tspan>Between<tspan data-gap="" dx="1.87231"> </tspan>them<tspan data-gap="" dx="1.87231"> </tspan>is<tspan data-gap="" dx="1.87231"> </tspan>the<tspan data-gap="" dx="1.87231"> </tspan>rest<tspan data-gap="" dx="1.87231"> </tspan>of<tspan data-gap="" dx="1.87231"> </tspan>the<tspan data-gap="" dx="1.87231"> </tspan>embryo,<tspan data-gap="" dx="1.87231"> </tspan>including<tspan data-gap="" dx="1.87231"> </tspan>a</tspan><tspan x="89" dy="31">tiny<tspan data-gap="" dx="4.54457"> </tspan>root<tspan data-gap="" dx="4.54457"> </tspan>and<tspan data-gap="" dx="4.54457"> </tspan>shoot.<tspan data-gap="" dx="4.54457"> </tspan>Compare<tspan data-gap="" dx="4.54457"> </tspan>your<tspan data-gap="" dx="4.54457"> </tspan>specimen<tspan data-gap="" dx="4.54457"> </tspan>with<tspan data-gap="" dx="4.54457"> </tspan>the<tspan data-gap="" dx="4.54457"> </tspan>labelled<tspan data-gap="" dx="4.54457"> </tspan>illustration.<tspan data-gap="" dx="4.54457"> </tspan>Trace</tspan><tspan x="89" dy="31">each label to the part it names, then locate that part in your specimen if it is visible.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="915"><tspan x="89">In<tspan data-gap="" dx="0.98227"> </tspan>maize,<tspan data-gap="" dx="0.98227"> </tspan>one<tspan data-gap="" dx="0.98227"> </tspan>thin<tspan data-gap="" dx="0.98227"> </tspan>cotyledon<tspan data-gap="" dx="0.98227"> </tspan>lies<tspan data-gap="" dx="0.98227"> </tspan>beside<tspan data-gap="" dx="0.98227"> </tspan>the<tspan data-gap="" dx="0.98227"> </tspan>embryo’s<tspan data-gap="" dx="0.98227"> </tspan>tiny<tspan data-gap="" dx="0.98227"> </tspan>shoot<tspan data-gap="" dx="0.98227"> </tspan>and<tspan data-gap="" dx="0.98227"> </tspan>root.<tspan data-gap="" dx="0.98227"> </tspan>The<tspan data-gap="" dx="0.98227"> </tspan>larger</tspan><tspan x="89" dy="31">pale<tspan data-gap="" dx="0.76932"> </tspan>region<tspan data-gap="" dx="0.76932"> </tspan>is<tspan data-gap="" dx="0.76932"> </tspan>stored<tspan data-gap="" dx="0.76932"> </tspan>food<tspan data-gap="" dx="0.76932"> </tspan>called<tspan data-gap="" dx="0.76932"> </tspan>the<tspan data-gap="" dx="0.76932"> </tspan><tspan class="se-bold">endosperm</tspan>;<tspan data-gap="" dx="0.76932"> </tspan>it<tspan data-gap="" dx="0.76932"> </tspan>is<tspan data-gap="" dx="0.76932"> </tspan>not<tspan data-gap="" dx="0.76932"> </tspan>a<tspan data-gap="" dx="0.76932"> </tspan>second<tspan data-gap="" dx="0.76932"> </tspan>cotyledon.<tspan data-gap="" dx="0.76932"> </tspan>Failure</tspan><tspan x="89" dy="31">to split the grain is not itself proof of the cotyledon count.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1030"><tspan x="89">Cotyledon<tspan data-gap="" dx="10.84680"> </tspan>number,<tspan data-gap="" dx="10.84680"> </tspan>leaf<tspan data-gap="" dx="10.84680"> </tspan>venation<tspan data-gap="" dx="10.84680"> </tspan>and<tspan data-gap="" dx="10.84680"> </tspan>root<tspan data-gap="" dx="10.84680"> </tspan>type<tspan data-gap="" dx="10.84680"> </tspan>are<tspan data-gap="" dx="10.84680"> </tspan>associated<tspan data-gap="" dx="10.84680"> </tspan>features.<tspan data-gap="" dx="10.84680"> </tspan>The</tspan><tspan x="89" dy="31">comparison does not show that cotyledon number causes the other two.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1114"><tspan x="89">Among<tspan data-gap="" dx="11.04644"> </tspan>flowering<tspan data-gap="" dx="11.04644"> </tspan>plants,<tspan data-gap="" dx="11.04644"> </tspan>those<tspan data-gap="" dx="11.04644"> </tspan>whose<tspan data-gap="" dx="11.04644"> </tspan>seeds<tspan data-gap="" dx="11.04644"> </tspan>have<tspan data-gap="" dx="11.04644"> </tspan>two<tspan data-gap="" dx="11.04644"> </tspan>cotyledons<tspan data-gap="" dx="11.04644"> </tspan>are<tspan data-gap="" dx="11.04644"> </tspan>called</tspan><tspan x="89" dy="31"><tspan class="se-bold">dicotyledons</tspan>.<tspan data-gap="" dx="3.75723"> </tspan>We<tspan data-gap="" dx="3.75723"> </tspan>say<tspan data-gap="" dx="3.75723"> </tspan><tspan class="se-bold">dicots</tspan><tspan data-gap="" dx="3.75723"> </tspan>for<tspan data-gap="" dx="3.75723"> </tspan>short.<tspan data-gap="" dx="3.75723"> </tspan>Plants<tspan data-gap="" dx="3.75723"> </tspan>whose<tspan data-gap="" dx="3.75723"> </tspan>seeds<tspan data-gap="" dx="3.75723"> </tspan>have<tspan data-gap="" dx="3.75723"> </tspan>one<tspan data-gap="" dx="3.75723"> </tspan>cotyledon<tspan data-gap="" dx="3.75723"> </tspan>are</tspan><tspan x="89" dy="31">called <tspan class="se-bold">monocotyledons</tspan>, or <tspan class="se-bold">monocots</tspan>.</tspan></text>
