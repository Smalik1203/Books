<rect class="se-prompt" x="89" y="246" width="874" height="154"/><line class="se-think-rule" x1="89" x2="963" y1="246" y2="246"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What you saw"><svg class="se-feature-icon se-feature--observe" x="113" y="255" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="284">What you saw</text></g><text class="se-copy" x="113" y="341"><tspan x="113">How many of your five guesses were right? If you had to guess for a sixth plant</tspan><tspan x="113" dy="31">now, would you feel more sure?</tspan></text>
<text class="se-heading" x="89" y="446"><tspan x="89">The Two Go Together</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="496"><tspan x="89">Compare answers across the whole class. The pattern is easy to see.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="541"><tspan x="89">Plants<tspan data-gap="" dx="4.27260"> </tspan>with<tspan data-gap="" dx="4.27260"> </tspan>reticulate<tspan data-gap="" dx="4.27260"> </tspan>venation<tspan data-gap="" dx="4.27260"> </tspan>almost<tspan data-gap="" dx="4.27260"> </tspan>always<tspan data-gap="" dx="4.27260"> </tspan>have<tspan data-gap="" dx="4.27260"> </tspan>a<tspan data-gap="" dx="4.27260"> </tspan>taproot.<tspan data-gap="" dx="4.27260"> </tspan>Plants<tspan data-gap="" dx="4.27260"> </tspan>with<tspan data-gap="" dx="4.27260"> </tspan>parallel</tspan><tspan x="89" dy="31">venation almost always have fibrous roots.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="617"><tspan x="89"><tspan class="se-italic">Sadabahar</tspan><tspan data-gap="" dx="2.68281"> </tspan>has<tspan data-gap="" dx="2.68281"> </tspan>net-like<tspan data-gap="" dx="2.68281"> </tspan>veins<tspan data-gap="" dx="2.68281"> </tspan>and<tspan data-gap="" dx="2.68281"> </tspan>a<tspan data-gap="" dx="2.68281"> </tspan>taproot.<tspan data-gap="" dx="2.68281"> </tspan>Chana<tspan data-gap="" dx="2.68281"> </tspan>has<tspan data-gap="" dx="2.68281"> </tspan>net-like<tspan data-gap="" dx="2.68281"> </tspan>veins<tspan data-gap="" dx="2.68281"> </tspan>and<tspan data-gap="" dx="2.68281"> </tspan>a<tspan data-gap="" dx="2.68281"> </tspan>taproot.</tspan><tspan x="89" dy="31">Lemongrass<tspan data-gap="" dx="0.15170"> </tspan>has<tspan data-gap="" dx="0.15170"> </tspan>parallel<tspan data-gap="" dx="0.15170"> </tspan>veins<tspan data-gap="" dx="0.15170"> </tspan>and<tspan data-gap="" dx="0.15170"> </tspan>fibrous<tspan data-gap="" dx="0.15170"> </tspan>roots.<tspan data-gap="" dx="0.15170"> </tspan>Wheat<tspan data-gap="" dx="0.15170"> </tspan>has<tspan data-gap="" dx="0.15170"> </tspan>parallel<tspan data-gap="" dx="0.15170"> </tspan>veins<tspan data-gap="" dx="0.15170"> </tspan>and<tspan data-gap="" dx="0.15170"> </tspan>fibrous</tspan><tspan x="89" dy="31">roots.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="724"><tspan x="89">Notice<tspan data-gap="" dx="1.98279"> </tspan>the<tspan data-gap="" dx="1.98279"> </tspan>word<tspan data-gap="" dx="1.98279"> </tspan><tspan class="se-italic">almost</tspan>.<tspan data-gap="" dx="1.98279"> </tspan>A<tspan data-gap="" dx="1.98279"> </tspan>rule<tspan data-gap="" dx="1.98279"> </tspan>that<tspan data-gap="" dx="1.98279"> </tspan>is<tspan data-gap="" dx="1.98279"> </tspan>true<tspan data-gap="" dx="1.98279"> </tspan>nearly<tspan data-gap="" dx="1.98279"> </tspan>every<tspan data-gap="" dx="1.98279"> </tspan>time<tspan data-gap="" dx="1.98279"> </tspan>is<tspan data-gap="" dx="1.98279"> </tspan>still<tspan data-gap="" dx="1.98279"> </tspan>very<tspan data-gap="" dx="1.98279"> </tspan>useful.<tspan data-gap="" dx="1.98279"> </tspan>But</tspan><tspan x="89" dy="31">we should say "almost always", not "always". That is more honest.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="800"><tspan x="89">Now<tspan data-gap="" dx="6.67157"> </tspan>a<tspan data-gap="" dx="6.67157"> </tspan>question<tspan data-gap="" dx="6.67157"> </tspan>should<tspan data-gap="" dx="6.67157"> </tspan>be<tspan data-gap="" dx="6.67157"> </tspan>troubling<tspan data-gap="" dx="6.67157"> </tspan>you.<tspan data-gap="" dx="6.67157"> </tspan>Why<tspan data-gap="" dx="6.67157"> </tspan>should<tspan data-gap="" dx="6.67157"> </tspan>the<tspan data-gap="" dx="6.67157"> </tspan>veins<tspan data-gap="" dx="6.67157"> </tspan>in<tspan data-gap="" dx="6.67157"> </tspan>a<tspan data-gap="" dx="6.67157"> </tspan>leaf<tspan data-gap="" dx="6.67157"> </tspan>have</tspan><tspan x="89" dy="31">anything to do with the shape of a root? They are at opposite ends of the plant.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="876"><tspan x="89">The answer is not in the leaf. It is not in the root. It is in the seed.</tspan></text>
<rect class="se-activity-panel" x="89" y="912" width="874" height="256"/><path class="se-activity-tab" d="M109 898H943Q963 898 963 918V941H89V918Q89 898 109 898Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="904" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="926" text-anchor="start">The setup</text><text class="se-activity-step" x="128" y="974" text-anchor="end">1.</text><text class="se-copy" x="146" y="974"><tspan x="146">Soak a few chana seeds and a few maize seeds in water for two days, until</tspan><tspan x="146" dy="31">they are soft and swollen.</tspan></text><text class="se-activity-step" x="128" y="1048" text-anchor="end">2.</text><text class="se-copy" x="146" y="1048"><tspan x="146">Peel the thin outer coat off a soaked chana. Now try to split the seed with</tspan><tspan x="146" dy="31">your thumbnail.</tspan></text><text class="se-activity-step" x="128" y="1122" text-anchor="end">3.</text><text class="se-copy" x="146" y="1122"><tspan x="146">Try to split a soaked maize seed in the same way.</tspan></text>
