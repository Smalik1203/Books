<text class="duplicate6-invitation" x="89" y="824">Go outside your classroom. Stand still for two minutes.</text>
<text class="duplicate6-copy" x="89" y="875"><tspan x="89">The place may look very ordinary. But living things are all around you.</tspan><tspan x="89" dy="36">Grass is growing through a crack in the path. A crow sits on the wall.</tspan><tspan x="89" dy="36">Ants move in a line along the edge of a step. One tree has wide leaves.</tspan><tspan x="89" dy="36">The tree next to it has thin ones.</tspan></text>
<text class="duplicate6-copy" x="89" y="1030"><tspan x="89">Nobody planted most of these. Nobody arranged them. And no two of them</tspan><tspan x="89" dy="36">are exactly the same.</tspan></text>
<text class="duplicate6-copy" x="89" y="1113"><tspan x="89">This chapter is about that variety. How much of it is there? How do we make</tspan><tspan x="89" dy="36">sense of it? And why are the living things in one place so different from the</tspan><tspan x="89" dy="36">living things in another?</tspan></text>
<rect class="se-prompt" x="89" y="1220" width="874" height="188"/><line class="se-think-rule" x1="89" x2="963" y1="1220" y2="1220"/>

<text class="duplicate6-copy" x="113" y="1302">How many kinds of living things can you find in the illustration?</text>
<text class="duplicate6-copy" x="113" y="1342"><tspan x="113">In your notebook, write “I spotted ___ kinds of living things.” Name</tspan><tspan x="113" dy="36">them. Which did you notice only after a closer look?</tspan></text>
