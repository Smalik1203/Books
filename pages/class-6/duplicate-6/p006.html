<text class="se-heading" x="89" y="296"><tspan x="89">There Is No One Correct Sorting</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="346"><tspan x="89">When<tspan data-gap="" dx="6.20859"> </tspan>the<tspan data-gap="" dx="6.20859"> </tspan>class<tspan data-gap="" dx="6.20859"> </tspan>compares<tspan data-gap="" dx="6.20859"> </tspan>answers,<tspan data-gap="" dx="6.20859"> </tspan>something<tspan data-gap="" dx="6.20859"> </tspan>surprising<tspan data-gap="" dx="6.20859"> </tspan>happens.<tspan data-gap="" dx="6.20859"> </tspan>Almost<tspan data-gap="" dx="6.20859"> </tspan>every</tspan><tspan x="89" dy="31">group sorted the same cards differently. And none of them were wrong.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="422"><tspan x="89">One<tspan data-gap="" dx="1.68101"> </tspan>group<tspan data-gap="" dx="1.68101"> </tspan>may<tspan data-gap="" dx="1.68101"> </tspan>have<tspan data-gap="" dx="1.68101"> </tspan>put<tspan data-gap="" dx="1.68101"> </tspan>plants<tspan data-gap="" dx="1.68101"> </tspan>on<tspan data-gap="" dx="1.68101"> </tspan>one<tspan data-gap="" dx="1.68101"> </tspan>side<tspan data-gap="" dx="1.68101"> </tspan>and<tspan data-gap="" dx="1.68101"> </tspan>animals<tspan data-gap="" dx="1.68101"> </tspan>on<tspan data-gap="" dx="1.68101"> </tspan>the<tspan data-gap="" dx="1.68101"> </tspan>other.<tspan data-gap="" dx="1.68101"> </tspan>Another<tspan data-gap="" dx="1.68101"> </tspan>may</tspan><tspan x="89" dy="31">have<tspan data-gap="" dx="0.10929"> </tspan>used<tspan data-gap="" dx="0.10929"> </tspan>size.<tspan data-gap="" dx="0.10929"> </tspan>Another<tspan data-gap="" dx="0.10929"> </tspan>may<tspan data-gap="" dx="0.10929"> </tspan>have<tspan data-gap="" dx="0.10929"> </tspan>used<tspan data-gap="" dx="0.10929"> </tspan>where<tspan data-gap="" dx="0.10929"> </tspan>the<tspan data-gap="" dx="0.10929"> </tspan>living<tspan data-gap="" dx="0.10929"> </tspan>thing<tspan data-gap="" dx="0.10929"> </tspan>lives,<tspan data-gap="" dx="0.10929"> </tspan>or<tspan data-gap="" dx="0.10929"> </tspan>what<tspan data-gap="" dx="0.10929"> </tspan>it<tspan data-gap="" dx="0.10929"> </tspan>eats,<tspan data-gap="" dx="0.10929"> </tspan>or</tspan><tspan x="89" dy="31">whether it has flowers.</tspan></text>
<text class="se-heading" x="198" y="550" text-anchor="middle">Flowers</text><text class="se-heading" x="415" y="550" text-anchor="middle">Stem</text><text class="se-heading" x="632" y="550" text-anchor="middle">Food</text><text class="se-heading" x="849" y="550" text-anchor="middle">Habitat</text><line class="se-accent" x1="89" x2="963" y1="570" y2="570"/><text class="se-caption" x="526" y="604" text-anchor="middle">Some ways of grouping</text>
<text class="se-copy" data-measure="874" x="89" y="649"><tspan x="89">This<tspan data-gap="" dx="4.35709"> </tspan>is<tspan data-gap="" dx="4.35709"> </tspan>important<tspan data-gap="" dx="4.35709"> </tspan>to<tspan data-gap="" dx="4.35709"> </tspan>understand.<tspan data-gap="" dx="4.35709"> </tspan>It<tspan data-gap="" dx="4.35709"> </tspan>is<tspan data-gap="" dx="4.35709"> </tspan>easy<tspan data-gap="" dx="4.35709"> </tspan>to<tspan data-gap="" dx="4.35709"> </tspan>think<tspan data-gap="" dx="4.35709"> </tspan>that<tspan data-gap="" dx="4.35709"> </tspan>living<tspan data-gap="" dx="4.35709"> </tspan>things<tspan data-gap="" dx="4.35709"> </tspan>come<tspan data-gap="" dx="4.35709"> </tspan>with</tspan><tspan x="89" dy="31">group<tspan data-gap="" dx="0.58190"> </tspan>names<tspan data-gap="" dx="0.58190"> </tspan>already<tspan data-gap="" dx="0.58190"> </tspan>fixed<tspan data-gap="" dx="0.58190"> </tspan>on<tspan data-gap="" dx="0.58190"> </tspan>them.<tspan data-gap="" dx="0.58190"> </tspan>They<tspan data-gap="" dx="0.58190"> </tspan>do<tspan data-gap="" dx="0.58190"> </tspan>not.<tspan data-gap="" dx="0.58190"> </tspan>We<tspan data-gap="" dx="0.58190"> </tspan>make<tspan data-gap="" dx="0.58190"> </tspan>the<tspan data-gap="" dx="0.58190"> </tspan>groups.<tspan data-gap="" dx="0.58190"> </tspan>And<tspan data-gap="" dx="0.58190"> </tspan>we<tspan data-gap="" dx="0.58190"> </tspan>make</tspan><tspan x="89" dy="31">them to suit the question we are asking.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="756"><tspan x="89">A<tspan data-gap="" dx="0.08511"> </tspan>gardener<tspan data-gap="" dx="0.08511"> </tspan>may<tspan data-gap="" dx="0.08511"> </tspan>sort<tspan data-gap="" dx="0.08511"> </tspan>plants<tspan data-gap="" dx="0.08511"> </tspan>by<tspan data-gap="" dx="0.08511"> </tspan>height.<tspan data-gap="" dx="0.08511"> </tspan>That<tspan data-gap="" dx="0.08511"> </tspan>helps<tspan data-gap="" dx="0.08511"> </tspan>a<tspan data-gap="" dx="0.08511"> </tspan>gardening<tspan data-gap="" dx="0.08511"> </tspan>question.<tspan data-gap="" dx="0.08511"> </tspan>A<tspan data-gap="" dx="0.08511"> </tspan>doctor<tspan data-gap="" dx="0.08511"> </tspan>may</tspan><tspan x="89" dy="31">sort<tspan data-gap="" dx="0.36160"> </tspan>plants<tspan data-gap="" dx="0.36160"> </tspan>by<tspan data-gap="" dx="0.36160"> </tspan>which<tspan data-gap="" dx="0.36160"> </tspan>ones<tspan data-gap="" dx="0.36160"> </tspan>are<tspan data-gap="" dx="0.36160"> </tspan>used<tspan data-gap="" dx="0.36160"> </tspan>as<tspan data-gap="" dx="0.36160"> </tspan>medicine.<tspan data-gap="" dx="0.36160"> </tspan>That<tspan data-gap="" dx="0.36160"> </tspan>helps<tspan data-gap="" dx="0.36160"> </tspan>a<tspan data-gap="" dx="0.36160"> </tspan>different<tspan data-gap="" dx="0.36160"> </tspan>question.<tspan data-gap="" dx="0.36160"> </tspan>Both</tspan><tspan x="89" dy="31">sortings are useful. Neither one is the "true" grouping of plants.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="863"><tspan x="89">Scientists<tspan data-gap="" dx="2.66794"> </tspan>look<tspan data-gap="" dx="2.66794"> </tspan>for<tspan data-gap="" dx="2.66794"> </tspan>a<tspan data-gap="" dx="2.66794"> </tspan>grouping<tspan data-gap="" dx="2.66794"> </tspan>that<tspan data-gap="" dx="2.66794"> </tspan>is<tspan data-gap="" dx="2.66794"> </tspan>useful<tspan data-gap="" dx="2.66794"> </tspan>again<tspan data-gap="" dx="2.66794"> </tspan>and<tspan data-gap="" dx="2.66794"> </tspan>again.<tspan data-gap="" dx="2.66794"> </tspan>The<tspan data-gap="" dx="2.66794"> </tspan>best<tspan data-gap="" dx="2.66794"> </tspan>kind<tspan data-gap="" dx="2.66794"> </tspan>is<tspan data-gap="" dx="2.66794"> </tspan>this:</tspan><tspan x="89" dy="31">when<tspan data-gap="" dx="1.52494"> </tspan>you<tspan data-gap="" dx="1.52494"> </tspan>know<tspan data-gap="" dx="1.52494"> </tspan>that<tspan data-gap="" dx="1.52494"> </tspan>something<tspan data-gap="" dx="1.52494"> </tspan>belongs<tspan data-gap="" dx="1.52494"> </tspan>to<tspan data-gap="" dx="1.52494"> </tspan>a<tspan data-gap="" dx="1.52494"> </tspan>group,<tspan data-gap="" dx="1.52494"> </tspan>you<tspan data-gap="" dx="1.52494"> </tspan>can<tspan data-gap="" dx="1.52494"> </tspan>say<tspan data-gap="" dx="1.52494"> </tspan>several<tspan data-gap="" dx="1.52494"> </tspan>other<tspan data-gap="" dx="1.52494"> </tspan>things</tspan><tspan x="89" dy="31">about it. You will meet a grouping like that later in this chapter. Watch for it.</tspan></text>
<rect class="se-prompt" x="89" y="947" width="874" height="154"/><line class="se-think-rule" x1="89" x2="963" y1="947" y2="947"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What you saw"><svg class="se-feature-icon se-feature--observe" x="113" y="956" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="985">What you saw</text></g><text class="se-copy" x="113" y="1042"><tspan x="113">Your school library keeps books in a certain order. What is easy to find because</tspan><tspan x="113" dy="31">of that order? What is hard to find?</tspan></text>
<text class="se-copy" x="89" y="1142"><tspan x="89">A useful rule must be clear enough for someone else to use. “Plants I like” depends</tspan><tspan x="89" dy="31">on the person doing the sorting. “Plants with woody stems” asks everyone to inspect</tspan><tspan x="89" dy="31">the same feature.</tspan></text>
<text class="se-copy" x="89" y="1249"><tspan x="89">Also separate an observation from a guess. “No flowers seen today” is an observation.</tspan><tspan x="89" dy="31">“This plant never flowers” is a much bigger claim. You would need evidence from</tspan><tspan x="89" dy="31">other times of year before putting the plant in that group.</tspan></text>
<text class="se-copy" x="89" y="1356"><tspan x="89">A good grouping invites you to check its rule against a new example.</tspan></text>
