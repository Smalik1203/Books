<text class="se-copy" data-measure="874" x="89" y="517"><tspan x="89">Some<tspan data-gap="" dx="5.78418"> </tspan>living<tspan data-gap="" dx="5.78418"> </tspan>things<tspan data-gap="" dx="5.78418"> </tspan>occur<tspan data-gap="" dx="5.78418"> </tspan>in<tspan data-gap="" dx="5.78418"> </tspan>several<tspan data-gap="" dx="5.78418"> </tspan>surroundings;<tspan data-gap="" dx="5.78418"> </tspan>others<tspan data-gap="" dx="5.78418"> </tspan>have<tspan data-gap="" dx="5.78418"> </tspan>a<tspan data-gap="" dx="5.78418"> </tspan>much<tspan data-gap="" dx="5.78418"> </tspan>narrower</tspan><tspan x="89" dy="31">range.<tspan data-gap="" dx="2.69372"> </tspan>Compare<tspan data-gap="" dx="2.69372"> </tspan>the<tspan data-gap="" dx="2.69372"> </tspan>conditions<tspan data-gap="" dx="2.69372"> </tspan>in<tspan data-gap="" dx="2.69372"> </tspan>each<tspan data-gap="" dx="2.69372"> </tspan>column.<tspan data-gap="" dx="2.69372"> </tspan>The<tspan data-gap="" dx="2.69372"> </tspan>features<tspan data-gap="" dx="2.69372"> </tspan>of<tspan data-gap="" dx="2.69372"> </tspan>a<tspan data-gap="" dx="2.69372"> </tspan>living<tspan data-gap="" dx="2.69372"> </tspan>thing<tspan data-gap="" dx="2.69372"> </tspan>help</tspan><tspan x="89" dy="31">explain where it can survive.</tspan></text>
<text class="se-heading" x="89" y="629"><tspan x="89">Built for the Place</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="679"><tspan x="89">Look at a plant from a hot desert.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="724"><tspan x="89">Water<tspan data-gap="" dx="2.50887"> </tspan>is<tspan data-gap="" dx="2.50887"> </tspan>hard<tspan data-gap="" dx="2.50887"> </tspan>to<tspan data-gap="" dx="2.50887"> </tspan>find<tspan data-gap="" dx="2.50887"> </tspan>there.<tspan data-gap="" dx="2.50887"> </tspan>The<tspan data-gap="" dx="2.50887"> </tspan>sun<tspan data-gap="" dx="2.50887"> </tspan>is<tspan data-gap="" dx="2.50887"> </tspan>very<tspan data-gap="" dx="2.50887"> </tspan>strong<tspan data-gap="" dx="2.50887"> </tspan>all<tspan data-gap="" dx="2.50887"> </tspan>day.<tspan data-gap="" dx="2.50887"> </tspan>The<tspan data-gap="" dx="2.50887"> </tspan>nights<tspan data-gap="" dx="2.50887"> </tspan>turn<tspan data-gap="" dx="2.50887"> </tspan>cold.<tspan data-gap="" dx="2.50887"> </tspan>A</tspan><tspan x="89" dy="31">cactus<tspan data-gap="" dx="3.39479"> </tspan>meets<tspan data-gap="" dx="3.39479"> </tspan>all<tspan data-gap="" dx="3.39479"> </tspan>this<tspan data-gap="" dx="3.39479"> </tspan>with<tspan data-gap="" dx="3.39479"> </tspan>a<tspan data-gap="" dx="3.39479"> </tspan>thick,<tspan data-gap="" dx="3.39479"> </tspan>fleshy<tspan data-gap="" dx="3.39479"> </tspan>stem.<tspan data-gap="" dx="3.39479"> </tspan>The<tspan data-gap="" dx="3.39479"> </tspan>stem<tspan data-gap="" dx="3.39479"> </tspan>stores<tspan data-gap="" dx="3.39479"> </tspan>water<tspan data-gap="" dx="3.39479"> </tspan>through<tspan data-gap="" dx="3.39479"> </tspan>the</tspan><tspan x="89" dy="31">long<tspan data-gap="" dx="1.99175"> </tspan>dry<tspan data-gap="" dx="1.99175"> </tspan>spells.<tspan data-gap="" dx="1.99175"> </tspan>Its<tspan data-gap="" dx="1.99175"> </tspan>outer<tspan data-gap="" dx="1.99175"> </tspan>surface<tspan data-gap="" dx="1.99175"> </tspan>is<tspan data-gap="" dx="1.99175"> </tspan>tough,<tspan data-gap="" dx="1.99175"> </tspan>so<tspan data-gap="" dx="1.99175"> </tspan>very<tspan data-gap="" dx="1.99175"> </tspan>little<tspan data-gap="" dx="1.99175"> </tspan>water<tspan data-gap="" dx="1.99175"> </tspan>escapes.<tspan data-gap="" dx="1.99175"> </tspan>Its<tspan data-gap="" dx="1.99175"> </tspan>leaves<tspan data-gap="" dx="1.99175"> </tspan>are</tspan><tspan x="89" dy="31">only spines. A spine loses far less water than a wide flat leaf would.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="862"><tspan x="89">Now look at a deodar tree, high in the Himalayas.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="907"><tspan x="89">Here<tspan data-gap="" dx="3.93715"> </tspan>the<tspan data-gap="" dx="3.93715"> </tspan>problem<tspan data-gap="" dx="3.93715"> </tspan>is<tspan data-gap="" dx="3.93715"> </tspan>not<tspan data-gap="" dx="3.93715"> </tspan>heat.<tspan data-gap="" dx="3.93715"> </tspan>It<tspan data-gap="" dx="3.93715"> </tspan>is<tspan data-gap="" dx="3.93715"> </tspan>snow.<tspan data-gap="" dx="3.93715"> </tspan>Snow<tspan data-gap="" dx="3.93715"> </tspan>piling<tspan data-gap="" dx="3.93715"> </tspan>up<tspan data-gap="" dx="3.93715"> </tspan>on<tspan data-gap="" dx="3.93715"> </tspan>branches<tspan data-gap="" dx="3.93715"> </tspan>gets<tspan data-gap="" dx="3.93715"> </tspan>heavy</tspan><tspan x="89" dy="31">enough<tspan data-gap="" dx="1.23504"> </tspan>to<tspan data-gap="" dx="1.23504"> </tspan>break<tspan data-gap="" dx="1.23504"> </tspan>them.<tspan data-gap="" dx="1.23504"> </tspan>A<tspan data-gap="" dx="1.23504"> </tspan>deodar<tspan data-gap="" dx="1.23504"> </tspan>is<tspan data-gap="" dx="1.23504"> </tspan>shaped<tspan data-gap="" dx="1.23504"> </tspan>like<tspan data-gap="" dx="1.23504"> </tspan>a<tspan data-gap="" dx="1.23504"> </tspan>cone.<tspan data-gap="" dx="1.23504"> </tspan>Its<tspan data-gap="" dx="1.23504"> </tspan>branches<tspan data-gap="" dx="1.23504"> </tspan>slope<tspan data-gap="" dx="1.23504"> </tspan>downward</tspan><tspan x="89" dy="31">and bend easily. So the snow slides off instead of piling up.</tspan></text>
