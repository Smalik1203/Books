<text class="se-heading" x="89" y="124"><tspan x="89">Plants That Cannot Stand Up</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="174"><tspan x="89">Not every plant can hold itself up.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="219"><tspan x="89">Some<tspan data-gap="" dx="1.13468"> </tspan>plants<tspan data-gap="" dx="1.13468"> </tspan>have<tspan data-gap="" dx="1.13468"> </tspan>stems<tspan data-gap="" dx="1.13468"> </tspan>that<tspan data-gap="" dx="1.13468"> </tspan>are<tspan data-gap="" dx="1.13468"> </tspan>too<tspan data-gap="" dx="1.13468"> </tspan>weak<tspan data-gap="" dx="1.13468"> </tspan>to<tspan data-gap="" dx="1.13468"> </tspan>stand.<tspan data-gap="" dx="1.13468"> </tspan>So<tspan data-gap="" dx="1.13468"> </tspan>they<tspan data-gap="" dx="1.13468"> </tspan>climb<tspan data-gap="" dx="1.13468"> </tspan>up<tspan data-gap="" dx="1.13468"> </tspan>something<tspan data-gap="" dx="1.13468"> </tspan>else</tspan><tspan x="89" dy="31">—<tspan data-gap="" dx="0.58443"> </tspan>a<tspan data-gap="" dx="0.58443"> </tspan>wall,<tspan data-gap="" dx="0.58443"> </tspan>a<tspan data-gap="" dx="0.58443"> </tspan>fence,<tspan data-gap="" dx="0.58443"> </tspan>a<tspan data-gap="" dx="0.58443"> </tspan>stick,<tspan data-gap="" dx="0.58443"> </tspan>or<tspan data-gap="" dx="0.58443"> </tspan>another<tspan data-gap="" dx="0.58443"> </tspan>plant.<tspan data-gap="" dx="0.58443"> </tspan>These<tspan data-gap="" dx="0.58443"> </tspan>are<tspan data-gap="" dx="0.58443"> </tspan>called<tspan data-gap="" dx="0.58443"> </tspan><tspan class="se-bold">climbers</tspan>.<tspan data-gap="" dx="0.58443"> </tspan>A<tspan data-gap="" dx="0.58443"> </tspan>money<tspan data-gap="" dx="0.58443"> </tspan>plant</tspan><tspan x="89" dy="31">is a climber. So is a grape vine.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="326"><tspan x="89">Other<tspan data-gap="" dx="2.85042"> </tspan>plants<tspan data-gap="" dx="2.85042"> </tspan>also<tspan data-gap="" dx="2.85042"> </tspan>have<tspan data-gap="" dx="2.85042"> </tspan>weak<tspan data-gap="" dx="2.85042"> </tspan>stems.<tspan data-gap="" dx="2.85042"> </tspan>But<tspan data-gap="" dx="2.85042"> </tspan>instead<tspan data-gap="" dx="2.85042"> </tspan>of<tspan data-gap="" dx="2.85042"> </tspan>climbing,<tspan data-gap="" dx="2.85042"> </tspan>they<tspan data-gap="" dx="2.85042"> </tspan>spread<tspan data-gap="" dx="2.85042"> </tspan>flat<tspan data-gap="" dx="2.85042"> </tspan>along</tspan><tspan x="89" dy="31">the ground. These are called <tspan class="se-bold">creepers</tspan>. Pumpkin and watermelon plants are creepers.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="402"><tspan x="89">Both<tspan data-gap="" dx="0.24396"> </tspan>kinds<tspan data-gap="" dx="0.24396"> </tspan>have<tspan data-gap="" dx="0.24396"> </tspan>the<tspan data-gap="" dx="0.24396"> </tspan>same<tspan data-gap="" dx="0.24396"> </tspan>problem.<tspan data-gap="" dx="0.24396"> </tspan>A<tspan data-gap="" dx="0.24396"> </tspan>weak<tspan data-gap="" dx="0.24396"> </tspan>stem<tspan data-gap="" dx="0.24396"> </tspan>cannot<tspan data-gap="" dx="0.24396"> </tspan>lift<tspan data-gap="" dx="0.24396"> </tspan>leaves<tspan data-gap="" dx="0.24396"> </tspan>up<tspan data-gap="" dx="0.24396"> </tspan>to<tspan data-gap="" dx="0.24396"> </tspan>the<tspan data-gap="" dx="0.24396"> </tspan>sunlight.</tspan><tspan x="89" dy="31">A<tspan data-gap="" dx="6.44885"> </tspan>climber<tspan data-gap="" dx="6.44885"> </tspan>solves<tspan data-gap="" dx="6.44885"> </tspan>this<tspan data-gap="" dx="6.44885"> </tspan>by<tspan data-gap="" dx="6.44885"> </tspan>using<tspan data-gap="" dx="6.44885"> </tspan>another<tspan data-gap="" dx="6.44885"> </tspan>plant's<tspan data-gap="" dx="6.44885"> </tspan>height.<tspan data-gap="" dx="6.44885"> </tspan>A<tspan data-gap="" dx="6.44885"> </tspan>creeper<tspan data-gap="" dx="6.44885"> </tspan>solves<tspan data-gap="" dx="6.44885"> </tspan>it<tspan data-gap="" dx="6.44885"> </tspan>in<tspan data-gap="" dx="6.44885"> </tspan>a</tspan><tspan x="89" dy="31">different way. It gives up on height and spreads sideways instead.</tspan></text>
