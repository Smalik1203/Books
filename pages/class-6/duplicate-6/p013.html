<image class="science-illustration" href="../../figures/class-6/science/duplicate-6/roots.png" x="89" y="96" width="874" height="325" preserveAspectRatio="xMidYMid meet"><title>Chana · taproot                              Wheat · fibrous roots</title></image><text class="se-caption" x="363.5" y="449" text-anchor="middle">Chana · taproot</text><text class="se-caption" x="688.5" y="449" text-anchor="middle">Wheat · fibrous roots</text>
<text class="se-copy" data-measure="874" x="89" y="493"><tspan x="89">The two shapes do two different jobs.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="538"><tspan x="89">A<tspan data-gap="" dx="1.14966"> </tspan>taproot<tspan data-gap="" dx="1.14966"> </tspan>can<tspan data-gap="" dx="1.14966"> </tspan>grow<tspan data-gap="" dx="1.14966"> </tspan>deep<tspan data-gap="" dx="1.14966"> </tspan>and<tspan data-gap="" dx="1.14966"> </tspan>reach<tspan data-gap="" dx="1.14966"> </tspan>water<tspan data-gap="" dx="1.14966"> </tspan>below<tspan data-gap="" dx="1.14966"> </tspan>the<tspan data-gap="" dx="1.14966"> </tspan>surface.<tspan data-gap="" dx="1.14966"> </tspan>A<tspan data-gap="" dx="1.14966"> </tspan>deep<tspan data-gap="" dx="1.14966"> </tspan>root<tspan data-gap="" dx="1.14966"> </tspan>system<tspan data-gap="" dx="1.14966"> </tspan>can</tspan><tspan x="89" dy="31">help<tspan data-gap="" dx="0.40272"> </tspan>a<tspan data-gap="" dx="0.40272"> </tspan>plant<tspan data-gap="" dx="0.40272"> </tspan>through<tspan data-gap="" dx="0.40272"> </tspan>a<tspan data-gap="" dx="0.40272"> </tspan>dry<tspan data-gap="" dx="0.40272"> </tspan>spell,<tspan data-gap="" dx="0.40272"> </tspan>although<tspan data-gap="" dx="0.40272"> </tspan>root<tspan data-gap="" dx="0.40272"> </tspan>depth<tspan data-gap="" dx="0.40272"> </tspan>also<tspan data-gap="" dx="0.40272"> </tspan>depends<tspan data-gap="" dx="0.40272"> </tspan>on<tspan data-gap="" dx="0.40272"> </tspan>the<tspan data-gap="" dx="0.40272"> </tspan>species<tspan data-gap="" dx="0.40272"> </tspan>and</tspan><tspan x="89" dy="31">the soil.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="645"><tspan x="89">Many<tspan data-gap="" dx="4.01805"> </tspan>fibrous<tspan data-gap="" dx="4.01805"> </tspan>root<tspan data-gap="" dx="4.01805"> </tspan>systems<tspan data-gap="" dx="4.01805"> </tspan>spread<tspan data-gap="" dx="4.01805"> </tspan>through<tspan data-gap="" dx="4.01805"> </tspan>the<tspan data-gap="" dx="4.01805"> </tspan>upper<tspan data-gap="" dx="4.01805"> </tspan>soil.<tspan data-gap="" dx="4.01805"> </tspan>A<tspan data-gap="" dx="4.01805"> </tspan>dense<tspan data-gap="" dx="4.01805"> </tspan>network<tspan data-gap="" dx="4.01805"> </tspan>helps</tspan><tspan x="89" dy="31">hold<tspan data-gap="" dx="1.71705"> </tspan>loose<tspan data-gap="" dx="1.71705"> </tspan>soil<tspan data-gap="" dx="1.71705"> </tspan>together<tspan data-gap="" dx="1.71705"> </tspan>and<tspan data-gap="" dx="1.71705"> </tspan>take<tspan data-gap="" dx="1.71705"> </tspan>up<tspan data-gap="" dx="1.71705"> </tspan>water<tspan data-gap="" dx="1.71705"> </tspan>near<tspan data-gap="" dx="1.71705"> </tspan>the<tspan data-gap="" dx="1.71705"> </tspan>surface.<tspan data-gap="" dx="1.71705"> </tspan>Some<tspan data-gap="" dx="1.71705"> </tspan>fibrous<tspan data-gap="" dx="1.71705"> </tspan>roots<tspan data-gap="" dx="1.71705"> </tspan>also</tspan><tspan x="89" dy="31">reach deep into the ground.</tspan></text>
<text class="se-heading" x="89" y="757"><tspan x="89">A Pattern Appears</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="807"><tspan x="89">You now know two ways to sort plants. One uses leaves. One uses roots.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="852"><tspan x="89">Leaves<tspan data-gap="" dx="2.35443"> </tspan>are<tspan data-gap="" dx="2.35443"> </tspan>above<tspan data-gap="" dx="2.35443"> </tspan>the<tspan data-gap="" dx="2.35443"> </tspan>ground.<tspan data-gap="" dx="2.35443"> </tspan>Roots<tspan data-gap="" dx="2.35443"> </tspan>are<tspan data-gap="" dx="2.35443"> </tspan>below<tspan data-gap="" dx="2.35443"> </tspan>it.<tspan data-gap="" dx="2.35443"> </tspan>There<tspan data-gap="" dx="2.35443"> </tspan>seems<tspan data-gap="" dx="2.35443"> </tspan>to<tspan data-gap="" dx="2.35443"> </tspan>be<tspan data-gap="" dx="2.35443"> </tspan>no<tspan data-gap="" dx="2.35443"> </tspan>reason<tspan data-gap="" dx="2.35443"> </tspan>why</tspan><tspan x="89" dy="31">one should tell you anything about the other.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="928"><tspan x="89">Let us test that.</tspan></text>
<rect class="se-activity-panel" x="89" y="964" width="874" height="342"/><path class="se-activity-tab" d="M109 950H943Q963 950 963 970V993H89V970Q89 950 109 950Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="956" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="978" text-anchor="start">The setup</text><text class="se-activity-step" x="128" y="1026" text-anchor="end">1.</text><text class="se-copy" x="146" y="1026"><tspan x="146">Choose five plants you can see fully, roots and all. Young seedlings from a</tspan><tspan x="146" dy="31">nursery tray work best.</tspan></text><text class="se-activity-step" x="128" y="1100" text-anchor="end">2.</text><text class="se-copy" x="146" y="1100"><tspan x="146">For each plant, look at the leaf first. Write down its venation.</tspan></text><text class="se-activity-step" x="128" y="1143" text-anchor="end">3.</text><text class="se-copy" x="146" y="1143"><tspan x="146">Now, before you look at the <tspan class="se-bold">roots,</tspan> guess whether it will have a taproot or</tspan><tspan x="146" dy="31">fibrous roots. Write your guess down.</tspan></text><text class="se-activity-step" x="128" y="1217" text-anchor="end">4.</text><text class="se-copy" x="146" y="1217"><tspan x="146">Then look at the roots. Write down what you actually find.</tspan></text><text class="se-activity-step" x="128" y="1260" text-anchor="end">5.</text><text class="se-copy" x="146" y="1260"><tspan x="146">Plant the seedlings back carefully afterwards.</tspan></text>
<text class="se-copy se-note" data-measure="874" x="89" y="1349"><tspan x="89">Copy<tspan data-gap="" dx="4.38000"> </tspan>the<tspan data-gap="" dx="4.38000"> </tspan>headings<tspan data-gap="" dx="4.38000"> </tspan>into<tspan data-gap="" dx="4.38000"> </tspan>your<tspan data-gap="" dx="4.38000"> </tspan>notebook<tspan data-gap="" dx="4.38000"> </tspan>and<tspan data-gap="" dx="4.38000"> </tspan>add<tspan data-gap="" dx="4.38000"> </tspan>your<tspan data-gap="" dx="4.38000"> </tspan>own<tspan data-gap="" dx="4.38000"> </tspan>observations.<tspan data-gap="" dx="4.38000"> </tspan>The<tspan data-gap="" dx="4.38000"> </tspan>rows</tspan><tspan x="89" dy="31">below are examples, not a complete record.</tspan></text>
