<section class="page page--food page--science-editorial" data-science-chapter="2" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World, page 5"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M31 63Q34 30 60 7"/><path class="se-botanical-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 2</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Diversity in the Living World</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header -->
<rect class="se-prompt" x="89" y="96" width="874" height="247"/><line class="se-think-rule" x1="89" x2="963" y1="96" y2="96"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What you saw"><svg class="se-feature-icon se-feature--observe" x="113" y="105" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="134">What you saw</text></g><text class="se-copy" x="113" y="191"><tspan x="113">Choose any one living thing from Table 2.1 or Table 2.2. Write two things it</tspan><tspan x="113" dy="31">needs from other living things. Write two things that other living things get</tspan><tspan x="113" dy="31">from it. Compare your answers with a partner who chose something else. Could</tspan><tspan x="113" dy="31">the living thing you chose stay alive on its own, in an empty place with nothing</tspan><tspan x="113" dy="31">else living there?</tspan></text>
<text class="se-heading" x="89" y="389"><tspan x="89">2.2 Making Sense of the Variety</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="439"><tspan x="89">Your<tspan data-gap="" dx="1.41709"> </tspan>two<tspan data-gap="" dx="1.41709"> </tspan>tables<tspan data-gap="" dx="1.41709"> </tspan>now<tspan data-gap="" dx="1.41709"> </tspan>hold<tspan data-gap="" dx="1.41709"> </tspan>a<tspan data-gap="" dx="1.41709"> </tspan>long,<tspan data-gap="" dx="1.41709"> </tspan>untidy<tspan data-gap="" dx="1.41709"> </tspan>list.<tspan data-gap="" dx="1.41709"> </tspan>Nature<tspan data-gap="" dx="1.41709"> </tspan>really<tspan data-gap="" dx="1.41709"> </tspan>is<tspan data-gap="" dx="1.41709"> </tspan>like<tspan data-gap="" dx="1.41709"> </tspan>that.<tspan data-gap="" dx="1.41709"> </tspan>But<tspan data-gap="" dx="1.41709"> </tspan>it<tspan data-gap="" dx="1.41709"> </tspan>is<tspan data-gap="" dx="1.41709"> </tspan>hard</tspan><tspan x="89" dy="31">to study anything from an untidy list.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="515"><tspan x="89">Think<tspan data-gap="" dx="3.16904"> </tspan>of<tspan data-gap="" dx="3.16904"> </tspan>a<tspan data-gap="" dx="3.16904"> </tspan>shop<tspan data-gap="" dx="3.16904"> </tspan>that<tspan data-gap="" dx="3.16904"> </tspan>sells<tspan data-gap="" dx="3.16904"> </tspan>stationery.<tspan data-gap="" dx="3.16904"> </tspan>Suppose<tspan data-gap="" dx="3.16904"> </tspan>everything<tspan data-gap="" dx="3.16904"> </tspan>was<tspan data-gap="" dx="3.16904"> </tspan>thrown<tspan data-gap="" dx="3.16904"> </tspan>into<tspan data-gap="" dx="3.16904"> </tspan>one<tspan data-gap="" dx="3.16904"> </tspan>big</tspan><tspan x="89" dy="31">heap.<tspan data-gap="" dx="1.30854"> </tspan>Finding<tspan data-gap="" dx="1.30854"> </tspan>one<tspan data-gap="" dx="1.30854"> </tspan>pen<tspan data-gap="" dx="1.30854"> </tspan>would<tspan data-gap="" dx="1.30854"> </tspan>take<tspan data-gap="" dx="1.30854"> </tspan>an<tspan data-gap="" dx="1.30854"> </tspan>hour.<tspan data-gap="" dx="1.30854"> </tspan>Shops<tspan data-gap="" dx="1.30854"> </tspan>do<tspan data-gap="" dx="1.30854"> </tspan>not<tspan data-gap="" dx="1.30854"> </tspan>do<tspan data-gap="" dx="1.30854"> </tspan>this.<tspan data-gap="" dx="1.30854"> </tspan>Pens<tspan data-gap="" dx="1.30854"> </tspan>are<tspan data-gap="" dx="1.30854"> </tspan>kept<tspan data-gap="" dx="1.30854"> </tspan>with</tspan><tspan x="89" dy="31">pens. Notebooks are kept with notebooks. Geometry boxes are kept together.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="622"><tspan x="89">Once<tspan data-gap="" dx="0.24049"> </tspan>things<tspan data-gap="" dx="0.24049"> </tspan>are<tspan data-gap="" dx="0.24049"> </tspan>in<tspan data-gap="" dx="0.24049"> </tspan>groups,<tspan data-gap="" dx="0.24049"> </tspan>two<tspan data-gap="" dx="0.24049"> </tspan>things<tspan data-gap="" dx="0.24049"> </tspan>become<tspan data-gap="" dx="0.24049"> </tspan>easy.<tspan data-gap="" dx="0.24049"> </tspan>You<tspan data-gap="" dx="0.24049"> </tspan>can<tspan data-gap="" dx="0.24049"> </tspan>find<tspan data-gap="" dx="0.24049"> </tspan>what<tspan data-gap="" dx="0.24049"> </tspan>you<tspan data-gap="" dx="0.24049"> </tspan>want.<tspan data-gap="" dx="0.24049"> </tspan>And</tspan><tspan x="89" dy="31">you can see what the shop has.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="698"><tspan x="89">Scientists<tspan data-gap="" dx="1.41166"> </tspan>do<tspan data-gap="" dx="1.41166"> </tspan>the<tspan data-gap="" dx="1.41166"> </tspan>same<tspan data-gap="" dx="1.41166"> </tspan>with<tspan data-gap="" dx="1.41166"> </tspan>living<tspan data-gap="" dx="1.41166"> </tspan>things.<tspan data-gap="" dx="1.41166"> </tspan>Putting<tspan data-gap="" dx="1.41166"> </tspan>things<tspan data-gap="" dx="1.41166"> </tspan>into<tspan data-gap="" dx="1.41166"> </tspan>groups<tspan data-gap="" dx="1.41166"> </tspan>by<tspan data-gap="" dx="1.41166"> </tspan>the<tspan data-gap="" dx="1.41166"> </tspan>features</tspan><tspan x="89" dy="31">they share is called grouping.</tspan></text>
<rect class="se-activity-panel" x="89" y="765" width="874" height="428"/><path class="se-activity-tab" d="M109 751H943Q963 751 963 771V794H89V771Q89 751 109 751Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="757" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="779" text-anchor="start">The setup</text><text class="se-copy" x="113" y="827"><tspan x="113">You will need: old magazines or newspapers, scissors, glue, small cards.</tspan></text><text class="se-activity-step" x="128" y="870" text-anchor="end">1.</text><text class="se-copy" x="146" y="870"><tspan x="146">Cut out pictures of plants and animals. Paste one on each card. Try to make</tspan><tspan x="146" dy="31">at least thirty cards in the class.</tspan></text><text class="se-activity-step" x="128" y="944" text-anchor="end">2.</text><text class="se-copy" x="146" y="944"><tspan x="146">Work in groups of five or six. Put all your cards together.</tspan></text><text class="se-activity-step" x="128" y="987" text-anchor="end">3.</text><text class="se-copy" x="146" y="987"><tspan x="146">Sort the pile into groups. You decide what the groups will be.</tspan></text><text class="se-activity-step" x="128" y="1030" text-anchor="end">4.</text><text class="se-copy" x="146" y="1030"><tspan x="146">Write down, in one line, the rule you used.</tspan></text><text class="se-activity-step" x="128" y="1073" text-anchor="end">5.</text><text class="se-copy" x="146" y="1073"><tspan x="146">Now mix all the cards again. Sort them a second time, using a completely</tspan><tspan x="146" dy="31">different rule.</tspan></text><text class="se-copy" x="113" y="1147"><tspan x="113">Safety: Use scissors carefully, with your teacher’s guidance.</tspan></text>
<text class="se-copy" x="89" y="1236"><tspan x="89">Keep your sorting rule visible. If a card is difficult to place, explain what makes it</tspan><tspan x="89" dy="31">difficult instead of hiding it in a convenient pile. An awkward example can show you</tspan><tspan x="89" dy="31">how to make the rule clearer.</tspan></text>
