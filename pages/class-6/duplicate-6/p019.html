<text class="se-heading" x="89" y="372"><tspan x="89">The Same Animal, Two Deserts</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="422"><tspan x="89">The clearest example of this is an animal you already know well.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="467"><tspan x="89">Camels<tspan data-gap="" dx="1.82774"> </tspan>live<tspan data-gap="" dx="1.82774"> </tspan>in<tspan data-gap="" dx="1.82774"> </tspan>the<tspan data-gap="" dx="1.82774"> </tspan>hot<tspan data-gap="" dx="1.82774"> </tspan>sandy<tspan data-gap="" dx="1.82774"> </tspan>desert<tspan data-gap="" dx="1.82774"> </tspan>of<tspan data-gap="" dx="1.82774"> </tspan>Rajasthan.<tspan data-gap="" dx="1.82774"> </tspan>Camels<tspan data-gap="" dx="1.82774"> </tspan>also<tspan data-gap="" dx="1.82774"> </tspan>live<tspan data-gap="" dx="1.82774"> </tspan>in<tspan data-gap="" dx="1.82774"> </tspan>the<tspan data-gap="" dx="1.82774"> </tspan>cold,<tspan data-gap="" dx="1.82774"> </tspan>high,</tspan><tspan x="89" dy="31">rocky<tspan data-gap="" dx="3.31939"> </tspan>desert<tspan data-gap="" dx="3.31939"> </tspan>of<tspan data-gap="" dx="3.31939"> </tspan>Ladakh.<tspan data-gap="" dx="3.31939"> </tspan>Both<tspan data-gap="" dx="3.31939"> </tspan>places<tspan data-gap="" dx="3.31939"> </tspan>are<tspan data-gap="" dx="3.31939"> </tspan>deserts.<tspan data-gap="" dx="3.31939"> </tspan>Both<tspan data-gap="" dx="3.31939"> </tspan>are<tspan data-gap="" dx="3.31939"> </tspan>dry,<tspan data-gap="" dx="3.31939"> </tspan>with<tspan data-gap="" dx="3.31939"> </tspan>little<tspan data-gap="" dx="3.31939"> </tspan>food<tspan data-gap="" dx="3.31939"> </tspan>and</tspan><tspan x="89" dy="31">little<tspan data-gap="" dx="1.11373"> </tspan>shelter.<tspan data-gap="" dx="1.11373"> </tspan>But<tspan data-gap="" dx="1.11373"> </tspan>they<tspan data-gap="" dx="1.11373"> </tspan>are<tspan data-gap="" dx="1.11373"> </tspan>dry<tspan data-gap="" dx="1.11373"> </tspan>in<tspan data-gap="" dx="1.11373"> </tspan>very<tspan data-gap="" dx="1.11373"> </tspan>different<tspan data-gap="" dx="1.11373"> </tspan>ways.<tspan data-gap="" dx="1.11373"> </tspan>And<tspan data-gap="" dx="1.11373"> </tspan>the<tspan data-gap="" dx="1.11373"> </tspan>two<tspan data-gap="" dx="1.11373"> </tspan>camels<tspan data-gap="" dx="1.11373"> </tspan>are<tspan data-gap="" dx="1.11373"> </tspan>not<tspan data-gap="" dx="1.11373"> </tspan>the</tspan><tspan x="89" dy="31">same.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="605"><tspan x="89">The<tspan data-gap="" dx="2.24305"> </tspan>Rajasthan<tspan data-gap="" dx="2.24305"> </tspan>camel<tspan data-gap="" dx="2.24305"> </tspan>is<tspan data-gap="" dx="2.24305"> </tspan>tall,<tspan data-gap="" dx="2.24305"> </tspan>with<tspan data-gap="" dx="2.24305"> </tspan>long<tspan data-gap="" dx="2.24305"> </tspan>legs.<tspan data-gap="" dx="2.24305"> </tspan>Its<tspan data-gap="" dx="2.24305"> </tspan>two-toed<tspan data-gap="" dx="2.24305"> </tspan>feet<tspan data-gap="" dx="2.24305"> </tspan>have<tspan data-gap="" dx="2.24305"> </tspan>broad,<tspan data-gap="" dx="2.24305"> </tspan>spreading</tspan><tspan x="89" dy="31">pads.<tspan data-gap="" dx="0.46591"> </tspan>They<tspan data-gap="" dx="0.46591"> </tspan>spread<tspan data-gap="" dx="0.46591"> </tspan>its<tspan data-gap="" dx="0.46591"> </tspan>weight,<tspan data-gap="" dx="0.46591"> </tspan>so<tspan data-gap="" dx="0.46591"> </tspan>it<tspan data-gap="" dx="0.46591"> </tspan>does<tspan data-gap="" dx="0.46591"> </tspan>not<tspan data-gap="" dx="0.46591"> </tspan>sink<tspan data-gap="" dx="0.46591"> </tspan>into<tspan data-gap="" dx="0.46591"> </tspan>loose<tspan data-gap="" dx="0.46591"> </tspan>sand.<tspan data-gap="" dx="0.46591"> </tspan>It<tspan data-gap="" dx="0.46591"> </tspan>has<tspan data-gap="" dx="0.46591"> </tspan>one<tspan data-gap="" dx="0.46591"> </tspan>hump.<tspan data-gap="" dx="0.46591"> </tspan>Its</tspan><tspan x="89" dy="31">coat is thin.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="712"><tspan x="89">The<tspan data-gap="" dx="2.10323"> </tspan>Ladakh<tspan data-gap="" dx="2.10323"> </tspan>camel<tspan data-gap="" dx="2.10323"> </tspan>is<tspan data-gap="" dx="2.10323"> </tspan>shorter<tspan data-gap="" dx="2.10323"> </tspan>and<tspan data-gap="" dx="2.10323"> </tspan>heavier.<tspan data-gap="" dx="2.10323"> </tspan>Its<tspan data-gap="" dx="2.10323"> </tspan>sturdy<tspan data-gap="" dx="2.10323"> </tspan>legs<tspan data-gap="" dx="2.10323"> </tspan>also<tspan data-gap="" dx="2.10323"> </tspan>end<tspan data-gap="" dx="2.10323"> </tspan>in<tspan data-gap="" dx="2.10323"> </tspan>broad,<tspan data-gap="" dx="2.10323"> </tspan>padded,</tspan><tspan x="89" dy="31">two-toed<tspan data-gap="" dx="1.35305"> </tspan>feet.<tspan data-gap="" dx="1.35305"> </tspan>It<tspan data-gap="" dx="1.35305"> </tspan>has<tspan data-gap="" dx="1.35305"> </tspan>two<tspan data-gap="" dx="1.35305"> </tspan>humps.<tspan data-gap="" dx="1.35305"> </tspan>It<tspan data-gap="" dx="1.35305"> </tspan>grows<tspan data-gap="" dx="1.35305"> </tspan>a<tspan data-gap="" dx="1.35305"> </tspan>thick<tspan data-gap="" dx="1.35305"> </tspan>shaggy<tspan data-gap="" dx="1.35305"> </tspan>coat,<tspan data-gap="" dx="1.35305"> </tspan>especially<tspan data-gap="" dx="1.35305"> </tspan>at<tspan data-gap="" dx="1.35305"> </tspan>the<tspan data-gap="" dx="1.35305"> </tspan>head</tspan><tspan x="89" dy="31">and neck, for winters that fall far below freezing.</tspan></text>

<text class="se-copy" data-measure="874" x="89" y="1206"><tspan x="89">You<tspan data-gap="" dx="3.79354"> </tspan>may<tspan data-gap="" dx="3.79354"> </tspan>have<tspan data-gap="" dx="3.79354"> </tspan>heard<tspan data-gap="" dx="3.79354"> </tspan>that<tspan data-gap="" dx="3.79354"> </tspan>a<tspan data-gap="" dx="3.79354"> </tspan>camel<tspan data-gap="" dx="3.79354"> </tspan>stores<tspan data-gap="" dx="3.79354"> </tspan>water<tspan data-gap="" dx="3.79354"> </tspan>in<tspan data-gap="" dx="3.79354"> </tspan>its<tspan data-gap="" dx="3.79354"> </tspan>hump.<tspan data-gap="" dx="3.79354"> </tspan>That<tspan data-gap="" dx="3.79354"> </tspan>is<tspan data-gap="" dx="3.79354"> </tspan>not<tspan data-gap="" dx="3.79354"> </tspan>true.<tspan data-gap="" dx="3.79354"> </tspan>The</tspan><tspan x="89" dy="31">hump<tspan data-gap="" dx="3.07673"> </tspan>stores<tspan data-gap="" dx="3.07673"> </tspan>fat.<tspan data-gap="" dx="3.07673"> </tspan>The<tspan data-gap="" dx="3.07673"> </tspan>camel<tspan data-gap="" dx="3.07673"> </tspan>lives<tspan data-gap="" dx="3.07673"> </tspan>off<tspan data-gap="" dx="3.07673"> </tspan>that<tspan data-gap="" dx="3.07673"> </tspan>fat<tspan data-gap="" dx="3.07673"> </tspan>when<tspan data-gap="" dx="3.07673"> </tspan>there<tspan data-gap="" dx="3.07673"> </tspan>is<tspan data-gap="" dx="3.07673"> </tspan>no<tspan data-gap="" dx="3.07673"> </tspan>food.<tspan data-gap="" dx="3.07673"> </tspan>By<tspan data-gap="" dx="3.07673"> </tspan>the<tspan data-gap="" dx="3.07673"> </tspan>end<tspan data-gap="" dx="3.07673"> </tspan>of</tspan><tspan x="89" dy="31">winter, the humps of a Ladakh camel become smaller and lean over to one side.</tspan></text>
