<text class="se-heading" x="89" y="124"><tspan x="89">What Is Inside a Seed</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="174"><tspan x="89">A<tspan data-gap="" dx="2.38573"> </tspan>soaked<tspan data-gap="" dx="2.38573"> </tspan>chana<tspan data-gap="" dx="2.38573"> </tspan>splits<tspan data-gap="" dx="2.38573"> </tspan>neatly<tspan data-gap="" dx="2.38573"> </tspan>into<tspan data-gap="" dx="2.38573"> </tspan>two<tspan data-gap="" dx="2.38573"> </tspan>equal<tspan data-gap="" dx="2.38573"> </tspan>halves.<tspan data-gap="" dx="2.38573"> </tspan>Each<tspan data-gap="" dx="2.38573"> </tspan>half<tspan data-gap="" dx="2.38573"> </tspan>is<tspan data-gap="" dx="2.38573"> </tspan>called<tspan data-gap="" dx="2.38573"> </tspan>a<tspan data-gap="" dx="2.38573"> </tspan><tspan class="se-bold">cotyledon</tspan>.</tspan><tspan x="89" dy="31">Look<tspan data-gap="" dx="4.48949"> </tspan>carefully<tspan data-gap="" dx="4.48949"> </tspan>between<tspan data-gap="" dx="4.48949"> </tspan>the<tspan data-gap="" dx="4.48949"> </tspan>two<tspan data-gap="" dx="4.48949"> </tspan>halves.<tspan data-gap="" dx="4.48949"> </tspan>You<tspan data-gap="" dx="4.48949"> </tspan>will<tspan data-gap="" dx="4.48949"> </tspan>see<tspan data-gap="" dx="4.48949"> </tspan>a<tspan data-gap="" dx="4.48949"> </tspan>tiny<tspan data-gap="" dx="4.48949"> </tspan>root<tspan data-gap="" dx="4.48949"> </tspan>and<tspan data-gap="" dx="4.48949"> </tspan>a<tspan data-gap="" dx="4.48949"> </tspan>tiny<tspan data-gap="" dx="4.48949"> </tspan>shoot</tspan><tspan x="89" dy="31">already formed. That is the start of the new plant, with food packed around it.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="281"><tspan x="89">A<tspan data-gap="" dx="5.01921"> </tspan>maize<tspan data-gap="" dx="5.01921"> </tspan>grain<tspan data-gap="" dx="5.01921"> </tspan>does<tspan data-gap="" dx="5.01921"> </tspan>not<tspan data-gap="" dx="5.01921"> </tspan>separate<tspan data-gap="" dx="5.01921"> </tspan>into<tspan data-gap="" dx="5.01921"> </tspan>two<tspan data-gap="" dx="5.01921"> </tspan>large<tspan data-gap="" dx="5.01921"> </tspan>cotyledons<tspan data-gap="" dx="5.01921"> </tspan>like<tspan data-gap="" dx="5.01921"> </tspan>chana.<tspan data-gap="" dx="5.01921"> </tspan>Its<tspan data-gap="" dx="5.01921"> </tspan>single</tspan><tspan x="89" dy="31">cotyledon<tspan data-gap="" dx="0.68030"> </tspan>is<tspan data-gap="" dx="0.68030"> </tspan>visible<tspan data-gap="" dx="0.68030"> </tspan>in<tspan data-gap="" dx="0.68030"> </tspan>the<tspan data-gap="" dx="0.68030"> </tspan>cut-open<tspan data-gap="" dx="0.68030"> </tspan>diagram.<tspan data-gap="" dx="0.68030"> </tspan>Failure<tspan data-gap="" dx="0.68030"> </tspan>to<tspan data-gap="" dx="0.68030"> </tspan>split<tspan data-gap="" dx="0.68030"> </tspan>a<tspan data-gap="" dx="0.68030"> </tspan>seed<tspan data-gap="" dx="0.68030"> </tspan>is<tspan data-gap="" dx="0.68030"> </tspan>not<tspan data-gap="" dx="0.68030"> </tspan>itself<tspan data-gap="" dx="0.68030"> </tspan>proof</tspan><tspan x="89" dy="31">of its cotyledon count.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="388"><tspan x="89">This gives us a third way to sort plants. And this one explains the other two.</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="433"><tspan x="89">Plants<tspan data-gap="" dx="3.06305"> </tspan>whose<tspan data-gap="" dx="3.06305"> </tspan>seeds<tspan data-gap="" dx="3.06305"> </tspan>have<tspan data-gap="" dx="3.06305"> </tspan>two<tspan data-gap="" dx="3.06305"> </tspan>cotyledons<tspan data-gap="" dx="3.06305"> </tspan>are<tspan data-gap="" dx="3.06305"> </tspan>called<tspan data-gap="" dx="3.06305"> </tspan>dicotyledons.<tspan data-gap="" dx="3.06305"> </tspan>We<tspan data-gap="" dx="3.06305"> </tspan>say<tspan data-gap="" dx="3.06305"> </tspan><tspan class="se-bold">dicots</tspan><tspan data-gap="" dx="3.06305"> </tspan>for</tspan><tspan x="89" dy="31">short.<tspan data-gap="" dx="9.85799"> </tspan>Plants<tspan data-gap="" dx="9.85799"> </tspan>whose<tspan data-gap="" dx="9.85799"> </tspan>seeds<tspan data-gap="" dx="9.85799"> </tspan>have<tspan data-gap="" dx="9.85799"> </tspan>one<tspan data-gap="" dx="9.85799"> </tspan>cotyledon<tspan data-gap="" dx="9.85799"> </tspan>are<tspan data-gap="" dx="9.85799"> </tspan>called<tspan data-gap="" dx="9.85799"> </tspan>monocotyledons,<tspan data-gap="" dx="9.85799"> </tspan>or</tspan><tspan x="89" dy="31"><tspan class="se-bold">monocots</tspan>.</tspan></text>
<image class="science-illustration" href="../../figures/class-6/science/duplicate-6/seeds.png" x="89" y="517" width="874" height="320" preserveAspectRatio="xMidYMid meet"><title>Chana · two cotyledons                         Maize · one cotyledon</title></image><text class="se-caption" x="398" y="865" text-anchor="middle">Chana · two cotyledons</text><text class="se-caption" x="730.8" y="865" text-anchor="middle">Maize · one cotyledon</text>
<text class="se-copy" data-measure="874" x="89" y="909"><tspan x="89">Now put all three findings together.</tspan></text>
<text class="se-caption se-bold" x="89" y="954" text-anchor="start">Comparing flowering plants — typical features</text><rect class="se-table-head" x="89" y="973" width="874" height="47"/><line class="se-rule" x1="89" x2="963" y1="1020" y2="1020"/><text class="se-copy se-table-copy se-bold" x="101" y="1000.4"><tspan x="101">—</tspan></text><text class="se-copy se-table-copy se-bold" x="392.3333333333333" y="1000.4"><tspan x="392.3333333333333">Dicots</tspan></text><text class="se-copy se-table-copy se-bold" x="683.6666666666666" y="1000.4"><tspan x="683.6666666666666">Monocots</tspan></text><line class="se-rule" x1="89" x2="963" y1="1067" y2="1067"/><text class="se-copy se-table-copy" x="101" y="1047.4"><tspan x="101">Cotyledons in the seed</tspan></text><text class="se-copy se-table-copy" x="392.3333333333333" y="1047.4"><tspan x="392.3333333333333">Two</tspan></text><text class="se-copy se-table-copy" x="683.6666666666666" y="1047.4"><tspan x="683.6666666666666">One</tspan></text><line class="se-rule" x1="89" x2="963" y1="1114" y2="1114"/><text class="se-copy se-table-copy" x="101" y="1094.4"><tspan x="101">Leaf venation</tspan></text><text class="se-copy se-table-copy" x="392.3333333333333" y="1094.4"><tspan x="392.3333333333333">Reticulate</tspan></text><text class="se-copy se-table-copy" x="683.6666666666666" y="1094.4"><tspan x="683.6666666666666">Parallel</tspan></text><line class="se-rule" x1="89" x2="963" y1="1161" y2="1161"/><text class="se-copy se-table-copy" x="101" y="1141.4"><tspan x="101">Roots</tspan></text><text class="se-copy se-table-copy" x="392.3333333333333" y="1141.4"><tspan x="392.3333333333333">Taproot</tspan></text><text class="se-copy se-table-copy" x="683.6666666666666" y="1141.4"><tspan x="683.6666666666666">Fibrous</tspan></text><line class="se-rule" x1="89" x2="963" y1="1233" y2="1233"/><text class="se-copy se-table-copy" x="101" y="1188.4"><tspan x="101">Examples</tspan></text><text class="se-copy se-table-copy" x="392.3333333333333" y="1188.4"><tspan x="392.3333333333333">Chana, mustard, hibiscus,</tspan><tspan x="392.3333333333333" dy="25">mango</tspan></text><text class="se-copy se-table-copy" x="683.6666666666666" y="1188.4"><tspan x="683.6666666666666">Wheat, maize, grass, banana</tspan></text>
<text class="se-copy" data-measure="874" x="89" y="1270"><tspan x="89">This<tspan data-gap="" dx="1.78686"> </tspan>is<tspan data-gap="" dx="1.78686"> </tspan>the<tspan data-gap="" dx="1.78686"> </tspan>grouping<tspan data-gap="" dx="1.78686"> </tspan>worth<tspan data-gap="" dx="1.78686"> </tspan>having.<tspan data-gap="" dx="1.78686"> </tspan>Split<tspan data-gap="" dx="1.78686"> </tspan>one<tspan data-gap="" dx="1.78686"> </tspan>seed,<tspan data-gap="" dx="1.78686"> </tspan>and<tspan data-gap="" dx="1.78686"> </tspan>you<tspan data-gap="" dx="1.78686"> </tspan>can<tspan data-gap="" dx="1.78686"> </tspan>say<tspan data-gap="" dx="1.78686"> </tspan>two<tspan data-gap="" dx="1.78686"> </tspan>more<tspan data-gap="" dx="1.78686"> </tspan>things</tspan><tspan x="89" dy="31">about a plant you have never seen before.</tspan></text>
