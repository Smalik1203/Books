<section class="page page--food page--science-editorial page--science-v2 page--v2-ch01" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Wonderful World of Science V2, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-observe-motif"><circle cx="51" cy="25" r="15"/><circle cx="51" cy="25" r="10"/><path d="M62 36L75 49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 1</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The Wonderful World of Science</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="method-details" transform="translate(0 112)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112">Observe: describe what happened before deciding why it happened.</tspan></text><text class="se-copy" x="89" y="66" text-anchor="start">•</text><text class="se-copy" x="112" y="66"><tspan x="112">Question: choose something specific you want to find out.</tspan></text><text class="se-copy" x="89" y="108" text-anchor="start">•</text><text class="se-copy" x="112" y="108"><tspan x="112">Suggest: give a possible explanation and a prediction.</tspan></text><text class="se-copy" x="89" y="150" text-anchor="start">•</text><text class="se-copy" x="112" y="150"><tspan x="112">Test: decide what to observe or compare, then keep a record.</tspan></text><text class="se-copy" x="89" y="192" text-anchor="start">•</text><text class="se-copy" x="112" y="192"><tspan x="112">Review: ask whether the result answers the question and what remains</tspan><tspan x="112" dy="32">uncertain.</tspan></text></g>
<g class="v2-reading-block" data-block="method-not-rigid-0" transform="translate(0 360)"><text class="se-copy" x="89" y="24"><tspan x="89">The diagram is a guide, not a rule that every investigation must follow in a</tspan><tspan x="89" dy="32">straight line. You may repeat an observation, improve a question or return to a</tspan></text></g>
<g class="v2-reading-block" data-block="method-not-rigid-1" transform="translate(0 424)"><text class="se-copy" x="89" y="24"><tspan x="89">different explanation. A result you did not expect can be useful if the record is</tspan><tspan x="89" dy="32">clear and the test was carried out carefully.</tspan></text></g>
<g class="v2-reading-block" data-block="fair-test-heading" transform="translate(0 516)"><text class="se-heading" x="89" y="30"><tspan x="89">Make a Comparison Fair</tspan></text></g>
<g class="v2-reading-block" data-block="fair-test-intro-0" transform="translate(0 564)"><text class="se-copy" x="89" y="24"><tspan x="89">Suppose you want to find out whether folding a strip of paper changes how much</tspan><tspan x="89" dy="32">it can support. Comparing a wide card strip with a narrow paper strip would</tspan></text></g>
<g class="v2-reading-block" data-block="fair-test-intro-1" transform="translate(0 628)"><text class="se-copy" x="89" y="24"><tspan x="89">change several things at once. If their results differed, you would not know which</tspan><tspan x="89" dy="32">change mattered.</tspan></text></g>
<g class="v2-reading-block" data-block="paper-investigation" transform="translate(0 708)"><rect class="se-activity-panel" x="89" y="0" width="874" height="598" rx="18"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="21" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="43">Investigate</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Use two identical paper strips, two books of equal height and a few identical</tspan><tspan x="113" dy="32">counters. Ask your teacher to prepare the strips. Work on a low, steady table.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">1.</text><text class="se-copy" x="146" y="168"><tspan x="146">Place the books a short distance apart. Bridge the gap with one flat strip.</tspan><tspan x="146" dy="32">Make a zigzag fold along the length of the second strip.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">2.</text><text class="se-copy" x="146" y="244"><tspan x="146">Before testing, predict which strip will support more counters, or</tspan><tspan x="146" dy="32">whether there will be no difference. Explain your reason.</tspan></text><text class="se-activity-step" x="132" y="320" text-anchor="end">3.</text><text class="se-copy" x="146" y="320"><tspan x="146">Test each strip over the same gap. Add counters gently at the centre, one</tspan><tspan x="146" dy="32">at a time. Record the greatest number supported before the strip slips or</tspan><tspan x="146" dy="32">collapses.</tspan></text><text class="se-activity-step" x="132" y="428" text-anchor="end">4.</text><text class="se-copy" x="146" y="428"><tspan x="146">Repeat with fresh, identical strips. Keep the gap, paper, counters and</tspan><tspan x="146" dy="32">loading position the same. Compare the repeated results, including any</tspan><tspan x="146" dy="32">that differ.</tspan></text><text class="se-copy" x="113" y="536"><tspan x="113">Keep fingers and faces clear of falling counters. Do not use heavy or sharp</tspan><tspan x="113" dy="32">objects.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
