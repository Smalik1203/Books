<section class="page page--food page--science-editorial page--science-v2 page--v2-ch01" data-folio="10" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Wonderful World of Science V2, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-observe-motif"><circle cx="51" cy="25" r="15"/><circle cx="51" cy="25" r="10"/><path d="M62 36L75 49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 1</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The Wonderful World of Science</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Let Us Enhance Our Learning</text><text class="se-copy" x="89" y="204"><tspan x="89">Use your notebook for these questions.</tspan></text><text class="se-copy" x="111" y="260" text-anchor="end">1.</text><text class="se-copy" x="132" y="260"><tspan x="132">A leaf has three holes. A learner says, “An insect ate it.” Separate the</tspan><tspan x="132" dy="32">observation from the possible explanation. What further evidence could help</tspan><tspan x="132" dy="32">check the explanation?</tspan></text><text class="se-copy" x="111" y="379" text-anchor="end">2.</text><text class="se-copy" x="132" y="379"><tspan x="132">A pen leaves no mark on paper. Its transparent refill still contains ink. What</tspan><tspan x="132" dy="32">idea does this observation challenge? What does it leave uncertain?</tspan></text><text class="se-copy" x="111" y="466" text-anchor="end">3.</text><text class="se-copy" x="132" y="466"><tspan x="132">Two groups test flat and folded paper. One also uses a wider strip and heavier</tspan><tspan x="132" dy="32">counters. Explain why their results cannot show the effect of folding alone.</tspan></text><text class="se-copy" x="111" y="553" text-anchor="end">4.</text><text class="se-copy" x="132" y="553"><tspan x="132">Your result disagrees with your prediction. Describe two useful things to do</tspan><tspan x="132" dy="32">before deciding what the result means.</tspan></text><text class="se-copy" x="111" y="640" text-anchor="end">5.</text><text class="se-copy" x="132" y="640"><tspan x="132">Two classmates record different numbers of moving ants in the same place.</tspan><tspan x="132" dy="32">Suggest two details of their methods to compare before deciding whether</tspan><tspan x="132" dy="32">either count is mistaken.</tspan></text><text class="se-copy" x="111" y="759" text-anchor="end">6.</text><text class="se-copy" x="132" y="759"><tspan x="132">Choose two topics from this chapter’s journey through the book. Write a</tspan><tspan x="132" dy="32">question that connects them, and describe a safe first step towards</tspan><tspan x="132" dy="32">investigating it.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
