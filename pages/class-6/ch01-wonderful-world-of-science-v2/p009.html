<section class="page page--food page--science-editorial page--science-v2 page--v2-ch01" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Wonderful World of Science V2, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-observe-motif"><circle cx="51" cy="25" r="15"/><circle cx="51" cy="25" r="10"/><path d="M62 36L75 49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 1</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The Wonderful World of Science</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="442" rx="18"/><text class="se-copy" x="113" y="222"><tspan x="113"><tspan class="se-bold">Science</tspan> — A way of observing,</tspan><tspan x="113" dy="32">thinking and testing ideas to</tspan><tspan x="113" dy="32">understand the world.</tspan></text><text class="se-copy" x="113" y="332"><tspan x="113"><tspan class="se-bold">Curiosity</tspan> — The desire to find out</tspan><tspan x="113" dy="32">more.</tspan></text><text class="se-copy" x="113" y="410"><tspan x="113"><tspan class="se-bold">Observation</tspan> — A detail noticed or</tspan><tspan x="113" dy="32">measured.</tspan></text><text class="se-copy" x="113" y="488"><tspan x="113"><tspan class="se-bold">Evidence</tspan> — Information used to</tspan><tspan x="113" dy="32">judge an idea or answer a question.</tspan></text><text class="se-copy" x="541" y="222"><tspan x="541"><tspan class="se-bold">Hypothesis</tspan> — A possible</tspan><tspan x="541" dy="32">explanation that can be checked.</tspan></text><text class="se-copy" x="541" y="300"><tspan x="541"><tspan class="se-bold">Prediction</tspan> — What you expect to</tspan><tspan x="541" dy="32">observe under stated conditions.</tspan></text><text class="se-copy" x="541" y="378"><tspan x="541"><tspan class="se-bold">Scientific</tspan> <tspan class="se-bold">method</tspan> — A way of</tspan><tspan x="541" dy="32">linking questions, tests and</tspan><tspan x="541" dy="32">conclusions to evidence.</tspan></text><text class="se-copy" x="541" y="488"><tspan x="541"><tspan class="se-bold">Fair</tspan> <tspan class="se-bold">comparison</tspan> — A comparison</tspan><tspan x="541" dy="32">that keeps other relevant conditions</tspan><tspan x="541" dy="32">alike while testing a particular</tspan><tspan x="541" dy="32">difference.</tspan></text><text class="v2-title" x="89" y="684" text-anchor="start">Summary</text><text class="se-copy" x="89" y="732" text-anchor="start">•</text><text class="se-copy" x="112" y="732"><tspan x="112">Science begins with questions about the world, from familiar objects to distant</tspan><tspan x="112" dy="32">places.</tspan></text><text class="se-copy" x="89" y="806" text-anchor="start">•</text><text class="se-copy" x="112" y="806"><tspan x="112">Curiosity leads to questions; careful observations make them easier to</tspan><tspan x="112" dy="32">investigate.</tspan></text><text class="se-copy" x="89" y="880" text-anchor="start">•</text><text class="se-copy" x="112" y="880"><tspan x="112">An observation describes a finding. A hypothesis offers an explanation. A</tspan><tspan x="112" dy="32">prediction states an expected result.</tspan></text><text class="se-copy" x="89" y="954" text-anchor="start">•</text><text class="se-copy" x="112" y="954"><tspan x="112">Tests and further observations provide evidence. Conclusions must stay within</tspan><tspan x="112" dy="32">what that evidence can show.</tspan></text><text class="se-copy" x="89" y="1028" text-anchor="start">•</text><text class="se-copy" x="112" y="1028"><tspan x="112">A fair comparison, clear records and repeated tests help make results more</tspan><tspan x="112" dy="32">dependable.</tspan></text><text class="se-copy" x="89" y="1102" text-anchor="start">•</text><text class="se-copy" x="112" y="1102"><tspan x="112">Unexpected results can lead to better questions and revised explanations.</tspan></text><text class="se-copy" x="89" y="1144" text-anchor="start">•</text><text class="se-copy" x="112" y="1144"><tspan x="112">People use scientific reasoning in everyday work. Sharing methods lets others</tspan><tspan x="112" dy="32">check our ideas.</tspan></text><text class="se-copy" x="89" y="1218" text-anchor="start">•</text><text class="se-copy" x="112" y="1218"><tspan x="112">Learning continues beyond this chapter. Some questions need more</tspan><tspan x="112" dy="32">knowledge, time or equipment.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
