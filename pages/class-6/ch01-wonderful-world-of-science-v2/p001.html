<section class="page page--food page--science-editorial page--science-v2 page--v2-ch01 page--opener" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Wonderful World of Science V2, page 1"><g class="chapter-opener" data-opener="science-v2-ch01"><defs><linearGradient id="science-v2-ch01-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop class="chapter-opener__gradient-start" offset="0%"/><stop class="chapter-opener__gradient-end" offset="100%"/></linearGradient></defs><path class="chapter-opener__band" fill="url(#science-v2-ch01-gradient)" d="M-17 -17H1069V300H-17Z"/><path class="chapter-opener__edge" d="M-17 296H1069V300H-17Z"/><g class="chapter-opener__motif v2-observe-motif"><circle cx="962" cy="127" r="39"/><circle cx="962" cy="127" r="29"/><path d="M990 156L1026 199M934 127H944M962 99V109M980 127H990M962 145V155"/></g><line class="chapter-opener__divider" x1="240" x2="240" y1="94" y2="252"/><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number se-running" x="151" y="242" text-anchor="middle">1</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">The Wonderful</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">World of Science</text><image class="science-illustration chapter-opener__image" href="../../figures/class-6/science/ch01-v2/opener.png" x="89" y="336" width="874" height="351.10156644770086" preserveAspectRatio="xMidYMid meet"><title>Two children noticing a beetle, a seedling and ripples in water</title></image></g><text class="se-copy v2-intro" x="89" y="750"><tspan x="89">Look closely. What can you notice that you had not noticed before?</tspan></text><text class="se-copy" x="89" y="802"><tspan x="89">A small beetle rests on a leaf. A seedling grows beside a puddle. Ripples spread</tspan><tspan x="89" dy="32">across the water. Each observation can lead to a question: What is the beetle</tspan><tspan x="89" dy="32">doing? What does the seedling need? What made the ripples?</tspan></text><text class="se-copy" x="89" y="914"><tspan x="89">You have been exploring and asking questions since childhood. In Class 6, you</tspan><tspan x="89" dy="32">will develop ways to investigate those questions. <tspan class="se-bold">Science</tspan> is a way of observing,</tspan><tspan x="89" dy="32">thinking and testing ideas to understand the world. <tspan class="se-bold">Curiosity</tspan> is the desire to find</tspan><tspan x="89" dy="32">out more.</tspan></text><text class="se-copy" x="89" y="1058"><tspan x="89">You do not need an answer before you begin. Start with something you can</tspan><tspan x="89" dy="32">observe, then ask how you could learn more about it.</tspan></text><text class="se-copy" x="89" y="1138"><tspan x="89">Science can begin with a grain of sand, a mountain, a blade of grass or an entire</tspan><tspan x="89" dy="32">forest. It reaches from the ocean floor to distant stars. It also belongs in familiar</tspan><tspan x="89" dy="32">places: the kitchen, the playground and the path to school. A place does not have</tspan><tspan x="89" dy="32">to be a laboratory for a question to be scientific.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
