<section class="page page--food page--science-editorial page--science-v2 page--v2-ch01" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Wonderful World of Science V2, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-observe-motif"><circle cx="51" cy="25" r="15"/><circle cx="51" cy="25" r="10"/><path d="M62 36L75 49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 1</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The Wonderful World of Science</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="together-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">class: compare records, ask how a measurement was made and explain the</tspan><tspan x="89" dy="32">reason for a conclusion.</tspan></text></g>
<g class="v2-reading-block" data-block="team-photo" transform="translate(0 192)"><image class="science-illustration" href="../../figures/class-6/science/ch01-v2/team.jpg" x="285" y="0" width="482" height="278" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="316.88"><tspan x="89">Compare records and methods, as well as answers.</tspan></text></g>
<g class="v2-reading-block" data-block="disagreement-0" transform="translate(0 543)"><text class="se-copy" x="89" y="24"><tspan x="89">If two groups disagree, voting for the most popular answer will not settle the</tspan><tspan x="89" dy="32">scientific question. Look at how each group worked. Were they observing the</tspan></text></g>
<g class="v2-reading-block" data-block="disagreement-1" transform="translate(0 607)"><text class="se-copy" x="89" y="24"><tspan x="89">same thing, for the same length of time? Did they use the same meaning for</tspan><tspan x="89" dy="32">words such as “open”, “moving” or “supported”? A disagreement may show what</tspan><tspan x="89" dy="32">needs to be checked again.</tspan></text></g>
<g class="v2-reading-block" data-block="reflection-next-question" transform="translate(0 719)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="21" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="43">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Choose one “Why?” question about something you have noticed. Describe</tspan><tspan x="113" dy="32">how you would begin to find an answer: what could you observe, what could</tspan><tspan x="113" dy="32">you compare and whom could you ask?</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Tell a partner your plan. Ask them to identify one detail you need to make</tspan><tspan x="113" dy="32">clearer. Revise the plan, and explain how the change would help you answer</tspan><tspan x="113" dy="32">your question.</tspan></text></g>
<g class="v2-reading-block" data-block="long-journey-0" transform="translate(0 1035)"><text class="se-copy" x="89" y="24"><tspan x="89">Some questions need equipment, knowledge or time that you do not yet have.</tspan><tspan x="89" dy="32">You will meet more ideas through the next five years of school and beyond. Keep</tspan></text></g>
<g class="v2-reading-block" data-block="long-journey-1" transform="translate(0 1099)"><text class="se-copy" x="89" y="24"><tspan x="89">a record of questions you cannot answer now. New learning may give you a way</tspan><tspan x="89" dy="32">to return to them.</tspan></text></g>
<g class="v2-reading-block" data-block="close-0" transform="translate(0 1179)"><text class="se-copy" x="89" y="24"><tspan x="89">There is much still to discover. A careful look at something ordinary can be the</tspan><tspan x="89" dy="32">start of an investigation. Keep observing, keep asking, and be ready to change an</tspan><tspan x="89" dy="32">idea when evidence gives you a reason.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
