<section class="page page--food page--science-editorial page--science-v2 page--v2-ch01" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Wonderful World of Science V2, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-observe-motif"><circle cx="51" cy="25" r="15"/><circle cx="51" cy="25" r="10"/><path d="M62 36L75 49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 1</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The Wonderful World of Science</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="evidence-defined-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Another person should be able to understand your record and, where possible,</tspan><tspan x="89" dy="32">check it.</tspan></text></g>
<g class="v2-reading-block" data-block="sample-record" transform="translate(0 192)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 1.1: Sample observations and possible explanations</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">What was observed</tspan></text><text class="v2-table-heading" x="540" y="76.08"><tspan x="540">A possible explanation</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">At 9 a.m., this flower was closed. At 11</tspan><tspan x="103" dy="28">a.m., it was open.</tspan></text><text class="se-copy se-table-copy" x="540" y="128.07999999999998"><tspan x="540">A change in light may be involved.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="174" y2="174"/><text class="se-copy se-table-copy" x="103" y="208.07999999999998"><tspan x="103">The pen left no mark when moved</tspan><tspan x="103" dy="28">across the paper.</tspan></text><text class="se-copy se-table-copy" x="540" y="208.07999999999998"><tspan x="540">Its refill may have run out of ink.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="254" y2="254"/><rect class="v2-table-frame" x="89" y="42" width="874" height="212"/><line class="v2-table-rule" x1="526" x2="526" y1="42" y2="254"/><text class="v2-table-note" x="89" y="286.88"><tspan x="89">Sample records, not your results. Read across to connect an observation with an idea. The</tspan><tspan x="89" dy="26">right-hand column is not a list of established causes.</tspan></text></g>
<g class="v2-reading-block" data-block="flower-limits-0" transform="translate(0 530)"><text class="se-copy" x="89" y="24"><tspan x="89">The flower record does not show that light caused the change. Time passed, and</tspan><tspan x="89" dy="32">temperature may also have changed. Repeated observations can reveal a pattern;</tspan></text></g>
<g class="v2-reading-block" data-block="flower-limits-1" transform="translate(0 594)"><text class="se-copy" x="89" y="24"><tspan x="89">a carefully planned comparison can help you test an explanation. Keep the</tspan><tspan x="89" dy="32">question, the record and the explanation separate.</tspan></text></g>
<g class="v2-reading-block" data-block="book-heading" transform="translate(0 686)"><text class="v2-title" x="89" y="38"><tspan x="89">1.2 A Journey Through This Book</tspan></text></g>
<g class="v2-reading-block" data-block="earth-0" transform="translate(0 744)"><text class="se-copy" x="89" y="24"><tspan x="89">Begin with Earth, the only planet we know supports life. Its environments are</tspan><tspan x="89" dy="32">home to many kinds of plants and animals, and need protection. You may have</tspan></text></g>
<g class="v2-reading-block" data-block="earth-1" transform="translate(0 808)"><text class="se-copy" x="89" y="24"><tspan x="89">watched a seed become a seedling or a caterpillar change into a butterfly. Science</tspan><tspan x="89" dy="32">helps us ask how living things grow, and how they depend on their surroundings.</tspan></text></g>
<g class="v2-reading-block" data-block="roadmap" transform="translate(0 888)"><g class="v2-diagram-stroke" transform="translate(166 62)"><path d="M0 58V-6M0 18C-40 18-46-7-43-23C-14-21 0-8 0 18ZM0 0C31 0 46-17 43-36C13-32 0-15 0 0M-48 60H48"/></g><text class="se-caption" x="166" y="158" text-anchor="middle">Living things</text><g class="v2-diagram-stroke" transform="translate(345 62)"><circle cx="0" cy="4" r="47"/><circle cx="0" cy="4" r="33"/><path d="M-56-37V49M-64-37V-9Q-56 0-48-9V-37M57-37V49"/></g><text class="se-caption" x="345" y="158" text-anchor="middle">Food</text><g class="v2-diagram-stroke" transform="translate(524 62)"><path d="M-53-27H0V38H-53ZM10-10H57V42H10ZM-49 50H51M17-43A15 15 0 1 0 46-43A15 15 0 1 0 17-43M32-28V-3M32-13H48"/></g><text class="se-caption" x="524" y="158" text-anchor="middle">Materials</text><g class="v2-diagram-stroke" transform="translate(703 62)"><path d="M0-50C-15-22-39 4-39 23A39 39 0 0 0 39 23C39 4 15-22 0-50ZM-23 23Q-23 39-7 42"/></g><text class="se-caption" x="703" y="158" text-anchor="middle">Water</text><g class="v2-diagram-stroke" transform="translate(882 62)"><path d="M17-44A47 47 0 1 0 37 38A39 39 0 0 1 17-44ZM-46-46V-27M-55-37H-37M49-13V8M39-2H59"/></g><text class="se-caption" x="882" y="158" text-anchor="middle">Sky</text><text class="se-caption" x="89" y="200.88"><tspan x="89">Living things, food, materials, water and the sky connect the questions in this book.</tspan></text></g>
<g class="v2-reading-block" data-block="life-food" transform="translate(0 1123)"><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Living things</tspan></text><text class="se-copy" x="89" y="72" text-anchor="start">•</text><text class="se-copy" x="112" y="72"><tspan x="112">Compare plants and animals.</tspan></text><text class="se-copy" x="89" y="114" text-anchor="start">•</text><text class="se-copy" x="112" y="114"><tspan x="112">Look closely at leaves, seeds and</tspan><tspan x="112" dy="32">other structures.</tspan></text><text class="se-copy" x="89" y="188" text-anchor="start">•</text><text class="se-copy" x="112" y="188"><tspan x="112">Ask what living things need to grow</tspan><tspan x="112" dy="32">and survive.</tspan></text><text class="v2-comparison-title" x="542" y="30"><tspan x="542">Food</tspan></text><text class="se-copy" x="542" y="72" text-anchor="start">•</text><text class="se-copy" x="565" y="72"><tspan x="565">Explore ingredients in dishes from</tspan><tspan x="565" dy="32">different parts of India.</tspan></text><text class="se-copy" x="542" y="146" text-anchor="start">•</text><text class="se-copy" x="565" y="146"><tspan x="565">Ask where ingredients come from.</tspan></text><text class="se-copy" x="542" y="188" text-anchor="start">•</text><text class="se-copy" x="565" y="188"><tspan x="565">Investigate what food provides for</tspan><tspan x="565" dy="32">our bodies.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
