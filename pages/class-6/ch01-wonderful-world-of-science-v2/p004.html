<section class="page page--food page--science-editorial page--science-v2 page--v2-ch01" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Wonderful World of Science V2, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-observe-motif"><circle cx="51" cy="25" r="15"/><circle cx="51" cy="25" r="10"/><path d="M62 36L75 49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 1</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The Wonderful World of Science</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="materials-water" transform="translate(0 112)"><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Materials</tspan></text><text class="se-copy" x="89" y="72" text-anchor="start">•</text><text class="se-copy" x="112" y="72"><tspan x="112">Compare paper, metal, plastic,</tspan><tspan x="112" dy="32">rubber and cloth.</tspan></text><text class="se-copy" x="89" y="146" text-anchor="start">•</text><text class="se-copy" x="112" y="146"><tspan x="112">Ask why a material suits a particular</tspan><tspan x="112" dy="32">use.</tspan></text><text class="se-copy" x="89" y="220" text-anchor="start">•</text><text class="se-copy" x="112" y="220"><tspan x="112">Explore magnets and ways to</tspan><tspan x="112" dy="32">separate materials.</tspan></text><text class="v2-comparison-title" x="542" y="30"><tspan x="542">Water and temperature</tspan></text><text class="se-copy" x="542" y="72" text-anchor="start">•</text><text class="se-copy" x="565" y="72"><tspan x="565">Notice ice, liquid water and water</tspan><tspan x="565" dy="32">vapour.</tspan></text><text class="se-copy" x="542" y="146" text-anchor="start">•</text><text class="se-copy" x="565" y="146"><tspan x="565">Ask how rain forms and water</tspan><tspan x="565" dy="32">changes state.</tspan></text><text class="se-copy" x="542" y="220" text-anchor="start">•</text><text class="se-copy" x="565" y="220"><tspan x="565">Measure how hot or cold something</tspan><tspan x="565" dy="32">is.</tspan></text></g>
<g class="v2-reading-block" data-block="sky-0" transform="translate(0 394)"><text class="se-copy" x="89" y="24"><tspan x="89">You will also investigate how things move, and look beyond Earth to the Sun,</tspan><tspan x="89" dy="32">Moon and stars. Questions about the sky can grow from observations made on</tspan></text></g>
<g class="v2-reading-block" data-block="sky-1" transform="translate(0 458)"><text class="se-copy" x="89" y="24"><tspan x="89">the ground. Questions about familiar objects can lead just as far: why is a key</tspan><tspan x="89" dy="32">made of a hard material, while an eraser is soft?</tspan></text></g>
<g class="v2-reading-block" data-block="connected-0" transform="translate(0 538)"><text class="se-copy" x="89" y="24"><tspan x="89">These topics are connected. Water, air and food matter to living things. A</tspan><tspan x="89" dy="32">container’s material affects what it can be used for. Observations of motion</tspan></text></g>
<g class="v2-reading-block" data-block="connected-1" transform="translate(0 602)"><text class="se-copy" x="89" y="24"><tspan x="89">involve changes in position and time. As you learn, look for links between ideas</tspan><tspan x="89" dy="32">without assuming that similar-looking events have the same cause.</tspan></text></g>
<g class="v2-reading-block" data-block="pen-heading" transform="translate(0 694)"><text class="v2-title" x="89" y="38"><tspan x="89">1.3 From a Question to a Test</tspan></text></g>
<g class="v2-reading-block" data-block="pen-observation-0" transform="translate(0 752)"><text class="se-copy" x="89" y="24"><tspan x="89">Suppose your pen stops writing. You move its tip across paper, but it leaves no</tspan><tspan x="89" dy="32">mark. That is your observation. “Why has it stopped writing?” is your question.</tspan><tspan x="89" dy="32">One possible explanation is that the refill is empty.</tspan></text></g>
<g class="v2-reading-block" data-block="hypothesis-0" transform="translate(0 864)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">hypothesis</tspan> is a possible explanation that can be checked. A <tspan class="se-bold">prediction</tspan></tspan><tspan x="89" dy="32">describes what you expect to observe if the explanation is right. These are</tspan><tspan x="89" dy="32">connected, but they do different jobs.</tspan></text></g>
<g class="v2-reading-block" data-block="pen-diagram" transform="translate(0 976)"><g class="v2-diagram-stroke"><path class="v2-diagram-light" d="M232 86H819Q841 86 841 108Q841 130 819 130H232L179 108Z"/><path d="M208 108H816M234 98H804V118H234ZM242 98V118M715 99V117"/><path class="v2-diagram-ink" d="M253 105H706V112H253Z"/><path d="M806 86V72H697M189 108H162M179 108V176H278M510 98V47H580M675 112V176H717"/></g><text class="se-caption" x="586" y="53" text-anchor="start">Refill</text><text class="se-caption" x="284" y="182" text-anchor="start">Tip</text><text class="se-caption" x="724" y="182" text-anchor="start">Ink visible</text><text class="se-caption" x="89" y="228.88"><tspan x="89">A transparent ballpoint pen lets you inspect its refill. A dark section can show where ink</tspan><tspan x="89" dy="27">remains; an opaque refill may not let you judge this.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
