<section class="page page--food page--science-editorial page--science-v2 page--v2-ch01" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Wonderful World of Science V2, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-observe-motif"><circle cx="51" cy="25" r="15"/><circle cx="51" cy="25" r="10"/><path d="M62 36L75 49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 1</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The Wonderful World of Science</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="science-everywhere" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">1.1 Questions Are Everywhere</tspan></text></g>
<g class="v2-reading-block" data-block="landscapes" transform="translate(0 170)"><image class="science-illustration" href="../../figures/class-6/science/ch01-v2/desert.jpg" x="89" y="0" width="202" height="149" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="190" y="178" text-anchor="middle">Desert</text><image class="science-illustration" href="../../figures/class-6/science/ch01-v2/coast.jpg" x="313" y="0" width="202" height="149" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="414" y="178" text-anchor="middle">Coast</text><image class="science-illustration" href="../../figures/class-6/science/ch01-v2/ocean.jpg" x="537" y="0" width="202" height="149" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="638" y="178" text-anchor="middle">Ocean</text><image class="science-illustration" href="../../figures/class-6/science/ch01-v2/galaxy.jpg" x="761" y="0" width="202" height="149" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="862" y="178" text-anchor="middle">Galaxy</text><text class="v2-table-note" x="89" y="217.88"><tspan x="89">These pictures show very different scales. They are not shown at the same scale.</tspan></text></g>
<g class="v2-reading-block" data-block="question-detail-0" transform="translate(0 417)"><text class="se-copy" x="89" y="24"><tspan x="89">Instead of asking “What happens to plants?”, ask “Does this flower open at the</tspan><tspan x="89" dy="32">same time each morning?” Record opening times on several days. Your records</tspan><tspan x="89" dy="32">may raise another question about light or weather.</tspan></text></g>
<g class="v2-reading-block" data-block="observation-task" transform="translate(0 529)"><rect class="se-activity-panel" x="89" y="0" width="874" height="394" rx="18"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="21" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="43">Investigate</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Choose a safe place near your classroom. Observe it with a partner.</tspan></text><text class="se-activity-step" x="132" y="136" text-anchor="end">1.</text><text class="se-copy" x="146" y="136"><tspan x="146">Watch for five minutes. Notice shapes, colours, movement or changes.</tspan><tspan x="146" dy="32">Record three observations in your notebook; a labelled sketch can help.</tspan></text><text class="se-activity-step" x="132" y="212" text-anchor="end">2.</text><text class="se-copy" x="146" y="212"><tspan x="146">Compare your records. Which details did you both notice? Which did only</tspan><tspan x="146" dy="32">one of you record?</tspan></text><text class="se-activity-step" x="132" y="288" text-anchor="end">3.</text><text class="se-copy" x="146" y="288"><tspan x="146">Write one question raised by your observations.</tspan></text><text class="se-copy" x="113" y="332"><tspan x="113">Stay with your group. Leave living things undisturbed. Never taste or touch</tspan><tspan x="113" dy="32">unfamiliar substances, or look directly at the Sun.</tspan></text></g>
<g class="v2-reading-block" data-block="observing-defined-0" transform="translate(0 945)"><text class="se-copy" x="89" y="24"><tspan x="89">An <tspan class="se-bold">observation</tspan> is a detail you notice or measure. “Two ants crossed the leaf”</tspan><tspan x="89" dy="32">describes what was seen. “The ants were searching for food” suggests a reason</tspan></text></g>
<g class="v2-reading-block" data-block="observing-defined-1" transform="translate(0 1009)"><text class="se-copy" x="89" y="24"><tspan x="89">for their movement. The reason might be worth investigating, but it is not the</tspan><tspan x="89" dy="32">same as the observation.</tspan></text></g>
<g class="v2-reading-block" data-block="changing-ideas-heading" transform="translate(0 1101)"><text class="se-heading" x="89" y="30"><tspan x="89">Knowledge Can Change</tspan></text></g>
<g class="v2-reading-block" data-block="puzzle-0" transform="translate(0 1149)"><text class="se-copy" x="89" y="24"><tspan x="89">Think of scientific knowledge as an unfinished jigsaw puzzle. New discoveries</tspan><tspan x="89" dy="32">add pieces. Sometimes new evidence shows that a piece needs to be moved: an</tspan></text></g>
<g class="v2-reading-block" data-block="puzzle-1" transform="translate(0 1213)"><text class="se-copy" x="89" y="24"><tspan x="89">explanation that once seemed reasonable needs to change. Finding a mistake can</tspan><tspan x="89" dy="32">improve our understanding.</tspan></text></g>
<g class="v2-reading-block" data-block="evidence-defined-0" transform="translate(0 1293)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Evidence</tspan> is information used to judge an idea. An observation becomes useful</tspan><tspan x="89" dy="32">evidence when you explain what question it helps answer and how you made it.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
