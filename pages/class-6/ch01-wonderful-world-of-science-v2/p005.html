<section class="page page--food page--science-editorial page--science-v2 page--v2-ch01" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Wonderful World of Science V2, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-observe-motif"><circle cx="51" cy="25" r="15"/><circle cx="51" cy="25" r="10"/><path d="M62 36L75 49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 1</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The Wonderful World of Science</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="pen-alternatives" transform="translate(0 112)"><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Possible explanation</tspan></text><text class="se-copy" x="89" y="72" text-anchor="start">•</text><text class="se-copy" x="112" y="72"><tspan x="112">The refill has no ink left.</tspan></text><text class="se-copy" x="89" y="114" text-anchor="start">•</text><text class="se-copy" x="112" y="114"><tspan x="112">This is an idea about why the pen</tspan><tspan x="112" dy="32">stopped.</tspan></text><text class="v2-comparison-title" x="542" y="30"><tspan x="542">Prediction</tspan></text><text class="se-copy" x="542" y="72" text-anchor="start">•</text><text class="se-copy" x="565" y="72"><tspan x="565">If the transparent refill is empty, I</tspan><tspan x="565" dy="32">expect no ink to be visible inside it.</tspan></text><text class="se-copy" x="542" y="146" text-anchor="start">•</text><text class="se-copy" x="565" y="146"><tspan x="565">This says what to look for when</tspan><tspan x="565" dy="32">checking the idea.</tspan></text></g>
<g class="v2-reading-block" data-block="pen-test-0" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89">You inspect the transparent refill. If it appears empty, the observation supports</tspan><tspan x="89" dy="32">your explanation. If you can still see ink, “the ink has all been used up” does not</tspan><tspan x="89" dy="32">fit that observation. You need another idea: perhaps ink is not reaching the tip.</tspan></text></g>
<g class="v2-reading-block" data-block="pen-limits-0" transform="translate(0 432)"><text class="se-copy" x="89" y="24"><tspan x="89">Be careful about what the check can tell you. An opaque refill may hide its</tspan><tspan x="89" dy="32">contents. Ink visible inside a refill does not show that it can flow through the tip.</tspan><tspan x="89" dy="32">A useful conclusion says both what you found and what remains uncertain.</tspan></text></g>
<g class="v2-reading-block" data-block="pen-followup-0" transform="translate(0 544)"><text class="se-copy" x="89" y="24"><tspan x="89">You could compare the pen with one that writes on the same paper. If one writes</tspan><tspan x="89" dy="32">and the other does not, the comparison gives you a reason to investigate the first</tspan></text></g>
<g class="v2-reading-block" data-block="pen-followup-1" transform="translate(0 608)"><text class="se-copy" x="89" y="24"><tspan x="89">pen further. It still does not identify exactly what is wrong inside. Never heat a</tspan><tspan x="89" dy="32">pen, put its tip in your mouth or use sharp objects to open it.</tspan></text></g>
<g class="v2-reading-block" data-block="reflection-own-problem" transform="translate(0 688)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="262" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="21" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="43">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Think of a problem you tried to solve recently. What did you first notice?</tspan><tspan x="113" dy="32">What steps did you take, and what did each step tell you?</tspan></text><text class="se-copy" x="113" y="168"><tspan x="113">Describe a point where you changed your idea, or explain why you kept it. If</tspan><tspan x="113" dy="32">you solved the problem without finding its cause, say so. Fixing something</tspan><tspan x="113" dy="32">and explaining why it failed are not always the same achievement.</tspan></text></g>
<g class="v2-reading-block" data-block="method-heading" transform="translate(0 984)"><text class="se-heading" x="89" y="30"><tspan x="89">A Method You Can Check</tspan></text></g>
<g class="v2-reading-block" data-block="method-intro-0" transform="translate(0 1032)"><text class="se-copy" x="89" y="24"><tspan x="89">The pen example shows a <tspan class="se-bold">scientific</tspan> <tspan class="se-bold">method</tspan>: observe, ask a question, suggest an</tspan><tspan x="89" dy="32">explanation, test it and examine the result. A test may be an experiment or</tspan><tspan x="89" dy="32">further careful observation. The aim is to connect your conclusion to evidence.</tspan></text></g>
<g class="v2-reading-block" data-block="method-diagram" transform="translate(0 1144)"><rect class="v2-diagram-light" x="89" y="0" width="162" height="68" rx="12"/><text class="v2-small-head" x="170" y="42" text-anchor="middle">Observe</text><path class="v2-diagram-stroke" d="M252 34H264m-5-5 5 5-5 5"/><rect class="v2-diagram-light" x="267" y="0" width="162" height="68" rx="12"/><text class="v2-small-head" x="348" y="42" text-anchor="middle">Question</text><path class="v2-diagram-stroke" d="M430 34H442m-5-5 5 5-5 5"/><rect class="v2-diagram-light" x="445" y="0" width="162" height="68" rx="12"/><text class="v2-small-head" x="526" y="42" text-anchor="middle">Suggest</text><path class="v2-diagram-stroke" d="M608 34H620m-5-5 5 5-5 5"/><rect class="v2-diagram-light" x="623" y="0" width="162" height="68" rx="12"/><text class="v2-small-head" x="704" y="42" text-anchor="middle">Test</text><path class="v2-diagram-stroke" d="M786 34H798m-5-5 5 5-5 5"/><rect class="v2-diagram-light" x="801" y="0" width="162" height="68" rx="12"/><text class="v2-small-head" x="882" y="42" text-anchor="middle">Review</text><path class="v2-diagram-return" d="M882 68V95Q882 113 864 113H463Q446 113 446 95V70"/><path class="v2-diagram-stroke" d="M441 77L446 70L451 77"/><text class="se-caption" x="663" y="150" text-anchor="middle">Revisit the question or explanation</text><text class="se-caption" x="89" y="191.88"><tspan x="89">A useful sequence, with a route back when the evidence calls for another idea.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">5</text></g></svg></div></div></section>
