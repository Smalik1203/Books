<section class="page page--food page--science-editorial page--science-v2 page--v2-ch01" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Wonderful World of Science V2, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-observe-motif"><circle cx="51" cy="25" r="15"/><circle cx="51" cy="25" r="10"/><path d="M62 36L75 49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 1</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The Wonderful World of Science</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="test-reading-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Compare the numbers your strips supported, not just whether they looked</tspan><tspan x="89" dy="32">strong. If a strip slipped from a book before bending, record that too. Repeating a</tspan></text></g>
<g class="v2-reading-block" data-block="test-reading-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">test can reveal how much results vary. Do not leave out a result simply because it</tspan><tspan x="89" dy="32">disagrees with your prediction.</tspan></text></g>
<g class="v2-reading-block" data-block="test-conclusion-0" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">If the folded strips repeatedly support more counters, your records support that</tspan><tspan x="89" dy="32">claim for the paper and gap you tested. They do not show that every folded sheet</tspan></text></g>
<g class="v2-reading-block" data-block="test-conclusion-1" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89">is stronger in every situation. If results overlap or vary widely, describe that</tspan><tspan x="89" dy="32">uncertainty and suggest what you would check next.</tspan></text></g>
<g class="v2-reading-block" data-block="everyday-heading" transform="translate(0 412)"><text class="v2-title" x="89" y="38"><tspan x="89">1.4 Science Is a Shared Practice</tspan></text></g>
<g class="v2-reading-block" data-block="everyone-0" transform="translate(0 470)"><text class="se-copy" x="89" y="24"><tspan x="89">Scientists investigate questions as part of their work, but the habits are useful to</tspan><tspan x="89" dy="32">everyone. People who cook, repair bicycles or maintain electrical equipment</tspan></text></g>
<g class="v2-reading-block" data-block="everyone-1" transform="translate(0 534)"><text class="se-copy" x="89" y="24"><tspan x="89">often observe a problem, consider possible causes and check them. Their</tspan><tspan x="89" dy="32">experience helps them choose a sensible place to begin.</tspan></text></g>
<g class="v2-reading-block" data-block="everyday-examples" transform="translate(0 614)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112">A cook notices dal has spilled from a cooker. Too much water is one possible</tspan><tspan x="112" dy="32">cause; the observation alone does not establish it.</tspan></text><text class="se-copy" x="89" y="98" text-anchor="start">•</text><text class="se-copy" x="112" y="98"><tspan x="112">A bicycle repairer checks a flat tyre to find where air is escaping. Finding a leak</tspan><tspan x="112" dy="32">is evidence about the location of a problem.</tspan></text><text class="se-copy" x="89" y="172" text-anchor="start">•</text><text class="se-copy" x="112" y="172"><tspan x="112">A qualified electrician checks whether a lamp fault is in the bulb, switch or</tspan><tspan x="112" dy="32">another part. Electrical equipment needs trained, safe handling; this is not an</tspan><tspan x="112" dy="32">activity to try yourself.</tspan></text></g>
<g class="v2-reading-block" data-block="reflection-daily-life" transform="translate(0 874)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="21" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="43">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Describe a daily-life situation in which someone used observations and a test</tspan><tspan x="113" dy="32">to solve a problem. Name the question, the possible explanation and the</tspan><tspan x="113" dy="32">check.</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">If they changed several things at once, could they tell which change caused</tspan><tspan x="113" dy="32">the result? Suggest a safer or clearer comparison, or explain what</tspan><tspan x="113" dy="32">information is still missing.</tspan></text></g>
<g class="v2-reading-block" data-block="together-0" transform="translate(0 1190)"><text class="se-copy" x="89" y="24"><tspan x="89">Science is rarely done alone. Scientists work in teams and share methods and</tspan><tspan x="89" dy="32">evidence with others, sometimes across many countries. You can practise this in</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
