<section class="page page--food page--science-editorial page--science-v2 page--g6-ch11" data-folio="17"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Nature’s Treasures, page 17"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Nature’s Treasures</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="866" rx="18"/><text class="se-copy" x="113" y="222" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Natural</tspan> <tspan class="se-bold">resource</tspan> — Material or</tspan><tspan x="113" dy="32" data-paragraph-end="true">energy source obtained from nature.</tspan></text><text class="se-copy" x="113" y="306" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Air</tspan> — The mixture of gases</tspan><tspan x="113" dy="32" data-paragraph-end="true">surrounding Earth.</tspan></text><text class="se-copy" x="113" y="390" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Wind</tspan> — Air moving from place to</tspan><tspan x="113" dy="32" data-paragraph-end="true">place.</tspan></text><text class="se-copy" x="113" y="474" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Fresh</tspan> <tspan class="se-bold">water</tspan> — Water containing</tspan><tspan x="113" dy="32" data-paragraph-end="true">relatively little dissolved salt.</tspan></text><text class="se-copy" x="113" y="558" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Rainwater</tspan> <tspan class="se-bold">harvesting</tspan> — Collecting</tspan><tspan x="113" dy="32" data-narrow-prose="true">rainwater for storage or suitable</tspan><tspan x="113" dy="32" data-paragraph-end="true">recharge.</tspan></text><text class="se-copy" x="113" y="674" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Solar</tspan> <tspan class="se-bold">energy</tspan> — Energy received</tspan><tspan x="113" dy="32" data-paragraph-end="true">from the Sun.</tspan></text><text class="se-copy" x="113" y="758" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Forest</tspan> — Trees and other organisms</tspan><tspan x="113" dy="32" data-paragraph-end="true">interacting with their surroundings.</tspan></text><text class="se-copy" x="113" y="842" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Decomposer</tspan> — An organism that</tspan><tspan x="113" dy="32" data-paragraph-end="true">breaks down dead organic material.</tspan></text><text class="se-copy" x="541" y="222" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Soil</tspan> — Mineral and organic material</tspan><tspan x="541" dy="32" data-paragraph-end="true">with organisms, air and water.</tspan></text><text class="se-copy" x="541" y="306" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Weathering</tspan> — Breakdown and</tspan><tspan x="541" dy="32" data-narrow-prose="true">alteration of rock at or near Earth’s</tspan><tspan x="541" dy="32" data-paragraph-end="true">surface.</tspan></text><text class="se-copy" x="541" y="422" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Mineral</tspan> — A natural solid with</tspan><tspan x="541" dy="32" data-narrow-prose="true">characteristic composition and</tspan><tspan x="541" dy="32" data-paragraph-end="true">structure.</tspan></text><text class="se-copy" x="541" y="538" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Fossil</tspan> <tspan class="se-bold">fuel</tspan> — Fuel formed from</tspan><tspan x="541" dy="32" data-narrow-prose="true">ancient organic matter over</tspan><tspan x="541" dy="32" data-paragraph-end="true">geological time.</tspan></text><text class="se-copy" x="541" y="654" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Petroleum</tspan> — Crude oil, processed to</tspan><tspan x="541" dy="32" data-paragraph-end="true">obtain petrol and other products.</tspan></text><text class="se-copy" x="541" y="738" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Renewable</tspan> <tspan class="se-bold">resource</tspan> — A resource</tspan><tspan x="541" dy="32" data-narrow-prose="true">naturally replenished on a useful</tspan><tspan x="541" dy="32" data-paragraph-end="true">human timescale.</tspan></text><text class="se-copy" x="541" y="854" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Non-renewable</tspan> <tspan class="se-bold">resource</tspan> — A</tspan><tspan x="541" dy="32" data-narrow-prose="true">resource not replaced on the</tspan><tspan x="541" dy="32" data-paragraph-end="true">timescale of human use.</tspan></text><text class="se-copy" x="541" y="970" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Conservation</tspan> — Careful protection</tspan><tspan x="541" dy="32" data-paragraph-end="true">and use of resources to reduce loss.</tspan></text><g transform="translate(0 1040)"><g data-page-illustration="figures/class-7/science/ch07/insulation.png"><image class="science-illustration" href="../../figures/class-7/science/ch07/insulation.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Materials that slow heat transfer.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Materials that slow heat transfer.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">17</text></g></svg></div></div></section>
