<section class="page page--food page--science-editorial page--science-v2 page--g6-ch11" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Nature’s Treasures, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Nature’s Treasures</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="transport-care" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Walking or cycling on a safe route, sharing a journey and using suitable public</tspan><tspan x="89" dy="32">transport can reduce fuel use. Battery-electric vehicles have no exhaust</tspan><tspan x="89" dy="32">emissions at the vehicle, but producing their electricity and materials still has</tspan><tspan x="89" dy="32">environmental effects. Ask where energy comes from before comparing choices.</tspan></text></g>
<g class="v2-reading-block" data-block="renew-heading" transform="translate(0 268)"><text class="v2-title" x="89" y="38"><tspan x="89">11.7 Renewable Does Not Mean Endless</tspan></text></g>
<g class="v2-reading-block" data-block="renew-table" transform="translate(0 326)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 11.5 · How quickly is a resource replaced?</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Resource</tspan></text><text class="v2-table-heading" x="304.02" y="76.08"><tspan x="304.02">Replenishment</tspan></text><text class="v2-table-heading" x="627.4" y="76.08"><tspan x="627.4">Why careful use still matters</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Sunlight and</tspan><tspan x="103" dy="28">wind</tspan></text><text class="se-copy se-table-copy" x="304.02" y="128.07999999999998"><tspan x="304.02">Continuing natural energy</tspan><tspan x="304.02" dy="28">flows</tspan></text><text class="se-copy se-table-copy" x="627.4" y="128.07999999999998"><tspan x="627.4">Availability changes with time</tspan><tspan x="627.4" dy="28">and weather</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="174" y2="174"/><text class="se-copy se-table-copy" x="103" y="208.07999999999998"><tspan x="103">Water</tspan></text><text class="se-copy se-table-copy" x="304.02" y="208.07999999999998"><tspan x="304.02">Circulates through the water</tspan><tspan x="304.02" dy="28">cycle</tspan></text><text class="se-copy se-table-copy" x="627.4" y="208.07999999999998"><tspan x="627.4">Local supplies can be depleted</tspan><tspan x="627.4" dy="28">or polluted</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="254" y2="254"/><text class="se-copy se-table-copy" x="103" y="288.08"><tspan x="103">Forests</tspan></text><text class="se-copy se-table-copy" x="304.02" y="288.08"><tspan x="304.02">Can regenerate under</tspan><tspan x="304.02" dy="28">suitable conditions</tspan></text><text class="se-copy se-table-copy" x="627.4" y="288.08"><tspan x="627.4">Loss may be faster than</tspan><tspan x="627.4" dy="28">recovery</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="334" y2="334"/><text class="se-copy se-table-copy" x="103" y="368.08"><tspan x="103">Fossil fuels</tspan></text><text class="se-copy se-table-copy" x="304.02" y="368.08"><tspan x="304.02">Form over geological time</tspan></text><text class="se-copy se-table-copy" x="627.4" y="368.08"><tspan x="627.4">Stocks fall as they are extracted</tspan><tspan x="627.4" dy="28">and used</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="414" y2="414"/><text class="se-copy se-table-copy" x="103" y="448.08"><tspan x="103">Mineral deposits</tspan></text><text class="se-copy se-table-copy" x="304.02" y="448.08"><tspan x="304.02">Not replaced on human-use</tspan><tspan x="304.02" dy="28">timescales</tspan></text><text class="se-copy se-table-copy" x="627.4" y="448.08"><tspan x="627.4">Reuse and recycling reduce new</tspan><tspan x="627.4" dy="28">mining</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="494" y2="494"/><text class="se-copy se-table-copy" x="103" y="528.08"><tspan x="103">Soil</tspan></text><text class="se-copy se-table-copy" x="304.02" y="528.08"><tspan x="304.02">Generally develops slowly</tspan></text><text class="se-copy se-table-copy" x="627.4" y="528.08"><tspan x="627.4">Rapid erosion can remove a</tspan><tspan x="627.4" dy="28">long-built layer</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="574" y2="574"/><rect class="v2-table-frame" x="89" y="42" width="874" height="532"/><line class="v2-table-rule" x1="290.02" x2="290.02" y1="42" y2="574"/><line class="v2-table-rule" x1="613.4" x2="613.4" y1="42" y2="574"/><text class="v2-table-note" x="89" y="606.88"><tspan x="89">Soil is effectively non-renewable on human timescales; water and forests need protection to</tspan><tspan x="89" dy="26">remain usable.</tspan></text></g><g transform="translate(0 984)"><g data-page-illustration="figures/class-6/science/ch11/solar.png"><image class="science-illustration" href="../../figures/class-6/science/ch11/solar.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Devices using sunlight.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Devices using sunlight.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
