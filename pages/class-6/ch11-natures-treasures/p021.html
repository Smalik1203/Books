<section class="page page--food page--science-editorial page--science-v2 page--g6-ch11" data-folio="21"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Nature’s Treasures, page 21"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Nature’s Treasures</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Explore Further</tspan></text></g>
<g class="v2-reading-block" data-block="project-water" transform="translate(0 170)"><text class="se-heading" x="89" y="30"><tspan x="89">1. Learn from local water systems</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Find out about a traditional rainwater-harvesting system in your state or</tspan><tspan x="89" dy="32">elsewhere in India. Use a reliable source or an adult-led conversation with</tspan><tspan x="89" dy="32">someone who knows the system. Draw its water route, name its intended uses</tspan><tspan x="89" dy="32">and describe maintenance. Separate what you observed from what you were told.</tspan><tspan x="89" dy="32">Do not enter wells or tanks, or climb onto roofs.</tspan></text></g>
<g class="v2-reading-block" data-block="project-air" transform="translate(0 406)"><text class="se-heading" x="89" y="30"><tspan x="89">2. Investigate an air-quality concern</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">With permission, talk to older people about changes they have noticed in local</tspan><tspan x="89" dy="32">air and possible sources of pollution. Record observations respectfully, without</tspan><tspan x="89" dy="32">names or private medical details. Compare the accounts with reliable public</tspan><tspan x="89" dy="32">information on air pollution. An interview alone cannot prove what caused an</tspan><tspan x="89" dy="32">illness. Suggest two practical actions and explain which source each addresses.</tspan></text></g><g transform="translate(0 642)"><g data-page-illustration="figures/class-6/science/ch11/rain.png"><image class="science-illustration" href="../../figures/class-6/science/ch11/rain.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Collecting rainwater.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Collecting rainwater.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">21</text></g></svg></div></div></section>
