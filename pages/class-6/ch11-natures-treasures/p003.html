<section class="page page--food page--science-editorial page--science-v2 page--g6-ch11" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Nature’s Treasures, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Nature’s Treasures</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="wind-heading" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Moving Air Can Do Work</tspan></text></g>
<g class="v2-reading-block" data-block="wind" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89">Moving air is called <tspan class="se-bold">wind</tspan>. A fluttering flag or swaying branch gives evidence of</tspan><tspan x="89" dy="32">its movement. Wind can exert a force on a surface. Can you use that force to turn</tspan><tspan x="89" dy="32">an object?</tspan></text></g>
<g class="v2-reading-block" data-block="pinwheel-task" transform="translate(0 272)"><rect class="se-activity-panel" x="89" y="0" width="874" height="752" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Take a square of paper about 15 cm on each side. Mark its diagonals. With</tspan><tspan x="146" dy="32">adult help, cut inward from each corner, stopping well before the centre.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Bring alternate corner tips towards the centre. Ask an adult to fasten</tspan><tspan x="146" dy="32">them loosely to a stick with a pin, leaving room to turn and covering the</tspan><tspan x="146" dy="32">sharp point securely.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Hold the handle still. Compare still air with a gentle breeze made by</tspan><tspan x="146" dy="32">fanning a card. Do not run with the pinwheel or blow towards anyone’s</tspan><tspan x="146" dy="32">face.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">4.</text><text class="se-copy" x="146" y="384"><tspan x="146">Change its direction relative to the airflow. Record when it turns and</tspan><tspan x="146" dy="32">when it does not. Which observation supports the idea that moving air</tspan><tspan x="146" dy="32">exerts a force?</tspan></text><image class="science-illustration" data-photo="pinwheel" href="../../figures/class-6/science/ch11/pinwheel.png" x="357.25" y="468" width="337.5" height="225" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="723.88"><tspan x="113">Fig. 11.2 · Paper stages and an assembled pinwheel, or firki.</tspan></text></g>
<g class="v2-reading-block" data-block="wind-energy" transform="translate(0 1046)"><text class="se-copy" x="89" y="24"><tspan x="89">Air pushes on the angled paper surfaces and can make the pinwheel rotate.</tspan><tspan x="89" dy="32">Windmills use moving air to turn blades and a shaft. The shaft may drive a pump</tspan><tspan x="89" dy="32">or a mill; in a wind turbine, a generator converts the motion into electrical</tspan><tspan x="89" dy="32">energy. The device transfers energy rather than creating it.</tspan></text></g>
<g class="v2-reading-block" data-block="wind-farms" transform="translate(0 1190)"><text class="se-copy" x="89" y="24"><tspan x="89">Groups of wind turbines form wind farms. India has wind farms in several states,</tspan><tspan x="89" dy="32">including Tamil Nadu, Rajasthan and Maharashtra. Their output changes with</tspan><tspan x="89" dy="32">wind conditions. A good site needs suitable winds as well as careful attention to</tspan><tspan x="89" dy="32">people, wildlife and the land.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
