<section class="page page--food page--science-editorial page--science-v2 page--g6-ch11" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Nature’s Treasures, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Nature’s Treasures</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="harvest-art" transform="translate(0 112)"><image class="science-illustration" data-photo="rain" href="../../figures/class-6/science/ch11/rain.png" x="271" y="0" width="510" height="340" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="370.88"><tspan x="89">Fig. 11.3 · Cutaway view of covered storage. The overflow carries water away when the tank</tspan><tspan x="89" dy="27">fills.</tspan></text></g>
<g class="v2-reading-block" data-block="harvesting" transform="translate(0 544)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Rainwater</tspan> <tspan class="se-bold">harvesting</tspan> collects and stores rainwater, or helps it enter suitable</tspan><tspan x="89" dy="32">ground for later use. Rooftop systems need maintained gutters, an inlet that</tspan><tspan x="89" dy="32">limits debris, covered storage and a safe overflow. Collected water is not</tspan><tspan x="89" dy="32">automatically drinking water. Adults must arrange any treatment needed for its</tspan><tspan x="89" dy="32">intended use.</tspan></text></g>
<g class="v2-reading-block" data-block="traditional" transform="translate(0 720)"><text class="se-copy" x="89" y="24"><tspan x="89">Communities have long built tanks, ponds and stepwells to manage water.</tspan><tspan x="89" dy="32">Stepwells are known by regional names such as bawadi and vav; Toorji ka Jhalra</tspan><tspan x="89" dy="32">in Jodhpur is one example. Ask how a local structure receives, stores or gives</tspan><tspan x="89" dy="32">access to water. Designs differ; do not assume every stepwell is fed by a nearby</tspan><tspan x="89" dy="32">river. Never enter tanks or climb onto roofs for an investigation.</tspan></text></g>
<g class="v2-reading-block" data-block="sun-heading" transform="translate(0 908)"><text class="v2-title" x="89" y="38"><tspan x="89">11.3 Energy from the Sun</tspan></text></g>
<g class="v2-reading-block" data-block="sun-start" transform="translate(0 966)"><text class="se-copy" x="89" y="24"><tspan x="89">Ajji spreads washed clothes and chillies out to dry. Sunlight can warm them and</tspan><tspan x="89" dy="32">their surroundings, helping water evaporate. Moving air also helps carry water</tspan><tspan x="89" dy="32">vapour away. Which conditions would you keep the same to compare drying in</tspan><tspan x="89" dy="32">sun and shade fairly?</tspan></text></g>
<g class="v2-reading-block" data-block="sun-food" transform="translate(0 1110)"><text class="se-copy" x="89" y="24"><tspan x="89">The Sun supplies much of the energy driving processes at Earth’s surface. Green</tspan><tspan x="89" dy="32">plants use light energy to make food by photosynthesis. When a cow eats grass, it</tspan><tspan x="89" dy="32">obtains stored chemical energy from that food. This is different from sunlight</tspan><tspan x="89" dy="32">warming the cow’s body.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
