<section class="page page--food page--science-editorial page--science-v2 page--g6-ch11" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Nature’s Treasures, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Nature’s Treasures</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="assessment-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Let Us Enhance Our Learning</tspan></text></g>
<g class="v2-reading-block" data-block="assessment-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Answer in your notebook, giving reasons.</tspan></text></g>
<g class="v2-reading-block" data-block="q1" transform="translate(0 218)"><text class="se-copy" x="111" y="24" text-anchor="end">1.</text><text class="se-copy" x="132" y="24"><tspan x="132">Unscramble these resource names: ocrk, refost, ndiw, atwre. Classify each as</tspan><tspan x="132" dy="32">renewable or non-renewable on human timescales. For each renewable</tspan><tspan x="132" dy="32">example, explain one reason why its usable supply still needs care.</tspan></text></g>
<g class="v2-reading-block" data-block="q2" transform="translate(0 344)"><text class="se-copy" x="111" y="24" text-anchor="end">2.</text><text class="se-copy" x="132" y="24"><tspan x="132">State whether each statement is true or false, and correct the false ones: (a)</tspan><tspan x="132" dy="32">Nature supplies resources used to meet human needs. (b) Machines are</tspan><tspan x="132" dy="32">natural resources. (c) Fossil natural gas is non-renewable. (d) Calling air</tspan><tspan x="132" dy="32">renewable means that clean air cannot be damaged by pollution.</tspan></text></g>
<g class="v2-reading-block" data-block="q3" transform="translate(0 502)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24"><tspan x="132">Choose and explain: (a) Which fuel is commonly used in a petrol-engine</tspan><tspan x="132" dy="32">scooter: kerosene, petrol, diesel or LPG? (b) Which is renewed through a</tspan><tspan x="132" dy="32">natural cycle on human timescales: coal, water, fossil natural gas or petrol?</tspan><tspan x="132" dy="32">Explain why your second answer does not mean an unlimited local supply.</tspan></text></g>
<g class="v2-reading-block" data-block="q4" transform="translate(0 660)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24"><tspan x="132">Make a two-column table headed Renewable and Non-renewable. Place coal,</tspan><tspan x="132" dy="32">fossil natural gas, forests and mineral deposits in it. Add a note explaining</tspan><tspan x="132" dy="32">the condition under which forests can regenerate.</tspan></text></g><g transform="translate(0 786)"><g data-page-illustration="figures/class-6/science/ch11/rocks.png"><image class="science-illustration" href="../../figures/class-6/science/ch11/rocks.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Samples of rocks.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Samples of rocks.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
