ta-extra-space="3.94241" data-space-ratio="1.705">Dry<tspan dx="3.94241"> air</tspan><tspan dx="3.94241"> is</tspan><tspan dx="3.94241"> about</tspan><tspan dx="3.94241"> 78%</tspan><tspan dx="3.94241"> nitrogen</tspan><tspan dx="3.94241"> and</tspan><tspan dx="3.94241"> 21%</tspan><tspan dx="3.94241"> oxygen</tspan><tspan dx="3.94241"> by</tspan><tspan dx="3.94241"> volume.</tspan><tspan dx="3.94241"> Ordinary</tspan><tspan dx="3.94241"> air</tspan><tspan dx="3.94241"> also</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">contains a variable amount of water vapour.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.15068" data-space-ratio="1.206">Moving<tspan dx="1.15068"> air</tspan><tspan dx="1.15068"> can</tspan><tspan dx="1.15068"> turn</tspan><tspan dx="1.15068"> blades,</tspan><tspan dx="1.15068"> operate</tspan><tspan dx="1.15068"> pumps</tspan><tspan dx="1.15068"> or</tspan><tspan dx="1.15068"> drive</tspan><tspan dx="1.15068"> generators.</tspan><tspan dx="1.15068"> Available</tspan><tspan dx="1.15068"> wind</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">energy changes with conditions.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.51957" data-space-ratio="1.272">Most<tspan dx="1.51957"> Earth</tspan><tspan dx="1.51957"> water</tspan><tspan dx="1.51957"> is</tspan><tspan dx="1.51957"> salty.</tspan><tspan dx="1.51957"> Fresh</tspan><tspan dx="1.51957"> water</tspan><tspan dx="1.51957"> may</tspan><tspan dx="1.51957"> be</tspan><tspan dx="1.51957"> inaccessible</tspan><tspan dx="1.51957"> or</tspan><tspan dx="1.51957"> unsafe;</tspan><tspan dx="1.51957"> reducing</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">waste and pollution protects usable supplies.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="0.74973" data-space-ratio="1.134">Rainwater<tspan dx="0.74973"> harvesting</tspan><tspan dx="0.74973"> can</tspan><tspan dx="0.74973"> store</tspan><tspan dx="0.74973"> water</tspan><tspan dx="0.74973"> or</tspan><tspan dx="0.74973"> support</tspan><tspan dx="0.74973"> suitable</tspan><tspan dx="0.74973"> recharge.</tspan><tspan dx="0.74973"> Storage</tspan><tspan dx="0.74973"> and</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">water quality need adult management.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="11.45086" data-space-ratio="3.048">Sunlight<tspan dx="11.45086"> provides</tspan><tspan dx="11.45086"> energy</tspan><tspan dx="11.45086"> for</tspan><tspan dx="11.45086"> photosynthesis,</tspan><tspan dx="11.45086"> heating</tspan><tspan dx="11.45086"> and</tspan><tspan dx="11.45086"> solar</tspan><tspan dx="11.45086"> devices.</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">Photovoltaic panels produce electricity.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="2.52602" data-space-ratio="1.452">Forests<tspan dx="2.52602"> supply</tspan><tspan dx="2.52602"> habitats</tspan><tspan dx="2.52602"> and</tspan><tspan dx="2.52602"> materials</tspan><tspan dx="2.52602"> and</tspan><tspan dx="2.52602"> help</tspan><tspan dx="2.52602"> protect</tspan><tspan dx="2.52602"> soil.</tspan><tspan dx="2.52602"> Restoring</tspan><tspan dx="2.52602"> a</tspan><tspan dx="2.52602"> forest</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">involves more than planting trees.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="3.75636" data-space-ratio="1.672">Soil<tspan dx="3.75636"> develops</tspan><tspan dx="3.75636"> through</tspan><tspan dx="3.75636"> slow</tspan><tspan dx="3.75636"> interacting</tspan><tspan dx="3.75636"> processes.</tspan><tspan dx="3.75636"> Rocks</tspan><tspan dx="3.75636"> and</tspan><tspan dx="3.75636"> minerals</tspan><tspan dx="3.75636"> supply</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">materials that should be used carefully.</tspan></text><text class="se-copy" x="89" y="796" text-anchor="start">•</text><text class="se-copy" x="112" y="796" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="3.81518" data-space-ratio="1.682">Coal,<tspan dx="3.81518"> petroleum</tspan><tspan dx="3.81518"> and</tspan><tspan dx="3.81518"> natural</tspan><tspan dx="3.81518"> gas</tspan><tspan dx="3.81518"> are</tspan><tspan dx="3.81518"> non-renewable</tspan><tspan dx="3.81518"> fuels.</tspan><tspan dx="3.81518"> Their</tspan><tspan dx="3.81518"> formation</tspan><tspan dx="3.81518"> is</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">far slower than our use of them.</tspan></text><text class="se-copy" x="89" y="870" text-anchor="start">•</text><text class="se-copy" x="112" y="870" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="6.43666" data-space-ratio="2.151">Renewable<tspan dx="6.43666"> does</tspan><tspan dx="6.43666"> not</tspan><tspan dx="6.43666"> mean</tspan><tspan dx="6.43666"> unlimited.</tspan><tspan dx="6.43666"> Trace</tspan><tspan dx="6.43666"> a</tspan><tspan dx="6.43666"> resource,</tspan><tspan dx="6.43666"> propose</tspan><tspan dx="6.43666"> a</tspan><tspan dx="6.43666"> realistic</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">action and check whether it reduces waste.</tspan></text><image class="science-illustration" data-photo="review-summary" href="../../figures/class-6/science/review/garden-care.png" x="316" y="955" width="420" height="280" preserveAspectRatio="xMidYMid meet"/><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
