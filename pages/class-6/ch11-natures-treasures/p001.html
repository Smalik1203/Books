nchor="start">Nature’s</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">Treasures</text><image class="science-illustration chapter-opener__image" href="../../figures/class-6/science/ch11/opener.png" x="89" y="336" width="874" height="485.55555555555554" preserveAspectRatio="xMidYMid meet"><title>Bhoomi, Surya and Ajji observing plants and a stream at the forest edge</title></image></g><text class="se-copy v2-intro" x="89" y="884"><tspan x="89">A stream, a handful of soil, a breath of air: how many treasures do we</tspan><tspan x="89" dy="34">use without buying them?</tspan></text><text class="se-copy" x="89" y="970"><tspan x="89">Bhoomi and Surya are visiting Ajji, their grandmother, near the forests of the</tspan><tspan x="89" dy="32">Western Ghats. They notice birds among the trees, water flowing over rocks and</tspan><tspan x="89" dy="32">leaves moving in the breeze. Ajji invites them to look for the connections among</tspan><tspan x="89" dy="32">these things.</tspan></text><text class="se-copy" x="89" y="1114"><tspan x="89">Their breakfast, the house around them and the energy used for cooking all</tspan><tspan x="89" dy="32">depend on materials or energy from nature. Some resources are replenished by</tspan><tspan x="89" dy="32">natural processes. Others form so slowly that using them reduces a stock we</tspan><tspan x="89" dy="32">cannot quickly replace.</tspan></text><text class="se-copy" x="89" y="1258"><tspan x="89">Follow the children’s questions from the forest to the classroom. Observe what</tspan><tspan x="89" dy="32">people use, trace where it comes from, and look for ways to reduce waste while</tspan><tspan x="89" dy="32">meeting everyone’s needs.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
