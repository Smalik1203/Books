<section class="page page--food page--science-editorial page--science-v2 page--g6-ch11" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Nature’s Treasures, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Nature’s Treasures</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204"><tspan x="112">Natural resources include air, water, sunlight, forests, soil, rocks and minerals.</tspan><tspan x="112" dy="32">Manufactured objects depend on them too.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278"><tspan x="112">Dry air is about 78% nitrogen and 21% oxygen by volume. Ordinary air also</tspan><tspan x="112" dy="32">contains a variable amount of water vapour.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352"><tspan x="112">Moving air can turn blades, operate pumps or drive generators. Available wind</tspan><tspan x="112" dy="32">energy changes with conditions.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426"><tspan x="112">Most Earth water is salty. Fresh water may be inaccessible or unsafe; reducing</tspan><tspan x="112" dy="32">waste and pollution protects usable supplies.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500"><tspan x="112">Rainwater harvesting can store water or support suitable recharge. Storage and</tspan><tspan x="112" dy="32">water quality need adult management.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574"><tspan x="112">Sunlight provides energy for photosynthesis, heating and solar devices.</tspan><tspan x="112" dy="32">Photovoltaic panels produce electricity.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648"><tspan x="112">Forests supply habitats and materials and help protect soil. Restoring a forest</tspan><tspan x="112" dy="32">involves more than planting trees.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722"><tspan x="112">Soil develops through slow interacting processes. Rocks and minerals supply</tspan><tspan x="112" dy="32">materials that should be used carefully.</tspan></text><text class="se-copy" x="89" y="796" text-anchor="start">•</text><text class="se-copy" x="112" y="796"><tspan x="112">Coal, petroleum and natural gas are non-renewable fuels. Their formation is</tspan><tspan x="112" dy="32">far slower than our use of them.</tspan></text><text class="se-copy" x="89" y="870" text-anchor="start">•</text><text class="se-copy" x="112" y="870"><tspan x="112">Renewable does not mean unlimited. Trace a resource, propose a realistic</tspan><tspan x="112" dy="32">action and check whether it reduces waste.</tspan></text><image class="science-illustration" data-photo="forest" href="../../figures/class-6/science/ch11/forest.png" x="405.6330275229358" y="945" width="240.73394495412845" height="220" preserveAspectRatio="xMidYMid meet"/><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
