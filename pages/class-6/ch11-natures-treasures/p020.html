<section class="page page--food page--science-editorial page--science-v2 page--g6-ch11" data-folio="20" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Nature’s Treasures, page 20"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Nature’s Treasures</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Explore Further</tspan></text></g>
<g class="v2-reading-block" data-block="project-water" transform="translate(0 170)"><text class="se-heading" x="89" y="30"><tspan x="89">1. Learn from local water systems</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Find out about a traditional rainwater-harvesting system in your state or</tspan><tspan x="89" dy="32">elsewhere in India. Use a reliable source or an adult-led conversation with</tspan><tspan x="89" dy="32">someone who knows the system. Draw its water route, name its intended uses</tspan><tspan x="89" dy="32">and describe maintenance. Separate what you observed from what you were told.</tspan><tspan x="89" dy="32">Do not enter wells or tanks, or climb onto roofs.</tspan></text></g>
<g class="v2-reading-block" data-block="project-air" transform="translate(0 406)"><text class="se-heading" x="89" y="30"><tspan x="89">2. Investigate an air-quality concern</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">With permission, talk to older people about changes they have noticed in local</tspan><tspan x="89" dy="32">air and possible sources of pollution. Record observations respectfully, without</tspan><tspan x="89" dy="32">names or private medical details. Compare the accounts with reliable public</tspan><tspan x="89" dy="32">information on air pollution. An interview alone cannot prove what caused an</tspan><tspan x="89" dy="32">illness. Suggest two practical actions and explain which source each addresses.</tspan></text></g>
<g class="v2-reading-block" data-block="project-rocks" transform="translate(0 642)"><text class="se-heading" x="89" y="30"><tspan x="89">3. Trace materials in your surroundings</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Look for uses of rock or mineral-derived materials in buildings, utensils and</tspan><tspan x="89" dy="32">other familiar objects. Make a table of object, material, useful property and</tspan><tspan x="89" dy="32">source of your identification. Ask a knowledgeable adult to check uncertain</tspan><tspan x="89" dy="32">names. Use photographs, drawings or supplied specimens; do not enter quarries,</tspan><tspan x="89" dy="32">damage structures or take samples from protected places.</tspan></text></g>
<g class="v2-reading-block" data-block="project-club" transform="translate(0 878)"><text class="se-heading" x="89" y="30"><tspan x="89">4. Turn a planting day into a care plan</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">With a teacher or eco-club, choose a suitable planting or plant-care project.</tspan><tspan x="89" dy="32">Obtain permission and local advice on species and habitat. Record plant names,</tspan><tspan x="89" dy="32">why they suit the site, who will water them and how they will be protected.</tspan><tspan x="89" dy="32">Prepare a one-page report, then revisit at agreed intervals to record survival and</tspan><tspan x="89" dy="32">growth. Discuss what needs changing if plants do not thrive.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">20</text></g></svg></div></div></section>
