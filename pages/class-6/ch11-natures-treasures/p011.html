<section class="page page--food page--science-editorial page--science-v2 page--g6-ch11" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Nature’s Treasures, page 11"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Nature’s Treasures</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="minerals" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Rocks contain minerals. A <tspan class="se-bold">mineral</tspan> is a naturally occurring solid with a</tspan><tspan x="89" dy="32">characteristic composition and structure. Some minerals contain metals that can</tspan><tspan x="89" dy="32">be extracted; an ore is material worth processing to obtain a useful substance. A</tspan><tspan x="89" dy="32">metal spoon has therefore passed through several human processes after its raw</tspan><tspan x="89" dy="32">material was obtained from Earth.</tspan></text></g>
<g class="v2-reading-block" data-block="rock-time" transform="translate(0 288)"><text class="se-copy" x="89" y="24"><tspan x="89">Early tools used suitably shaped stone; modern objects still depend on rocks and</tspan><tspan x="89" dy="32">minerals. Their extraction changes land and uses energy. Not every rock takes</tspan><tspan x="89" dy="32">millions of years to form, but useful mineral deposits are not replenished on the</tspan><tspan x="89" dy="32">timescale on which we mine them. Repair, reuse and recycling reduce the need</tspan><tspan x="89" dy="32">for new extraction.</tspan></text></g>
<g class="v2-reading-block" data-block="fuel-heading" transform="translate(0 476)"><text class="v2-title" x="89" y="38"><tspan x="89">11.6 Fuels from the Distant Past</tspan></text></g>
<g class="v2-reading-block" data-block="transport-task" transform="translate(0 534)"><rect class="se-activity-panel" x="89" y="0" width="874" height="478" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">With an adult, list familiar forms of transport. Observe only from a safe</tspan><tspan x="146" dy="32">place away from moving vehicles. Do not approach fuel tanks or filling</tspan><tspan x="146" dy="32">equipment.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Make a table with columns for vehicle, fuel or energy source, and how</tspan><tspan x="146" dy="32">you checked. Ask a known adult or use reliable vehicle information;</tspan><tspan x="146" dy="32">appearance alone may not identify the fuel.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Include a bicycle or walking journey and an electric vehicle if these are</tspan><tspan x="146" dy="32">familiar. Record “not known” when you cannot verify an answer.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">4.</text><text class="se-copy" x="146" y="384"><tspan x="146">Group the verified examples. Which rely on fuels made from petroleum?</tspan><tspan x="146" dy="32">Which use electricity? What must you find out to trace the source of that</tspan><tspan x="146" dy="32">electricity?</tspan></text></g>
<g class="v2-reading-block" data-block="fossil-origin" transform="translate(0 1034)"><text class="se-copy" x="89" y="24"><tspan x="89">Petrol and diesel are made by refining <tspan class="se-bold">petroleum</tspan>, also called crude oil. Coal,</tspan><tspan x="89" dy="32">petroleum and natural gas are <tspan class="se-bold">fossil</tspan> <tspan class="se-bold">fuels</tspan>. They formed from ancient organic</tspan><tspan x="89" dy="32">matter that was buried and transformed over geological time. Coal formed</tspan><tspan x="89" dy="32">mainly from ancient plant material; much petroleum formed from tiny</tspan><tspan x="89" dy="32">organisms living in ancient seas.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">11</text></g></svg></div></div></section>
