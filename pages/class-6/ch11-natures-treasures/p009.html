<section class="page page--food page--science-editorial page--science-v2 page--g6-ch11" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Nature’s Treasures, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Nature’s Treasures</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="soil-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">11.5 Soil, Rocks and Minerals</tspan></text></g>
<g class="v2-reading-block" data-block="soil-start" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Bhoomi notices that soil beside the stream looks different from soil near the</tspan><tspan x="89" dy="32">path. Soil contains mineral particles, organic material, living organisms, air and</tspan><tspan x="89" dy="32">water. Roots and many small organisms use spaces in it. Can colour and texture</tspan><tspan x="89" dy="32">help us describe samples without telling us everything about them?</tspan></text></g>
<g class="v2-reading-block" data-block="soil-task" transform="translate(0 314)"><rect class="se-activity-panel" x="89" y="0" width="874" height="754" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Let your teacher provide small soil samples from approved, safe places.</tspan><tspan x="146" dy="32">Avoid roadside, waste-dump or industrial soil. Use a spoon and do not</tspan><tspan x="146" dy="32">taste or deliberately smell the samples.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Before looking closely, predict how the samples may differ. Examine each</tspan><tspan x="146" dy="32">without a lens, then with a magnifying glass. Keep the lens away from</tspan><tspan x="146" dy="32">direct sunlight.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Record four headings in your notebook: sample location, prediction,</tspan><tspan x="146" dy="32">observation without lens, observation with lens. Describe colour, visible</tspan><tspan x="146" dy="32">pieces and clumps without assuming what each is.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Compare the samples and revise your predictions. Leave organisms in</tspan><tspan x="146" dy="32">their habitat, return samples only as the teacher directs, and wash your</tspan><tspan x="146" dy="32">hands afterwards.</tspan></text><image class="science-illustration" data-photo="soil" href="../../figures/class-6/science/ch11/soil.png" x="379.75" y="500" width="292.5" height="195" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="725.88"><tspan x="113">Fig. 11.6 · Small samples and a lens help compare visible features.</tspan></text></g>
<g class="v2-reading-block" data-block="soil-evidence" transform="translate(0 1090)"><text class="se-copy" x="89" y="24"><tspan x="89">A lens may reveal grains or plant fragments that were hard to see before. A</tspan><tspan x="89" dy="32">darker sample is not automatically more fertile, and a dry surface does not show</tspan><tspan x="89" dy="32">all the water deeper down. Further tests would be needed to compare water</tspan><tspan x="89" dy="32">retention or how well a plant grows in each soil.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
