<section class="page page--food page--science-editorial page--science-v2 page--g6-ch11" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Nature’s Treasures, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Nature’s Treasures</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="daily-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">11.8 Trace a Resource, Reduce Waste</tspan></text></g>
<g class="v2-reading-block" data-block="daily-task" transform="translate(0 170)"><rect class="se-activity-panel" x="89" y="0" width="874" height="478" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">List these activities in your notebook: washing clothes, making clay toys,</tspan><tspan x="146" dy="32">collecting firewood, flying a kite and preparing breakfast. Treat firewood</tspan><tspan x="146" dy="32">collection as a discussion, not a task to carry out.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">For each, name a resource used directly. Then trace one less obvious</tspan><tspan x="146" dy="32">resource: for example, making a kite needs paper, and making paper</tspan><tspan x="146" dy="32">requires raw material, water and energy.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Choose one activity and suggest a change that avoids waste without</tspan><tspan x="146" dy="32">reducing essential needs. Explain who would need to agree or help.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">4.</text><text class="se-copy" x="146" y="384"><tspan x="146">Decide what evidence would show improvement. Record a starting</tspan><tspan x="146" dy="32">observation, try the agreed change, and compare again under similar</tspan><tspan x="146" dy="32">conditions.</tspan></text></g>
<g class="v2-reading-block" data-block="daily-evidence" transform="translate(0 670)"><text class="se-copy" x="89" y="24"><tspan x="89">A useful plan links an action to a result that can be checked. “Save nature” is too</tspan><tspan x="89" dy="32">broad to measure by itself. “Report the leaking tap, have an adult repair it, and</tspan><tspan x="89" dy="32">check whether it still drips” names a problem, an action and evidence. Looking</tspan><tspan x="89" dy="32">clean or smelling fresh alone cannot establish that air or water is safe.</tspan></text></g>
<g class="v2-reading-block" data-block="shared" transform="translate(0 814)"><text class="se-copy" x="89" y="24"><tspan x="89">Ajji’s treasures connect. Trees depend on soil, water and air; people depend on</tspan><tspan x="89" dy="32">those resources too. Responsible use means meeting needs, reducing avoidable</tspan><tspan x="89" dy="32">waste and considering effects on others. Before choosing an action, ask: what</tspan><tspan x="89" dy="32">resource is involved, how is it replenished, and what evidence will show that our</tspan><tspan x="89" dy="32">action helped?</tspan></text></g><g transform="translate(0 990)"><g data-page-illustration="figures/class-6/science/ch11/pinwheel.png"><image class="science-illustration" href="../../figures/class-6/science/ch11/pinwheel.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>A pinwheel.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">A pinwheel.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">15</text></g></svg></div></div></section>
