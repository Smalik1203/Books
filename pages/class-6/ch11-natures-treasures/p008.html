<section class="page page--food page--science-editorial page--science-v2 page--g6-ch11" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Nature’s Treasures, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Nature’s Treasures</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="forest-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">11.4 Forests Are Living Systems</tspan></text></g>
<g class="v2-reading-block" data-block="forest-start" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Near Ajji’s home, the children find an amla tree, called nellikai locally. Its fruit</tspan><tspan x="89" dy="32">can feed animals as well as people. They leave fallen fruit where it is and collect</tspan><tspan x="89" dy="32">nothing without permission. Looking closely can reveal birds, insects, fungi and</tspan><tspan x="89" dy="32">small plants as well as tall trees.</tspan></text></g>
<g class="v2-reading-block" data-block="forest-art" transform="translate(0 314)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">forest</tspan> includes many interacting living</tspan><tspan x="89" dy="32">things and their physical surroundings. It</tspan><tspan x="89" dy="32">supplies habitats, food and materials such as</tspan><tspan x="89" dy="32">timber, fibres, fruits and other plant products.</tspan><tspan x="89" dy="32">Name five forest products and identify the</tspan><tspan x="89" dy="32">plant or material from which each comes.</tspan></text><text class="se-copy" x="89" y="232"><tspan x="89">Roots help hold soil. Leaf litter slows some</tspan><tspan x="89" dy="32">surface runoff and shelters organisms.</tspan><tspan x="89" dy="32">Decomposers break down dead material,</tspan><tspan x="89" dy="32">returning nutrients to the environment.</tspan><tspan x="89" dy="32">Nutrients are reused; energy flows through</tspan><tspan x="89" dy="32">the system.</tspan></text><image class="science-illustration" data-photo="forest" href="../../figures/class-6/science/ch11/forest.png" x="613" y="32.57240853658536" width="350" height="319.8551829268293" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="448.88"><tspan x="89">Fig. 11.5 · Roots, litter, fungi and animals are parts of the forest system.</tspan></text></g>
<g class="v2-reading-block" data-block="forest-loss" transform="translate(0 791)"><text class="se-copy" x="89" y="24"><tspan x="89">Clearing a forest removes more than a collection of trunks. It can disrupt</tspan><tspan x="89" dy="32">habitats, expose soil and affect water movement. A planted row of trees does not</tspan><tspan x="89" dy="32">immediately replace an established forest with its many species and</tspan><tspan x="89" dy="32">relationships. Recovery may take a long time and depends on local conditions.</tspan></text></g>
<g class="v2-reading-block" data-block="forest-care" transform="translate(0 935)"><text class="se-copy" x="89" y="24"><tspan x="89">People have worked together to protect forests. In the Chipko movement of the</tspan><tspan x="89" dy="32">1970s in the Himalayan region, villagers, including many women, resisted tree</tspan><tspan x="89" dy="32">felling. Forest care can also include preventing damage, supporting regeneration</tspan><tspan x="89" dy="32">and using wood carefully. Planting must suit the local habitat; every open area is</tspan><tspan x="89" dy="32">not a place that needs trees.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
