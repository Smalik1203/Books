<g class="v2-reading-block" data-block="forest-start" transform="translate(0 170)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.09058" data-space-ratio="1.553">Near<tspan dx="3.09058"> Ajji’s</tspan><tspan dx="3.09058"> home,</tspan><tspan dx="3.09058"> the</tspan><tspan dx="3.09058"> children</tspan><tspan dx="3.09058"> find</tspan><tspan dx="3.09058"> an</tspan><tspan dx="3.09058"> amla</tspan><tspan dx="3.09058"> tree,</tspan><tspan dx="3.09058"> called</tspan><tspan dx="3.09058"> nellikai</tspan><tspan dx="3.09058"> locally.</tspan><tspan dx="3.09058"> Its</tspan><tspan dx="3.09058"> fruit</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.59240" data-space-ratio="1.285">can<tspan dx="1.59240"> feed</tspan><tspan dx="1.59240"> animals</tspan><tspan dx="1.59240"> as</tspan><tspan dx="1.59240"> well</tspan><tspan dx="1.59240"> as</tspan><tspan dx="1.59240"> people.</tspan><tspan dx="1.59240"> They</tspan><tspan dx="1.59240"> leave</tspan><tspan dx="1.59240"> fallen</tspan><tspan dx="1.59240"> fruit</tspan><tspan dx="1.59240"> where</tspan><tspan dx="1.59240"> it</tspan><tspan dx="1.59240"> is</tspan><tspan dx="1.59240"> and</tspan><tspan dx="1.59240"> collect</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.91988" data-space-ratio="1.343">nothing<tspan dx="1.91988"> without</tspan><tspan dx="1.91988"> permission.</tspan><tspan dx="1.91988"> Looking</tspan><tspan dx="1.91988"> closely</tspan><tspan dx="1.91988"> can</tspan><tspan dx="1.91988"> reveal</tspan><tspan dx="1.91988"> birds,</tspan><tspan dx="1.91988"> insects,</tspan><tspan dx="1.91988"> fungi</tspan><tspan dx="1.91988"> and</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">small plants as well as tall trees.</tspan></text></g>
<g class="v2-reading-block" data-block="forest-art" transform="translate(0 314)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">A <tspan class="se-bold">forest</tspan> includes many interacting living</tspan><tspan x="89" dy="32" data-narrow-prose="true">things and their physical surroundings. It</tspan><tspan x="89" dy="32" data-narrow-prose="true">supplies habitats, food and materials such as</tspan><tspan x="89" dy="32" data-narrow-prose="true">timber, fibres, fruits and other plant products.</tspan><tspan x="89" dy="32" data-narrow-prose="true">Name five forest products and identify the</tspan><tspan x="89" dy="32" data-paragraph-end="true">plant or material from which each comes.</tspan></text><text class="se-copy" x="89" y="232" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">Roots help hold soil. Leaf litter slows some</tspan><tspan x="89" dy="32" data-narrow-prose="true">surface runoff and shelters organisms.</tspan><tspan x="89" dy="32" data-narrow-prose="true">Decomposers break down dead material,</tspan><tspan x="89" dy="32" data-narrow-prose="true">returning nutrients to the environment.</tspan><tspan x="89" dy="32" data-narrow-prose="true">Nutrients are reused; energy flows through</tspan><tspan x="89" dy="32" data-paragraph-end="true">the system.</tspan></text><image class="science-illustration" data-photo="forest" href="../../figures/class-6/science/ch11/forest.png" x="613" y="32.57240853658536" width="350" height="319.8551829268293" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="448.88"><tspan x="89">Fig. 11.5 · Roots, litter, fungi and animals are parts of the forest system.</tspan></text></g>
<g class="v2-reading-block" data-block="forest-loss" transform="translate(0 791)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="8.08173" data-space-ratio="2.445">Clearing<tspan dx="8.08173"> a</tspan><tspan dx="8.08173"> forest</tspan><tspan dx="8.08173"> removes</tspan><tspan dx="8.08173"> more</tspan><tspan dx="8.08173"> than</tspan><tspan dx="8.08173"> a</tspan><tspan dx="8.08173"> collection</tspan><tspan dx="8.08173"> of</tspan><tspan dx="8.08173"> trunks.</tspan><tspan dx="8.08173"> It</tspan><tspan dx="8.08173"> can</tspan><tspan dx="8.08173"> disrupt</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.27240" data-space-ratio="1.228">habitats,<tspan dx="1.27240"> expose</tspan><tspan dx="1.27240"> soil</tspan><tspan dx="1.27240"> and</tspan><tspan dx="1.27240"> affect</tspan><tspan dx="1.27240"> water</tspan><tspan dx="1.27240"> movement.</tspan><tspan dx="1.27240"> A</tspan><tspan dx="1.27240"> planted</tspan><tspan dx="1.27240"> row</tspan><tspan dx="1.27240"> of</tspan><tspan dx="1.27240"> trees</tspan><tspan dx="1.27240"> does</tspan><tspan dx="1.27240"> not</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="16.54588" data-space-ratio="3.959">immediately<tspan dx="16.54588"> replace</tspan><tspan dx="16.54588"> an</tspan><tspan dx="16.54588"> established</tspan><tspan dx="16.54588"> forest</tspan><tspan dx="16.54588"> with</tspan><tspan dx="16.54588"> its</tspan><tspan dx="16.54588"> many</tspan><tspan dx="16.54588"> species</tspan><tspan dx="16.54588"> and</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">relationships. Recovery may take a long time and depends on local conditions.</tspan></text></g>
<g class="v2-reading-block" data-block="forest-care" transform="translate(0 935)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.87923" data-space-ratio="1.515">People<tspan dx="2.87923"> have</tspan><tspan dx="2.87923"> worked</tspan><tspan dx="2.87923"> together</tspan><tspan dx="2.87923"> to</tspan><tspan dx="2.87923"> protect</tspan><tspan dx="2.87923"> forests.</tspan><tspan dx="2.87923"> In</tspan><tspan dx="2.87923"> the</tspan><tspan dx="2.87923"> Chipko</tspan><tspan dx="2.87923"> movement</tspan><tspan dx="2.87923"> of</tspan><tspan dx="2.87923"> the</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.89459" data-space-ratio="1.696">1970s<tspan dx="3.89459"> in</tspan><tspan dx="3.89459"> the</tspan><tspan dx="3.89459"> Himalayan</tspan><tspan dx="3.89459"> region,</tspan><tspan dx="3.89459"> villagers,</tspan><tspan dx="3.89459"> including</tspan><tspan dx="3.89459"> many</tspan><tspan dx="3.89459"> women,</tspan><tspan dx="3.89459"> resisted</tspan><tspan dx="3.89459"> tree</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.38421" data-space-ratio="1.248">felling.<tspan dx="1.38421"> Forest</tspan><tspan dx="1.38421"> care</tspan><tspan dx="1.38421"> can</tspan><tspan dx="1.38421"> also</tspan><tspan dx="1.38421"> include</tspan><tspan dx="1.38421"> preventing</tspan><tspan dx="1.38421"> damage,</tspan><tspan dx="1.38421"> supporting</tspan><tspan dx="1.38421"> regeneration</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.41160" data-space-ratio="1.252">and<tspan dx="1.41160"> using</tspan><tspan dx="1.41160"> wood</tspan><tspan dx="1.41160"> carefully.</tspan><tspan dx="1.41160"> Planting</tspan><tspan dx="1.41160"> must</tspan><tspan dx="1.41160"> suit</tspan><tspan dx="1.
