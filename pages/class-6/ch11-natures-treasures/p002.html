<g class="v2-reading-block" data-block="resources" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Materials and sources of energy obtained from nature are <tspan class="se-bold">natural</tspan> <tspan class="se-bold">resources</tspan>. Air,</tspan><tspan x="89" dy="32">water, sunlight, forests, soil, rocks and minerals are examples. A notebook is</tspan><tspan x="89" dy="32">manufactured, but its paper, ink and the energy used to make it depend on</tspan><tspan x="89" dy="32">natural resources.</tspan></text></g>
<g class="v2-reading-block" data-block="breathing-task" transform="translate(0 314)"><rect class="se-activity-panel" x="89" y="0" width="874" height="370" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Sit comfortably and breathe normally. Without changing your breathing,</tspan><tspan x="146" dy="32">notice the gentle movement of your chest or abdomen as air enters and</tspan><tspan x="146" dy="32">leaves.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Watch leaves or a light paper strip move in a breeze. What observations</tspan><tspan x="146" dy="32">suggest that air is present even when you cannot see it?</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Record what you observed and what you inferred. Do not hold your</tspan><tspan x="146" dy="32">breath, breathe rapidly or compete to change your breathing. Share</tspan><tspan x="146" dy="32">observations without comparing classmates’ bodies.</tspan></text></g>
<g class="v2-reading-block" data-block="air-mixture" transform="translate(0 706)"><text class="se-copy" x="89" y="24"><tspan x="89">Air is a <tspan class="se-bold">mixture</tspan> <tspan class="se-bold">of</tspan> <tspan class="se-bold">gases</tspan>. Our bodies use oxygen from air to release energy from</tspan><tspan x="89" dy="32">food. Many other living organisms also depend on oxygen. Nitrogen is the largest</tspan><tspan x="89" dy="32">part of dry air; oxygen is the next largest. Small amounts of other gases are</tspan><tspan x="89" dy="32">present too.</tspan></text></g>
