<section class="page page--food page--science-editorial page--science-v2 page--g6-ch11" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Nature’s Treasures, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Nature’s Treasures</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="renew-explain" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">renewable</tspan> <tspan class="se-bold">resource</tspan> can be replenished by natural processes on a useful</tspan><tspan x="89" dy="32">human timescale, provided its use and condition allow this. A <tspan class="se-bold">non-renewable</tspan></tspan><tspan x="89" dy="32"><tspan class="se-bold">resource</tspan> is not replaced on that timescale. Neither label tells us that extraction</tspan><tspan x="89" dy="32">or use has no costs. Recycling a metal conserves a stock; it does not make its</tspan><tspan x="89" dy="32">mineral deposit renewable.</tspan></text></g>
<g class="v2-reading-block" data-block="renew-think" transform="translate(0 288)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="218" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A town pumps underground water faster than local rain can replace it.</tspan><tspan x="113" dy="32">Someone says, “Water is renewable, so the supply cannot run out.” Use the</tspan><tspan x="113" dy="32">water cycle and the idea of a local supply to explain what is missing from this</tspan><tspan x="113" dy="32">claim.</tspan></text></g><g transform="translate(0 528)"><g data-page-illustration="figures/class-6/science/ch11/rain.png"><image class="science-illustration" href="../../figures/class-6/science/ch11/rain.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Collecting rainwater.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Collecting rainwater.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
