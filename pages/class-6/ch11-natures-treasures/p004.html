<section class="page page--food page--science-editorial page--science-v2 page--g6-ch11" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Nature’s Treasures, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Nature’s Treasures</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="wind-farms" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Groups of wind turbines form wind farms. India has wind farms in several states,</tspan><tspan x="89" dy="32">including Tamil Nadu, Rajasthan and Maharashtra. Their output changes with</tspan><tspan x="89" dy="32">wind conditions. A good site needs suitable winds as well as careful attention to</tspan><tspan x="89" dy="32">people, wildlife and the land.</tspan></text></g>
<g class="v2-reading-block" data-block="water-heading" transform="translate(0 268)"><text class="v2-title" x="89" y="38"><tspan x="89">11.2 Water: Available and Usable</tspan></text></g>
<g class="v2-reading-block" data-block="water-uses" transform="translate(0 326)"><text class="se-copy" x="89" y="24"><tspan x="89">Think of drinking, preparing food, washing, growing crops and making goods.</tspan><tspan x="89" dy="32">Each use depends on water. About 71% of Earth’s surface is covered by water, but</tspan><tspan x="89" dy="32">most of this is salty ocean water. A large surface area of water does not mean a</tspan><tspan x="89" dy="32">large supply of fresh water ready to use.</tspan></text></g>
<g class="v2-reading-block" data-block="freshwater" transform="translate(0 470)"><text class="se-copy" x="89" y="24"><tspan x="89">Fresh water occurs in ice, underground, and in rivers and lakes. Much of it is</tspan><tspan x="89" dy="32">frozen or difficult to reach. Supplies vary with rainfall, season and place.</tspan><tspan x="89" dy="32">Removing salts from seawater is possible, but it requires equipment and energy.</tspan><tspan x="89" dy="32">Water quality must suit the use: fresh water is not automatically safe to drink.</tspan></text></g>
<g class="v2-reading-block" data-block="water-task" transform="translate(0 614)"><rect class="se-activity-panel" x="89" y="0" width="874" height="478" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Observe water use at home or school with an adult’s permission. Use the</tspan><tspan x="146" dy="32">seven situations below as a checklist. Do not waste water deliberately to</tspan><tspan x="146" dy="32">make a measurement.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">In your notebook, record the activity, any avoidable loss you actually</tspan><tspan x="146" dy="32">observed, and a practical change. Write “no avoidable loss observed”</tspan><tspan x="146" dy="32">when that is your finding.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Choose one agreed change, such as closing a tap while brushing.</tspan><tspan x="146" dy="32">Compare observations before and after over similar periods. Keep</tspan><tspan x="146" dy="32">necessary drinking, cooking and handwashing.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Explain what your comparison can show. If the number of people or the</tspan><tspan x="146" dy="32">activity changed, record that too.</tspan></text></g><g transform="translate(0 1114)"><g data-page-illustration="figures/class-6/science/ch11/pinwheel.png"><image class="science-illustration" href="../../figures/class-6/science/ch11/pinwheel.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A pinwheel.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A pinwheel.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
