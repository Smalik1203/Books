<g class="v2-reading-block" data-block="water-uses" transform="translate(0 170)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.77033" data-space-ratio="1.674">Think<tspan dx="3.77033"> of</tspan><tspan dx="3.77033"> drinking,</tspan><tspan dx="3.77033"> preparing</tspan><tspan dx="3.77033"> food,</tspan><tspan dx="3.77033"> washing,</tspan><tspan dx="3.77033"> growing</tspan><tspan dx="3.77033"> crops</tspan><tspan dx="3.77033"> and</tspan><tspan dx="3.77033"> making</tspan><tspan dx="3.77033"> goods.</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.77354" data-space-ratio="1.138">Each<tspan dx="0.77354"> use</tspan><tspan dx="0.77354"> depends</tspan><tspan dx="0.77354"> on</tspan><tspan dx="0.77354"> water.</tspan><tspan dx="0.77354"> About</tspan><tspan dx="0.77354"> 71%</tspan><tspan dx="0.77354"> of</tspan><tspan dx="0.77354"> Earth’s</tspan><tspan dx="0.77354"> surface</tspan><tspan dx="0.77354"> is</tspan><tspan dx="0.77354"> covered</tspan><tspan dx="0.77354"> by</tspan><tspan dx="0.77354"> water,</tspan><tspan dx="0.77354"> but</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.42705" data-space-ratio="1.434">most<tspan dx="2.42705"> of</tspan><tspan dx="2.42705"> this</tspan><tspan dx="2.42705"> is</tspan><tspan dx="2.42705"> salty</tspan><tspan dx="2.42705"> ocean</tspan><tspan dx="2.42705"> water.</tspan><tspan dx="2.42705"> A</tspan><tspan dx="2.42705"> large</tspan><tspan dx="2.42705"> surface</tspan><tspan dx="2.42705"> area</tspan><tspan dx="2.42705"> of</tspan><tspan dx="2.42705"> water</tspan><tspan dx="2.42705"> does</tspan><tspan dx="2.42705"> not</tspan><tspan dx="2.42705"> mean</tspan><tspan dx="2.42705"> a</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">large supply of fresh water ready to use.</tspan></text></g>
<g class="v2-reading-block" data-block="freshwater" transform="translate(0 314)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.03925" data-space-ratio="1.722">Fresh<tspan dx="4.03925"> water</tspan><tspan dx="4.03925"> occurs</tspan><tspan dx="4.03925"> in</tspan><tspan dx="4.03925"> ice,</tspan><tspan dx="4.03925"> underground,</tspan><tspan dx="4.03925"> and</tspan><tspan dx="4.03925"> in</tspan><tspan dx="4.03925"> rivers</tspan><tspan dx="4.03925"> and</tspan><tspan dx="4.03925"> lakes.</tspan><tspan dx="4.03925"> Much</tspan><tspan dx="4.03925"> of</tspan><tspan dx="4.03925"> it</tspan><tspan dx="4.03925"> is</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="9.22641" data-space-ratio="2.650">frozen<tspan dx="9.22641"> or</tspan><tspan dx="9.22641"> difficult</tspan><tspan dx="9.22641"> to</tspan><tspan dx="9.22641"> reach.</tspan><tspan dx="9.22641"> Supplies</tspan><tspan dx="9.22641"> vary</tspan><tspan dx="9.22641"> with</tspan><tspan dx="9.22641"> rainfall,</tspan><tspan dx="9.22641"> season</tspan><tspan dx="9.22641"> and</tspan><tspan dx="9.22641"> place.</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.86282" data-space-ratio="1.333">Removing<tspan dx="1.86282"> salts</tspan><tspan dx="1.86282"> from</tspan><tspan dx="1.86282"> seawater</tspan><tspan dx="1.86282"> is</tspan><tspan dx="1.86282"> possible,</tspan><tspan dx="1.86282"> but</tspan><tspan dx="1.86282"> it</tspan><tspan dx="1.86282"> requires</tspan><tspan dx="1.86282"> equipment</tspan><tspan dx="1.86282"> and</tspan><tspan dx="1.86282"> energy.</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">Water quality must suit the use: fresh water is not automatically safe to drink.</tspan></text></g>
