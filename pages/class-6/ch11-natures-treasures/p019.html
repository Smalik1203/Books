<g class="v2-reading-block" data-block="q15" transform="translate(0 707)"><text class="se-copy" x="111" y="24" text-anchor="end">15.</text><text class="se-copy" x="132" y="24"><tspan x="132">Trees are cut to meet demands for housing and industry. Write a short report</tspan><tspan x="132" dy="32">considering these needs alongside habitat, soil and water protection. Discuss</tspan><tspan x="132" dy="32">reducing waste, reusing materials, appropriate alternatives and protecting</tspan><tspan x="132" dy="32">existing forests; explain your recommendations.</tspan></text></g>
<g class="v2-reading-block" data-block="q16" transform="translate(0 865)"><text class="se-copy" x="111" y="24" text-anchor="end">16.</text><text class="se-copy" x="132" y="24"><tspan x="132">Propose a school water-saving plan. Name the problem, people who can</tspan><tspan x="132" dy="32">help, steps to take and how you would compare water use before and after.</tspan><tspan x="132" dy="32">Explain how it could help the environment while preserving drinking water</tspan><tspan x="132" dy="32">and hygiene.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">19</text></g></svg></div></div></section>
