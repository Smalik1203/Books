<section class="page page--food page--science-editorial page--science-v2 page--g6-ch11" data-folio="19"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Nature’s Treasures, page 19"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M30 94Q46 56 61 8M42 65Q17 69 15 52Q33 46 42 65ZM48 47Q28 47 25 33Q42 29 48 47ZM54 30Q36 29 38 15Q52 15 54 30ZM44 60Q70 59 75 41Q54 39 44 60ZM51 43Q76 39 76 24Q56 23 51 43ZM57 25Q73 18 65 4Q55 11 57 25Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Nature’s Treasures</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q7" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">7.</text><text class="se-copy" x="132" y="24"><tspan x="132">List five daily activities that use natural resources. For each, name the</tspan><tspan x="132" dy="32">resource and suggest one way to reduce avoidable use or waste. Keep</tspan><tspan x="132" dy="32">essential needs such as drinking and hygiene.</tspan></text></g>
<g class="v2-reading-block" data-block="q8" transform="translate(0 238)"><text class="se-copy" x="111" y="24" text-anchor="end">8.</text><text class="se-copy" x="132" y="24"><tspan x="132">Describe four activities or processes that depend on air. Distinguish</tspan><tspan x="132" dy="32">examples needing moving air from examples depending on a gas within air.</tspan></text></g>
<g class="v2-reading-block" data-block="q9" transform="translate(0 332)"><text class="se-copy" x="111" y="24" text-anchor="end">9.</text><text class="se-copy" x="132" y="24"><tspan x="132">Prepare a plan to care for greenery in your locality. Include permission,</tspan><tspan x="132" dy="32">suitable sites and species, care of existing plants and how you would check</tspan><tspan x="132" dy="32">survival. Explain why planting trees everywhere would not be a sensible rule.</tspan></text></g>
<g class="v2-reading-block" data-block="q10" transform="translate(0 458)"><text class="se-copy" x="111" y="24" text-anchor="end">10.</text><text class="se-copy" x="132" y="24"><tspan x="132">The illustrated cooker heats a pot using a</tspan><tspan x="132" dy="32">reflective dish. (a) What source of energy</tspan><tspan x="132" dy="32">does it use? (b) Give one benefit and one</tspan><tspan x="132" dy="32">limitation. (c) Why should children avoid</tspan><tspan x="132" dy="32">touching the pot or looking at</tspan><tspan x="132" dy="32">concentrated reflected light?</tspan></text><image class="science-illustration" data-photo="cooker" href="../../figures/class-6/science/ch11/cooker.png" x="658.1993695823483" y="0" width="273.6012608353034" height="280" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="312.88"><tspan x="89">Fig. 11.8 · A solar cooker directs sunlight towards a cooking pot.</tspan></text></g>
<g class="v2-reading-block" data-block="q11" transform="translate(0 803)"><text class="se-copy" x="111" y="24" text-anchor="end">11.</text><text class="se-copy" x="132" y="24"><tspan x="132">How can large-scale tree removal affect soil? Explain two links among roots,</tspan><tspan x="132" dy="32">leaf litter, rainfall, erosion and soil organisms.</tspan></text></g>
<g class="v2-reading-block" data-block="q12" transform="translate(0 897)"><text class="se-copy" x="111" y="24" text-anchor="end">12.</text><text class="se-copy" x="132" y="24"><tspan x="132">Explain two ways human activities pollute air. Suggest one practical action to</tspan><tspan x="132" dy="32">reduce a source of pollution, and describe what evidence could help evaluate</tspan><tspan x="132" dy="32">it.</tspan></text></g>
<g class="v2-reading-block" data-block="q13" transform="translate(0 1023)"><text class="se-copy" x="111" y="24" text-anchor="end">13.</text><text class="se-copy" x="132" y="24"><tspan x="132">A family uses photovoltaic panels for electricity, a gas stove for cooking and a</tspan><tspan x="132" dy="32">windmill to pump water. A cloudy week brings much less sunlight. Predict</tspan><tspan x="132" dy="32">how each service might be affected. State what you need to know about</tspan><tspan x="132" dy="32">stored electricity, gas supply and wind before making a definite prediction.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">19</text></g></svg></div></div></section>
