<g class="v2-reading-block" data-block="project2" transform="translate(0 702)"><text class="se-heading" x="89" y="30"><tspan x="89">Compare leaves from one tree</tspan></text><text class="se-copy" x="89" y="72" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.15859" data-space-ratio="1.386">Collect<tspan dx="2.15859"> several</tspan><tspan dx="2.15859"> fallen</tspan><tspan dx="2.15859"> leaves</tspan><tspan dx="2.15859"> from</tspan><tspan dx="2.15859"> the</tspan><tspan dx="2.15859"> same</tspan><tspan dx="2.15859"> tree</tspan><tspan dx="2.15859"> and</tspan><tspan dx="2.15859"> identify</tspan><tspan dx="2.15859"> it</tspan><tspan dx="2.15859"> with</tspan><tspan dx="2.15859"> help.</tspan><tspan dx="2.15859"> Define</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.07344" data-space-ratio="1.371">length<tspan dx="2.07344"> consistently</tspan><tspan dx="2.07344"> from</tspan><tspan dx="2.07344"> the</tspan><tspan dx="2.07344"> base</tspan><tspan dx="2.07344"> of</tspan><tspan dx="2.07344"> the</tspan><tspan dx="2.07344"> leaf</tspan><tspan dx="2.07344"> blade</tspan><tspan dx="2.07344"> to</tspan><tspan dx="2.07344"> its</tspan><tspan dx="2.07344"> tip,</tspan><tspan dx="2.07344"> excluding</tspan><tspan dx="2.07344"> the</tspan><tspan dx="2.07344"> stalk,</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.20362" data-space-ratio="1.752">and<tspan dx="4.20362"> breadth</tspan><tspan dx="4.20362"> as</tspan><tspan dx="4.20362"> the</tspan><tspan dx="4.20362"> widest</tspan><tspan dx="4.20362"> distance</tspan><tspan dx="4.20362"> across</tspan><tspan dx="4.20362"> the</tspan><tspan dx="4.20362"> blade.</tspan><tspan dx="4.20362"> Use</tspan><tspan dx="4.20362"> a</tspan><tspan dx="4.20362"> 15</tspan><tspan dx="4.20362"> cm</tspan><tspan dx="4.20362"> ruler</tspan><tspan dx="4.20362"> where</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.67059" data-space-ratio="1.299">suitable.<tspan dx="1.67059"> Record</tspan><tspan dx="1.67059"> leaf</tspan><tspan dx="1.67059"> number,</tspan><tspan dx="1.67059"> tree</tspan><tspan dx="1.67059"> name,</tspan><tspan dx="1.67059"> length,</tspan><tspan dx="1.67059"> breadth</tspan><tspan dx="1.67059"> and</tspan><tspan dx="1.67059"> units.</tspan><tspan dx="1.67059"> Discuss</tspan><tspan dx="1.67059"> why</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">leaves from the same tree need not have identical dimensions.</tspan></text><image class="science-illustration" data-photo="leaf" href="../../figures/class-6/science/ch05/leaf.png" x="432.6666666666667" y="224" width="186.66666666666666" height="280" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="534.88"><tspan x="89">Use the same definition of length and breadth for every leaf.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">22</text></g></svg></div></div></section>
