<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="pendulum-picture-paired" transform="translate(0 112)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">Movement to and fro about a central</tspan><tspan x="89" dy="32" data-narrow-prose="true">position is called <tspan class="se-bold">oscillatory</tspan> <tspan class="se-bold">motion</tspan>. The</tspan><tspan x="89" dy="32" data-narrow-prose="true">suspended eraser and a playground swing</tspan><tspan x="89" dy="32" data-narrow-prose="true">are examples. The path can be curved: an</tspan><tspan x="89" dy="32" data-narrow-prose="true">oscillation need not be a straight line.</tspan><tspan x="89" dy="32" data-narrow-prose="true">Releasing gently makes the observation</tspan><tspan x="89" dy="32" data-paragraph-end="true">easier to compare.</tspan></text><image class="science-illustration" data-photo="pendulum" href="../../figures/class-6/science/ch05/pendulum.png" x="617" y="0" width="342" height="228" preserveAspectRatio="xMidYMid meet"/><text text-anchor="middle" class="se-caption" x="788" y="264.88"><tspan x="788">A firmly supported pendulum is</tspan><tspan x="788" dy="27">another way to observe to-and-fro</tspan><tspan x="788" dy="27">motion. A small suspended eraser</tspan><tspan x="788" dy="27">can serve the same classroom</tspan><tspan x="788" dy="27">purpose.</tspan></text></g>
<g class="v2-reading-block" data-block="strip-task" transform="translate(0 513)"><rect class="se-activity-panel" x="89" y="0" width="874" height="644" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Activity 5.6"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Activity 5.6</text></g><text class="se-activity-step" x="132" y="102" text-anchor="end">1.</text><text class="se-copy" x="146" y="102" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="4.70415" data-space-ratio="1.841">Ask<tspan dx="4.70415"> a</tspan><tspan dx="4.70415"> teacher</tspan><tspan dx="4.70415"> to</tspan><tspan dx="4.70415"> secure</tspan><tspan dx="4.70415"> one</tspan><tspan dx="4.70415"> end</tspan><tspan dx="4.70415"> of</tspan><tspan dx="4.70415"> a</tspan><tspan dx="4.70415"> flexible</tspan><tspan dx="4.70415"> ruler</tspan><tspan dx="4.70415"> or</tspan><tspan dx="4.70415"> a</tspan><tspan dx="4.70415"> smooth-edged</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="2.78885" data-space-ratio="1.499">springy<tspan dx="2.78885"> strip</tspan><tspan dx="2.78885"> on</tspan><tspan dx="2.78885"> a</tspan><tspan dx="2.78885"> table,</tspan><tspan dx="2.78885"> leaving</tspan><tspan dx="2.78885"> part</tspan><tspan dx="2.78885"> of</tspan><tspan dx="2.78885"> it</tspan><tspan dx="2.78885"> projecting</tspan><tspan dx="2.78885"> beyond</tspan><tspan dx="2.78885"> the</tspan><tspan dx="2.78885"> edge.</tspan><tspan dx="2.78885"> A</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="1.49648" data-space-ratio="1.268">strip<tspan dx="1.49648"> about</tspan><tspan dx="1.49648"> 50</tspan><tspan dx="1.49648"> cm</tspan><tspan dx="1.49648"> long</tspan><tspan dx="1.49648"> can</tspan><tspan dx="1.49648"> be</tspan><tspan dx="1.49648"> used;</tspan><tspan dx="1.49648"> an</tspan><tspan dx="1.49648"> adult</tspan><tspan dx="1.49648"> must</tspan><tspan dx="1.49648"> check</tspan><tspan dx="1.49648"> any</tspan><tspan dx="1.49648"> metal</tspan><tspan dx="1.49648"> edges</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">first.</tspan></text><text class="se-activity-step" x="132" y="242" text-anchor="end">2.</text><text class="se-copy" x="146" y="242" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="0.93200" data-space-ratio="1.167">Use<tspan dx="0.93200"> a</tspan><tspan dx="0.93200"> clamp</tspan><tspan dx="0.93200"> or</tspan><tspan dx="0.93200"> a</tspan><tspan dx="0.93200"> stable</tspan><tspan dx="0.93200"> book</tspan><tspan dx="0.93200"> stack</tspan><tspan dx="0.93200"> to</tspan><tspan dx="0.93200"> hold</tspan><tspan dx="0.93200"> it</tspan><tspan dx="0.93200"> firmly.</tspan><tspan dx="0.93200"> Keep</tspan><tspan dx="0.93200"> faces</tspan><tspan dx="0.93200"> away</tspan><tspan dx="0.93200"> from</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">the free end. Press that end down only slightly, then let go.</tspan></text><text class="se-activity-step" x="132" y="318" text-anchor="end">3.</text><text class="se-copy" x="146" y="318" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="3.27805" data-space-ratio="1.586">Observe<tspan dx="3.27805"> the</tspan><tspan dx="3.27805"> free</tspan><tspan dx="3.27805"> end.</tspan><tspan dx="3.27805"> Compare</tspan><tspan dx="3.27805"> its</tspan><tspan dx="3.27805"> movement</tspan><tspan dx="3.27805"> with</tspan><tspan dx="3.27805"> the</tspan><tspan dx="3.27805"> part</tspan><tspan dx="3.27805"> held</tspan><tspan dx="3.27805"> on</tspan><tspan dx="3.27805"> the</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">table. Stop if the support loosens; do not bend the strip sharply.</tspan></text><image class="science-illustration" data-photo="strip" href="../../figures/class-6/science/ch05/strip.png" x="364.75" y="370" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text text-anchor="middle" class="se-caption" x="526" y="615.88"><tspan x="526">The fixed portion is held securely; the free end has room to move.</tspan></text></g>
<g class="v2-reading-block" data-block="strip-evidence" transform="translate(0 1189)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="7.85345" data-space-ratio="2.404">The<tspan dx="7.85345"> free</tspan><tspan dx="7.85345"> end</tspan><tspan dx="7.85345"> moves</tspan><tspan dx="7.85345"> up</tspan><tspan dx="7.85345"> and</tspan><tspan dx="7.85345"> down</tspan><tspan dx="7.85345"> around</tspan><tspan dx="7.85345"> its</tspan><tspan dx="7.85345"> resting</tspan><tspan dx="7.85345"> position.</tspan><tspan dx="7.85345"> This</tspan><tspan dx="7.85345"> is</tspan><tspan dx="7.85345"> also</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="6.86461" data-space-ratio="2.228">oscillatory<tspan dx="6.86461"> motion,</tspan><tspan dx="6.86461"> even</tspan><tspan dx="6.86461"> though</tspan><tspan dx="6.86461"> it</tspan><tspan dx="6.86461"> looks</tspan><tspan dx="6.86461"> different</tspan><tspan dx="6.86461"> from</tspan><tspan dx="6.86461"> a</tspan><tspan dx="6.86461"> hanging</tspan><tspan dx="6.86461"> swing.</tspan><tspan dx="6.86461"> Its</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="15.76902" data-space-ratio="3.820">movement<tspan dx="15.76902"> gradually</tspan><tspan dx="15.76902"> becomes</tspan><tspan dx="15.76902"> smaller</tspan><tspan dx="15.76902"> as</tspan><tspan dx="15.76902"> energy</tspan><tspan dx="15.76902"> is</tspan><tspan dx="15.76902"> transferred</tspan><tspan dx="15.76902"> to</tspan><tspan dx="15.76902"> the</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">surroundings.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underla
