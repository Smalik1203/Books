<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="park-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="414" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Observe the playground illustration, or visit a park with an adult. Keep</tspan><tspan x="146" dy="32">clear of moving equipment and use it only as intended.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Identify an object or a particular part and describe its path over a chosen</tspan><tspan x="146" dy="32">interval. Look for straight, circular and to-and-fro motion.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Record Object or part, Reference point, Observed path, Category and</tspan><tspan x="146" dy="32">Reason in your notebook. If the motion changes or combines types,</tspan><tspan x="146" dy="32">describe the separate parts instead of forcing one label.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352"><tspan x="146">Discuss how a still picture limits your evidence. Which details would you</tspan><tspan x="146" dy="32">need to watch over time?</tspan></text></g>
<g class="v2-reading-block" data-block="park-picture" transform="translate(0 548)"><image class="science-illustration" data-photo="park" href="../../figures/class-6/science/ch05/park.png" x="241" y="0" width="570" height="380" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="410.88"><tspan x="89">Watch a particular seat, child or point over time. A still illustration suggests questions; actual</tspan><tspan x="89" dy="27">motion needs observations at different times.</tspan></text></g>
<g class="v2-reading-block" data-block="connect-0" transform="translate(0 1020)"><text class="se-copy" x="89" y="24"><tspan x="89">Measurement and motion share an important habit: state exactly what you</tspan><tspan x="89" dy="32">compare. A length needs a unit and clear endpoints. A description of motion</tspan></text></g>
<g class="v2-reading-block" data-block="connect-1" transform="translate(0 1084)"><text class="se-copy" x="89" y="24"><tspan x="89">needs an object, a reference point and a time interval. Clear comparisons let</tspan><tspan x="89" dy="32">other people check your result.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">15</text></g></svg></div></div></section>
