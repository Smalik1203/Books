<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="19"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 19"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="0.87091" data-space-ratio="1.156">A<tspan dx="0.87091"> length</tspan><tspan dx="0.87091"> measurement</tspan><tspan dx="0.87091"> needs</tspan><tspan dx="0.87091"> a</tspan><tspan dx="0.87091"> number</tspan><tspan dx="0.87091"> and</tspan><tspan dx="0.87091"> a</tspan><tspan dx="0.87091"> unit.</tspan><tspan dx="0.87091"> Body-based</tspan><tspan dx="0.87091"> units</tspan><tspan dx="0.87091"> can</tspan><tspan dx="0.87091"> differ</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">between people; standard units make results comparable.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="0.74849" data-space-ratio="1.134">The<tspan dx="0.74849"> SI</tspan><tspan dx="0.74849"> base</tspan><tspan dx="0.74849"> unit</tspan><tspan dx="0.74849"> of</tspan><tspan dx="0.74849"> length</tspan><tspan dx="0.74849"> is</tspan><tspan dx="0.74849"> the</tspan><tspan dx="0.74849"> metre</tspan><tspan dx="0.74849"> (m).</tspan><tspan dx="0.74849"> The</tspan><tspan dx="0.74849"> conversions</tspan><tspan dx="0.74849"> are</tspan><tspan dx="0.74849"> 1</tspan><tspan dx="0.74849"> km</tspan><tspan dx="0.74849"> =</tspan><tspan dx="0.74849"> 1000</tspan><tspan dx="0.74849"> m,</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">1 m = 100 cm and 1 cm = 10 mm.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="0.63165" data-space-ratio="1.113">Choose<tspan dx="0.63165"> a</tspan><tspan dx="0.63165"> suitable</tspan><tspan dx="0.63165"> measuring</tspan><tspan dx="0.63165"> tool.</tspan><tspan dx="0.63165"> Align</tspan><tspan dx="0.63165"> clear</tspan><tspan dx="0.63165"> endpoints,</tspan><tspan dx="0.63165"> keep</tspan><tspan dx="0.63165"> the</tspan><tspan dx="0.63165"> ruler</tspan><tspan dx="0.63165"> parallel</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">to the length and read directly from above.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="4.37195" data-space-ratio="1.782">When<tspan dx="4.37195"> measurement</tspan><tspan dx="4.37195"> starts</tspan><tspan dx="4.37195"> at</tspan><tspan dx="4.37195"> a</tspan><tspan dx="4.37195"> non-zero</tspan><tspan dx="4.37195"> mark,</tspan><tspan dx="4.37195"> subtract</tspan><tspan dx="4.37195"> the</tspan><tspan dx="4.37195"> starting</tspan><tspan dx="4.37195"> reading</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">from the ending reading.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="0.68954" data-space-ratio="1.123">Measure<tspan dx="0.68954"> a</tspan><tspan dx="0.68954"> curved</tspan><tspan dx="0.68954"> path</tspan><tspan dx="0.68954"> with</tspan><tspan dx="0.68954"> a</tspan><tspan dx="0.68954"> flexible</tspan><tspan dx="0.68954"> tape</tspan><tspan dx="0.68954"> or</tspan><tspan dx="0.68954"> mark</tspan><tspan dx="0.68954"> a</tspan><tspan dx="0.68954"> non-stretchy</tspan><tspan dx="0.68954"> thread</tspan><tspan dx="0.68954"> along</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">it and then measure the thread straight.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="7.17815" data-space-ratio="2.284">A<tspan dx="7.17815"> reference</tspan><tspan dx="7.17815"> point</tspan><tspan dx="7.17815"> helps</tspan><tspan dx="7.17815"> describe</tspan><tspan dx="7.17815"> position.</tspan><tspan dx="7.17815"> An</tspan><tspan dx="7.17815"> object</tspan><tspan dx="7.17815"> is</tspan><tspan dx="7.17815"> moving</tspan><tspan dx="7.17815"> or</tspan><tspan dx="7.17815"> at</tspan><tspan dx="7.17815"> rest</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">relative to the chosen reference during an observation.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="5.91344" data-space-ratio="2.057">Straight,<tspan dx="5.91344"> circular</tspan><tspan dx="5.91344"> and</tspan><tspan dx="5.91344"> to-and-fro</tspan><tspan dx="5.91344"> paths</tspan><tspan dx="5.91344"> are</tspan><tspan dx="5.91344"> described</tspan><tspan dx="5.91344"> as</tspan><tspan dx="5.91344"> linear,</tspan><tspan dx="5.91344"> circular</tspan><tspan dx="5.91344"> and</tspan></tspan><tspan x="112" dy="32" data-justify-width="851" data-natural-space="5.59200" data-extra-space="8.02060" data-space-ratio="2.434">oscillatory<tspan dx="8.02060"> motion.</tspan><tspan dx="8.02060"> Periodic</tspan><tspan dx="8.02060"> motion</tspan><tspan dx="8.02060"> also</tspan><tspan dx="8.02060"> requires</tspan><tspan dx="8.02060"> repetition</tspan><tspan dx="8.02060"> at</tspan><tspan dx="8.02060"> equal</tspan><tspan dx="8.02060"> time</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">intervals.</tspan></text><text class="se-copy" x="89" y="766" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.06423" data-space-ratio="1.190">Apply<tspan dx="1.06423"> these</tspan><tspan dx="1.06423"> ideas</tspan><tspan dx="1.06423"> to</tspan><tspan dx="1.06423"> the</tspan><tspan dx="1.06423"> bicycle</tspan><tspan dx="1.06423"> below.</tspan><tspan dx="1.06423"> On</tspan><tspan dx="1.06423"> a</tspan><tspan dx="1.06423"> straight</tspan><tspan dx="1.06423"> stretch</tspan><tspan dx="1.06423"> of</tspan><tspan dx="1.06423"> road,</tspan><tspan dx="1.06423"> compare</tspan><tspan dx="1.06423"> the</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.74629" data-space-ratio="1.133">path<tspan dx="0.74629"> of</tspan><tspan dx="0.74629"> the</tspan><tspan dx="0.74629"> bicycle’s</tspan><tspan dx="0.74629"> frame</tspan><tspan dx="0.74629"> relative</tspan><tspan dx="0.74629"> to</tspan><tspan dx="0.74629"> the</tspan><tspan dx="0.74629"> road</tspan><tspan dx="0.74629"> with</tspan><tspan dx="0.74629"> the</tspan><tspan dx="0.74629"> path</tspan><tspan dx="0.74629"> of</tspan><tspan dx="0.74629"> a</tspan><tspan dx="0.74629"> point</tspan><tspan dx="0.74629"> on</tspan><tspan dx="0.74629"> a</tspan><tspan dx="0.74629"> wheel</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.02573" data-space-ratio="1.362">relative<tspan dx="2.02573"> to</tspan><tspan dx="2.02573"> its</tspan><tspan dx="2.02573"> axle.</tspan><tspan dx="2.02573"> Why</tspan><tspan dx="2.02573"> must</tspan><tspan dx="2.02573"> the</tspan><tspan dx="2.02573"> reference</tspan><tspan dx="2.02573"> be</tspan><tspan dx="2.02573"> named</tspan><tspan dx="2.02573"> in</tspan><tspan dx="2.02573"> each</tspan><tspan dx="2.02573"> description?</tspan><tspan dx="2.02573"> Then</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.19328" data-space-ratio="1.571">explain<tspan dx="3.19328"> what</tspan><tspan dx="3.19328"> you</tspan><tspan dx="3.19328"> would</tspan><tspan dx="3.19328"> measure</tspan><tspan dx="3.19328"> to</tspan><tspan dx="3.19328"> check</tspan><tspan dx="3.19328"> whether</tspan><tspan dx="3.19328"> successive</tspan><tspan dx="3.19328"> wheel</tspan><tspan dx="3.19328"> turns</tspan><tspan dx="3.19328"> take</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.34132" data-space-ratio="1.240">equal<tspan dx="1.34132"> times.</tspan><tspan dx="1.34132"> A</tspan><tspan dx="1.34132"> still</tspan><tspan dx="1.34132"> picture</tspan><tspan dx="1.34132"> cannot</tspan><tspan dx="1.34132"> tell</tspan><tspan dx="1.34132"> you</tspan><tspan dx="1.34132"> those</tspan><tspan dx="1.34132"> times:</tspan><tspan dx="1.34132"> describe</tspan><tspan dx="1.34132"> the</tspan><tspan dx="1.34132"> observations</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">you would need.</tspan></text><image class="science-illustration" data-photo="revie
