<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="19"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 19"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q10" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">10.</text><text class="se-copy" x="132" y="24"><tspan x="132">List three objects whose sizes are conveniently written in millimetres, three</tspan><tspan x="132" dy="32">in centimetres and three in metres. Arrange them in a notebook table headed</tspan><tspan x="132" dy="32">Unit and Objects. Explain why another unit could still be used.</tspan></text></g>
<g class="v2-reading-block" data-block="q11" transform="translate(0 238)"><text class="se-copy" x="111" y="24" text-anchor="end">11.</text><text class="se-copy" x="132" y="24"><tspan x="132">A ball enters the model track at A, moves through B and C, completes the</tspan><tspan x="132" dy="32">loop through D, returns near E and leaves at F. Identify straight, circular and</tspan><tspan x="132" dy="32">other curved portions. Does one trip through the loop necessarily make the</tspan><tspan x="132" dy="32">motion periodic? Explain.</tspan></text><g transform="translate(0 144)"><g class="v2-measure-diagram" data-diagram="track"><path class="v2-measure-track" d="M158 34L300 202Q381 284 493 276A104 104 0 1 1 497 275L890 275"/><path class="v2-measure-rail" d="M158 34L300 202Q381 284 493 276A104 104 0 1 1 497 275L890 275"/><circle class="v2-measure-ball" cx="209" cy="94" r="13"/><text class="v2-measure-label" x="143" y="27" text-anchor="middle">A</text><text class="v2-measure-label" x="295" y="237" text-anchor="middle">B</text><text class="v2-measure-label" x="486" y="315" text-anchor="middle">C</text><text class="v2-measure-label" x="500" y="58" text-anchor="middle">D</text><text class="v2-measure-label" x="641" y="250" text-anchor="middle">E</text><text class="v2-measure-label" x="906" y="281" text-anchor="middle">F</text><path class="v2-measure-arrow" d="M260 130L293 168M283.6259866566675 164.5174902959181L293 168L290.8656298456556 158.23043173706003"/><path class="v2-measure-arrow" d="M749 301L834 301M825.2241743810963 305.79425538604204L834 301L825.2241743810963 296.20574461395796"/></g></g><text class="se-caption" x="89" y="504.88"><tspan x="89">The straight entry and exit, curved transition and circular loop are shown separately by</tspan><tspan x="89" dy="27">labelled points.</tspan></text></g>
<g class="v2-reading-block" data-block="q12" transform="translate(0 802)"><text class="se-copy" x="111" y="24" text-anchor="end">12.</text><text class="se-copy" x="132" y="24"><tspan x="132">Tasneem wants to make a metre scale. She considers plywood, paper, cloth,</tspan><tspan x="132" dy="32">stretchable rubber and steel. Which material is especially unsuitable because</tspan><tspan x="132" dy="32">its length changes when pulled? What other precautions would make a scale</tspan><tspan x="132" dy="32">from the remaining materials reliable?</tspan></text></g>
<g class="v2-reading-block" data-block="q13" transform="translate(0 960)"><text class="se-copy" x="111" y="24" text-anchor="end">13.</text><text class="se-copy" x="132" y="24"><tspan x="132">Design a card game for converting units of length. Make matching cards such</tspan><tspan x="132" dy="32">as equivalent lengths in different units, explain the rules, and include a way</tspan><tspan x="132" dy="32">for players to check disputed pairs.</tspan></text></g><g transform="translate(0 1086)"><g data-page-illustration="figures/class-6/science/ch05/tape.png"><image class="science-illustration" href="../../figures/class-6/science/ch05/tape.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A flexible measuring tape.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A flexible measuring tape.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">19</text></g></svg></div></div></section>
