<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="23" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 23"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project5" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Keep a private height record</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Stand safely against a wall while an adult uses a flat book to mark your height.</tspan><tspan x="89" dy="32">Record the date, unit and method. Repeat about every three months using the</tspan><tspan x="89" dy="32">same method and similar conditions. Keep your own record private and include a</tspan><tspan x="89" dy="32">sibling only with permission. Small apparent differences can come from posture</tspan><tspan x="89" dy="32">or measurement, so check the method before drawing a conclusion.</tspan></text><image class="science-illustration" data-photo="opener" href="../../figures/class-6/science/ch05/opener.png" x="316" y="224" width="420" height="280" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="534.88"><tspan x="89">A useful comparison keeps the method consistent across measurements.</tspan></text></g>
<g class="v2-reading-block" data-block="project6" transform="translate(0 677)"><text class="se-heading" x="89" y="30"><tspan x="89">Count wheel turns to estimate distance</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">With an adult, mark a bicycle tyre with chalk and measure the distance rolled in</tspan><tspan x="89" dy="32">one complete turn on level ground. Walk the bicycle slowly through several</tspan><tspan x="89" dy="32">complete turns, counting the mark’s returns, then multiply turns by distance per</tspan><tspan x="89" dy="32">turn. Compare with a tape measurement. Do not attach a metal strip or loose</tspan><tspan x="89" dy="32">object to the spokes or frame. Discuss slipping, steering and tyre pressure.</tspan><tspan x="89" dy="32">Professional road-course measurers use calibrated bicycles with devices such as</tspan><tspan x="89" dy="32">a Jones Counter; their procedure includes checks before and after measuring.</tspan></text><g transform="translate(0 288)"><g data-instructional-figure="wheel"><g class="v2-measure-diagram" data-diagram="wheel"><circle class="v2-measure-tyre" cx="322" cy="131" r="104"/><circle class="v2-measure-rim" cx="322" cy="131" r="92"/><circle class="v2-measure-ball" cx="322" cy="131" r="12"/><line class="v2-measure-line " x1="337" y1="131" x2="413" y2="131"/><line class="v2-measure-line " x1="334.9903810567666" y1="138.5" x2="400.8083117443839" y2="176.5"/><line class="v2-measure-line " x1="329.5" y1="143.99038105676658" x2="367.5" y2="209.8083117443839"/><line class="v2-measure-line " x1="322" y1="146" x2="322" y2="222"/><line class="v2-measure-line " x1="314.5" y1="143.99038105676658" x2="276.5" y2="209.80831174438393"/><line class="v2-measure-line " x1="309.0096189432334" y1="138.5" x2="243.19168825561607" y2="176.5"/><line class="v2-measure-line " x1="307" y1="131" x2="231" y2="131"/><line class="v2-measure-line " x1="309.0096189432334" y1="123.5" x2="243.19168825561607" y2="85.50000000000003"/><line class="v2-measure-line " x1="314.5" y1="118.00961894323342" x2="276.49999999999994" y2="52.1916882556161"/><line class="v2-measure-line " x1="322" y1="116" x2="322" y2="40"/><line class="v2-measure-line " x1="329.5" y1="118.00961894323342" x2="367.5" y2="52.191688255616086"/><line class="v2-measure-line " x1="334.9903810567666" y1="123.5" x2="400.8083117443839" y2="85.49999999999996"/><circle class="v2-measure-chalk" cx="322" cy="231" r="7"/><line class="v2-measure-line " x1="142" y1="242" x2="910" y2="242"/><path class="v2-measure-arrow" d="M494 199L864 199M855.2241743810963 203.79425538604204L864 199L855.2241743810963 194.20574461395796"/><text class="v2-measure-label" x="592" y="66" text-anchor="start">Chalk mark</text><line class="v2-measure-line " x1="557" y1="79" x2="335" y2="231"/><text class="v2-measure-label" x="586" y="285" text-anchor="middle">One full turn → one circumference</text></g></g></g><text class="se-caption" x="89" y="610.88"><tspan x="89">Use a harmless chalk mark and walk the bicycle. A rolling wheel connects repeated motion</tspan><tspan x="89" dy="27">with distance.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">23</text></g></svg></div></div></section>
