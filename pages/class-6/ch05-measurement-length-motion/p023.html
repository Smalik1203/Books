<g class="v2-reading-block" data-block="project2" transform="translate(0 752)"><text class="se-heading" x="89" y="30"><tspan x="89">Compare leaves from one tree</tspan></text><text class="se-copy" x="89" y="72" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.15859" data-space-ratio="1.386">Collect<tspan dx="2.15859"> several</tspan><tspan dx="2.15859"> fallen</tspan><tspan dx="2.15859"> leaves</tspan><tspan dx="2.15859"> from</tspan><tspan dx="2.15859"> the</tspan><tspan dx="2.15859"> same</tspan><tspan dx="2.15859"> tree</tspan><tspan dx="2.15859"> and</tspan><tspan dx="2.15859"> identify</tspan><tspan dx="2.15859"> it</tspan><tspan dx="2.15859"> with</tspan><tspan dx="2.15859"> help.</tspan><tspan dx="2.15859"> Define</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.07344" data-space-ratio="1.371">length<tspan dx="2.07344"> consistently</tspan><tspan dx="2.07344"> from</tspan><tspan dx="2.07344"> the</tspan><tspan dx="2.07344"> base</tspan><tspan dx="2.07344"> of</tspan><tspan dx="2.07344"> the</tspan><tspan dx="2.07344"> leaf</tspan><tspan dx="2.07344"> blade</tspan><tspan dx="2.07344"> to</tspan><tspan dx="2.07344"> its</tspan><tspan dx="2.07344"> tip,</tspan><tspan dx="2.07344"> excluding</tspan><tspan dx="2.07344"> the</tspan><tspan dx="2.07344"> stalk,</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.20362" data-space-ratio="1.752">and<tspan dx="4.20362"> breadth</tspan><tspan dx="4.20362"> as</tspan><tspan dx="4.20362"> the</tspan><tspan dx="4.20362"> widest</tspan><tspan dx="4.20362"> distance</tspan><tspan dx="4.20362"> across</tspan><tspan dx="4.20362"> the</tspan><tspan dx="4.20362"> blade.</tspan><tspan dx="4.20362"> Use</tspan><tspan dx="4.20362"> a</tspan><tspan dx="4.20362"> 15</tspan><tspan dx="4.20362"> cm</tspan><tspan dx="4.20362"> ruler</tspan><tspan dx="4.2
