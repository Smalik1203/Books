<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="strip-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">The free end moves up and down around its resting position. This is also</tspan><tspan x="89" dy="32">oscillatory motion, even though it looks different from a hanging swing. Its</tspan></text></g>
<g class="v2-reading-block" data-block="strip-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">movement gradually becomes smaller as energy is transferred to the</tspan><tspan x="89" dy="32">surroundings.</tspan></text></g>
<g class="v2-reading-block" data-block="motion-table" transform="translate(0 256)"><g data-comparison-table="motion-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Compare the path, not just the object</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Type</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="295.28" y="70.08"><tspan x="295.28">What to look for</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="671.1" y="70.08"><tspan x="671.1">Example</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Linear</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="295.28" y="110.08"><tspan x="295.28">A straight path</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="110.08"><tspan x="671.1">An eraser falling straight</tspan><tspan x="671.1" dy="28">down before impact</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">Circular</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="295.28" y="178.07999999999998"><tspan x="295.28">A path around a centre at a fixed</tspan><tspan x="295.28" dy="28">radius</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="178.07999999999998"><tspan x="671.1">One seat on a turning</tspan><tspan x="671.1" dy="28">merry-go-round</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="218" y2="218"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="246.07999999999998"><tspan x="103">Oscillatory</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="295.28" y="246.07999999999998"><tspan x="295.28">To-and-fro motion about a central</tspan><tspan x="295.28" dy="28">position</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="246.07999999999998"><tspan x="671.1">The free end of a vibrating</tspan><tspan x="671.1" dy="28">strip</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="286" y2="286"/><rect class="v2-table-frame" x="89" y="42" width="874" height="244"/><line class="v2-table-rule" x1="281.28" x2="281.28" y1="42" y2="286"/><line class="v2-table-rule" x1="657.1" x2="657.1" y1="42" y2="286"/></g></g>
<g class="v2-reading-block" data-block="periodic-0" transform="translate(0 558)"><text class="se-copy" x="89" y="24"><tspan x="89">Motion is <tspan class="se-bold">periodic</tspan> when the motion repeats after equal time intervals. A steadily</tspan><tspan x="89" dy="32">turning wheel or a regularly swinging pendulum can be approximately periodic.</tspan></text></g>
<g class="v2-reading-block" data-block="periodic-1" transform="translate(0 622)"><text class="se-copy" x="89" y="24"><tspan x="89">Circular or to-and-fro motion is not automatically periodic: stopping, changing</tspan><tspan x="89" dy="32">speed irregularly or changing the pattern can destroy the equal-time repetition.</tspan></text></g>
<g class="v2-reading-block" data-block="periodic-think" transform="translate(0 702)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="186" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A merry-go-round completes one turn, stops for a while, then turns faster.</tspan><tspan x="113" dy="32">Its seat still follows a circle when it moves. Is that enough to call the whole</tspan><tspan x="113" dy="32">motion periodic? State what else you would need to observe or measure.</tspan></text></g><g transform="translate(0 910)"><g data-page-illustration="figures/class-6/science/ch05/bus.png"><image class="science-illustration" href="../../figures/class-6/science/ch05/bus.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>A moving bus.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">A moving bus.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
