05"> part</tspan><tspan dx="3.27805"> held</tspan><tspan dx="3.27805"> on</tspan><tspan dx="3.27805"> the</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">table. Stop if the support loosens; do not bend the strip sharply.</tspan></text><image class="science-illustration" data-photo="strip" href="../../figures/class-6/science/ch05/strip.png" x="364.75" y="370" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="615.88"><tspan x="113">The fixed portion is held securely; the free end has room to move.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
