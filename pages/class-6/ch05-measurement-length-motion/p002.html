pan><tspan dx="10.61275"> leave</tspan><tspan dx="10.61275"> gaps</tspan><tspan dx="10.61275"> or</tspan><tspan dx="10.61275"> overlap.</tspan><tspan dx="10.61275"> Record</tspan><tspan dx="10.61275"> the</tspan><tspan dx="10.61275"> number</tspan><tspan dx="10.61275"> of</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.26430" data-space-ratio="1.941">handspans,<tspan dx="5.26430"> including</tspan><tspan dx="5.26430"> any</tspan><tspan dx="5.26430"> part-span</tspan><tspan dx="5.26430"> left</tspan><tspan dx="5.26430"> over.</tspan><tspan dx="5.26430"> Ask</tspan><tspan dx="5.26430"> two</tspan><tspan dx="5.26430"> friends</tspan><tspan dx="5.26430"> to</tspan><tspan dx="5.26430"> measure</tspan><tspan dx="5.26430"> the</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">same edge independently.</tspan></text></g>
