<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="measure-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">5.1 How Do We Measure?</tspan></text></g>
<g class="v2-reading-block" data-block="body-units-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">People sometimes estimate a length using a handspan, a foot, an arm or a stride.</tspan><tspan x="89" dy="32">Deepa’s mother calls a handspan balisht. Such methods are convenient when no</tspan><tspan x="89" dy="32">scale is available, but will two people always obtain the same number?</tspan></text></g>
<g class="v2-reading-block" data-block="handspan-task-0" transform="translate(0 282)"><text class="se-copy" x="89" y="24"><tspan x="89">Choose one edge of a classroom table. Without stretching your fingers</tspan><tspan x="89" dy="32">uncomfortably, use the distance from your thumb tip to your little-finger tip as</tspan></text></g>
<g class="v2-reading-block" data-block="handspan-task-1" transform="translate(0 346)"><text class="se-copy" x="89" y="24"><tspan x="89">one handspan. Move it along the edge, keeping each new starting point at the</tspan><tspan x="89" dy="32">previous endpoint. Do not leave gaps or overlap. Record the number of</tspan></text></g>
<g class="v2-reading-block" data-block="handspan-task-2" transform="translate(0 410)"><text class="se-copy" x="89" y="24"><tspan x="89">handspans, including any part-span left over. Ask two friends to measure the</tspan><tspan x="89" dy="32">same edge independently.</tspan></text></g>
<g class="v2-reading-block" data-block="handspan-picture" transform="translate(0 490)"><g class="v2-measure-diagram" data-diagram="handspan"><svg class="science-illustration" data-art="hand" x="401.53432137285495" y="0" width="246.93135725429016" height="258" viewBox="0 0 1227 1282" overflow="hidden"><image href="../../figures/class-6/science/ch05/hand.png" x="0" y="0" width="1227" height="1282" preserveAspectRatio="xMidYMid meet"/></svg><text class="v2-measure-label" x="526" y="298" text-anchor="middle">Thumb tip ↔ little-finger tip</text></g><text class="se-caption" x="89" y="340.88"><tspan x="89">A unit must be repeated along the same length, without gaps or overlaps. Compare the</tspan><tspan x="89" dy="27">handspans before comparing the counts.</tspan></text></g>
<g class="v2-reading-block" data-block="sample-handspans" transform="translate(0 886)"><g data-comparison-table="sample-handspans"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">One table, five reported measurements</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Student</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="330.24" y="70.08"><tspan x="330.24">Length in that student’s handspans</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Anish</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="330.24" y="110.08"><tspan x="330.24">Slightly more than 13</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="122" y2="122"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="150.07999999999998"><tspan x="103">Padma</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="330.24" y="150.07999999999998"><tspan x="330.24">13</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="162" y2="162"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="190.07999999999998"><tspan x="103">Tasneem</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="330.24" y="190.07999999999998"><tspan x="330.24">Slightly less than 13</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="202" y2="202"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="230.07999999999998"><tspan x="103">Deepa</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="330.24" y="230.07999999999998"><tspan x="330.24">Between 13 and 14</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="242" y2="242"/><g data-comparison-row="5"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="270.08"><tspan x="103">Hardeep</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="330.24" y="270.08"><tspan x="330.24">14</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="282" y2="282"/><rect class="v2-table-frame" x="89" y="42" width="874" height="240"/><line class="v2-table-rule" x1="316.24" x2="316.24" y1="42" y2="282"/><text class="v2-table-note" x="89" y="314.88"><tspan x="89">These are the group’s results. Measure your own table and record what you observe.</tspan></text></g></g>
<g class="v2-reading-block" data-block="handspan-evidence-0" transform="translate(0 1222)"><text class="se-copy" x="89" y="24"><tspan x="89">The table has not changed length. Different-sized handspans can give different</tspan><tspan x="89" dy="32">counts: a smaller handspan usually fits more times along the same edge.</tspan></text></g>
<g class="v2-reading-block" data-block="handspan-evidence-1" transform="translate(0 1286)"><text class="se-copy" x="89" y="24"><tspan x="89">Inconsistent placement can add another difference. Compare both the size of the</tspan><tspan x="89" dy="32">chosen unit and how it was placed.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
