<g class="v2-reading-block" data-block="position-story-0" transform="translate(0 613)"><text class="se-copy" x="89" y="24"><tspan x="89">The class plans a visit to a garden. Deepa and Anish think the school is nearer</tspan><tspan x="89" dy="32">their homes; Tasneem and Padma think the garden is nearer. Hardeep thinks the</tspan></text></g>
<g class="v2-reading-block" data-block="position-story-1" transform="translate(0 677)"><text class="se-copy" x="89" y="24"><tspan x="89">two are equally far away. Could all of them be right? They are starting from</tspan><tspan x="89" dy="32">different homes.</tspan></text></g>

<g class="v2-reading-block" data-block="reference-0" transform="translate(0 1151)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">reference</tspan> <tspan class="se-bold">point</tspan> is a chosen point used to describe a position or a change in</tspan><tspan x="89" dy="32">position. Using the same reference point makes statements easier to compare.</tspan></text></g>
<g class="v2-reading-block" data-block="reference-1" transform="translate(0 1215)"><text class="se-copy" x="89" y="24"><tspan x="89">On this road, the school is at 3 km and the garden at 5 km from the bus stand,</tspan><tspan x="89" dy="32">whichever pupil describes them.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
