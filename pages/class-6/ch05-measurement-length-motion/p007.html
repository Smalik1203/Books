<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="measure-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="446" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Choose a comb, pen, pencil and eraser. Check that your ruler is long</tspan><tspan x="146" dy="32">enough for each object and identify its smallest marked division.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Measure each object along the length you chose. Keep the ruler straight,</tspan><tspan x="146" dy="32">align an endpoint with a clear mark and read directly from above.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">In your notebook, record the object, starting reading, ending reading,</tspan><tspan x="146" dy="32">calculated length and unit. If you start at zero, still note that starting</tspan><tspan x="146" dy="32">reading.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352"><tspan x="146">Ask a partner to measure the same objects independently. Compare</tspan><tspan x="146" dy="32">results and investigate any differences in placement, endpoints or</tspan><tspan x="146" dy="32">reading direction. Repeat a doubtful reading.</tspan></text></g>
<g class="v2-reading-block" data-block="measurement-evidence-0" transform="translate(0 580)"><text class="se-copy" x="89" y="24"><tspan x="89">Close agreement supports the consistency of your method, but identical readings</tspan><tspan x="89" dy="32">do not prove that a damaged tool is correct. If results differ, check the setup</tspan></text></g>
<g class="v2-reading-block" data-block="measurement-evidence-1" transform="translate(0 644)"><text class="se-copy" x="89" y="24"><tspan x="89">before averaging numbers or deciding that one person is wrong. State a sensible</tspan><tspan x="89" dy="32">precision for the marks you can read.</tspan></text></g>
<g class="v2-reading-block" data-block="curve-head" transform="translate(0 736)"><text class="v2-title" x="89" y="38"><tspan x="89">5.4 Measuring a Curved Line</tspan></text></g>
<g class="v2-reading-block" data-block="curve-story-0" transform="translate(0 794)"><text class="se-copy" x="89" y="24"><tspan x="89">Anish’s family wants to decorate an arch with a string of lights. A straight line</tspan><tspan x="89" dy="32">between its ends is shorter than the path along the arch. The required length</tspan></text></g>
<g class="v2-reading-block" data-block="curve-story-1" transform="translate(0 858)"><text class="se-copy" x="89" y="24"><tspan x="89">follows the curve. For classroom work, model the arch on paper; leave real</tspan><tspan x="89" dy="32">electrical fitting and work at height to adults.</tspan></text></g>
<g class="v2-reading-block" data-block="curve-method-0" transform="translate(0 938)"><text class="se-copy" x="89" y="24"><tspan x="89">Lay a non-stretchy thread carefully along a drawn curve, beginning at one end.</tspan><tspan x="89" dy="32">Mark the thread at the other endpoint. Straighten the marked section alongside a</tspan></text></g>
<g class="v2-reading-block" data-block="curve-method-1" transform="translate(0 1002)"><text class="se-copy" x="89" y="24"><tspan x="89">ruler without stretching it, and read its length. Repeat the placement to check</tspan><tspan x="89" dy="32">whether it followed the entire curve. A suitable flexible tape can measure the</tspan><tspan x="89" dy="32">same path directly.</tspan></text></g><g transform="translate(0 1114)"><g data-page-illustration="figures/class-6/science/ch05/tape.png"><image class="science-illustration" href="../../figures/class-6/science/ch05/tape.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A flexible measuring tape.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A flexible measuring tape.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
