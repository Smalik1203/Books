<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q5" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">5.</text><text class="se-copy" x="132" y="24"><tspan x="132">The distance between a school and a home is 1.5 km. Express it in metres</tspan><tspan x="132" dy="32">and show your conversion.</tspan></text></g>
<g class="v2-reading-block" data-block="q6" transform="translate(0 206)"><text class="se-copy" x="111" y="24" text-anchor="end">6.</text><text class="se-copy" x="132" y="24"><tspan x="132">Choose an unbroken tumbler or bottle. Measure the distance around its</tspan><tspan x="132" dy="32">circular base with a flexible tape or thread. Record the method, result and</tspan><tspan x="132" dy="32">unit. Explain why a straight measurement across the base is different.</tspan></text><g transform="translate(0 112)"><g class="v2-measure-diagram" data-diagram="circumference"><ellipse class="v2-measure-object" cx="526" cy="96" rx="112" ry="31"/><path class="v2-measure-glass" d="M414 96L436 217Q526 258 616 217L638 96"/><ellipse class="v2-measure-thread" cx="526" cy="216" rx="90" ry="28"/><text class="v2-measure-label" x="788" y="217" text-anchor="middle">Around the base</text><line class="v2-measure-line " x1="683" y1="210" x2="620" y2="216"/><text class="v2-measure-label" x="526" y="38" text-anchor="middle">Tumbler</text></g></g><text class="se-caption" x="89" y="394.88"><tspan x="89">Decide which path your thread must follow.</tspan></text></g>
<g class="v2-reading-block" data-block="q7" transform="translate(0 633)"><text class="se-copy" x="111" y="24" text-anchor="end">7.</text><text class="se-copy" x="132" y="24"><tspan x="132">With permission and an adult’s help, measure a friend’s height safely against</tspan><tspan x="132" dy="32">a wall. Express the same height in metres, centimetres and millimetres. Do</tspan><tspan x="132" dy="32">not rank or compare classmates’ bodies.</tspan></text></g>
<g class="v2-reading-block" data-block="q8" transform="translate(0 759)"><text class="se-copy" x="111" y="24" text-anchor="end">8.</text><text class="se-copy" x="132" y="24"><tspan x="132">Estimate how many identical coins placed edge to edge, without gaps, would</tspan><tspan x="132" dy="32">cover one chosen side of a notebook. Check by measuring that side and one</tspan><tspan x="132" dy="32">coin’s diameter with a 15 cm ruler. Explain how you would handle a</tspan><tspan x="132" dy="32">remaining fraction of a coin’s width.</tspan></text></g>
<g class="v2-reading-block" data-block="q9" transform="translate(0 917)"><text class="se-copy" x="111" y="24" text-anchor="end">9.</text><text class="se-copy" x="132" y="24"><tspan x="132">Give two examples each of linear, circular and oscillatory motion. For every</tspan><tspan x="132" dy="32">example, identify the part moving and the reference point.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
