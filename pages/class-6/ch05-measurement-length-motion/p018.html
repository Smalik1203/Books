<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="654" rx="18"/><text class="se-copy" x="113" y="222" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Length</tspan> — The extent of an object or</tspan><tspan x="113" dy="32" data-paragraph-end="true">path between chosen endpoints.</tspan></text><text class="se-copy" x="113" y="306" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Measurement</tspan> — A comparison of a</tspan><tspan x="113" dy="32" data-paragraph-end="true">quantity with a chosen unit.</tspan></text><text class="se-copy" x="113" y="390" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Unit</tspan> — An agreed amount used for</tspan><tspan x="113" dy="32" data-paragraph-end="true">comparison.</tspan></text><text class="se-copy" x="113" y="474" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Standard</tspan> <tspan class="se-bold">unit</tspan> — A unit defined</tspan><tspan x="113" dy="32" data-paragraph-end="true">consistently for different users.</tspan></text><text class="se-copy" x="113" y="558" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Metre</tspan> <tspan class="se-bold">(m)</tspan> — The SI base unit of</tspan><tspan x="113" dy="32" data-paragraph-end="true">length.</tspan></text><text class="se-copy" x="113" y="642" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Centimetre</tspan> <tspan class="se-bold">(cm)</tspan> — One-hundredth</tspan><tspan x="113" dy="32" data-paragraph-end="true">of a metre.</tspan></text><text class="se-copy" x="113" y="726" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Millimetre</tspan> <tspan class="se-bold">(mm)</tspan> — One-thousandth</tspan><tspan x="113" dy="32" data-narrow-prose="true">of a metre; one-tenth of a</tspan><tspan x="113" dy="32" data-paragraph-end="true">centimetre.</tspan></text><text class="se-copy" x="541" y="222" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Kilometre</tspan> <tspan class="se-bold">(km)</tspan> — A length of 1000</tspan><tspan x="541" dy="32" data-paragraph-end="true">metres.</tspan></text><text class="se-copy" x="541" y="306" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Reference</tspan> <tspan class="se-bold">point</tspan> — A chosen point</tspan><tspan x="541" dy="32" data-narrow-prose="true">used to describe a position or its</tspan><tspan x="541" dy="32" data-paragraph-end="true">change.</tspan></text><text class="se-copy" x="541" y="422" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Motion</tspan> — Change of position with</tspan><tspan x="541" dy="32" data-paragraph-end="true">time relative to a reference.</tspan></text><text class="se-copy" x="541" y="506" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Linear</tspan> <tspan class="se-bold">motion</tspan> — Motion along a</tspan><tspan x="541" dy="32" data-paragraph-end="true">straight path.</tspan></text><text class="se-copy" x="541" y="590" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Circular</tspan> <tspan class="se-bold">motion</tspan> — Motion along a</tspan><tspan x="541" dy="32" data-paragraph-end="true">circular path.</tspan></text><text class="se-copy" x="541" y="674" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Oscillatory</tspan> <tspan class="se-bold">motion</tspan> — To-and-fro</tspan><tspan x="541" dy="32" data-paragraph-end="true">motion about a central position.</tspan></text><text class="se-copy" x="541" y="758" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Periodic</tspan> <tspan class="se-bold">motion</tspan> — Motion that</tspan><tspan x="541" dy="32" data-paragraph-end="true">repeats after equal time intervals.</tspan></text><image class="science-illustration" data-photo="review-glossary" href="../../figures/class-6/science/review/measurement-kit.png" x="180.21052631578948" y="863" width="691.578947368421" height="280" preserveAspectRatio="xMidYMid meet"/><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
