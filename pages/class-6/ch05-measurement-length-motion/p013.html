<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="strip-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="634" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Ask a teacher to secure one end of a flexible ruler or a smooth-edged</tspan><tspan x="146" dy="32">springy strip on a table, leaving part of it projecting beyond the edge. A</tspan><tspan x="146" dy="32">strip about 50 cm long can be used; an adult must check any metal edges</tspan><tspan x="146" dy="32">first.</tspan></text><text class="se-activity-step" x="132" y="232" text-anchor="end">2.</text><text class="se-copy" x="146" y="232"><tspan x="146">Use a clamp or a stable book stack to hold it firmly. Keep faces away from</tspan><tspan x="146" dy="32">the free end. Press that end down only slightly, then let go.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Observe the free end. Compare its movement with the part held on the</tspan><tspan x="146" dy="32">table. Stop if the support loosens; do not bend the strip sharply.</tspan></text><image class="science-illustration" data-photo="strip" href="../../figures/class-6/science/ch05/strip.png" x="364.75" y="360" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="605.88"><tspan x="113">The fixed portion is held securely; the free end has room to move.</tspan></text></g>
<g class="v2-reading-block" data-block="strip-evidence-0" transform="translate(0 768)"><text class="se-copy" x="89" y="24"><tspan x="89">The free end moves up and down around its resting position. This is also</tspan><tspan x="89" dy="32">oscillatory motion, even though it looks different from a hanging swing. Its</tspan></text></g>
<g class="v2-reading-block" data-block="strip-evidence-1" transform="translate(0 832)"><text class="se-copy" x="89" y="24"><tspan x="89">movement gradually becomes smaller as energy is transferred to the</tspan><tspan x="89" dy="32">surroundings.</tspan></text></g>
<g class="v2-reading-block" data-block="motion-table" transform="translate(0 912)"><g data-comparison-table="motion-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Compare the path, not just the object</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Type</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="295.28" y="70.08"><tspan x="295.28">What to look for</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="671.1" y="70.08"><tspan x="671.1">Example</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Linear</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="295.28" y="110.08"><tspan x="295.28">A straight path</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="110.08"><tspan x="671.1">An eraser falling straight</tspan><tspan x="671.1" dy="28">down before impact</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">Circular</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="295.28" y="178.07999999999998"><tspan x="295.28">A path around a centre at a fixed</tspan><tspan x="295.28" dy="28">radius</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="178.07999999999998"><tspan x="671.1">One seat on a turning</tspan><tspan x="671.1" dy="28">merry-go-round</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="218" y2="218"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="246.07999999999998"><tspan x="103">Oscillatory</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="295.28" y="246.07999999999998"><tspan x="295.28">To-and-fro motion about a central</tspan><tspan x="295.28" dy="28">position</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="246.07999999999998"><tspan x="671.1">The free end of a vibrating</tspan><tspan x="671.1" dy="28">strip</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="286" y2="286"/><rect class="v2-table-frame" x="89" y="42" width="874" height="244"/><line class="v2-table-rule" x1="281.28" x2="281.28" y1="42" y2="286"/><line class="v2-table-rule" x1="657.1" x2="657.1" y1="42" y2="286"/></g></g>
<g class="v2-reading-block" data-block="periodic-0" transform="translate(0 1214)"><text class="se-copy" x="89" y="24"><tspan x="89">Motion is <tspan class="se-bold">periodic</tspan> when the motion repeats after equal time intervals. A steadily</tspan><tspan x="89" dy="32">turning wheel or a regularly swinging pendulum can be approximately periodic.</tspan></text></g>
<g class="v2-reading-block" data-block="periodic-1" transform="translate(0 1278)"><text class="se-copy" x="89" y="24"><tspan x="89">Circular or to-and-fro motion is not automatically periodic: stopping, changing</tspan><tspan x="89" dy="32">speed irregularly or changing the pattern can destroy the equal-time repetition.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
