<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="pendulum-picture" transform="translate(0 112)"><image class="science-illustration" data-photo="pendulum" href="../../figures/class-6/science/ch05/pendulum.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">A firmly supported pendulum is another way to observe to-and-fro motion. A small</tspan><tspan x="89" dy="27">suspended eraser can serve the same classroom purpose.</tspan></text></g>
<g class="v2-reading-block" data-block="oscillation-0" transform="translate(0 474)"><text class="se-copy" x="89" y="24"><tspan x="89">Movement to and fro about a central position is called <tspan class="se-bold">oscillatory</tspan> <tspan class="se-bold">motion</tspan>. The</tspan><tspan x="89" dy="32">suspended eraser and a playground swing are examples. The path can be curved:</tspan></text></g>
<g class="v2-reading-block" data-block="oscillation-1" transform="translate(0 538)"><text class="se-copy" x="89" y="24"><tspan x="89">an oscillation need not be a straight line. Releasing gently makes the observation</tspan><tspan x="89" dy="32">easier to compare.</tspan></text></g>
<g class="v2-reading-block" data-block="strip-task" transform="translate(0 618)"><rect class="se-activity-panel" x="89" y="0" width="874" height="634" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Ask a teacher to secure one end of a flexible ruler or a smooth-edged</tspan><tspan x="146" dy="32">springy strip on a table, leaving part of it projecting beyond the edge. A</tspan><tspan x="146" dy="32">strip about 50 cm long can be used; an adult must check any metal edges</tspan><tspan x="146" dy="32">first.</tspan></text><text class="se-activity-step" x="132" y="232" text-anchor="end">2.</text><text class="se-copy" x="146" y="232"><tspan x="146">Use a clamp or a stable book stack to hold it firmly. Keep faces away from</tspan><tspan x="146" dy="32">the free end. Press that end down only slightly, then let go.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Observe the free end. Compare its movement with the part held on the</tspan><tspan x="146" dy="32">table. Stop if the support loosens; do not bend the strip sharply.</tspan></text><image class="science-illustration" data-photo="strip" href="../../figures/class-6/science/ch05/strip.png" x="364.75" y="360" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="605.88"><tspan x="113">The fixed portion is held securely; the free end has room to move.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
