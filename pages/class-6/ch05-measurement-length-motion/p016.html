<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204"><tspan x="112">A length measurement needs a number and a unit. Body-based units can differ</tspan><tspan x="112" dy="32">between people; standard units make results comparable.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278"><tspan x="112">The SI base unit of length is the metre (m). The conversions are 1 km = 1000 m,</tspan><tspan x="112" dy="32">1 m = 100 cm and 1 cm = 10 mm.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352"><tspan x="112">Choose a suitable measuring tool. Align clear endpoints, keep the ruler parallel</tspan><tspan x="112" dy="32">to the length and read directly from above.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426"><tspan x="112">When measurement starts at a non-zero mark, subtract the starting reading</tspan><tspan x="112" dy="32">from the ending reading.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500"><tspan x="112">Measure a curved path with a flexible tape or mark a non-stretchy thread along</tspan><tspan x="112" dy="32">it and then measure the thread straight.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574"><tspan x="112">A reference point helps describe position. An object is moving or at rest</tspan><tspan x="112" dy="32">relative to the chosen reference during an observation.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648"><tspan x="112">Straight, circular and to-and-fro paths are described as linear, circular and</tspan><tspan x="112" dy="32">oscillatory motion. Periodic motion also requires repetition at equal time</tspan><tspan x="112" dy="32">intervals.</tspan></text><image class="science-illustration" data-photo="park" href="../../figures/class-6/science/ch05/park.png" x="278.5" y="765" width="495" height="330" preserveAspectRatio="xMidYMid meet"/><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
