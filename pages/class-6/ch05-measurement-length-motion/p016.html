<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="654" rx="18"/><text class="se-copy" x="113" y="222"><tspan x="113"><tspan class="se-bold">Length</tspan> — The extent of an object or</tspan><tspan x="113" dy="32">path between chosen endpoints.</tspan></text><text class="se-copy" x="113" y="306"><tspan x="113"><tspan class="se-bold">Measurement</tspan> — A comparison of a</tspan><tspan x="113" dy="32">quantity with a chosen unit.</tspan></text><text class="se-copy" x="113" y="390"><tspan x="113"><tspan class="se-bold">Unit</tspan> — An agreed amount used for</tspan><tspan x="113" dy="32">comparison.</tspan></text><text class="se-copy" x="113" y="474"><tspan x="113"><tspan class="se-bold">Standard</tspan> <tspan class="se-bold">unit</tspan> — A unit defined</tspan><tspan x="113" dy="32">consistently for different users.</tspan></text><text class="se-copy" x="113" y="558"><tspan x="113"><tspan class="se-bold">Metre</tspan> <tspan class="se-bold">(m)</tspan> — The SI base unit of</tspan><tspan x="113" dy="32">length.</tspan></text><text class="se-copy" x="113" y="642"><tspan x="113"><tspan class="se-bold">Centimetre</tspan> <tspan class="se-bold">(cm)</tspan> — One-hundredth</tspan><tspan x="113" dy="32">of a metre.</tspan></text><text class="se-copy" x="113" y="726"><tspan x="113"><tspan class="se-bold">Millimetre</tspan> <tspan class="se-bold">(mm)</tspan> — One-thousandth</tspan><tspan x="113" dy="32">of a metre; one-tenth of a</tspan><tspan x="113" dy="32">centimetre.</tspan></text><text class="se-copy" x="541" y="222"><tspan x="541"><tspan class="se-bold">Kilometre</tspan> <tspan class="se-bold">(km)</tspan> — A length of 1000</tspan><tspan x="541" dy="32">metres.</tspan></text><text class="se-copy" x="541" y="306"><tspan x="541"><tspan class="se-bold">Reference</tspan> <tspan class="se-bold">point</tspan> — A chosen point</tspan><tspan x="541" dy="32">used to describe a position or its</tspan><tspan x="541" dy="32">change.</tspan></text><text class="se-copy" x="541" y="422"><tspan x="541"><tspan class="se-bold">Motion</tspan> — Change of position with</tspan><tspan x="541" dy="32">time relative to a reference.</tspan></text><text class="se-copy" x="541" y="506"><tspan x="541"><tspan class="se-bold">Linear</tspan> <tspan class="se-bold">motion</tspan> — Motion along a</tspan><tspan x="541" dy="32">straight path.</tspan></text><text class="se-copy" x="541" y="590"><tspan x="541"><tspan class="se-bold">Circular</tspan> <tspan class="se-bold">motion</tspan> — Motion along a</tspan><tspan x="541" dy="32">circular path.</tspan></text><text class="se-copy" x="541" y="674"><tspan x="541"><tspan class="se-bold">Oscillatory</tspan> <tspan class="se-bold">motion</tspan> — To-and-fro</tspan><tspan x="541" dy="32">motion about a central position.</tspan></text><text class="se-copy" x="541" y="758"><tspan x="541"><tspan class="se-bold">Periodic</tspan> <tspan class="se-bold">motion</tspan> — Motion that</tspan><tspan x="541" dy="32">repeats after equal time intervals.</tspan></tex
