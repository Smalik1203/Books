<g class="v2-reading-block" data-block="milestones" transform="translate(0 478)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.29786" data-space-ratio="1.590">On<tspan dx="3.29786"> a</tspan><tspan dx="3.29786"> journey</tspan><tspan dx="3.29786"> towards</tspan><tspan dx="3.29786"> Delhi,</tspan><tspan dx="3.29786"> Padma</tspan><tspan dx="3.29786"> sees</tspan><tspan dx="3.29786"> signs</tspan><tspan dx="3.29786"> reading</tspan><tspan dx="3.29786"> “Delhi</tspan><tspan dx="3.29786"> 70</tspan><tspan dx="3.29786"> km”</tspan><tspan dx="3.29786"> and</tspan><tspan dx="3.29786"> later</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="8.27920" data-space-ratio="2.481">“Delhi<tspan dx="8.27920"> 60</tspan><tspan dx="8.27920"> km”.</tspan><tspan dx="8.27920"> Along</tspan><tspan dx="8.27920"> the</tspan><tspan dx="8.27920"> same</tspan><tspan dx="8.27920"> signed</tspan><tspan dx="8.27920"> route,</tspan><tspan dx="8.27920"> the</tspan><tspan dx="8.27920"> indicated</tspan><tspan dx="8.27920"> distance</tspan><tspan dx="8.27920"> to</tspan><tspan dx="8.27920"> the</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.62797" data-space-ratio="2.006">destination<tspan dx="5.62797"> has</tspan><tspan dx="5.62797"> decreased</tspan><tspan dx="5.62797"> by</tspan><tspan dx="5.62797"> 10</tspan><tspan dx="5.62797"> km.</tspan><tspan dx="5.62797"> The</tspan><tspan dx="5.62797"> distance</tspan><tspan dx="5.62797"> refers</tspan><tspan dx="5.62797"> to</tspan><tspan dx="5.62797"> the</tspan><tspan dx="5.62797"> route</tspan><tspan dx="5.62797"> and</tspan><tspan dx="5.62797"> its</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">chosen endpoint in Delhi—not necessarily to her grandparents’ front door.</tspan></text></g>
<g class="v2-reading-block" data-block="bus-picture" transform="translate(0 622)"><image class="science-illustration" data-photo="bus" href="../../figures/class-6/science/ch05/bus.png" x="121" y="0" width="810" height="540" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="570.88"><tspan x="89">A seated passenger can describe the journey using roadside landmarks or objects inside the</tspan><tspan x="89" dy="27">bus. The choice of reference matters.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
