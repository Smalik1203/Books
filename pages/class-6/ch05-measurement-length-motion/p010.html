<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="moving-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">5.6 Moving Things</tspan></text></g>
<g class="v2-reading-block" data-block="rest-task" transform="translate(0 170)"><rect class="se-activity-panel" x="89" y="0" width="874" height="414" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Observe your surroundings safely from one place. Choose five objects</tspan><tspan x="146" dy="32">that seem to move and five that seem to remain still.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">For each object, name a reference point and observe it at two or more</tspan><tspan x="146" dy="32">times. Do not rely only on whether it appears lively or makes a sound.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Make a notebook table with the headings Object, Reference point,</tspan><tspan x="146" dy="32">Observation over time and Conclusion with reason. A tree trunk and a</tspan><tspan x="146" dy="32">grazing cow can begin your list, but record what you actually observe.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352"><tspan x="146">Compare explanations. Did two people use different reference points, or</tspan><tspan x="146" dy="32">look at different parts of the same object?</tspan></text></g>
<g class="v2-reading-block" data-block="motion-definition-0" transform="translate(0 606)"><text class="se-copy" x="89" y="24"><tspan x="89">An object is in <tspan class="se-bold">motion</tspan> if its position changes with time relative to the chosen</tspan><tspan x="89" dy="32">reference point. It is <tspan class="se-bold">at</tspan> <tspan class="se-bold">rest</tspan> if its position does not change relative to that point</tspan></text></g>
<g class="v2-reading-block" data-block="motion-definition-1" transform="translate(0 670)"><text class="se-copy" x="89" y="24"><tspan x="89">during the observation. Name both the reference and the time interval; “moving”</tspan><tspan x="89" dy="32">is incomplete without that context.</tspan></text></g>
<g class="v2-reading-block" data-block="bus-table" transform="translate(0 750)"><g data-comparison-table="bus-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">One passenger, two reference points</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Reference</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="312.76" y="70.08"><tspan x="312.76">Observation</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="723.54" y="70.08"><tspan x="723.54">Description</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">The passenger’s</tspan><tspan x="103" dy="28">seat</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="110.08"><tspan x="312.76">The seated passenger remains beside</tspan><tspan x="312.76" dy="28">the same parts of the seat.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="723.54" y="110.08"><tspan x="723.54">At rest relative to the</tspan><tspan x="723.54" dy="28">seat.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">A roadside</tspan><tspan x="103" dy="28">building</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="178.07999999999998"><tspan x="312.76">The passenger’s position relative to</tspan><tspan x="312.76" dy="28">the building changes as the bus</tspan><tspan x="312.76" dy="28">travels.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="723.54" y="178.07999999999998"><tspan x="723.54">In motion relative to</tspan><tspan x="723.54" dy="28">the building.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="246" y2="246"/><rect class="v2-table-frame" x="89" y="42" width="874" height="204"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="42" y2="246"/><line class="v2-table-rule" x1="709.54" x2="709.54" y1="42" y2="246"/></g></g>
<g class="v2-reading-block" data-block="parts-0" transform="translate(0 1012)"><text class="se-copy" x="89" y="24"><tspan x="89">A tree trunk may remain in the same place relative to the ground while its leaves</tspan><tspan x="89" dy="32">move in the wind. A grazing cow may move its head without walking. Say which</tspan></text></g>
<g class="v2-reading-block" data-block="parts-1" transform="translate(0 1076)"><text class="se-copy" x="89" y="24"><tspan x="89">object or part you are following, rather than assigning one description carelessly</tspan><tspan x="89" dy="32">to everything in the scene.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
