<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reference" transform="translate(0 112)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.27200" data-space-ratio="1.585">A<tspan dx="3.27200"> <tspan class="se-bold">reference</tspan></tspan><tspan dx="3.27200"> <tspan class="se-bold">point</tspan></tspan><tspan dx="3.27200"> is</tspan><tspan dx="3.27200"> a</tspan><tspan dx="3.27200"> chosen</tspan><tspan dx="3.27200"> point</tspan><tspan dx="3.27200"> used</tspan><tspan dx="3.27200"> to</tspan><tspan dx="3.27200"> describe</tspan><tspan dx="3.27200"> a</tspan><tspan dx="3.27200"> position</tspan><tspan dx="3.27200"> or</tspan><tspan dx="3.27200"> a</tspan><tspan dx="3.27200"> change</tspan><tspan dx="3.27200"> in</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.99124" data-space-ratio="1.714">position.<tspan dx="3.99124"> Using</tspan><tspan dx="3.99124"> the</tspan><tspan dx="3.99124"> same</tspan><tspan dx="3.99124"> reference</tspan><tspan dx="3.99124"> point</tspan><tspan dx="3.99124"> makes</tspan><tspan dx="3.99124"> statements</tspan><tspan dx="3.99124"> easier</tspan><tspan dx="3.99124"> to</tspan><tspan dx="3.99124"> compare.</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.80159" data-space-ratio="1.501">On<tspan dx="2.80159"> this</tspan><tspan dx="2.80159"> road,</tspan><tspan dx="2.80159"> the</tspan><tspan dx="2.80159"> school</tspan><tspan dx="2.80159"> is</tspan><tspan dx="2.80159"> at</tspan><tspan dx="2.80159"> 3</tspan><tspan dx="2.80159"> km</tspan><tspan dx="2.80159"> and</tspan><tspan dx="2.80159"> the</tspan><tspan dx="2.80159"> garden</tspan><tspan dx="2.80159"> at</tspan><tspan dx="2.80159"> 5</tspan><tspan dx="2.80159"> km</tspan><tspan dx="2.80159"> from</tspan><tspan dx="2.80159"> the</tspan><tspan dx="2.80159"> bus</tspan><tspan dx="2.80159"> stand,</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">whichever pupil describes them.</tspan></text></g>
<g class="v2-reading-block" data-block="direction" transform="translate(0 256)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.88968" data-space-ratio="1.696">Distance<tspan dx="3.88968"> alone</tspan><tspan dx="3.88968"> may</tspan><tspan dx="3.88968"> not</tspan><tspan dx="3.88968"> locate</tspan><tspan dx="3.88968"> a</tspan><tspan dx="3.88968"> place:</tspan><tspan dx="3.88968"> two</tspan><tspan dx="3.88968"> places</tspan><tspan dx="3.88968"> can</tspan><tspan dx="3.88968"> be</tspan><tspan dx="3.88968"> equally</tspan><tspan dx="3.88968"> far</tspan><tspan dx="3.88968"> from</tspan><tspan dx="3.88968"> the</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.37225" data-space-ratio="1.961">same<tspan dx="5.37225"> point</tspan><tspan dx="5.37225"> in</tspan><tspan dx="5.37225"> different</tspan><tspan dx="5.37225"> directions.</tspan><tspan dx="5.37225"> Give</tspan><tspan dx="5.37225"> a</tspan><tspan dx="5.37225"> direction,</tspan><tspan dx="5.37225"> a</tspan><tspan dx="5.37225"> route</tspan><tspan dx="5.37225"> or</tspan><tspan dx="5.37225"> another</tspan><tspan dx="5.37225"> detail</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.59849" data-space-ratio="1.822">when<tspan dx="4.59849"> it</tspan><tspan dx="4.59849"> is</tspan><tspan dx="4.59849"> needed.</tspan><tspan dx="4.59849"> “Two</tspan><tspan dx="4.59849"> metres</tspan><tspan dx="4.59849"> to</tspan><tspan dx="4.59849"> the</tspan><tspan dx="4.59849"> right</tspan><tspan dx="4.59849"> of</tspan><tspan dx="4.59849"> the</tspan><tspan dx="4.59849"> door”</tspan><tspan dx="4.59849"> is</tspan><tspan dx="4.59849"> clearer</tspan><tspan dx="4.59849"> than</tspan><tspan dx="4.59849"> “two</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">metres from the door”.</tspan></text></g>
<g class="v2-reading-block" data-block="court" transform="translate(0 400)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.38143" data-space-ratio="1.426">When<tspan dx="2.38143"> marking</tspan><tspan dx="2.38143"> a</tspan><tspan dx="2.38143"> kabaddi</tspan><tspan dx="2.38143"> court,</tspan><tspan dx="2.38143"> choose</tspan><tspan dx="2.38143"> a</tspan><tspan dx="2.38143"> fixed</tspan><tspan dx="2.38143"> starting</tspan><tspan dx="2.38143"> corner,</tspan><tspan dx="2.38143"> measure</tspan><tspan dx="2.38143"> from</tspan><tspan dx="2.38143"> it</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.94443" data-space-ratio="1.527">and<tspan dx="2.94443"> establish</tspan><tspan dx="2.94443"> the</tspan><tspan dx="2.94443"> required</tspan><tspan dx="2.94443"> directions.</tspan><tspan dx="2.94443"> Use</tspan><tspan dx="2.94443"> the</tspan><tspan dx="2.94443"> same</tspan><tspan dx="2.94443"> starting</tspan><tspan dx="2.94443"> point</tspan><tspan dx="2.94443"> and</tspan><tspan dx="2.94443"> keep</tspan><tspan dx="2.94443"> the</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.97717" data-space-ratio="1.354">measuring<tspan dx="1.97717"> tape</tspan><tspan dx="1.97717"> straight.</tspan><tspan dx="1.97717"> A</tspan><tspan dx="1.97717"> teacher</tspan><tspan dx="1.97717"> can</tspan><tspan dx="1.97717"> guide</tspan><tspan dx="1.97717"> the</tspan><tspan dx="1.97717"> marking</tspan><tspan dx="1.97717"> with</tspan><tspan dx="1.97717"> safe</tspan><tspan dx="1.97717"> chalk;</tspan><tspan dx="1.97717"> avoid</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">raising clouds of loose powder.</tspan></text></g>
<g class="v2-reading-block" data-block="court-picture" transform="translate(0 544)"><g data-instructional-figure="court"><g class="v2-measure-diagram" data-diagram="court"><rect class="v2-measure-court" x="250" y="45" width="580" height="175" rx="4"/><line class="v2-measure-line " x1="540" y1="45" x2="540" y2="220"/><circle class="v2-measure-dot" cx="250" cy="220" r="6"/><text class="v2-measure-label" x="225" y="276" text-anchor="middle">Reference corner</text><path class="v2-measure-arrow" d="M279 242L816 242M807.2241743810963 246.79425538604204L816 242L807.2241743810963 237.20574461395796"/><path class="v2-measure-arrow" d="M221 215L221 56M225.79425538604204 64.77582561890372L221 56L216.20574461395796 64.77582561890372"/><text class="v2-measure-label" x="540" y="280" text-anchor="middle">Length</text><text class="v2-measure-label" x="151" y="139" text-anchor="middle">Width</text><path class="v2-measure-line" d="M250 194H276V220"/></g></g><text text-anchor="middle" class="se-caption" x="526" y="310.88"><tspan x="526">A fixed corner and two perpendicular directions organise a rectangular layout. Use the</tspan><tspan x="526" dy="27">dimensions your teacher gives; this sketch is not an official court plan.</tspan></text></g>
<g class="v2-reading-block" data-block="milestones-paired" transform="translate(0 910)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">On a journey towards Delhi, Padma sees</tspan><tspan x="89" dy="32" data-narrow-prose="true">signs reading “Delhi 70 km” and later “Delhi</tspan><tspan x="89" dy="32" data-narrow-prose="true">60 km”. Along the same signed route, the</tspan><tspan x="89" dy="32" data-narrow-prose="true">indicated distance to the destination has</tspan><tspan x="89" dy="32" data-narrow-prose="true">decreased by 10 km. The distance refers to</tspan><tspan x="89" dy="32" data-narrow-prose="true">the route and its chosen endpoint in</tspan><tspan x="89" dy="32" data-narrow-prose="true">Delhi—not necessarily to her grandparents’</tspan><tspan x="89" dy="32" data-paragraph-end="true">front door.</tspan></text><image class="science-illustration" data-photo="bus" href="../../figures/class-6/science/ch05/bus.png" x="617" y="0" width="342" height="228" preserveAspectRatio="xMidYMid meet"/><text text-anchor="middle" class="se-caption" x="788" y="264.88"><tspan x="788">A seated passenger can describe the</tspan><tspan x="788" dy="27">journey using roadside landmarks or</tspan><tspan x="788" dy="27">objects inside the bus. The choice of</tspan><tspan x="788" dy="27">reference matters.</tspan></text></g><g data-page-review="milestones-paired"><text class="se-copy" x="89" y="1316" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.79436" data-space-ratio="2.036">A<tspan dx="5.79436"> route</tspan><tspan dx="5.79436"> distance</tspan><tspan dx="5.79436"> follows</tspan><tspan dx="5.79436"> the</tspan><tspan dx="5.79436"> road,</tspan><tspan dx="5.79436"> including</tspan><tspan dx="5.79436"> its</tspan><tspan dx="5.79436"> bends.</tspan><tspan dx="5.79436"> It</tspan><tspan dx="5.79436"> need</tspan><tspan dx="5.79436"> not</tspan><tspan dx="5.79436"> equal</tspan><tspan dx="5.79436"> the</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.41950" data-space-ratio="1.611">straight<tspan dx="3.41950"> distance</tspan><tspan dx="3.41950"> between</tspan><tspan dx="3.41950"> the</tspan><tspan dx="3.41950"> two</tspan><tspan dx="3.41950"> places.</tspan><tspan dx="3.41950"> State</tspan><tspan dx="3.41950"> which</tspan><tspan dx="3.41950"> distance</tspan><tspan dx="3.41950"> you</tspan><tspan dx="3.41950"> mean</tspan><tspan dx="3.41950"> when</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">comparing journeys.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
