<text class="chapter-opener__title" x="284" y="156" text-anchor="start">Measurement of</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">Length and Motion</text><image class="science-illustration chapter-opener__image" href="../../figures/class-6/science/ch05/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Deepa and her mother watching a tailor measure cloth</title></image></g><text class="se-copy v2-intro" x="89" y="981"><tspan x="89">A shopkeeper measures cloth with a rod. A tailor uses a flexible tape.</tspan><tspan x="89" dy="34">Why do they choose different tools?</tspan></text><text class="se-copy" x="89" y="1067"><tspan x="89">Deepa, an eleven-year-old from Haryana, needs a new school uniform because</tspan><tspan x="89" dy="32">she has grown taller. Her mother asks for two metres of cloth, then asks the tailor</tspan><tspan x="89" dy="32">to leave an extra char angula—four fingers’ width—in the length.</tspan></text><text class="se-copy" x="89" y="1179"><tspan x="89">Deepa takes these questions to her friends. What makes a measurement reliable?</tspan><tspan x="89" dy="32">How can we describe a place, or decide whether something is moving? Begin</tspan><tspan x="89" dy="32">with familiar objects, then use a common unit and a clear reference point to</tspan><tspan x="89" dy="32">compare observations.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
