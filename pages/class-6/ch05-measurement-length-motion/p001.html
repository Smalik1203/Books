<text class="chapter-opener__title" x="284" y="156" text-anchor="start">Measurement of</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">Length and Motion</text><image class="science-illustration chapter-opener__image" href="../../figures/class-6/science/ch05/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Deepa and her mother watching a tailor measure cloth</title></image></g><text class="se-copy v2-intro" x="89" y="981" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.56399" data-extra-space="4.45550" data-space-ratio="1.801">A<tspan dx="4.45550"> shopkeeper</tspan><tspan dx="4.45550"> measures</tspan><tspan dx="4.45550"> cloth</tspan><tspan dx="4.45550"> with</tspan><tspan dx="4.45550"> a</tspan><tspan dx="4.45550"> rod.</tspan><tspan dx="4.45550"> A</tspan><tspan dx="4.45550"> tailor</tspan><tspan dx="4.45550"> uses</tspan><tspan dx="4.45550"> a</tspan><tspan dx="4.45550"> flexible</tspan><tspan dx="4.45550"> tape.</tspan></tspan><tspan x="89" dy="34" data-paragraph-end="true">Why do they choose different tools?</tspan></text><text class="se-copy" x="89" y="1067" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.61386" data-space-ratio="1.646">Deepa,<tspan dx="3.61386"> an</tspan><tspan dx="3.61386"> eleven-year-old</tspan><tspan dx="3.61386"> from</tspan><tspan dx="3.61386"> Haryana,</tspan><tspan dx="3.61386"> needs</tspan><tspan dx="3.61386"> a</tspan><tspan dx="3.61386"> new</tspan><tspan dx="3.61386"> school</tspan><tspan dx="3.61386"> uniform</tspan><tspan dx="3.61386"> because</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.31347" data-space-ratio="1.056">she<tspan dx="0.31347"> has</tspan><tspan dx="0.31347"> grown</tspan><tspan dx="0.31347"> taller.</tspan><tspan dx="0.31347"> Her</tspan><tspan dx="0.31347"> mother</tspan><tspan dx="0.31347"> asks</tspan><tspan dx="0.31347"> for</tspan><tspan dx="0.31347"> two</tspan><tspan dx="0.31347"> metres</tspan><tspan dx="0.31347"> of</tspan><tspan dx="0.31347"> cloth,</tspan><tspan dx="0.31347"> then</tspan><tspan dx="0.31347"> asks</tspan><tspan dx="0.31347"> the</tspan><tspan dx="0.31347"> tailor</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">to leave an extra char angula—four fingers’ width—in the length.</tspan></text><text class="se-copy" x="89" y="1179" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.96956" data-space-ratio="1.173">Deepa<tspan dx="0.96956"> takes</tspan><tspan dx="0.96956"> these</tspan><tspan dx="0.96956"> questions</tspan><tspan dx="0.96956"> to</tspan><tspan dx="0.96956"> her</tspan><tspan dx="0.96956"> friends.</tspan><tspan dx="0.96956"> What</tspan><tspan dx="0.96956"> makes</tspan><tspan dx="0.96956"> a</tspan><tspan dx="0.96956"> measurement</tspan><tspan dx="0.96956"> reliable?</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.53965" data-space-ratio="1.812">How<tspan dx="4.53965"> can</tspan><tspan dx="4.53965"> we</tspan><tspan dx="4.53965"> describe</tspan><tspan dx="4.53965"> a</tspan><tspan dx="4.53965"> place,</tspan><tspan dx="4.53965"> or</tspan><tspan dx="4.53965"> decide</tspan><tspan dx="4.53965"> whether</tspan><tspan dx="4.53965"> something</tspan><tspan dx="4.53965"> is</tspan><tspan dx="4.53965"> moving?</tspan><tspan dx="4.53965"> Begin</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.80532" data-space-ratio="1.859">with<tspan dx="4.80532"> familiar</tspan><tspan dx="4.80532"> objects,</tspan><tspan dx="4.80532"> then</tspan><tspan dx="4.80532"> use</tspan><tspan dx="4.80532"> a</tspan><tspan dx="4.80532"> common</tspan><tspan dx="4.80532"> unit</tspan><tspan dx="4.80532"> and</tspan><tspan dx="4.80532"> a</tspan><tspan dx="4.80532"> clear</tspan><tspan dx="4.80532"> reference</tspan><tspan dx="4.80532"> point</tspan><tspan dx="4.80532"> to</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">compare observations.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
