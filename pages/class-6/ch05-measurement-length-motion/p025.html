<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="25" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 25"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project5" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Keep a private height record</tspan></text><text class="se-copy" x="89" y="72" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.11338" data-space-ratio="1.557">Stand<tspan dx="3.11338"> safely</tspan><tspan dx="3.11338"> against</tspan><tspan dx="3.11338"> a</tspan><tspan dx="3.11338"> wall</tspan><tspan dx="3.11338"> while</tspan><tspan dx="3.11338"> an</tspan><tspan dx="3.11338"> adult</tspan><tspan dx="3.11338"> uses</tspan><tspan dx="3.11338"> a</tspan><tspan dx="3.11338"> flat</tspan><tspan dx="3.11338"> book</tspan><tspan dx="3.11338"> to</tspan><tspan dx="3.11338"> mark</tspan><tspan dx="3.11338"> your</tspan><tspan dx="3.11338"> height.</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.84762" data-space-ratio="1.688">Record<tspan dx="3.84762"> the</tspan><tspan dx="3.84762"> date,</tspan><tspan dx="3.84762"> unit</tspan><tspan dx="3.84762"> and</tspan><tspan dx="3.84762"> method.</tspan><tspan dx="3.84762"> Repeat</tspan><tspan dx="3.84762"> about</tspan><tspan dx="3.84762"> every</tspan><tspan dx="3.84762"> three</tspan><tspan dx="3.84762"> months</tspan><tspan dx="3.84762"> using</tspan><tspan dx="3.84762"> the</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.39610" data-space-ratio="1.071">same<tspan dx="0.39610"> method</tspan><tspan dx="0.39610"> and</tspan><tspan dx="0.39610"> similar</tspan><tspan dx="0.39610"> conditions.</tspan><tspan dx="0.39610"> Keep</tspan><tspan dx="0.39610"> your</tspan><tspan dx="0.39610"> own</tspan><tspan dx="0.39610"> record</tspan><tspan dx="0.39610"> private</tspan><tspan dx="0.39610"> and</tspan><tspan dx="0.39610"> include</tspan><tspan dx="0.39610"> a</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.53823" data-space-ratio="1.275">sibling<tspan dx="1.53823"> only</tspan><tspan dx="1.53823"> with</tspan><tspan dx="1.53823"> permission.</tspan><tspan dx="1.53823"> Small</tspan><tspan dx="1.53823"> apparent</tspan><tspan dx="1.53823"> differences</tspan><tspan dx="1.53823"> can</tspan><tspan dx="1.53823"> come</tspan><tspan dx="1.53823"> from</tspan><tspan dx="1.53823"> posture</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">or measurement, so check the method before drawing a conclusion.</tspan></text><image class="science-illustration" data-photo="review-project5" href="../../figures/class-7/science/review/growth-variation.png" x="276" y="264.0252143217347" width="500.00000000000006" height="199.94957135653053" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="534.88"><tspan x="89">A useful comparison keeps the method consistent across measurements.</tspan></text></g>
<g class="v2-reading-block" data-block="project6" transform="translate(0 677)"><text class="se-heading" x="89" y="30"><tspan x="89">Count wheel turns to estimate distance</tspan></text><text class="se-copy" x="89" y="72" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.52511" data-space-ratio="1.273">With<tspan dx="1.52511"> an</tspan><tspan dx="1.52511"> adult,</tspan><tspan dx="1.52511"> mark</tspan><tspan dx="1.52511"> a</tspan><tspan dx="1.52511"> bicycle</tspan><tspan dx="1.52511"> tyre</tspan><tspan dx="1.52511"> with</tspan><tspan dx="1.52511"> chalk</tspan><tspan dx="1.52511"> and</tspan><tspan dx="1.52511"> measure</tspan><tspan dx="1.52511"> the</tspan><tspan dx="1.52511"> distance</tspan><tspan dx="1.52511"> rolled</tspan><tspan dx="1.52511"> in</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="6.61732" data-space-ratio="2.183">one<tspan dx="6.61732"> complete</tspan><tspan dx="6.61732"> turn</tspan><tspan dx="6.61732"> on</tspan><tspan dx="6.61732"> level</tspan><tspan dx="6.61732"> ground.</tspan><tspan dx="6.61732"> Walk</tspan><tspan dx="6.61732"> the</tspan><tspan dx="6.61732"> bicycle</tspan><tspan dx="6.61732"> slowly</tspan><tspan dx="6.61732"> through</tspan><tspan dx="6.61732"> several</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.31592" data-space-ratio="1.235">complete<tspan dx="1.31592"> turns,</tspan><tspan dx="1.31592"> counting</tspan><tspan dx="1.31592"> the</tspan><tspan dx="1.31592"> mark’s</tspan><tspan dx="1.31592"> returns,</tspan><tspan dx="1.31592"> then</tspan><tspan dx="1.31592"> multiply</tspan><tspan dx="1.31592"> turns</tspan><tspan dx="1.31592"> by</tspan><tspan dx="1.31592"> distance</tspan><tspan dx="1.31592"> per</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.22427" data-space-ratio="1.755">turn.<tspan dx="4.22427"> Compare</tspan><tspan dx="4.22427"> with</tspan><tspan dx="4.22427"> a</tspan><tspan dx="4.22427"> tape</tspan><tspan dx="4.22427"> measurement.</tspan><tspan dx="4.22427"> Do</tspan><tspan dx="4.22427"> not</tspan><tspan dx="4.22427"> attach</tspan><tspan dx="4.22427"> a</tspan><tspan dx="4.22427"> metal</tspan><tspan dx="4.22427"> strip</tspan><tspan dx="4.22427"> or</tspan><tspan dx="4.22427"> loose</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="7.40645" data-space-ratio="2.324">object<tspan dx="7.40645"> to</tspan><tspan dx="7.40645"> the</tspan><tspan dx="7.40645"> spokes</tspan><tspan dx="7.40645"> or</tspan><tspan dx="7.40645"> frame.</tspan><tspan dx="7.40645"> Discuss</tspan><tspan dx="7.40645"> slipping,</tspan><tspan dx="7.40645"> steering</tspan><tspan dx="7.40645"> and</tspan><tspan dx="7.40645"> tyre</tspan><tspan dx="7.40645"> pressure.</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.33305" data-space-ratio="1.417">Professional<tspan dx="2.33305"> road-course</tspan><tspan dx="2.33305"> measurers</tspan><tspan dx="2.33305"> use</tspan><tspan dx="2.33305"> calibrated</tspan><tspan dx="2.33305"> bicycles</tspan><tspan dx="2.33305"> with</tspan><tspan dx="2.33305"> devices</tspan><tspan dx="2.33305"> such</tspan><tspan dx="2.33305"> as</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">a Jones Counter; their procedure includes checks before and after measuring.</tspan></text><g transform="translate(0 288)"><g data-instructional-figure="wheel"><g class="v2-measure-diagram" data-diagram="wheel"><circle class="v2-measure-tyre" cx="322" cy="131" r="104"/><circle class="v2-measure-rim" cx="322" cy="131" r="92"/><circle class="v2-measure-ball" cx="322" cy="131" r="12"/><line class="v2-measure-line " x1="337" y1="131" x2="413" y2="131"/><line class="v2-measure-line " x1="334.99038105
