<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="divisions-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">one-tenth of a centimetre. Count the spaces between marks, not just the marks</tspan><tspan x="89" dy="32">themselves.</tspan></text></g>
<g class="v2-reading-block" data-block="units-table" transform="translate(0 192)"><g data-comparison-table="units-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Choose a convenient unit</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Unit</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="277.8" y="70.08"><tspan x="277.8">Symbol</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="391.42" y="70.08"><tspan x="391.42">Relationship</tspan></text></g><g data-comparison-cell="3"><text class="v2-table-heading" x="636.1400000000001" y="70.08"><tspan x="636.1400000000001">A useful scale of length</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">kilometre</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="277.8" y="110.08"><tspan x="277.8">km</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="391.42" y="110.08"><tspan x="391.42">1 km = 1000 m</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="636.1400000000001" y="110.08"><tspan x="636.1400000000001">Distance between towns</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="122" y2="122"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="150.07999999999998"><tspan x="103">metre</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="277.8" y="150.07999999999998"><tspan x="277.8">m</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="391.42" y="150.07999999999998"><tspan x="391.42">1 m = 100 cm</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="636.1400000000001" y="150.07999999999998"><tspan x="636.1400000000001">Length of a room</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="162" y2="162"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="190.07999999999998"><tspan x="103">centimetre</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="277.8" y="190.07999999999998"><tspan x="277.8">cm</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="391.42" y="190.07999999999998"><tspan x="391.42">1 cm = 10 mm</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="636.1400000000001" y="190.07999999999998"><tspan x="636.1400000000001">Length of an eraser</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="202" y2="202"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="230.07999999999998"><tspan x="103">millimetre</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="277.8" y="230.07999999999998"><tspan x="277.8">mm</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="391.42" y="230.07999999999998"><tspan x="391.42">1 mm = 0.1 cm</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="636.1400000000001" y="230.07999999999998"><tspan x="636.1400000000001">Thickness of a coin</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="242" y2="242"/><rect class="v2-table-frame" x="89" y="42" width="874" height="200"/><line class="v2-table-rule" x1="263.8" x2="263.8" y1="42" y2="242"/><line class="v2-table-rule" x1="377.42" x2="377.42" y1="42" y2="242"/><line class="v2-table-rule" x1="622.1400000000001" x2="622.1400000000001" y1="42" y2="242"/><text class="v2-table-note" x="89" y="274.88"><tspan x="89">The choice of unit changes the number you write, not the actual length.</tspan></text></g></g>
<g class="v2-reading-block" data-block="least-division-0" transform="translate(0 488)"><text class="se-copy" x="89" y="24"><tspan x="89">The smallest marked interval on the illustrated ruler is 1 mm. That tells you the</tspan><tspan x="89" dy="32">ruler’s graduation, not a guarantee that every measurement is exact to 1 mm. A</tspan></text></g>
<g class="v2-reading-block" data-block="least-division-1" transform="translate(0 552)"><text class="se-copy" x="89" y="24"><tspan x="89">fuzzy endpoint, a bent ruler or a slanting view can make the reading uncertain.</tspan><tspan x="89" dy="32">Very thin paper may need a different method.</tspan></text></g>
<g class="v2-reading-block" data-block="other-units-0" transform="translate(0 632)"><text class="se-copy" x="89" y="24"><tspan x="89">Some rulers also have an inch scale. One inch equals exactly 2.54 cm. Inches and</tspan><tspan x="89" dy="32">feet remain in use in some settings, but do not mix readings from the two sides of</tspan><tspan x="89" dy="32">a ruler. Check the unit before comparing two numbers.</tspan></text></g>
<g class="v2-reading-block" data-block="unit-writing-0" transform="translate(0 744)"><text class="se-copy" x="89" y="24"><tspan x="89">Write the symbols <tspan class="se-bold">km,</tspan> <tspan class="se-bold">m,</tspan> <tspan class="se-bold">cm</tspan> <tspan class="se-bold">and</tspan> <tspan class="se-bold">mm</tspan> in lowercase, with a space between the</tspan><tspan x="89" dy="32">number and symbol: for example, 12 cm. Do not add s to a symbol for the plural,</tspan></text></g>
<g class="v2-reading-block" data-block="unit-writing-1" transform="translate(0 808)"><text class="se-copy" x="89" y="24"><tspan x="89">and do not add a full stop unless it ends the sentence. Unit names normally begin</tspan><tspan x="89" dy="32">with a lowercase letter, except at the start of a sentence.</tspan></text></g>
<g class="v2-reading-block" data-block="units-think" transform="translate(0 888)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="218" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Two pupils report the same length as 125 cm and 1.25 m. Have they</tspan><tspan x="113" dy="32">disagreed? Explain what must be checked before comparing the numbers.</tspan><tspan x="113" dy="32">Then explain why kilometres are a convenient choice for the distance</tspan><tspan x="113" dy="32">between cities, although that distance can also be written in metres.</tspan></text></g><g transform="translate(0 1128)"><g data-page-illustration="figures/class-6/science/ch05/pencil.png"><image class="science-illustration" href="../../figures/class-6/science/ch05/pencil.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A pencil.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A pencil.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
