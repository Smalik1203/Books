<g class="v2-reading-block" data-block="broken-head" transform="translate(0 679)"><text class="se-heading" x="89" y="30"><tspan x="89">When zero cannot be used</tspan></text></g>
<g class="v2-reading-block" data-block="broken-rule-0" transform="translate(0 727)"><text class="se-copy" x="89" y="24"><tspan x="89">A ruler with a worn zero or a damaged end may still be useful if the remaining</tspan><tspan x="89" dy="32">graduations are clear and the ruler is straight. Start at another clear mark. Read</tspan></text></g>
