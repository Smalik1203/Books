<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="method-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">5.3 Measuring Length Correctly</tspan></text></g>
<g class="v2-reading-block" data-block="tool-choice-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Choose a tool that can follow the length you need. A short rigid ruler suits a</tspan><tspan x="89" dy="32">pencil. A longer tape suits a room or a sports ground. A flexible tape can follow a</tspan></text></g>
<g class="v2-reading-block" data-block="tool-choice-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">curved surface, such as the girth of a tree; a rigid metre rod cannot wrap around</tspan><tspan x="89" dy="32">it.</tspan></text></g>
<g class="v2-reading-block" data-block="tape-picture" transform="translate(0 314)"><image class="science-illustration" data-photo="tape" href="../../figures/class-6/science/ch05/tape.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">A flexible tape follows a curved surface. Keep it in contact without stretching it or pulling it</tspan><tspan x="89" dy="27">tight enough to compress the object.</tspan></text></g>
<g class="v2-reading-block" data-block="alignment-0" transform="translate(0 676)"><text class="se-copy" x="89" y="24"><tspan x="89">Place the ruler alongside the object, in contact with it, with the scale parallel to</tspan><tspan x="89" dy="32">the length being measured. Align the object’s first endpoint with the <tspan class="se-bold">zero</tspan> <tspan class="se-bold">mark</tspan>,</tspan></text></g>
<g class="v2-reading-block" data-block="alignment-1" transform="translate(0 740)"><text class="se-copy" x="89" y="24"><tspan x="89">not automatically with the physical edge of the ruler. A margin may lie before</tspan><tspan x="89" dy="32">zero.</tspan></text></g>
