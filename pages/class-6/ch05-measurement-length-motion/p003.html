<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="handspan-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">The table has not changed length. Different-sized handspans can give different</tspan><tspan x="89" dy="32">counts: a smaller handspan usually fits more times along the same edge.</tspan></text></g>
<g class="v2-reading-block" data-block="handspan-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">Inconsistent placement can add another difference. Compare both the size of the</tspan><tspan x="89" dy="32">chosen unit and how it was placed.</tspan></text></g>
<g class="v2-reading-block" data-block="unit-definition-0" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">To <tspan class="se-bold">measure</tspan> <tspan class="se-bold">a</tspan> <tspan class="se-bold">length</tspan>, we compare it with an agreed length called a <tspan class="se-bold">unit</tspan>. A</tspan><tspan x="89" dy="32">measurement needs a number and a unit. In “13 handspans”, 13 is the number</tspan></text></g>
<g class="v2-reading-block" data-block="unit-definition-1" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89">and handspan is the unit. A number alone does not tell another person how long</tspan><tspan x="89" dy="32">the table is.</tspan></text></g>
<g class="v2-reading-block" data-block="history-0" transform="translate(0 400)"><text class="se-copy" x="89" y="24"><tspan x="89">Angula (finger width), dhanusa and yojana occur in historical Indian</tspan><tspan x="89" dy="32">measurement traditions. Traditional craftspeople still use some body-based</tspan></text></g>
<g class="v2-reading-block" data-block="history-1" transform="translate(0 464)"><text class="se-copy" x="89" y="24"><tspan x="89">measures. Objects with ruled markings have been excavated at Harappan sites. A</tspan><tspan x="89" dy="32">named historical unit did not necessarily have exactly the same value in every</tspan><tspan x="89" dy="32">period or region.</tspan></text></g>
<g class="v2-reading-block" data-block="standard-head" transform="translate(0 588)"><text class="v2-title" x="89" y="38"><tspan x="89">5.2 Standard Units</tspan></text></g>
<g class="v2-reading-block" data-block="standard-definition-0" transform="translate(0 646)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">standard</tspan> <tspan class="se-bold">unit</tspan> is defined so that different people can use the same length for</tspan><tspan x="89" dy="32">comparison. Countries use the <tspan class="se-bold">International</tspan> <tspan class="se-bold">System</tspan> <tspan class="se-bold">of</tspan> <tspan class="se-bold">Units</tspan>, abbreviated <tspan class="se-bold">SI</tspan>.</tspan></text></g>
<g class="v2-reading-block" data-block="standard-definition-1" transform="translate(0 710)"><text class="se-copy" x="89" y="24"><tspan x="89">The SI base unit of length is the <tspan class="se-bold">metre</tspan>, whose symbol is <tspan class="se-bold">m</tspan>. A standard unit</tspan><tspan x="89" dy="32">makes results comparable; careful use of the measuring tool still matters.</tspan></text></g>
