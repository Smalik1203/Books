<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="circle-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="306" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">A teacher ties a small soft foam ball securely to a short thread and checks</tspan><tspan x="146" dy="32">the knot. Keep a wide clear space around the demonstration.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">The teacher moves the ball slowly around a circle, below shoulder height.</tspan><tspan x="146" dy="32">Learners watch from outside the reach of the thread; nobody lets go.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Sketch the path and compare it with the path of one seat on a turning</tspan><tspan x="146" dy="32">merry-go-round. Explain what is similar and what is different.</tspan></text></g>
<g class="v2-reading-block" data-block="circle-evidence-0" transform="translate(0 440)"><text class="se-copy" x="89" y="24"><tspan x="89">An object following a circular path has <tspan class="se-bold">circular</tspan> <tspan class="se-bold">motion</tspan>. A seat on a</tspan><tspan x="89" dy="32">merry-go-round travels around its centre. A point on a rotating fan blade also</tspan></text></g>
<g class="v2-reading-block" data-block="circle-evidence-1" transform="translate(0 504)"><text class="se-copy" x="89" y="24"><tspan x="89">follows a circle. Always identify the point or part being observed: the centre and</tspan><tspan x="89" dy="32">the blade tip do not follow the same path.</tspan></text></g>
<g class="v2-reading-block" data-block="paths-picture" transform="translate(0 584)"><g data-instructional-figure="paths"><g class="v2-measure-diagram" data-diagram="paths"><svg class="science-illustration" data-art="bus" x="155" y="8" width="240" height="160" viewBox="0 0 1536 1024" overflow="hidden"><image href="../../figures/class-6/science/ch05/bus.png" x="0" y="0" width="1536" height="1024" preserveAspectRatio="xMidYMid meet"/></svg><path class="v2-measure-arrow" d="M139 189L437 189M428.22417438109625 193.79425538604204L437 189L428.22417438109625 184.20574461395796"/><text class="v2-measure-label" x="289" y="230" text-anchor="middle">Straight path</text><circle class="v2-measure-orbit" cx="750" cy="110" r="87"/><circle class="v2-measure-dot" cx="750" cy="110" r="4"/><circle class="v2-measure-ball" cx="837" cy="110" r="14"/><path class="v2-measure-arrow" d="M815 57L833 88M824.447327197283 82.81812891614766L833 88L832.7393653274331 78.00339709864116"/><text class="v2-measure-label" x="750" y="230" text-anchor="middle">Circular path</text></g></g><text class="se-caption" x="89" y="270.88"><tspan x="89">A straight path and a circular path describe different changes of position. The arrows show</tspan><tspan x="89" dy="27">direction, not how fast the object moves.</tspan></text></g>
<g class="v2-reading-block" data-block="swing-task" transform="translate(0 910)"><rect class="se-activity-panel" x="89" y="0" width="874" height="338" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Tie a small eraser securely to a thread. Hold the other end still, or have a</tspan><tspan x="146" dy="32">teacher secure it to a firm support. Leave clear space below and around it.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Move the eraser a small distance to one side and release it without</tspan><tspan x="146" dy="32">pushing. Watch until the motion becomes small.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Sketch its positions on either side of the central resting position.</tspan><tspan x="146" dy="32">Compare its path with a swing, and note whether it travels all the way</tspan><tspan x="146" dy="32">around a circle.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
