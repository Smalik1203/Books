<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="direction-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Distance alone may not locate a place: two places can be equally far from the</tspan><tspan x="89" dy="32">same point in different directions. Give a direction, a route or another detail</tspan></text></g>
<g class="v2-reading-block" data-block="direction-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">when it is needed. “Two metres to the right of the door” is clearer than “two</tspan><tspan x="89" dy="32">metres from the door”.</tspan></text></g>
<g class="v2-reading-block" data-block="court-0" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">When marking a kabaddi court, choose a fixed starting corner, measure from it</tspan><tspan x="89" dy="32">and establish the required directions. Use the same starting point and keep the</tspan></text></g>
<g class="v2-reading-block" data-block="court-1" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89">measuring tape straight. A teacher can guide the marking with safe chalk; avoid</tspan><tspan x="89" dy="32">raising clouds of loose powder.</tspan></text></g>
<g class="v2-reading-block" data-block="court-picture" transform="translate(0 400)"><g class="v2-measure-diagram" data-diagram="court"><rect class="v2-measure-court" x="250" y="45" width="580" height="175" rx="4"/><line class="v2-measure-line " x1="540" y1="45" x2="540" y2="220"/><circle class="v2-measure-dot" cx="250" cy="220" r="6"/><text class="v2-measure-label" x="225" y="276" text-anchor="middle">Reference corner</text><path class="v2-measure-arrow" d="M279 242L816 242M807.2241743810963 246.79425538604204L816 242L807.2241743810963 237.20574461395796"/><path class="v2-measure-arrow" d="M221 215L221 56M225.79425538604204 64.77582561890372L221 56L216.20574461395796 64.77582561890372"/><text class="v2-measure-label" x="540" y="280" text-anchor="middle">Length</text><text class="v2-measure-label" x="151" y="139" text-anchor="middle">Width</text><path class="v2-measure-line" d="M250 194H276V220"/></g><text class="se-caption" x="89" y="310.88"><tspan x="89">A fixed corner and two perpendicular directions organise a rectangular layout. Use the</tspan><tspan x="89" dy="27">dimensions your teacher gives; this sketch is not an official court plan.</tspan></text></g>
<g class="v2-reading-block" data-block="milestones-0" transform="translate(0 766)"><text class="se-copy" x="89" y="24"><tspan x="89">On a journey towards Delhi, Padma sees signs reading “Delhi 70 km” and later</tspan><tspan x="89" dy="32">“Delhi 60 km”. Along the same signed route, the indicated distance to the</tspan></text></g>
<g class="v2-reading-block" data-block="milestones-1" transform="translate(0 830)"><text class="se-copy" x="89" y="24"><tspan x="89">destination has decreased by 10 km. The distance refers to the route and its</tspan><tspan x="89" dy="32">chosen endpoint in Delhi—not necessarily to her grandparents’ front door.</tspan></text></g>
<g class="v2-reading-block" data-block="bus-picture" transform="translate(0 910)"><image class="science-illustration" data-photo="bus" href="../../figures/class-6/science/ch05/bus.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">A seated passenger can describe the journey using roadside landmarks or objects inside the</tspan><tspan x="89" dy="27">bus. The choice of reference matters.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
