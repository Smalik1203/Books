<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 11"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="types-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">5.7 Types of Motion</tspan></text></g>
<g class="v2-reading-block" data-block="linear-task" transform="translate(0 170)"><rect class="se-activity-panel" x="89" y="0" width="874" height="306" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Hold a small eraser a short distance above a clear tabletop or a tray. Keep</tspan><tspan x="146" dy="32">feet and other people clear of the drop.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Release it without throwing it sideways. Watch the path before it strikes</tspan><tspan x="146" dy="32">the surface.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Repeat and sketch the path you observed. Which reference point did you</tspan><tspan x="146" dy="32">use? Compare it with the path of a toy car pushed along a straight guide.</tspan></text></g>
<g class="v2-reading-block" data-block="linear-evidence-0" transform="translate(0 498)"><text class="se-copy" x="89" y="24"><tspan x="89">Motion along a straight path is called <tspan class="se-bold">linear</tspan> <tspan class="se-bold">motion</tspan>. A gently released eraser has</tspan><tspan x="89" dy="32">an approximately straight downward path over this short distance. Marchers on a</tspan></text></g>
<g class="v2-reading-block" data-block="linear-evidence-1" transform="translate(0 562)"><text class="se-copy" x="89" y="24"><tspan x="89">straight stretch of a parade route and a box pushed straight across a floor are</tspan><tspan x="89" dy="32">further examples. The path, not the object’s name, decides the classification.</tspan></text></g>
<g class="v2-reading-block" data-block="circle-task" transform="translate(0 642)"><rect class="se-activity-panel" x="89" y="0" width="874" height="306" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">A teacher ties a small soft foam ball securely to a short thread and checks</tspan><tspan x="146" dy="32">the knot. Keep a wide clear space around the demonstration.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">The teacher moves the ball slowly around a circle, below shoulder height.</tspan><tspan x="146" dy="32">Learners watch from outside the reach of the thread; nobody lets go.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Sketch the path and compare it with the path of one seat on a turning</tspan><tspan x="146" dy="32">merry-go-round. Explain what is similar and what is different.</tspan></text></g>
<g class="v2-reading-block" data-block="circle-evidence-0" transform="translate(0 970)"><text class="se-copy" x="89" y="24"><tspan x="89">An object following a circular path has <tspan class="se-bold">circular</tspan> <tspan class="se-bold">motion</tspan>. A seat on a</tspan><tspan x="89" dy="32">merry-go-round travels around its centre. A point on a rotating fan blade also</tspan></text></g>
<g class="v2-reading-block" data-block="circle-evidence-1" transform="translate(0 1034)"><text class="se-copy" x="89" y="24"><tspan x="89">follows a circle. Always identify the point or part being observed: the centre and</tspan><tspan x="89" dy="32">the blade tip do not follow the same path.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">11</text></g></svg></div></div></section>
