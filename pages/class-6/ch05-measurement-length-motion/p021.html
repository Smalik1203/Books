<g class="v2-reading-block" data-block="project1" transform="translate(0 170)"><text class="se-heading" x="89" y="30"><tspan x="89">Measure one sheet by measuring many</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">A single sheet may be thinner than a ruler’s smallest division. Select a stack of</tspan><tspan x="89" dy="32">many sheets, count the sheets, measure its thickness without the covers, and</tspan><tspan x="89" dy="32">divide by the number of sheets. Repeat with a different stack size. A sheet has</tspan><tspan x="89" dy="32">two page faces: do not divide by the printed page-number difference without</tspan><tspan x="89" dy="32">checking the sheet count. Report an approximate thickness and discuss the</tspan><tspan x="89" dy="32">effects of gaps and compression.</tspan></text><g transform="translate(0 256)"><g data-instructional-figure="paper-stack"><g class="v2-measure-diagram" data-diagram="paper-stack"><rect class="v2-measure-paper" x="285" y="65" width="390" height="115" rx="4"/><line class="v2-measure-line v2-measure-sheetline" x1="286" y1="72" x2="674" y2="72"/><line class="v2-measure-line v2-measure-sheetline" x1="286" y1="77.8" x2="674" y2="77.8"/><line class="v2-measure-line v2-measure-sheetline" x1="286" y1="83.6" x2="674" y2="83.6"/><line class="v2-measure-line v2-measure-sheetline" x1="286" y1="89.4" x2="674" y2="89.4"/><line class="v2-measure-line v2-measure-sheetline" x1="286" y1="95.2" x2="674" y2="95.2"/><line class="v2-measure-line v2-measure-sheetline" x1="286" y1="101" x2="674" y2="101"/><line class="v2-measure-line v2-measure-sheetline" x1="286" y1="106.8" x2="674" y2="106.8"/><line class="v2-measure-line v2-measure-sheetline" x1="286" y1="112.6" x2="674" y2="112.6"/><line class="v2-measure-line v2-measure-sheetline" x1="286" y1="118.4" x2="674" y2="118.4"/><line class="v2-measure-line v2-measure-sheetline" x1="286" y1="124.19999999999999" x2="674" y2="124.19999999999999"/><line class="v2-measure-line v2-measure-sheetline" x1="286" y1="130" x2="674" y2="130"/><line class="v2-measure-line v2-measure-sheetline" x1="286" y1="135.8" x2="674" y2="135.8"/><line class="v2-measure-line v2-measure-sheetline" x1="286" y1="141.6" x2="674" y2="141.6"/><line class="v2-measure-line v2-measure-sheetline" x1="286" y1="147.39999999999998" x2="674" y2="147.39999999999998"/><line class="v2-measure-line v2-measure-sheetline" x1="286" y1="153.2" x2="674" y2="153.2"/><line class="v2-measure-line v2-measure-sheetline" x1="286" y1="159" x2="674" y2="159"/><line class="v2-measure-line v2-measure-sheetline" x1="286" y1="164.8" x2="674" y2="164.8"/><line class="v2-measure-line v2-measure-sheetline" x1="286" y1="170.6" x2="674" y2="170.6"/><line class="v2-measure-line " x1="704" y1="65" x2="704" y2="180"/><line class="v2-measure-line " x1="693" y1="65" x2="715" y2="65"/><line class="v2-measure-line " x1="693" y1="180" x2="715" y2="180"/><text class="v2-measure-label" x="729" y="124" text-anchor="start">Stack thickness</text><text class="v2-measure-label" x="478" y="213" text-anchor="middle">Count sheets, not page faces</text></g></g></g><text class="se-caption" x="89" y="501.88"><tspan x="89">Measure the complete stack of sheets, excluding the covers.</tspan></text></g>
<g class="v2-reading-block" data-block="project2" transform="translate(0 702)"><text class="se-heading" x="89" y="30"><tspan x="89">Compare leaves from one tree</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Collect several fallen leaves from the same tree and identify it with help. Define</tspan><tspan x="89" dy="32">length consistently from the base of the leaf blade to its tip, excluding the stalk,</tspan><tspan x="89" dy="32">and breadth as the widest distance across the blade. Use a 15 cm ruler where</tspan><tspan x="89" dy="32">suitable. Record leaf number, tree name, length, breadth and units. Discuss why</tspan><tspan x="89" dy="32">leaves from the same tree need not have identical dimensions.</tspan></text><image class="science-illustration" data-photo="leaf" href="../../figures/class-6/science/ch05/leaf.png" x="432.6666666666667" y="224" width="186.66666666666666" height="280" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="534.88"><tspan x="89">Use the same definition of length and breadth for every leaf.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">21</text></g></svg></div></div></section>
