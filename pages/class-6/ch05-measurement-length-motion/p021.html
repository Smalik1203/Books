<section class="page page--food page--science-editorial page--science-v2 page--g6-ch05" data-folio="21"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Length and Motion, page 21"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M9 28H91V77H9ZM22 28V49M36 28V41M50 28V49M64 28V41M78 28V49"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Length and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project3" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Investigate older measures</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Ask elders which length units they remember using, where they used them and</tspan><tspan x="89" dy="32">how each was defined. With an adult, look for museum or archaeological</tspan><tspan x="89" dy="32">information about ruled objects found at Indian sites. Record the source and</tspan><tspan x="89" dy="32">distinguish measured evidence from an interpretation of what an ancient object</tspan><tspan x="89" dy="32">was used for. Compare one traditional method with a metric measurement.</tspan></text><image class="science-illustration" data-photo="tape" href="../../figures/class-6/science/ch05/tape.png" x="316" y="224" width="420" height="280" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="534.88"><tspan x="89">Different tools and traditions can be compared by stating the unit and method clearly.</tspan></text></g>
<g class="v2-reading-block" data-block="project4" transform="translate(0 677)"><text class="se-heading" x="89" y="30"><tspan x="89">Build a measured maze</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Use a ruler to draw a maze with straight segments 1 cm or 2 cm long, or</tspan><tspan x="89" dy="32">combinations of these lengths. Measure carefully from the marks, not the ruler’s</tspan><tspan x="89" dy="32">end. Ask a partner to trace a route, add its segment lengths and check the total.</tspan><tspan x="89" dy="32">The printed sketch is a design idea, not a full-size measurement template.</tspan></text><g transform="translate(0 192)"><g class="v2-measure-diagram" data-diagram="maze"><path class="v2-measure-track" d="M200 70V30H850V145M850 190V220H200V115M330 30V140M460 110V220M590 30V140M720 110V220"/><text class="v2-measure-label" x="151" y="101" text-anchor="middle">In</text><text class="v2-measure-label" x="902" y="180" text-anchor="middle">Out</text><svg class="science-illustration" data-art="pencil" x="292" y="263.14150943396226" width="500" height="42.216981132075475" viewBox="26 252 2120 179" overflow="hidden"><image href="../../figures/class-6/science/ch05/pencil.png" x="0" y="0" width="2172" height="724" preserveAspectRatio="xMidYMid meet"/></svg></g></g><text class="se-caption" x="89" y="544.88"><tspan x="89">Choose a scale for your own maze and mark the entrance and exit.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">21</text></g></svg></div></div></section>
