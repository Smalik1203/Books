<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="weather-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Daily temperatures need not change steadily in one direction. Clouds, wind and</tspan><tspan x="89" dy="32">other weather conditions matter. Ten days can show a short-term pattern, but</tspan></text></g>
<g class="v2-reading-block" data-block="weather-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">this small record is not enough to describe a place’s climate. Keep the conclusion</tspan><tspan x="89" dy="32">within what the observations support.</tspan></text></g>
<g class="v2-reading-block" data-block="anna-mani-0" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">Anna Mani (1918–2001) was an Indian meteorologist who helped develop and</tspan><tspan x="89" dy="32">standardise weather instruments in India. Her work also supported</tspan></text></g>
<g class="v2-reading-block" data-block="anna-mani-1" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89">measurements of sunshine and wind. Reliable instruments turn observations</tspan><tspan x="89" dy="32">into records that others can check and compare.</tspan></text></g>
<g class="v2-reading-block" data-block="air-think" transform="translate(0 400)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="186" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Two pupils report different afternoon air temperatures. One measured</tspan><tspan x="113" dy="32">beside a sunny wall; the other used a shaded, ventilated position. What</tspan><tspan x="113" dy="32">would you change before deciding that either thermometer was faulty?</tspan></text></g>
<g class="v2-reading-block" data-block="temperature-close-0" transform="translate(0 608)"><text class="se-copy" x="89" y="24"><tspan x="89">A temperature measurement is more than a number. State the unit, choose an</tspan><tspan x="89" dy="32">instrument suited to the task, use a consistent method and describe the</tspan></text></g>
<g class="v2-reading-block" data-block="temperature-close-1" transform="translate(0 672)"><text class="se-copy" x="89" y="24"><tspan x="89">conditions. These details let another person understand what was measured and</tspan><tspan x="89" dy="32">whether a comparison is fair.</tspan></text></g><g transform="translate(0 752)"><g data-page-illustration="figures/class-6/science/ch07/weather.png"><image class="science-illustration" href="../../figures/class-6/science/ch07/weather.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Weather measurements.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Weather measurements.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
