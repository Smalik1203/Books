<g class="v2-reading-block" data-block="anna-mani" transform="translate(0 712)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.23119" data-space-ratio="1.935">Anna<tspan dx="5.23119"> Mani</tspan><tspan dx="5.23119"> (1918–2001)</tspan><tspan dx="5.23119"> was</tspan><tspan dx="5.23119"> an</tspan><tspan dx="5.23119"> Indian</tspan><tspan dx="5.23119"> meteorologist</tspan><tspan dx="5.23119"> who</tspan><tspan dx="5.23119"> helped</tspan><tspan dx="5.23119"> develop</tspan><tspan dx="5.23119"> and</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="19.36621" data-space-ratio="4.463">standardise<tspan dx="19.36621"> weather</tspan><tspan dx="19.36621"> instruments</tspan><tspan dx="19.36621"> in</tspan><tspan dx="19.36621"> India.</tspan><tspan dx="19.36621"> Her</tspan><tspan dx="19.36621"> work</tspan><tspan dx="19.36621"> also</tspan><tspan dx="19.36621"> supported</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="6.18850" data-space-ratio="2.107">measurements<tspan dx="6.18850"> of</tspan><tspan dx="6.18850"> sunshine</tspan><tspan dx="6.18850"> and</tspan><tspan dx="6.18850"> wind.</tspan><tspan dx="6.18850"> Reliable</tspan><tspan dx="6.18850"> instruments</tspan><tspan dx="6.18850"> turn</tspan><tspan dx="6.18850"> observations</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">into records that others can check and compare.</tspan></text></g><g transform="translate(0 856)"><g data-page-illustration="figures/class-7/science/ch07/apparatus-coast.png"><image class="science-illustration" href="../../figures/class-7/science/ch07/apparatus-coast.png" x="114" y="10" width="824" height="274.6666666666667" preserveAspectRatio="xMidYMid meet"><title>Land and water along a coast.</title></image><text class="se-caption" x="526" y="322.6666666
