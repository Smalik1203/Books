<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="touch-evidence-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">depends on what the skin experienced just before. The water has not acquired</tspan><tspan x="89" dy="32">two different temperatures merely because the hands disagree.</tspan></text></g>
<g class="v2-reading-block" data-block="touch-limit-0" transform="translate(0 192)"><text class="se-copy" x="89" y="24"><tspan x="89">Touch is useful for noticing a possible change, but it is not a reliable numerical</tspan><tspan x="89" dy="32">measurement. Never test an unknown hot object by touching it. A thermometer</tspan></text></g>
<g class="v2-reading-block" data-block="touch-limit-1" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">gives a temperature reading without asking us to judge hotness by sensation</tspan><tspan x="89" dy="32">alone.</tspan></text></g>
<g class="v2-reading-block" data-block="temperature-heading" transform="translate(0 348)"><text class="v2-title" x="89" y="38"><tspan x="89">7.2 Temperature and Its Units</tspan></text></g>
<g class="v2-reading-block" data-block="temperature-definition-0" transform="translate(0 406)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Temperature</tspan> describes how hot or cold a body is. A <tspan class="se-bold">thermometer</tspan> measures</tspan><tspan x="89" dy="32">temperature. A useful record includes both a number and a unit: “28” alone does</tspan><tspan x="89" dy="32">not tell us which temperature scale was used.</tspan></text></g>
<g class="v2-reading-block" data-block="celsius-0" transform="translate(0 518)"><text class="se-copy" x="89" y="24"><tspan x="89">The Celsius scale is common in school and everyday life. Its unit is the <tspan class="se-bold">degree</tspan></tspan><tspan x="89" dy="32"><tspan class="se-bold">Celsius</tspan>, written °C. Read 28 °C as “twenty-eight degrees Celsius”. A larger Celsius</tspan></text></g>
<g class="v2-reading-block" data-block="celsius-1" transform="translate(0 582)"><text class="se-copy" x="89" y="24"><tspan x="89">reading means a higher temperature when comparing measurements on this</tspan><tspan x="89" dy="32">same scale.</tspan></text></g>
<g class="v2-reading-block" data-block="units-table" transform="translate(0 662)"><g data-comparison-table="units-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 7.1 · Three temperature scales</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="68"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Scale</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="321.5" y="70.08"><tspan x="321.5">Unit and symbol</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="671.1" y="70.08"><tspan x="671.1">One equivalent</tspan><tspan x="671.1" dy="28">temperature</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="110" y2="110"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="138.07999999999998"><tspan x="103">Celsius</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="321.5" y="138.07999999999998"><tspan x="321.5">degree Celsius (°C)</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="138.07999999999998"><tspan x="671.1">37 °C</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">Fahrenheit</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="321.5" y="178.07999999999998"><tspan x="321.5">degree Fahrenheit (°F)</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="178.07999999999998"><tspan x="671.1">98.6 °F</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="190" y2="190"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="218.07999999999998"><tspan x="103">Kelvin</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="321.5" y="218.07999999999998"><tspan x="321.5">kelvin (K)</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="671.1" y="218.07999999999998"><tspan x="671.1">310.15 K</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="230" y2="230"/><rect class="v2-table-frame" x="89" y="42" width="874" height="188"/><line class="v2-table-rule" x1="307.5" x2="307.5" y1="42" y2="230"/><line class="v2-table-rule" x1="657.1" x2="657.1" y1="42" y2="230"/><text class="v2-table-note" x="89" y="262.88"><tspan x="89">These are three ways to express the same temperature, not three different body</tspan><tspan x="89" dy="26">temperatures.</tspan></text></g></g><g transform="translate(0 972)"><g data-page-illustration="figures/class-6/science/ch07/bowls.png"><image class="science-illustration" href="../../figures/class-6/science/ch07/bowls.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Bowls for comparing warmth.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Bowls for comparing warmth.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
