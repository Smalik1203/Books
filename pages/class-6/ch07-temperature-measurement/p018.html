<g class="v2-reading-block" data-block="q11" transform="translate(0 660)"><text class="se-copy" x="111" y="24" text-anchor="end">11.</text><text class="se-copy" x="132" y="24"><tspan x="132">Read the liquid level on this enlarged scale. Choose (a) 28.0 °C, (b) 27.5 °C, (c)</tspan><tspan x="132" dy="32">26.5 °C or (d) 25.3 °C. Explain how you counted from a numbered mark.</tspan></text><g transform="translate(0 80)"><g data-instructional-figure="read275"><g class="v2-temperature-diagram" data-diagram="read275"><rect class="v2-temperature-glass" x="145" y="74" width="758" height="42" rx="20"/><path class="v2-temperature-capillary" d="M176 95L876 95"/><path class="v2-temperature-liquid" d="M176 95L526 95"/><circle class="v2-temperature-bulb" cx="163" cy="95" r="13"/><path class="v2-temperature-line" d="M176 72L176 51"/><text class="v2-temperature-label" x="176" y="40" text-anchor="middle">25</text><path class="v2-temperature-line" d="M246 72L246 61"/><path class="v2-temperature-line" d="M316 72L316 51"/><text class="v2-temperature-label" x="316" y="40" text-anchor="middle">26</text><path class="v2-temperature-line" d="M386 72L386 61"/><path class="v2-temperature-line" d="M456 72L456 51"/><text class="v2-temperature-label" x="456" y="40" text-anchor="middle">27</text><path class="v2-temperature-line" d="M526 72L526 61"/><path class="v2-temperature-line" d="M596 72L596 51"/><text class="v2-temperature-label" x="596" y="40" text-anchor="middle">28</text><path class="v2-temperature-line" d="M666 72L666 61"/><path class="v2-temperature-line" d="M736 72L736 51"/><text class="v2-temperature-label" x="736" y="40" text-anchor="middle">29</text><path class="v2-temperature-line" d="M806 72L806 61"/><path class="v2-temperature-line" d="M876 72L876 51"/><text class="v2-temperature-label" x="876" y="40" text-anchor="middle">30</text></g></g></g><text class="se-caption" x="89" y="248.88"><tspan x="89">The small marks divide each degree into two equal intervals.</tspan></text></g>
<g class="v2-reading-block" data-block="q12" transform="translate(0 941)"><text class="se-copy" x="111" y="24" text-anchor="end">12.</text><text class="se-copy" x="132" y="24"><tspan x="132">A thermometer has 50 equal intervals between 0 °C and 100 °C. What</tspan><tspan x="132" dy="32">temperature interval does one division represent? Show your calculation.</tspan></text></g>
<g class="v2-reading-block" data-block="q13" transform="translate(0 1035)"><text class="se-copy" x="111" y="24" text-anchor="end">13.</text><text class="se-copy" x="132" y="24"><tspan x="132">Draw a scale from 10 °C to 20 °C with a division every 0.5 °C. How many</tspan><tspan x="132" dy="32">intervals and how many tick marks, including both endpoints, will you draw?</tspan></text></g>
<g class="v2-reading-block" data-block="q14" transform="translate(0 1129)"><text class="se-copy" x="111" y="24" text-anchor="end">14.</text><text class="se-copy" x="132" y="24"><tspan x="132">Komal tells her friend, “My temperature is 101 degrees.” Which scale is she</tspan><tspan x="132" dy="32">likely using? What details should you ask for before interpreting the reading?</tspan><tspan x="132" dy="32">Explain why anyone who feels unwell should tell a responsible adult.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
