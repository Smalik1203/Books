<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07 page--opener" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 1"><g class="chapter-opener" data-opener="science-g6-ch07"><defs><linearGradient id="science-g6-ch07-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop class="chapter-opener__gradient-start" offset="0%"/><stop class="chapter-opener__gradient-end" offset="100%"/></linearGradient></defs><path class="chapter-opener__band" fill="url(#science-g6-ch07-gradient)" d="M-17 -17H1069V300H-17Z"/><path class="chapter-opener__edge" d="M-17 296H1069V300H-17Z"/><g class="science-header-art" data-header-art="6-7" aria-hidden="true" transform="translate(886 26)"><g data-art-element="thermometer" transform="translate(7 82) scale(1.12) rotate(-6 50 50)"><path class="science-header-art__soft" d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64Z"/><path d="M53 29V74M72 20H85M72 35H80M72 50H85"/><circle class="science-header-art__surface" cx="53" cy="80" r="9"/></g><g data-art-element="sun" transform="translate(72 0) scale(0.62) rotate(8 50 50)"><circle class="science-header-art__soft" cx="50" cy="50" r="24"/><path d="M50 6V16M50 84V94M6 50H16M84 50H94M19 19L27 27M73 73L81 81M19 81L27 73M73 27L81 19"/></g><g data-art-element="drop" transform="translate(64 184) scale(0.65) rotate(7 50 50)"><path class="science-header-art__soft" d="M50 5C43 24 15 45 15 65A35 30 0 0 0 85 65C85 45 57 24 50 5Z"/><path d="M29 61Q23 77 41 82"/></g></g><line class="chapter-opener__divider" x1="240" x2="240" y1="94" y2="252"/><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number se-running" x="151" y="242" text-anchor="middle">7</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">Temperature and</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">its Measurement</text><image class="science-illustration chapter-opener__image" href="../../figures/class-6/science/ch07/opener.png" x="89" y="336" width="874" height="485.55555555555554" preserveAspectRatio="xMidYMid meet"><title>Teacher and students examining a digital thermometer</title></image></g><text class="se-copy v2-intro" x="89" y="884"><tspan x="89">A forehead feels warm. A thermometer gives a number. What can each</tspan><tspan x="89" dy="34">observation tell us?</tspan></text><text class="se-copy" x="89" y="970"><tspan x="89">After school in Shillong, Lambok feels tired and thinks he may have a fever. His</tspan><tspan x="89" dy="32">sister Phiban touches his forehead. Their family checks with a clinical</tspan><tspan x="89" dy="32">thermometer: the reading is near the usual reference for body temperature.</tspan></text><text class="se-copy" x="89" y="1082"><tspan x="89">Touch begins their question, but it cannot settle it. A useful measurement needs</tspan><tspan x="89" dy="32">the right instrument, a careful method and a unit.</tspan></text><text class="se-copy" x="89" y="1162"><tspan x="89">In this chapter, compare sensations, read liquid columns and digital displays, and</tspan><tspan x="89" dy="32">investigate how temperature measurements help us describe bodies, water and</tspan><tspan x="89" dy="32">the air around us.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
