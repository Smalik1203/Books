<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="site-qualification" transform="translate(0 112)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.55568" data-space-ratio="1.278">A<tspan dx="1.55568"> reading</tspan><tspan dx="1.55568"> from</tspan><tspan dx="1.55568"> the</tspan><tspan dx="1.55568"> armpit</tspan><tspan dx="1.55568"> may</tspan><tspan dx="1.55568"> differ</tspan><tspan dx="1.55568"> from</tspan><tspan dx="1.55568"> one</tspan><tspan dx="1.55568"> taken</tspan><tspan dx="1.55568"> at</tspan><tspan dx="1.55568"> another</tspan><tspan dx="1.55568"> site.</tspan><tspan dx="1.55568"> Record</tspan><tspan dx="1.55568"> the</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="6.63969" data-space-ratio="2.187">actual<tspan dx="6.63969"> site</tspan><tspan dx="6.63969"> and</tspan><tspan dx="6.63969"> value;</tspan><tspan dx="6.63969"> do</tspan><tspan dx="6.63969"> not</tspan><tspan dx="6.63969"> add</tspan><tspan dx="6.63969"> a</tspan><tspan dx="6.63969"> fixed</tspan><tspan dx="6.63969"> correction</tspan><tspan dx="6.63969"> to</tspan><tspan dx="6.63969"> make</tspan><tspan dx="6.63969"> it</tspan><tspan dx="6.63969"> “normal”.</tspan><tspan dx="6.63969"> If</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="6.49497" data-space-ratio="2.161">someone<tspan dx="6.49497"> feels</tspan><tspan dx="6.49497"> unwell,</tspan><tspan dx="6.49497"> tell</tspan><tspan dx="6.49497"> a</tspan><tspan dx="6.49497"> responsible</tspan><tspan dx="6.49497"> adult</tspan><tspan dx="6.49497"> and</tspan><tspan dx="6.49497"> follow</tspan><tspan dx="6.49497"> appropriate</tspan><tspan dx="6.49497"> health</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">advice. Measuring in class is not a substitute for care.</tspan></text></g>
<g class="v2-reading-block" data-block="mercury" transform="translate(0 256)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.15462" data-space-ratio="1.743">Older<tspan dx="4.15462"> clinical</tspan><tspan dx="4.15462"> thermometers</tspan><tspan dx="4.15462"> used</tspan><tspan dx="4.15462"> mercury.</tspan><tspan dx="4.15462"> Mercury</tspan><tspan dx="4.15462"> is</tspan><tspan dx="4.15462"> toxic,</tspan><tspan dx="4.15462"> and</tspan><tspan dx="4.15462"> broken</tspan><tspan dx="4.15462"> glass</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.46219" data-space-ratio="1.619">can<tspan dx="3.46219"> injure.</tspan><tspan dx="3.46219"> Use</tspan><tspan dx="3.46219"> a</tspan><tspan dx="3.46219"> suitable</tspan><tspan dx="3.46219"> digital</tspan><tspan dx="3.46219"> device</tspan><tspan dx="3.46219"> instead.</tspan><tspan dx="3.46219"> If</tspan><tspan dx="3.46219"> an</tspan><tspan dx="3.46219"> old</tspan><tspan dx="3.46219"> thermometer</tspan><tspan dx="3.46219"> breaks,</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">keep away and tell an adult; never touch the liquid or try to clean it up yourself.</tspan></text></g>
