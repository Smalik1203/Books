<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="lab-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">7.4 Using a Laboratory Thermometer</tspan></text></g>
<g class="v2-reading-block" data-block="lab-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">laboratory</tspan> <tspan class="se-bold">thermometer</tspan> is used to measure temperatures in investigations.</tspan><tspan x="89" dy="32">One familiar model has a glass stem, a bulb holding liquid, a narrow tube and a</tspan></text></g>
<g class="v2-reading-block" data-block="lab-intro-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">marked scale. A coloured alcohol liquid makes the column easy to see. Use a</tspan><tspan x="89" dy="32">teacher-approved mercury-free instrument.</tspan></text></g>
<g class="v2-reading-block" data-block="lab-structure" transform="translate(0 314)"><g class="v2-temperature-diagram" data-diagram="structure"><path class="v2-temperature-glass" d="M363 342V39Q363 21 380 21Q397 21 397 39V342A28 28 0 1 1 363 342Z"/><path class="v2-temperature-capillary" d="M380 44L380 360"/><path class="v2-temperature-liquid" d="M380 137L380 360"/><circle class="v2-temperature-bulb" cx="380" cy="364" r="17"/><path class="v2-temperature-line" d="M400 333L422 333"/><text class="v2-temperature-label" x="432" y="341" text-anchor="start">10</text><path class="v2-temperature-line" d="M400 319L412 319"/><path class="v2-temperature-line" d="M400 305L412 305"/><path class="v2-temperature-line" d="M400 291L412 291"/><path class="v2-temperature-line" d="M400 277L412 277"/><path class="v2-temperature-line" d="M400 263L422 263"/><text class="v2-temperature-label" x="432" y="271" text-anchor="start">15</text><path class="v2-temperature-line" d="M400 249L412 249"/><path class="v2-temperature-line" d="M400 235L412 235"/><path class="v2-temperature-line" d="M400 221L412 221"/><path class="v2-temperature-line" d="M400 207L412 207"/><path class="v2-temperature-line" d="M400 193L422 193"/><text class="v2-temperature-label" x="432" y="201" text-anchor="start">20</text><path class="v2-temperature-line" d="M400 179L412 179"/><path class="v2-temperature-line" d="M400 165L412 165"/><path class="v2-temperature-line" d="M400 151L412 151"/><path class="v2-temperature-line" d="M400 137L412 137"/><path class="v2-temperature-line" d="M400 123L422 123"/><text class="v2-temperature-label" x="432" y="131" text-anchor="start">25</text><path class="v2-temperature-line" d="M400 109L412 109"/><path class="v2-temperature-line" d="M400 95L412 95"/><path class="v2-temperature-line" d="M400 81L412 81"/><path class="v2-temperature-line" d="M400 67L412 67"/><path class="v2-temperature-line" d="M400 53L422 53"/><text class="v2-temperature-label" x="432" y="61" text-anchor="start">30</text><text class="v2-temperature-label" x="446" y="26" text-anchor="middle">°C</text><path class="v2-temperature-line" d="M398 33L573 33"/><text class="v2-temperature-label" x="588" y="41" text-anchor="start">Glass stem</text><path class="v2-temperature-line" d="M381 137L573 137"/><text class="v2-temperature-label" x="588" y="145" text-anchor="start">Liquid column</text><path class="v2-temperature-line" d="M423 263L573 263"/><text class="v2-temperature-label" x="588" y="271" text-anchor="start">Scale</text><path class="v2-temperature-line" d="M409 364L573 364"/><text class="v2-temperature-label" x="588" y="372" text-anchor="start">Bulb</text><text class="v2-temperature-label" x="526" y="425" text-anchor="middle">Narrow tube inside the stem</text></g><text class="se-caption" x="89" y="465.88"><tspan x="89">Fig. 7.3 · Parts of a liquid-in-glass laboratory thermometer. An enlarged portion of the Celsius</tspan><tspan x="89" dy="27">scale is shown.</tspan></text></g>
<g class="v2-reading-block" data-block="lab-mechanism-0" transform="translate(0 835)"><text class="se-copy" x="89" y="24"><tspan x="89">When the bulb warms, its liquid expands and rises in the narrow tube. When it</tspan><tspan x="89" dy="32">cools, the liquid contracts and the column falls. The instrument therefore</tspan></text></g>
<g class="v2-reading-block" data-block="lab-mechanism-1" transform="translate(0 899)"><text class="se-copy" x="89" y="24"><tspan x="89">responds to its own temperature as it exchanges energy with what it is</tspan><tspan x="89" dy="32">measuring. Allow time for its reading to settle.</tspan></text></g>
<g class="v2-reading-block" data-block="range-task" transform="translate(0 979)"><rect class="se-activity-panel" x="89" y="0" width="874" height="338" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Examine a laboratory thermometer under your teacher’s supervision.</tspan><tspan x="146" dy="32">Keep it away from the edge of the table and handle it gently.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Find the unit and the lowest and highest marked values. Record both</tspan><tspan x="146" dy="32">endpoints; together they describe the instrument’s marked range.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Compare the marked range with another thermometer if one is available.</tspan><tspan x="146" dy="32">Would either be suitable for the temperature you intend to measure?</tspan><tspan x="146" dy="32">Explain your choice.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
