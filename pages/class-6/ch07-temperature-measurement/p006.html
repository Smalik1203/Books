<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="site-qualification-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">someone feels unwell, tell a responsible adult and follow appropriate health</tspan><tspan x="89" dy="32">advice. Measuring in class is not a substitute for care.</tspan></text></g>
<g class="v2-reading-block" data-block="mercury-0" transform="translate(0 192)"><text class="se-copy" x="89" y="24"><tspan x="89">Older clinical thermometers used mercury. Mercury is toxic, and broken glass</tspan><tspan x="89" dy="32">can injure. Use a suitable digital device instead. If an old thermometer breaks,</tspan><tspan x="89" dy="32">keep away and tell an adult; never touch the liquid or try to clean it up yourself.</tspan></text></g>
<g class="v2-reading-block" data-block="pulse-think" transform="translate(0 304)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="186" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A person’s pulse becomes faster after running. Could a faster pulse by itself</tspan><tspan x="113" dy="32">prove that the person has a fever? Explain which measurement is missing</tspan><tspan x="113" dy="32">and why the activity just before the observation matters.</tspan></text></g>
<g class="v2-reading-block" data-block="lab-heading" transform="translate(0 524)"><text class="v2-title" x="89" y="38"><tspan x="89">7.4 Using a Laboratory Thermometer</tspan></text></g>
<g class="v2-reading-block" data-block="lab-intro-0" transform="translate(0 582)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">laboratory</tspan> <tspan class="se-bold">thermometer</tspan> is used to measure temperatures in investigations.</tspan><tspan x="89" dy="32">One familiar model has a glass stem, a bulb holding liquid, a narrow tube and a</tspan></text></g>
<g class="v2-reading-block" data-block="lab-intro-1" transform="translate(0 646)"><text class="se-copy" x="89" y="24"><tspan x="89">marked scale. A coloured alcohol liquid makes the column easy to see. Use a</tspan><tspan x="89" dy="32">teacher-approved mercury-free instrument.</tspan></text></g>

y="61" text-anchor="start">30</text><text class="v2-temperature-label" x="446" y="26" text-anchor="middle">°C</text><path class="v2-temperature-line" d="M398 33L573 33"/><text class="v2-temperature-label" x="588" y="41" text-anchor="start">Glass stem</text><path class="v2-temperature-line" d="M381 137L573 137"/><text class="v2-temperature-label" x="588" y="145" text-anchor="start">Liquid column</text><path class="v2-temperature-line" d="M423 263L573 263"/><text class="v2-temperature-label" x="588" y="271" text-anchor="start">Scale</text><path class="v2-temperature-line" d="M409 364L573 364"/><text class="v2-temperature-label" x="588" y="372" text-anchor="start">Bulb</text><text class="v2-temperature-label" x="526" y="425" text-anchor="middle">Narrow tube inside the stem</text></g></g><text class="se-caption" x="89" y="465.88"><tspan x="89">Fig. 7.3 · Parts of a liquid-in-glass laboratory thermometer. An enlarged portion of the Celsius</tspan><tspan x="89" dy="27">scale is shown.</tspan></text></g>
<g class="v2-reading-block" data-block="lab-mechanism-0" transform="translate(0 1247)"><text class="se-copy" x="89" y="24"><tspan x="89">When the bulb warms, its liquid expands and rises in the narrow tube. When it</tspan><tspan x="89" dy="32">cools, the liquid contracts and the column falls. The instrument therefore</tspan></text></g>
<g class="v2-reading-block" data-block="lab-mechanism-1" transform="translate(0 1311)"><text class="se-copy" x="89" y="24"><tspan x="89">responds to its own temperature as it exchanges energy with what it is</tspan><tspan x="89" dy="32">measuring. Allow time for its reading to settle.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
