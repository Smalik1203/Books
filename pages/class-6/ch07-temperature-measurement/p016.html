<g class="v2-reading-block" data-block="assessment-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Use your notebook. Support each answer with evidence and explain any</tspan><tspan x="89" dy="32">uncertainty.</tspan></text></g>
<g class="v2-reading-block" data-block="q1" transform="translate(0 250)"><text class="se-copy" x="111" y="24" text-anchor="end">1.</text><text class="se-copy" x="132" y="24"><tspan x="132">Which is the commonly quoted reference value for normal human body</tspan><tspan x="132" dy="32">temperature on the Celsius scale? Choose one: (a) 98.6 °C; (b) 37.0 °C; (c) 32</tspan><tspan x="132" dy="32">°C; (d) 27 °C.</tspan></text></g>
<g class="v2-reading-block" data-block="q2" transform="translate(0 376)"><text class="se-copy" x="111" y="24" text-anchor="end">2.</text><text class="se-copy" x="132" y="24"><tspan x="132">Which Fahrenheit value is equivalent to 37 °C? Choose one: (a) 97.4 °F; (b)</tspan><tspan x="132" dy="32">97.6 °F; (c) 98.4 °F; (d) 98.6 °F.</tspan></text></g>
<g class="v2-reading-block" data-block="q3" transform="translate(0 470)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24"><tspan x="132">Complete these statements in your notebook. (a) A measure of hotness or</tspan><tspan x="132" dy="32">coldness is called … . (b) A … thermometer intended for body temperature</tspan><tspan x="132" dy="32">must not be used for ice-water experiments. (c) The unit on the Celsius scale</tspan><tspan x="132" dy="32">is the … .</tspan></text></g>
<g class="v2-reading-block" data-block="q4" transform="translate(0 628)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24"><tspan x="132">Which marked range is common for a school liquid-in-glass laboratory</tspan><tspan x="132" dy="32">thermometer? (a) 10 °C to 100 °C; (b) −10 °C to 110 °C; (c) 32 °C to 45 °C; (d) 35</tspan><tspan x="132" dy="32">°C to 42 °C. Why must you still check the instrument in front of you?</tspan></text></g>
