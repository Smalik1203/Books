<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="7.54779" data-space-ratio="2.350">Touch<tspan dx="7.54779"> depends</tspan><tspan dx="7.54779"> on</tspan><tspan dx="7.54779"> previous</tspan><tspan dx="7.54779"> sensations.</tspan><tspan dx="7.54779"> Use</tspan><tspan dx="7.54779"> a</tspan><tspan dx="7.54779"> suitable</tspan><tspan dx="7.54779"> thermometer</tspan><tspan dx="7.54779"> for</tspan><tspan dx="7.54779"> a</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">numerical temperature measurement.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="2.24131" data-space-ratio="1.401">Record<tspan dx="2.24131"> the</tspan><tspan dx="2.24131"> number</tspan><tspan dx="2.24131"> and</tspan><tspan dx="2.24131"> unit</tspan><tspan dx="2.24131"> together.</tspan><tspan dx="2.24131"> Celsius</tspan><tspan dx="2.24131"> uses</tspan><tspan dx="2.24131"> °C,</tspan><tspan dx="2.24131"> Fahrenheit</tspan><tspan dx="2.24131"> uses</tspan><tspan dx="2.24131"> °F</tspan><tspan dx="2.24131"> and</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">kelvin uses K.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="0.78241" data-space-ratio="1.140">37<tspan dx="0.78241"> °C</tspan><tspan dx="0.78241"> and</tspan><tspan dx="0.78241"> 98.6</tspan><tspan dx="0.78241"> °F</tspan><tspan dx="0.78241"> are</tspan><tspan dx="0.78241"> equivalent</tspan><tspan dx="0.78241"> reference</tspan><tspan dx="0.78241"> values.</tspan><tspan dx="0.78241"> Body</tspan><tspan dx="0.78241"> temperature</tspan><tspan dx="0.78241"> varies</tspan><tspan dx="0.78241"> with</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">the person, time, site and method.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="7.02305" data-space-ratio="2.256">Use<tspan dx="7.02305"> clinical</tspan><tspan dx="7.02305"> thermometers</tspan><tspan dx="7.02305"> only</tspan><tspan dx="7.02305"> as</tspan><tspan dx="7.02305"> directed,</tspan><tspan dx="7.02305"> with</tspan><tspan dx="7.02305"> permission,</tspan><tspan dx="7.02305"> hygiene</tspan><tspan dx="7.02305"> and</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">adult guidance. Never use a glass laboratory thermometer in the mouth.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="7.04352" data-space-ratio="2.260">In<tspan dx="7.04352"> a</tspan><tspan dx="7.04352"> liquid-in-glass</tspan><tspan dx="7.04352"> thermometer,</tspan><tspan dx="7.04352"> warming</tspan><tspan dx="7.04352"> expands</tspan><tspan dx="7.04352"> the</tspan><tspan dx="7.04352"> liquid</tspan><tspan dx="7.04352"> and</tspan><tspan dx="7.04352"> cooling</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">contracts it. Read its range and smallest division before use.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="0.82460" data-space-ratio="1.147">For<tspan dx="0.82460"> water</tspan><tspan dx="0.82460"> measurements,</tspan><tspan dx="0.82460"> keep</tspan><tspan dx="0.82460"> the</tspan><tspan dx="0.82460"> bulb</tspan><tspan dx="0.82460"> immersed</tspan><tspan dx="0.82460"> and</tspan><tspan dx="0.82460"> clear</tspan><tspan dx="0.82460"> of</tspan><tspan dx="0.82460"> the</tspan><tspan dx="0.82460"> vessel.</tspan><tspan dx="0.82460"> Wait</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">for a steady column and read at eye level.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="5.76260" data-space-ratio="2.031">Pure<tspan dx="5.76260"> melting</tspan><tspan dx="5.76260"> ice</tspan><tspan dx="5.76260"> and</tspan><tspan dx="5.76260"> water</tspan><tspan dx="5.76260"> are</tspan><tspan dx="5.76260"> near</tspan><tspan dx="5.76260"> 0</tspan><tspan dx="5.76260"> °C;</tspan><tspan dx="5.76260"> pure</tspan><tspan dx="5.76260"> water</tspan><tspan dx="5.76260"> boils</tspan><tspan dx="5.76260"> near</tspan><tspan dx="5.76260"> 100</tspan><tspan dx="5.76260"> °C</tspan><tspan dx="5.76260"> at</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">standard atmospheric pressure. Boiling temperature changes with pressure.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="7.20508" data-space-ratio="2.288">Air-temperature<tspan dx="7.20508"> records</tspan><tspan dx="7.20508"> need</tspan><tspan dx="7.20508"> a</tspan><tspan dx="7.20508"> stated</tspan><tspan dx="7.20508"> place,</tspan><tspan dx="7.20508"> time</tspan><tspan dx="7.20508"> and</tspan><tspan dx="7.20508"> suitable</tspan><tspan dx="7.20508"> measuring</tspan></tspan><tspan x="112" dy="32" data-justify-width="851" data-natural-space="5.59200" data-extra-space="8.12768" data-space-ratio="2.453">conditions.<tspan dx="8.12768"> Daily</tspan><tspan dx="8.12768"> maximum</tspan><tspan dx="8.12768"> and</tspan><tspan dx="8.12768"> minimum</tspan><tspan dx="8.12768"> values</tspan><tspan dx="8.12768"> are</tspan><tspan dx="8.12768"> the</tspan><tspan dx="8.12768"> extremes</tspan><tspan dx="8.12768"> for</tspan><tspan dx="8.12768"> a</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">reporting period.</tspan></text><image class="science-illustration" data-photo="review-summary" href="../../figures/class-6/science/review/room-thermometer.png" x="316" y="839" width="420" height="280" preserveAspectRatio="xMidYMid meet"/><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0
