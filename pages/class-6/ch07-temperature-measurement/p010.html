<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="fixed-points" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Melting Ice and Boiling Water</tspan></text></g>
<g class="v2-reading-block" data-block="teacher-demo-0" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89">In a teacher-led demonstration, observe a suitable thermometer in a well-mixed</tspan><tspan x="89" dy="32">mixture of melting ice and water, and then an appropriate instrument measuring</tspan></text></g>
<g class="v2-reading-block" data-block="teacher-demo-1" transform="translate(0 224)"><text class="se-copy" x="89" y="24"><tspan x="89">boiling water. Watch from a safe distance. Do not handle the hot vessel, steam,</tspan><tspan x="89" dy="32">heater or thermometer.</tspan></text></g>
<g class="v2-reading-block" data-block="phase-change-0" transform="translate(0 304)"><text class="se-copy" x="89" y="24"><tspan x="89">For pure water near standard atmospheric pressure, melting ice and water</tspan><tspan x="89" dy="32">together are near 0 °C, while boiling water is near 100 °C. During each change,</tspan></text></g>
<g class="v2-reading-block" data-block="phase-change-1" transform="translate(0 368)"><text class="se-copy" x="89" y="24"><tspan x="89">the temperature can remain nearly steady while both forms are present. Heating</tspan><tspan x="89" dy="32">does not always mean that the temperature keeps rising.</tspan></text></g>
<g class="v2-reading-block" data-block="pressure-0" transform="translate(0 448)"><text class="se-copy" x="89" y="24"><tspan x="89">The boiling temperature also depends on pressure. At a higher place, the air</tspan><tspan x="89" dy="32">pressure is usually lower, and water boils at a lower temperature. Dissolved</tspan></text></g>
<g class="v2-reading-block" data-block="pressure-1" transform="translate(0 512)"><text class="se-copy" x="89" y="24"><tspan x="89">substances and measurement conditions can matter too. A boiling reading below</tspan><tspan x="89" dy="32">100 °C does not automatically mean that the thermometer is broken.</tspan></text></g>
<g class="v2-reading-block" data-block="boiling-data-task" transform="translate(0 592)"><rect class="se-activity-panel" x="89" y="0" width="874" height="370" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Study the supplied readings from a boiling-water demonstration in</tspan><tspan x="146" dy="32">Shillong in Table 7.3. This is a data investigation; do not boil water</tspan><tspan x="146" dy="32">yourself.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Find the highest and lowest readings and calculate their difference.</tspan><tspan x="146" dy="32">Which value occurs more than once?</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Suggest measurement details that could account for the small spread.</tspan><tspan x="146" dy="32">Explain why you need the place and conditions before comparing every</tspan><tspan x="146" dy="32">result with 100 °C.</tspan></text></g><g transform="translate(0 984)"><g data-page-illustration="figures/class-6/science/ch07/bowls.png"><image class="science-illustration" href="../../figures/class-6/science/ch07/bowls.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Bowls for comparing warmth.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Bowls for comparing warmth.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
