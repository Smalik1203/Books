<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="water-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Looking from above or below can make a liquid level appear to line up with the</tspan><tspan x="89" dy="32">wrong mark. This viewing error is called <tspan class="se-bold">parallax</tspan>. Eye-level reading reduces it.</tspan></text></g>
<g class="v2-reading-block" data-block="water-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">Touching the container can also make the thermometer respond to the container</tspan><tspan x="89" dy="32">rather than only to the water.</tspan></text></g>
<g class="v2-reading-block" data-block="removal-0" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">A liquid-in-glass laboratory thermometer does not usually retain its highest</tspan><tspan x="89" dy="32">reading. Lift it out of warm water into cooler air and the column begins to fall. A</tspan></text></g>
<g class="v2-reading-block" data-block="removal-1" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89">reading taken afterwards no longer describes the water at the moment of</tspan><tspan x="89" dy="32">measurement. Keep the bulb immersed while reading.</tspan></text></g>
<g class="v2-reading-block" data-block="fixed-points" transform="translate(0 412)"><text class="se-heading" x="89" y="30"><tspan x="89">Melting Ice and Boiling Water</tspan></text></g>
<g class="v2-reading-block" data-block="teacher-demo-0" transform="translate(0 460)"><text class="se-copy" x="89" y="24"><tspan x="89">In a teacher-led demonstration, observe a suitable thermometer in a well-mixed</tspan><tspan x="89" dy="32">mixture of melting ice and water, and then an appropriate instrument measuring</tspan></text></g>
<g class="v2-reading-block" data-block="teacher-demo-1" transform="translate(0 524)"><text class="se-copy" x="89" y="24"><tspan x="89">boiling water. Watch from a safe distance. Do not handle the hot vessel, steam,</tspan><tspan x="89" dy="32">heater or thermometer.</tspan></text></g>
<g class="v2-reading-block" data-block="phase-change-0" transform="translate(0 604)"><text class="se-copy" x="89" y="24"><tspan x="89">For pure water near standard atmospheric pressure, melting ice and water</tspan><tspan x="89" dy="32">together are near 0 °C, while boiling water is near 100 °C. During each change,</tspan></text></g>
<g class="v2-reading-block" data-block="phase-change-1" transform="translate(0 668)"><text class="se-copy" x="89" y="24"><tspan x="89">the temperature can remain nearly steady while both forms are present. Heating</tspan><tspan x="89" dy="32">does not always mean that the temperature keeps rising.</tspan></text></g>
<g class="v2-reading-block" data-block="pressure-0" transform="translate(0 748)"><text class="se-copy" x="89" y="24"><tspan x="89">The boiling temperature also depends on pressure. At a higher place, the air</tspan><tspan x="89" dy="32">pressure is usually lower, and water boils at a lower temperature. Dissolved</tspan></text></g>
<g class="v2-reading-block" data-block="pressure-1" transform="translate(0 812)"><text class="se-copy" x="89" y="24"><tspan x="89">substances and measurement conditions can matter too. A boiling reading below</tspan><tspan x="89" dy="32">100 °C does not automatically mean that the thermometer is broken.</tspan></text></g><g transform="translate(0 892)"><g data-page-illustration="figures/science/page-references/laboratory.png"><image class="science-illustration" href="../../figures/science/page-references/laboratory.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A laboratory thermometer immersed in water.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A laboratory thermometer</tspan><tspan x="539" dy="27">immersed in water.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
