<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="division-heading" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Reading Between Numbered Marks</tspan></text></g>
<g class="v2-reading-block" data-block="division-task" transform="translate(0 160)"><rect class="se-activity-panel" x="89" y="0" width="874" height="382" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Choose two neighbouring numbered marks on the thermometer. Subtract</tspan><tspan x="146" dy="32">the lower value from the higher value.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Count the equal intervals between the marks. Count the spaces, not both</tspan><tspan x="146" dy="32">endpoint lines as extra intervals.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Divide the temperature difference by the number of intervals. Record the</tspan><tspan x="146" dy="32">value of one smallest division with its unit.</tspan></text><text class="se-activity-step" x="132" y="320" text-anchor="end">4.</text><text class="se-copy" x="146" y="320"><tspan x="146">Compare your calculation with a partner’s. If the answers differ, check</tspan><tspan x="146" dy="32">the endpoints and interval count before reading a liquid level.</tspan></text></g>
<g class="v2-reading-block" data-block="division-figure" transform="translate(0 564)"><g class="v2-temperature-diagram" data-diagram="division"><rect class="v2-temperature-glass" x="145" y="69" width="758" height="42" rx="20"/><path class="v2-temperature-capillary" d="M176 90L876 90"/><circle class="v2-temperature-bulb" cx="163" cy="90" r="13"/><path class="v2-temperature-line" d="M176 67L176 46"/><text class="v2-temperature-label" x="176" y="35" text-anchor="middle">20</text><path class="v2-temperature-line" d="M246 67L246 56"/><path class="v2-temperature-line" d="M316 67L316 56"/><path class="v2-temperature-line" d="M386 67L386 56"/><path class="v2-temperature-line" d="M456 67L456 56"/><path class="v2-temperature-line" d="M526 67L526 46"/><text class="v2-temperature-label" x="526" y="35" text-anchor="middle">25</text><path class="v2-temperature-line" d="M596 67L596 56"/><path class="v2-temperature-line" d="M666 67L666 56"/><path class="v2-temperature-line" d="M736 67L736 56"/><path class="v2-temperature-line" d="M806 67L806 56"/><path class="v2-temperature-line" d="M876 67L876 46"/><text class="v2-temperature-label" x="876" y="35" text-anchor="middle">30</text><text class="v2-temperature-label" x="526" y="153" text-anchor="middle">20 °C to 30 °C: ten equal intervals</text></g><text class="se-caption" x="89" y="195.88"><tspan x="89">Fig. 7.4 · Ten equal intervals run from 20 °C to 30 °C on this scale.</tspan></text></g>
<g class="v2-reading-block" data-block="division-equation" transform="translate(0 788)"><text class="v2-equation" x="89" y="30"><tspan x="89">Value of one division = (30 − 20) °C ÷ 10 = 1 °C</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">There are eleven tick marks from 20 to 30 inclusive, but only ten intervals.</tspan></text></g>
<g class="v2-reading-block" data-block="resolution-0" transform="translate(0 885)"><text class="se-copy" x="89" y="24"><tspan x="89">Another thermometer may have divisions of 0.5 °C or 2 °C. Do not assume that</tspan><tspan x="89" dy="32">every small line means 1 °C. Small divisions let us distinguish closer readings;</tspan><tspan x="89" dy="32">they do not, by themselves, prove that an instrument is accurate.</tspan></text></g><g transform="translate(0 997)"><g data-page-illustration="figures/science/page-references/laboratory.png"><image class="science-illustration" href="../../figures/science/page-references/laboratory.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A laboratory thermometer immersed in water.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A laboratory thermometer</tspan><tspan x="539" dy="27">immersed in water.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
