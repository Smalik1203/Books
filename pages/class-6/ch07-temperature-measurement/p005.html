<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="clinical-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="510" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">With a teacher or responsible adult, examine a digital clinical</tspan><tspan x="146" dy="32">thermometer and its instructions. Identify the sensing tip, display, power</tspan><tspan x="146" dy="32">button, unit and permitted measuring site.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Watch the adult demonstrate correct use and cleaning. A personal</tspan><tspan x="146" dy="32">measurement is optional and requires permission and adult supervision.</tspan><tspan x="146" dy="32">Never share an oral thermometer between pupils.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">For comparison, use ten anonymous, teacher-provided readings taken</tspan><tspan x="146" dy="32">with the same method, or voluntarily supplied records with permission.</tspan><tspan x="146" dy="32">Record reading, unit, time and measuring site; do not write names.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Compare the values with 37 °C. Are they all identical? Note any missing</tspan><tspan x="146" dy="32">information that prevents a fair comparison. Do not diagnose anyone</tspan><tspan x="146" dy="32">from this classroom record.</tspan></text></g>
<g class="v2-reading-block" data-block="clinical-method-0" transform="translate(0 644)"><text class="se-copy" x="89" y="24"><tspan x="89">Follow the device’s instructions for the person’s age and the measuring site. Hold</tspan><tspan x="89" dy="32">a contact model by its body rather than its sensing tip, and wait for its completion</tspan></text></g>
<g class="v2-reading-block" data-block="clinical-method-1" transform="translate(0 708)"><text class="se-copy" x="89" y="24"><tspan x="89">signal as instructed. Clean it using the recommended method. Do not immerse</tspan><tspan x="89" dy="32">its electronic parts unless the manufacturer permits this.</tspan></text></g>
<g class="v2-reading-block" data-block="clinical-reference-0" transform="translate(0 788)"><text class="se-copy" x="89" y="24"><tspan x="89">The often-quoted 37 °C, or 98.6 °F, is a conventional reference for body</tspan><tspan x="89" dy="32">temperature, not an exact value every healthy person must show. Readings vary</tspan></text></g>
<g class="v2-reading-block" data-block="clinical-reference-1" transform="translate(0 852)"><text class="se-copy" x="89" y="24"><tspan x="89">with the person, time of day, activity, measuring site and method. A single</tspan><tspan x="89" dy="32">number is not enough to decide whether someone is well.</tspan></text></g>
<g class="v2-reading-block" data-block="site-qualification-0" transform="translate(0 932)"><text class="se-copy" x="89" y="24"><tspan x="89">A reading from the armpit may differ from one taken at another site. Record the</tspan><tspan x="89" dy="32">actual site and value; do not add a fixed correction to make it “normal”. If</tspan></text></g><g transform="translate(0 996)"><g data-page-illustration="figures/class-6/science/ch07/clinical.png"><image class="science-illustration" href="../../figures/class-6/science/ch07/clinical.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Digital clinical thermometers.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Digital clinical thermometers.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">5</text></g></svg></div></div></section>
