<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="802" rx="18"/><text class="se-copy" x="113" y="222"><tspan x="113"><tspan class="se-bold">Temperature</tspan> — A measure of how</tspan><tspan x="113" dy="32">hot or cold a body is.</tspan></text><text class="se-copy" x="113" y="306"><tspan x="113"><tspan class="se-bold">Thermometer</tspan> — An instrument for</tspan><tspan x="113" dy="32">measuring temperature.</tspan></text><text class="se-copy" x="113" y="390"><tspan x="113"><tspan class="se-bold">Clinical</tspan> <tspan class="se-bold">thermometer</tspan> — An</tspan><tspan x="113" dy="32">instrument designed to measure</tspan><tspan x="113" dy="32">body temperature.</tspan></text><text class="se-copy" x="113" y="506"><tspan x="113"><tspan class="se-bold">Laboratory</tspan> <tspan class="se-bold">thermometer</tspan> — An</tspan><tspan x="113" dy="32">instrument for temperature</tspan><tspan x="113" dy="32">measurements in investigations.</tspan></text><text class="se-copy" x="113" y="622"><tspan x="113"><tspan class="se-bold">Degree</tspan> <tspan class="se-bold">Celsius</tspan> — A temperature</tspan><tspan x="113" dy="32">unit written °C.</tspan></text><text class="se-copy" x="113" y="706"><tspan x="113"><tspan class="se-bold">Degree</tspan> <tspan class="se-bold">Fahrenheit</tspan> — A temperature</tspan><tspan x="113" dy="32">unit written °F.</tspan></text><text class="se-copy" x="113" y="790"><tspan x="113"><tspan class="se-bold">Kelvin</tspan> — The SI unit of temperature,</tspan><tspan x="113" dy="32">written K.</tspan></text><text class="se-copy" x="113" y="874"><tspan x="113"><tspan class="se-bold">Sensing</tspan> <tspan class="se-bold">tip</tspan> — The</tspan><tspan x="113" dy="32">temperature-sensitive end of a</tspan><tspan x="113" dy="32">contact digital thermometer.</tspan></text><text class="se-copy" x="541" y="222"><tspan x="541"><tspan class="se-bold">Bulb</tspan> — The reservoir of liquid in a</tspan><tspan x="541" dy="32">liquid-in-glass thermometer.</tspan></text><text class="se-copy" x="541" y="306"><tspan x="541"><tspan class="se-bold">Liquid</tspan> <tspan class="se-bold">column</tspan> — The visible liquid</tspan><tspan x="541" dy="32">in the narrow tube above the bulb.</tspan></text><text class="se-copy" x="541" y="390"><tspan x="541"><tspan class="se-bold">Scale</tspan> — Marks and numbers used to</tspan><tspan x="541" dy="32">read a measurement.</tspan></text><text class="se-copy" x="541" y="474"><tspan x="541"><tspan class="se-bold">Marked</tspan> <tspan class="se-bold">range</tspan> — The interval</tspan><tspan x="541" dy="32">between an instrument’s lowest and</tspan><tspan x="541" dy="32">highest marked values.</tspan></text><text class="se-copy" x="541" y="590"><tspan x="541"><tspan class="se-bold">Smallest</tspan> <tspan class="se-bold">division</tspan> — The value of</tspan><tspan x="541" dy="32">one smallest interval on a scale.</tspan></text><text class="se-copy" x="541" y="674"><tspan x="541"><tspan class="se-bold">Parallax</tspan> — Apparent shift caused by</tspan><tspan x="541" dy="32">viewing a scale from an angle.</tspan></text><text class="se-copy" x="541" y="758"><tspan x="541"><tspan class="se-bold">Maximum</tspan> <tspan class="se-bold">temperature</tspan> — The</tspan><tspan x="541" dy="32">highest temperature recorded in a</tspan><tspan x="541" dy="32">stated period.</tspan></text><text class="se-copy" x="541" y="874"><tspan x="541"><tspan class="se-bold">Minimum</tspan> <tspan class="se-bold">temperature</tspan> — The</tspan><tspan x="541" dy="32">lowest temperature recorded in a</tspan><tspan x="541" dy="32">stated period.</tspan></text><g transform="translate(0 976)"><g data-page-illustration="figures/class-6/science/ch07/bowls.png"><image class="science-illustration" href="../../figures/class-6/science/ch07/bowls.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Bowls for comparing warmth.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Bowls for comparing warmth.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
