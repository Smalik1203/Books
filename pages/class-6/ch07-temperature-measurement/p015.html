<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204"><tspan x="112">Touch depends on previous sensations. Use a suitable thermometer for a</tspan><tspan x="112" dy="32">numerical temperature measurement.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278"><tspan x="112">Record the number and unit together. Celsius uses °C, Fahrenheit uses °F and</tspan><tspan x="112" dy="32">kelvin uses K.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352"><tspan x="112">37 °C and 98.6 °F are equivalent reference values. Body temperature varies with</tspan><tspan x="112" dy="32">the person, time, site and method.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426"><tspan x="112">Use clinical thermometers only as directed, with permission, hygiene and</tspan><tspan x="112" dy="32">adult guidance. Never use a glass laboratory thermometer in the mouth.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500"><tspan x="112">In a liquid-in-glass thermometer, warming expands the liquid and cooling</tspan><tspan x="112" dy="32">contracts it. Read its range and smallest division before use.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574"><tspan x="112">For water measurements, keep the bulb immersed and clear of the vessel. Wait</tspan><tspan x="112" dy="32">for a steady column and read at eye level.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648"><tspan x="112">Pure melting ice and water are near 0 °C; pure water boils near 100 °C at</tspan><tspan x="112" dy="32">standard atmospheric pressure. Boiling temperature changes with pressure.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722"><tspan x="112">Air-temperature records need a stated place, time and suitable measuring</tspan><tspan x="112" dy="32">conditions. Daily maximum and minimum values are the extremes for a</tspan><tspan x="112" dy="32">reporting period.</tspan></text><image class="science-illustration" data-photo="clinical" href="../../figures/class-6/science/ch07/clinical.png" x="339.04573804573806" y="839" width="373.90852390852393" height="220" preserveAspectRatio="xMidYMid meet"/><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">15</text></g></svg></div></div></section>
