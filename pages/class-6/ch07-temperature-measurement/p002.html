<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="touch-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">7.1 Can We Trust Our Sense of Touch?</tspan></text></g>
<g class="v2-reading-block" data-block="touch-start-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Water from a refrigerator, an earthen pot and a tap can feel different. We often</tspan><tspan x="89" dy="32">use words such as hot, warm and cold without measuring anything. But will two</tspan><tspan x="89" dy="32">hands always agree about the same water?</tspan></text></g>
<g class="v2-reading-block" data-block="bowls-art" transform="translate(0 282)"><image class="science-illustration" data-photo="bowls" href="../../figures/class-6/science/ch07/bowls.png" x="188.41488020176547" y="0" width="675.1702395964691" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="235" y="304" text-anchor="middle">A · warm</text><text class="se-caption" x="526" y="304" text-anchor="middle">B · room temperature</text><text class="se-caption" x="817" y="304" text-anchor="middle">C · cool</text><text class="se-caption" x="89" y="342.88"><tspan x="89">Fig. 7.1 · Three bowls for comparing sensations. Use comfortably warm and cool water;</tspan><tspan x="89" dy="27">remove ice before the hand test.</tspan></text></g>
<g class="v2-reading-block" data-block="touch-task" transform="translate(0 686)"><rect class="se-activity-panel" x="89" y="0" width="874" height="446" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Ask an adult to prepare three bowls: A with comfortably warm water, B</tspan><tspan x="146" dy="32">with room-temperature water and C with cool water. Avoid very hot or</tspan><tspan x="146" dy="32">painfully cold water. Remove any ice from C.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Predict what each hand will feel when both are placed in B. Record your</tspan><tspan x="146" dy="32">prediction before trying.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Briefly place one hand in A and the other in C. Then place both hands</tspan><tspan x="146" dy="32">together in B. Stop immediately if either hand feels uncomfortable.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352"><tspan x="146">Describe each hand’s sensation in your notebook. Did your hands agree?</tspan><tspan x="146" dy="32">Compare your account with another learner’s without changing your own</tspan><tspan x="146" dy="32">observation.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
