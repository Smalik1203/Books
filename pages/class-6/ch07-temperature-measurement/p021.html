<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="21"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 21"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Explore Further</tspan></text></g>
<g class="v2-reading-block" data-block="project-animals" transform="translate(0 170)"><text class="se-heading" x="89" y="30"><tspan x="89">1. Temperature in other animals</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">With an adult, ask a veterinarian or consult a reliable veterinary reference about</tspan><tspan x="89" dy="32">typical body temperatures of two animals. Record species, unit, measuring</tspan><tspan x="89" dy="32">method and source. Compare the information without measuring or handling</tspan><tspan x="89" dy="32">animals yourself. Explain why a human reference value should not simply be</tspan><tspan x="89" dy="32">applied to another species.</tspan></text></g>
<g class="v2-reading-block" data-block="project-india" transform="translate(0 406)"><text class="se-heading" x="89" y="30"><tspan x="89">2. Hot and cold places in India</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Find reported temperatures for two Indian places using an official weather</tspan><tspan x="89" dy="32">source. Record the date, unit and whether each value is a daily observation, a</tspan><tspan x="89" dy="32">forecast or a historical record. Compare like with like. What additional</tspan><tspan x="89" dy="32">information would you need to claim that one place is generally hotter than the</tspan><tspan x="89" dy="32">other?</tspan></text><image class="science-illustration" data-photo="weather" href="../../figures/class-6/science/ch07/weather.png" x="316" y="224" width="420" height="280" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="534.88"><tspan x="89">Consistent instruments and records make comparisons more useful.</tspan></text></g>
<g class="v2-reading-block" data-block="project-planets" transform="translate(0 971)"><text class="se-heading" x="89" y="30"><tspan x="89">3. Temperature beyond Earth</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Use a reliable space-agency source to compare reported temperatures of planets</tspan><tspan x="89" dy="32">and their distances from the Sun. Check whether each temperature describes a</tspan><tspan x="89" dy="32">surface, atmosphere or average. Does distance alone explain the order?</tspan><tspan x="89" dy="32">Investigate one exception. The kelvin scale begins at absolute zero, 0 K, equal to</tspan><tspan x="89" dy="32">−273.15 °C; this is very different from the freezing point of water.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">21</text></g></svg></div></div></section>
