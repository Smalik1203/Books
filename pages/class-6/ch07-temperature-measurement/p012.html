<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="weather-reading-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Weather observations need comparable measuring conditions. Outdoor</tspan><tspan x="89" dy="32">air-temperature instruments are protected from direct sunshine while air can</tspan></text></g>
<g class="v2-reading-block" data-block="weather-reading-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">move around them. A thermometer warmed directly by the Sun can give a</tspan><tspan x="89" dy="32">misleading value for the surrounding shaded air.</tspan></text></g>
<g class="v2-reading-block" data-block="max-min-0" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">Weather reports commonly give the day’s <tspan class="se-bold">maximum</tspan> and <tspan class="se-bold">minimum</tspan> air</tspan><tspan x="89" dy="32">temperatures: its highest and lowest recorded values for the reporting period. A</tspan></text></g>
<g class="v2-reading-block" data-block="max-min-1" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89">single reading at noon cannot establish both. Special instruments or repeated</tspan><tspan x="89" dy="32">automatic records are used to capture the extremes.</tspan></text></g>
<g class="v2-reading-block" data-block="weather-task" transform="translate(0 400)"><rect class="se-activity-panel" x="89" y="0" width="874" height="414" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Choose one place and a reliable weather report. Collect its reported</tspan><tspan x="146" dy="32">maximum and minimum temperatures for ten successive days.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">In your notebook, record date, place, source, unit, maximum and</tspan><tspan x="146" dy="32">minimum. Use the same reporting period and source throughout.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Calculate each day’s temperature range by subtracting its minimum from</tspan><tspan x="146" dy="32">its maximum. Identify the greatest maximum and the smallest minimum</tspan><tspan x="146" dy="32">in your record.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352"><tspan x="146">Describe the changes you actually find. Compare with classmates using</tspan><tspan x="146" dy="32">the same place and dates, and investigate any disagreements.</tspan></text></g><g transform="translate(0 836)"><g data-page-illustration="figures/class-6/science/ch07/weather.png"><image class="science-illustration" href="../../figures/class-6/science/ch07/weather.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Weather measurements.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Weather measurements.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
