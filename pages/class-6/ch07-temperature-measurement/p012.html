<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="boiling-evidence-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Shillong’s elevation also helps explain why readings cluster below the sea-level</tspan><tspan x="89" dy="32">reference of 100 °C.</tspan></text></g>
<g class="v2-reading-block" data-block="air-heading" transform="translate(0 204)"><text class="v2-title" x="89" y="38"><tspan x="89">7.5 Temperature of the Air</tspan></text></g>
<g class="v2-reading-block" data-block="air-start-0" transform="translate(0 262)"><text class="se-copy" x="89" y="24"><tspan x="89">A room thermometer responds to the air and surroundings where it is placed. A</tspan><tspan x="89" dy="32">sunny windowsill and a shaded part of the same room may give different</tspan></text></g>
<g class="v2-reading-block" data-block="air-start-1" transform="translate(0 326)"><text class="se-copy" x="89" y="24"><tspan x="89">readings. Keep the position and time consistent when investigating change, and</tspan><tspan x="89" dy="32">record those details.</tspan></text></g>
<g class="v2-reading-block" data-block="weather-art" transform="translate(0 406)"><image class="science-illustration" data-photo="weather" href="../../figures/class-6/science/ch07/weather.png" x="267.25" y="0" width="517.5" height="345" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="375.88"><tspan x="89">Fig. 7.6 · A ventilated weather-instrument shelter protects temperature instruments from</tspan><tspan x="89" dy="27">direct sunshine. The instruments beside it measure wind.</tspan></text></g>
<g class="v2-reading-block" data-block="weather-reading-0" transform="translate(0 843)"><text class="se-copy" x="89" y="24"><tspan x="89">Weather observations need comparable measuring conditions. Outdoor</tspan><tspan x="89" dy="32">air-temperature instruments are protected from direct sunshine while air can</tspan></text></g>
<g class="v2-reading-block" data-block="weather-reading-1" transform="translate(0 907)"><text class="se-copy" x="89" y="24"><tspan x="89">move around them. A thermometer warmed directly by the Sun can give a</tspan><tspan x="89" dy="32">misleading value for the surrounding shaded air.</tspan></text></g>
<g class="v2-reading-block" data-block="max-min-0" transform="translate(0 987)"><text class="se-copy" x="89" y="24"><tspan x="89">Weather reports commonly give the day’s <tspan class="se-bold">maximum</tspan> and <tspan class="se-bold">minimum</tspan> air</tspan><tspan x="89" dy="32">temperatures: its highest and lowest recorded values for the reporting period. A</tspan></text></g>
<g class="v2-reading-block" data-block="max-min-1" transform="translate(0 1051)"><text class="se-copy" x="89" y="24"><tspan x="89">single reading at noon cannot establish both. Special instruments or repeated</tspan><tspan x="89" dy="32">automatic records are used to capture the extremes.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
