<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="water-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Looking from above or below can make a liquid level appear to line up with the</tspan><tspan x="89" dy="32">wrong mark. This viewing error is called <tspan class="se-bold">parallax</tspan>. Eye-level reading reduces it.</tspan></text></g>
<g class="v2-reading-block" data-block="water-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">Touching the container can also make the thermometer respond to the container</tspan><tspan x="89" dy="32">rather than only to the water.</tspan></text></g>
<g class="v2-reading-block" data-block="removal-0" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">A liquid-in-glass laboratory thermometer does not usually retain its highest</tspan><tspan x="89" dy="32">reading. Lift it out of warm water into cooler air and the column begins to fall. A</tspan></text></g>
<g class="v2-reading-block" data-block="removal-1" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89">reading taken afterwards no longer describes the water at the moment of</tspan><tspan x="89" dy="32">measurement. Keep the bulb immersed while reading.</tspan></text></g>
<g class="v2-reading-block" data-block="fixed-points" transform="translate(0 412)"><text class="se-heading" x="89" y="30"><tspan x="89">Melting Ice and Boiling Water</tspan></text></g>
<g class="v2-reading-block" data-block="teacher-demo-0" transform="translate(0 460)"><text class="se-copy" x="89" y="24"><tspan x="89">In a teacher-led demonstration, observe a suitable thermometer in a well-mixed</tspan><tspan x="89" dy="32">mixture of melting ice and water, and then an appropriate instrument measuring</tspan></text></g>
<g class="v2-reading-block" data-block="teacher-demo-1" transform="translate(0 524)"><text class="se-copy" x="89" y="24"><tspan x="89">boiling water. Watch from a safe distance. Do not handle the hot vessel, steam,</tspan><tspan x="89" dy="32">heater or thermometer.</tspan></text></g>
<g class="v2-reading-block" data-block="phase-change-0" transform="translate(0 604)"><text class="se-copy" x="89" y="24"><tspan x="89">For pure water near standard atmospheric pressure, melting ice and water</tspan><tspan x="89" dy="32">together are near 0 °C, while boiling water is near 100 °C. During each change,</tspan></text></g>
<g class="v2-reading-block" data-block="phase-change-1" transform="translate(0 668)"><text class="se-copy" x="89" y="24"><tspan x="89">the temperature can remain nearly steady while both forms are present. Heating</tspan><tspan x="89" dy="32">does not always mean that the temperature keeps rising.</tspan></text></g>
<g class="v2-reading-block" data-block="pressure-0" transform="translate(0 748)"><text class="se-copy" x="89" y="24"><tspan x="89">The boiling temperature also depends on pressure. At a higher place, the air</tspan><tspan x="89" dy="32">pressure is usually lower, and water boils at a lower temperature. Dissolved</tspan></text></g>
<g class="v2-reading-block" data-block="pressure-1" transform="translate(0 812)"><text class="se-copy" x="89" y="24"><tspan x="89">substances and measurement conditions can matter too. A boiling reading below</tspan><tspan x="89" dy="32">100 °C does not automatically mean that the thermometer is broken.</tspan></text></g>
<g class="v2-reading-block" data-block="boiling-data-task" transform="translate(0 892)"><rect class="se-activity-panel" x="89" y="0" width="874" height="370" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Study the supplied readings from a boiling-water demonstration in</tspan><tspan x="146" dy="32">Shillong in Table 7.3. This is a data investigation; do not boil water</tspan><tspan x="146" dy="32">yourself.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Find the highest and lowest readings and calculate their difference.</tspan><tspan x="146" dy="32">Which value occurs more than once?</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Suggest measurement details that could account for the small spread.</tspan><tspan x="146" dy="32">Explain why you need the place and conditions before comparing every</tspan><tspan x="146" dy="32">result with 100 °C.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
