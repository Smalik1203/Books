<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="water-heading" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Measuring Water Carefully</tspan></text></g>
<g class="v2-reading-block" data-block="water-task" transform="translate(0 160)"><rect class="se-activity-panel" x="89" y="0" width="874" height="446" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Ask the teacher for a beaker of comfortably warm water and a suitable</tspan><tspan x="146" dy="32">mercury-free laboratory thermometer. No pupil heating is needed.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Support the thermometer upright. Immerse its bulb fully in the water,</tspan><tspan x="146" dy="32">clear of the beaker’s sides and bottom.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Wait for the liquid column to stop changing. Bring your eyes to the level</tspan><tspan x="146" dy="32">of the top of the column, keeping your face safely away from the</tspan><tspan x="146" dy="32">apparatus.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352"><tspan x="146">Read and record the temperature with its unit while the bulb remains in</tspan><tspan x="146" dy="32">the water. Repeat carefully. Compare readings and explain any</tspan><tspan x="146" dy="32">differences in the method.</tspan></text></g>
<g class="v2-reading-block" data-block="water-apparatus" transform="translate(0 628)"><g data-instructional-figure="water"><g class="v2-temperature-diagram" data-diagram="water"><path class="v2-temperature-glass" d="M311 142V334Q421 351 531 334V142"/><path class="v2-temperature-water" d="M315 185H527V330Q421 344 315 330Z"/><ellipse class="v2-temperature-line" cx="421" cy="142" rx="110" ry="9"/><path class="v2-temperature-glass" d="M415 291V30Q421 18 427 30V291A10 10 0 1 1 415 291Z"/><path class="v2-temperature-liquid" d="M421 121.41000000000001L421 298"/><circle class="v2-temperature-bulb" cx="421" cy="298" r="5"/><path class="v2-temperature-line" d="M428 46L435 46"/><path class="v2-temperature-line" d="M428 58L435 58"/><path class="v2-temperature-line" d="M428 70L435 70"/><path class="v2-temperature-line" d="M428 82L435 82"/><path class="v2-temperature-line" d="M428 94L435 94"/><path class="v2-temperature-line" d="M428 106L435 106"/><path class="v2-temperature-line" d="M428 118L435 118"/><path class="v2-temperature-line" d="M428 130L435 130"/><path class="v2-temperature-line" d="M428 142L435 142"/><path class="v2-temperature-line" d="M428 154L435 154"/><path class="v2-temperature-dashed" d="M437 122L636 122"/><path class="v2-temperature-line" d="M639 122Q664 101 689 122Q664 143 639 122Z"/><circle class="v2-temperature-bulb" cx="664" cy="122" r="7"/><text class="v2-temperature-label" x="716" y="130" text-anchor="start">Eye level</text><path class="v2-temperature-line" d="M434 294L624 268"/><text class="v2-temperature-label" x="642" y="276" text-anchor="start">Bulb in water</text><text class="v2-temperature-label" x="526" y="380" text-anchor="middle">Clear of sides and bottom</text></g></g><text class="se-caption" x="89" y="415.88"><tspan x="89">Fig. 7.5 · Keep the bulb immersed and clear of the glass. View the liquid level straight across.</tspan></text></g>
<g class="v2-reading-block" data-block="water-evidence-0" transform="translate(0 1072)"><text class="se-copy" x="89" y="24"><tspan x="89">Looking from above or below can make a liquid level appear to line up with the</tspan><tspan x="89" dy="32">wrong mark. This viewing error is called <tspan class="se-bold">parallax</tspan>. Eye-level reading reduces it.</tspan></text></g>
<g class="v2-reading-block" data-block="water-evidence-1" transform="translate(0 1136)"><text class="se-copy" x="89" y="24"><tspan x="89">Touching the container can also make the thermometer respond to the container</tspan><tspan x="89" dy="32">rather than only to the water.</tspan></text></g>
<g class="v2-reading-block" data-block="removal-0" transform="translate(0 1216)"><text class="se-copy" x="89" y="24"><tspan x="89">A liquid-in-glass laboratory thermometer does not usually retain its highest</tspan><tspan x="89" dy="32">reading. Lift it out of warm water into cooler air and the column begins to fall. A</tspan></text></g>
<g class="v2-reading-block" data-block="removal-1" transform="translate(0 1280)"><text class="se-copy" x="89" y="24"><tspan x="89">reading taken afterwards no longer describes the water at the moment of</tspan><tspan x="89" dy="32">measurement. Keep the bulb immersed while reading.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
