<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="division-equation" transform="translate(0 112)"><text class="v2-equation" x="89" y="30"><tspan x="89">Value of one division = (30 − 20) °C ÷ 10 = 1 °C</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">There are eleven tick marks from 20 to 30 inclusive, but only ten intervals.</tspan></text></g>
<g class="v2-reading-block" data-block="resolution-0" transform="translate(0 209)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.99390" data-space-ratio="1.535">Another<tspan dx="2.99390"> thermometer</tspan><tspan dx="2.99390"> may</tspan><tspan dx="2.99390"> have</tspan><tspan dx="2.99390"> divisions</tspan><tspan dx="2.99390"> of</tspan><tspan dx="2.99390"> 0.5</tspan><tspan dx="2.99390"> °C</tspan><tspan dx="2.99390"> or</tspan><tspan dx="2.99390"> 2</tspan><tspan dx="2.99390"> °C.</tspan><tspan dx="2.99390"> Do</tspan><tspan dx="2.99390"> not</tspan><tspan dx="2.99390"> assume</tspan><tspan dx="2.99390"> that</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.80160" data-space-ratio="1.680">every<tspan dx="3.80160"> small</tspan><tspan dx="3.80160"> line</tspan><tspan dx="3.80160"> means</tspan><tspan dx="3.80160"> 1</tspan><tspan dx="3.80160"> °C.</tspan><tspan dx="3.80160"> Small</tspan><tspan dx="3.80160"> divisions</tspan><tspan dx="3.80160"> let</tspan><tspan dx="3.80160"> us</tspan><tspan dx="3.80160"> distinguish</tspan><tspan dx="3.80160"> closer</tspan><tspan dx="3.80160"> readings;</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">they do not, by themselves, prove that an instrument is accurate.</tspan></text></g>
