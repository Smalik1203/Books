="146">Find the highest and lowest readings and calculate their difference.</tspan><tspan x="146" dy="32">Which value occurs more than once?</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Suggest measurement details that could account for the small spread.</tspan><tspan x="146" dy="32">Explain why you need the place and conditions before comparing every</tspan><tspan x="146" dy="32">result with 100 °C.</tspan></text></g>
