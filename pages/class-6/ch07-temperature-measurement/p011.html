<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 11"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="boiling-table" transform="translate(0 112)"><g data-comparison-table="boiling-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 7.3 · Supplied boiling-water readings in Shillong</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Observer</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="583.7" y="70.08"><tspan x="583.7">Temperature</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Phiban</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="583.7" y="110.08"><tspan x="583.7">97.8 °C</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="122" y2="122"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="150.07999999999998"><tspan x="103">Shemphang</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="583.7" y="150.07999999999998"><tspan x="583.7">98.0 °C</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="162" y2="162"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="190.07999999999998"><tspan x="103">Onestar</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="583.7" y="190.07999999999998"><tspan x="583.7">97.9 °C</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="202" y2="202"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="230.07999999999998"><tspan x="103">Kloi</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="583.7" y="230.07999999999998"><tspan x="583.7">98.0 °C</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="242" y2="242"/><g data-comparison-row="5"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="270.08"><tspan x="103">Bandarisha</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="583.7" y="270.08"><tspan x="583.7">98.1 °C</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="282" y2="282"/><rect class="v2-table-frame" x="89" y="42" width="874" height="240"/><line class="v2-table-rule" x1="569.7" x2="569.7" y1="42" y2="282"/><text class="v2-table-note" x="89" y="314.88"><tspan x="89">These readings are provided for analysis; they are not a result you are required to reproduce.</tspan></text></g></g>
<g class="v2-reading-block" data-block="boiling-evidence-0" transform="translate(0 448)"><text class="se-copy" x="89" y="24"><tspan x="89">The readings span 0.3 °C. Differences in eye position, timing, instruments or</tspan><tspan x="89" dy="32">conditions could contribute. Check those details before choosing a cause.</tspan></text></g>
<g class="v2-reading-block" data-block="boiling-evidence-1" transform="translate(0 512)"><text class="se-copy" x="89" y="24"><tspan x="89">Shillong’s elevation also helps explain why readings cluster below the sea-level</tspan><tspan x="89" dy="32">reference of 100 °C.</tspan></text></g>
<g class="v2-reading-block" data-block="air-heading" transform="translate(0 604)"><text class="v2-title" x="89" y="38"><tspan x="89">7.5 Temperature of the Air</tspan></text></g>
<g class="v2-reading-block" data-block="air-start-0" transform="translate(0 662)"><text class="se-copy" x="89" y="24"><tspan x="89">A room thermometer responds to the air and surroundings where it is placed. A</tspan><tspan x="89" dy="32">sunny windowsill and a shaded part of the same room may give different</tspan></text></g>
<g class="v2-reading-block" data-block="air-start-1" transform="translate(0 726)"><text class="se-copy" x="89" y="24"><tspan x="89">readings. Keep the position and time consistent when investigating change, and</tspan><tspan x="89" dy="32">record those details.</tspan></text></g>
<g class="v2-reading-block" data-block="weather-art" transform="translate(0 806)"><image class="science-illustration" data-photo="weather" href="../../figures/class-6/science/ch07/weather.png" x="267.25" y="0" width="517.5" height="345" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="375.88"><tspan x="89">Fig. 7.6 · A ventilated weather-instrument shelter protects temperature instruments from</tspan><tspan x="89" dy="27">direct sunshine. The instruments beside it measure wind.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">11</text></g></svg></div></div></section>
