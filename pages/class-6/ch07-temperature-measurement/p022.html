<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="22" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 22"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-room-water" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">4. A room and a beaker of water</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">With teacher approval, compare room air and a beaker of water at the same three</tspan><tspan x="89" dy="32">times each day for two weeks. Use suitable thermometers in a fixed shaded</tspan><tspan x="89" dy="32">position. Keep the water thermometer’s bulb immersed and clear of the vessel.</tspan><tspan x="89" dy="32">Record date, time, both values and units. Keep the water out of direct sunlight</tspan><tspan x="89" dy="32">and do not heat it. Do the temperatures always agree? Discuss why the water and</tspan><tspan x="89" dy="32">the air may respond to changes at different rates.</tspan></text><g transform="translate(0 256)"><g class="v2-temperature-diagram" data-diagram="room-water"><path class="v2-temperature-glass" d="M288 282V38Q294 26 300 38V282A10 10 0 1 1 288 282Z"/><path class="v2-temperature-liquid" d="M294 123.8L294
