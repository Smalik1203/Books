<section class="page page--food page--science-editorial page--science-v2 page--g6-ch07" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Temperature and its Measurement, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M40 64V17Q40 4 53 4Q66 4 66 17V64A21 21 0 1 1 40 64ZM53 29V80M72 20H85M72 35H80M72 50H85"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Temperature and its Measurement</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="kelvin-equation" transform="translate(0 112)"><text class="v2-equation" x="89" y="30"><tspan x="89">25 °C corresponds to (25 + 273.15) K = 298.15 K</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">Add 273.15 to the numerical Celsius value; write the result with K.</tspan></text></g>
<g class="v2-reading-block" data-block="unit-think" transform="translate(0 209)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="186" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">One report says 37 °C and another says 98.6 °F. Has the temperature</tspan><tspan x="113" dy="32">necessarily risen? Explain why comparing the numbers without their scales</tspan><tspan x="113" dy="32">would mislead us.</tspan></text></g>
<g class="v2-reading-block" data-block="clinical-heading" transform="translate(0 429)"><text class="v2-title" x="89" y="38"><tspan x="89">7.3 Measuring Body Temperature</tspan></text></g>
<g class="v2-reading-block" data-block="clinical-intro-0" transform="translate(0 487)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">clinical</tspan> <tspan class="se-bold">thermometer</tspan> is designed for measuring body temperature. A digital</tspan><tspan x="89" dy="32">model has a sensing tip, an electronic circuit and a display. The sensor responds</tspan></text></g>
<g class="v2-reading-block" data-block="clinical-intro-1" transform="translate(0 551)"><text class="se-copy" x="89" y="24"><tspan x="89">to temperature, and the instrument shows a reading. A battery supplies the</tspan><tspan x="89" dy="32">electrical energy it needs.</tspan></text></g>
<g class="v2-reading-block" data-block="clinical-art" transform="translate(0 631)"><image class="science-illustration" data-photo="clinical" href="../../figures/class-6/science/ch07/clinical.png" x="271.06237006237006" y="0" width="509.8752598752599" height="300" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="330.88"><tspan x="89">Fig. 7.2 · A contact digital clinical thermometer and a non-contact infrared thermometer.</tspan><tspan x="89" dy="27">Displays are left blank here.</tspan></text></g>
<g class="v2-reading-block" data-block="clinical-types-0" transform="translate(0 1023)"><text class="se-copy" x="89" y="24"><tspan x="89">The sensing tip of a contact model must be used at a body site approved in its</tspan><tspan x="89" dy="32">instructions. A non-contact infrared clinical thermometer detects infrared</tspan></text></g>
<g class="v2-reading-block" data-block="clinical-types-1" transform="translate(0 1087)"><text class="se-copy" x="89" y="24"><tspan x="89">radiation from the intended site, commonly the forehead. Its distance and</tspan><tspan x="89" dy="32">positioning instructions matter; it is not used like a contact probe.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
