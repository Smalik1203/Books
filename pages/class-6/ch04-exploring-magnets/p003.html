<section class="page page--food page--science-editorial page--illustrated" data-science-chapter="4" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 3"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><g data-content-kind="body"><text class="se-copy" x="89" y="119"><tspan x="89" data-justified="874">A<tspan dx="1.67494"> magnet’s</tspan><tspan dx="1.67494"> shape</tspan><tspan dx="1.67494"> gives</tspan><tspan dx="1.67494"> a</tspan><tspan dx="1.67494"> clue</tspan><tspan dx="1.67494"> to</tspan><tspan dx="1.67494"> its</tspan><tspan dx="1.67494"> use.</tspan><tspan dx="1.67494"> A</tspan><tspan dx="1.67494"> long</tspan><tspan dx="1.67494"> bar</tspan><tspan dx="1.67494"> is</tspan><tspan dx="1.67494"> easy</tspan><tspan dx="1.67494"> to</tspan><tspan dx="1.67494"> hold</tspan><tspan dx="1.67494"> and</tspan><tspan dx="1.67494"> turn.</tspan><tspan dx="1.67494"> A</tspan><tspan dx="1.67494"> ring</tspan></tspan><tspan x="89" dy="31" data-justified="874">can<tspan dx="1.04044"> slide</tspan><tspan dx="1.04044"> over</tspan><tspan dx="1.04044"> a</tspan><tspan dx="1.04044"> rod.</tspan><tspan dx="1.04044"> Shape</tspan><tspan dx="1.04044"> alone,</tspan><tspan dx="1.04044"> however,</tspan><tspan dx="1.04044"> does</tspan><tspan dx="1.04044"> not</tspan><tspan dx="1.04044"> tell</tspan><tspan dx="1.04044"> you</tspan><tspan dx="1.04044"> how</tspan><tspan dx="1.04044"> strong</tspan><tspan dx="1.04044"> a</tspan><tspan dx="1.04044"> magnet</tspan><tspan dx="1.04044"> is.</tspan></tspan><tspan x="89" dy="31">Compare what the magnets can actually do.</tspan></text></g>
<g data-content-kind="heading"><text class="se-heading" x="89" y="231"><tspan x="89">4.1 Magnetic and Non-magnetic Materials</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="288"><tspan x="89" data-justified="874">Bring<tspan dx="0.84361"> a</tspan><tspan dx="0.84361"> magnet</tspan><tspan dx="0.84361"> near</tspan><tspan dx="0.84361"> a</tspan><tspan dx="0.84361"> steel</tspan><tspan dx="0.84361"> pin</tspan><tspan dx="0.84361"> and</tspan><tspan dx="0.84361"> the</tspan><tspan dx="0.84361"> pin</tspan><tspan dx="0.84361"> jumps</tspan><tspan dx="0.84361"> to</tspan><tspan dx="0.84361"> it.</tspan><tspan dx="0.84361"> Bring</tspan><tspan dx="0.84361"> the</tspan><tspan dx="0.84361"> same</tspan><tspan dx="0.84361"> magnet</tspan><tspan dx="0.84361"> near</tspan></tspan><tspan x="89" dy="31">a rubber eraser and nothing happens.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="364"><tspan x="89">So a magnet does not pull everything. It pulls only some things. Which ones?</tspan></text></g>
<g data-content-kind="activity"><rect class="se-activity-panel" x="89" y="386" width="874" height="501"/><path class="se-activity-tab" d="M109 386H943Q963 386 963 406V429H89V406Q89 386 109 386Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="392" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="415" text-anchor="start">The setup</text><text class="se-copy" x="113" y="481"><tspan x="113" data-justified="826">You<tspan dx="1.28293"> will</tspan><tspan dx="1.28293"> need:</tspan><tspan dx="1.28293"> a</tspan><tspan dx="1.28293"> magnet,</tspan><tspan dx="1.28293"> and</tspan><tspan dx="1.28293"> many</tspan><tspan dx="1.28293"> small</tspan><tspan dx="1.28293"> objects</tspan><tspan dx="1.28293"> made</tspan><tspan dx="1.28293"> of</tspan><tspan dx="1.28293"> different</tspan><tspan dx="1.28293"> materials</tspan><tspan dx="1.28293"> —</tspan></tspan><tspan x="113" dy="31" data-justified="826">a<tspan dx="0.79931"> pencil,</tspan><tspan dx="0.79931"> an</tspan><tspan dx="0.79931"> eraser,</tspan><tspan dx="0.79931"> a</tspan><tspan dx="0.79931"> steel</tspan><tspan dx="0.79931"> paper</tspan><tspan dx="0.79931"> clip,</tspan><tspan dx="0.79931"> a</tspan><tspan dx="0.79931"> plastic</tspan><tspan dx="0.79931"> scale,</tspan><tspan dx="0.79931"> an</tspan><tspan dx="0.79931"> iron</tspan><tspan dx="0.79931"> nail,</tspan><tspan dx="0.79931"> a</tspan><tspan dx="0.79931"> glass</tspan><tspan dx="0.79931"> marble,</tspan></tspan><tspan x="113" dy="31">a coin, a piece of cloth, a key, a rubber band, a piece of wood, a sharpener.</tspan></text><text class="se-activity-step" x="114" y="586" text-anchor="start">1.</text><text class="se-copy" x="143" y="586"><tspan x="143">Look at each object. Write down what material it is made of.</tspan></text><text class="se-activity-step" x="114" y="629" text-anchor="start">2.</text><text class="se-copy" x="143" y="629"><tspan x="143" data-justified="796">Now<tspan dx="1.76684"> predict.</tspan><tspan dx="1.76684"> Before</tspan><tspan dx="1.76684"> you</tspan><tspan dx="1.76684"> test</tspan><tspan dx="1.76684"> anything,</tspan><tspan dx="1.76684"> write</tspan><tspan dx="1.76684"> down</tspan><tspan dx="1.76684"> whether</tspan><tspan dx="1.76684"> you</tspan><tspan dx="1.76684"> think</tspan><tspan dx="1.76684"> it</tspan><tspan dx="1.76684"> will</tspan></tspan><tspan x="143" dy="31">stick to the magnet. Write Yes or No for every object.</tspan></text><text class="se-activity-step" x="114" y="703" text-anchor="start">3.</text><text class="se-copy" x="143" y="703"><tspan x="143" data-justified="796">Only<tspan dx="0.11258"> after</tspan><tspan dx="0.11258"> all</tspan><tspan dx="0.11258"> your</tspan><tspan dx="0.11258"> predictions</tspan><tspan dx="0.11258"> are</tspan><tspan dx="0.11258"> written,</tspan><tspan dx="0.11258"> bring</tspan><tspan dx="0.11258"> the</tspan><tspan dx="0.11258"> magnet</tspan><tspan dx="0.11258"> near</tspan><tspan dx="0.11258"> each</tspan><tspan dx="0.11258"> object,</tspan></tspan><tspan x="143" dy="31">one by one.</tspan></text><text class="se-activity-step" x="114" y="777" text-anchor="start">4.</text><text class="se-copy" x="143" y="777"><tspan x="143">Write down what really happened.</tspan></text><text class="se-copy" x="113" y="820"><tspan x="113" data-justified="826">Safety:<tspan dx="1.67556"> Keep</tspan><tspan dx="1.67556"> small</tspan><tspan dx="1.67556"> magnets</tspan><tspan dx="1.67556"> and</tspan><tspan dx="1.67556"> objects</tspan><tspan dx="1.67556"> away</tspan><tspan dx="1.67556"> from</tspan><tspan dx="1.67556"> young</tspan><tspan dx="1.67556"> children.</tspan><tspan dx="1.67556"> Never</tspan><tspan dx="1.67556"> put</tspan><tspan dx="1.67556"> a</tspan></tspan><tspan x="113" dy="31">magnet in your mouth.</tspan></text></g>
<g data-content-kind="prompt"><g class="se-feature--observe"><rect class="se-prompt" x="89" y="909" width="874" height="142"/><line class="se-think-rule" x1="89" x2="963" y1="909" y2="909"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What you saw"><svg class="se-feature-icon se-feature--observe" x="113" y="920" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="949">What you saw</text></g><text class="se-copy" x="113" y="993"><tspan x="113" data-justified="826">Compare<tspan dx="0.13316"> the</tspan><tspan dx="0.13316"> two</tspan><tspan dx="0.13316"> columns.</tspan><tspan dx="0.13316"> Where</tspan><tspan dx="0.13316"> were</tspan><tspan dx="0.13316"> you</tspan><tspan dx="0.13316"> right?</tspan><tspan dx="0.13316"> Where</tspan><tspan dx="0.13316"> were</tspan><tspan dx="0.13316"> you</tspan><tspan dx="0.13316"> wrong?</tspan><tspan dx="0.13316"> Look</tspan></tspan><tspan x="113" dy="31">only at the objects that stuck. What do those objects have in common?</tspan></text></g></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1094"><tspan x="89" data-justified="874">Test<tspan dx="0.36473"> a</tspan><tspan dx="0.36473"> part</tspan><tspan dx="0.36473"> of</tspan><tspan dx="0.36473"> the</tspan><tspan dx="0.36473"> object</tspan><tspan dx="0.36473"> whose</tspan><tspan dx="0.36473"> material</tspan><tspan dx="0.36473"> you</tspan><tspan dx="0.36473"> know.</tspan><tspan dx="0.36473"> A</tspan><tspan dx="0.36473"> pencil</tspan><tspan dx="0.36473"> may</tspan><tspan dx="0.36473"> have</tspan><tspan dx="0.36473"> a</tspan><tspan dx="0.36473"> metal</tspan><tspan dx="0.36473"> ferrule,</tspan></tspan><tspan x="89" dy="31" data-justified="874">and<tspan dx="1.56070"> a</tspan><tspan dx="1.56070"> sharpener</tspan><tspan dx="1.56070"> may</tspan><tspan dx="1.56070"> have</tspan><tspan dx="1.56070"> a</tspan><tspan dx="1.56070"> steel</tspan><tspan dx="1.56070"> blade</tspan><tspan dx="1.56070"> inside</tspan><tspan dx="1.56070"> a</tspan><tspan dx="1.56070"> plastic</tspan><tspan dx="1.56070"> body.</tspan><tspan dx="1.56070"> If</tspan><tspan dx="1.56070"> only</tspan><tspan dx="1.56070"> one</tspan><tspan dx="1.56070"> part</tspan><tspan dx="1.56070"> sticks,</tspan></tspan><tspan x="89" dy="31">record that part rather than calling the whole object magnetic.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1201"><tspan x="89" data-justified="874">An<tspan dx="4.49583"> object</tspan><tspan dx="4.49583"> that</tspan><tspan dx="4.49583"> does</tspan><tspan dx="4.49583"> not</tspan><tspan dx="4.49583"> stick</tspan><tspan dx="4.49583"> may</tspan><tspan dx="4.49583"> simply</tspan><tspan dx="4.49583"> be</tspan><tspan dx="4.49583"> too</tspan><tspan dx="4.49583"> far</tspan><tspan dx="4.49583"> from</tspan><tspan dx="4.49583"> the</tspan><tspan dx="4.49583"> magnet.</tspan><tspan dx="4.49583"> Bring</tspan><tspan dx="4.49583"> the</tspan></tspan><tspan x="89" dy="31" data-justified="874">magnet<tspan dx="2.83760"> close</tspan><tspan dx="2.83760"> without</tspan><tspan dx="2.83760"> forcing</tspan><tspan dx="2.83760"> the</tspan><tspan dx="2.83760"> object</tspan><tspan dx="2.83760"> against</tspan><tspan dx="2.83760"> it.</tspan><tspan dx="2.83760"> If</tspan><tspan dx="2.83760"> a</tspan><tspan dx="2.83760"> result</tspan><tspan dx="2.83760"> surprises</tspan><tspan dx="2.83760"> you,</tspan><tspan dx="2.83760"> repeat</tspan></tspan><tspan x="89" dy="31">the test and compare it with a known steel paper clip.</tspan></text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">3</text></g><!-- /botanical-footer --></svg></div></div></section>
