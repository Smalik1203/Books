<section class="page page--food page--science-editorial page--illustrated" data-science-chapter="4" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 14"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><g data-content-kind="body"><text class="se-copy" x="89" y="119"><tspan x="89" data-justified="874">Test<tspan dx="0.60607"> both</tspan><tspan dx="0.60607"> ends.</tspan><tspan dx="0.60607"> If</tspan><tspan dx="0.60607"> the</tspan><tspan dx="0.60607"> first</tspan><tspan dx="0.60607"> end</tspan><tspan dx="0.60607"> attracts,</tspan><tspan dx="0.60607"> turn</tspan><tspan dx="0.60607"> the</tspan><tspan dx="0.60607"> test</tspan><tspan dx="0.60607"> bar</tspan><tspan dx="0.60607"> around</tspan><tspan dx="0.60607"> and</tspan><tspan dx="0.60607"> try</tspan><tspan dx="0.60607"> its</tspan><tspan dx="0.60607"> other</tspan><tspan dx="0.60607"> end</tspan></tspan><tspan x="89" dy="31" data-justified="874">against<tspan dx="2.96618"> the</tspan><tspan dx="2.96618"> same</tspan><tspan dx="2.96618"> pole</tspan><tspan dx="2.96618"> of</tspan><tspan dx="2.96618"> your</tspan><tspan dx="2.96618"> known</tspan><tspan dx="2.96618"> magnet.</tspan><tspan dx="2.96618"> Repulsion</tspan><tspan dx="2.96618"> in</tspan><tspan dx="2.96618"> either</tspan><tspan dx="2.96618"> trial</tspan><tspan dx="2.96618"> identifies</tspan><tspan dx="2.96618"> a</tspan></tspan><tspan x="89" dy="31">magnet. This is why a single observation of attraction is not enough.</tspan></text></g>
<g data-content-kind="heading"><text class="se-heading" x="89" y="231"><tspan x="89">A Magnet Near a Compass</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="288"><tspan x="89">A compass needle is a magnet too. So it should follow the same rules.</tspan></text></g>
<g data-content-kind="activity"><rect class="se-activity-panel" x="89" y="310" width="874" height="525"/><path class="se-activity-tab" d="M109 310H943Q963 310 963 330V353H89V330Q89 310 109 310Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="316" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="339" text-anchor="start">The setup</text><text class="se-copy" x="113" y="405"><tspan x="113">You will need: a magnetic compass, a bar magnet with poles marked.</tspan></text><text class="se-activity-step" x="114" y="448" text-anchor="start">1.</text><text class="se-copy" x="143" y="448"><tspan x="143">Put the compass on a flat table, away from anything made of iron or steel.</tspan></text><text class="se-activity-step" x="114" y="491" text-anchor="start">2.</text><text class="se-copy" x="143" y="491"><tspan x="143">Wait for the needle to settle along the north-south line.</tspan></text><text class="se-activity-step" x="114" y="534" text-anchor="start">3.</text><text class="se-copy" x="143" y="534"><tspan x="143" data-justified="796">Mark<tspan dx="1.05615"> a</tspan><tspan dx="1.05615"> position</tspan><tspan dx="1.05615"> diagonally</tspan><tspan dx="1.05615"> beside</tspan><tspan dx="1.05615"> the</tspan><tspan dx="1.05615"> north-seeking</tspan><tspan dx="1.05615"> end,</tspan><tspan dx="1.05615"> clear</tspan><tspan dx="1.05615"> of</tspan><tspan dx="1.05615"> the</tspan><tspan dx="1.05615"> needle.</tspan></tspan><tspan x="143" dy="31" data-justified="796">Slowly<tspan dx="6.68228"> approach</tspan><tspan dx="6.68228"> that</tspan><tspan dx="6.68228"> position</tspan><tspan dx="6.68228"> with</tspan><tspan dx="6.68228"> the</tspan><tspan dx="6.68228"> North</tspan><tspan dx="6.68228"> pole,</tspan><tspan dx="6.68228"> keeping</tspan><tspan dx="6.68228"> the</tspan><tspan dx="6.68228"> magnet</tspan></tspan><tspan x="143" dy="31">horizontal.</tspan></text><text class="se-activity-step" x="114" y="639" text-anchor="start">4.</text><text class="se-copy" x="143" y="639"><tspan x="143">Watch the needle. Does it turn? Which way?</tspan></text><text class="se-activity-step" x="114" y="682" text-anchor="start">5.</text><text class="se-copy" x="143" y="682"><tspan x="143">Move the magnet away. Let the needle settle again.</tspan></text><text class="se-activity-step" x="114" y="725" text-anchor="start">6.</text><text class="se-copy" x="143" y="725"><tspan x="143" data-justified="796">Reverse<tspan dx="5.12254"> the</tspan><tspan dx="5.12254"> bar</tspan><tspan dx="5.12254"> magnet</tspan><tspan dx="5.12254"> and</tspan><tspan dx="5.12254"> approach</tspan><tspan dx="5.12254"> the</tspan><tspan dx="5.12254"> same</tspan><tspan dx="5.12254"> marked</tspan><tspan dx="5.12254"> position</tspan><tspan dx="5.12254"> with</tspan><tspan dx="5.12254"> its</tspan></tspan><tspan x="143" dy="31">South pole. Keep the distance and height the same.</tspan></text><text class="se-activity-step" x="114" y="799" text-anchor="start">7.</text><text class="se-copy" x="143" y="799"><tspan x="143">Watch again.</tspan></text></g>
<g data-content-kind="prompt"><g class="se-feature--observe"><rect class="se-prompt" x="89" y="857" width="874" height="173"/><line class="se-think-rule" x1="89" x2="963" y1="857" y2="857"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What you saw"><svg class="se-feature-icon se-feature--observe" x="113" y="868" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="897">What you saw</text></g><text class="se-copy" x="113" y="941"><tspan x="113" data-justified="826">Sketch<tspan dx="5.61748"> the</tspan><tspan dx="5.61748"> needle</tspan><tspan dx="5.61748"> direction</tspan><tspan dx="5.61748"> in</tspan><tspan dx="5.61748"> each</tspan><tspan dx="5.61748"> trial.</tspan><tspan dx="5.61748"> Did</tspan><tspan dx="5.61748"> reversing</tspan><tspan dx="5.61748"> the</tspan><tspan dx="5.61748"> pole</tspan><tspan dx="5.61748"> change</tspan><tspan dx="5.61748"> its</tspan></tspan><tspan x="113" dy="31" data-justified="826">direction?<tspan dx="2.12957"> Did</tspan><tspan dx="2.12957"> it</tspan><tspan dx="2.12957"> return</tspan><tspan dx="2.12957"> when</tspan><tspan dx="2.12957"> the</tspan><tspan dx="2.12957"> magnet</tspan><tspan dx="2.12957"> was</tspan><tspan dx="2.12957"> removed?</tspan><tspan dx="2.12957"> Does</tspan><tspan dx="2.12957"> this</tspan><tspan dx="2.12957"> match</tspan><tspan dx="2.12957"> what</tspan></tspan><tspan x="113" dy="31">you found in the investigation with two bar magnets?</tspan></text></g></g>
<g data-content-kind="body"><g class="se-learning-cue se-feature--explain" data-feature="explain" aria-label="The mechanism"><svg class="se-feature-icon se-feature--explain" x="92" y="1051" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h5m10 0h5M7 7l3 3m4 4 3 3M7 17l3-3m4-4 3-3M15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="148" y="1080">The mechanism</text></g><text class="se-copy" x="89" y="1137"><tspan x="89" data-justified="874">The<tspan dx="0.40752"> needle</tspan><tspan dx="0.40752"> turns</tspan><tspan dx="0.40752"> in</tspan><tspan dx="0.40752"> response</tspan><tspan dx="0.40752"> to</tspan><tspan dx="0.40752"> both</tspan><tspan dx="0.40752"> Earth's</tspan><tspan dx="0.40752"> field</tspan><tspan dx="0.40752"> and</tspan><tspan dx="0.40752"> the</tspan><tspan dx="0.40752"> nearby</tspan><tspan dx="0.40752"> magnet's</tspan><tspan dx="0.40752"> field.</tspan><tspan dx="0.40752"> The</tspan></tspan><tspan x="89" dy="31">effect acts on the whole needle, producing torque about its pivot.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1213"><tspan x="89" data-justified="874">Reversing<tspan dx="6.96633"> the</tspan><tspan dx="6.96633"> nearby</tspan><tspan dx="6.96633"> magnet</tspan><tspan dx="6.96633"> reverses</tspan><tspan dx="6.96633"> its</tspan><tspan dx="6.96633"> contribution</tspan><tspan dx="6.96633"> to</tspan><tspan dx="6.96633"> the</tspan><tspan dx="6.96633"> field.</tspan><tspan dx="6.96633"> A</tspan><tspan dx="6.96633"> sideways</tspan></tspan><tspan x="89" dy="31" data-justified="874">approach<tspan dx="3.49534"> makes</tspan><tspan dx="3.49534"> turning</tspan><tspan dx="3.49534"> easier</tspan><tspan dx="3.49534"> to</tspan><tspan dx="3.49534"> see</tspan><tspan dx="3.49534"> than</tspan><tspan dx="3.49534"> an</tspan><tspan dx="3.49534"> approach</tspan><tspan dx="3.49534"> exactly</tspan><tspan dx="3.49534"> along</tspan><tspan dx="3.49534"> the</tspan><tspan dx="3.49534"> needle's</tspan></tspan><tspan x="89" dy="31">line.</tspan></text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">14</text></g><!-- /botanical-footer --></svg></div></div></section>
