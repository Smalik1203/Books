<section class="page page--food page--science-editorial page--illustrated" data-science-chapter="4" data-folio="22" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 22"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><g data-content-kind="heading"><text class="se-heading" x="89" y="124"><tspan x="89">Learning Further</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="181"><tspan x="89" data-justified="874">•<tspan dx="0.44062"> Collect</tspan><tspan dx="0.44062"> three</tspan><tspan dx="0.44062"> or</tspan><tspan dx="0.44062"> four</tspan><tspan dx="0.44062"> different</tspan><tspan dx="0.44062"> magnets.</tspan><tspan dx="0.44062"> Use</tspan><tspan dx="0.44062"> identical</tspan><tspan dx="0.44062"> pins,</tspan><tspan dx="0.44062"> the</tspan><tspan dx="0.44062"> same</tspan><tspan dx="0.44062"> contact</tspan><tspan dx="0.44062"> region</tspan></tspan><tspan x="89" dy="31" data-justified="874">and<tspan dx="0.12300"> the</tspan><tspan dx="0.12300"> same</tspan><tspan dx="0.12300"> lifting</tspan><tspan dx="0.12300"> procedure</tspan><tspan dx="0.12300"> for</tspan><tspan dx="0.12300"> each</tspan><tspan dx="0.12300"> magnet.</tspan><tspan dx="0.12300"> Repeat</tspan><tspan dx="0.12300"> three</tspan><tspan dx="0.12300"> times.</tspan><tspan dx="0.12300"> Which</tspan><tspan dx="0.12300"> lifts</tspan><tspan dx="0.12300"> most</tspan></tspan><tspan x="89" dy="31" data-justified="874">pins<tspan dx="2.66492"> under</tspan><tspan dx="2.66492"> those</tspan><tspan dx="2.66492"> conditions?</tspan><tspan dx="2.66492"> Explain</tspan><tspan dx="2.66492"> why</tspan><tspan dx="2.66492"> this</tspan><tspan dx="2.66492"> is</tspan><tspan dx="2.66492"> a</tspan><tspan dx="2.66492"> performance</tspan><tspan dx="2.66492"> comparison,</tspan><tspan dx="2.66492"> not</tspan><tspan dx="2.66492"> a</tspan></tspan><tspan x="89" dy="31">measurement independent of shape or contact.</tspan></text></g>
<g data-content-kind="illustrated-reading"><text class="se-copy" x="89" y="321"><tspan x="89" data-justified="874">•<tspan dx="0.08228"> Make</tspan><tspan dx="0.08228"> a</tspan><tspan dx="0.08228"> flying</tspan><tspan dx="0.08228"> butterfly.</tspan><tspan dx="0.08228"> Cut</tspan><tspan dx="0.08228"> a</tspan><tspan dx="0.08228"> butterfly</tspan><tspan dx="0.08228"> out</tspan><tspan dx="0.08228"> of</tspan><tspan dx="0.08228"> paper</tspan><tspan dx="0.08228"> and</tspan><tspan dx="0.08228"> glue</tspan><tspan dx="0.08228"> a</tspan><tspan dx="0.08228"> steel</tspan><tspan dx="0.08228"> paper</tspan><tspan dx="0.08228"> clip</tspan><tspan dx="0.08228"> to</tspan><tspan dx="0.08228"> its</tspan></tspan><tspan x="89" dy="31" data-justified="874">body.<tspan dx="2.46732"> Tie</tspan><tspan dx="2.46732"> a</tspan><tspan dx="2.46732"> thread</tspan><tspan dx="2.46732"> to</tspan><tspan dx="2.46732"> the</tspan><tspan dx="2.46732"> clip</tspan><tspan dx="2.46732"> and</tspan><tspan dx="2.46732"> tape</tspan><tspan dx="2.46732"> the</tspan><tspan dx="2.46732"> other</tspan><tspan dx="2.46732"> end</tspan><tspan dx="2.46732"> of</tspan><tspan dx="2.46732"> the</tspan><tspan dx="2.46732"> thread</tspan><tspan dx="2.46732"> to</tspan><tspan dx="2.46732"> a</tspan><tspan dx="2.46732"> table.</tspan><tspan dx="2.46732"> Now</tspan></tspan><tspan x="89" dy="31" data-justified="874">hold<tspan dx="2.98149"> a</tspan><tspan dx="2.98149"> magnet</tspan><tspan dx="2.98149"> above</tspan><tspan dx="2.98149"> the</tspan><tspan dx="2.98149"> butterfly,</tspan><tspan dx="2.98149"> just</tspan><tspan dx="2.98149"> far</tspan><tspan dx="2.98149"> enough</tspan><tspan dx="2.98149"> that</tspan><tspan dx="2.98149"> the</tspan><tspan dx="2.98149"> thread</tspan><tspan dx="2.98149"> pulls</tspan><tspan dx="2.98149"> tight.</tspan><tspan dx="2.98149"> The</tspan></tspan><tspan x="89" dy="31" data-justified="874">butterfly<tspan dx="1.73090"> can</tspan><tspan dx="1.73090"> remain</tspan><tspan dx="1.73090"> below</tspan><tspan dx="1.73090"> the</tspan><tspan dx="1.73090"> magnet</tspan><tspan dx="1.73090"> without</tspan><tspan dx="1.73090"> touching</tspan><tspan dx="1.73090"> it.</tspan><tspan dx="1.73090"> Upward</tspan><tspan dx="1.73090"> magnetic</tspan><tspan dx="1.73090"> force</tspan></tspan><tspan x="89" dy="31" data-justified="874">balances<tspan dx="4.84577"> its</tspan><tspan dx="4.84577"> weight</tspan><tspan dx="4.84577"> and</tspan><tspan dx="4.84577"> the</tspan><tspan dx="4.84577"> downward</tspan><tspan dx="4.84577"> pull</tspan><tspan dx="4.84577"> of</tspan><tspan dx="4.84577"> the</tspan><tspan dx="4.84577"> taut</tspan><tspan dx="4.84577"> thread.</tspan><tspan dx="4.84577"> Move</tspan><tspan dx="4.84577"> the</tspan><tspan dx="4.84577"> magnet</tspan></tspan><tspan x="89" dy="31">slowly and watch what happens.</tspan></text><svg class="science-illustration ip-art" x="296" y="500" width="460" height="340" viewBox="522 6 1006 1008" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-6/science/ch04/png/butterfly.png" x="0" y="0" width="1536" height="1024"/></svg><text class="se-caption" x="526" y="869" text-anchor="middle">Keep a visible gap between the magnet and the paper clip.</text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="911"><tspan x="89" data-justified="874">•<tspan dx="0.61352"> Find</tspan><tspan dx="0.61352"> out</tspan><tspan dx="0.61352"> about</tspan><tspan dx="0.61352"> the</tspan><tspan dx="0.61352"> Maglev</tspan><tspan dx="0.61352"> train.</tspan><tspan dx="0.61352"> It</tspan><tspan dx="0.61352"> floats</tspan><tspan dx="0.61352"> above</tspan><tspan dx="0.61352"> its</tspan><tspan dx="0.61352"> track</tspan><tspan dx="0.61352"> instead</tspan><tspan dx="0.61352"> of</tspan><tspan dx="0.61352"> resting</tspan><tspan dx="0.61352"> on</tspan><tspan dx="0.61352"> rails.</tspan></tspan><tspan x="89" dy="31" data-justified="874">Find<tspan dx="3.91650"> a</tspan><tspan dx="3.91650"> diagram</tspan><tspan dx="3.91650"> from</tspan><tspan dx="3.91650"> a</tspan><tspan dx="3.91650"> railway</tspan><tspan dx="3.91650"> or</tspan><tspan dx="3.91650"> museum</tspan><tspan dx="3.91650"> source.</tspan><tspan dx="3.91650"> Identify</tspan><tspan dx="3.91650"> what</tspan><tspan dx="3.91650"> provides</tspan><tspan dx="3.91650"> upward</tspan></tspan><tspan x="89" dy="31" data-justified="874">support<tspan dx="5.31875"> and</tspan><tspan dx="5.31875"> what</tspan><tspan dx="5.31875"> keeps</tspan><tspan dx="5.31875"> the</tspan><tspan dx="5.31875"> train</tspan><tspan dx="5.31875"> aligned;</tspan><tspan dx="5.31875"> do</tspan><tspan dx="5.31875"> not</tspan><tspan dx="5.31875"> assume</tspan><tspan dx="5.31875"> every</tspan><tspan dx="5.31875"> design</tspan><tspan dx="5.31875"> uses</tspan><tspan dx="5.31875"> two</tspan></tspan><tspan x="89" dy="31">repelling permanent magnets.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1051"><tspan x="89" data-justified="874">•<tspan dx="6.10816"> Magnets</tspan><tspan dx="6.10816"> are</tspan><tspan dx="6.10816"> made</tspan><tspan dx="6.10816"> in</tspan><tspan dx="6.10816"> many</tspan><tspan dx="6.10816"> shapes</tspan><tspan dx="6.10816"> —</tspan><tspan dx="6.10816"> bar,</tspan><tspan dx="6.10816"> ring,</tspan><tspan dx="6.10816"> disc,</tspan><tspan dx="6.10816"> cylinder,</tspan><tspan dx="6.10816"> horseshoe</tspan><tspan dx="6.10816"> and</tspan></tspan><tspan x="89" dy="31">sphere. Find out why. What job does each shape do well?</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1129"><tspan x="89" data-justified="874">•<tspan dx="5.73856"> Find</tspan><tspan dx="5.73856"> out</tspan><tspan dx="5.73856"> how</tspan><tspan dx="5.73856"> magnets</tspan><tspan dx="5.73856"> are</tspan><tspan dx="5.73856"> used</tspan><tspan dx="5.73856"> in</tspan><tspan dx="5.73856"> hospitals.</tspan><tspan dx="5.73856"> Find</tspan><tspan dx="5.73856"> what</tspan><tspan dx="5.73856"> MRI</tspan><tspan dx="5.73856"> stands</tspan><tspan dx="5.73856"> for</tspan><tspan dx="5.73856"> on</tspan><tspan dx="5.73856"> a</tspan></tspan><tspan x="89" dy="31" data-justified="874">hospital<tspan dx="1.41304"> or</tspan><tspan dx="1.41304"> university</tspan><tspan dx="1.41304"> page.</tspan><tspan dx="1.41304"> Identify</tspan><tspan dx="1.41304"> one</tspan><tspan dx="1.41304"> use</tspan><tspan dx="1.41304"> of</tspan><tspan dx="1.41304"> its</tspan><tspan dx="1.41304"> strong</tspan><tspan dx="1.41304"> magnetic</tspan><tspan dx="1.41304"> field</tspan><tspan dx="1.41304"> and</tspan><tspan dx="1.41304"> explain</tspan></tspan><tspan x="89" dy="31">why a magnet attracting iron does not explain how an image is formed.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1238"><tspan x="89" data-justified="874">•<tspan dx="7.96811"> Take</tspan><tspan dx="7.96811"> your</tspan><tspan dx="7.96811"> homemade</tspan><tspan dx="7.96811"> compass</tspan><tspan dx="7.96811"> outside.</tspan><tspan dx="7.96811"> Use</tspan><tspan dx="7.96811"> it</tspan><tspan dx="7.96811"> to</tspan><tspan dx="7.96811"> find</tspan><tspan dx="7.96811"> which</tspan><tspan dx="7.96811"> direction</tspan><tspan dx="7.96811"> your</tspan></tspan><tspan x="89" dy="31">classroom window faces. Then check your answer against where the sun rises.</tspan></text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">22</text></g><!-- /botanical-footer --></svg></div></div></section>
