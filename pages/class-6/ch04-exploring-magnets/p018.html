<g data-content-kind="body"><text class="se-copy" x="89" y="620"><tspan x="89" data-justified="874">The<tspan dx="0.14686"> soft-iron</tspan><tspan dx="0.14686"> pieces</tspan><tspan dx="0.14686"> used</tspan><tspan dx="0.14686"> for</tspan><tspan dx="0.14686"> storage</tspan><tspan dx="0.14686"> are</tspan><tspan dx="0.14686"> called</tspan><tspan dx="0.14686"> keepers.</tspan><tspan dx="0.14686"> They</tspan><tspan dx="0.14686"> join</tspan><tspan dx="0.14686"> unlike</tspan><tspan dx="0.14686"> poles</tspan><tspan dx="0.14686"> across</tspan></tspan><tspan x="89" dy="31" data-justified="874">each<tspan dx="1.94239"> end</tspan><tspan dx="1.94239"> of</tspan><tspan dx="1.94239"> the</tspan><tspan dx="1.94239"> pair.</tspan><tspan dx="1.94239"> This</tspan><tspan dx="1.94239"> arrangement</tspan><tspan dx="1.94239"> is</tspan><tspan dx="1.94239"> useful</tspan><tspan dx="1.94239"> for</tspan><tspan dx="1.94239"> traditional</tspan><tspan dx="1.94239"> school</tspan><tspan dx="1.94239"> bar</tspan><tspan dx="1.94239"> magnets;</tspan></tspan><tspan x="89" dy="31">different modern magnets may come with their own storage instructions.</tspan></text></g>

<g data-content-kind="heading"><text class="se-heading" x="89" y="901"><tspan x="89">Summary</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="958"><tspan x="89" data-justified="874">•<tspan dx="0.43516"> A</tspan><tspan dx="0.43516"> magnet</tspan><tspan dx="0.43516"> produces</tspan><tspan dx="0.43516"> a</tspan><tspan dx="0.43516"> magnetic</tspan><tspan dx="0.43516"> field</tspan><tspan dx="0.43516"> and</tspan><tspan dx="0.43516"> can</tspan><tspan dx="0.43516"> attract</tspan><tspan dx="0.43516"> iron</tspan><tspan dx="0.43516"> or</tspan><tspan dx="0.43516"> attract</tspan><tspan dx="0.43516"> or</tspan><tspan dx="0.43516"> repel</tspan><tspan dx="0.43516"> another</tspan></tspan><tspan x="89" dy="31" data-justified="874">magnet.<tspan dx="0.24682"> Lodestone</tspan><tspan dx="0.24682"> is</tspan><tspan dx="0.24682"> naturally</tspan><tspan dx="0.24682"> magnetised</tspan><tspan dx="0.24682"> magnetite;</tspan><tspan dx="0.24682"> artificial</tspan><tspan dx="0.24682"> magnets</tspan><tspan dx="0.24682"> are</tspan><tspan dx="0.24682"> made</tspan><tspan dx="0.24682"> by</tspan></tspan><tspan x="89" dy="31">people.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1067"><tspan x="89" data-justified="874">•<tspan dx="8.11925"> Materials</tspan><tspan dx="8.11925"> showing</tspan><tspan dx="8.11925"> strong</tspan><tspan dx="8.11925"> attraction</tspan><tspan dx="8.11925"> in</tspan><tspan dx="8.11925"> our</tspan><tspan dx="8.11925"> school</tspan><tspan dx="8.11925"> tests</tspan><tspan dx="8.11925"> are</tspan><tspan dx="8.11925"> called</tspan><tspan dx="8.11925"> magnetic</tspan></tspan><tspan x="89" dy="31" data-justified="874">materials.<tspan dx="3.25188"> Iron,</tspan><tspan dx="3.25188"> nickel,</tspan><tspan dx="3.25188"> cobalt</tspan><tspan dx="3.25188"> and</tspan><tspan dx="3.25188"> many</tspan><tspan dx="3.25188"> kinds</tspan><tspan dx="3.25188"> of</tspan><tspan dx="3.25188"> steel</tspan><tspan dx="3.25188"> are</tspan><tspan dx="3.25188"> magnetic.</tspan><tspan dx="3.25188"> Materials</tspan><tspan dx="3.25188"> not</tspan></tspan><tspan x="89" dy="31">pulled towards a magnet are non-magnetic. Not every metal is magnetic.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1176"><tspan x="89" data-justified="874">•<tspan dx="1.55848"> A</tspan><tspan dx="1.55848"> bar</tspan><tspan dx="1.55848"> magnet</tspan><tspan dx="1.55848"> pulls</tspan><tspan dx="1.55848"> most</tspan><tspan dx="1.55848"> strongly</tspan><tspan dx="1.55848"> near</tspan><tspan dx="1.55848"> its</tspan><tspan dx="1.55848"> two</tspan><tspan dx="1.55848"> ends,</tspan><tspan dx="1.55848"> called</tspan><tspan dx="1.55848"> the</tspan><tspan dx="1.55848"> North</tspan><tspan dx="1.55848"> pole</tspan><tspan dx="1.55848"> and</tspan><tspan dx="1.55848"> the</tspan></tspan><tspan x="89" dy="31">South pole.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1254"><tspan x="89" data-justified="874">•<tspan dx="0.98311"> Each</tspan><tspan dx="0.98311"> piece</tspan><tspan dx="0.98311"> of</tspan><tspan dx="0.98311"> a</tspan><tspan dx="0.98311"> broken</tspan><tspan dx="0.98311"> bar</tspan><tspan dx="0.98311"> magnet</tspan><tspan dx="0.98311"> still</tspan><tspan dx="0.98311"> has</tspan><tspan dx="0.98311"> both</tspan><tspan dx="0.98311"> poles.</tspan><tspan dx="0.98311"> Breaking</tspan><tspan dx="0.98311"> does</tspan><tspan dx="0.98311"> not</tspan><tspan dx="0.98311"> separate</tspan></tspan><tspan x="89" dy="31">a North pole from a South pole.</tspan></text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">18</text></g><!-- /botanical-footer --></svg></div></div></section>
