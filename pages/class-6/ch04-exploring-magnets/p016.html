<g data-content-kind="body"><text class="se-copy" x="89" y="226"><tspan x="89" data-justified="874">This<tspan dx="0.90040"> result</tspan><tspan dx="0.90040"> is</tspan><tspan dx="0.90040"> limited</tspan><tspan dx="0.90040"> to</tspan><tspan dx="0.90040"> the</tspan><tspan dx="0.90040"> tested</tspan><tspan dx="0.90040"> materials</tspan><tspan dx="0.90040"> and</tspan><tspan dx="0.90040"> thicknesses.</tspan><tspan dx="0.90040"> A</tspan><tspan dx="0.90040"> magnetic</tspan><tspan dx="0.90040"> field</tspan><tspan dx="0.90040"> is</tspan><tspan dx="0.90040"> not</tspan></tspan><tspan x="89" dy="31" data-justified="874">a<tspan dx="2.45356"> substance</tspan><tspan dx="2.45356"> flowing</tspan><tspan dx="2.45356"> through</tspan><tspan dx="2.45356"> a</tspan><tspan dx="2.45356"> sheet.</tspan><tspan dx="2.45356"> Increasing</tspan><tspan dx="2.45356"> the</tspan><tspan dx="2.45356"> gap</tspan><tspan dx="2.45356"> can</tspan><tspan dx="2.45356"> reduce</tspan><tspan dx="2.45356"> the</tspan><tspan dx="2.45356"> effect</tspan><tspan dx="2.45356"> even</tspan></tspan><tspan x="89" dy="31">without a sheet.</tspan></text></g>
<g data-content-kind="heading"><text class="se-heading" x="89" y="338"><tspan x="89">4.5 Things to Try</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="395"><tspan x="89" data-justified="874">Now<tspan dx="4.34728"> that</tspan><tspan dx="4.34728"> you</tspan><tspan dx="4.34728"> know</tspan><tspan dx="4.34728"> how</tspan><tspan dx="4.34728"> magnets</tspan><tspan dx="4.34728"> behave,</tspan><tspan dx="4.34728"> here</tspan><tspan dx="4.34728"> are</tspan><tspan dx="4.34728"> some</tspan><tspan dx="4.34728"> things</tspan><tspan dx="4.34728"> to</tspan><tspan dx="4.34728"> make</tspan><tspan dx="4.34728"> and</tspan><tspan dx="4.34728"> try.</tspan></tspan><tspan x="89" dy="31">Work out for yourself why each one works.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="471"><tspan x="89" data-justified="874">A<tspan dx="0.41538"> <tspan class="se-bold">magnetic</tspan></tspan><tspan dx="0.41538"> garland.</tspan><tspan dx="0.41538"> Hold</tspan><tspan dx="0.41538"> a</tspan><tspan dx="0.41538"> bar</tspan><tspan dx="0.41538"> magnet</tspan><tspan dx="0.41538"> above</tspan><tspan dx="0.41538"> a</tspan><tspan dx="0.41538"> heap</tspan><tspan dx="0.41538"> of</tspan><tspan dx="0.41538"> steel</tspan><tspan dx="0.41538"> U-clips.</tspan><tspan dx="0.41538"> Touch</tspan><tspan dx="0.41538"> one</tspan><tspan dx="0.41538"> clip</tspan></tspan><tspan x="89" dy="31" data-justified="874">to<tspan dx="3.54620"> the</tspan><tspan dx="3.54620"> magnet.</tspan><tspan dx="3.54620"> Now</tspan><tspan dx="3.54620"> touch</tspan><tspan dx="3.54620"> a</tspan><tspan dx="3.54620"> second</tspan><tspan dx="3.54620"> clip</tspan><tspan dx="3.54620"> to</tspan><tspan dx="3.54620"> the</tspan><tspan dx="3.54620"> first</tspan><tspan dx="3.54620"> one.</tspan><tspan dx="3.54620"> Keep</tspan><tspan dx="3.54620"> going.</tspan><tspan dx="3.54620"> How</tspan><tspan dx="3.54620"> long</tspan><tspan dx="3.54620"> a</tspan></tspan><tspan x="89" dy="31">chain can you hang?</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="578"><tspan x="89" data-justified="874">A<tspan dx="1.01292"> ball</tspan><tspan dx="1.01292"> in</tspan><tspan dx="1.01292"> a</tspan><tspan dx="1.01292"> maze.</tspan><tspan dx="1.01292"> Draw</tspan><tspan dx="1.01292"> a</tspan><tspan dx="1.01292"> maze</tspan><tspan dx="1.01292"> on</tspan><tspan dx="1.01292"> a</tspan><tspan dx="1.01292"> sheet</tspan><tspan dx="1.01292"> of</tspan><tspan dx="1.01292"> card</tspan><tspan dx="1.01292"> and</tspan><tspan dx="1.01292"> glue</tspan><tspan dx="1.01292"> thin</tspan><tspan dx="1.01292"> strips</tspan><tspan dx="1.01292"> along</tspan><tspan dx="1.01292"> the</tspan><tspan dx="1.01292"> lines</tspan></tspan><tspan x="89" dy="31" data-justified="874">to<tspan dx="2.11956"> make</tspan><tspan dx="2.11956"> walls.</tspan><tspan dx="2.11956"> Put</tspan><tspan dx="2.11956"> a</tspan><tspan dx="2.11956"> small</tspan><tspan dx="2.11956"> steel</tspan><tspan dx="2.11956"> ball</tspan><tspan dx="2.11956"> inside.</tspan><tspan dx="2.11956"> Now</tspan><tspan dx="2.11956"> hold</tspan><tspan dx="2.11956"> a</tspan><tspan dx="2.11956"> magnet</tspan><tspan dx="2.11956"> under</tspan><tspan dx="2.11956"> the</tspan><tspan dx="2.11956"> card</tspan><tspan dx="2.11956"> and</tspan></tspan><tspan x="89" dy="31">move it. Can you steer the ball out without touching it?</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="685"><tspan x="89" data-justified="874">A<tspan dx="4.50600"> clip</tspan><tspan dx="4.50600"> in</tspan><tspan dx="4.50600"> water.</tspan><tspan dx="4.50600"> Drop</tspan><tspan dx="4.50600"> a</tspan><tspan dx="4.50600"> steel</tspan><tspan dx="4.50600"> paper</tspan><tspan dx="4.50600"> clip</tspan><tspan dx="4.50600"> into</tspan><tspan dx="4.50600"> a</tspan><tspan dx="4.50600"> glass</tspan><tspan dx="4.50600"> of</tspan><tspan dx="4.50600"> water.</tspan><tspan dx="4.50600"> Get</tspan><tspan dx="4.50600"> it</tspan><tspan dx="4.50600"> out</tspan><tspan dx="4.50600"> using</tspan><tspan dx="4.50600"> a</tspan></tspan><tspan x="89" dy="31">magnet, without wetting your fingers or the magnet.</tspan></text></g>
<g data-content-kind="illustrated-reading"><text class="se-copy" x="89" y="761"><tspan x="89" data-justified="874">Two<tspan dx="3.86004"> racing</tspan><tspan dx="3.86004"> cars.</tspan><tspan dx="3.86004"> Secure</tspan><tspan dx="3.86004"> a</tspan><tspan dx="3.86004"> bar</tspan><tspan dx="3.86004"> magnet</tspan><tspan dx="3.86004"> on</tspan><tspan dx="3.86004"> each</tspan><tspan dx="3.86004"> toy</tspan><tspan dx="3.86004"> car</tspan><tspan dx="3.86004"> with</tspan><tspan dx="3.86004"> removable</tspan><tspan dx="3.86004"> tape</tspan><tspan dx="3.86004"> or</tspan><tspan dx="3.86004"> an</tspan></tspan><tspan x="89" dy="31" data-justified="874">elastic<tspan dx="2.73386"> band.</tspan><tspan dx="2.73386"> Push</tspan><tspan dx="2.73386"> them</tspan><tspan dx="2.73386"> towards</tspan><tspan dx="2.73386"> each</tspan><tspan dx="2.73386"> other.</tspan><tspan dx="2.73386"> Now</tspan><tspan dx="2.73386"> turn</tspan><tspan dx="2.73386"> one</tspan><tspan dx="2.73386"> magnet</tspan><tspan dx="2.73386"> around</tspan><tspan dx="2.73386"> and</tspan><tspan dx="2.73386"> try</tspan></tspan><tspan x="89" dy="31">again. What changes?</tspan></text><svg class="science-illustration ip-art" x="89" y="845" width="874" height="380" viewBox="37 26 1477 924" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-6/science/ch04/png/games.png" x="0" y="0" width="1536" height="1024"/></svg><text class="se-caption" x="526" y="1254" text-anchor="middle">Four ways to explore magnetic attraction and repulsion.</text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle
