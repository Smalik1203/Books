<section class="page page--food page--science-editorial page--illustrated" data-science-chapter="4" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 7"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><g data-content-kind="body"><text class="se-copy" x="89" y="119"><tspan x="89" data-justified="874">The<tspan dx="2.19700"> letters</tspan><tspan dx="2.19700"> N</tspan><tspan dx="2.19700"> and</tspan><tspan dx="2.19700"> S</tspan><tspan dx="2.19700"> are</tspan><tspan dx="2.19700"> a</tspan><tspan dx="2.19700"> useful</tspan><tspan dx="2.19700"> record</tspan><tspan dx="2.19700"> of</tspan><tspan dx="2.19700"> the</tspan><tspan dx="2.19700"> poles.</tspan><tspan dx="2.19700"> If</tspan><tspan dx="2.19700"> the</tspan><tspan dx="2.19700"> letters</tspan><tspan dx="2.19700"> rub</tspan><tspan dx="2.19700"> off,</tspan><tspan dx="2.19700"> the</tspan><tspan dx="2.19700"> poles</tspan></tspan><tspan x="89" dy="31" data-justified="874">remain.<tspan dx="6.76993"> You</tspan><tspan dx="6.76993"> can</tspan><tspan dx="6.76993"> identify</tspan><tspan dx="6.76993"> them</tspan><tspan dx="6.76993"> again</tspan><tspan dx="6.76993"> by</tspan><tspan dx="6.76993"> comparing</tspan><tspan dx="6.76993"> the</tspan><tspan dx="6.76993"> magnet</tspan><tspan dx="6.76993"> with</tspan><tspan dx="6.76993"> a</tspan><tspan dx="6.76993"> marked</tspan></tspan><tspan x="89" dy="31">magnet or by letting it turn freely.</tspan></text></g>
<g data-content-kind="heading"><text class="se-heading" x="89" y="231"><tspan x="89">4.3 Finding Directions</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="288"><tspan x="89">We can now go back to the sailors in the storm.</tspan></text></g>
<g data-content-kind="activity"><rect class="se-activity-panel" x="89" y="310" width="874" height="678"/><path class="se-activity-tab" d="M109 310H943Q963 310 963 330V353H89V330Q89 310 109 310Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="316" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="339" text-anchor="start">The setup</text><text class="se-copy" x="113" y="405"><tspan x="113">You will need: a bar magnet, thread, a table or a stand, a sheet of paper.</tspan></text><text class="se-activity-step" x="114" y="448" text-anchor="start">1.</text><text class="se-copy" x="143" y="448"><tspan x="143" data-justified="482">Tie<tspan dx="4.55786"> the</tspan><tspan dx="4.55786"> thread</tspan><tspan dx="4.55786"> around</tspan><tspan dx="4.55786"> the</tspan><tspan dx="4.55786"> middle</tspan><tspan dx="4.55786"> of</tspan><tspan dx="4.55786"> the</tspan><tspan dx="4.55786"> bar</tspan></tspan><tspan x="143" dy="31">magnet.</tspan></text><text class="se-activity-step" x="114" y="522" text-anchor="start">2.</text><text class="se-copy" x="143" y="522"><tspan x="143" data-justified="482">Hang<tspan dx="4.88655"> it</tspan><tspan dx="4.88655"> from</tspan><tspan dx="4.88655"> the</tspan><tspan dx="4.88655"> edge</tspan><tspan dx="4.88655"> of</tspan><tspan dx="4.88655"> a</tspan><tspan dx="4.88655"> table,</tspan><tspan dx="4.88655"> or</tspan><tspan dx="4.88655"> from</tspan><tspan dx="4.88655"> a</tspan></tspan><tspan x="143" dy="31" data-justified="482">stand.<tspan dx="11.40194"> Move</tspan><tspan dx="11.40194"> the</tspan><tspan dx="11.40194"> thread</tspan><tspan dx="11.40194"> a</tspan><tspan dx="11.40194"> little</tspan><tspan dx="11.40194"> until</tspan><tspan dx="11.40194"> the</tspan></tspan><tspan x="143" dy="31">magnet hangs level.</tspan></text><text class="se-activity-step" x="114" y="627" text-anchor="start">3.</text><text class="se-copy" x="143" y="627"><tspan x="143" data-justified="482">Make<tspan dx="6.08029"> sure</tspan><tspan dx="6.08029"> nothing</tspan><tspan dx="6.08029"> made</tspan><tspan dx="6.08029"> of</tspan><tspan dx="6.08029"> iron</tspan><tspan dx="6.08029"> or</tspan><tspan dx="6.08029"> steel</tspan><tspan dx="6.08029"> is</tspan></tspan><tspan x="143" dy="31" data-justified="482">nearby.<tspan dx="11.12820"> Move</tspan><tspan dx="11.12820"> away</tspan><tspan dx="11.12820"> steel</tspan><tspan dx="11.12820"> chairs,</tspan><tspan dx="11.12820"> keys</tspan><tspan dx="11.12820"> and</tspan></tspan><tspan x="143" dy="31">pencil boxes.</tspan></text><text class="se-activity-step" x="114" y="732" text-anchor="start">4.</text><text class="se-copy" x="143" y="732"><tspan x="143" data-justified="482">Wait<tspan dx="7.20975"> until</tspan><tspan dx="7.20975"> the</tspan><tspan dx="7.20975"> magnet</tspan><tspan dx="7.20975"> stops</tspan><tspan dx="7.20975"> turning</tspan><tspan dx="7.20975"> on</tspan><tspan dx="7.20975"> its</tspan></tspan><tspan x="143" dy="31">own.</tspan></text><text class="se-activity-step" x="114" y="806" text-anchor="start">5.</text><text class="se-copy" x="143" y="806"><tspan x="143" data-justified="482">On<tspan dx="2.05075"> the</tspan><tspan dx="2.05075"> floor</tspan><tspan dx="2.05075"> below,</tspan><tspan dx="2.05075"> mark</tspan><tspan dx="2.05075"> the</tspan><tspan dx="2.05075"> spot</tspan><tspan dx="2.05075"> under</tspan><tspan dx="2.05075"> each</tspan></tspan><tspan x="143" dy="31" data-justified="482">end<tspan dx="2.28208"> of</tspan><tspan dx="2.28208"> the</tspan><tspan dx="2.28208"> magnet.</tspan><tspan dx="2.28208"> Join</tspan><tspan dx="2.28208"> the</tspan><tspan dx="2.28208"> two</tspan><tspan dx="2.28208"> marks</tspan><tspan dx="2.28208"> with</tspan><tspan dx="2.28208"> a</tspan></tspan><tspan x="143" dy="31">straight line.</tspan></text><text class="se-activity-step" x="114" y="911" text-anchor="start">6.</text><text class="se-copy" x="143" y="911"><tspan x="143" data-justified="482">Now<tspan dx="2.85046"> give</tspan><tspan dx="2.85046"> the</tspan><tspan dx="2.85046"> magnet</tspan><tspan dx="2.85046"> a</tspan><tspan dx="2.85046"> gentle</tspan><tspan dx="2.85046"> push</tspan><tspan dx="2.85046"> so</tspan><tspan dx="2.85046"> that</tspan><tspan dx="2.85046"> it</tspan></tspan><tspan x="143" dy="31">spins. Wait until it stops again.</tspan></text><svg class="science-illustration ip-art" x="656" y="428" width="283" height="241.44055944055944" viewBox="191 12 1144 976" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-6/science/ch04/png/suspended.png" x="0" y="0" width="1536" height="1024"/></svg><text class="se-caption" x="797.5" y="696.4405594405595" text-anchor="middle">Suspend the magnet</text><text class="se-caption" x="797.5" y="719.4405594405595" text-anchor="middle">from its centre.</text></g>
<g data-content-kind="prompt"><g class="se-feature--observe"><rect class="se-prompt" x="89" y="1010" width="874" height="142"/><line class="se-think-rule" x1="89" x2="963" y1="1010" y2="1010"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What you saw"><svg class="se-feature-icon se-feature--observe" x="113" y="1021" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="1050">What you saw</text></g><text class="se-copy" x="113" y="1094"><tspan x="113" data-justified="826">Does<tspan dx="1.49682"> it</tspan><tspan dx="1.49682"> stop</tspan><tspan dx="1.49682"> along</tspan><tspan dx="1.49682"> the</tspan><tspan dx="1.49682"> same</tspan><tspan dx="1.49682"> line</tspan><tspan dx="1.49682"> as</tspan><tspan dx="1.49682"> before?</tspan><tspan dx="1.49682"> Try</tspan><tspan dx="1.49682"> it</tspan><tspan dx="1.49682"> four</tspan><tspan dx="1.49682"> or</tspan><tspan dx="1.49682"> five</tspan><tspan dx="1.49682"> times.</tspan><tspan dx="1.49682"> Before</tspan><tspan dx="1.49682"> you</tspan></tspan><tspan x="113" dy="31">push it a sixth time, say out loud where it will stop.</tspan></text></g></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1195"><tspan x="89" data-justified="874">Let<tspan dx="1.03822"> the</tspan><tspan dx="1.03822"> magnet</tspan><tspan dx="1.03822"> turn</tspan><tspan dx="1.03822"> without</tspan><tspan dx="1.03822"> touching</tspan><tspan dx="1.03822"> the</tspan><tspan dx="1.03822"> table,</tspan><tspan dx="1.03822"> floor</tspan><tspan dx="1.03822"> or</tspan><tspan dx="1.03822"> stand.</tspan><tspan dx="1.03822"> A</tspan><tspan dx="1.03822"> twisted</tspan><tspan dx="1.03822"> thread</tspan><tspan dx="1.03822"> can</tspan></tspan><tspan x="89" dy="31" data-justified="874">pull<tspan dx="0.72261"> it</tspan><tspan dx="0.72261"> away</tspan><tspan dx="0.72261"> from</tspan><tspan dx="0.72261"> its</tspan><tspan dx="0.72261"> resting</tspan><tspan dx="0.72261"> direction.</tspan><tspan dx="0.72261"> If</tspan><tspan dx="0.72261"> the</tspan><tspan dx="0.72261"> result</tspan><tspan dx="0.72261"> changes</tspan><tspan dx="0.72261"> between</tspan><tspan dx="0.72261"> trials,</tspan><tspan dx="0.72261"> check</tspan><tspan dx="0.72261"> the</tspan></tspan><tspan x="89" dy="31" data-justified="874">suspension<tspan dx="4.53682"> and</tspan><tspan dx="4.53682"> remove</tspan><tspan dx="4.53682"> nearby</tspan><tspan dx="4.53682"> magnetic</tspan><tspan dx="4.53682"> objects</tspan><tspan dx="4.53682"> before</tspan><tspan dx="4.53682"> deciding</tspan><tspan dx="4.53682"> that</tspan><tspan dx="4.53682"> the</tspan><tspan dx="4.53682"> magnet</tspan></tspan><tspan x="89" dy="31">behaves differently.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1333"><tspan x="89" data-justified="874">Repeated<tspan dx="2.60004"> observations</tspan><tspan dx="2.60004"> are</tspan><tspan dx="2.60004"> useful</tspan><tspan dx="2.60004"> because</tspan><tspan dx="2.60004"> one</tspan><tspan dx="2.60004"> trial</tspan><tspan dx="2.60004"> can</tspan><tspan dx="2.60004"> be</tspan><tspan dx="2.60004"> disturbed.</tspan><tspan dx="2.60004"> Draw</tspan><tspan dx="2.60004"> the</tspan><tspan dx="2.60004"> line</tspan></tspan><tspan x="89" dy="31">after each trial in your notebook and compare your records.</tspan></text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">7</text></g><!-- /botanical-footer --></svg></div></div></section>
