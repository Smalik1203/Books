<section class="page page--food page--science-editorial page--illustrated" data-science-chapter="4" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 13"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><g data-content-kind="heading"><text class="se-heading" x="89" y="124"><tspan x="89">Like Poles and Unlike Poles</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="181"><tspan x="89">Compare your observations with the pole markings.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="226"><tspan x="89" data-justified="874">When<tspan dx="3.72411"> the</tspan><tspan dx="3.72411"> North</tspan><tspan dx="3.72411"> pole</tspan><tspan dx="3.72411"> of</tspan><tspan dx="3.72411"> one</tspan><tspan dx="3.72411"> magnet</tspan><tspan dx="3.72411"> faces</tspan><tspan dx="3.72411"> the</tspan><tspan dx="3.72411"> South</tspan><tspan dx="3.72411"> pole</tspan><tspan dx="3.72411"> of</tspan><tspan dx="3.72411"> another,</tspan><tspan dx="3.72411"> the</tspan><tspan dx="3.72411"> two</tspan><tspan dx="3.72411"> are</tspan></tspan><tspan x="89" dy="31">pulled together. This pulling together is called <tspan class="se-bold">attraction</tspan>.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="302"><tspan x="89" data-justified="874">When<tspan dx="4.14963"> two</tspan><tspan dx="4.14963"> North</tspan><tspan dx="4.14963"> poles</tspan><tspan dx="4.14963"> face</tspan><tspan dx="4.14963"> each</tspan><tspan dx="4.14963"> other,</tspan><tspan dx="4.14963"> they</tspan><tspan dx="4.14963"> push</tspan><tspan dx="4.14963"> apart.</tspan><tspan dx="4.14963"> Two</tspan><tspan dx="4.14963"> South</tspan><tspan dx="4.14963"> poles</tspan><tspan dx="4.14963"> do</tspan><tspan dx="4.14963"> the</tspan></tspan><tspan x="89" dy="31">same. This pushing apart is called <tspan class="se-bold">repulsion</tspan>.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="378"><tspan x="89">So we can say it simply:</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="423"><tspan x="89">• Unlike <tspan class="se-bold">poles</tspan> attract. North and South pull together.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="470"><tspan x="89">• Like <tspan class="se-bold">poles</tspan> repel. North and North push apart. South and South push apart.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="517"><tspan x="89">Now repeat the activity, but use a plain iron bar in place of magnet B.</tspan></text></g>
<g data-content-kind="body"><g class="se-learning-cue se-feature--explain" data-feature="explain" aria-label="The mechanism"><svg class="se-feature-icon se-feature--explain" x="92" y="540" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h5m10 0h5M7 7l3 3m4 4 3 3M7 17l3-3m4-4 3-3M15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="148" y="569">The mechanism</text></g><text class="se-copy" x="89" y="626"><tspan x="89" data-justified="874">An<tspan dx="3.46428"> initially</tspan><tspan dx="3.46428"> unmagnetised</tspan><tspan dx="3.46428"> iron</tspan><tspan dx="3.46428"> bar</tspan><tspan dx="3.46428"> is</tspan><tspan dx="3.46428"> attracted</tspan><tspan dx="3.46428"> by</tspan><tspan dx="3.46428"> either</tspan><tspan dx="3.46428"> pole.</tspan><tspan dx="3.46428"> The</tspan><tspan dx="3.46428"> nearby</tspan><tspan dx="3.46428"> magnet</tspan></tspan><tspan x="89" dy="31" data-justified="874">aligns<tspan dx="4.05783"> magnetic</tspan><tspan dx="4.05783"> regions</tspan><tspan dx="4.05783"> in</tspan><tspan dx="4.05783"> the</tspan><tspan dx="4.05783"> iron,</tspan><tspan dx="4.05783"> inducing</tspan><tspan dx="4.05783"> magnetisation.</tspan><tspan dx="4.05783"> The</tspan><tspan dx="4.05783"> nearer</tspan><tspan dx="4.05783"> iron</tspan><tspan dx="4.05783"> end</tspan></tspan><tspan x="89" dy="31" data-justified="874">behaves<tspan dx="1.33389"> as</tspan><tspan dx="1.33389"> the</tspan><tspan dx="1.33389"> unlike</tspan><tspan dx="1.33389"> pole.</tspan><tspan dx="1.33389"> Much</tspan><tspan dx="1.33389"> of</tspan><tspan dx="1.33389"> this</tspan><tspan dx="1.33389"> alignment</tspan><tspan dx="1.33389"> may</tspan><tspan dx="1.33389"> disappear</tspan><tspan dx="1.33389"> when</tspan><tspan dx="1.33389"> the</tspan><tspan dx="1.33389"> magnet</tspan></tspan><tspan x="89" dy="31">is removed.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="764"><tspan x="89" data-justified="874">Compare<tspan dx="1.23025"> two</tspan><tspan dx="1.23025"> explanations</tspan><tspan dx="1.23025"> for</tspan><tspan dx="1.23025"> attraction:</tspan><tspan dx="1.23025"> the</tspan><tspan dx="1.23025"> object</tspan><tspan dx="1.23025"> could</tspan><tspan dx="1.23025"> already</tspan><tspan dx="1.23025"> be</tspan><tspan dx="1.23025"> a</tspan><tspan dx="1.23025"> magnet,</tspan><tspan dx="1.23025"> or</tspan><tspan dx="1.23025"> it</tspan></tspan><tspan x="89" dy="31">could become magnetised nearby.</tspan></text></g>
<g data-content-kind="body"><g class="se-learning-cue se-feature--reason" data-feature="reason" aria-label="What this rules out"><svg class="se-feature-icon se-feature--reason" x="92" y="818" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h8m-8 6h8m-8 6h8M16 4l5 5m0-5-5 5M16 15l2 2 4-5"/></svg><text class="se-cue-title" x="148" y="847">What this rules out</text></g><text class="se-copy" x="89" y="904"><tspan x="89" data-justified="874">A<tspan dx="3.41675"> magnet</tspan><tspan dx="3.41675"> attracts</tspan><tspan dx="3.41675"> a</tspan><tspan dx="3.41675"> plain</tspan><tspan dx="3.41675"> piece</tspan><tspan dx="3.41675"> of</tspan><tspan dx="3.41675"> iron.</tspan><tspan dx="3.41675"> A</tspan><tspan dx="3.41675"> magnet</tspan><tspan dx="3.41675"> also</tspan><tspan dx="3.41675"> attracts</tspan><tspan dx="3.41675"> the</tspan><tspan dx="3.41675"> unlike</tspan><tspan dx="3.41675"> pole</tspan><tspan dx="3.41675"> of</tspan></tspan><tspan x="89" dy="31" data-justified="874">another<tspan dx="0.01483"> magnet.</tspan><tspan dx="0.01483"> So</tspan><tspan dx="0.01483"> attraction</tspan><tspan dx="0.01483"> alone</tspan><tspan dx="0.01483"> cannot</tspan><tspan dx="0.01483"> tell</tspan><tspan dx="0.01483"> you</tspan><tspan dx="0.01483"> whether</tspan><tspan dx="0.01483"> the</tspan><tspan dx="0.01483"> thing</tspan><tspan dx="0.01483"> in</tspan><tspan dx="0.01483"> your</tspan><tspan dx="0.01483"> hand</tspan><tspan dx="0.01483"> is</tspan></tspan><tspan x="89" dy="31">a magnet or just a piece of iron. Both would attract.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1011"><tspan x="89" data-justified="874">For<tspan dx="2.68592"> our</tspan><tspan dx="2.68592"> magnet-or-iron</tspan><tspan dx="2.68592"> candidates,</tspan><tspan dx="2.68592"> repulsion</tspan><tspan dx="2.68592"> rules</tspan><tspan dx="2.68592"> out</tspan><tspan dx="2.68592"> initially</tspan><tspan dx="2.68592"> unmagnetised</tspan><tspan dx="2.68592"> iron.</tspan></tspan><tspan x="89" dy="31">Attraction does not distinguish the two explanations.</tspan></text></g>
<g data-content-kind="illustrated-reading"><text class="se-copy" x="89" y="1087"><tspan x="89" data-justified="874">For<tspan dx="1.43867"> the</tspan><tspan dx="1.43867"> magnets</tspan><tspan dx="1.43867"> and</tspan><tspan dx="1.43867"> plain</tspan><tspan dx="1.43867"> iron</tspan><tspan dx="1.43867"> bars</tspan><tspan dx="1.43867"> in</tspan><tspan dx="1.43867"> these</tspan><tspan dx="1.43867"> experiments,</tspan><tspan dx="1.43867"> repulsion</tspan><tspan dx="1.43867"> is</tspan><tspan dx="1.43867"> the</tspan><tspan dx="1.43867"> sure</tspan><tspan dx="1.43867"> test.</tspan></tspan><tspan x="89" dy="31">A bar that repels one <tspan class="se-bold">pole</tspan> of a <tspan class="se-bold">magnet</tspan> is itself magnetised.</tspan></text><svg class="science-illustration ip-art" x="89" y="1140" width="874" height="122.63455497382199" viewBox="19 269 1910 268" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-6/science/ch04/png/forces.png" x="0" y="0" width="1942" height="809"/></svg><text class="se-caption" x="526" y="1291.634554973822" text-anchor="middle">Compare facing poles with the observed direction of movement.</text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">13</text></g><!-- /botanical-footer --></svg></div></div></section>
