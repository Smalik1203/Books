<section class="page page--food page--science-editorial page--illustrated" data-science-chapter="4" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 2"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><g data-content-kind="heading"><text class="se-heading" x="89" y="124"><tspan x="89">Magnets Around You</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="181"><tspan x="89">You have already met magnets many times, even if you did not notice them.</tspan></text></g>
<g data-content-kind="body"><text class="se-section-opener" x="92" y="233">Everyday connection</text><text class="se-copy" x="89" y="290"><tspan x="89" data-justified="874">Some<tspan dx="2.89181"> pencil</tspan><tspan dx="2.89181"> boxes</tspan><tspan dx="2.89181"> shut</tspan><tspan dx="2.89181"> with</tspan><tspan dx="2.89181"> a</tspan><tspan dx="2.89181"> soft</tspan><tspan dx="2.89181"> click.</tspan><tspan dx="2.89181"> A</tspan><tspan dx="2.89181"> magnet</tspan><tspan dx="2.89181"> is</tspan><tspan dx="2.89181"> doing</tspan><tspan dx="2.89181"> that.</tspan><tspan dx="2.89181"> The</tspan><tspan dx="2.89181"> duster</tspan><tspan dx="2.89181"> on</tspan><tspan dx="2.89181"> a</tspan></tspan><tspan x="89" dy="31" data-justified="874">writing<tspan dx="1.05407"> board</tspan><tspan dx="1.05407"> may</tspan><tspan dx="1.05407"> stay</tspan><tspan dx="1.05407"> stuck</tspan><tspan dx="1.05407"> to</tspan><tspan dx="1.05407"> the</tspan><tspan dx="1.05407"> board.</tspan><tspan dx="1.05407"> A</tspan><tspan dx="1.05407"> magnet</tspan><tspan dx="1.05407"> is</tspan><tspan dx="1.05407"> doing</tspan><tspan dx="1.05407"> that</tspan><tspan dx="1.05407"> too.</tspan><tspan dx="1.05407"> Fridge</tspan><tspan dx="1.05407"> doors,</tspan></tspan><tspan x="89" dy="31" data-justified="874">cupboard<tspan dx="3.73494"> doors,</tspan><tspan dx="3.73494"> purses,</tspan><tspan dx="3.73494"> toys,</tspan><tspan dx="3.73494"> stickers</tspan><tspan dx="3.73494"> —</tspan><tspan dx="3.73494"> all</tspan><tspan dx="3.73494"> of</tspan><tspan dx="3.73494"> these</tspan><tspan dx="3.73494"> may</tspan><tspan dx="3.73494"> have</tspan><tspan dx="3.73494"> magnets</tspan><tspan dx="3.73494"> hidden</tspan><tspan dx="3.73494"> in</tspan></tspan><tspan x="89" dy="31">them.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="428"><tspan x="89" data-justified="874">A<tspan dx="1.31213"> <tspan class="se-bold">magnet</tspan></tspan><tspan dx="1.31213"> produces</tspan><tspan dx="1.31213"> a</tspan><tspan dx="1.31213"> magnetic</tspan><tspan dx="1.31213"> field:</tspan><tspan dx="1.31213"> a</tspan><tspan dx="1.31213"> region</tspan><tspan dx="1.31213"> in</tspan><tspan dx="1.31213"> which</tspan><tspan dx="1.31213"> it</tspan><tspan dx="1.31213"> can</tspan><tspan dx="1.31213"> exert</tspan><tspan dx="1.31213"> magnetic</tspan><tspan dx="1.31213"> forces.</tspan></tspan><tspan x="89" dy="31" data-justified="874">It<tspan dx="3.63442"> can</tspan><tspan dx="3.63442"> attract</tspan><tspan dx="3.63442"> iron</tspan><tspan dx="3.63442"> and</tspan><tspan dx="3.63442"> can</tspan><tspan dx="3.63442"> attract</tspan><tspan dx="3.63442"> or</tspan><tspan dx="3.63442"> repel</tspan><tspan dx="3.63442"> another</tspan><tspan dx="3.63442"> magnet.</tspan><tspan dx="3.63442"> A</tspan><tspan dx="3.63442"> force</tspan><tspan dx="3.63442"> may</tspan><tspan dx="3.63442"> act</tspan><tspan dx="3.63442"> even</tspan></tspan><tspan x="89" dy="31">when friction prevents movement.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="535"><tspan x="89" data-justified="874">The<tspan dx="7.61458"> first</tspan><tspan dx="7.61458"> magnets</tspan><tspan dx="7.61458"> were</tspan><tspan dx="7.61458"> not</tspan><tspan dx="7.61458"> made</tspan><tspan dx="7.61458"> by</tspan><tspan dx="7.61458"> people.</tspan><tspan dx="7.61458"> They</tspan><tspan dx="7.61458"> were</tspan><tspan dx="7.61458"> found</tspan><tspan dx="7.61458"> in</tspan><tspan dx="7.61458"> the</tspan><tspan dx="7.61458"> ground.</tspan></tspan><tspan x="89" dy="31" data-justified="874"><tspan class="se-bold">Lodestone</tspan><tspan dx="0.35953"> is</tspan><tspan dx="0.35953"> naturally</tspan><tspan dx="0.35953"> magnetised</tspan><tspan dx="0.35953"> magnetite,</tspan><tspan dx="0.35953"> an</tspan><tspan dx="0.35953"> iron-containing</tspan><tspan dx="0.35953"> mineral.</tspan><tspan dx="0.35953"> A</tspan><tspan dx="0.35953"> piece</tspan><tspan dx="0.35953"> of</tspan></tspan><tspan x="89" dy="31" data-justified="874">lodestone<tspan dx="1.43032"> pulls</tspan><tspan dx="1.43032"> small</tspan><tspan dx="1.43032"> bits</tspan><tspan dx="1.43032"> of</tspan><tspan dx="1.43032"> iron</tspan><tspan dx="1.43032"> towards</tspan><tspan dx="1.43032"> it.</tspan><tspan dx="1.43032"> People</tspan><tspan dx="1.43032"> discovered</tspan><tspan dx="1.43032"> this</tspan><tspan dx="1.43032"> a</tspan><tspan dx="1.43032"> very</tspan><tspan dx="1.43032"> long</tspan><tspan dx="1.43032"> time</tspan></tspan><tspan x="89" dy="31">ago.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="673"><tspan x="89" data-justified="874">Later,<tspan dx="3.82260"> people</tspan><tspan dx="3.82260"> learnt</tspan><tspan dx="3.82260"> to</tspan><tspan dx="3.82260"> make</tspan><tspan dx="3.82260"> magnets</tspan><tspan dx="3.82260"> from</tspan><tspan dx="3.82260"> pieces</tspan><tspan dx="3.82260"> of</tspan><tspan dx="3.82260"> iron.</tspan><tspan dx="3.82260"> Today</tspan><tspan dx="3.82260"> magnets</tspan><tspan dx="3.82260"> include</tspan></tspan><tspan x="89" dy="31" data-justified="874">steel<tspan dx="4.44537"> magnets,</tspan><tspan dx="4.44537"> ceramic</tspan><tspan dx="4.44537"> ferrite</tspan><tspan dx="4.44537"> magnets</tspan><tspan dx="4.44537"> and</tspan><tspan dx="4.44537"> magnets</tspan><tspan dx="4.44537"> made</tspan><tspan dx="4.44537"> from</tspan><tspan dx="4.44537"> alloys</tspan><tspan dx="4.44537"> containing</tspan></tspan><tspan x="89" dy="31">neodymium.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="780"><tspan x="89" data-justified="874">The<tspan dx="0.94971"> magnets</tspan><tspan dx="0.94971"> in</tspan><tspan dx="0.94971"> your</tspan><tspan dx="0.94971"> school</tspan><tspan dx="0.94971"> laboratory</tspan><tspan dx="0.94971"> are</tspan><tspan dx="0.94971"> made</tspan><tspan dx="0.94971"> by</tspan><tspan dx="0.94971"> people.</tspan><tspan dx="0.94971"> So</tspan><tspan dx="0.94971"> are</tspan><tspan dx="0.94971"> the</tspan><tspan dx="0.94971"> ones</tspan><tspan dx="0.94971"> in</tspan><tspan dx="0.94971"> pencil</tspan></tspan><tspan x="89" dy="31">boxes and toys. All of these are <tspan class="se-bold">artificial</tspan> <tspan class="se-bold">magnets</tspan>.</tspan></text></g>
<g data-content-kind="illustrated-reading"><text class="se-copy" x="89" y="856"><tspan x="89">Magnets are made in many shapes. Each shape suits a different job.</tspan></text><svg class="science-illustration ip-art" x="89" y="878" width="874" height="166" viewBox="34 254 1699 372" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-6/science/ch04/png/types.png" x="0" y="0" width="1774" height="887"/></svg><text class="se-caption" x="526" y="1073" text-anchor="middle">Bar · U-shaped · Ring · Disc · Cylinder</text></g>
<g data-content-kind="prompt"><g class="se-feature--observe"><rect class="se-prompt" x="89" y="1092" width="874" height="142"/><line class="se-think-rule" x1="89" x2="963" y1="1092" y2="1092"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What you saw"><svg class="se-feature-icon se-feature--observe" x="113" y="1103" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="1132">What you saw</text></g><text class="se-copy" x="113" y="1176"><tspan x="113" data-justified="826">Look<tspan dx="-0.01468"> around</tspan><tspan dx="-0.01468"> your</tspan><tspan dx="-0.01468"> classroom</tspan><tspan dx="-0.01468"> and</tspan><tspan dx="-0.01468"> your</tspan><tspan dx="-0.01468"> home.</tspan><tspan dx="-0.01468"> Where</tspan><tspan dx="-0.01468"> can</tspan><tspan dx="-0.01468"> you</tspan><tspan dx="-0.01468"> find</tspan><tspan dx="-0.01468"> a</tspan><tspan dx="-0.01468"> magnet</tspan><tspan dx="-0.01468"> doing</tspan></tspan><tspan x="113" dy="31">a job?</tspan></text></g></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">2</text></g><!-- /botanical-footer --></svg></div></div></section>
