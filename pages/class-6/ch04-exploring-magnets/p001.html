<section class="page page--food page--science-editorial page--illustrated page--opener" data-science-chapter="4" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 1"><g aria-label="Chapter 4"><path class="food-gold-tag" d="M65 0H222V168Q222 204 187 214L80 239V0Z"/><path class="food-navy" d="M65 0H210V157Q210 192 178 203L65 231Z"/><text class="food-text food-white science-chapter-label" x="138" y="58" text-anchor="middle">CHAPTER</text><text class="food-text food-white science-chapter-number" x="138" y="177" text-anchor="middle">4</text></g><text class="se-label" x="248" y="67" text-anchor="start">SCIENCE AROUND US</text><text class="se-title" x="248" y="160" text-anchor="start">Exploring Magnets</text><line class="se-accent" x1="248" x2="963" y1="195" y2="195"/><g data-content-kind="art"><svg class="science-illustration ip-art" x="0" y="230" width="1052" height="478.7477138246369" viewBox="0 0 1859 846" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-6/science/ch04/png/opener-vignette.png" x="0" y="0" width="1859" height="846"/></svg></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="751.7477138246369"><tspan x="89" data-justified="874">Long<tspan dx="5.43403"> ago,</tspan><tspan dx="5.43403"> ships</tspan><tspan dx="5.43403"> sailed</tspan><tspan dx="5.43403"> from</tspan><tspan dx="5.43403"> the</tspan><tspan dx="5.43403"> coast</tspan><tspan dx="5.43403"> of</tspan><tspan dx="5.43403"> Kerala</tspan><tspan dx="5.43403"> carrying</tspan><tspan dx="5.43403"> pepper,</tspan><tspan dx="5.43403"> cardamom</tspan><tspan dx="5.43403"> and</tspan></tspan><tspan x="89" dy="31">ginger. They went to lands far across the sea.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="827.7477138246369"><tspan x="89" data-justified="874">Those<tspan dx="4.83751"> sailing</tspan><tspan dx="4.83751"> ships</tspan><tspan dx="4.83751"> had</tspan><tspan dx="4.83751"> no</tspan><tspan dx="4.83751"> engines,</tspan><tspan dx="4.83751"> and</tspan><tspan dx="4.83751"> finding</tspan><tspan dx="4.83751"> a</tspan><tspan dx="4.83751"> course</tspan><tspan dx="4.83751"> across</tspan><tspan dx="4.83751"> open</tspan><tspan dx="4.83751"> water</tspan><tspan dx="4.83751"> was</tspan></tspan><tspan x="89" dy="31">difficult. So how did a sailor know which way to go?</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="903.7477138246369"><tspan x="89" data-justified="874">By<tspan dx="2.03061"> day,</tspan><tspan dx="2.03061"> he</tspan><tspan dx="2.03061"> watched</tspan><tspan dx="2.03061"> the</tspan><tspan dx="2.03061"> sun.</tspan><tspan dx="2.03061"> By</tspan><tspan dx="2.03061"> night,</tspan><tspan dx="2.03061"> he</tspan><tspan dx="2.03061"> watched</tspan><tspan dx="2.03061"> the</tspan><tspan dx="2.03061"> stars.</tspan><tspan dx="2.03061"> Sailors</tspan><tspan dx="2.03061"> learnt</tspan><tspan dx="2.03061"> the</tspan><tspan dx="2.03061"> night</tspan></tspan><tspan x="89" dy="31">sky so well that they could tell their direction from it.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="979.7477138246369"><tspan x="89" data-justified="874">But<tspan dx="2.39502"> now</tspan><tspan dx="2.39502"> think</tspan><tspan dx="2.39502"> about</tspan><tspan dx="2.39502"> a</tspan><tspan dx="2.39502"> storm.</tspan><tspan dx="2.39502"> Thick</tspan><tspan dx="2.39502"> clouds</tspan><tspan dx="2.39502"> cover</tspan><tspan dx="2.39502"> the</tspan><tspan dx="2.39502"> sky</tspan><tspan dx="2.39502"> for</tspan><tspan dx="2.39502"> two</tspan><tspan dx="2.39502"> days.</tspan><tspan dx="2.39502"> There</tspan><tspan dx="2.39502"> is</tspan><tspan dx="2.39502"> no</tspan></tspan><tspan x="89" dy="31" data-justified="874">sun.<tspan dx="2.00951"> There</tspan><tspan dx="2.00951"> are</tspan><tspan dx="2.00951"> no</tspan><tspan dx="2.00951"> stars.</tspan><tspan dx="2.00951"> There</tspan><tspan dx="2.00951"> is</tspan><tspan dx="2.00951"> water</tspan><tspan dx="2.00951"> in</tspan><tspan dx="2.00951"> every</tspan><tspan dx="2.00951"> direction,</tspan><tspan dx="2.00951"> and</tspan><tspan dx="2.00951"> every</tspan><tspan dx="2.00951"> direction</tspan><tspan dx="2.00951"> looks</tspan></tspan><tspan x="89" dy="31">the same.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1086.7477138246368"><tspan x="89">Which way is home?</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1131.7477138246368"><tspan x="89" data-justified="874">A<tspan dx="4.60236"> naturally</tspan><tspan dx="4.60236"> magnetic</tspan><tspan dx="4.60236"> stone,</tspan><tspan dx="4.60236"> supported</tspan><tspan dx="4.60236"> so</tspan><tspan dx="4.60236"> it</tspan><tspan dx="4.60236"> could</tspan><tspan dx="4.60236"> turn</tspan><tspan dx="4.60236"> freely,</tspan><tspan dx="4.60236"> offered</tspan><tspan dx="4.60236"> a</tspan><tspan dx="4.60236"> direction</tspan></tspan><tspan x="89" dy="31" data-justified="874">reference<tspan dx="6.10931"> when</tspan><tspan dx="6.10931"> the</tspan><tspan dx="6.10931"> sky</tspan><tspan dx="6.10931"> was</tspan><tspan dx="6.10931"> hidden.</tspan><tspan dx="6.10931"> A</tspan><tspan dx="6.10931"> direction</tspan><tspan dx="6.10931"> alone</tspan><tspan dx="6.10931"> did</tspan><tspan dx="6.10931"> not</tspan><tspan dx="6.10931"> tell</tspan><tspan dx="6.10931"> sailors</tspan><tspan dx="6.10931"> their</tspan></tspan><tspan x="89" dy="31">position or the route home.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1238.7477138246368"><tspan x="89">This chapter is about that stone, and about the magnets we use today.</tspan></text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">1</text></g><!-- /botanical-footer --></svg></div></div></section>
