<section class="page page--food page--science-editorial page--illustrated" data-science-chapter="4" data-folio="21"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 21"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><g data-content-kind="question"><text class="se-copy" x="89" y="119"><tspan x="89" data-justified="874">8.<tspan dx="2.61231"> The</tspan><tspan dx="2.61231"> north</tspan><tspan dx="2.61231"> end</tspan><tspan dx="2.61231"> of</tspan><tspan dx="2.61231"> a</tspan><tspan dx="2.61231"> compass</tspan><tspan dx="2.61231"> needle</tspan><tspan dx="2.61231"> is</tspan><tspan dx="2.61231"> a</tspan><tspan dx="2.61231"> North</tspan><tspan dx="2.61231"> pole.</tspan><tspan dx="2.61231"> It</tspan><tspan dx="2.61231"> turns</tspan><tspan dx="2.61231"> towards</tspan><tspan dx="2.61231"> the</tspan><tspan dx="2.61231"> Earth's</tspan></tspan><tspan x="89" dy="31" data-justified="874">north.<tspan dx="5.50480"> But</tspan><tspan dx="5.50480"> you</tspan><tspan dx="5.50480"> learnt</tspan><tspan dx="5.50480"> that</tspan><tspan dx="5.50480"> like</tspan><tspan dx="5.50480"> poles</tspan><tspan dx="5.50480"> repel</tspan><tspan dx="5.50480"> and</tspan><tspan dx="5.50480"> unlike</tspan><tspan dx="5.50480"> poles</tspan><tspan dx="5.50480"> attract.</tspan><tspan dx="5.50480"> In</tspan><tspan dx="5.50480"> a</tspan><tspan dx="5.50480"> simple</tspan></tspan><tspan x="89" dy="31" data-justified="874">bar-magnet<tspan dx="4.64603"> model</tspan><tspan dx="4.64603"> of</tspan><tspan dx="4.64603"> Earth's</tspan><tspan dx="4.64603"> field,</tspan><tspan dx="4.64603"> which</tspan><tspan dx="4.64603"> magnetic</tspan><tspan dx="4.64603"> pole</tspan><tspan dx="4.64603"> belongs</tspan><tspan dx="4.64603"> near</tspan><tspan dx="4.64603"> geographic</tspan></tspan><tspan x="89" dy="31">north? Explain the model using unlike poles; do not treat it as a bar inside Earth.</tspan></text></g>
<g data-content-kind="question"><text class="se-copy" x="89" y="257"><tspan x="89" data-justified="874">9.<tspan dx="0.97443"> A</tspan><tspan dx="0.97443"> mechanic</tspan><tspan dx="0.97443"> is</tspan><tspan dx="0.97443"> repairing</tspan><tspan dx="0.97443"> a</tspan><tspan dx="0.97443"> machine</tspan><tspan dx="0.97443"> in</tspan><tspan dx="0.97443"> a</tspan><tspan dx="0.97443"> narrow</tspan><tspan dx="0.97443"> space.</tspan><tspan dx="0.97443"> The</tspan><tspan dx="0.97443"> small</tspan><tspan dx="0.97443"> steel</tspan><tspan dx="0.97443"> screws</tspan><tspan dx="0.97443"> keep</tspan></tspan><tspan x="89" dy="31" data-justified="874">slipping<tspan dx="3.00970"> off</tspan><tspan dx="3.00970"> his</tspan><tspan dx="3.00970"> screwdriver</tspan><tspan dx="3.00970"> and</tspan><tspan dx="3.00970"> falling</tspan><tspan dx="3.00970"> inside.</tspan><tspan dx="3.00970"> Suggest</tspan><tspan dx="3.00970"> a</tspan><tspan dx="3.00970"> way</tspan><tspan dx="3.00970"> to</tspan><tspan dx="3.00970"> solve</tspan><tspan dx="3.00970"> his</tspan><tspan dx="3.00970"> problem,</tspan></tspan><tspan x="89" dy="31">using what you have learnt.</tspan></text></g>
<g data-content-kind="question"><text class="se-copy" x="89" y="364"><tspan x="89" data-justified="874">10.<tspan dx="3.21241"> Two</tspan><tspan dx="3.21241"> ring</tspan><tspan dx="3.21241"> magnets,</tspan><tspan dx="3.21241"> X</tspan><tspan dx="3.21241"> and</tspan><tspan dx="3.21241"> Y,</tspan><tspan dx="3.21241"> are</tspan><tspan dx="3.21241"> put</tspan><tspan dx="3.21241"> on</tspan><tspan dx="3.21241"> a</tspan><tspan dx="3.21241"> vertical</tspan><tspan dx="3.21241"> wooden</tspan><tspan dx="3.21241"> stick,</tspan><tspan dx="3.21241"> one</tspan><tspan dx="3.21241"> above</tspan><tspan dx="3.21241"> the</tspan></tspan><tspan x="89" dy="31" data-justified="874">other.<tspan dx="1.61784"> Magnet</tspan><tspan dx="1.61784"> X</tspan><tspan dx="1.61784"> rests</tspan><tspan dx="1.61784"> above</tspan><tspan dx="1.61784"> magnet</tspan><tspan dx="1.61784"> Y</tspan><tspan dx="1.61784"> with</tspan><tspan dx="1.61784"> a</tspan><tspan dx="1.61784"> gap.</tspan><tspan dx="1.61784"> Explain</tspan><tspan dx="1.61784"> what</tspan><tspan dx="1.61784"> balances</tspan><tspan dx="1.61784"> its</tspan><tspan dx="1.61784"> weight</tspan></tspan><tspan x="89" dy="31" data-justified="874">and<tspan dx="1.70544"> how</tspan><tspan dx="1.70544"> the</tspan><tspan dx="1.70544"> rod</tspan><tspan dx="1.70544"> prevents</tspan><tspan dx="1.70544"> sideways</tspan><tspan dx="1.70544"> movement.</tspan><tspan dx="1.70544"> Now</tspan><tspan dx="1.70544"> suggest</tspan><tspan dx="1.70544"> a</tspan><tspan dx="1.70544"> way</tspan><tspan dx="1.70544"> to</tspan><tspan dx="1.70544"> make</tspan><tspan dx="1.70544"> X</tspan><tspan dx="1.70544"> touch</tspan></tspan><tspan x="89" dy="31">Y, without pushing either magnet with your hand.</tspan></text><svg class="science-illustration ip-art" x="89" y="479" width="874" height="385" viewBox="338 5 817 1011" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-6/science/ch04/png/rings.png" x="0" y="0" width="1536" height="1024"/></svg><text class="se-caption" x="526" y="893" text-anchor="middle">X: upper ring. Y: lower ring.</text></g>
<g data-content-kind="question"><text class="se-copy" x="89" y="935"><tspan x="89" data-justified="874">11.<tspan dx="3.00050"> Three</tspan><tspan dx="3.00050"> bar</tspan><tspan dx="3.00050"> magnets</tspan><tspan dx="3.00050"> are</tspan><tspan dx="3.00050"> arranged</tspan><tspan dx="3.00050"> end</tspan><tspan dx="3.00050"> to</tspan><tspan dx="3.00050"> end</tspan><tspan dx="3.00050"> on</tspan><tspan dx="3.00050"> a</tspan><tspan dx="3.00050"> table</tspan><tspan dx="3.00050"> in</tspan><tspan dx="3.00050"> a</tspan><tspan dx="3.00050"> zigzag</tspan><tspan dx="3.00050"> shape.</tspan><tspan dx="3.00050"> Each</tspan></tspan><tspan x="89" dy="31" data-justified="874">pair<tspan dx="1.17068"> of</tspan><tspan dx="1.17068"> neighbouring</tspan><tspan dx="1.17068"> ends</tspan><tspan dx="1.17068"> attracts.</tspan><tspan dx="1.17068"> One</tspan><tspan dx="1.17068"> end</tspan><tspan dx="1.17068"> is</tspan><tspan dx="1.17068"> marked</tspan><tspan dx="1.17068"> N.</tspan><tspan dx="1.17068"> Work</tspan><tspan dx="1.17068"> out</tspan><tspan dx="1.17068"> whether</tspan><tspan dx="1.17068"> each</tspan><tspan dx="1.17068"> of</tspan></tspan><tspan x="89" dy="31">the other ends is N or S, and explain the rule you used.</tspan></text><svg class="science-illustration ip-art" x="89" y="1019" width="874" height="162.87755102040816" viewBox="30 251 1862 347" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-6/science/ch04/png/zigzag.png" x="0" y="0" width="1916" height="821"/></svg><text class="se-caption" x="526" y="1210.8775510204082" text-anchor="middle">Neighbouring ends attract. Identify all six poles.</text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botani
