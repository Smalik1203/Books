<section class="page page--food page--science-editorial page--illustrated" data-science-chapter="4" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 10"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><g data-content-kind="heading"><text class="se-heading" x="89" y="124"><tspan x="89">Make Your Own Compass</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="181"><tspan x="89">You do not need to buy a compass. You can make one.</tspan></text></g>
<g data-content-kind="activity"><rect class="se-activity-panel" x="89" y="203" width="874" height="1077.3572474377745"/><path class="se-activity-tab" d="M109 203H943Q963 203 963 223V246H89V223Q89 203 109 203Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="209" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="232" text-anchor="start">The setup</text><text class="se-copy" x="113" y="298"><tspan x="113" data-justified="826">You<tspan dx="0.95722"> will</tspan><tspan dx="0.95722"> need:</tspan><tspan dx="0.95722"> a</tspan><tspan dx="0.95722"> steel</tspan><tspan dx="0.95722"> sewing</tspan><tspan dx="0.95722"> needle,</tspan><tspan dx="0.95722"> a</tspan><tspan dx="0.95722"> bar</tspan><tspan dx="0.95722"> magnet,</tspan><tspan dx="0.95722"> a</tspan><tspan dx="0.95722"> small</tspan><tspan dx="0.95722"> piece</tspan><tspan dx="0.95722"> of</tspan><tspan dx="0.95722"> cork,</tspan><tspan dx="0.95722"> a</tspan><tspan dx="0.95722"> bowl</tspan></tspan><tspan x="113" dy="31">of water, a few steel pins.</tspan></text><text class="se-activity-step" x="114" y="372" text-anchor="start">1.</text><text class="se-copy" x="143" y="372"><tspan x="143" data-justified="482">Before<tspan dx="14.29866"> stroking,</tspan><tspan dx="14.29866"> test</tspan><tspan dx="14.29866"> whether</tspan><tspan dx="14.29866"> the</tspan><tspan dx="14.29866"> needle</tspan></tspan><tspan x="143" dy="31" data-justified="482">attracts<tspan dx="11.41709"> a</tspan><tspan dx="11.41709"> pin.</tspan><tspan dx="11.41709"> Record</tspan><tspan dx="11.41709"> the</tspan><tspan dx="11.41709"> result</tspan><tspan dx="11.41709"> in</tspan><tspan dx="11.41709"> your</tspan></tspan><tspan x="143" dy="31" data-justified="482">notebook,<tspan dx="0.52158"> then</tspan><tspan dx="0.52158"> lay</tspan><tspan dx="0.52158"> the</tspan><tspan dx="0.52158"> needle</tspan><tspan dx="0.52158"> flat</tspan><tspan dx="0.52158"> on</tspan><tspan dx="0.52158"> a</tspan><tspan dx="0.52158"> wooden</tspan></tspan><tspan x="143" dy="31">table.</tspan></text><text class="se-activity-step" x="114" y="508" text-anchor="start">2.</text><text class="se-copy" x="143" y="508"><tspan x="143" data-justified="482">Hold<tspan dx="1.08858"> one</tspan><tspan dx="1.08858"> pole</tspan><tspan dx="1.08858"> of</tspan><tspan dx="1.08858"> the</tspan><tspan dx="1.08858"> bar</tspan><tspan dx="1.08858"> magnet</tspan><tspan dx="1.08858"> at</tspan><tspan dx="1.08858"> one</tspan><tspan dx="1.08858"> end</tspan><tspan dx="1.08858"> of</tspan></tspan><tspan x="143" dy="31" data-justified="482">the<tspan dx="2.06659"> needle.</tspan><tspan dx="2.06659"> Press</tspan><tspan dx="2.06659"> lightly</tspan><tspan dx="2.06659"> and</tspan><tspan dx="2.06659"> slide</tspan><tspan dx="2.06659"> it</tspan><tspan dx="2.06659"> along</tspan><tspan dx="2.06659"> the</tspan></tspan><tspan x="143" dy="31">needle to the other end.</tspan></text><text class="se-activity-step" x="114" y="613" text-anchor="start">3.</text><text class="se-copy" x="143" y="613"><tspan x="143" data-justified="482">At<tspan dx="1.50167"> the</tspan><tspan dx="1.50167"> end</tspan><tspan dx="1.50167"> of</tspan><tspan dx="1.50167"> the</tspan><tspan dx="1.50167"> needle,</tspan><tspan dx="1.50167"> lift</tspan><tspan dx="1.50167"> the</tspan><tspan dx="1.50167"> <tspan class="se-bold">magnet</tspan></tspan><tspan dx="1.50167"> right</tspan></tspan><tspan x="143" dy="31">up and away.</tspan></text><text class="se-activity-step" x="114" y="687" text-anchor="start">4.</text><text class="se-copy" x="143" y="687"><tspan x="143" data-justified="482">Bring<tspan dx="1.55723"> the</tspan><tspan dx="1.55723"> same</tspan><tspan dx="1.55723"> pole</tspan><tspan dx="1.55723"> back</tspan><tspan dx="1.55723"> to</tspan><tspan dx="1.55723"> the</tspan><tspan dx="1.55723"> same</tspan><tspan dx="1.55723"> starting</tspan></tspan><tspan x="143" dy="31">end. Slide it along again in the same direction.</tspan></text><text class="se-activity-step" x="114" y="761" text-anchor="start">5.</text><text class="se-copy" x="143" y="761"><tspan x="143" data-justified="482">Repeat<tspan dx="0.52514"> this</tspan><tspan dx="0.52514"> thirty</tspan><tspan dx="0.52514"> to</tspan><tspan dx="0.52514"> forty</tspan><tspan dx="0.52514"> times.</tspan><tspan dx="0.52514"> Always</tspan><tspan dx="0.52514"> stroke</tspan></tspan><tspan x="143" dy="31" data-justified="482">in<tspan dx="3.84749"> one</tspan><tspan dx="3.84749"> direction</tspan><tspan dx="3.84749"> only.</tspan><tspan dx="3.84749"> Always</tspan><tspan dx="3.84749"> lift</tspan><tspan dx="3.84749"> the</tspan><tspan dx="3.84749"> magnet</tspan></tspan><tspan x="143" dy="31">clear at the end of each stroke.</tspan></text><text class="se-activity-step" x="114" y="876" text-anchor="start">6.</text><text class="se-copy" x="143" y="876"><tspan x="143" data-justified="796">Put<tspan dx="3.69169"> the</tspan><tspan dx="3.69169"> bar</tspan><tspan dx="3.69169"> magnet</tspan><tspan dx="3.69169"> well</tspan><tspan dx="3.69169"> away.</tspan><tspan dx="3.69169"> Repeat</tspan><tspan dx="3.69169"> the</tspan><tspan dx="3.69169"> pin</tspan><tspan dx="3.69169"> test</tspan><tspan dx="3.69169"> and</tspan><tspan dx="3.69169"> compare</tspan><tspan dx="3.69169"> with</tspan><tspan dx="3.69169"> your</tspan></tspan><tspan x="143" dy="31">before-test. Attraction alone is not conclusive; check the floating needle next.</tspan></text><text class="se-activity-step" x="114" y="950" text-anchor="start">7.</text><text class="se-copy" x="143" y="950"><tspan x="143" data-justified="482">Ask<tspan dx="0.24637"> an</tspan><tspan dx="0.24637"> adult</tspan><tspan dx="0.24637"> to</tspan><tspan dx="0.24637"> secure</tspan><tspan dx="0.24637"> the</tspan><tspan dx="0.24637"> needle</tspan><tspan dx="0.24637"> flat</tspan><tspan dx="0.24637"> on</tspan><tspan dx="0.24637"> top</tspan><tspan dx="0.24637"> of</tspan></tspan><tspan x="143" dy="31" data-justified="482">the<tspan dx="1.96110"> cork</tspan><tspan dx="1.96110"> with</tspan><tspan dx="1.96110"> a</tspan><tspan dx="1.96110"> small</tspan><tspan dx="1.96110"> piece</tspan><tspan dx="1.96110"> of</tspan><tspan dx="1.96110"> tape,</tspan><tspan dx="1.96110"> so</tspan><tspan dx="1.96110"> it</tspan><tspan dx="1.96110"> stays</tspan></tspan><tspan x="143" dy="31">level.</tspan></text><text class="se-activity-step" x="114" y="1055" text-anchor="start">8.</text><text class="se-copy" x="143" y="1055"><tspan x="143" data-justified="482">Float<tspan dx="0.43693"> the</tspan><tspan dx="0.43693"> cork</tspan><tspan dx="0.43693"> in</tspan><tspan dx="0.43693"> the</tspan><tspan dx="0.43693"> bowl</tspan><tspan dx="0.43693"> of</tspan><tspan dx="0.43693"> water.</tspan><tspan dx="0.43693"> The</tspan><tspan dx="0.43693"> needle</tspan></tspan><tspan x="143" dy="31">should stay above the water.</tspan></text><text class="se-activity-step" x="114" y="1129" text-anchor="start">9.</text><text class="se-copy" x="143" y="1129"><tspan x="143">Wait for it to stop turning.</tspan></text><text class="se-copy" x="113" y="1213.3572474377745"><tspan x="113" data-justified="826">Safety:<tspan dx="3.02545"> Sewing</tspan><tspan dx="3.02545"> needles</tspan><tspan dx="3.02545"> are</tspan><tspan dx="3.02545"> sharp.</tspan><tspan dx="3.02545"> Ask</tspan><tspan dx="3.02545"> an</tspan><tspan dx="3.02545"> adult</tspan><tspan dx="3.02545"> to</tspan><tspan dx="3.02545"> tape</tspan><tspan dx="3.02545"> the</tspan><tspan dx="3.02545"> needle</tspan><tspan dx="3.02545"> to</tspan><tspan dx="3.02545"> the</tspan><tspan dx="3.02545"> cork.</tspan></tspan><tspan x="113" dy="31">Keep its point away from hands.</tspan></text><svg class="science-illustration ip-art" x="656" y="352" width="283" height="133.24346076458752" viewBox="45 78 1491 702" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-6/science/ch04/png/stroke.png" x="0" y="0" width="1536" height="1024"/></svg><text class="se-caption" x="797.5" y="512.2434607645876" text-anchor="middle">Stroke in one direction.</text><svg class="science-illustration ip-art" x="656" y="930" width="283" height="189.35724743777453" viewBox="85 58 1366 914" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-6/science/ch04/png/floating-compass.png" x="0" y="0" width="1536" height="1024"/></svg><text class="se-caption" x="797.5" y="1146.3572474377745" text-anchor="middle">Float the needle on cork.</text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">10</text></g><!-- /botanical-footer --></svg></div></div></section>
