<section class="page page--food page--science-editorial page--illustrated" data-science-chapter="4" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 8"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><g data-content-kind="heading"><text class="se-heading" x="89" y="124"><tspan x="89">Always the Same Line</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="181"><tspan x="89" data-justified="874">Compare<tspan dx="3.32020"> your</tspan><tspan dx="3.32020"> repeated</tspan><tspan dx="3.32020"> trials.</tspan><tspan dx="3.32020"> Does</tspan><tspan dx="3.32020"> the</tspan><tspan dx="3.32020"> same</tspan><tspan dx="3.32020"> end</tspan><tspan dx="3.32020"> return</tspan><tspan dx="3.32020"> to</tspan><tspan dx="3.32020"> the</tspan><tspan dx="3.32020"> same</tspan><tspan dx="3.32020"> direction?</tspan><tspan dx="3.32020"> A</tspan></tspan><tspan x="89" dy="31">sticking support or a nearby magnet can change the result.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="257"><tspan x="89" data-justified="874">Now<tspan dx="2.20841"> find</tspan><tspan dx="2.20841"> out</tspan><tspan dx="2.20841"> what</tspan><tspan dx="2.20841"> that</tspan><tspan dx="2.20841"> line</tspan><tspan dx="2.20841"> is.</tspan><tspan dx="2.20841"> If</tspan><tspan dx="2.20841"> you</tspan><tspan dx="2.20841"> know</tspan><tspan dx="2.20841"> where</tspan><tspan dx="2.20841"> the</tspan><tspan dx="2.20841"> sun</tspan><tspan dx="2.20841"> rises,</tspan><tspan dx="2.20841"> you</tspan><tspan dx="2.20841"> know</tspan><tspan dx="2.20841"> roughly</tspan></tspan><tspan x="89" dy="31" data-justified="874">where<tspan dx="1.19285"> east</tspan><tspan dx="1.19285"> is.</tspan><tspan dx="1.19285"> Face</tspan><tspan dx="1.19285"> east</tspan><tspan dx="1.19285"> and</tspan><tspan dx="1.19285"> stretch</tspan><tspan dx="1.19285"> out</tspan><tspan dx="1.19285"> your</tspan><tspan dx="1.19285"> arms.</tspan><tspan dx="1.19285"> North</tspan><tspan dx="1.19285"> is</tspan><tspan dx="1.19285"> on</tspan><tspan dx="1.19285"> your</tspan><tspan dx="1.19285"> left.</tspan><tspan dx="1.19285"> South</tspan><tspan dx="1.19285"> is</tspan><tspan dx="1.19285"> on</tspan></tspan><tspan x="89" dy="31">your right.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="364"><tspan x="89" data-justified="874">Away<tspan dx="11.13371"> from</tspan><tspan dx="11.13371"> nearby</tspan><tspan dx="11.13371"> magnets</tspan><tspan dx="11.13371"> and</tspan><tspan dx="11.13371"> iron</tspan><tspan dx="11.13371"> objects,</tspan><tspan dx="11.13371"> it</tspan><tspan dx="11.13371"> settles</tspan><tspan dx="11.13371"> along</tspan><tspan dx="11.13371"> the</tspan><tspan dx="11.13371"> magnetic</tspan></tspan><tspan x="89" dy="31" data-justified="874">north-south<tspan dx="1.00986"> line.</tspan><tspan dx="1.00986"> This</tspan><tspan dx="1.00986"> is</tspan><tspan dx="1.00986"> usually</tspan><tspan dx="1.00986"> close</tspan><tspan dx="1.00986"> to</tspan><tspan dx="1.00986"> geographic</tspan><tspan dx="1.00986"> north-south,</tspan><tspan dx="1.00986"> but</tspan><tspan dx="1.00986"> not</tspan><tspan dx="1.00986"> exactly</tspan><tspan dx="1.00986"> the</tspan></tspan><tspan x="89" dy="31">same.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="471"><tspan x="89" data-justified="874">One<tspan dx="1.65514"> end</tspan><tspan dx="1.65514"> always</tspan><tspan dx="1.65514"> turns</tspan><tspan dx="1.65514"> towards</tspan><tspan dx="1.65514"> the</tspan><tspan dx="1.65514"> north.</tspan><tspan dx="1.65514"> That</tspan><tspan dx="1.65514"> end</tspan><tspan dx="1.65514"> is</tspan><tspan dx="1.65514"> the</tspan><tspan dx="1.65514"> <tspan class="se-bold">North</tspan></tspan><tspan dx="1.65514"> <tspan class="se-bold">pole</tspan></tspan><tspan dx="1.65514"> of</tspan><tspan dx="1.65514"> the</tspan><tspan dx="1.65514"> magnet.</tspan></tspan><tspan x="89" dy="31" data-justified="874">The<tspan dx="4.71176"> other</tspan><tspan dx="4.71176"> end</tspan><tspan dx="4.71176"> always</tspan><tspan dx="4.71176"> turns</tspan><tspan dx="4.71176"> towards</tspan><tspan dx="4.71176"> the</tspan><tspan dx="4.71176"> south.</tspan><tspan dx="4.71176"> That</tspan><tspan dx="4.71176"> is</tspan><tspan dx="4.71176"> the</tspan><tspan dx="4.71176"> <tspan class="se-bold">South</tspan></tspan><tspan dx="4.71176"> <tspan class="se-bold">pole</tspan>.</tspan><tspan dx="4.71176"> Now</tspan><tspan dx="4.71176"> the</tspan></tspan><tspan x="89" dy="31">names make sense. They are named after the direction each end looks for.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="578"><tspan x="89">But why does this happen at all?</tspan></text></g>
<g data-content-kind="body"><g class="se-learning-cue se-feature--explain" data-feature="explain" aria-label="How It Works"><svg class="se-feature-icon se-feature--explain" x="92" y="601" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h5m10 0h5M7 7l3 3m4 4 3 3M7 17l3-3m4-4 3-3M15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="148" y="630">How It Works</text></g><text class="se-copy" x="89" y="687"><tspan x="89" data-justified="874">Earth<tspan dx="5.58297"> has</tspan><tspan dx="5.58297"> a</tspan><tspan dx="5.58297"> magnetic</tspan><tspan dx="5.58297"> field.</tspan><tspan dx="5.58297"> It</tspan><tspan dx="5.58297"> exerts</tspan><tspan dx="5.58297"> a</tspan><tspan dx="5.58297"> turning</tspan><tspan dx="5.58297"> effect,</tspan><tspan dx="5.58297"> called</tspan><tspan dx="5.58297"> <tspan class="se-bold">torque</tspan>,</tspan><tspan dx="5.58297"> on</tspan><tspan dx="5.58297"> a</tspan><tspan dx="5.58297"> freely</tspan></tspan><tspan x="89" dy="31" data-justified="874">suspended<tspan dx="2.01224"> magnet.</tspan><tspan dx="2.01224"> The</tspan><tspan dx="2.01224"> magnet</tspan><tspan dx="2.01224"> rotates</tspan><tspan dx="2.01224"> into</tspan><tspan dx="2.01224"> alignment</tspan><tspan dx="2.01224"> with</tspan><tspan dx="2.01224"> the</tspan><tspan dx="2.01224"> local</tspan><tspan dx="2.01224"> field;</tspan><tspan dx="2.01224"> it</tspan><tspan dx="2.01224"> is</tspan><tspan dx="2.01224"> not</tspan></tspan><tspan x="89" dy="31">being carried towards the North Pole. Earth does not contain a giant bar magnet.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="794"><tspan x="89" data-justified="874">Repeat<tspan dx="6.80552"> with</tspan><tspan dx="6.80552"> an</tspan><tspan dx="6.80552"> iron</tspan><tspan dx="6.80552"> bar,</tspan><tspan dx="6.80552"> if</tspan><tspan dx="6.80552"> your</tspan><tspan dx="6.80552"> teacher</tspan><tspan dx="6.80552"> has</tspan><tspan dx="6.80552"> one.</tspan><tspan dx="6.80552"> Record</tspan><tspan dx="6.80552"> its</tspan><tspan dx="6.80552"> direction</tspan><tspan dx="6.80552"> without</tspan></tspan><tspan x="89" dy="31" data-justified="874">prescribing<tspan dx="3.03196"> a</tspan><tspan dx="3.03196"> result.</tspan><tspan dx="3.03196"> Iron</tspan><tspan dx="3.03196"> can</tspan><tspan dx="3.03196"> retain</tspan><tspan dx="3.03196"> magnetisation,</tspan><tspan dx="3.03196"> and</tspan><tspan dx="3.03196"> its</tspan><tspan dx="3.03196"> shape</tspan><tspan dx="3.03196"> and</tspan><tspan dx="3.03196"> Earth's</tspan><tspan dx="3.03196"> field</tspan></tspan><tspan x="89" dy="31">can affect alignment. Failure to turn is not proof that a bar is unmagnetised.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="901"><tspan x="89" data-justified="874">This<tspan dx="0.57242"> gives</tspan><tspan dx="0.57242"> us</tspan><tspan dx="0.57242"> a</tspan><tspan dx="0.57242"> useful</tspan><tspan dx="0.57242"> test.</tspan><tspan dx="0.57242"> Hang</tspan><tspan dx="0.57242"> a</tspan><tspan dx="0.57242"> metal</tspan><tspan dx="0.57242"> bar</tspan><tspan dx="0.57242"> freely.</tspan><tspan dx="0.57242"> If</tspan><tspan dx="0.57242"> the</tspan><tspan dx="0.57242"> same</tspan><tspan dx="0.57242"> end</tspan><tspan dx="0.57242"> repeatedly</tspan><tspan dx="0.57242"> points</tspan></tspan><tspan x="89" dy="31" data-justified="874">towards<tspan dx="2.96495"> magnetic</tspan><tspan dx="2.96495"> north,</tspan><tspan dx="2.96495"> that</tspan><tspan dx="2.96495"> is</tspan><tspan dx="2.96495"> evidence</tspan><tspan dx="2.96495"> that</tspan><tspan dx="2.96495"> the</tspan><tspan dx="2.96495"> bar</tspan><tspan dx="2.96495"> is</tspan><tspan dx="2.96495"> magnetised.</tspan><tspan dx="2.96495"> Check</tspan><tspan dx="2.96495"> that</tspan><tspan dx="2.96495"> it</tspan></tspan><tspan x="89" dy="31">turns freely and that no nearby magnet is disturbing it.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1008"><tspan x="89" data-justified="874">A<tspan dx="5.79816"> compass</tspan><tspan dx="5.79816"> direction</tspan><tspan dx="5.79816"> is</tspan><tspan dx="5.79816"> a</tspan><tspan dx="5.79816"> local</tspan><tspan dx="5.79816"> observation.</tspan><tspan dx="5.79816"> Nearby</tspan><tspan dx="5.79816"> iron</tspan><tspan dx="5.79816"> and</tspan><tspan dx="5.79816"> other</tspan><tspan dx="5.79816"> magnets</tspan><tspan dx="5.79816"> can</tspan></tspan><tspan x="89" dy="31" data-justified="874">change<tspan dx="2.35404"> it.</tspan><tspan dx="2.35404"> That</tspan><tspan dx="2.35404"> is</tspan><tspan dx="2.35404"> why</tspan><tspan dx="2.35404"> checking</tspan><tspan dx="2.35404"> the</tspan><tspan dx="2.35404"> surroundings</tspan><tspan dx="2.35404"> is</tspan><tspan dx="2.35404"> part</tspan><tspan dx="2.35404"> of</tspan><tspan dx="2.35404"> the</tspan><tspan dx="2.35404"> experiment,</tspan><tspan dx="2.35404"> just</tspan><tspan dx="2.35404"> as</tspan></tspan><tspan x="89" dy="31">important as waiting for the magnet to stop.</tspan></text></g>
<g data-content-kind="heading"><text class="se-heading" x="89" y="1120"><tspan x="89">The Magnetic Compass</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1177"><tspan x="89" data-justified="874">A<tspan dx="3.49535"> hanging</tspan><tspan dx="3.49535"> magnet</tspan><tspan dx="3.49535"> works,</tspan><tspan dx="3.49535"> but</tspan><tspan dx="3.49535"> it</tspan><tspan dx="3.49535"> is</tspan><tspan dx="3.49535"> not</tspan><tspan dx="3.49535"> much</tspan><tspan dx="3.49535"> use</tspan><tspan dx="3.49535"> on</tspan><tspan dx="3.49535"> a</tspan><tspan dx="3.49535"> rolling</tspan><tspan dx="3.49535"> ship.</tspan><tspan dx="3.49535"> It</tspan><tspan dx="3.49535"> needs</tspan><tspan dx="3.49535"> to</tspan><tspan dx="3.49535"> be</tspan></tspan><tspan x="89" dy="31">small, steady, and easy to read.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1253"><tspan x="89">That is exactly what a <tspan class="se-bold">magnetic</tspan> <tspan class="se-bold">compass</tspan> is.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1298"><tspan x="89" data-justified="874">Inside<tspan dx="6.46580"> a</tspan><tspan dx="6.46580"> compass</tspan><tspan dx="6.46580"> there</tspan><tspan dx="6.46580"> is</tspan><tspan dx="6.46580"> a</tspan><tspan dx="6.46580"> thin</tspan><tspan dx="6.46580"> magnet</tspan><tspan dx="6.46580"> shaped</tspan><tspan dx="6.46580"> like</tspan><tspan dx="6.46580"> a</tspan><tspan dx="6.46580"> needle.</tspan><tspan dx="6.46580"> The</tspan><tspan dx="6.46580"> needle</tspan><tspan dx="6.46580"> sits</tspan></tspan><tspan x="89" dy="31" data-justified="874">balanced<tspan dx="0.43547"> on</tspan><tspan dx="0.43547"> a</tspan><tspan dx="0.43547"> sharp</tspan><tspan dx="0.43547"> pin,</tspan><tspan dx="0.43547"> so</tspan><tspan dx="0.43547"> it</tspan><tspan dx="0.43547"> can</tspan><tspan dx="0.43547"> turn</tspan><tspan dx="0.43547"> very</tspan><tspan dx="0.43547"> easily.</tspan><tspan dx="0.43547"> Under</tspan><tspan dx="0.43547"> the</tspan><tspan dx="0.43547"> needle</tspan><tspan dx="0.43547"> is</tspan><tspan dx="0.43547"> a</tspan><tspan dx="0.43547"> dial</tspan><tspan dx="0.43547"> with</tspan><tspan dx="0.43547"> the</tspan></tspan><tspan x="89" dy="31">directions marked on it. A clear cover keeps out wind and rain.</tspan></text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">8</text></g><!-- /botanical-footer --></svg></div></div></section>
