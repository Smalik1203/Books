<section class="page page--food page--science-editorial page--illustrated" data-science-chapter="4" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 6"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><g data-content-kind="heading"><text class="se-heading" x="89" y="124"><tspan x="89">Two Ends, Two Poles</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="181"><tspan x="89" data-justified="874">The<tspan dx="0.56468"> filings</tspan><tspan dx="0.56468"> do</tspan><tspan dx="0.56468"> not</tspan><tspan dx="0.56468"> spread</tspan><tspan dx="0.56468"> evenly.</tspan><tspan dx="0.56468"> They</tspan><tspan dx="0.56468"> gather</tspan><tspan dx="0.56468"> in</tspan><tspan dx="0.56468"> thick</tspan><tspan dx="0.56468"> bunches</tspan><tspan dx="0.56468"> at</tspan><tspan dx="0.56468"> the</tspan><tspan dx="0.56468"> two</tspan><tspan dx="0.56468"> ends</tspan><tspan dx="0.56468"> of</tspan><tspan dx="0.56468"> the</tspan></tspan><tspan x="89" dy="31">bar magnet. In the middle, there are hardly any.</tspan></text></g>
<g data-content-kind="body"><g class="se-learning-cue se-feature--explain" data-feature="explain" aria-label="The mechanism"><svg class="se-feature-icon se-feature--explain" x="92" y="235" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h5m10 0h5M7 7l3 3m4 4 3 3M7 17l3-3m4-4 3-3M15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="148" y="264">The mechanism</text></g><text class="se-copy" x="89" y="321"><tspan x="89" data-justified="874">The<tspan dx="4.39611"> pattern</tspan><tspan dx="4.39611"> suggests</tspan><tspan dx="4.39611"> a</tspan><tspan dx="4.39611"> stronger</tspan><tspan dx="4.39611"> effect</tspan><tspan dx="4.39611"> near</tspan><tspan dx="4.39611"> the</tspan><tspan dx="4.39611"> ends.</tspan><tspan dx="4.39611"> It</tspan><tspan dx="4.39611"> is</tspan><tspan dx="4.39611"> not</tspan><tspan dx="4.39611"> a</tspan><tspan dx="4.39611"> force</tspan><tspan dx="4.39611"> meter:</tspan><tspan dx="4.39611"> the</tspan></tspan><tspan x="89" dy="31" data-justified="874">filings<tspan dx="1.26484"> become</tspan><tspan dx="1.26484"> temporarily</tspan><tspan dx="1.26484"> magnetised,</tspan><tspan dx="1.26484"> turn</tspan><tspan dx="1.26484"> into</tspan><tspan dx="1.26484"> alignment</tspan><tspan dx="1.26484"> and</tspan><tspan dx="1.26484"> attract</tspan><tspan dx="1.26484"> one</tspan><tspan dx="1.26484"> another</tspan></tspan><tspan x="89" dy="31">into chains.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="428"><tspan x="89" data-justified="874">The<tspan dx="3.55542"> strongest</tspan><tspan dx="3.55542"> regions</tspan><tspan dx="3.55542"> near</tspan><tspan dx="3.55542"> the</tspan><tspan dx="3.55542"> ends</tspan><tspan dx="3.55542"> are</tspan><tspan dx="3.55542"> the</tspan><tspan dx="3.55542"> <tspan class="se-bold">poles</tspan></tspan><tspan dx="3.55542"> of</tspan><tspan dx="3.55542"> this</tspan><tspan dx="3.55542"> bar</tspan><tspan dx="3.55542"> magnet.</tspan><tspan dx="3.55542"> The</tspan><tspan dx="3.55542"> simple</tspan></tspan><tspan x="89" dy="31" data-justified="874">magnets<tspan dx="2.79324"> studied</tspan><tspan dx="2.79324"> here</tspan><tspan dx="2.79324"> have</tspan><tspan dx="2.79324"> a</tspan><tspan dx="2.79324"> North</tspan><tspan dx="2.79324"> and</tspan><tspan dx="2.79324"> a</tspan><tspan dx="2.79324"> South</tspan><tspan dx="2.79324"> pole;</tspan><tspan dx="2.79324"> specially</tspan><tspan dx="2.79324"> made</tspan><tspan dx="2.79324"> magnets</tspan><tspan dx="2.79324"> may</tspan></tspan><tspan x="89" dy="31" data-justified="874">have<tspan dx="0.34747"> several</tspan><tspan dx="0.34747"> pole</tspan><tspan dx="0.34747"> regions.</tspan><tspan dx="0.34747"> One</tspan><tspan dx="0.34747"> is</tspan><tspan dx="0.34747"> called</tspan><tspan dx="0.34747"> the</tspan><tspan dx="0.34747"> <tspan class="se-bold">North</tspan></tspan><tspan dx="0.34747"> <tspan class="se-bold">pole</tspan>.</tspan><tspan dx="0.34747"> The</tspan><tspan dx="0.34747"> other</tspan><tspan dx="0.34747"> is</tspan><tspan dx="0.34747"> called</tspan><tspan dx="0.34747"> the</tspan><tspan dx="0.34747"> <tspan class="se-bold">South</tspan></tspan></tspan><tspan x="89" dy="31"><tspan class="se-bold">pole</tspan>. You will find out in a moment why those names were chosen.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="566"><tspan x="89" data-justified="874">A<tspan dx="1.73016"> U-shaped</tspan><tspan dx="1.73016"> magnet</tspan><tspan dx="1.73016"> has</tspan><tspan dx="1.73016"> poles</tspan><tspan dx="1.73016"> at</tspan><tspan dx="1.73016"> its</tspan><tspan dx="1.73016"> two</tspan><tspan dx="1.73016"> tips.</tspan><tspan dx="1.73016"> In</tspan><tspan dx="1.73016"> many</tspan><tspan dx="1.73016"> school</tspan><tspan dx="1.73016"> ring</tspan><tspan dx="1.73016"> magnets,</tspan><tspan dx="1.73016"> one</tspan><tspan dx="1.73016"> flat</tspan></tspan><tspan x="89" dy="31" data-justified="874">face<tspan dx="0.05615"> is</tspan><tspan dx="0.05615"> North</tspan><tspan dx="0.05615"> and</tspan><tspan dx="0.05615"> the</tspan><tspan dx="0.05615"> other</tspan><tspan dx="0.05615"> is</tspan><tspan dx="0.05615"> South.</tspan><tspan dx="0.05615"> Pole</tspan><tspan dx="0.05615"> positions</tspan><tspan dx="0.05615"> depend</tspan><tspan dx="0.05615"> on</tspan><tspan dx="0.05615"> how</tspan><tspan dx="0.05615"> a</tspan><tspan dx="0.05615"> magnet</tspan><tspan dx="0.05615"> is</tspan><tspan dx="0.05615"> made;</tspan></tspan><tspan x="89" dy="31">they need not look like the ends of a bar.</tspan></text></g>
<g data-content-kind="prompt"><g class="se-feature--imagine"><rect class="se-prompt" x="89" y="650" width="874" height="266"/><line class="se-think-rule" x1="89" x2="963" y1="650" y2="650"/><g class="se-learning-cue se-feature--imagine" data-feature="imagine" aria-label="Work it out in your head"><svg class="se-feature-icon se-feature--imagine" x="113" y="661" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15a7 7 0 1 1 13-4v4h-3v6h-5v-4H5ZM9 8h5m-5 3h3"/></svg><text class="se-cue-title" x="169" y="690">Work it out in your head</text></g><text class="se-copy" x="113" y="734"><tspan x="113" data-justified="826">Now<tspan dx="1.25451"> here</tspan><tspan dx="1.25451"> is</tspan><tspan dx="1.25451"> a</tspan><tspan dx="1.25451"> question.</tspan><tspan dx="1.25451"> Suppose</tspan><tspan dx="1.25451"> you</tspan><tspan dx="1.25451"> break</tspan><tspan dx="1.25451"> a</tspan><tspan dx="1.25451"> bar</tspan><tspan dx="1.25451"> magnet</tspan><tspan dx="1.25451"> in</tspan><tspan dx="1.25451"> half.</tspan><tspan dx="1.25451"> Would</tspan><tspan dx="1.25451"> you</tspan><tspan dx="1.25451"> get</tspan></tspan><tspan x="113" dy="31" data-justified="826">one<tspan dx="4.66459"> piece</tspan><tspan dx="4.66459"> with</tspan><tspan dx="4.66459"> only</tspan><tspan dx="4.66459"> a</tspan><tspan dx="4.66459"> North</tspan><tspan dx="4.66459"> pole,</tspan><tspan dx="4.66459"> and</tspan><tspan dx="4.66459"> another</tspan><tspan dx="4.66459"> with</tspan><tspan dx="4.66459"> only</tspan><tspan dx="4.66459"> a</tspan><tspan dx="4.66459"> South</tspan><tspan dx="4.66459"> pole?</tspan><tspan dx="4.66459"> You</tspan></tspan><tspan x="113" dy="31" data-justified="826">would<tspan dx="1.66471"> not.</tspan><tspan dx="1.66471"> Each</tspan><tspan dx="1.66471"> broken</tspan><tspan dx="1.66471"> piece</tspan><tspan dx="1.66471"> turns</tspan><tspan dx="1.66471"> out</tspan><tspan dx="1.66471"> to</tspan><tspan dx="1.66471"> be</tspan><tspan dx="1.66471"> a</tspan><tspan dx="1.66471"> complete</tspan><tspan dx="1.66471"> magnet,</tspan><tspan dx="1.66471"> with</tspan><tspan dx="1.66471"> a</tspan><tspan dx="1.66471"> North</tspan></tspan><tspan x="113" dy="31" data-justified="826">pole<tspan dx="2.14704"> and</tspan><tspan dx="2.14704"> a</tspan><tspan dx="2.14704"> South</tspan><tspan dx="2.14704"> pole</tspan><tspan dx="2.14704"> of</tspan><tspan dx="2.14704"> its</tspan><tspan dx="2.14704"> own.</tspan><tspan dx="2.14704"> Break</tspan><tspan dx="2.14704"> those</tspan><tspan dx="2.14704"> pieces</tspan><tspan dx="2.14704"> again</tspan><tspan dx="2.14704"> and</tspan><tspan dx="2.14704"> the</tspan><tspan dx="2.14704"> same</tspan><tspan dx="2.14704"> thing</tspan></tspan><tspan x="113" dy="31" data-justified="826">happens.<tspan dx="2.56014"> Cutting</tspan><tspan dx="2.56014"> divides</tspan><tspan dx="2.56014"> the</tspan><tspan dx="2.56014"> material,</tspan><tspan dx="2.56014"> not</tspan><tspan dx="2.56014"> the</tspan><tspan dx="2.56014"> two</tspan><tspan dx="2.56014"> poles</tspan><tspan dx="2.56014"> into</tspan><tspan dx="2.56014"> separate</tspan><tspan dx="2.56014"> objects.</tspan></tspan><tspan x="113" dy="31">Each piece still has a North and a South pole. Do not break magnets to test this.</tspan></text></g></g>
<g data-content-kind="figure"><svg class="science-illustration ip-art" x="89" y="936" width="874" height="97.86625194401245" viewBox="30 278 1929 216" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-6/science/ch04/png/broken.png" x="0" y="0" width="1983" height="793"/></svg><text class="se-caption" x="526" y="1062.8662519440124" text-anchor="middle">Each piece has both poles. A thought experiment: do not break a magnet.</text></g>
<g data-content-kind="art"><svg class="science-illustration ip-art" x="89" y="1081.8662519440124" width="874" height="230" viewBox="95 108 1340 800" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-6/science/ch04/png/filings.png" x="0" y="0" width="1536" height="1024"/></svg><text class="se-caption" x="526" y="1340.8662519440124" text-anchor="middle">Filings align and form chains; the pattern is not a direct force measurement.</text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">6</text></g><!-- /botanical-footer --></svg></div></div></section>
