<section class="page page--food page--science-editorial page--illustrated" data-science-chapter="4" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 11"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><g data-content-kind="prompt"><g class="se-feature--observe"><rect class="se-prompt" x="89" y="96" width="874" height="173"/><line class="se-think-rule" x1="89" x2="963" y1="96" y2="96"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What Did You Notice?"><svg class="se-feature-icon se-feature--observe" x="113" y="107" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="136">What Did You Notice?</text></g><text class="se-copy" x="113" y="180"><tspan x="113" data-justified="826">Gently<tspan dx="2.97142"> turn</tspan><tspan dx="2.97142"> the</tspan><tspan dx="2.97142"> cork</tspan><tspan dx="2.97142"> and</tspan><tspan dx="2.97142"> let</tspan><tspan dx="2.97142"> it</tspan><tspan dx="2.97142"> settle</tspan><tspan dx="2.97142"> several</tspan><tspan dx="2.97142"> times.</tspan><tspan dx="2.97142"> Does</tspan><tspan dx="2.97142"> the</tspan><tspan dx="2.97142"> same</tspan><tspan dx="2.97142"> needle</tspan><tspan dx="2.97142"> end</tspan></tspan><tspan x="113" dy="31" data-justified="826">return<tspan dx="4.78778"> towards</tspan><tspan dx="4.78778"> magnetic</tspan><tspan dx="4.78778"> north,</tspan><tspan dx="4.78778"> checked</tspan><tspan dx="4.78778"> with</tspan><tspan dx="4.78778"> a</tspan><tspan dx="4.78778"> compass</tspan><tspan dx="4.78778"> well</tspan><tspan dx="4.78778"> away</tspan><tspan dx="4.78778"> from</tspan><tspan dx="4.78778"> the</tspan></tspan><tspan x="113" dy="31">bowl? What evidence is stronger than pin attraction alone?</tspan></text></g></g>
<g data-content-kind="heading"><text class="se-heading" x="89" y="317"><tspan x="89">What Makes the Needle Work?</tspan></text></g>
<g data-content-kind="body"><g class="se-learning-cue se-feature--explain" data-feature="explain" aria-label="How It Works"><svg class="se-feature-icon se-feature--explain" x="92" y="352" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h5m10 0h5M7 7l3 3m4 4 3 3M7 17l3-3m4-4 3-3M15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="148" y="381">How It Works</text></g><text class="se-copy" x="89" y="438"><tspan x="89" data-justified="874">The<tspan dx="1.95085"> stroking</tspan><tspan dx="1.95085"> magnet</tspan><tspan dx="1.95085"> does</tspan><tspan dx="1.95085"> not</tspan><tspan dx="1.95085"> transfer</tspan><tspan dx="1.95085"> a</tspan><tspan dx="1.95085"> magnetic</tspan><tspan dx="1.95085"> substance</tspan><tspan dx="1.95085"> to</tspan><tspan dx="1.95085"> the</tspan><tspan dx="1.95085"> needle.</tspan><tspan dx="1.95085"> Its</tspan><tspan dx="1.95085"> field</tspan></tspan><tspan x="89" dy="31" data-justified="874">helps<tspan dx="3.36033"> align</tspan><tspan dx="3.36033"> small</tspan><tspan dx="3.36033"> magnetic</tspan><tspan dx="3.36033"> regions</tspan><tspan dx="3.36033"> inside</tspan><tspan dx="3.36033"> the</tspan><tspan dx="3.36033"> steel.</tspan><tspan dx="3.36033"> Some</tspan><tspan dx="3.36033"> alignment</tspan><tspan dx="3.36033"> remains</tspan><tspan dx="3.36033"> after</tspan></tspan><tspan x="89" dy="31">the magnet is removed. This is <tspan class="se-bold">magnetisation</tspan>.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="545"><tspan x="89" data-justified="874">Using<tspan dx="3.61712"> one</tspan><tspan dx="3.61712"> pole</tspan><tspan dx="3.61712"> and</tspan><tspan dx="3.61712"> repeating</tspan><tspan dx="3.61712"> the</tspan><tspan dx="3.61712"> same</tspan><tspan dx="3.61712"> stroke</tspan><tspan dx="3.61712"> encourages</tspan><tspan dx="3.61712"> a</tspan><tspan dx="3.61712"> consistent</tspan><tspan dx="3.61712"> alignment.</tspan></tspan><tspan x="89" dy="31" data-justified="874">Thirty<tspan dx="0.44793"> to</tspan><tspan dx="0.44793"> forty</tspan><tspan dx="0.44793"> strokes</tspan><tspan dx="0.44793"> is</tspan><tspan dx="0.44793"> a</tspan><tspan dx="0.44793"> starting</tspan><tspan dx="0.44793"> procedure,</tspan><tspan dx="0.44793"> not</tspan><tspan dx="0.44793"> a</tspan><tspan dx="0.44793"> guaranteed</tspan><tspan dx="0.44793"> threshold:</tspan><tspan dx="0.44793"> the</tspan><tspan dx="0.44793"> needle</tspan></tspan><tspan x="89" dy="31">material and magnet strength affect the result.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="652"><tspan x="89" data-justified="874">A<tspan dx="-0.01676"> fish-shaped</tspan><tspan dx="-0.01676"> floating</tspan><tspan dx="-0.01676"> model</tspan><tspan dx="-0.01676"> can</tspan><tspan dx="-0.01676"> use</tspan><tspan dx="-0.01676"> the</tspan><tspan dx="-0.01676"> same</tspan><tspan dx="-0.01676"> principle.</tspan><tspan dx="-0.01676"> The</tspan><tspan dx="-0.01676"> drawing</tspan><tspan dx="-0.01676"> is</tspan><tspan dx="-0.01676"> a</tspan><tspan dx="-0.01676"> model,</tspan><tspan dx="-0.01676"> not</tspan></tspan><tspan x="89" dy="31">evidence of how a historical instrument was built.</tspan></text></g>
<g data-content-kind="illustrated-reading"><text class="se-copy" x="89" y="728"><tspan x="89" data-justified="874">A<tspan dx="5.81794"> liquid</tspan><tspan dx="5.81794"> can</tspan><tspan dx="5.81794"> slow</tspan><tspan dx="5.81794"> down</tspan><tspan dx="5.81794"> a</tspan><tspan dx="5.81794"> turning</tspan><tspan dx="5.81794"> magnet.</tspan><tspan dx="5.81794"> The</tspan><tspan dx="5.81794"> essential</tspan><tspan dx="5.81794"> idea</tspan><tspan dx="5.81794"> is</tspan><tspan dx="5.81794"> to</tspan><tspan dx="5.81794"> support</tspan><tspan dx="5.81794"> the</tspan></tspan><tspan x="89" dy="31" data-justified="874">magnet<tspan dx="4.00492"> so</tspan><tspan dx="4.00492"> it</tspan><tspan dx="4.00492"> can</tspan><tspan dx="4.00492"> turn</tspan><tspan dx="4.00492"> freely.</tspan><tspan dx="4.00492"> A</tspan><tspan dx="4.00492"> solid</tspan><tspan dx="4.00492"> piece</tspan><tspan dx="4.00492"> of</tspan><tspan dx="4.00492"> iron</tspan><tspan dx="4.00492"> will</tspan><tspan dx="4.00492"> sink</tspan><tspan dx="4.00492"> unless</tspan><tspan dx="4.00492"> its</tspan><tspan dx="4.00492"> shape</tspan><tspan dx="4.00492"> or</tspan><tspan dx="4.00492"> a</tspan></tspan><tspan x="89" dy="31">floating support keeps it at the surface.</tspan></text><svg class="science-illustration ip-art" x="89" y="812" width="874" height="275" viewBox="67 101 1402 844" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-6/science/ch04/png/fish.png" x="0" y="0" width="1536" height="1024"/></svg><text class="se-caption" x="526" y="1116" text-anchor="middle">A floating model demonstrates the principle.</text></g>
<g data-content-kind="prompt"><g class="se-feature--observe"><rect class="se-prompt" x="89" y="1135" width="874" height="142"/><line class="se-think-rule" x1="89" x2="963" y1="1135" y2="1135"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What Did You Notice?"><svg class="se-feature-icon se-feature--observe" x="113" y="1146" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="1175">What Did You Notice?</text></g><text class="se-copy" x="113" y="1219"><tspan x="113" data-justified="826">Compare<tspan dx="0.34456"> your</tspan><tspan dx="0.34456"> bowl</tspan><tspan dx="0.34456"> compass</tspan><tspan dx="0.34456"> with</tspan><tspan dx="0.34456"> a</tspan><tspan dx="0.34456"> bought</tspan><tspan dx="0.34456"> compass.</tspan><tspan dx="0.34456"> Which</tspan><tspan dx="0.34456"> part</tspan><tspan dx="0.34456"> is</tspan><tspan dx="0.34456"> magnetised?</tspan></tspan><tspan x="113" dy="31">Which part supports it? How could you test whether either needle is sticking?</tspan></text></g></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">11</text></g><!-- /botanical-footer --></svg></div></div></section>
