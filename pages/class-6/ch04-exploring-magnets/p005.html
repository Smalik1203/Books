<section class="page page--food page--science-editorial page--illustrated" data-science-chapter="4" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 5"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><g data-content-kind="body"><text class="se-copy" x="89" y="119"><tspan x="89" data-justified="874">Compare<tspan dx="3.97438"> two</tspan><tspan dx="3.97438"> objects</tspan><tspan dx="3.97438"> using</tspan><tspan dx="3.97438"> the</tspan><tspan dx="3.97438"> same</tspan><tspan dx="3.97438"> magnet</tspan><tspan dx="3.97438"> at</tspan><tspan dx="3.97438"> the</tspan><tspan dx="3.97438"> same</tspan><tspan dx="3.97438"> distance.</tspan><tspan dx="3.97438"> If</tspan><tspan dx="3.97438"> you</tspan><tspan dx="3.97438"> change</tspan></tspan><tspan x="89" dy="31" data-justified="874">both<tspan dx="4.21128"> the</tspan><tspan dx="4.21128"> object</tspan><tspan dx="4.21128"> and</tspan><tspan dx="4.21128"> the</tspan><tspan dx="4.21128"> magnet,</tspan><tspan dx="4.21128"> you</tspan><tspan dx="4.21128"> cannot</tspan><tspan dx="4.21128"> tell</tspan><tspan dx="4.21128"> which</tspan><tspan dx="4.21128"> change</tspan><tspan dx="4.21128"> caused</tspan><tspan dx="4.21128"> a</tspan><tspan dx="4.21128"> different</tspan></tspan><tspan x="89" dy="31">result.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="226"><tspan x="89" data-justified="874">A<tspan dx="0.07782"> non-magnetic</tspan><tspan dx="0.07782"> covering</tspan><tspan dx="0.07782"> can</tspan><tspan dx="0.07782"> hide</tspan><tspan dx="0.07782"> a</tspan><tspan dx="0.07782"> magnetic</tspan><tspan dx="0.07782"> material.</tspan><tspan dx="0.07782"> For</tspan><tspan dx="0.07782"> example,</tspan><tspan dx="0.07782"> a</tspan><tspan dx="0.07782"> plastic-coated</tspan></tspan><tspan x="89" dy="31" data-justified="874">steel<tspan dx="2.68161"> clip</tspan><tspan dx="2.68161"> may</tspan><tspan dx="2.68161"> still</tspan><tspan dx="2.68161"> be</tspan><tspan dx="2.68161"> attracted.</tspan><tspan dx="2.68161"> This</tspan><tspan dx="2.68161"> does</tspan><tspan dx="2.68161"> not</tspan><tspan dx="2.68161"> show</tspan><tspan dx="2.68161"> that</tspan><tspan dx="2.68161"> the</tspan><tspan dx="2.68161"> plastic</tspan><tspan dx="2.68161"> is</tspan><tspan dx="2.68161"> magnetic;</tspan><tspan dx="2.68161"> it</tspan></tspan><tspan x="89" dy="31">shows that the magnet can act on the steel inside.</tspan></text></g>
<g data-content-kind="heading"><text class="se-heading" x="89" y="338"><tspan x="89">4.2 The Poles of a Magnet</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="395"><tspan x="89" data-justified="874">Does<tspan dx="4.45087"> a</tspan><tspan dx="4.45087"> magnet</tspan><tspan dx="4.45087"> pull</tspan><tspan dx="4.45087"> equally</tspan><tspan dx="4.45087"> hard</tspan><tspan dx="4.45087"> everywhere</tspan><tspan dx="4.45087"> along</tspan><tspan dx="4.45087"> its</tspan><tspan dx="4.45087"> length?</tspan><tspan dx="4.45087"> Or</tspan><tspan dx="4.45087"> are</tspan><tspan dx="4.45087"> some</tspan><tspan dx="4.45087"> parts</tspan></tspan><tspan x="89" dy="31">stronger than others?</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="471"><tspan x="89" data-justified="874">Iron<tspan dx="1.45829"> filings</tspan><tspan dx="1.45829"> are</tspan><tspan dx="1.45829"> tiny</tspan><tspan dx="1.45829"> bits</tspan><tspan dx="1.45829"> of</tspan><tspan dx="1.45829"> iron.</tspan><tspan dx="1.45829"> Their</tspan><tspan dx="1.45829"> pattern</tspan><tspan dx="1.45829"> gives</tspan><tspan dx="1.45829"> us</tspan><tspan dx="1.45829"> evidence</tspan><tspan dx="1.45829"> about</tspan><tspan dx="1.45829"> the</tspan><tspan dx="1.45829"> magnetic</tspan></tspan><tspan x="89" dy="31" data-justified="874">field.<tspan dx="6.67909"> Keep</tspan><tspan dx="6.67909"> the</tspan><tspan dx="6.67909"> paper</tspan><tspan dx="6.67909"> level</tspan><tspan dx="6.67909"> and</tspan><tspan dx="6.67909"> sprinkle</tspan><tspan dx="6.67909"> a</tspan><tspan dx="6.67909"> thin,</tspan><tspan dx="6.67909"> even</tspan><tspan dx="6.67909"> layer</tspan><tspan dx="6.67909"> so</tspan><tspan dx="6.67909"> that</tspan><tspan dx="6.67909"> the</tspan><tspan dx="6.67909"> starting</tspan></tspan><tspan x="89" dy="31">arrangement does not decide the result.</tspan></text></g>
<g data-content-kind="activity"><rect class="se-activity-panel" x="89" y="555" width="874" height="420"/><path class="se-activity-tab" d="M109 555H943Q963 555 963 575V598H89V575Q89 555 109 555Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="561" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="584" text-anchor="start">Investigate</text><text class="se-copy" x="113" y="650"><tspan x="113">You will need: iron filings, a sheet of paper, a bar magnet.</tspan></text><text class="se-activity-step" x="114" y="693" text-anchor="start">1.</text><text class="se-copy" x="143" y="693"><tspan x="143">Place the bar magnet flat on the desk.</tspan></text><text class="se-activity-step" x="114" y="736" text-anchor="start">2.</text><text class="se-copy" x="143" y="736"><tspan x="143">Cover it completely with the sheet of paper.</tspan></text><text class="se-activity-step" x="114" y="779" text-anchor="start">3.</text><text class="se-copy" x="143" y="779"><tspan x="143">Sprinkle iron filings lightly over the paper, above the magnet.</tspan></text><text class="se-activity-step" x="114" y="822" text-anchor="start">4.</text><text class="se-copy" x="143" y="822"><tspan x="143">Tap the paper gently a few times.</tspan></text><text class="se-activity-step" x="114" y="865" text-anchor="start">5.</text><text class="se-copy" x="143" y="865"><tspan x="143">Watch where the filings gather.</tspan></text><text class="se-copy" x="113" y="908"><tspan x="113" data-justified="826">Safety:<tspan dx="4.69050"> Do</tspan><tspan dx="4.69050"> not</tspan><tspan dx="4.69050"> touch</tspan><tspan dx="4.69050"> your</tspan><tspan dx="4.69050"> eyes</tspan><tspan dx="4.69050"> or</tspan><tspan dx="4.69050"> breathe</tspan><tspan dx="4.69050"> in</tspan><tspan dx="4.69050"> iron</tspan><tspan dx="4.69050"> filings.</tspan><tspan dx="4.69050"> Keep</tspan><tspan dx="4.69050"> them</tspan><tspan dx="4.69050"> on</tspan><tspan dx="4.69050"> the</tspan></tspan><tspan x="113" dy="31">paper, collect them carefully and wash your hands afterwards.</tspan></text></g>
<g data-content-kind="prompt"><g class="se-feature--observe"><rect class="se-prompt" x="89" y="997" width="874" height="142"/><line class="se-think-rule" x1="89" x2="963" y1="997" y2="997"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What Did You Notice?"><svg class="se-feature-icon se-feature--observe" x="113" y="1008" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="1037">What Did You Notice?</text></g><text class="se-copy" x="113" y="1081"><tspan x="113" data-justified="826">Are<tspan dx="5.11940"> the</tspan><tspan dx="5.11940"> filings</tspan><tspan dx="5.11940"> spread</tspan><tspan dx="5.11940"> evenly?</tspan><tspan dx="5.11940"> Or</tspan><tspan dx="5.11940"> do</tspan><tspan dx="5.11940"> they</tspan><tspan dx="5.11940"> collect</tspan><tspan dx="5.11940"> in</tspan><tspan dx="5.11940"> some</tspan><tspan dx="5.11940"> places</tspan><tspan dx="5.11940"> more</tspan><tspan dx="5.11940"> than</tspan></tspan><tspan x="113" dy="31">others? What does this tell you about the magnet underneath?</tspan></text></g></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1182"><tspan x="89" data-justified="874">Compare<tspan dx="0.61167"> the</tspan><tspan dx="0.61167"> pattern</tspan><tspan dx="0.61167"> before</tspan><tspan dx="0.61167"> and</tspan><tspan dx="0.61167"> after</tspan><tspan dx="0.61167"> gently</tspan><tspan dx="0.61167"> tapping</tspan><tspan dx="0.61167"> the</tspan><tspan dx="0.61167"> paper.</tspan><tspan dx="0.61167"> Tapping</tspan><tspan dx="0.61167"> helps</tspan><tspan dx="0.61167"> grains</tspan></tspan><tspan x="89" dy="31" data-justified="874">move;<tspan dx="0.73426"> it</tspan><tspan dx="0.73426"> does</tspan><tspan dx="0.73426"> not</tspan><tspan dx="0.73426"> create</tspan><tspan dx="0.73426"> poles.</tspan><tspan dx="0.73426"> Keep</tspan><tspan dx="0.73426"> the</tspan><tspan dx="0.73426"> amount</tspan><tspan dx="0.73426"> of</tspan><tspan dx="0.73426"> filings</tspan><tspan dx="0.73426"> and</tspan><tspan dx="0.73426"> the</tspan><tspan dx="0.73426"> paper</tspan><tspan dx="0.73426"> position</tspan><tspan dx="0.73426"> the</tspan></tspan><tspan x="89" dy="31">same.</tspan></text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">5</text></g><!-- /botanical-footer --></svg></div></div></section>
