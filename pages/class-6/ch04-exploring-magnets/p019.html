<section class="page page--food page--science-editorial page--illustrated" data-science-chapter="4" data-folio="19"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 19"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><g data-content-kind="body"><text class="se-copy" x="89" y="119"><tspan x="89" data-justified="874">•<tspan dx="2.85205"> Away</tspan><tspan dx="2.85205"> from</tspan><tspan dx="2.85205"> nearby</tspan><tspan dx="2.85205"> magnetic</tspan><tspan dx="2.85205"> disturbances,</tspan><tspan dx="2.85205"> a</tspan><tspan dx="2.85205"> freely</tspan><tspan dx="2.85205"> turning</tspan><tspan dx="2.85205"> magnet</tspan><tspan dx="2.85205"> tends</tspan><tspan dx="2.85205"> to</tspan><tspan dx="2.85205"> align</tspan></tspan><tspan x="89" dy="31" data-justified="874">with<tspan dx="8.69643"> Earth's</tspan><tspan dx="8.69643"> local</tspan><tspan dx="8.69643"> magnetic</tspan><tspan dx="8.69643"> field.</tspan><tspan dx="8.69643"> This</tspan><tspan dx="8.69643"> is</tspan><tspan dx="8.69643"> close</tspan><tspan dx="8.69643"> to,</tspan><tspan dx="8.69643"> but</tspan><tspan dx="8.69643"> not</tspan><tspan dx="8.69643"> necessarily</tspan><tspan dx="8.69643"> along,</tspan></tspan><tspan x="89" dy="31">geographic north-south.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="228"><tspan x="89" data-justified="874">•<tspan dx="3.67176"> A</tspan><tspan dx="3.67176"> magnetic</tspan><tspan dx="3.67176"> compass</tspan><tspan dx="3.67176"> uses</tspan><tspan dx="3.67176"> this.</tspan><tspan dx="3.67176"> Its</tspan><tspan dx="3.67176"> needle</tspan><tspan dx="3.67176"> is</tspan><tspan dx="3.67176"> a</tspan><tspan dx="3.67176"> magnet</tspan><tspan dx="3.67176"> that</tspan><tspan dx="3.67176"> can</tspan><tspan dx="3.67176"> turn</tspan><tspan dx="3.67176"> freely,</tspan><tspan dx="3.67176"> so</tspan><tspan dx="3.67176"> it</tspan></tspan><tspan x="89" dy="31">settles along the north-south line and shows us direction.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="306"><tspan x="89">• Unlike poles attract each other. Like poles repel each other.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="353"><tspan x="89" data-justified="874">•<tspan dx="0.61060"> A</tspan><tspan dx="0.61060"> magnet</tspan><tspan dx="0.61060"> attracts</tspan><tspan dx="0.61060"> plain</tspan><tspan dx="0.61060"> iron</tspan><tspan dx="0.61060"> as</tspan><tspan dx="0.61060"> well,</tspan><tspan dx="0.61060"> so</tspan><tspan dx="0.61060"> attraction</tspan><tspan dx="0.61060"> does</tspan><tspan dx="0.61060"> not</tspan><tspan dx="0.61060"> prove</tspan><tspan dx="0.61060"> that</tspan><tspan dx="0.61060"> something</tspan><tspan dx="0.61060"> is</tspan></tspan><tspan x="89" dy="31" data-justified="874">a<tspan dx="9.91619"> magnet.</tspan><tspan dx="9.91619"> For</tspan><tspan dx="9.91619"> our</tspan><tspan dx="9.91619"> magnet-or-iron</tspan><tspan dx="9.91619"> candidates,</tspan><tspan dx="9.91619"> repulsion</tspan><tspan dx="9.91619"> identifies</tspan><tspan dx="9.91619"> an</tspan><tspan dx="9.91619"> already</tspan></tspan><tspan x="89" dy="31">magnetised bar.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="462"><tspan x="89" data-justified="874">•<tspan dx="2.02956"> Thin</tspan><tspan dx="2.02956"> wood,</tspan><tspan dx="2.02956"> cardboard,</tspan><tspan dx="2.02956"> plastic</tspan><tspan dx="2.02956"> and</tspan><tspan dx="2.02956"> glass</tspan><tspan dx="2.02956"> did</tspan><tspan dx="2.02956"> not</tspan><tspan dx="2.02956"> noticeably</tspan><tspan dx="2.02956"> screen</tspan><tspan dx="2.02956"> the</tspan><tspan dx="2.02956"> field</tspan><tspan dx="2.02956"> in</tspan><tspan dx="2.02956"> our</tspan></tspan><tspan x="89" dy="31">fixed-gap test. This does not establish a rule for all barriers.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="540"><tspan x="89" data-justified="874">Explain<tspan dx="1.39103"> these</tspan><tspan dx="1.39103"> differences</tspan><tspan dx="1.39103"> to</tspan><tspan dx="1.39103"> a</tspan><tspan dx="1.39103"> partner:</tspan><tspan dx="1.39103"> a</tspan><tspan dx="1.39103"> magnet</tspan><tspan dx="1.39103"> and</tspan><tspan dx="1.39103"> a</tspan><tspan dx="1.39103"> magnetic</tspan><tspan dx="1.39103"> material;</tspan><tspan dx="1.39103"> attraction</tspan></tspan><tspan x="89" dy="31" data-justified="874">and<tspan dx="0.07360"> repulsion;</tspan><tspan dx="0.07360"> a</tspan><tspan dx="0.07360"> prediction</tspan><tspan dx="0.07360"> and</tspan><tspan dx="0.07360"> an</tspan><tspan dx="0.07360"> observation.</tspan><tspan dx="0.07360"> Give</tspan><tspan dx="0.07360"> one</tspan><tspan dx="0.07360"> example</tspan><tspan dx="0.07360"> from</tspan><tspan dx="0.07360"> an</tspan><tspan dx="0.07360"> activity</tspan><tspan dx="0.07360"> for</tspan></tspan><tspan x="89" dy="31">each pair.</tspan></text></g>
<g data-content-kind="heading"><text class="se-heading" x="89" y="652"><tspan x="89">Let Us Enhance Our Learning</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="709"><tspan x="89" data-justified="874">Write<tspan dx="3.17588"> answers</tspan><tspan dx="3.17588"> and</tspan><tspan dx="3.17588"> copy</tspan><tspan dx="3.17588"> any</tspan><tspan dx="3.17588"> tables</tspan><tspan dx="3.17588"> into</tspan><tspan dx="3.17588"> your</tspan><tspan dx="3.17588"> notebook.</tspan><tspan dx="3.17588"> Explain</tspan><tspan dx="3.17588"> which</tspan><tspan dx="3.17588"> observation</tspan></tspan><tspan x="89" dy="31">supports each conclusion.</tspan></text></g>
<g data-content-kind="question"><text class="se-copy" x="89" y="785"><tspan x="89">1. Fill in the blanks.</tspan></text><text class="se-copy" x="89" y="830"><tspan x="89" data-justified="874">(i)<tspan dx="2.70581"> Unlike</tspan><tspan dx="2.70581"> poles</tspan><tspan dx="2.70581"> of</tspan><tspan dx="2.70581"> two</tspan><tspan dx="2.70581"> magnets</tspan><tspan dx="2.70581"> __________</tspan><tspan dx="2.70581"> each</tspan><tspan dx="2.70581"> other,</tspan><tspan dx="2.70581"> while</tspan><tspan dx="2.70581"> like</tspan><tspan dx="2.70581"> poles</tspan><tspan dx="2.70581"> __________</tspan></tspan><tspan x="89" dy="31">each other.</tspan></text><text class="se-copy" x="89" y="910"><tspan x="89">(ii) Materials that are pulled towards a magnet are called __________ materials.</tspan></text><text class="se-copy" x="89" y="959"><tspan x="89">(iii) Away from disturbances, a level compass aligns with the local __________ field.</tspan></text><text class="se-copy" x="89" y="1008"><tspan x="89">(iv) Each piece of a broken bar magnet has __________ poles.</tspan></text></g>
<g data-content-kind="question"><text class="se-copy" x="89" y="1057"><tspan x="89">2. Write True or False.</tspan></text><text class="se-copy" x="89" y="1102"><tspan x="89">(i) A magnet can be broken to get a piece with only one pole. [ ]</tspan></text><text class="se-copy" x="89" y="1151"><tspan x="89">(ii) Two North poles brought near each other will push apart. [ ]</tspan></text><text class="se-copy" x="89" y="1200"><tspan x="89">(iii) Iron filings gather mostly in the middle of a bar magnet. [ ]</tspan></text><text class="se-copy" x="89" y="1249"><tspan x="89">(iv) A nearby magnet cannot change a freely hanging magnet's direction. [ ]</tspan></text><text class="se-copy" x="89" y="1298"><tspan x="89">(v) Every metal is a magnetic material. [ ]</tspan></text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">19</text></g><!-- /botanical-footer --></svg></div></div></section>
