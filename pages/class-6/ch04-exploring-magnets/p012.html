<section class="page page--food page--science-editorial page--illustrated" data-science-chapter="4" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 12"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><g data-content-kind="body"><text class="se-copy" x="89" y="119"><tspan x="89" data-justified="874">Notice<tspan dx="0.44449"> that</tspan><tspan dx="0.44449"> all</tspan><tspan dx="0.44449"> three</tspan><tspan dx="0.44449"> solve</tspan><tspan dx="0.44449"> the</tspan><tspan dx="0.44449"> same</tspan><tspan dx="0.44449"> problem</tspan><tspan dx="0.44449"> in</tspan><tspan dx="0.44449"> the</tspan><tspan dx="0.44449"> same</tspan><tspan dx="0.44449"> way.</tspan><tspan dx="0.44449"> A</tspan><tspan dx="0.44449"> magnet</tspan><tspan dx="0.44449"> is</tspan><tspan dx="0.44449"> allowed</tspan><tspan dx="0.44449"> to</tspan></tspan><tspan x="89" dy="31" data-justified="874">turn<tspan dx="4.57609"> freely,</tspan><tspan dx="4.57609"> and</tspan><tspan dx="4.57609"> then</tspan><tspan dx="4.57609"> it</tspan><tspan dx="4.57609"> is</tspan><tspan dx="4.57609"> left</tspan><tspan dx="4.57609"> alone</tspan><tspan dx="4.57609"> to</tspan><tspan dx="4.57609"> find</tspan><tspan dx="4.57609"> its</tspan><tspan dx="4.57609"> own</tspan><tspan dx="4.57609"> direction.</tspan><tspan dx="4.57609"> The</tspan><tspan dx="4.57609"> cork</tspan><tspan dx="4.57609"> provides</tspan></tspan><tspan x="89" dy="31" data-justified="874">floating<tspan dx="7.57794"> support;</tspan><tspan dx="7.57794"> a</tspan><tspan dx="7.57794"> pin</tspan><tspan dx="7.57794"> provides</tspan><tspan dx="7.57794"> a</tspan><tspan dx="7.57794"> pivot.</tspan><tspan dx="7.57794"> Liquid</tspan><tspan dx="7.57794"> slows</tspan><tspan dx="7.57794"> turning.</tspan><tspan dx="7.57794"> The</tspan><tspan dx="7.57794"> dial</tspan><tspan dx="7.57794"> labels</tspan></tspan><tspan x="89" dy="31">directions. These parts do different jobs.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="257"><tspan x="89" data-justified="874">Compare<tspan dx="3.21674"> the</tspan><tspan dx="3.21674"> two</tspan><tspan dx="3.21674"> designs</tspan><tspan dx="3.21674"> by</tspan><tspan dx="3.21674"> asking</tspan><tspan dx="3.21674"> the</tspan><tspan dx="3.21674"> same</tspan><tspan dx="3.21674"> questions:</tspan><tspan dx="3.21674"> what</tspan><tspan dx="3.21674"> is</tspan><tspan dx="3.21674"> magnetised,</tspan><tspan dx="3.21674"> what</tspan></tspan><tspan x="89" dy="31" data-justified="874">supports<tspan dx="0.81198"> it,</tspan><tspan dx="0.81198"> and</tspan><tspan dx="0.81198"> what</tspan><tspan dx="0.81198"> prevents</tspan><tspan dx="0.81198"> it</tspan><tspan dx="0.81198"> from</tspan><tspan dx="0.81198"> turning</tspan><tspan dx="0.81198"> freely?</tspan><tspan dx="0.81198"> These</tspan><tspan dx="0.81198"> questions</tspan><tspan dx="0.81198"> explain</tspan><tspan dx="0.81198"> why</tspan><tspan dx="0.81198"> a</tspan></tspan><tspan x="89" dy="31">floating needle fails if its cork touches the side of the bowl.</tspan></text></g>
<g data-content-kind="heading"><text class="se-heading" x="89" y="369"><tspan x="89">4.4 Pushing and Pulling</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="426"><tspan x="89" data-justified="874">So<tspan dx="0.68459"> far,</tspan><tspan dx="0.68459"> magnets</tspan><tspan dx="0.68459"> have</tspan><tspan dx="0.68459"> pulled</tspan><tspan dx="0.68459"> things</tspan><tspan dx="0.68459"> towards</tspan><tspan dx="0.68459"> them.</tspan><tspan dx="0.68459"> Now</tspan><tspan dx="0.68459"> let</tspan><tspan dx="0.68459"> us</tspan><tspan dx="0.68459"> see</tspan><tspan dx="0.68459"> what</tspan><tspan dx="0.68459"> a</tspan><tspan dx="0.68459"> magnet</tspan><tspan dx="0.68459"> does</tspan></tspan><tspan x="89" dy="31">to another magnet.</tspan></text></g>
<g data-content-kind="activity"><rect class="se-activity-panel" x="89" y="479" width="874" height="513"/><path class="se-activity-tab" d="M109 479H943Q963 479 963 499V522H89V499Q89 479 109 479Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="485" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="508" text-anchor="start">The setup</text><text class="se-copy" x="113" y="574"><tspan x="113" data-justified="826">You<tspan dx="5.84096"> will</tspan><tspan dx="5.84096"> need:</tspan><tspan dx="5.84096"> two</tspan><tspan dx="5.84096"> bar</tspan><tspan dx="5.84096"> magnets</tspan><tspan dx="5.84096"> with</tspan><tspan dx="5.84096"> their</tspan><tspan dx="5.84096"> poles</tspan><tspan dx="5.84096"> marked,</tspan><tspan dx="5.84096"> five</tspan><tspan dx="5.84096"> or</tspan><tspan dx="5.84096"> six</tspan><tspan dx="5.84096"> round</tspan></tspan><tspan x="113" dy="31">pencils, a flat table.</tspan></text><text class="se-activity-step" x="114" y="648" text-anchor="start">1.</text><text class="se-copy" x="143" y="648"><tspan x="143">Call the magnets A and B.</tspan></text><text class="se-activity-step" x="114" y="691" text-anchor="start">2.</text><text class="se-copy" x="143" y="691"><tspan x="143" data-justified="796">Lay<tspan dx="1.90876"> the</tspan><tspan dx="1.90876"> round</tspan><tspan dx="1.90876"> pencils</tspan><tspan dx="1.90876"> side</tspan><tspan dx="1.90876"> by</tspan><tspan dx="1.90876"> side</tspan><tspan dx="1.90876"> on</tspan><tspan dx="1.90876"> the</tspan><tspan dx="1.90876"> table.</tspan><tspan dx="1.90876"> Rest</tspan><tspan dx="1.90876"> magnet</tspan><tspan dx="1.90876"> A</tspan><tspan dx="1.90876"> across</tspan><tspan dx="1.90876"> them,</tspan></tspan><tspan x="143" dy="31">so it can roll easily.</tspan></text><text class="se-activity-step" x="114" y="765" text-anchor="start">3.</text><text class="se-copy" x="143" y="765"><tspan x="143" data-justified="796">Hold<tspan dx="4.38377"> magnet</tspan><tspan dx="4.38377"> B</tspan><tspan dx="4.38377"> in</tspan><tspan dx="4.38377"> your</tspan><tspan dx="4.38377"> hand.</tspan><tspan dx="4.38377"> Slowly</tspan><tspan dx="4.38377"> bring</tspan><tspan dx="4.38377"> one</tspan><tspan dx="4.38377"> end</tspan><tspan dx="4.38377"> of</tspan><tspan dx="4.38377"> it</tspan><tspan dx="4.38377"> near</tspan><tspan dx="4.38377"> one</tspan><tspan dx="4.38377"> end</tspan><tspan dx="4.38377"> of</tspan></tspan><tspan x="143" dy="31">magnet A. Do not let them touch.</tspan></text><text class="se-activity-step" x="114" y="839" text-anchor="start">4.</text><text class="se-copy" x="143" y="839"><tspan x="143">Watch magnet A carefully. Which way does it move?</tspan></text><text class="se-activity-step" x="114" y="882" text-anchor="start">5.</text><text class="se-copy" x="143" y="882"><tspan x="143" data-justified="796">Now<tspan dx="0.70993"> turn</tspan><tspan dx="0.70993"> magnet</tspan><tspan dx="0.70993"> B</tspan><tspan dx="0.70993"> around.</tspan><tspan dx="0.70993"> Bring</tspan><tspan dx="0.70993"> its</tspan><tspan dx="0.70993"> other</tspan><tspan dx="0.70993"> end</tspan><tspan dx="0.70993"> near</tspan><tspan dx="0.70993"> the</tspan><tspan dx="0.70993"> same</tspan><tspan dx="0.70993"> end</tspan><tspan dx="0.70993"> of</tspan><tspan dx="0.70993"> magnet</tspan></tspan><tspan x="143" dy="31">A.</tspan></text><text class="se-activity-step" x="114" y="956" text-anchor="start">6.</text><text class="se-copy" x="143" y="956"><tspan x="143">Watch again.</tspan></text></g>
<g data-content-kind="prompt"><g class="se-feature--observe"><rect class="se-prompt" x="89" y="1014" width="874" height="173"/><line class="se-think-rule" x1="89" x2="963" y1="1014" y2="1014"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What you saw"><svg class="se-feature-icon se-feature--observe" x="113" y="1025" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="1054">What you saw</text></g><text class="se-copy" x="113" y="1098"><tspan x="113" data-justified="826">Did<tspan dx="1.44863"> magnet</tspan><tspan dx="1.44863"> A</tspan><tspan dx="1.44863"> move</tspan><tspan dx="1.44863"> towards</tspan><tspan dx="1.44863"> magnet</tspan><tspan dx="1.44863"> B</tspan><tspan dx="1.44863"> both</tspan><tspan dx="1.44863"> times?</tspan><tspan dx="1.44863"> Or</tspan><tspan dx="1.44863"> did</tspan><tspan dx="1.44863"> it</tspan><tspan dx="1.44863"> move</tspan><tspan dx="1.44863"> away</tspan><tspan dx="1.44863"> one</tspan><tspan dx="1.44863"> of</tspan></tspan><tspan x="113" dy="31" data-justified="826">those<tspan dx="3.34209"> times?</tspan><tspan dx="3.34209"> Look</tspan><tspan dx="3.34209"> at</tspan><tspan dx="3.34209"> the</tspan><tspan dx="3.34209"> pole</tspan><tspan dx="3.34209"> markings.</tspan><tspan dx="3.34209"> What</tspan><tspan dx="3.34209"> was</tspan><tspan dx="3.34209"> different</tspan><tspan dx="3.34209"> between</tspan><tspan dx="3.34209"> the</tspan><tspan dx="3.34209"> two</tspan></tspan><tspan x="113" dy="31">tries?</tspan></text></g></g>
<g data-content-kind="body"><g class="se-learning-cue se-feature--explain" data-feature="explain" aria-label="The mechanism"><svg class="se-feature-icon se-feature--explain" x="92" y="1208" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h5m10 0h5M7 7l3 3m4 4 3 3M7 17l3-3m4-4 3-3M15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="148" y="1237">The mechanism</text></g><text class="se-copy" x="89" y="1294"><tspan x="89" data-justified="874">The<tspan dx="2.30100"> round</tspan><tspan dx="2.30100"> pencils</tspan><tspan dx="2.30100"> reduce</tspan><tspan dx="2.30100"> rubbing</tspan><tspan dx="2.30100"> between</tspan><tspan dx="2.30100"> magnet</tspan><tspan dx="2.30100"> A</tspan><tspan dx="2.30100"> and</tspan><tspan dx="2.30100"> the</tspan><tspan dx="2.30100"> table.</tspan><tspan dx="2.30100"> Without</tspan><tspan dx="2.30100"> them,</tspan></tspan><tspan x="89" dy="31" data-justified="874">the<tspan dx="0.02066"> magnetic</tspan><tspan dx="0.02066"> force</tspan><tspan dx="0.02066"> might</tspan><tspan dx="0.02066"> be</tspan><tspan dx="0.02066"> present</tspan><tspan dx="0.02066"> but</tspan><tspan dx="0.02066"> too</tspan><tspan dx="0.02066"> weak</tspan><tspan dx="0.02066"> to</tspan><tspan dx="0.02066"> overcome</tspan><tspan dx="0.02066"> the</tspan><tspan dx="0.02066"> friction.</tspan><tspan dx="0.02066"> A</tspan><tspan dx="0.02066"> magnet</tspan></tspan><tspan x="89" dy="31">that does not move immediately has not necessarily stopped exerting a force.</tspan></text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">12</text></g><!-- /botanical-footer --></svg></div></div></section>
