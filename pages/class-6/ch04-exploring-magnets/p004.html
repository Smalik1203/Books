<g data-content-kind="table"><rect class="se-table-band" x="89" y="168" width="874" height="40" rx="3"/><rect class="se-table-number" x="89" y="168" width="149" height="40" rx="3"/><text class="se-caption se-table-number-text" x="109" y="195">Table 4.1</text><text class="se-caption se-bold" x="260" y="195">Which materials does a magnet pull?</text><rect class="fb-table-head" x="89" y="220" width="874" height="52" rx="8"/><line class="fb-rule" x1="89" x2="963" y1="272" y2="272"/><text class="se-copy se-table-copy se-bold" x="101" y="250.4"><tspan x="101">Object</tspan></text><text class="se-copy se-table-copy se-bold" x="319.5" y="250.4"><tspan x="319.5">Material</tspan></text><text class="se-copy se-table-copy se-bold" x="538" y="250.4"><tspan x="538">Prediction</tspan></text><text class="se-copy se-table-copy se-bold" x="756.5" y="250.4"><tspan x="756.5">Observation</tspan></text><line class="fb-rule" x1="89" x2="963" y1="328" y2="328"/><text class="se-copy se-table-copy" x="101" y="302.4"><tspan x="101">Pencil</tspan></text><text class="se-copy se-table-copy" x="319.5" y="302.4"><tspan x="319.5">Wood</tspan></text><text class="se-copy se-table-copy" x="538" y="302.4"></text><text class="se-copy se-table-copy" x="756.5" y="302.4"></text><line class="fb-rule" x1="89" x2="963" y1="384" y2="384"/><text class="se-copy se-table-copy" x="101" y="358.4"><tspan x="101">Eraser</tspan></text><text class="se-copy se-table-copy" x="319.5" y="358.4"><tspan x="319.5">Rubber</tspan></text><text class="se-copy se-table-copy" x="538" y="358.4"></text><text class="se-copy se-table-copy" x="756.5" y="358.4"></text><line class="fb-rule" x1="89" x2="963" y1="440" y2="440"/><text class="se-copy se-table-copy" x="101" y="414.4"><tspan x="101">Paper clip</tspan></text><text class="se-copy se-table-copy" x="319.5" y="414.4"><tspan x="319.5">Steel</tspan></text><text class="se-copy se-table-copy" x="538" y="414.4"></text><text class="se-copy se-table-copy" x="756.5" y="414.4"></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="487"><tspan x="89">Now read down the last two columns.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="532"><tspan x="89" data-justified="874">Some<tspan dx="4.20094"> objects</tspan><tspan dx="4.20094"> were</tspan><tspan dx="4.20094"> pulled</tspan><tspan dx="4.20094"> towards</tspan><tspan dx="4.20094"> the</tspan><tspan dx="4.20094"> magnet</tspan><tspan dx="4.20094"> and</tspan><tspan dx="4.20094"> stuck</tspan><tspan dx="4.20094"> to</tspan><tspan dx="4.20094"> it.</tspan><tspan dx="4.20094"> Others</tspan><tspan dx="4.20094"> showed</tspan><tspan dx="4.20094"> no</tspan></tspan><tspan x="89" dy="31">visible attraction in this test.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="608"><tspan x="89" data-justified="874">In<tspan dx="2.99842"> these</tspan><tspan dx="2.99842"> school</tspan><tspan dx="2.99842"> tests,</tspan><tspan dx="2.99842"> <tspan class="se-bold">magnetic</tspan></tspan><tspan dx="2.99842"> <tspan class="se-bold">materials</tspan></tspan><tspan dx="2.99842"> are</tspan><tspan dx="2.99842"> materials,</tspan><tspan dx="2.99842"> such</tspan><tspan dx="2.99842"> as</tspan><tspan dx="2.99842"> iron,</tspan><tspan dx="2.99842"> that</tspan><tspan dx="2.99842"> respond</tspan></tspan><tspan x="89" dy="31" data-justified="874">strongly<tspan dx="0.46217"> enough</tspan><tspan dx="0.46217"> to</tspan><tspan dx="0.46217"> a</tspan><tspan dx="0.46217"> magnet</tspan><tspan dx="0.46217"> for</tspan><tspan dx="0.46217"> us</tspan><tspan dx="0.46217"> to</tspan><tspan dx="0.46217"> notice</tspan><tspan dx="0.46217"> the</tspan><tspan dx="0.46217"> attraction.</tspan><tspan dx="0.46217"> They</tspan><tspan dx="0.46217"> need</tspan><tspan dx="0.46217"> not</tspan><tspan dx="0.46217"> already</tspan><tspan dx="0.46217"> be</tspan></tspan><tspan x="89" dy="31">permanent magnets.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="715"><tspan x="89" data-justified="874">Iron<tspan dx="3.52927"> is</tspan><tspan dx="3.52927"> a</tspan><tspan dx="3.52927"> magnetic</tspan><tspan dx="3.52927"> material.</tspan><tspan dx="3.52927"> Steel</tspan><tspan dx="3.52927"> is</tspan><tspan dx="3.52927"> made</tspan><tspan dx="3.52927"> mostly</tspan><tspan dx="3.52927"> of</tspan><tspan dx="3.52927"> iron.</tspan><tspan dx="3.52927"> Many</tspan><tspan dx="3.52927"> kinds</tspan><tspan dx="3.52927"> of</tspan><tspan dx="3.52927"> steel</tspan><tspan dx="3.52927"> are</tspan></tspan><tspan x="89" dy="31" data-justified="874">magnetic,<tspan dx="1.46478"> though</tspan><tspan dx="1.46478"> some</tspan><tspan dx="1.46478"> stainless</tspan><tspan dx="1.46478"> steels</tspan><tspan dx="1.46478"> are</tspan><tspan dx="1.46478"> not.</tspan><tspan dx="1.46478"> That</tspan><tspan dx="1.46478"> is</tspan><tspan dx="1.46478"> why</tspan><tspan dx="1.46478"> a</tspan><tspan dx="1.46478"> steel</tspan><tspan dx="1.46478"> paper</tspan><tspan dx="1.46478"> clip</tspan><tspan dx="1.46478"> sticks.</tspan></tspan><tspan x="89" dy="31" data-justified="874">Two<tspan dx="4.19201"> other</tspan><tspan dx="4.19201"> metals,</tspan><tspan dx="4.19201"> <tspan class="se-bold">nickel</tspan></tspan><tspan dx="4.19201"> and</tspan><tspan dx="4.19201"> <tspan class="se-bold">cobalt</tspan>,</tspan><tspan dx="4.19201"> are</tspan><tspan dx="4.19201"> also</tspan><tspan dx="4.19201"> magnetic.</tspan><tspan dx="4.19201"> So</tspan><tspan dx="4.19201"> are</tspan><tspan dx="4.19201"> some</tspan><tspan dx="4.19201"> mixtures</tspan><tspan dx="4.19201"> of</tspan></tspan><tspan x="89" dy="31">these metals with others.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="853"><tspan x="89" data-justified="874">We<tspan dx="0.02819"> call</tspan><tspan dx="0.02819"> materials</tspan><tspan dx="0.02819"> with</tspan><tspan dx="0.02819"> no</tspan><tspan dx="0.02819"> noticeable</tspan><tspan dx="0.02819"> response</tspan><tspan dx="0.02819"> in</tspan><tspan dx="0.02819"> these</tspan><tspan dx="0.02819"> tests</tspan><tspan dx="0.02819"> <tspan class="se-bold">non-magnetic</tspan></tspan><tspan dx="0.02819"> <tspan class="se-bold">materials</tspan>.</tspan></tspan><tspan x="89" dy="31" data-justified="874">This<tspan dx="0.30991"> does</tspan><tspan dx="0.30991"> not</tspan><tspan dx="0.30991"> mean</tspan><tspan dx="0.30991"> that</tspan><tspan dx="0.30991"> every</tspan><tspan dx="0.30991"> magnetic</tspan><tspan dx="0.30991"> effect</tspan><tspan dx="0.30991"> on</tspan><tspan dx="0.30991"> them</tspan><tspan dx="0.30991"> is</tspan><tspan dx="0.30991"> exactly</tspan><tspan dx="0.30991"> zero.</tspan><tspan dx="0.30991"> Wood,</tspan><tspan dx="0.30991"> rubber,</tspan></tspan><tspan x="89" dy="31">plastic, glass, paper and cloth are all non-magnetic.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="960"><tspan x="89" data-justified="874">Here<tspan dx="1.51248"> is</tspan><tspan dx="1.51248"> something</tspan><tspan dx="1.51248"> worth</tspan><tspan dx="1.51248"> noticing.</tspan><tspan dx="1.51248"> Not</tspan><tspan dx="1.51248"> every</tspan><tspan dx="1.51248"> metal</tspan><tspan dx="1.51248"> is</tspan><tspan dx="1.51248"> magnetic.</tspan><tspan dx="1.51248"> Try</tspan><tspan dx="1.51248"> a</tspan><tspan dx="1.51248"> magnet</tspan><tspan dx="1.51248"> on</tspan><tspan dx="1.51248"> an</tspan></tspan><tspan x="89" dy="31" data-justified="874">aluminium<tspan dx="1.27316"> vessel</tspan><tspan dx="1.27316"> or</tspan><tspan dx="1.27316"> a</tspan><tspan dx="1.27316"> copper</tspan><tspan dx="1.27316"> wire.</tspan><tspan dx="1.27316"> Neither</tspan><tspan dx="1.27316"> will</tspan><tspan dx="1.27316"> stick.</tspan><tspan dx="1.27316"> So</tspan><tspan dx="1.27316"> &quot;metal&quot;</tspan><tspan dx="1.27316"> and</tspan><tspan dx="1.27316"> &quot;magnetic&quot;</tspan><tspan dx="1.27316"> do</tspan></tspan><tspan x="89" dy="31">not mean the same thing.</tspan></text></g>
<g data-content-kind="prompt"><g class="se-feature--observe"><rect class="se-prompt" x="89" y="1044" width="874" height="111"/><line class="se-think-rule" x1="89" x2="963" y1="1044" y2="1044"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What Did You Notice?"><svg class="se-feature-icon se-feature--observe" x="113" y="1055" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="1084">What Did You Notice?</text></g><text class="se-copy" x="113" y="1128"><tspan x="113">Which materials in your table were non-magnetic?</tspan></text></g></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1198"><tspan x="89" data-justified="874">Coins<tspan dx="6.07713"> and</tspan><tspan dx="6.07713"> keys</tspan><tspan dx="6.07713"> can</tspan><tspan dx="6.07713"> give</tspan><tspan dx="6.07713"> different</tspan><tspan dx="6.07713"> results</tspan><tspan dx="6.07713"> because</tspan><tspan dx="6.07713"> they</tspan><tspan dx="6.07713"> are</tspan><tspan dx="6.07713"> made</tspan><tspan dx="6.07713"> from</tspan><tspan dx="6.07713"> different</tspan></tspan><tspan x="89" dy="31" data-justified="874">metals<tspan dx="1.83975"> or</tspan><tspan dx="1.83975"> mixtures.</tspan><tspan dx="1.83975"> Test</tspan><tspan dx="1.83975"> your</tspan><tspan dx="1.83975"> own</tspan><tspan dx="1.83975"> examples</tspan><tspan dx="1.83975"> rather</tspan><tspan dx="1.83975"> than</tspan><tspan dx="1.83975"> guessing</tspan><tspan dx="1.83975"> from</tspan><tspan dx="1.83975"> their</tspan><tspan dx="1.83975"> colour.</tspan></tspan><tspan x="89" dy="31">A shiny surface does not tell you whether the material underneath is magnetic.</tspan></text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">4</text></g><!-- /botanical-footer --></svg></div></div></section>
