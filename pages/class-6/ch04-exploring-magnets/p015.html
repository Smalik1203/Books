<section class="page page--food page--science-editorial page--illustrated" data-science-chapter="4" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 15"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><g data-content-kind="body"><text class="se-section-opener" x="92" y="126">When a Compass Is Misled</text><text class="se-copy" x="89" y="183"><tspan x="89" data-justified="874">A<tspan dx="0.37348"> compass</tspan><tspan dx="0.37348"> responds</tspan><tspan dx="0.37348"> to</tspan><tspan dx="0.37348"> the</tspan><tspan dx="0.37348"> local</tspan><tspan dx="0.37348"> magnetic</tspan><tspan dx="0.37348"> field,</tspan><tspan dx="0.37348"> including</tspan><tspan dx="0.37348"> fields</tspan><tspan dx="0.37348"> from</tspan><tspan dx="0.37348"> nearby</tspan><tspan dx="0.37348"> objects.</tspan></tspan><tspan x="89" dy="31" data-justified="874">This<tspan dx="0.83956"> is</tspan><tspan dx="0.83956"> also</tspan><tspan dx="0.83956"> why</tspan><tspan dx="0.83956"> a</tspan><tspan dx="0.83956"> compass</tspan><tspan dx="0.83956"> gives</tspan><tspan dx="0.83956"> a</tspan><tspan dx="0.83956"> wrong</tspan><tspan dx="0.83956"> reading</tspan><tspan dx="0.83956"> when</tspan><tspan dx="0.83956"> a</tspan><tspan dx="0.83956"> magnet,</tspan><tspan dx="0.83956"> or</tspan><tspan dx="0.83956"> a</tspan><tspan dx="0.83956"> large</tspan><tspan dx="0.83956"> piece</tspan><tspan dx="0.83956"> of</tspan></tspan><tspan x="89" dy="31">iron, is kept near it.</tspan></text></g>
<g data-content-kind="heading"><text class="se-heading" x="89" y="295"><tspan x="89">Can a Magnet Work Through Things?</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="352"><tspan x="89" data-justified="874">A<tspan dx="1.96699"> magnet</tspan><tspan dx="1.96699"> pulls</tspan><tspan dx="1.96699"> a</tspan><tspan dx="1.96699"> paper</tspan><tspan dx="1.96699"> clip</tspan><tspan dx="1.96699"> across</tspan><tspan dx="1.96699"> a</tspan><tspan dx="1.96699"> gap</tspan><tspan dx="1.96699"> of</tspan><tspan dx="1.96699"> air.</tspan><tspan dx="1.96699"> But</tspan><tspan dx="1.96699"> what</tspan><tspan dx="1.96699"> if</tspan><tspan dx="1.96699"> something</tspan><tspan dx="1.96699"> is</tspan><tspan dx="1.96699"> put</tspan><tspan dx="1.96699"> in</tspan><tspan dx="1.96699"> the</tspan></tspan><tspan x="89" dy="31">way?</tspan></text></g>
<g data-content-kind="activity"><rect class="se-activity-panel" x="89" y="405" width="874" height="513"/><path class="se-activity-tab" d="M109 405H943Q963 405 963 425V448H89V425Q89 405 109 405Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="411" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="434" text-anchor="start">Investigate</text><text class="se-copy" x="113" y="500"><tspan x="113" data-justified="826">You<tspan dx="4.33873"> will</tspan><tspan dx="4.33873"> need:</tspan><tspan dx="4.33873"> a</tspan><tspan dx="4.33873"> compass,</tspan><tspan dx="4.33873"> a</tspan><tspan dx="4.33873"> bar</tspan><tspan dx="4.33873"> magnet,</tspan><tspan dx="4.33873"> and</tspan><tspan dx="4.33873"> flat</tspan><tspan dx="4.33873"> sheets</tspan><tspan dx="4.33873"> of</tspan><tspan dx="4.33873"> wood,</tspan><tspan dx="4.33873"> cardboard,</tspan></tspan><tspan x="113" dy="31">plastic and glass.</tspan></text><text class="se-activity-step" x="114" y="574" text-anchor="start">1.</text><text class="se-copy" x="143" y="574"><tspan x="143" data-justified="796">Set<tspan dx="17.87354"> up</tspan><tspan dx="17.87354"> the</tspan><tspan dx="17.87354"> compass</tspan><tspan dx="17.87354"> and</tspan><tspan dx="17.87354"> magnet</tspan><tspan dx="17.87354"> as</tspan><tspan dx="17.87354"> in</tspan><tspan dx="17.87354"> the</tspan><tspan dx="17.87354"> preceding</tspan><tspan dx="17.87354"> compass</tspan></tspan><tspan x="143" dy="31">investigation, so the needle is clearly turned aside.</tspan></text><text class="se-activity-step" x="114" y="648" text-anchor="start">2.</text><text class="se-copy" x="143" y="648"><tspan x="143" data-justified="796">Predict<tspan dx="2.54782"> what</tspan><tspan dx="2.54782"> will</tspan><tspan dx="2.54782"> happen</tspan><tspan dx="2.54782"> if</tspan><tspan dx="2.54782"> you</tspan><tspan dx="2.54782"> slide</tspan><tspan dx="2.54782"> a</tspan><tspan dx="2.54782"> piece</tspan><tspan dx="2.54782"> of</tspan><tspan dx="2.54782"> wood</tspan><tspan dx="2.54782"> into</tspan><tspan dx="2.54782"> the</tspan><tspan dx="2.54782"> gap</tspan><tspan dx="2.54782"> between</tspan></tspan><tspan x="143" dy="31">them. Write your prediction first.</tspan></text><text class="se-activity-step" x="114" y="722" text-anchor="start">3.</text><text class="se-copy" x="143" y="722"><tspan x="143">Stand the wood in the gap. Keep both the magnet and compass still.</tspan></text><text class="se-activity-step" x="114" y="765" text-anchor="start">4.</text><text class="se-copy" x="143" y="765"><tspan x="143">Watch the needle.</tspan></text><text class="se-activity-step" x="114" y="808" text-anchor="start">5.</text><text class="se-copy" x="143" y="808"><tspan x="143">Take the wood away. Try cardboard, then plastic, then glass.</tspan></text><text class="se-copy" x="113" y="851"><tspan x="113" data-justified="826">Safety:<tspan dx="7.73751"> Use</tspan><tspan dx="7.73751"> only</tspan><tspan dx="7.73751"> smooth-edged</tspan><tspan dx="7.73751"> glass</tspan><tspan dx="7.73751"> handled</tspan><tspan dx="7.73751"> by</tspan><tspan dx="7.73751"> your</tspan><tspan dx="7.73751"> teacher;</tspan><tspan dx="7.73751"> do</tspan><tspan dx="7.73751"> not</tspan><tspan dx="7.73751"> use</tspan></tspan><tspan x="113" dy="31">broken glass.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="963"><tspan x="89" data-justified="874">Copy<tspan dx="12.74997"> these</tspan><tspan dx="12.74997"> headings</tspan><tspan dx="12.74997"> into</tspan><tspan dx="12.74997"> your</tspan><tspan dx="12.74997"> notebook</tspan><tspan dx="12.74997"> and</tspan><tspan dx="12.74997"> record</tspan><tspan dx="12.74997"> your</tspan><tspan dx="12.74997"> predictions</tspan><tspan dx="12.74997"> and</tspan></tspan><tspan x="89" dy="31">observations there.</tspan></text></g>
