<g data-content-kind="body"><text class="se-copy" x="89" y="419"><tspan x="89" data-justified="874">For<tspan dx="0.86874"> the</tspan><tspan dx="0.86874"> racing</tspan><tspan dx="0.86874"> cars,</tspan><tspan dx="0.86874"> identify</tspan><tspan dx="0.86874"> the</tspan><tspan dx="0.86874"> two</tspan><tspan dx="0.86874"> ends</tspan><tspan dx="0.86874"> that</tspan><tspan dx="0.86874"> face</tspan><tspan dx="0.86874"> each</tspan><tspan dx="0.86874"> other</tspan><tspan dx="0.86874"> before</tspan><tspan dx="0.86874"> you</tspan><tspan dx="0.86874"> let</tspan><tspan dx="0.86874"> the</tspan><tspan dx="0.86874"> cars</tspan></tspan><tspan x="89" dy="31" data-justified="874">move.<tspan dx="6.58810"> Then</tspan><tspan dx="6.58810"> turn</tspan><tspan dx="6.58810"> just</tspan><tspan dx="6.58810"> one</tspan><tspan dx="6.58810"> magnet</tspan><tspan dx="6.58810"> around.</tspan><tspan dx="6.58810"> This</tspan><tspan dx="6.58810"> changes</tspan><tspan dx="6.58810"> the</tspan><tspan dx="6.58810"> facing</tspan><tspan dx="6.58810"> poles</tspan><tspan dx="6.58810"> while</tspan></tspan><tspan x="89" dy="31">keeping the cars and their wheels the same.</tspan></text></g>
