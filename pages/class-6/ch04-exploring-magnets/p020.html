<g data-content-kind="question"><text class="se-copy" x="89" y="887"><tspan x="89" data-justified="874">5.<tspan dx="2.06843"> You</tspan><tspan dx="2.06843"> are</tspan><tspan dx="2.06843"> given</tspan><tspan dx="2.06843"> three</tspan><tspan dx="2.06843"> metal</tspan><tspan dx="2.06843"> bars</tspan><tspan dx="2.06843"> that</tspan><tspan dx="2.06843"> look</tspan><tspan dx="2.06843"> exactly</tspan><tspan dx="2.06843"> alike.</tspan><tspan dx="2.06843"> Two</tspan><tspan dx="2.06843"> of</tspan><tspan dx="2.06843"> them</tspan><tspan dx="2.06843"> are</tspan><tspan dx="2.06843"> magnets.</tspan></tspan><tspan x="89" dy="31" data-justified="874">One<tspan dx="3.24970"> is</tspan><tspan dx="3.24970"> a</tspan><tspan dx="3.24970"> plain</tspan><tspan dx="3.24970"> iron</tspan><tspan dx="3.24970"> bar.</tspan><tspan dx="3.24970"> You</tspan><tspan dx="3.24970"> have</tspan><tspan dx="3.24970"> nothing</tspan><tspan dx="3.24970"> else</tspan><tspan dx="3.24970"> to</tspan><tspan dx="3.24970"> help</tspan><tspan dx="3.24970"> you.</tspan><tspan dx="3.24970"> How</tspan><tspan dx="3.24970"> will</tspan><tspan dx="3.24970"> you</tspan><tspan dx="3.24970"> find</tspan><tspan dx="3.24970"> out</tspan></tspan><tspan x="89" dy="31">which one is the plain iron bar?</tspan></text></g>

<g data-content-kind="question"><text class="se-copy" x="89" y="1101"><tspan x="89" data-justified="874">7.<tspan dx="2.17385"> Now</tspan><tspan dx="2.17385"> suppose</tspan><tspan dx="2.17385"> you</tspan><tspan dx="2.17385"> have</tspan><tspan dx="2.17385"> no</tspan><tspan dx="2.17385"> second</tspan><tspan dx="2.17385"> magnet</tspan><tspan dx="2.17385"> at</tspan><tspan dx="2.17385"> all.</tspan><tspan dx="2.17385"> You</tspan><tspan dx="2.17385"> have</tspan><tspan dx="2.17385"> only</tspan><tspan dx="2.17385"> a</tspan><tspan dx="2.17385"> piece</tspan><tspan dx="2.17385"> of</tspan><tspan dx="2.17385"> thread.</tspan></tspan><tspan x="89" dy="31" data-justified="874">Can<tspan dx="2.37029"> repeated</tspan><tspan dx="2.37029"> suspension</tspan><tspan dx="2.37029"> identify</tspan><tspan dx="2.37029"> the</tspan><tspan dx="2.37029"> North</tspan><tspan dx="2.37029"> pole</tspan><tspan dx="2.37029"> without</tspan><tspan dx="2.37029"> an</tspan><tspan dx="2.37029"> independent</tspan><tspan dx="2.37029"> direction</tspan></tspan><tspan x="89" dy="31">reference? State what extra information you need.</tspan></text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">20</text></g><!-- /botanical-footer --></svg></div></div></section>
