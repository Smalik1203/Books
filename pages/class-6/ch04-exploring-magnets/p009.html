<section class="page page--food page--science-editorial page--illustrated" data-science-chapter="4" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Magnets, page 9"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="se-botanical-stem" d="M24 13v23q0 22 22 22t22 -22V13H56v23q0 10 -10 10t-10 -10V13ZM24 25h12M56 25h12"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 4</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Exploring Magnets</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><g data-content-kind="body"><text class="se-copy" x="89" y="119"><tspan x="89" data-justified="874">Leave<tspan dx="3.59477"> the</tspan><tspan dx="3.59477"> compass</tspan><tspan dx="3.59477"> on</tspan><tspan dx="3.59477"> a</tspan><tspan dx="3.59477"> flat</tspan><tspan dx="3.59477"> surface</tspan><tspan dx="3.59477"> and</tspan><tspan dx="3.59477"> wait.</tspan><tspan dx="3.59477"> The</tspan><tspan dx="3.59477"> needle</tspan><tspan dx="3.59477"> swings</tspan><tspan dx="3.59477"> and</tspan><tspan dx="3.59477"> then</tspan><tspan dx="3.59477"> settles</tspan></tspan><tspan x="89" dy="31" data-justified="874">along<tspan dx="-0.00404"> the</tspan><tspan dx="-0.00404"> north-south</tspan><tspan dx="-0.00404"> line,</tspan><tspan dx="-0.00404"> just</tspan><tspan dx="-0.00404"> as</tspan><tspan dx="-0.00404"> the</tspan><tspan dx="-0.00404"> hanging</tspan><tspan dx="-0.00404"> magnet</tspan><tspan dx="-0.00404"> did.</tspan><tspan dx="-0.00404"> The</tspan><tspan dx="-0.00404"> end</tspan><tspan dx="-0.00404"> that</tspan><tspan dx="-0.00404"> points</tspan><tspan dx="-0.00404"> north</tspan></tspan><tspan x="89" dy="31">is usually painted red, or marked in some other way.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="226"><tspan x="89" data-justified="874">To<tspan dx="1.32374"> read</tspan><tspan dx="1.32374"> it,</tspan><tspan dx="1.32374"> turn</tspan><tspan dx="1.32374"> the</tspan><tspan dx="1.32374"> whole</tspan><tspan dx="1.32374"> compass</tspan><tspan dx="1.32374"> box</tspan><tspan dx="1.32374"> gently</tspan><tspan dx="1.32374"> —</tspan><tspan dx="1.32374"> not</tspan><tspan dx="1.32374"> the</tspan><tspan dx="1.32374"> needle</tspan><tspan dx="1.32374"> —</tspan><tspan dx="1.32374"> until</tspan><tspan dx="1.32374"> the</tspan><tspan dx="1.32374"> marked</tspan></tspan><tspan x="89" dy="31" data-justified="874">north-seeking<tspan dx="0.97931"> end</tspan><tspan dx="0.97931"> points</tspan><tspan dx="0.97931"> to</tspan><tspan dx="0.97931"> N</tspan><tspan dx="0.97931"> on</tspan><tspan dx="0.97931"> the</tspan><tspan dx="0.97931"> dial.</tspan><tspan dx="0.97931"> Matching</tspan><tspan dx="0.97931"> only</tspan><tspan dx="0.97931"> the</tspan><tspan dx="0.97931"> needle's</tspan><tspan dx="0.97931"> line</tspan><tspan dx="0.97931"> could</tspan><tspan dx="0.97931"> put</tspan></tspan><tspan x="89" dy="31" data-justified="874">the<tspan dx="3.54749"> dial</tspan><tspan dx="3.54749"> backwards.</tspan><tspan dx="3.54749"> The</tspan><tspan dx="3.54749"> dial</tspan><tspan dx="3.54749"> now</tspan><tspan dx="3.54749"> gives</tspan><tspan dx="3.54749"> magnetic</tspan><tspan dx="3.54749"> directions;</tspan><tspan dx="3.54749"> these</tspan><tspan dx="3.54749"> can</tspan><tspan dx="3.54749"> differ</tspan><tspan dx="3.54749"> from</tspan></tspan><tspan x="89" dy="31">geographic directions.</tspan></text></g>
<g data-content-kind="illustrated-reading"><text class="se-copy" x="89" y="364"><tspan x="89" data-justified="874">This<tspan dx="2.58556"> small</tspan><tspan dx="2.58556"> device</tspan><tspan dx="2.58556"> changed</tspan><tspan dx="2.58556"> the</tspan><tspan dx="2.58556"> world.</tspan><tspan dx="2.58556"> With</tspan><tspan dx="2.58556"> a</tspan><tspan dx="2.58556"> compass,</tspan><tspan dx="2.58556"> a</tspan><tspan dx="2.58556"> ship</tspan><tspan dx="2.58556"> could</tspan><tspan dx="2.58556"> hold</tspan><tspan dx="2.58556"> its</tspan><tspan dx="2.58556"> course</tspan></tspan><tspan x="89" dy="31" data-justified="874">through<tspan dx="3.02835"> cloud,</tspan><tspan dx="3.02835"> fog</tspan><tspan dx="3.02835"> and</tspan><tspan dx="3.02835"> night.</tspan><tspan dx="3.02835"> It</tspan><tspan dx="3.02835"> supplied</tspan><tspan dx="3.02835"> a</tspan><tspan dx="3.02835"> direction</tspan><tspan dx="3.02835"> reference;</tspan><tspan dx="3.02835"> sailors</tspan><tspan dx="3.02835"> still</tspan><tspan dx="3.02835"> needed</tspan></tspan><tspan x="89" dy="31">information about their position and planned route.</tspan></text><svg class="science-illustration ip-art" x="89" y="448" width="874" height="419.3346587143804" viewBox="18 118 1509 724" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-6/science/ch04/png/compass.png" x="0" y="0" width="1536" height="1024"/></svg><text class="se-caption" x="526" y="896.3346587143803" text-anchor="middle">A freely turning needle rests on a pivot.</text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="938.3346587143803"><tspan x="89" data-justified="874">The<tspan dx="2.77297"> compass</tspan><tspan dx="2.77297"> needle</tspan><tspan dx="2.77297"> turns;</tspan><tspan dx="2.77297"> the</tspan><tspan dx="2.77297"> letters</tspan><tspan dx="2.77297"> printed</tspan><tspan dx="2.77297"> on</tspan><tspan dx="2.77297"> the</tspan><tspan dx="2.77297"> dial</tspan><tspan dx="2.77297"> do</tspan><tspan dx="2.77297"> not.</tspan><tspan dx="2.77297"> Turning</tspan><tspan dx="2.77297"> the</tspan><tspan dx="2.77297"> case</tspan></tspan><tspan x="89" dy="31" data-justified="874">brings<tspan dx="4.09447"> those</tspan><tspan dx="4.09447"> letters</tspan><tspan dx="4.09447"> into</tspan><tspan dx="4.09447"> line</tspan><tspan dx="4.09447"> with</tspan><tspan dx="4.09447"> the</tspan><tspan dx="4.09447"> settled</tspan><tspan dx="4.09447"> needle.</tspan><tspan dx="4.09447"> If</tspan><tspan dx="4.09447"> you</tspan><tspan dx="4.09447"> carry</tspan><tspan dx="4.09447"> the</tspan><tspan dx="4.09447"> compass</tspan><tspan dx="4.09447"> to</tspan></tspan><tspan x="89" dy="31">another place or turn yourself around, let the needle settle and check the dial again.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1045.3346587143803"><tspan x="89" data-justified="874">A<tspan dx="7.76947"> compass</tspan><tspan dx="7.76947"> shows</tspan><tspan dx="7.76947"> direction</tspan><tspan dx="7.76947"> relative</tspan><tspan dx="7.76947"> to</tspan><tspan dx="7.76947"> the</tspan><tspan dx="7.76947"> local</tspan><tspan dx="7.76947"> magnetic</tspan><tspan dx="7.76947"> field.</tspan><tspan dx="7.76947"> Accurate</tspan><tspan dx="7.76947"> map</tspan></tspan><tspan x="89" dy="31" data-justified="874">navigation<tspan dx="4.50105"> also</tspan><tspan dx="4.50105"> allows</tspan><tspan dx="4.50105"> for</tspan><tspan dx="4.50105"> the</tspan><tspan dx="4.50105"> difference</tspan><tspan dx="4.50105"> between</tspan><tspan dx="4.50105"> magnetic</tspan><tspan dx="4.50105"> north</tspan><tspan dx="4.50105"> and</tspan><tspan dx="4.50105"> geographic</tspan></tspan><tspan x="89" dy="31">north.</tspan></text></g>
<g data-content-kind="body"><text class="se-copy" x="89" y="1152.3346587143803"><tspan x="89" data-justified="874">Keep<tspan dx="0.05538"> the</tspan><tspan dx="0.05538"> compass</tspan><tspan dx="0.05538"> level</tspan><tspan dx="0.05538"> while</tspan><tspan dx="0.05538"> reading</tspan><tspan dx="0.05538"> it.</tspan><tspan dx="0.05538"> A</tspan><tspan dx="0.05538"> tilted</tspan><tspan dx="0.05538"> needle</tspan><tspan dx="0.05538"> may</tspan><tspan dx="0.05538"> catch</tspan><tspan dx="0.05538"> against</tspan><tspan dx="0.05538"> its</tspan><tspan dx="0.05538"> support</tspan></tspan><tspan x="89" dy="31" data-justified="874">or<tspan dx="1.44630"> case.</tspan><tspan dx="1.44630"> If</tspan><tspan dx="1.44630"> it</tspan><tspan dx="1.44630"> seems</tspan><tspan dx="1.44630"> stuck,</tspan><tspan dx="1.44630"> put</tspan><tspan dx="1.44630"> the</tspan><tspan dx="1.44630"> compass</tspan><tspan dx="1.44630"> on</tspan><tspan dx="1.44630"> a</tspan><tspan dx="1.44630"> flat</tspan><tspan dx="1.44630"> surface</tspan><tspan dx="1.44630"> and</tspan><tspan dx="1.44630"> wait</tspan><tspan dx="1.44630"> before</tspan><tspan dx="1.44630"> trusting</tspan></tspan><tspan x="89" dy="31">the direction it shows.</tspan></text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">9</text></g><!-- /botanical-footer --></svg></div></div></section>
