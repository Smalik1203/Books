<section class="page page--food page--science-editorial" data-science-chapter="3" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Food on Our Plate, page 2"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><circle class="se-botanical-stem" cx="46" cy="30" r="21"/><circle class="se-botanical-stem" cx="46" cy="30" r="14"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 3</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Food on Our Plate</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-copy" data-measure="874" x="89" y="119"><tspan x="89">Scientists<tspan data-gap="" dx="0.66388"> </tspan>call<tspan data-gap="" dx="0.66388"> </tspan>this<tspan data-gap="" dx="0.66388"> </tspan>kind<tspan data-gap="" dx="0.66388"> </tspan>of<tspan data-gap="" dx="0.66388"> </tspan>careful<tspan data-gap="" dx="0.66388"> </tspan>watching<tspan data-gap="" dx="0.66388"> </tspan>observation.<tspan data-gap="" dx="0.66388"> </tspan>Observation<tspan data-gap="" dx="0.66388"> </tspan>is<tspan data-gap="" dx="0.66388"> </tspan>not<tspan data-gap="" dx="0.66388"> </tspan>the<tspan data-gap="" dx="0.66388"> </tspan>same</tspan><tspan x="89" dy="31">as<tspan data-gap="" dx="2.18266"> </tspan>looking.<tspan data-gap="" dx="2.18266"> </tspan>Looking<tspan data-gap="" dx="2.18266"> </tspan>is<tspan data-gap="" dx="2.18266"> </tspan>what<tspan data-gap="" dx="2.18266"> </tspan>you<tspan data-gap="" dx="2.18266"> </tspan>do<tspan data-gap="" dx="2.18266"> </tspan>all<tspan data-gap="" dx="2.18266"> </tspan>day.<tspan data-gap="" dx="2.18266"> </tspan>Observing<tspan data-gap="" dx="2.18266"> </tspan>is<tspan data-gap="" dx="2.18266"> </tspan>looking<tspan data-gap="" dx="2.18266"> </tspan>with<tspan data-gap="" dx="2.18266"> </tspan>a<tspan data-gap="" dx="2.18266"> </tspan>question<tspan data-gap="" dx="2.18266"> </tspan>in</tspan><tspan x="89" dy="31">mind, and writing down what you find.</tspan></text><g aria-label="Activity 3.1 · Keep a food diary"><rect class="se-activity-panel" x="89" y="217" width="874" height="543"/><path class="se-activity-tab" d="M109 203H943Q963 203 963 223V246H89V223Q89 203 109 203Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="209" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="230"><tspan x="149">Investigate</tspan></text><text class="se-copy" x="113" y="290"><tspan x="113">You will need: your notebook, seven days.</tspan></text><text class="se-activity-step" x="113" y="335"><tspan x="113">1.</tspan></text><text class="se-copy" x="151" y="335"><tspan x="151">Create a food diary in your notebook, with one</tspan><tspan x="151" dy="31">entry for each day.</tspan></text><text class="se-activity-step" x="113" y="411"><tspan x="113">2.</tspan></text><text class="se-copy" x="151" y="411"><tspan x="151">Every evening for one week, write down</tspan><tspan x="151" dy="31">everything you ate that day — meals, snacks,</tspan><tspan x="151" dy="31">drinks, everything. Do not leave out the</tspan><tspan x="151" dy="31">biscuit you ate at 4 p.m.</tspan></text><text class="se-activity-step" x="113" y="549"><tspan x="113">3.</tspan></text><text class="se-copy" x="151" y="549"><tspan x="151">Write it the same evening. If you wait till</tspan><tspan x="151" dy="31">Sunday and try to remember Monday, you may</tspan><tspan x="151" dy="31">forget or misremember items; mark any</tspan><tspan x="151" dy="31">uncertain entries.</tspan></text><text class="se-activity-step" x="113" y="687"><tspan x="113">4.</tspan></text><text class="se-copy" x="151" y="687"><tspan x="151">At the end of the week, read the whole table at</tspan><tspan x="151" dy="31">once.</tspan></text><g class="se-activity-art"><image class="science-illustration" href="../../figures/reference/food/p002-diary.png" x="669" y="353.5" width="270" height="300" preserveAspectRatio="xMidYMid meet"><title>diary</title></image></g><text class="se-copy se-table-copy" x="669" y="679.9"></text></g><text class="se-copy" data-measure="874" x="89" y="799"><tspan x="89">In<tspan data-gap="" dx="0.53733"> </tspan>your<tspan data-gap="" dx="0.53733"> </tspan>notebook,<tspan data-gap="" dx="0.53733"> </tspan>use<tspan data-gap="" dx="0.53733"> </tspan>two<tspan data-gap="" dx="0.53733"> </tspan>columns:<tspan data-gap="" dx="0.53733"> </tspan>Day<tspan data-gap="" dx="0.53733"> </tspan>and<tspan data-gap="" dx="0.53733"> </tspan>What<tspan data-gap="" dx="0.53733"> </tspan>I<tspan data-gap="" dx="0.53733"> </tspan>ate<tspan data-gap="" dx="0.53733"> </tspan>and<tspan data-gap="" dx="0.53733"> </tspan>drank.<tspan data-gap="" dx="0.53733"> </tspan>Record<tspan data-gap="" dx="0.53733"> </tspan>one<tspan data-gap="" dx="0.53733"> </tspan>entry</tspan><tspan x="89" dy="31">for each day, Monday to Sunday.</tspan></text><text class="se-copy" data-measure="874" x="89" y="875"><tspan x="89">Now<tspan data-gap="" dx="1.73714"> </tspan>read<tspan data-gap="" dx="1.73714"> </tspan>your<tspan data-gap="" dx="1.73714"> </tspan>table<tspan data-gap="" dx="1.73714"> </tspan>as<tspan data-gap="" dx="1.73714"> </tspan>a<tspan data-gap="" dx="1.73714"> </tspan>scientist<tspan data-gap="" dx="1.73714"> </tspan>would.<tspan data-gap="" dx="1.73714"> </tspan>Did<tspan data-gap="" dx="1.73714"> </tspan>the<tspan data-gap="" dx="1.73714"> </tspan>same<tspan data-gap="" dx="1.73714"> </tspan>items<tspan data-gap="" dx="1.73714"> </tspan>appear<tspan data-gap="" dx="1.73714"> </tspan>on<tspan data-gap="" dx="1.73714"> </tspan>most<tspan data-gap="" dx="1.73714"> </tspan>days?</tspan><tspan x="89" dy="31">Which<tspan data-gap="" dx="0.76137"> </tspan>days<tspan data-gap="" dx="0.76137"> </tspan>were<tspan data-gap="" dx="0.76137"> </tspan>different<tspan data-gap="" dx="0.76137"> </tspan>from<tspan data-gap="" dx="0.76137"> </tspan>the<tspan data-gap="" dx="0.76137"> </tspan>rest,<tspan data-gap="" dx="0.76137"> </tspan>and<tspan data-gap="" dx="0.76137"> </tspan>can<tspan data-gap="" dx="0.76137"> </tspan>you<tspan data-gap="" dx="0.76137"> </tspan>say<tspan data-gap="" dx="0.76137"> </tspan>why<tspan data-gap="" dx="0.76137"> </tspan>—<tspan data-gap="" dx="0.76137"> </tspan>a<tspan data-gap="" dx="0.76137"> </tspan>festival,<tspan data-gap="" dx="0.76137"> </tspan>a<tspan data-gap="" dx="0.76137"> </tspan>guest,<tspan data-gap="" dx="0.76137"> </tspan>a</tspan><tspan x="89" dy="31">day you were unwell?</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">2</text></g><!-- /botanical-footer --></svg></div></div></section>
