dx="3.84003"> </tspan>detect.<tspan data-gap="" dx="3.84003"> </tspan>Three<tspan data-gap="" dx="3.84003"> </tspan>do<tspan data-gap="" dx="3.84003"> </tspan>not:<tspan data-gap="" dx="3.84003"> </tspan>starch,<tspan data-gap="" dx="3.84003"> </tspan>fat<tspan data-gap="" dx="3.84003"> </tspan>and</tspan><tspan x="89" dy="31">protein<tspan data-gap="" dx="1.00773"> </tspan>can<tspan data-gap="" dx="1.00773"> </tspan>each<tspan data-gap="" dx="1.00773"> </tspan>be<tspan data-gap="" dx="1.00773"> </tspan>tested<tspan data-gap="" dx="1.00773"> </tspan>with<tspan data-gap="" dx="1.00773"> </tspan>equipment<tspan data-gap="" dx="1.00773"> </tspan>a<tspan data-gap="" dx="1.00773"> </tspan>school<tspan data-gap="" dx="1.00773"> </tspan>already<tspan data-gap="" dx="1.00773"> </tspan>has.<tspan data-gap="" dx="1.00773"> </tspan>Starch,<tspan data-gap="" dx="1.00773"> </tspan>incidentally,</tspan><tspan x="89" dy="31">is a carbohydrate — the form in which plants store it.</tspan></text><text class="se-copy" data-measure="874" x="89" y="313"><tspan x="89">Before<tspan data-gap="" dx="0.22361"> </tspan>each<tspan data-gap="" dx="0.22361"> </tspan>test,<tspan data-gap="" dx="0.22361"> </tspan>record<tspan data-gap="" dx="0.22361"> </tspan>what<tspan data-gap="" dx="0.22361"> </tspan>you<tspan data-gap="" dx="0.22361"> </tspan>expect<tspan data-gap="" dx="0.22361"> </tspan>and<tspan data-gap="" dx="0.22361"> </tspan>why.<tspan data-gap="" dx="0.22361"> </tspan>This<tspan data-gap="" dx="0.22361"> </tspan>is<tspan data-gap="" dx="0.22361"> </tspan>a<tspan data-gap="" dx="0.22361"> </tspan>prediction.<tspan data-gap="" dx="0.22361"> </tspan>Keep<tspan data-gap="" dx="0.22361"> </tspan>it<tspan data-gap="" dx="0.22361"> </tspan>beside</tspan><tspan x="89" dy="31">the<tspan data-gap="" dx="1.29142"> </tspan>observation<tspan data-gap="" dx="1.29142"> </tspan>even<tspan data-gap="" dx="1.29142"> </tspan>if<tspan data-gap="" dx="1.29142"> </tspan>they<tspan data-gap="" dx="1.29142"> </tspan>disagree.<tspan data-gap="" dx="1.29142"> </tspan>Both<tspan data-gap="" dx="1.29142"> </tspan>matching<tspan data-gap="" dx="1.29142"> </tspan>and<tspan data-gap="" dx="1.29142"> </tspan>unexpected<tspan data-gap="" dx="1.29142"> </tspan>results<tspan data-gap="" dx="1.29142"> </tspan>matter;</tspan><tspan x="89" dy="31">neither alone proves a complete explanation.</tspan></text><g aria-label="Activity 3.5 · Test for starch"><rect class="se-activity-panel" x="89" y="411" width="874" height="602"/><path class="se-activity-tab" d="M109 397H943Q963 397 963 417V440H89V417Q89 397 109 397Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="403" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="424"><tspan x="149">The setup</tspan></text><text class="se-copy" x="113" y="484"><tspan x="113">You will need: small samples of potato, cucumber, bread or chapati, boiled rice,</tspan><tspan x="113" dy="31">boiled gram, crushed peanut, oil, butter, crushed coconut; a dropper; dilute</tspan><tspan x="113" dy="31">iodine solution; separate dishes.</tspan></text><text class="se-copy" x="113" y="591"><tspan x="113">Use starch paste as a positive control and water as a negative control. Keep</tspan><tspan x="113" dy="31">sample amounts and waiting times alike. Record observations before</tspan><tspan x="113" dy="31">interpreting them.</tspan></text><text class="se-activity-step" x="113" y="698"><tspan x="113">1.</tspan></text><text class="se-copy" x="151" y="698"><tspan x="151">Copy the results-table headings given below into your notebook. Fill in the</tspan><tspan x="151" dy="31">prediction column before you touch the iodine.</tspan></text><text class="se-activity-step" x="113" y="774"><tspan x="113">2.</tspan></text><text class="se-copy" x="151" y="774"><tspan x="151">Place a small piece of each food on its own dish. Keep them apart and label</tspan><tspan x="151" dy="31">them.</tspan></text><text class="se-activity-step" x="113" y="850"><tspan x="113">3.</tspan></text><text class="se-copy" x="151" y="850"><tspan x="151">Note the colour of each sample before testing.</tspan></text><text class="se-activity-step" x="113" y="895"><tspan x="113">4.</tspan></text><text class="se-copy" x="151" y="895"><tspan x="151">Using the dropper, put two or three drops of dilute iodine solution on each</tspan><tspan x="151" dy="31">sample.</tspan></text><text class="se-activity-step" x="113" y="971"><tspan x="113">5.</tspan></text><text class="se-copy" x="151" y="971"><tspan x="151">Watch for a colour change. Record what you see.</tspan></text></g><rect class="se-prompt" x="89" y="1029" width="874" height="148"/><line class="se-think-rule" x1="89" x2="963" y1="1029" y2="1029"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What you saw"><svg class="se-feature-icon se-feature--observe" x="113" y="1038" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="1067">What you saw</text></g><text class="se-copy" data-measure="826" x="113" y="1123"><tspan x="113">Compare<tspan data-gap="" dx="6.20300"> </tspan>each<tspan data-gap="" dx="6.20300"> </tspan>sample<tspan data-gap="" dx="6.20300"> </tspan>with<tspan data-gap="" dx="6.20300"> </tspan>both<tspan data-gap="" dx="6.20300"> </tspan>controls.<tspan data-gap="" dx="6.20300"> </tspan>What<tspan data-gap="" dx="6.20300"> </tspan>changed?<tspan data-gap="" dx="6.20300"> </tspan>Did<tspan data-gap="" dx="6.20300"> </tspan>the<tspan data-gap="" dx="6.20300"> </tspan>controls</tspan><tspan x="113" dy="31">behave as expected? What would you repeat before concluding absence?</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">19</text></g><!-- /botanical-footer --></svg></div></div></section>
