<section class="page page--food page--science-editorial" data-science-chapter="3" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Food on Our Plate, page 11"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><circle class="se-botanical-stem" cx="46" cy="30" r="21"/><circle class="se-botanical-stem" cx="46" cy="30" r="14"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 3</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Food on Our Plate</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><rect class="se-prompt" x="89" y="96" width="874" height="148"/><line class="se-think-rule" x1="89" x2="963" y1="96" y2="96"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What you saw"><svg class="se-feature-icon se-feature--observe" x="113" y="105" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="134">What you saw</text></g><text class="se-copy" data-measure="826" x="113" y="190"><tspan x="113">Which<tspan data-gap="" dx="1.46467"> </tspan>foods<tspan data-gap="" dx="1.46467"> </tspan>in<tspan data-gap="" dx="1.46467"> </tspan>your<tspan data-gap="" dx="1.46467"> </tspan>food<tspan data-gap="" dx="1.46467"> </tspan>diary<tspan data-gap="" dx="1.46467"> </tspan>were<tspan data-gap="" dx="1.46467"> </tspan>body-building<tspan data-gap="" dx="1.46467"> </tspan>foods?<tspan data-gap="" dx="1.46467"> </tspan>Did<tspan data-gap="" dx="1.46467"> </tspan>every<tspan data-gap="" dx="1.46467"> </tspan>day<tspan data-gap="" dx="1.46467"> </tspan>of<tspan data-gap="" dx="1.46467"> </tspan>the</tspan><tspan x="113" dy="31">week contain at least one?</tspan></text><image class="science-illustration" href="../../figures/reference/food/p010-mushrooms.png" x="657" y="258" width="306" height="235" preserveAspectRatio="xMidYMid meet"><title>mushrooms</title></image><text class="se-copy" x="89" y="281"><tspan x="89">Mushrooms belong to the fungi, not the plants.</tspan><tspan x="89" dy="31">They obtain nutrients from organic matter rather</tspan><tspan x="89" dy="31">than making sugars by photosynthesis. Fresh edible</tspan><tspan x="89" dy="31">mushrooms contain water, fibre and nutrients, but</tspan><tspan x="89" dy="31">are not interchangeable with pulses as a protein</tspan><tspan x="89" dy="31">source. Never taste a wild mushroom to identify it.</tspan></text><text class="se-heading" x="89" y="549.06"><tspan x="89">3.3 The Components We Need in Tiny Amounts</tspan></text><text class="se-copy" data-measure="874" x="89" y="600"><tspan x="89">Carbohydrates,<tspan data-gap="" dx="0.05095"> </tspan>fats<tspan data-gap="" dx="0.05095"> </tspan>and<tspan data-gap="" dx="0.05095"> </tspan>proteins<tspan data-gap="" dx="0.05095"> </tspan>are<tspan data-gap="" dx="0.05095"> </tspan>the<tspan data-gap="" dx="0.05095"> </tspan>components<tspan data-gap="" dx="0.05095"> </tspan>we<tspan data-gap="" dx="0.05095"> </tspan>eat<tspan data-gap="" dx="0.05095"> </tspan>by<tspan data-gap="" dx="0.05095"> </tspan>the<tspan data-gap="" dx="0.05095"> </tspan>spoonful.<tspan data-gap="" dx="0.05095"> </tspan>There<tspan data-gap="" dx="0.05095"> </tspan>is</tspan><tspan x="89" dy="31">another<tspan data-gap="" dx="0.23244"> </tspan>set<tspan data-gap="" dx="0.23244"> </tspan>that<tspan data-gap="" dx="0.23244"> </tspan>we<tspan data-gap="" dx="0.23244"> </tspan>need<tspan data-gap="" dx="0.23244"> </tspan>in<tspan data-gap="" dx="0.23244"> </tspan>amounts<tspan data-gap="" dx="0.23244"> </tspan>so<tspan data-gap="" dx="0.23244"> </tspan>small<tspan data-gap="" dx="0.23244"> </tspan>they<tspan data-gap="" dx="0.23244"> </tspan>are<tspan data-gap="" dx="0.23244"> </tspan>measured<tspan data-gap="" dx="0.23244"> </tspan>in<tspan data-gap="" dx="0.23244"> </tspan>milligrams<tspan data-gap="" dx="0.23244"> </tspan>—<tspan data-gap="" dx="0.23244"> </tspan>and</tspan><tspan x="89" dy="31">yet a person who goes without them falls seriously ill.</tspan></text><text class="se-copy" data-measure="874" x="89" y="707"><tspan x="89">The<tspan data-gap="" dx="0.51273"> </tspan>strongest<tspan data-gap="" dx="0.51273"> </tspan>way<tspan data-gap="" dx="0.51273"> </tspan>to<tspan data-gap="" dx="0.51273"> </tspan>see<tspan data-gap="" dx="0.51273"> </tspan>what<tspan data-gap="" dx="0.51273"> </tspan>these<tspan data-gap="" dx="0.51273"> </tspan>components<tspan data-gap="" dx="0.51273"> </tspan>do<tspan data-gap="" dx="0.51273"> </tspan>is<tspan data-gap="" dx="0.51273"> </tspan>to<tspan data-gap="" dx="0.51273"> </tspan>look<tspan data-gap="" dx="0.51273"> </tspan>at<tspan data-gap="" dx="0.51273"> </tspan>what<tspan data-gap="" dx="0.51273"> </tspan>happens<tspan data-gap="" dx="0.51273"> </tspan>when</tspan><tspan x="89" dy="31">they<tspan data-gap="" dx="1.30464"> </tspan>are<tspan data-gap="" dx="1.30464"> </tspan>missing.<tspan data-gap="" dx="1.30464"> </tspan>Read<tspan data-gap="" dx="1.30464"> </tspan>the<tspan data-gap="" dx="1.30464"> </tspan>two<tspan data-gap="" dx="1.30464"> </tspan>cases<tspan data-gap="" dx="1.30464"> </tspan>below<tspan data-gap="" dx="1.30464"> </tspan>and<tspan data-gap="" dx="1.30464"> </tspan>work<tspan data-gap="" dx="1.30464"> </tspan>out<tspan data-gap="" dx="1.30464"> </tspan>the<tspan data-gap="" dx="1.30464"> </tspan>answer<tspan data-gap="" dx="1.30464"> </tspan>yourself<tspan data-gap="" dx="1.30464"> </tspan>before</tspan><tspan x="89" dy="31">reading on.</tspan></text><text class="se-heading" x="89" y="819.06"><tspan x="89">Case 1 — The sailors' disease</tspan></text><image class="science-illustration" href="../../figures/reference/food/p011-sailing-ship.png" x="657" y="847" width="306" height="235" preserveAspectRatio="xMidYMid meet"><title>sailing ship</title></image><text class="se-copy" x="89" y="870"><tspan x="89">On long sea voyages in earlier centuries, sailors fell</tspan><tspan x="89" dy="31">ill in a particular way. Their gums swelled and bled,</tspan><tspan x="89" dy="31">their teeth loosened, old wounds reopened, and</tspan><tspan x="89" dy="31">many died — often months from any battle or storm.</tspan></text><text class="se-copy" data-measure="874" x="89" y="1133"><tspan x="89">In<tspan data-gap="" dx="1.04351"> </tspan>May<tspan data-gap="" dx="1.04351"> </tspan>1747,<tspan data-gap="" dx="1.04351"> </tspan>James<tspan data-gap="" dx="1.04351"> </tspan>Lind<tspan data-gap="" dx="1.04351"> </tspan>compared<tspan data-gap="" dx="1.04351"> </tspan>six<tspan data-gap="" dx="1.04351"> </tspan>treatments<tspan data-gap="" dx="1.04351"> </tspan>among<tspan data-gap="" dx="1.04351"> </tspan>twelve<tspan data-gap="" dx="1.04351"> </tspan>sailors<tspan data-gap="" dx="1.04351"> </tspan>with<tspan data-gap="" dx="1.04351"> </tspan>scurvy,</tspan><tspan x="89" dy="31">two<tspan data-gap="" dx="4.25340"> </tspan>sailors<tspan data-gap="" dx="4.25340"> </tspan>per<tspan data-gap="" dx="4.25340"> </tspan>treatment.<tspan data-gap="" dx="4.25340"> </tspan>The<tspan data-gap="" dx="4.25340"> </tspan>pair<tspan data-gap="" dx="4.25340"> </tspan>receiving<tspan data-gap="" dx="4.25340"> </tspan>oranges<tspan data-gap="" dx="4.25340"> </tspan>and<tspan data-gap="" dx="4.25340"> </tspan>lemons<tspan data-gap="" dx="4.25340"> </tspan>improved<tspan data-gap="" dx="4.25340"> </tspan>most</tspan><tspan x="89" dy="31">rapidly.</tspan></text><text class="se-copy" data-measure="874" x="89" y="1240"><tspan x="89">The condition is called scurvy.</tspan></text><text class="se-copy" data-measure="874" x="89" y="1285"><tspan x="89">Now<tspan data-gap="" dx="2.96758"> </tspan>interpret<tspan data-gap="" dx="2.96758"> </tspan>Case<tspan data-gap="" dx="2.96758"> </tspan>1.<tspan data-gap="" dx="2.96758"> </tspan>Lind's<tspan data-gap="" dx="2.96758"> </tspan>sailors<tspan data-gap="" dx="2.96758"> </tspan>were<tspan data-gap="" dx="2.96758"> </tspan>not<tspan data-gap="" dx="2.96758"> </tspan>short<tspan data-gap="" dx="2.96758"> </tspan>of<tspan data-gap="" dx="2.96758"> </tspan>food<tspan data-gap="" dx="2.96758"> </tspan>—<tspan data-gap="" dx="2.96758"> </tspan>ships<tspan data-gap="" dx="2.96758"> </tspan>carried<tspan data-gap="" dx="2.96758"> </tspan>salted</tspan><tspan x="89" dy="31">meat<tspan data-gap="" dx="3.08024"> </tspan>and<tspan data-gap="" dx="3.08024"> </tspan>dry<tspan data-gap="" dx="3.08024"> </tspan>biscuit<tspan data-gap="" dx="3.08024"> </tspan>in<tspan data-gap="" dx="3.08024"> </tspan>quantity.<tspan data-gap="" dx="3.08024"> </tspan>They<tspan data-gap="" dx="3.08024"> </tspan>were<tspan data-gap="" dx="3.08024"> </tspan>short<tspan data-gap="" dx="3.08024"> </tspan>of<tspan data-gap="" dx="3.08024"> </tspan>something<tspan data-gap="" dx="3.08024"> </tspan>present<tspan data-gap="" dx="3.08024"> </tspan>in<tspan data-gap="" dx="3.08024"> </tspan>lemons</tspan><tspan x="89" dy="31">and oranges and absent from salted meat.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">11</text></g><!-- /botanical-footer --></svg></div></div></section>
