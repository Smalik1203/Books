<section class="page page--food page--science-editorial" data-science-chapter="3" data-folio="31" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Food on Our Plate, page 31"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><circle class="se-botanical-stem" cx="46" cy="30" r="21"/><circle class="se-botanical-stem" cx="46" cy="30" r="14"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 3</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Food on Our Plate</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124.06"><tspan x="89">Beyond the Book</tspan></text><image class="science-illustration" href="../../figures/reference/food/p028-packets.png" x="657" y="152" width="306" height="235" preserveAspectRatio="xMidYMid meet"><title>packets</title></image><text class="se-copy" x="89" y="175"><tspan x="89">• Read three labels. Next time groceries are</tspan><tspan x="89" dy="31">unpacked at home, find three packaged items and</tspan><tspan x="89" dy="31">copy their nutrition panels. Rank them from best to</tspan><tspan x="89" dy="31">worst as an everyday food and write two lines</tspan><tspan x="89" dy="31">defending your ranking.</tspan></text><image class="science-illustration" href="../../figures/reference/food/p028-traditional-salt.png" x="657" y="415" width="306" height="235" preserveAspectRatio="xMidYMid meet"><title>traditional salt</title></image><text class="se-copy" x="89" y="438"><tspan x="89">Salt without a factory. The Apatani people of</tspan><tspan x="89" dy="31">Arunachal Pradesh traditionally make a salt called</tspan><tspan x="89" dy="31">tapyo from plant ash rather than from seawater or</tspan><tspan x="89" dy="31">rock. Find out how, and why a community would</tspan><tspan x="89" dy="31">develop such a method. Write a short account with</tspan><tspan x="89" dy="31">pictures.</tspan></text><image class="science-illustration" href="../../figures/reference/food/p028-wild-food.png" x="657" y="678" width="306" height="235" preserveAspectRatio="xMidYMid meet"><title>wild food</title></image><text class="se-copy" x="89" y="701"><tspan x="89">Wild food near you. In many parts of India people</tspan><tspan x="89" dy="31">gather uncultivated greens, fruit and mushrooms —</tspan><tspan x="89" dy="31">the ranbhajis of Maharashtra are one example. find</tspan><tspan x="89" dy="31">out whether anything is gathered wild near your</tspan><tspan x="89" dy="31">town. Ask an older person; they will know things the</tspan><tspan x="89" dy="31">internet does not.</tspan></text><image class="science-illustration" href="../../figures/reference/food/p028-letter-meal.png" x="657" y="941" width="306" height="235" preserveAspectRatio="xMidYMid meet"><title>letter meal</title></image><text class="se-copy" x="89" y="964"><tspan x="89">• Write to your principal. With your classmates, list</tspan><tspan x="89" dy="31">the junk foods most often eaten in your school.</tspan><tspan x="89" dy="31">Then write a joint letter to your principal proposing</tspan><tspan x="89" dy="31">which to remove from the canteen and what to offer</tspan><tspan x="89" dy="31">instead. Cost your alternatives — a proposal nobody</tspan><tspan x="89" dy="31">can afford will be refused.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">31</text></g><!-- /botanical-footer --></svg></div></div></section>
