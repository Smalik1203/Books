<section class="page page--food page--science-editorial" data-science-chapter="3" data-folio="22"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Food on Our Plate, page 22"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><circle class="se-botanical-stem" cx="46" cy="30" r="21"/><circle class="se-botanical-stem" cx="46" cy="30" r="14"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 3</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Food on Our Plate</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><g aria-label="Activity 3.7 · Test for protein"><rect class="se-activity-panel" x="89" y="110" width="874" height="775"/><path class="se-activity-tab" d="M109 96H943Q963 96 963 116V139H89V116Q89 96 109 96Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="102" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="123"><tspan x="149">Investigate</tspan></text><text class="se-copy se-table-copy" x="113" y="365.4"><tspan x="113">Teacher demonstration — precautions. • Copper sulfate and caustic soda are harmful chemicals.</tspan><tspan x="113" dy="25">Do not touch them unless your teacher tells you to. If any chemical touches your skin, wash the area</tspan><tspan x="113" dy="25">with plenty of water at once and tell your teacher. • Never put these chemicals in your mouth. Do</tspan><tspan x="113" dy="25">not try to smell them. Use a separate dropper for each chemical. Never return unused chemical to</tspan><tspan x="113" dy="25">its bottle. Wash your hands when you have finished.</tspan></text><text class="se-copy" x="113" y="183"><tspan x="113">Your teacher will demonstrate this activity. Read the precautions before</tspan><tspan x="113" dy="31">anything else.</tspan></text><text class="se-copy" x="113" y="259"><tspan x="113">The teacher should include egg white as a positive control and water as a</tspan><tspan x="113" dy="31">negative control. Keep sample amounts and waiting times alike. Record</tspan><tspan x="113" dy="31">observations before interpreting them.</tspan></text><text class="se-copy" x="113" y="511"><tspan x="113">You will need: the same food samples; pestle and mortar; clean test tubes; two</tspan><tspan x="113" dy="31">droppers; copper sulfate solution; caustic soda solution.</tspan></text><text class="se-activity-step" x="113" y="587"><tspan x="113">1.</tspan></text><text class="se-copy" x="151" y="587"><tspan x="151">Grind each food sample into a paste or powder with the pestle and mortar.</tspan></text><text class="se-activity-step" x="113" y="632"><tspan x="113">2.</tspan></text><text class="se-copy" x="151" y="632"><tspan x="151">Put about half a teaspoon of each into a separate clean test tube.</tspan></text><text class="se-activity-step" x="113" y="677"><tspan x="113">3.</tspan></text><text class="se-copy" x="151" y="677"><tspan x="151">Add two or three teaspoons of water to each tube and shake well.</tspan></text><text class="se-activity-step" x="113" y="722"><tspan x="113">4.</tspan></text><text class="se-copy" x="151" y="722"><tspan x="151">Using one dropper, add two drops of copper sulfate solution to each tube.</tspan></text><text class="se-activity-step" x="113" y="767"><tspan x="113">5.</tspan></text><text class="se-copy" x="151" y="767"><tspan x="151">Using a different dropper, add ten drops of caustic soda solution to each</tspan><tspan x="151" dy="31">tube.</tspan></text><text class="se-activity-step" x="113" y="843"><tspan x="113">6.</tspan></text><text class="se-copy" x="151" y="843"><tspan x="151">Shake, then leave the tubes undisturbed for a few minutes.</tspan></text></g><rect class="se-prompt" x="89" y="901" width="874" height="148"/><line class="se-think-rule" x1="89" x2="963" y1="901" y2="901"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What Did You Notice?"><svg class="se-feature-icon se-feature--observe" x="113" y="910" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="939">What Did You Notice?</text></g><text class="se-copy" data-measure="826" x="113" y="995"><tspan x="113">Compare<tspan data-gap="" dx="6.20300"> </tspan>each<tspan data-gap="" dx="6.20300"> </tspan>sample<tspan data-gap="" dx="6.20300"> </tspan>with<tspan data-gap="" dx="6.20300"> </tspan>both<tspan data-gap="" dx="6.20300"> </tspan>controls.<tspan data-gap="" dx="6.20300"> </tspan>What<tspan data-gap="" dx="6.20300"> </tspan>changed?<tspan data-gap="" dx="6.20300"> </tspan>Did<tspan data-gap="" dx="6.20300"> </tspan>the<tspan data-gap="" dx="6.20300"> </tspan>controls</tspan><tspan x="113" dy="31">behave as expected? What would you repeat before concluding absence?</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">22</text></g><!-- /botanical-footer --></svg></div></div></section>
