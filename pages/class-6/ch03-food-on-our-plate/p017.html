 </tspan>a<tspan data-gap="" dx="0.82542"> </tspan>food<tspan data-gap="" dx="0.82542"> </tspan>at<tspan data-gap="" dx="0.82542"> </tspan>all.<tspan data-gap="" dx="0.82542"> </tspan>Which<tspan data-gap="" dx="0.82542"> </tspan>one<tspan data-gap="" dx="0.82542"> </tspan>—</tspan><tspan x="113" dy="31">and what does that tell you about spending time outdoors?</tspan></text><text class="se-heading" x="89" y="286.06"><tspan x="89">3.4 Cooking, Roughage and Water</tspan></text><text class="se-copy" data-measure="874" x="89" y="337"><tspan x="89">Have<tspan data-gap="" dx="0.61083"> </tspan>you<tspan data-gap="" dx="0.61083"> </tspan>noticed<tspan data-gap="" dx="0.61083"> </tspan>that<tspan data-gap="" dx="0.61083"> </tspan>a<tspan data-gap="" dx="0.61083"> </tspan>raw<tspan data-gap="" dx="0.61083"> </tspan>carrot<tspan data-gap="" dx="0.61083"> </tspan>snaps<tspan data-gap="" dx="0.61083"> </tspan>and<tspan data-gap="" dx="0.61083"> </tspan>a<tspan data-gap="" dx="0.61083"> </tspan>boiled<tspan data-gap="" dx="0.61083"> </tspan>one<tspan data-gap="" dx="0.61083"> </tspan>bends?<tspan data-gap="" dx="0.61083"> </tspan>That<tspan data-gap="" dx="0.61083"> </tspan>spinach<tspan data-gap="" dx="0.61083"> </tspan>loses</tspan><tspan x="89" dy="31">its bright green in the pan?</tspan></text><text class="se-copy" data-measure="874" x="89" y="413"><tspan x="89">Heat<tspan data-gap="" dx="2.54731"> </tspan>changes<tspan data-gap="" dx="2.54731"> </tspan>food,<tspan data-gap="" dx="2.54731"> </tspan>and<tspan data-gap="" dx="2.54731"> </tspan>not<tspan data-gap="" dx="2.54731"> </tspan>only<tspan data-gap="" dx="2.54731"> </tspan>in<tspan data-gap="" dx="2.54731"> </tspan>ways<tspan data-gap="" dx="2.54731"> </tspan>we<tspan data-gap="" dx="2.54731"> </tspan>can<tspan data-gap="" dx="2.54731"> </tspan>see.<tspan data-gap="" dx="2.54731"> </tspan>Some<tspan data-gap="" dx="2.54731"> </tspan>nutrients<tspan data-gap="" dx="2.54731"> </tspan>—<tspan data-gap="" dx="2.54731"> </tspan>Vitamin<tspan data-gap="" dx="2.54731"> </tspan>C</tspan><tspan x="89" dy="31">among<tspan data-gap="" dx="0.83034"> </tspan>them<tspan data-gap="" dx="0.83034"> </tspan>—<tspan data-gap="" dx="0.83034"> </tspan>are<tspan data-gap="" dx="0.83034"> </tspan>partly<tspan data-gap="" dx="0.83034"> </tspan>destroyed<tspan data-gap="" dx="0.83034"> </tspan>by<tspan data-gap="" dx="0.83034"> </tspan>high<tspan data-gap="" dx="0.83034"> </tspan>heat.<tspan data-gap="" dx="0.83034"> </tspan>Washing<tspan data-gap="" dx="0.83034"> </tspan>vegetables<tspan data-gap="" dx="0.83034"> </tspan>and<tspan data-gap="" dx="0.83034"> </tspan>fruit<tspan data-gap="" dx="0.83034"> </tspan>after</tspan><tspan x="89" dy="31">cutting or peeling them washes some vitamins away as well.</tspan></text><text class="se-copy" data-measure="874" x="89" y="520"><tspan x="89">Two<tspan data-gap="" dx="0.48899"> </tspan>sensible<tspan data-gap="" dx="0.48899"> </tspan>conclusions<tspan data-gap="" dx="0.48899"> </tspan>follow.<tspan data-gap="" dx="0.48899"> </tspan>First,<tspan data-gap="" dx="0.48899"> </tspan>include<tspan data-gap="" dx="0.48899"> </tspan>some<tspan data-gap="" dx="0.48899"> </tspan>fruit<tspan data-gap="" dx="0.48899"> </tspan>and<tspan data-gap="" dx="0.48899"> </tspan>raw<tspan data-gap="" dx="0.48899"> </tspan>vegetables<tspan data-gap="" dx="0.48899"> </tspan>in<tspan data-gap="" dx="0.48899"> </tspan>your</tspan><tspan x="89" dy="31">diet<tspan data-gap="" dx="0.04678"> </tspan>so<tspan data-gap="" dx="0.04678"> </tspan>that<tspan data-gap="" dx="0.04678"> </tspan>not<tspan data-gap="" dx="0.04678"> </tspan>everything<tspan data-gap="" dx="0.04678"> </tspan>you<tspan data-gap="" dx="0.04678"> </tspan>eat<tspan data-gap="" dx="0.04678"> </tspan>has<tspan data-gap="" dx="0.04678"> </tspan>been<tspan data-gap="" dx="0.04678"> </tspan>through<tspan data-gap="" dx="0.04678"> </tspan>a<tspan data-gap="" dx="0.04678"> </tspan>hot<tspan data-gap="" dx="0.04678"> </tspan>pan.<tspan data-gap="" dx="0.04678"> </tspan>Second,<tspan data-gap="" dx="0.04678"> </tspan>wash<tspan data-gap="" dx="0.04678"> </tspan>produce</tspan><tspan x="89" dy="31">before you cut it, not after.</tspan></text><text class="se-copy" data-measure="874" x="89" y="627"><tspan x="89">But<tspan data-gap="" dx="3.91435"> </tspan>do<tspan data-gap="" dx="3.91435"> </tspan>wash<tspan data-gap="" dx="3.91435"> </tspan>it.<tspan data-gap="" dx="3.91435"> </tspan>Thoroughly,<tspan data-gap="" dx="3.91435"> </tspan>every<tspan data-gap="" dx="3.91435"> </tspan>time.<tspan data-gap="" dx="3.91435"> </tspan>The<tspan data-gap="" dx="3.91435"> </tspan>vitamins<tspan data-gap="" dx="3.91435"> </tspan>lost<tspan data-gap="" dx="3.91435"> </tspan>to<tspan data-gap="" dx="3.91435"> </tspan>washing<tspan data-gap="" dx="3.91435"> </tspan>are<tspan data-gap="" dx="3.91435"> </tspan>a<tspan data-gap="" dx="3.91435"> </tspan>small</tspan><tspan x="89" dy="31">price against the dirt, pesticide residue and germs that washing removes.</tspan></text><image class="science-illustration" href="../../figures/reference/food/p016-aarav.png" x="89" y="680" width="235" height="140" preserveAspectRatio="xMidYMid meet"><title>aarav</title></image><image class="science-illustration" href="../../figures/reference/food/p016-ira.png" x="89" y="830" width="235" height="140" preserveAspectRatio="xMidYMid meet"><title>ira</title></image><text class="se-copy" x="358" y="703"><tspan x="358">Ira: So every nutrient we need comes from a plant or an</tspan><tspan x="358" dy="31">animal?</tspan></text><text class="se-copy" x="358" y="777"><tspan x="358">Aarav: That's what the chapter says.</tspan></text><text class="se-copy" x="358" y="820"><tspan x="358">Ira: Then where does salt come from? Not a plant. Not an</tspan><tspan x="358" dy="31">animal.</tspan></text><text class="se-copy" x="358" y="894"><tspan x="358">Aarav: Seawater. Or rock.</tspan></text><text class="se-copy" x="358" y="937"><tspan x="358">Ira: And Vitamin D — the teacher said our own skin</tspan><tspan x="358" dy="31">makes it in sunlight. That isn't food either.</tspan></text><text class="se-copy" data-measure="874" x="89" y="1029"><tspan x="89">Two<tspan data-gap="" dx="-0.01075"> </tspan>further<tspan data-gap="" dx="-0.01075"> </tspan>components<tspan data-gap="" dx="-0.01075"> </tspan>to<tspan data-gap="" dx="-0.01075"> </tspan>consider<tspan data-gap="" dx="-0.01075"> </tspan>are<tspan data-gap="" dx="-0.01075"> </tspan>dietary<tspan data-gap="" dx="-0.01075"> </tspan>fibre<tspan data-gap="" dx="-0.01075"> </tspan>and<tspan data-gap="" dx="-0.01075"> </tspan>water.<tspan data-gap="" dx="-0.01075"> </tspan>Water<tspan data-gap="" dx="-0.01075"> </tspan>is<tspan data-gap="" dx="-0.01075"> </tspan>an<tspan data-gap="" dx="-0.01075"> </tspan>essential</tspan><tspan x="89" dy="31">nutrient even though it supplies no energy.</tspan></text><text class="se-copy" data-measure="874" x="89" y="1105"><tspan x="89">Dietary<tspan data-gap="" dx="4.73100"> </tspan>fibre,<tspan data-gap="" dx="4.73100"> </tspan>or<tspan data-gap="" dx="4.73100"> </tspan>roughage,<tspan data-gap="" dx="4.73100"> </tspan>comes<tspan data-gap="" dx="4.73100"> </tspan>mainly<tspan data-gap="" dx="4.73100"> </tspan>from<tspan data-gap="" dx="4.73100"> </tspan>plant<tspan data-gap="" dx="4.73100"> </tspan>foods<tspan data-gap="" dx="4.73100"> </tspan>such<tspan data-gap="" dx="4.73100"> </tspan>as<tspan data-gap="" dx="4.73100"> </tspan>whole<tspan data-gap="" dx="4.73100"> </tspan>grains,</tspan><tspan x="89" dy="31">pulses,<tspan data-gap="" dx="6.67099"> </tspan>fruit<tspan data-gap="" dx="6.67099"> </tspan>and<tspan data-gap="" dx="6.67099"> </tspan>vegetables.<tspan data-gap="" dx="6.67099"> </tspan>Our<tspan data-gap="" dx="6.67099"> </tspan>own<tspan data-gap="" dx="6.67099"> </tspan>digestive<tspan data-gap="" dx="6.67099"> </tspan>enzymes<tspan data-gap="" dx="6.67099"> </tspan>do<tspan data-gap="" dx="6.67099"> </tspan>not<tspan data-gap="" dx="6.67099"> </tspan>break<tspan data-gap="" dx="6.67099"> </tspan>it<tspan data-gap="" dx="6.67099"> </tspan>down,</tspan><tspan x="89" dy="31">although<tspan data-gap="" dx="6.29070"> </tspan>gut<tspan data-gap="" dx="6.29070"> </tspan>microbes<tspan data-gap="" dx="6.29070"> </tspan>can<tspan data-gap="" dx="6.29070"> </tspan>break<tspan data-gap="" dx="6.29070"> </tspan>down<tspan data-gap="" dx="6.29070"> </tspan>some<tspan data-gap="" dx="6.29070"> </tspan>fibre.<tspan data-gap="" dx="6.29070"> </tspan>Fibre<tspan data-gap="" dx="6.29070"> </tspan>helps<tspan data-gap="" dx="6.29070"> </tspan>bowel<tspan data-gap="" dx="6.29070"> </tspan>function;</tspan><tspan x="89" dy="31">constipation can have several causes.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">17</text></g><!-- /botanical-footer --></svg></div></div></section>
