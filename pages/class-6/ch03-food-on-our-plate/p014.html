h="874" height="259" rx="10"/><text class="se-heading" x="113" y="459.06"><tspan x="113">Vitamin A</tspan></text><image class="science-illustration" href="../../figures/reference/food/p014-a-sources.png" x="113" y="479" width="240" height="130" preserveAspectRatio="xMidYMid meet"><title>a sources</title></image><text class="se-copy se-table-copy" x="113" y="637.4"><tspan x="113">Papaya, carrot, mango, milk</tspan></text><text class="se-copy se-table-copy" x="386" y="497.4"><tspan x="386">What it does: Keeps eyes and skin healthy</tspan></text><text class="se-copy se-table-copy" x="386" y="538.4"><tspan x="386">Deficiency disorder: Loss of vision</tspan></text><text class="se-copy se-table-copy" x="386" y="579.4"><tspan x="386">Possible signs; not a diagnosis: Poor vision; loss of vision in dim</tspan><tspan x="386" dy="25">light (night blindness); in severe cases, complete loss of vision</tspan></text><rect class="se-reference-card" x="89" y="694" width="874" height="284" rx="10"/><text class="se-heading" x="113" y="736.06"><tspan x="113">Vitamin B₁</tspan></text><image class="science-illustration" href="../../figures/reference/food/p014-b-sources.png" x="113" y="756" width="240" height="130" preserveAspectRatio="xMidYMid meet"><title>b sources</title></image><text class="se-copy se-table-copy" x="113" y="914.4"><tspan x="113">Legumes, nuts, whole grains,</tspan><tspan x="113" dy="25">seeds, milk products</tspan></text><text class="se-copy se-table-copy" x="386" y="774.4"><tspan x="386">What it does: Helps release energy from food and supports nerve</tspan><tspan x="386" dy="25">function</tspan></text><text class="se-copy se-table-copy" x="386" y="840.4"><tspan x="386">Deficiency disorder: Beriberi</tspan></text><text class="se-copy se-table-copy" x="386" y="881.4"><tspan x="386">Possible signs; not a diagnosis: Swelling, tingling or burning in</tspan><tspan x="386" dy="25">the feet and hands; difficulty in breathing</tspan></text><rect class="se-reference-card" x="89" y="996" width="874" height="284" rx="10"/><text class="se-heading" x="113" y="1038.06"><tspan x="113">Vitamin C</tspan></text><image class="science-illustration" href="../../figures/reference/food/p014-c-sources.png" x="113" y="1058" width="240" height="130" preserveAspectRatio="xMidYMid meet"><title>c sources</title></image><text class="se-copy se-table-copy" x="113" y="1216.4"><tspan x="113">Amla, guava, green chilli,</tspan><tspan x="113" dy="25">orange, lemon</tspan></text><text class="se-copy se-table-copy" x="386" y="1076.4"><tspan x="386">What it does: Needed to make collagen for connective tissues and</tspan><tspan x="386" dy="25">wound healing</tspan></text><text class="se-copy se-table-copy" x="386" y="1142.4"><tspan x="386">Deficiency disorder: Scurvy</tspan></text><text class="se-copy se-table-copy" x="386" y="1183.4"><tspan x="386">Possible signs; not a diagnosis: Bleeding gums; wounds heal</tspan><tspan x="386" dy="25">slowly</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">14</text></g><!-- /botanical-footer --></svg></div></div></section>
