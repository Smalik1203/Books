<tspan data-gap="" dx="3.53015"> </tspan>and<tspan data-gap="" dx="3.53015"> </tspan>minerals<tspan data-gap="" dx="3.53015"> </tspan>are<tspan data-gap="" dx="3.53015"> </tspan>nutrient<tspan data-gap="" dx="3.53015"> </tspan>groups<tspan data-gap="" dx="3.53015"> </tspan>studied</tspan><tspan x="89" dy="31">here. Water is also an essential nutrient. Food supplies dietary fibre as well.</tspan></text><text class="se-copy" data-measure="874" x="89" y="465"><tspan x="89">•<tspan data-gap="" dx="6.28526"> </tspan>Carbohydrates<tspan data-gap="" dx="6.28526"> </tspan>and<tspan data-gap="" dx="6.28526"> </tspan>fats<tspan data-gap="" dx="6.28526"> </tspan>supply<tspan data-gap="" dx="6.28526"> </tspan>energy<tspan data-gap="" dx="6.28526"> </tspan>and<tspan data-gap="" dx="6.28526"> </tspan>are<tspan data-gap="" dx="6.28526"> </tspan>called<tspan data-gap="" dx="6.28526"> </tspan>energy-giving<tspan data-gap="" dx="6.28526"> </tspan>foods.<tspan data-gap="" dx="6.28526"> </tspan>Fat</tspan><tspan x="89" dy="31">carries more energy per gram than carbohydrate and is the body's store.</tspan></text><text class="se-copy" data-measure="874" x="89" y="541"><tspan x="89">•<tspan data-gap="" dx="3.59877"> </tspan>Proteins<tspan data-gap="" dx="3.59877"> </tspan>build<tspan data-gap="" dx="3.59877"> </tspan>and<tspan data-gap="" dx="3.59877"> </tspan>repair<tspan data-gap="" dx="3.59877"> </tspan>the<tspan data-gap="" dx="3.59877"> </tspan>body<tspan data-gap="" dx="3.59877"> </tspan>and<tspan data-gap="" dx="3.59877"> </tspan>are<tspan data-gap="" dx="3.59877"> </tspan>called<tspan data-gap="" dx="3.59877"> </tspan>body-building<tspan data-gap="" dx="3.59877"> </tspan>foods.<tspan data-gap="" dx="3.59877"> </tspan>Growing</tspan><tspan x="89" dy="31">children and athletes need proportionally more.</tspan></text><text class="se-copy" data-measure="874" x="89" y="617"><tspan x="89">•<tspan data-gap="" dx="2.05848"> </tspan>Lack<tspan data-gap="" dx="2.05848"> </tspan>of<tspan data-gap="" dx="2.05848"> </tspan>a<tspan data-gap="" dx="2.05848"> </tspan>nutrient<tspan data-gap="" dx="2.05848"> </tspan>can<tspan data-gap="" dx="2.05848"> </tspan>cause<tspan data-gap="" dx="2.05848"> </tspan>a<tspan data-gap="" dx="2.05848"> </tspan>deficiency<tspan data-gap="" dx="2.05848"> </tspan>disorder.<tspan data-gap="" dx="2.05848"> </tspan>Symptoms<tspan data-gap="" dx="2.05848"> </tspan>can<tspan data-gap="" dx="2.05848"> </tspan>also<tspan data-gap="" dx="2.05848"> </tspan>have<tspan data-gap="" dx="2.05848"> </tspan>other</tspan><tspan x="89" dy="31">causes,<tspan data-gap="" dx="7.09612"> </tspan>so<tspan data-gap="" dx="7.09612"> </tspan>medical<tspan data-gap="" dx="7.09612"> </tspan>assessment<tspan data-gap="" dx="7.09612"> </tspan>matters.<tspan data-gap="" dx="7.09612"> </tspan>Examples<tspan data-gap="" dx="7.09612"> </tspan>include<tspan data-gap="" dx="7.09612"> </tspan>Vitamin<tspan data-gap="" dx="7.09612"> </tspan>C<tspan data-gap="" dx="7.09612"> </tspan>deficiency</tspan><tspan x="89" dy="31">causing scurvy and iodine deficiency contributing to goitre.</tspan></text><text class="se-copy" data-measure="874" x="89" y="724"><tspan x="89">•<tspan data-gap="" dx="1.99358"> </tspan>Dietary<tspan data-gap="" dx="1.99358"> </tspan>fibre<tspan data-gap="" dx="1.99358"> </tspan>resists<tspan data-gap="" dx="1.99358"> </tspan>digestion<tspan data-gap="" dx="1.99358"> </tspan>by<tspan data-gap="" dx="1.99358"> </tspan>our<tspan data-gap="" dx="1.99358"> </tspan>own<tspan data-gap="" dx="1.99358"> </tspan>enzymes;<tspan data-gap="" dx="1.99358"> </tspan>gut<tspan data-gap="" dx="1.99358"> </tspan>microbes<tspan data-gap="" dx="1.99358"> </tspan>can<tspan data-gap="" dx="1.99358"> </tspan>break<tspan data-gap="" dx="1.99358"> </tspan>down</tspan><tspan x="89" dy="31">some<tspan data-gap="" dx="3.51343"> </tspan>of<tspan data-gap="" dx="3.51343"> </tspan>it.<tspan data-gap="" dx="3.51343"> </tspan>Fibre<tspan data-gap="" dx="3.51343"> </tspan>helps<t n>supplies<tspan data-gap="" dx="4.64517"> </tspan>all<tspan data-gap="" dx="4.64517"> </tspan>the<tspan data-gap="" dx="4.64517"> </tspan>nutrients<tspan data-gap="" dx="4.64517"> </tspan>a<tspan data-gap="" dx="4.64517"> </tspan>particular<tspan data-gap="" dx="4.64517"> </tspan>person<tspan data-gap="" dx="4.64517"> </tspan>needs,<tspan data-gap="" dx="4.64517"> </tspan>in<tspan data-gap="" dx="4.64517"> </tspan>the<tspan data-gap="" dx="4.64517"> </tspan>right</tspan><tspan x="89" dy="31">amounts,<tspan data-gap="" dx="3.11771"> </tspan>with<tspan data-gap="" dx="3.11771"> </tspan>enough<tspan data-gap="" dx="3.11771"> </tspan>roughage<tspan data-gap="" dx="3.11771"> </tspan>and<tspan data-gap="" dx="3.11771"> </tspan>water.<tspan data-gap="" dx="3.11771"> </tspan>What<tspan data-gap="" dx="3.11771"> </tspan>is<tspan data-gap="" dx="3.11771"> </tspan>balanced<tspan data-gap="" dx="3.11771"> </tspan>depends<tspan data-gap="" dx="3.11771"> </tspan>on<tspan data-gap="" dx="3.11771"> </tspan>age,<tspan data-gap="" dx="3.11771"> </tspan>sex,</tspan><tspan x="89" dy="31">activity, health and way of life.</tspan></text><text class="se-copy" data-measure="874" x="89" y="1045"><tspan x="89">•<tspan data-gap="" dx="3.81118"> </tspan>Junk<tspan data-gap="" dx="3.81118"> </tspan>foods<tspan data-gap="" dx="3.81118"> </tspan>carry<tspan data-gap="" dx="3.81118"> </tspan>plenty<tspan data-gap="" dx="3.81118"> </tspan>of<tspan data-gap="" dx="3.81118"> </tspan>energy<tspan data-gap="" dx="3.81118"> </tspan>from<tspan data-gap="" dx="3.81118"> </tspan>sugar<tspan data-gap="" dx="3.81118"> </tspan>and<tspan data-gap="" dx="3.81118"> </tspan>fat<tspan data-gap="" dx="3.81118"> </tspan>and<tspan data-gap="" dx="3.81118"> </tspan>little<tspan data-gap="" dx="3.81118"> </tspan>else.<tspan data-gap="" dx="3.81118"> </tspan>Millets<tspan data-gap="" dx="3.81118"> </tspan>are</tspan><tspan x="89" dy="31">called<tspan data-gap="" dx="11.70388"> </tspan>nutri-cereals<tspan data-gap="" dx
