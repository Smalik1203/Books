<section class="page page--food page--science-editorial" data-science-chapter="3" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Food on Our Plate, page 3"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><circle class="se-botanical-stem" cx="46" cy="30" r="21"/><circle class="se-botanical-stem" cx="46" cy="30" r="14"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 3</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Food on Our Plate</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-copy" data-measure="874" x="89" y="119"><tspan x="89">Next,<tspan data-gap="" dx="3.56649"> </tspan>compare.<tspan data-gap="" dx="3.56649"> </tspan>Ask<tspan data-gap="" dx="3.56649"> </tspan>three<tspan data-gap="" dx="3.56649"> </tspan>classmates<tspan data-gap="" dx="3.56649"> </tspan>to<tspan data-gap="" dx="3.56649"> </tspan>show<tspan data-gap="" dx="3.56649"> </tspan>you<tspan data-gap="" dx="3.56649"> </tspan>their<tspan data-gap="" dx="3.56649"> </tspan>tables.<tspan data-gap="" dx="3.56649"> </tspan>Find<tspan data-gap="" dx="3.56649"> </tspan>one<tspan data-gap="" dx="3.56649"> </tspan>food<tspan data-gap="" dx="3.56649"> </tspan>that</tspan><tspan x="89" dy="31">appears<tspan data-gap="" dx="0.99187"> </tspan>in<tspan data-gap="" dx="0.99187"> </tspan>all<tspan data-gap="" dx="0.99187"> </tspan>four<tspan data-gap="" dx="0.99187"> </tspan>diaries,<tspan data-gap="" dx="0.99187"> </tspan>and<tspan data-gap="" dx="0.99187"> </tspan>one<tspan data-gap="" dx="0.99187"> </tspan>food<tspan data-gap="" dx="0.99187"> </tspan>that<tspan data-gap="" dx="0.99187"> </tspan>appears<tspan data-gap="" dx="0.99187"> </tspan>in<tspan data-gap="" dx="0.99187"> </tspan>only<tspan data-gap="" dx="0.99187"> </tspan>one.<tspan data-gap="" dx="0.99187"> </tspan>Comparing<tspan data-gap="" dx="0.99187"> </tspan>is<tspan data-gap="" dx="0.99187"> </tspan>how</tspan><tspan x="89" dy="31">we tell what is common from what is particular.</tspan></text><text class="se-copy" data-measure="874" x="89" y="226"><tspan x="89">Your<tspan data-gap="" dx="0.29904"> </tspan>diaries<tspan data-gap="" dx="0.29904"> </tspan>may<tspan data-gap="" dx="0.29904"> </tspan>share<tspan data-gap="" dx="0.29904"> </tspan>ingredients,<tspan data-gap="" dx="0.29904"> </tspan>but<tspan data-gap="" dx="0.29904"> </tspan>check<tspan data-gap="" dx="0.29904"> </tspan>rather<tspan data-gap="" dx="0.29904"> </tspan>than<tspan data-gap="" dx="0.29904"> </tspan>assume<tspan data-gap="" dx="0.29904"> </tspan>this.<tspan data-gap="" dx="0.29904"> </tspan>A<tspan data-gap="" dx="0.29904"> </tspan>food<tspan data-gap="" dx="0.29904"> </tspan>absent</tspan><tspan x="89" dy="31">from<tspan data-gap="" dx="3.46254"> </tspan>four<tspan data-gap="" dx="3.46254"> </tspan>diaries<tspan data-gap="" dx="3.46254"> </tspan>may<tspan data-gap="" dx="3.46254"> </tspan>appear<tspan data-gap="" dx="3.46254"> </tspan>in<tspan data-gap="" dx="3.46254"> </tspan>another<tspan data-gap="" dx="3.46254"> </tspan>household.<tspan data-gap="" dx="3.46254"> </tspan>Four<tspan data-gap="" dx="3.46254"> </tspan>diaries<tspan data-gap="" dx="3.46254"> </tspan>cannot<tspan data-gap="" dx="3.46254"> </tspan>represent</tspan><tspan x="89" dy="31">the whole class or region.</tspan></text><text class="se-copy" data-measure="874" x="89" y="333"><tspan x="89">So<tspan data-gap="" dx="1.21440"> </tspan>even<tspan data-gap="" dx="1.21440"> </tspan>inside<tspan data-gap="" dx="1.21440"> </tspan>a<tspan data-gap="" dx="1.21440"> </tspan>single<tspan data-gap="" dx="1.21440"> </tspan>classroom,<tspan data-gap="" dx="1.21440"> </tspan>food<tspan data-gap="" dx="1.21440"> </tspan>is<tspan data-gap="" dx="1.21440"> </tspan>not<tspan data-gap="" dx="1.21440"> </tspan>one<tspan data-gap="" dx="1.21440"> </tspan>thing.<tspan data-gap="" dx="1.21440"> </tspan>It<tspan data-gap="" dx="1.21440"> </tspan>varies.<tspan data-gap="" dx="1.21440"> </tspan>The<tspan data-gap="" dx="1.21440"> </tspan>next<tspan data-gap="" dx="1.21440"> </tspan>question</tspan><tspan x="89" dy="31">is why.</tspan></text><text class="se-heading" x="89" y="414.06"><tspan x="89">3.1.1 Food varies from place to place</tspan></text><text class="se-copy" data-measure="874" x="89" y="465"><tspan x="89">A<tspan data-gap="" dx="0.77379"> </tspan>traveller<tspan data-gap="" dx="0.77379"> </tspan>eating<tspan data-gap="" dx="0.77379"> </tspan>in<tspan data-gap="" dx="0.77379"> </tspan>Amritsar,<tspan data-gap="" dx="0.77379"> </tspan>Bengaluru<tspan data-gap="" dx="0.77379"> </tspan>and<tspan data-gap="" dx="0.77379"> </tspan>Imphal<tspan data-gap="" dx="0.77379"> </tspan>could<tspan data-gap="" dx="0.77379"> </tspan>find<tspan data-gap="" dx="0.77379"> </tspan>different<tspan data-gap="" dx="0.77379"> </tspan>dishes<tspan data-gap="" dx="0.77379"> </tspan>and</tspan><tspan x="89" dy="31">shared<tspan data-gap="" dx="4.63203"> </tspan>ingredients.<tspan data-gap="" dx="4.63203"> </tspan>A<tspan data-gap="" dx="4.63203"> </tspan>regional<tspan data-gap="" dx="4.63203"> </tspan>label<tspan data-gap="" dx="4.63203"> </tspan>does<tspan data-gap="" dx="4.63203"> </tspan>not<tspan data-gap="" dx="4.63203"> </tspan>describe<tspan data-gap="" dx="4.63203"> </tspan>every<tspan data-gap="" dx="4.63203"> </tspan>household.<tspan data-gap="" dx="4.63203"> </tspan>Compare</tspan><tspan x="89" dy="31">examples before generalising.</tspan></text><text class="se-copy" data-measure="874" x="89" y="572"><tspan x="89">That<tspan data-gap="" dx="0.10323"> </tspan>is<tspan data-gap="" dx="0.10323"> </tspan>not<tspan data-gap="" dx="0.10323"> </tspan>an<tspan data-gap="" dx="0.10323"> </tspan>accident,<tspan data-gap="" dx="0.10323"> </tspan>and<tspan data-gap="" dx="0.10323"> </tspan>it<tspan data-gap="" dx="0.10323"> </tspan>is<tspan data-gap="" dx="0.10323"> </tspan>not<tspan data-gap="" dx="0.10323"> </tspan>only<tspan data-gap="" dx="0.10323"> </tspan>a<tspan data-gap="" dx="0.10323"> </tspan>matter<tspan data-gap="" dx="0.10323"> </tspan>of<tspan data-gap="" dx="0.10323"> </tspan>taste.<tspan data-gap="" dx="0.10323"> </tspan>Let<tspan data-gap="" dx="0.10323"> </tspan>us<tspan data-gap="" dx="0.10323"> </tspan>gather<tspan data-gap="" dx="0.10323"> </tspan>the<tspan data-gap="" dx="0.10323"> </tspan>evidence</tspan><tspan x="89" dy="31">first and explain it afterwards.</tspan></text><g aria-label="Activity 3.2 · Map the food of India"><rect class="se-activity-panel" x="89" y="639" width="874" height="343"/><path class="se-activity-tab" d="M109 625H943Q963 625 963 645V668H89V645Q89 625 109 625Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="631" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="652"><tspan x="149">The setup</tspan></text><text class="se-activity-step" x="113" y="712"><tspan x="113">1.</tspan></text><text class="se-copy" x="151" y="712"><tspan x="151">Choose four states of India. Include your own.</tspan></text><text class="se-activity-step" x="113" y="757"><tspan x="113">2.</tspan></text><text class="se-copy" x="151" y="757"><tspan x="151">For each one, find out: which crops are grown there, which dishes are</tspan><tspan x="151" dy="31">traditionally eaten, and what people commonly drink.</tspan></text><text class="se-activity-step" x="113" y="833"><tspan x="113">3.</tspan></text><text class="se-copy" x="151" y="833"><tspan x="151">Use your library, the internet, and — best of all — people. Ask a classmate</tspan><tspan x="151" dy="31">whose family comes from another state. Ask a neighbour.</tspan></text><text class="se-activity-step" x="113" y="909"><tspan x="113">4.</tspan></text><text class="se-copy" x="151" y="909"><tspan x="151">Record your findings in your notebook using the headings in Table 3.2. The</tspan><tspan x="151" dy="31">printed rows are examples.</tspan></text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">3</text></g><!-- /botanical-footer --></svg></div></div></section>
