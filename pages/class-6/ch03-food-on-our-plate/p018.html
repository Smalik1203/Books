<section class="page page--food page--science-editorial" data-science-chapter="3" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Food on Our Plate, page 18"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><circle class="se-botanical-stem" cx="46" cy="30" r="21"/><circle class="se-botanical-stem" cx="46" cy="30" r="14"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 3</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Food on Our Plate</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-copy" data-measure="874" x="89" y="119"><tspan x="89">Water<tspan data-gap="" dx="3.59049"> </tspan>dissolves<tspan data-gap="" dx="3.59049"> </tspan>and<tspan data-gap="" dx="3.59049"> </tspan>transports<tspan data-gap="" dx="3.59049"> </tspan>substances,<tspan data-gap="" dx="3.59049"> </tspan>helps<tspan data-gap="" dx="3.59049"> </tspan>remove<tspan data-gap="" dx="3.59049"> </tspan>waste<tspan data-gap="" dx="3.59049"> </tspan>in<tspan data-gap="" dx="3.59049"> </tspan>urine<tspan data-gap="" dx="3.59049"> </tspan>and<tspan data-gap="" dx="3.59049"> </tspan>helps</tspan><tspan x="89" dy="31">regulate<tspan data-gap="" dx="4.53111"> </tspan>temperature<tspan data-gap="" dx="4.53111"> </tspan>through<tspan data-gap="" dx="4.53111"> </tspan>sweating<tspan data-gap="" dx="4.53111"> </tspan>and<tspan data-gap="" dx="4.53111"> </tspan>evaporation.<tspan data-gap="" dx="4.53111"> </tspan>Needs<tspan data-gap="" dx="4.53111"> </tspan>vary<tspan data-gap="" dx="4.53111"> </tspan>with<tspan data-gap="" dx="4.53111"> </tspan>activity</tspan><tspan x="89" dy="31">and weather. Water is a nutrient, not a source of food energy.</tspan></text><rect class="se-prompt" x="89" y="203" width="874" height="117"/><line class="se-think-rule" x1="89" x2="963" y1="203" y2="203"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What Did You Notice?"><svg class="se-feature-icon se-feature--observe" x="113" y="212" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="241">What Did You Notice?</text></g><text class="se-copy" data-measure="826" x="113" y="297"><tspan x="113">Which foods give you water besides water itself? List four.</tspan></text><text class="se-heading" x="89" y="362.06"><tspan x="89">Coluthur Gopalan (1918-2019)</tspan></text><image class="science-illustration" href="../../figures/reference/food/p017-gopalan.png" x="657" y="390" width="306" height="235" preserveAspectRatio="xMidYMid meet"><title>gopalan</title></image><text class="se-copy" x="89" y="413"><tspan x="89">To study diets in India, researchers needed reliable</tspan><tspan x="89" dy="31">measurements of the foods people ate, along with</tspan><tspan x="89" dy="31">records of amounts and preparation. A foreign food</tspan><tspan x="89" dy="31">table could not represent every local ingredient or</tspan><tspan x="89" dy="31">recipe.</tspan></text><text class="se-copy" data-measure="874" x="89" y="676"><tspan x="89">Coluthur<tspan data-gap="" dx="1.05132"> </tspan>Gopalan<tspan data-gap="" dx="1.05132"> </tspan>set<tspan data-gap="" dx="1.05132"> </tspan>out<tspan data-gap="" dx="1.05132"> </tspan>to<tspan data-gap="" dx="1.05132"> </tspan>find<tspan data-gap="" dx="1.05132"> </tspan>out.<tspan data-gap="" dx="1.05132"> </tspan>Over<tspan data-gap="" dx="1.05132"> </tspan>his<tspan data-gap="" dx="1.05132"> </tspan>career<tspan data-gap="" dx="1.05132"> </tspan>he<tspan data-gap="" dx="1.05132"> </tspan>and<tspan data-gap="" dx="1.05132"> </tspan>his<tspan data-gap="" dx="1.05132"> </tspan>colleagues<tspan data-gap="" dx="1.05132"> </tspan>analysed</tspan><tspan x="89" dy="31">the<tspan data-gap="" dx="3.35737"> </tspan>nutritional<tspan data-gap="" dx="3.35737"> </tspan>content<tspan data-gap="" dx="3.35737"> </tspan>of<tspan data-gap="" dx="3.35737"> </tspan>more<tspan data-gap="" dx="3.35737"> </tspan>than<tspan data-gap="" dx="3.35737"> </tspan>five<tspan data-gap="" dx="3.35737"> </tspan>hundred<tspan data-gap="" dx="3.35737"> </tspan>Indian<tspan data-gap="" dx="3.35737"> </tspan>foods<tspan data-gap="" dx="3.35737"> </tspan>—<tspan data-gap="" dx="3.35737"> </tspan>not<tspan data-gap="" dx="3.35737"> </tspan>foods<tspan data-gap="" dx="3.35737"> </tspan>from</tspan><tspan x="89" dy="31">foreign<tspan data-gap="" dx="2.31349"> </tspan>tables,<tspan data-gap="" dx="2.31349"> </tspan>but<tspan data-gap="" dx="2.31349"> </tspan>the<tspan data-gap="" dx="2.31349"> </tspan>grains,<tspan data-gap="" dx="2.31349"> </tspan>pulses,<tspan data-gap="" dx="2.31349"> </tspan>vegetables<tspan data-gap="" dx="2.31349"> </tspan>and<tspan data-gap="" dx="2.31349"> </tspan>greens<tspan data-gap="" dx="2.31349"> </tspan>that<tspan data-gap="" dx="2.31349"> </tspan>Indian<tspan data-gap="" dx="2.31349"> </tspan>households</tspan><tspan x="89" dy="31">actually<tspan data-gap="" dx="8.63142"> </tspan>cooked.<tspan data-gap="" dx="8.63142"> </tspan>It<tspan data-gap="" dx="8.63142"> </tspan>is<tspan data-gap="" dx="8.63142"> </tspan>difficult,<tspan data-gap="" dx="8.63142"> </tspan>unglamorous<tspan data-gap="" dx="8.63142"> </tspan>laboratory<tspan data-gap="" dx="8.63142"> </tspan>work,<tspan data-gap="" dx="8.63142"> </tspan>and<tspan data-gap="" dx="8.63142"> </tspan>it<tspan data-gap="" dx="8.63142"> </tspan>produced</tspan><tspan x="89" dy="31">something India had never had: reliable numbers for its own diet.</tspan></text><text class="se-copy" data-measure="874" x="89" y="845"><tspan x="89">He<tspan data-gap="" dx="2.96600"> </tspan>then<tspan data-gap="" dx="2.96600"> </tspan>led<tspan data-gap="" dx="2.96600"> </tspan>large<tspan data-gap="" dx="2.96600"> </tspan>surveys<tspan data-gap="" dx="2.96600"> </tspan>of<tspan data-gap="" dx="2.96600"> </tspan>what<tspan data-gap="" dx="2.96600"> </tspan>Indians<tspan data-gap="" dx="2.96600"> </tspan>were<tspan data-gap="" dx="2.96600"> </tspan>eating<tspan data-gap="" dx="2.96600"> </tspan>and<tspan data-gap="" dx="2.96600"> </tspan>how<tspan data-gap="" dx="2.96600"> </tspan>healthy<tspan data-gap="" dx="2.96600"> </tspan>they<tspan data-gap="" dx="2.96600"> </tspan>were.</tspan><tspan x="89" dy="31">The<tspan data-gap="" dx="2.82087"> </tspan>surveys<tspan data-gap="" dx="2.82087"> </tspan>found<tspan data-gap="" dx="2.82087"> </tspan>widespread<tspan data-gap="" dx="2.82087"> </tspan>shortages<tspan data-gap="" dx="2.82087"> </tspan>of<tspan data-gap="" dx="2.82087"> </tspan>protein<tspan data-gap="" dx="2.82087"> </tspan>and<tspan data-gap="" dx="2.82087"> </tspan>energy,<tspan data-gap="" dx="2.82087"> </tspan>particularly<tspan data-gap="" dx="2.82087"> </tspan>among</tspan><tspan x="89" dy="31">children — not in a few unlucky families, but across whole populations.</tspan></text><text class="se-copy" data-measure="874" x="89" y="952"><tspan x="89">The<tspan data-gap="" dx="5.45029"> </tspan>national<tspan data-gap="" dx="5.45029"> </tspan>school<tspan data-gap="" dx="5.45029"> </tspan>nutrition<tspan data-gap="" dx="5.45029"> </tspan>programme<tspan data-gap="" dx="5.45029"> </tspan>began<tspan data-gap="" dx="5.45029"> </tspan>in<tspan data-gap="" dx="5.45029"> </tspan>1995<tspan data-gap="" dx="5.45029"> </tspan>and<tspan data-gap="" dx="5.45029"> </tspan>developed<tspan data-gap="" dx="5.45029"> </tspan>into<tspan data-gap="" dx="5.45029"> </tspan>the</tspan><tspan x="89" dy="31">cooked<tspan data-gap="" dx="0.43933"> </tspan>school-meal<tspan data-gap="" dx="0.43933"> </tspan>programme<tspan data-gap="" dx="0.43933"> </tspan>now<tspan data-gap="" dx="0.43933"> </tspan>called<tspan data-gap="" dx="0.43933"> </tspan>PM<tspan data-gap="" dx="0.43933"> </tspan>POSHAN.<tspan data-gap="" dx="0.43933"> </tspan>Nutrition<tspan data-gap="" dx="0.43933"> </tspan>research<tspan data-gap="" dx="0.43933"> </tspan>helped</tspan><tspan x="89" dy="31">shape<tspan data-gap="" dx="-0.00650"> </tspan>school<tspan data-gap="" dx="-0.00650"> </tspan>feeding<tspan data-gap="" dx="-0.00650"> </tspan>policy.<tspan data-gap="" dx="-0.00650"> </tspan>A<tspan data-gap="" dx="-0.00650"> </tspan>programme<tspan data-gap="" dx="-0.00650"> </tspan>date<tspan data-gap="" dx="-0.00650"> </tspan>alone<tspan data-gap="" dx="-0.00650"> </tspan>does<tspan data-gap="" dx="-0.00650"> </tspan>not<tspan data-gap="" dx="-0.00650"> </tspan>prove<tspan data-gap="" dx="-0.00650"> </tspan>its<tspan data-gap="" dx="-0.00650"> </tspan>effects:<tspan data-gap="" dx="-0.00650"> </tspan>those</tspan><tspan x="89" dy="31">require measurements of children and meals.</tspan></text><text class="se-copy" data-measure="874" x="89" y="1090"><tspan x="89">Gopalan died in 2019, aged 101.</tspan></text><text class="se-copy" data-measure="874" x="89" y="1135"><tspan x="89">In<tspan data-gap="" dx="6.51925"> </tspan>your<tspan data-gap="" dx="6.51925"> </tspan>notebook,<tspan data-gap="" dx="6.51925"> </tspan>compare<tspan data-gap="" dx="6.51925"> </tspan>two<tspan data-gap="" dx="6.51925"> </tspan>possible<tspan data-gap="" dx="6.51925"> </tspan>lunches<tspan data-gap="" dx="6.51925"> </tspan>using<tspan data-gap="" dx="6.51925"> </tspan>the<tspan data-gap="" dx="6.51925"> </tspan>food<tspan data-gap="" dx="6.51925"> </tspan>groups<tspan data-gap="" dx="6.51925"> </tspan>in<tspan data-gap="" dx="6.51925"> </tspan>this</tspan><tspan x="89" dy="31">chapter.<tspan data-gap="" dx="2.23624"> </tspan>State<tspan data-gap="" dx="2.23624"> </tspan>what<tspan data-gap="" dx="2.23624"> </tspan>information<tspan data-gap="" dx="2.23624"> </tspan>about<tspan data-gap="" dx="2.23624"> </tspan>portion<tspan data-gap="" dx="2.23624"> </tspan>size<tspan data-gap="" dx="2.23624"> </tspan>and<tspan data-gap="" dx="2.23624"> </tspan>ingredients<tspan data-gap="" dx="2.23624"> </tspan>you<tspan data-gap="" dx="2.23624"> </tspan>would<tspan data-gap="" dx="2.23624"> </tspan>need</tspan><tspan x="89" dy="31">before comparing nutrient amounts or cost.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">18</text></g><!-- /botanical-footer --></svg></div></div></section>
