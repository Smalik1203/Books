tRatio="xMidYMid meet"><title>salt worker</title></image><text class="se-copy" data-measure="874" x="89" y="802"><tspan x="89">In<tspan data-gap="" dx="5.14625"> </tspan>the<tspan data-gap="" dx="5.14625"> </tspan>Little<tspan data-gap="" dx="5.14625"> </tspan>Rann<tspan data-gap="" dx="5.14625"> </tspan>of<tspan data-gap="" dx="5.14625"> </tspan>Kutch,<tspan data-gap="" dx="5.14625"> </tspan>Agariya<tspan data-gap="" dx="5.14625"> </tspan>salt<tspan data-gap="" dx="5.14625"> </tspan>workers<tspan data-gap="" dx="5.14625"> </tspan>pump<tspan data-gap="" dx="5.14625"> </tspan>underground<tspan data-gap="" dx="5.14625"> </tspan>brine<tspan data-gap="" dx="5.14625"> </tspan>into</tspan><tspan x="89" dy="31">evaporation<tspan data-gap="" dx="3.93371"> </tspan>pans.<tspan data-gap="" dx="3.93371"> </tspan>Water<tspan data-gap="" dx="3.93371"> </tspan>evaporates<tspan data-gap="" dx="3.93371"> </tspan>and<tspan data-gap="" dx="3.93371"> </tspan>salt<tspan data-gap="" dx="3.93371"> </tspan>crystallises.<tspan data-gap="" dx="3.93371"> </tspan>This<tspan data-gap="" dx="3.93371"> </tspan>example<tspan data-gap="" dx="3.93371"> </tspan>connects<tspan data-gap="" dx="3.93371"> </tspan>a</tspan><tspan x="89" dy="31">food ingredient to separation by evaporation and to the people who produce it.</tspan></text><text class="se-copy" data-measure="874" x="89" y="909"><tspan x="89">Vitamin<tspan data-gap="" dx="2.18562"> </tspan>C<tspan data-gap="" dx="2.18562"> </tspan>and<tspan data-gap="" dx="2.18562"> </tspan>iodine<tspan data-gap="" dx="2.18562"> </tspan>are<tspan data-gap="" dx="2.18562"> </tspan>two<tspan data-gap="" dx="2.18562"> </tspan>of<tspan data-gap="" dx="2.18562"> </tspan>many.<tspan data-gap="" dx="2.18562"> </tspan>Each<tspan data-gap="" dx="2.18562"> </tspan>vitamin<tspan data-gap="" dx="2.18562"> </tspan>and<tspan data-gap="" dx="2.18562"> </tspan>each<tspan data-gap="" dx="2.18562"> </tspan>mineral<tspan data-gap="" dx="2.18562"> </tspan>has<tspan data-gap="" dx="2.18562"> </tspan>its<tspan data-gap="" dx="2.18562"> </tspan>own</tspan><tspan x="89" dy="31">job,<tspan data-gap="" dx="3.09840"> </tspan>its<tspan data-gap="" dx="3.09840"> </tspan>own<tspan data-gap="" dx="3.09840"> </tspan>food<tspan data-gap="" dx="3.09840"> </tspan>sources,<tspan data-gap="" dx="3.09840"> </tspan>and<tspan data-gap="" dx="3.09840"> </tspan>its<tspan data-gap="" dx="3.09840"> </tspan>own<tspan data-gap="" dx="3.09840"> </tspan>set<tspan data-gap="" dx="3.09840"> </tspan>of<tspan data-gap="" dx="3.09840"> </tspan>symptoms<tspan data-gap="" dx="3.09840"> </tspan>when<tspan data-gap="" dx="3.09840"> </tspan>the<tspan data-gap="" dx="3.09840"> </tspan>body<tspan data-gap="" dx="3.09840"> </tspan>runs<tspan data-gap="" dx="3.09840"> </tspan>short.</tspan><tspan x="89" dy="31">Together they are what keep the body's defences and daily processes working.</tspan></text><text class="se-copy" data-measure="874" x="89" y="1016"><tspan x="89">Fig.<tspan data-gap="" dx="1.69310"> </tspan>3.5<tspan data-gap="" dx="1.69310"> </tspan>sets<tspan data-gap="" dx="1.69310"> </tspan>out<tspan data-gap="" dx="1.69310"> </tspan>the<tspan data-gap="" dx="1.69310"> </tspan>main<tspan data-gap="" dx="1.69310"> </tspan>ones.<tspan data-gap="" dx="1.69310"> </tspan>Read<tspan data-gap="" dx="1.69310"> </tspan>it<tspan data-gap="" dx="1.69310"> </tspan>carefully<tspan data-gap="" dx="1.69310"> </tspan>—<tspan data-gap="" dx="1.69310"> </tspan>you<tspan data-gap="" dx="1.69310"> </tspan>will<tspan data-gap="" dx="1.69310"> </tspan>be<tspan data-gap="" dx="1.69310"> </tspan>using<tspan data-gap="" dx="1.69310"> </tspan>it<tspan data-gap="" dx="1.69310"> </tspan>again<tspan data-gap="" dx="1.69310"> </tspan>in<tspan data-gap="" dx="1.69310"> </tspan>the</tspan><tspan x="89" dy="31">exercises at the end of the chapter.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-runn
