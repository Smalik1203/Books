<section class="page page--food page--science-editorial" data-science-chapter="3" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Food on Our Plate, page 16"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><circle class="se-botanical-stem" cx="46" cy="30" r="21"/><circle class="se-botanical-stem" cx="46" cy="30" r="14"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 3</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Food on Our Plate</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><image class="science-illustration" href="../../figures/reference/food/p015-vitamin-a-foods.png" x="89" y="96" width="425" height="286.7526205450734" preserveAspectRatio="xMidYMid meet"><title>vitamin a foods</title></image><image class="science-illustration" href="../../figures/reference/food/p015-vitamin-b-foods.png" x="526" y="96" width="425" height="286.7526205450734" preserveAspectRatio="xMidYMid meet"><title>vitamin b foods</title></image><text class="se-copy se-table-copy" x="89" y="420.1526205450734"><tspan x="89">Fig. 3.6 — Some sources of vitamins · (a) Vitamin A (b) Vitamin B₁</tspan></text><image class="science-illustration" href="../../figures/reference/food/p015-vitamin-c-foods.png" x="89" y="448.7526205450734" width="425" height="286.7526205450734" preserveAspectRatio="xMidYMid meet"><title>vitamin c foods</title></image><image class="science-illustration" href="../../figures/reference/food/p015-vitamin-d-foods.png" x="526" y="448.7526205450734" width="425" height="286.7526205450734" preserveAspectRatio="xMidYMid meet"><title>vitamin d foods</title></image><text class="se-copy se-table-copy" x="89" y="772.9052410901468"><tspan x="89">(c) Vitamin C (d) Vitamin D</tspan></text><text class="se-copy" data-measure="874" x="89" y="824.5052410901468"><tspan x="89">A<tspan data-gap="" dx="6.26836"> </tspan><tspan class="se-bold">nutrient</tspan><tspan data-gap="" dx="6.26836"> </tspan>is<tspan data-gap="" dx="6.26836"> </tspan>a<tspan data-gap="" dx="6.26836"> </tspan>substance<tspan data-gap="" dx="6.26836"> </tspan>the<tspan data-gap="" dx="6.26836"> </tspan>body<tspan data-gap="" dx="6.26836"> </tspan>needs<tspan data-gap="" dx="6.26836"> </tspan>for<tspan data-gap="" dx="6.26836"> </tspan>energy,<tspan data-gap="" dx="6.26836"> </tspan>growth,<tspan data-gap="" dx="6.26836"> </tspan>repair<tspan data-gap="" dx="6.26836"> </tspan>or<tspan data-gap="" dx="6.26836"> </tspan>normal</tspan><tspan x="89" dy="31">functioning.<tspan data-gap="" dx="9.81336"> </tspan>Carbohydrates,<tspan data-gap="" dx="9.81336"> </tspan>fats,<tspan data-gap="" dx="9.81336"> </tspan>proteins,<tspan data-gap="" dx="9.81336"> </tspan>vitamins<tspan data-gap="" dx="9.81336"> </tspan>and<tspan data-gap="" dx="9.81336"> </tspan>minerals<tspan data-gap="" dx="9.81336"> </tspan>are<tspan data-gap="" dx="9.81336"> </tspan>nutrient</tspan><tspan x="89" dy="31">groups; water is an essential nutrient too.</tspan></text><text class="se-copy" data-measure="874" x="89" y="931.5052410901468"><tspan x="89">The<tspan data-gap="" dx="14.43288"> </tspan>labels<tspan data-gap="" dx="14.43288"> </tspan>energy-giving,<tspan data-gap="" dx="14.43288"> </tspan>body-building<tspan data-gap="" dx="14.43288"> </tspan>and<tspan data-gap="" dx="14.43288"> </tspan>protective<tspan data-gap="" dx="14.43288"> </tspan>highlight<tspan data-gap="" dx="14.43288"> </tspan>important</tspan><tspan x="89" dy="31">functions,<tspan data-gap="" dx="2.28057"> </tspan>but<tspan data-gap="" dx="2.28057"> </tspan>the<tspan data-gap="" dx="2.28057"> </tspan>jobs<tspan data-gap="" dx="2.28057"> </tspan>overlap.<tspan data-gap="" dx="2.28057"> </tspan>Proteins<tspan data-gap="" dx="2.28057"> </tspan>can<tspan data-gap="" dx="2.28057"> </tspan>supply<tspan data-gap="" dx="2.28057"> </tspan>energy,<tspan data-gap="" dx="2.28057"> </tspan>fats<tspan data-gap="" dx="2.28057"> </tspan>form<tspan data-gap="" dx="2.28057"> </tspan>parts<tspan data-gap="" dx="2.28057"> </tspan>of<tspan data-gap="" dx="2.28057"> </tspan>cells,</tspan><tspan x="89" dy="31">and vitamins and minerals support many processes.</tspan></text><text class="se-copy" data-measure="874" x="89" y="1038.5052410901467"><tspan x="89">Vitamins<tspan data-gap="" dx="2.09938"> </tspan>and<tspan data-gap="" dx="2.09938"> </tspan>minerals<tspan data-gap="" dx="2.09938"> </tspan>help<tspan data-gap="" dx="2.09938"> </tspan>body<tspan data-gap="" dx="2.09938"> </tspan>processes<tspan data-gap="" dx="2.09938"> </tspan>work<tspan data-gap="" dx="2.09938"> </tspan>normally.<tspan data-gap="" dx="2.09938"> </tspan>Calling<tspan data-gap="" dx="2.09938"> </tspan>them<tspan data-gap="" dx="2.09938"> </tspan>protective</tspan><tspan x="89" dy="31">does not mean that eating one food prevents every disease or treats every symptom.</tspan></text><text class="se-copy" data-measure="874" x="89" y="1114.5052410901467"><tspan x="89">This<tspan data-gap="" dx="1.47354"> </tspan>is<tspan data-gap="" dx="1.47354"> </tspan>why<tspan data-gap="" dx="1.47354"> </tspan>you<tspan data-gap="" dx="1.47354"> </tspan>are<tspan data-gap="" dx="1.47354"> </tspan>told<tspan data-gap="" dx="1.47354"> </tspan>to<tspan data-gap="" dx="1.47354"> </tspan>drink<tspan data-gap="" dx="1.47354"> </tspan>milk,<tspan data-gap="" dx="1.47354"> </tspan>eat<tspan data-gap="" dx="1.47354"> </tspan>green<tspan data-gap="" dx="1.47354"> </tspan>vegetables,<tspan data-gap="" dx="1.47354"> </tspan>eat<tspan data-gap="" dx="1.47354"> </tspan>fruit,<tspan data-gap="" dx="1.47354"> </tspan>and<tspan data-gap="" dx="1.47354"> </tspan>eat<tspan data-gap="" dx="1.47354"> </tspan>whole</tspan><tspan x="89" dy="31">grains<tspan data-gap="" dx="4.84220"> </tspan>rather<tspan data-gap="" dx="4.84220"> </tspan>than<tspan data-gap="" dx="4.84220"> </tspan>only<tspan data-gap="" dx="4.84220"> </tspan>polished<tspan data-gap="" dx="4.84220"> </tspan>ones<tspan data-gap="" dx="4.84220"> </tspan>—<tspan data-gap="" dx="4.84220"> </tspan>not<tspan data-gap="" dx="4.84220"> </tspan>because<tspan data-gap="" dx="4.84220"> </tspan>these<tspan data-gap="" dx="4.84220"> </tspan>foods<tspan data-gap="" dx="4.84220"> </tspan>are<tspan data-gap="" dx="4.84220"> </tspan>filling,<tspan data-gap="" dx="4.84220"> </tspan>but</tspan><tspan x="89" dy="31">because they carry the nutrients that nothing else will supply.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">16</text></g><!-- /botanical-footer --></svg></div></div></section>
