<section class="page page--food page--science-editorial" data-science-chapter="3" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Food on Our Plate, page 5"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><circle class="se-botanical-stem" cx="46" cy="30" r="21"/><circle class="se-botanical-stem" cx="46" cy="30" r="14"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 3</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Food on Our Plate</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><g class="se-learning-cue se-feature--explain" data-feature="explain" aria-label="How It Works"><svg class="se-feature-icon se-feature--explain" x="89" y="105" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h5m10 0h5M7 7l3 3m4 4 3 3M7 17l3-3m4-4 3-3M15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="145" y="134">How It Works</text></g><text class="se-copy" data-measure="874" x="89" y="175"><tspan x="89">Soil,<tspan data-gap="" dx="2.76981"> </tspan>rainfall<tspan data-gap="" dx="2.76981"> </tspan>and<tspan data-gap="" dx="2.76981"> </tspan>temperature<tspan data-gap="" dx="2.76981"> </tspan>affect<tspan data-gap="" dx="2.76981"> </tspan>which<tspan data-gap="" dx="2.76981"> </tspan>crops<tspan data-gap="" dx="2.76981"> </tspan>grow<tspan data-gap="" dx="2.76981"> </tspan>well.<tspan data-gap="" dx="2.76981"> </tspan>Rice<tspan data-gap="" dx="2.76981"> </tspan>is<tspan data-gap="" dx="2.76981"> </tspan>often<tspan data-gap="" dx="2.76981"> </tspan>grown<tspan data-gap="" dx="2.76981"> </tspan>in</tspan><tspan x="89" dy="31">flooded<tspan data-gap="" dx="-0.05951"> </tspan>fields,<tspan data-gap="" dx="-0.05951"> </tspan>though<tspan data-gap="" dx="-0.05951"> </tspan>not<tspan data-gap="" dx="-0.05951"> </tspan>all<tspan data-gap="" dx="-0.05951"> </tspan>rice<tspan data-gap="" dx="-0.05951"> </tspan>requires<tspan data-gap="" dx="-0.05951"> </tspan>standing<tspan data-gap="" dx="-0.05951"> </tspan>water.<tspan data-gap="" dx="-0.05951"> </tspan>Ragi<tspan data-gap="" dx="-0.05951"> </tspan>can<tspan data-gap="" dx="-0.05951"> </tspan>tolerate<tspan data-gap="" dx="-0.05951"> </tspan>relatively</tspan><tspan x="89" dy="31">dry conditions. Farmers can also change irrigation and soil management.</tspan></text><text class="se-copy" data-measure="874" x="89" y="282"><tspan x="89">Soil<tspan data-gap="" dx="0.97672"> </tspan>and<tspan data-gap="" dx="0.97672"> </tspan>climate<tspan data-gap="" dx="0.97672"> </tspan>are<tspan data-gap="" dx="0.97672"> </tspan>not<tspan data-gap="" dx="0.97672"> </tspan>the<tspan data-gap="" dx="0.97672"> </tspan>whole<tspan data-gap="" dx="0.97672"> </tspan>story.<tspan data-gap="" dx="0.97672"> </tspan>Culture,<tspan data-gap="" dx="0.97672"> </tspan>religion<tspan data-gap="" dx="0.97672"> </tspan>and<tspan data-gap="" dx="0.97672"> </tspan>history<tspan data-gap="" dx="0.97672"> </tspan>all<tspan data-gap="" dx="0.97672"> </tspan>shape<tspan data-gap="" dx="0.97672"> </tspan>what</tspan><tspan x="89" dy="31">a<tspan data-gap="" dx="1.47742"> </tspan>community<tspan data-gap="" dx="1.47742"> </tspan>eats<tspan data-gap="" dx="1.47742"> </tspan>and<tspan data-gap="" dx="1.47742"> </tspan>what<tspan data-gap="" dx="1.47742"> </tspan>it<tspan data-gap="" dx="1.47742"> </tspan>avoids.<tspan data-gap="" dx="1.47742"> </tspan>Two<tspan data-gap="" dx="1.47742"> </tspan>families<tspan data-gap="" dx="1.47742"> </tspan>in<tspan data-gap="" dx="1.47742"> </tspan>the<tspan data-gap="" dx="1.47742"> </tspan>same<tspan data-gap="" dx="1.47742"> </tspan>street,<tspan data-gap="" dx="1.47742"> </tspan>growing<tspan data-gap="" dx="1.47742"> </tspan>food</tspan><tspan x="89" dy="31">from the same fields, may cook very differently.</tspan></text><g class="se-learning-cue se-feature--reason" data-feature="reason" aria-label="Follow the Evidence"><svg class="se-feature-icon se-feature--reason" x="89" y="375" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h8m-8 6h8m-8 6h8M16 4l5 5m0-5-5 5M16 15l2 2 4-5"/></svg><text class="se-cue-title" x="145" y="404">Follow the Evidence</text></g><text class="se-copy" data-measure="874" x="89" y="445"><tspan x="89">Regional<tspan data-gap="" dx="15.46464"> </tspan>food<tspan data-gap="" dx="15.46464"> </tspan>reflects<tspan data-gap="" dx="15.46464"> </tspan>crops,<tspan data-gap="" dx="15.46464"> </tspan>trade,<tspan data-gap="" dx="15.46464"> </tspan>cost,<tspan data-gap="" dx="15.46464"> </tspan>taste,<tspan data-gap="" dx="15.46464"> </tspan>culture<tspan data-gap="" dx="15.46464"> </tspan>and<tspan data-gap="" dx="15.46464"> </tspan>tradition.<tspan data-gap="" dx="15.46464"> </tspan>A</tspan><tspan x="89" dy="31">crops-and-dishes table suggests relationships; it does not isolate a single cause.</tspan></text><rect class="se-prompt" x="89" y="498" width="874" height="179"/><line class="se-think-rule" x1="89" x2="963" y1="498" y2="498"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What Did You Notice?"><svg class="se-feature-icon se-feature--observe" x="113" y="507" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="536">What Did You Notice?</text></g><text class="se-copy" data-measure="826" x="113" y="592"><tspan x="113">Choose<tspan data-gap="" dx="2.12973"> </tspan>a<tspan data-gap="" dx="2.12973"> </tspan>dish<tspan data-gap="" dx="2.12973"> </tspan>common<tspan data-gap="" dx="2.12973"> </tspan>in<tspan data-gap="" dx="2.12973"> </tspan>your<tspan data-gap="" dx="2.12973"> </tspan>state.<tspan data-gap="" dx="2.12973"> </tspan>Is<tspan data-gap="" dx="2.12973"> </tspan>it<tspan data-gap="" dx="2.12973"> </tspan>also<tspan data-gap="" dx="2.12973"> </tspan>eaten<tspan data-gap="" dx="2.12973"> </tspan>across<tspan data-gap="" dx="2.12973"> </tspan>the<tspan data-gap="" dx="2.12973"> </tspan>border?<tspan data-gap="" dx="2.12973"> </tspan>Check</tspan><tspan x="113" dy="31">with<tspan data-gap="" dx="9.99391"> </tspan>two<tspan data-gap="" dx="9.99391"> </tspan>sources<tspan data-gap="" dx="9.99391"> </tspan>before<tspan data-gap="" dx="9.99391"> </tspan>explaining<tspan data-gap="" dx="9.99391"> </tspan>any<tspan data-gap="" dx="9.99391"> </tspan>difference<tspan data-gap="" dx="9.99391"> </tspan>using<tspan data-gap="" dx="9.99391"> </tspan>crops,<tspan data-gap="" dx="9.99391"> </tspan>trade<tspan data-gap="" dx="9.99391"> </tspan>or</tspan><tspan x="113" dy="31">tradition.</tspan></text><text class="se-heading" x="89" y="719.06"><tspan x="89">3.1.2 Food also varies from time to time</tspan></text><text class="se-copy" data-measure="874" x="89" y="770"><tspan x="89">Food<tspan data-gap="" dx="3.26972"> </tspan>varies<tspan data-gap="" dx="3.26972"> </tspan>across<tspan data-gap="" dx="3.26972"> </tspan>the<tspan data-gap="" dx="3.26972"> </tspan>map.<tspan data-gap="" dx="3.26972"> </tspan>Does<tspan data-gap="" dx="3.26972"> </tspan>it<tspan data-gap="" dx="3.26972"> </tspan>also<tspan data-gap="" dx="3.26972"> </tspan>vary<tspan data-gap="" dx="3.26972"> </tspan>across<tspan data-gap="" dx="3.26972"> </tspan>the<tspan data-gap="" dx="3.26972"> </tspan>years?<tspan data-gap="" dx="3.26972"> </tspan>Interview<tspan data-gap="" dx="3.26972"> </tspan>an<tspan data-gap="" dx="3.26972"> </tspan>older</tspan><tspan x="89" dy="31">person<tspan data-gap="" dx="0.42051"> </tspan>about<tspan data-gap="" dx="0.42051"> </tspan>dishes,<tspan data-gap="" dx="0.42051"> </tspan>fuel<tspan data-gap="" dx="0.42051"> </tspan>and<tspan data-gap="" dx="0.42051"> </tspan>cooking<tspan data-gap="" dx="0.42051"> </tspan>tools.<tspan data-gap="" dx="0.42051"> </tspan>Record<tspan data-gap="" dx="0.42051"> </tspan>continuity<tspan data-gap="" dx="0.42051"> </tspan>as<tspan data-gap="" dx="0.42051"> </tspan>well<tspan data-gap="" dx="0.42051"> </tspan>as<tspan data-gap="" dx="0.42051"> </tspan>change;<tspan data-gap="" dx="0.42051"> </tspan>one</tspan><tspan x="89" dy="31">memory cannot represent every household.</tspan></text><g aria-label="Activity 3.3 · Interview an elder"><rect class="se-activity-panel" x="89" y="868" width="874" height="405"/><path class="se-activity-tab" d="M109 854H943Q963 854 963 874V897H89V874Q89 854 109 854Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="860" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="881"><tspan x="149">Investigate</tspan></text><text class="se-activity-step" x="113" y="941"><tspan x="113">1.</tspan></text><text class="se-copy" x="151" y="941"><tspan x="151">Choose someone at least fifty years older than you — a grandparent, a</tspan><tspan x="151" dy="31">neighbour, a retired teacher.</tspan></text><text class="se-activity-step" x="113" y="1017"><tspan x="113">2.</tspan></text><text class="se-copy" x="151" y="1017"><tspan x="151">Prepare your questions before you meet them. Write them down. Good</tspan><tspan x="151" dy="31">starting points: What did you eat as a child that you still eat today? What</tspan><tspan x="151" dy="31">did you eat then that you never eat now? How was the food cooked, and on</tspan><tspan x="151" dy="31">what? How long did the cooking take? What changed, and when did it</tspan><tspan x="151" dy="31">change?</tspan></text><text class="se-activity-step" x="113" y="1186"><tspan x="113">3.</tspan></text><text class="se-copy" x="151" y="1186"><tspan x="151">Listen more than you talk. Write their answers in their words, not yours.</tspan></text><text class="se-activity-step" x="113" y="1231"><tspan x="113">4.</tspan></text><text class="se-copy" x="151" y="1231"><tspan x="151">Bring your notes to class and pool them with your classmates'.</tspan></text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">5</text></g><!-- /botanical-footer --></svg></div></div></section>
