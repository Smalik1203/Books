<section class="page page--food page--science-editorial" data-science-chapter="3" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Food on Our Plate, page 10"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><circle class="se-botanical-stem" cx="46" cy="30" r="21"/><circle class="se-botanical-stem" cx="46" cy="30" r="14"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 3</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Food on Our Plate</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><text class="se-heading" x="89" y="124.06"><tspan x="89">Proteins</tspan></text><text class="se-copy" data-measure="874" x="89" y="175"><tspan x="89">Carbohydrates<tspan data-gap="" dx="0.55931"> </tspan>and<tspan data-gap="" dx="0.55931"> </tspan>fats<tspan data-gap="" dx="0.55931"> </tspan>supply<tspan data-gap="" dx="0.55931"> </tspan>energy,<tspan data-gap="" dx="0.55931"> </tspan>and<tspan data-gap="" dx="0.55931"> </tspan>fats<tspan data-gap="" dx="0.55931"> </tspan>also<tspan data-gap="" dx="0.55931"> </tspan>form<tspan data-gap="" dx="0.55931"> </tspan>parts<tspan data-gap="" dx="0.55931"> </tspan>of<tspan data-gap="" dx="0.55931"> </tspan>cells.<tspan data-gap="" dx="0.55931"> </tspan>Proteins<tspan data-gap="" dx="0.55931"> </tspan>have</tspan><tspan x="89" dy="31">an<tspan data-gap="" dx="1.38127"> </tspan>essential<tspan data-gap="" dx="1.38127"> </tspan>role<tspan data-gap="" dx="1.38127"> </tspan>in<tspan data-gap="" dx="1.38127"> </tspan>building<tspan data-gap="" dx="1.38127"> </tspan>and<tspan data-gap="" dx="1.38127"> </tspan>repairing<tspan data-gap="" dx="1.38127"> </tspan>tissues.<tspan data-gap="" dx="1.38127"> </tspan>These<tspan data-gap="" dx="1.38127"> </tspan>job<tspan data-gap="" dx="1.38127"> </tspan>labels<tspan data-gap="" dx="1.38127"> </tspan>overlap;<tspan data-gap="" dx="1.38127"> </tspan>they<tspan data-gap="" dx="1.38127"> </tspan>are</tspan><tspan x="89" dy="31">not exclusive compartments.</tspan></text><text class="se-copy" data-measure="874" x="89" y="282"><tspan x="89">Consider<tspan data-gap="" dx="9.40004"> </tspan>what<tspan data-gap="" dx="9.40004"> </tspan>a<tspan data-gap="" dx="9.40004"> </tspan>body<tspan data-gap="" dx="9.40004"> </tspan>has<tspan data-gap="" dx="9.40004"> </tspan>to<tspan data-gap="" dx="9.40004"> </tspan>do<tspan data-gap="" dx="9.40004"> </tspan>besides<tspan data-gap="" dx="9.40004"> </tspan>move.<tspan data-gap="" dx="9.40004"> </tspan>A<tspan data-gap="" dx="9.40004"> </tspan>six-year-old<tspan data-gap="" dx="9.40004"> </tspan>grows<tspan data-gap="" dx="9.40004"> </tspan>into<tspan data-gap="" dx="9.40004"> </tspan>a</tspan><tspan x="89" dy="31">sixteen-year-old.<tspan data-gap="" dx="2.40891"> </tspan>A<tspan data-gap="" dx="2.40891"> </tspan>cut<tspan data-gap="" dx="2.40891"> </tspan>on<tspan data-gap="" dx="2.40891"> </tspan>your<tspan data-gap="" dx="2.40891"> </tspan>hand<tspan data-gap="" dx="2.40891"> </tspan>closes<tspan data-gap="" dx="2.40891"> </tspan>over<tspan data-gap="" dx="2.40891"> </tspan>in<tspan data-gap="" dx="2.40891"> </tspan>a<tspan data-gap="" dx="2.40891"> </tspan>week.<tspan data-gap="" dx="2.40891"> </tspan>Hair<tspan data-gap="" dx="2.40891"> </tspan>grows,<tspan data-gap="" dx="2.40891"> </tspan>nails<tspan data-gap="" dx="2.40891"> </tspan>grow,</tspan><tspan x="89" dy="31">muscle<tspan data-gap="" dx="4.42727"> </tspan>thickens<tspan data-gap="" dx="4.42727"> </tspan>with<tspan data-gap="" dx="4.42727"> </tspan>training.<tspan data-gap="" dx="4.42727"> </tspan>All<tspan data-gap="" dx="4.42727"> </tspan>of<tspan data-gap="" dx="4.42727"> </tspan>that<tspan data-gap="" dx="4.42727"> </tspan>is<tspan data-gap="" dx="4.42727"> </tspan>construction<tspan data-gap="" dx="4.42727"> </tspan>work,<tspan data-gap="" dx="4.42727"> </tspan>and<tspan data-gap="" dx="4.42727"> </tspan>construction</tspan><tspan x="89" dy="31">needs material.</tspan></text><text class="se-copy" data-measure="874" x="89" y="420"><tspan x="89">The material is protein.</tspan></text><g class="se-learning-cue se-feature--explain" data-feature="explain" aria-label="How It Works"><svg class="se-feature-icon se-feature--explain" x="89" y="451" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h5m10 0h5M7 7l3 3m4 4 3 3M7 17l3-3m4-4 3-3M15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="145" y="480">How It Works</text></g><text class="se-copy" data-measure="874" x="89" y="521"><tspan x="89">Proteins<tspan data-gap="" dx="0.69769"> </tspan>are<tspan data-gap="" dx="0.69769"> </tspan>used<tspan data-gap="" dx="0.69769"> </tspan>to<tspan data-gap="" dx="0.69769"> </tspan>build<tspan data-gap="" dx="0.69769"> </tspan>new<tspan data-gap="" dx="0.69769"> </tspan>tissue<tspan data-gap="" dx="0.69769"> </tspan>and<tspan data-gap="" dx="0.69769"> </tspan>repair<tspan data-gap="" dx="0.69769"> </tspan>damaged<tspan data-gap="" dx="0.69769"> </tspan>tissue.<tspan data-gap="" dx="0.69769"> </tspan>This<tspan data-gap="" dx="0.69769"> </tspan>is<tspan data-gap="" dx="0.69769"> </tspan>why<tspan data-gap="" dx="0.69769"> </tspan>the<tspan data-gap="" dx="0.69769"> </tspan>diet</tspan><tspan x="89" dy="31">of<tspan data-gap="" dx="4.26474"> </tspan>a<tspan data-gap="" dx="4.26474"> </tspan>growing<tspan data-gap="" dx="4.26474"> </tspan>child<tspan data-gap="" dx="4.26474"> </tspan>must<tspan data-gap="" dx="4.26474"> </tspan>contain<tspan data-gap="" dx="4.26474"> </tspan>enough<tspan data-gap="" dx="4.26474"> </tspan>protein,<tspan data-gap="" dx="4.26474"> </tspan>and<tspan data-gap="" dx="4.26474"> </tspan>why<tspan data-gap="" dx="4.26474"> </tspan>an<tspan data-gap="" dx="4.26474"> </tspan>athlete<tspan data-gap="" dx="4.26474"> </tspan>training<tspan data-gap="" dx="4.26474"> </tspan>for</tspan><tspan x="89" dy="31">strength<tspan data-gap="" dx="1.35751"> </tspan>needs<tspan data-gap="" dx="1.35751"> </tspan>more<tspan data-gap="" dx="1.35751"> </tspan>than<tspan data-gap="" dx="1.35751"> </tspan>a<tspan data-gap="" dx="1.35751"> </tspan>person<tspan data-gap="" dx="1.35751"> </tspan>who<tspan data-gap="" dx="1.35751"> </tspan>is<tspan data-gap="" dx="1.35751"> </tspan>not.<tspan data-gap="" dx="1.35751"> </tspan>A<tspan data-gap="" dx="1.35751"> </tspan>body<tspan data-gap="" dx="1.35751"> </tspan>short<tspan data-gap="" dx="1.35751"> </tspan>of<tspan data-gap="" dx="1.35751"> </tspan>protein<tspan data-gap="" dx="1.35751"> </tspan>cannot<tspan data-gap="" dx="1.35751"> </tspan>grow</tspan><tspan x="89" dy="31">properly, however much energy it is given — you cannot build a wall out of firewood.</tspan></text><text class="se-copy" data-measure="874" x="89" y="659"><tspan x="89">Pulses,<tspan data-gap="" dx="1.61170"> </tspan>soya<tspan data-gap="" dx="1.61170"> </tspan>beans,<tspan data-gap="" dx="1.61170"> </tspan>nuts<tspan data-gap="" dx="1.61170"> </tspan>and<tspan data-gap="" dx="1.61170"> </tspan>seeds<tspan data-gap="" dx="1.61170"> </tspan>supply<tspan data-gap="" dx="1.61170"> </tspan>protein.<tspan data-gap="" dx="1.61170"> </tspan>Milk,<tspan data-gap="" dx="1.61170"> </tspan>curd,<tspan data-gap="" dx="1.61170"> </tspan>paneer,<tspan data-gap="" dx="1.61170"> </tspan>eggs,<tspan data-gap="" dx="1.61170"> </tspan>fish<tspan data-gap="" dx="1.61170"> </tspan>and</tspan><tspan x="89" dy="31">meat<tspan data-gap="" dx="4.81167"> </tspan>are<tspan data-gap="" dx="4.81167"> </tspan>other<tspan data-gap="" dx="4.81167"> </tspan>sources.<tspan data-gap="" dx="4.81167"> </tspan>Compare<tspan data-gap="" dx="4.81167"> </tspan>amounts<tspan data-gap="" dx="4.81167"> </tspan>as<tspan data-gap="" dx="4.81167"> </tspan>well<tspan data-gap="" dx="4.81167"> </tspan>as<tspan data-gap="" dx="4.81167"> </tspan>presence:<tspan data-gap="" dx="4.81167"> </tspan>fresh<tspan data-gap="" dx="4.81167"> </tspan>mushrooms</tspan><tspan x="89" dy="31">contain protein but are mostly water and supply less per usual serving than pulses.</tspan></text><text class="se-copy" data-measure="874" x="89" y="766"><tspan x="89">Because<tspan data-gap="" dx="-0.02239"> </tspan>of<tspan data-gap="" dx="-0.02239"> </tspan>the<tspan data-gap="" dx="-0.02239"> </tspan>job<tspan data-gap="" dx="-0.02239"> </tspan>they<tspan data-gap="" dx="-0.02239"> </tspan>do,<tspan data-gap="" dx="-0.02239"> </tspan>protein-rich<tspan data-gap="" dx="-0.02239"> </tspan>foods<tspan data-gap="" dx="-0.02239"> </tspan>are<tspan data-gap="" dx="-0.02239"> </tspan>called<tspan data-gap="" dx="-0.02239"> </tspan>body-building<tspan data-gap="" dx="-0.02239"> </tspan>foods<tspan data-gap="" dx="-0.02239"> </tspan>—<tspan data-gap="" dx="-0.02239"> </tspan>while</tspan><tspan x="89" dy="31">carbohydrates and fats, which supply energy, are together called energy-giving foods.</tspan></text><text class="se-copy se-table-copy" x="165.125" y="847" text-anchor="middle">Moong</text><text class="se-copy se-table-copy" x="305.375" y="847" text-anchor="middle">Tuar dal</text><text class="se-copy se-table-copy" x="445.625" y="847" text-anchor="middle">Gram</text><image class="science-illustration" href="../../figures/reference/food/p010-plant-protein-top.png" x="95" y="855" width="425" height="152.2093023255814" preserveAspectRatio="xMidYMid meet"><title>plant protein top</title></image><text class="se-copy se-table-copy" x="602.4561046511628" y="847" text-anchor="middle">Milk</text><text class="se-copy se-table-copy" x="742.3799418604651" y="847" text-anchor="middle">Curd</text><text class="se-copy se-table-copy" x="882.3037790697674" y="847" text-anchor="middle">Paneer</text><image class="science-illustration" href="../../figures/re
