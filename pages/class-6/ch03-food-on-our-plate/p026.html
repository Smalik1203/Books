pan data-gap="" dx="0.15471"> </tspan>winnowed<tspan data-gap="" dx="0.15471"> </tspan>to<tspan data-gap="" dx="0.15471"> </tspan>separate<tspan data-gap="" dx="0.15471"> </tspan>it<tspan data-gap="" dx="0.15471"> </tspan>from<tspan data-gap="" dx="0.15471"> </tspan>the<tspan data-gap="" dx="0.15471"> </tspan>chaff.<tspan data-gap="" dx="0.15471"> </tspan>It<tspan data-gap="" dx="0.15471"> </tspan>is<tspan data-gap="" dx="0.15471"> </tspan>stored,<tspan data-gap="" dx="0.15471"> </tspan>often<tspan data-gap="" dx="0.15471"> </tspan>for<tspan data-gap="" dx="0.15471"> </tspan>months.<tspan data-gap="" dx="0.15471"> </tspan>It</tspan><tspan x="89" dy="31">is<tspan data-gap="" dx="0.46980"> </tspan>transported<tspan data-gap="" dx="0.46980"> </tspan>to<tspan data-gap="" dx="0.46980"> </tspan>a<tspan data-gap="" dx="0.46980"> </tspan>mill<tspan data-gap="" dx="0.46980"> </tspan>and<tspan data-gap="" dx="0.46980"> </tspan>ground<tspan data-gap="" dx="0.46980"> </tspan>into<tspan data-gap="" dx="0.46980"> </tspan>flour.<tspan data-gap="" dx="0.46980"> </tspan>The<tspan data-gap="" dx="0.46980"> </tspan>flour<tspan data-gap="" dx="0.46980"> </tspan>is<tspan data-gap="" dx="0.46980"> </tspan>packed,<tspan data-gap="" dx="0.46980"> </tspan>transported<tspan data-gap="" dx="0.46980"> </tspan>again,</tspan><tspan x="89" dy="31">and<tspan data-gap="" dx="5.71660"> </tspan>sold<tspan data-gap="" dx="5.71660"> </tspan>in<tspan data-gap="" dx="5.71660"> </tspan>a<tspan data-gap="" dx="5.71660"> </tspan>shop.<tspan data-gap="" dx="5.71660"> </tspan>Someone<tspan data-gap="" dx="5.71660"> </tspan>buys<tspan data-gap="" dx="5.71660"> </tspan>it,<tspan data-gap="" dx="5.71660"> </tspan>carries<tspan data-gap="" dx="5.71660"> </tspan>it<tspan data-gap="" dx="5.71660"> </tspan>home,<tspan data-gap="" dx="5.71660"> </tspan>kneads<tspan data-gap="" dx="5.71660"> </tspan>it,<tspan data-gap="" dx="5.71660"> </tspan>and<tspan data-gap="" dx="5.71660"> </tspan>cooks<tspan data-gap="" dx="5.71
