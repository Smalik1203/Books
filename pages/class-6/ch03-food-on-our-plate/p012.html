span data-gap="" dx="0.45792"> </tspan>a<tspan data-gap="" dx="0.45792"> </tspan>small<tspan data-gap="" dx="0.45792"> </tspan>sample.</tspan><tspan x="89" dy="31">More observations and later research were needed to establish the cause.</tspan></text><rect class="se-prompt" x="89" y="366" width="874" height="148"/><line class="se-think-rule" x1="89" x2="963" y1="366" y2="366"/><g class="se-learning-cue se-feature--observe" data-feature="observe" aria-label="What Did You Notice?"><svg class="se-feature-icon se-feature--observe" x="113" y="375" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="169" y="404">What Did You Notice?</text></g><text class="se-copy" data-measure="826" x="113" y="460"><tspan x="113">Lind's<tspan data-gap="" dx="2.41100"> </tspan>sailors<tspan data-gap="" dx="2.41100"> </tspan>ate<tspan data-gap="" dx="2.41100"> </tspan>plenty<tspan data-gap="" dx="2.41100"> </tspan>of<tspan data-gap="" dx="2.41100"> </tspan>food<tspan data-gap="" dx="2.41100"> </tspan>and<tspan data-gap="" dx="2.41100"> </tspan>still<tspan data-gap="" dx="2.41100"> </tspan>fell<tspan data-gap="" dx="2.41100"> </tspan>ill.<tspan data-gap="" dx="2.41100"> </tspan>What<tspan data-gap="" dx="2.41100"> </tspan>does<tspan data-gap="" dx="2.41100"> </tspan>that<tspan data-gap="" dx="2.41100"> </tspan>tell<tspan data-gap="" dx="2.41100"> </tspan>you<tspan data-gap="" dx="2.41100"> </tspan>about</tspan><tspan x="113" dy="31">the difference between eating enough and eating well?</tspan></text><text class="se-heading" x="89" y="556.06"><tspan x="89">Case 2 — The swelling in the neck</tspan></text><image class="science-illustration" href="../../figures/reference/food/p012-himalayan-village.png" x="657" y="584" width="306" height="235" preserveAspectRatio="xMidYMid meet"><title>himalayan village</title></image><text class="se-copy" x="89" y="607"><tspan x="89">In the 1960s, Indian scientists studying the</tspan><tspan x="89" dy="31">Himalayan region and the northern plains found</tspan><tspan x="89" dy="31">that a large number of people there had a visible</tspan><tspan x="89" dy="31">swelling at the front of the neck. It was common in</tspan><tspan x="89" dy="31">some districts and rare in others only a few hundred</tspan><tspan x="89" dy="31">kilometres away.</tspan></text><text class="se-copy" data-measure="874" x="89" y="870"><tspan x="89">Following<tspan data-gap="" dx="0.32006"> </tspan>the<tspan data-gap="" dx="0.32006"> </tspan>scientists'<tspan data-gap="" dx="0.32006"> </tspan>findings,<tspan data-gap="" dx="0.32006"> </tspan>the<tspan data-gap="" dx="0.32006"> </tspan>Government<tspan data-gap="" dx="0.32006"> </tspan>of<tspan data-gap="" dx="0.32006"> </tspan>India<tspan data-gap="" dx="0.32006"> </tspan>promoted<tspan data-gap="" dx="0.32006"> </tspan>the<tspan data-gap="" dx="0.32006"> </tspan>addition<tspan data-gap="" dx="0.32006"> </tspan>of</tspan><tspan x="89" dy="31">iodine<tspan data-gap="" dx="3.74028"> </tspan>to<tspan data-gap="" dx="3.74028"> </tspan>common<tspan data-gap="" dx="3.74028"> </tspan>salt<tspan data-gap="" dx="3.74028"> </tspan>—<tspan data-gap="" dx="3.74028"> </tspan>iodised<tspan data-gap="" dx="3.74028"> </tspan>salt.<tspan data-gap="" dx="3.74028"> </tspan>Where<tspan data-gap="" dx="3.74028"> </tspan>people<tspan data-gap="" dx="3.74028"> </tspan>switched<tspan data-gap="" dx="3.74028"> </tspan>to<tspan data-gap="" dx="3.74028"> </tspan>it,<tspan data-gap="" dx="3.74028"> </tspan>the<tspan data-gap="" dx="3.74028"> </tspan>swellings</tspan><tspan x="89" dy="31">became far less common.</tspan></text><text class="se-copy" data-measure="874" x="89" y="977"><tspan x="89">The condition is called goitre.</tspan></text><g class="se-learning-cue se-feature--explain" data-feature="explain" aria-label="How It Works"><svg class="se-feature-icon se-feature--explain" x="89" y="1008" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h5m10 0h5M7 7l3 3m4 4 3 3M7 17l3-3m4-4 3-3M15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="145" y="1037">How It Works</text></g><text class="se-copy" data-measure="874" x="89" y="1078"><tspan x="89">Iodine<tspan data-gap="" dx="5.20471"> </tspan>deficiency<tspan data-gap="" dx="5.20471"> </tspan>can<tspan data-gap="" dx="5.20471"> </tspan>enlarge<tspan data-gap="" dx="5.20471"> </tspan>the<tspan data-gap="" dx="5.20471"> </tspan>thyroid<tspan data-gap="" dx="5.20471"> </tspan>gland,<tspan data-gap="" dx="5.20471"> </tspan>causing<tspan data-gap="" dx="5.20471"> </tspan>goitre.<tspan data-gap="" dx="5.20471"> </tspan>Diets<tspan data-gap="" dx="5.20471"> </tspan>relying<tspan data-gap="" dx="5.20471"> </tspan>on</tspan><tspan x="89" dy="31">crops<tspan data-gap="" dx="5.85132"> </tspan>from<tspan data-gap="" dx="5.85132"> </tspan>iodine-poor<tspan data-gap="" dx="5.85132"> </tspan>soil<tspan data-gap="" dx="5.85132"> </tspan>can<tspan data-gap="" dx="5.85132"> </tspan>contribute.<tspan data-gap="" dx="5.85132"> </tspan>But<tspan data-gap="" dx="5.85132"> </tspan>a<tspan data-gap="" dx="5.85132"> </tspan>neck<tspan data-gap="" dx="5.85132"> </tspan>swelling<tspan data-gap="" dx="5.85132"> </tspan>can<tspan data-gap="" dx="5.85132"> </tspan>have<tspan data-gap="" dx="5.85132"> </tspan>other</tspan><tspan x="89" dy="31">causes: symptoms alone do not diagnose a nutrient deficiency.</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">12</text></g><!-- /botanical-footer
