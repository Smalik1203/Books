<section class="page page--food page--science-editorial" data-science-chapter="3" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Food on Our Plate, page 15"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><circle class="se-botanical-stem" cx="46" cy="30" r="21"/><circle class="se-botanical-stem" cx="46" cy="30" r="14"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 3</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Food on Our Plate</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><rect class="se-reference-card" x="89" y="96" width="874" height="309" rx="10"/><text class="se-heading" x="113" y="138.06"><tspan x="113">Vitamin D</tspan></text><image class="science-illustration" href="../../figures/reference/food/p014-d-sources.png" x="113" y="158" width="240" height="130" preserveAspectRatio="xMidYMid meet"><title>d sources</title></image><text class="se-copy se-table-copy" x="113" y="316.4"><tspan x="113">Skin makes it in sunlight;</tspan><tspan x="113" dy="25">oily fish, egg yolk, fortified</tspan><tspan x="113" dy="25">milk</tspan></text><text class="se-copy se-table-copy" x="386" y="176.4"><tspan x="386">What it does: Helps the body absorb calcium for bones and teeth</tspan></text><text class="se-copy se-table-copy" x="386" y="217.4"><tspan x="386">Deficiency disorder: Rickets</tspan></text><text class="se-copy se-table-copy" x="386" y="258.4"><tspan x="386">Possible signs; not a diagnosis: Soft, bent bones</tspan></text><rect class="se-reference-card" x="89" y="423" width="874" height="284" rx="10"/><text class="se-heading" x="113" y="465.06"><tspan x="113">Calcium</tspan></text><image class="science-illustration" href="../../figures/reference/food/p014-calcium-sources.png" x="113" y="485" width="240" height="130" preserveAspectRatio="xMidYMid meet"><title>calcium sources</title></image><text class="se-copy se-table-copy" x="113" y="643.4"><tspan x="113">Milk, curd, cheese, paneer;</tspan><tspan x="113" dy="25">calcium-fortified soya milk</tspan></text><text class="se-copy se-table-copy" x="386" y="503.4"><tspan x="386">What it does: Keeps bones and teeth strong</tspan></text><text class="se-copy se-table-copy" x="386" y="544.4"><tspan x="386">Deficiency disorder: Poor bone mineralisation</tspan></text><text class="se-copy se-table-copy" x="386" y="585.4"><tspan x="386">Possible signs; not a diagnosis: Low intake over time can weaken</tspan><tspan x="386" dy="25">bones; tooth decay has other causes</tspan></text><rect class="se-reference-card" x="89" y="725" width="874" height="232" rx="10"/><text class="se-heading" x="113" y="767.06"><tspan x="113">Iodine</tspan></text><text class="se-copy se-table-copy" x="113" y="805.4"><tspan x="113">Iodised salt, seafood, dairy</tspan><tspan x="113" dy="25">and eggs; amounts vary</tspan></text><text class="se-copy se-table-copy" x="386" y="805.4"><tspan x="386">What it does: Needed to make thyroid hormones, supporting</tspan><tspan x="386" dy="25">growth and development</tspan></text><text class="se-copy se-table-copy" x="386" y="871.4"><tspan x="386">Deficiency disorder: Goitre</tspan></text><text class="se-copy se-table-copy" x="386" y="912.4"><tspan x="386">Possible signs; not a diagnosis: Swelling at the front of the neck</tspan></text><rect class="se-reference-card" x="89" y="975" width="874" height="207" rx="10"/><text class="se-heading" x="113" y="1017.06"><tspan x="113">Iron</tspan></text><text class="se-copy se-table-copy" x="113" y="1055.4"><tspan x="113">Pulses, leafy greens, meat</tspan><tspan x="113" dy="25">and iron-fortified foods;</tspan><tspan x="113" dy="25">absorption varies</tspan></text><text class="se-copy se-table-copy" x="386" y="1055.4"><tspan x="386">What it does: Part of haemoglobin, which carries oxygen in blood</tspan></text><text class="se-copy se-table-copy" x="386" y="1096.4"><tspan x="386">Deficiency disorder: Anaemia</tspan></text><text class="se-copy se-table-copy" x="386" y="1137.4"><tspan x="386">Possible signs; not a diagnosis: Weakness; shortness of breath</tspan></text><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="89" y1="1340" x2="862" y2="1340"/><text class="se-running se-footer-label" x="89" y="1320" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M1052 1320H915Q900 1320 892 1335L873 1369H1052Z"/><path class="se-botanical-ribbon" d="M1052 1320H935Q920 1320 912 1335L893 1369H1052Z"/><text class="se-folio" x="945" y="1354" text-anchor="middle">15</text></g><!-- /botanical-footer --></svg></div></div></section>
