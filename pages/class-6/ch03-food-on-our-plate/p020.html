<section class="page page--food page--science-editorial" data-science-chapter="3" data-folio="20"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Food on Our Plate, page 20"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><circle class="se-botanical-stem" cx="46" cy="30" r="21"/><circle class="se-botanical-stem" cx="46" cy="30" r="14"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 3</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">Food on Our Plate</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header --><g class="se-learning-cue se-feature--explain" data-feature="explain" aria-label="How It Works"><svg class="se-feature-icon se-feature--explain" x="89" y="105" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h5m10 0h5M7 7l3 3m4 4 3 3M7 17l3-3m4-4 3-3M15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="145" y="134">How It Works</text></g><text class="se-copy" data-measure="874" x="89" y="175"><tspan x="89">Iodine<tspan data-gap="" dx="2.20999"> </tspan>forms<tspan data-gap="" dx="2.20999"> </tspan>a<tspan data-gap="" dx="2.20999"> </tspan>blue-black<tspan data-gap="" dx="2.20999"> </tspan>complex<tspan data-gap="" dx="2.20999"> </tspan>with<tspan data-gap="" dx="2.20999"> </tspan>starch.<tspan data-gap="" dx="2.20999"> </tspan>Compare<tspan data-gap="" dx="2.20999"> </tspan>with<tspan data-gap="" dx="2.20999"> </tspan>the<tspan data-gap="" dx="2.20999"> </tspan>starch<tspan data-gap="" dx="2.20999"> </tspan>control:<tspan data-gap="" dx="2.20999"> </tspan>a</tspan><tspan x="89" dy="31">matching<tspan data-gap="" dx="2.79523"> </tspan>change<tspan data-gap="" dx="2.79523"> </tspan>supports<tspan data-gap="" dx="2.79523"> </tspan>starch<tspan data-gap="" dx="2.79523"> </tspan>being<tspan data-gap="" dx="2.79523"> </tspan>present.<tspan data-gap="" dx="2.79523"> </tspan>A<tspan data-gap="" dx="2.79523"> </tspan>negative<tspan data-gap="" dx="2.79523"> </tspan>result<tspan data-gap="" dx="2.79523"> </tspan>cannot<tspan data-gap="" dx="2.79523"> </tspan>establish</tspan><tspan x="89" dy="31">absence if the control failed.</tspan></text><image class="science-illustration" href="../../figures/reference/food/p018-starch-experiment.png" x="89" y="259" width="862" height="350" preserveAspectRatio="xMidYMid meet"><title>starch experiment</title></image><text class="se-copy se-table-copy" x="89" y="646.4"><tspan x="89">Fig. 3.7 — Testing food samples for starch</tspan></text><g aria-label="Activity 3.6 · Test for fat"><rect class="se-activity-panel" x="89" y="689" width="874" height="478"/><path class="se-activity-tab" d="M109 675H943Q963 675 963 695V718H89V695Q89 675 109 675Z"/><svg class="se-feature-icon se-feature--setup" x="109" y="681" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5ZM9 4V2h6v2M8 9h2m3 0h3M8 13h2m3 0h3M8 17h2m3 0h3"/></svg><text class="se-activity-tab-text" x="149" y="702"><tspan x="149">Investigate</tspan></text><text class="se-copy" x="113" y="762"><tspan x="113">You will need: the same food samples; plain paper.</tspan></text><text class="se-copy" x="113" y="807"><tspan x="113">Use cooking oil as a positive control and water as a negative control. Keep</tspan><tspan x="113" dy="31">sample amounts and waiting times alike. Record observations before</tspan><tspan x="113" dy="31">interpreting them.</tspan></text><text class="se-activity-step" x="113" y="914"><tspan x="113">1.</tspan></text><text class="se-copy" x="151" y="914"><tspan x="151">Take a small piece of each food from the iodine investigation.</tspan></text><text class="se-activity-step" x="113" y="959"><tspan x="113">2.</tspan></text><text class="se-copy" x="151" y="959"><tspan x="151">Place each on a separate piece of paper. Label the papers.</tspan></text><text class="se-activity-step" x="113" y="1004"><tspan x="113">3.</tspan></text><text class="se-copy" x="151" y="1004"><tspan x="151">Fold the paper over the food and press firmly. Do not tear it.</tspan></text><text class="se-activity-step" x="113" y="1049"><tspan x="113">4.</tspan></text><text class="se-copy" x="151" y="1049"><tspan x="151">If a food is watery, set the paper aside until it dries — a wet patch is not an</tspan><tspan x="151" dy="31">oily patch, and confusing the two will ruin your result.</tspan></text><text class="se-activity-step" x="113" y="1125"><tspan x="113">5.</tspan></text><text class="se-copy" x="151" y="1125"><tspan x="151">Hold each paper up to the light.</tspan></text></g><!-- botanical-footer --><g transform="translate(0 145)"><line class="se-footer-rule" x1="190" y1="1340" x2="963" y2="1340"/><text class="se-running se-footer-label" x="963" y="1320" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="se-botanical-shadow" d="M0 1320H137Q152 1320 160 1335L179 1369H0Z"/><path class="se-botanical-ribbon" d="M0 1320H117Q132 1320 140 1335L159 1369H0Z"/><text class="se-folio" x="107" y="1354" text-anchor="middle">20</text></g><!-- /botanical-footer --></svg></div></div></section>
