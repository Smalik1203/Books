"> </tspan>substantially<tspan data-gap="" dx="0.12090"> </tspan>more<tspan data-gap="" dx="0.12090"> </tspan>dietary<tspan data-gap="" dx="0.12090"> </tspan>fibre</tspan><tspan x="89" dy="31">than<tspan data-gap="" dx="1.04263"> </tspan>polished<tspan data-gap="" dx="1.04263"> </tspan>rice,<tspan data-gap="" dx="1.04263"> </tspan>along<tspan data-gap="" dx="1.04263"> </tspan>with<tspan data-gap="" dx="1.04263"> </tspan>iron,<tspan data-gap="" dx="1.04263"> </tspan>calcium<tspan data-gap="" dx="1.04263"> </tspan>and<tspan data-gap="" dx="1.04263"> </tspan>B<tspan data-gap="" dx="1.04263"> </tspan>vitamins.<tspan data-gap="" dx="1.04263"> </tspan>Because<tspan data-gap="" dx="1.04263"> </tspan>of<tspan data-gap="" dx="1.04263"> </tspan>this<tspan data-gap="" dx="1.04263"> </tspan>they<tspan data-gap="" dx="1.04263"> </tspan>are</tspan><tspan x="89" dy="31">often called nutri-cereals — cereals that carry protective nutrients alongside energy.</tspan></text><text class="se-copy" data-measure="874" x="89" y="1157"><tspan x="89">Many<tspan data-gap="" dx="5.33622"> </tspan>millets<tspan data-gap="" dx="5.33622"> </tspan>tolerate<tspan data-gap="" dx="5.33622"> </tspan>relatively<tspan data-gap="" dx="5.33622"> </tspan>dry<tspan data-gap="" dx="5.33622"> </tspan>conditions<tspan data-gap="" dx="5.33622"> </tspan>and<tspan data-gap="" dx="5.33622"> </tspan>can<tspan data-gap="" dx="5.33622"> </tspan>need<tspan data-gap="" dx="5.33622"> </tspan>less<tspan data-gap="" dx="5.33622"> </tspan>irrigation<tspan data-gap="" dx="5.33622"> </tspan>than</tspan><tspan x="89" dy="31">flooded<tspan data-gap="" dx="3.71234"> </tspan>rice.<tspan data-gap="" dx="3.71234"> </tspan>Water<tspan data-gap="" dx="3.71234"> </tspan>use<tspan data-gap="" dx="3.71234"> </tspan>still<tspan data-gap="" dx="3.71234"> </tspan>depends<tspan data-gap="" dx="3.71234"> </tspan>on<tspan data-gap="" dx="3.71234"> </tspan>crop,<tspan data-gap="" dx="3.71234"> </tspan>yield,<tspan data-gap="" dx="3.71234"> </t
