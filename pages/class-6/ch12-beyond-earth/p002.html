<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="stars-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">12.1 Stars and Their Patterns</tspan></text></g>
<g class="v2-reading-block" data-block="stars-start" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">At night, some points of light look bright and others faint. <tspan class="se-bold">Stars</tspan> produce their</tspan><tspan x="89" dy="32">own light. A star’s apparent brightness depends on its light output and its</tspan><tspan x="89" dy="32">distance from us, as well as conditions along the way. A brighter-looking star is</tspan><tspan x="89" dy="32">not necessarily nearer or larger than every faint one.</tspan></text></g>
<g class="v2-reading-block" data-block="pattern-task" transform="translate(0 314)"><rect class="se-activity-panel" x="89" y="0" width="874" height="686" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Look at the unconnected points below. Copy their arrangement into your</tspan><tspan x="146" dy="32">notebook. This is a drawing exercise, not a map for finding a real</tspan><tspan x="146" dy="32">constellation.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Imagine an object or animal suggested by some points. Join your chosen</tspan><tspan x="146" dy="32">points with lines and name your pattern. Try a second pattern using the</tspan><tspan x="146" dy="32">same points.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Compare with a partner. Which points did you choose? Tell a short story</tspan><tspan x="146" dy="32">about your pattern, and distinguish the invented story from the dots you</tspan><tspan x="146" dy="32">both observed.</tspan></text><g transform="translate(0 392)"><g data-diagram="pattern"><circle class="ch12-star" cx="220" cy="45" r="3"/><circle class="ch12-star" cx="330" cy="85" r="4"/><circle class="ch12-star" cx="460" cy="40" r="5"/><circle class="ch12-star" cx="620" cy="75" r="3"/><circle class="ch12-star" cx="805" cy="45" r="4"/><circle class="ch12-star" cx="255" cy="165" r="5"/><circle class="ch12-star" cx="420" cy="150" r="3"/><circle class="ch12-star" cx="550" cy="185" r="4"/><circle class="ch12-star" cx="730" cy="150" r="5"/><circle class="ch12-star" cx="850" cy="215" r="3"/></g></g><text class="se-caption" x="113" y="657.88"><tspan x="113">Fig. 12.1 · One arrangement can suggest different pictures.</tspan></text></g><g transform="translate(0 1022)"><g data-page-illustration="figures/class-6/science/ch12/telescope.png"><image class="science-illustration" href="../../figures/class-6/science/ch12/telescope.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A refracting telescope.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A refracting telescope.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
