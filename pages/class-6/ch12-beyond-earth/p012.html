<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="comet-art" transform="translate(0 112)"><image class="science-illustration" data-photo="comet" href="../../figures/class-6/science/ch12/comet.png" x="276" y="1.4210854715202004e-14" width="499.99999999999994" height="249.99999999999997" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="280.88"><tspan x="89">Fig. 12.10 · Artist’s impression of an active comet. Its nucleus is much smaller than the</tspan><tspan x="89" dy="27">surrounding coma and tails.</tspan></text></g>
<g class="v2-reading-block" data-block="comet-process" transform="translate(0 454)"><text class="se-copy" x="89" y="24"><tspan x="89">When a comet is warmed by the Sun, some ice changes directly into gas,</tspan><tspan x="89" dy="32">releasing dust. This forms a surrounding <tspan class="se-bold">coma</tspan>. Sunlight and the solar wind push</tspan><tspan x="89" dy="32">material generally away from the Sun, forming tails. A tail is not a trail of fire,</tspan><tspan x="89" dy="32">and it does not simply point backwards along the comet’s path.</tspan></text></g>
<g class="v2-reading-block" data-block="comet-orbits" transform="translate(0 598)"><text class="se-copy" x="89" y="24"><tspan x="89">Some comets return periodically; others may escape, break apart or collide with</tspan><tspan x="89" dy="32">another body. Halley’s comet takes roughly 76 years per orbit and last passed</tspan><tspan x="89" dy="32">through the inner Solar System in 1986. A comet’s appearance is a natural event,</tspan><tspan x="89" dy="32">not evidence that it causes good or bad luck.</tspan></text></g>
<g class="v2-reading-block" data-block="galaxy-heading" transform="translate(0 754)"><text class="v2-title" x="89" y="38"><tspan x="89">12.4 Our Home Galaxy</tspan></text></g>
<g class="v2-reading-block" data-block="milky-band" transform="translate(0 812)"><text class="se-copy" x="89" y="24"><tspan x="89">From a sufficiently dark location, part of the Milky Way can appear as a faint</tspan><tspan x="89" dy="32">band across the sky. Its position and visibility depend on season, time and</tspan><tspan x="89" dy="32">location; it is not always a fixed north-to-south stripe. We see this band because</tspan><tspan x="89" dy="32">we look through many stars and clouds within our galaxy’s disc.</tspan></text></g>
<g class="v2-reading-block" data-block="galaxy-art" transform="translate(0 956)"><image class="science-illustration" data-photo="galaxy" href="../../figures/class-6/science/ch12/galaxy.png" x="301" y="0" width="450" height="300" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="330.88"><tspan x="89">Fig. 12.11 · Artist’s external view of a spiral galaxy. We cannot take this outside view of our</tspan><tspan x="89" dy="27">own galaxy from Earth.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
