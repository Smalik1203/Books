<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="missions" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">India launched Chandrayaan-1 in 2008 and Chandrayaan-2 in 2019.</tspan><tspan x="89" dy="32">Chandrayaan-3’s Vikram lander, carrying the Pragyan rover, made a successful</tspan><tspan x="89" dy="32">soft landing in the Moon’s southern high-latitude region on 23 August 2023. The</tspan><tspan x="89" dy="32">date is observed as National Space Day. A landing in that region is not a landing</tspan><tspan x="89" dy="32">at the exact south pole.</tspan></text></g>
<g class="v2-reading-block" data-block="mission-evidence" transform="translate(0 288)"><text class="se-copy" x="89" y="24"><tspan x="89">Space missions answer questions using instruments, measurements and</tspan><tspan x="89" dy="32">carefully interpreted images. A photograph alone cannot show everything about</tspan><tspan x="89" dy="32">a world. To learn about a later mission or a proposed sample-return mission,</tspan><tspan x="89" dy="32">check ISRO’s current information and distinguish an announced plan from a</tspan><tspan x="89" dy="32">completed result.</tspan></text></g>
<g class="v2-reading-block" data-block="small-heading" transform="translate(0 476)"><text class="se-heading" x="89" y="30"><tspan x="89">Asteroids and Comets</tspan></text></g>
<g class="v2-reading-block" data-block="small-bodies" transform="translate(0 524)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 12.3 · Two kinds of small Solar System bodies</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="80"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Object</tspan></text><text class="v2-table-heading" x="277.8" y="76.08"><tspan x="277.8">Typical materials and</tspan><tspan x="277.8" dy="28">appearance</tspan></text><text class="v2-table-heading" x="653.62" y="76.08"><tspan x="653.62">Where or how it is seen</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="122" y2="122"/><text class="se-copy se-table-copy" x="103" y="156.07999999999998"><tspan x="103">Asteroid</tspan></text><text class="se-copy se-table-copy" x="277.8" y="156.07999999999998"><tspan x="277.8">Mainly rock and/or metal; many</tspan><tspan x="277.8" dy="28">are irregular</tspan></text><text class="se-copy se-table-copy" x="653.62" y="156.07999999999998"><tspan x="653.62">Many orbit in the main belt</tspan><tspan x="653.62" dy="28">between Mars and Jupiter</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="202" y2="202"/><text class="se-copy se-table-copy" x="103" y="236.07999999999998"><tspan x="103">Comet</tspan></text><text class="se-copy se-table-copy" x="277.8" y="236.07999999999998"><tspan x="277.8">Ices, dust and rocky material; can</tspan><tspan x="277.8" dy="28">develop a coma and tails</tspan></text><text class="se-copy se-table-copy" x="653.62" y="236.07999999999998"><tspan x="653.62">Some become active when</tspan><tspan x="653.62" dy="28">they approach the Sun</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="282" y2="282"/><rect class="v2-table-frame" x="89" y="42" width="874" height="240"/><line class="v2-table-rule" x1="263.8" x2="263.8" y1="42" y2="282"/><line class="v2-table-rule" x1="639.62" x2="639.62" y1="42" y2="282"/><text class="v2-table-note" x="89" y="314.88"><tspan x="89">There are exceptions and transitional objects; neither group is identified by shape alone.</tspan></text></g>
<g class="v2-reading-block" data-block="asteroids" transform="translate(0 864)"><text class="se-copy" x="89" y="24"><tspan x="89">The main asteroid belt contains many separated objects, not a tightly packed wall</tspan><tspan x="89" dy="32">of rocks. Some asteroids orbit elsewhere, including near Earth’s orbit. They cover</tspan><tspan x="89" dy="32">a wide range of sizes; the larger ones can be nearly round. A drawing of the belt</tspan><tspan x="89" dy="32">usually exaggerates both asteroid size and crowding so that the objects can be</tspan><tspan x="89" dy="32">seen.</tspan></text></g>
<g class="v2-reading-block" data-block="comet-art" transform="translate(0 1040)"><image class="science-illustration" data-photo="comet" href="../../figures/class-6/science/ch12/comet.png" x="276" y="1.4210854715202004e-14" width="499.99999999999994" height="249.99999999999997" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="280.88"><tspan x="89">Fig. 12.10 · Artist’s impression of an active comet. Its nucleus is much smaller than the</tspan><tspan x="89" dy="27">surrounding coma and tails.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
