<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="comet-process" transform="translate(0 112)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="7.96803" data-space-ratio="2.425">When<tspan dx="7.96803"> a</tspan><tspan dx="7.96803"> comet</tspan><tspan dx="7.96803"> is</tspan><tspan dx="7.96803"> warmed</tspan><tspan dx="7.96803"> by</tspan><tspan dx="7.96803"> the</tspan><tspan dx="7.96803"> Sun,</tspan><tspan dx="7.96803"> some</tspan><tspan dx="7.96803"> ice</tspan><tspan dx="7.96803"> changes</tspan><tspan dx="7.96803"> directly</tspan><tspan dx="7.96803"> into</tspan><tspan dx="7.96803"> gas,</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.92490" data-space-ratio="1.165">releasing<tspan dx="0.92490"> dust.</tspan><tspan dx="0.92490"> This</tspan><tspan dx="0.92490"> forms</tspan><tspan dx="0.92490"> a</tspan><tspan dx="0.92490"> surrounding</tspan><tspan dx="0.92490"> <tspan class="se-bold">coma</tspan>.</tspan><tspan dx="0.92490"> Sunlight</tspan><tspan dx="0.92490"> and</tspan><tspan dx="0.92490"> the</tspan><tspan dx="0.92490"> solar</tspan><tspan dx="0.92490"> wind</tspan><tspan dx="0.92490"> push</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.15327" data-space-ratio="1.564">material<tspan dx="3.15327"> generally</tspan><tspan dx="3.15327"> away</tspan><tspan dx="3.15327"> from</tspan><tspan dx="3.15327"> the</tspan><tspan dx="3.15327"> Sun,</tspan><tspan dx="3.15327"> forming</tspan><tspan dx="3.15327"> tails.</tspan><tspan dx="3.15327"> A</tspan><tspan dx="3.15327"> tail</tspan><tspan dx="3.15327"> is</tspan><tspan dx="3.15327"> not</tspan><tspan dx="3.15327"> a</tspan><tspan dx="3.15327"> trail</tspan><tspan dx="3.15327"> of</tspan><tspan dx="3.15327"> fire,</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">and it does not simply point backwards along the comet’s path.</tspan></text></g>
<g class="v2-reading-block" data-block="comet-orbits" transform="translate(0 256)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.76879" data-space-ratio="1.316">Some<tspan dx="1.76879"> comets</tspan><tspan dx="1.76879"> return</tspan><tspan dx="1.76879"> periodically;</tspan><tspan dx="1.76879"> others</tspan><tspan dx="1.76879"> may</tspan><tspan dx="1.76879"> escape,</tspan><tspan dx="1.76879"> break</tspan><tspan dx="1.76879"> apart</tspan><tspan dx="1.76879"> or</tspan><tspan dx="1.76879"> collide</tspan><tspan dx="1.76879"> with</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.78909" data-space-ratio="1.856">another<tspan dx="4.78909"> body.</tspan><tspan dx="4.78909"> Halley’s</tspan><tspan dx="4.78909"> comet</tspan><tspan dx="4.78909"> takes</tspan><tspan dx="4.78909"> roughly</tspan><tspan dx="4.78909"> 76</tspan><tspan dx="4.78909"> years</tspan><tspan dx="4.78909"> per</tspan><tspan dx="4.78909"> orbit</tspan><tspan dx="4.78909"> and</tspan><tspan dx="4.78909"> last</tspan><tspan dx="4.78909"> passed</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.68951" data-space-ratio="1.302">through<tspan dx="1.68951"> the</tspan><tspan dx="1.68951"> inner</tspan><tspan dx="1.68951"> Solar</tspan><tspan dx="1.68951"> System</tspan><tspan dx="1.68951"> in</tspan><tspan dx="1.68951"> 1986.</tspan><tspan dx="1.68951"> A</tspan><tspan dx="1.68951"> comet’s</tspan><tspan dx="1.68951"> appearance</tspan><tspan dx="1.68951"> is</tspan><tspan dx="1.68951"> a</tspan><tspan dx="1.68951"> natural</tspan><tspan dx="1.68951"> event,</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">not evidence that it causes good or bad luck.</tspan></text></g>
<g class="v2-reading-block" data-block="galaxy-heading" transform="translate(0 412)"><text class="v2-title" x="89" y="38"><tspan x="89">12.4 Our Home Galaxy</tspan></text></g>
<g class="v2-reading-block" data-block="milky-band" transform="translate(0 470)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.22514" data-space-ratio="1.756">From<tspan dx="4.22514"> a</tspan><tspan dx="4.22514"> sufficiently</tspan><tspan dx="4.22514"> dark</tspan><tspan dx="4.22514"> location,</tspan><tspan dx="4.22514"> part</tspan><tspan dx="4.22514"> of</tspan><tspan dx="4.22514"> the</tspan><tspan dx="4.22514"> Milky</tspan><tspan dx="4.22514"> Way</tspan><tspan dx="4.22514"> can</tspan><tspan dx="4.22514"> appear</tspan><tspan dx="4.22514"> as</tspan><tspan dx="4.22514"> a</tspan><tspan dx="4.22514"> faint</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="7.11875" data-space-ratio="2.273">band<tspan dx="7.11875"> across</tspan><tspan dx="7.11875"> the</tspan><tspan dx="7.11875"> sky.</tspan><tspan dx="7.11875"> Its</tspan><tspan dx="7.11875"> position</tspan><tspan dx="7.11875"> and</tspan><tspan dx="7.11875"> visibility</tspan><tspan dx="7.11875"> depend</tspan><tspan dx="7.11875"> on</tspan><tspan dx="7.11875"> season,</tspan><tspan dx="7.11875"> time</tspan><tspan dx="7.11875"> and</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.33560" data-space-ratio="1.418">location;<tspan dx="2.33560"> it</tspan><tspan dx="2.33560"> is</tspan><tspan dx="2.33560"> not</tspan><tspan dx="2.33560"> always</tspan><tspan dx="2.33560"> a</tspan><tspan dx="2.33560"> fixed</tspan><tspan dx="2.33560"> north-to-south</tspan><tspan dx="2.33560"> stripe.</tspan><tspan dx="2.33560"> We</tspan><tspan dx="2.33560"> see</tspan><tspan dx="2.33560"> this</tspan><tspan dx="2.33560"> band</tspan><tspan dx="2.33560"> because</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">we look through many stars and clouds within our galaxy’s disc.</tspan></text></g>
<g class="v2-reading-block" data-block="galaxy-art" transform="translate(0 614)"><image class="science-illustration" data-photo="galaxy" href="../../figures/class-6/science/ch12/galaxy.png" x="301" y="0" width="450" height="300" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="330.88"><tspan x="89">Fig. 12.11 · Artist’s external view of a spiral galaxy. We cannot take this outside view of our</tspan><tspan x="89" dy="27">own galaxy from Earth.</tspan></text></g>
<g class="v2-reading-block" data-block="galaxy" transform="translate(0 1006)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.41244" data-space-ratio="1.074">A<tspan dx="0.41244"> <tspan class="se-bold">galaxy</tspan></tspan><tspan dx="0.41244"> is</tspan><tspan dx="0.41244"> an</tspan><tspan dx="0.41244"> enormous</tspan><tspan dx="0.41244"> system</tspan><tspan dx="0.41244"> of</tspan><tspan dx="0.41244"> stars,</tspan><tspan dx="0.41244"> gas,</tspan><tspan dx="0.41244"> dust</tspan><tspan dx="0.41244"> and</tspan><tspan dx="0.41244"> other</tspan><tspan dx="0.41244"> matter</tspan><tspan dx="0.41244"> held</tspan><tspan dx="0.41244"> together</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.12662" data-space-ratio="1.201">by<tspan dx="1.12662"> gravity.</tspan><tspan dx="1.12662"> The</tspan><tspan dx="1.12662"> <tspan class="se-bold">Milky</tspan></tspan><tspan dx="1.12662"> <tspan class="se-bold">Way</tspan></tspan><tspan dx="1.12662"> <tspan class="se-bold">Galaxy</tspan>,</tspan><tspan dx="1.12662"> also</tspan><tspan dx="1.12662"> called</tspan><tspan dx="1.12662"> Akasha</tspan><tspan dx="1.12662"> Ganga,</tspan><tspan dx="1.12662"> is</tspan><tspan dx="1.12662"> our</tspan><tspan dx="1.12662"> home</tspan><tspan dx="1.12662"> galaxy.</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.27891" data-space-ratio="1.765">Our<tspan dx="4.27891"> Solar</tspan><tspan dx="4.27891"> System</tspan><tspan dx="4.27891"> is</tspan><tspan dx="4.27891"> one</tspan><tspan dx="4.27891"> small</tspan><tspan dx="4.27891"> part</tspan><tspan dx="4.27891"> of</tspan><tspan dx="4.27891"> it,</tspan><tspan dx="4.27891"> away</tspan><tspan dx="4.27891"> from</tspan><tspan dx="4.27891"> its</tspan><tspan dx="4.27891"> centre.</tspan><tspan dx="4.27891"> The</tspan><tspan dx="4.27891"> bright</tspan><tspan dx="4.27891"> sky</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">band and the entire galaxy are related, but are not identical views.</tspan></text></g>
<g class="v2-reading-block" data-block="universe-heading" transform="translate(0 1162)"><text class="v2-title" x="89" y="38"><tspan x="89">12.5 A Universe to Investigate</tspan></text></g>
<g class="v2-reading-block" data-block="universe" transform="translate(0 1220)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.37313" data-space-ratio="1.782">Many<tspan dx="4.37313"> galaxies</tspan><tspan dx="4.37313"> exist</tspan><tspan dx="4.37313"> beyond</tspan><tspan dx="4.37313"> the</tspan><tspan dx="4.37313"> Milky</tspan><tspan dx="4.37313"> Way.</tspan><tspan dx="4.37313"> The</tspan><tspan dx="4.37313"> <tspan class="se-bold">Universe</tspan></tspan><tspan dx="4.37313"> includes</tspan><tspan dx="4.37313"> space,</tspan><tspan dx="4.37313"> time</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.15937" data-space-ratio="1.207">and<tspan dx="1.15937"> all</tspan><tspan dx="1.15937"> the</tspan><tspan dx="1.15937"> matter</tspan><tspan dx="1.15937"> and</tspan><tspan dx="1.15937"> energy</tspan><tspan dx="1.15937"> within</tspan><tspan dx="1.15937"> it.</tspan><tspan dx="1.15937"> Telescopes</tspan><tspan dx="1.15937"> and</tspan><tspan dx="1.15937"> other</tspan><tspan dx="1.15937"> instruments</tspan><tspan dx="1.15937"> gather</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.18216" data-space-ratio="1.211">evidence<tspan dx="1.18216"> from</tspan><tspan dx="1.18216"> far</tspan><tspan dx="1.18216"> beyond</tspan><tspan dx="1.18216"> what</tspan><tspan dx="1.18216"> unaided</tspan><tspan dx="1.18216"> eyes</tspan><tspan dx="1.18216"> can</tspan><tspan dx="1.18216"> see.</tspan><tspan dx="1.18216"> Diagrams</tspan><tspan dx="1.18216"> that</tspan><tspan dx="1.18216"> place</tspan><tspan dx="1.18216"> Earth,</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.92110" data-space-ratio="1.344">the<tspan dx="1.92110"> Solar</tspan><tspan dx="1.92110"> System</tspan><tspan dx="1.92110"> and</tspan><tspan dx="1.92110"> the</tspan><tspan dx="1.92110"> Milky</tspan><tspan dx="1.92110"> Way</tspan><tspan dx="1.92110"> inside</tspan><tspan dx="1.92110"> larger</tspan><tspan dx="1.92110"> groups</tspan><tspan dx="1.92110"> show</tspan><tspan dx="1.92110"> membership,</tspan><tspan dx="1.92110"> not</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">physical walls.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
