<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 11"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="moon-heading" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">The Moon and Other Satellites</tspan></text></g>
<g class="v2-reading-block" data-block="moon-art" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">natural</tspan> <tspan class="se-bold">satellite</tspan>, or moon, orbits a larger</tspan><tspan x="89" dy="32">body. Earth has one natural Moon; Mars has</tspan><tspan x="89" dy="32">two. Mercury and Venus have none. Some</tspan><tspan x="89" dy="32">moons are larger than Mercury, so it is wrong</tspan><tspan x="89" dy="32">to say every moon is smaller than every</tspan><tspan x="89" dy="32">planet.</tspan></text><text class="se-copy" x="89" y="232"><tspan x="89">Our Moon is about 384,000 kilometres from</tspan><tspan x="89" dy="32">Earth on average, with a diameter about</tspan><tspan x="89" dy="32">one-quarter of Earth’s. It shines mainly by</tspan><tspan x="89" dy="32">reflecting sunlight. Its orbit around Earth</tspan><tspan x="89" dy="32">takes about 27.3 days relative to the distant</tspan><tspan x="89" dy="32">stars.</tspan></text><image class="science-illustration" data-photo="moon" href="../../figures/class-6/science/ch12/moon.png" x="648" y="0" width="280" height="280" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="448.88"><tspan x="89">Fig. 12.8 · Dark plains and impact craters mark the Moon’s surface.</tspan></text></g>
<g class="v2-reading-block" data-block="moon-phase" transform="translate(0 637)"><text class="se-copy" x="89" y="24"><tspan x="89">The Moon’s sunlit half is viewed from changing angles as it orbits Earth, giving us</tspan><tspan x="89" dy="32">its phases. The familiar new-Moon-to-new-Moon cycle takes about 29.5 days</tspan><tspan x="89" dy="32">because Earth is moving around the Sun too. The phase cycle and the orbital</tspan><tspan x="89" dy="32">period are related but are not the same interval. Phases are not ordinarily caused</tspan><tspan x="89" dy="32">by Earth’s shadow.</tspan></text></g>
<g class="v2-reading-block" data-block="craters" transform="translate(0 813)"><text class="se-copy" x="89" y="24"><tspan x="89">Many bowl-shaped lunar craters were made by impacts from space rocks. The</tspan><tspan x="89" dy="32">Moon has a very thin exosphere rather than Earth’s substantial atmosphere, and</tspan><tspan x="89" dy="32">lacks Earth-like rain and flowing surface water to wear features away quickly.</tspan><tspan x="89" dy="32">Water ice occurs in some permanently shadowed polar places; “no water</tspan><tspan x="89" dy="32">anywhere on the Moon” would be incorrect.</tspan></text></g>
