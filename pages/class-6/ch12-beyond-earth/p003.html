<g class="v2-reading-block" data-block="orion" transform="translate(0 615)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.89167" data-space-ratio="1.338">Orion’s<tspan dx="1.89167"> three</tspan><tspan dx="1.89167"> belt</tspan><tspan dx="1.89167"> stars</tspan><tspan dx="1.89167"> form</tspan><tspan dx="1.89167"> a</tspan><tspan dx="1.89167"> short,</tspan><tspan dx="1.89167"> nearly</tspan><tspan dx="1.89167"> straight</tspan><tspan dx="1.89167"> row.</tspan><tspan dx="1.89167"> Betelgeuse</tspan><tspan dx="1.89167"> lies</tspan><tspan dx="1.89167"> towards</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.39411" data-space-ratio="1.607">one<tspan dx="3.39411"> shoulder;</tspan><tspan dx="3.39411"> Rigel</tspan><tspan dx="3.39411"> marks</tspan><tspan dx="3.39411"> one</tspan><tspan dx="3.39411"> foot</tspan><tspan dx="3.39411"> in</tspan><tspan dx="3.39411"> the</tspan><tspan dx="3.39411"> traditional</tspan><tspan dx="3.39411"> figure.</tspan><tspan dx="3.39411"> Nearby</tspan><tspan dx="3.39411"> in</tspan><tspan dx="3.39411"> the</tspan><tspan dx="3.39411"> sky,</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.24032" data-space-ratio="1.937">Sirius<tspan dx="5.24032"> belongs</tspan><tspan dx="5.24032"> to</tspan><tspan dx="5.24032"> Canis</tspan><tspan dx="5.24032"> Major.</tspan><tspan dx="5.24032"> Sirius</tspan><tspan dx="5.24032"> is</tspan><tspan dx="5.24032"> the</tspan><tspan dx="5.24032"> brightest</tspan><tspan dx="5.24032"> star</tspan><tspan dx="5.24032"> in</tspan><tspan dx="5.24032"> Earth’s</tspan><tspan dx="5.24032"> night</tspan><tspan dx="5.24032"> sky,</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">although the Sun appears much brighter by day.</tspan></text></g>
<g class="v2-reading-block" data-block="names" transform="translate(0 759)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.65095" data-space-ratio="1.653">Different<tspan dx="3.65095"> traditions</tspan><tspan dx="3.65095"> give</tspan><tspan dx="3.65095"> these</tspan><tspan dx="3.65095"> objects</tspan><tspan dx="3.65095"> different</tspan><tspan dx="3.65095"> names.</tspan><tspan dx="3.65095"> Betelgeuse</tspan><tspan dx="3.65095"> is</tspan><tspan dx="3.65095"> associated</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.03434" data-space-ratio="1.364">with<tspan dx="2.03434"> Ardra,</tspan><tspan dx="2.03434"> Aldebaran</tspan><tspan dx="2.03434"> with</tspan><tspan dx="2.03434"> Rohini,</tspan><tspan dx="2.03434"> and</tspan><tspan dx="2.03434"> the</tspan><tspan dx="2.03434"> Pleiades</tspan><tspan dx="2.03434"> star</tspan><tspan dx="2.03434"> cluster</tspan><tspan dx="2.03434"> with</tspan><tspan dx="2.03434"> Krittika</tspan><tspan dx="2.03434"> in</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.93560" data-space-ratio="1.883">Indian<tspan dx="4.93560"> astronomical</tspan><tspan dx="4.93560"> traditions.</tspan><tspan dx="4.93560"> These</tspan><tspan dx="4.93560"> examples</tspan><tspan dx="4.93560"> do</tspan><tspan dx="4.93560"> not</tspan><tspan dx="4.93560"> make</tspan><tspan dx="4.93560"> every</tspan><tspan dx="4.93560"> traditional</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.13659" data-space-ratio="1.382">sky<tspan dx="2.13659"> division</tspan><tspan dx="2.13659"> identical</tspan><tspan dx="2.13659"> to</tspan><tspan dx="2.13659"> a</tspan><tspan dx="2.13659"> modern</tspan><tspan dx="2.13659"> constellation.</tspan><tspan dx="2.13659"> Ask</tspan><tspan
