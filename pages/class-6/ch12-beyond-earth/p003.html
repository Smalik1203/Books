<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="patterns" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">People in many cultures imagined shapes among the stars and used them to</tspan><tspan x="89" dy="32">remember parts of the sky. The joining lines are not objects in space. Stars that</tspan><tspan x="89" dy="32">look close together in a pattern may actually be at very different distances from</tspan><tspan x="89" dy="32">Earth. A pattern is a view from here, not a group tied together by lines.</tspan></text></g>
<g class="v2-reading-block" data-block="constellations" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">Astronomers now divide the whole sky into 88 defined regions called</tspan><tspan x="89" dy="32"><tspan class="se-bold">constellations</tspan>. Familiar patterns often lie within these regions. A well-known</tspan><tspan x="89" dy="32">pattern that is not itself an entire constellation is called an <tspan class="se-bold">asterism</tspan>. The Big</tspan><tspan x="89" dy="32">Dipper, for example, is part of the constellation Ursa Major.</tspan></text></g>

<g class="v2-reading-block" data-block="orion" transform="translate(0 903)"><text class="se-copy" x="89" y="24"><tspan x="89">Orion’s three belt stars form a short, nearly straight row. Betelgeuse lies towards</tspan><tspan x="89" dy="32">one shoulder; Rigel marks one foot in the traditional figure. Nearby in the sky,</tspan><tspan x="89" dy="32">Sirius belongs to Canis Major. Sirius is the brightest star in Earth’s night sky,</tspan><tspan x="89" dy="32">although the Sun appears much brighter by day.</tspan></text></g><g transform="translate(0 1047)"><g data-page-illustration="figures/class-6/science/ch12/telescope.png"><image class="science-illustration" href="../../figures/class-6/science/ch12/telescope.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A refracting telescope.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A refracting telescope.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
