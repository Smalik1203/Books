<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="day-stars" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Other stars are so much farther away that they appear as points. During the day,</tspan><tspan x="89" dy="32">sunlight scattered by Earth’s atmosphere makes the sky bright and overwhelms</tspan><tspan x="89" dy="32">their faint light. The stars have not switched off. After the Sun, the nearest star to</tspan><tspan x="89" dy="32">us is Proxima Centauri, more than four light-years away.</tspan></text></g>
<g class="v2-reading-block" data-block="energy" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">Sunlight powers photosynthesis and helps drive weather and the water cycle.</tspan><tspan x="89" dy="32">Earth’s rotation gives us the daily pattern of daylight and darkness. Seasons</tspan><tspan x="89" dy="32">depend on Earth’s tilted axis as it travels around the Sun, not simply on being</tspan><tspan x="89" dy="32">nearer to the Sun. These changes will be explored more fully in Class 7.</tspan></text></g>
<g class="v2-reading-block" data-block="planet-definition" transform="translate(0 400)"><text class="se-copy" x="89" y="24"><tspan x="89">Our <tspan class="se-bold">Solar</tspan> <tspan class="se-bold">System</tspan> contains the Sun and the objects bound to it by gravity,</tspan><tspan x="89" dy="32">including eight planets, dwarf planets, moons, asteroids and comets. In this</tspan><tspan x="89" dy="32">system, a planet orbits the Sun, is nearly round under its own gravity and has</tspan><tspan x="89" dy="32">cleared its orbital neighbourhood. “Cleared” means it is gravitationally dominant</tspan><tspan x="89" dy="32">there, not that its path is perfectly empty.</tspan></text></g>
<g class="v2-reading-block" data-block="motions" transform="translate(0 576)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 12.1 · Turning and travelling</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Motion</tspan></text><text class="v2-table-heading" x="312.76" y="76.08"><tspan x="312.76">Meaning</tspan></text><text class="v2-table-heading" x="662.36" y="76.08"><tspan x="662.36">Earth example</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Rotation</tspan></text><text class="se-copy se-table-copy" x="312.76" y="128.07999999999998"><tspan x="312.76">Turning about an axis</tspan></text><text class="se-copy se-table-copy" x="662.36" y="128.07999999999998"><tspan x="662.36">A solar day is about 24 hours</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="146" y2="146"/><text class="se-copy se-table-copy" x="103" y="180.07999999999998"><tspan x="103">Revolution</tspan></text><text class="se-copy se-table-copy" x="312.76" y="180.07999999999998"><tspan x="312.76">Travelling around another body</tspan><tspan x="312.76" dy="28">in an orbit</tspan></text><text class="se-copy se-table-copy" x="662.36" y="180.07999999999998"><tspan x="662.36">One orbit around the Sun</tspan><tspan x="662.36" dy="28">takes about a year</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="226" y2="226"/><rect class="v2-table-frame" x="89" y="42" width="874" height="184"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="42" y2="226"/><line class="v2-table-rule" x1="648.36" x2="648.36" y1="42" y2="226"/><text class="v2-table-note" x="89" y="258.88"><tspan x="89">Earth turns while it revolves. These are different motions happening together.</tspan></text></g>
<g class="v2-reading-block" data-block="inner-art" transform="translate(0 860)"><image class="science-illustration" data-photo="inner" href="../../figures/class-6/science/ch12/inner.png" x="196" y="0" width="660" height="220" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="250.88"><tspan x="89">Fig. 12.6 · Mercury, Venus, Earth and Mars, in order from the Sun. Displayed sizes and</tspan><tspan x="89" dy="27">spacing are not to scale.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
