<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="day-stars" transform="translate(0 112)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.69211" data-space-ratio="1.303">Other<tspan dx="1.69211"> stars</tspan><tspan dx="1.69211"> are</tspan><tspan dx="1.69211"> so</tspan><tspan dx="1.69211"> much</tspan><tspan dx="1.69211"> farther</tspan><tspan dx="1.69211"> away</tspan><tspan dx="1.69211"> that</tspan><tspan dx="1.69211"> they</tspan><tspan dx="1.69211"> appear</tspan><tspan dx="1.69211"> as</tspan><tspan dx="1.69211"> points.</tspan><tspan dx="1.69211"> During</tspan><tspan dx="1.69211"> the</tspan><tspan dx="1.69211"> day,</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.12602" data-space-ratio="1.559">sunlight<tspan dx="3.12602"> scattered</tspan><tspan dx="3.12602"> by</tspan><tspan dx="3.12602"> Earth’s</tspan><tspan dx="3.12602"> atmosphere</tspan><tspan dx="3.12602"> makes</tspan><tspan dx="3.12602"> the</tspan><tspan dx="3.12602"> sky</tspan><tspan dx="3.12602"> bright</tspan><tspan dx="3.12602"> and</tspan><tspan dx="3.12602"> overwhelms</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.93844" data-space-ratio="1.168">their<tspan dx="0.93844"> faint</tspan><tspan dx="0.93844"> light.</tspan><tspan dx="0.93844"> The</tspan><tspan dx="0.93844"> stars</tspan><tspan dx="0.93844"> have</tspan><tspan dx="0.93844"> not</tspan><tspan dx="0.93844"> switched</tspan><tspan dx="0.93844"> off.</tspan><tspan dx="0.93844"> After</tspan><tspan dx="0.93844"> the</tspan><tspan dx="0.93844"> Sun,</tspan><tspan dx="0.93844"> the</tspan><tspan dx="0.93844"> nearest</tspan><tspan dx="0.93844"> star</tspan><tspan dx="0.93844"> to</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">us is Proxima Centauri, more than four light-years away.</tspan></text></g>
<g class="v2-reading-block" data-block="energy" transform="translate(0 256)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.48007" data-space-ratio="1.980">Sunlight<tspan dx="5.48007"> powers</tspan><tspan dx="5.48007"> photosynthesis</tspan><tspan dx="5.48007"> and</tspan><tspan dx="5.48007"> helps</tspan><tspan dx="5.48007"> drive</tspan><tspan dx="5.48007"> weather</tspan><tspan dx="5.48007"> and</tspan><tspan dx="5.48007"> the</tspan><tspan dx="5.48007"> water</tspan><tspan dx="5.48007"> cycle.</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="6.93364" data-space-ratio="2.240">Earth’s<tspan dx="6.93364"> rotation</tspan><tspan dx="6.93364"> gives</tspan><tspan dx="6.93364"> us</tspan><tspan dx="6.93364"> the</tspan><tspan dx="6.93364"> daily</tspan><tspan dx="6.93364"> pattern</tspan><tspan dx="6.93364"> of</tspan><tspan dx="6.93364"> daylight</tspan><tspan dx="6.93364"> and</tspan><tspan dx="6.93364"> darkness.</tspan><tspan dx="6.93364"> Seasons</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.89683" data-space-ratio="1.697">depend<tspan dx="3.89683"> on</tspan><tspan dx="3.89683"> Earth’s</tspan><tspan dx="3.89683"> tilted</tspan><tspan dx="3.89683"> axis</tspan><tspan dx="3.89683"> as</tspan><tspan dx="3.89683"> it</tspan><tspan dx="3.89683"> travels</tspan><tspan dx="3.89683"> around</tspan><tspan dx="3.89683"> the</tspan><tspan dx="3.89683"> Sun,</tspan><tspan dx="3.89683"> not</tspan><tspan dx="3.89683"> simply</tspan><tspan dx="3.89683"> on</tspan><tspan dx="3.89683"> being</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">nearer to the Sun. These changes will be explored more fully in Class 7.</tspan></text></g>
<g class="v2-reading-block" data-block="planet-definition" transform="translate(0 400)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="7.52728" data-space-ratio="2.346">Our<tspan dx="7.52728"> <tspan class="se-bold">Solar</tspan></tspan><tspan dx="7.52728"> <tspan class="se-bold">System</tspan></tspan><tspan dx="7.52728"> contains</tspan><tspan dx="7.52728"> the</tspan><tspan dx="7.52728"> Sun</tspan><tspan dx="7.52728"> and</tspan><tspan dx="7.52728"> the</tspan><tspan dx="7.52728"> objects</tspan><tspan dx="7.52728"> bound</tspan><tspan dx="7.52728"> to</tspan><tspan dx="7.52728"> it</tspan><tspan dx="7.52728"> by</tspan><tspan dx="7.52728"> gravity,</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="6.82392" data-space-ratio="2.220">including<tspan dx="6.82392"> eight</tspan><tspan dx="6.82392"> planets,</tspan><tspan dx="6.82392"> dwarf</tspan><tspan dx="6.82392"> planets,</tspan><tspan dx="6.82392"> moons,</tspan><tspan dx="6.82392"> asteroids</tspan><tspan dx="6.82392"> and</tspan><tspan dx="6.82392"> comets.</tspan><tspan dx="6.82392"> In</tspan><tspan dx="6.82392"> this</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.78777" data-space-ratio="1.677">system,<tspan dx="3.78777"> a</tspan><tspan dx="3.78777"> planet</tspan><tspan dx="3.78777"> orbits</tspan><tspan dx="3.78777"> the</tspan><tspan dx="3.78777"> Sun,</tspan><tspan dx="3.78777"> is</tspan><tspan dx="3.78777"> nearly</tspan><tspan dx="3.78777"> round</tspan><tspan dx="3.78777"> under</tspan><tspan dx="3.78777"> its</tspan><tspan dx="3.78777"> own</tspan><tspan dx="3.78777"> gravity</tspan><tspan dx="3.78777"> and</tspan><tspan dx="3.78777"> has</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.29431" data-space-ratio="1.231">cleared<tspan dx="1.29431"> its</tspan><tspan dx="1.29431"> orbital</tspan><tspan dx="1.29431"> neighbourhood.</tspan><tspan dx="1.29431"> “Cleared”</tspan><tspan dx="1.29431"> means</tspan><tspan dx="1.29431"> it</tspan><tspan dx="1.29431"> is</tspan><tspan dx="1.29431"> gravitationally</tspan><tspan dx="1.29431"> dominant</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">there, not that its path is perfectly empty.</tspan></text></g>
<g class="v2-reading-block" data-block="motions" transform="translate(0 576)"><g data-table-spacing="airy" data-comparison-table="motions"><text class="v2-table-caption" x="89" y="33.6"><tspan x="89">Table 12.1 · Turning and travelling</tspan></text><rect class="se-table-head" x="89" y="54" width="874" height="52"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="88.08"><tspan x="103">Motion</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="312.76" y="88.08"><tspan x="312.76">Meaning</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="662.36" y="88.08"><tspan x="662.36">Earth example</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="106" y2="106"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="140.07999999999998"><tspan x="103">Rotation</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="140.07999999999998"><tspan x="312.76">Turning about an axis</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="662.36" y="140.07999999999998"><tspan x="662.36">A solar day is about 24 hours</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="158" y2="158"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="192.07999999999998"><tspan x="103">Revolution</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="192.07999999999998"><tspan x="312.76">Travelling around another body</tspan><tspan x="312.76" dy="28">in an orbit</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="662.36" y="192.07999999999998"><tspan x="662.36">One orbit around the Sun</tspan><tspan x="662.36" dy="28">takes about a year</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="238" y2="238"/><rect clas <g class="v2-reading-block" data-block="inner-worlds" transform="translate(0 1200)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.58103" data-space-ratio="1.462">The<tspan dx="2.58103"> four</tspan><tspan dx="2.58103"> inner</tspan><tspan dx="2.58103"> planets—<tspan class="se-bold">Mercury,</tspan></tspan><tspan dx="2.58103"> <tspan class="se-bold">Venus,</tspan></tspan><tspan dx="2.58103"> <tspan class="se-bold">Earth</tspan></tspan><tspan dx="2.58103"> <tspan class="se-bold">and</tspan></tspan><tspan dx="2.58103"> <tspan class="se-bold">Mars</tspan>—have</tspan><tspan dx="2.58103"> rocky</tspan><tspan dx="2.58103"> surfaces.</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.85757" data-space-ratio="1.153">Mercury<tspan dx="0.85757"> is</tspan><tspan dx="0.85757"> nearest</tspan><tspan dx="0.85757"> the</tspan><tspan dx="0.85757"> Sun.</tspan><tspan dx="0.85757"> Venus</tspan><tspan dx="0.85757"> is</tspan><tspan dx="0.85757"> covered</tspan><tspan dx="0.85757"> by</tspan><tspan dx="0.85757"> thick</tspan><tspan dx="0.85757"> clouds.</tspan><tspan dx="0.85757"> Earth</tspan><tspan dx="0.85757"> has</tspan><tspan dx="0.85757"> extensive</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="7.11376" data-space-ratio="2.272">surface<tspan dx="7.11376"> oceans.</tspan><tspan dx="7.11376"> Rust-coloured</tspan><tspan dx="7.11376"> materials</tspan><tspan dx="7.11376"> on</tspan><tspan dx="7.11376"> Mars</tspan><tspan dx="7.11376"> help</tspan><tspan dx="7.11376"> give</tspan><tspan dx="7.11376"> it</tspan><tspan dx="7.11376"> the</tspan><tspan dx="7.11376"> name</tspan><tspan dx="7.11376"> Red</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">Planet. Similar membership in a group does not mean identical conditions.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
