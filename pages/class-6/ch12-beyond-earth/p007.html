<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="system-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">12.3 Our Solar System</tspan></text></g>
<g class="v2-reading-block" data-block="sun-art" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">The <tspan class="se-bold">Sun</tspan> is our nearest star. It is an enormous,</tspan><tspan x="89" dy="32">very hot sphere, mostly hydrogen and helium.</tspan><tspan x="89" dy="32">Nuclear fusion in its interior releases energy</tspan><tspan x="89" dy="32">that eventually leaves as light and other</tspan><tspan x="89" dy="32">radiation. It is not an ordinary fire burning in</tspan><tspan x="89" dy="32">air.</tspan></text><text class="se-copy" x="89" y="232"><tspan x="89">Earth is about 150 million kilometres from the</tspan><tspan x="89" dy="32">Sun on average. This distance is</tspan><tspan x="89" dy="32">approximately one astronomical unit, or au.</tspan><tspan x="89" dy="32">The Sun’s diameter is about 109 times Earth’s,</tspan><tspan x="89" dy="32">yet it looks small because it is far away.</tspan></text><image class="science-illustration" data-photo="sun" href="../../figures/class-6/science/ch12/sun.png" x="665.389202256245" y="0" width="245.22159548751006" height="240" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="416.88"><tspan x="89">Fig. 12.5 · An illustrated Sun. Never observe it directly with your eyes or ordinary optical</tspan><tspan x="89" dy="27">equipment.</tspan></text></g>
<g class="v2-reading-block" data-block="day-stars" transform="translate(0 642)"><text class="se-copy" x="89" y="24"><tspan x="89">Other stars are so much farther away that they appear as points. During the day,</tspan><tspan x="89" dy="32">sunlight scattered by Earth’s atmosphere makes the sky bright and overwhelms</tspan><tspan x="89" dy="32">their faint light. The stars have not switched off. After the Sun, the nearest star to</tspan><tspan x="89" dy="32">us is Proxima Centauri, more than four light-years away.</tspan></text></g>
<g class="v2-reading-block" data-block="energy" transform="translate(0 786)"><text class="se-copy" x="89" y="24"><tspan x="89">Sunlight powers photosynthesis and helps drive weather and the water cycle.</tspan><tspan x="89" dy="32">Earth’s rotation gives us the daily pattern of daylight and darkness. Seasons</tspan><tspan x="89" dy="32">depend on Earth’s tilted axis as it travels around the Sun, not simply on being</tspan><tspan x="89" dy="32">nearer to the Sun. These changes will be explored more fully in Class 7.</tspan></text></g>
<g class="v2-reading-block" data-block="planet-definition" transform="translate(0 930)"><text class="se-copy" x="89" y="24"><tspan x="89">Our <tspan class="se-bold">Solar</tspan> <tspan class="se-bold">System</tspan> contains the Sun and the objects bound to it by gravity,</tspan><tspan x="89" dy="32">including eight planets, dwarf planets, moons, asteroids and comets. In this</tspan><tspan x="89" dy="32">system, a planet orbits the Sun, is nearly round under its own gravity and has</tspan><tspan x="89" dy="32">cleared its orbital neighbourhood. “Cleared” means it is gravitationally dominant</tspan><tspan x="89" dy="32">there, not that its path is perfectly empty.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
