<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204"><tspan x="112">Stars produce their own light. Apparent patterns do not mean their stars are</tspan><tspan x="112" dy="32">close together in space.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278"><tspan x="112">The sky has 88 constellation regions. The Big Dipper is an asterism within Ursa</tspan><tspan x="112" dy="32">Major.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352"><tspan x="112">Polaris appears nearly stationary near the north celestial pole. A current chart</tspan><tspan x="112" dy="32">helps identify it from the Northern Hemisphere.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426"><tspan x="112">Sky visibility depends on place, date, time and conditions. Observe with an</tspan><tspan x="112" dy="32">adult and never look directly at the Sun.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500"><tspan x="112">The Sun is our nearest star. Scattered sunlight makes other stars difficult to see</tspan><tspan x="112" dy="32">in the daytime sky.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574"><tspan x="112">The planets in order are Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus</tspan><tspan x="112" dy="32">and Neptune. Pluto is a dwarf planet.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648"><tspan x="112">Earth rotates while revolving around the Sun. A day and a year describe</tspan><tspan x="112" dy="32">different motions.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722"><tspan x="112">The Moon reflects sunlight. Its orbit takes about 27.3 days; its phase cycle takes</tspan><tspan x="112" dy="32">about 29.5 days.</tspan></text><text class="se-copy" x="89" y="796" text-anchor="start">•</text><text class="se-copy" x="112" y="796"><tspan x="112">Asteroids and comets are Solar System members. Comet tails form when</tspan><tspan x="112" dy="32">sunlight and solar wind act on released material.</tspan></text><text class="se-copy" x="89" y="870" text-anchor="start">•</text><text class="se-copy" x="112" y="870"><tspan x="112">Our Solar System belongs to the Milky Way. Other galaxies and exoplanets</tspan><tspan x="112" dy="32">exist; life beyond Earth is not yet confirmed.</tspan></text><image class="science-illustration" data-photo="galaxy" href="../../figures/class-6/science/ch12/galaxy.png" x="361" y="945" width="330" height="220" preserveAspectRatio="xMidYMid meet"/><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
