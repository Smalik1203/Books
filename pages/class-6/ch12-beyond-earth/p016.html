<g class="v2-reading-block" data-block="q2" transform="translate(0 608)"><text class="se-copy" x="111" y="24" text-anchor="end">2.</text><text class="se-copy" x="132" y="24"><tspan x="132">Solve this planet riddle: my first letter is in MAN but not CAN; my second is in</tspan><tspan x="132" dy="32">ACE and FAN; my third is in RAT but not CAT; my fourth is in SUN but not</tspan><tspan x="132" dy="32">FUN. Name the planet, then make two similar riddles about objects in space</tspan><tspan x="132" dy="32">and check that each gives one clear answer.</tspan></text></g>
<g class="v2-reading-block" data-block="q3" transform="translate(0 766)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24"><tspan x="132">Which is not a member of our Solar System: Sirius, comets, asteroids or</tspan><tspan x="132" dy="32">Pluto? Give a reason that distinguishes a star outside our system from bodies</tspan><tspan x="132" dy="32">belonging to it.</tspan></text></g>
