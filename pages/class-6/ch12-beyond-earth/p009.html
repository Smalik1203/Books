<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="planet-groups" transform="translate(0 112)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 12.2 · Comparing groups of planets</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Group</tspan></text><text class="v2-table-heading" x="304.02" y="76.08"><tspan x="304.02">Members</tspan></text><text class="v2-table-heading" x="592.44" y="76.08"><tspan x="592.44">Main distinction</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Rocky planets</tspan></text><text class="se-copy se-table-copy" x="304.02" y="128.07999999999998"><tspan x="304.02">Mercury, Venus, Earth,</tspan><tspan x="304.02" dy="28">Mars</tspan></text><text class="se-copy se-table-copy" x="592.44" y="128.07999999999998"><tspan x="592.44">Relatively small, with solid rocky</tspan><tspan x="592.44" dy="28">surfaces</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="174" y2="174"/><text class="se-copy se-table-copy" x="103" y="208.07999999999998"><tspan x="103">Gas giants</tspan></text><text class="se-copy se-table-copy" x="304.02" y="208.07999999999998"><tspan x="304.02">Jupiter, Saturn</tspan></text><text class="se-copy se-table-copy" x="592.44" y="208.07999999999998"><tspan x="592.44">Very large; mainly hydrogen and</tspan><tspan x="592.44" dy="28">helium</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="254" y2="254"/><text class="se-copy se-table-copy" x="103" y="288.08"><tspan x="103">Ice giants</tspan></text><text class="se-copy se-table-copy" x="304.02" y="288.08"><tspan x="304.02">Uranus, Neptune</tspan></text><text class="se-copy se-table-copy" x="592.44" y="288.08"><tspan x="592.44">Rich in materials such as water,</tspan><tspan x="592.44" dy="28">ammonia and methane beneath</tspan><tspan x="592.44" dy="28">their atmospheres</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="362" y2="362"/><rect class="v2-table-frame" x="89" y="42" width="874" height="320"/><line class="v2-table-rule" x1="290.02" x2="290.02" y1="42" y2="362"/><line class="v2-table-rule" x1="578.44" x2="578.44" y1="42" y2="362"/><text class="v2-table-note" x="89" y="394.88"><tspan x="89">“Ice giant” describes composition; it does not mean a solid frozen surface you could stand on.</tspan></text></g>
<g class="v2-reading-block" data-block="rings" transform="translate(0 532)"><text class="se-copy" x="89" y="24"><tspan x="89">All four giant planets have rings, though Saturn’s are easiest to recognise. Rings</tspan><tspan x="89" dy="32">contain many separate particles; they are not solid hoops. Saturn’s bright rings</tspan><tspan x="89" dy="32">are mainly water ice, with some rocky material and dust. The giant planets also</tspan><tspan x="89" dy="32">have many natural satellites.</tspan></text></g>
<g class="v2-reading-block" data-block="temperature" transform="translate(0 676)"><text class="se-copy" x="89" y="24"><tspan x="89">Distance affects the sunlight a planet receives, but atmosphere matters too.</tspan><tspan x="89" dy="32">Venus’s thick atmosphere traps heat, making its surface hotter than Mercury’s</tspan><tspan x="89" dy="32">even though Venus is farther from the Sun. One factor alone is not enough to</tspan><tspan x="89" dy="32">explain every planet’s temperature.</tspan></text></g>
<g class="v2-reading-block" data-block="pluto" transform="translate(0 820)"><text class="se-copy" x="89" y="24"><tspan x="89">Pluto is a <tspan class="se-bold">dwarf</tspan> <tspan class="se-bold">planet</tspan>, not one of the eight planets. It orbits the Sun and is</tspan><tspan x="89" dy="32">nearly round, but has not cleared its orbital neighbourhood. Dwarf planets</tspan><tspan x="89" dy="32">remain members of the Solar System. Being small by itself is not the whole</tspan><tspan x="89" dy="32">definition; Ceres in the asteroid belt is another dwarf planet.</tspan></text></g><g transform="translate(0 964)"><g data-page-illustration="figures/class-6/science/ch12/inner.png"><image class="science-illustration" href="../../figures/class-6/science/ch12/inner.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>The four inner planets. Sizes are not to scale.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">The four inner planets.</tspan><tspan x="539" dy="27">Sizes are not to scale.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
