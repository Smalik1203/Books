<g class="v2-reading-block" data-block="twinkling" transform="translate(0 888)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.37170" data-space-ratio="1.603">Stars<tspan dx="3.37170"> often</tspan><tspan dx="3.37170"> twinkle</tspan><tspan dx="3.37170"> more</tspan><tspan dx="3.37170"> than</tspan><tspan dx="3.37170"> planets</tspan><tspan dx="3.37170"> because</tspan><tspan dx="3.37170"> turbulent</tspan><tspan dx="3.37170"> air</tspan><tspan dx="3.37170"> changes</tspan><tspan dx="3.37170"> how</tspan><tspan dx="3.37170"> their</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.95575" data-space-ratio="1.171">tiny<tspan dx="0.95575"> points</tspan><tspan dx="0.95575"> of</tspan><tspan dx="0.95575"> light</tspan><tspan dx="0.95575"> reach</tspan><tspan dx="0.95575"> us.</tspan><tspan dx="0.95575"> Planets</tspan><tspan dx="0.95575"> have</tspan><tspan dx="0.95575"> a</tspan><tspan dx="0.95575"> small</tspan><tspan dx="0.95575"> apparent</tspan><tspan dx="0.95575"> disc,</tspan><tspan dx="0.95575"> so</tspan><tspan dx="0.95575"> these</tspan><tspan dx="0.95575"> changes</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="7.37916" data-space-ratio="2.320">tend<tspan dx="7.37916"> to</tspan><tspan dx="7.37916"> average</tspan><tspan dx="7.37916"> out.</tspan><tspan dx="7.37916"> This</tspan><tspan dx="7.37916"> is</tspan><tspan dx="7.37916"> a</tspan><tspan dx="7.37916"> clue,</tspan><tspan dx="7.37916"> not</tspan><tspan dx="7.37916"> a</tspan><tspan dx="7.37916"> certain</tspan><tspan dx="7.37916"> test:</tspan><tspan dx="7.37916"> planets</tspan><tspan dx="7.37916"> can</tspan><tspan dx="7.37916"> twinkle,</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">especially near the horizon. Use position and a sky map as further evidence.</ts
