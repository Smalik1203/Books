<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="temperature" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Distance affects the sunlight a planet receives, but atmosphere matters too.</tspan><tspan x="89" dy="32">Venus’s thick atmosphere traps heat, making its surface hotter than Mercury’s</tspan><tspan x="89" dy="32">even though Venus is farther from the Sun. One factor alone is not enough to</tspan><tspan x="89" dy="32">explain every planet’s temperature.</tspan></text></g>
<g class="v2-reading-block" data-block="pluto" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">Pluto is a <tspan class="se-bold">dwarf</tspan> <tspan class="se-bold">planet</tspan>, not one of the eight planets. It orbits the Sun and is</tspan><tspan x="89" dy="32">nearly round, but has not cleared its orbital neighbourhood. Dwarf planets</tspan><tspan x="89" dy="32">remain members of the Solar System. Being small by itself is not the whole</tspan><tspan x="89" dy="32">definition; Ceres in the asteroid belt is another dwarf planet.</tspan></text></g>
<g class="v2-reading-block" data-block="venus-heading" transform="translate(0 412)"><text class="se-heading" x="89" y="30"><tspan x="89">Identifying a Planet in the Sky</tspan></text></g>
<g class="v2-reading-block" data-block="planet-light" transform="translate(0 460)"><text class="se-copy" x="89" y="24"><tspan x="89">Planets seen with unaided eyes usually appear as points reflecting sunlight.</tspan><tspan x="89" dy="32">Venus is often very bright and is sometimes called the Morning Star or Evening</tspan><tspan x="89" dy="32">Star, although it is a planet. It is not visible at both times on every date. Mercury,</tspan><tspan x="89" dy="32">Mars, Jupiter and Saturn can also be visible without a telescope when conditions</tspan><tspan x="89" dy="32">are suitable.</tspan></text></g>
<g class="v2-reading-block" data-block="venus-task" transform="translate(0 636)"><rect class="se-activity-panel" x="89" y="0" width="874" height="510" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Ask an adult to use a current sky map to select a date when Venus is well</tspan><tspan x="146" dy="32">placed after sunset or before sunrise. Do not search while the Sun is</tspan><tspan x="146" dy="32">above the horizon.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">For an evening appearance, check the western sky after sunset. For a</tspan><tspan x="146" dy="32">morning appearance, check the eastern sky before sunrise and stop</tspan><tspan x="146" dy="32">before the Sun rises. Use unaided eyes only.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Record direction, time and the bright point’s position relative to a fixed</tspan><tspan x="146" dy="32">landmark. Confirm the identification using the chart. Do not infer that</tspan><tspan x="146" dy="32">every bright point near the horizon is Venus.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Repeat on another suitable date if possible. Note conditions and whether</tspan><tspan x="146" dy="32">the predicted object was visible. Stay with your accompanying adult</tspan><tspan x="146" dy="32">throughout.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
