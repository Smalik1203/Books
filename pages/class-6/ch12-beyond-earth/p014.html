<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="802" rx="18"/><text class="se-copy" x="113" y="222" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Star</tspan> — An object that produces its</tspan><tspan x="113" dy="32" data-narrow-prose="true">own light through processes within</tspan><tspan x="113" dy="32" data-paragraph-end="true">it.</tspan></text><text class="se-copy" x="113" y="338" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Constellation</tspan> — One of the 88</tspan><tspan x="113" dy="32" data-paragraph-end="true">defined regions of the sky.</tspan></text><text class="se-copy" x="113" y="422" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Asterism</tspan> — A recognisable star</tspan><tspan x="113" dy="32" data-paragraph-end="true">pattern, such as the Big Dipper.</tspan></text><text class="se-copy" x="113" y="506" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Pole</tspan> <tspan class="se-bold">Star</tspan> — Polaris, near the</tspan><tspan x="113" dy="32" data-narrow-prose="true">direction of Earth’s north rotation</tspan><tspan x="113" dy="32" data-paragraph-end="true">axis.</tspan></text><text class="se-copy" x="113" y="622" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Light</tspan> <tspan class="se-bold">pollution</tspan> — Unwanted or</tspan><tspan x="113" dy="32" data-paragraph-end="true">excessive artificial light at night.</tspan></text><text class="se-copy" x="113" y="706" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Astronomical</tspan> <tspan class="se-bold">unit</tspan> — About 150</tspan><tspan x="113" dy="32" data-narrow-prose="true">million km, roughly the mean</tspan><tspan x="113" dy="32" data-paragraph-end="true">Earth–Sun distance.</tspan></text><text class="se-copy" x="113" y="822" data-prose-align="justify"><tspan x="113" data-paragraph-end="true"><tspan class="se-bold">Rotation</tspan> — Turning about an axis.</tspan></text><text class="se-copy" x="113" y="874" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Revolution</tspan> — Motion around</tspan><tspan x="113" dy="32" data-paragraph-end="true">another body along an orbit.</tspan></text><text class="se-copy" x="541" y="222" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Planet</tspan> — In our system, a nearly</tspan><tspan x="541" dy="32" data-narrow-prose="true">round Sun-orbiting body dominant</tspan><tspan x="541" dy="32" data-paragraph-end="true">in its orbital neighbourhood.</tspan></text><text class="se-copy" x="541" y="338" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Natural</tspan> <tspan class="se-bold">satellite</tspan> — A naturally</tspan><tspan x="541" dy="32" data-narrow-prose="true">occurring body orbiting a larger</tspan><tspan x="541" dy="32" data-paragraph-end="true">body.</tspan></text><text class="se-copy" x="541" y="454" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Solar</tspan> <tspan class="se-bold">System</tspan> — The Sun and objects</tspan><tspan x="541" dy="32" data-paragraph-end="true">gravitationally bound to it.</tspan></text><text class="se-copy" x="541" y="538" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Asteroid</tspan> — A small body, mainly</tspan><tspan x="541" dy="32" data-paragraph-end="true">rock or metal, orbiting the Sun.</tspan></text><text class="se-copy" x="541" y="622" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Comet</tspan> — An icy body that can</tspan><tspan x="541" dy="32" data-narrow-prose="true">develop a coma and tails near the</tspan><tspan x="541" dy="32" data-paragraph-end="true">Sun.</tspan></text><text class="se-copy" x="541" y="738" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Galaxy</tspan> — A vast system of stars and</tspan><tspan x="541" dy="32" data-paragraph-end="true">other matter bound by gravity.</tspan></text><text class="se-copy" x="541" y="822" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Exoplanet</tspan> — A planet orbiting a star</tspan><tspan x="541" dy="32" data-paragraph-end="true">other than the Sun.</tspan></text><text class="se-copy" x="541" y="906" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Universe</tspan> — All space, time, matter</tspan><tspan x="541" dy="32" data-paragraph-end="true">and energy.</tspan></text><g transform="translate(0 976)"><g data-page-illustration="figures/class-7/science/ch12/earth.png"><image class="science-illustration" href="../../figures/class-7/science/ch12/earth.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Earth.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Earth.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
