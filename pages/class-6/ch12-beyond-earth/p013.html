<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="galaxy" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">galaxy</tspan> is an enormous system of stars, gas, dust and other matter held together</tspan><tspan x="89" dy="32">by gravity. The <tspan class="se-bold">Milky</tspan> <tspan class="se-bold">Way</tspan> <tspan class="se-bold">Galaxy</tspan>, also called Akasha Ganga, is our home galaxy.</tspan><tspan x="89" dy="32">Our Solar System is one small part of it, away from its centre. The bright sky</tspan><tspan x="89" dy="32">band and the entire galaxy are related, but are not identical views.</tspan></text></g>
<g class="v2-reading-block" data-block="universe-heading" transform="translate(0 268)"><text class="v2-title" x="89" y="38"><tspan x="89">12.5 A Universe to Investigate</tspan></text></g>
<g class="v2-reading-block" data-block="universe" transform="translate(0 326)"><text class="se-copy" x="89" y="24"><tspan x="89">Many galaxies exist beyond the Milky Way. The <tspan class="se-bold">Universe</tspan> includes space, time</tspan><tspan x="89" dy="32">and all the matter and energy within it. Telescopes and other instruments gather</tspan><tspan x="89" dy="32">evidence from far beyond what unaided eyes can see. Diagrams that place Earth,</tspan><tspan x="89" dy="32">the Solar System and the Milky Way inside larger groups show membership, not</tspan><tspan x="89" dy="32">physical walls.</tspan></text></g>
<g class="v2-reading-block" data-block="membership" transform="translate(0 502)"><g data-diagram="membership"><rect class="v2-light-screen" x="112" y="20" width="140" height="64" rx="12"/><text class="v2-light-label" x="182" y="61" text-anchor="middle">Earth</text><path class="v2-light-line" d="M260 52H303M294 46L303 52L294 58"/><rect class="v2-light-screen" x="313" y="20" width="182" height="64" rx="12"/><text class="v2-light-label" x="404" y="61" text-anchor="middle">Solar System</text><path class="v2-light-line" d="M503 52H536M527 46L536 52L527 58"/><rect class="v2-light-screen" x="546" y="20" width="190" height="64" rx="12"/><text class="v2-light-label" x="641" y="61" text-anchor="middle">Milky Way</text><path class="v2-light-line" d="M744 52H777M768 46L777 52L768 58"/><rect class="v2-light-screen" x="787" y="20" width="150" height="64" rx="12"/><text class="v2-light-label" x="862" y="61" text-anchor="middle">Universe</text><text class="v2-light-label" x="526" y="135" text-anchor="middle">Each arrow means “belongs within”.</text></g><text class="se-caption" x="89" y="187.88"><tspan x="89">Fig. 12.12 · Follow the membership chain. These are not relative sizes or distances.</tspan></text></g>
<g class="v2-reading-block" data-block="life-search" transform="translate(0 718)"><text class="se-copy" x="89" y="24"><tspan x="89">Scientists investigate whether life exists beyond Earth, including on worlds in our</tspan><tspan x="89" dy="32">Solar System and on <tspan class="se-bold">exoplanets</tspan>, planets orbiting other stars. No life beyond</tspan><tspan x="89" dy="32">Earth has yet been confirmed. Finding water or a possible chemical clue is not</tspan><tspan x="89" dy="32">the same as confirming life; several explanations must be tested.</tspan></text></g>
<g class="v2-reading-block" data-block="life-think" transform="translate(0 862)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="186" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A headline says, “Water detected on a distant world: life discovered!” Which</tspan><tspan x="113" dy="32">part could be an observation, and which is an unsupported conclusion?</tspan><tspan x="113" dy="32">Suggest one further question scientists would need to investigate.</tspan></text></g>
<g class="v2-reading-block" data-block="return" transform="translate(0 1070)"><text class="se-copy" x="89" y="24"><tspan x="89">Yangdol and Dorjay cannot visit every world they have read about. They can still</tspan><tspan x="89" dy="32">ask useful questions, compare predictions with observations, and change an</tspan><tspan x="89" dy="32">explanation when evidence demands it. Their next clear evening begins with a</tspan><tspan x="89" dy="32">small task: choose one object, check when it is visible, and make a careful</tspan><tspan x="89" dy="32">record.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
