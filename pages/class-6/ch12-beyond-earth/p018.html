<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q8" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">8.</text><text class="se-copy" x="132" y="24"><tspan x="132">In your notebook, connect the main stars of Orion in this field and label</tspan><tspan x="132" dy="32">Sirius. Use the three belt stars to guide you. Compare with Fig. 12.2; do not</tspan><tspan x="132" dy="32">add a physical connection between the stars in your explanation.</tspan></text><g transform="translate(0 112)"><g data-diagram="winter-question"><circle class="ch12-star" data-star-hr="1165" cx="540.8094636601638" cy="57.78258204884628" r="4.1345"/><circle class="ch12-star" data-star-hr="1457" cx="453.12894763869974" cy="113.08764134465115" r="5.4475"/><circle class="ch12-star" data-star-hr="1791" cx="361.9425385090512" cy="25" r="4.9275"/><circle class="ch12-star" data-star-hr="1910" cx="341.389919014257" cy="79.35246529586618" r="4.05"/><circle class="ch12-star" data-star-hr="1543" cx="427.92996378366144" cy="182.60475592191955" r="3.9265"/><circle class="ch12-star" data-star-hr="1713" cx="383.2192667353121" cy="293.0065577789354" r="5.922"/><circle class="ch12-star" data-star-hr="1790" cx="364.04245383030445" cy="187.05828455857568" r="4.934"/><circle class="ch12-star" data-star-hr="1852" cx="351.5968350082219" cy="235.4686666870959" r="4.5504999999999995"/><circle class="ch12-star" data-star-hr="1879" cx="345.92766706478136" cy="160.9600404498514" r="3.699"/><circle class="ch12-star" data-star-hr="1903" cx="343.9816248489647" cy="242.0417675359299" r="4.895"/><circle class="ch12-star" data-star-hr="1948" cx="335.75393938767525" cy="247.4357552171115" r="4.6675"/><circle class="ch12-star" data-star-hr="2004" cx="323.08505370672384" cy="303.6954310054239" r="4.661"/><circle class="ch12-star" data-star-hr="2061" cx="309.6618880971613" cy="179.36067784144885" r="5.675"/><circle class="ch12-star" data-star-hr="2491" cx="219.19053633983626" cy="355" r="6.949"/><text class="v2-light-label" x="686" y="190" text-anchor="start">Selected stars only</text><text class="v2-light-label" x="686" y="222" text-anchor="start">Copy into your notebook.</text></g></g><text class="se-caption" x="89" y="557.88"><tspan x="89">Fig. 12.14 · Recognise a pattern among selected stars.</tspan></text></g>
<g class="v2-reading-block" data-block="q9" transform="translate(0 702)"><text class="se-copy" x="111" y="24" text-anchor="end">9.</text><text class="se-copy" x="132" y="24"><tspan x="132">Stars seem to fade at dawn and reappear after dusk. Explain what changes in</tspan><tspan x="132" dy="32">the sky around us. Why is “the stars turn off during the day” not a sound</tspan><tspan x="132" dy="32">explanation?</tspan></text></g>
<g class="v2-reading-block" data-block="q10" transform="translate(0 828)"><text class="se-copy" x="111" y="24" text-anchor="end">10.</text><text class="se-copy" x="132" y="24"><tspan x="132">With an adult, compare three or four sky-map views of the northern sky at</tspan><tspan x="132" dy="32">times two hours apart on the same simulated clear night. You may use real</tspan><tspan x="132" dy="32">observations only if an adult agrees and your sleep is not disrupted. Sketch</tspan><tspan x="132" dy="32">the Big Dipper and Polaris, label each time and note whether the whole</tspan><tspan x="132" dy="32">pattern changes position. Explain the apparent motion.</tspan></text></g>
<g class="v2-reading-block" data-block="q11" transform="translate(0 1018)"><text class="se-copy" x="111" y="24" text-anchor="end">11.</text><text class="se-copy" x="132" y="24"><tspan x="132">Write a poem or short story inspired by the night sky. Afterwards, underline</tspan><tspan x="132" dy="32">two statements that describe observations or established facts, and mark any</tspan><tspan x="132" dy="32">invented events as imagination.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
