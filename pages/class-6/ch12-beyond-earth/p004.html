<g class="v2-reading-block" data-block="visibility" transform="translate(0 170)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.76114" data-space-ratio="1.315">What<tspan dx="1.76114"> you</tspan><tspan dx="1.76114"> can</tspan><tspan dx="1.76114"> see</tspan><tspan dx="1.76114"> depends</tspan><tspan dx="1.76114"> on</tspan><tspan dx="1.76114"> your</tspan><tspan dx="1.76114"> location,</tspan><tspan dx="1.76114"> date,</tspan><tspan dx="1.76114"> time,</tspan><tspan dx="1.76114"> weather</tspan><tspan dx="1.76114"> and</tspan><tspan dx="1.76114"> view</tspan><tspan dx="1.76114"> of</tspan><tspan dx="1.76114"> the</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.95383" data-space-ratio="1.886">horizon.<tspan dx="4.95383"> Buildings</tspan><tspan dx="4.95383"> or</tspan><tspan dx="4.95383"> trees</tspan><tspan dx="4.95383"> may</tspan><tspan dx="4.95383"> hide</tspan><tspan dx="4.95383"> a</tspan><tspan dx="4.95383"> target.</tspan><tspan dx="4.95383"> Scattered</tspan><tspan dx="4.95383"> light</tspan><tspan dx="4.95383"> from</tspan><tspan dx="4.95383"> lamps</tspan><tspan dx="4.95383"> can</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.94792" data-space-ratio="1.706">wash<tspan dx="3.94792"> out</tspan><tspan dx="3.94792"> faint</tspan><tspan dx="3.94792"> stars;</tspan><tspan dx="3.94792"> bright</tspan><tspan dx="3.94792"> moonlight</tspan><tspan dx="3.94792"> can</tspan><tspan dx="3.94792"> do</tspan><tspan dx="3.94792"> so</tspan><tspan dx="3.94792"> too.</tspan><tspan dx="3.94792"> Not</tspan><tspan dx="3.94792"> seeing</tspan><tspan dx="3.94792"> a</tspan><tspan dx="3.94792"> star</tspan><tspan dx="3.94792"> on</tspan><tspan dx="3.94792"> one</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">night is not evidence that it has stopped shining.</tspan></text></g>
<g class="v2-reading-block" data-block="light-pollution" transform="translate(0 314)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="6.62603" data-space-ratio="2.185">Unwanted<tspan dx="6.62603"> or</tspan><tspan dx="6.62603"> excessive</tspan><tspan dx="6.62603"> artificial</tspan><tspan dx="6.62603"> light</tspan><tspan dx="6.62603"> at</tspan><tspan dx="6.62603"> night</tspan><tspan dx="6.62603"> contributes</tspan><tspan dx="6.62603"> to</tspan><tspan dx="6.62603"> <tspan class="se-bold">light</tspan></tspan><tspan dx="6.62603"> <tspan class="se-bold">pollution</tspan>.</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.17309" data-space-ratio="1.746">Shielding<tspan dx="4.17309"> lights</tspan><tspan dx="4.17309"> downwards,</tspan><tspan dx="4.17309"> choosing</tspan><tspan dx="4.17309"> suitable</tspan><tspan dx="4.17309"> brightness</tspan><tspan dx="4.17309"> and</tspan><tspan dx="4.17309"> using</tspan><tspan dx="4.17309"> them</tspan><tspan dx="4.17309"> only</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.22637" data-space-ratio="1.935">when<tspan dx="5.22637"> needed</tspan><tspan dx="5.22637"> can</tspan><tspan dx="5.22637"> reduce</tspan><tspan dx="5.22637"> it.</tspan><tspan dx="5.22637"> Keep</tspan><tspan dx="5.22637"> lighting</tspan><tspan dx="5.22637"> required</tspan><tspan dx="5.22637"> for</tspan><tspan dx="5.22637"> safety.</tspan><tspan dx="5.22637"> A</tspan><tspan dx="5.22637"> dark-sky</tspan><tspan dx="5.22637"> site</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">protects useful darkness; it is not necessarily free of clouds or air pollution.</tspan></text></g>
<g class="v2-reading-block" data-block="telescope-art" transform="translate(0 458)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">Plan a safe observation with an adult, using a</tspan><tspan x="89" dy="32" data-narrow-prose="true">current sky map for your place and time. A</tspan><tspan x="89" dy="32" data-narrow-prose="true">printed chart or a tool such as Stellarium can</tspan><tspan x="89" dy="32" data-narrow-prose="true">help. Check directions and the horizon before</tspan><tspan x="89" dy="32" data-paragraph-end="true">looking for a target.</tspan></text><text class="se-copy" x="89" y="200" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">Allow your eyes time to adjust to darkness and</tspan><tspan x="89" dy="32" data-narrow-prose="true">keep screens dim. Begin with unaided eyes. A</tspan><tspan x="89" dy="32" data-narrow-prose="true">telescope gathers light and can reveal detail,</tspan><tspan x="89" dy="32" data-narrow-prose="true">but it needs careful aiming and adult</tspan><tspan x="89" dy="32" data-paragraph-end="true">guidance.</tspan></text><image class="science-illustration" data-photo="telescope" href="../../figures/class-6/science/ch12/telescope.png" x="640.5933125972006" y="0" width="294.81337480559876" height="310" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="384.88"><tspan x="89">Fig. 12.3 · A small refracting telescope. An instrument does not replace careful identification.</tspan></text></g>
<g class="v2-reading-block" data-block="sun-safety" transform="translate(0 871)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.31495" data-space-ratio="1.414">Never<tspan dx="2.31495"> look</tspan><tspan dx="2.31495"> directly</tspan><tspan dx="2.31495"> at</tspan><tspan dx="2.31495"> the</tspan><tspan dx="2.31495"> Sun,</tspan><tspan dx="2.31495"> or</tspan><tspan dx="2.31495"> point</tspan><tspan dx="2.31495"> binoculars</tspan><tspan dx="2.31495"> or</tspan><tspan dx="2.31495"> a</tspan><tspan dx="2.31495"> telescope</tspan><tspan dx="2.31495"> at</tspan><tspan dx="2.31495"> it.</tspan><tspan dx="2.31495"> Ordinary</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.04828" data-space-ratio="1.545">sunglasses<tspan dx="3.04828"> do</tspan><tspan dx="3.04828"> not</tspan><tspan dx="3.04828"> make</tspan><tspan dx="3.04828"> this</tspan><tspan dx="3.04828"> safe.</tspan><tspan dx="3.04828"> All</tspan><tspan dx="3.04828"> observing</tspan><tspan dx="3.04828"> activities</tspan><tspan dx="3.04828"> here</tspan><tspan dx="3.04828"> are</tspan><tspan dx="3.04828"> for</tspan><tspan dx="3.04828"> the</tspan><tspan dx="3.04828"> night</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.40437" data-space-ratio="1.609">sky,<tspan dx="3.40437"> with</tspan><tspan dx="3.40437"> an</tspan><tspan dx="3.40437"> adult</tspan><tspan dx="3.40437"> present,</tspan><tspan dx="3.40437"> from</tspan><tspan dx="3.40437"> safe</tspan><tspan dx="3.40437"> ground</tspan><tspan dx="3.40437"> away</tspan><tspan dx="3.40437"> from</tspan><tspan dx="3.40437"> roads,</tspan><tspan dx="3.40437"> roofs</tspan><tspan dx="3.40437"> and</tspan><tspan dx="3.40437"> steep</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">edges.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
