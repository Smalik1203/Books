<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="names" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Different traditions give these objects different names. Betelgeuse is associated</tspan><tspan x="89" dy="32">with Ardra, Aldebaran with Rohini, and the Pleiades star cluster with Krittika in</tspan><tspan x="89" dy="32">Indian astronomical traditions. These examples do not make every traditional</tspan><tspan x="89" dy="32">sky division identical to a modern constellation. Ask which actual star, group or</tspan><tspan x="89" dy="32">sky region a name refers to.</tspan></text></g>
<g class="v2-reading-block" data-block="dippers" transform="translate(0 288)"><text class="se-copy" x="89" y="24"><tspan x="89">The Big Dipper’s seven main stars make a bowl and handle. It is also known as</tspan><tspan x="89" dy="32">Saptarishi. The Little Dipper is part of Ursa Minor; Polaris, the <tspan class="se-bold">Pole</tspan> <tspan class="se-bold">Star</tspan>, is at the</tspan><tspan x="89" dy="32">end of its handle. Polaris is also called Dhruva tara. Stories may help us</tspan><tspan x="89" dy="32">remember the shapes, while measurements help us locate the stars.</tspan></text></g>
<g class="v2-reading-block" data-block="watch-heading" transform="translate(0 444)"><text class="v2-title" x="89" y="38"><tspan x="89">12.2 Preparing to Watch the Sky</tspan></text></g>
<g class="v2-reading-block" data-block="visibility" transform="translate(0 502)"><text class="se-copy" x="89" y="24"><tspan x="89">What you can see depends on your location, date, time, weather and view of the</tspan><tspan x="89" dy="32">horizon. Buildings or trees may hide a target. Scattered light from lamps can</tspan><tspan x="89" dy="32">wash out faint stars; bright moonlight can do so too. Not seeing a star on one</tspan><tspan x="89" dy="32">night is not evidence that it has stopped shining.</tspan></text></g>
<g class="v2-reading-block" data-block="light-pollution" transform="translate(0 646)"><text class="se-copy" x="89" y="24"><tspan x="89">Unwanted or excessive artificial light at night contributes to <tspan class="se-bold">light</tspan> <tspan class="se-bold">pollution</tspan>.</tspan><tspan x="89" dy="32">Shielding lights downwards, choosing suitable brightness and using them only</tspan><tspan x="89" dy="32">when needed can reduce it. Keep lighting required for safety. A dark-sky site</tspan><tspan x="89" dy="32">protects useful darkness; it is not necessarily free of clouds or air pollution.</tspan></text></g>
<g class="v2-reading-block" data-block="telescope-art" transform="translate(0 790)"><text class="se-copy" x="89" y="24"><tspan x="89">Plan a safe observation with an adult, using a</tspan><tspan x="89" dy="32">current sky map for your place and time. A</tspan><tspan x="89" dy="32">printed chart or a tool such as Stellarium can</tspan><tspan x="89" dy="32">help. Check directions and the horizon before</tspan><tspan x="89" dy="32">looking for a target.</tspan></text><text class="se-copy" x="89" y="200"><tspan x="89">Allow your eyes time to adjust to darkness and</tspan><tspan x="89" dy="32">keep screens dim. Begin with unaided eyes. A</tspan><tspan x="89" dy="32">telescope gathers light and can reveal detail,</tspan><tspan x="89" dy="32">but it needs careful aiming and adult</tspan><tspan x="89" dy="32">guidance.</tspan></text><image class="science-illustration" data-photo="telescope" href="../../figures/class-6/science/ch12/telescope.png" x="640.5933125972006" y="0" width="294.81337480559876" height="310" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="384.88"><tspan x="89">Fig. 12.3 · A small refracting telescope. An instrument does not replace careful identification.</tspan></text></g>
<g class="v2-reading-block" data-block="sun-safety" transform="translate(0 1203)"><text class="se-copy" x="89" y="24"><tspan x="89">Never look directly at the Sun, or point binoculars or a telescope at it. Ordinary</tspan><tspan x="89" dy="32">sunglasses do not make this safe. All observing activities here are for the night</tspan><tspan x="89" dy="32">sky, with an adult present, from safe ground away from roads, roofs and steep</tspan><tspan x="89" dy="32">edges.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
