"> day</tspan><tspan dx="7.50543"> and</tspan><tspan dx="7.50543"> a</tspan><tspan dx="7.50543"> year</tspan><tspan dx="7.50543"> describe</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">different motions.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="0.81595" data-space-ratio="1.146">The<tspan dx="0.81595"> Moon</tspan><tspan dx="0.81595"> reflects</tspan><tspan dx="0.81595"> sunlight.</tspan><tspan dx="0.81595"> Its</tspan><tspan dx="0.81595"> orbit</tspan><tspan dx="0.81595"> takes</tspan><tspan dx="0.81595"> about</tspan><tspan dx="0.81595"> 27.3</tspan><tspan dx="0.81595"> days;</tspan><tspan dx="0.81595"> its</tspan><tspan dx="0.81595"> phase</tspan><tspan dx="0.81595"> cycle</tspan><tspan dx="0.81595"> takes</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">about 29.5 days.</tspan></text><text class="se-copy" x="89" y="796" text-anchor="start">•</text><text class="se-copy" x="112" y="796" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="7.71129" data-space-ratio="2.379">Asteroids<tspan dx="7.71129"> and</tspan><tspan dx="7.71129"> comets</tspan><tspan dx="7.71129"> are</tspan><tspan dx="7.71129"> Solar</tspan><tspan dx="7.71129"> System</tspan><tspan dx="7.71129"> members.</tspan><tspan dx="7.71129"> Comet</tspan><tspan dx="7.71129"> tails</tspan><tspan dx="7.71129"> form</tspan><tspan dx="7.71129"> when</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">sunlight and solar wind act on released material.</tspan></text><text class="se-copy" x="89" y="870" text-anchor="start">•</text><text class="se-copy" x="112" y="870" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="5.93054" data-space-ratio="2.061">Our<tspa
