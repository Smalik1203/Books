<g class="v2-reading-block" data-block="dipper-map" transform="translate(0 160)"><g data-diagram="dippers"><path class="ch12-star-guide" d="M331.3845935970013 25L365.76169085736854 33.887620066530076L403.01420673518163 52.8149576948685L426.01214311801573 91.25447180067815L431.5577470620682 134.44693466634044L460.312119692583 134.30285382321955L450.3842376577998 85.32596107273153L426.01214311801573 91.25447180067815"/><path class="ch12-star-guide" d="M500.0982110539891 354.972836107617L447.83478377981817 323.2914354389811L406.591402363237 326.4200499691607L355.2802437078067 324.5771378471737L326.6883275401181 355L259.9017889460109 321.42714478000613L273.9803124412945 275.43453350492484L355.2802437078067 324.5771378471737"/><path class="ch12-star-pointer" d="M259.9017889460109 321.42714478000613L273.9803124412945 275.43453350492484L331.3845935970013 25"/><circle class="ch12-star" data-star-hr="424" cx="331.3845935970013" cy="25" r="4.686999999999999"/><circle class="ch12-star" data-star-hr="6789" cx="365.76169085736854" cy="33.887620066530076" r="3.1659999999999995"/><circle class="ch12-star" data-star-hr="6322" cx="403.01420673518163" cy="52.8149576948685" r="3.2504999999999997"/><circle class="ch12-star" data-star-hr="5903" cx="426.01214311801573" cy="91.25447180067815" r="3.1919999999999997"/><circle class="ch12-star" data-star-hr="6116" cx="450.3842376577998" cy="85.32596107273153" r="3"/><circle class="ch12-star" data-star-hr="5735" cx="460.312119692583" cy="134.30285382321955" r="4.0175"/><circle class="ch12-star" data-star-hr="5563" cx="431.5577470620682" cy="134.44693466634044" r="4.648"/><circle class="ch12-star" data-star-hr="4301" cx="273.9803124412945" cy="275.43453350492484" r="4.8365"/><circle class="ch12-star" data-star-hr="4295" cx="259.9017889460109" cy="321.42714478000613" r="4.4595"/><circle class="ch12-star" data-star-hr="4554" cx="326.6883275401181" cy="355" r="4.414"/><circle class="ch12-star" data-star-hr="4660" cx="355.2802437078067" cy="324.5771378471737" r="3.8485"/><circle class="ch12-star" data-star-hr="4905" cx="406.591402363237" cy="326.4200499691607" r="4.8495"/><circle class="ch12-star" data-star-hr="5054" cx="447.83478377981817" cy="323.2914354389811" r="4.5245"/><circle class="ch12-star" data-star-hr="5191" cx="500.0982110539891" cy="354.972836107617" r="4.791"/><text class="v2-light-label" x="343.3845935970013" y="15" text-anchor="start">1</text><text class="v2-light-label" x="686" y="58" text-anchor="start">1 · Polaris</text><text class="v2-light-label" x="285.9803124412945" y="265.43453350492484" text-anchor="start">2</text><text class="v2-light-label" x="686" y="103" text-anchor="start">2 · Dubhe</text><text class="v2-light-label" x="271.9017889460109" y="311.42714478000613" text-anchor="start">3</text><text class="v2-light-label" x="686" y="148" text-anchor="start">3 · Merak</text><text class="v2-light-label" x="686" y="235" text-anchor="start">Long handle: Big Dipper</text><text class="v2-light-label" x="686" y="280" text-anchor="start">Polaris ends the</text><text class="v2-light-label" x="686" y="309" text-anchor="start">Little Dipper’s handle.</text></g><text class="se-caption" x="89" y="412.88"><tspan x="89">Fig. 12.4 · Follow the bowl’s two pointer stars towards Polaris. Pattern orientation varies; lines</tspan><tspan x="89" dy="27">are imaginary.</tspan></text></g>
<g class="v2-reading-block" data-block="pole-task" transform="translate(0 628)"><rect class="se-activity-panel" x="89" y="0" width="874" height="510" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">With an adult, use a sky map to choose a date and evening time when the</tspan><tspan x="146" dy="32">Big Dipper is above your northern horizon. In much of India, suitable</tspan><tspan x="146" dy="32">spring or summer evenings can be useful; verify your location.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Find the bowl and handle. Identify Merak and Dubhe, the two stars at the</tspan><tspan x="146" dy="32">outer end of the bowl. Compare the pattern with Fig. 12.4 rather than</tspan><tspan x="146" dy="32">choosing any bright pair.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Continue the direction from Merak through Dubhe for about five times</tspan><tspan x="146" dy="32">their separation beyond Dubhe. Look for Polaris near that line and</tspan><tspan x="146" dy="32">confirm it with the chart.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Sketch what you could identify, recording time, direction and conditions.</tspan><tspan x="146" dy="32">If the target is hidden or too faint, record that; do not claim a successful</tspan><tspan x="146" dy="32">identification without evidence.</tspan></text></g>
<g class="v2-reading-block" data-block="pole-explain" transform="translate(0 1160)"><text class="se-copy" x="89" y="24"><tspan x="89">Polaris lies close to the direction of Earth’s north rotation axis, so it appears</tspan><tspan x="89" dy="32">nearly stationary while other stars seem to circle that direction. It indicates</tspan><tspan x="89" dy="32">approximately north from places in the Northern Hemisphere. It is not the</tspan><tspan x="89" dy="32">brightest star, and it is normally below the horizon in the Southern Hemisphere.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">5</text></g></svg></div></div></section>
