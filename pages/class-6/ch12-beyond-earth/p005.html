<g class="v2-reading-block" data-block="pole-explain" transform="translate(0 1180)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.58549" data-space-ratio="1.999">Polaris<tspan dx="5.58549"> lies</tspan><tspan dx="5.58549"> close</tspan><tspan dx="5.58549"> to</tspan><tspan dx="5.58549"> the</tspan><tspan dx="5.58549"> direction</tspan><tspan dx="5.58549"> of</tspan><tspan dx="5.58549"> Earth’s</tspan><tspan dx="5.58549"> north</tspan><tspan dx="5.58549"> rotation</tspan><tspan dx="5.58549"> axis,</tspan><tspan dx="5.58549"> so</tspan><tspan dx="5.58549"> it</tspan><tspan dx="5.58549"> appears</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="6.62405" data-space-ratio="2.185">nearly<tspan dx="6.62405"> stationary</tspan><tspan dx="6.62405"> while</tspan><tspan dx="6.62405"> other</tspan><tspan dx="6.62405"> stars</tspan><tspan dx="6.62405"> seem</tspan><tspan dx="6.62405"> to</tspan><tspan dx="6.62405"> circle</tspan><tspan dx="6.62405"> that</tspan><tspan dx="6.62405"> direction.</tspan><tspan dx="6.62405"> It</tspan><tspan dx="6.62405"> indicates</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="7.06753" data-space-ratio="2.264">approximately<tspan dx="7.06753"> north</tspan><tspan dx="7.06753"> from</tspan><tspan dx="7.06753"> places</tspan><tspan dx="7.06753"> in</tspan><tspan dx="7.06753"> the</tspan><tspan dx="7.06753"> Northern</tspan><tspan dx="7.06753"> Hemisphere.</tspan><tspan dx="7.06753"> It</tspan><tspan dx="7.06753"> is</tspan><tspan dx="7.06753"> not</tspan><tspan dx="7.06753"> the</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">brightest star, and it is normally below the horizon in the Southern Hemisphere.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><t
