<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="20" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 20"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-hanle" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">4. Why build an observatory at Hanle?</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Use information from the Indian Institute of Astrophysics to investigate Hanle’s</tspan><tspan x="89" dy="32">dry high-altitude setting and observing conditions. Explain why clear nights,</tspan><tspan x="89" dy="32">darkness and atmospheric conditions matter. Find out how the Hanle Dark Sky</tspan><tspan x="89" dy="32">Reserve involves local people. Record the date of your source; do not assume</tspan><tspan x="89" dy="32">visitor access or event times remain unchanged.</tspan></text><image class="science-illustration" data-photo="observatory" href="../../figures/class-6/science/ch12/observatory.png" x="316" y="224" width="420" height="280" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="534.88"><tspan x="89">Fig. 12.15 · A conceptual hilltop observatory, not a portrait of a particular building.</tspan></text></g>
<g class="v2-reading-block" data-block="project-art" transform="translate(0 677)"><text class="se-heading" x="89" y="30"><tspan x="89">5. Make a pattern you can check</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Choose a constellation pattern you have studied. Recreate its main stars with</tspan><tspan x="89" dy="32">paper dots, thread or another craft material, using a chart to check their relative</tspan><tspan x="89" dy="32">positions. Label the pattern and explain that the joining lines are imaginary. If</tspan><tspan x="89" dy="32">using needles or scissors, work with appropriate adult help.</tspan></text></g>
<g class="v2-reading-block" data-block="closing-heading" transform="translate(0 893)"><text class="v2-title" x="89" y="38"><tspan x="89">Keep Asking, Keep Checking</tspan></text></g>
<g class="v2-reading-block" data-block="closing-0" transform="translate(0 951)"><text class="se-copy" x="89" y="24"><tspan x="89">This chapter closes the book, but leaves many questions open. Choose one</tspan><tspan x="89" dy="32">observation from your science notebook that surprised you. What did you first</tspan><tspan x="89" dy="32">think it meant? What evidence supported or changed your explanation?</tspan></text></g>
<g class="v2-reading-block" data-block="closing-1" transform="translate(0 1063)"><text class="se-copy" x="89" y="24"><tspan x="89">Write one question you would like to investigate next. Decide what can be</tspan><tspan x="89" dy="32">observed safely, what information you need, and how you would recognise an</tspan><tspan x="89" dy="32">answer that does not fit your first idea. Curiosity grows stronger when it travels</tspan><tspan x="89" dy="32">with careful evidence.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">20</text></g></svg></div></div></section>
