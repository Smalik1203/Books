<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="orion-heading" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Following Orion’s Belt</tspan></text></g>
<g class="v2-reading-block" data-block="orion-task" transform="translate(0 160)"><rect class="se-activity-panel" x="89" y="0" width="874" height="446" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Ask an adult to check when Orion is visible after sunset at your location.</tspan><tspan x="146" dy="32">Winter and early-spring evenings are often suitable in India; use the</tspan><tspan x="146" dy="32">actual date and time, not a fixed promise.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Find the three belt stars and compare the surrounding bright stars with</tspan><tspan x="146" dy="32">Fig. 12.2. Match the whole pattern before naming it.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Extend the belt line in the direction shown towards Sirius, away from the</tspan><tspan x="146" dy="32">Taurus side. Rotate the chart to match your view; “left” or “right” on the</tspan><tspan x="146" dy="32">page is not a fixed direction in the sky.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">4.</text><text class="se-copy" x="146" y="384"><tspan x="146">Record the date, time and what you identified. Compare with the chart</tspan><tspan x="146" dy="32">and explain any uncertainty, cloud cover or obstruction.</tspan></text></g>
<g class="v2-reading-block" data-block="observation" transform="translate(0 628)"><text class="se-copy" x="89" y="24"><tspan x="89">A sky chart predicts where an object should appear for stated conditions. Your</tspan><tspan x="89" dy="32">notes record what you actually saw. If the two differ, check time, location,</tspan><tspan x="89" dy="32">viewing direction and obstacles before deciding the chart is wrong. A missing</tspan><tspan x="89" dy="32">observation can be informative when its limits are recorded.</tspan></text></g>
<g class="v2-reading-block" data-block="system-heading" transform="translate(0 784)"><text class="v2-title" x="89" y="38"><tspan x="89">12.3 Our Solar System</tspan></text></g>
<g class="v2-reading-block" data-block="sun-art" transform="translate(0 842)"><text class="se-copy" x="89" y="24"><tspan x="89">The <tspan class="se-bold">Sun</tspan> is our nearest star. It is an enormous,</tspan><tspan x="89" dy="32">very hot sphere, mostly hydrogen and helium.</tspan><tspan x="89" dy="32">Nuclear fusion in its interior releases energy</tspan><tspan x="89" dy="32">that eventually leaves as light and other</tspan><tspan x="89" dy="32">radiation. It is not an ordinary fire burning in</tspan><tspan x="89" dy="32">air.</tspan></text><text class="se-copy" x="89" y="232"><tspan x="89">Earth is about 150 million kilometres from the</tspan><tspan x="89" dy="32">Sun on average. This distance is</tspan><tspan x="89" dy="32">approximately one astronomical unit, or au.</tspan><tspan x="89" dy="32">The Sun’s diameter is about 109 times Earth’s,</tspan><tspan x="89" dy="32">yet it looks small because it is far away.</tspan></text><image class="science-illustration" data-photo="sun" href="../../figures/class-6/science/ch12/sun.png" x="665.389202256245" y="0" width="245.22159548751006" height="240" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="416.88"><tspan x="89">Fig. 12.5 · An illustrated Sun. Never observe it directly with your eyes or ordinary optical</tspan><tspan x="89" dy="27">equipment.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
