<g class="v2-reading-block" data-block="observation" transform="translate(0 648)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.43821" data-space-ratio="1.615">A<tspan dx="3.43821"> sky</tspan><tspan dx="3.43821"> chart</tspan><tspan dx="3.43821"> predicts</tspan><tspan dx="3.43821"> where</tspan><tspan dx="3.43821"> an</tspan><tspan dx="3.43821"> object</tspan><tspan dx="3.43821"> should</tspan><tspan dx="3.43821"> appear</tspan><tspan dx="3.43821"> for</tspan><tspan dx="3.43821"> stated</tspan><tspan dx="3.43821"> conditions.</tspan><tspan dx="3.43821"> Your</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="7.60804" data-space-ratio="2.361">notes<tspan dx="7.60804"> record</tspan><tspan dx="7.60804"> what</tspan><tspan dx="7.60804"> you</tspan><tspan dx="7.60804"> actually</tspan><tspan dx="7.60804"> saw.</tspan><tspan dx="7.60804"> If</tspan><tspan dx="7.60804"> the</tspan><tspan dx="7.60804"> two</tspan><tspan dx="7.60804"> differ,</tspan><tspan dx="7.60804"> check</tspan><tspan dx="7.60804"> time,</tspan><tspan dx="7.60804"> location,</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.24268" data-space-ratio="1.759">viewing<tspan dx="4.24268"> direction</tspan><tspan dx="4.24268"> and</tspan><tspan dx="4.24268"> obstacles</tspan><tspan dx="4.24268"> before</tspan><tspan dx="4.24268"> deciding</tspan><tspan dx="4.24268"> the</tspan><tspan dx="4.24268"> chart</tspan><tspan dx="4.24268"> is</tspan><tspan dx="4.24268"> wrong.</tspan><tspan dx="4.24268"> A</tspan><tspan dx="4.24268"> missing</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">observation can be informative when its limits are recorded.</tspan></text></g>
<g class="v2-reading-block" data-block="system-heading" transform="translate(0 804)"><text class="v2-title" x="89" y="38"><tspan x="89">12.3 Our Solar System</tspan></text></g>
<g class="v2-reading-block" data-block="sun-art" transform="translate(0 862)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">The <tspan class="se-bold">Sun</tspan> is our nearest star. It is an enormous,</tspan><tspan x="89" dy="32" data-narrow-prose="true">very hot sphere, mostly hydrogen and helium.</tspan><tspan x="89" dy="32" data-narrow-prose="true">Nuclear fusion in its interior releases energy</tspan><tspan x="89" dy="32" data-narrow-prose="true">that eventually leaves as light and other</tspan><tspan x="89" dy="32" data-narrow-prose="true">radiation. It is not an ordinary fire burning in</tspan><tspan x="89" dy="32" data-paragraph-end="true">air.</tspan></text><text class="se-copy" x="89" y="232" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">Earth is about 150 million kilometres from the</tspan><tspan x="89" dy="32" data-narrow-prose="true">Sun on average. This distance is</tspan><tspan x="89" dy="32" data-narrow-prose="true">approximately one astronomical unit, or au.</tspan><tspan x="89" dy="32" data-narrow-prose="true">The Sun’s diameter is about 109 times Earth’s,</tspan><tspan x="89" dy="32" data-paragraph-end="true">yet it looks small because it is far away.</tspan></text><image class="science-illustration" data-photo="sun" href="../../figures/class-6/science/ch12/sun.png" x="665.389202256245" y="0" width="245.22159548751006" height="240" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="416.88"><tspan x="89">Fig. 12.5 · An illustrated Sun. Never observe it directly with your eyes or ordinary optical</tspan><tspan x="89" dy="27">equipment.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 14
