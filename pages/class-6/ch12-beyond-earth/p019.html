<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="19"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 19"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Explore Further</tspan></text></g>
<g class="v2-reading-block" data-block="project-stories" transform="translate(0 170)"><text class="se-heading" x="89" y="30"><tspan x="89">1. Collect names and stories</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Find local-language names for planets, stars or patterns. Ask permission before</tspan><tspan x="89" dy="32">recording an elder’s story, and note who or which source supplied it. Present a</tspan><tspan x="89" dy="32">drawing with the name and its scientific identification where known. Keep</tspan><tspan x="89" dy="32">cultural stories distinct from evidence about how the objects work.</tspan></text></g>
<g class="v2-reading-block" data-block="project-visit" transform="translate(0 374)"><text class="se-heading" x="89" y="30"><tspan x="89">2. Visit a place that explores the sky</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">With an adult, investigate a planetarium, science museum or astronomy club</tspan><tspan x="89" dy="32">programme. Check current arrangements before planning a visit. Prepare three</tspan><tspan x="89" dy="32">questions, distinguish a projected sky show from a real observation, and report</tspan><tspan x="89" dy="32">one thing you learned. Telescope viewing depends on weather and the objects</tspan><tspan x="89" dy="32">above the horizon.</tspan></text></g>
<g class="v2-reading-block" data-block="project-light" transform="translate(0 610)"><text class="se-heading" x="89" y="30"><tspan x="89">3. Examine light near your home</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">From a safe place with an adult, identify a lamp that sends light where it is not</tspan><tspan x="89" dy="32">needed. Research how light at night can affect people or wildlife using a reliable</tspan><tspan x="89" dy="32">source. Propose one practical change, such as shielding or a suitable timer, while</tspan><tspan x="89" dy="32">retaining safety lighting. Do not alter public or household electrical fittings</tspan><tspan x="89" dy="32">yourself.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">19</text></g></svg></div></div></section>
