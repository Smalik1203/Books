<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="moon-heading" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">The Moon and Other Satellites</tspan></text></g>
<g class="v2-reading-block" data-block="moon-art" transform="translate(0 160)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">A <tspan class="se-bold">natural</tspan> <tspan class="se-bold">satellite</tspan>, or moon, orbits a larger</tspan><tspan x="89" dy="32" data-narrow-prose="true">body. Earth has one natural Moon; Mars has</tspan><tspan x="89" dy="32" data-narrow-prose="true">two. Mercury and Venus have none. Some</tspan><tspan x="89" dy="32" data-narrow-prose="true">moons are larger than Mercury, so it is wrong</tspan><tspan x="89" dy="32" data-narrow-prose="true">to say every moon is smaller than every</tspan><tspan x="89" dy="32" data-paragraph-end="true">planet.</tspan></text><text class="se-copy" x="89" y="232" data-prose-align="justify"><tspan x="89" data-narrow-prose="true">Our Moon is about 384,000 kilometres from</tspan><tspan x="89" dy="32" data-narrow-prose="true">Earth on average, with a diameter about</tspan><tspan x="89" dy="32" data-narrow-prose="true">one-quarter of Earth’s. It shines mainly by</tspan><tspan x="89" dy="32" data-narrow-prose="true">reflecting sunlight. Its orbit around Earth</tspan><tspan x="89" dy="32" data-narrow-prose="true">takes about 27.3 days relative to the distant</tspan><tspan x="89" dy="32" data-paragraph-end="true">stars.</tspan></text><image class="science-illustration" data-photo="moon" href="../../figures/class-6/science/ch12/moon.png" x="648" y="0" width="280" height="280" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="448.88"><tspan x="89">Fig. 12.8 · Dark plains and impact craters mark the Moon’s surface.</tspan></text></g>
<g class="v2-reading-block" data-block="moon-phase" transform="translate(0 637)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.48895" data-space-ratio="1.087">The<tspan dx="0.48895"> Moon’s</tspan><tspan dx="0.48895"> sunlit</tspan><tspan dx="0.48895"> half</tspan><tspan dx="0.48895"> is</tspan><tspan dx="0.48895"> viewed</tspan><tspan dx="0.48895"> from</tspan><tspan dx="0.48895"> changing</tspan><tspan dx="0.48895"> angles</tspan><tspan dx="0.48895"> as</tspan><tspan dx="0.48895"> it</tspan><tspan dx="0.48895"> orbits</tspan><tspan dx="0.48895"> Earth,</tspan><tspan dx="0.48895"> giving</tspan><tspan dx="0.48895"> us</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="7.35201" data-space-ratio="2.315">its<tspan dx="7.35201"> phases.</tspan><tspan dx="7.35201"> The</tspan><tspan dx="7.35201"> familiar</tspan><tspan dx="7.35201"> new-Moon-to-new-Moon</tspan><tspan dx="7.35201"> cycle</tspan><tspan dx="7.35201"> takes</tspan><tspan dx="7.35201"> about</tspan><tspan dx="7.35201"> 29.5</tspan><tspan dx="7.35201"> days</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.57734" data-space-ratio="1.819">because<tspan dx="4.57734"> Earth</tspan><tspan dx="4.57734"> is</tspan><tspan dx="4.57734"> moving</tspan><tspan dx="4.57734"> around</tspan><tspan dx="4.57734"> the</tspan><tspan dx="4.57734"> Sun</tspan><tspan dx="4.57734"> too.</tspan><tspan dx="4.57734"> The</tspan><tspan dx="4.57734"> phase</tspan><tspan dx="4.57734"> cycle</tspan><tspan dx="4.57734"> and</tspan><tspan dx="4.57734"> the</tspan><tspan dx="4.57734"> orbital</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.80740" data-space-ratio="1.144">period<tspan dx="0.80740"> are</tspan><tspan dx="0.80740"> related</tspan><tspan dx="0.80740"> but</tspan><tspan dx="0.80740"> are</tspan><tspan dx="0.80740"> not</tspan><tspan dx="0.80740"> the</tspan><tspan dx="0.80740"> same</tspan><tspan dx="0.80740"> interval.</tspan><tspan dx="0.80740"> Phases</tspan><tspan dx="0.80740"> are</tspan><tspan dx="0.80740"> not</tspan><tspan dx="0.80740"> ordinarily</tspan><tspan dx="0.80740"> caused</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">by Earth’s shadow.</tspan></text></g>
<g class="v2-reading-block" data-block="craters" transform="translate(0 813)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.05097" data-space-ratio="1.724">Many<tspan dx="4.05097"> bowl-shaped</tspan><tspan dx="4.05097"> lunar</tspan><tspan dx="4.05097"> craters</tspan><tspan dx="4.05097"> were</tspan><tspan dx="4.05097"> made</tspan><tspan dx="4.05097"> by</tspan><tspan dx="4.05097"> impacts</tspan><tspan dx="4.05097"> from</tspan><tspan dx="4.05097"> space</tspan><tspan dx="4.05097"> rocks.</tspan><tspan dx="4.05097"> The</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.81855" data-space-ratio="1.325">Moon<tspan dx="1.81855"> has</tspan><tspan dx="1.81855"> a</tspan><tspan dx="1.81855"> very</tspan><tspan dx="1.81855"> thin</tspan><tspan dx="1.81855"> exosphere</tspan><tspan dx="1.81855"> rather</tspan><tspan dx="1.81855"> than</tspan><tspan dx="1.81855"> Earth’s</tspan><tspan dx="1.81855"> substantial</tspan><tspan dx="1.81855"> atmosphere,</tspan><tspan dx="1.81855"> and</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.69947" data-space-ratio="1.840">lacks<tspan dx="4.69947"> Earth-like</tspan><tspan dx="4.69947"> rain</tspan><tspan dx="4.69947"> and</tspan><tspan dx="4.69947"> flowing</tspan><tspan dx="4.69947"> surface</tspan><tspan dx="4.69947"> water</tspan><tspan dx="4.69947"> to</tspan><tspan dx="4.69947"> wear</tspan><tspan dx="4.69947"> features</tspan><tspan dx="4.69947"> away</tspan><tspan dx="4.69947"> quickly.</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="9.74415" data-space-ratio="2.743">Water<tspan dx="9.74415"> ice</tspan><tspan dx="9.74415"> occurs</tspan><tspan dx="9.74415"> in</tspan><tspan dx="9.74415"> some</tspan><tspan dx="9.74415"> permanently</tspan><tspan dx="9.74415"> shadowed</tspan><tspan dx="9.74415"> polar</tspan><tspan dx="9.74415"> places;</tspan><tspan dx="9.74415"> “no</tspan><tspan dx="9.74415"> water</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">anywhere on the Moon” would be incorrect.</tspan></text></g>
