<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="inner-worlds" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">The four inner planets—<tspan class="se-bold">Mercury,</tspan> <tspan class="se-bold">Venus,</tspan> <tspan class="se-bold">Earth</tspan> <tspan class="se-bold">and</tspan> <tspan class="se-bold">Mars</tspan>—have rocky surfaces.</tspan><tspan x="89" dy="32">Mercury is nearest the Sun. Venus is covered by thick clouds. Earth has extensive</tspan><tspan x="89" dy="32">surface oceans. Rust-coloured materials on Mars help give it the name Red</tspan><tspan x="89" dy="32">Planet. Similar membership in a group does not mean identical conditions.</tspan></text></g>
<g class="v2-reading-block" data-block="outer-art" transform="translate(0 256)"><image class="science-illustration" data-photo="outer" href="../../figures/class-6/science/ch12/outer.png" x="196" y="0" width="660" height="220" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="250.88"><tspan x="89">Fig. 12.7 · Jupiter, Saturn, Uranus and Neptune follow the inner four. Displayed sizes and</tspan><tspan x="89" dy="27">spacing are not to scale.</tspan></text></g>
<g class="v2-reading-block" data-block="planet-groups" transform="translate(0 568)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 12.2 · Comparing groups of planets</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Group</tspan></text><text class="v2-table-heading" x="304.02" y="76.08"><tspan x="304.02">Members</tspan></text><text class="v2-table-heading" x="592.44" y="76.08"><tspan x="592.44">Main distinction</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Rocky planets</tspan></text><text class="se-copy se-table-copy" x="304.02" y="128.07999999999998"><tspan x="304.02">Mercury, Venus, Earth,</tspan><tspan x="304.02" dy="28">Mars</tspan></text><text class="se-copy se-table-copy" x="592.44" y="128.07999999999998"><tspan x="592.44">Relatively small, with solid rocky</tspan><tspan x="592.44" dy="28">surfaces</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="174" y2="174"/><text class="se-copy se-table-copy" x="103" y="208.07999999999998"><tspan x="103">Gas giants</tspan></text><text class="se-copy se-table-copy" x="304.02" y="208.07999999999998"><tspan x="304.02">Jupiter, Saturn</tspan></text><text class="se-copy se-table-copy" x="592.44" y="208.07999999999998"><tspan x="592.44">Very large; mainly hydrogen and</tspan><tspan x="592.44" dy="28">helium</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="254" y2="254"/><text class="se-copy se-table-copy" x="103" y="288.08"><tspan x="103">Ice giants</tspan></text><text class="se-copy se-table-copy" x="304.02" y="288.08"><tspan x="304.02">Uranus, Neptune</tspan></text><text class="se-copy se-table-copy" x="592.44" y="288.08"><tspan x="592.44">Rich in materials such as water,</tspan><tspan x="592.44" dy="28">ammonia and methane beneath</tspan><tspan x="592.44" dy="28">their atmospheres</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="362" y2="362"/><rect class="v2-table-frame" x="89" y="42" width="874" height="320"/><line class="v2-table-rule" x1="290.02" x2="290.02" y1="42" y2="362"/><line class="v2-table-rule" x1="578.44" x2="578.44" y1="42" y2="362"/><text class="v2-table-note" x="89" y="394.88"><tspan x="89">“Ice giant” describes composition; it does not mean a solid frozen surface you could stand on.</tspan></text></g>
<g class="v2-reading-block" data-block="rings" transform="translate(0 988)"><text class="se-copy" x="89" y="24"><tspan x="89">All four giant planets have rings, though Saturn’s are easiest to recognise. Rings</tspan><tspan x="89" dy="32">contain many separate particles; they are not solid hoops. Saturn’s bright rings</tspan><tspan x="89" dy="32">are mainly water ice, with some rocky material and dust. The giant planets also</tspan><tspan x="89" dy="32">have many natural satellites.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
