<section class="page page--food page--science-editorial page--science-v2 page--g6-ch12" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Beyond Earth, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M65 8A40 40 0 1 0 89 72A36 36 0 0 1 65 8ZM82 17V31M75 24H89"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Beyond Earth</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="motions" transform="translate(0 112)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 12.1 · Turning and travelling</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Motion</tspan></text><text class="v2-table-heading" x="312.76" y="76.08"><tspan x="312.76">Meaning</tspan></text><text class="v2-table-heading" x="662.36" y="76.08"><tspan x="662.36">Earth example</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Rotation</tspan></text><text class="se-copy se-table-copy" x="312.76" y="128.07999999999998"><tspan x="312.76">Turning about an axis</tspan></text><text class="se-copy se-table-copy" x="662.36" y="128.07999999999998"><tspan x="662.36">A solar day is about 24 hours</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="146" y2="146"/><text class="se-copy se-table-copy" x="103" y="180.07999999999998"><tspan x="103">Revolution</tspan></text><text class="se-copy se-table-copy" x="312.76" y="180.07999999999998"><tspan x="312.76">Travelling around another body</tspan><tspan x="312.76" dy="28">in an orbit</tspan></text><text class="se-copy se-table-copy" x="662.36" y="180.07999999999998"><tspan x="662.36">One orbit around the Sun</tspan><tspan x="662.36" dy="28">takes about a year</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="226" y2="226"/><rect class="v2-table-frame" x="89" y="42" width="874" height="184"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="42" y2="226"/><line class="v2-table-rule" x1="648.36" x2="648.36" y1="42" y2="226"/><text class="v2-table-note" x="89" y="258.88"><tspan x="89">Earth turns while it revolves. These are different motions happening together.</tspan></text></g>
<g class="v2-reading-block" data-block="inner-art" transform="translate(0 396)"><image class="science-illustration" data-photo="inner" href="../../figures/class-6/science/ch12/inner.png" x="196" y="0" width="660" height="220" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="250.88"><tspan x="89">Fig. 12.6 · Mercury, Venus, Earth and Mars, in order from the Sun. Displayed sizes and</tspan><tspan x="89" dy="27">spacing are not to scale.</tspan></text></g>
<g class="v2-reading-block" data-block="inner-worlds" transform="translate(0 708)"><text class="se-copy" x="89" y="24"><tspan x="89">The four inner planets—<tspan class="se-bold">Mercury,</tspan> <tspan class="se-bold">Venus,</tspan> <tspan class="se-bold">Earth</tspan> <tspan class="se-bold">and</tspan> <tspan class="se-bold">Mars</tspan>—have rocky surfaces.</tspan><tspan x="89" dy="32">Mercury is nearest the Sun. Venus is covered by thick clouds. Earth has extensive</tspan><tspan x="89" dy="32">surface oceans. Rust-coloured materials on Mars help give it the name Red</tspan><tspan x="89" dy="32">Planet. Similar membership in a group does not mean identical conditions.</tspan></text></g>
<g class="v2-reading-block" data-block="outer-art" transform="translate(0 852)"><image class="science-illustration" data-photo="outer" href="../../figures/class-6/science/ch12/outer.png" x="196" y="0" width="660" height="220" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="250.88"><tspan x="89">Fig. 12.7 · Jupiter, Saturn, Uranus and Neptune follow the inner four. Displayed sizes and</tspan><tspan x="89" dy="27">spacing are not to scale.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
