<g class="v2-reading-block" data-block="temperature" transform="translate(0 1016)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="7.39000" data-space-ratio="2.322">Distance<tspan dx="7.39000"> affects</tspan><tspan dx="7.39000"> the</tspan><tspan dx="7.39000"> sunlight</tspan><tspan dx="7.39000"> a</tspan><tspan dx="7.39000"> planet</tspan><tspan dx="7.39000"> receives,</tspan><tspan dx="7.39000"> but</tspan><tspan dx="7.39000"> atmosphere</tspan><tspan dx="7.39000"> matters</tspan><tspan dx="7.39000"> too.</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.42616" data-space-ratio="1.792">Venus’s<tspan dx="4.42616"> thick</tspan><tspan dx="4.42616"> atmosphere</tspan><tspan dx="4.42616"> traps</tspan><tspan dx="4.42616"> heat,</tspan><tspan dx="4.42616"> making</tspan><tspan dx="4.42616"> its</tspan><tspan dx="4.42616"> surface</tspan><tspan dx="4.42616"> hotter</tspan><tspan dx="4.42616"> than</tspan><tspan dx="4.42616"> Mercury’s</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.96899" data-space-ratio="1.710">even<tspan dx="3.96899"> though</tspan><tspan dx="3.96899"> Venus</tspan><tspan dx="3.96899"> is</tspan><tspan dx="3.96899"> farther</tspan><tspan dx="3.96899"> from</tspan><tspan dx="3.96899"> the</tspan><tspan dx="3.96899"> Sun.</tspan><tspan dx="3.96899"> One</tspan><tspan dx="3.96899"> factor</tspan><tspan dx="3.96899"> alone</tspan><tspan dx="3.96899"> is</tspan><tspan dx="3.96899"> not</tspan><tspan dx="3.96899"> enough</tspan><tspan dx="3.96899"> to</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">explain every planet’s temperature.</tspan></text></g>
<g class="v2-reading-block" data-block="pluto" transform="translate(0 1160)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.67340" data-space-ratio="1.836">Pluto<tspan dx="4.67340"> is</tspan><tspan dx="4.67340"> a</tspan><tspan dx="4.67340"> <tspan class="se-bold">dwarf</tspan></tspan><tspan dx="4.67340"> <tspan class="se-bold">planet</tspan>,</tspan><tspan dx="4.67340"> not</tspan><tspan dx="4.67340"> one</tspan><tspan dx="4.67340"> of</tspan><tspan dx="4.67340"> the</tspan><tspan dx="4.67340"> eight</tspan><tspan dx="4.67340"> planets.</tspan><tspan dx="4.67340"> It</tspan><tspan dx="4.67340"> orbits</tspan><tspan dx="4.67340"> the</tspan><tspan dx="4.67340"> Sun</tspan><tspan dx="4.67340"> and</tspan><tspan dx="4.67340"> is</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="7.92615" data-space-ratio="2.417">nearly<tspan dx="7.92615"> round,</tspan><tspan dx="7.92615"> but</tspan><tspan dx="7.92615"> has</tspan><tspan dx="7.92615"> not</tspan><tspan dx="7.92615"> cleared</tspan><tspan dx="7.92615"> its</tspan><tspan dx="7.92615"> orbital</tspan><tspan dx="7.92615"> neighbourhood.</tspan><tspan dx="7.92615"> Dwarf</tspan><tspan dx="7.92615"> planets</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.95013" data-space-ratio="2.064">remain<tspan dx="5.95013"> members</tspan><tspan dx="5.95013"> of</tspan><tspan dx="5.95013"> the</tspan><tspan dx="5.95013"> Solar</tspan><tspan dx="5.95013"> System.</tspan><tspan dx="5.95013"> Being</tspan><tspan dx="5.95013"> small</tspan><tspan dx="5.95013"> by</tspan><tspan dx="5.95013"> itself</tspan><tspan dx="5.95013"> is</tspan><tspan dx="5.95013"> not</tspan><tspan dx="5.95013"> the</tspan><tspan dx="5.95013"> whole</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">definition; Ceres in the astero
