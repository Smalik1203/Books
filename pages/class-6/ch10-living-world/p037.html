<div class="g6-block" data-block="g6-10-186"><p>A butterfly follows the same broad four-stage pattern, but its caterpillar, pupa and adult look different from a mosquito’s. Shared stage names do not mean identical bodies or habitats.</p></div></div></div></div></section>
