<div class="g6-block" data-block="g6-10-165"><p>The flying mosquito is only one stage. In the <em>Culex</em> example, a female lays a floating egg raft. Larvae and pupae live in water; a winged adult emerges from the pupa.</p></div>

 egg → larva → pupa → adult</text></svg></div><figcaption><strong>Figure 10.6.</strong> Photographic life cycle. Solid arrows: development. Dashed return: reproduction, which involves adults and produces new eggs. The waterline shows the habitat relationship; photographs retain their own viewpoints and scales.</figcaption></figure></div></div></div></div></section>
