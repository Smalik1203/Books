<div class="g6-block" data-block="g6-10-144"><p>A bean seedling develops into a mature flowering plant. After successful reproduction, the flower’s ovary develops into a pod containing new seeds. The parent plant and its offspring remain distinct.</p></div>
<div class="g6-block" data-block="g6-10-145"><figure class="g6-figure"><div class="g6-art"><svg   viewbox="0 0 530 460" role="img" aria-label="Figure 10.5. Real photographs of different common-bean specimens, not one plant followed through time. Images have different scales; varieties differ in seed colour. Solid arrows connect stages; the dashed pod-to-seeds arrow marks reproduction. New seeds can germinate to repeat the cycle. The seed photograph is reused to represent a new generation, not the same seeds returning." width="593.4648663213677" height="515.0827141657154" class="lw-diagram g6-source-art g6-art-labelled"><image href="../../figures/class-6/living-world/bean-seeds.jpg" x="6" y="23" width="155" height="135" preserveaspectratio="xMidYMid meet"/><text class="lw-label" x="6" y="177">1 · Seed</text><text class="lw-label" x="6" y="196">Living embryo inside</text><image href="../../figures/class-6/living-world/bean-seedling.jpg" x="186" y="23" width="155" height="135" preserveaspectratio="xMidYMid meet"/><text class="lw-label" x="186" y="177">2 · Germinating seed</text><text class="lw-label" x="186" y="196">Root emerges first</text><image href="../../figures/class-6/living-world/bean-young.jpg" x="366" y="23" width="155" height="135" preserveaspectratio="xMidYMid meet"/><text class="lw-label" x="366" y="177">3 · Seedling</text><text class="lw-label" x="366" y="196">First leaves unfold</text><image href="../../figures/class-6/living-world/bean-mature.jpg" x="6" y="228" width="155" height="135" preserveaspectratio="xMidYMid meet"/><text class="lw-label" x="6" y="382">4 · Flowering plant</text><text class="lw-label" x="6" y="401">Flower detail at right</text><image href="../../figures/class-6/living-world/bean-pods.jpg" x="186" y="228" width="155" height="135" preserveaspectratio="xMidYMid meet"/><text class="lw-label" x="186" y="382">5 · Pod (fruit)</text><text class="lw-label" x="186" y="401">Seeds develop within</text><image href="../../figures/class-6/living-world/bean-seeds.jpg" x="366" y="228" width="155" height="135" preserveaspectratio="xMidYMid meet"/><text class="lw-label" x="366" y="382">6 · Mature seeds</text><text class="lw-label" x="366" y="401">Next generation</text><image href="../../figures/class-6/living-world/bean-flower.jpg" x="96" y="292" width="65" height="68" preserveaspectratio="xMidYMid meet"/><path class="lw-arrow" d="M165 91H180"/><path class="lw-arrow" d="M345 91H360"/><path class="lw-arrow" d="M443 202V215H81V224"/><path class="lw-arrow" d="M165 296H180"/><path class="lw-reproduction" d="M264 408V440H441V410"/><text class="lw-label" x="280" y="429">Reproduction</text></svg></div><figcaption><strong>Figure 10.5.</strong> Real photographs of different common-bean specimens, not one plant followed through time. Images have different scales; varieties differ in seed colour. Solid arrows connect stages; the dashed pod-to-seeds arrow marks reproduction. The repeated seed photo represents the next generation, whose seeds can germinate again.</figcaption></figure></div></div></div></div></section>
