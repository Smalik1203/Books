<text class="se-heading" x="89" y="114">Everyone Does This</text>
<text class="se-copy " data-measure="874" x="89" y="161"><tspan x="89">Scientists<tspan data-gap="" dx="0.46929"> </tspan>follow<tspan data-gap="" dx="0.46929"> </tspan>the<tspan data-gap="" dx="0.46929"> </tspan>scientific<tspan data-gap="" dx="0.46929"> </tspan>method<tspan data-gap="" dx="0.46929"> </tspan>for<tspan data-gap="" dx="0.46929"> </tspan>a<tspan data-gap="" dx="0.46929"> </tspan>living.<tspan data-gap="" dx="0.46929"> </tspan>But<tspan data-gap="" dx="0.46929"> </tspan>nobody<tspan data-gap="" dx="0.46929"> </tspan>owns<tspan data-gap="" dx="0.46929"> </tspan>it,<tspan data-gap="" dx="0.46929"> </tspan>and<tspan data-gap="" dx="0.46929"> </tspan>it<tspan data-gap="" dx="0.46929"> </tspan>is<tspan data-gap="" dx="0.46929"> </tspan>used</tspan><tspan x="89" dy="31">every day by people who would never call themselves scientists.</tspan></text>

<text class="se-copy " data-measure="660" x="89" y="237"><tspan x="89">A<tspan data-gap="" dx="0.42402"> </tspan>cook<tspan data-gap="" dx="0.42402"> </tspan>lifts<tspan data-gap="" dx="0.42402"> </tspan>the<tspan data-gap="" dx="0.42402"> </tspan>lid<tspan data-gap="" dx="0.42402"> </tspan>off<tspan data-gap="" dx="0.42402"> </tspan>the<tspan data-gap="" dx="0.42402"> </tspan>idli<tspan data-gap="" dx="0.42402"> </tspan>batter<tspan data-gap="" dx="0.42402"> </tspan>in<tspan data-gap="" dx="0.42402"> </tspan>the<tspan data-gap="" dx="0.42402"> </tspan>morning<tspan data-gap="" dx="0.42402"> </tspan>and<tspan data-gap="" dx="0.42402"> </tspan>finds<tspan data-gap="" dx="0.42402"> </tspan>it</tspan><tspan x="89" dy="31">flat<tspan data-gap="" dx="4.61466"> </tspan>instead<tspan data-gap="" dx="4.61466"> </tspan>of<tspan data-gap="" dx="4.61466"> </tspan>risen.<tspan data-gap="" dx="4.61466"> </tspan>She<tspan data-gap="" dx="4.61466"> </tspan>asks<tspan data-gap="" dx="4.61466"> </tspan>why.<tspan data-gap="" dx="4.61466"> </tspan>Was<tspan data-gap="" dx="4.61466"> </tspan>the<tspan data-gap="" dx="4.61466"> </tspan>kitchen<tspan data-gap="" dx="4.61466"> </tspan>too<tspan data-gap="" dx="4.61466"> </tspan>cold</tspan><tspan x="89" dy="31">overnight?<tspan data-gap="" dx="0.94967"> </tspan>Was<tspan data-gap="" dx="0.94967"> </tspan>the<tspan data-gap="" dx="0.94967"> </tspan>batter<tspan data-gap="" dx="0.94967"> </tspan>ground<tspan data-gap="" dx="0.94967"> </tspan>too<tspan data-gap="" dx="0.94967"> </tspan>thin?<tspan data-gap="" dx="0.94967"> </tspan>She<tspan data-gap="" dx="0.94967"> </tspan>will<tspan data-gap="" dx="0.94967"> </tspan>not<tspan data-gap="" dx="0.94967"> </tspan>solve<tspan data-gap="" dx="0.94967"> </tspan>it</tspan><tspan x="89" dy="31">by<tspan data-gap="" dx="2.25663"> </tspan>worrying<tspan data-gap="" dx="2.25663"> </tspan>—<tspan data-gap="" dx="2.25663"> </tspan>she<tspan data-gap="" dx="2.25663"> </tspan>will<tspan data-gap="" dx="2 <text class="se-copy " data-measure="874" x="89" y="698"><tspan x="89">None<tspan data-gap="" dx="1.66762"> </tspan>of<tspan data-gap="" dx="1.66762"> </tspan>them<tspan data-gap="" dx="1.66762"> </tspan>are<tspan data-gap="" dx="1.66762"> </tspan>in<tspan data-gap="" dx="1.66762"> </tspan>a<tspan data-gap="" dx="1.66762"> </tspan>laboratory.<tspan data-gap="" dx="1.66762"> </tspan>All<tspan data-gap="" dx="1.66762"> </tspan>of<tspan data-gap="" dx="1.66762"> </tspan>them<tspan data-gap="" dx="1.66762"> </tspan>are<tspan data-gap="" dx="1.66762"> </tspan>doing<tspan data-gap="" dx="1.66762"> </tspan>exactly<tspan data-gap="" dx="1.66762"> </tspan>what<tspan data-gap="" dx="1.66762"> </tspan>step<tspan data-gap="" dx="1.66762"> </tspan>three<tspan data-gap="" dx="1.66762"> </tspan>and</tspan><tspan x="89" dy="31">step<tspan data-gap="" dx="0.08039"> </tspan>four<tspan data-gap="" dx="0.08039"> </tspan>describe:<tspan data-gap="" dx="0.08039"> </tspan>guess,<tspan data-gap="" dx="0.08039"> </tspan>then<tspan data-gap="" dx="0.08039"> </tspan>test<tspan data-gap="" dx="0.08039"> </tspan>—<tspan data-gap="" dx="0.08039"> </tspan>and<tspan data-gap="" dx="0.08039"> </tspan>crucially,<tspan data-gap="" dx="0.08039"> </tspan>test<tspan data-gap="" dx="0.08039"> </tspan><tspan class="se-italic">one</tspan><tspan data-gap="" dx="0.08039"> </tspan><tspan class="se-italic">thing</tspan><tspan data-gap="" dx="0.08039"> </tspan><tspan class="se-italic">at</tspan><tspan data-gap="" dx="0.08039"> </tspan><tspan class="se-italic">a</tspan><tspan data-gap="" dx="0.08039"> </tspan><tspan class="se-italic">time</tspan>,<tspan data-gap="" dx="0.08039"> </tspan>so<tspan data-gap="" dx="0.08039"> </tspan>that<tspan data-gap="" dx="0.08039"> </tspan>the</tspan><tspan x="89" dy="31">result actually means something.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="805"><tspan x="89">A<tspan data-gap="" dx="1.28665"> </tspan>useful<tspan data-gap="" dx="1.28665"> </tspan>record<tspan data-gap="" dx="1.28665"> </tspan>is<tspan data-gap="" dx="1.28665"> </tspan>specific.<tspan data-gap="" dx="1.28665"> </tspan>Describe<tspan data-gap="" dx="1.28665"> </tspan>which<tspan data-gap="" dx="1.28665"> </tspan>part<tspan data-gap="" dx="1.28665"> </tspan>of<tspan data-gap="" dx="1.28665"> </tspan>a<tspan data-gap="" dx="1.28665"> </tspan>puddle’s<tspan data-gap="" dx="1.28665"> </tspan>edge<tspan data-gap="" dx="1.28665"> </tspan>moved<tspan data-gap="" dx="1.28665"> </tspan>and<tspan data-gap="" dx="1.28665"> </tspan>when.</tspan><tspan x="89" dy="31">A<tspan data-gap="" dx="2.68198"> </tspan>sketch<tspan data-gap="" dx="2.68198"> </tspan>can<tspan data-gap="" dx="2.68198"> </tspan>preserve<tspan data-gap="" dx="2.68198"> </tspan>details<tspan data-gap="" dx="2.68198"> </tspan>that<tspan data-gap="" dx="2.68198"> </tspan>memory<tspan data-gap="" dx="2.68198"> </tspan>loses.<tspan data-gap="" dx="2.68198"> </tspan>Keep<tspan data-gap="" dx="2.68198"> </tspan>what<tspan data-gap="" dx="2.68198"> </tspan>you<tspan data-gap="" dx="2.68198"> </tspan>observed<tspan data-gap="" dx="2.68198"> </tspan>separate</tspan><tspan x="89" dy="31">from your explanation of why it happened.</tspan></text>
