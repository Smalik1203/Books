<text class="se-copy " data-measure="874" x="89" y="171"><tspan x="89">Some<tspan data-gap="" dx="1.99876"> </tspan>of<tspan data-gap="" dx="1.99876"> </tspan>what<tspan data-gap="" dx="1.99876"> </tspan>you<tspan data-gap="" dx="1.99876"> </tspan>learn<tspan data-gap="" dx="1.99876"> </tspan>in<tspan data-gap="" dx="1.99876"> </tspan>this<tspan data-gap="" dx="1.99876"> </tspan>book<tspan data-gap="" dx="1.99876"> </tspan>will<tspan data-gap="" dx="1.99876"> </tspan>be<tspan data-gap="" dx="1.99876"> </tspan>useful<tspan data-gap="" dx="1.99876"> </tspan>the<tspan data-gap="" dx="1.99876"> </tspan>same<tspan data-gap="" dx="1.99876"> </tspan>week<tspan data-gap="" dx="1.99876"> </tspan>you<tspan data-gap="" dx="1.99876"> </tspan>learn<tspan data-gap="" dx="1.99876"> </tspan>it.<tspan data-gap="" dx="1.99876"> </tspan>You</tspan><tspan x="89" dy="31">will<tspan data-gap="" dx="6.08312"> </tspan>understand<tspan data-gap="" dx="6.08312"> </tspan>why<tspan data-gap="" dx="6.08312"> </tspan>food<tspan data-gap="" dx="6.08312"> </tspan>spoils<tspan data-gap="" dx="6.08312"> </tspan>faster<tspan data-gap="" dx="6.08312"> </tspan>in<tspan data-gap="" dx="6.08312"> </tspan>May<tspan data-gap="" dx="6.08312"> </tspan>than<tspan data-gap="" dx="6.08312"> </tspan>in<tspan data-gap="" dx="6.08312"> </tspan>December,<tspan data-gap="" dx="6.08312"> </tspan>why<tspan data-gap="" dx="6.08312"> </tspan>a<tspan data-gap="" dx="6.08312"> </tspan>frayed</tspan><tspan x="89" dy="31">electrical<tspan data-gap="" dx="5.35650"> </tspan>wire<tspan data-gap="" dx="5.35650"> </tspan>is<tspan data-gap="" dx="5.35650"> </tspan>dangerous,<tspan data-gap="" dx="5.35650"> </tspan>how<tspan data-gap="" dx="5.35650"> </tspan>boiling<tspan data-gap="" dx="5.35650"> </tspan>kills<tspan data-gap="" dx="5.35650"> </tspan>many<tspan data-gap="" dx="5.35650"> </tspan>disease-causing<tspan data-gap="" dx="5.35650"> </tspan>microbes<tspan data-gap="" dx="5.35650"> </tspan>in</tspan><tspan x="89" dy="31">w <text class="se-copy " data-measure="874" x="89" y="309"><tspan x="89">But the real reward comes later, and it is stranger than that.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="354"><tspan x="89">Leave<tspan data-gap="" dx="0.63088"> </tspan>a<tspan data-gap="" dx="0.63088"> </tspan>wet<tspan data-gap="" dx="0.63088"> </tspan>shirt<tspan data-gap="" dx="0.63088"> </tspan>on<tspan data-gap="" dx="0.63088"> </tspan>a<tspan data-gap="" dx="0.63088"> </tspan>line<tspan data-gap="" dx="0.63088"> </tspan>and<tspan data-gap="" dx="0.63088"> </tspan>by<tspan data-gap="" dx="0.63088"> </tspan>evening<tspan data-gap="" dx="0.63088"> </tspan>it<tspan data-gap="" dx="0.63088"> </tspan>is<tspan data-gap="" dx="0.63088"> </tspan>dry.<tspan data-gap="" dx="0.63088"> </tspan>Pour<tspan data-gap="" dx="0.63088"> </tspan>water<tspan data-gap="" dx="0.63088"> </tspan>into<tspan data-gap="" dx="0.63088"> </tspan>an<tspan data-gap="" dx="0.63088"> </tspan>earthen<tspan data-gap="" dx="0.63088"> </tspan><tspan class="se-italic">matka</tspan></tspan><tspan x="89" dy="31">and<tspan data-gap="" dx="3.07336"> </tspan>the<tspan data-gap="" dx="3.07336"> </tspan>water<tspan data-gap="" dx="3.07336"> </tspan>inside<tspan data-gap="" dx="3.07336"> </tspan>stays<tspan data-gap="" dx="3.07336"> </tspan>cool<tspan data-gap="" dx="3.07336"> </tspan>even<tspan data-gap="" dx="3.07336"> </tspan>on<tspan data-gap="" dx="3.07336"> </tspan>a<tspan data-gap="" dx="3.07336"> </tspan>hot<tspan data-gap="" dx="3.07336"> </tspan>afternoon.<tspan data-gap="" dx="3.07336"> </tspan>Watch<tspan data-gap="" dx="3.07336"> </tspan>the<tspan data-gap="" dx="3.07336"> </tspan>sky<tspan data-gap="" dx="3.07336"> </tspan>before<tspan data-gap="" dx="3.07336"> </tspan>the</tspan><tspan x="89" dy="31">monsoon and see clouds thickening where there was clear blue an hour ago.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="461"><tspan x="89">Three ordinary things. They seem to have nothing to do with each other.</tspan></text>

<text class="se-copy " data-measure="874" x="89" y="1277"><tspan x="89">Clouds<tspan data-gap="" dx="3.50816"> </tspan>become<tspan data-gap="" dx="3.50816"> </tspan>visible<tspan data-gap="" dx="3.50816"> </tspan>when<tspan data-gap="" dx="3.50816"> </tspan>cooling<tspan data-gap="" dx="3.50816"> </tspan>water<tspan data-gap="" dx="3.50816"> </tspan>vapour<tspan data-gap="" dx="3.50816"> </tspan>condenses<tspan data-gap="" dx="3.50816"> </tspan>into<tspan data-gap="" dx="3.50816"> </tspan>tiny<tspan data-gap="" dx="3.50816"> </tspan>droplets<tspan data-gap="" dx="3.50816"> </tspan>or</tspan><tspan x="89" dy="31">forms ice crystals. Evaporation supplies the vapour; condensation helps form clouds.</tspan></text>
