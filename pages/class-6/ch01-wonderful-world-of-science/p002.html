<text class="se-heading" x="89" y="124">Science Is Not Kept in a Building</text>
<text class="se-copy " data-measure="874" x="89" y="166"><tspan x="89">Science<tspan data-gap="" dx="0.55997"> </tspan>does<tspan data-gap="" dx="0.55997"> </tspan>not<tspan data-gap="" dx="0.55997"> </tspan>live<tspan data-gap="" dx="0.55997"> </tspan>in<tspan data-gap="" dx="0.55997"> </tspan>laboratories.<tspan data-gap="" dx="0.55997"> </tspan>Laboratories<tspan data-gap="" dx="0.55997"> </tspan>are<tspan data-gap="" dx="0.55997"> </tspan>useful,<tspan data-gap="" dx="0.55997"> </tspan>but<tspan data-gap="" dx="0.55997"> </tspan>science<tspan data-gap="" dx="0.55997"> </tspan>is<tspan data-gap="" dx="0.55997"> </tspan>wherever</tspan><tspan x="89" dy="31">something is happening.</tspan></text>

<text class="se-copy " data-measure="704" x="89" y="238"><tspan x="89">It<tspan data-gap="" dx="1.24691"> </tspan>is<tspan data-gap="" dx="1.24691"> </tspan>in<tspan data-gap="" dx="1.24691"> </tspan>the<tspan data-gap="" dx="1.24691"> </tspan>kitchen,<tspan data-gap="" dx="1.24691"> </tspan>where<tspan data-gap="" dx="1.24691"> </tspan>heat<tspan data-gap="" dx="1.24691"> </tspan>turns<tspan data-gap="" dx="1.24691"> </tspan>a<tspan data-gap="" dx="1.24691"> </tspan>soft<tspan data-gap="" dx="1.24691"> </tspan>batter<tspan data-gap="" dx="1.24691"> </tspan>into<tspan data-gap="" dx="1.24691"> </tspan>a<tspan data-gap="" dx="1.24691"> </tspan>firm,<tspan data-gap="" dx="1.24691"> </tspan>holey</tspan><tspan x="89" dy="31">dosa.<tspan data-gap="" dx="1.24703"> </tspan>It<tspan data-gap="" dx="1.24703"> </tspan>is<tspan data-gap="" dx="1.24703"> </tspan>on<tspan data-gap="" dx="1.24703"> </tspan>the<tspan data-gap="" dx="1.24703"> </tspan>cricket<tspan data-gap="" dx="1.24703"> </tspan>field,<tspan data-gap="" dx="1.24703"> </tspan>where<tspan data-gap="" dx="1.24703"> </tspan>a<tspan data-gap="" dx="1.24703"> </tspan>ball<tspan data-gap="" dx="1.24703"> </tspan>bends<tspan data-gap="" dx="1.24703"> </tspan>in<tspan data-gap="" dx="1.24703"> </tspan>the<tspan data-gap="" dx="1.24703"> </tspan>air<tspan data-gap="" dx="1.24703"> </tspan>because</tspan><tspan x="89" dy="31">of<tspan data-gap="" dx="2.62468"> </tspan>the<tspan data-gap="" dx="2.62468"> </tspan>way<tspan data-gap="" dx="2.62468"> </tspan>it<tspan data-gap="" dx="2.62468"> </tspan>was<tspan data-gap="" dx="2.62468"> </tspan>spun.<tspan data-gap="" dx="2.62468"> </tspan>It<tspan data-gap="" dx="2.62468"> </tspan>is<tspan data-gap="" dx="2.62468"> </tspan>in<tspan data-gap="" dx="2.62468"> </tspan>the<tspan data-gap="" dx="2.62468"> </tspan>soil<tspan data-gap="" dx="2.62468"> </tspan>under<tspan data-gap="" dx="2.62468"> </tspan>a<tspan data-gap="" dx="2.62468"> </tspan>mango<tspan data-gap="" dx="2.62468"> </tspan>tree,<tspan data-gap="" dx="2.62468"> </tspan>where</tspan><tspan x="89" dy="31">organisms<tspan data-gap="" dx="4.88273"> </tspan>too<tspan data-gap="" dx="4.88273"> </tspan>small<tspan data-gap="" dx="4.88273"> </tspan>to<tspan data-gap="" dx="4.88273"> </tspan>see<tspan data-gap="" dx="4.88273"> </tspan>are<tspan data-gap="" dx="4.88273"> </tspan>breaking<tspan data-gap="" dx="4.88273"> </tspan>down<tspan data-gap="" dx="4.88273"> </tspan>fallen<tspan data-gap="" dx="4.88273"> </tspan>leaves.<tspan data-gap="" dx="4.88273"> </tspan>It<tspan data-gap="" dx="4.88273"> </tspan>is</tspan><tspan x="89" dy="31">inside<tspan data-gap="" dx="0.27356"> </tspan>your<tspan data-gap="" dx="0.27356"> </tspan>own<tspan data-gap="" dx="0.27356"> </tspan>body,<tspan data-gap="" dx="0.27356"> </tspan>where<tspan data-gap="" dx="0.27356"> </tspan>your<tspan data-gap="" dx="0.27356"> </tspan>heart<tspan data-gap="" dx="0.27356"> </tspan>is<tspan data-gap="" dx="0.27356"> </tspan>beating<tspan data-gap="" dx="0.27356"> </tspan>right<tspan data-gap="" dx="0.27356"> </tspan>now<tspan data-gap="" dx="0.27356"> </tspan>without</tspan><tspan x="89" dy="31">being told to.</tspan></text>
<text class="se-heading" x="89" y="439">An Unfinished Map</text>
<text class="se-copy " data-measure="874" x="89" y="481"><tspan x="89">Here is something surprising: science is not finished.</tspan></text>
<svg class="science-illustration" x="809" y="499" width="154" height="156" viewBox="715 474 326 307" preserveAspectRatio="xMidYMid meet" overflow="hidden"><defs><clipPath id="se-art-clip-3"><polygon points="810,474 1041,474 1041,781 950,781 715,720 715,705"/></clipPath></defs><image clip-path="url(#se-art-clip-3)" href="../../figures/class-6/science/ch01-p002-reference.png" x="0" y="0" width="1052" height="1494"><title>An unfinished map and pencil.</title></image></svg>
<text class="se-copy " data-measure="704" x="89" y="522"><tspan x="89">Think<tspan data-gap="" dx="0.84548"> </tspan>of<tspan data-gap="" dx="0.84548"> </tspan>what<tspan data-gap="" dx="0.84548"> </tspan>we<tspan data-gap="" dx="0.84548"> </tspan>know<tspan data-gap="" dx="0.84548"> </tspan>as<tspan data-gap="" dx="0.84548"> </tspan>a<tspan data-gap="" dx="0.84548"> </tspan>map<tspan data-gap="" dx="0.84548"> </tspan>of<tspan data-gap="" dx="0.84548"> </tspan>a<tspan data-gap="" dx="0.84548"> </tspan>huge,<tspan data-gap="" dx="0.84548"> </tspan>mostly<tspan data-gap="" dx="0.84548"> </tspan>unexplored<tspan data-gap="" dx="0.84548"> </tspan>land.</tspan><tspan x="89" dy="31">Some<tspan data-gap="" dx="8.75714"> </tspan>regions<tspan data-gap="" dx="8.75714"> </tspan>are<tspan data-gap="" dx="8.75714"> </tspan>surveyed<tspan data-gap="" dx="8.75714"> </tspan>in<tspan data-gap="" dx="8.75714"> </tspan>fine<tspan data-gap="" dx="8.75714"> </tspan>detail.<tspan data-gap="" dx="8.75714"> </tspan>Others<tspan data-gap="" dx="8.75714"> </tspan>are<tspan data-gap="" dx="8.75714"> </tspan>sketched</tspan><tspan x="89" dy="31">roughly.<tspan data-gap="" dx="2.44089"> </tspan>Some<tspan data-gap="" dx="2.44089"> </tspan>are<tspan data-gap="" dx="2.44089"> </tspan>still<tspan data-gap="" dx="2.44089"> </tspan>blank.<tspan data-gap="" dx="2.44089"> </tspan>And<tspan data-gap="" dx="2.44089"> </tspan>every<tspan data-gap="" dx="2.44089"> </tspan>time<tspan data-gap="" dx="2.44089"> </tspan>explorers<tspan data-gap="" dx="2.44089"> </tspan>map<tspan data-gap="" dx="2.44089"> </tspan>a<tspan data-gap="" dx="2.44089"> </tspan>new</tspan><tspan x="89" dy="31">region,<tspan data-gap="" dx="1.32793"> </tspan>its<tspan data-gap="" dx="1.32793"> </tspan>edges<tspan data-gap="" dx="1.32793"> </tspan>open<tspan data-gap="" dx="1.32793"> </tspan>onto<tspan data-gap="" dx="1.32793"> </tspan>territory<tspan data-gap="" dx="1.32793"> </tspan>nobody<tspan data-gap="" dx="1.32793"> </tspan>knew<tspan data-gap="" dx="1.32793"> </tspan>existed.<tspan data-gap="" dx="1.32793"> </tspan>The<tspan data-gap="" dx="1.32793"> </tspan>map</tspan><tspan x="89" dy="31">does not shrink the unknown — it reveals more of it.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="688"><tspan x="89">Sometimes<tspan data-gap="" dx="2.46900"> </tspan>the<tspan data-gap="" dx="2.46900"> </tspan>mapmakers<tspan data-gap="" dx="2.46900"> </tspan>get<tspan data-gap="" dx="2.46900"> </tspan>it<tspan data-gap="" dx="2.46900"> </tspan>wrong.<tspan data-gap="" dx="2.46900"> </tspan>For<tspan data-gap="" dx="2.46900"> </tspan>centuries<tspan data-gap="" dx="2.46900"> </tspan>people<tspan data-gap="" dx="2.46900"> </tspan>were<tspan data-gap="" dx="2.46900"> </tspan>certain<tspan data-gap="" dx="2.46900"> </tspan>the<tspan data-gap="" dx="2.46900"> </tspan>Sun</tspan><tspan x="89" dy="31">travelled<tspan data-gap="" dx="7.79003"> </tspan>around<tspan data-gap="" dx="7.79003"> </tspan>the<tspan data-gap="" dx="7.79003"> </tspan>Earth,<tspan data-gap="" dx="7.79003"> </tspan>because<tspan data-gap="" dx="7.79003"> </tspan>that<tspan data-gap="" dx="7.79003"> </tspan>is<tspan data-gap="" dx="7.79003"> </tspan>exactly<tspan data-gap="" dx="7.79003"> </tspan>what<tspan data-gap="" dx="7.79003"> </tspan>it<tspan data-gap="" dx="7.79003"> </tspan>looks<tspan data-gap="" dx="7.79003"> </tspan>like.<tspan data-gap="" dx="7.79003"> </tspan>Careful</tspan><tspan x="89" dy="31">observation<tspan data-gap="" dx="1.52003"> </tspan>showed<tspan data-gap="" dx="1.52003"> </tspan>otherwise,<tspan data-gap="" dx="1.52003"> </tspan>and<tspan data-gap="" dx="1.52003"> </tspan>the<tspan data-gap="" dx="1.52003"> </tspan>map<tspan data-gap="" dx="1.52003"> </tspan>had<tspan data-gap="" dx="1.52003"> </tspan>to<tspan data-gap="" dx="1.52003"> </tspan>be<tspan data-gap="" dx="1.52003"> </tspan>redrawn.<tspan data-gap="" dx="1.52003"> </tspan>That<tspan data-gap="" dx="1.52003"> </tspan>correction<tspan data-gap="" dx="1.52003"> </tspan>was</tspan><tspan x="89" dy="31">not a failure of science. It was science working as it should.</tspan></text>
<text class="se-heading" x="89" y="827">The Most Important Tool</text>
<text class="se-copy " data-measure="874" x="89" y="869"><tspan x="89">You<tspan data-gap="" dx="6.54583"> </tspan>will<tspan data-gap="" dx="6.54583"> </tspan>use<tspan data-gap="" dx="6.54583"> </tspan>many<tspan data-gap="" dx="6.54583"> </tspan>instruments<tspan data-gap="" dx="6.54583"> </tspan>in<tspan data-gap="" dx="6.54583"> </tspan>this<tspan data-gap="" dx="6.54583"> </tspan>book<tspan data-gap="" dx="6.54583"> </tspan>—<tspan data-gap="" dx="6.54583"> </tspan>thermometers,<tspan data-gap="" dx="6.54583"> </tspan>magnets,<tspan data-gap="" dx="6.54583"> </tspan>lenses,</tspan><tspan x="89" dy="31">balances. But the tool that matters most is not one you can hold. It is <tspan class="se-bold">curiosity</tspan>.</tspan></text>
<svg class="science-illustration" x="809" y="918" width="154" height="156" viewBox="757 917 278 289" preserveAspectRatio="xMidYMid meet" overflow="hidden"><defs><clipPath id="se-art-clip-4"><rect x="757" y="917" width="278" height="289"/></clipPath></defs><image clip-path="url(#se-art-clip-4)" href="../../figures/class-6/science/ch01-p002-reference.png" x="0" y="0" width="1052" height="1494"><title>An open flower and a closed bud.</title></image></svg>
<text class="se-copy " data-measure="704" x="89" y="941"><tspan x="89">Curiosity<tspan data-gap="" dx="0.59746"> </tspan>is<tspan data-gap="" dx="0.59746"> </tspan>what<tspan data-gap="" dx="0.59746"> </tspan>makes<tspan data-gap="" dx="0.59746"> </tspan>you<tspan data-gap="" dx="0.59746"> </tspan>look<tspan data-gap="" dx="0.59746"> </tspan>up<tspan data-gap="" dx="0.59746"> </tspan>at<tspan data-gap="" dx="0.59746"> </tspan>a<tspan data-gap="" dx="0.59746"> </tspan>night<tspan data-gap="" dx="0.59746"> </tspan>sky<tspan data-gap="" dx="0.59746"> </tspan>and<tspan data-gap="" dx="0.59746"> </tspan>wonder<tspan data-gap="" dx="0.59746"> </tspan>what</tspan><tspan x="89" dy="31">the<tspan data-gap="" dx="1.00891"> </tspan>stars<tspan data-gap="" dx="1.00891"> </tspan>actually<tspan data-gap="" dx="1.00891"> </tspan>are,<tspan data-gap="" dx="1.00891"> </tspan>and<tspan data-gap="" dx="1.00891"> </tspan>how<tspan data-gap="" dx="1.00891"> </tspan>far<tspan data-gap="" dx="1.00891"> </tspan>away.<tspan data-gap="" dx="1.00891"> </tspan>It<tspan data-gap="" dx="1.00891"> </tspan>is<tspan data-gap="" dx="1.00891"> </tspan>what<tspan data-gap="" dx="1.00891"> </tspan>makes<tspan data-gap="" dx="1.00891"> </tspan>you<tspan data-gap="" dx="1.00891"> </tspan>notice</tspan><tspan x="89" dy="31">that<tspan data-gap="" dx="9.51574"> </tspan>a<tspan data-gap="" dx="9.51574"> </tspan>flower<tspan data-gap="" dx="9.51574"> </tspan>on<tspan data-gap="" dx="9.51574"> </tspan>your<tspan data-gap="" dx="9.51574"> </tspan>balcony<tspan data-gap="" dx="9.51574"> </tspan>is<tspan data-gap="" dx="9.51574"> </tspan>shut<tspan data-gap="" dx="9.51574"> </tspan>at<tspan data-gap="" dx="9.51574"> </tspan>dawn<tspan data-gap="" dx="9.51574"> </tspan>and<tspan data-gap="" dx="9.51574"> </tspan>open<tspan data-gap="" dx="9.51574"> </tspan>by</tspan><tspan x="89" dy="31">mid-morning, and then wonder how it knows.</tspan></text>
<rect class="se-prompt" x="89" y="1084" width="874" height="251"/><line class="se-think-rule" x1="89" x2="963" y1="1084" y2="1084"/><g class="se-learning-cue se-feature--imagine" data-feature="imagine" aria-label="Work it out in your head"><svg class="se-feature-icon se-feature--imagine" x="113" y="1093" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15a7 7 0 1 1 13-4v4h-3v6h-5v-4H5ZM9 8h5m-5 3h3"/></svg><text class="se-cue-title" x="169" y="1122">Work it out in your head</text></g><text class="se-copy " data-measure="826" x="113" y="1181"><tspan x="113">Why<tspan data-gap="" dx="2.75381"> </tspan>might<tspan data-gap="" dx="2.75381"> </tspan>this<tspan data-gap="" dx="2.75381"> </tspan>happen?<tspan data-gap="" dx="2.75381"> </tspan>A<tspan data-gap="" dx="2.75381"> </tspan>flower<tspan data-gap="" dx="2.75381"> </tspan>has<tspan data-gap="" dx="2.75381"> </tspan>no<tspan data-gap="" dx="2.75381"> </tspan>eyes<tspan data-gap="" dx="2.75381"> </tspan>and<tspan data-gap="" dx="2.75381"> </tspan>no<tspan data-gap="" dx="2.75381"> </tspan>clock.<tspan data-gap="" dx="2.75381"> </tspan>What<tspan data-gap="" dx="2.75381"> </tspan>could<tspan data-gap="" dx="2.75381"> </tspan>it<tspan data-gap="" dx="2.75381"> </tspan>be</tspan><tspan x="113" dy="31">responding<tspan data-gap="" dx="0.74933"> </tspan>to?<tspan data-gap="" dx="0.74933"> </tspan>You<tspan data-gap="" dx="0.74933"> </tspan>do<tspan data-gap="" dx="0.74933"> </tspan>not<tspan data-gap="" dx="0.74933"> </tspan>need<tspan data-gap="" dx="0.74933"> </tspan>the<tspan data-gap="" dx="0.74933"> </tspan>right<tspan data-gap="" dx="0.74933"> </tspan>answer<tspan data-gap="" dx="0.74933"> </tspan>yet<tspan data-gap="" dx="0.74933"> </tspan>—<tspan data-gap="" dx="0.74933"> </tspan>only<tspan data-gap="" dx="0.74933"> </tspan>a<tspan data-gap="" dx="0.74933"> </tspan>reasonable<tspan data-gap="" dx="0.74933"> </tspan>guess.</tspan><tspan x="113" dy="31">A<tspan data-gap="" dx="2.05354"> </tspan>possible<tspan data-gap="" dx="2.05354"> </tspan>explanation<tspan data-gap="" dx="2.05354"> </tspan>is<tspan data-gap="" dx="2.05354"> </tspan>a<tspan data-gap="" dx="2.05354"> </tspan><tspan class="se-bold">hypothesis</tspan>.<tspan data-gap="" dx="2.05354"> </tspan>A<tspan data-gap="" dx="2.05354"> </tspan><tspan class="se-bold">prediction</tspan><tspan data-gap="" dx="2.05354"> </tspan>states<tspan data-gap="" dx="2.05354"> </tspan>what<tspan data-gap="" dx="2.05354"> </tspan>you<tspan data-gap="" dx="2.05354"> </tspan>expect<tspan data-gap="" dx="2.05354"> </tspan>to</tspan><tspan x="113" dy="31">observe<tspan data-gap="" dx="0.96496"> </tspan>if<tspan data-gap="" dx="0.96496"> </tspan>it<tspan data-gap="" dx="0.96496"> </tspan>is<tspan data-gap="" dx="0.96496"> </tspan>right.<tspan data-gap="" dx="0.96496"> </tspan>For<tspan data-gap="" dx="0.96496"> </tspan>example,<tspan data-gap="" dx="0.96496"> </tspan>if<tspan data-gap="" dx="0.96496"> </tspan>light<tspan data-gap="" dx="0.96496"> </tspan>triggers<tspan data-gap="" dx="0.96496"> </tspan>opening,<tspan data-gap="" dx="0.96496"> </tspan>what<tspan data-gap="" dx="0.96496"> </tspan>should<tspan data-gap="" dx="0.96496"> </tspan>happen</tspan><tspan x="113" dy="31">when the plant is shaded?</tspan></text>
