<text class="se-copy " data-measure="874" x="89" y="935"><tspan x="89">For<tspan data-gap="" dx="2.74189"> </tspan>a<tspan data-gap="" dx="2.74189"> </tspan>fair<tspan data-gap="" dx="2.74189"> </tspan>comparison,<tspan data-gap="" dx="2.74189"> </tspan>change<tspan data-gap="" dx="2.74189"> </tspan>one<tspan data-gap="" dx="2.74189"> </tspan>thing<tspan data-gap="" dx="2.74189"> </tspan>while<tspan data-gap="" dx="2.74189"> </tspan>keeping<tspan data-gap="" dx="2.74189"> </tspan>other<tspan data-gap="" dx="2.74189"> </tspan>conditions<tspan data-gap="" dx="2.74189"> </tspan>similar.<tspan data-gap="" dx="2.74189"> </tspan>If</tspan><tspan x="89" dy="31">you<tspan data-gap="" dx="3.46492"> </tspan>replace<tspan data-gap="" dx="3.46492"> </tspan>the<tspan data-gap="" dx="3.46492"> </tspan>cell<tspan data-gap="" dx="3.46492"> </tspan>and<tspan data-gap="" dx="3.46492"> </tspan>free<tspan data-gap="" dx="3.46492"> </tspan>the<tspan data-gap="" dx="3.46492"> </tspan>hands<tspan data-gap="" dx="3.46492"> </tspan>together,<tspan data-gap="" dx="3.46492"> </tspan>you<tspan data-gap="" dx="3.46492"> </tspan>will<tspan data-gap="" dx="3.46492"> </tspan>not<tspan data-gap="" dx="3.46492"> </tspan>know<tspan data-gap="" dx="3.46492"> </tspan>which<tspan data-gap="" dx="3.46492"> </tspan>change</tspan><tspan x="89" dy="31">mattered. Repeating a check can help you spot a result that happened only by chance.</tspan></text>
