<text class="se-heading" x="89" y="763">1.1 What Is Science?</text>
<text class="se-copy " data-measure="874" x="89" y="810"><tspan x="89">Look around you right now. Something is happening everywhere you turn.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="855"><tspan x="89">A<tspan data-gap="" dx="0.50826"> </tspan>fan<tspan data-gap="" dx="0.50826"> </tspan>is<tspan data-gap="" dx="0.50826"> </tspan>spinning.<tspan data-gap="" dx="0.50826"> </tspan>Sunlight<tspan data-gap="" dx="0.50826"> </tspan>is<tspan data-gap="" dx="0.50826"> </tspan>falling<tspan data-gap="" dx="0.50826"> </tspan>through<tspan data-gap="" dx="0.50826"> </tspan>a<tspan data-gap="" dx="0.50826"> </tspan>window<tspan data-gap="" dx="0.50826"> </tspan>and<tspan data-gap="" dx="0.50826"> </tspan>landing<tspan data-gap="" dx="0.50826"> </tspan>in<tspan data-gap="" dx="0.50826"> </tspan>a<tspan data-gap="" dx="0.50826"> </tspan>bright<tspan data-gap="" dx="0.50826"> </tspan>patch</tspan><tspan x="89" dy="31">on<tspan data-gap="" dx="5.12963"> </tspan>the<tspan data-gap="" dx="5.12963"> </tspan>floor.<tspan data-gap="" dx="5.12963"> </tspan>Somewhere<tspan data-gap="" dx="5.12963"> </tspan>nearby,<tspan data-gap="" dx="5.12963"> </tspan>water<tspan data-gap="" dx="5.12963"> </tspan>is<tspan data-gap="" dx="5.12963"> </tspan>boiling,<tspan data-gap="" dx="5.12963"> </tspan>or<tspan data-gap="" dx="5.12963"> </tspan>a<tspan data-gap="" dx="5.12963"> </tspan>bird<tspan data-gap="" dx="5.12963"> </tspan>is<tspan data-gap="" dx="5.12963"> </tspan>calling,<tspan data-gap="" dx="5.12963"> </tspan>or<tspan data-gap="" dx="5.12963"> </tspan>dust<tspan data-gap="" dx="5.12963"> </tspan>is</tspan><tspan x="89" dy="31">drifting<tspan data-gap="" dx="1.47530"> </tspan>through<tspan data-gap="" dx="1.47530"> </tspan>a<tspan data-gap="" dx="1.47530"> </tspan>beam<tspan data-gap="" dx="1.47530"> </tspan>of<tspan data-gap="" dx="1.47530"> </tspan>light.<tspan data-gap="" dx="1.47530"> </tspan>None<tspan data-gap="" dx="1.47530"> </tspan>of<tspan data-gap="" dx="1.47530"> </tspan>this<tspan data-gap="" dx="1.47530"> </tspan>is<tspan data-gap="" dx="1.47530"> </tspan>unusual.<tspan data-gap="" dx="1.47530"> </tspan>All<tspan data-gap="" dx="1.47530"> </tspan>of<tspan data-gap="" dx="1.47530"> </tspan>it<tspan data-gap="" dx="1.47530"> </tspan>is<tspan data-gap="" dx="1.47530"> </tspan>worth<tspan data-gap="" dx="1.47530"> </tspan>a<tspan data-gap="" dx="1.47530"> </tspan>second</tspan><tspan x="89" dy="31">look.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="993"><tspan x="89">You<tspan data-gap="" dx="2.79329"> </tspan>have<tspan data-gap="" dx="2.79329"> </tspan>been<tspan data-gap="" dx="2.79329"> </tspan>noticing<tspan data-gap="" dx="2.79329"> </tspan>things<tspan data-gap="" dx="2.79329"> </tspan>like<tspan data-gap="" dx="2.79329"> </tspan>this<tspan data-gap="" dx="2.79329"> </tspan>your<tspan data-gap="" dx="2.79329"> </tspan>whole<tspan data-gap="" dx="2.79329"> </tspan>life<tspan data-gap="" dx="2.79329"> </tspan>—<tspan data-gap="" dx="2.79329"> </tspan>why<tspan data-gap="" dx="2.79329"> </tspan>the<tspan data-gap="" dx="2.79329"> </tspan>moon<tspan data-gap="" dx="2.79329"> </tspan>seems<tspan data-gap="" dx="2.79329"> </tspan>to</tspan><tspan x="89" dy="31">follow<tspan data-gap="" dx="4.05456"> </tspan>the<tspan data-gap="" dx="4.05456"> </tspan>car,<tspan data-gap="" dx="4.05456"> </tspan>why<tspan data-gap="" dx="4.05456"> </tspan>ice<tspan data-gap="" dx="4.05456"> </tspan>feels<tspan data-gap="" dx="4.05456"> </tspan>wet,<tspan data-gap="" dx="4.05456"> </tspan>why<tspan data-gap="" dx="4.05456"> </tspan>your<tspan data-gap="" dx="4.05456"> </tspan>shadow<tspan data-gap="" dx="4.05456"> </tspan>stretches<tspan data-gap="" dx="4.05456"> </tspan>long<tspan data-gap="" dx="4.05456"> </tspan>in<tspan data-gap="" dx="4.05456"> </tspan>the<tspan data-gap="" dx="4.05456"> </tspan>evening.</tspan><tspan x="89" dy="31">Those questions were not childish. They were the beginning of something.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="1100"><tspan x="89">Now you are ready to go further.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="1145"><tspan x="89">An ordinary event can become a scientific question when you look closely.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="1190"><tspan x="89">Science<tspan data-gap="" dx="4.02815"> </tspan>is<tspan data-gap="" dx="4.02815"> </tspan>not<tspan data-gap="" dx="4.02815"> </tspan>a<tspan data-gap="" dx="4.02815"> </tspan>pile<tspan data-gap="" dx="4.02815"> </tspan>of<tspan data-gap="" dx="4.02815"> </tspan>facts<tspan data-gap="" dx="4.02815"> </tspan>to<tspan data-gap="" dx="4.02815"> </tspan>memorise.<tspan data-gap="" dx="4.02815"> </tspan>Science<tspan data-gap="" dx="4.02815"> </tspan>is<tspan data-gap="" dx="4.02815"> </tspan>a<tspan data-gap="" dx="4.02815"> </tspan>way<tspan data-gap="" dx="4.02815"> </tspan>of<tspan data-gap="" dx="4.02815"> </tspan>working.<tspan data-gap="" dx="4.02815"> </tspan>It<tspan data-gap="" dx="4.02815"> </tspan>means</tspan><tspan x="89" dy="31">observing<tspan data-gap="" dx="3.49879"> </tspan>carefully,<tspan data-gap="" dx="3.49879"> </tspan>asking<tspan data-gap="" dx="3.49879"> </tspan>sharp<tspan data-gap="" dx="3.49879"> </tspan>questions,<tspan data-gap="" dx="3.49879"> </tspan>testing<tspan data-gap="" dx="3.49879"> </tspan>what<tspan data-gap="" dx="3.49879"> </tspan>you<tspan data-gap="" dx="3.49879"> </tspan>think<tspan data-gap="" dx="3.49879"> </tspan>you<tspan data-gap="" dx="3.49879"> </tspan>know,<tspan data-gap="" dx="3.49879"> </tspan>and</tspan><tspan x="89" dy="31">being willing to change your mind when the evidence says you should.</tspan></text>
