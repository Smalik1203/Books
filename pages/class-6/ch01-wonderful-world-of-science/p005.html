<section class="page page--food page--science-editorial" data-science-chapter="1" data-folio="5" data-reference-page="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Wonderful World of Science, page 5"><!-- botanical-header --><path class="se-botanical-shadow" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="se-botanical-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><circle class="se-botanical-stem" cx="46" cy="29" r="17"/><path class="se-botanical-stem" d="M59 42l14 15M38 29h16M46 21v16"/><text class="se-running se-botanical-chapter" x="96" y="41">CHAPTER 1</text><text class="se-running se-header-title" x="963" y="40" text-anchor="end">The Wonderful World of Science</text><line class="se-footer-rule" x1="340" y1="58" x2="963" y2="58"/><!-- /botanical-header -->
<rect class="se-prompt" x="65" y="96" width="922" height="1210"/><line class="se-think-rule" x1="89" x2="963" y1="96" y2="96"/><g class="se-learning-cue se-feature--imagine" data-feature="imagine" aria-label="Imagine This"><svg class="se-feature-icon se-feature--imagine" x="89" y="97" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15a7 7 0 1 1 13-4v4h-3v6h-5v-4H5ZM9 8h5m-5 3h3"/></svg><text class="se-cue-title" x="145" y="126">Imagine This</text></g><text class="se-copy " data-measure="874" x="89" y="171"><tspan x="89">You already do science. You have simply never called it that.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="216"><tspan x="89">Suppose the clock on your wall has stopped. Both hands are frozen at ten past four.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="261"><tspan x="89">The first thing you do is ask a question, even if only in your head: <tspan class="se-italic">why</tspan> <tspan class="se-italic">has</tspan> <tspan class="se-italic">it</tspan> <tspan class="se-italic">stopped?</tspan></tspan></text>
<svg class="science-illustration" x="89" y="283" width="874" height="295" viewBox="80 1045 925 350" preserveAspectRatio="xMidYMid meet" overflow="hidden"><defs><clipPath id="se-art-clip-9"><rect x="80" y="1045" width="925" height="350"/></clipPath></defs><image clip-path="url(#se-art-clip-9)" href="../../figures/class-6/science/ch01-p005-reference.png" x="0" y="0" width="1052" height="1495"><title>Clock hands touching and a replacement cell.</title></image><rect class="food-white" x="603" y="1087" width="147" height="28"/><rect class="food-white" x="831" y="1090" width="47" height="28"/><text class="se-caption se-bold" x="608" y="1109">Hands touching</text><text class="se-caption se-bold" x="837" y="1112">Cell</text></svg>
<text class="se-copy " data-measure="874" x="89" y="623"><tspan x="89">Then, almost without noticing, you make a guess. The cell inside must be finished.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="668"><tspan x="89">Making<tspan data-gap="" dx="0.01924"> </tspan>a<tspan data-gap="" dx="0.01924"> </tspan>guess<tspan data-gap="" dx="0.01924"> </tspan>is<tspan data-gap="" dx="0.01924"> </tspan>the<tspan data-gap="" dx="0.01924"> </tspan>easy<tspan data-gap="" dx="0.01924"> </tspan>part.<tspan data-gap="" dx="0.01924"> </tspan>What<tspan data-gap="" dx="0.01924"> </tspan>matters<tspan data-gap="" dx="0.01924"> </tspan>is<tspan data-gap="" dx="0.01924"> </tspan>what<tspan data-gap="" dx="0.01924"> </tspan>you<tspan data-gap="" dx="0.01924"> </tspan>do<tspan data-gap="" dx="0.01924"> </tspan>next.<tspan data-gap="" dx="0.01924"> </tspan>You<tspan data-gap="" dx="0.01924"> </tspan>take<tspan data-gap="" dx="0.01924"> </tspan>the<tspan data-gap="" dx="0.01924"> </tspan>clock</tspan><tspan x="89" dy="31">down, open the back, and fit a new cell.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="744"><tspan x="89">If<tspan data-gap="" dx="1.59798"> </tspan>the<tspan data-gap="" dx="1.59798"> </tspan>hands<tspan data-gap="" dx="1.59798"> </tspan>begin<tspan data-gap="" dx="1.59798"> </tspan>to<tspan data-gap="" dx="1.59798"> </tspan>move,<tspan data-gap="" dx="1.59798"> </tspan>a<tspan data-gap="" dx="1.59798"> </tspan>used-up<tspan data-gap="" dx="1.59798"> </tspan>cell<tspan data-gap="" dx="1.59798"> </tspan>is<tspan data-gap="" dx="1.59798"> </tspan>one<tspan data-gap="" dx="1.59798"> </tspan>explanation.<tspan data-gap="" dx="1.59798"> </tspan>Refitting<tspan data-gap="" dx="1.59798"> </tspan>the<tspan data-gap="" dx="1.59798"> </tspan>cell<tspan data-gap="" dx="1.59798"> </tspan>also</tspan><tspan x="89" dy="31">changed<tspan data-gap="" dx="4.71423"> </tspan>its<tspan data-gap="" dx="4.71423"> </tspan>contact<tspan data-gap="" dx="4.71423"> </tspan>with<tspan data-gap="" dx="4.71423"> </tspan>the<tspan data-gap="" dx="4.71423"> </tspan>terminals,<tspan data-gap="" dx="4.71423"> </tspan>so<tspan data-gap="" dx="4.71423"> </tspan>that<tspan data-gap="" dx="4.71423"> </tspan>observation<tspan data-gap="" dx="4.71423"> </tspan>alone<tspan data-gap="" dx="4.71423"> </tspan>does<tspan data-gap="" dx="4.71423"> </tspan>not<tspan data-gap="" dx="4.71423"> </tspan>prove</tspan><tspan x="89" dy="31">which change mattered.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="851"><tspan x="89">But suppose they do not move.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="896"><tspan x="89">Now<tspan data-gap="" dx="4.73862"> </tspan>stop<tspan data-gap="" dx="4.73862"> </tspan>and<tspan data-gap="" dx="4.73862"> </tspan>notice<tspan data-gap="" dx="4.73862"> </tspan>something.<tspan data-gap="" dx="4.73862"> </tspan>The<tspan data-gap="" dx="4.73862"> </tspan>clock<tspan data-gap="" dx="4.73862"> </tspan>is<tspan data-gap="" dx="4.73862"> </tspan>still<tspan data-gap="" dx="4.73862"> </tspan>stopped,<tspan data-gap="" dx="4.73862"> </tspan>so<tspan data-gap="" dx="4.73862"> </tspan>it<tspan data-gap="" dx="4.73862"> </tspan>feels<tspan data-gap="" dx="4.73862"> </tspan>as<tspan data-gap="" dx="4.73862"> </tspan>though</tspan><tspan x="89" dy="31">nothing<tspan data-gap="" dx="6.41129"> </tspan>has<tspan data-gap="" dx="6.41129"> </tspan>been<tspan data-gap="" dx="6.41129"> </tspan>achieved.<tspan data-gap="" dx="6.41129"> </tspan>That<tspan data-gap="" dx="6.41129"> </tspan>is<tspan data-gap="" dx="6.41129"> </tspan>not<tspan data-gap="" dx="6.41129"> </tspan>true.<tspan data-gap="" dx="6.41129"> </tspan>A<tspan data-gap="" dx="6.41129"> </tspan>failed<tspan data-gap="" dx="6.41129"> </tspan>replacement<tspan data-gap="" dx="6.41129"> </tspan>narrows<tspan data-gap="" dx="6.41129"> </tspan>the</tspan><tspan x="89" dy="31">possibilities<tspan data-gap="" dx="0.45146"> </tspan>only<tspan data-gap="" dx="0.45146"> </tspan>if<tspan data-gap="" dx="0.45146"> </tspan>the<tspan data-gap="" dx="0.45146"> </tspan>new<tspan data-gap="" dx="0.45146"> </tspan>cell<tspan data-gap="" dx="0.45146"> </tspan>works,<tspan data-gap="" dx="0.45146"> </tspan>faces<tspan data-gap="" dx="0.45146"> </tspan>the<tspan data-gap="" dx="0.45146"> </tspan>right<tspan data-gap="" dx="0.45146"> </tspan>way<tspan data-gap="" dx="0.45146"> </tspan>and<tspan data-gap="" dx="0.45146"> </tspan>makes<tspan data-gap="" dx="0.45146"> </tspan>contact.<tspan data-gap="" dx="0.45146"> </tspan>Check</tspan><tspan x="89" dy="31">these before ruling out the cell as a cause.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="1034"><tspan x="89">So<tspan data-gap="" dx="3.67203"> </tspan>you<tspan data-gap="" dx="3.67203"> </tspan>make<tspan data-gap="" dx="3.67203"> </tspan>a<tspan data-gap="" dx="3.67203"> </tspan>second<tspan data-gap="" dx="3.67203"> </tspan>guess.<tspan data-gap="" dx="3.67203"> </tspan>Perhaps<tspan data-gap="" dx="3.67203"> </tspan>the<tspan data-gap="" dx="3.67203"> </tspan>cell<tspan data-gap="" dx="3.67203"> </tspan>is<tspan data-gap="" dx="3.67203"> </tspan>fine<tspan data-gap="" dx="3.67203"> </tspan>but<tspan data-gap="" dx="3.67203"> </tspan>is<tspan data-gap="" dx="3.67203"> </tspan>not<tspan data-gap="" dx="3.67203"> </tspan>pressing<tspan data-gap="" dx="3.67203"> </tspan>properly</tspan><tspan x="89" dy="31">against the metal contacts. You push it in firmly and give it a moment. Still nothing.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="1110"><tspan x="89">A<tspan data-gap="" dx="2.81294"> </tspan>third<tspan data-gap="" dx="2.81294"> </tspan>guess,<tspan data-gap="" dx="2.81294"> </tspan>then:<tspan data-gap="" dx="2.81294"> </tspan>something<tspan data-gap="" dx="2.81294"> </tspan>inside<tspan data-gap="" dx="2.81294"> </tspan>is<tspan data-gap="" dx="2.81294"> </tspan>stuck.<tspan data-gap="" dx="2.81294"> </tspan>You<tspan data-gap="" dx="2.81294"> </tspan>look<tspan data-gap="" dx="2.81294"> </tspan>more<tspan data-gap="" dx="2.81294"> </tspan>closely<tspan data-gap="" dx="2.81294"> </tspan>and<tspan data-gap="" dx="2.81294"> </tspan>find<tspan data-gap="" dx="2.81294"> </tspan>the</tspan><tspan x="89" dy="31">thin second hand has caught against the minute hand and cannot pass it.</tspan></text>
<text class="se-copy se-takeaway" data-measure="874" x="89" y="1186"><tspan x="89">Question. Guess. Test. Look honestly at what happened. Guess again if you must.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="1231"><tspan x="89">Nobody<tspan data-gap="" dx="3.12733"> </tspan>sat<tspan data-gap="" dx="3.12733"> </tspan>you<tspan data-gap="" dx="3.12733"> </tspan>down<tspan data-gap="" dx="3.12733"> </tspan>and<tspan data-gap="" dx="3.12733"> </tspan>taught<tspan data-gap="" dx="3.12733"> </tspan>you<tspan data-gap="" dx="3.12733"> </tspan>that<tspan data-gap="" dx="3.12733"> </tspan>sequence.<tspan data-gap="" dx="3.12733"> </tspan>Yet<tspan data-gap="" dx="3.12733"> </tspan>it<tspan data-gap="" dx="3.12733"> </tspan>is<tspan data-gap="" dx="3.12733"> </tspan>very<tspan data-gap="" dx="3.12733"> </tspan>close<tspan data-gap="" dx="3.12733"> </tspan>to<tspan data-gap="" dx="3.12733"> </tspan>what<tspan data-gap="" dx="3.12733"> </tspan>a</tspan><tspan x="89" dy="31">scientist does when facing something no one has ever explained.</tspan></text>
