<text class="se-copy " data-measure="874" x="89" y="614"><tspan x="89">Living<tspan data-gap="" dx="3.41392"> </tspan>things<tspan data-gap="" dx="3.41392"> </tspan>need<tspan data-gap="" dx="3.41392"> </tspan>materials<tspan data-gap="" dx="3.41392"> </tspan>and<tspan data-gap="" dx="3.41392"> </tspan>energy<tspan data-gap="" dx="3.41392"> </tspan>to<tspan data-gap="" dx="3.41392"> </tspan>grow.<tspan data-gap="" dx="3.41392"> </tspan>Green<tspan data-gap="" dx="3.41392"> </tspan>plants<tspan data-gap="" dx="3.41392"> </tspan>make<tspan data-gap="" dx="3.41392"> </tspan>sugars<tspan data-gap="" dx="3.41392"> </tspan>using</tspan><tspan x="89" dy="31">light,<tspan data-gap="" dx="4.53974"> </tspan>water<tspan data-gap="" dx="4.53974"> </tspan>and<tspan data-gap="" dx="4.53974"> </tspan>carbon<tspan data-gap="" dx="4.53974"> </tspan>dioxide;<tspan data-gap="" dx="4.53974"> </tspan>animals<tspan data-gap="" dx="4.53974"> </tspan>obtain<tspan data-gap="" dx="4.53974"> </tspan>food<tspan data-gap="" dx="4.53974"> </tspan>by<tspan data-gap="" dx="4.53974"> </tspan>eating.<tspan data-gap="" dx="4.53974"> </tspan>In<tspan data-gap="" dx="4.53974"> </tspan>a<tspan data-gap="" dx="4.53974"> </tspan>country<tspan data-gap="" dx="4.53974"> </tspan>this</tspan><tspan x="89" dy="31">large,<tspan data-gap="" dx="0.82470"> </tspan>that<tspan data-gap="" dx="0.82470"> </tspan>alone<tspan data-gap="" dx="0.82470"> </tspan>is<tspan data-gap="" dx="0.82470"> </tspan>a<tspan data-gap="" dx="0.82470"> </tspan>huge<tspan data-gap="" dx="0.82470"> </tspan>subject<tspan data-gap="" dx="0.82470"> </tspan>—<tspan data-gap="" dx="0.82470"> </tspan>pongal<tspan data-gap="" dx="0.82470"> </tspan>in<tspan data-gap="" dx="0.82470"> </tspan>one<tspan data-gap="" dx="0.82470"> </tspan>state,<tspan data-gap="" dx="0.82470"> </tspan>litti<tspan data-gap="" dx="0.82470"> </tspan>in<tspan data-gap="" dx="0.82470"> </tspan>another,<tspan data-gap="" dx="0.82470"> </tspan>a<tspan data-gap="" dx="0.82470" <text class="se-copy " data-measure="874" x="89" y="783"><tspan x="89">Then<tspan data-gap="" dx="2.43284"> </tspan>there<tspan data-gap="" dx="2.43284"> </tspan>is<tspan data-gap="" dx="2.43284"> </tspan>water.<tspan data-gap="" dx="2.43284"> </tspan>You<tspan data-gap="" dx="2.43284"> </tspan>have<tspan data-gap="" dx="2.43284"> </tspan>jumped<tspan data-gap="" dx="2.43284"> </tspan>into<tspan data-gap="" dx="2.43284"> </tspan>a<tspan data-gap="" dx="2.43284"> </tspan>puddle<tspan data-gap="" dx="2.43284"> </tspan>after<tspan data-gap="" dx="2.43284"> </tspan>rain.<tspan data-gap="" dx="2.43284"> </tspan>But<tspan data-gap="" dx="2.43284"> </tspan>where<tspan data-gap="" dx="2.43284"> </tspan>was<tspan data-gap="" dx="2.43284"> </tspan>that</tspan><tspan x="89" dy="31">water<tspan data-gap="" dx="-0.02437"> </tspan>an<tspan data-gap="" dx="-0.02437"> </tspan>hour<tspan data-gap="" dx="-0.02437"> </tspan>before<tspan data-gap="" dx="-0.02437"> </tspan>it<tspan data-gap="" dx="-0.02437"> </tspan>fell<tspan data-gap="" dx="-0.02437"> </tspan>on<tspan data-gap="" dx="-0.02437"> </tspan>you,<tspan data-gap="" dx="-0.02437"> </tspan>and<tspan data-gap="" dx="-0.02437"> </tspan>how<tspan data-gap="" dx="-0.02437"> </tspan>did<tspan data-gap="" dx="-0.02437"> </tspan>it<tspan data-gap="" dx="-0.02437"> </tspan>get<tspan data-gap="" dx="-0.02437"> </tspan>up<tspan data-gap="" dx="-0.02437"> </tspan>there?<tspan data-gap="" dx="-0.02437"> </tspan>Cool<tspan data-gap="" dx="-0.02437"> </tspan>it<tspan data-gap="" dx="-0.02437"> </tspan>and<tspan data-gap="" dx="-0.02437"> </tspan>it<tspan data-gap="" dx="-0.02437"> </tspan>turns<tspan data-gap="" dx="-0.02437"> </tspan>to</tspan><tspan x="89" dy="31">ice. Heat it and it leaves as steam. What is going on?</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="890"><tspan x="89">And<tspan data-gap="" dx="0.46141"> </tspan>how<tspan data-gap="" dx="0.46141"> </tspan>hot<tspan data-gap="" dx="0.46141"> </tspan>is<tspan data-gap="" dx="0.46141"> </tspan>hot?<tspan data-gap="" dx="0.46141"> </tspan>When<tspan data-gap="" dx="0.46141"> </tspan>someone<tspan data-gap="" dx="0.46141"> </tspan>in<tspan data-gap="" dx="0.46141"> </tspan>your<tspan data-gap="" dx="0.46141"> </tspan>house<tspan data-gap="" dx="0.46141"> </tspan>has<tspan data-gap="" dx="0.46141"> </tspan>a<tspan data-gap="" dx="0.46141"> </tspan>fever,<tspan data-gap="" dx="0.46141"> </tspan>nobody<tspan data-gap="" dx="0.46141"> </tspan>wants<tspan data-gap="" dx="0.46141"> </tspan>a<tspan data-gap="" dx="0.46141"> </tspan>guess.</tspan><tspan x="89" dy="31">They want a number.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="966"><tspan x="89">Now<tspan data-gap="" dx="2.05883"> </tspan>look<tspan data-gap="" dx="2.05883"> </tspan>at<tspan data-gap="" dx="2.05883"> </tspan>what<tspan data-gap="" dx="2.05883"> </tspan>things<tspan data-gap="" dx="2.05883"> </tspan>are<tspan data-gap="" dx="2.05883"> </tspan>made<tspan data-gap="" dx="2.05883"> </tspan>of<tspan data-gap="" dx="2.05883"> </tspan>—<tspan data-gap="" dx="2.05883"> </tspan>paper,<tspan data-gap="" dx="2.05883"> </tspan>the<tspan data-gap="" dx="2.05883"> </tspan>metal<tspan data-gap="" dx="2.05883"> </tspan>of<tspan data-gap="" dx="2.05883"> </tspan>a<tspan data-gap="" dx="2.05883"> </tspan>key,<tspan data-gap="" dx="2.05883"> </tspan>a<tspan data-gap="" dx="2.05883"> </tspan>plastic<tspan data-gap="" dx="2.05883"> </tspan>scale,<tspan data-gap="" dx="2.05883"> </tspan>a</tspan><tspan x="89" dy="31">rubber<tspan data-gap="" dx="1.06766"> </tspan>eraser,<tspan data-gap="" dx="1.06766"> </tspan>the<tspan data-gap="" dx="1.06766"> </tspan>magnet<tspan data-gap="" dx="1.06766"> </tspan>holding<tspan data-gap="" dx="1.06766"> </tspan>a<tspan data-gap="" dx="1.06766"> </tspan>cupboard<tspan data-gap="" dx="1.06766"> </tspan>shut,<tspan data-gap="" dx="1.06766"> </tspan>the<tspan data-gap="" dx="1.06766"> </tspan>cloth<tspan data-gap="" dx="1.06766"> </tspan>of<tspan data-gap="" dx="1.06766"> </tspan>your<tspan data-gap="" dx="1.06766"> </tspan>shirt.<tspan data-gap="" dx="1.06766"> </tspan>Each<tspan data-gap="" dx="1.06766"> </tspan>one</tspan><tspan x="89" dy="31">was chosen for a reason. Could a key be made of rubber? Why not?</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="1073"><tspan x="89">And when the Earth runs out of questions, there is the sky above it.</tspan></text>
<text class="se-copy " data-measure="874" x="89" y="1118"><tspan x="89">These<tspan data-gap="" dx="4.56140"> </tspan>questions<tspan data-gap="" dx="4.56140"> </tspan>connect<tspan data-gap="" dx="4.56140"> </tspan>different<tspan data-gap="" dx="4.56140"> </tspan>parts<tspan data-gap="" dx="4.56140"> </tspan>of<tspan data-gap="" dx="4.56140"> </tspan>science.<tspan data-gap="" dx="4.56140"> </tspan>Following<tspan data-gap="" dx="4.56140"> </tspan>water<tspan data-gap="" dx="4.56140"> </tspan>leads<tspan data-gap="" dx="4.56140"> </tspan>from<tspan data-gap="" dx="4.56140"> </tspan>a</tspan><tspan x="89" dy="31">puddle<tspan data-gap="" dx="5.33826"> </tspan>to<tspan data-gap="" dx="5.33826"> </tspan>the<tspan data-gap="" dx="5.33826"> </tspan>weather.<tspan data-gap="" dx="5.33826"> </tspan>Studying<tspan data-gap="" dx="5.33826"> </tspan>a<tspan data-gap="" dx="5.33826"> </tspan>plant<tspan data-gap="" dx="5.33826"> </tspan>leads<tspan data-gap="" dx="5.33826"> </tspan>to<tspan data-gap="" dx="5.33826"> </tspan>light,<tspan data-gap="" dx="5.33826"> </tspan>air<tspan data-gap="" dx="5.33826"> </tspan>and<tspan data-gap="" dx="5.33826"> </tspan>food.<tspan data-gap="" dx="5.33826"> </tspan>Comparing</tspan><tspan x="89" dy="31">materials<tspan data-gap="" dx="3.76402"> </tspan>leads<tspan data-gap="" dx="3.76402"> </tspan>to<tspan data-gap="" dx="3.76402"> </tspan>the<tspan data-gap="" dx="3.76402"> </tspan>design<tspan data-gap="" dx="3.76402"> </tspan>of<tspan data-gap="" dx="3.76402"> </tspan>useful<tspan data-gap="" dx="3.76402"> </tspan>objects.<tspan data-gap="" dx="3.76402"> </tspan>Look<tspan data-gap="" dx="3.76402"> </tspan>for<tspan data-gap="" dx="3.76402"> </tspan>these<tspan data-gap="" dx="3.76402"> </tspan>connections<tspan data-gap="" dx="3.76402"> </tspan>as<tspan data-gap="" dx="3.76402"> </tspan>you</tspan><tspan x="89" dy="31">read. Ask what changes something, and what evidence could help explain it.</tspan></text>
<text class="se-copy se-takeaway" data-measure="874" x="89" y="1256"><tspan x="89">Every one of these has an answer. Not all of them are in this book.</tspan></text>
