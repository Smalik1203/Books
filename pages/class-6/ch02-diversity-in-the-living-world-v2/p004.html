<g class="v2-reading-block" transform="translate(0 78)"><text class="se-copy" data-measure="874" x="89" y="666"><tspan x="89">The variety of living things found in one region is called its <tspan class="se-bold">biodiversity</tspan>.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 78)"><text class="se-copy" data-measure="874" x="89" y="712"><tspan x="89">Your<tspan data-gap="" dx="2.31719"> </tspan>school<tspan data-gap="" dx="2.31719"> </tspan>ground<tspan data-gap="" dx="2.31719"> </tspan>has<tspan data-gap="" dx="2.31719"> </tspan>its<tspan data-gap="" dx="2.31719"> </tspan>own<tspan data-gap="" dx="2.31719"> </tspan>biodiversity.<tspan data-gap="" dx="2.31719"> </tspan>So<tspan data-gap="" dx="2.31719"> </tspan>does<tspan data-gap="" dx="2.31719"> </tspan>a<tspan data-gap="" dx="2.31719"> </tspan>pond.<tspan data-gap="" dx="2.31719"> </tspan>So<tspan data-gap="" dx="2.31719"> </tspan>does<tspan data-gap="" dx="2.31719"> </tspan>a<tspan data-gap="" dx="2.31719"> </tspan>forest,<tspan data-gap="" dx="2.31719"> </tspan>a</tspan><tspan x="89" dy="31">seashore, and even the soil in a flowerpot.</tspan></text></g>
