r="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-12" transform="translate(0 -452)"><text class="se-copy" x="89" y="588"><tspan x="89">Separate what you saw from what you infer. The crow was seen on a wall and in a</tspan><tspan x="89" dy="32">tree; that does not tell us every place it lives. &quot;Pecking at something&quot; does not</tspan><tspan x="89" dy="32">identify its food. What further observation could help?</tspan></text></g>
<g class="v2-reading-block" data-block="reading-13" transform="translate(0 -452)"><text class="se-copy" x="89" y="700"><tspan x="89">The variety of living things found in one region is called its <tspan class="se-bold">biodiversity</tspan>.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-14" transform="translate(0 -452)"><text class="se-copy" x="89" y="748"><tspan x="89">Suppose you record eighteen ants of one kind, two crows and one squirrel. That</tspan><tspan x="89" dy="32">is twenty-one animals, but only three kinds in your record. Counting individuals</tspan></text></g>
<g class="v2-reading-block" data-block="reading-15" transform="translate(0 -452)"><text class="se-copy" x="89" y="812"><tspan x="89">answers “How many animals?” Counting kinds answers a different question.</tspan><tspan x="89" dy="32">Neither count tells you what your search missed.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-16" transform="translate(0 -452)"><text class="se-copy" x="89" y="892"><tspan x="89">Your school ground has its own biodiversity. So does a pond. So does a forest, a</tspan><tspan x="89" dy="32">seashore, and even the soil in a flowerpot.</tspan></text></g>
<g class="v2-reading-block" data-block="source-4-5" transform="translate(0 -452)"><rect class="se-prompt se-thought-panel" x="89" y="948" width="874" height="188"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="969" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="991">Think It Through</text></g><text class="se-copy" x="113" y="1044"><tspan x="113">Your search lasted one period. Name two kinds of living things that your</tspan><tspan x="113" dy="32">method might have missed. Plan one change to the time, place or method</tspan><tspan x="113" dy="32">that could help you find them.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-18" transform="translate(0 602)"><text class="se-heading" x="89" y="142"><tspan x="89">Living Things Need Each Other</tspan></text></g>
<g class="v2-reading-block" data-block="reading-19" transform="translate(0 602)"><text class="se-copy" x="89" y="184"><tspan x="89">The living things in a place are not just sharing space. They are joined to each</tspan><tspan x="89" dy="32">other.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-20" transform="translate(0 602)"><text class="se-copy" x="89" y="264"><tspan x="89">A tree shades smaller plants and offers birds nest sites and insects on its bark.</tspan><tspan x="89" dy="32">Fruit-eating birds may carry seeds to suitable growing places. Decomposers feed</tspan><tspan x="89" dy="32">on fallen leaves, helping return nutrients to the soil.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-21" transform="translate(0 602)"><image class="science-illustration" href="../../figures/class-6/science/ch02-v2/tree-relationships.png" x="245" y="352" width="560" height="374" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="592" text-anchor="start">Small plants</text><text class="se-caption" x="89" y="617" text-anchor="start">grow beneath</text><text class="se-caption" x="89" y="642" text-anchor="start">the canopy.</text><text class="se-caption" x="821" y="417" text-anchor="start">A branch</text><text class="se-caption" x="821" y="442" text-anchor="start">supports</text><text class="se-caption" x="821" y="467" text-anchor="start">a nest.</text><text class="se-caption" x="821" y="620" text-anchor="start">A bird feeds</text><text class="se-caption" x="821" y="645" text-anchor="start">on fallen</text><text class="se-caption" x="821" y="670" text-anchor="start">fruit.</text><path class="v2-figure-leader" d="M225 618H270L402 666M813 445H778L639 467M813 646H761L650 673"/></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
