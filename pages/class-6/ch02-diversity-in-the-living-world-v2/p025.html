<text class="se-copy" x="542" y="710"><tspan x="542">Governments and communities both</tspan><tspan x="542" dy="32">protect habitats. <tspan class="se-bold">Sacred</tspan> groves are</tspan><tspan x="542" dy="32">patches of vegetation protected</tspan><tspan x="542" dy="32">through local cultural or religious</tspan><tspan x="542" dy="32">traditions. Rules about cutting,</tspan><tspan x="542" dy="32">collecting and hunting vary. Some</tspan><tspan x="542" dy="32">groves preserve old trees and habitat</tspan><tspan x="542" dy="32">missing from nearby cleared land.</tspan><tspan x="542" dy="32">Some also have legal protection. Find</tspan><tspan x="542" dy="32">out how a grove near you is protected.</tspan></text></g>
