<section class="page page--food page--science-editorial page--science-v2" data-folio="25"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 25"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g transform="translate(-148 3) scale(.2)"><g class="v2-ribbon__motif" transform="translate(0 0)" aria-hidden="true"><path class="v2-ribbon__stem" d="M1005 35C930 117 932 200 1018 275"/><path class="v2-ribbon__leaves" d="M994.33 47.31C1005.31 49.71 1020.98 36.37 1024 20C1011.75 25.15 996.71 35.6 994.33 47.31Z M978.05 69.47C992.62 77.79 1025.12 66.86 1041 46C1019.28 47.37 989.73 54.66 978.05 69.47Z M963.3 96.55C965.95 76.92 940.73 53.11 912 52C922.59 71.93 942.72 95.37 963.3 96.55Z M954.26 123.53C973.15 135.98 1017.32 123.91 1040 97C1010.89 97.06 970.91 104.46 954.26 123.53Z M951.06 147.92C949.72 125.2 916.83 105.4 885 112C900.96 131.44 928.18 152.21 951.06 147.92Z M953.1 174.53C970.15 189.5 1011.77 181.61 1034 156C1006.91 152.97 969.39 156.43 953.1 174.53Z M961.02 200.84C956.66 180.93 925.52 168.87 899 180C915.5 194.56 941.9 208.44 961.02 200.84Z M974.87 226.77C987.64 240.88 1022.05 237.75 1042 218C1020.2 213.13 989.44 212.87 974.87 226.77Z M990.66 247.67C986.1 232.61 959.09 222.53 937 230C951.66 241.46 974.71 252.74 990.66 247.67Z"/><path class="v2-ribbon__veins" d="M996.11 45.67Q1008.04 36.59 1021.07 23.37 M981.82 68.07Q1005.8 61.22 1034.32 49.24 M960.22 93.87Q942.89 75.49 918.23 56.22 M959.41 121.94Q991.92 114.66 1030.85 100.83 M947.1 145.76Q924.06 129.89 892.77 115.03 M957.95 173.42Q988.51 169.29 1025.32 159.01 M957.29 199.59Q935.2 189.36 906.12 181.39 M978.9 226.25Q1004.04 225.36 1034.73 219.81 M987.44 246.61Q968.2 238.21 943.12 231.28"/></g></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150"><tspan x="89">Keywords</tspan></text>
<rect class="se-glossary-panel" x="89" y="170" width="874" height="1178" rx="20"/><text class="se-copy" x="113" y="219"><tspan x="113"><tspan class="se-bold">Adaptation</tspan> — An inherited feature</tspan><tspan x="113" dy="32">that helps an organism survive and</tspan><tspan x="113" dy="32">reproduce in its usual environment.</tspan></text><text class="se-copy" x="113" y="327"><tspan x="113"><tspan class="se-bold">Amphibian</tspan> — An animal belonging</tspan><tspan x="113" dy="32">to the group that includes frogs and</tspan><tspan x="113" dy="32">toads; many use water and land</tspan><tspan x="113" dy="32">during their lives.</tspan></text><text class="se-copy" x="113" y="467"><tspan x="113"><tspan class="se-bold">Aquatic</tspan> — Living in water, or</tspan><tspan x="113" dy="32">describing a habitat in water.</tspan></text><text class="se-copy" x="113" y="543"><tspan x="113"><tspan class="se-bold">Biodiversity</tspan> — The variety of living</tspan><tspan x="113" dy="32">things found in a region.</tspan></text><text class="se-copy" x="113" y="619"><tspan x="113"><tspan class="se-bold">Climber</tspan> — A plant that grows</tspan><tspan x="113" dy="32">upwards using external support.</tspan></text><text class="se-copy" x="113" y="695"><tspan x="113"><tspan class="se-bold">Cotyledon</tspan> — A seed leaf that is part</tspan><tspan x="113" dy="32">of the embryo inside a seed.</tspan></text><text class="se-copy" x="113" y="771"><tspan x="113"><tspan class="se-bold">Creeper</tspan> — A plant with stems that</tspan><tspan x="113" dy="32">trail along the ground.</tspan></text><text class="se-copy" x="113" y="847"><tspan x="113"><tspan class="se-bold">Dicot</tspan> — A flowering plant whose</tspan><tspan x="113" dy="32">seed has two cotyledons.</tspan></text><text class="se-copy" x="113" y="923"><tspan x="113"><tspan class="se-bold">Endosperm</tspan> — Food-storing tissue in</tspan><tspan x="113" dy="32">a seed that nourishes the developing</tspan><tspan x="113" dy="32">embryo.</tspan></text><text class="se-copy" x="113" y="1031"><tspan x="113"><tspan class="se-bold">Fibrous</tspan> <tspan class="se-bold">root</tspan> <tspan class="se-bold">system</tspan> — A spreading</tspan><tspan x="113" dy="32">bunch of roots without one</tspan><tspan x="113" dy="32">dominant main root.</tspan></text><text class="se-copy" x="113" y="1139"><tspan x="113"><tspan class="se-bold">Grouping</tspan> — Arranging things by</tspan><tspan x="113" dy="32">features they share, using a stated</tspan><tspan x="113" dy="32">rule.</tspan></text><text class="se-copy" x="113" y="1247"><tspan x="113"><tspan class="se-bold">Habitat</tspan> — The place where an</tspan><tspan x="113" dy="32">organism lives, including its</tspan><tspan x="113" dy="32">conditions and resources.</tspan></text><text class="se-copy" x="541" y="219"><tspan x="541"><tspan class="se-bold">Herb</tspan> — A plant with soft, non-woody</tspan><tspan x="541" dy="32">stems; it need not be small.</tspan></text><text class="se-copy" x="541" y="295"><tspan x="541"><tspan class="se-bold">Monocot</tspan> — A flowering plant whose</tspan><tspan x="541" dy="32">seed has one cotyledon.</tspan></text><text class="se-copy" x="541" y="371"><tspan x="541"><tspan class="se-bold">Parallel</tspan> <tspan class="se-bold">venation</tspan> — A leaf-vein</tspan><tspan x="541" dy="32">pattern in which many veins run</tspan><tspan x="541" dy="32">alongside one another.</tspan></text><text class="se-copy" x="541" y="479"><tspan x="541"><tspan class="se-bold">Pseudostem</tspan> — A trunk-like structure</tspan><tspan x="541" dy="32">formed by overlapping leaf bases, as</tspan><tspan x="541" dy="32">in banana.</tspan></text><text class="se-copy" x="541" y="587"><tspan x="541"><tspan class="se-bold">Reticulate</tspan> <tspan class="se-bold">venation</tspan> — A leaf-vein</tspan><tspan x="541" dy="32">pattern in which veins branch and</tspan><tspan x="541" dy="32">join to form a network.</tspan></text><text class="se-copy" x="541" y="695"><tspan x="541"><tspan class="se-bold">Sacred</tspan> <tspan class="se-bold">grove</tspan> — A patch of</tspan><tspan x="541" dy="32">vegetation protected through local</tspan><tspan x="541" dy="32">cultural or religious traditions.</tspan></text><text class="se-copy" x="541" y="803"><tspan x="541"><tspan class="se-bold">Shrub</tspan> — A woody plant that usually</tspan><tspan x="541" dy="32">branches near the ground, often with</tspan><tspan x="541" dy="32">several main stems.</tspan></text><text class="se-copy" x="541" y="911"><tspan x="541"><tspan class="se-bold">Taproot</tspan> — The main root of a root</tspan><tspan x="541" dy="32">system, with smaller roots branching</tspan><tspan x="541" dy="32">from it.</tspan></text><text class="se-copy" x="541" y="1019"><tspan x="541"><tspan class="se-bold">Terrestrial</tspan> — Living on land, or</tspan><tspan x="541" dy="32">describing a habitat on land.</tspan></text><text class="se-copy" x="541" y="1095"><tspan x="541"><tspan class="se-bold">Tree</tspan> — A woody plant that usually</tspan><tspan x="541" dy="32">develops a main trunk supporting a</tspan><tspan x="541" dy="32">crown of branches.</tspan></text><text class="se-copy" x="541" y="1203"><tspan x="541"><tspan class="se-bold">Venation</tspan> — The pattern of veins in a</tspan><tspan x="541" dy="32">leaf.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">25</text></g></svg></div></div></section>
