hor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-72" transform="translate(0 0)"><text class="se-copy" x="89" y="136"><tspan x="89">Compare your prints with these examples. Two common patterns are shown</tspan><tspan x="89" dy="32">here; your sample may contain only one.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-73" transform="translate(0 0)"><image class="science-illustration" href="../../figures/class-6/science/ch02-v2/veins.png" x="89" y="192" width="874" height="350" preserveAspectRatio="xMidYMid meet"/>
<text class="se-caption" x="235" y="569" text-anchor="middle">Hibiscus</text>
<text class="se-caption" x="526" y="569" text-anchor="middle">Banana</text>
<text class="se-caption" x="817" y="569" text-anchor="middle">Grass</text></g>
<g class="v2-reading-block" data-block="reading-74" transform="translate(0 0)"><text class="v2-comparison-title" x="89" y="621"><tspan x="89">Reticulate venation</tspan></text><text class="se-copy" x="89" y="663" text-anchor="start">•</text><text class="se-copy" x="112" y="663"><tspan x="112">Veins branch and join to form a net.</tspan></text><text class="se-copy" x="89" y="703" text-anchor="start">•</text><text class="se-copy" x="112" y="703"><tspan x="112">Hibiscus has a thick middle vein</tspan><tspan x="112" dy="32">with finer branching veins.</tspan></text><text class="se-copy" x="89" y="775" text-anchor="start">•</text><text class="se-copy" x="112" y="775"><tspan x="112">Other examples: mango, neem and</tspan><tspan x="112" dy="32">peepal.</tspan></text>
<text class="v2-comparison-title" x="542" y="621"><tspan x="542">Parallel venation</tspan></text><text class="se-copy" x="542" y="663" text-anchor="start">•</text><text class="se-copy" x="565" y="663"><tspan x="565">Many veins run alongside one</tspan><tspan x="565" dy="32">another.</tspan></text><text class="se-copy" x="542" y="735" text-anchor="start">•</text><text class="se-copy" x="565" y="735"><tspan x="565">Grass: veins run along the blade.</tspan></text><text class="se-copy" x="542" y="775" text-anchor="start">•</text><text class="se-copy" x="565" y="775"><tspan x="565">Banana: parallel side veins extend</tspan><tspan x="565" dy="32">from a strong middle vein towards</tspan><tspan x="565" dy="32">the edges.</tspan></text><text class="se-copy" x="542" y="879" text-anchor="start">•</text><text class="se-copy" x="565" y="879"><tspan x="565">Parallel venation does not mean that</tspan><tspan x="565" dy="32">a middle vein is absent.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-75" transform="translate(0 0)"><text class="se-copy" x="89" y="973"><tspan x="89">These two patterns help you compare many of the leaves around you. Look</tspan><tspan x="89" dy="32">closely: real leaves sometimes show exceptions.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-76" transform="translate(0 0)"><text class="se-copy" x="89" y="1053"><tspan x="89">Do not stop at the thick middle vein. Follow several smaller veins towards the</tspan><tspan x="89" dy="32">edge and look between them. In a net-like pattern, branches join to enclose small</tspan></text></g>
<g class="v2-reading-block" data-block="reading-77" transform="translate(0 0)"><text class="se-copy" x="89" y="1117"><tspan x="89">areas. In a parallel pattern, the main veins run alongside one another. Describe</tspan><tspan x="89" dy="32">the overall arrangement, rather than deciding from one short line.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-78" transform="translate(0 0)"><text class="se-copy" x="89" y="1197"><tspan x="89">Predict the venation of wheat or maize from the examples. Then inspect a leaf or</tspan><tspan x="89" dy="32">a clear photograph. Was your prediction supported? Leaf shape alone is not proof</tspan><tspan x="89" dy="32">of its vein pattern.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">11</text></g></svg></div></div></section>
