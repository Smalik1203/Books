<section class="page page--food page--science-editorial page--science-v2" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 11"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="v2-ribbon-stem" d="M31 63Q34 30 60 7"/><path class="v2-ribbon-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" transform="translate(0 0)"><text class="se-heading" x="89" y="142"><tspan x="89">Lines on a Leaf</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="197"><tspan x="89">Hold<tspan data-gap="" dx="1.54248"> </tspan>a<tspan data-gap="" dx="1.54248"> </tspan>leaf<tspan data-gap="" dx="1.54248"> </tspan>up<tspan data-gap="" dx="1.54248"> </tspan>against<tspan data-gap="" dx="1.54248"> </tspan>the<tspan data-gap="" dx="1.54248"> </tspan>light.<tspan data-gap="" dx="1.54248"> </tspan>You<tspan data-gap="" dx="1.54248"> </tspan>will<tspan data-gap="" dx="1.54248"> </tspan>see<tspan data-gap="" dx="1.54248"> </tspan>thin<tspan data-gap="" dx="1.54248"> </tspan>lines<tspan data-gap="" dx="1.54248"> </tspan>running<tspan data-gap="" dx="1.54248"> </tspan>through<tspan data-gap="" dx="1.54248"> </tspan>it.<tspan data-gap="" dx="1.54248"> </tspan>These</tspan><tspan x="89" dy="31">lines are <tspan class="se-bold">veins</tspan>. The pattern the veins make is called <tspan class="se-bold">venation</tspan>.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="275"><tspan x="89">Veins<tspan data-gap="" dx="2.93353"> </tspan>contain<tspan data-gap="" dx="2.93353"> </tspan>tissues<tspan data-gap="" dx="2.93353"> </tspan>that<tspan data-gap="" dx="2.93353"> </tspan>transport<tspan data-gap="" dx="2.93353"> </tspan>water<tspan data-gap="" dx="2.93353"> </tspan>and<tspan data-gap="" dx="2.93353"> </tspan>dissolved<tspan data-gap="" dx="2.93353"> </tspan>substances.<tspan data-gap="" dx="2.93353"> </tspan>They<tspan data-gap="" dx="2.93353"> </tspan>carry</tspan><tspan x="89" dy="31">water<tspan data-gap="" dx="2.30531"> </tspan>into<tspan data-gap="" dx="2.30531"> </tspan>the<tspan data-gap="" dx="2.30531"> </tspan>leaf<tspan data-gap="" dx="2.30531"> </tspan>and<tspan data-gap="" dx="2.30531"> </tspan>sugars<tspan data-gap="" dx="2.30531"> </tspan>made<tspan data-gap="" dx="2.30531"> </tspan>in<tspan data-gap="" dx="2.30531"> </tspan>the<tspan data-gap="" dx="2.30531"> </tspan>leaf<tspan data-gap="" dx="2.30531"> </tspan>to<tspan data-gap="" dx="2.30531"> </tspan>other<tspan data-gap="" dx="2.30531"> </tspan>parts<tspan data-gap="" dx="2.30531"> </tspan>of<tspan data-gap="" dx="2.30531"> </tspan>the<tspan data-gap="" dx="2.30531"> </tspan>plant.<tspan data-gap="" dx="2.30531"> </tspan>They</tspan><tspan x="89" dy="31">also help support the leaf.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><rect class="se-activity-panel" x="89" y="362" width="874" height="621" rx="18"/><g class="v2-investigate-icon"><circle cx="128" cy="392" r="12"/><path d="M137 401l10 10"/></g><text class="se-activity-tab-text" x="160" y="401" text-anchor="start">Investigate</text><text class="se-copy" x="113" y="451"><tspan x="113">You will need: fallen leaves of at least four different plants, thin paper, a</tspan><tspan x="113" dy="32">pencil with soft lead.</tspan></text><text class="se-activity-step" x="128" y="526" text-anchor="end">1.</text><text class="se-copy" x="146" y="527"><tspan x="146">Put a leaf on the desk with its back side facing up. The veins stand out</tspan><tspan x="146" dy="32">more on that side.</tspan></text><text class="se-activity-step" x="128" y="602" text-anchor="end">2.</text><text class="se-copy" x="146" y="603"><tspan x="146">Place a sheet of thin paper over the leaf.</tspan></text><text class="se-activity-step" x="128" y="646" text-anchor="end">3.</text><text class="se-copy" x="146" y="647"><tspan x="146">Hold the paper still. Rub the side of the pencil lead flat across it, using</tspan><tspan x="146" dy="32">light strokes.</tspan></text><text class="se-activity-step" x="128" y="722" text-anchor="end">4.</text><text class="se-copy" x="146" y="723"><tspan x="146">Check the print against the leaf. If the veins are unclear, adjust the paper</tspan><tspan x="146" dy="32">or pressure and try again.</tspan></text><text class="se-activity-step" x="128" y="798" text-anchor="end">5.</text><text class="se-copy" x="146" y="799"><tspan x="146">Do this for every leaf. Write the plant's name next to each print.</tspan></text><text class="se-copy" x="113" y="843"><tspan x="113">Put all your prints side by side.</tspan></text><text class="se-copy" x="113" y="887"><tspan x="113">Group the prints by their vein patterns. How many groups does your sample</tspan><tspan x="113" dy="32">support? Explain your rule. If all the patterns look alike, compare with</tspan><tspan x="113" dy="32">another group’s leaves.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="1040"><tspan x="89">A<tspan data-gap="" dx="4.67179"> </tspan>rubbing<tspan data-gap="" dx="4.67179"> </tspan>is<tspan data-gap="" dx="4.67179"> </tspan>a<tspan data-gap="" dx="4.67179"> </tspan>record<tspan data-gap="" dx="4.67179"> </tspan>made<tspan data-gap="" dx="4.67179"> </tspan>by<tspan data-gap="" dx="4.67179"> </tspan>a<tspan data-gap="" dx="4.67179"> </tspan>method.<tspan data-gap="" dx="4.67179"> </tspan>A<tspan data-gap="" dx="4.67179"> </tspan>faint<tspan data-gap="" dx="4.67179"> </tspan>patch<tspan data-gap="" dx="4.67179"> </tspan>may<tspan data-gap="" dx="4.67179"> </tspan>mean<tspan data-gap="" dx="4.67179"> </tspan>the<tspan data-gap="" dx="4.67179"> </tspan>paper</tspan><tspan x="89" dy="31">moved<tspan data-gap="" dx="7.84413"> </tspan>or<tspan data-gap="" dx="7.84413"> </tspan>the<tspan data-gap="" dx="7.84413"> </tspan>pencil<tspan data-gap="" dx="7.84413"> </tspan>missed<tspan data-gap="" dx="7.84413"> </tspan>it.<tspan data-gap="" dx="7.84413"> </tspan>Check<tspan data-gap="" dx="7.84413"> </tspan>that<tspan data-gap="" dx="7.84413"> </tspan>patch<tspan data-gap="" dx="7.84413"> </tspan>on<tspan data-gap="" dx="7.84413"> </tspan>the<tspan data-gap="" dx="7.84413"> </tspan>actual<tspan data-gap="" dx="7.84413"> </tspan>leaf<tspan data-gap="" dx="7.84413"> </tspan>before</tspan><tspan x="89" dy="31">describing<tspan data-gap="" dx="1.74223"> </tspan>its<tspan data-gap="" dx="1.74223"> </tspan>veins.<tspan data-gap="" dx="1.74223"> </tspan>Keep<tspan data-gap="" dx="1.74223"> </tspan>an<tspan data-gap="" dx="1.74223"> </tspan>unclear<tspan data-gap="" dx="1.74223"> </tspan>print<tspan data-gap="" dx="1.74223"> </tspan>beside<tspan data-gap="" dx="1.74223"> </tspan>your<tspan data-gap="" dx="1.74223"> </tspan>improved<tspan data-gap="" dx="1.74223"> </tspan>one<tspan data-gap="" dx="1.74223"> </tspan>so<tspan data-gap="" dx="1.74223"> </tspan>you<tspan data-gap="" dx="1.74223"> </tspan>can</tspan><tspan x="89" dy="31">explain why you changed the record.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="1182"><tspan x="89">Compare<tspan data-gap="" dx="2.69706"> </tspan>the<tspan data-gap="" dx="2.69706"> </tspan>vein<tspan data-gap="" dx="2.69706"> </tspan>pattern<tspan data-gap="" dx="2.69706"> </tspan>separately<tspan data-gap="" dx="2.69706"> </tspan>from<tspan data-gap="" dx="2.69706"> </tspan>the<tspan data-gap="" dx="2.69706"> </tspan>leaf<tspan data-gap="" dx="2.69706"> </tspan>outline.<tspan data-gap="" dx="2.69706"> </tspan>Two<tspan data-gap="" dx="2.69706"> </tspan>leaves<tspan data-gap="" dx="2.69706"> </tspan>can<tspan data-gap="" dx="2.69706"> </tspan>have</tspan><tspan x="89" dy="31">different<tspan data-gap="" dx="3.72036"> </tspan>outlines<tspan data-gap="" dx="3.72036"> </tspan>yet<tspan data-gap="" dx="3.72036"> </tspan>share<tspan data-gap="" dx="3.72036"> </tspan>a<tspan data-gap="" dx="3.72036"> </tspan>vein<tspan data-gap="" dx="3.72036"> </tspan>pattern.<tspan data-gap="" dx="3.72036"> </tspan>Point<tspan data-gap="" dx="3.72036"> </tspan>to<tspan data-gap="" dx="3.72036"> </tspan>the<tspan data-gap="" dx="3.72036"> </tspan>lines<tspan data-gap="" dx="3.72036"> </tspan>that<tspan data-gap="" dx="3.72036"> </tspan>support<tspan data-gap="" dx="3.72036"> </tspan>your</tspan><tspan x="89" dy="31">grouping;<tspan data-gap="" dx="1.77852"> </tspan>another<tspan data-gap="" dx="1.77852"> </tspan>group<tspan data-gap="" dx="1.77852"> </tspan>should<tspan data-gap="" dx="1.77852"> </tspan>be<tspan data-gap="" dx="1.77852"> </tspan>able<tspan data-gap="" dx="1.77852"> </tspan>to<tspan data-gap="" dx="1.77852"> </tspan>follow<tspan data-gap="" dx="1.77852"> </tspan>your<tspan data-gap="" dx="1.77852"> </tspan>rule<tspan data-gap="" dx="1.77852"> </tspan>without<tspan data-gap="" dx="1.77852"> </tspan>knowing<tspan data-gap="" dx="1.77852"> </tspan>the</tspan><tspan x="89" dy="31">plant names.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1465H915Q900 1465 892 1480L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1465H935Q920 1465 912 1480L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1499" text-anchor="middle">11</text></g></svg></div></div></section>
