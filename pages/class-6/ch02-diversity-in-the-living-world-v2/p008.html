<section class="page page--food page--science-editorial page--science-v2" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="v2-ribbon-stem" d="M31 63Q34 30 60 7"/><path class="v2-ribbon-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" transform="translate(0 0)"><text class="se-heading" x="89" y="142"><tspan x="89">2.2.1 Grouping Plants</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="197"><tspan x="89">Look<tspan data-gap="" dx="2.45970"> </tspan>at<tspan data-gap="" dx="2.45970"> </tspan>Table<tspan data-gap="" dx="2.45970"> </tspan>2.1<tspan data-gap="" dx="2.45970"> </tspan>again.<tspan data-gap="" dx="2.45970"> </tspan>The<tspan data-gap="" dx="2.45970"> </tspan>features<tspan data-gap="" dx="2.45970"> </tspan>you<tspan data-gap="" dx="2.45970"> </tspan>wrote<tspan data-gap="" dx="2.45970"> </tspan>there<tspan data-gap="" dx="2.45970"> </tspan>—<tspan data-gap="" dx="2.45970"> </tspan>stem,<tspan data-gap="" dx="2.45970"> </tspan>leaves,<tspan data-gap="" dx="2.45970"> </tspan>flowers<tspan data-gap="" dx="2.45970"> </tspan>—</tspan><tspan x="89" dy="31">are the same features we can use to sort plants.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="275"><tspan x="89">Begin<tspan data-gap="" dx="7.46983"> </tspan>with<tspan data-gap="" dx="7.46983"> </tspan>stems:<tspan data-gap="" dx="7.46983"> </tspan>their<tspan data-gap="" dx="7.46983"> </tspan>firmness,<tspan data-gap="" dx="7.46983"> </tspan>whether<tspan data-gap="" dx="7.46983"> </tspan>they<tspan data-gap="" dx="7.46983"> </tspan>are<tspan data-gap="" dx="7.46983"> </tspan>woody,<tspan data-gap="" dx="7.46983"> </tspan>and<tspan data-gap="" dx="7.46983"> </tspan>where<tspan data-gap="" dx="7.46983"> </tspan>they</tspan><tspan x="89" dy="31">branch. Examine plants your teacher says are safe to handle.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><rect class="se-activity-panel" x="89" y="330" width="874" height="513" rx="18"/><g class="v2-investigate-icon"><circle cx="128" cy="360" r="12"/><path d="M137 369l10 10"/></g><text class="se-activity-tab-text" x="160" y="369" text-anchor="start">Investigate</text><text class="se-activity-step" x="128" y="418" text-anchor="end">1.</text><text class="se-copy" x="146" y="419"><tspan x="146">Go out to the same place as before. Choose six plants of clearly different</tspan><tspan x="146" dy="32">sizes.</tspan></text><text class="se-activity-step" x="128" y="494" text-anchor="end">2.</text><text class="se-copy" x="146" y="495"><tspan x="146">Stand next to each one. Is it shorter than you, about your height, or taller?</tspan></text><text class="se-activity-step" x="128" y="538" text-anchor="end">3.</text><text class="se-copy" x="146" y="539"><tspan x="146">Look at the stem near the ground. Is it green or brown?</tspan></text><text class="se-activity-step" x="128" y="582" text-anchor="end">4.</text><text class="se-copy" x="146" y="583"><tspan x="146">Bend the stem very gently with one finger. Does it bend, or is it stiff? Stop</tspan><tspan x="146" dy="32">as soon as you feel it resist. A broken stem can kill the plant.</tspan></text><text class="se-activity-step" x="128" y="658" text-anchor="end">5.</text><text class="se-copy" x="146" y="659"><tspan x="146">See where the branches start. Near the ground, or higher up?</tspan></text><text class="se-activity-step" x="128" y="702" text-anchor="end">6.</text><text class="se-copy" x="146" y="703"><tspan x="146">Record these features using the headings in Table 2.3. Group your plants</tspan><tspan x="146" dy="32">by shared stem features and explain your rule.</tspan></text><text class="se-copy" x="113" y="779"><tspan x="113">Did height and stem features give you the same groups? Which plants were</tspan><tspan x="113" dy="32">difficult to place?</tspan></text></g>
