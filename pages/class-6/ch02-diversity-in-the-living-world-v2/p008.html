r="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-50" transform="translate(0 -80)"><image class="science-illustration" href="../../figures/class-6/science/ch02-v2/forms-v2.png" x="89" y="192" width="874" height="380" preserveAspectRatio="xMidYMid meet"/>
<text class="se-caption" x="235" y="599" text-anchor="middle">Tomato · herb</text>
<text class="se-caption" x="526" y="599" text-anchor="middle">Rose · shrub</text>
<text class="se-caption" x="817" y="599" text-anchor="middle">Mango · tree</text></g>
<g class="v2-reading-block" data-block="reading-51" transform="translate(0 -80)"><text class="v2-comparison-title" x="89" y="651"><tspan x="89">Herbs</tspan></text><text class="se-copy" x="89" y="693" text-anchor="start">•</text><text class="se-copy" x="112" y="693"><tspan x="112">Stem: soft and</tspan><tspan x="112" dy="32">non-woody.</tspan></text><text class="se-copy" x="89" y="765" text-anchor="start">•</text><text class="se-copy" x="112" y="765"><tspan x="112">Examples: mint,</tspan><tspan x="112" dy="32">coriander and tomato.</tspan></text><text class="se-copy" x="89" y="837" text-anchor="start">•</text><text class="se-copy" x="112" y="837"><tspan x="112">Many are small, but</tspan><tspan x="112" dy="32">height alone does not</tspan><tspan x="112" dy="32">define a herb.</tspan></text>
<text class="v2-comparison-title" x="391" y="651"><tspan x="391">Shrubs</tspan></text><text class="se-copy" x="391" y="693" text-anchor="start">•</text><text class="se-copy" x="414" y="693"><tspan x="414">Stem: woody, usually</tspan><tspan x="414" dy="32">with several main</tspan><tspan x="414" dy="32">stems.</tspan></text><text class="se-copy" x="391" y="797" text-anchor="start">•</text><text class="se-copy" x="414" y="797"><tspan x="414">Branches: often begin</tspan><tspan x="414" dy="32">close to the ground.</tspan></text><text class="se-copy" x="391" y="869" text-anchor="start">•</text><text class="se-copy" x="414" y="869"><tspan x="414">Example: rose. Check</tspan><tspan x="414" dy="32">branching as well as</tspan><tspan x="414" dy="32">height.</tspan></text>
<text class="v2-comparison-title" x="693" y="651"><tspan x="693">Trees</tspan></text><text class="se-copy" x="693" y="693" text-anchor="start">•</text><text class="se-copy" x="716" y="693"><tspan x="716">Stem: a woody main</tspan><tspan x="716" dy="32">trunk supports a</tspan><tspan x="716" dy="32">crown of branches.</tspan></text><text class="se-copy" x="693" y="797" text-anchor="start">•</text><text class="se-copy" x="716" y="797"><tspan x="716">Example: mango.</tspan></text><text class="se-copy" x="693" y="837" text-anchor="start">•</text><text class="se-copy" x="716" y="837"><tspan x="716">A young mango is still</tspan><tspan x="716" dy="32">a tree, even when</tspan><tspan x="716" dy="32">shorter than a mature</tspan><tspan x="716" dy="32">tomato plant.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-52" transform="translate(0 -80)"><text class="se-copy" x="89" y="995"><tspan x="89">Woody stems support branches and can thicken as a plant grows. Look at the</tspan><tspan x="89" dy="32">base of a tree and then a herb: what differences can you describe without</tspan><tspan x="89" dy="32">damaging either?</tspan></text></g>
<g class="v2-reading-block" data-block="reading-53" transform="translate(0 -80)"><rect class="se-prompt se-thought-panel" x="89" y="1083" width="874" height="248"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="1104" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="1126">Think It Through</text></g><text class="se-copy" x="113" y="1175"><tspan x="113">A young mango may be shorter than a tomato plant. Which stem and</tspan><tspan x="113" dy="32">branching features would you inspect before grouping them? A banana is a</tspan><tspan x="113" dy="32">large herb: its trunk-like <tspan class="se-bold">pseudostem</tspan> consists of tightly overlapping leaf</tspan><tspan x="113" dy="32">bases, not a woody trunk. Explain why height alone would put it in the wrong</tspan><tspan x="113" dy="32">group.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
