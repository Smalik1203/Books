<section class="page page--food page--science-editorial page--science-v2" data-folio="23"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 23"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g transform="translate(-148 3) scale(.2)"><g class="v2-ribbon__motif" transform="translate(0 0)" aria-hidden="true"><path class="v2-ribbon__stem" d="M1005 35C930 117 932 200 1018 275"/><path class="v2-ribbon__leaves" d="M994.33 47.31C1005.31 49.71 1020.98 36.37 1024 20C1011.75 25.15 996.71 35.6 994.33 47.31Z M978.05 69.47C992.62 77.79 1025.12 66.86 1041 46C1019.28 47.37 989.73 54.66 978.05 69.47Z M963.3 96.55C965.95 76.92 940.73 53.11 912 52C922.59 71.93 942.72 95.37 963.3 96.55Z M954.26 123.53C973.15 135.98 1017.32 123.91 1040 97C1010.89 97.06 970.91 104.46 954.26 123.53Z M951.06 147.92C949.72 125.2 916.83 105.4 885 112C900.96 131.44 928.18 152.21 951.06 147.92Z M953.1 174.53C970.15 189.5 1011.77 181.61 1034 156C1006.91 152.97 969.39 156.43 953.1 174.53Z M961.02 200.84C956.66 180.93 925.52 168.87 899 180C915.5 194.56 941.9 208.44 961.02 200.84Z M974.87 226.77C987.64 240.88 1022.05 237.75 1042 218C1020.2 213.13 989.44 212.87 974.87 226.77Z M990.66 247.67C986.1 232.61 959.09 222.53 937 230C951.66 241.46 974.71 252.74 990.66 247.67Z"/><path class="v2-ribbon__veins" d="M996.11 45.67Q1008.04 36.59 1021.07 23.37 M981.82 68.07Q1005.8 61.22 1034.32 49.24 M960.22 93.87Q942.89 75.49 918.23 56.22 M959.41 121.94Q991.92 114.66 1030.85 100.83 M947.1 145.76Q924.06 129.89 892.77 115.03 M957.95 173.42Q988.51 169.29 1025.32 159.01 M957.29 199.59Q935.2 189.36 906.12 181.39 M978.9 226.25Q1004.04 225.36 1034.73 219.81 M987.44 246.61Q968.2 238.21 943.12 231.28"/></g></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-173" transform="translate(0 -999)"><text class="se-copy" x="89" y="1135"><tspan x="89">Two plants of the same species grow in different places, one windy and one</tspan><tspan x="89" dy="32">sheltered. If their heights differ, what other factors would you check before</tspan><tspan x="89" dy="32">attributing the difference to wind?</tspan></text></g>
<g class="v2-reading-block" data-block="reading-174" transform="translate(0 124)"><text class="se-heading" x="89" y="142"><tspan x="89">Habitat</tspan></text></g>
<g class="v2-reading-block" data-block="reading-175" transform="translate(0 124)"><text class="se-copy" x="89" y="184"><tspan x="89">The place where a living thing lives is called its <tspan class="se-bold">habitat</tspan>.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-176" transform="translate(0 124)"><text class="se-copy" x="89" y="232"><tspan x="89">A habitat provides conditions and resources: plants need light, water and</tspan><tspan x="89" dy="32">minerals; animals need food and suitable conditions. It need not always be safe.</tspan><tspan x="89" dy="32">Animals may feed and breed in different places.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-177" transform="translate(0 124)"><text class="se-copy" x="89" y="344"><tspan x="89">Habitats can be small. Damp soil beneath a log differs from a dry path beside it,</tspan><tspan x="89" dy="32">helping explain why neighbouring places hold different living things.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-178" transform="translate(0 124)"><text class="se-copy" x="89" y="424"><tspan x="89">On a simple map of your observation area, mark a water source, a shaded patch</tspan><tspan x="89" dy="32">and open ground. Add the positions where living things were seen. The map may</tspan></text></g>
<g class="v2-reading-block" data-block="reading-179" transform="translate(0 124)"><text class="se-copy" x="89" y="488"><tspan x="89">suggest questions about shelter, moisture or food. It cannot show a preference</tspan><tspan x="89" dy="32">from one sighting, but it helps you choose places to observe again.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-180" transform="translate(0 124)"><text class="se-copy" x="89" y="568"><tspan x="89">Habitats can be sorted into two broad kinds.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-181" transform="translate(0 124)"><text class="v2-comparison-title" x="89" y="622"><tspan x="89">Terrestrial habitats</tspan></text><text class="se-copy" x="89" y="664" text-anchor="start">•</text><text class="se-copy" x="112" y="664"><tspan x="112">Where: on land, including the</tspan><tspan x="112" dy="32">ground beneath your feet.</tspan></text><text class="se-copy" x="89" y="736" text-anchor="start">•</text><text class="se-copy" x="112" y="736"><tspan x="112">Examples: forests, deserts,</tspan><tspan x="112" dy="32">grasslands and mountains.</tspan></text>
<text class="v2-comparison-title" x="542" y="622"><tspan x="542">Aquatic habitats</tspan></text><text class="se-copy" x="542" y="664" text-anchor="start">•</text><text class="se-copy" x="565" y="664"><tspan x="565">Where: in water.</tspan></text><text class="se-copy" x="542" y="704" text-anchor="start">•</text><text class="se-copy" x="565" y="704"><tspan x="565">Examples: ponds, lakes, rivers and</tspan><tspan x="565" dy="32">oceans.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-182" transform="translate(0 124)"><text class="se-copy" x="89" y="830"><tspan x="89">Some animals use both land and water. Frogs belong to a group called</tspan><tspan x="89" dy="32"><tspan class="se-bold">amphibians</tspan>; many amphibians spend part of their lives in each. But using both</tspan></text></g>
<g class="v2-reading-block" data-block="reading-183" transform="translate(0 124)"><text class="se-copy" x="89" y="894"><tspan x="89">habitats does not make every animal an amphibian. A crocodile does so too, and</tspan><tspan x="89" dy="32">it is a reptile.</tspan></text></g>
<g class="v2-reading-block" data-block="source-24-8" transform="translate(0 136)"><text class="se-heading" x="89" y="980"><tspan x="89">Know a scientist</tspan></text></g>
<g class="v2-reading-block" data-block="reading-185" transform="translate(0 136)"><text class="se-copy" x="89" y="1036"><tspan x="89">Salim Ali (1896–1987) spent many years travelling across India, watching birds.</tspan><tspan x="89" dy="32">He recorded where they lived, when they arrived, and where they went next.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-186" transform="translate(0 136)"><text class="se-copy" x="89" y="1100"><tspan x="89">Watching carefully like this, year after year, is how scattered sightings turn into</tspan><tspan x="89" dy="32">real knowledge. His fieldwork and advocacy helped strengthen bird conservation</tspan></text></g>
<g class="v2-reading-block" data-block="reading-187" transform="translate(0 136)"><text class="se-copy" x="89" y="1164"><tspan x="89">in India. His books also made it possible for ordinary people to name the birds</tspan><tspan x="89" dy="32">around them. He is remembered as the Birdman of India.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">23</text></g></svg></div></div></section>
