<section class="page page--food page--science-editorial page--science-v2" data-folio="24"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 24"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="v2-ribbon-stem" d="M31 63Q34 30 60 7"/><path class="v2-ribbon-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" transform="translate(0 0)"><text class="se-heading" x="89" y="142"><tspan x="89">Habitat</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="197"><tspan x="89">The place where a living thing lives is called its <tspan class="se-bold">habitat</tspan>.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="243"><tspan x="89">A<tspan data-gap="" dx="3.50874"> </tspan>habitat<tspan data-gap="" dx="3.50874"> </tspan>includes<tspan data-gap="" dx="3.50874"> </tspan>the<tspan data-gap="" dx="3.50874"> </tspan>conditions<tspan data-gap="" dx="3.50874"> </tspan>and<tspan data-gap="" dx="3.50874"> </tspan>resources<tspan data-gap="" dx="3.50874"> </tspan>an<tspan data-gap="" dx="3.50874"> </tspan>organism<tspan data-gap="" dx="3.50874"> </tspan>uses.<tspan data-gap="" dx="3.50874"> </tspan>Plants<tspan data-gap="" dx="3.50874"> </tspan>need</tspan><tspan x="89" dy="31">light,<tspan data-gap="" dx="4.33853"> </tspan>water<tspan data-gap="" dx="4.33853"> </tspan>and<tspan data-gap="" dx="4.33853"> </tspan>minerals;<tspan data-gap="" dx="4.33853"> </tspan>animals<tspan data-gap="" dx="4.33853"> </tspan>need<tspan data-gap="" dx="4.33853"> </tspan>food<tspan data-gap="" dx="4.33853"> </tspan>as<tspan data-gap="" dx="4.33853"> </tspan>well<tspan data-gap="" dx="4.33853"> </tspan>as<tspan data-gap="" dx="4.33853"> </tspan>suitable<tspan data-gap="" dx="4.33853"> </tspan>conditions.<tspan data-gap="" dx="4.33853"> </tspan>A</tspan><tspan x="89" dy="31">habitat<tspan data-gap="" dx="2.66415"> </tspan>need<tspan data-gap="" dx="2.66415"> </tspan>not<tspan data-gap="" dx="2.66415"> </tspan>be<tspan data-gap="" dx="2.66415"> </tspan>safe<tspan data-gap="" dx="2.66415"> </tspan>at<tspan data-gap="" dx="2.66415"> </tspan>all<tspan data-gap="" dx="2.66415"> </tspan>times,<tspan data-gap="" dx="2.66415"> </tspan>and<tspan data-gap="" dx="2.66415"> </tspan>an<tspan data-gap="" dx="2.66415"> </tspan>animal<tspan data-gap="" dx="2.66415"> </tspan>may<tspan data-gap="" dx="2.66415"> </tspan>use<tspan data-gap="" dx="2.66415"> </tspan>different<tspan data-gap="" dx="2.66415"> </tspan>places<tspan data-gap="" dx="2.66415"> </tspan>to</tspan><tspan x="89" dy="31">feed or breed.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="385"><tspan x="89">A<tspan data-gap="" dx="2.31365"> </tspan>habitat<tspan data-gap="" dx="2.31365"> </tspan>can<tspan data-gap="" dx="2.31365"> </tspan>be<tspan data-gap="" dx="2.31365"> </tspan>small:<tspan data-gap="" dx="2.31365"> </tspan>damp<tspan data-gap="" dx="2.31365"> </tspan>soil<tspan data-gap="" dx="2.31365"> </tspan>beneath<tspan data-gap="" dx="2.31365"> </tspan>a<tspan data-gap="" dx="2.31365"> </tspan>fallen<tspan data-gap="" dx="2.31365"> </tspan>log<tspan data-gap="" dx="2.31365"> </tspan>differs<tspan data-gap="" dx="2.31365"> </tspan>from<tspan data-gap="" dx="2.31365"> </tspan>the<tspan data-gap="" dx="2.31365"> </tspan>dry<tspan data-gap="" dx="2.31365"> </tspan>path</tspan><tspan x="89" dy="31">beside<tspan data-gap="" dx="5.26692"> </tspan>it.<tspan data-gap="" dx="5.26692"> </tspan>Such<tspan data-gap="" dx="5.26692"> </tspan>differences<tspan data-gap="" dx="5.26692"> </tspan>help<tspan data-gap="" dx="5.26692"> </tspan>explain<tspan data-gap="" dx="5.26692"> </tspan>why<tspan data-gap="" dx="5.26692"> </tspan>nearby<tspan data-gap="" dx="5.26692"> </tspan>places<tspan data-gap="" dx="5.26692"> </tspan>can<tspan data-gap="" dx="5.26692"> </tspan>hold<tspan data-gap="" dx="5.26692"> </tspan>different</tspan><tspan x="89" dy="31">living things.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="495"><tspan x="89">Habitats can be sorted into two broad kinds.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="541"><tspan x="89">Living<tspan data-gap="" dx="1.42299"> </tspan>things<tspan data-gap="" dx="1.42299"> </tspan>on<tspan data-gap="" dx="1.42299"> </tspan>land<tspan data-gap="" dx="1.42299"> </tspan>live<tspan data-gap="" dx="1.42299"> </tspan>in<tspan data-gap="" dx="1.42299"> </tspan><tspan class="se-bold">terrestrial</tspan><tspan data-gap="" dx="1.42299"> </tspan>habitats.<tspan data-gap="" dx="1.42299"> </tspan>Forests,<tspan data-gap="" dx="1.42299"> </tspan>deserts,<tspan data-gap="" dx="1.42299"> </tspan>grasslands<tspan data-gap="" dx="1.42299"> </tspan>and</tspan><tspan x="89" dy="31">mountains are terrestrial habitats. So is the ground under your feet.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="619"><tspan x="89">Living<tspan data-gap="" dx="0.60268"> </tspan>things<tspan data-gap="" dx="0.60268"> </tspan>in<tspan data-gap="" dx="0.60268"> </tspan>water<tspan data-gap="" dx="0.60268"> </tspan>live<tspan data-gap="" dx="0.60268"> </tspan>in<tspan data-gap="" dx="0.60268"> </tspan><tspan class="se-bold">aquatic</tspan><tspan data-gap="" dx="0.60268"> </tspan>habitats.<tspan data-gap="" dx="0.60268"> </tspan>Ponds,<tspan data-gap="" dx="0.60268"> </tspan>lakes,<tspan data-gap="" dx="0.60268"> </tspan>rivers<tspan data-gap="" dx="0.60268"> </tspan>and<tspan data-gap="" dx="0.60268"> </tspan>oceans<tspan data-gap="" dx="0.60268"> </tspan>are</tspan><tspan x="89" dy="31">aquatic habitats.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="697"><tspan x="89">Some<tspan data-gap="" dx="10.84781"> </tspan>animals<tspan data-gap="" dx="10.84781"> </tspan>use<tspan data-gap="" dx="10.84781"> </tspan>both<tspan data-gap="" dx="10.84781"> </tspan>land<tspan data-gap="" dx="10.84781"> </tspan>and<tspan data-gap="" dx="10.84781"> </tspan>water.<tspan data-gap="" dx="10.84781"> </tspan>Frogs<tspan data-gap="" dx="10.84781"> </tspan>belong<tspan data-gap="" dx="10.84781"> </tspan>to<tspan data-gap="" dx="10.84781"> </tspan>a<tspan data-gap="" dx="10.84781"> </tspan>group<tspan data-gap="" dx="10.84781"> </tspan>called</tspan><tspan x="89" dy="31"><tspan class="se-bold">amphibians</tspan>;<tspan data-gap="" dx="2.29373"> </tspan>many<tspan data-gap="" dx="2.29373"> </tspan>amphibians<tspan data-gap="" dx="2.29373"> </tspan>spend<tspan data-gap="" dx="2.29373"> </tspan>part<tspan data-gap="" dx="2.29373"> </tspan>of<tspan data-gap="" dx="2.29373"> </tspan>their<tspan data-gap="" dx="2.29373"> </tspan>lives<tspan data-gap="" dx="2.29373"> </tspan>in<tspan data-gap="" dx="2.29373"> </tspan>each.<tspan data-gap="" dx="2.29373"> </tspan>But<tspan data-gap="" dx="2.29373"> </tspan>using<tspan data-gap="" dx="2.29373"> </tspan>both</tspan><tspan x="89" dy="31">habitats<tspan data-gap="" dx="1.35098"> </tspan>does<tspan data-gap="" dx="1.35098"> </tspan>not<tspan data-gap="" dx="1.35098"> </tspan>make<tspan data-gap="" dx="1.35098"> </tspan>every<tspan data-gap="" dx="1.35098"> </tspan>animal<tspan data-gap="" dx="1.35098"> </tspan>an<tspan data-gap="" dx="1.35098"> </tspan>amphibian.<tspan data-gap="" dx="1.35098"> </tspan>A<tspan data-gap="" dx="1.35098"> </tspan>crocodile<tspan data-gap="" dx="1.35098"> </tspan>does<tspan data-gap="" dx="1.35098"> </tspan>so<tspan data-gap="" dx="1.35098"> </tspan>too,<tspan data-gap="" dx="1.35098"> </tspan>and</tspan><tspan x="89" dy="31">it is a reptile.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-heading" x="89" y="846"><tspan x="89">Know a scientist</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="901"><tspan x="89">Salim<tspan data-gap="" dx="3.57704"> </tspan>Ali<tspan data-gap="" dx="3.57704"> </tspan>(1896–1987)<tspan data-gap="" dx="3.57704"> </tspan>spent<tspan data-gap="" dx="3.57704"> </tspan>many<tspan data-gap="" dx="3.57704"> </tspan>years<tspan data-gap="" dx="3.57704"> </tspan>travelling<tspan data-gap="" dx="3.57704"> </tspan>across<tspan data-gap="" dx="3.57704"> </tspan>India,<tspan data-gap="" dx="3.57704"> </tspan>watching<tspan data-gap="" dx="3.57704"> </tspan>birds.</tspan><tspan x="89" dy="31">He<tspan data-gap="" dx="4.87929"> </tspan>recorded<tspan data-gap="" dx="4.87929"> </tspan>where<tspan data-gap="" dx="4.87929"> </tspan>they<tspan data-gap="" dx="4.87929"> </tspan>lived,<tspan data-gap="" dx="4.87929"> </tspan>when<tspan data-gap="" dx="4.87929"> </tspan>they<tspan data-gap="" dx="4.87929"> </tspan>arrived,<tspan data-gap="" dx="4.87929"> </tspan>and<tspan data-gap="" dx="4.87929"> </tspan>where<tspan data-gap="" dx="4.87929"> </tspan>they<tspan data-gap="" dx="4.87929"> </tspan>went<tspan data-gap="" dx="4.87929"> </tspan>next.</tspan><tspan x="89" dy="31">Watching<tspan data-gap="" dx="2.60292"> </tspan>carefully<tspan data-gap="" dx="2.60292"> </tspan>like<tspan data-gap="" dx="2.60292"> </tspan>this,<tspan data-gap="" dx="2.60292"> </tspan>year<tspan data-gap="" dx="2.60292"> </tspan>after<tspan data-gap="" dx="2.60292"> </tspan>year,<tspan data-gap="" dx="2.60292"> </tspan>is<tspan data-gap="" dx="2.60292"> </tspan>how<tspan data-gap="" dx="2.60292"> </tspan>scattered<tspan data-gap="" dx="2.60292"> </tspan>sightings<tspan data-gap="" dx="2.60292"> </tspan>turn<tspan data-gap="" dx="2.60292"> </tspan>into</tspan><tspan x="89" dy="31">real<tspan data-gap="" dx="1.18787"> </tspan>knowledge.<tspan data-gap="" dx="1.18787"> </tspan>His<tspan data-gap="" dx="1.18787"> </tspan>fieldwork<tspan data-gap="" dx="1.18787"> </tspan>and<tspan data-gap="" dx="1.18787"> </tspan>advocacy<tspan data-gap="" dx="1.18787"> </tspan>helped<tspan data-gap="" dx="1.18787"> </tspan>strengthen<tspan data-gap="" dx="1.18787"> </tspan>bird<tspan data-gap="" dx="1.18787"> </tspan>conservation</tspan><tspan x="89" dy="31">in<tspan data-gap="" dx="2.65529"> </tspan>India.<tspan data-gap="" dx="2.65529"> </tspan>His<tspan data-gap="" dx="2.65529"> </tspan>books<tspan data-gap="" dx="2.65529"> </tspan>also<tspan data-gap="" dx="2.65529"> </tspan>made<tspan data-gap="" dx="2.65529"> </tspan>it<tspan data-gap="" dx="2.65529"> </tspan>possible<tspan data-gap="" dx="2.65529"> </tspan>for<tspan data-gap="" dx="2.65529"> </tspan>ordinary<tspan data-gap="" dx="2.65529"> </tspan>people<tspan data-gap="" dx="2.65529"> </tspan>to<tspan data-gap="" dx="2.65529"> </tspan>name<tspan data-gap="" dx="2.65529"> </tspan>the<tspan data-gap="" dx="2.65529"> </tspan>birds</tspan><tspan x="89" dy="31">around them. He is remembered as the Birdman of India.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 972)"><text class="se-heading" x="89" y="142"><tspan x="89">When a Habitat Is Lost</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 972)"><text class="se-copy" data-measure="874" x="89" y="198"><tspan x="89">Ask<tspan data-gap="" dx="0.84195"> </tspan>your<tspan data-gap="" dx="0.84195"> </tspan>parents,<tspan data-gap="" dx="0.84195"> </tspan>your<tspan data-gap="" dx="0.84195"> </tspan>grandparents,<tspan data-gap="" dx="0.84195"> </tspan>or<tspan data-gap="" dx="0.84195"> </tspan>an<tspan data-gap="" dx="0.84195"> </tspan>older<tspan data-gap="" dx="0.84195"> </tspan>neighbour<tspan data-gap="" dx="0.84195"> </tspan>one<tspan data-gap="" dx="0.84195"> </tspan>simple<tspan data-gap="" dx="0.84195"> </tspan>question.</tspan><tspan x="89" dy="32">Which birds, insects or plants did they see often as children, but rarely see now?</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 972)"><text class="se-copy" data-measure="874" x="89" y="280"><tspan x="89">Record<tspan data-gap="" dx="2.46145"> </tspan>what<tspan data-gap="" dx="2.46145"> </tspan>the<tspan data-gap="" dx="2.46145"> </tspan>person<tspan data-gap="" dx="2.46145"> </tspan>remembers<tspan data-gap="" dx="2.46145"> </tspan>and<tspan data-gap="" dx="2.46145"> </tspan>where<tspan data-gap="" dx="2.46145"> </tspan>they<tspan data-gap="" dx="2.46145"> </tspan>lived.<tspan data-gap="" dx="2.46145"> </tspan>Memory<tspan data-gap="" dx="2.46145"> </tspan>is<tspan data-gap="" dx="2.46145"> </tspan>a<tspan data-gap="" dx="2.46145"> </tspan>starting</tspan><tspan x="89" dy="32">point<tspan data-gap="" dx="1.46693"> </tspan>for<tspan data-gap="" dx="1.46693"> </tspan>a<tspan data-gap="" dx="1.46693"> </tspan>question,<tspan data-gap="" dx="1.46693"> </tspan>not<tspan data-gap="" dx="1.46693"> </tspan>proof<tspan data-gap="" dx="1.46693"> </tspan>of<tspan data-gap="" dx="1.46693"> </tspan>a<tspan data-gap="" dx="1.46693"> </tspan>change<tspan data-gap="" dx="1.46693"> </tspan>in<tspan data-gap="" dx="1.46693"> </tspan>population.<tspan data-gap="" dx="1.46693"> </tspan>Look<tspan data-gap="" dx="1.46693"> </tspan>for<tspan data-gap="" dx="1.46693"> </tspan>dated<tspan data-gap="" dx="1.46693"> </tspan>records</tspan><tspan x="89" dy="32">or photographs to compare.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1465H137Q152 1465 160 1480L179 1514H0Z"/><path class="v2-ribbon" d="M0 1465H117Q132 1465 140 1480L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1499" text-anchor="middle">24</text></g></svg></div></div></section>
