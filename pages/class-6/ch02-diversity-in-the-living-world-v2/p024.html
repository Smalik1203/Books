<section class="page page--food page--science-editorial page--science-v2" data-folio="24"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 24"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g transform="translate(-148 3) scale(.2)"><g class="v2-ribbon__motif" transform="translate(0 0)" aria-hidden="true"><path class="v2-ribbon__stem" d="M1005 35C930 117 932 200 1018 275"/><path class="v2-ribbon__leaves" d="M994.33 47.31C1005.31 49.71 1020.98 36.37 1024 20C1011.75 25.15 996.71 35.6 994.33 47.31Z M978.05 69.47C992.62 77.79 1025.12 66.86 1041 46C1019.28 47.37 989.73 54.66 978.05 69.47Z M963.3 96.55C965.95 76.92 940.73 53.11 912 52C922.59 71.93 942.72 95.37 963.3 96.55Z M954.26 123.53C973.15 135.98 1017.32 123.91 1040 97C1010.89 97.06 970.91 104.46 954.26 123.53Z M951.06 147.92C949.72 125.2 916.83 105.4 885 112C900.96 131.44 928.18 152.21 951.06 147.92Z M953.1 174.53C970.15 189.5 1011.77 181.61 1034 156C1006.91 152.97 969.39 156.43 953.1 174.53Z M961.02 200.84C956.66 180.93 925.52 168.87 899 180C915.5 194.56 941.9 208.44 961.02 200.84Z M974.87 226.77C987.64 240.88 1022.05 237.75 1042 218C1020.2 213.13 989.44 212.87 974.87 226.77Z M990.66 247.67C986.1 232.61 959.09 222.53 937 230C951.66 241.46 974.71 252.74 990.66 247.67Z"/><path class="v2-ribbon__veins" d="M996.11 45.67Q1008.04 36.59 1021.07 23.37 M981.82 68.07Q1005.8 61.22 1034.32 49.24 M960.22 93.87Q942.89 75.49 918.23 56.22 M959.41 121.94Q991.92 114.66 1030.85 100.83 M947.1 145.76Q924.06 129.89 892.77 115.03 M957.95 173.42Q988.51 169.29 1025.32 159.01 M957.29 199.59Q935.2 189.36 906.12 181.39 M978.9 226.25Q1004.04 225.36 1034.73 219.81 M987.44 246.61Q968.2 238.21 943.12 231.28"/></g></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-188" transform="translate(0 0)"><text class="se-heading" x="89" y="142"><tspan x="89">When a Habitat Is Lost</tspan></text></g>
<g class="v2-reading-block" data-block="reading-189" transform="translate(0 0)"><text class="se-copy" x="89" y="184"><tspan x="89">Ask your parents, your grandparents, or an older neighbour one simple question.</tspan><tspan x="89" dy="32">Which birds, insects or plants did they see often as children, but rarely see now?</tspan></text></g>
<g class="v2-reading-block" data-block="reading-190" transform="translate(0 0)"><text class="se-copy" x="89" y="264"><tspan x="89">Record what the person remembers and where they lived. Memory is a starting</tspan><tspan x="89" dy="32">point for a question, not proof of a change in population. Look for dated records</tspan><tspan x="89" dy="32">or photographs to compare.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-191" transform="translate(0 0)"><text class="se-copy" x="89" y="376"><tspan x="89">Habitat damage can reduce food, shelter or breeding sites. Some organisms may</tspan><tspan x="89" dy="32">move; others may not be able to reach suitable places. Populations can decline or</tspan></text></g>
<g class="v2-reading-block" data-block="reading-192" transform="translate(0 0)"><text class="se-copy" x="89" y="440"><tspan x="89">disappear locally. To investigate a decline, check both changes in habitat and how</tspan><tspan x="89" dy="32">the observations were made.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-193" transform="translate(0 0)"><text class="se-copy" x="89" y="520"><tspan x="89">Habitat loss has threatened animals such as the Bengal tiger and the Great Indian</tspan><tspan x="89" dy="32">bustard. Project Tiger began in 1973 to protect tigers and their habitats. The</tspan></text></g>
<g class="v2-reading-block" data-block="reading-194" transform="translate(0 0)"><text class="se-copy" x="89" y="584"><tspan x="89">cheetah was declared extinct in India in 1952; a reintroduction programme began</tspan><tspan x="89" dy="32">in 2022. Protecting suitable habitat is essential to conservation.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-195" transform="translate(0 0)"><image class="science-illustration" href="../../figures/class-6/science/ch02-v2/grove.png" x="89" y="640" width="414" height="276" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="296" y="941" text-anchor="middle">A sacred grove</text>
<text class="se-copy" x="542" y="664"><tspan x="542">Governments and communities both</tspan><tspan x="542" dy="32">protect habitats. <tspan class="se-bold">Sacred</tspan> groves are</tspan></text>
<text class="se-copy" x="542" y="728"><tspan x="542">patches of vegetation protected</tspan><tspan x="542" dy="32">through local cultural or religious</tspan></text>
<text class="se-copy" x="542" y="792"><tspan x="542">traditions. Rules about cutting,</tspan><tspan x="542" dy="32">collecting and hunting vary. Some</tspan></text>
<text class="se-copy" x="542" y="856"><tspan x="542">groves preserve old trees and habitat</tspan><tspan x="542" dy="32">missing from nearby cleared land.</tspan></text>
<text class="se-copy" x="542" y="920"><tspan x="542">Some also have legal protection. Find</tspan><tspan x="542" dy="32">out how a grove near you is protected.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-196" transform="translate(0 0)"><rect class="se-prompt se-thought-panel" x="89" y="976" width="874" height="248"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="997" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="1019">Think It Through</text></g><text class="se-copy" x="113" y="1068"><tspan x="113">A class records more kinds of birds in a protected grove than in a clearing.</tspan><tspan x="113" dy="32">Does this alone show that protection caused the difference? Compare area,</tspan><tspan x="113" dy="32">water and vegetation, and use equal observation times at similar times of</tspan><tspan x="113" dy="32">day. Plan repeated visits using the same method. What would you record so</tspan><tspan x="113" dy="32">another class could check your comparison?</tspan></text></g>
<g class="v2-reading-block" data-block="reading-197" transform="translate(0 0)"><text class="se-copy" x="89" y="1268"><tspan x="89">A useful conclusion must account for both the evidence and its limits.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">24</text></g></svg></div></div></section>
