<section class="page page--food page--science-editorial page--science-v2" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="v2-ribbon-stem" d="M31 63Q34 30 60 7"/><path class="v2-ribbon-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="136"><tspan x="89">Compare<tspan data-gap="" dx="5.97365"> </tspan>your<tspan data-gap="" dx="5.97365"> </tspan>prints<tspan data-gap="" dx="5.97365"> </tspan>with<tspan data-gap="" dx="5.97365"> </tspan>these<tspan data-gap="" dx="5.97365"> </tspan>examples.<tspan data-gap="" dx="5.97365"> </tspan>Two<tspan data-gap="" dx="5.97365"> </tspan>common<tspan data-gap="" dx="5.97365"> </tspan>patterns<tspan data-gap="" dx="5.97365"> </tspan>are<tspan data-gap="" dx="5.97365"> </tspan>shown</tspan><tspan x="89" dy="32">here; your sample may contain only one.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><image class="science-illustration" href="../../figures/class-6/science/ch02-v2/veins.png" x="89" y="194" width="874" height="437" preserveAspectRatio="xMidYMid meet"/>
<text class="se-caption" x="235" y="658" text-anchor="middle">Hibiscus</text>
<text class="se-caption" x="526" y="658" text-anchor="middle">Banana</text>
<text class="se-caption" x="817" y="658" text-anchor="middle">Grass</text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" x="89" y="708"><tspan x="89">In <tspan class="se-bold">reticulate</tspan> <tspan class="se-bold">venation</tspan>, veins branch</tspan><tspan x="89" dy="32">to form a net. A thick middle vein is</tspan><tspan x="89" dy="32">visible in the hibiscus leaf; finer veins</tspan><tspan x="89" dy="32">branch and join around it. Mango,</tspan><tspan x="89" dy="32">neem and peepal also have net-like</tspan><tspan x="89" dy="32">venation.</tspan></text>
<text class="se-copy" x="542" y="708"><tspan x="542">In other leaves, many veins run</tspan><tspan x="542" dy="32">alongside one another. This pattern is</tspan><tspan x="542" dy="32">called <tspan class="se-bold">parallel</tspan> <tspan class="se-bold">venation</tspan>. In a grass</tspan><tspan x="542" dy="32">blade they run along the length of the</tspan><tspan x="542" dy="32">leaf. A banana leaf has a strong middle</tspan><tspan x="542" dy="32">vein, with many parallel side veins</tspan><tspan x="542" dy="32">running out towards its edges. Parallel</tspan><tspan x="542" dy="32">venation does not mean that a leaf has</tspan><tspan x="542" dy="32">no middle vein.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><line class="v2-rule" x1="89" x2="963" y1="1000" y2="1000"/></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="1048"><tspan x="89">These<tspan data-gap="" dx="6.26827"> </tspan>two<tspan data-gap="" dx="6.26827"> </tspan>patterns<tspan data-gap="" dx="6.26827"> </tspan>help<tspan data-gap="" dx="6.26827"> </tspan>you<tspan data-gap="" dx="6.26827"> </tspan>compare<tspan data-gap="" dx="6.26827"> </tspan>many<tspan data-gap="" dx="6.26827"> </tspan>of<tspan data-gap="" dx="6.26827"> </tspan>the<tspan data-gap="" dx="6.26827"> </tspan>leaves<tspan data-gap="" dx="6.26827"> </tspan>around<tspan data-gap="" dx="6.26827"> </tspan>you.<tspan data-gap="" dx="6.26827"> </tspan>Look</tspan><tspan x="89" dy="32">closely: real leaves sometimes show exceptions.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="1130"><tspan x="89">Predict<tspan data-gap="" dx="0.86310"> </tspan>the<tspan data-gap="" dx="0.86310"> </tspan>venation<tspan data-gap="" dx="0.86310"> </tspan>of<tspan data-gap="" dx="0.86310"> </tspan>wheat<tspan data-gap="" dx="0.86310"> </tspan>or<tspan data-gap="" dx="0.86310"> </tspan>maize<tspan data-gap="" dx="0.86310"> </tspan>from<tspan data-gap="" dx="0.86310"> </tspan>the<tspan data-gap="" dx="0.86310"> </tspan>examples.<tspan data-gap="" dx="0.86310"> </tspan>Then<tspan data-gap="" dx="0.86310"> </tspan>inspect<tspan data-gap="" dx="0.86310"> </tspan>a<tspan data-gap="" dx="0.86310"> </tspan>leaf<tspan data-gap="" dx="0.86310"> </tspan>or</tspan><tspan x="89" dy="32">a<tspan data-gap="" dx="0.26148"> </tspan>clear<tspan data-gap="" dx="0.26148"> </tspan>photograph.<tspan data-gap="" dx="0.26148"> </tspan>Was<tspan data-gap="" dx="0.26148"> </tspan>your<tspan data-gap="" dx="0.26148"> </tspan>prediction<tspan data-gap="" dx="0.26148"> </tspan>supported?<tspan data-gap="" dx="0.26148"> </tspan>Leaf<tspan data-gap="" dx="0.26148"> </tspan>shape<tspan data-gap="" dx="0.26148"> </tspan>alone<tspan data-gap="" dx="0.26148"> </tspan>is<tspan data-gap="" dx="0.26148"> </tspan>not<tspan data-gap="" dx="0.26148"> </tspan>proof</tspan><tspan x="89" dy="32">of its vein pattern.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1465H137Q152 1465 160 1480L179 1514H0Z"/><path class="v2-ribbon" d="M0 1465H117Q132 1465 140 1480L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1499" text-anchor="middle">12</text></g></svg></div></div></section>
