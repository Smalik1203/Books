<section class="page page--food page--science-editorial page--science-v2" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g transform="translate(-148 3) scale(.2)"><g class="v2-ribbon__motif" transform="translate(0 0)" aria-hidden="true"><path class="v2-ribbon__stem" d="M1005 35C930 117 932 200 1018 275"/><path class="v2-ribbon__leaves" d="M994.33 47.31C1005.31 49.71 1020.98 36.37 1024 20C1011.75 25.15 996.71 35.6 994.33 47.31Z M978.05 69.47C992.62 77.79 1025.12 66.86 1041 46C1019.28 47.37 989.73 54.66 978.05 69.47Z M963.3 96.55C965.95 76.92 940.73 53.11 912 52C922.59 71.93 942.72 95.37 963.3 96.55Z M954.26 123.53C973.15 135.98 1017.32 123.91 1040 97C1010.89 97.06 970.91 104.46 954.26 123.53Z M951.06 147.92C949.72 125.2 916.83 105.4 885 112C900.96 131.44 928.18 152.21 951.06 147.92Z M953.1 174.53C970.15 189.5 1011.77 181.61 1034 156C1006.91 152.97 969.39 156.43 953.1 174.53Z M961.02 200.84C956.66 180.93 925.52 168.87 899 180C915.5 194.56 941.9 208.44 961.02 200.84Z M974.87 226.77C987.64 240.88 1022.05 237.75 1042 218C1020.2 213.13 989.44 212.87 974.87 226.77Z M990.66 247.67C986.1 232.61 959.09 222.53 937 230C951.66 241.46 974.71 252.74 990.66 247.67Z"/><path class="v2-ribbon__veins" d="M996.11 45.67Q1008.04 36.59 1021.07 23.37 M981.82 68.07Q1005.8 61.22 1034.32 49.24 M960.22 93.87Q942.89 75.49 918.23 56.22 M959.41 121.94Q991.92 114.66 1030.85 100.83 M947.1 145.76Q924.06 129.89 892.77 115.03 M957.95 173.42Q988.51 169.29 1025.32 159.01 M957.29 199.59Q935.2 189.36 906.12 181.39 M978.9 226.25Q1004.04 225.36 1034.73 219.81 M987.44 246.61Q968.2 238.21 943.12 231.28"/></g></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-79" transform="translate(0 -1173)"><text class="se-copy" x="89" y="1309"><tspan x="89">Leaves are only part of the comparison. Next, examine roots.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-80" transform="translate(0 60)"><text class="se-heading" x="89" y="142"><tspan x="89">Under the Ground</tspan></text></g>
<g class="v2-reading-block" data-block="reading-81" transform="translate(0 60)"><text class="se-copy" x="89" y="184"><tspan x="89">Roots hold plants in place and take up water and dissolved minerals. You can</tspan><tspan x="89" dy="32">observe their growth as seeds germinate.</tspan></text></g>
<g class="v2-reading-block" data-block="source-13-2" transform="translate(0 60)"><rect class="se-activity-panel" x="89" y="240" width="874" height="649" rx="18"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="261" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="283">Investigate</text></g><image class="science-illustration" href="../../figures/class-6/science/ch02-v2/root-setup-v2.png" x="648" y="297" width="285" height="190" preserveAspectRatio="xMidYMid meet"/><text class="se-copy" x="113" y="329"><tspan x="113">You will need: chana (chickpea) and wheat</tspan><tspan x="113" dy="32">seeds, two shallow trays or plates, cotton cloth</tspan><tspan x="113" dy="32">or wool, water.</tspan></text><text class="se-activity-step" x="128" y="508" text-anchor="end">1.</text><text class="se-copy" x="146" y="509"><tspan x="146">Soak both kinds of seed in water overnight.</tspan></text><text class="se-activity-step" x="128" y="552" text-anchor="end">2.</text><text class="se-copy" x="146" y="553"><tspan x="146">Line each tray with wet cloth; put chana in one and wheat in the other.</tspan></text><text class="se-activity-step" x="128" y="596" text-anchor="end">3.</text><text class="se-copy" x="146" y="597"><tspan x="146">Keep trays together. Keep cloth damp, not flooded; check each morning</tspan><tspan x="146" dy="32">for six days.</tspan></text><text class="se-activity-step" x="128" y="672" text-anchor="end">4.</text><text class="se-copy" x="146" y="673"><tspan x="146">From day three, inspect daily. Record germination dates and sketch roots</tspan><tspan x="146" dy="32">without tearing them.</tspan></text><text class="se-activity-step" x="128" y="748" text-anchor="end">5.</text><text class="se-copy" x="146" y="749"><tspan x="146">On day six, compare several of each kind. Watch late germinators for a</tspan><tspan x="146" dy="32">few more days. Examine gently; do not pull roots from the cloth.</tspan></text><text class="se-copy" x="113" y="825"><tspan x="113">Draw what grew from each kind of seed in your notebook. Use the same scale</tspan><tspan x="113" dy="32">for both drawings.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-83" transform="translate(0 60)"><text class="se-copy" x="89" y="947"><tspan x="89">Could drawings alone tell you which plant is harder to pull out? What would you</tspan><tspan x="89" dy="32">need to keep alike in a comparison of root anchorage?</tspan></text></g>
<g class="v2-reading-block" data-block="reading-84" transform="translate(0 60)"><text class="se-copy" x="89" y="1027"><tspan x="89">Label each seedling and date each sketch to follow the same plant through time.</tspan><tspan x="89" dy="32">Otherwise, differences between plants might look like changes in one. Place a</tspan><tspan x="89" dy="32">ruler beside it without disturbing the roots and include a scale.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-85" transform="translate(0 60)"><text class="se-copy" x="89" y="1139"><tspan x="89">Record age from germination as well as the date. On Friday, seeds that</tspan><tspan x="89" dy="32">germinated on Monday and Thursday are at different stages. Compare</tspan><tspan x="89" dy="32">similar-aged seedlings before attributing a difference to the kind of plant.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
