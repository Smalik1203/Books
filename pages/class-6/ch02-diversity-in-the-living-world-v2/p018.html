hor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-127" transform="translate(0 -1176)"><text class="se-copy" x="89" y="1312"><tspan x="89">For example, a pigeon might walk along a wall, pause, then fly away. Record the</tspan><tspan x="89" dy="32">actions in order and name the body parts used for each moving stage. The pause</tspan></text></g>
<g class="v2-reading-block" data-block="reading-128" transform="translate(0 -1176)"><text class="se-copy" x="89" y="1376"><tspan x="89">is part of your observation too, but it does not show how the bird moves.</tspan><tspan x="89" dy="32">Separate what happened from what the animal might be able to do.</tspan></text></g>
<g class="v2-reading-block" data-block="source-18-4" transform="translate(0 -1176)"><rect class="se-activity-panel" x="89" y="1432" width="874" height="317" rx="18"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="1453" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="1475">Investigate</text></g><text class="se-activity-step" x="128" y="1520" text-anchor="end">1.</text><text class="se-copy" x="146" y="1521"><tspan x="146">Safely watch four animals, directly or in a reliable video. Include one that</tspan><tspan x="146" dy="32">moves in more than one way.</tspan></text><text class="se-activity-step" x="128" y="1596" text-anchor="end">2.</text><text class="se-copy" x="146" y="1597"><tspan x="146">For each one, write how it moves and which body part it uses.</tspan></text><text class="se-activity-step" x="128" y="1640" text-anchor="end">3.</text><text class="se-copy" x="146" y="1641"><tspan x="146">Use Table 2.5 as a guide for your notebook table.</tspan></text><text class="se-activity-step" x="128" y="1684" text-anchor="end">4.</text><text class="se-copy" x="146" y="1685"><tspan x="146">Group animals by the body parts observed in use. Put a record in multiple</tspan><tspan x="146" dy="32">groups if your rule requires it.</tspan></text></g>

<g class="v2-reading-block" data-block="source-18-6" transform="translate(0 -1176)"><rect class="se-prompt se-thought-panel" x="89" y="2163" width="874" height="188"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="2184" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="2206">Think It Through</text></g><text class="se-copy" x="113" y="2259"><tspan x="113">A pigeon walks and flies. How would you record it in a grouping by body</tspan><tspan x="113" dy="32">parts used for movement? Would forcing every animal into only one group</tspan><tspan x="113" dy="32">lose information? Explain with your records.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-132" transform="translate(0 1081)"><text class="se-copy" x="89" y="136"><tspan x="89">Animals move in many ways. They walk, run, hop, crawl, fly, swim and glide.</tspan><tspan x="89" dy="32">Some do more than one, like a pigeon.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
