<section class="page page--food page--science-editorial page--science-v2" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="v2-ribbon-stem" d="M31 63Q34 30 60 7"/><path class="v2-ribbon-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="136"><tspan x="89">Compare<tspan data-gap="" dx="1.09112"> </tspan>your<tspan data-gap="" dx="1.09112"> </tspan>records<tspan data-gap="" dx="1.09112"> </tspan>with<tspan data-gap="" dx="1.09112"> </tspan>the<tspan data-gap="" dx="1.09112"> </tspan>descriptions<tspan data-gap="" dx="1.09112"> </tspan>below.<tspan data-gap="" dx="1.09112"> </tspan>Your<tspan data-gap="" dx="1.09112"> </tspan>sample<tspan data-gap="" dx="1.09112"> </tspan>may<tspan data-gap="" dx="1.09112"> </tspan>not<tspan data-gap="" dx="1.09112"> </tspan>contain</tspan><tspan x="89" dy="32">all three forms, and young or pruned plants may be harder to classify.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><image class="science-illustration" href="../../figures/class-6/science/ch02-v2/forms-v2.png" x="89" y="194" width="874" height="460" preserveAspectRatio="xMidYMid meet"/>
<text class="se-caption" x="235" y="681" text-anchor="middle">Tomato · herb</text>
<text class="se-caption" x="526" y="681" text-anchor="middle">Rose · shrub</text>
<text class="se-caption" x="817" y="681" text-anchor="middle">Mango · tree</text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" x="89" y="731"><tspan x="89">Plants with soft,</tspan><tspan x="89" dy="32">non-woody stems are</tspan><tspan x="89" dy="32">called <tspan class="se-bold">herbs</tspan>. Many are</tspan><tspan x="89" dy="32">small, such as mint,</tspan><tspan x="89" dy="32">coriander and tomato,</tspan><tspan x="89" dy="32">but height alone does</tspan><tspan x="89" dy="32">not define a herb.</tspan></text>
<text class="se-copy" x="391" y="731"><tspan x="391"><tspan class="se-bold">Shrubs</tspan> are woody</tspan><tspan x="391" dy="32">plants that usually</tspan><tspan x="391" dy="32">branch close to the</tspan><tspan x="391" dy="32">ground, often with</tspan><tspan x="391" dy="32">several main stems. A</tspan><tspan x="391" dy="32">rose bush is an example.</tspan><tspan x="391" dy="32">Observe the branching</tspan><tspan x="391" dy="32">as well as the height.</tspan></text>
<text class="se-copy" x="693" y="731"><tspan x="693"><tspan class="se-bold">Trees</tspan> are woody plants</tspan><tspan x="693" dy="32">that usually develop a</tspan><tspan x="693" dy="32">main trunk supporting a</tspan><tspan x="693" dy="32">crown of branches.</tspan><tspan x="693" dy="32">Mango is an example. A</tspan><tspan x="693" dy="32">young mango is still a</tspan><tspan x="693" dy="32">tree even when it is</tspan><tspan x="693" dy="32">shorter than a mature</tspan><tspan x="693" dy="32">tomato plant.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><line class="v2-rule" x1="89" x2="963" y1="1023" y2="1023"/></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="1071"><tspan x="89">Woody<tspan data-gap="" dx="4.28093"> </tspan>stems<tspan data-gap="" dx="4.28093"> </tspan>support<tspan data-gap="" dx="4.28093"> </tspan>branches<tspan data-gap="" dx="4.28093"> </tspan>and<tspan data-gap="" dx="4.28093"> </tspan>can<tspan data-gap="" dx="4.28093"> </tspan>thicken<tspan data-gap="" dx="4.28093"> </tspan>as<tspan data-gap="" dx="4.28093"> </tspan>a<tspan data-gap="" dx="4.28093"> </tspan>plant<tspan data-gap="" dx="4.28093"> </tspan>grows.<tspan data-gap="" dx="4.28093"> </tspan>Look<tspan data-gap="" dx="4.28093"> </tspan>at<tspan data-gap="" dx="4.28093"> </tspan>the</tspan><tspan x="89" dy="32">base<tspan data-gap="" dx="7.21865"> </tspan>of<tspan data-gap="" dx="7.21865"> </tspan>a<tspan data-gap="" dx="7.21865"> </tspan>tree<tspan data-gap="" dx="7.21865"> </tspan>and<tspan data-gap="" dx="7.21865"> </tspan>then<tspan data-gap="" dx="7.21865"> </tspan>a<tspan data-gap="" dx="7.21865"> </tspan>herb:<tspan data-gap="" dx="7.21865"> </tspan>what<tspan data-gap="" dx="7.21865"> </tspan>differences<tspan data-gap="" dx="7.21865"> </tspan>can<tspan data-gap="" dx="7.21865"> </tspan>you<tspan data-gap="" dx="7.21865"> </tspan>describe<tspan data-gap="" dx="7.21865"> </tspan>without</tspan><tspan x="89" dy="32">damaging either?</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="1185"><tspan x="89">A<tspan data-gap="" dx="3.82424"> </tspan>banana<tspan data-gap="" dx="3.82424"> </tspan>plant<tspan data-gap="" dx="3.82424"> </tspan>is<tspan data-gap="" dx="3.82424"> </tspan>a<tspan data-gap="" dx="3.82424"> </tspan>large<tspan data-gap="" dx="3.82424"> </tspan>herb.<tspan data-gap="" dx="3.82424"> </tspan>Its<tspan data-gap="" dx="3.82424"> </tspan>trunk-like<tspan data-gap="" dx="3.82424"> </tspan>structure<tspan data-gap="" dx="3.82424"> </tspan>is<tspan data-gap="" dx="3.82424"> </tspan>a<tspan data-gap="" dx="3.82424"> </tspan><tspan class="se-bold">pseudostem</tspan>,<tspan data-gap="" dx="3.82424"> </tspan>made</tspan><tspan x="89" dy="32">from<tspan data-gap="" dx="0.62617"> </tspan>tightly<tspan data-gap="" dx="0.62617"> </tspan>overlapping<tspan data-gap="" dx="0.62617"> </tspan>leaf<tspan data-gap="" dx="0.62617"> </tspan>bases<tspan data-gap="" dx="0.62617"> </tspan>rather<tspan data-gap="" dx="0.62617"> </tspan>than<tspan data-gap="" dx="0.62617"> </tspan>a<tspan data-gap="" dx="0.62617"> </tspan>woody<tspan data-gap="" dx="0.62617"> </tspan>trunk.<tspan data-gap="" dx="0.62617"> </tspan>Its<tspan data-gap="" dx="0.62617"> </tspan>height<tspan data-gap="" dx="0.62617"> </tspan>does<tspan data-gap="" dx="0.62617"> </tspan>not</tspan><tspan x="89" dy="32">make it a tree.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1465H915Q900 1465 892 1480L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1465H935Q920 1465 912 1480L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1499" text-anchor="middle">9</text></g></svg></div></div></section>
