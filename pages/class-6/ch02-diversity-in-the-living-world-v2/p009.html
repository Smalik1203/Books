r="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-54" transform="translate(0 0)"><text class="se-heading" x="89" y="142"><tspan x="89">Plants That Cannot Stand Up</tspan></text></g>
<g class="v2-reading-block" data-block="reading-55" transform="translate(0 0)"><text class="se-copy" x="89" y="184"><tspan x="89">Not every plant can hold itself up.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-56" transform="translate(0 0)"><image class="science-illustration" href="../../figures/class-6/science/ch02-v2/climbers.png" x="89" y="208" width="874" height="350" preserveAspectRatio="xMidYMid meet"/>
<text class="se-caption" x="308" y="585" text-anchor="middle">Grape vine · climber</text>
<text class="se-caption" x="744" y="585" text-anchor="middle">Pumpkin · creeper</text></g>
<g class="v2-reading-block" data-block="reading-57" transform="translate(0 0)"><text class="v2-comparison-title" x="89" y="637"><tspan x="89">Climbers</tspan></text><text class="se-copy" x="89" y="679" text-anchor="start">•</text><text class="se-copy" x="112" y="679"><tspan x="112">Stems cannot stand without support.</tspan></text><text class="se-copy" x="89" y="719" text-anchor="start">•</text><text class="se-copy" x="112" y="719"><tspan x="112">Grow up a wall, fence, stick or</tspan><tspan x="112" dy="32">another plant.</tspan></text><text class="se-copy" x="89" y="791" text-anchor="start">•</text><text class="se-copy" x="112" y="791"><tspan x="112">Examples: money plant and grape</tspan><tspan x="112" dy="32">vine.</tspan></text>
<text class="v2-comparison-title" x="542" y="637"><tspan x="542">Creepers</tspan></text><text class="se-copy" x="542" y="679" text-anchor="start">•</text><text class="se-copy" x="565" y="679"><tspan x="565">Stems cannot stand upright.</tspan></text><text class="se-copy" x="542" y="719" text-anchor="start">•</text><text class="se-copy" x="565" y="719"><tspan x="565">Spread along the ground instead of</tspan><tspan x="565" dy="32">climbing.</tspan></text><text class="se-copy" x="542" y="791" text-anchor="start">•</text><text class="se-copy" x="565" y="791"><tspan x="565">Examples: pumpkin and</tspan><tspan x="565" dy="32">watermelon.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-58" transform="translate(0 0)"><text class="se-copy" x="89" y="885"><tspan x="89">Climbing and trailing describe growth habits, not a separate woody/non-woody</tspan><tspan x="89" dy="32">division. A grape vine is a woody climber; a pumpkin has non-woody trailing</tspan><tspan x="89" dy="32">stems. A plant can therefore be described in more than one way.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-59" transform="translate(0 0)"><text class="se-copy" x="89" y="997"><tspan x="89">A climber growing over another plant can look like part of it. Trace one visible</tspan><tspan x="89" dy="32">stem with your eyes from its base towards its leaves. Which leaves belong to that</tspan></text></g>
<g class="v2-reading-block" data-block="reading-60" transform="translate(0 0)"><text class="se-copy" x="89" y="1061"><tspan x="89">stem, and which belong to the support? Sketch the two separately. Observe</tspan><tspan x="89" dy="32">without tugging: pulling them apart could damage both plants.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-61" transform="translate(0 0)"><text class="se-copy" x="89" y="1141"><tspan x="89">A climber and a creeper both have stems that need support or spread along the</tspan><tspan x="89" dy="32">ground. What observations would you need before deciding which receives more</tspan><tspan x="89" dy="32">light?</tspan></text></g>
<g class="v2-reading-block" data-block="reading-62" transform="translate(0 0)"><text class="se-copy" x="89" y="1253"><tspan x="89">So far you have grouped plants using only the stem. Leaves give us another way</tspan><tspan x="89" dy="32">to sort the same plants. We can compare these groups with the stem groups.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
