<section class="page page--food page--science-editorial page--science-v2" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="v2-ribbon-stem" d="M31 63Q34 30 60 7"/><path class="v2-ribbon-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" transform="translate(0 0)"><text class="se-heading" x="89" y="142"><tspan x="89">Plants That Cannot Stand Up</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="198"><tspan x="89">Not every plant can hold itself up.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><image class="science-illustration" href="../../figures/class-6/science/ch02-v2/climbers.png" x="89" y="224" width="874" height="437" preserveAspectRatio="xMidYMid meet"/>
<text class="se-caption" x="308" y="688" text-anchor="middle">Grape vine · climber</text>
<text class="se-caption" x="744" y="688" text-anchor="middle">Pumpkin · creeper</text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" x="89" y="738"><tspan x="89">Some plants have stems that are too</tspan><tspan x="89" dy="32">weak to stand. So they climb up</tspan><tspan x="89" dy="32">something else — a wall, a fence, a</tspan><tspan x="89" dy="32">stick, or another plant. These are</tspan><tspan x="89" dy="32">called <tspan class="se-bold">climbers</tspan>. A money plant is a</tspan><tspan x="89" dy="32">climber. So is a grape vine.</tspan></text>
<text class="se-copy" x="542" y="738"><tspan x="542">Other plants also have weak stems. But</tspan><tspan x="542" dy="32">instead of climbing, they spread flat</tspan><tspan x="542" dy="32">along the ground. These are called</tspan><tspan x="542" dy="32"><tspan class="se-bold">creepers</tspan>. Pumpkin and watermelon</tspan><tspan x="542" dy="32">plants are creepers.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><line class="v2-rule" x1="89" x2="963" y1="934" y2="934"/></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="982"><tspan x="89">Climbing<tspan data-gap="" dx="3.46509"> </tspan>and<tspan data-gap="" dx="3.46509"> </tspan>trailing<tspan data-gap="" dx="3.46509"> </tspan>describe<tspan data-gap="" dx="3.46509"> </tspan>growth<tspan data-gap="" dx="3.46509"> </tspan>habits,<tspan data-gap="" dx="3.46509"> </tspan>not<tspan data-gap="" dx="3.46509"> </tspan>a<tspan data-gap="" dx="3.46509"> </tspan>separate<tspan data-gap="" dx="3.46509"> </tspan>woody/non-woody</tspan><tspan x="89" dy="32">division.<tspan data-gap="" dx="4.75107"> </tspan>A<tspan data-gap="" dx="4.75107"> </tspan>grape<tspan data-gap="" dx="4.75107"> </tspan>vine<tspan data-gap="" dx="4.75107"> </tspan>is<tspan data-gap="" dx="4.75107"> </tspan>a<tspan data-gap="" dx="4.75107"> </tspan>woody<tspan data-gap="" dx="4.75107"> </tspan>climber;<tspan data-gap="" dx="4.75107"> </tspan>a<tspan data-gap="" dx="4.75107"> </tspan>pumpkin<tspan data-gap="" dx="4.75107"> </tspan>has<tspan data-gap="" dx="4.75107"> </tspan>non-woody<tspan data-gap="" dx="4.75107"> </tspan>trailing</tspan><tspan x="89" dy="32">stems. A plant can therefore be described in more than one way.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="1096"><tspan x="89">A<tspan data-gap="" dx="2.31834"> </tspan>climber<tspan data-gap="" dx="2.31834"> </tspan>and<tspan data-gap="" dx="2.31834"> </tspan>a<tspan data-gap="" dx="2.31834"> </tspan>creeper<tspan data-gap="" dx="2.31834"> </tspan>both<tspan data-gap="" dx="2.31834"> </tspan>have<tspan data-gap="" dx="2.31834"> </tspan>stems<tspan data-gap="" dx="2.31834"> </tspan>that<tspan data-gap="" dx="2.31834"> </tspan>need<tspan data-gap="" dx="2.31834"> </tspan>support<tspan data-gap="" dx="2.31834"> </tspan>or<tspan data-gap="" dx="2.31834"> </tspan>spread<tspan data-gap="" dx="2.31834"> </tspan>along<tspan data-gap="" dx="2.31834"> </tspan>the</tspan><tspan x="89" dy="32">ground.<tspan data-gap="" dx="1.11484"> </tspan>What<tspan data-gap="" dx="1.11484"> </tspan>observations<tspan data-gap="" dx="1.11484"> </tspan>would<tspan data-gap="" dx="1.11484"> </tspan>you<tspan data-gap="" dx="1.11484"> </tspan>need<tspan data-gap="" dx="1.11484"> </tspan>before<tspan data-gap="" dx="1.11484"> </tspan>deciding<tspan data-gap="" dx="1.11484"> </tspan>which<tspan data-gap="" dx="1.11484"> </tspan>receives<tspan data-gap="" dx="1.11484"> </tspan>more</tspan><tspan x="89" dy="32">light?</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="1210"><tspan x="89">So<tspan data-gap="" dx="2.15386"> </tspan>far<tspan data-gap="" dx="2.15386"> </tspan>you<tspan data-gap="" dx="2.15386"> </tspan>have<tspan data-gap="" dx="2.15386"> </tspan>grouped<tspan data-gap="" dx="2.15386"> </tspan>plants<tspan data-gap="" dx="2.15386"> </tspan>using<tspan data-gap="" dx="2.15386"> </tspan>only<tspan data-gap="" dx="2.15386"> </tspan>the<tspan data-gap="" dx="2.15386"> </tspan>stem.<tspan data-gap="" dx="2.15386"> </tspan>Leaves<tspan data-gap="" dx="2.15386"> </tspan>give<tspan data-gap="" dx="2.15386"> </tspan>us<tspan data-gap="" dx="2.15386"> </tspan>another<tspan data-gap="" dx="2.15386"> </tspan>way</tspan><tspan x="89" dy="32">to sort the same plants. We can compare these groups with the stem groups.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1465H137Q152 1465 160 1480L179 1514H0Z"/><path class="v2-ribbon" d="M0 1465H117Q132 1465 140 1480L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1499" text-anchor="middle">10</text></g></svg></div></div></section>
