<section class="page page--food page--science-editorial page--science-v2" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g transform="translate(-148 3) scale(.2)"><g class="v2-ribbon__motif" transform="translate(0 0)" aria-hidden="true"><path class="v2-ribbon__stem" d="M1005 35C930 117 932 200 1018 275"/><path class="v2-ribbon__leaves" d="M994.33 47.31C1005.31 49.71 1020.98 36.37 1024 20C1011.75 25.15 996.71 35.6 994.33 47.31Z M978.05 69.47C992.62 77.79 1025.12 66.86 1041 46C1019.28 47.37 989.73 54.66 978.05 69.47Z M963.3 96.55C965.95 76.92 940.73 53.11 912 52C922.59 71.93 942.72 95.37 963.3 96.55Z M954.26 123.53C973.15 135.98 1017.32 123.91 1040 97C1010.89 97.06 970.91 104.46 954.26 123.53Z M951.06 147.92C949.72 125.2 916.83 105.4 885 112C900.96 131.44 928.18 152.21 951.06 147.92Z M953.1 174.53C970.15 189.5 1011.77 181.61 1034 156C1006.91 152.97 969.39 156.43 953.1 174.53Z M961.02 200.84C956.66 180.93 925.52 168.87 899 180C915.5 194.56 941.9 208.44 961.02 200.84Z M974.87 226.77C987.64 240.88 1022.05 237.75 1042 218C1020.2 213.13 989.44 212.87 974.87 226.77Z M990.66 247.67C986.1 232.61 959.09 222.53 937 230C951.66 241.46 974.71 252.74 990.66 247.67Z"/><path class="v2-ribbon__veins" d="M996.11 45.67Q1008.04 36.59 1021.07 23.37 M981.82 68.07Q1005.8 61.22 1034.32 49.24 M960.22 93.87Q942.89 75.49 918.23 56.22 M959.41 121.94Q991.92 114.66 1030.85 100.83 M947.1 145.76Q924.06 129.89 892.77 115.03 M957.95 173.42Q988.51 169.29 1025.32 159.01 M957.29 199.59Q935.2 189.36 906.12 181.39 M978.9 226.25Q1004.04 225.36 1034.73 219.81 M987.44 246.61Q968.2 238.21 943.12 231.28"/></g></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-63" transform="translate(0 0)"><text class="se-heading" x="89" y="142"><tspan x="89">Lines on a Leaf</tspan></text></g>
<g class="v2-reading-block" data-block="reading-64" transform="translate(0 0)"><text class="se-copy" x="89" y="184"><tspan x="89">Hold a leaf up against the light. You will see thin lines running through it. These</tspan><tspan x="89" dy="32">lines are <tspan class="se-bold">veins</tspan>. The pattern the veins make is called <tspan class="se-bold">venation</tspan>.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-65" transform="translate(0 0)"><text class="se-copy" x="89" y="264"><tspan x="89">Veins contain tissues that transport water and dissolved substances. They carry</tspan><tspan x="89" dy="32">water into the leaf and sugars made in the leaf to other parts of the plant. They</tspan><tspan x="89" dy="32">also help support the leaf.</tspan></text></g>
<g class="v2-reading-block" data-block="source-11-3" transform="translate(0 0)"><rect class="se-activity-panel" x="89" y="352" width="874" height="449" rx="18"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="373" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="395">Investigate</text></g><text class="se-copy" x="113" y="441"><tspan x="113">You will need: fallen leaves of at least four different plants, thin paper, a</tspan><tspan x="113" dy="32">pencil with soft lead.</tspan></text><text class="se-activity-step" x="128" y="516" text-anchor="end">1.</text><text class="se-copy" x="146" y="517"><tspan x="146">Lay a leaf back-side up; its veins stand out more there.</tspan></text><text class="se-activity-step" x="128" y="560" text-anchor="end">2.</text><text class="se-copy" x="146" y="561"><tspan x="146">Place a sheet of thin paper over the leaf.</tspan></text><text class="se-activity-step" x="128" y="604" text-anchor="end">3.</text><text class="se-copy" x="146" y="605"><tspan x="146">Hold the paper still. Rub the side of the pencil lead lightly across it.</tspan></text><text class="se-activity-step" x="128" y="648" text-anchor="end">4.</text><text class="se-copy" x="146" y="649"><tspan x="146">Compare print and leaf. If veins are unclear, adjust the paper or pressure</tspan><tspan x="146" dy="32">and try again.</tspan></text><text class="se-activity-step" x="128" y="724" text-anchor="end">5.</text><text class="se-copy" x="146" y="725"><tspan x="146">Repeat for each leaf and label each print with the plant’s name.</tspan></text><text class="se-copy" x="113" y="769"><tspan x="113">Put all your prints side by side.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-67" transform="translate(0 0)"><text class="se-copy" x="89" y="859"><tspan x="89">Group the prints by their vein patterns. How many groups does your sample</tspan><tspan x="89" dy="32">support? Explain your rule. If all the patterns look alike, compare with another</tspan><tspan x="89" dy="32">group’s leaves.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-68" transform="translate(0 0)"><text class="se-copy" x="89" y="971"><tspan x="89">A faint patch may come from moving paper or missed pencil strokes. Check the</tspan><tspan x="89" dy="32">actual leaf before describing its veins. Keep the unclear and improved prints</tspan><tspan x="89" dy="32">together to explain why you changed your record.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-69" transform="translate(0 0)"><text class="se-copy" x="89" y="1083"><tspan x="89">Compare veins separately from leaf outlines: different outlines can share a vein</tspan><tspan x="89" dy="32">pattern. Point to the lines supporting your grouping so others can follow your</tspan><tspan x="89" dy="32">rule without knowing the plant names.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-70" transform="translate(0 0)"><text class="se-copy" x="89" y="1195"><tspan x="89">Make two rubbings of the same fallen leaf, changing only the pencil pressure.</tspan><tspan x="89" dy="32">Compare both with the leaf itself. A dark line in one print is not necessarily a</tspan></text></g>
<g class="v2-reading-block" data-block="reading-71" transform="translate(0 0)"><text class="se-copy" x="89" y="1259"><tspan x="89">thicker vein: it may show where you pressed harder. Use the leaf to decide which</tspan><tspan x="89" dy="32">lines belong in your final record.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
