<section class="page page--food page--science-editorial page--science-v2" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="v2-ribbon-stem" d="M31 63Q34 30 60 7"/><path class="v2-ribbon-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" transform="translate(0 -1105)"><text class="se-copy" data-measure="874" x="89" y="1240"><tspan x="89">Count<tspan data-gap="" dx="2.59955"> </tspan>age<tspan data-gap="" dx="2.59955"> </tspan>from<tspan data-gap="" dx="2.59955"> </tspan>germination<tspan data-gap="" dx="2.59955"> </tspan>as<tspan data-gap="" dx="2.59955"> </tspan>well<tspan data-gap="" dx="2.59955"> </tspan>as<tspan data-gap="" dx="2.59955"> </tspan>recording<tspan data-gap="" dx="2.59955"> </tspan>the<tspan data-gap="" dx="2.59955"> </tspan>calendar<tspan data-gap="" dx="2.59955"> </tspan>date.<tspan data-gap="" dx="2.59955"> </tspan>If<tspan data-gap="" dx="2.59955"> </tspan>one<tspan data-gap="" dx="2.59955"> </tspan>seed</tspan><tspan x="89" dy="31">germinated<tspan data-gap="" dx="0.54073"> </tspan>on<tspan data-gap="" dx="0.54073"> </tspan>Monday<tspan data-gap="" dx="0.54073"> </tspan>and<tspan data-gap="" dx="0.54073"> </tspan>another<tspan data-gap="" dx="0.54073"> </tspan>on<tspan data-gap="" dx="0.54073"> </tspan>Thursday,<tspan data-gap="" dx="0.54073"> </tspan>drawings<tspan data-gap="" dx="0.54073"> </tspan>made<tspan data-gap="" dx="0.54073"> </tspan>on<tspan data-gap="" dx="0.54073"> </tspan>Friday<tspan data-gap="" dx="0.54073"> </tspan>show</tspan><tspan x="89" dy="31">different<tspan data-gap="" dx="1.18278"> </tspan>stages<tspan data-gap="" dx="1.18278"> </tspan>of<tspan data-gap="" dx="1.18278"> </tspan>growth.<tspan data-gap="" dx="1.18278"> </tspan>Compare<tspan data-gap="" dx="1.18278"> </tspan>seedlings<tspan data-gap="" dx="1.18278"> </tspan>of<tspan data-gap="" dx="1.18278"> </tspan>similar<tspan data-gap="" dx="1.18278"> </tspan>age<tspan data-gap="" dx="1.18278"> </tspan>before<tspan data-gap="" dx="1.18278"> </tspan>deciding<tspan data-gap="" dx="1.18278"> </tspan>that</tspan><tspan x="89" dy="31">a difference belongs to the two kinds of plant.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 142)"><text class="se-copy" data-measure="874" x="89" y="136"><tspan x="89">Compare<tspan data-gap="" dx="3.49670"> </tspan>several<tspan data-gap="" dx="3.49670"> </tspan>seedlings<tspan data-gap="" dx="3.49670"> </tspan>of<tspan data-gap="" dx="3.49670"> </tspan>each<tspan data-gap="" dx="3.49670"> </tspan>kind.<tspan data-gap="" dx="3.49670"> </tspan>Did<tspan data-gap="" dx="3.49670"> </tspan>they<tspan data-gap="" dx="3.49670"> </tspan>germinate<tspan data-gap="" dx="3.49670"> </tspan>at<tspan data-gap="" dx="3.49670"> </tspan>the<tspan data-gap="" dx="3.49670"> </tspan>same<tspan data-gap="" dx="3.49670"> </tspan>time?</tspan><tspan x="89" dy="32">Root systems change as seedlings develop, so record the age as well as the shape.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 142)"><image class="science-illustration" href="../../figures/class-6/science/ch02-v2/roots.png" x="89" y="194" width="874" height="437" preserveAspectRatio="xMidYMid meet"/>
<text class="se-caption" x="308" y="658" text-anchor="middle">Chana · taproot</text>
<text class="se-caption" x="744" y="658" text-anchor="middle">Wheat · fibrous roots</text></g>
<g class="v2-reading-block" transform="translate(0 142)"><text class="se-copy" x="89" y="708"><tspan x="89">A chana seedling usually develops one</tspan><tspan x="89" dy="32">main root with smaller side roots. A</tspan><tspan x="89" dy="32">main root of this kind is a <tspan class="se-bold">taproot</tspan>.</tspan><tspan x="89" dy="32">Mustard and radish also develop</tspan><tspan x="89" dy="32">taproots. The enlarged edible part of a</tspan><tspan x="89" dy="32">radish includes a swollen taproot that</tspan><tspan x="89" dy="32">stores food.</tspan></text>
<text class="se-copy" x="542" y="708"><tspan x="542">As the wheat seedling develops,</tspan><tspan x="542" dy="32">several thin roots appear. Later, more</tspan><tspan x="542" dy="32">roots grow from the base of the stem,</tspan><tspan x="542" dy="32">forming a spreading bunch without</tspan><tspan x="542" dy="32">one dominant main root. These are</tspan><tspan x="542" dy="32">called <tspan class="se-bold">fibrous</tspan> <tspan class="se-bold">roots</tspan>. Grass, maize and</tspan><tspan x="542" dy="32">lemongrass have them.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 142)"><line class="v2-rule" x1="89" x2="963" y1="936" y2="936"/></g>
<g class="v2-reading-block" transform="translate(0 142)"><text class="se-copy" data-measure="874" x="89" y="984"><tspan x="89">Both<tspan data-gap="" dx="1.02554"> </tspan>root<tspan data-gap="" dx="1.02554"> </tspan>systems<tspan data-gap="" dx="1.02554"> </tspan>anchor<tspan data-gap="" dx="1.02554"> </tspan>plants<tspan data-gap="" dx="1.02554"> </tspan>and<tspan data-gap="" dx="1.02554"> </tspan>take<tspan data-gap="" dx="1.02554"> </tspan>up<tspan data-gap="" dx="1.02554"> </tspan>water<tspan data-gap="" dx="1.02554"> </tspan>and<tspan data-gap="" dx="1.02554"> </tspan>dissolved<tspan data-gap="" dx="1.02554"> </tspan>minerals.<tspan data-gap="" dx="1.02554"> </tspan>Their</tspan><tspan x="89" dy="32">branching patterns differ; their jobs overlap.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1465H137Q152 1465 160 1480L179 1514H0Z"/><path class="v2-ribbon" d="M0 1465H117Q132 1465 140 1480L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1499" text-anchor="middle">14</text></g></svg></div></div></section>
