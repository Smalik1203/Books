<section class="page page--food page--science-editorial page--science-v2" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g transform="translate(-148 3) scale(.2)"><g class="v2-ribbon__motif" transform="translate(0 0)" aria-hidden="true"><path class="v2-ribbon__stem" d="M1005 35C930 117 932 200 1018 275"/><path class="v2-ribbon__leaves" d="M994.33 47.31C1005.31 49.71 1020.98 36.37 1024 20C1011.75 25.15 996.71 35.6 994.33 47.31Z M978.05 69.47C992.62 77.79 1025.12 66.86 1041 46C1019.28 47.37 989.73 54.66 978.05 69.47Z M963.3 96.55C965.95 76.92 940.73 53.11 912 52C922.59 71.93 942.72 95.37 963.3 96.55Z M954.26 123.53C973.15 135.98 1017.32 123.91 1040 97C1010.89 97.06 970.91 104.46 954.26 123.53Z M951.06 147.92C949.72 125.2 916.83 105.4 885 112C900.96 131.44 928.18 152.21 951.06 147.92Z M953.1 174.53C970.15 189.5 1011.77 181.61 1034 156C1006.91 152.97 969.39 156.43 953.1 174.53Z M961.02 200.84C956.66 180.93 925.52 168.87 899 180C915.5 194.56 941.9 208.44 961.02 200.84Z M974.87 226.77C987.64 240.88 1022.05 237.75 1042 218C1020.2 213.13 989.44 212.87 974.87 226.77Z M990.66 247.67C986.1 232.61 959.09 222.53 937 230C951.66 241.46 974.71 252.74 990.66 247.67Z"/><path class="v2-ribbon__veins" d="M996.11 45.67Q1008.04 36.59 1021.07 23.37 M981.82 68.07Q1005.8 61.22 1034.32 49.24 M960.22 93.87Q942.89 75.49 918.23 56.22 M959.41 121.94Q991.92 114.66 1030.85 100.83 M947.1 145.76Q924.06 129.89 892.77 115.03 M957.95 173.42Q988.51 169.29 1025.32 159.01 M957.29 199.59Q935.2 189.36 906.12 181.39 M978.9 226.25Q1004.04 225.36 1034.73 219.81 M987.44 246.61Q968.2 238.21 943.12 231.28"/></g></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-94" transform="translate(0 -1021)"><text class="v2-comparison-title" x="89" y="1163"><tspan x="89">Depth and water</tspan></text><text class="se-copy" x="89" y="1205" text-anchor="start">•</text><text class="se-copy" x="112" y="1205"><tspan x="112">A taproot can reach water below the</tspan><tspan x="112" dy="32">surface.</tspan></text><text class="se-copy" x="89" y="1277" text-anchor="start">•</text><text class="se-copy" x="112" y="1277"><tspan x="112">Deep roots may help during a dry</tspan><tspan x="112" dy="32">spell.</tspan></text><text class="se-copy" x="89" y="1349" text-anchor="start">•</text><text class="se-copy" x="112" y="1349"><tspan x="112">Actual depth also depends on the</tspan><tspan x="112" dy="32">species and soil.</tspan></text>
<text class="v2-comparison-title" x="542" y="1163"><tspan x="542">Spread and soil</tspan></text><text class="se-copy" x="542" y="1205" text-anchor="start">•</text><text class="se-copy" x="565" y="1205"><tspan x="565">Many fibrous systems spread</tspan><tspan x="565" dy="32">through the upper soil.</tspan></text><text class="se-copy" x="542" y="1277" text-anchor="start">•</text><text class="se-copy" x="565" y="1277"><tspan x="565">Dense roots hold loose soil and</tspan><tspan x="565" dy="32">absorb water near the surface.</tspan></text><text class="se-copy" x="542" y="1349" text-anchor="start">•</text><text class="se-copy" x="565" y="1349"><tspan x="565">Some fibrous roots also extend deep</tspan><tspan x="565" dy="32">into the ground.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-95" transform="translate(0 298)"><text class="se-heading" x="89" y="142"><tspan x="89">Comparing Leaves and Roots</tspan></text></g>
<g class="v2-reading-block" data-block="reading-96" transform="translate(0 298)"><text class="se-copy" x="89" y="184"><tspan x="89">You now know two ways to sort plants. One uses leaves. One uses roots.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-97" transform="translate(0 298)"><text class="se-copy" x="89" y="232"><tspan x="89">Can a record of leaf venation help you predict root type? First collect</tspan><tspan x="89" dy="32">observations, then test any pattern against another plant.</tspan></text></g>
<g class="v2-reading-block" data-block="source-15-3" transform="translate(0 298)"><rect class="se-activity-panel" x="89" y="288" width="874" height="457" rx="18"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="309" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="331">Investigate</text></g><text class="se-activity-step" x="128" y="376" text-anchor="end">1.</text><text class="se-copy" x="146" y="377"><tspan x="146">With a teacher or gardener, choose five kinds of flowering plants with</tspan><tspan x="146" dy="32">developed leaves and visible roots. Use spare nursery plants; do not pull</tspan><tspan x="146" dy="32">plants from the wild.</tspan></text><text class="se-activity-step" x="128" y="484" text-anchor="end">2.</text><text class="se-copy" x="146" y="485"><tspan x="146">Copy Table 2.4’s headings into your notebook. Inspect four kinds first;</tspan><tspan x="146" dy="32">record venation and roots. Mark unclear features as uncertain.</tspan></text><text class="se-activity-step" x="128" y="560" text-anchor="end">3.</text><text class="se-copy" x="146" y="561"><tspan x="146">Use a connection in these four records to predict the fifth plant’s roots</tspan><tspan x="146" dy="32">from its leaf. Record the prediction before inspecting its roots.</tspan></text><text class="se-activity-step" x="128" y="636" text-anchor="end">4.</text><text class="se-copy" x="146" y="637"><tspan x="146">Inspect the fifth plant’s roots. Does the observation support your pattern?</tspan><tspan x="146" dy="32">Compare class results.</tspan></text><text class="se-activity-step" x="128" y="712" text-anchor="end">5.</text><text class="se-copy" x="146" y="713"><tspan x="146">Handle the roots gently and replant the plants with your teacher’s help.</tspan></text></g>
<g class="v2-reading-block" data-block="source-15-4" transform="translate(0 298)"><text class="v2-table-caption" x="89" y="800.6"><tspan x="89">Table 2.4: Sample leaf and root record (— = not recorded)</tspan></text><rect class="se-table-head" x="89" y="821" width="874" height="74"/><text class="v2-table-heading" x="103" y="854.08"><tspan x="103">Plant</tspan></text><text class="v2-table-heading" x="293" y="854.08"><tspan x="293">Venation</tspan></text><text class="v2-table-heading" x="483" y="854.08"><tspan x="483">Root prediction (fifth</tspan><tspan x="483" dy="28">plant)</tspan></text><text class="v2-table-heading" x="730" y="854.08"><tspan x="730">Root observed</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="895" y2="895"/><text class="se-copy se-table-copy" x="103" y="928.08"><tspan x="103">Lemongrass</tspan></text><text class="se-copy se-table-copy" x="293" y="928.08"><tspan x="293">Parallel</tspan></text><text class="se-copy se-table-copy" x="483" y="928.08"><tspan x="483">—</tspan></text><text class="se-copy se-table-copy" x="730" y="928.08"><tspan x="730">Fibrous</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="941" y2="941"/><line class="v2-table-rule" x1="279" x2="279" y1="821" y2="941"/><line class="v2-table-rule" x1="469" x2="469" y1="821" y2="941"/><line class="v2-table-rule" x1="716" x2="716" y1="821" y2="941"/><rect class="v2-table-frame" x="89" y="821" width="874" height="120"/></g>
<g class="v2-reading-block" data-block="reading-100" transform="translate(0 298)"><text class="se-copy" x="89" y="981"><tspan x="89">The lemongrass row records parallel veins and fibrous roots, but no prediction.</tspan><tspan x="89" dy="32">For your fifth plant, keep the prediction and later observation in separate</tspan><tspan x="89" dy="32">columns so another reader can compare them.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
