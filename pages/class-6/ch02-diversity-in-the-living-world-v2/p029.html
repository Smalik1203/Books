<section class="page page--food page--science-editorial page--science-v2" data-folio="29" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 29"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g transform="translate(-148 3) scale(.2)"><g class="v2-ribbon__motif" transform="translate(0 0)" aria-hidden="true"><path class="v2-ribbon__stem" d="M1005 35C930 117 932 200 1018 275"/><path class="v2-ribbon__leaves" d="M994.33 47.31C1005.31 49.71 1020.98 36.37 1024 20C1011.75 25.15 996.71 35.6 994.33 47.31Z M978.05 69.47C992.62 77.79 1025.12 66.86 1041 46C1019.28 47.37 989.73 54.66 978.05 69.47Z M963.3 96.55C965.95 76.92 940.73 53.11 912 52C922.59 71.93 942.72 95.37 963.3 96.55Z M954.26 123.53C973.15 135.98 1017.32 123.91 1040 97C1010.89 97.06 970.91 104.46 954.26 123.53Z M951.06 147.92C949.72 125.2 916.83 105.4 885 112C900.96 131.44 928.18 152.21 951.06 147.92Z M953.1 174.53C970.15 189.5 1011.77 181.61 1034 156C1006.91 152.97 969.39 156.43 953.1 174.53Z M961.02 200.84C956.66 180.93 925.52 168.87 899 180C915.5 194.56 941.9 208.44 961.02 200.84Z M974.87 226.77C987.64 240.88 1022.05 237.75 1042 218C1020.2 213.13 989.44 212.87 974.87 226.77Z M990.66 247.67C986.1 232.61 959.09 222.53 937 230C951.66 241.46 974.71 252.74 990.66 247.67Z"/><path class="v2-ribbon__veins" d="M996.11 45.67Q1008.04 36.59 1021.07 23.37 M981.82 68.07Q1005.8 61.22 1034.32 49.24 M960.22 93.87Q942.89 75.49 918.23 56.22 M959.41 121.94Q991.92 114.66 1030.85 100.83 M947.1 145.76Q924.06 129.89 892.77 115.03 M957.95 173.42Q988.51 169.29 1025.32 159.01 M957.29 199.59Q935.2 189.36 906.12 181.39 M978.9 226.25Q1004.04 225.36 1034.73 219.81 M987.44 246.61Q968.2 238.21 943.12 231.28"/></g></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-20" transform="translate(0 -1155)"><text class="se-copy" x="89" y="1291"><tspan x="89">10. A duck and a pigeon are both birds. But their feet are different. Describe the</tspan><tspan x="89" dy="32">difference. What can the duck do because of it?</tspan></text></g>
<g class="v2-reading-block" data-block="reading-21" transform="translate(0 -1155)"><text class="se-copy" x="89" y="1371"><tspan x="89">Support your explanation with a labelled sketch and an observation from a safe</tspan><tspan x="89" dy="32">distance or a reliable video. Distinguish what the picture shows about the foot</tspan></text></g>
<g class="v2-reading-block" data-block="reading-22" transform="translate(0 -1155)"><text class="se-copy" x="89" y="1435"><tspan x="89">from what watching the bird shows about movement. Which part of your</tspan><tspan x="89" dy="32">explanation is still a prediction that needs checking?</tspan></text></g>
<g class="v2-reading-block" data-block="reading-23" transform="translate(0 236)"><text class="v2-title" x="89" y="150"><tspan x="89">Learning Further</tspan></text></g>
<g class="v2-reading-block" data-block="reading-24" transform="translate(0 236)"><text class="se-copy" x="89" y="194" text-anchor="start">•</text><text class="se-copy" x="112" y="194"><tspan x="112">Walk around your school with your teacher or the gardener. Label the plants</tspan><tspan x="112" dy="32">with their local names. Make a list in your notebook. For each plant, record</tspan></text></g>
<g class="v2-reading-block" data-block="reading-25" transform="translate(0 236)"><text class="se-copy" x="112" y="258"><tspan x="112">whether its stems are woody and how it grows: upright, climbing or trailing.</tspan><tspan x="112" dy="32">Use herb, shrub or tree where the evidence supports it; more than one</tspan><tspan x="112" dy="32">description can apply.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-26" transform="translate(0 236)"><text class="se-copy" x="89" y="370" text-anchor="start">•</text><text class="se-copy" x="112" y="370"><tspan x="112">Over one term, build a class <tspan class="se-bold">biodiversity</tspan> register. Revisit the same places for</tspan><tspan x="112" dy="32">the same length of time. Record dates, weather and how you searched.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-27" transform="translate(0 236)"><text class="se-copy" x="112" y="434"><tspan x="112">Compare records, but treat a missing sighting as &quot;not recorded&quot;, not proof of</tspan><tspan x="112" dy="32">disappearance. Plan another check before concluding that a kind has gone.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-28" transform="translate(0 236)"><text class="se-copy" x="89" y="514" text-anchor="start">•</text><text class="se-copy" x="112" y="514"><tspan x="112">Interview an older person about local plants and animals. Ask where and when</tspan><tspan x="112" dy="32">they saw them. Compare one recollection with a dated photograph, written</tspan><tspan x="112" dy="32">record or another account. Identify what remains uncertain.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-29" transform="translate(0 236)"><text class="se-copy" x="89" y="626" text-anchor="start">•</text><text class="se-copy" x="112" y="626"><tspan x="112">Find out if there is a sacred grove, a protected forest or a bird sanctuary near</tspan><tspan x="112" dy="32">your district. Who protects it? What is it being protected from?</tspan></text></g>
<g class="v2-reading-block" data-block="reading-30" transform="translate(0 236)"><text class="se-copy" x="89" y="706" text-anchor="start">•</text><text class="se-copy" x="112" y="706"><tspan x="112">Read about one Indian scientist working on biodiversity today. Write a short</tspan><tspan x="112" dy="32">report. You could start with Divya Mudappa, Vidya Athreya, Uma</tspan></text></g>
<g class="v2-reading-block" data-block="reading-31" transform="translate(0 236)"><text class="se-copy" x="112" y="770"><tspan x="112">Ramakrishnan, Nandini Velho, Ghazala Shahabuddin, Usha Lachungpa or</tspan><tspan x="112" dy="32">Divya Karnad.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-32" transform="translate(0 236)"><text class="se-copy" x="89" y="850" text-anchor="start">•</text><text class="se-copy" x="112" y="850"><tspan x="112">Grow chana and wheat again. For each kind, use equal numbers of seeds from</tspan><tspan x="112" dy="32">the same batch in two trays: one in light and one in darkness. Keep water, tray</tspan></text></g>
<g class="v2-reading-block" data-block="reading-33" transform="translate(0 236)"><text class="se-copy" x="112" y="914"><tspan x="112">material and temperature as similar as possible. For seven days, record the</tspan><tspan x="112" dy="32">number germinating, shoot length and leaf colour at the same time each day.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-34" transform="translate(0 236)"><text class="se-copy" x="112" y="978"><tspan x="112">Predict first; compare each seed kind’s light and dark trays separately. Briefly</tspan><tspan x="112" dy="32">inspect the dark trays and return them to darkness.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">29</text></g></svg></div></div></section>
