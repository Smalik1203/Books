<section class="page page--food page--science-editorial page--science-v2" data-folio="17"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 17"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="v2-ribbon-stem" d="M31 63Q34 30 60 7"/><path class="v2-ribbon-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="135"><tspan x="89">A<tspan data-gap="" dx="1.57418"> </tspan>soaked<tspan data-gap="" dx="1.57418"> </tspan>chana<tspan data-gap="" dx="1.57418"> </tspan>can<tspan data-gap="" dx="1.57418"> </tspan>separate<tspan data-gap="" dx="1.57418"> </tspan>into<tspan data-gap="" dx="1.57418"> </tspan>two<tspan data-gap="" dx="1.57418"> </tspan>fleshy<tspan data-gap="" dx="1.57418"> </tspan>seed<tspan data-gap="" dx="1.57418"> </tspan>leaves<tspan data-gap="" dx="1.57418"> </tspan>called<tspan data-gap="" dx="1.57418"> </tspan><tspan class="se-bold">cotyledons</tspan>.<tspan data-gap="" dx="1.57418"> </tspan>They</tspan><tspan x="89" dy="31">store<tspan data-gap="" dx="0.80778"> </tspan>food<tspan data-gap="" dx="0.80778"> </tspan>for<tspan data-gap="" dx="0.80778"> </tspan>the<tspan data-gap="" dx="0.80778"> </tspan>young<tspan data-gap="" dx="0.80778"> </tspan>plant.<tspan data-gap="" dx="0.80778"> </tspan>Between<tspan data-gap="" dx="0.80778"> </tspan>them<tspan data-gap="" dx="0.80778"> </tspan>is<tspan data-gap="" dx="0.80778"> </tspan>the<tspan data-gap="" dx="0.80778"> </tspan>rest<tspan data-gap="" dx="0.80778"> </tspan>of<tspan data-gap="" dx="0.80778"> </tspan>the<tspan data-gap="" dx="0.80778"> </tspan>embryo,<tspan data-gap="" dx="0.80778"> </tspan>including</tspan><tspan x="89" dy="31">a<tspan data-gap="" dx="0.09104"> </tspan>tiny<tspan data-gap="" dx="0.09104"> </tspan>root<tspan data-gap="" dx="0.09104"> </tspan>and<tspan data-gap="" dx="0.09104"> </tspan>shoot.<tspan data-gap="" dx="0.09104"> </tspan>Compare<tspan data-gap="" dx="0.09104"> </tspan>your<tspan data-gap="" dx="0.09104"> </tspan>specimen<tspan data-gap="" dx="0.09104"> </tspan>with<tspan data-gap="" dx="0.09104"> </tspan>the<tspan data-gap="" dx="0.09104"> </tspan>labelled<tspan data-gap="" dx="0.09104"> </tspan>illustration.<tspan data-gap="" dx="0.09104"> </tspan>Trace</tspan><tspan x="89" dy="31">each<tspan data-gap="" dx="4.21462"> </tspan>label<tspan data-gap="" dx="4.21462"> </tspan>to<tspan data-gap="" dx="4.21462"> </tspan>the<tspan data-gap="" dx="4.21462"> </tspan>part<tspan data-gap="" dx="4.21462"> </tspan>it<tspan data-gap="" dx="4.21462"> </tspan>names,<tspan data-gap="" dx="4.21462"> </tspan>then<tspan data-gap="" dx="4.21462"> </tspan>locate<tspan data-gap="" dx="4.21462"> </tspan>that<tspan data-gap="" dx="4.21462"> </tspan>part<tspan data-gap="" dx="4.21462"> </tspan>in<tspan data-gap="" dx="4.21462"> </tspan>your<tspan data-gap="" dx="4.21462"> </tspan>specimen<tspan data-gap="" dx="4.21462"> </tspan>if<tspan data-gap="" dx="4.21462"> </tspan>it<tspan data-gap="" dx="4.21462"> </tspan>is</tspan><tspan x="89" dy="31">visible.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="309"><tspan x="89">In<tspan data-gap="" dx="3.77999"> </tspan>maize,<tspan data-gap="" dx="3.77999"> </tspan>one<tspan data-gap="" dx="3.77999"> </tspan>thin<tspan data-gap="" dx="3.77999"> </tspan>cotyledon<tspan data-gap="" dx="3.77999"> </tspan>lies<tspan data-gap="" dx="3.77999"> </tspan>beside<tspan data-gap="" dx="3.77999"> </tspan>the<tspan data-gap="" dx="3.77999"> </tspan>embryo’s<tspan data-gap="" dx="3.77999"> </tspan>tiny<tspan data-gap="" dx="3.77999"> </tspan>shoot<tspan data-gap="" dx="3.77999"> </tspan>and<tspan data-gap="" dx="3.77999"> </tspan>root.<tspan data-gap="" dx="3.77999"> </tspan>The</tspan><tspan x="89" dy="31">larger<tspan data-gap="" dx="7.79970"> </tspan>pale<tspan data-gap="" dx="7.79970"> </tspan>region<tspan data-gap="" dx="7.79970"> </tspan>is<tspan data-gap="" dx="7.79970"> </tspan>stored<tspan data-gap="" dx="7.79970"> </tspan>food<tspan data-gap="" dx="7.79970"> </tspan>called<tspan data-gap="" dx="7.79970"> </tspan>the<tspan data-gap="" dx="7.79970"> </tspan><tspan class="se-bold">endosperm</tspan>;<tspan data-gap="" dx="7.79970"> </tspan>it<tspan data-gap="" dx="7.79970"> </tspan>is<tspan data-gap="" dx="7.79970"> </tspan>not<tspan data-gap="" dx="7.79970"> </tspan>a<tspan data-gap="" dx="7.79970"> </tspan>second</tspan><tspan x="89" dy="31">cotyledon. Failure to split the grain is not itself proof of the cotyledon count.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="419"><tspan x="89">Cotyledon<tspan data-gap="" dx="7.52116"> </tspan>number,<tspan data-gap="" dx="7.52116"> </tspan>leaf<tspan data-gap="" dx="7.52116"> </tspan>venation<tspan data-gap="" dx="7.52116"> </tspan>and<tspan data-gap="" dx="7.52116"> </tspan>root<tspan data-gap="" dx="7.52116"> </tspan>type<tspan data-gap="" dx="7.52116"> </tspan>are<tspan data-gap="" dx="7.52116"> </tspan>associated<tspan data-gap="" dx="7.52116"> </tspan>features.<tspan data-gap="" dx="7.52116"> </tspan>The</tspan><tspan x="89" dy="31">comparison does not show that cotyledon number causes the other two.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="497"><tspan x="89">Among<tspan data-gap="" dx="7.71791"> </tspan>flowering<tspan data-gap="" dx="7.71791"> </tspan>plants,<tspan data-gap="" dx="7.71791"> </tspan>those<tspan data-gap="" dx="7.71791"> </tspan>whose<tspan data-gap="" dx="7.71791"> </tspan>seeds<tspan data-gap="" dx="7.71791"> </tspan>have<tspan data-gap="" dx="7.71791"> </tspan>two<tspan data-gap="" dx="7.71791"> </tspan>cotyledons<tspan data-gap="" dx="7.71791"> </tspan>are<tspan data-gap="" dx="7.71791"> </tspan>called</tspan><tspan x="89" dy="31"><tspan class="se-bold">dicotyledons</tspan>.<tspan data-gap="" dx="0.44580"> </tspan>We<tspan data-gap="" dx="0.44580"> </tspan>say<tspan data-gap="" dx="0.44580"> </tspan><tspan class="se-bold">dicots</tspan><tspan data-gap="" dx="0.44580"> </tspan>for<tspan data-gap="" dx="0.44580"> </tspan>short.<tspan data-gap="" dx="0.44580"> </tspan>Plants<tspan data-gap="" dx="0.44580"> </tspan>whose<tspan data-gap="" dx="0.44580"> </tspan>seeds<tspan data-gap="" dx="0.44580"> </tspan>have<tspan data-gap="" dx="0.44580"> </tspan>one<tspan data-gap="" dx="0.44580"> </tspan>cotyledon<tspan data-gap="" dx="0.44580"> </tspan>are</tspan><tspan x="89" dy="31">called <tspan class="se-bold">monocotyledons</tspan>, or <tspan class="se-bold">monocots</tspan>.</tspan></text></g>
