hor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-117" transform="translate(0 0)"><text class="se-copy" x="89" y="136"><tspan x="89">Now put all three findings together.</tspan></text></g>
<g class="v2-reading-block" data-block="source-17-7" transform="translate(0 0)"><text class="v2-table-caption" x="89" y="181.6"><tspan x="89">Comparing flowering plants — typical features</tspan></text><rect class="se-table-head" x="89" y="202" width="874" height="46"/><text class="v2-table-heading" x="103" y="235.07999999999998"><tspan x="103">Feature</tspan></text><text class="v2-table-heading" x="394.3333333333333" y="235.07999999999998"><tspan x="394.3333333333333">Dicots</tspan></text><text class="v2-table-heading" x="685.6666666666666" y="235.07999999999998"><tspan x="685.6666666666666">Monocots</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="248" y2="248"/><text class="se-copy se-table-copy" x="103" y="281.08"><tspan x="103">Cotyledons in the seed</tspan></text><text class="se-copy se-table-copy" x="394.3333333333333" y="281.08"><tspan x="394.3333333333333">Two</tspan></text><text class="se-copy se-table-copy" x="685.6666666666666" y="281.08"><tspan x="685.6666666666666">One</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="294" y2="294"/><text class="se-copy se-table-copy" x="103" y="327.08"><tspan x="103">Leaf venation</tspan></text><text class="se-copy se-table-copy" x="394.3333333333333" y="327.08"><tspan x="394.3333333333333">Reticulate</tspan></text><text class="se-copy se-table-copy" x="685.6666666666666" y="327.08"><tspan x="685.6666666666666">Parallel</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="340" y2="340"/><text class="se-copy se-table-copy" x="103" y="373.08"><tspan x="103">Roots</tspan></text><text class="se-copy se-table-copy" x="394.3333333333333" y="373.08"><tspan x="394.3333333333333">Taproot</tspan></text><text class="se-copy se-table-copy" x="685.6666666666666" y="373.08"><tspan x="685.6666666666666">Fibrous</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="386" y2="386"/><text class="se-copy se-table-copy" x="103" y="419.08"><tspan x="103">Examples</tspan></text><text class="se-copy se-table-copy" x="394.3333333333333" y="419.08"><tspan x="394.3333333333333">Chana, mustard, hibiscus,</tspan><tspan x="394.3333333333333" dy="28">mango</tspan></text><text class="se-copy se-table-copy" x="685.6666666666666" y="419.08"><tspan x="685.6666666666666">Wheat, maize, grass,</tspan><tspan x="685.6666666666666" dy="28">banana</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="460" y2="460"/><line class="v2-table-rule" x1="380.3333333333333" x2="380.3333333333333" y1="202" y2="460"/><line class="v2-table-rule" x1="671.6666666666666" x2="671.6666666666666" y1="202" y2="460"/><rect class="v2-table-frame" x="89" y="202" width="874" height="258"/></g>
<g class="v2-reading-block" data-block="reading-119" transform="translate(0 0)"><text class="se-copy" x="89" y="500"><tspan x="89">If seed anatomy identifies a plant as a monocot, you can predict that it is likely to</tspan><tspan x="89" dy="32">have parallel venation and fibrous roots. Check those features before claiming</tspan><tspan x="89" dy="32">the prediction is correct.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-120" transform="translate(0 0)"><text class="se-copy" x="89" y="612"><tspan x="89">Read across the cotyledon row to compare the two groups using the same</tspan><tspan x="89" dy="32">feature. Read down the monocot column to connect several features of that</tspan></text></g>
<g class="v2-reading-block" data-block="reading-121" transform="translate(0 0)"><text class="se-copy" x="89" y="676"><tspan x="89">group. Each direction answers a different question. The table summarises typical</tspan><tspan x="89" dy="32">patterns; it does not replace observations of the particular plant in front of you.</tspan></text></g>
<g class="v2-reading-block" data-block="source-17-9" transform="translate(0 0)"><rect class="se-prompt se-thought-panel" x="89" y="732" width="874" height="248"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="753" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="775">Think It Through</text></g><text class="se-copy" x="113" y="824"><tspan x="113">Suppose a leaf pattern is clear but the roots broke during handling. Record</tspan><tspan x="113" dy="32">venation as observed and root type as uncertain. Keep your prediction in a</tspan><tspan x="113" dy="32">separate column until you can inspect intact roots. What evidence would</tspan><tspan x="113" dy="32">confirm the root type? Why would writing the prediction as a result make the</tspan><tspan x="113" dy="32">table misleading?</tspan></text></g>
<g class="v2-reading-block" data-block="source-18-0" transform="translate(0 12)"><text class="se-heading" x="89" y="1030"><tspan x="89">2.2.2 Grouping Animals</tspan></text></g>
<g class="v2-reading-block" data-block="reading-124" transform="translate(0 12)"><text class="se-copy" x="89" y="1072"><tspan x="89">Animals vary as much as plants do. So the same question comes up. Which</tspan><tspan x="89" dy="32">feature should we use to group them?</tspan></text></g>
<g class="v2-reading-block" data-block="reading-125" transform="translate(0 12)"><text class="se-copy" x="89" y="1152"><tspan x="89">Colour or size may be useful for some questions. To compare movement, we</tspan><tspan x="89" dy="32">need to record how an animal moves and which body parts it uses.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-126" transform="translate(0 12)"><text class="se-copy" x="89" y="1232"><tspan x="89">Use your animal records as a starting point. Add observations from direct</tspan><tspan x="89" dy="32">watching or a reliable video, and identify which source you used.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">17</text></g></svg></div></div></section>
