r="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-6" transform="translate(0 -384)"><text class="v2-comparison-title" x="89" y="526"><tspan x="89">Reading this record</tspan></text><text class="se-copy" x="89" y="568" text-anchor="start">•</text><text class="se-copy" x="112" y="568"><tspan x="112">Read across: connect one plant with its recorded features.</tspan></text><text class="se-copy" x="89" y="608" text-anchor="start">•</text><text class="se-copy" x="112" y="608"><tspan x="112">Compare down: follow one feature across different plants.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648"><tspan x="112">Which differences would be hardest to show in a drawing?</tspan></text></g>
<g class="v2-reading-block" data-block="source-3-2" transform="translate(0 -384)"><image class="science-illustration" href="../../figures/class-6/science/ch02-v2/plants.png" x="89" y="674" width="874" height="290" preserveAspectRatio="xMidYMid meet"><title>Grass                         Tulsi                         Hibiscus</title></image><text class="se-caption" x="332.66666666666663" y="992" text-anchor="middle">Grass</text><text class="se-caption" x="526" y="992" text-anchor="middle">Tulsi</text><text class="se-caption" x="719.3333333333334" y="992" text-anchor="middle">Hibiscus</text></g>
<g class="v2-reading-block" data-block="reading-8" transform="translate(0 -384)"><text class="se-copy" x="89" y="1037"><tspan x="89">The pictures show the three plants named in Table 2.1. They are enlarged by</tspan><tspan x="89" dy="32">different amounts so you can see their features; do not use their printed heights</tspan><tspan x="89" dy="32">to compare their actual sizes.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-9" transform="translate(0 -384)"><text class="se-copy" x="89" y="1149"><tspan x="89">Were any two plants in your record alike in every feature you recorded? Would</tspan><tspan x="89" dy="32">that prove they were the same kind of plant? What else could you examine?</tspan></text></g>
<g class="v2-reading-block" data-block="source-4-0" transform="translate(0 709)"><text class="v2-table-caption" x="89" y="133.6"><tspan x="89">Table 2.2: Example animal records</tspan></text><rect class="se-table-head" x="89" y="154" width="874" height="74"/><text class="v2-table-heading" x="103" y="187.07999999999998"><tspan x="103">Name /</tspan><tspan x="103" dy="28">description</tspan></text><text class="v2-table-heading" x="279.4807692307693" y="187.07999999999998"><tspan x="279.4807692307693">Where you</tspan><tspan x="279.4807692307693" dy="28">saw it</tspan></text><text class="v2-table-heading" x="439.1538461538462" y="187.07999999999998"><tspan x="439.1538461538462">Doing / eating</tspan></text><text class="v2-table-heading" x="632.4423076923077" y="187.07999999999998"><tspan x="632.4423076923077">How it</tspan><tspan x="632.4423076923077" dy="28">moved</tspan></text><text class="v2-table-heading" x="792.1153846153846" y="187.07999999999998"><tspan x="792.1153846153846">Anything else</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="228" y2="228"/><text class="se-copy se-table-copy" x="103" y="261.08"><tspan x="103">Crow</tspan></text><text class="se-copy se-table-copy" x="279.4807692307693" y="261.08"><tspan x="279.4807692307693">On a wall,</tspan><tspan x="279.4807692307693" dy="28">then a tree</tspan></text><text class="se-copy se-table-copy" x="439.1538461538462" y="261.08"><tspan x="439.1538461538462">Pecking at</tspan><tspan x="439.1538461538462" dy="28">something</tspan></text><text class="se-copy se-table-copy" x="632.4423076923077" y="261.08"><tspan x="632.4423076923077">Walks, then</tspan><tspan x="632.4423076923077" dy="28">flies</tspan></text><text class="se-copy se-table-copy" x="792.1153846153846" y="261.08"><tspan x="792.1153846153846">Carried a twig</tspan><tspan x="792.1153846153846" dy="28">away</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="302" y2="302"/><text class="se-copy se-table-copy" x="103" y="335.08"><tspan x="103">Ant</tspan></text><text class="se-copy se-table-copy" x="279.4807692307693" y="335.08"><tspan x="279.4807692307693">Along the</tspan><tspan x="279.4807692307693" dy="28">edge of a</tspan><tspan x="279.4807692307693" dy="28">step</tspan></text><text class="se-copy se-table-copy" x="439.1538461538462" y="335.08"><tspan x="439.1538461538462">Carrying a</tspan><tspan x="439.1538461538462" dy="28">crumb</tspan></text><text class="se-copy se-table-copy" x="632.4423076923077" y="335.08"><tspan x="632.4423076923077">Walks</tspan></text><text class="se-copy se-table-copy" x="792.1153846153846" y="335.08"><tspan x="792.1153846153846">Six legs;</tspan><tspan x="792.1153846153846" dy="28">followed the</tspan><tspan x="792.1153846153846" dy="28">ant in front</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="404" y2="404"/><line class="v2-table-rule" x1="265.4807692307693" x2="265.4807692307693" y1="154" y2="404"/><line class="v2-table-rule" x1="425.1538461538462" x2="425.1538461538462" y1="154" y2="404"/><line class="v2-table-rule" x1="618.4423076923077" x2="618.4423076923077" y1="154" y2="404"/><line class="v2-table-rule" x1="778.1153846153846" x2="778.1153846153846" y1="154" y2="404"/><rect class="v2-table-frame" x="89" y="154" width="874" height="250"/><text class="v2-table-note" x="89" y="436.88"><tspan x="89">— means not recorded; it does not mean absent.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-11" transform="translate(0 709)"><text class="se-copy" x="89" y="476"><tspan x="89">A moving animal may disappear before you finish recording it. Try watching</tspan><tspan x="89" dy="32">from one place as well as walking slowly. Which method helped you find which</tspan><tspan x="89" dy="32">animals?</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
