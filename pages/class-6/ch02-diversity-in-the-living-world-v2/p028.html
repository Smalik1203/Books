hor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-10" transform="translate(0 0)"><text class="se-copy" x="89" y="136"><tspan x="89">6. Look at the two goats below. Write two ways they are alike and two ways they</tspan><tspan x="89" dy="32">are different. For each difference, say what conditions might explain it.</tspan></text></g>
<g class="v2-reading-block" data-block="source-28-1" transform="translate(0 0)"><image class="science-illustration" href="../../figures/class-6/science/ch02-v2/goats.png" x="89" y="192" width="874" height="245" preserveAspectRatio="xMidYMid meet"><title>(a) Mountain goat                              (b) Goat of the plains</title></image><text class="se-caption" x="403.5" y="465" text-anchor="middle">(a) Mountain goat</text><text class="se-caption" x="648.5" y="465" text-anchor="middle">(b) Goat of the plains</text></g>
<g class="v2-reading-block" data-block="reading-12" transform="translate(0 0)"><text class="se-copy" x="89" y="510"><tspan x="89">7. Work through this flowchart. For leaves known to have either a reticulate or a</tspan><tspan x="89" dy="32">parallel pattern, what groups do A and B represent? Where would you put an</tspan><tspan x="89" dy="32">unclear specimen while you investigate further?</tspan></text></g>
<g class="v2-reading-block" data-block="source-28-3" transform="translate(0 0)"><rect class="se-process" x="319" y="606" width="414" height="55" rx="10"/><text class="se-caption" x="526" y="640" text-anchor="middle">Reticulate venation?</text><path class="se-accent" d="M430 661v49H350v40m-5 -6 5 6 5 -6M622 661v49h80v40m-5 -6 5 6 5 -6"/><text class="se-caption" x="400" y="695" text-anchor="start">Yes</text><text class="se-caption" x="647" y="695" text-anchor="start">No</text><text class="se-heading" x="350" y="780" text-anchor="middle">A</text><text class="se-heading" x="702" y="780" text-anchor="middle">B</text></g>
<g class="v2-reading-block" data-block="reading-14" transform="translate(0 0)"><text class="se-copy" x="89" y="827"><tspan x="89">8. One student says a hibiscus is a shrub. Another student disagrees. What three</tspan><tspan x="89" dy="32">questions should they ask about the plant to settle it? What observations would</tspan></text></g>
<g class="v2-reading-block" data-block="reading-15" transform="translate(0 0)"><text class="se-copy" x="89" y="891"><tspan x="89">support calling it a shrub, and what observations would challenge that</tspan><tspan x="89" dy="32">description?</tspan></text></g>
<g class="v2-reading-block" data-block="reading-16" transform="translate(0 0)"><text class="se-copy" x="89" y="971"><tspan x="89">9. A plant grows on an open, windy hilltop. It is short, with small tough leaves.</tspan><tspan x="89" dy="32">The same kind of plant grows in a sheltered valley below. There it is twice as tall,</tspan></text></g>
<g class="v2-reading-block" data-block="reading-17" transform="translate(0 0)"><text class="se-copy" x="89" y="1035"><tspan x="89">with bigger leaves. Suggest how wind and shelter could affect its growth. Explain</tspan><tspan x="89" dy="32">why this observation alone does not prove that a new inherited <tspan class="se-italic">adaptation</tspan> has</tspan><tspan x="89" dy="32">developed.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-18" transform="translate(0 0)"><text class="se-copy" x="89" y="1147"><tspan x="89">Plan a comparison using several plants of the same kind in each place. Name two</tspan><tspan x="89" dy="32">conditions besides wind that you would record. Explain why a single tall plant</tspan></text></g>
<g class="v2-reading-block" data-block="reading-19" transform="translate(0 0)"><text class="se-copy" x="89" y="1211"><tspan x="89">and a single short plant would be weaker evidence than a repeated pattern across</tspan><tspan x="89" dy="32">many similar-aged plants.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">28</text></g></svg></div></div></section>
