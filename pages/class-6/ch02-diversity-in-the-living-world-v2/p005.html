<section class="page page--food page--science-editorial page--science-v2" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g transform="translate(-148 3) scale(.2)"><g class="v2-ribbon__motif" transform="translate(0 0)" aria-hidden="true"><path class="v2-ribbon__stem" d="M1005 35C930 117 932 200 1018 275"/><path class="v2-ribbon__leaves" d="M994.33 47.31C1005.31 49.71 1020.98 36.37 1024 20C1011.75 25.15 996.71 35.6 994.33 47.31Z M978.05 69.47C992.62 77.79 1025.12 66.86 1041 46C1019.28 47.37 989.73 54.66 978.05 69.47Z M963.3 96.55C965.95 76.92 940.73 53.11 912 52C922.59 71.93 942.72 95.37 963.3 96.55Z M954.26 123.53C973.15 135.98 1017.32 123.91 1040 97C1010.89 97.06 970.91 104.46 954.26 123.53Z M951.06 147.92C949.72 125.2 916.83 105.4 885 112C900.96 131.44 928.18 152.21 951.06 147.92Z M953.1 174.53C970.15 189.5 1011.77 181.61 1034 156C1006.91 152.97 969.39 156.43 953.1 174.53Z M961.02 200.84C956.66 180.93 925.52 168.87 899 180C915.5 194.56 941.9 208.44 961.02 200.84Z M974.87 226.77C987.64 240.88 1022.05 237.75 1042 218C1020.2 213.13 989.44 212.87 974.87 226.77Z M990.66 247.67C986.1 232.61 959.09 222.53 937 230C951.66 241.46 974.71 252.74 990.66 247.67Z"/><path class="v2-ribbon__veins" d="M996.11 45.67Q1008.04 36.59 1021.07 23.37 M981.82 68.07Q1005.8 61.22 1034.32 49.24 M960.22 93.87Q942.89 75.49 918.23 56.22 M959.41 121.94Q991.92 114.66 1030.85 100.83 M947.1 145.76Q924.06 129.89 892.77 115.03 M957.95 173.42Q988.51 169.29 1025.32 159.01 M957.29 199.59Q935.2 189.36 906.12 181.39 M978.9 226.25Q1004.04 225.36 1034.73 219.81 M987.44 246.61Q968.2 238.21 943.12 231.28"/></g></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-22" transform="translate(0 -638)"><text class="se-copy" x="89" y="774"><tspan x="89">Removing a tree can remove shade, nest sites and a source of fallen leaves. The</tspan><tspan x="89" dy="32">effects depend on which organisms use it and what other resources are available</tspan><tspan x="89" dy="32">nearby.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-23" transform="translate(0 -638)"><text class="se-copy" x="89" y="886"><tspan x="89">An arrow labelled “shelter” from a tree to a bird describes what the tree provides.</tspan><tspan x="89" dy="32">It does not mean that the bird shelters the tree in return. If you want to show</tspan></text></g>
<g class="v2-reading-block" data-block="reading-24" transform="translate(0 -638)"><text class="se-copy" x="89" y="950"><tspan x="89">another relationship, draw another labelled arrow. One pair of living things may</tspan><tspan x="89" dy="32">be connected in several ways.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-25" transform="translate(0 256)"><text class="se-copy" x="89" y="136"><tspan x="89">Draw one recorded plant or animal in your notebook. Connect it to other living</tspan><tspan x="89" dy="32">things with arrows labelled “food”, “shelter” or another relationship. Mark each</tspan></text></g>
<g class="v2-reading-block" data-block="reading-26" transform="translate(0 256)"><text class="se-copy" x="89" y="200"><tspan x="89">link as observed, read about or a guess. With a partner, choose an uncertain link</tspan><tspan x="89" dy="32">and plan how to check it. If one organism disappeared, which links would break?</tspan></text></g>
<g class="v2-reading-block" data-block="reading-27" transform="translate(0 256)"><text class="se-copy" x="89" y="264"><tspan x="89">Could another supply the same resource? Separate what you know from what you</tspan><tspan x="89" dy="32">need to find out.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-28" transform="translate(0 476)"><text class="v2-title" x="89" y="150"><tspan x="89">2.2 Making Sense of the Variety</tspan></text></g>
<g class="v2-reading-block" data-block="reading-29" transform="translate(0 476)"><text class="se-copy" x="89" y="194"><tspan x="89">Your records may contain many kinds of living things. Grouping them can help</tspan><tspan x="89" dy="32">you compare a feature without searching through every entry.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-30" transform="translate(0 476)"><text class="se-copy" x="89" y="274"><tspan x="89">A shop groups pens together to help you find a pen. Grouping goods by price</tspan><tspan x="89" dy="32">answers another question: what can I afford?</tspan></text></g>
<g class="v2-reading-block" data-block="reading-31" transform="translate(0 476)"><text class="se-copy" x="89" y="354"><tspan x="89">Scientists do the same with living things. Putting things into groups by the</tspan><tspan x="89" dy="32">features they share is called <tspan class="se-bold">grouping</tspan>.</tspan></text></g>
<g class="v2-reading-block" data-block="source-6-4" transform="translate(0 476)"><rect class="se-activity-panel" x="89" y="410" width="874" height="417" rx="18"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="431" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="453">Investigate</text></g><text class="se-copy" x="113" y="499"><tspan x="113">You will need: old magazines or newspapers, scissors, glue, small cards.</tspan></text><text class="se-activity-step" x="128" y="542" text-anchor="end">1.</text><text class="se-copy" x="146" y="543"><tspan x="146">Cut out plant and animal pictures. Paste one per card; make at least thirty</tspan><tspan x="146" dy="32">cards as a class.</tspan></text><text class="se-activity-step" x="128" y="618" text-anchor="end">2.</text><text class="se-copy" x="146" y="619"><tspan x="146">In groups of five or six, pool your cards.</tspan></text><text class="se-activity-step" x="128" y="662" text-anchor="end">3.</text><text class="se-copy" x="146" y="663"><tspan x="146">Sort the cards into groups of your choice.</tspan></text><text class="se-activity-step" x="128" y="706" text-anchor="end">4.</text><text class="se-copy" x="146" y="707"><tspan x="146">Write down, in one line, the rule you used.</tspan></text><text class="se-activity-step" x="128" y="750" text-anchor="end">5.</text><text class="se-copy" x="146" y="751"><tspan x="146">Mix the cards and sort again using a completely different rule.</tspan></text><text class="se-copy" x="113" y="795"><tspan x="113">Safety: Use scissors carefully, with your teacher’s guidance.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEA
