<g class="v2-reading-block" transform="translate(0 -649)"><text class="se-copy" data-measure="874" x="89" y="894"><tspan x="89">Some<tspan data-gap="" dx="2.20264"> </tspan>living<tspan data-gap="" dx="2.20264"> </tspan>things<tspan data-gap="" dx="2.20264"> </tspan>occur<tspan data-gap="" dx="2.20264"> </tspan>in<tspan data-gap="" dx="2.20264"> </tspan>several<tspan data-gap="" dx="2.20264"> </tspan>surroundings;<tspan data-gap="" dx="2.20264"> </tspan>others<tspan data-gap="" dx="2.20264"> </tspan>have<tspan data-gap="" dx="2.20264"> </tspan>a<tspan data-gap="" dx="2.20264"> </tspan>much<tspan data-gap="" dx="2.20264"> </tspan>narrower</tspan><tspan x="89" dy="31">range.<tspan data-gap="" dx="0.10937"> </tspan>Compare<tspan data-gap="" dx="0.10937"> </tspan>the<tspan data-gap="" dx="0.10937"> </tspan>conditions<tspan data-gap="" dx="0.10937"> </tspan>in<tspan data-gap="" dx="0.10937"> </tspan>each<tspan data-gap="" dx="0.10937"> </tspan>column.<tspan data-gap="" dx="0.10937"> </tspan>The<tspan data-gap="" dx="0.10937"> </tspan>features<tspan data-gap="" dx="0.10937"> </tspan>of<tspan data-gap="" dx="0.10937"> </tspan>a<tspan data-gap="" dx="0.10937"> </tspan>living<tspan data-gap="" dx="0.10937"> </tspan>thing<tspan data-gap="" dx="0.10937"> </tspan>help</tspan><tspan x="89" dy="31">explain where it can survive.</tspan></text></g>

<text class="se-caption" x="308" y="576" text-anchor="middle">Cactus · hot desert</text>
<text class="se-caption" x="744" y="576" text-anchor="middle">Deodar · cold mountain</text></g>
<g class="v2-reading-block" transform="translate(0 220)"><text class="se-copy" x="89" y="626"><tspan x="89">Look at a plant from a hot desert.</tspan></text>
<text class="se-copy" x="89" y="674"><tspan x="89">Consider a cactus adapted to a hot, dry</tspan><tspan x="89" dy="32">habitat. Its fleshy stem stores water</tspan><tspan x="89" dy="32">and its waxy surface reduces water</tspan><tspan x="89" dy="32">loss. In many cacti, leaves are reduced</tspan><tspan x="89" dy="32">to spines and the green stem carries</tspan><tspan x="89" dy="32">out photosynthesis.</tspan></text>
<text class="se-copy" x="542" y="626"><tspan x="542">Now look at a deodar tree, high in the</tspan><tspan x="542" dy="32">Himalayas.</tspan></text>
<text class="se-copy" x="542" y="706"><tspan x="542">On snowy mountain slopes, snow can</tspan><tspan x="542" dy="32">load branches heavily. The conical</tspan><tspan x="542" dy="32">form and sloping branches of a deodar</tspan><tspan x="542" dy="32">can help shed snow. Temperature, soil</tspan><tspan x="542" dy="32">and water also affect where a tree can</tspan><tspan x="542" dy="32">grow.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 220)"><line class="v2-rule" x1="89" x2="963" y1="902" y2="902"/></g>
<g class="v2-reading-block" transform="translate(0 220)"><text class="se-copy" data-measure="874" x="89" y="950"><tspan x="89">These<tspan data-gap="" dx="1.70801"> </tspan>features<tspan data-gap="" dx="1.70801"> </tspan>were<tspan data-gap="" dx="1.70801"> </tspan>not<tspan data-gap="" dx="1.70801"> </tspan>chosen<tspan data-gap="" dx="1.70801"> </tspan>by<tspan data-gap="" dx="1.70801"> </tspan>individual<tspan data-gap="" dx="1.70801"> </tspan>plants.<tspan data-gap="" dx="1.70801"> </tspan>They<tspan data-gap="" dx="1.70801"> </tspan>are<tspan data-gap="" dx="1.70801"> </tspan>inherited<tspan data-gap="" dx="1.70801"> </tspan>features</tspan><tspan x="89" dy="32">found<tspan data-gap="" dx="4.75981"> </tspan>in<tspan data-gap="" dx="4.75981"> </tspan>populations<tspan data-gap="" dx="4.75981"> </tspan>living<tspan data-gap="" dx="4.75981"> </tspan>in<tspan data-gap="" dx="4.75981"> </tspan>particular<tspan data-gap="" dx="4.75981"> </tspan>conditions.<tspan data-gap="" dx="4.75981"> </tspan>Other<tspan data-gap="" dx="4.75981"> </tspan>plants<tspan data-gap="" dx="4.75981"> </tspan>may<tspan data-gap="" dx="4.75981"> </tspan>survive</tspan><tspan x="89" dy="32">there using different features.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1465H915Q900 1465 892 1480L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1465H935Q920 1465 912 1480L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1499" text-anchor="middle">21</text></g></svg></div></div></section>
