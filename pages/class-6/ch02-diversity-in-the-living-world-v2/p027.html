hor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-0" transform="translate(0 0)"><text class="v2-title" x="89" y="150"><tspan x="89">Let Us Enhance Our Learning</tspan></text></g>
<g class="v2-reading-block" data-block="reading-1" transform="translate(0 0)"><text class="se-copy" x="89" y="194"><tspan x="89">1. Here are two seeds — a wheat grain and a kidney bean. Use what you know</tspan><tspan x="89" dy="32">about these flowering plants to predict their root type and venation. State what</tspan><tspan x="89" dy="32">evidence supports the prediction and how you could check it.</tspan></text></g>
<g class="v2-reading-block" data-block="source-27-2" transform="translate(0 0)"><image class="science-illustration" href="../../figures/class-6/science/ch02-v2/grains.png" x="89" y="282" width="874" height="185" preserveAspectRatio="xMidYMid meet"><title>(a) Wheat grains                              (b) Kidney beans</title></image><text class="se-caption" x="433.5" y="495" text-anchor="middle">(a) Wheat grains</text><text class="se-caption" x="618.5" y="495" text-anchor="middle">(b) Kidney beans</text></g>
<g class="v2-reading-block" data-block="reading-3" transform="translate(0 0)"><text class="se-copy" x="89" y="540"><tspan x="89">2. Sort these animals by habitat. Draw the diagram in your notebook. Put the</tspan><tspan x="89" dy="32">aquatic ones in region A, the terrestrial ones in region B, and any that use both in</tspan><tspan x="89" dy="32">the middle part, C.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-4" transform="translate(0 0)"><text class="se-copy" x="89" y="652"><tspan x="89">Horse · Dolphin · Frog · Sheep · Crocodile · Squirrel · Whale · Earthworm · Pigeon</tspan><tspan x="89" dy="32">· Tortoise</tspan></text></g>
<g class="v2-reading-block" data-block="source-27-5" transform="translate(0 0)"><ellipse class="se-accent" cx="436" cy="808" rx="150" ry="84"/><ellipse class="se-accent" cx="616" cy="808" rx="150" ry="84"/><text class="se-heading" x="374" y="814" text-anchor="middle">A</text><text class="se-heading" x="526" y="814" text-anchor="middle">C</text><text class="se-heading" x="677" y="814" text-anchor="middle">B</text><text class="se-caption" x="365" y="915" text-anchor="middle">Water</text><text class="se-caption" x="686" y="915" text-anchor="middle">Land</text></g>
<g class="v2-reading-block" data-block="reading-6" transform="translate(0 0)"><text class="se-copy" x="89" y="952"><tspan x="89">3. A radish is pulled out of a kitchen garden. Examine one. What kind of root is</tspan><tspan x="89" dy="32">it? Now predict the venation of a radish leaf. Then check whether you were right.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-7" transform="translate(0 0)"><text class="se-copy" x="89" y="1032"><tspan x="89">4. A shopkeeper arranges her stock by price. A customer who wants a birthday</tspan><tspan x="89" dy="32">gift finds this arrangement unhelpful. Neither of them is wrong. Explain why,</tspan><tspan x="89" dy="32">using what you learnt about grouping.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-8" transform="translate(0 0)"><text class="se-copy" x="89" y="1144"><tspan x="89">5. Sort these animals into two groups, using any feature <tspan class="se-italic">not</tspan> used in this chapter</tspan><tspan x="89" dy="32">— cow, cockroach, pigeon, bat, tortoise, whale, fish, grasshopper, lizard. Write</tspan><tspan x="89" dy="32">your rule clearly.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-9" transform="translate(0 0)"><text class="se-copy" x="89" y="1256"><tspan x="89">Ask a partner to apply your rule without seeing your list. Compare the results and</tspan><tspan x="89" dy="32">clarify any ambiguous wording or missing feature. The groups do not have to</tspan><tspan x="89" dy="32">contain equal numbers of animals.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">27</text></g></svg></div></div></section>
