r="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-43" transform="translate(0 0)"><text class="se-heading" x="89" y="142"><tspan x="89">2.2.1 Grouping Plants</tspan></text></g>
<g class="v2-reading-block" data-block="reading-44" transform="translate(0 0)"><text class="se-copy" x="89" y="184"><tspan x="89">Look at Table 2.1 again. The features you wrote there — stem, leaves, flowers —</tspan><tspan x="89" dy="32">are the same features we can use to sort plants.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-45" transform="translate(0 0)"><text class="se-copy" x="89" y="264"><tspan x="89">Begin with stems: their firmness, whether they are woody, and where they</tspan><tspan x="89" dy="32">branch. Examine plants your teacher says are safe to handle.</tspan></text></g>
<g class="v2-reading-block" data-block="source-8-3" transform="translate(0 0)"><rect class="se-activity-panel" x="89" y="320" width="874" height="437" rx="18"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="341" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="363">Investigate</text></g><text class="se-activity-step" x="128" y="408" text-anchor="end">1.</text><text class="se-copy" x="146" y="409"><tspan x="146">Go out to the same place as before. Choose six plants of clearly different</tspan><tspan x="146" dy="32">sizes.</tspan></text><text class="se-activity-step" x="128" y="484" text-anchor="end">2.</text><text class="se-copy" x="146" y="485"><tspan x="146">Stand next to each one. Is it shorter than you, about your height, or taller?</tspan></text><text class="se-activity-step" x="128" y="528" text-anchor="end">3.</text><text class="se-copy" x="146" y="529"><tspan x="146">Look at the stem near the ground. Is it green or brown?</tspan></text><text class="se-activity-step" x="128" y="572" text-anchor="end">4.</text><text class="se-copy" x="146" y="573"><tspan x="146">Bend the stem very gently with one finger. Does it bend, or is it stiff? Stop</tspan><tspan x="146" dy="32">as soon as you feel it resist. A broken stem can kill the plant.</tspan></text><text class="se-activity-step" x="128" y="648" text-anchor="end">5.</text><text class="se-copy" x="146" y="649"><tspan x="146">See where the branches start. Near the ground, or higher up?</tspan></text><text class="se-activity-step" x="128" y="692" text-anchor="end">6.</text><text class="se-copy" x="146" y="693"><tspan x="146">Record these features using the headings in Table 2.3. Group your plants</tspan><tspan x="146" dy="32">by shared stem features and explain your rule.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-47" transform="translate(0 0)"><text class="se-copy" x="89" y="815"><tspan x="89">Did height and stem features give you the same groups? Which plants were</tspan><tspan x="89" dy="32">difficult to place?</tspan></text></g>

<g class="v2-reading-block" data-block="reading-49" transform="translate(0 1085)"><text class="se-copy" x="89" y="136"><tspan x="89">Compare your records with the descriptions below. Your sample may not contain</tspan><tspan x="89" dy="32">all three forms, and young or pruned plants may be harder to classify.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
