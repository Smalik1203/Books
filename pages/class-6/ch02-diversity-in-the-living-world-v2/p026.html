<section class="page page--food page--science-editorial page--science-v2" data-folio="26"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 26"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="v2-ribbon-stem" d="M31 63Q34 30 60 7"/><path class="v2-ribbon-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="154"><tspan x="89">Keywords</tspan></text>
<rect class="se-glossary-panel" x="89" y="190" width="874" height="1178" rx="20"/><text class="se-copy" x="113" y="239"><tspan x="113"><tspan class="se-bold">Adaptation</tspan> — An inherited feature</tspan><tspan x="113" dy="32">that helps an organism survive and</tspan><tspan x="113" dy="32">reproduce in its usual environment.</tspan></text><text class="se-copy" x="113" y="347"><tspan x="113"><tspan class="se-bold">Amphibian</tspan> — An animal belonging</tspan><tspan x="113" dy="32">to the group that includes frogs and</tspan><tspan x="113" dy="32">toads; many use water and land</tspan><tspan x="113" dy="32">during their lives.</tspan></text><text class="se-copy" x="113" y="487"><tspan x="113"><tspan class="se-bold">Aquatic</tspan> — Living in water, or</tspan><tspan x="113" dy="32">describing a habitat in water.</tspan></text><text class="se-copy" x="113" y="563"><tspan x="113"><tspan class="se-bold">Biodiversity</tspan> — The variety of living</tspan><tspan x="113" dy="32">things found in a region.</tspan></text><text class="se-copy" x="113" y="639"><tspan x="113"><tspan class="se-bold">Climber</tspan> — A plant that grows</tspan><tspan x="113" dy="32">upwards using external support.</tspan></text><text class="se-copy" x="113" y="715"><tspan x="113"><tspan class="se-bold">Cotyledon</tspan> — A seed leaf that is part</tspan><tspan x="113" dy="32">of the embryo inside a seed.</tspan></text><text class="se-copy" x="113" y="791"><tspan x="113"><tspan class="se-bold">Creeper</tspan> — A plant with stems that</tspan><tspan x="113" dy="32">trail along the ground.</tspan></text><text class="se-copy" x="113" y="867"><tspan x="113"><tspan class="se-bold">Dicot</tspan> — A flowering plant whose</tspan><tspan x="113" dy="32">seed has two cotyledons.</tspan></text><text class="se-copy" x="113" y="943"><tspan x="113"><tspan class="se-bold">Endosperm</tspan> — Food-storing tissue in</tspan><tspan x="113" dy="32">a seed that nourishes the developing</tspan><tspan x="113" dy="32">embryo.</tspan></text><text class="se-copy" x="113" y="1051"><tspan x="113"><tspan class="se-bold">Fibrous</tspan> <tspan class="se-bold">root</tspan> <tspan class="se-bold">system</tspan> — A spreading</tspan><tspan x="113" dy="32">bunch of roots without one</tspan><tspan x="113" dy="32">dominant main root.</tspan></text><text class="se-copy" x="113" y="1159"><tspan x="113"><tspan class="se-bold">Grouping</tspan> — Arranging things by</tspan><tspan x="113" dy="32">features they share, using a stated</tspan><tspan x="113" dy="32">rule.</tspan></text><text class="se-copy" x="113" y="1267"><tspan x="113"><tspan class="se-bold">Habitat</tspan> — The place where an</tspan><tspan x="113" dy="32">organism lives, including its</tspan><tspan x="113" dy="32">conditions and resources.</tspan></text><text class="se-copy" x="541" y="239"><tspan x="541"><tspan class="se-bold">Herb</tspan> — A plant with soft, non-woody</tspan><tspan x="541" dy="32">stems; it need not be small.</tspan></text><text class="se-copy" x="541" y="315"><tspan x="541"><tspan class="se-bold">Monocot</tspan> — A flowering plant whose</tspan><tspan x="541" dy="32">seed has one cotyledon.</tspan></text><text class="se-copy" x="541" y="391"><tspan x="541"><tspan class="se-bold">Parallel</tspan> <tspan class="se-bold">venation</tspan> — A leaf-vein</tspan><tspan x="541" dy="32">pattern in which many veins run</tspan><tspan x="541" dy="32">alongside one another.</tspan></text><text class="se-copy" x="541" y="499"><tspan x="541"><tspan class="se-bold">Pseudostem</tspan> — A trunk-like structure</tspan><tspan x="541" dy="32">formed by overlapping leaf bases, as</tspan><tspan x="541" dy="32">in banana.</tspan></text><text class="se-copy" x="541" y="607"><tspan x="541"><tspan class="se-bold">Reticulate</tspan> <tspan class="se-bold">venation</tspan> — A leaf-vein</tspan><tspan x="541" dy="32">pattern in which veins branch and</tspan><tspan x="541" dy="32">join to form a network.</tspan></text><text class="se-copy" x="541" y="715"><tspan x="541"><tspan class="se-bold">Sacred</tspan> <tspan class="se-bold">grove</tspan> — A patch of</tspan><tspan x="541" dy="32">vegetation protected through local</tspan><tspan x="541" dy="32">cultural or religious traditions.</tspan></text><text class="se-copy" x="541" y="823"><tspan x="541"><tspan class="se-bold">Shrub</tspan> — A woody plant that usually</tspan><tspan x="541" dy="32">branches near the ground, often with</tspan><tspan x="541" dy="32">several main stems.</tspan></text><text class="se-copy" x="541" y="931"><tspan x="541"><tspan class="se-bold">Taproot</tspan> — The main root of a root</tspan><tspan x="541" dy="32">system, with smaller roots branching</tspan><tspan x="541" dy="32">from it.</tspan></text><text class="se-copy" x="541" y="1039"><tspan x="541"><tspan class="se-bold">Terrestrial</tspan> — Living on land, or</tspan><tspan x="541" dy="32">describing a habitat on land.</tspan></text><text class="se-copy" x="541" y="1115"><tspan x="541"><tspan class="se-bold">Tree</tspan> — A woody plant that usually</tspan><tspan x="541" dy="32">develops a main trunk supporting a</tspan><tspan x="541" dy="32">crown of branches.</tspan></text><text class="se-copy" x="541" y="1223"><tspan x="541"><tspan class="se-bold">Venation</tspan> — The pattern of veins in a</tspan><tspan x="541" dy="32">leaf.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1465H137Q152 1465 160 1480L179 1514H0Z"/><path class="v2-ribbon" d="M0 1465H117Q132 1465 140 1480L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1499" text-anchor="middle">26</text></g></svg></div></div></section>
