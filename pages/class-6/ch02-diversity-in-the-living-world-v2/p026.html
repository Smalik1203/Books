<section class="page page--food page--science-editorial page--science-v2" data-folio="26"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 26"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g transform="translate(-148 3) scale(.2)"><g class="v2-ribbon__motif" transform="translate(0 0)" aria-hidden="true"><path class="v2-ribbon__stem" d="M1005 35C930 117 932 200 1018 275"/><path class="v2-ribbon__leaves" d="M994.33 47.31C1005.31 49.71 1020.98 36.37 1024 20C1011.75 25.15 996.71 35.6 994.33 47.31Z M978.05 69.47C992.62 77.79 1025.12 66.86 1041 46C1019.28 47.37 989.73 54.66 978.05 69.47Z M963.3 96.55C965.95 76.92 940.73 53.11 912 52C922.59 71.93 942.72 95.37 963.3 96.55Z M954.26 123.53C973.15 135.98 1017.32 123.91 1040 97C1010.89 97.06 970.91 104.46 954.26 123.53Z M951.06 147.92C949.72 125.2 916.83 105.4 885 112C900.96 131.44 928.18 152.21 951.06 147.92Z M953.1 174.53C970.15 189.5 1011.77 181.61 1034 156C1006.91 152.97 969.39 156.43 953.1 174.53Z M961.02 200.84C956.66 180.93 925.52 168.87 899 180C915.5 194.56 941.9 208.44 961.02 200.84Z M974.87 226.77C987.64 240.88 1022.05 237.75 1042 218C1020.2 213.13 989.44 212.87 974.87 226.77Z M990.66 247.67C986.1 232.61 959.09 222.53 937 230C951.66 241.46 974.71 252.74 990.66 247.67Z"/><path class="v2-ribbon__veins" d="M996.11 45.67Q1008.04 36.59 1021.07 23.37 M981.82 68.07Q1005.8 61.22 1034.32 49.24 M960.22 93.87Q942.89 75.49 918.23 56.22 M959.41 121.94Q991.92 114.66 1030.85 100.83 M947.1 145.76Q924.06 129.89 892.77 115.03 M957.95 173.42Q988.51 169.29 1025.32 159.01 M957.29 199.59Q935.2 189.36 906.12 181.39 M978.9 226.25Q1004.04 225.36 1034.73 219.81 M987.44 246.61Q968.2 238.21 943.12 231.28"/></g></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150"><tspan x="89">Summary</tspan></text>
<text class="se-copy" x="89" y="194" text-anchor="start">•</text><text class="se-copy" x="112" y="194"><tspan x="112">The variety of living things found in a region is called its biodiversity. Even an</tspan><tspan x="112" dy="32">ordinary place has much more of it than a quick look suggests.</tspan></text>
<text class="se-copy" x="89" y="274" text-anchor="start">•</text><text class="se-copy" x="112" y="274"><tspan x="112">Living things in a place depend on each other for food, shelter and other</tspan><tspan x="112" dy="32">needs.</tspan></text>
<text class="se-copy" x="89" y="354" text-anchor="start">•</text><text class="se-copy" x="112" y="354"><tspan x="112">Grouping means arranging things by the features they share. Different rules</tspan><tspan x="112" dy="32">answer different questions; each must be applied consistently.</tspan></text>
<text class="se-copy" x="89" y="434" text-anchor="start">•</text><text class="se-copy" x="112" y="434"><tspan x="112">Woody stems and branching help distinguish trees and shrubs from</tspan><tspan x="112" dy="32">non-woody herbs. Climbing and trailing describe growth habits, which can</tspan><tspan x="112" dy="32">overlap with these descriptions.</tspan></text>
<text class="se-copy" x="89" y="546" text-anchor="start">•</text><text class="se-copy" x="112" y="546"><tspan x="112">The pattern of veins in a leaf is called venation. Two common patterns are</tspan><tspan x="112" dy="32">reticulate and parallel.</tspan></text>
<text class="se-copy" x="89" y="626" text-anchor="start">•</text><text class="se-copy" x="112" y="626"><tspan x="112">Two common root systems are taproot and fibrous root systems. A taproot has</tspan><tspan x="112" dy="32">one main root. Fibrous roots form a spreading bunch.</tspan></text>
<text class="se-copy" x="89" y="706" text-anchor="start">•</text><text class="se-copy" x="112" y="706"><tspan x="112">Among flowering plants, dicots have two cotyledons and monocots have one.</tspan></text>
<text class="se-copy" x="89" y="754" text-anchor="start">•</text><text class="se-copy" x="112" y="754"><tspan x="112">These three features go together. Dicots generally have reticulate venation and</tspan><tspan x="112" dy="32">a taproot. Monocots generally have parallel venation and fibrous roots. These</tspan><tspan x="112" dy="32">associations support predictions that must be checked.</tspan></text>
<text class="se-copy" x="89" y="866" text-anchor="start">•</text><text class="se-copy" x="112" y="866"><tspan x="112">Animals can be grouped by how they move and which body parts they use.</tspan><tspan x="112" dy="32">They can also be grouped in many other ways.</tspan></text>
<text class="se-copy" x="89" y="946" text-anchor="start">•</text><text class="se-copy" x="112" y="946"><tspan x="112">Adaptations are inherited features that help organisms survive and reproduce.</tspan><tspan x="112" dy="32">They develop in populations over generations, not because an individual tries</tspan><tspan x="112" dy="32">to change.</tspan></text>
<text class="se-copy" x="89" y="1058" text-anchor="start">•</text><text class="se-copy" x="112" y="1058"><tspan x="112">The place where a living thing lives is its habitat. Habitats are terrestrial or</tspan><tspan x="112" dy="32">aquatic. Many amphibians use both land and water, but not all animals that do</tspan><tspan x="112" dy="32">so are amphibians.</tspan></text>
<text class="se-copy" x="89" y="1170" text-anchor="start">•</text><text class="se-copy" x="112" y="1170"><tspan x="112">Damage to habitats causes loss of biodiversity. This is why habitats are</tspan><tspan x="112" dy="32">protected — by governments, and by communities.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">26</text></g></svg></div></div></section>
