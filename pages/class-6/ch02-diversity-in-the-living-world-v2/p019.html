hor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-133" transform="translate(0 -80)"><text class="se-copy" x="89" y="216"><tspan x="89">Different animals may move alike using similar body parts: a housefly and a</tspan><tspan x="89" dy="32">pigeon both fly with wings. A fish and a dolphin look alike in water, although a</tspan><tspan x="89" dy="32">dolphin is not a fish.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-134" transform="translate(0 -80)"><text class="se-copy" x="89" y="328"><tspan x="89">A record can belong in both “uses legs” and “uses wings”. If a class observed four</tspan><tspan x="89" dy="32">animals, the two groups might contain six entries because two animals appear in</tspan></text></g>
<g class="v2-reading-block" data-block="reading-135" transform="translate(0 -80)"><text class="se-copy" x="89" y="392"><tspan x="89">both. That does not mean six animals were observed. Keep each animal’s name</tspan><tspan x="89" dy="32">attached to its entries so you can recognise the overlap.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-136" transform="translate(0 -80)"><text class="se-copy" x="89" y="472"><tspan x="89">An animal’s body features are connected with <tspan class="se-italic">where</tspan> it lives.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-137" transform="translate(0 -80)"><text class="se-copy" x="89" y="520"><tspan x="89">You can also group animals by food, habitat or body covering—scales, feathers,</tspan><tspan x="89" dy="32">fur or exposed skin. Choose the grouping that answers your question.</tspan></text></g>
<g class="v2-reading-block" data-block="source-19-5" transform="translate(0 -68)"><text class="se-heading" x="89" y="606"><tspan x="89">Know a scientist</tspan></text></g>
<g class="v2-reading-block" data-block="reading-139" transform="translate(0 -68)"><text class="se-copy" x="89" y="648"><tspan x="89">Janaki Ammal (1897–1984) was one of the first Indian women to work as a</tspan><tspan x="89" dy="32">professional botanist. She studied sugarcane and worked on making plant</tspan></text></g>
<g class="v2-reading-block" data-block="reading-140" transform="translate(0 -68)"><text class="se-copy" x="89" y="712"><tspan x="89">varieties better. In 1952 she became Officer on Special Duty at the Botanical</tspan><tspan x="89" dy="32">Survey of India and helped reorganise its work. In her eighties she joined the</tspan></text></g>
<g class="v2-reading-block" data-block="reading-141" transform="translate(0 -68)"><text class="se-copy" x="89" y="776"><tspan x="89">fight to save the forest at Silent Valley in Kerala. Her whole life was spent doing</tspan><tspan x="89" dy="32">the two things this chapter is about — looking closely at plants, and finding order</tspan><tspan x="89" dy="32">in what she saw.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-142" transform="translate(0 696)"><text class="v2-title" x="89" y="150"><tspan x="89">2.3 Living Things and Their Surroundings</tspan></text></g>
<g class="v2-reading-block" data-block="reading-143" transform="translate(0 696)"><text class="se-copy" x="89" y="194"><tspan x="89">Compare your local records with records from another place. You may find both</tspan><tspan x="89" dy="32">shared and different kinds. Differences in water, temperature, food and shelter</tspan><tspan x="89" dy="32">can help explain the comparison.</tspan></text></g>
<g class="v2-reading-block" data-block="source-20-2" transform="translate(0 696)"><rect class="se-activity-panel" x="89" y="282" width="874" height="209" rx="18"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="303" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="325">Investigate</text></g><text class="se-activity-step" x="128" y="370" text-anchor="end">1.</text><text class="se-copy" x="146" y="371"><tspan x="146">Copy Table 2.6 onto the blackboard for a shared class record.</tspan></text><text class="se-activity-step" x="128" y="414" text-anchor="end">2.</text><text class="se-copy" x="146" y="415"><tspan x="146">Add plants and animals seen, read about or heard about at home.</tspan></text><text class="se-activity-step" x="128" y="458" text-anchor="end">3.</text><text class="se-copy" x="146" y="459"><tspan x="146">Compare columns: hot or cold, wet or dry, windy? Is water easy to find?</tspan></text></g>
