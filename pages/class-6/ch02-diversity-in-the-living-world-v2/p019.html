="0.11885"> </tspan>A<tspan data-gap="" dx="0.11885"> </tspan>fish<tspan data-gap="" dx="0.11885"> </tspan>and<tspan data-gap="" dx="0.11885"> </tspan>a</tspan><tspan x="89" dy="31">dolphin look alike in water, even though a dolphin is not a fish.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1465H915Q900 1465 892 1480L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1465H935Q920 1465 912 1480L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1499" text-anchor="middle">19</text></g></svg></div></div></section>
