<section class="page page--food page--science-editorial page--science-v2" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="v2-ribbon-stem" d="M31 63Q34 30 60 7"/><path class="v2-ribbon-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" transform="translate(0 0)"><text class="v2-title" x="89" y="154"><tspan x="89">2.1 The Variety Around Us</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="213"><tspan x="89">A<tspan data-gap="" dx="0.63548"> </tspan>quick<tspan data-gap="" dx="0.63548"> </tspan>glance<tspan data-gap="" dx="0.63548"> </tspan>may<tspan data-gap="" dx="0.63548"> </tspan>tell<tspan data-gap="" dx="0.63548"> </tspan>you<tspan data-gap="" dx="0.63548"> </tspan>that<tspan data-gap="" dx="0.63548"> </tspan>a<tspan data-gap="" dx="0.63548"> </tspan>tree<tspan data-gap="" dx="0.63548"> </tspan>is<tspan data-gap="" dx="0.63548"> </tspan>there.<tspan data-gap="" dx="0.63548"> </tspan>A<tspan data-gap="" dx="0.63548"> </tspan>closer<tspan data-gap="" dx="0.63548"> </tspan>look<tspan data-gap="" dx="0.63548"> </tspan>can<tspan data-gap="" dx="0.63548"> </tspan>reveal<tspan data-gap="" dx="0.63548"> </tspan>the<tspan data-gap="" dx="0.63548"> </tspan>shape</tspan><tspan x="89" dy="31">of<tspan data-gap="" dx="0.00827"> </tspan>its<tspan data-gap="" dx="0.00827"> </tspan>leaves,<tspan data-gap="" dx="0.00827"> </tspan>where<tspan data-gap="" dx="0.00827"> </tspan>its<tspan data-gap="" dx="0.00827"> </tspan>branches<tspan data-gap="" dx="0.00827"> </tspan>begin,<tspan data-gap="" dx="0.00827"> </tspan>or<tspan data-gap="" dx="0.00827"> </tspan>insects<tspan data-gap="" dx="0.00827"> </tspan>on<tspan data-gap="" dx="0.00827"> </tspan>its<tspan data-gap="" dx="0.00827"> </tspan>bark.<tspan data-gap="" dx="0.00827"> </tspan>Listening<tspan data-gap="" dx="0.00827"> </tspan>may<tspan data-gap="" dx="0.00827"> </tspan>reveal</tspan><tspan x="89" dy="31">a bird you cannot see.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="323"><tspan x="89">Looking carefully is a skill. Like any skill, it gets better with practice.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="369"><tspan x="89">Practise<tspan data-gap="" dx="7.44620"> </tspan>looking<tspan data-gap="" dx="7.44620"> </tspan>closely<tspan data-gap="" dx="7.44620"> </tspan>in<tspan data-gap="" dx="7.44620"> </tspan>the<tspan data-gap="" dx="7.44620"> </tspan>investigation<tspan data-gap="" dx="7.44620"> </tspan>below.<tspan data-gap="" dx="7.44620"> </tspan>Tables<tspan data-gap="" dx="7.44620"> </tspan>2.1<tspan data-gap="" dx="7.44620"> </tspan>and<tspan data-gap="" dx="7.44620"> </tspan>2.2<tspan data-gap="" dx="7.44620"> </tspan>show</tspan><tspan x="89" dy="31">possible records; your own entries may be different.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><rect class="se-activity-panel" x="89" y="424" width="874" height="717" rx="18"/><g class="v2-investigate-icon"><circle cx="128" cy="454" r="12"/><path d="M137 463l10 10"/></g><text class="se-activity-tab-text" x="160" y="463" text-anchor="start">Investigate</text><text class="se-copy" x="113" y="513"><tspan x="113">You will need: a notebook, a pencil, a water bottle.</tspan></text><text class="se-activity-step" x="128" y="556" text-anchor="end">1.</text><text class="se-copy" x="146" y="557"><tspan x="146">Before the visit, copy the headings of Tables 2.1 and 2.2 into your</tspan><tspan x="146" dy="32">notebook. Leave room for your own rows.</tspan></text><text class="se-activity-step" x="128" y="632" text-anchor="end">2.</text><text class="se-copy" x="146" y="633"><tspan x="146">With your teacher, spend one period in a garden, park or school ground.</tspan><tspan x="146" dy="32">Record the place, date and time.</tspan></text><text class="se-activity-step" x="128" y="708" text-anchor="end">3.</text><text class="se-copy" x="146" y="709"><tspan x="146">Walk slowly, then stop at a safe place. Stand still and listen for thirty</tspan><tspan x="146" dy="32">seconds. What different sounds can you hear?</tspan></text><text class="se-activity-step" x="128" y="784" text-anchor="end">4.</text><text class="se-copy" x="146" y="785"><tspan x="146">Add a row for each kind of plant or animal you observe. If you do not</tspan><tspan x="146" dy="32">know its name, describe or sketch it. For example: &quot;small plant, three</tspan><tspan x="146" dy="32">leaves together, near the tap&quot;.</tspan></text><text class="se-activity-step" x="128" y="892" text-anchor="end">5.</text><text class="se-copy" x="146" y="893"><tspan x="146">Record only what you can establish. Write &quot;not seen&quot; for a feature you</tspan><tspan x="146" dy="32">looked for but did not see. Do not pluck leaves or flowers or disturb</tspan><tspan x="146" dy="32">animals.</tspan></text><text class="se-copy" x="113" y="1001"><tspan x="113">Compare your records with a partner. Which living things were difficult to</tspan><tspan x="113" dy="32">find or describe? What made them difficult?</tspan></text><text class="se-copy" x="113" y="1077"><tspan x="113">Safety: Stay with your group. Do not touch any animal. Do not put your</tspan><tspan x="113" dy="32">fingers into holes or under stones.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1465H137Q152 1465 160 1480L179 1514H0Z"/><path class="v2-ribbon" d="M0 1465H117Q132 1465 140 1480L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1499" text-anchor="middle">2</text></g></svg></div></div></section>
