r="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-0" transform="translate(0 0)"><text class="v2-title" x="89" y="150"><tspan x="89">2.1 The Variety Around Us</tspan></text></g>
<g class="v2-reading-block" data-block="reading-1" transform="translate(0 0)"><text class="se-copy" x="89" y="194"><tspan x="89">A glance reveals a tree; a closer look reveals leaf shapes, branching and insects</tspan><tspan x="89" dy="32">on the bark. Listening may reveal an unseen bird.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-2" transform="translate(0 0)"><text class="se-copy" x="89" y="274"><tspan x="89">Careful observation improves with practice. Practise below. Tables 2.1 and 2.2</tspan><tspan x="89" dy="32">are sample records; your observations may differ.</tspan></text></g>
<g class="v2-reading-block" data-block="source-2-4" transform="translate(0 0)"><rect class="se-activity-panel" x="89" y="330" width="874" height="577" rx="18"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="351" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="373">Investigate</text></g><text class="se-copy" x="113" y="419"><tspan x="113">You will need: a notebook, a pencil, a water bottle.</tspan></text><text class="se-activity-step" x="128" y="462" text-anchor="end">1.</text><text class="se-copy" x="146" y="463"><tspan x="146">Before the visit, copy the headings of Tables 2.1 and 2.2 into your</tspan><tspan x="146" dy="32">notebook, with room for your rows.</tspan></text><text class="se-activity-step" x="128" y="538" text-anchor="end">2.</text><text class="se-copy" x="146" y="539"><tspan x="146">Spend one period with your teacher in a garden, park or school ground.</tspan><tspan x="146" dy="32">Record place, date and time.</tspan></text><text class="se-activity-step" x="128" y="614" text-anchor="end">3.</text><text class="se-copy" x="146" y="615"><tspan x="146">Walk slowly. Stop safely and listen for thirty seconds. What different</tspan><tspan x="146" dy="32">sounds can you hear?</tspan></text><text class="se-activity-step" x="128" y="690" text-anchor="end">4.</text><text class="se-copy" x="146" y="691"><tspan x="146">Add one row per kind observed. Describe or sketch unknown names, for</tspan><tspan x="146" dy="32">example: “small plant, three leaves together, near the tap”.</tspan></text><text class="se-activity-step" x="128" y="766" text-anchor="end">5.</text><text class="se-copy" x="146" y="767"><tspan x="146">Record only what you can establish; write “not seen” for features sought</tspan><tspan x="146" dy="32">but not seen. Do not pluck leaves or flowers or disturb animals.</tspan></text><text class="se-copy" x="113" y="843"><tspan x="113">Safety: Stay with your group. Do not touch any animal. Do not put your</tspan><tspan x="113" dy="32">fingers into holes or under stones.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-4" transform="translate(0 0)"><text class="se-copy" x="89" y="965"><tspan x="89">Compare records with a partner. Which living things were hard to find or</tspan><tspan x="89" dy="32">describe, and why?</tspan></text></g>

pan x="798">Strong smell</tspan><tspan x="798" dy="28">when rubbed</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="348" y2="348"/><text class="se-copy se-table-copy" x="103" y="381.08"><tspan x="103">Hibiscus</tspan></text><text class="se-copy se-table-copy" x="258" y="381.08"><tspan x="258">Hard,</tspan><tspan x="258" dy="28">woody</tspan></text><text class="se-copy se-table-copy" x="393" y="381.08"><tspan x="393">Broad, toothed</tspan><tspan x="393" dy="28">leaves</tspan></text><text class="se-copy se-table-copy" x="613" y="381.08"><tspan x="613">Red flower</tspan></text><text class="se-copy se-table-copy" x="798" y="381.08"><tspan x="798">—</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="422" y2="422"/><line class="v2-table-rule" x1="244" x2="244" y1="154" y2="422"/><line class="v2-table-rule" x1="379" x2="379" y1="154" y2="422"/><line class="v2-table-rule" x1="599" x2="599" y1="154" y2="422"/><line class="v2-table-rule" x1="784" x2="784" y1="154" y2="422"/><rect class="v2-table-frame" x="89" y="154" width="874" height="268"/><text class="v2-table-note" x="89" y="454.88"><tspan x="89">— means not recorded; it does not mean absent. A flower not seen today may appear in</tspan><tspan x="89" dy="26">another season.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
