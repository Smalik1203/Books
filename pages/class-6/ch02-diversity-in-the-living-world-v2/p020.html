hor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-146" transform="translate(0 -563)"><text class="se-copy" x="89" y="699"><tspan x="89">Compare the warm sandy desert and cold mountain conditions in your class</tspan><tspan x="89" dy="32">table. Which conditions differ? What else would you need to know before</tspan><tspan x="89" dy="32">predicting whether an animal could survive in both?</tspan></text></g>
<g class="v2-reading-block" data-block="reading-147" transform="translate(0 -563)"><text class="se-copy" x="89" y="811"><tspan x="89">Table 2.6 gives one example for each named setting. An empty space does not</tspan><tspan x="89" dy="32">mean that no living things occur there, and one entry does not mean that only</tspan></text></g>
<g class="v2-reading-block" data-block="reading-148" transform="translate(0 -563)"><text class="se-copy" x="89" y="875"><tspan x="89">that kind occurs there. Add locally known examples with a source for each.</tspan><tspan x="89" dy="32">Distinguish a direct sighting from a name supplied by a book.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-149" transform="translate(0 -563)"><text class="se-copy" x="89" y="955"><tspan x="89">Some living things occur in several surroundings; others have a much narrower</tspan><tspan x="89" dy="32">range. Compare the conditions in each column. The features of a living thing</tspan><tspan x="89" dy="32">help explain where it can survive.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-150" transform="translate(0 368)"><text class="se-copy" x="89" y="136"><tspan x="89">Look at a plant from a hot desert. Now look at a deodar tree, high in the</tspan><tspan x="89" dy="32">Himalayas.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-151" transform="translate(0 368)"><image class="science-illustration" href="../../figures/class-6/science/ch02-v2/desert.png" x="89" y="192" width="874" height="350" preserveAspectRatio="xMidYMid meet"/>
<text class="se-caption" x="308" y="569" text-anchor="middle">Cactus · hot desert</text>
<text class="se-caption" x="744" y="569" text-anchor="middle">Deodar · cold mountain</text></g>
<g class="v2-reading-block" data-block="reading-152" transform="translate(0 368)"><text class="v2-comparison-title" x="89" y="621"><tspan x="89">Cactus</tspan></text><text class="se-copy" x="89" y="663" text-anchor="start">•</text><text class="se-copy" x="112" y="663"><tspan x="112">Fleshy stem: stores water.</tspan></text><text class="se-copy" x="89" y="703" text-anchor="start">•</text><text class="se-copy" x="112" y="703"><tspan x="112">Waxy surface: reduces water loss.</tspan></text><text class="se-copy" x="89" y="743" text-anchor="start">•</text><text class="se-copy" x="112" y="743"><tspan x="112">In many cacti, leaves are spines and</tspan><tspan x="112" dy="32">the green stem carries out</tspan><tspan x="112" dy="32">photosynthesis.</tspan></text>
<text class="v2-comparison-title" x="542" y="621"><tspan x="542">Deodar</tspan></text><text class="se-copy" x="542" y="663" text-anchor="start">•</text><text class="se-copy" x="565" y="663"><tspan x="565">Snow can load branches heavily.</tspan></text><text class="se-copy" x="542" y="703" text-anchor="start">•</text><text class="se-copy" x="565" y="703"><tspan x="565">Conical form and sloping branches</tspan><tspan x="565" dy="32">can help shed snow.</tspan></text><text class="se-copy" x="542" y="775" text-anchor="start">•</text><text class="se-copy" x="565" y="775"><tspan x="565">Temperature, soil and water also</tspan><tspan x="565" dy="32">affect where the tree can grow.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-153" transform="translate(0 368)"><text class="se-copy" x="89" y="869"><tspan x="89">These features were not chosen by individual plants. They are inherited features</tspan><tspan x="89" dy="32">found in populations living in particular conditions. Other plants may survive</tspan><tspan x="89" dy="32">there using different features.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">20</text></g></svg></div></div></section>
