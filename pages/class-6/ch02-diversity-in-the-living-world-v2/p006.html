r="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-33" transform="translate(0 -749)"><text class="se-copy" x="89" y="885"><tspan x="89">Compare both your sortings with another group's.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-34" transform="translate(0 -749)"><text class="se-copy" x="89" y="933"><tspan x="89">Did any two groups in the class use the same rule?</tspan></text></g>
<g class="v2-reading-block" data-block="reading-35" transform="translate(0 96)"><text class="se-copy" x="89" y="136"><tspan x="89">Take one sorted group and check every card against its rule. Two different rules</tspan><tspan x="89" dy="32">can both be useful, but a card can still be placed incorrectly.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-36" transform="translate(0 96)"><text class="se-copy" x="89" y="216"><tspan x="89">Different groups may use size, food or surroundings. Check what the pictures</tspan><tspan x="89" dy="32">actually show before using these features.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-37" transform="translate(0 96)"><text class="se-copy" x="89" y="296"><tspan x="89">Compare these four leaves. You can sort the same set by its outline or by its edge.</tspan></text>
<image class="science-illustration" href="../../figures/class-6/science/ch02-v2/leaf-sorting.png" x="89" y="320" width="414" height="276" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="153" y="618" text-anchor="middle">A</text><text class="se-caption" x="264" y="618" text-anchor="middle">B</text><text class="se-caption" x="356" y="618" text-anchor="middle">C</text><text class="se-caption" x="462" y="618" text-anchor="middle">D</text>
<rect class="se-table-head" x="535" y="362" width="428" height="60"/><rect class="v2-table-frame" x="535" y="362" width="428" height="180"/><line class="v2-rule" x1="535" x2="963" y1="422" y2="422"/><line class="v2-rule" x1="535" x2="963" y1="482" y2="482"/><text class="se-caption" x="545" y="399" text-anchor="start">Grouping rule</text><text class="se-caption" x="687" y="399" text-anchor="start">First group</text><text class="se-caption" x="827" y="399" text-anchor="start">Second group</text><text class="se-caption" x="545" y="459" text-anchor="start">Outline</text><text class="se-caption" x="687" y="459" text-anchor="start">Broad: A, B</text><text class="se-caption" x="827" y="459" text-anchor="start">Narrow: C, D</text><text class="se-caption" x="545" y="519" text-anchor="start">Edge</text><text class="se-caption" x="687" y="519" text-anchor="start">Smooth: A, C</text><text class="se-caption" x="827" y="519" text-anchor="start">Toothed: B, D</text>
<text class="se-copy" x="89" y="670"><tspan x="89">Leaf C belongs with D when you compare outlines, but with A when you compare</tspan><tspan x="89" dy="32">edges. The leaves have not changed; the grouping rule has.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-38" transform="translate(0 712)"><text class="se-copy" x="89" y="136"><tspan x="89">Choose a rule to suit your question, then apply it consistently. If a picture does</tspan><tspan x="89" dy="32">not show the feature you need, mark it &quot;not enough information&quot;. A picture</tspan><tspan x="89" dy="32">without a visible flower does not prove that the plant never flowers.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-39" transform="translate(0 712)"><text class="se-copy" x="89" y="248"><tspan x="89">A gardener comparing shade might group plants by height. Someone studying</tspan><tspan x="89" dy="32">their flowers would need a different grouping. Explain what your rule helps you</tspan><tspan x="89" dy="32">find out and what it leaves out.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-40" transform="translate(0 712)"><text class="se-copy" x="89" y="360"><tspan x="89">Scientists also study groups whose members share several inherited features.</tspan><tspan x="89" dy="32">Knowing one feature can then help us predict others. Later in this chapter, you</tspan><tspan x="89" dy="32">will test such a connection.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-41" transform="translate(0 712)"><text class="se-copy" x="89" y="472"><tspan x="89">How would a library arranged by book size help a reader? What would be harder</tspan><tspan x="89" dy="32">to find?</tspan></text></g>
<g class="v2-reading-block" data-block="reading-42" transform="translate(0 712)"><text class="se-copy" x="89" y="552"><tspan x="89">Make “large leaves” precise: try “longer than 10 cm from base to tip”. State where</tspan><tspan x="89" dy="32">a leaf exactly 10 cm long belongs, so another group can repeat your sorting.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
