<section class="page page--food page--science-editorial page--science-v2" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="v2-ribbon-stem" d="M31 63Q34 30 60 7"/><path class="v2-ribbon-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" transform="translate(0 0)"><text class="v2-title" x="89" y="154"><tspan x="89">2.2 Making Sense of the Variety</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="213"><tspan x="89">Your<tspan data-gap="" dx="2.63822"> </tspan>records<tspan data-gap="" dx="2.63822"> </tspan>may<tspan data-gap="" dx="2.63822"> </tspan>contain<tspan data-gap="" dx="2.63822"> </tspan>many<tspan data-gap="" dx="2.63822"> </tspan>kinds<tspan data-gap="" dx="2.63822"> </tspan>of<tspan data-gap="" dx="2.63822"> </tspan>living<tspan data-gap="" dx="2.63822"> </tspan>things.<tspan data-gap="" dx="2.63822"> </tspan>Grouping<tspan data-gap="" dx="2.63822"> </tspan>them<tspan data-gap="" dx="2.63822"> </tspan>can<tspan data-gap="" dx="2.63822"> </tspan>help</tspan><tspan x="89" dy="31">you compare a feature without searching through every entry.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="291"><tspan x="89">In<tspan data-gap="" dx="8.76244"> </tspan>a<tspan data-gap="" dx="8.76244"> </tspan>stationery<tspan data-gap="" dx="8.76244"> </tspan>shop,<tspan data-gap="" dx="8.76244"> </tspan>keeping<tspan data-gap="" dx="8.76244"> </tspan>pens<tspan data-gap="" dx="8.76244"> </tspan>together<tspan data-gap="" dx="8.76244"> </tspan>helps<tspan data-gap="" dx="8.76244"> </tspan>a<tspan data-gap="" dx="8.76244"> </tspan>customer<tspan data-gap="" dx="8.76244"> </tspan>find<tspan data-gap="" dx="8.76244"> </tspan>a<tspan data-gap="" dx="8.76244"> </tspan>pen.</tspan><tspan x="89" dy="31">Arranging<tspan data-gap="" dx="2.30727"> </tspan>goods<tspan data-gap="" dx="2.30727"> </tspan>by<tspan data-gap="" dx="2.30727"> </tspan>price<tspan data-gap="" dx="2.30727"> </tspan>answers<tspan data-gap="" dx="2.30727"> </tspan>a<tspan data-gap="" dx="2.30727"> </tspan>different<tspan data-gap="" dx="2.30727"> </tspan>question:<tspan data-gap="" dx="2.30727"> </tspan>what<tspan data-gap="" dx="2.30727"> </tspan>can<tspan data-gap="" dx="2.30727"> </tspan>I<tspan data-gap="" dx="2.30727"> </tspan>buy<tspan data-gap="" dx="2.30727"> </tspan>with<tspan data-gap="" dx="2.30727"> </tspan>this</tspan><tspan x="89" dy="31">amount of money?</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><text class="se-copy" data-measure="874" x="89" y="401"><tspan x="89">Scientists<tspan data-gap="" dx="7.11904"> </tspan>do<tspan data-gap="" dx="7.11904"> </tspan>the<tspan data-gap="" dx="7.11904"> </tspan>same<tspan data-gap="" dx="7.11904"> </tspan>with<tspan data-gap="" dx="7.11904"> </tspan>living<tspan data-gap="" dx="7.11904"> </tspan>things.<tspan data-gap="" dx="7.11904"> </tspan>Putting<tspan data-gap="" dx="7.11904"> </tspan>things<tspan data-gap="" dx="7.11904"> </tspan>into<tspan data-gap="" dx="7.11904"> </tspan>groups<tspan data-gap="" dx="7.11904"> </tspan>by<tspan data-gap="" dx="7.11904"> </tspan>the</tspan><tspan x="89" dy="31">features they share is called <tspan class="se-bold">grouping</tspan>.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 0)"><rect class="se-activity-panel" x="89" y="456" width="874" height="537" rx="18"/><g class="v2-investigate-icon"><circle cx="128" cy="486" r="12"/><path d="M137 495l10 10"/></g><text class="se-activity-tab-text" x="160" y="495" text-anchor="start">Investigate</text><text class="se-copy" x="113" y="545"><tspan x="113">You will need: old magazines or newspapers, scissors, glue, small cards.</tspan></text><text class="se-activity-step" x="128" y="588" text-anchor="end">1.</text><text class="se-copy" x="146" y="589"><tspan x="146">Cut out pictures of plants and animals. Paste one on each card. Try to</tspan><tspan x="146" dy="32">make at least thirty cards in the class.</tspan></text><text class="se-activity-step" x="128" y="664" text-anchor="end">2.</text><text class="se-copy" x="146" y="665"><tspan x="146">Work in groups of five or six. Put all your cards together.</tspan></text><text class="se-activity-step" x="128" y="708" text-anchor="end">3.</text><text class="se-copy" x="146" y="709"><tspan x="146">Sort the pile into groups. You decide what the groups will be.</tspan></text><text class="se-activity-step" x="128" y="752" text-anchor="end">4.</text><text class="se-copy" x="146" y="753"><tspan x="146">Write down, in one line, the rule you used.</tspan></text><text class="se-activity-step" x="128" y="796" text-anchor="end">5.</text><text class="se-copy" x="146" y="797"><tspan x="146">Now mix all the cards again. Sort them a second time, using a completely</tspan><tspan x="146" dy="32">different rule.</tspan></text><text class="se-copy" x="113" y="873"><tspan x="113">Compare both your sortings with another group's.</tspan></text><text class="se-copy" x="113" y="917"><tspan x="113">Did any two groups in the class use the same rule?</tspan></text><text class="se-copy" x="113" y="961"><tspan x="113">Safety: Use scissors carefully, with your teacher’s guidance.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 915)"><text class="se-copy" data-measure="874" x="89" y="136"><tspan x="89">Take<tspan data-gap="" dx="2.16921"> </tspan>one<tspan data-gap="" dx="2.16921"> </tspan>sorted<tspan data-gap="" dx="2.16921"> </tspan>group<tspan data-gap="" dx="2.16921"> </tspan>and<tspan data-gap="" dx="2.16921"> </tspan>check<tspan data-gap="" dx="2.16921"> </tspan>every<tspan data-gap="" dx="2.16921"> </tspan>card<tspan data-gap="" dx="2.16921"> </tspan>against<tspan data-gap="" dx="2.16921"> </tspan>its<tspan data-gap="" dx="2.16921"> </tspan>rule.<tspan data-gap="" dx="2.16921"> </tspan>Two<tspan data-gap="" dx="2.16921"> </tspan>different<tspan data-gap="" dx="2.16921"> </tspan>rules</tspan><tspan x="89" dy="32">can both be useful, but a card can still be placed incorrectly.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 915)"><text class="se-copy" data-measure="874" x="89" y="218"><tspan x="89">Different<tspan data-gap="" dx="4.57814"> </tspan>groups<tspan data-gap="" dx="4.57814"> </tspan>may<tspan data-gap="" dx="4.57814"> </tspan>use<tspan data-gap="" dx="4.57814"> </tspan>size,<tspan data-gap="" dx="4.57814"> </tspan>food<tspan data-gap="" dx="4.57814"> </tspan>or<tspan data-gap="" dx="4.57814"> </tspan>surroundings.<tspan data-gap="" dx="4.57814"> </tspan>Check<tspan data-gap="" dx="4.57814"> </tspan>what<tspan data-gap="" dx="4.57814"> </tspan>the<tspan data-gap="" dx="4.57814"> </tspan>pictures</tspan><tspan x="89" dy="32">actually show before using these features.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1465H137Q152 1465 160 1480L179 1514H0Z"/><path class="v2-ribbon" d="M0 1465H117Q132 1465 140 1480L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1499" text-anchor="middle">6</text></g></svg></div></div></section>
