<section class="page page--food page--science-editorial page--science-v2" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g transform="translate(-148 3) scale(.2)"><g class="v2-ribbon__motif" transform="translate(0 0)" aria-hidden="true"><path class="v2-ribbon__stem" d="M1005 35C930 117 932 200 1018 275"/><path class="v2-ribbon__leaves" d="M994.33 47.31C1005.31 49.71 1020.98 36.37 1024 20C1011.75 25.15 996.71 35.6 994.33 47.31Z M978.05 69.47C992.62 77.79 1025.12 66.86 1041 46C1019.28 47.37 989.73 54.66 978.05 69.47Z M963.3 96.55C965.95 76.92 940.73 53.11 912 52C922.59 71.93 942.72 95.37 963.3 96.55Z M954.26 123.53C973.15 135.98 1017.32 123.91 1040 97C1010.89 97.06 970.91 104.46 954.26 123.53Z M951.06 147.92C949.72 125.2 916.83 105.4 885 112C900.96 131.44 928.18 152.21 951.06 147.92Z M953.1 174.53C970.15 189.5 1011.77 181.61 1034 156C1006.91 152.97 969.39 156.43 953.1 174.53Z M961.02 200.84C956.66 180.93 925.52 168.87 899 180C915.5 194.56 941.9 208.44 961.02 200.84Z M974.87 226.77C987.64 240.88 1022.05 237.75 1042 218C1020.2 213.13 989.44 212.87 974.87 226.77Z M990.66 247.67C986.1 232.61 959.09 222.53 937 230C951.66 241.46 974.71 252.74 990.66 247.67Z"/><path class="v2-ribbon__veins" d="M996.11 45.67Q1008.04 36.59 1021.07 23.37 M981.82 68.07Q1005.8 61.22 1034.32 49.24 M960.22 93.87Q942.89 75.49 918.23 56.22 M959.41 121.94Q991.92 114.66 1030.85 100.83 M947.1 145.76Q924.06 129.89 892.77 115.03 M957.95 173.42Q988.51 169.29 1025.32 159.01 M957.29 199.59Q935.2 189.36 906.12 181.39 M978.9 226.25Q1004.04 225.36 1034.73 219.81 M987.44 246.61Q968.2 238.21 943.12 231.28"/></g></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-101" transform="translate(0 -957)"><text class="se-copy" x="89" y="1093"><tspan x="89">What happened with the fifth plant? An unclear root or leaf is a reason to</tspan><tspan x="89" dy="32">examine it again, not to change the record so it fits.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-102" transform="translate(0 80)"><text class="se-copy" x="89" y="136"><tspan x="89">Pool the class records. Count how many support a connection and how many do</tspan><tspan x="89" dy="32">not. Compare the result with these common patterns in flowering plants.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-103" transform="translate(0 80)"><text class="se-copy" x="89" y="216"><tspan x="89">Suppose four predictions were checked: three matched, and one plant had</tspan><tspan x="89" dy="32">broken roots. You have three matches and one uncertain result, not four</tspan></text></g>
<g class="v2-reading-block" data-block="reading-104" transform="translate(0 80)"><text class="se-copy" x="89" y="280"><tspan x="89">matches. Report both numbers. The uncertain plant needs another observation;</tspan><tspan x="89" dy="32">leaving it out without explanation would make the pattern appear better</tspan><tspan x="89" dy="32">supported than your records show.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-105" transform="translate(0 80)"><text class="se-copy" x="89" y="392"><tspan x="89">Many familiar flowering plants with reticulate venation develop taproots; those</tspan><tspan x="89" dy="32">with parallel venation commonly develop fibrous root systems.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-106" transform="translate(0 80)"><text class="se-copy" x="89" y="472"><tspan x="89"><tspan class="se-italic">Sadabahar</tspan> and chana have net-like veins and taproots. Lemongrass and wheat</tspan><tspan x="89" dy="32">have parallel veins and fibrous roots.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-107" transform="translate(0 80)"><text class="se-copy" x="89" y="552"><tspan x="89">These are typical associations, not rules without exceptions. Age, how a plant</tspan><tspan x="89" dy="32">was propagated, and unusual features can affect what you observe. Keep</tspan><tspan x="89" dy="32">exceptions in the record.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-108" transform="translate(0 80)"><text class="se-copy" x="89" y="664"><tspan x="89">Could another feature help us recognise these groups? Look inside a seed.</tspan></text></g>
<g class="v2-reading-block" data-block="source-17-0" transform="translate(0 92)"><text class="se-heading" x="89" y="718"><tspan x="89">What Is Inside a Seed</tspan></text></g>
<g class="v2-reading-block" data-block="source-16-6" transform="translate(0 92)"><rect class="se-activity-panel" x="89" y="736" width="874" height="337" rx="18"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="757" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="779">Investigate</text></g><text class="se-activity-step" x="128" y="824" text-anchor="end">1.</text><text class="se-copy" x="146" y="825"><tspan x="146">Soak a few chana seeds and a few maize seeds in water for two days, until</tspan><tspan x="146" dy="32">they are soft and swollen.</tspan></text><text class="se-activity-step" x="128" y="900" text-anchor="end">2.</text><text class="se-copy" x="146" y="901"><tspan x="146">Peel the thin outer coat off a soaked chana. Now try to split the seed with</tspan><tspan x="146" dy="32">your thumbnail.</tspan></text><text class="se-activity-step" x="128" y="976" text-anchor="end">3.</text><text class="se-copy" x="146" y="977"><tspan x="146">Try gently to separate a soaked maize grain. Do not use a knife or force it</tspan><tspan x="146" dy="32">apart. Record what you can see; compare with the labelled section</tspan><tspan x="146" dy="32">afterwards.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-111" transform="translate(0 92)"><text class="se-copy" x="89" y="1131"><tspan x="89">Which seed comes apart neatly into two halves? Which one does not?</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">15</text></g></svg></div></div></section>
