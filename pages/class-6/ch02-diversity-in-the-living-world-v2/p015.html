<section class="page page--food page--science-editorial page--science-v2" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="v2-ribbon-stem" d="M31 63Q34 30 60 7"/><path class="v2-ribbon-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" transform="translate(0 -930)"><text class="se-copy" x="89" y="1066"><tspan x="89">A taproot can grow deep and reach</tspan><tspan x="89" dy="32">water below the surface. A deep root</tspan><tspan x="89" dy="32">system can help a plant through a dry</tspan><tspan x="89" dy="32">spell, although root depth also</tspan><tspan x="89" dy="32">depends on the species and the soil.</tspan></text>
<text class="se-copy" x="542" y="1066"><tspan x="542">Many fibrous root systems spread</tspan><tspan x="542" dy="32">through the upper soil. A dense</tspan><tspan x="542" dy="32">network helps hold loose soil together</tspan><tspan x="542" dy="32">and take up water near the surface.</tspan><tspan x="542" dy="32">Some fibrous roots also reach deep</tspan><tspan x="542" dy="32">into the ground.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 220)"><text class="se-heading" x="89" y="142"><tspan x="89">Comparing Leaves and Roots</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 220)"><text class="se-copy" data-measure="874" x="89" y="197"><tspan x="89">You now know two ways to sort plants. One uses leaves. One uses roots.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 220)"><text class="se-copy" data-measure="874" x="89" y="243"><tspan x="89">Can<tspan data-gap="" dx="12.05007"> </tspan>a<tspan data-gap="" dx="12.05007"> </tspan>record<tspan data-gap="" dx="12.05007"> </tspan>of<tspan data-gap="" dx="12.05007"> </tspan>leaf<tspan data-gap="" dx="12.05007"> </tspan>venation<tspan data-gap="" dx="12.05007"> </tspan>help<tspan data-gap="" dx="12.05007"> </tspan>you<tspan data-gap="" dx="12.05007"> </tspan>predict<tspan data-gap="" dx="12.05007"> </tspan>root<tspan data-gap="" dx="12.05007"> </tspan>type?<tspan data-gap="" dx="12.05007"> </tspan>First<tspan data-gap="" dx="12.05007"> </tspan>collect</tspan><tspan x="89" dy="31">observations, then test any pattern against another plant.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 220)"><rect class="se-activity-panel" x="89" y="298" width="874" height="521" rx="18"/><g class="v2-investigate-icon"><circle cx="128" cy="328" r="12"/><path d="M137 337l10 10"/></g><text class="se-activity-tab-text" x="160" y="337" text-anchor="start">Investigate</text><text class="se-activity-step" x="128" y="386" text-anchor="end">1.</text><text class="se-copy" x="146" y="387"><tspan x="146">With your teacher or gardener, select five kinds of flowering plants with</tspan><tspan x="146" dy="32">developed leaves and visible roots. Use spare nursery plants, not plants</tspan><tspan x="146" dy="32">pulled from the wild.</tspan></text><text class="se-activity-step" x="128" y="494" text-anchor="end">2.</text><text class="se-copy" x="146" y="495"><tspan x="146">Make a notebook table using the headings in Table 2.4. Examine four</tspan><tspan x="146" dy="32">kinds first and record their venation and root type. Mark unclear features</tspan><tspan x="146" dy="32">as uncertain.</tspan></text><text class="se-activity-step" x="128" y="602" text-anchor="end">3.</text><text class="se-copy" x="146" y="603"><tspan x="146">Look for a connection in these four records. Use it to predict the root type</tspan><tspan x="146" dy="32">of the fifth kind from its leaf. Record the prediction before examining its</tspan><tspan x="146" dy="32">roots.</tspan></text><text class="se-activity-step" x="128" y="710" text-anchor="end">4.</text><text class="se-copy" x="146" y="711"><tspan x="146">Check the roots of the fifth kind. Does this new observation support your</tspan><tspan x="146" dy="32">proposed pattern? Compare results across the class.</tspan></text><text class="se-activity-step" x="128" y="786" text-anchor="end">5.</text><text class="se-copy" x="146" y="787"><tspan x="146">Handle the roots gently and replant the plants with your teacher’s help.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 220)"><text class="se-caption se-bold" x="89" y="876" text-anchor="start">Table 2.4: Leaf venation and root type</text><rect class="v2-table-frame" x="89" y="895" width="874" height="125"/><line class="v2-rule" x1="307.5" x2="307.5" y1="895" y2="1020"/><line class="v2-rule" x1="526" x2="526" y1="895" y2="1020"/><line class="v2-rule" x1="744.5" x2="744.5" y1="895" y2="1020"/><rect class="se-table-head" x="89" y="895" width="874" height="76"/><line class="se-rule" x1="89" x2="963" y1="971" y2="971"/><text class="se-copy se-table-copy se-bold" x="101" y="925.12"><tspan x="101">Plant</tspan></text><text class="se-copy se-table-copy se-bold" x="319.5" y="925.12"><tspan x="319.5">Venation</tspan></text><text class="se-copy se-table-copy se-bold" x="538" y="925.12"><tspan x="538">Root prediction</tspan><tspan x="538" dy="27">(fifth plant)</tspan></text><text class="se-copy se-table-copy se-bold" x="756.5" y="925.12"><tspan x="756.5">Root observed</tspan></text><line class="se-rule" x1="89" x2="963" y1="1020" y2="1020"/><text class="se-copy se-table-copy" x="101" y="1001.12"><tspan x="101">Lemongrass</tspan></text><text class="se-copy se-table-copy" x="319.5" y="1001.12"><tspan x="319.5">Parallel</tspan></text><text class="se-copy se-table-copy" x="538" y="1001.12"><tspan x="538">—</tspan></text><text class="se-copy se-table-copy" x="756.5" y="1001.12"><tspan x="756.5">Fibrous</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1465H915Q900 1465 892 1480L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1465H935Q920 1465 912 1480L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1499" text-anchor="middle">15</text></g></svg></div></div></section>
