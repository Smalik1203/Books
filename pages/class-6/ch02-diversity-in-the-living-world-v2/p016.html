<g class="v2-reading-block" transform="translate(0 78)"><text class="se-copy" data-measure="874" x="89" y="135"><tspan x="89">Pool<tspan data-gap="" dx="1.66627"> </tspan>the<tspan data-gap="" dx="1.66627"> </tspan>class<tspan data-gap="" dx="1.66627"> </tspan>records.<tspan data-gap="" dx="1.66627"> </tspan>Count<tspan data-gap="" dx="1.66627"> </tspan>how<tspan data-gap="" dx="1.66627"> </tspan>many<tspan data-gap="" dx="1.66627"> </tspan>support<tspan data-gap="" dx="1.66627"> </tspan>a<tspan data-gap="" dx="1.66627"> </tspan>connection<tspan data-gap="" dx="1.66627"> </tspan>and<tspan data-gap="" dx="1.66627"> </tspan>how<tspan data-gap="" dx="1.66627"> </tspan>many<tspan data-gap="" dx="1.66627"> </tspan>do</tspan><tspan x="89" dy="31">not. Compare the result with these common patterns in flowering plants.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 78)"><text class="se-copy" data-measure="874" x="89" y="213"><tspan x="89">Many<tspan data-gap="" dx="3.51171"> </tspan>familiar<tspan data-gap="" dx="3.51171"> </tspan>flowering<tspan data-gap="" dx="3.51171"> </tspan>plants<tspan data-gap="" dx="3.51171"> </tspan>with<tspan data-gap="" dx="3.51171"> </tspan>reticulate<tspan data-gap="" dx="3.51171"> </tspan>venation<tspan data-gap="" dx="3.51171"> </tspan>develop<tspan data-gap="" dx="3.51171"> </tspan>taproots;<tspan data-gap="" dx="3.51171"> </tspan>those</tspan><tspan x="89" dy="31">with parallel venation commonly develop fibrous root systems.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 78)"><text class="se-copy" data-measure="874" x="89" y="291"><tspan x="89"><tspan class="se-italic">Sadabahar</tspan><tspan data-gap="" dx="0.10174"> </tspan>has<tspan data-gap="" dx="0.10174"> </tspan>net-like<tspan data-gap="" dx="0.10174"> </tspan>veins<tspan data-gap="" dx="0.10174"> </tspan>and<tspan data-gap="" dx="0.10174"> </tspan>a<tspan data-gap="" dx="0.10174"> </tspan>taproot.<tspan data-gap="" dx="0.10174"> </tspan>Chana<tspan data-gap="" dx="0.10174"> </tspan>has<tspan data-gap="" dx="0.10174"> </tspan>net-like<tspan data-gap="" dx="0.10174"> </tspan>veins<tspan data-gap="" dx="0.10174"> </tspan>and<tspan data-gap="" dx="0.10174"> </tspan>a<tspan data-gap="" dx="0.10174"> </tspan>taproot.</tspan><tspan x="89" dy="31">Lemongrass<tspan data-gap="" dx="4.02116"> </tspan>has<tspan data-gap="" dx="4.02116"> </tspan>parallel<tspan data-gap="" dx="4.02116"> </tspan>veins<tspan data-gap="" dx="4.02116"> </tspan>and<tspan data-gap="" dx="4.02116"> </tspan>fibrous<tspan data-gap="" dx="4.02116"> </tspan>roots.<tspan data-gap="" dx="4.02116"> </tspan>Wheat<tspan data-gap="" dx="4.02116"> </tspan>has<tspan data-gap="" dx="4.02116"> </tspan>parallel<tspan data-gap="" dx="4.02116"> </tspan>veins<tspan data-gap="" dx="4.02116"> </tspan>and</tspan><tspan x="89" dy="31">fibrous roots.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 78)"><text class="se-copy" data-measure="874" x="89" y="401"><tspan x="89">These<tspan data-gap="" dx="0.45347"> </tspan>are<tspan data-gap="" dx="0.45347"> </tspan>typical<tspan data-gap="" dx="0.45347"> </tspan>associations,<tspan data-gap="" dx="0.45347"> </tspan>not<tspan data-gap="" dx="0.45347"> </tspan>rules<tspan data-gap="" dx="0.45347"> </tspan>without<tspan data-gap="" dx="0.45347"> </tspan>exceptions.<tspan data-gap="" dx="0.45347"> </tspan>Age,<tspan data-gap="" dx="0.45347"> </tspan>how<tspan data-gap="" dx="0.45347"> </tspan>a<tspan data-gap="" dx="0.45347"> </tspan>plant<tspan data-gap="" dx="0.45347"> </tspan>was</tspan><tspan x="89" dy="31">propagated,<tspan data-gap="" dx="0.17528"> </tspan>and<tspan data-gap="" dx="0.17528"> </tspan>unusual<tspan data-gap="" dx="0.17528"> </tspan>features<tspan data-gap="" dx="0.17528"> </tspan>can<tspan data-gap="" dx="0.17528"> </tspan>affect<tspan data-gap="" dx="0.17528"> </tspan>what<tspan data-gap="" dx="0.17528"> </tspan>you<tspan data-gap="" dx="0.17528"> </tspan>observe.<tspan data-gap="" dx="0.17528"> </tspan>Keep<tspan data-gap="" dx="0.17528"> </tspan>exceptions<tspan data-gap="" dx="0.17528"> </tspan>in</tspan><tspan x="89" dy="31">the record.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 78)"><text class="se-copy" data-measure="874" x="89" y="511"><tspan x="89">Could another feature help us recognise these groups? Look inside a seed.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 78)"><text class="se-heading" x="89" y="564"><tspan x="89">What Is Inside a Seed</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 78)"><rect class="se-activity-panel" x="89" y="596" width="874" height="381" rx="18"/><g class="v2-investigate-icon"><circle cx="128" cy="626" r="12"/><path d="M137 635l10 10"/></g><text class="se-activity-tab-text" x="160" y="635" text-anchor="start">Investigate</text><text class="se-activity-step" x="128" y="684" text-anchor="end">1.</text><text class="se-copy" x="146" y="685"><tspan x="146">Soak a few chana seeds and a few maize seeds in water for two days, until</tspan><tspan x="146" dy="32">they are soft and swollen.</tspan></text><text class="se-activity-step" x="128" y="760" text-anchor="end">2.</text><text class="se-copy" x="146" y="761"><tspan x="146">Peel the thin outer coat off a soaked chana. Now try to split the seed with</tspan><tspan x="146" dy="32">your thumbnail.</tspan></text><text class="se-activity-step" x="128" y="836" text-anchor="end">3.</text><text class="se-copy" x="146" y="837"><tspan x="146">Try gently to separate a soaked maize grain. Do not use a knife or force it</tspan><tspan x="146" dy="32">apart. Record what you can see; compare with the labelled section</tspan><tspan x="146" dy="32">afterwards.</tspan></text><text class="se-copy" x="113" y="945"><tspan x="113">Which seed comes apart neatly into two halves? Which one does not?</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1465H137Q152 1465 160 1480L179 1514H0Z"/><path class="v2-ribbon" d="M0 1465H117Q132 1465 140 1480L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1499" text-anchor="middle">16</text></g></svg></div></div></section>
