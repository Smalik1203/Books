hor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-112" transform="translate(0 -1043)"><text class="se-copy" x="89" y="1179"><tspan x="89">The maize picture is a lengthwise section: it shows parts hidden inside the grain.</tspan><tspan x="89" dy="32">Follow each label to its endpoint. A part’s size alone cannot tell you whether it is</tspan><tspan x="89" dy="32">a cotyledon.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-113" transform="translate(0 112)"><text class="v2-comparison-title" x="89" y="142"><tspan x="89">Chana</tspan></text><text class="se-copy" x="89" y="184" text-anchor="start">•</text><text class="se-copy" x="112" y="184"><tspan x="112">Two fleshy seed leaves, called</tspan><tspan x="112" dy="32"><tspan class="se-bold">cotyledons</tspan>, store food for the young</tspan><tspan x="112" dy="32">plant.</tspan></text><text class="se-copy" x="89" y="288" text-anchor="start">•</text><text class="se-copy" x="112" y="288"><tspan x="112">Between them is the rest of the</tspan><tspan x="112" dy="32">embryo, with a tiny root and shoot.</tspan></text><text class="se-copy" x="89" y="360" text-anchor="start">•</text><text class="se-copy" x="112" y="360"><tspan x="112">Trace each diagram label to its part.</tspan><tspan x="112" dy="32">Locate it in your specimen if visible.</tspan></text>
<text class="v2-comparison-title" x="542" y="142"><tspan x="542">Maize</tspan></text><text class="se-copy" x="542" y="184" text-anchor="start">•</text><text class="se-copy" x="565" y="184"><tspan x="565">One thin cotyledon lies beside the</tspan><tspan x="565" dy="32">embryo’s tiny root and shoot.</tspan></text><text class="se-copy" x="542" y="256" text-anchor="start">•</text><text class="se-copy" x="565" y="256"><tspan x="565">The larger pale food store is the</tspan><tspan x="565" dy="32"><tspan class="se-bold">endosperm</tspan>, not a second cotyledon.</tspan></text><text class="se-copy" x="542" y="328" text-anchor="start">•</text><text class="se-copy" x="565" y="328"><tspan x="565">Failure to split a grain is not proof of</tspan><tspan x="565" dy="32">its cotyledon count.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-114" transform="translate(0 112)"><text class="se-copy" x="89" y="454"><tspan x="89">Cotyledon number, leaf venation and root type are associated features. The</tspan><tspan x="89" dy="32">comparison does not show that cotyledon number causes the other two.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-115" transform="translate(0 112)"><text class="v2-comparison-title" x="89" y="540"><tspan x="89">Flowering-plant groups</tspan></text><text class="se-copy" x="89" y="582" text-anchor="start">•</text><text class="se-copy" x="112" y="582"><tspan x="112"><tspan class="se-bold">Dicotyledons</tspan>, or <tspan class="se-bold">dicots</tspan>: two cotyledons.</tspan></text><text class="se-copy" x="89" y="622" text-anchor="start">•</text><text class="se-copy" x="112" y="622"><tspan x="112"><tspan class="se-bold">Monocotyledons</tspan>, or <tspan class="se-bold">monocots</tspan>: one cotyledon.</tspan></text></g>
