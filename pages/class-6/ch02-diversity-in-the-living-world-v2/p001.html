42.89 75.49 918.23 56.22 M959.41 121.94Q991.92 114.66 1030.85 100.83 M947.1 145.76Q924.06 129.89 892.77 115.03 M957.95 173.42Q988.51 169.29 1025.32 159.01 M957.29 199.59Q935.2 189.36 906.12 181.39 M978.9 226.25Q1004.04 225.36 1034.73 219.81 M987.44 246.61Q968.2 238.21 943.12 231.28"/></g><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number se-running" x="151" y="242" text-anchor="middle">2</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">Diversity in the</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">Living World</text><image class="science-illustration chapter-opener__image" href="../../figures/class-6/science/ch02-v2/opener-v2.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Living things in a school garden</title></image></g>
<text class="se-copy v2-intro" x="89" y="981"><tspan x="89">Go outside your classroom. Stand still for two minutes.</tspan></text>
<text class="se-copy" x="89" y="1033"><tspan x="89">Look for grass in a crack, insects near a wall, or birds overhead. Choose two</tspan><tspan x="89" dy="32">plants. Compare their leaves. What differences can you describe?</tspan></text>
<text class="se-copy" x="89" y="1113"><tspan x="89">A planted tree and a plant growing without anyone sowing it both belong in your</tspan><tspan x="89" dy="32">record. You do not need to know how something arrived before you can observe</tspan><tspan x="89" dy="32">it.</tspan></text>
<text class="se-copy" x="89" y="1225"><tspan x="89">This chapter is about that variety. How much of it is there? How do we make</tspan><tspan x="89" dy="32">sense of it? And why are the living things in one place so different from the living</tspan><tspan x="89" dy="32">things in another?</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
