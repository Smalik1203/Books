<section class="page page--food page--science-editorial page--science-v2" data-folio="22"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 22"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g transform="translate(-148 3) scale(.2)"><g class="v2-ribbon__motif" transform="translate(0 0)" aria-hidden="true"><path class="v2-ribbon__stem" d="M1005 35C930 117 932 200 1018 275"/><path class="v2-ribbon__leaves" d="M994.33 47.31C1005.31 49.71 1020.98 36.37 1024 20C1011.75 25.15 996.71 35.6 994.33 47.31Z M978.05 69.47C992.62 77.79 1025.12 66.86 1041 46C1019.28 47.37 989.73 54.66 978.05 69.47Z M963.3 96.55C965.95 76.92 940.73 53.11 912 52C922.59 71.93 942.72 95.37 963.3 96.55Z M954.26 123.53C973.15 135.98 1017.32 123.91 1040 97C1010.89 97.06 970.91 104.46 954.26 123.53Z M951.06 147.92C949.72 125.2 916.83 105.4 885 112C900.96 131.44 928.18 152.21 951.06 147.92Z M953.1 174.53C970.15 189.5 1011.77 181.61 1034 156C1006.91 152.97 969.39 156.43 953.1 174.53Z M961.02 200.84C956.66 180.93 925.52 168.87 899 180C915.5 194.56 941.9 208.44 961.02 200.84Z M974.87 226.77C987.64 240.88 1022.05 237.75 1042 218C1020.2 213.13 989.44 212.87 974.87 226.77Z M990.66 247.67C986.1 232.61 959.09 222.53 937 230C951.66 241.46 974.71 252.74 990.66 247.67Z"/><path class="v2-ribbon__veins" d="M996.11 45.67Q1008.04 36.59 1021.07 23.37 M981.82 68.07Q1005.8 61.22 1034.32 49.24 M960.22 93.87Q942.89 75.49 918.23 56.22 M959.41 121.94Q991.92 114.66 1030.85 100.83 M947.1 145.76Q924.06 129.89 892.77 115.03 M957.95 173.42Q988.51 169.29 1025.32 159.01 M957.29 199.59Q935.2 189.36 906.12 181.39 M978.9 226.25Q1004.04 225.36 1034.73 219.81 M987.44 246.61Q968.2 238.21 943.12 231.28"/></g></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-163" transform="translate(0 -933)"><text class="se-copy" x="89" y="1069"><tspan x="89">A camel’s hump stores fat, not water. The camel uses it when food is scarce. As</tspan><tspan x="89" dy="32">this fat is used, the hump can become smaller and less upright.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-164" transform="translate(0 -933)"><text class="se-copy" x="89" y="1149"><tspan x="89">Camels save water by passing little urine and dung dry enough to burn. Their</tspan><tspan x="89" dy="32">body temperature can rise during the day, reducing water used for cooling,</tspan></text></g>
<g class="v2-reading-block" data-block="reading-165" transform="translate(0 -933)"><text class="se-copy" x="89" y="1213"><tspan x="89">though they sweat when necessary. Time without drinking depends on heat,</tspan><tspan x="89" dy="32">activity and food.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-166" transform="translate(0 236)"><text class="se-heading" x="89" y="142"><tspan x="89">Adaptations</tspan></text></g>
<g class="v2-reading-block" data-block="reading-167" transform="translate(0 236)"><text class="se-copy" x="89" y="184"><tspan x="89">The cactus stem, the deodar's sloping branches, the camel's padded feet and</tspan><tspan x="89" dy="32">hump — all of these are examples of one idea.</tspan></text></g>
<g class="v2-reading-block" data-block="source-23-2" transform="translate(0 236)"><g class="se-learning-cue se-feature--explain" data-feature="explain" aria-label="How It Works"><svg class="se-feature-icon se-feature--explain" x="89" y="241" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h5m10 0h5M7 7l3 3m4 4 3 3M7 17l3-3m4-4 3-3M15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0"/></svg><text class="se-cue-title" x="145" y="270">How It Works</text></g><text class="se-copy" x="89" y="320"><tspan x="89">Inherited features that help organisms survive and reproduce in their usual</tspan><tspan x="89" dy="32">environment are called <tspan class="se-bold">adaptations</tspan>. They develop in populations over</tspan><tspan x="89" dy="32">generations; an individual does not acquire a needed feature simply by trying.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-169" transform="translate(0 236)"><text class="v2-comparison-title" x="89" y="438"><tspan x="89">Movement in familiar animals</tspan></text><text class="se-copy" x="89" y="480" text-anchor="start">•</text><text class="se-copy" x="112" y="480"><tspan x="112">Adaptations also occur in ordinary surroundings and may be hard to spot.</tspan></text><text class="se-copy" x="89" y="520" text-anchor="start">•</text><text class="se-copy" x="112" y="520"><tspan x="112">Fish: a smooth body moves easily through water; fins help steer and push.</tspan></text><text class="se-copy" x="89" y="560" text-anchor="start">•</text><text class="se-copy" x="112" y="560"><tspan x="112">Duck: skin between the toes makes a paddling surface.</tspan></text><text class="se-copy" x="89" y="600" text-anchor="start">•</text><text class="se-copy" x="112" y="600"><tspan x="112">Pigeon: toes without broad webbing help it grip supports and walk.</tspan></text></g>
<g class="v2-reading-block" data-block="source-23-6" transform="translate(0 236)"><image class="science-illustration" href="../../figures/class-6/science/ch02-v2/feet.png" x="89" y="626" width="874" height="260" preserveAspectRatio="xMidYMid meet"><title>Duck · webbed foot                            Pigeon · no webbing</title></image><text class="se-caption" x="396" y="914" text-anchor="middle">Duck · webbed foot</text><text class="se-caption" x="656" y="914" text-anchor="middle">Pigeon · no webbing</text></g>
<g class="v2-reading-block" data-block="reading-171" transform="translate(0 236)"><text class="se-copy" x="89" y="959"><tspan x="89">Rhododendrons include low shrubs and tall trees in different mountain regions.</tspan><tspan x="89" dy="32">Their features reflect both inherited differences and growing conditions. Even</tspan></text></g>
<g class="v2-reading-block" data-block="reading-172" transform="translate(0 236)"><text class="se-copy" x="89" y="1023"><tspan x="89">plants of the same species may grow differently in a windy, exposed place and in</tspan><tspan x="89" dy="32">a sheltered one. A change in one plant's growth is not the same as an inherited</tspan><tspan x="89" dy="32">adaptation developing over generations.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">22</text></g></svg></div></div></section>
