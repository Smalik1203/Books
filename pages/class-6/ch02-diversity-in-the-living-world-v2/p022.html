data-gap="" dx="4.17533"> </tspan>would<tspan data-gap="" dx="4.17533"> </tspan>you<tspan data-gap="" dx="4.17533"> </tspan>investigate</tspan><tspan x="89" dy="32">before<tspan data-gap="" dx="6.41542"> </tspan>deciding<tspan data-gap="" dx="6.41542"> </tspan>whether<tspan data-gap="" dx="6.41542"> </tspan>it<tspan data-gap="" dx="6.41542"> </tspan>could<tspan data-gap="" dx="6.41542"> </tspan>survive?<tspan data-gap="" dx="6.41542"> </tspan>The<tspan data-gap="" dx="6.41542"> </tspan>word<tspan data-gap="" dx="6.41542"> </tspan>"mountain"<tspan data-gap="" dx="6.41542"> </tspan>alone<tspan data-gap="" dx="6.41542"> </tspan>is<tspan data-gap="" dx="6.41542"> </tspan>not</tspan><tspan x="89" dy="32">enough information.</tspan></text></g>

<g class="v2-reading-block" transform="translate(0 146)"><text class="se-copy" data-measure="874" x="89" y="280"><tspan x="89">Camels<tspan data-gap="" dx="3.98008"> </tspan>live<tspan data-gap="" dx="3.98008"> </tspan>in<tspan data-gap="" dx="3.98008"> </tspan>the<tspan data-gap="" dx="3.98008"> </tspan>hot<tspan data-gap="" dx="3.98008"> </tspan>sandy<tspan data-gap="" dx="3.98008"> </tspan>desert<tspan data-gap="" dx="3.98008"> </tspan>of<tspan data-gap="" dx="3.98008"> </tspan>Rajasthan.<tspan data-gap="" dx="3.98008"> </tspan>Camels<tspan data-gap="" dx="3.98008"> </tspan>also<tspan data-gap="" dx="3.98008"> </tspan>live<tspan data-gap="" dx="3.98008"> </tspan>in<tspan data-gap="" dx="3.98008"> </tspan>the<tspan data-gap="" dx="3.98008"> </tspan>cold,</tspan><tspan x="89" dy="32">high,<tspan data-gap="" dx="3.98355"> </tspan>rocky<tspan data-gap="" dx="3.98355"> </tspan>desert<tspan data-gap="" dx="3.98355"> </tspan>of<tspan data-gap="" dx="3.98355"> </tspan>Ladakh.<tspan data-gap="" dx="3.98355"> </tspan>Both<tspan data-gap="" dx="3.98355"> </tspan>places<tspan data-gap="" dx="3.98355"> </tspan>are<tspan data-gap="" dx="3.98355"> </tspan>deserts.<tspan data-gap="" dx="3.98355"> </tspan>Both<tspan data-gap="" dx="3.98355"> </tspan>are<tspan data-gap="" dx="3.98355"> </tspan>dry,<tspan data-gap="" dx="3.98355"> </tspan>with<tspan data-gap="" dx="3.98355"> </tspan>little</tspan><tspan x="89" dy="32">food<tspan data-gap="" dx="0.47783"> </tspan>and<tspan data-gap="" dx="0.47783"> </tspan>little<tspan data-gap="" dx="0.47783"> </tspan>shelter.<tspan data-gap="" dx="0.47783"> </tspan>But<tspan data-gap="" dx="0.47783"> </tspan>they<tspan data-gap="" dx="0.47783"> </tspan>are<tspan data-gap="" dx="0.47783"> </tspan>dry<tspan data-gap="" dx="0.47783"> </tspan>in<tspan data-gap="" dx="0.47783"> </tspan>very<tspan data-gap="" dx="0.47783"> </tspan>different<tspan data-gap="" dx="0.47783"> </tspan>ways.<tspan data-gap="" dx="0.47783"> </tspan>And<tspan data-gap="" dx="0.47783"> </tspan>the<tspan data-gap="" dx="0.47783"> </tspan>two<tspan data-gap="" dx="0.47783"> </tspan>camels</tspan><tspan x="89" dy="32">are not the same.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 146)"><image class="science-illustration" href="../../figures/class-6/science/ch02-v2/camels.png" x="89" y="402" width="874" height="390" preserveAspectRatio="xMidYMid meet"/>
<text class="se-caption" x="308" y="819" text-anchor="middle">Dromedary · one hump</text>
<text class="se-caption" x="744" y="819" text-anchor="middle">Bactrian · two humps</text></g>
<g class="v2-reading-block" transform="translate(0 146)"><text class="se-copy" x="89" y="869"><tspan x="89">The Rajasthan camel is tall, with long</tspan><tspan x="89" dy="32">legs. Its two-toed feet have broad,</tspan><tspan x="89" dy="32">spreading pads. They spread its</tspan><tspan x="89" dy="32">weight, so it does not sink into loose</tspan><tspan x="89" dy="32">sand. It has one hump. Its coat is thin.</tspan></text>
<text class="se-copy" x="542" y="869"><tspan x="542">The Ladakh camel is shorter and</tspan><tspan x="542" dy="32">heavier. Its sturdy legs also end in</tspan><tspan x="542" dy="32">broad, padded, two-toed feet. It has</tspan><tspan x="542" dy="32">two humps. It grows a thick shaggy</tspan><tspan x="542" dy="32">coat, especially at the head and neck,</tspan><tspan x="542" dy="32">for winters that fall far below freezing.</tspan></text></g>

<g class="v2-reading-block" transform="translate(0 146)"><text class="se-copy" data-measure="874" x="89" y="1113"><tspan x="89">You<tspan data-gap="" dx="2.02711"> </tspan>may<tspan data-gap="" dx="2.02711"> </tspan>have<tspan data-gap="" dx="2.02711"> </tspan>heard<tspan data-gap="" dx="2.02711"> </tspan>that<tspan data-gap="" dx="2.02711"> </tspan>a<tspan data-gap="" dx="2.02711"> </tspan>camel<tspan data-gap="" dx="2.02711"> </tspan>stores<tspan data-gap="" dx="2.02711"> </tspan>water<tspan data-gap="" dx="2.02711"> </tspan>in<tspan data-gap="" dx="2.02711"> </tspan>its<tspan data-gap="" dx="2.02711"> </tspan>hump.<tspan data-gap="" dx="2.02711"> </tspan>That<tspan data-gap="" dx="2.02711"> </tspan>is<tspan data-gap="" dx="2.02711"> </tspan>not<tspan data-gap="" dx="2.02711"> </tspan>true.<tspan data-gap="" dx="2.02711"> </tspan>The</tspan><tspan x="89" dy="32">hump<tspan data-gap="" dx="0.63372"> </tspan>stores<tspan data-gap="" dx="0.63372"> </tspan>fat.<tspan data-gap="" dx="0.63372"> </tspan>The<tspan data-gap="" dx="0.63372"> </tspan>camel<tspan data-gap="" dx="0.63372"> </tspan>lives<tspan data-gap="" dx="0.63372"> </tspan>off<tspan data-gap="" dx="0.63372"> </tspan>that<tspan data-gap="" dx="0.63372"> </tspan>fat<tspan data-gap="" dx="0.63372"> </tspan>when<tspan data-gap="" dx="0.63372"> </tspan>there<tspan data-gap="" dx="0.63372"> </tspan>is<tspan data-gap="" dx="0.63372"> </tspan>no<tspan data-gap="" dx="0.63372"> </tspan>food.<tspan data-gap="" dx="0.63372"> </tspan>When<tspan data-gap="" dx="0.63372"> </tspan>a<tspan data-gap="" dx="0.63372"> </tspan>camel</tspan><tspan x="89" dy="32">uses much of this stored fat, its humps can become smaller and less upright.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M0 1465H137Q152 1465 160 1480L179 1514H0Z"/><pat
