<section class="page page--food page--science-editorial page--science-v2" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Diversity in the Living World V2, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><path class="v2-ribbon-stem" d="M31 63Q34 30 60 7"/><path class="v2-ribbon-leaf" d="M36 46Q10 38 20 14Q38 23 36 46M42 33Q42 8 70 4Q64 26 42 33M33 60Q45 35 73 37Q61 57 33 60"/><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" transform="translate(0 -1108)"><text class="se-copy" data-measure="874" x="89" y="1244"><tspan x="89">Leaves are only part of the comparison. Next, examine roots.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 50)"><text class="se-heading" x="89" y="142"><tspan x="89">Under the Ground</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 50)"><text class="se-copy" data-measure="874" x="89" y="197"><tspan x="89">Roots<tspan data-gap="" dx="4.37082"> </tspan>hold<tspan data-gap="" dx="4.37082"> </tspan>plants<tspan data-gap="" dx="4.37082"> </tspan>in<tspan data-gap="" dx="4.37082"> </tspan>place<tspan data-gap="" dx="4.37082"> </tspan>and<tspan data-gap="" dx="4.37082"> </tspan>take<tspan data-gap="" dx="4.37082"> </tspan>up<tspan data-gap="" dx="4.37082"> </tspan>water<tspan data-gap="" dx="4.37082"> </tspan>and<tspan data-gap="" dx="4.37082"> </tspan>dissolved<tspan data-gap="" dx="4.37082"> </tspan>minerals.<tspan data-gap="" dx="4.37082"> </tspan>You<tspan data-gap="" dx="4.37082"> </tspan>can</tspan><tspan x="89" dy="31">observe their growth as seeds germinate.</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 50)"><rect class="se-activity-panel" x="89" y="252" width="874" height="789" rx="18"/><g class="v2-investigate-icon"><circle cx="128" cy="282" r="12"/><path d="M137 291l10 10"/></g><text class="se-activity-tab-text" x="160" y="291" text-anchor="start">Investigate</text><image class="science-illustration" href="../../figures/class-6/science/ch02-v2/root-setup-v2.png" x="648" y="309" width="285" height="190" preserveAspectRatio="xMidYMid meet"/><text class="se-copy" x="113" y="341"><tspan x="113">You will need: a handful of chana (chickpea)</tspan><tspan x="113" dy="32">seeds, a handful of wheat seeds, two shallow</tspan><tspan x="113" dy="32">trays or plates, cotton cloth or cotton wool,</tspan><tspan x="113" dy="32">water.</tspan></text><text class="se-activity-step" x="128" y="520" text-anchor="end">1.</text><text class="se-copy" x="146" y="521"><tspan x="146">Soak both kinds of seed in water overnight.</tspan></text><text class="se-activity-step" x="128" y="564" text-anchor="end">2.</text><text class="se-copy" x="146" y="565"><tspan x="146">Spread a wet cloth in each tray. Put the chana seeds in one tray. Put the</tspan><tspan x="146" dy="32">wheat seeds in the other.</tspan></text><text class="se-activity-step" x="128" y="640" text-anchor="end">3.</text><text class="se-copy" x="146" y="641"><tspan x="146">Keep both trays in the same place. Keep the cloth damp, not flooded, and</tspan><tspan x="146" dy="32">check it every morning for six days.</tspan></text><text class="se-activity-step" x="128" y="716" text-anchor="end">4.</text><text class="se-copy" x="146" y="717"><tspan x="146">From day three, inspect the seedlings daily. Record when each germinates</tspan><tspan x="146" dy="32">and sketch the roots without tearing them.</tspan></text><text class="se-activity-step" x="128" y="792" text-anchor="end">5.</text><text class="se-copy" x="146" y="793"><tspan x="146">On day six, compare several seedlings of each kind. Keep any that</tspan><tspan x="146" dy="32">germinated late and observe them for a few more days. Do not pull roots</tspan><tspan x="146" dy="32">out of the cloth; examine them gently.</tspan></text><text class="se-copy" x="113" y="901"><tspan x="113">Draw what grew from each kind of seed in your notebook. Use the same scale</tspan><tspan x="113" dy="32">for both drawings.</tspan></text><text class="se-copy" x="113" y="977"><tspan x="113">Could drawings alone tell you which plant is harder to pull out? What would</tspan><tspan x="113" dy="32">you need to keep alike in a comparison of root anchorage?</tspan></text></g>
<g class="v2-reading-block" transform="translate(0 50)"><text class="se-copy" data-measure="874" x="89" y="1098"><tspan x="89">Give<tspan data-gap="" dx="2.97482"> </tspan>each<tspan data-gap="" dx="2.97482"> </tspan>seedling<tspan data-gap="" dx="2.97482"> </tspan>a<tspan data-gap="" dx="2.97482"> </tspan>small<tspan data-gap="" dx="2.97482"> </tspan>identifying<tspan data-gap="" dx="2.97482"> </tspan>label<tspan data-gap="" dx="2.97482"> </tspan>and<tspan data-gap="" dx="2.97482"> </tspan>date<tspan data-gap="" dx="2.97482"> </tspan>each<tspan data-gap="" dx="2.97482"> </tspan>sketch.<tspan data-gap="" dx="2.97482"> </tspan>This<tspan data-gap="" dx="2.97482"> </tspan>lets<tspan data-gap="" dx="2.97482"> </tspan>you</tspan><tspan x="89" dy="31">follow<tspan data-gap="" dx="8.49084"> </tspan>one<tspan data-gap="" dx="8.49084"> </tspan>seedling<tspan data-gap="" dx="8.49084"> </tspan>through<tspan data-gap="" dx="8.49084"> </tspan>time<tspan data-gap="" dx="8.49084"> </tspan>instead<tspan data-gap="" dx="8.49084"> </tspan>of<tspan data-gap="" dx="8.49084"> </tspan>mistaking<tspan data-gap="" dx="8.49084"> </tspan>differences<tspan data-gap="" dx="8.49084"> </tspan>between</tspan><tspan x="89" dy="31">seedlings<tspan data-gap="" dx="1.79041"> </tspan>for<tspan data-gap="" dx="1.79041"> </tspan>changes<tspan data-gap="" dx="1.79041"> </tspan>in<tspan data-gap="" dx="1.79041"> </tspan>one<tspan data-gap="" dx="1.79041"> </tspan>plant.<tspan data-gap="" dx="1.79041"> </tspan>Place<tspan data-gap="" dx="1.79041"> </tspan>a<tspan data-gap="" dx="1.79041"> </tspan>ruler<tspan data-gap="" dx="1.79041"> </tspan>beside<tspan data-gap="" dx="1.79041"> </tspan>it<tspan data-gap="" dx="1.79041"> </tspan>without<tspan data-gap="" dx="1.79041"> </tspan>disturbing<tspan data-gap="" dx="1.79041"> </tspan>the</tspan><tspan x="89" dy="31">roots; include a scale in your drawing.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1465H915Q900 1465 892 1480L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1465H935Q920 1465 912 1480L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1499" text-anchor="middle">13</text></g></svg></div></div></section>
