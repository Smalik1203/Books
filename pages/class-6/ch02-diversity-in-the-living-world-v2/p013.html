hor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Diversity in the Living World</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reading-86" transform="translate(0 -1115)"><text class="se-copy" x="89" y="1251"><tspan x="89">Imagine that seedling A germinated on Monday and seedling B on Wednesday. A</tspan><tspan x="89" dy="32">drawing of both on Friday compares different ages. To compare them at the same</tspan></text></g>
<g class="v2-reading-block" data-block="reading-87" transform="translate(0 -1115)"><text class="se-copy" x="89" y="1315"><tspan x="89">age, use the record of A two days after germination and the record of B two days</tspan><tspan x="89" dy="32">after germination. Keep the dates beside both drawings.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-88" transform="translate(0 144)"><text class="se-copy" x="89" y="136"><tspan x="89">Compare several seedlings of each kind. Did they germinate at the same time?</tspan><tspan x="89" dy="32">Root systems change as seedlings develop, so record the age as well as the shape.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-89" transform="translate(0 144)"><image class="science-illustration" href="../../figures/class-6/science/ch02-v2/roots.png" x="89" y="192" width="874" height="350" preserveAspectRatio="xMidYMid meet"/>
<text class="se-caption" x="308" y="569" text-anchor="middle">Chana · taproot</text>
<text class="se-caption" x="744" y="569" text-anchor="middle">Wheat · fibrous roots</text></g>
<g class="v2-reading-block" data-block="reading-90" transform="translate(0 144)"><text class="v2-comparison-title" x="89" y="621"><tspan x="89">Taproots</tspan></text><text class="se-copy" x="89" y="663" text-anchor="start">•</text><text class="se-copy" x="112" y="663"><tspan x="112">One main root has smaller side</tspan><tspan x="112" dy="32">roots.</tspan></text><text class="se-copy" x="89" y="735" text-anchor="start">•</text><text class="se-copy" x="112" y="735"><tspan x="112">Examples: chana, mustard and</tspan><tspan x="112" dy="32">radish.</tspan></text><text class="se-copy" x="89" y="807" text-anchor="start">•</text><text class="se-copy" x="112" y="807"><tspan x="112">The edible part of a radish includes a</tspan><tspan x="112" dy="32">swollen taproot that stores food.</tspan></text>
<text class="v2-comparison-title" x="542" y="621"><tspan x="542">Fibrous roots</tspan></text><text class="se-copy" x="542" y="663" text-anchor="start">•</text><text class="se-copy" x="565" y="663"><tspan x="565">Several thin roots develop in the</tspan><tspan x="565" dy="32">young wheat seedling.</tspan></text><text class="se-copy" x="542" y="735" text-anchor="start">•</text><text class="se-copy" x="565" y="735"><tspan x="565">Later, roots grow from the stem base</tspan><tspan x="565" dy="32">into a spreading bunch without one</tspan><tspan x="565" dy="32">dominant root.</tspan></text><text class="se-copy" x="542" y="839" text-anchor="start">•</text><text class="se-copy" x="565" y="839"><tspan x="565">Other examples: grass, maize and</tspan><tspan x="565" dy="32">lemongrass.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-91" transform="translate(0 144)"><text class="se-copy" x="89" y="933"><tspan x="89">Both root systems anchor plants and take up water and dissolved minerals. Their</tspan><tspan x="89" dy="32">branching patterns differ; their jobs overlap.</tspan></text></g>
<g class="v2-reading-block" data-block="reading-92" transform="translate(0 144)"><text class="se-copy" x="89" y="1013"><tspan x="89">A taproot system may have many thin side roots, so counting roots alone can</tspan><tspan x="89" dy="32">mislead you. Look for where they join. Do smaller roots branch from a clear</tspan></text></g>
<g class="v2-reading-block" data-block="reading-93" transform="translate(0 144)"><text class="se-copy" x="89" y="1077"><tspan x="89">main root, or do several roots arise near the stem base? Trace these connections</tspan><tspan x="89" dy="32">in the specimen or diagram before choosing a description.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 6</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
