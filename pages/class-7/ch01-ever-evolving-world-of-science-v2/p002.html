<section class="page page--food page--science-editorial page--science-v2 page--v2-g7-ch01" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Ever-Evolving World of Science, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plane-motif"><path d="M30 20L77 8L58 45L51 30ZM51 30L77 8M43 27L41 39L51 30"/><path class="v2-plane-trail" d="M33 41Q15 49 9 35"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 1</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The Ever-Evolving World of Science</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="deeper-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">1.1 Ask Deeper Questions</tspan></text></g>
<g class="v2-reading-block" data-block="flight-question-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Suppose you think that folding up a paper plane’s wingtips will change how far it</tspan><tspan x="89" dy="32">travels. Your explanation is an idea to investigate. A <tspan class="se-bold">prediction</tspan> states what you</tspan></text></g>
<g class="v2-reading-block" data-block="flight-question-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">expect to observe under particular conditions. Before launching, predict whether</tspan><tspan x="89" dy="32">the folded tips will increase the distance, decrease it or make no clear difference.</tspan></text></g>
<g class="v2-reading-block" data-block="plane-investigation" transform="translate(0 314)"><rect class="se-activity-panel" x="89" y="0" width="874" height="918" rx="18"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="21" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="43">Investigate</text></g><text class="se-copy" x="113" y="92"><tspan x="113">With your teacher, make two paper planes from identical sheets using the</tspan><tspan x="113" dy="32">same basic folds. Label them A and B. Keep A’s wingtips flat; fold both of B’s</tspan><tspan x="113" dy="32">wingtips upward by the same amount. Use only paper, without clips or</tspan><tspan x="113" dy="32">pointed attachments.</tspan></text><g transform="translate(310 220)" class="v2-diagram-stroke"><path class="v2-diagram-light" d="M0 0L-105 118L0 86L105 118Z"/><path d="M0 0V86M-105 118L0 50L105 118"/></g><g transform="translate(738 220)" class="v2-diagram-stroke"><path class="v2-diagram-light" d="M0 0L-105 118L0 86L105 118Z"/><path d="M0 0V86M-105 118L0 50L105 118"/><path class="v2-diagram-fold" d="M-105 118L-76 77L-88 100L-105 106ZM105 118L76 77L88 100L105 106Z"/><path class="v2-diagram-dashed" d="M-76 77L-88 100M76 77L88 100"/></g><text class="se-caption" x="310" y="372" text-anchor="middle">A · flat tips</text><text class="se-caption" x="738" y="372" text-anchor="middle">B · tips folded up</text><text class="se-caption" x="524" y="410" text-anchor="middle">Same paper and basic folds</text><text class="se-activity-step" x="132" y="456" text-anchor="end">1.</text><text class="se-copy" x="146" y="456"><tspan x="146">Choose a clear indoor space. Mark a launch line. Use the same launcher,</tspan><tspan x="146" dy="32">launch height and direction, and aim for the same gentle release each</tspan><tspan x="146" dy="32">time.</tspan></text><text class="se-activity-step" x="132" y="564" text-anchor="end">2.</text><text class="se-copy" x="146" y="564"><tspan x="146">Launch A, then B. Measure straight from the launch line to the point</tspan><tspan x="146" dy="32">where each plane first touches the floor, in the intended forward</tspan><tspan x="146" dy="32">direction. Record each distance and its unit in your notebook.</tspan></text><text class="se-activity-step" x="132" y="672" text-anchor="end">3.</text><text class="se-copy" x="146" y="672"><tspan x="146">Alternate A and B until each has made three flights. Note turns, collisions</tspan><tspan x="146" dy="32">or damaged folds; do not quietly replace an inconvenient result.</tspan></text><text class="se-activity-step" x="132" y="748" text-anchor="end">4.</text><text class="se-copy" x="146" y="748"><tspan x="146">Compare all three distances for each plane. Describe any pattern and any</tspan><tspan x="146" dy="32">overlap. What would you test again?</tspan></text><text class="se-copy" x="113" y="824"><tspan x="113">Keep everyone behind the launch line. Never aim at a person. Retrieve</tspan><tspan x="113" dy="32">planes only when launching has stopped. Hand launches vary, so these trials</tspan><tspan x="113" dy="32">cannot establish a rule for every plane.</tspan></text></g>
<g class="v2-reading-block" data-block="record-guidance-0" transform="translate(0 1254)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">fair</tspan> <tspan class="se-bold">comparison</tspan> keeps other relevant conditions alike while testing a</tspan><tspan x="89" dy="32">particular difference. Here the intended difference is the wingtips. The paper,</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
