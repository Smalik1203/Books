<section class="page page--food page--science-editorial page--science-v2 page--v2-g7-ch01" data-folio="10" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Ever-Evolving World of Science, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plane-motif"><path d="M30 20L77 8L58 45L51 30ZM51 30L77 8M43 27L41 39L51 30"/><path class="v2-plane-trail" d="M33 41Q15 49 9 35"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 1</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The Ever-Evolving World of Science</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Let Us Enhance Our Learning</text><text class="se-copy" x="89" y="204"><tspan x="89">Use your notebook for these questions.</tspan></text><text class="se-copy" x="111" y="260" text-anchor="end">1.</text><text class="se-copy" x="132" y="260"><tspan x="132">A class studies water drying from a wet cloth. Identify two topics from this</tspan><tspan x="132" dy="32">year’s book that connect to its question, and explain each connection.</tspan></text><text class="se-copy" x="111" y="347" text-anchor="end">2.</text><text class="se-copy" x="132" y="347"><tspan x="132">Two paper planes are launched by different students from different heights.</tspan><tspan x="132" dy="32">Their distances differ. Explain why this does not isolate the effect of the</tspan><tspan x="132" dy="32">wingtips. Describe a fairer comparison.</tspan></text><text class="se-copy" x="111" y="466" text-anchor="end">3.</text><text class="se-copy" x="132" y="466"><tspan x="132">A learner reports only the longest of three flights. What information has</tspan><tspan x="132" dy="32">been lost? Explain why three flights cannot establish that a design always</tspan><tspan x="132" dy="32">travels farther.</tspan></text><text class="se-copy" x="111" y="585" text-anchor="end">4.</text><text class="se-copy" x="132" y="585"><tspan x="132">Someone suggests paving a school’s muddy patch. What evidence about</tspan><tspan x="132" dy="32">water movement and the uses of the space would help judge the proposal?</tspan><tspan x="132" dy="32">Name one safety precaution when gathering it.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
