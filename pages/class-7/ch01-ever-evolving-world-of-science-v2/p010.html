<section class="page page--food page--science-editorial page--science-v2 page--v2-g7-ch01" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Ever-Evolving World of Science, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plane-motif"><path d="M30 20L77 8L58 45L51 30ZM51 30L77 8M43 27L41 39L51 30"/><path class="v2-plane-trail" d="M33 41Q15 49 9 35"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 1</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The Ever-Evolving World of Science</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="332" rx="18"/><text class="se-copy" x="113" y="222"><tspan x="113"><tspan class="se-bold">Prediction</tspan> — An expected</tspan><tspan x="113" dy="32">observation under stated conditions.</tspan></text><text class="se-copy" x="113" y="300"><tspan x="113"><tspan class="se-bold">Evidence</tspan> — Information used to</tspan><tspan x="113" dy="32">judge an idea or answer a question.</tspan></text><text class="se-copy" x="113" y="378"><tspan x="113"><tspan class="se-bold">Fair</tspan> <tspan class="se-bold">comparison</tspan> — A comparison</tspan><tspan x="113" dy="32">that keeps other relevant conditions</tspan><tspan x="113" dy="32">alike while testing a particular</tspan><tspan x="113" dy="32">difference.</tspan></text><text class="se-copy" x="541" y="222"><tspan x="541"><tspan class="se-bold">Assumption</tspan> — Something accepted</tspan><tspan x="541" dy="32">for the moment without having</tspan><tspan x="541" dy="32">checked it.</tspan></text><text class="se-copy" x="541" y="332"><tspan x="541"><tspan class="se-bold">Evaporation</tspan> — The change of liquid</tspan><tspan x="541" dy="32">water into water vapour at its</tspan><tspan x="541" dy="32">surface.</tspan></text><text class="se-copy" x="541" y="442"><tspan x="541"><tspan class="se-bold">Condensation</tspan> — The change of</tspan><tspan x="541" dy="32">water vapour into liquid water.</tspan></text><text class="v2-title" x="89" y="574" text-anchor="start">Summary</text><text class="se-copy" x="89" y="622" text-anchor="start">•</text><text class="se-copy" x="112" y="622"><tspan x="112">Science develops through questions, observations, tests and explanations that</tspan><tspan x="112" dy="32">can change with evidence.</tspan></text><text class="se-copy" x="89" y="696" text-anchor="start">•</text><text class="se-copy" x="112" y="696"><tspan x="112">A clear question tells you what to observe or measure. A prediction states what</tspan><tspan x="112" dy="32">you expect before a test.</tspan></text><text class="se-copy" x="89" y="770" text-anchor="start">•</text><text class="se-copy" x="112" y="770"><tspan x="112">Fair comparisons and repeated trials help you interpret results, including those</tspan><tspan x="112" dy="32">you did not expect.</tspan></text><text class="se-copy" x="89" y="844" text-anchor="start">•</text><text class="se-copy" x="112" y="844"><tspan x="112">Materials, energy, motion, life processes and Earth’s systems are connected</tspan><tspan x="112" dy="32">topics.</tspan></text><text class="se-copy" x="89" y="918" text-anchor="start">•</text><text class="se-copy" x="112" y="918"><tspan x="112">Responsible investigation considers the environment, other people and safe</tspan><tspan x="112" dy="32">ways of working.</tspan></text><text class="se-copy" x="89" y="992" text-anchor="start">•</text><text class="se-copy" x="112" y="992"><tspan x="112">Creative questions can open new directions. Check their assumptions before</tspan><tspan x="112" dy="32">treating an answer as an explanation.</tspan></text><g transform="translate(0 1042)"><g data-page-illustration="figures/class-7/science/ch01-v2/apparatus-plane-folded.png"><image class="science-illustration" href="../../figures/class-7/science/ch01-v2/apparatus-plane-folded.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A folded paper plane.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A folded paper plane.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
