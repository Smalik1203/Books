<section class="page page--food page--science-editorial page--science-v2 page--v2-g7-ch01" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Ever-Evolving World of Science, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plane-motif"><path d="M30 20L77 8L58 45L51 30ZM51 30L77 8M43 27L41 39L51 30"/><path class="v2-plane-trail" d="M33 41Q15 49 9 35"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 1</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The Ever-Evolving World of Science</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="topics-6-7-0" transform="translate(0 112)"><g data-topic="topics-6-7-0" data-related=""><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Growing and changing</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74" data-prose-align="justify"><tspan x="112" data-paragraph-end="true">Explore adolescence as a stage of growth and change.</tspan></text><text class="se-copy" x="89" y="116" text-anchor="start">•</text><text class="se-copy" x="112" y="116" data-prose-align="justify"><tspan x="112" data-paragraph-end="true">Recognise that people develop at different rates.</tspan></text><text class="se-copy" x="89" y="158" text-anchor="start">•</text><text class="se-copy" x="112" y="158" data-prose-align="justify"><tspan x="112" data-paragraph-end="true">Discuss questions respectfully, without comparing classmates’ bodies.</tspan></text></g></g>
<g class="v2-reading-block" data-block="topics-6-7-1" transform="translate(0 314)"><g data-topic="topics-6-7-1" data-related="water-sequence water-explanation"><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Heat in nature</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74" data-prose-align="justify"><tspan x="112" data-paragraph-end="true">Investigate how heat moves between places.</tspan></text><text class="se-copy" x="89" y="116" text-anchor="start">•</text><text class="se-copy" x="112" y="116" data-prose-align="justify"><tspan x="112" data-paragraph-end="true">Connect heating and cooling with changes in water.</tspan></text><text class="se-copy" x="89" y="158" text-anchor="start">•</text><text class="se-copy" x="112" y="158" data-prose-align="justify"><tspan x="112" data-paragraph-end="true">Follow links among sunlight, evaporation and rain.</tspan></text><g transform="translate(89 188)"><image class="science-illustration v2-topic-photo" data-photo="candle" href="../../figures/class-7/science/ch01-v2/cutouts/candle.png" x="60.5" y="0" width="300" height="225" preserveAspectRatio="xMidYMid meet"><title>A burning candle</title></image><image class="science-illustration v2-topic-photo" data-photo="landscape" href="../../figures/class-7/science/ch01-v2/cutouts/landscape.png" x="494.221" y="0" width="338.558" height="225" preserveAspectRatio="xMidYMid meet"><title>A mountain lake and surrounding peaks, isolated as a photographic vignette</title></image><text class="se-caption" x="210.5" y="252" text-anchor="middle">Candle</text><text class="se-caption" x="663.5" y="252" text-anchor="middle">Mountain lake</text></g><text class="se-copy" x="89" y="478" data-prose-align="justify"><tspan x="89" data-paragraph-end="true">Observe flames only in a teacher-led demonstration.</tspan></text><g data-related-block="water-explanation"><g transform="translate(0 504)"><g data-comparison-table="water-explanation"><text class="v2-table-caption" x="89" y="33.6"><tspan x="89">Evaporation and condensation</tspan></text><rect class="se-table-head" x="89" y="54" width="874" height="48"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="86.08"><tspan x="103">Evaporation</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="540" y="86.08"><tspan x="540">Condensation</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="102" y2="102"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="134.07999999999998"><tspan x="103">Liquid water enters the air as water</tspan><tspan x="103" dy="28">vapour during <tspan class="se-bold">evaporation</tspan>.</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="134.07999999999998"><tspan x="540">When water vapour cools sufficiently,</tspan><tspan x="540" dy="28"><tspan class="se-bold">condensation</tspan> forms tiny liquid droplets;</tspan><tspan x="540" dy="28">clouds may contain droplets, ice crystals</tspan><tspan x="540" dy="28">or both.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="234" y2="234"/><rect class="v2-table-frame" x="89" y="54" width="874" height="180"/><line class="v2-table-rule" x1="526" x2="526" y1="54" y2="234"/><text class="v2-table-note" x="89" y="274.88"><tspan x="89">Water can later fall as rain, flow over land or soak into the ground. Sunlight supplies energy</tspan><tspan x="89" dy="26">for much of this cycling; water vapour itself is invisible.</tspan></text></g></g></g></g></g>
<g class="v2-reading-block" data-block="topics-8-9-0" transform="translate(0 1166)"><g data-topic="topics-8-9-0" data-related=""><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Time and motion</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74" data-prose-align="justify"><tspan x="112" data-paragraph-end="true">Investigate ways to measure time.</tspan></text><text class="se-copy" x="89" y="116" text-anchor="start">•</text><text class="se-copy" x="112" y="116" data-prose-align="justify"><tspan x="112" data-paragraph-end="true">Relate distance travelled to the time taken.</tspan></text><text class="se-copy" x="89" y="158" text-anchor="start">•</text><text class="se-copy" x="112" y="158" data-prose-align="justify"><tspan x="112" data-justify-width="483" data-natural-space="5.59200" data-extra-space="9.06344" data-space-ratio="2.621">Compare<tspan dx="9.06344"> actual</tspan><tspan dx="9.06344"> measurements</tspan><tspan dx="9.06344"> instead</tspan><tspan dx="9.06344"> of</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">relying on impressions such as “fast”.</tspan></text><g transform="translate(627 0)"><image class="science-illustration v2-topic-photo" data-photo="sundial" href="../../figures/class-7/science/ch01-v2/cutouts/sundial.png" x="0" y="0" width="336" height="163.45" preserveAspectRatio="xMidYMid meet"><title>Wire shadows on a stainless-steel sundial</title></image></g><text class="se-caption" x="795" y="196.32999999999998" text-anchor="middle"><tspan x="795">Shadows mark time on a sundial.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text
