<section class="page page--food page--science-editorial page--science-v2 page--v2-g7-ch01" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Ever-Evolving World of Science, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plane-motif"><path d="M30 20L77 8L58 45L51 30ZM51 30L77 8M43 27L41 39L51 30"/><path class="v2-plane-trail" d="M33 41Q15 49 9 35"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 1</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The Ever-Evolving World of Science</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="topics-6-7-0" transform="translate(0 112)"><g data-topic="topics-6-7-0" data-related=""><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Growing and changing</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74"><tspan x="112">Explore adolescence as a stage of growth and change.</tspan></text><text class="se-copy" x="89" y="116" text-anchor="start">•</text><text class="se-copy" x="112" y="116"><tspan x="112">Recognise that people develop at different rates.</tspan></text><text class="se-copy" x="89" y="158" text-anchor="start">•</text><text class="se-copy" x="112" y="158"><tspan x="112">Discuss questions respectfully, without comparing classmates’ bodies.</tspan></text></g></g>
<g class="v2-reading-block" data-block="topics-6-7-1" transform="translate(0 314)"><g data-topic="topics-6-7-1" data-related="water-sequence water-explanation"><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Heat in nature</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74"><tspan x="112">Investigate how heat moves between places.</tspan></text><text class="se-copy" x="89" y="116" text-anchor="start">•</text><text class="se-copy" x="112" y="116"><tspan x="112">Connect heating and cooling with changes in water.</tspan></text><text class="se-copy" x="89" y="158" text-anchor="start">•</text><text class="se-copy" x="112" y="158"><tspan x="112">Follow links among sunlight, evaporation and rain.</tspan></text><g transform="translate(89 188)"><image class="science-illustration v2-topic-photo" data-photo="candle" href="../../figures/class-7/science/ch01-v2/cutouts/candle.png" x="0" y="0" width="300" height="225" preserveAspectRatio="xMidYMid meet"><title>A burning candle</title></image><image class="science-illustration v2-topic-photo" data-photo="landscape" href="../../figures/class-7/science/ch01-v2/cutouts/landscape.png" x="453" y="0" width="338.558" height="225" preserveAspectRatio="xMidYMid meet"><title>A mountain lake and surrounding peaks, isolated as a photographic vignette</title></image><text class="se-caption" x="0" y="252" text-anchor="start">Candle</text><text class="se-caption" x="453" y="252" text-anchor="start">Mountain lake</text></g><text class="se-caption" x="89" y="474.88"><tspan x="89">From a candle to sunlight: heating connects everyday changes with water in nature. Observe</tspan><tspan x="89" dy="27">flames only in a teacher-led demonstration.</tspan></text><g data-related-block="water-explanation"><text class="se-copy" x="89" y="550"><tspan x="89">Liquid water enters the air as water vapour during <tspan class="se-bold">evaporation</tspan>. When water</tspan><tspan x="89" dy="32">vapour cools sufficiently, <tspan class="se-bold">condensation</tspan> forms tiny liquid droplets; clouds may</tspan><tspan x="89" dy="32">contain droplets, ice crystals or both. Water can later fall as rain, flow over land</tspan><tspan x="89" dy="32">or soak into the ground. Sunlight supplies energy for much of this cycling; water</tspan><tspan x="89" dy="32">vapour itself is invisible.</tspan></text></g></g></g>
<g class="v2-reading-block" data-block="topics-8-9-0" transform="translate(0 1030)"><g data-topic="topics-8-9-0" data-related=""><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Time and motion</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74"><tspan x="112">Investigate ways to measure time.</tspan></text><text class="se-copy" x="89" y="116" text-anchor="start">•</text><text class="se-copy" x="112" y="116"><tspan x="112">Relate a moving object’s distance to the time</tspan><tspan x="112" dy="32">taken.</tspan></text><text class="se-copy" x="89" y="190" text-anchor="start">•</text><text class="se-copy" x="112" y="190"><tspan x="112">Compare measurements, rather than</tspan><tspan x="112" dy="32">impressions such as “fast”.</tspan></text><g transform="translate(627 0)"><image class="science-illustration v2-topic-photo" data-photo="sundial" href="../../figures/class-7/science/ch01-v2/cutouts/sundial.png" x="0" y="0" width="336" height="163.45" preserveAspectRatio="xMidYMid meet"><title>Wire shadows on a stainless-steel sundial</title></image></g><text class="se-caption" x="627" y="196.32999999999998"><tspan x="627">A sundial uses shadows to track</tspan><tspan x="627" dy="27">time.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">5</text></g></svg></div></div></section>
