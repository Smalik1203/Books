<section class="page page--food page--science-editorial page--science-v2 page--v2-g7-ch01" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Ever-Evolving World of Science, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plane-motif"><path d="M30 20L77 8L58 45L51 30ZM51 30L77 8M43 27L41 39L51 30"/><path class="v2-plane-trail" d="M33 41Q15 49 9 35"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 1</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The Ever-Evolving World of Science</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="record-guidance-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">basic folds and launch conditions should stay alike. A record of only the longest</tspan><tspan x="89" dy="32">flight would hide how much the other flights varied.</tspan></text></g>
<g class="v2-reading-block" data-block="flight-thinking" transform="translate(0 192)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="326" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="21" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="43">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Suppose one plane travelled farther on its first flight, but the distances for</tspan><tspan x="113" dy="32">the two planes overlapped across the three trials. Would “This design always</tspan><tspan x="113" dy="32">flies farther” be a justified conclusion?</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Discuss how differences in a hand launch, a bent wing or where a plane first</tspan><tspan x="113" dy="32">lands could affect your record. Choose one detail to control more carefully</tspan><tspan x="113" dy="32">on the next set of flights. Explain what more evidence would help you</tspan><tspan x="113" dy="32">decide.</tspan></text></g>
<g class="v2-reading-block" data-block="evidence-limits-0" transform="translate(0 540)"><text class="se-copy" x="89" y="24"><tspan x="89">Your conclusion should describe what your records support. “B travelled farther</tspan><tspan x="89" dy="32">in two of our three pairs of flights” is a narrower claim than “B is the better</tspan></text></g>
<g class="v2-reading-block" data-block="evidence-limits-1" transform="translate(0 604)"><text class="se-copy" x="89" y="24"><tspan x="89">plane”. Better for what: distance, time in the air or a straight path? The question</tspan><tspan x="89" dy="32">determines what you need to measure.</tspan></text></g>
<g class="v2-reading-block" data-block="changing-knowledge-0" transform="translate(0 684)"><text class="se-copy" x="89" y="24"><tspan x="89">Scientific explanations can change when new evidence becomes available. An</tspan><tspan x="89" dy="32">unexpected result is a reason to examine the test, the record and the explanation.</tspan></text></g>
<g class="v2-reading-block" data-block="changing-knowledge-1" transform="translate(0 748)"><text class="se-copy" x="89" y="24"><tspan x="89">It is not a reason to hide the result. Even a result that agrees with your prediction</tspan><tspan x="89" dy="32">may leave something unanswered.</tspan></text></g>
<g class="v2-reading-block" data-block="connections-heading" transform="translate(0 840)"><text class="v2-title" x="89" y="38"><tspan x="89">1.2 Ideas Connect Across Science</tspan></text></g>
<g class="v2-reading-block" data-block="connections-intro-0" transform="translate(0 898)"><text class="se-copy" x="89" y="24"><tspan x="89">This book brings together physics, chemistry, biology and earth science. Their</tspan><tspan x="89" dy="32">questions overlap. A paper plane involves the properties of paper, forces, motion</tspan></text></g>
<g class="v2-reading-block" data-block="connections-intro-1" transform="translate(0 962)"><text class="se-copy" x="89" y="24"><tspan x="89">and measurement. Understanding rain brings together water, heat, air and the</tspan><tspan x="89" dy="32">ground beneath our feet. The chapters ahead develop these connections.</tspan></text></g>
<g class="v2-reading-block" data-block="topics-2-3-0" transform="translate(0 1042)"><g data-topic="topics-2-3-0" data-related=""><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Substances around us</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74"><tspan x="112">Compare acidic, basic and neutral</tspan><tspan x="112" dy="32">substances.</tspan></text><text class="se-copy" x="89" y="148" text-anchor="start">•</text><text class="se-copy" x="112" y="148"><tspan x="112">Investigate questions about sour fruits and a</tspan><tspan x="112" dy="32">haldi stain.</tspan></text><text class="se-copy" x="89" y="222" text-anchor="start">•</text><text class="se-copy" x="112" y="222"><tspan x="112">Use safe tests; never taste an unknown</tspan><tspan x="112" dy="32">substance.</tspan></text><g transform="translate(627 0)"><image class="science-illustration v2-topic-photo" data-photo="lemon" href="../../figures/class-7/science/ch01-v2/cutouts/lemon.png" x="0" y="0" width="331.1320754716981" height="234" preserveAspectRatio="xMidYMid meet"><title>A whole lemon and two cut lemon halves</title></image></g><text class="se-caption" x="627" y="266.88"><tspan x="627">Everyday materials can start a</tspan><tspan x="627" dy="27">question.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
