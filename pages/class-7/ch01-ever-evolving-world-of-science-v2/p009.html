<section class="page page--food page--science-editorial page--science-v2 page--v2-g7-ch01" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Ever-Evolving World of Science, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plane-motif"><path d="M30 20L77 8L58 45L51 30ZM51 30L77 8M43 27L41 39L51 30"/><path class="v2-plane-trail" d="M33 41Q15 49 9 35"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 1</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The Ever-Evolving World of Science</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="creative-vs-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">This is an exercise in creative question-making. An imagined situation is not</tspan><tspan x="89" dy="32">scientific evidence, and an answer can contain an assumption that turns out to be</tspan></text></g>
<g class="v2-reading-block" data-block="creative-vs-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">mistaken. Choose one of your questions and discuss whether observation could</tspan><tspan x="89" dy="32">help answer it. If not, explain what kind of question it is.</tspan></text></g>
<g class="v2-reading-block" data-block="questions-and-observations-0" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">A question about a story may invite imaginative answers. A question about a</tspan><tspan x="89" dy="32">material needs observations that other people can check. State which kind of</tspan><tspan x="89" dy="32">question you are asking, and which information your answer depends on.</tspan></text></g>
<g class="v2-reading-block" data-block="close-0" transform="translate(0 368)"><text class="se-copy" x="89" y="24"><tspan x="89">Keep room for questions that you cannot answer yet. New knowledge, a better</tspan><tspan x="89" dy="32">measurement or a different comparison may let you return to them. The next</tspan></text></g>
<g class="v2-reading-block" data-block="close-1" transform="translate(0 432)"><text class="se-copy" x="89" y="24"><tspan x="89">chapters offer places to begin: look closely, test carefully and let the evidence</tspan><tspan x="89" dy="32">help you rethink.</tspan></text></g><g transform="translate(0 512)"><g data-page-illustration="figures/class-7/science/ch01-v2/apparatus-plane-folded.png"><image class="science-illustration" href="../../figures/class-7/science/ch01-v2/apparatus-plane-folded.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A folded paper plane.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A folded paper plane.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
