<section class="page page--food page--science-editorial page--science-v2 page--v2-g7-ch01" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Ever-Evolving World of Science, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plane-motif"><path d="M30 20L77 8L58 45L51 30ZM51 30L77 8M43 27L41 39L51 30"/><path class="v2-plane-trail" d="M33 41Q15 49 9 35"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 1</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The Ever-Evolving World of Science</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="earth-moon-sun-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">The final chapter turns to Earth, the Moon and the Sun. Earth rotates about its</tspan><tspan x="89" dy="32">axis and travels around the Sun; the Moon travels around Earth. These</tspan></text></g>
<g class="v2-reading-block" data-block="earth-moon-sun-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">movements help explain day and night and the changing positions we observe.</tspan><tspan x="89" dy="32">Earth and the Moon can also cast shadows that produce eclipses. Never look</tspan><tspan x="89" dy="32">directly at the Sun to investigate these ideas.</tspan></text></g>
<g class="v2-reading-block" data-block="earth-light-art" transform="translate(0 288)"><g transform="translate(89 0)"><image class="science-illustration v2-topic-photo" data-photo="earth" href="../../figures/class-7/science/ch01-v2/cutouts/earth.png" x="0" y="9" width="421" height="228" preserveAspectRatio="xMidYMid meet"><title>Earth cutout derived from a Galileo spacecraft photograph</title></image><image class="science-illustration v2-topic-photo" data-photo="eclipse" href="../../figures/class-7/science/ch01-v2/cutouts/eclipse.png" x="453" y="0" width="421" height="246" preserveAspectRatio="xMidYMid meet"><title>A partial solar eclipse photographed at Joshua Tree National Park</title></image><text class="se-caption" x="210" y="277" text-anchor="middle">Earth from space</text><text class="se-caption" x="663" y="277" text-anchor="middle">Partial solar eclipse</text></g><text class="se-caption" x="89" y="308.88"><tspan x="89">Sunlight illuminates one half of Earth. During a solar eclipse, the Moon lies between the Sun</tspan><tspan x="89" dy="27">and Earth and its shadow falls on part of Earth. These photographs show separate views.</tspan></text></g>
<g class="v2-reading-block" data-block="living-processes-0" transform="translate(0 658)"><text class="se-copy" x="89" y="24"><tspan x="89">Plant and animal life processes developed through evolution over many</tspan><tspan x="89" dy="32">generations. Organisms did not plan these changes. Compare their shared needs</tspan><tspan x="89" dy="32">and different structures without assuming they work identically.</tspan></text></g>
<g class="v2-reading-block" data-block="responsibility-heading" transform="translate(0 782)"><text class="v2-title" x="89" y="38"><tspan x="89">1.3 Explore with Care</tspan></text></g>
<g class="v2-reading-block" data-block="environment-0" transform="translate(0 840)"><text class="se-copy" x="89" y="24"><tspan x="89">Investigating the world also brings responsibility. Human activities affect water,</tspan><tspan x="89" dy="32">soil, air and living things. Scientific evidence can help people understand</tspan></text></g>
<g class="v2-reading-block" data-block="environment-1" transform="translate(0 904)"><text class="se-copy" x="89" y="24"><tspan x="89">environmental problems and judge proposed solutions. A useful suggestion</tspan><tspan x="89" dy="32">needs a reason for expecting it to help, and a way to check what happens.</tspan></text></g>
<g class="v2-reading-block" data-block="environment-example-0" transform="translate(0 984)"><text class="se-copy" x="89" y="24"><tspan x="89">For example, rainwater may soak into open ground or flow across a paved</tspan><tspan x="89" dy="32">surface. If a school wants to reduce puddling, it needs to understand where the</tspan></text></g>
<g class="v2-reading-block" data-block="environment-example-1" transform="translate(0 1048)"><text class="se-copy" x="89" y="24"><tspan x="89">water comes from and where it goes. One photograph after one shower cannot</tspan><tspan x="89" dy="32">show how the site behaves in every storm.</tspan></text></g>
<g class="v2-reading-block" data-block="environment-records-0" transform="translate(0 1128)"><text class="se-copy" x="89" y="24"><tspan x="89">Compare records after different showers from a safe, dry place; consider slope,</tspan><tspan x="89" dy="32">surface and drainage. Never enter floodwater or open drains. Discuss changes</tspan></text></g>
<g class="v2-reading-block" data-block="environment-records-1" transform="translate(0 1192)"><text class="se-copy" x="89" y="24"><tspan x="89">with responsible adults, considering evidence, safety, cost and how people use</tspan><tspan x="89" dy="32">the space.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
