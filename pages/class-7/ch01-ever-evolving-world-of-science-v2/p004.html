<section class="page page--food page--science-editorial page--science-v2 page--v2-g7-ch01" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Ever-Evolving World of Science, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plane-motif"><path d="M30 20L77 8L58 45L51 30ZM51 30L77 8M43 27L41 39L51 30"/><path class="v2-plane-trail" d="M33 41Q15 49 9 35"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 1</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The Ever-Evolving World of Science</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="topics-2-3-1" transform="translate(0 112)"><g data-topic="topics-2-3-1" data-related="circuit-image-guidance"><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Electric circuits</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74"><tspan x="112">Explore batteries, lamps, wires and other</tspan><tspan x="112" dy="32">components.</tspan></text><text class="se-copy" x="89" y="148" text-anchor="start">•</text><text class="se-copy" x="112" y="148"><tspan x="112">Test which materials let a lamp glow in a</tspan><tspan x="112" dy="32">circuit.</tspan></text><text class="se-copy" x="89" y="222" text-anchor="start">•</text><text class="se-copy" x="112" y="222"><tspan x="112">Work only with teacher-approved</tspan><tspan x="112" dy="32">low-voltage equipment, never mains</tspan><tspan x="112" dy="32">sockets.</tspan></text><g transform="translate(627 0)"><image class="science-illustration v2-topic-photo" data-photo="circuit" href="../../figures/class-7/science/ch01-v2/cutouts/circuit.png" x="0" y="0" width="223.96099843993758" height="234" preserveAspectRatio="xMidYMid meet"><title>Wires, a lamp and a switch in a classroom circuit demonstration</title></image></g><text class="se-caption" x="627" y="266.88"><tspan x="627">Wires connect circuit</tspan><tspan x="627" dy="27">components.</tspan></text><g data-related-block="circuit-image-guidance"><text class="se-copy" x="89" y="346"><tspan x="89">A spoon can form part of a test circuit’s path. If a lamp stays dark, check the cell,</tspan><tspan x="89" dy="32">lamp and connections before drawing a conclusion about the object. A faulty</tspan><tspan x="89" dy="32">connection can also interrupt the path.</tspan></text></g></g></g>
<g class="v2-reading-block" data-block="topics-4-5-0" transform="translate(0 560)"><g data-topic="topics-4-5-0" data-related=""><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Metals and non-metals</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74"><tspan x="112">Compare properties of materials.</tspan></text><text class="se-copy" x="89" y="116" text-anchor="start">•</text><text class="se-copy" x="112" y="116"><tspan x="112">Use several properties when grouping them.</tspan></text><text class="se-copy" x="89" y="158" text-anchor="start">•</text><text class="se-copy" x="112" y="158"><tspan x="112">Connect a material’s properties with its uses.</tspan></text><g transform="translate(627 0)"><image class="science-illustration v2-topic-photo" data-photo="metal-spoon" href="../../figures/class-7/science/ch01-v2/cutouts/metal-spoon.png" x="0" y="0" width="62" height="169.3375" preserveAspectRatio="xMidYMid meet"><title>A metal teaspoon</title></image><image class="science-illustration v2-topic-photo" data-photo="ceramic-spoons" href="../../figures/class-7/science/ch01-v2/cutouts/ceramic-spoons.png" x="90" y="0" width="246" height="180.9125" preserveAspectRatio="xMidYMid meet"><title>Two ceramic spoons</title></image><text class="se-caption" x="31" y="207" text-anchor="middle">Metal</text><text class="se-caption" x="213" y="207" text-anchor="middle">Ceramic</text></g><text class="se-caption" x="627" y="242.88"><tspan x="627">Similar uses, different materials.</tspan></text></g></g>
<g class="v2-reading-block" data-block="topics-4-5-1" transform="translate(0 841)"><g data-topic="topics-4-5-1" data-related="battery-qualification"><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Changes around us</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74"><tspan x="112">Investigate physical and chemical changes.</tspan></text><text class="se-copy" x="89" y="116" text-anchor="start">•</text><text class="se-copy" x="112" y="116"><tspan x="112">Compare melting ice, ripening fruit and</tspan><tspan x="112" dy="32">rocks breaking.</tspan></text><text class="se-copy" x="89" y="190" text-anchor="start">•</text><text class="se-copy" x="112" y="190"><tspan x="112">Ask which changes can be reversed, and</tspan><tspan x="112" dy="32">how.</tspan></text><g transform="translate(627 0)"><image class="science-illustration v2-topic-photo" data-photo="ice" href="../../figures/class-7/science/ch01-v2/cutouts/ice.png" x="0" y="0" width="336" height="224" preserveAspectRatio="xMidYMid meet"><title>A real ice cube on a wet wooden surface</title></image></g><text class="se-caption" x="627" y="256.88"><tspan x="627">Melting ice: solid changes to liquid.</tspan></text><g data-related-block="battery-qualification"><text class="se-copy" x="89" y="305"><tspan x="89">A battery running out is one example of change, but not all batteries are alike.</tspan><tspan x="89" dy="32">Some are designed to be recharged; others are not. Never try to recharge a</tspan><tspan x="89" dy="32">battery that is not designed for it. The label and correct equipment matter. “Used</tspan><tspan x="89" dy="32">up” does not tell the whole story.</tspan></text></g></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
