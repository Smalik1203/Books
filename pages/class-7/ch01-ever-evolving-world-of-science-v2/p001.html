"chapter-opener__title" x="284" y="156" text-anchor="start">The Ever-Evolving</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">World of Science</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch01-v2/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Students observing a paper-plane flight in a clear school hall</title></image></g><text class="se-copy v2-intro" x="89" y="981"><tspan x="89">Watch a paper plane. What would you like to find out about its flight?</tspan></text><text class="se-copy" x="89" y="1033"><tspan x="89">Perhaps it turns, dips or travels farther than you expected. One flight may raise</tspan><tspan x="89" dy="32">several questions: What changed its direction? Would it follow the same path</tspan><tspan x="89" dy="32">again? What could you measure instead of guessing?</tspan></text><text class="se-copy" x="89" y="1145"><tspan x="89">In Class 6, you began observing, questioning and testing ideas. In Class 7, you</tspan><tspan x="89" dy="32">will look more closely at how things work, why changes happen and what</tspan><tspan x="89" dy="32">patterns can tell you. Curiosity still starts the journey; careful evidence helps you</tspan><tspan x="89" dy="32">decide where to go next.</tspan></text><text class="se-copy" x="89" y="1289"><tspan x="89">Science reaches from tiny cells in a leaf to the movement of Earth and the Moon.</tspan><tspan x="89" dy="32">It also begins with things near you: a stain on cloth, a lamp that will not light or</tspan><tspan x="89" dy="32">water soaking into the ground. Familiar things can lead to unfamiliar questions.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L8
