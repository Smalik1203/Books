"chapter-opener__title" x="284" y="156" text-anchor="start">The Ever-Evolving</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">World of Science</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch01-v2/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Students observing a paper-plane flight in a clear school hall</title></image></g><text class="se-copy v2-intro" x="89" y="981" data-prose-align="justify"><tspan x="89" data-paragraph-end="true">Watch a paper plane. What would you like to find out about its flight?</tspan></text><text class="se-copy" x="89" y="1033" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.56748" data-space-ratio="1.459">Perhaps<tspan dx="2.56748"> it</tspan><tspan dx="2.56748"> turns,</tspan><tspan dx="2.56748"> dips</tspan><tspan dx="2.56748"> or</tspan><tspan dx="2.56748"> travels</tspan><tspan dx="2.56748"> farther</tspan><tspan dx="2.56748"> than</tspan><tspan dx="2.56748"> you</tspan><tspan dx="2.56748"> expected.</tspan><tspan dx="2.56748"> One</tspan><tspan dx="2.56748"> flight</tspan><tspan dx="2.56748"> may</tspan><tspan dx="2.56748"> raise</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.20734" data-space-ratio="1.931">several<tspan dx="5.20734"> questions:</tspan><tspan dx="5.20734"> What</tspan><tspan dx="5.20734"> changed</tspan><tspan dx="5.20734"> its</tspan><tspan dx="5.20734"> direction?</tspan><tspan dx="5.20734"> Would</tspan><tspan dx="5.20734"> it</tspan><tspan dx="5.20734"> follow</tspan><tspan dx="5.20734"> the</tspan><tspan dx="5.20734"> same</tspan><tspan dx="5.20734"> path</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">again? What could you measure instead of guessing?</tspan></text><text class="se-copy" x="89" y="1145" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.73079" data-space-ratio="1.667">In<tspan dx="3.73079"> Class</tspan><tspan dx="3.73079"> 6,</tspan><tspan dx="3.73079"> you</tspan><tspan dx="3.73079"> began</tspan><tspan dx="3.73079"> observing,</tspan><tspan dx="3.73079"> questioning</tspan><tspan dx="3.73079"> and</tspan><tspan dx="3.73079"> testing</tspan><tspan dx="3.73079"> ideas.</tspan><tspan dx="3.73079"> In</tspan><tspan dx="3.73079"> Class</tspan><tspan dx="3.73079"> 7,</tspan><tspan dx="3.73079"> you</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="7.58919" data-space-ratio="2.357">will<tspan dx="7.58919"> look</tspan><tspan dx="7.58919"> more</tspan><tspan dx="7.58919"> closely</tspan><tspan dx="7.58919"> at</tspan><tspan dx="7.58919"> how</tspan><tspan dx="7.58919"> things</tspan><tspan dx="7.58919"> work,</tspan><tspan dx="7.58919"> why</tspan><tspan dx="7.58919"> changes</tspan><tspan dx="7.58919"> happen</tspan><tspan dx="7.58919"> and</tspan><tspan dx="7.58919"> what</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.96202" data-space-ratio="1.172">patterns<tspan dx="0.96202"> can</tspan><tspan dx="0.96202"> tell</tspan><tspan dx="0.96202"> you.</tspan><tspan dx="0.96202"> Curiosity</tspan><tspan dx="0.96202"> still</tspan><tspan dx="0.96202"> starts</tspan><tspan dx="0.96202"> the</tspan><tspan dx="0.96202"> journey;</tspan><tspan dx="0.96202"> careful</tspan><tspan dx="0.96202"> evidence</tspan><tspan dx="0.96202"> helps</tspan><tspan dx="0.96202"> you</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">decide where to go next.</tspan></text><text class="se-copy" x="89" y="1289" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.93039" data-space-ratio="1.166">Science<tspan dx="0.93039"> reaches</tspan><tspan dx="0.93039"> from</tspan><tspan dx="0.93039"> tiny</tspan><tspan dx="0.93039"> cells</tspan><tspan dx="0.93039"> in</tspan><tspan dx="0.93039"> a</tspan><tspan dx="0.93039"> leaf</tspan><tspan dx="0.93039"> to</tspan><tspan dx="0.93039"> the</tspan><tspan dx="0.93039"> movement</tspan><tspan dx="0.93039"> of</tspan><tspan dx="0.93039"> Earth</tspan><tspan dx="0.93039"> and</tspan><tspan dx="0.93039"> the</tspan><tspan dx="0.93039"> Moon.</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.74235" data-space-ratio="1.312">It<tspan dx="1.74235"> also</tspan><tspan dx="1.74235"> begins</tspan><tspan dx="1.74235"> with</tspan><tspan dx="1.74235"> things</tspan><tspan dx="1.74235"> near</tspan><tspan dx="1.74235"> you:</tspan><tspan dx="1.74235"> a</tspan><tspan dx="1.74235"> stain</tspan><tspan dx="1.74235"> on</tspan><tspan dx="1.74235"> cloth,</tspan><tspan dx="1.74235"> a</tspan><tspan dx="1.74235"> lamp</tspan><tspan dx="1.74235"> that</tspan><tspan dx="1.74235"> will</tspan><tspan dx="1.74235"> not</tspan><tspan dx="1.74235"> light</tspan><tspan dx="1.74235"> or</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">water soaking into the ground. Familiar things can lead to unfamiliar questions.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
