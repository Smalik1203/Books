<section class="page page--food page--science-editorial page--science-v2 page--v2-g7-ch01 page--opener" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Ever-Evolving World of Science, page 1"><g class="chapter-opener" data-opener="science-v2-g7-ch01"><defs><linearGradient id="science-v2-g7-ch01-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop class="chapter-opener__gradient-start" offset="0%"/><stop class="chapter-opener__gradient-end" offset="100%"/></linearGradient></defs><path class="chapter-opener__band" fill="url(#science-v2-g7-ch01-gradient)" d="M-17 -17H1069V300H-17Z"/><path class="chapter-opener__edge" d="M-17 296H1069V300H-17Z"/><g class="chapter-opener__motif v2-plane-motif"><path d="M914 112L1030 75L993 179L970 137ZM970 137L1030 75M947 130L947 167L970 137"/><path class="v2-plane-trail" d="M944 180C923 181 915 205 938 215S985 226 974 249"/></g><line class="chapter-opener__divider" x1="240" x2="240" y1="94" y2="252"/><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number se-running" x="151" y="242" text-anchor="middle">1</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">The Ever-Evolving</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">World of Science</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch01-v2/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Students observing a paper-plane flight in a clear school hall</title></image></g><text class="se-copy v2-intro" x="89" y="981"><tspan x="89">Watch a paper plane. What would you like to find out about its flight?</tspan></text><text class="se-copy" x="89" y="1033"><tspan x="89">Perhaps it turns, dips or travels farther than you expected. One flight may raise</tspan><tspan x="89" dy="32">several questions: What changed its direction? Would it follow the same path</tspan><tspan x="89" dy="32">again? What could you measure instead of guessing?</tspan></text><text class="se-copy" x="89" y="1145"><tspan x="89">In Class 6, you began observing, questioning and testing ideas. In Class 7, you</tspan><tspan x="89" dy="32">will look more closely at how things work, why changes happen and what</tspan><tspan x="89" dy="32">patterns can tell you. Curiosity still starts the journey; careful evidence helps you</tspan><tspan x="89" dy="32">decide where to go next.</tspan></text><text class="se-copy" x="89" y="1289"><tspan x="89">Science reaches from tiny cells in a leaf to the movement of Earth and the Moon.</tspan><tspan x="89" dy="32">It also begins with things near you: a stain on cloth, a lamp that will not light or</tspan><tspan x="89" dy="32">water soaking into the ground. Familiar things can lead to unfamiliar questions.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
