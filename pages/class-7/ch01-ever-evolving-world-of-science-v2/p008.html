<section class="page page--food page--science-editorial page--science-v2 page--v2-g7-ch01" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The Ever-Evolving World of Science, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plane-motif"><path d="M30 20L77 8L58 45L51 30ZM51 30L77 8M43 27L41 39L51 30"/><path class="v2-plane-trail" d="M33 41Q15 49 9 35"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 1</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The Ever-Evolving World of Science</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="environment-records-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">with responsible adults, considering evidence, safety, cost and how people use</tspan><tspan x="89" dy="32">the space.</tspan></text></g>
<g class="v2-reading-block" data-block="collaboration-0" transform="translate(0 192)"><text class="se-copy" x="89" y="24"><tspan x="89">Share your question, method and evidence. If others disagree, discuss which</tspan><tspan x="89" dy="32">observation could help resolve it. Ask for guidance when you need unfamiliar</tspan><tspan x="89" dy="32">equipment.</tspan></text></g>
<g class="v2-reading-block" data-block="question-answer-heading" transform="translate(0 316)"><text class="v2-title" x="89" y="38"><tspan x="89">1.4 Question the Answer</tspan></text></g>
<g class="v2-reading-block" data-block="question-answer-intro-0" transform="translate(0 374)"><text class="se-copy" x="89" y="24"><tspan x="89">Usually you are given a question and asked for an answer. Try reversing the task.</tspan><tspan x="89" dy="32">A single answer may fit very different questions. “Just make it half!” could</tspan></text></g>
<g class="v2-reading-block" data-block="question-answer-intro-1" transform="translate(0 438)"><text class="se-copy" x="89" y="24"><tspan x="89">respond to sharing a cake equally, shortening an essay, fitting something into an</tspan><tspan x="89" dy="32">envelope or reducing the length of a dance song.</tspan></text></g>
<g class="v2-reading-block" data-block="question-answer-panel" transform="translate(0 518)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="470" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="21" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="43">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">For each answer below, invent an interesting question or situation that could</tspan><tspan x="113" dy="32">lead to it. Write your questions in your notebook, then compare them with a</tspan><tspan x="113" dy="32">partner.</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">• Because the cat’s teeth were crooked.</tspan></text><text class="se-copy" x="113" y="244"><tspan x="113">• Just add some milk.</tspan></text><text class="se-copy" x="113" y="288"><tspan x="113">• Don’t panic, I have my towel.</tspan></text><text class="se-copy" x="113" y="332"><tspan x="113">• 42</tspan></text><text class="se-copy" x="113" y="376"><tspan x="113">Try different contexts, rather than an obvious arithmetic question for 42.</tspan><tspan x="113" dy="32">Which facts would need to be true for each answer to fit? Identify an</tspan><tspan x="113" dy="32">assumption in one of your situations.</tspan></text></g><g transform="translate(0 1010)"><g data-page-illustration="figures/class-7/science/ch01-v2/apparatus-plane-folded.png"><image class="science-illustration" href="../../figures/class-7/science/ch01-v2/apparatus-plane-folded.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A folded paper plane.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A folded paper plane.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
