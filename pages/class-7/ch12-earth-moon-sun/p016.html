<g class="v2-reading-block" data-block="q2" transform="translate(0 730)"><text class="se-copy" x="111" y="24" text-anchor="end">2.</text><text class="se-copy" x="132" y="24"><tspan x="132">Complete the statements. (a) Stars that rise and set generally appear to rise in</tspan><tspan x="132" dy="32">the ___ and set in the ___. (b) Day and night are caused by Earth’s ___. (c)</tspan><tspan x="132" dy="32">When the Moon completely hides the Sun at an observer’s location, that</tspan><tspan x="132" dy="32">observer sees a ___ solar eclipse.</tspan></text></g>
<g class="v2-reading-block" data-block="q3" transform="translate(0 888)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24"><tspan x="132">Decide whether each statement is true or false. Correct every false</tspan><tspan x="132" dy="32">statement: (a) In a lunar eclipse, the Sun is between Earth and the Moon. (b)</tspan><tspan x="132" dy="32">Gujarat, west of Jharkhand, generally sees sunrise earlier. (c) Chennai has its</tspan><tspan x="132" dy="32">longest daylight around the June solstice. (d) An eclipse makes it safe to look</tspan><tspan x="132" dy="32">at the Sun without protection. (e) Axial tilt changes how sunlight is</tspan><tspan x="132" dy="32">distributed over spherical Earth as it revolves. (f) Earth’s revolution causes</tspan><tspan x="132" dy="32">the daily alternation of day and night.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
