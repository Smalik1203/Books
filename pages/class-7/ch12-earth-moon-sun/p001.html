<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12 page--opener" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 1"><g class="chapter-opener" data-opener="science-g7-ch12"><defs><linearGradient id="science-g7-ch12-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop class="chapter-opener__gradient-start" offset="0%"/><stop class="chapter-opener__gradient-end" offset="100%"/></linearGradient></defs><path class="chapter-opener__band" fill="url(#science-g7-ch12-gradient)" d="M-17 -17H1069V300H-17Z"/><path class="chapter-opener__edge" d="M-17 296H1069V300H-17Z"/><g class="science-header-art" data-header-art="7-12" aria-hidden="true" transform="translate(886 26)"><g data-art-element="globe" transform="translate(7 82) scale(1.12) rotate(-6 50 50)"><circle class="science-header-art__soft" cx="50" cy="46" r="33"/><path d="M24 21Q56 7 72 38T58 77M18 43Q48 63 80 40M28 19L70 73M17 4L86 85M6 55A46 46 0 0 0 65 90M44 92V97M23 97H69"/></g><g data-art-element="sun" transform="translate(72 0) scale(0.62) rotate(8 50 50)"><circle class="science-header-art__soft" cx="50" cy="50" r="24"/><path d="M50 6V16M50 84V94M6 50H16M84 50H94M19 19L27 27M73 73L81 81M19 81L27 73M73 27L81 19"/></g><g data-art-element="moon" transform="translate(64 184) scale(0.65) rotate(7 50 50)"><path class="science-header-art__soft" d="M67 12A39 39 0 1 0 87 70A37 37 0 0 1 67 12Z"/><circle cx="33" cy="56" r="5"/><circle cx="43" cy="77" r="3"/><path d="M79 22V36M72 29H86M91 47V55M87 51H95"/></g></g><line class="chapter-opener__divider" x1="240" x2="240" y1="94" y2="252"/><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number chapter-opener__number--double se-running" x="151" y="242" text-anchor="middle">12</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">Earth, Moon,</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">and the Sun</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch12/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Students and a teacher investigating a globe with a lamp and Moon model</title></image></g><text class="se-copy v2-intro" x="89" y="981"><tspan x="89">A coconut tree casts a long morning shadow. By midday, the shadow is</tspan><tspan x="89" dy="34">shorter. What has moved?</tspan></text><text class="se-copy" x="89" y="1067"><tspan x="89">Rashmika cycles through Kanniyakumari and notices how shadows change</tspan><tspan x="89" dy="32">during the day. The Sun seems to cross the sky, yet the ground beneath her feels</tspan><tspan x="89" dy="32">still. An everyday observation has opened a question about a moving planet.</tspan></text><text class="se-copy" x="89" y="1179"><tspan x="89">Use globes, light and careful observations to connect day and night, the changing</tspan><tspan x="89" dy="32">night sky, seasons and eclipses. Ask what each model helps you explain—and</tspan><tspan x="89" dy="32">where the model differs from Earth, the Moon and the Sun.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
