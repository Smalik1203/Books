<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-space-motif" transform="translate(22 8) scale(.42)"><circle cx="47" cy="53" r="37"/><ellipse cx="47" cy="53" rx="19" ry="37"/><path d="M10 53H84M16 33H78M16 73H78M47 16V90"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Earth, Moon, and the Sun</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q8" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">8.</text><text class="se-copy" x="132" y="24"><tspan x="132">Draw and label two arrangements: (a) a solar eclipse and (b) a lunar eclipse.</tspan><tspan x="132" dy="32">Mark the direction of sunlight and the body whose shadow is involved.</tspan><tspan x="132" dy="32">Explain why your drawing is not to scale and why an eclipse does not happen</tspan><tspan x="132" dy="32">every month.</tspan></text><g transform="translate(0 144)"><g class="v2-space-diagram" data-diagram="system"><svg class="science-illustration" data-art="sun" x="188" y="24" width="152" height="152" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-34"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-34)"><image data-art="sun" href="../../figures/class-7/science/ch12/sun.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><svg class="science-illustration" data-art="earth" x="461" y="35" width="130" height="130" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-35"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-35)"><image data-art="earth" href="../../figures/class-7/science/ch12/earth.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><svg class="science-illustration" data-art="moon" x="742" y="54" width="92" height="92" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-36"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-36)"><image data-art="moon" href="../../figures/class-7/science/ch12/moon.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><text class="v2-space-label" x="264" y="228" text-anchor="middle">Sun: light source</text><text class="v2-space-label" x="526" y="228" text-anchor="middle">Earth: our planet</text><text class="v2-space-label" x="788" y="228" text-anchor="middle">Moon: Earth’s satellite</text></g></g><text class="se-caption" x="89" y="418.88"><tspan x="89">Use the Sun, Earth and Moon to build both arrangements; decide their order yourself.</tspan></text></g>
<g class="v2-reading-block" data-block="q9" transform="translate(0 563)"><text class="se-copy" x="111" y="24" text-anchor="end">9.</text><text class="se-copy" x="132" y="24"><tspan x="132">The Sun is vastly larger than the Moon, yet the Moon can hide it during a</tspan><tspan x="132" dy="32">total solar eclipse. Explain using actual size, distance and apparent size.</tspan><tspan x="132" dy="32">Relate your explanation to the thumb investigation.</tspan></text></g>
<g class="v2-reading-block" data-block="q10" transform="translate(0 689)"><text class="se-copy" x="111" y="24" text-anchor="end">10.</text><text class="se-copy" x="132" y="24"><tspan x="132">You are travelling from India to Australia in December. Which broad</tspan><tspan x="132" dy="32">seasonal difference should guide your packing? What local information</tspan><tspan x="132" dy="32">would you still check before choosing clothes?</tspan></text></g>
<g class="v2-reading-block" data-block="q11" transform="translate(0 815)"><text class="se-copy" x="111" y="24" text-anchor="end">11.</text><text class="se-copy" x="132" y="24"><tspan x="132">Why can a total lunar eclipse be seen from a much larger region of Earth</tspan><tspan x="132" dy="32">than a total solar eclipse? State where an observer needs to be in each case.</tspan></text></g>
<g class="v2-reading-block" data-block="q12" transform="translate(0 909)"><text class="se-copy" x="111" y="24" text-anchor="end">12.</text><text class="se-copy" x="132" y="24"><tspan x="132">Imagine that Earth’s axis were perpendicular to its orbital plane, with no</tspan><tspan x="132" dy="32">axial tilt. Which familiar seasonal effects would be greatly reduced? Would</tspan><tspan x="132" dy="32">day and night stop? Explain why this change would not remove every</tspan><tspan x="132" dy="32">possible variation in weather.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
