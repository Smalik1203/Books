<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12" data-folio="20" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 20"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-space-motif" transform="translate(22 8) scale(.42)"><circle cx="47" cy="53" r="37"/><ellipse cx="47" cy="53" rx="19" ry="37"/><path d="M10 53H84M16 33H78M16 73H78M47 16V90"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Earth, Moon, and the Sun</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project3" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Imagine a much more tilted planet</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Research Uranus, whose axial tilt is about 98°. Compare this with Earth’s tilt of</tspan><tspan x="89" dy="32">about 23.5°. Use a ball model to reason about daylight near the poles over an</tspan><tspan x="89" dy="32">orbit, then write a short illustrated newspaper article about extreme seasons.</tspan><tspan x="89" dy="32">Distinguish facts from your predictions and name your sources. Do not assume</tspan><tspan x="89" dy="32">that Earth’s air, oceans or yearly time scale also apply to Uranus.</tspan></text><image class="science-illustration" data-photo="earth" href="../../figures/class-7/science/ch12/earth.png" x="386" y="224" width="280" height="280" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="534.88"><tspan x="89">Changing the axis changes the pattern of illumination; the model has limits.</tspan></text></g>
<g class="v2-reading-block" data-block="project4" transform="translate(0 677)"><text class="se-heading" x="89" y="30"><tspan x="89">Keep the questions going</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">The Sun also moves slightly as planets orbit: the bodies move about their</tspan><tspan x="89" dy="32">common centre of mass. Astronomers can detect a star’s small motion as one</tspan><tspan x="89" dy="32">clue to unseen planets. Find five connections among this chapter’s pictures and</tspan><tspan x="89" dy="32">earlier science ideas—light, heat, motion, measurement or living things. Write</tspan><tspan x="89" dy="32">one new question for each connection, and decide which could be investigated</tspan><tspan x="89" dy="32">safely nearby and which needs astronomical observations.</tspan></text><image class="science-illustration" data-photo="sun" href="../../figures/class-7/science/ch12/sun.png" x="382.95406929895245" y="256" width="286.0918614020951" height="280" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="566.88"><tspan x="89">A model can open a further question as well as explain an observation.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">20</text></g></svg></div></div></section>
