<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12" data-folio="19"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 19"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-space-motif" transform="translate(22 8) scale(.42)"><circle cx="47" cy="53" r="37"/><ellipse cx="47" cy="53" rx="19" ry="37"/><path d="M10 53H84M16 33H78M16 73H78M47 16V90"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Earth, Moon, and the Sun</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Explore Further</tspan></text></g>
<g class="v2-reading-block" data-block="project1" transform="translate(0 170)"><text class="se-heading" x="89" y="30"><tspan x="89">Follow one tilted axis around an orbit</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">With a teacher, place a cool lamp at the centre of a clear table and move a globe</tspan><tspan x="89" dy="32">around four positions. Keep the axis pointing in the same room direction at every</tspan><tspan x="89" dy="32">position. Rotate the globe at each position and compare how long a marked place</tspan><tspan x="89" dy="32">in each hemisphere spends in the light. Draw the four positions and explain both</tspan><tspan x="89" dy="32">daily and seasonal patterns. Record limits of the model: the lamp is nearby, the</tspan><tspan x="89" dy="32">orbit is small, and the sizes are not to scale.</tspan></text><image class="science-illustration" data-photo="opener" href="../../figures/class-7/science/ch12/opener.png" x="316" y="256" width="420" height="280" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="566.88"><tspan x="89">Keep the lamp fixed and the globe’s axis parallel to its earlier direction.</tspan></text></g>
<g class="v2-reading-block" data-block="project2" transform="translate(0 767)"><text class="se-heading" x="89" y="30"><tspan x="89">How different are the two distances?</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Using the scale 1 cm for 10 million km, draw two concentric circles with radii</tspan><tspan x="89" dy="32">14.7 cm and 15.2 cm on a large sheet. They represent about 147 million and 152</tspan><tspan x="89" dy="32">million km, Earth’s nearest and farthest distances from the Sun. Compare the</tspan><tspan x="89" dy="32">small difference with the radii. These circles mark distance limits, not two Earth</tspan><tspan x="89" dy="32">orbits. Explain why opposite seasons in the two hemispheres are better evidence</tspan><tspan x="89" dy="32">for axial tilt than for the distance explanation.</tspan></text><image class="science-illustration" data-photo="earth" href="../../figures/class-7/science/ch12/earth.png" x="386" y="256" width="280" height="280" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="566.88"><tspan x="89">Earth follows one slightly elliptical, nearly circular orbit.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">19</text></g></svg></div></div></section>
