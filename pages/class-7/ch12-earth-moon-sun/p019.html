<g class="v2-reading-block" data-block="project2" transform="translate(0 767)"><text class="se-heading" x="89" y="30"><tspan x="89">How different are the two distances?</tspan></text><text class="se-copy" x="89" y="72" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.61696" data-space-ratio="1.647">Using<tspan dx="3.61696"> the</tspan><tspan dx="3.61696"> scale</tspan><tspan dx="3.61696"> 1</tspan><tspan dx="3.61696"> cm</tspan><tspan dx="3.61696"> for</tspan><tspan dx="3.61696"> 10</tspan><tspan dx="3.61696"> million</tspan><tspan dx="3.61696"> km,</tspan><tspan dx="3.61696"> draw</tspan><tspan dx="3.61696"> two</tspan><tspan dx="3.61696"> concentric</tspan><tspan dx="3.61696"> circles</tspan><tspan dx="3.61696"> with</tspan><tspan dx="3.61696"> radii</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.19293" data-space-ratio="1.392">14.7<tspan dx="2.19293"> cm</tspan><tspan dx="2.19293"> and</tspan><tspan dx="2.19293"> 15.2</tspan><tspan dx="2.19293"> cm</tspan><tspan dx="2.19293"> on</tspan><tspan dx="2.19293"> a</tspan><tspan dx="2.19293"> large</tspan><tspan dx="2.19293"> sheet.</tspan><tspan dx="2.19293"> They</tspan><tspan dx="2.19293"> represent</tspan><tspan dx="2.19293"> about</tspan><tspan dx="2.19293"> 147</tspan><tspan dx="2.19293"> million</tspan><tspan dx="2.19293"> and</tspan><tspan dx="2.19293"> 152</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.53003" data-space-ratio="1.810">million<tspan dx="4.53003"> km,</tspan><tspan dx="4.53003"> Earth’s</tspan><tspan dx="4.53003"> nearest</tspan><tspan dx="4.53003"> and</tspan><tspan dx="4.53003"> farthest</tspan><tspan dx="4.53003"> distances</tspan><tspan dx="4.53003"> from</tspan><tspan dx="4.53003"> the</tspan><tspan dx="4.53003"> Sun.</tspan><tspan dx="4.53003"> Compare</tspan><tspan dx="4.53003"> the</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.52412" data-space-ratio="1.273">small<tspan dx="1.52412"> difference</tspan><tspan dx="1.52412"> with</tspan><tspan dx="1.52412"> the</tspan><tspan dx="1.52412"> radii.</tspan><tspan dx="1.52412"> These</tspan><tspan dx="1.52412"> circles</tspan><tspan dx="1.52412"> mark</tspan><tspan dx="1.52412"> distance</tspan><tspan dx="1.52412"> limits,</tspan><tspan dx="1.52412"> not</tspan><tspan dx="1.52412"> two</tspan><tspan dx="1.52412"> Earth</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.45489" data-space-ratio="1.260">orbits.<tspan dx="1.45489"> Explain</tspan><tspan dx="1.45489"> why</tspan><tspan dx="1.45489"> opposite</tspan><tspan dx="1.45489"> seasons</tspan><tspan dx="1.45489"> in</tspan><tspan dx="1.45489"> the</tspan><tspan dx="1.45489"> two</tspan><tspan dx="1.45489"> hemispheres</tspan><tspan dx="1.45489"> are</tspan><tspan dx="1.45489"> better</tspan><tspan dx="1.45489"> evidence</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">for axial tilt than for the distance explanation.</tspan></text><image class="science-illustration" data-photo="orbit-measure" href="../../figures/class-7/science/ch01-v2/measuring-tools.png" x="276" y="291.855" width="500" height="208.29" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="566.88"><tspan x="89">Use the same scale when drawing both distance limits.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">19</text></g></svg></div></div></section>
