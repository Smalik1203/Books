<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-space-motif" transform="translate(22 8) scale(.42)"><circle cx="47" cy="53" r="37"/><ellipse cx="47" cy="53" rx="19" ry="37"/><path d="M10 53H84M16 33H78M16 73H78M47 16V90"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Earth, Moon, and the Sun</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204"><tspan x="112">Earth rotates eastwards. The Sun-facing side has day; the side facing away has</tspan><tspan x="112" dy="32">night. A solar day lasts about 24 hours.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278"><tspan x="112">A changing viewpoint makes the Sun and many other celestial bodies appear to</tspan><tspan x="112" dy="32">cross the sky. The Pole Star lies close to the direction of Earth’s northern axis.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352"><tspan x="112">Earth revolves around the Sun in about 365 days and 6 hours. The night side</tspan><tspan x="112" dy="32">faces different star fields as the year progresses.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426"><tspan x="112">Earth’s tilted axis keeps nearly the same direction through the year. Changes in</tspan><tspan x="112" dy="32">sunlight angle and daylight duration produce opposite seasons in the two</tspan><tspan x="112" dy="32">hemispheres.</tspan></text><text class="se-copy" x="89" y="532" text-anchor="start">•</text><text class="se-copy" x="112" y="532"><tspan x="112">Solstices mark extremes of daylight duration; at equinoxes day and night are</tspan><tspan x="112" dy="32">approximately equal. Local weather has additional influences.</tspan></text><text class="se-copy" x="89" y="606" text-anchor="start">•</text><text class="se-copy" x="112" y="606"><tspan x="112">Apparent size depends on actual size and distance. Suitable Sun–Moon–Earth</tspan><tspan x="112" dy="32">alignment produces a solar eclipse; Sun–Earth–Moon alignment produces a</tspan><tspan x="112" dy="32">lunar eclipse.</tspan></text><text class="se-copy" x="89" y="712" text-anchor="start">•</text><text class="se-copy" x="112" y="712"><tspan x="112">Observe solar eclipses only through safe, supervised methods. Lunar eclipses</tspan><tspan x="112" dy="32">are safe to watch with unaided eyes. Use models and records to test</tspan><tspan x="112" dy="32">explanations.</tspan></text><g transform="translate(0 814)"><g class="v2-page-visual"><svg class="science-illustration" data-art="moon" x="753" y="9" width="150" height="150" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-38"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-38)"><image data-art="moon" href="../../figures/class-7/science/ch12/moon.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><text class="v2-space-label" x="113" y="72" text-anchor="start">Trace the path of sunlight.</text><text class="v2-space-label" x="113" y="110" text-anchor="start">Which body could block it?</text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">15</text></g></svg></div></div></section>
