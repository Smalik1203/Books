<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-space-motif" transform="translate(22 8) scale(.42)"><circle cx="47" cy="53" r="37"/><ellipse cx="47" cy="53" rx="19" ry="37"/><path d="M10 53H84M16 33H78M16 73H78M47 16V90"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Earth, Moon, and the Sun</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="daily-sky-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">sunrise times also depend on the date and latitude. The Sun is usually higher</tspan><tspan x="89" dy="32">around local noon, but it is not overhead everywhere or on every day.</tspan></text></g>
<g class="v2-reading-block" data-block="stars-head" transform="translate(0 204)"><text class="se-heading" x="89" y="30"><tspan x="89">Watching the night sky</tspan></text></g>
<g class="v2-reading-block" data-block="stars-question-0" transform="translate(0 252)"><text class="se-copy" x="89" y="24"><tspan x="89">The Moon, planets and many stars also appear to move across the sky during a</tspan><tspan x="89" dy="32">night. Some stars near the celestial pole circle it without rising or setting at a</tspan><tspan x="89" dy="32">particular location. Can you compare a star pattern with a fixed landmark?</tspan></text></g>
<g class="v2-reading-block" data-block="stars-task" transform="translate(0 364)"><rect class="se-activity-panel" x="89" y="0" width="874" height="478" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">With an adult, choose a safe place away from traffic. On a clear evening,</tspan><tspan x="146" dy="32">use a sky chart to identify Saptarishi (the Big Dipper) and Dhruva Tara</tspan><tspan x="146" dy="32">(the Pole Star), if visible from your location. March to May can be</tspan><tspan x="146" dy="32">convenient in much of India.</tspan></text><text class="se-activity-step" x="132" y="232" text-anchor="end">2.</text><text class="se-copy" x="146" y="232"><tspan x="146">Record the date, time and viewing direction. Draw the stars and a fixed</tspan><tspan x="146" dy="32">landmark such as a roof edge. Never climb onto an unprotected roof.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Return to the same position about two hours later. Draw the pattern again</tspan><tspan x="146" dy="32">relative to the landmark. A later observation is optional and needs adult</tspan><tspan x="146" dy="32">supervision; a planetarium simulation can extend the record.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Which positions changed? Which point appears nearly fixed? Compare</tspan><tspan x="146" dy="32">observations before deciding what the pattern means.</tspan></text></g>
<g class="v2-reading-block" data-block="pole-picture" transform="translate(0 864)"><g class="v2-space-diagram" data-diagram="pole"><svg class="science-illustration" data-art="earth" x="726" y="117" width="158" height="158" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-4"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-4)"><image data-art="earth" href="../../figures/class-7/science/ch12/earth.png" x="-10" y="-10" width="220" height="220" transform="rotate(-23.5 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><line class="v2-space-line v2-space-axis" x1="763.9288459006997" y1="101.54281233833223" x2="846.0711540993003" y2="290.4571876616678"/><text class="v2-space-label" x="759.9288459006997" y="93.54281233833223" text-anchor="middle">N</text><text class="v2-space-label" x="805" y="327" text-anchor="middle">Earth’s axis</text><path class="v2-space-trail" d="M339 150A52 52 0 1 0 391 98"/><path class="v2-space-trail" d="M300 150A91 91 0 1 0 391 59"/><path class="v2-space-trail" d="M263 150A128 128 0 1 0 391 22"/><circle class="v2-space-dot" cx="391" cy="150" r="6"/><text class="v2-space-label" x="391" y="178" text-anchor="middle">Pole Star</text><text class="v2-space-label" x="391" y="320" text-anchor="middle">Apparent star paths</text><line class="v2-space-line v2-space-dashed" x1="591" y1="69" x2="750" y2="63"/></g><text class="se-caption" x="89" y="360.88"><tspan x="89">A view towards the northern sky: apparent star paths curve around a point close to the Pole</tspan><tspan x="89" dy="27">Star. These schematic arcs do not show the exact positions of Saptarishi.</tspan></text></g>
<g class="v2-reading-block" data-block="pole-evidence-0" transform="translate(0 1280)"><text class="se-copy" x="89" y="24"><tspan x="89">The Pole Star lies nearly in the direction of Earth’s northern axis, so it appears</tspan><tspan x="89" dy="32">almost stationary while other northern stars seem to circle it. Long-exposure</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
