<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-space-motif" transform="translate(22 8) scale(.42)"><circle cx="47" cy="53" r="37"/><ellipse cx="47" cy="53" rx="19" ry="37"/><path d="M10 53H84M16 33H78M16 73H78M47 16V90"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Earth, Moon, and the Sun</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="seasons-think" transform="translate(0 112)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="218" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Two friends claim that summer occurs because Earth is nearer the Sun. One</tspan><tspan x="113" dy="32">lives in India and the other in Australia. How do their opposite seasons help</tspan><tspan x="113" dy="32">you test the claim? Use both the direction of Earth’s axis and the changing</tspan><tspan x="113" dy="32">distribution of sunlight in your explanation.</tspan></text></g>
<g class="v2-reading-block" data-block="eclipse-head" transform="translate(0 364)"><text class="v2-title" x="89" y="38"><tspan x="89">12.3 Eclipses: Light and Alignment</tspan></text></g>
<g class="v2-reading-block" data-block="alignment-intro-0" transform="translate(0 422)"><text class="se-copy" x="89" y="24"><tspan x="89">The Moon travels around Earth while Earth travels around the Sun. From our</tspan><tspan x="89" dy="32">viewpoint, one body can sometimes pass in front of another. Before explaining</tspan><tspan x="89" dy="32">an eclipse, separate an object’s real size from how large it looks.</tspan></text></g>
<g class="v2-reading-block" data-block="thumb-task" transform="translate(0 534)"><rect class="se-activity-panel" x="89" y="0" width="874" height="338" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Indoors or with your back to the Sun, stand about five metres from a</tspan><tspan x="146" dy="32">friend. Close one eye and hold your thumb at arm’s length.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Align your thumb with your friend’s head. Move the thumb gently</tspan><tspan x="146" dy="32">towards or away from your eye. At what position can it hide the head?</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Compare the thumb’s actual size with the head’s actual size. Record what</tspan><tspan x="146" dy="32">changed when you moved your thumb. Never use the Sun as the object to</tspan><tspan x="146" dy="32">hide.</tspan></text></g>
<g class="v2-reading-block" data-block="size-picture" transform="translate(0 894)"><g class="v2-space-diagram" data-diagram="apparent-size"><svg class="science-illustration" data-art="moon" x="352" y="91" width="86" height="86" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-17"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-17)"><image data-art="moon" href="../../figures/class-7/science/ch12/moon.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><svg class="science-illustration" data-art="sun" x="655" y="9" width="250" height="250" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-18"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-18)"><image data-art="sun" href="../../figures/class-7/science/ch12/sun.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><circle class="v2-space-dot" cx="164" cy="134" r="5"/><line class="v2-space-line " x1="164" y1="134" x2="780" y2="9"/><line class="v2-space-line " x1="164" y1="134" x2="780" y2="259"/><text class="v2-space-label" x="164" y="210" text-anchor="middle">Viewpoint</text><text class="v2-space-label" x="396" y="242" text-anchor="middle">Nearer, smaller</text><text class="v2-space-label" x="780" y="296" text-anchor="middle">Farther, larger</text></g><text class="se-caption" x="89" y="342.88"><tspan x="89">A nearer small object and a farther large object can occupy similar angles in a view. This is a</tspan><tspan x="89" dy="27">comparison of apparent size, not actual diameter.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
