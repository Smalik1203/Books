<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-space-motif" transform="translate(22 8) scale(.42)"><circle cx="47" cy="53" r="37"/><ellipse cx="47" cy="53" rx="19" ry="37"/><path d="M10 53H84M16 33H78M16 73H78M47 16V90"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Earth, Moon, and the Sun</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="750" rx="18"/><text class="se-copy" x="113" y="222"><tspan x="113"><tspan class="se-bold">Axis</tspan> — An imaginary line about</tspan><tspan x="113" dy="32">which an object rotates.</tspan></text><text class="se-copy" x="113" y="306"><tspan x="113"><tspan class="se-bold">Rotation</tspan> — Turning about an axis.</tspan></text><text class="se-copy" x="113" y="358"><tspan x="113"><tspan class="se-bold">Revolution</tspan> — Motion around</tspan><tspan x="113" dy="32">another body.</tspan></text><text class="se-copy" x="113" y="442"><tspan x="113"><tspan class="se-bold">Orbit</tspan> — The path followed during</tspan><tspan x="113" dy="32">revolution.</tspan></text><text class="se-copy" x="113" y="526"><tspan x="113"><tspan class="se-bold">Hemisphere</tspan> — Half of a sphere;</tspan><tspan x="113" dy="32">Earth’s equator separates its</tspan><tspan x="113" dy="32">northern and southern halves.</tspan></text><text class="se-copy" x="113" y="642"><tspan x="113"><tspan class="se-bold">Axial</tspan> <tspan class="se-bold">tilt</tspan> — The angle between the</tspan><tspan x="113" dy="32">rotation axis and a line</tspan><tspan x="113" dy="32">perpendicular to the orbital plane.</tspan></text><text class="se-copy" x="113" y="758"><tspan x="113"><tspan class="se-bold">Solstice</tspan> — Either yearly extreme of</tspan><tspan x="113" dy="32">daylight duration caused by axial</tspan><tspan x="113" dy="32">tilt.</tspan></text><text class="se-copy" x="541" y="222"><tspan x="541"><tspan class="se-bold">Equinox</tspan> — A time when neither</tspan><tspan x="541" dy="32">hemisphere tilts towards the Sun</tspan><tspan x="541" dy="32">and day and night are approximately</tspan><tspan x="541" dy="32">equal.</tspan></text><text class="se-copy" x="541" y="370"><tspan x="541"><tspan class="se-bold">Apparent</tspan> <tspan class="se-bold">motion</tspan> — A change in</tspan><tspan x="541" dy="32">observed position that can result</tspan><tspan x="541" dy="32">from the observer’s motion.</tspan></text><text class="se-copy" x="541" y="486"><tspan x="541"><tspan class="se-bold">Apparent</tspan> <tspan class="se-bold">size</tspan> — How large an</tspan><tspan x="541" dy="32">object looks from a given viewpoint.</tspan></text><text class="se-copy" x="541" y="570"><tspan x="541"><tspan class="se-bold">Solar</tspan> <tspan class="se-bold">eclipse</tspan> — The Sun is hidden</tspan><tspan x="541" dy="32">partly or wholly by the Moon from</tspan><tspan x="541" dy="32">some places on Earth.</tspan></text><text class="se-copy" x="541" y="686"><tspan x="541"><tspan class="se-bold">Lunar</tspan> <tspan class="se-bold">eclipse</tspan> — The Moon passes</tspan><tspan x="541" dy="32">through Earth’s shadow.</tspan></text><text class="se-copy" x="541" y="770"><tspan x="541"><tspan class="se-bold">Umbra</tspan> — The region where the light</tspan><tspan x="541" dy="32">source is completely blocked.</tspan></text><text class="se-copy" x="541" y="854"><tspan x="541"><tspan class="se-bold">Penumbra</tspan> — The region where the</tspan><tspan x="541" dy="32">light source is partly blocked.</tspan></text><g transform="translate(0 944)"><g class="v2-page-visual"><svg class="science-illustration" data-art="moon" x="753" y="9" width="150" height="150" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-37"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-37)"><image data-art="moon" href="../../figures/class-7/science/ch12/moon.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><text class="v2-space-label" x="113" y="72" text-anchor="start">Trace the path of sunlight.</text><text class="v2-space-label" x="113" y="110" text-anchor="start">Which body could block it?</text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
