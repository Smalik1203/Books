<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-space-motif" transform="translate(22 8) scale(.42)"><circle cx="47" cy="53" r="37"/><ellipse cx="47" cy="53" rx="19" ry="37"/><path d="M10 53H84M16 33H78M16 73H78M47 16V90"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Earth, Moon, and the Sun</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="rotation-direction-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Earth rotates from west to east. Viewed from above the North Pole, this is</tspan><tspan x="89" dy="32">anticlockwise. A place returns to approximately the same position relative to the</tspan></text></g>
<g class="v2-reading-block" data-block="rotation-direction-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">Sun after about 24 hours: one day. Earth does not have a physical rod through its</tspan><tspan x="89" dy="32">centre; a globe uses one to represent the axis.</tspan></text></g>
<g class="v2-reading-block" data-block="globe-task" transform="translate(0 256)"><rect class="se-activity-panel" x="89" y="0" width="874" height="478" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Find the poles, equator and India on a globe. Mark a chosen place with a</tspan><tspan x="146" dy="32">small removable sticker. Turn the globe anticlockwise as seen from above</tspan><tspan x="146" dy="32">its North Pole. Follow the sticker through one turn.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">In a dim room, a teacher holds a torch about 1.5 metres from the globe.</tspan><tspan x="146" dy="32">Keep the beam away from eyes. Leave the torch fixed and note which part</tspan><tspan x="146" dy="32">of the globe receives light.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Turn the globe slowly in the same direction. Follow your sticker as it</tspan><tspan x="146" dy="32">enters and leaves the illuminated region. Record the changes without</tspan><tspan x="146" dy="32">moving the torch.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Compare two places in India, one farther east. Which enters the light</tspan><tspan x="146" dy="32">first? Sketch your setup and explain what each object represents.</tspan></text></g>
<g class="v2-reading-block" data-block="daynight-picture" transform="translate(0 756)"><g class="v2-space-diagram" data-diagram="daynight"><svg class="science-illustration" data-art="sun" x="137" y="74" width="140" height="140" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-2"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-2)"><image data-art="sun" href="../../figures/class-7/science/ch12/sun.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><svg class="science-illustration" data-art="earth" x="554" y="32" width="224" height="224" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-3"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-3)"><image data-art="earth" href="../../figures/class-7/science/ch12/earth.png" x="-10" y="-10" width="220" height="220" transform="rotate(-23.5 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><path class="v2-space-night" d="M666 32A112 112 0 0 1 666 256Z"/><line class="v2-space-line v2-space-axis" x1="611.7701266261665" y1="19.279829883623137" x2="720.2298733738335" y2="268.72017011637683"/><text class="v2-space-label" x="607.7701266261665" y="11.279829883623137" text-anchor="middle">N</text><path class="v2-space-arrow" d="M310 85L536 85M527.2241743810963 89.79425538604202L536 85L527.2241743810963 80.20574461395798"/><path class="v2-space-arrow" d="M310 144L536 144M527.2241743810963 148.79425538604204L536 144L527.2241743810963 139.20574461395796"/><path class="v2-space-arrow" d="M310 203L536 203M527.2241743810963 207.79425538604204L536 203L527.2241743810963 198.20574461395796"/><text class="v2-space-label" x="207" y="260" text-anchor="middle">Sun</text><text class="v2-space-label" x="413" y="50" text-anchor="middle">Sunlight</text><text class="v2-space-label" x="666" y="305" text-anchor="middle">Earth</text><text class="v2-space-label" x="527" y="277" text-anchor="middle">Day</text><text class="v2-space-label" x="794" y="277" text-anchor="middle">Night</text></g><text class="se-caption" x="89" y="335.88"><tspan x="89">Sunlight reaches the Sun-facing half of Earth. Rotation carries a place into daylight and then</tspan><tspan x="89" dy="27">into darkness. Sizes and distances are not to scale.</tspan></text></g>
<g class="v2-reading-block" data-block="daynight-evidence-0" transform="translate(0 1147)"><text class="se-copy" x="89" y="24"><tspan x="89">The lit side represents <tspan class="se-bold">day</tspan>; the side facing away from the Sun represents <tspan class="se-bold">night</tspan>.</tspan><tspan x="89" dy="32">At sunrise, a place turns into sunlight. At sunset, it turns out of sunlight. The Sun</tspan><tspan x="89" dy="32">need not travel around Earth once a day to produce this sequence.</tspan></text></g>
<g class="v2-reading-block" data-block="daily-sky-0" transform="translate(0 1259)"><text class="se-copy" x="89" y="24"><tspan x="89">This eastward rotation makes the Sun appear to move westwards across our sky.</tspan><tspan x="89" dy="32">At comparable latitudes, places farther east generally reach sunrise earlier. Exact</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
