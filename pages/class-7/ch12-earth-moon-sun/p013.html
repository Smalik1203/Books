" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><svg class="science-illustration" data-art="moon" x="805" y="127" width="50" height="50" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-26"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-26)"><image data-art="moon" href="../../figures/class-7/science/ch12/moon.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><circle class="v2-space-night" cx="830" cy="152" r="25"/><path class="v2-space-line" d="M525 88L928 107M525 216L928 197"/><text class="v2-space-label" x="170" y="276" text-anchor="middle">Sun</text><text class="v2-space-label" x="525" y="268" text-anchor="middle">Earth</text><text class="v2-space-label" x="830" y="247" text-anchor="middle">Moon</text><text class="v2-space-label" x="768" y="54" text-anchor="middle">Earth’s umbra</text><line class="v2-space-line " x1="764" y1="61" x2="739" y2="135"/><path class="v2-space-arrow" d="M287 152L425 152M416.22417438109625 156.79425538604204L425 152L416.22417438109625 147.20574461395796"/></g><text class="se-caption" x="89" y="348.88"><tspan x="89">Lunar eclipse: Sun → Earth → Moon. Earth’s shadow extends beyond Earth; the Moon passes</tspan><tspan x="89" dy="27">through it. Sizes and distances are not to scale.</tspan></text></g>
<g class="v2-reading-block" data-block="red-moon-0" transform="translate(0 516)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.54266" data-space-ratio="1.276">During<tspan dx="1.54266"> a</tspan><tspan dx="1.54266"> total</tspan><tspan dx="1.54266"> lunar</tspan><tspan dx="1.54266"> eclipse</tspan><tspan dx="1.54266"> the</tspan><tspan dx="1.54266"> Moon</tspan><tspan dx="1.54266"> may</tspan><tspan dx="1.54266"> appear</tspan><tspan dx="1.54266"> reddish.</tspan><tspan dx="1.54266"> Some</tspan><tspan dx="1.54266"> sunlight</tspan><tspan dx="1.54266"> passes</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="8.84631" data-space-ratio="2.582">through<tspan dx="8.84631"> Earth’s</tspan><tspan dx="8.84631"> atmosphere,</tspan><tspan dx="8.84631"> where</tspan><tspan dx="8.84631"> shorter</tspan><tspan dx="8.84631"> wavelengths</tspan><tspan dx="8.84631"> are</tspan><tspan dx="8.84631"> scattered</tspan><tspan dx="8.84631"> more</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="red-moon-1" transform="translate(0 580)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.39538" data-space-ratio="1.607">strongly.<tspan dx="3.39538"> Redder</tspan><tspan dx="3.39538"> light</tspan><tspan dx="3.39538"> bends</tspan><tspan dx="3.39538"> into</tspan><tspan dx="3.39538"> the</tspan><tspan dx="3.39538"> shadow</tspan><tspan dx="3.39538"> and</tspan><tspan dx="3.39538"> reaches</tspan><tspan dx="3.39538"> the</tspan><tspan dx="3.39538"> Moon.</tspan><tspan dx="3.39538"> The</tspan><tspan dx="3.39538"> exact</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">colour depends partly on conditions in the atmosphere.</tspan></text></g>
<g class="v2-reading-block" data-block="lunar-view-0" transform="translate(0 660)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.61456" data-space-ratio="1.289">A<tspan dx="1.61456"> lunar</tspan><tspan dx="1.61456"> eclipse</tspan><tspan dx="1.61456"> can</tspan><tspan dx="1.61456"> be</tspan><tspan dx="1.61456"> seen</tspan><tspan dx="1.61456"> from</tspan><tspan dx="1.61456"> much</tspan><tspan dx="1.61456"> of</tspan><tspan dx="1.61456"> Earth’s</tspan><tspan dx="1.61456"> night</tspan><tspan dx="1.61456"> side,</tspan><tspan dx="1.61456"> wherever</tspan><tspan dx="1.61456"> the</tspan><tspan dx="1.61456"> Moon</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.88329" data-space-ratio="1.337">is<tspan dx="1.88329"> above</tspan><tspan dx="1.88329"> the</tspan><tspan dx="1.88329"> horizon</tspan><tspan dx="1.88329"> and</tspan><tspan dx="1.88329"> the</tspan><tspan dx="1.88329"> sky</tspan><tspan dx="1.88329"> is</tspan><tspan dx="1.88329"> clear.</tspan><tspan dx="1.88329"> It</tspan><tspan dx="1.88329"> is</tspan><tspan dx="1.88329"> safe</tspan><tspan dx="1.88329"> to</tspan><tspan dx="1.88329"> observe</tspan><tspan dx="1.88329"> with</tspan><tspan dx="1.88329"> unaided</tspan><tspan dx="1.88329"> eyes.</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="lunar-view-1" transform="translate(0 724)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.29972" data-space-ratio="1.232">Unlike<tspan dx="1.29972"> a</tspan><tspan dx="1.29972"> solar</tspan><tspan dx="1.29972"> eclipse,</tspan><tspan dx="1.29972"> it</tspan><tspan dx="1.29972"> does</tspan><tspan dx="1.29972"> not</tspan><tspan dx="1.29972"> require</tspan><tspan dx="1.29972"> the</tspan><tspan dx="1.29972"> observer</tspan><tspan dx="1.29972"> to</tspan><tspan dx="1.29972"> stand</tspan><tspan dx="1.29972"> in</tspan><tspan dx="1.29972"> a</tspan><tspan dx="1.29972"> narrow</tspan><tspan dx="1.29972"> track</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">of the Moon’s shadow.</tspan></text></g>
