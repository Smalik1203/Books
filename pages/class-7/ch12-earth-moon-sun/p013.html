<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-space-motif" transform="translate(22 8) scale(.42)"><circle cx="47" cy="53" r="37"/><ellipse cx="47" cy="53" rx="19" ry="37"/><path d="M10 53H84M16 33H78M16 73H78M47 16V90"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Earth, Moon, and the Sun</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="eclipses-table" transform="translate(0 112)"><g data-comparison-table="eclipses-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Comparing the two eclipses</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="312.76" y="70.08"><tspan x="312.76">Solar eclipse</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="644.88" y="70.08"><tspan x="644.88">Lunar eclipse</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Order</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="110.08"><tspan x="312.76">Sun → Moon → Earth</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="110.08"><tspan x="644.88">Sun → Earth → Moon</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="122" y2="122"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="150.07999999999998"><tspan x="103">Shadow falls on</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="150.07999999999998"><tspan x="312.76">Part of Earth</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="150.07999999999998"><tspan x="644.88">The Moon</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="162" y2="162"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="190.07999999999998"><tspan x="103">Moon phase</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="190.07999999999998"><tspan x="312.76">New Moon</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="190.07999999999998"><tspan x="644.88">Full Moon</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="202" y2="202"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="230.07999999999998"><tspan x="103">Where visible</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="230.07999999999998"><tspan x="312.76">A limited part of Earth’s day</tspan><tspan x="312.76" dy="28">side</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="230.07999999999998"><tspan x="644.88">Much of the night side where</tspan><tspan x="644.88" dy="28">the Moon is visible</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="270" y2="270"/><g data-comparison-row="5"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="298.08"><tspan x="103">Eye safety</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="298.08"><tspan x="312.76">Requires safe solar viewing or</tspan><tspan x="312.76" dy="28">indirect projection</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="298.08"><tspan x="644.88">Safe to watch with unaided</tspan><tspan x="644.88" dy="28">eyes</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="338" y2="338"/><rect class="v2-table-frame" x="89" y="42" width="874" height="296"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="42" y2="338"/><line class="v2-table-rule" x1="630.88" x2="630.88" y1="42" y2="338"/></g></g>
<g class="v2-reading-block" data-block="astronomy-head" transform="translate(0 478)"><text class="se-heading" x="89" y="30"><tspan x="89">Observing, recording, predicting</tspan></text></g>
<g class="v2-reading-block" data-block="astronomy-india-0" transform="translate(0 526)"><text class="se-copy" x="89" y="24"><tspan x="89">Kodaikanal Solar Observatory, established in 1899 in the Palani hills, has a long</tspan><tspan x="89" dy="32">record of observations of the Sun. M. K. Vainu Bappu helped develop modern</tspan></text></g>
<g class="v2-reading-block" data-block="astronomy-india-1" transform="translate(0 590)"><text class="se-copy" x="89" y="24"><tspan x="89">observational astronomy in India, including facilities at Nainital and Kavalur.</tspan><tspan x="89" dy="32">Instruments, careful records and trained observers make small or slow changes</tspan><tspan x="89" dy="32">measurable.</tspan></text></g>
<g class="v2-reading-block" data-block="prediction-0" transform="translate(0 702)"><text class="se-copy" x="89" y="24"><tspan x="89">Use a planetarium programme such as Stellarium to explore a predicted eclipse</tspan><tspan x="89" dy="32">for a selected place and date. Compare the simulation with a reliable</tspan></text></g>
<g class="v2-reading-block" data-block="prediction-1" transform="translate(0 766)"><text class="se-copy" x="89" y="24"><tspan x="89">observatory’s information. Whether an eclipse is visible depends on your</tspan><tspan x="89" dy="32">location, the time and whether the relevant body is above the horizon; a</tspan><tspan x="89" dy="32">worldwide event list alone is not enough.</tspan></text></g>
<g class="v2-reading-block" data-block="system-picture" transform="translate(0 878)"><g class="v2-space-diagram" data-diagram="system"><svg class="science-illustration" data-art="sun" x="188" y="24" width="152" height="152" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-27"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-27)"><image data-art="sun" href="../../figures/class-7/science/ch12/sun.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><svg class="science-illustration" data-art="earth" x="461" y="35" width="130" height="130" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-28"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-28)"><image data-art="earth" href="../../figures/class-7/science/ch12/earth.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><svg class="science-illustration" data-art="moon" x="742" y="54" width="92" height="92" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-29"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-29)"><image data-art="moon" href="../../figures/class-7/science/ch12/moon.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><text class="v2-space-label" x="264" y="228" text-anchor="middle">Sun: light source</text><text class="v2-space-label" x="526" y="228" text-anchor="middle">Earth: our planet</text><text class="v2-space-label" x="788" y="228" text-anchor="middle">Moon: Earth’s satellite</text></g><text class="se-caption" x="89" y="274.88"><tspan x="89">Three bodies, several linked ideas: rotation, revolution, illumination and shadows. Use each</tspan><tspan x="89" dy="27">model to answer a particular question.</tspan></text></g>
<g class="v2-reading-block" data-block="closing-evidence-0" transform="translate(0 1208)"><text class="se-copy" x="89" y="24"><tspan x="89">Return to Rashmika’s changing shadows. Daily rotation changes the direction of</tspan><tspan x="89" dy="32">sunlight at a place. Revolution and axial tilt produce a yearly pattern of sunlight.</tspan></text></g>
<g class="v2-reading-block" data-block="closing-evidence-1" transform="translate(0 1272)"><text class="se-copy" x="89" y="24"><tspan x="89">Particular alignments produce eclipses. The same bodies help explain several</tspan><tspan x="89" dy="32">patterns—but each explanation needs its own evidence.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
