<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-space-motif" transform="translate(22 8) scale(.42)"><circle cx="47" cy="53" r="37"/><ellipse cx="47" cy="53" rx="19" ry="37"/><path d="M10 53H84M16 33H78M16 73H78M47 16V90"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Earth, Moon, and the Sun</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="seasonal-stars-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">At the same clock time in different months, we see different parts of the</tspan><tspan x="89" dy="32">surrounding star field. Some constellations that would be in our daytime sky are</tspan></text></g>
<g class="v2-reading-block" data-block="seasonal-stars-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">hidden by bright sunlight. Their stars have not disappeared. Compare the sky at</tspan><tspan x="89" dy="32">the same time on dates about a month apart to look for this slow annual change.</tspan></text></g>
<g class="v2-reading-block" data-block="sky-tradition-0" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">The source describes how Bhil and Pawara communities of the Tapi Valley used</tspan><tspan x="89" dy="32">the appearance of star patterns as seasonal markers for the monsoon. A sky</tspan></text></g>
<g class="v2-reading-block" data-block="sky-tradition-1" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89">pattern can mark a time of year without causing the rain; local weather still</tspan><tspan x="89" dy="32">needs its own observations.</tspan></text></g>
<g class="v2-reading-block" data-block="motions-table" transform="translate(0 400)"><g data-comparison-table="motions-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Two motions, two different questions</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="312.76" y="70.08"><tspan x="312.76">Rotation</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="644.88" y="70.08"><tspan x="644.88">Revolution</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">What moves?</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="110.08"><tspan x="312.76">Earth turns about its own</tspan><tspan x="312.76" dy="28">axis.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="110.08"><tspan x="644.88">Earth travels around the Sun.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">Time scale</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="178.07999999999998"><tspan x="312.76">About 24 hours relative to the</tspan><tspan x="312.76" dy="28">Sun.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="178.07999999999998"><tspan x="644.88">About 365 days and 6 hours.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="218" y2="218"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="246.07999999999998"><tspan x="103">What it explains</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="246.07999999999998"><tspan x="312.76">The daily cycle of day and</tspan><tspan x="312.76" dy="28">night.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="246.07999999999998"><tspan x="644.88">The yearly change in the</tspan><tspan x="644.88" dy="28">night-sky view; with axial tilt,</tspan><tspan x="644.88" dy="28">the seasonal cycle.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="314" y2="314"/><rect class="v2-table-frame" x="89" y="42" width="874" height="272"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="42" y2="314"/><line class="v2-table-rule" x1="630.88" x2="630.88" y1="42" y2="314"/></g></g>
<g class="v2-reading-block" data-block="seasons-head" transform="translate(0 742)"><text class="v2-title" x="89" y="38"><tspan x="89">12.2.1 Why Do Seasons Change?</tspan></text></g>
<g class="v2-reading-block" data-block="tilt-0" transform="translate(0 800)"><text class="se-copy" x="89" y="24"><tspan x="89">Earth’s axis is tilted by about <tspan class="se-bold">23.5°</tspan> from a line perpendicular to its orbital plane.</tspan><tspan x="89" dy="32">During one year, the axis keeps nearly the same direction in space. It does not</tspan><tspan x="89" dy="32">lean towards the Sun at every position on the orbit.</tspan></text></g>
<g class="v2-reading-block" data-block="seasons-picture" transform="translate(0 912)"><g class="v2-space-diagram" data-diagram="seasons"><svg class="science-illustration" data-art="sun" x="480" y="94" width="92" height="92" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-10"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-10)"><image data-art="sun" href="../../figures/class-7/science/ch12/sun.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><svg class="science-illustration" data-art="earth" x="203" y="57" width="166" height="166" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-11"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-11)"><image data-art="earth" href="../../figures/class-7/science/ch12/earth.png" x="-10" y="-10" width="220" height="220" transform="rotate(-23.5 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><path class="v2-space-night" d="M286 57A83 83 0 0 0 286 223Z"/><line class="v2-space-line v2-space-axis" x1="243.33384962499866" y1="41.87457204079173" x2="328.66615037500134" y2="238.12542795920825"/><text class="v2-space-label" x="239.33384962499866" y="33.87457204079173" text-anchor="middle">N</text><svg class="science-illustration" data-art="earth" x="683" y="57" width="166" height="166" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-12"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-12)"><image data-art="earth" href="../../figures/class-7/science/ch12/earth.png" x="-10" y="-10" width="220" height="220" transform="rotate(-23.5 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><path class="v2-space-night" d="M766 57A83 83 0 0 1 766 223Z"/><line class="v2-space-line v2-space-axis" x1="723.3338496249986" y1="41.87457204079173" x2="808.6661503750014" y2="238.12542795920825"/><text class="v2-space-label" x="719.3338496249986" y="33.87457204079173" text-anchor="middle">N</text><path class="v2-space-arrow" d="M465 140L386 140M394.77582561890375 135.20574461395796L386 140L394.77582561890375 144.79425538604204"/><path class="v2-space-arrow" d="M587 140L666 140M657.2241743810963 144.79425538604204L666 140L657.2241743810963 135.20574461395796"/><text class="v2-space-label" x="286" y="275" text-anchor="middle">December</text><text class="v2-space-label" x="766" y="275" text-anchor="middle">June</text><text class="v2-space-label" x="526" y="225" text-anchor="middle">Sun</text></g><text class="se-caption" x="89" y="340.88"><tspan x="89">At the June and December positions, the axes remain parallel. The hemisphere tilted towards</tspan><tspan x="89" dy="27">the Sun changes as Earth moves to the other side of its orbit.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
