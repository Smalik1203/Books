<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-space-motif" transform="translate(22 8) scale(.42)"><circle cx="47" cy="53" r="37"/><ellipse cx="47" cy="53" rx="19" ry="37"/><path d="M10 53H84M16 33H78M16 73H78M47 16V90"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Earth, Moon, and the Sun</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="distance-misconception-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">distance cannot explain those opposite seasons. Nor is a hemisphere’s tiny</tspan><tspan x="89" dy="32">change in distance due to tilt the explanation. The important effects of tilt are</tspan><tspan x="89" dy="32">sunlight angle and duration.</tspan></text></g>
<g class="v2-reading-block" data-block="calendar-head" transform="translate(0 236)"><text class="se-heading" x="89" y="30"><tspan x="89">Solstices, equinoxes and local seasons</tspan></text></g>
<g class="v2-reading-block" data-block="calendar-0" transform="translate(0 284)"><text class="se-copy" x="89" y="24"><tspan x="89">Around 21 June, the Northern Hemisphere has its <tspan class="se-bold">summer</tspan> <tspan class="se-bold">solstice</tspan>, with its</tspan><tspan x="89" dy="32">longest daylight of the year. Around 21–22 December comes its <tspan class="se-bold">winter</tspan> <tspan class="se-bold">solstice</tspan>,</tspan></text></g>
<g class="v2-reading-block" data-block="calendar-1" transform="translate(0 348)"><text class="se-copy" x="89" y="24"><tspan x="89">with the shortest daylight. The Southern Hemisphere has the opposite solstices.</tspan><tspan x="89" dy="32">These calendar dates can vary slightly from year to year.</tspan></text></g>
<g class="v2-reading-block" data-block="equinox-0" transform="translate(0 428)"><text class="se-copy" x="89" y="24"><tspan x="89">At the <tspan class="se-bold">equinoxes</tspan>, around 20–21 March and 22–23 September, neither hemisphere</tspan><tspan x="89" dy="32">is tilted towards the Sun. Day and night are approximately equal.</tspan></text></g>
<g class="v2-reading-block" data-block="equinox-1" transform="translate(0 492)"><text class="se-copy" x="89" y="24"><tspan x="89">“Approximately” matters: the Sun has a visible disc, and the atmosphere bends</tspan><tspan x="89" dy="32">some sunlight.</tspan></text></g>
<g class="v2-reading-block" data-block="polar-picture" transform="translate(0 572)"><g class="v2-space-diagram" data-diagram="polar"><svg class="science-illustration" data-art="sun" x="480" y="94" width="92" height="92" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-14"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-14)"><image data-art="sun" href="../../figures/class-7/science/ch12/sun.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><svg class="science-illustration" data-art="earth" x="203" y="57" width="166" height="166" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-15"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-15)"><image data-art="earth" href="../../figures/class-7/science/ch12/earth.png" x="-10" y="-10" width="220" height="220" transform="rotate(-23.5 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><path class="v2-space-night" d="M286 57A83 83 0 0 0 286 223Z"/><line class="v2-space-line v2-space-axis" x1="243.33384962499866" y1="41.87457204079173" x2="328.66615037500134" y2="238.12542795920825"/><text class="v2-space-label" x="239.33384962499866" y="33.87457204079173" text-anchor="middle">N</text><svg class="science-illustration" data-art="earth" x="683" y="57" width="166" height="166" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-16"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-16)"><image data-art="earth" href="../../figures/class-7/science/ch12/earth.png" x="-10" y="-10" width="220" height="220" transform="rotate(-23.5 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><path class="v2-space-night" d="M766 57A83 83 0 0 1 766 223Z"/><line class="v2-space-line v2-space-axis" x1="723.3338496249986" y1="41.87457204079173" x2="808.6661503750014" y2="238.12542795920825"/><text class="v2-space-label" x="719.3338496249986" y="33.87457204079173" text-anchor="middle">N</text><path class="v2-space-arrow" d="M465 140L386 140M394.77582561890375 135.20574461395796L386 140L394.77582561890375 144.79425538604204"/><path class="v2-space-arrow" d="M587 140L666 140M657.2241743810963 144.79425538604204L666 140L657.2241743810963 135.20574461395796"/><text class="v2-space-label" x="286" y="275" text-anchor="middle">December</text><text class="v2-space-label" x="766" y="275" text-anchor="middle">June</text><text class="v2-space-label" x="526" y="225" text-anchor="middle">Sun</text><text class="v2-space-label" x="286" y="309" text-anchor="middle">North Pole: darkness</text><text class="v2-space-label" x="766" y="309" text-anchor="middle">North Pole: daylight</text></g><text class="se-caption" x="89" y="340.88"><tspan x="89">Near a solstice, the pole tilted towards the Sun stays in light throughout a rotation; the</tspan><tspan x="89" dy="27">opposite pole stays in darkness.</tspan></text></g>
<g class="v2-reading-block" data-block="polar-days-0" transform="translate(0 968)"><text class="se-copy" x="89" y="24"><tspan x="89">At the poles, daylight can last roughly six months, followed by roughly six</tspan><tspan x="89" dy="32">months of darkness. Across the wider polar regions, the duration varies with</tspan></text></g>
<g class="v2-reading-block" data-block="polar-days-1" transform="translate(0 1032)"><text class="se-copy" x="89" y="24"><tspan x="89">latitude. Near the equator, day length stays close to 12 hours throughout the year.</tspan><tspan x="89" dy="32">This does not mean there are no seasonal changes there.</tspan></text></g>
<g class="v2-reading-block" data-block="local-seasons-0" transform="translate(0 1112)"><text class="se-copy" x="89" y="24"><tspan x="89">A place’s seasons are also shaped by monsoon winds, ocean currents, altitude</tspan><tspan x="89" dy="32">and distance from the sea. India’s rainy season cannot be described simply as</tspan></text></g>
<g class="v2-reading-block" data-block="local-seasons-1" transform="translate(0 1176)"><text class="se-copy" x="89" y="24"><tspan x="89">“more daylight”. Connect the large astronomical pattern with the local pattern</tspan><tspan x="89" dy="32">you actually observe.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
