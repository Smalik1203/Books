<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-space-motif" transform="translate(22 8) scale(.42)"><circle cx="47" cy="53" r="37"/><ellipse cx="47" cy="53" rx="19" ry="37"/><path d="M10 53H84M16 33H78M16 73H78M47 16V90"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Earth, Moon, and the Sun</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="rotation-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">12.1 Rotation of the Earth</tspan></text></g>
<g class="v2-reading-block" data-block="relative-motion-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">When you travel in a bus, a nearby tree appears to move backwards. The tree</tspan><tspan x="89" dy="32">need not be moving: your changing viewpoint produces its apparent motion.</tspan><tspan x="89" dy="32">Could a changing viewpoint help explain what we see in the sky?</tspan></text></g>
<g class="v2-reading-block" data-block="turning-task" transform="translate(0 282)"><rect class="se-activity-panel" x="89" y="0" width="874" height="446" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Work in a clear, level space with a teacher. Choose a fixed tree, door or</tspan><tspan x="146" dy="32">building as a landmark. Stand still and note its direction.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Turn slowly anticlockwise, as seen from above your head. Stop after a</tspan><tspan x="146" dy="32">small turn. In which direction did the landmark seem to move across</tspan><tspan x="146" dy="32">your view?</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Repeat slowly in the other direction. Describe the relation between your</tspan><tspan x="146" dy="32">turn and the landmark’s apparent motion. Stop if you feel dizzy.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352"><tspan x="146">A teacher may demonstrate the same idea on a slowly turning playground</tspan><tspan x="146" dy="32">platform, with everyone safely seated and holding on. Compare the</tspan><tspan x="146" dy="32">observation with your standing model.</tspan></text></g>
<g class="v2-reading-block" data-block="turning-picture" transform="translate(0 750)"><g class="v2-space-diagram" data-diagram="rotation"><svg class="science-illustration" data-art="earth" x="419" y="33" width="214" height="214" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-1"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-1)"><image data-art="earth" href="../../figures/class-7/science/ch12/earth.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><line class="v2-space-line v2-space-axis" x1="526" y1="7" x2="526" y2="266"/><text class="v2-space-label" x="680" y="35" text-anchor="start">North Pole</text><line class="v2-space-line " x1="615" y1="30" x2="533" y2="25"/><text class="v2-space-label" x="680" y="265" text-anchor="start">South Pole</text><line class="v2-space-line " x1="628" y1="260" x2="533" y2="245"/><text class="v2-space-label" x="180" y="150" text-anchor="start">Equator</text><line class="v2-space-line " x1="286" y1="143" x2="416" y2="143"/><path class="v2-space-line" d="M426 143Q526 184 626 143"/><path class="v2-space-arrow" d="M478 190L567 190M558.2241743810963 194.79425538604204L567 190L558.2241743810963 185.20574461395796"/><text class="v2-space-label" x="526" y="289" text-anchor="middle">West → east</text></g><text class="se-caption" x="89" y="320.88"><tspan x="89">A fixed landmark can appear to move when the observer turns. The globe helps us change</tspan><tspan x="89" dy="27">viewpoint in a controlled way.</tspan></text></g>
<g class="v2-reading-block" data-block="turning-evidence-0" transform="translate(0 1126)"><text class="se-copy" x="89" y="24"><tspan x="89">Your viewpoint changes as you turn. A fixed object appears to move across your</tspan><tspan x="89" dy="32">view in the opposite direction. This model suggests an explanation for apparent</tspan><tspan x="89" dy="32">motion; it does not, by itself, prove that Earth rotates.</tspan></text></g>
<g class="v2-reading-block" data-block="rotation-definition-0" transform="translate(0 1238)"><text class="se-copy" x="89" y="24"><tspan x="89">A spinning top, a fan and Earth all turn about an <tspan class="se-bold">axis</tspan>. This turning is <tspan class="se-bold">rotation</tspan>.</tspan><tspan x="89" dy="32">Earth’s axis is an imaginary line through its North and South Poles. The equator</tspan><tspan x="89" dy="32">divides Earth into the Northern and Southern Hemispheres.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
