 head.</tspan><tspan dx="4.72053"> Stop</tspan><tspan dx="4.72053"> after</tspan><tspan dx="4.72053"> a</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="5.14291" data-space-ratio="1.920">small<tspan dx="5.14291"> turn.</tspan><tspan dx="5.14291"> In</tspan><tspan dx="5.14291"> which</tspan><tspan dx="5.14291"> direction</tspan><tspan dx="5.14291"> did</tspan><tspan dx="5.14291"> the</tspan><tspan dx="5.14291"> landmark</tspan><tspan dx="5.14291"> seem</tspan><tspan dx="5.14291"> to</tspan><tspan dx="5.14291"> move</tspan><tspan dx="5.14291"> across</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">your view?</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="2.35600" data-space-ratio="1.421">Repeat<tspan dx="2.35600"> slowly</tspan><tspan dx="2.35600"> in</tspan><tspan dx="2.35600"> the</tspan><tspan dx="2.35600"> other</tspan><tspan dx="2.35600"> direction.</tspan><tspan dx="2.35600"> Describe</tspan><tspan dx="2.35600"> the</tspan><tspan dx="2.35600"> relation</tspan><tspan dx="2.35600"> between</tspan><tspan dx="2.35600"> your</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">turn and the landmark’s apparent motion. Stop if you feel dizzy.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="0.64339" data-space-ratio="1.115">A<tspan dx="0.64339"> teacher</tspan><tspan dx="0.64339"> may</tspan><tspan dx="0.64339"> demonstrate</tspan><tspan dx="0.64339"> the</tspan><tspan dx="0.64339"> same</tspan><tspan dx="0.64339"> idea</tspan><tspan dx="0.64339"> on</tspan><tspan dx="0.64339"> a</tspan><tspan dx="0.64339" <g class="v2-reading-block" data-block="turning-picture" transform="translate(0 750)"><g class="v2-space-diagram" data-diagram="rotation"><svg class="science-illustration" data-art="earth" x="419" y="33" width="214" height="214" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-1"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-1)"><image data-art="earth" href="../../figures/class-7/science/ch12/earth.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><line class="v2-space-line v2-space-axis" x1="526" y1="7" x2="526" y2="266"/><text class="v2-space-label" x="680" y="35" text-anchor="start">North Pole</text><line class="v2-space-line " x1="615" y1="30" x2="533" y2="25"/><text class="v2-space-label" x="680" y="265" text-anchor="start">South Pole</text><line class="v2-space-line " x1="628" y1="260" x2="533" y2="245"/><text class="v2-space-label" x="180" y="150" text-anchor="start">Equator</text><line class="v2-space-line " x1="286" y1="143" x2="416" y2="143"/><path class="v2-space-line" d="M426 143Q526 184 626 143"/><path class="v2-space-arrow" d="M478 190L567 190M558.2241743810963 194.79425538604204L567 190L558.2241743810963 185.20574461395796"/><text class="v2-space-label" x="526" y="289" text-anchor="middle">West → east</text></g><text class="se-caption" x="89" y="320.88"><tspan x="89">A fixed landmark can appear to move when the observer turns. The globe helps us change</tspan><tspan x="89" dy="27">viewpoint in a controlled way.</tspan></text></g>
<g class="v2-reading-block" data-block="turning-evidence-0" transform="translate(0 1126)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.09025" data-space-ratio="1.374">Your<tspan dx="2.09025"> viewpoint</tspan><tspan dx="2.09025"> changes</tspan><tspan dx="2.09025"> as</tspan><tspan dx="2.09025"> you</tspan><tspan dx="2.09025"> turn.</tspan><tspan dx="2.09025"> A</tspan><tspan dx="2.09025"> fixed</tspan><tspan dx="2.09025"> object</tspan><tspan dx="2.09025"> appears</tspan><tspan dx="2.09025"> to</tspan><tspan dx="2.09025"> move</tspan><tspan dx="2.09025"> across</tspan><tspan dx="2.09025"> your</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.38738" data-space-ratio="1.427">view<tspan dx="2.38738"> in</tspan><tspan dx="2.38738"> the</tspan><tspan dx="2.38738"> opposite</tspan><tspan dx="2.38738"> direction.</tspan><tspan dx="2.38738"> This</tspan><tspan dx="2.38738"> model</tspan><tspan dx="2.38738"> suggests</tspan><tspan dx="2.38738"> an</tspan><tspan dx="2.38738"> explanation</tspan><tspan dx="2.38738"> for</tspan><tspan dx="2.38738"> apparent</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">motion; it does not, by itself, prove that Earth rotates.</tspan></text></g>
<g class="v2-reading-block" data-block="rotation-definition-0" transform="translate(0 1238)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.51355" data-space-ratio="1.449">A<tspan dx="2.51355"> spinning</tspan><tspan dx="2.51355"> top,</tspan><tspan dx="2.51355"> a</tspan><tspan dx="2.51355"> fan</tspan><tspan dx="2.51355"> and</tspan><tspan dx="2.51355"> Earth</tspan><tspan dx="2.51355"> all</tspan><tspan dx="2.51355"> turn</tspan><tspan dx="2.51355"> about</tspan><tspan dx="2.51355"> an</tspan><tspan dx="2.51355"> <tspan class="se-bold">axis</tspan>.</tspan><tspan dx="2.51355"> This</tspan><tspan dx="2.51355"> turning</tspan><tspan dx="2.51355"> is</tspan><tspan dx="2.51355"> <tspan class="se-bold">rotation</tspan>.</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.14090" data-space-ratio="1.383">Earth’s<tspan dx="2.14090"> axis</tspan><tspan dx="2.14090"> is</tspan><tspan dx="2.14090"> an</tspan><tspan dx="2.14090"> imaginary</tspan><tspan dx="2.14090"> line</tspan><tspan dx="2.14090"> through</tspan><tspan dx="2.14090"> its</tspan><tspan dx="2.14090"> North</tspan><tspan dx="2.14090"> and</tspan><tspan dx="2.14090"> South</tspan><tspan dx="2.14090"> Poles.</tspan><tspan dx="2.14090"> The</tspan><tspan dx="2.14090"> equator</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">divides Earth into the Northern and Southern Hemispheres.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></s
