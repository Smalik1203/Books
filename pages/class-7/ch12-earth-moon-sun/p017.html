<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12" data-folio="17"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 17"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-space-motif" transform="translate(22 8) scale(.42)"><circle cx="47" cy="53" r="37"/><ellipse cx="47" cy="53" rx="19" ry="37"/><path d="M10 53H84M16 33H78M16 73H78M47 16V90"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Earth, Moon, and the Sun</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q4" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24"><tspan x="132">Orion was in a particular position at 8 p.m. yesterday. About what time will it</tspan><tspan x="132" dy="32">return to nearly the same position tonight? Explain why the answer differs</tspan><tspan x="132" dy="32">slightly from 8 p.m.</tspan></text></g>
<g class="v2-reading-block" data-block="q5" transform="translate(0 238)"><text class="se-copy" x="111" y="24" text-anchor="end">5.</text><text class="se-copy" x="132" y="24"><tspan x="132">A student records a star pattern at midnight on 21 June. Around which date</tspan><tspan x="132" dy="32">next year should the same pattern return to a similar position at midnight?</tspan><tspan x="132" dy="32">Distinguish this yearly change from the stars’ apparent motion during one</tspan><tspan x="132" dy="32">night.</tspan></text></g>
<g class="v2-reading-block" data-block="q6" transform="translate(0 396)"><text class="se-copy" x="111" y="24" text-anchor="end">6.</text><text class="se-copy" x="132" y="24"><tspan x="132">It is daytime in India when you call an uncle in a part of the United States</tspan><tspan x="132" dy="32">where it is night. Explain this using a rotating globe. Why is “all of the United</tspan><tspan x="132" dy="32">States always has night when India has day” too broad a statement?</tspan></text><g transform="translate(0 112)"><g class="v2-space-diagram" data-diagram="daynight"><svg class="science-illustration" data-art="sun" x="137" y="74" width="140" height="140" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-32"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-32)"><image data-art="sun" href="../../figures/class-7/science/ch12/sun.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><svg class="science-illustration" data-art="earth" x="554" y="32" width="224" height="224" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-33"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-33)"><image data-art="earth" href="../../figures/class-7/science/ch12/earth.png" x="-10" y="-10" width="220" height="220" transform="rotate(-23.5 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><path class="v2-space-night" d="M666 32A112 112 0 0 1 666 256Z"/><line class="v2-space-line v2-space-axis" x1="611.7701266261665" y1="19.279829883623137" x2="720.2298733738335" y2="268.72017011637683"/><text class="v2-space-label" x="607.7701266261665" y="11.279829883623137" text-anchor="middle">N</text><path class="v2-space-arrow" d="M310 85L536 85M527.2241743810963 89.79425538604202L536 85L527.2241743810963 80.20574461395798"/><path class="v2-space-arrow" d="M310 144L536 144M527.2241743810963 148.79425538604204L536 144L527.2241743810963 139.20574461395796"/><path class="v2-space-arrow" d="M310 203L536 203M527.2241743810963 207.79425538604204L536 203L527.2241743810963 198.20574461395796"/><text class="v2-space-label" x="207" y="260" text-anchor="middle">Sun</text><text class="v2-space-label" x="413" y="50" text-anchor="middle">Sunlight</text><text class="v2-space-label" x="666" y="305" text-anchor="middle">Earth</text><text class="v2-space-label" x="527" y="277" text-anchor="middle">Day</text><text class="v2-space-label" x="794" y="277" text-anchor="middle">Night</text></g></g><text class="se-caption" x="89" y="447.88"><tspan x="89">Use different places on the globe to explain the call.</tspan></text></g>
<g class="v2-reading-block" data-block="q7" transform="translate(0 876)"><text class="se-copy" x="111" y="24" text-anchor="end">7.</text><text class="se-copy" x="132" y="24"><tspan x="132">Which proposed solar-eclipse observations are acceptable, and under what</tspan><tspan x="132" dy="32">conditions? (a) Proper solar viewers checked by a knowledgeable adult. (b) A</tspan><tspan x="132" dy="32">teacher’s mirror projection onto a wall. (c) Direct naked-eye viewing. (d) An</tspan><tspan x="132" dy="32">organised planetarium event. Explain why the name of a device or event</tspan><tspan x="132" dy="32">alone is not enough to guarantee safety.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">17</text></g></svg></div></div></section>
