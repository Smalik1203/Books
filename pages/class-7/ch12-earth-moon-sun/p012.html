<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-space-motif" transform="translate(22 8) scale(.42)"><circle cx="47" cy="53" r="37"/><ellipse cx="47" cy="53" rx="19" ry="37"/><path d="M10 53H84M16 33H78M16 73H78M47 16V90"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Earth, Moon, and the Sun</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="eclipse-myths-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">proper protection. A planetarium or astronomy club can organise safe</tspan><tspan x="89" dy="32">observations and explain why careful prediction is possible.</tspan></text></g>
<g class="v2-reading-block" data-block="eclipse-history-0" transform="translate(0 192)"><text class="se-copy" x="89" y="24"><tspan x="89">Indian astronomical works such as the Surya Siddhanta developed methods for</tspan><tspan x="89" dy="32">calculating eclipses. Predictions can be compared with observed times and</tspan></text></g>
<g class="v2-reading-block" data-block="eclipse-history-1" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">places. Such a comparison tests a model against an event; it is different from</tspan><tspan x="89" dy="32">attaching a harmful omen to an eclipse.</tspan></text></g>
<g class="v2-reading-block" data-block="lunar-head" transform="translate(0 348)"><text class="v2-title" x="89" y="38"><tspan x="89">12.3.2 Lunar Eclipses</tspan></text></g>
<g class="v2-reading-block" data-block="lunar-definition-0" transform="translate(0 406)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">lunar</tspan> <tspan class="se-bold">eclipse</tspan> occurs when Earth is between the Sun and the Moon and the</tspan><tspan x="89" dy="32">Moon passes into Earth’s shadow. When all of the Moon enters the umbra, the</tspan></text></g>
<g class="v2-reading-block" data-block="lunar-definition-1" transform="translate(0 470)"><text class="se-copy" x="89" y="24"><tspan x="89">eclipse is total; when only part enters it, the eclipse is partial. A lunar eclipse</tspan><tspan x="89" dy="32">requires a full Moon and suitable alignment.</tspan></text></g>
<g class="v2-reading-block" data-block="lunar-picture" transform="translate(0 550)"><g class="v2-space-diagram" data-diagram="lunar"><path class="v2-space-penumbra" d="M525 88L928 6L928 298L525 216Z"/><path class="v2-space-umbra" d="M525 88L928 107L928 197L525 216Z"/><svg class="science-illustration" data-art="sun" x="90" y="72" width="160" height="160" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-24"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-24)"><image data-art="sun" href="../../figures/class-7/science/ch12/sun.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><svg class="science-illustration" data-art="earth" x="461" y="88" width="128" height="128" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-25"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-25)"><image data-art="earth" href="../../figures/class-7/science/ch12/earth.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><svg class="science-illustration" data-art="moon" x="805" y="127" width="50" height="50" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-26"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-26)"><image data-art="moon" href="../../figures/class-7/science/ch12/moon.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><circle class="v2-space-night" cx="830" cy="152" r="25"/><path class="v2-space-line" d="M525 88L928 107M525 216L928 197"/><text class="v2-space-label" x="170" y="276" text-anchor="middle">Sun</text><text class="v2-space-label" x="525" y="268" text-anchor="middle">Earth</text><text class="v2-space-label" x="830" y="247" text-anchor="middle">Moon</text><text class="v2-space-label" x="768" y="54" text-anchor="middle">Earth’s umbra</text><line class="v2-space-line " x1="764" y1="61" x2="739" y2="135"/><path class="v2-space-arrow" d="M287 152L425 152M416.22417438109625 156.79425538604204L425 152L416.22417438109625 147.20574461395796"/></g><text class="se-caption" x="89" y="348.88"><tspan x="89">Lunar eclipse: Sun → Earth → Moon. Earth’s shadow extends beyond Earth; the Moon passes</tspan><tspan x="89" dy="27">through it. Sizes and distances are not to scale.</tspan></text></g>
<g class="v2-reading-block" data-block="red-moon-0" transform="translate(0 954)"><text class="se-copy" x="89" y="24"><tspan x="89">During a total lunar eclipse the Moon may appear reddish. Some sunlight passes</tspan><tspan x="89" dy="32">through Earth’s atmosphere, where shorter wavelengths are scattered more</tspan></text></g>
<g class="v2-reading-block" data-block="red-moon-1" transform="translate(0 1018)"><text class="se-copy" x="89" y="24"><tspan x="89">strongly. Redder light bends into the shadow and reaches the Moon. The exact</tspan><tspan x="89" dy="32">colour depends partly on conditions in the atmosphere.</tspan></text></g>
<g class="v2-reading-block" data-block="lunar-view-0" transform="translate(0 1098)"><text class="se-copy" x="89" y="24"><tspan x="89">A lunar eclipse can be seen from much of Earth’s night side, wherever the Moon</tspan><tspan x="89" dy="32">is above the horizon and the sky is clear. It is safe to observe with unaided eyes.</tspan></text></g>
<g class="v2-reading-block" data-block="lunar-view-1" transform="translate(0 1162)"><text class="se-copy" x="89" y="24"><tspan x="89">Unlike a solar eclipse, it does not require the observer to stand in a narrow track</tspan><tspan x="89" dy="32">of the Moon’s shadow.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
