<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 11"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-space-motif" transform="translate(22 8) scale(.42)"><circle cx="47" cy="53" r="37"/><ellipse cx="47" cy="53" rx="19" ry="37"/><path d="M10 53H84M16 33H78M16 73H78M47 16V90"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Earth, Moon, and the Sun</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="monthly-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">usually passes above or below the required alignment. An eclipse needs the</tspan><tspan x="89" dy="32">Moon to be close to the line where those planes cross.</tspan></text></g>
<g class="v2-reading-block" data-block="solar-safety" transform="translate(0 192)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="390" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">An eclipse is predictable, but looking at the Sun can damage the eyes.</tspan><tspan x="113" dy="32">Ordinary sunglasses, smoked glass and exposed film are not safe solar filters.</tspan><tspan x="113" dy="32">Do not look through binoculars, a camera or a telescope while wearing</tspan><tspan x="113" dy="32">eclipse glasses: these instruments concentrate sunlight.</tspan></text><text class="se-copy" x="113" y="232"><tspan x="113">For school observation, use a teacher-supervised projection onto a screen</tspan><tspan x="113" dy="32">and look only at the screen. Direct viewing needs an undamaged, correctly</tspan><tspan x="113" dy="32">used solar viewer meeting ISO 12312-2, obtained from a trusted supplier and</tspan><tspan x="113" dy="32">checked by a knowledgeable adult. Keep that protection in place throughout</tspan><tspan x="113" dy="32">the school observation.</tspan></text></g>
<g class="v2-reading-block" data-block="projection-picture" transform="translate(0 604)"><g class="v2-space-diagram" data-diagram="projection"><svg class="science-illustration" data-art="sun" x="113" y="51" width="128" height="128" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-22"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-22)"><image data-art="sun" href="../../figures/class-7/science/ch12/sun.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><path class="v2-space-card" d="M473 26L499 46V239L473 219Z"/><path class="v2-space-card" d="M850 30L926 62V272L850 240Z"/><circle class="v2-space-dot" cx="486" cy="132" r="4"/><line class="v2-space-line " x1="213" y1="78" x2="486" y2="132"/><line class="v2-space-line " x1="486" y1="132" x2="878" y2="211"/><line class="v2-space-line " x1="213" y1="150" x2="486" y2="132"/><line class="v2-space-line " x1="486" y1="132" x2="878" y2="107"/><svg class="science-illustration" data-art="sun" x="855" y="139" width="46" height="46" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-23"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-23)"><image data-art="sun" href="../../figures/class-7/science/ch12/sun.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><text class="v2-space-label" x="177" y="226" text-anchor="middle">Sun</text><text class="v2-space-label" x="483" y="276" text-anchor="middle">Card with pinhole</text><text class="v2-space-label" x="879" y="304" text-anchor="middle">Screen</text></g><text class="se-caption" x="89" y="350.88"><tspan x="89">An indirect pinhole projection: turn your back to the Sun and view its image on a screen.</tspan><tspan x="89" dy="27">Never look through the hole towards the Sun.</tspan></text></g>
<g class="v2-reading-block" data-block="mirror-projection-0" transform="translate(0 1010)"><text class="se-copy" x="89" y="24"><tspan x="89">The source also describes a teacher-operated mirror projector: a small mirror</tspan><tspan x="89" dy="32">fixed securely in a weighted support directs sunlight onto a shaded wall. Only the</tspan></text></g>
<g class="v2-reading-block" data-block="mirror-projection-1" transform="translate(0 1074)"><text class="se-copy" x="89" y="24"><tspan x="89">teacher positions it, keeps the beam away from people and supervises the screen.</tspan><tspan x="89" dy="32">A pinhole projector is a simpler classroom alternative. Neither method requires</tspan><tspan x="89" dy="32">looking at the Sun.</tspan></text></g>
<g class="v2-reading-block" data-block="eclipse-myths-0" transform="translate(0 1186)"><text class="se-copy" x="89" y="24"><tspan x="89">There is no scientific evidence that an eclipse makes cooking, eating or ordinary</tspan><tspan x="89" dy="32">outdoor activity harmful. The specific hazard is looking at the Sun without</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">11</text></g></svg></div></div></section>
