<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-space-motif" transform="translate(22 8) scale(.42)"><circle cx="47" cy="53" r="37"/><ellipse cx="47" cy="53" rx="19" ry="37"/><path d="M10 53H84M16 33H78M16 73H78M47 16V90"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Earth, Moon, and the Sun</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="june-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">In June, the Northern Hemisphere is tilted towards the Sun. Across much of this</tspan><tspan x="89" dy="32">hemisphere, sunlight arrives at a higher angle and daylight lasts longer. A given</tspan></text></g>
<g class="v2-reading-block" data-block="june-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">amount of incoming light is spread over a smaller surface area when it arrives</tspan><tspan x="89" dy="32">more directly. More concentrated light and longer days increase the energy</tspan><tspan x="89" dy="32">received.</tspan></text></g>
<g class="v2-reading-block" data-block="december-0" transform="translate(0 288)"><text class="se-copy" x="89" y="24"><tspan x="89">In December, the Northern Hemisphere is tilted away. Sunlight arrives more</tspan><tspan x="89" dy="32">obliquely and daylight is shorter. Less energy is received per unit area over the</tspan></text></g>
<g class="v2-reading-block" data-block="december-1" transform="translate(0 352)"><text class="se-copy" x="89" y="24"><tspan x="89">day. These changes produce the broad summer–winter cycle, although land,</tspan><tspan x="89" dy="32">oceans and air take time to warm or cool.</tspan></text></g>
<g class="v2-reading-block" data-block="angle-picture" transform="translate(0 432)"><g class="v2-space-diagram" data-diagram="sun-angle"><svg class="science-illustration" data-art="sun" x="115" y="58" width="94" height="94" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-13"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-13)"><image data-art="sun" href="../../figures/class-7/science/ch12/sun.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><text class="v2-space-label" x="401" y="30" text-anchor="middle">More direct</text><text class="v2-space-label" x="785" y="30" text-anchor="middle">More oblique</text><path class="v2-space-surface" d="M297 223H502"/><path class="v2-space-surface" d="M653 189L905 272"/><path class="v2-space-arrow" d="M350 70L350 216M345.20574461395796 207.22417438109628L350 216L354.79425538604204 207.22417438109628"/><path class="v2-space-arrow" d="M390 70L390 216M385.20574461395796 207.22417438109628L390 216L394.79425538604204 207.22417438109628"/><path class="v2-space-arrow" d="M430 70L430 216M425.20574461395796 207.22417438109628L430 216L434.79425538604204 207.22417438109628"/><path class="v2-space-arrow" d="M705 70L705 199M700.205744613958 190.22417438109628L705 199L709.794255386042 190.22417438109628"/><path class="v2-space-arrow" d="M745 70L745 212.2M740.205744613958 203.42417438109626L745 212.2L749.794255386042 203.42417438109626"/><path class="v2-space-arrow" d="M785 70L785 225.4M780.205744613958 216.62417438109628L785 225.4L789.794255386042 216.62417438109628"/><text class="v2-space-label" x="400" y="287" text-anchor="middle">Smaller lit area</text><text class="v2-space-label" x="788" y="307" text-anchor="middle">Larger lit area</text></g><text class="se-caption" x="89" y="350.88"><tspan x="89">Equal incoming beams can cover different areas. Oblique light spreads the same incoming</tspan><tspan x="89" dy="27">energy over a larger area.</tspan></text></g>
<g class="v2-reading-block" data-block="hemispheres-table" transform="translate(0 838)"><g data-comparison-table="hemispheres-table"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Seasons are opposite across the equator</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Position</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="312.76" y="70.08"><tspan x="312.76">Northern Hemisphere</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="644.88" y="70.08"><tspan x="644.88">Southern Hemisphere</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Around June</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="110.08"><tspan x="312.76">Tilted towards the Sun;</tspan><tspan x="312.76" dy="28">summer.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="110.08"><tspan x="644.88">Tilted away from the Sun;</tspan><tspan x="644.88" dy="28">winter.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">Around</tspan><tspan x="103" dy="28">December</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="178.07999999999998"><tspan x="312.76">Tilted away from the Sun;</tspan><tspan x="312.76" dy="28">winter.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="178.07999999999998"><tspan x="644.88">Tilted towards the Sun;</tspan><tspan x="644.88" dy="28">summer.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="218" y2="218"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="246.07999999999998"><tspan x="103">At an equinox</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="246.07999999999998"><tspan x="312.76">Day and night are</tspan><tspan x="312.76" dy="28">approximately equal.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="246.07999999999998"><tspan x="644.88">Day and night are</tspan><tspan x="644.88" dy="28">approximately equal.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="286" y2="286"/><rect class="v2-table-frame" x="89" y="42" width="874" height="244"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="42" y2="286"/><line class="v2-table-rule" x1="630.88" x2="630.88" y1="42" y2="286"/></g></g>
<g class="v2-reading-block" data-block="distance-misconception-0" transform="translate(0 1140)"><text class="se-copy" x="89" y="24"><tspan x="89">Earth is closest to the Sun in early January, when it is winter in the Northern</tspan><tspan x="89" dy="32">Hemisphere and summer in the Southern Hemisphere. A changing Earth–Sun</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
