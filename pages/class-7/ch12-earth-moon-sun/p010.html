<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-space-motif" transform="translate(22 8) scale(.42)"><circle cx="47" cy="53" r="37"/><ellipse cx="47" cy="53" rx="19" ry="37"/><path d="M10 53H84M16 33H78M16 73H78M47 16V90"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Earth, Moon, and the Sun</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="apparent-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.63978" data-space-ratio="1.293">The<tspan dx="1.63978"> thumb</tspan><tspan dx="1.63978"> is</tspan><tspan dx="1.63978"> smaller</tspan><tspan dx="1.63978"> than</tspan><tspan dx="1.63978"> the</tspan><tspan dx="1.63978"> head,</tspan><tspan dx="1.63978"> but</tspan><tspan dx="1.63978"> it</tspan><tspan dx="1.63978"> is</tspan><tspan dx="1.63978"> much</tspan><tspan dx="1.63978"> closer</tspan><tspan dx="1.63978"> to</tspan><tspan dx="1.63978"> your</tspan><tspan dx="1.63978"> eye.</tspan><tspan dx="1.63978"> <tspan class="se-bold">Apparent</tspan></tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.14383" data-space-ratio="1.562"><tspan class="se-bold">size</tspan><tspan dx="3.14383"> depends</tspan><tspan dx="3.14383"> on</tspan><tspan dx="3.14383"> both</tspan><tspan dx="3.14383"> size</tspan><tspan dx="3.14383"> and</tspan><tspan dx="3.14383"> distance.</tspan><tspan dx="3.14383"> The</tspan><tspan dx="3.14383"> Sun</tspan><tspan dx="3.14383"> is</tspan><tspan dx="3.14383"> about</tspan><tspan dx="3.14383"> 400</tspan><tspan dx="3.14383"> times</tspan><tspan dx="3.14383"> wider</tspan><tspan dx="3.14383"> than</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="apparent-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.82060" data-space-ratio="1.504">the<tspan dx="2.82060"> Moon</tspan><tspan dx="2.82060"> and</tspan><tspan dx="2.82060"> about</tspan><tspan dx="2.82060"> 400</tspan><tspan dx="2.82060"> times</tspan><tspan dx="2.82060"> farther</tspan><tspan dx="2.82060"> away,</tspan><tspan dx="2.82060"> so</tspan><tspan dx="2.82060"> their</tspan><tspan dx="2.82060"> apparent</tspan><tspan dx="2.82060"> sizes</tspan><tspan dx="2.82060"> are</tspan><tspan dx="2.82060"> similar.</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">The distances vary, so the match is not exact at every eclipse.</tspan></text></g>
<g class="v2-reading-block" data-block="transits-0" transform="translate(0 256)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.37334" data-space-ratio="1.603">Mercury<tspan dx="3.37334"> and</tspan><tspan dx="3.37334"> Venus</tspan><tspan dx="3.37334"> can</tspan><tspan dx="3.37334"> pass</tspan><tspan dx="3.37334"> across</tspan><tspan dx="3.37334"> the</tspan><tspan dx="3.37334"> Sun’s</tspan><tspan dx="3.37334"> disc</tspan><tspan dx="3.37334"> as</tspan><tspan dx="3.37334"> viewed</tspan><tspan dx="3.37334"> from</tspan><tspan dx="3.37334"> Earth.</tspan><tspan dx="3.37334"> Their</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.52215" data-space-ratio="1.451">apparent<tspan dx="2.52215"> discs</tspan><tspan dx="2.52215"> are</tspan><tspan dx="2.52215"> much</tspan><tspan dx="2.52215"> smaller</tspan><tspan dx="2.52215"> than</tspan><tspan dx="2.52215"> the</tspan><tspan dx="2.52215"> Sun’s,</tspan><tspan dx="2.52215"> so</tspan><tspan dx="2.52215"> such</tspan><tspan dx="2.52215"> a</tspan><tspan dx="2.52215"> <tspan class="se-bold">transit</tspan></tspan><tspan dx="2.52215"> does</tspan><tspan dx="2.52215"> not</tspan><tspan dx="2.52215"> hide</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="transits-1" transform="translate(0 320)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="13.23707" data-space-ratio="3.367">the<tspan dx="13.23707"> whole</tspan><tspan dx="13.23707"> Sun.</tspan><tspan dx="13.23707"> These</tspan><tspan dx="13.23707"> are</tspan><tspan dx="13.23707"> specialist</tspan><tspan dx="13.23707"> observations</tspan><tspan dx="13.23707"> made</tspan><tspan dx="13.23707"> with</tspan><tspan dx="13.23707"> safe</tspan><tspan dx="13.23707"> solar</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">equipment, not naked-eye viewing tasks.</tspan></text></g>
<g class="v2-reading-block" data-block="solar-head" transform="translate(0 412)"><text class="v2-title" x="89" y="38"><tspan x="89">12.3.1 Solar Eclipses</tspan></text></g>
<g class="v2-reading-block" data-block="solar-definition-0" transform="translate(0 470)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.39461" data-space-ratio="1.249">A<tspan dx="1.39461"> <tspan class="se-bold">solar</tspan></tspan><tspan dx="1.39461"> <tspan class="se-bold">eclipse</tspan></tspan><tspan dx="1.39461"> occurs</tspan><tspan dx="1.39461"> when</tspan><tspan dx="1.39461"> the</tspan><tspan dx="1.39461"> Moon</tspan><tspan dx="1.39461"> comes</tspan><tspan dx="1.39461"> between</tspan><tspan dx="1.39461"> the</tspan><tspan dx="1.39461"> Sun</tspan><tspan dx="1.39461"> and</tspan><tspan dx="1.39461"> Earth</tspan><tspan dx="1.39461"> and</tspan><tspan dx="1.39461"> its</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.80831" data-space-ratio="1.681">shadow<tspan dx="3.80831"> falls</tspan><tspan dx="3.80831"> on</tspan><tspan dx="3.80831"> part</tspan><tspan dx="3.80831"> of</tspan><tspan dx="3.80831"> Earth.</tspan><tspan dx="3.80831"> In</tspan><tspan dx="3.80831"> the</tspan><tspan dx="3.80831"> central,</tspan><tspan dx="3.80831"> darkest</tspan><tspan dx="3.80831"> shadow—the</tspan><tspan dx="3.80831"> <tspan class="se-bold">umbra</tspan>—the</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="solar-definition-1" transform="translate(0 534)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.51107" data-space-ratio="1.628">Sun<tspan dx="3.51107"> can</tspan><tspan dx="3.51107"> be</tspan><tspan dx="3.51107"> completely</tspan><tspan dx="3.51107"> hidden.</tspan><tspan dx="3.51107"> This</tspan><tspan dx="3.51107"> is</tspan><tspan dx="3.51107"> a</tspan><tspan dx="3.51107"> total</tspan><tspan dx="3.51107"> solar</tspan><tspan dx="3.51107"> eclipse.</tspan><tspan dx="3.51107"> In</tspan><tspan dx="3.51107"> the</tspan><tspan dx="3.51107"> surrounding</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true"><tspan class="se-bold">penumbra</tspan>, only part of the Sun is hidden: a partial solar eclipse.</tspan></text></g>

 text-anchor="middle">Umbra</text><line class="v2-space-line " x1="726" y1="78" x2="742" y2="144"/><text class="v2-space-label" x="713" y="309" text-anchor="middle">Penumbra</text><line class="v2-space-line " x1="751" y1="285" x2="787" y2="218"/><path class="v2-space-arrow" d="M287 152L465 152M456.22417438109625 156.79425538604204L465 152L456.22417438109625 147.20574461395796"/></g><text class="se-caption" x="89" y="348.88"><tspan x="89">Solar eclipse: Sun → Moon → Earth. The narrow central shadow reaches only a small region of</tspan><tspan x="89" dy="27">Earth. The model exaggerates sizes and is not to scale.</tspan></text></g>
<g class="v2-reading-block" data-block="solar-path-0" transform="translate(0 1018)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.76947" data-space-ratio="1.853">As<tspan dx="4.76947"> Earth</tspan><tspan dx="4.76947"> rotates</tspan><tspan dx="4.76947"> and</tspan><tspan dx="4.76947"> the</tspan><tspan dx="4.76947"> Moon</tspan><tspan dx="4.76947"> moves,</tspan><tspan dx="4.76947"> the</tspan><tspan dx="4.76947"> shadow</tspan><tspan dx="4.76947"> sweeps</tspan><tspan dx="4.76947"> a</tspan><tspan dx="4.76947"> path</tspan><tspan dx="4.76947"> over</tspan><tspan dx="4.76947"> Earth.</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.32675" data-space-ratio="1.595">Totality<tspan dx="3.32675"> lasts</tspan><tspan dx="3.32675"> only</tspan><tspan dx="3.32675"> a</tspan><tspan dx="3.32675"> few</tspan><tspan dx="3.32675"> minutes</tspan><tspan dx="3.32675"> at</tspan><tspan dx="3.32675"> a</tspan><tspan dx="3.32675"> particular</tspan><tspan dx="3.32675"> place,</tspan><tspan dx="3.32675"> and</tspan><tspan dx="3.32675"> daylight</tspan><tspan dx="3.32675"> may</tspan><tspan dx="3.32675"> briefly</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="solar-path-1" transform="translate(0 1082)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.79284" data-space-ratio="1.142">become<tspan dx="0.79284"> dim</tspan><tspan dx="0.79284"> there.</tspan><tspan dx="0.79284"> The</tspan><tspan dx="0.79284"> whole</tspan><tspan dx="0.79284"> Earth</tspan><tspan dx="0.79284"> does</tspan><tspan dx="0.79284"> not</tspan><tspan dx="0.79284"> become</tspan><tspan dx="0.79284"> dark.</tspan><tspan dx="0.79284"> If</tspan><tspan dx="0.79284"> the</tspan><tspan dx="0.79284"> Moon</tspan><tspan dx="0.79284"> looks</tspan><tspan dx="0.79284"> too</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">small to cover the Sun completely, a bright ring remains: an annular eclipse.</tspan></text></g>
<g class="v2-reading-block" data-block="monthly-0" transform="translate(0 1162)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.88789" data-space-ratio="1.516">A<tspan dx="2.88789"> solar</tspan><tspan dx="2.88789"> eclipse</tspan><tspan dx="2.88789"> requires</tspan><tspan dx="2.88789"> a</tspan><tspan dx="2.88789"> new</tspan><tspan dx="2.88789"> Moon,</tspan><tspan dx="2.88789"> but</tspan><tspan dx="2.88789"> there</tspan><tspan dx="2.88789"> is</tspan><tspan dx="2.88789"> no</tspan><tspan dx="2.88789"> solar</tspan><tspan dx="2.88789"> eclipse</tspan><tspan dx="2.88789"> at</tspan><tspan dx="2.88789"> every</tspan><tspan dx="2.88789"> new</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.71783" data-space-ratio="1.844">Moon.<tspan dx="4.71783"> The</tspan><tspan dx="4.71783"> Moon’s</tspan><tspan dx="4.71783"> orbit</tspan><tspan dx="4.71783"> is</tspan><tspan dx="4.71783"> tilted</tspan><tspan dx="4.71783"> relative</tspan><tspan dx="4.71783"> to</tspan><tspan dx="4.71783"> Earth’s</tspan><tspan dx="4.71783"> orbital</tspan><tspan dx="4.71783"> plane,</tspan><tspan dx="4.71783"> so</tspan><tspan dx="4.71783"> the</tspan><tspan dx="4.71783"> Moon</tspan></tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
