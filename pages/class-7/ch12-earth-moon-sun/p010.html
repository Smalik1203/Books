<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-space-motif" transform="translate(22 8) scale(.42)"><circle cx="47" cy="53" r="37"/><ellipse cx="47" cy="53" rx="19" ry="37"/><path d="M10 53H84M16 33H78M16 73H78M47 16V90"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Earth, Moon, and the Sun</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="apparent-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">The thumb is smaller than the head, but it is much closer to your eye. <tspan class="se-bold">Apparent</tspan></tspan><tspan x="89" dy="32"><tspan class="se-bold">size</tspan> depends on both size and distance. The Sun is about 400 times wider than</tspan></text></g>
<g class="v2-reading-block" data-block="apparent-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">the Moon and about 400 times farther away, so their apparent sizes are similar.</tspan><tspan x="89" dy="32">The distances vary, so the match is not exact at every eclipse.</tspan></text></g>
<g class="v2-reading-block" data-block="transits-0" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">Mercury and Venus can pass across the Sun’s disc as viewed from Earth. Their</tspan><tspan x="89" dy="32">apparent discs are much smaller than the Sun’s, so such a <tspan class="se-bold">transit</tspan> does not hide</tspan></text></g>
<g class="v2-reading-block" data-block="transits-1" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89">the whole Sun. These are specialist observations made with safe solar</tspan><tspan x="89" dy="32">equipment, not naked-eye viewing tasks.</tspan></text></g>
<g class="v2-reading-block" data-block="solar-head" transform="translate(0 412)"><text class="v2-title" x="89" y="38"><tspan x="89">12.3.1 Solar Eclipses</tspan></text></g>
<g class="v2-reading-block" data-block="solar-definition-0" transform="translate(0 470)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">solar</tspan> <tspan class="se-bold">eclipse</tspan> occurs when the Moon comes between the Sun and Earth and its</tspan><tspan x="89" dy="32">shadow falls on part of Earth. In the central, darkest shadow—the <tspan class="se-bold">umbra</tspan>—the</tspan></text></g>
<g class="v2-reading-block" data-block="solar-definition-1" transform="translate(0 534)"><text class="se-copy" x="89" y="24"><tspan x="89">Sun can be completely hidden. This is a total solar eclipse. In the surrounding</tspan><tspan x="89" dy="32"><tspan class="se-bold">penumbra</tspan>, only part of the Sun is hidden: a partial solar eclipse.</tspan></text></g>
<g class="v2-reading-block" data-block="solar-picture" transform="translate(0 614)"><g class="v2-space-diagram" data-diagram="solar"><path class="v2-space-penumbra" d="M600 116L922 29L922 275L600 188Z"/><path class="v2-space-umbra" d="M600 116L922 149L922 155L600 188Z"/><path class="v2-space-line" d="M600 116L922 149M600 188L922 155"/><svg class="science-illustration" data-art="sun" x="90" y="72" width="160" height="160" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-19"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-19)"><image data-art="sun" href="../../figures/class-7/science/ch12/sun.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><svg class="science-illustration" data-art="moon" x="564" y="116" width="72" height="72" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-20"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-20)"><image data-art="moon" href="../../figures/class-7/science/ch12/moon.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><svg class="science-illustration" data-art="earth" x="804" y="90" width="124" height="124" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-21"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-21)"><image data-art="earth" href="../../figures/class-7/science/ch12/earth.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><circle class="v2-space-night" cx="811" cy="152" r="7"/><text class="v2-space-label" x="170" y="277" text-anchor="middle">Sun</text><text class="v2-space-label" x="600" y="254" text-anchor="middle">Moon</text><text class="v2-space-label" x="866" y="263" text-anchor="middle">Earth</text><text class="v2-space-label" x="726" y="70" text-anchor="middle">Umbra</text><line class="v2-space-line " x1="726" y1="78" x2="742" y2="144"/><text class="v2-space-label" x="713" y="309" text-anchor="middle">Penumbra</text><line class="v2-space-line " x1="751" y1="285" x2="787" y2="218"/><path class="v2-space-arrow" d="M287 152L465 152M456.22417438109625 156.79425538604204L465 152L456.22417438109625 147.20574461395796"/></g><text class="se-caption" x="89" y="348.88"><tspan x="89">Solar eclipse: Sun → Moon → Earth. The narrow central shadow reaches only a small region of</tspan><tspan x="89" dy="27">Earth. The model exaggerates sizes and is not to scale.</tspan></text></g>
<g class="v2-reading-block" data-block="solar-path-0" transform="translate(0 1018)"><text class="se-copy" x="89" y="24"><tspan x="89">As Earth rotates and the Moon moves, the shadow sweeps a path over Earth.</tspan><tspan x="89" dy="32">Totality lasts only a few minutes at a particular place, and daylight may briefly</tspan></text></g>
<g class="v2-reading-block" data-block="solar-path-1" transform="translate(0 1082)"><text class="se-copy" x="89" y="24"><tspan x="89">become dim there. The whole Earth does not become dark. If the Moon looks too</tspan><tspan x="89" dy="32">small to cover the Sun completely, a bright ring remains: an annular eclipse.</tspan></text></g>
<g class="v2-reading-block" data-block="monthly-0" transform="translate(0 1162)"><text class="se-copy" x="89" y="24"><tspan x="89">A solar eclipse requires a new Moon, but there is no solar eclipse at every new</tspan><tspan x="89" dy="32">Moon. The Moon’s orbit is tilted relative to Earth’s orbital plane, so the Moon</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
