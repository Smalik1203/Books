<section class="page page--food page--science-editorial page--science-v2 page--g7-ch12" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Earth, Moon, and the Sun, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-space-motif" transform="translate(22 8) scale(.42)"><circle cx="47" cy="53" r="37"/><ellipse cx="47" cy="53" rx="19" ry="37"/><path d="M10 53H84M16 33H78M16 73H78M47 16V90"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 12</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Earth, Moon, and the Sun</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="pole-evidence-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">photographs record these paths as star trails. A photograph combines positions</tspan><tspan x="89" dy="32">observed over time; the stars are not luminous rings.</tspan></text></g>
<g class="v2-reading-block" data-block="history-rotation-0" transform="translate(0 192)"><text class="se-copy" x="89" y="24"><tspan x="89">In the Aryabhatiya, written in 499 CE, Aryabhata compared the apparent</tspan><tspan x="89" dy="32">westward motion of stars with the backward appearance of stationary objects</tspan></text></g>
<g class="v2-reading-block" data-block="history-rotation-1" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">from a moving boat. The comparison separates what an observer sees from what</tspan><tspan x="89" dy="32">causes the view to change.</tspan></text></g>
<g class="v2-reading-block" data-block="sidereal-0" transform="translate(0 336)"><text class="se-copy" x="89" y="24"><tspan x="89">Earth turns once relative to distant stars in about <tspan class="se-bold">23</tspan> <tspan class="se-bold">hours</tspan> <tspan class="se-bold">56</tspan> <tspan class="se-bold">minutes</tspan>. A solar</tspan><tspan x="89" dy="32">day is about 24 hours because Earth also moves along its orbit: it must turn a</tspan></text></g>
<g class="v2-reading-block" data-block="sidereal-1" transform="translate(0 400)"><text class="se-copy" x="89" y="24"><tspan x="89">little farther to bring the Sun back to the same direction. A star therefore returns</tspan><tspan x="89" dy="32">to a similar position about four minutes earlier on the next night.</tspan></text></g>
<g class="v2-reading-block" data-block="foucault-0" transform="translate(0 480)"><text class="se-copy" x="89" y="24"><tspan x="89">A Foucault pendulum provides another line of evidence. Its swing direction</tspan><tspan x="89" dy="32">gradually changes relative to the floor as Earth rotates beneath it. Léon Foucault</tspan></text></g>
<g class="v2-reading-block" data-block="foucault-1" transform="translate(0 544)"><text class="se-copy" x="89" y="24"><tspan x="89">demonstrated this in 1851. This is a different purpose from using a pendulum to</tspan><tspan x="89" dy="32">measure time in Chapter 8; a large installation makes the slow change easier to</tspan><tspan x="89" dy="32">observe.</tspan></text></g>
<g class="v2-reading-block" data-block="orbit-head" transform="translate(0 668)"><text class="v2-title" x="89" y="38"><tspan x="89">12.2 Revolution of the Earth</tspan></text></g>
<g class="v2-reading-block" data-block="orbit-definition-0" transform="translate(0 726)"><text class="se-copy" x="89" y="24"><tspan x="89">While rotating, Earth travels around the Sun. Motion around another body is</tspan><tspan x="89" dy="32">called <tspan class="se-bold">revolution</tspan>, and the path is its <tspan class="se-bold">orbit</tspan>. Earth takes about 365 days and 6</tspan></text></g>
<g class="v2-reading-block" data-block="orbit-definition-1" transform="translate(0 790)"><text class="se-copy" x="89" y="24"><tspan x="89">hours to complete a revolution. The extra fraction of a day helps explain why</tspan><tspan x="89" dy="32">calendars need leap years.</tspan></text></g>

ata-art="earth" x="752" y="132" width="72" height="72" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-8"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-8)"><image data-art="earth" href="../../figures/class-7/science/ch12/earth.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><text class="v2-space-label" x="788" y="236" text-anchor="middle">December</text><path class="v2-space-arrow" d="M830 168L880 168M871.2241743810963 172.79425538604204L880 168L871.2241743810963 163.20574461395796"/><svg class="science-illustration" data-art="earth" x="490" y="250" width="72" height="72" viewBox="0 0 200 200" overflow="hidden"><defs><clipPath id="space-body-9"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#space-body-9)"><image data-art="earth" href="../../figures/class-7/science/ch12/earth.png" x="-10" y="-10" width="220" height="220" transform="rotate(0 100 100)" preserveAspectRatio="xMidYMid meet"/></g></svg><text class="v2-space-label" x="630" y="301" text-anchor="start">September</text><path class="v2-space-arrow" d="M526 328L526 348M521.205744613958 339.22417438109625L526 348L530.794255386042 339.22417438109625"/><text class="v2-space-label" x="526" y="241" text-anchor="middle">Sun</text><text class="v2-space-label" x="130" y="330" text-anchor="start">View from night side</text></g><text class="se-caption" x="89" y="385.88"><tspan x="89">An oblique view of Earth’s nearly circular orbit. The night side looks away from the Sun in</tspan><tspan x="89" dy="27">different directions through the year. Sizes and distances are not to scale.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H105
