<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="temperature-table" transform="translate(0 112)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 7.2 · A record for heating and cooling</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Stage</tspan></text><text class="v2-table-heading" x="312.76" y="76.08"><tspan x="312.76">Time (min)</tspan></text><text class="v2-table-heading" x="531.26" y="76.08"><tspan x="531.26">Soil (°C)</tspan></text><text class="v2-table-heading" x="749.76" y="76.08"><tspan x="749.76">Water (°C)</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">In sunlight</tspan></text><text class="se-copy se-table-copy" x="312.76" y="128.07999999999998"><tspan x="312.76">0, 5, 10, 15, 20</tspan></text><text class="se-copy se-table-copy" x="531.26" y="128.07999999999998"><tspan x="531.26">Your readings</tspan></text><text class="se-copy se-table-copy" x="749.76" y="128.07999999999998"><tspan x="749.76">Your readings</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="146" y2="146"/><text class="se-copy se-table-copy" x="103" y="180.07999999999998"><tspan x="103">Cooling indoors</tspan></text><text class="se-copy se-table-copy" x="312.76" y="180.07999999999998"><tspan x="312.76">0, 5, 10, 15, 20</tspan></text><text class="se-copy se-table-copy" x="531.26" y="180.07999999999998"><tspan x="531.26">Your readings</tspan></text><text class="se-copy se-table-copy" x="749.76" y="180.07999999999998"><tspan x="749.76">Your readings</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="198" y2="198"/><rect class="v2-table-frame" x="89" y="42" width="874" height="156"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="42" y2="198"/><line class="v2-table-rule" x1="517.26" x2="517.26" y1="42" y2="198"/><line class="v2-table-rule" x1="735.76" x2="735.76" y1="42" y2="198"/><text class="v2-table-note" x="89" y="230.88"><tspan x="89">This is a notebook recording guide, not measured data. Use one row per time. Read across to</tspan><tspan x="89" dy="26">compare the pair; compare down to find each temperature change.</tspan></text></g>
<g class="v2-reading-block" data-block="bowls-evidence-0" transform="translate(0 394)"><text class="se-copy" x="89" y="24"><tspan x="89">Often soil warms and cools more quickly in this setup. Check whether your data</tspan><tspan x="89" dy="32">support that pattern: subtract the starting temperature from the final</tspan></text></g>
<g class="v2-reading-block" data-block="bowls-evidence-1" transform="translate(0 458)"><text class="se-copy" x="89" y="24"><tspan x="89">temperature for each heating run, then compare cooling drops. Moist soil,</tspan><tspan x="89" dy="32">unequal sunlight or different bulb depths may change the result. Repeat before</tspan><tspan x="89" dy="32">making a broad claim.</tspan></text></g>
<g class="v2-reading-block" data-block="breeze-pause" transform="translate(0 570)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="218" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Suppose the soil starts at 25°C and reaches 35°C, while water starts at 28°C</tspan><tspan x="113" dy="32">and reaches 34°C. Which has the larger temperature rise? Why would</tspan><tspan x="113" dy="32">comparing only the final readings be misleading? These are example</tspan><tspan x="113" dy="32">numbers, not results you must obtain.</tspan></text></g>
<g class="v2-reading-block" data-block="breeze-comparison" transform="translate(0 810)"><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Sea breeze · daytime</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74"><tspan x="112">Land often warms faster than the</tspan><tspan x="112" dy="32">nearby sea.</tspan></text><text class="se-copy" x="89" y="148" text-anchor="start">•</text><text class="se-copy" x="112" y="148"><tspan x="112">Warmer air over land rises.</tspan></text><text class="se-copy" x="89" y="190" text-anchor="start">•</text><text class="se-copy" x="112" y="190"><tspan x="112">Cooler near-surface air moves from</tspan><tspan x="112" dy="32">sea to land.</tspan></text><text class="v2-comparison-title" x="526" y="30"><tspan x="526">Land breeze · night</tspan></text><text class="se-copy" x="526" y="74" text-anchor="start">•</text><text class="se-copy" x="549" y="74"><tspan x="549">Land often cools faster than the</tspan><tspan x="549" dy="32">nearby sea.</tspan></text><text class="se-copy" x="526" y="148" text-anchor="start">•</text><text class="se-copy" x="549" y="148"><tspan x="549">Warmer air over the sea rises.</tspan></text><text class="se-copy" x="526" y="190" text-anchor="start">•</text><text class="se-copy" x="549" y="190"><tspan x="549">Cooler near-surface air moves from</tspan><tspan x="549" dy="32">land to sea.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
