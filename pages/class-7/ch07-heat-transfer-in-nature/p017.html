<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="17"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 17"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="3.59336" data-space-ratio="1.643">Heat<tspan dx="3.59336"> transfers</tspan><tspan dx="3.59336"> from</tspan><tspan dx="3.59336"> hotter</tspan><tspan dx="3.59336"> regions</tspan><tspan dx="3.59336"> to</tspan><tspan dx="3.59336"> colder</tspan><tspan dx="3.59336"> regions.</tspan><tspan dx="3.59336"> Conduction,</tspan><tspan dx="3.59336"> convection</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">and radiation can act together.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.56955" data-space-ratio="1.281">Conduction<tspan dx="1.56955"> does</tspan><tspan dx="1.56955"> not</tspan><tspan dx="1.56955"> require</tspan><tspan dx="1.56955"> bulk</tspan><tspan dx="1.56955"> movement.</tspan><tspan dx="1.56955"> In</tspan><tspan dx="1.56955"> solids,</tspan><tspan dx="1.56955"> particles</tspan><tspan dx="1.56955"> vibrate</tspan><tspan dx="1.56955"> about</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">fixed positions; metals conduct heat readily.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="0.43681" data-space-ratio="1.078">Poor<tspan dx="0.43681"> conductors</tspan><tspan dx="0.43681"> slow</tspan><tspan dx="0.43681"> heat</tspan><tspan dx="0.43681"> transfer.</tspan><tspan dx="0.43681"> Trapped</tspan><tspan dx="0.43681"> still</tspan><tspan dx="0.43681"> air</tspan><tspan dx="0.43681"> helps</tspan><tspan dx="0.43681"> insulate</tspan><tspan dx="0.43681"> clothing</tspan><tspan dx="0.43681"> and</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">buildings.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.88702" data-space-ratio="1.337">Convection<tspan dx="1.88702"> carries</tspan><tspan dx="1.88702"> energy</tspan><tspan dx="1.88702"> with</tspan><tspan dx="1.88702"> moving</tspan><tspan dx="1.88702"> liquids</tspan><tspan dx="1.88702"> and</tspan><tspan dx="1.88702"> gases.</tspan><tspan dx="1.88702"> Heating</tspan><tspan dx="1.88702"> can</tspan><tspan dx="1.88702"> make</tspan><tspan dx="1.88702"> a</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">fluid expand and become less dense.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="4.53941" data-space-ratio="1.812">Daytime<tspan dx="4.53941"> sea</tspan><tspan dx="4.53941"> breezes</tspan><tspan dx="4.53941"> usually</tspan><tspan dx="4.53941"> move</tspan><tspan dx="4.53941"> from</tspan><tspan dx="4.53941"> sea</tspan><tspan dx="4.53941"> to</tspan><tspan dx="4.53941"> land;</tspan><tspan dx="4.53941"> nighttime</tspan><tspan dx="4.53941"> land</tspan><tspan dx="4.53941"> breezes</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">usually move from land to sea. Local weather can alter the pattern.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.76165" data-space-ratio="1.315">Radiation<tspan dx="1.76165"> needs</tspan><tspan dx="1.76165"> no</tspan><tspan dx="1.76165"> medium.</tspan><tspan dx="1.76165"> It</tspan><tspan dx="1.76165"> carries</tspan><tspan dx="1.76165"> solar</tspan><tspan dx="1.76165"> energy</tspan><tspan dx="1.76165"> across</tspan><tspan dx="1.76165"> space.</tspan><tspan dx="1.76165"> All</tspan><tspan dx="1.76165"> everyday</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">objects emit and absorb thermal radiation.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.01241" data-space-ratio="1.181">Light<tspan dx="1.01241"> and</tspan><tspan dx="1.01241"> dark</tspan><tspan dx="1.01241"> surfaces</tspan><tspan dx="1.01241"> can</tspan><tspan dx="1.01241"> absorb</tspan><tspan dx="1.01241"> sunlight</tspan><tspan dx="1.01241"> differently,</tspan><tspan dx="1.01241"> but</tspan><tspan dx="1.01241"> material,</tspan><tspan dx="1.01241"> thickness</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">and ventilation also affect comfort.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.60681" data-space-ratio="1.287">Solar<tspan dx="1.60681"> energy</tspan><tspan dx="1.60681"> supports</tspan><tspan dx="1.60681"> evaporation.</tspan><tspan dx="1.60681"> Transpiration,</tspan><tspan dx="1.60681"> condensation,</tspan><tspan dx="1.60681"> precipitation,</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">runoff and groundwater movement connect water’s many routes.</tspan></text><text class="se-copy" x="89" y="796" text-anchor="start">•</text><text class="se-copy" x="112" y="796" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="5.52225" data-space-ratio="1.988">Infiltration<tspan dx="5.52225"> depends</tspan><tspan dx="5.52225"> on</tspan><tspan dx="5.52225"> pathways</tspan><tspan dx="5.52225"> through</tspan><tspan dx="5.52225"> soil</tspan><tspan dx="5.52225"> and</tspan><tspan dx="5.52225"> rock.</tspan><tspan dx="5.52225"> Aquifers</tspan><tspan dx="5.52225"> store</tspan><tspan dx="5.52225"> and</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">transmit groundwater in connected pores and openings.</tspan></text><text class="se-copy" x="89" y="870" text-anchor="start">•</text><text class="se-copy" x="112" y="870" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="0.60461" data-space-ratio="1.108">Pumping<tspan dx="0.60461"> can</tspan><tspan dx="0.60461"> exceed</tspan><tspan dx="0.60461"> recharge.</tspan><tspan dx="0.60461"> Careful</tspan><tspan dx="0.60461"> water</tspan><tspan dx="0.60461"> use,</tspan><tspan dx="0.60461"> suitable</tspan><tspan dx="0.60461"> rainwater</tspan><tspan dx="0.60461"> harvesting</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">and seasonal ice storage help communities manage limited supplies.</tspan></text><g transform="translate(0 920)"><g data-page-illustration="figures/class-6/science/ch11/cooker.png"><image class="science-illustration" href="../../figures/class-6/science/ch11/cooker.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>A solar cooker uses energy from sunlight.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">A solar cooker uses energy from sunlight.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">17</text></g></svg></div></div></section>
