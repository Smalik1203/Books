<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="17"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 17"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="assessment-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Let Us Enhance Our Learning</tspan></text></g>
<g class="v2-reading-block" data-block="assessment-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Use your notebook. Support each answer with evidence and explain any</tspan><tspan x="89" dy="32">uncertainty.</tspan></text></g>
<g class="v2-reading-block" data-block="q1" transform="translate(0 250)"><text class="se-copy" x="111" y="24" text-anchor="end">1.</text><text class="se-copy" x="132" y="24"><tspan x="132">Choose the correct option in each case and explain it. (i) A saucepan has</tspan><tspan x="132" dy="32">body A and handle B. Which pairing is most useful? (a) Both good</tspan><tspan x="132" dy="32">conductors; (b) both poor conductors; (c) A a good conductor and B a poor</tspan><tspan x="132" dy="32">conductor; (d) A a poor conductor and B a good conductor. (ii) In the pin</tspan><tspan x="132" dy="32">setup below, the flame is halfway between pins II and III. Which is expected?</tspan><tspan x="132" dy="32">(a) All fall together; (b) I and II fall before III and IV; (c) I and II fall after III</tspan><tspan x="132" dy="32">and IV; (d) II and III fall at about the same time. (iii) Where is a smoke alarm</tspan><tspan x="132" dy="32">usually best placed: (a) near the floor, (b) midway up a wall, (c) on the ceiling,</tspan><tspan x="132" dy="32">or (d) anywhere? Actual fitting must follow the manufacturer’s and local</tspan><tspan x="132" dy="32">fire-safety guidance.</tspan></text><g transform="translate(0 336)"><g class="v2-heat-diagram" data-diagram="assessment-objects"><path class="v2-heat-object" d="M155 96Q168 143 256 143Q344 143 356 96V155Q330 190 256 190Q182 190 155 155Z"/><path class="v2-heat-object" d="M160 102L115 37L136 24L185 93Z"/><path class="v2-heat-line" d="M208 180L201 213M136 46L100 64"/><text class="v2-heat-label" x="208" y="232" text-anchor="middle">A</text><text class="v2-heat-label" x="101" y="89" text-anchor="middle">B</text><g transform="translate(482 0)"><path class="v2-heat-line" d="M380 0V177M340 177H420"/><path class="v2-heat-object" d="M0 35H380V47H0Z"/><circle class="v2-heat-grain" cx="30" cy="49" r="6"/><path class="v2-heat-line" d="M30 53v29"/><text class="v2-heat-label" x="30" y="109" text-anchor="middle">I</text><circle class="v2-heat-grain" cx="110" cy="49" r="6"/><path class="v2-heat-line" d="M110 53v29"/><text class="v2-heat-label" x="110" y="109" text-anchor="middle">II</text><circle class="v2-heat-grain" cx="190" cy="49" r="6"/><path class="v2-heat-line" d="M190 53v29"/><text class="v2-heat-label" x="190" y="109" text-anchor="middle">III</text><circle class="v2-heat-grain" cx="270" cy="49" r="6"/><path class="v2-heat-line" d="M270 53v29"/><text class="v2-heat-label" x="270" y="109" text-anchor="middle">IV</text><g transform="translate(150 139)"><path class="v2-heat-object" d="M-9 0H9V44H-9Z"/><path class="v2-heat-line" d="M0 0V-6"/><path class="v2-heat-flame" d="M0-29Q-16-9 0-6Q14-12 0-29"/></g></g></g></g><text class="se-caption" x="89" y="598.88"><tspan x="89">A and B identify parts of the pan. Equal pin spacing and similar wax amounts are assumed;</tspan><tspan x="89" dy="27">the candle is centred between II and III.</tspan></text></g>
<g class="v2-reading-block" data-block="q2" transform="translate(0 908)"><text class="se-copy" x="111" y="24" text-anchor="end">2.</text><text class="se-copy" x="132" y="24"><tspan x="132">A leaking tumbler of cold lassi is placed inside another tumbler. Could this</tspan><tspan x="132" dy="32">keep it cold for longer? Explain how a trapped air gap might help, and how</tspan><tspan x="132" dy="32">leaked liquid filling that gap could change your answer.</tspan></text></g>
<g class="v2-reading-block" data-block="q3" transform="translate(0 1034)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24"><tspan x="132">State whether each statement is true or false, with reasons. (i) Heat is</tspan><tspan x="132" dy="32">transferred through an ordinary solid by convection. (ii) Convection involves</tspan><tspan x="132" dy="32">bulk movement of particles. (iii) Water usually seeps faster through clay than</tspan><tspan x="132" dy="32">through sand in otherwise comparable conditions. (iv) Cooler near-surface</tspan><tspan x="132" dy="32">air moving from land to sea is called a land breeze.</tspan></text></g>
<g class="v2-reading-block" data-block="q4" transform="translate(0 1224)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24"><tspan x="132">Ice cubes in a dish melt after a while. Where do they gain energy from? Name</tspan><tspan x="132" dy="32">possible paths by which energy reaches them.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">17</text></g></svg></div></div></section>
