<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="infiltration" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">7.4.1 Water Beneath the Ground</tspan></text></g>
<g class="v2-reading-block" data-block="ground-question-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Wells and handpumps draw water stored underground. Compare how water</tspan><tspan x="89" dy="32">enters clay, sand and gravel. Predict before pouring.</tspan></text></g>
<g class="v2-reading-block" data-block="seepage-task" transform="translate(0 250)"><rect class="se-activity-panel" x="89" y="0" width="874" height="772" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">An adult halves three used 1 L bottles, makes equal cap holes and covers</tspan><tspan x="146" dy="32">sharp edges. Support the inverted tops above identical measuring</tspan><tspan x="146" dy="32">containers.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Add equal depths of clay, sand and gravel, with similar initial moisture.</tspan><tspan x="146" dy="32">Note packing and predict flow order.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Pour 200 mL into each simultaneously. After 10 minutes, measure</tspan><tspan x="146" dy="32">collected volumes. Note overflow or blocked holes.</tspan></text><text class="se-copy" x="113" y="352"><tspan x="113">Only adults cut or pierce bottles. Wash hands afterwards. Never drink the</tspan><tspan x="113" dy="32">collected water: clear-looking filtered water may still be unsafe.</tspan></text><g transform="translate(0 404)"><g class="v2-heat-diagram" data-diagram="seepage"><g transform="translate(246 0)"><text class="v2-heat-label" x="0" y="24" text-anchor="middle">Clay</text><path class="v2-heat-glass" d="M-72 45V111
