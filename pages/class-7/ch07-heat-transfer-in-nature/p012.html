<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="water-states-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.97095" data-space-ratio="1.531">can<tspan dx="2.97095"> replenish</tspan><tspan dx="2.97095"> snow</tspan><tspan dx="2.97095"> and</tspan><tspan dx="2.97095"> ice,</tspan><tspan dx="2.97095"> but</tspan><tspan dx="2.97095"> not</tspan><tspan dx="2.97095"> necessarily</tspan><tspan dx="2.97095"> as</tspan><tspan dx="2.97095"> fast</tspan><tspan dx="2.97095"> as</tspan><tspan dx="2.97095"> they</tspan><tspan dx="2.97095"> melt.</tspan><tspan dx="2.97095"> The</tspan><tspan dx="2.97095"> water</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">cycle is not a promise that every glacier or reservoir will recover.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-landscape" transform="translate(0 192)"><image class="science-illustration" data-photo="water-cycle" href="../../figures/class-7/science/ch07/water-cycle.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Land, living plants, atmosphere and sea exchange water. The processes below explain the</tspan><tspan x="89" dy="27">connections in this landscape.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-stages-0" transform="translate(0 554)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="8.78291" data-space-ratio="2.571"><tspan class="se-bold">Evaporation:</tspan><tspan dx="8.78291"> liquid</tspan><tspan dx="8.78291"> water</tspan><tspan dx="8.78291"> changes</tspan><tspan dx="8.78291"> to</tspan><tspan dx="8.78291"> vapour</tspan><tspan dx="8.78291"> at</tspan><tspan dx="8.78291"> its</tspan><tspan dx="8.78291"> surface.</tspan><tspan dx="8.78291"> Solar</tspan><tspan dx="8.78291"> energy</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">supplies much of the energy for this change.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-stages-1" transform="translate(0 628)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.98833" data-space-ratio="1.356"><tspan class="se-bold">Transpiration:</tspan><tspan dx="1.98833"> plants</tspan><tspan dx="1.98833"> take</tspan><tspan dx="1.98833"> up</tspan><tspan dx="1.98833"> water</tspan><tspan dx="1.98833"> and</tspan><tspan dx="1.98833"> release</tspan><tspan dx="1.98833"> water</tspan><tspan dx="1.98833"> vapour,</tspan><tspan dx="1.98833"> mainly</tspan><tspan dx="1.98833"> through</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">their leaves.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-stages-2" transform="translate(0 702)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="2.27847" data-space-ratio="1.407"><tspan class="se-bold">Condensation:</tspan><tspan dx="2.27847"> cooling</tspan><tspan dx="2.27847"> moist</tspan><tspan dx="2.27847"> air</tspan><tspan dx="2.27847"> can</tspan><tspan dx="2.27847"> form</tspan><tspan dx="2.27847"> tiny</tspan><tspan dx="2.27847"> liquid</tspan><tspan dx="2.27847"> droplets.</tspan><tspan dx="2.27847"> Clouds</tspan><tspan dx="2.27847"> contain</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">droplets, ice crystals or both; they are not simply invisible vapour.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-stages-3" transform="translate(0 776)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.09216" data-space-ratio="1.195"><tspan class="se-bold">Precipitation:</tspan><tspan dx="1.09216"> rain,</tspan><tspan dx="1.09216"> snow</tspan><tspan dx="1.09216"> or</tspan><tspan dx="1.09216"> hail</tspan><tspan dx="1.09216"> falls</tspan><tspan dx="1.09216"> from</tspan><tspan dx="1.09216"> clouds.</tspan><tspan dx="1.09216"> Some</tspan><tspan dx="1.09216"> water</tspan><tspan dx="1.09216"> flows</tspan><tspan dx="1.09216"> over</tspan><tspan dx="1.09216"> land</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">as runoff; some enters the ground.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-stages-4" transform="translate(0 850)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.56050" data-space-ratio="1.279"><tspan class="se-bold">Return</tspan><tspan dx="1.56050"> <tspan class="se-bold">and</tspan></tspan><tspan dx="1.56050"> <tspan class="se-bold">storage:</tspan></tspan><tspan dx="1.56050"> streams,</tspan><tspan dx="1.56050"> rivers,</tspan><tspan dx="1.56050"> groundwater,</tspan><tspan dx="1.56050"> snow</tspan><tspan dx="1.56050"> and</tspan><tspan dx="1.56050"> ice</tspan><tspan dx="1.56050"> store</tspan><tspan dx="1.56050"> or</tspan><tspan dx="1.56050"> move</tspan></tspan><tspan x="112" dy="32" data-justify-width="851" data-natural-space="5.59200" data-extra-space="3.38651" data-space-ratio="1.606">water.<tspan dx="3.38651"> Different</tspan><tspan dx="3.38651"> portions</tspan><tspan dx="3.38651"> follow</tspan><tspan dx="3.38651"> different</tspan><tspan dx="3.38651"> routes</tspan><tspan dx="3.38651"> and</tspan><tspan dx="3.38651"> take</tspan><tspan dx="3.38651"> different</tspan><tspan dx="3.38651"> lengths</tspan><tspan dx="3.38651"> of</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">time.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-conservation-0" transform="translate(0 962)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="8.17250" data-space-ratio="2.461">The<tspan dx="8.17250"> <tspan class="se-bold">water</tspan></tspan><tspan dx="8.17250"> <tspan class="se-bold">cycle</tspan></tspan><tspan dx="8.17250"> continually</tspan><tspan dx="8.17250"> redistributes</tspan><tspan dx="8.17250"> water</tspan><tspan dx="8.17250"> among</tspan><tspan dx="8.17250"> air,</tspan><tspan dx="8.17250"> land</tspan><tspan dx="8.17250"> and</tspan><tspan dx="8.17250"> water</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.86533" data-space-ratio="2.049">bodies.<tspan dx="5.86533"> Over</tspan><tspan dx="5.86533"> ordinary</tspan><tspan dx="5.86533"> human</tspan><tspan dx="5.86533"> timescales,</tspan><tspan dx="5.86533"> Earth’s</tspan><tspan dx="5.86533"> total</tspan><tspan dx="5.86533"> water</tspan><tspan dx="5.86533"> is</tspan><tspan dx="5.86533"> approximately</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="cycle-conservation-1" transform="translate(0 1026)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.29642" data-space-ratio="1.411">conserved,<tspan dx="2.29642"> but</tspan><tspan dx="2.29642"> usable</tspan><tspan dx="2.29642"> freshwater</tspan><tspan dx="2.29642"> can</tspan><tspan dx="2.29642"> still</tspan><tspan dx="2.29642"> be</tspan><tspan dx="2.29642"> scarce,</tspan><tspan dx="2.29642"> polluted</tspan><tspan dx="2.29642"> or</tspan><tspan dx="2.29642"> stored</tspan><tspan dx="2.29642"> far</tspan><tspan dx="2.29642"> from</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">where it is needed.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
