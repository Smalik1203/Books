<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="water-cycle" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">7.4 Water Cycle</tspan></text></g>
<g class="v2-reading-block" data-block="sun-water-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.19087" data-space-ratio="1.749">Clothes<tspan dx="4.19087"> often</tspan><tspan dx="4.19087"> dry</tspan><tspan dx="4.19087"> faster</tspan><tspan dx="4.19087"> on</tspan><tspan dx="4.19087"> a</tspan><tspan dx="4.19087"> warm</tspan><tspan dx="4.19087"> sunny</tspan><tspan dx="4.19087"> day</tspan><tspan dx="4.19087"> because</tspan><tspan dx="4.19087"> water</tspan><tspan dx="4.19087"> evaporates</tspan><tspan dx="4.19087"> more</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.53086" data-space-ratio="1.631">quickly;<tspan dx="3.53086"> wind</tspan><tspan dx="3.53086"> and</tspan><tspan dx="3.53086"> humidity</tspan><tspan dx="3.53086"> matter</tspan><tspan dx="3.53086"> too.</tspan><tspan dx="3.53086"> Solar</tspan><tspan dx="3.53086"> energy</tspan><tspan dx="3.53086"> also</tspan><tspan dx="3.53086"> supports</tspan><tspan dx="3.53086"> evaporation</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="sun-water-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.46012" data-space-ratio="1.082">from<tspan dx="0.46012"> seas,</tspan><tspan dx="0.46012"> lakes</tspan><tspan dx="0.46012"> and</tspan><tspan dx="0.46012"> wet</tspan><tspan dx="0.46012"> ground.</tspan><tspan dx="0.46012"> This</tspan><tspan dx="0.46012"> connects</tspan><tspan dx="0.46012"> heat</tspan><tspan dx="0.46012"> transfer</tspan><tspan dx="0.46012"> with</tspan><tspan dx="0.46012"> water’s</tspan><tspan dx="0.46012"> journey</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">through the environment.</tspan></text></g>
<g class="v2-reading-block" data-block="water-states-0" transform="translate(0 314)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.41800" data-space-ratio="1.075">Water<tspan dx="0.41800"> occurs</tspan><tspan dx="0.41800"> as</tspan><tspan dx="0.41800"> liquid</tspan><tspan dx="0.41800"> in</tspan><tspan dx="0.41800"> rivers</tspan><tspan dx="0.41800"> and</tspan><tspan dx="0.41800"> oceans,</tspan><tspan dx="0.41800"> as</tspan><tspan dx="0.41800"> solid</tspan><tspan dx="0.41800"> ice</tspan><tspan dx="0.41800"> and</tspan><tspan dx="0.41800"> snow,</tspan><tspan dx="0.41800"> and</tspan><tspan dx="0.41800"> as</tspan><tspan dx="0.41800"> invisible</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.86821" data-space-ratio="1.692">water<tspan dx="3.86821"> vapour</tspan><tspan dx="3.86821"> in</tspan><tspan dx="3.86821"> the</tspan><tspan dx="3.86821"> atmosphere.</tspan><tspan dx="3.86821"> Snowmelt</tspan><tspan dx="3.86821"> feeds</tspan><tspan dx="3.86821"> some</tspan><tspan dx="3.86821"> rivers.</tspan><tspan dx="3.86821"> Winter</tspan><tspan dx="3.86821"> snowfall</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="water-states-1" transform="translate(0 378)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.97095" data-space-ratio="1.531">can<tspan dx="2.97095"> replenish</tspan><tspan dx="2.97095"> snow</tspan><tspan dx="2.97095"> and</tspan><tspan dx="2.97095"> ice,</tspan><tspan dx="2.97095"> but</tspan><tspan dx="2.97095"> not</tspan><tspan dx="2.97095"> necessarily</tspan><tspan dx="2.97095"> as</tspan><tspan dx="2.97095"> fast</tspan><tspan dx="2.97095"> as</tspan><tspan dx="2.97095"> they</tspan><tspan dx="2.97095"> melt.</tspan><tspan dx="2.97095"> The</tspan><tspan dx="2.97095"> water</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">cycle is not a promise that every glacier or reservoir will recover.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-landscape" transform="translate(0 458)"><image class="science-illustration" data-photo="water-cycle" href="../../figures/class-7/science/ch07/water-cycle.png" x="121" y="0" width="810" height="540" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="570.88"><tspan x="89">Land, living plants, atmosphere and sea exchange water. The processes below explain the</tspan><tspan x="89" dy="27">connections in this landscape.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-stages-0" transform="translate(0 1090)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="8.78291" data-space-ratio="2.571"><tspan class="se-bold">Evaporation:</tspan><tspan dx="8.78291"> liquid</tspan><tspan dx="8.78291"> water</tspan><tspan dx="8.78291"> changes</tspan><tspan dx="8.78291"> to</tspan><tspan dx="8.78291"> vapour</tspan><tspan dx="8.78291"> at</tspan><tspan dx="8.78291"> its</tspan><tspan dx="8.78291"> surface.</tspan><tspan dx="8.78291"> Solar</tspan><tspan dx="8.78291"> energy</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">supplies much of the energy for this change.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-stages-1" transform="translate(0 1164)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.98833" data-space-ratio="1.356"><tspan class="se-bold">Transpiration:</tspan><tspan dx="1.98833"> plants</tspan><tspan dx="1.98833"> take</tspan><tspan dx="1.98833"> up</tspan><tspan dx="1.98833"> water</tspan><tspan dx="1.98833"> and</tspan><tspan dx="1.98833"> release</tspan><tspan dx="1.98833"> water</tspan><tspan dx="1.98833"> vapour,</tspan><tspan dx="1.98833"> mainly</tspan><tspan dx="1.98833"> through</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">their leaves.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-stages-2" transform="translate(0 1238)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="2.27847" data-space-ratio="1.407"><tspan class="se-bold">Condensation:</tspan><tspan dx="2.27847"> cooling</tspan><tspan dx="2.27847"> moist</tspan><tspan dx="2.27847"> air</tspan><tspan dx="2.27847"> can</tspan><tspan dx="2.27847"> form</tspan><tspan dx="2.27847"> tiny</tspan><tspan dx="2.27847"> liquid</tspan><tspan dx="2.27847"> droplets.</tspan><tspan dx="2.27847"> Clouds</tspan><tspan dx="2.27847"> contain</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">droplets, ice crystals or both; they are not simply invisible vapour.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-stages-3" transform="translate(0 1312)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.09216" data-space-ratio="1.195"><tspan class="se-bold">Precipitation:</tspan><tspan dx="1.09216"> rain,</tspan><tspan dx="1.09216"> snow</tspan><tspan dx="1.09216"> or</tspan><tspan dx="1.09216"> hail</tspan><tspan dx="1.09216"> falls</tspan><tspan dx="1.09216"> from</tspan><tspan dx="1.09216"> clouds.</tspan><tspan dx="1.09216"> Some</tspan><tspan dx="1.09216"> water</tspan><tspan dx="1.09216"> flows</tspan><tspan dx="1.09216"> over</tspan><tspan dx="1.09216"> land</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">as runoff; some enters the ground.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
