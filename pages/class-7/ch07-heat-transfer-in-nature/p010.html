<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="processes-together" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Three processes in one kitchen</tspan></text></g>
<g class="v2-reading-block" data-block="bukhari-art" transform="translate(0 160)"><image class="science-illustration" data-photo="bukhari" href="../../figures/class-7/science/ch07/bukhari.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">A bukhari combines an enclosed iron stove, a cooking surface and a chimney that carries</tspan><tspan x="89" dy="27">combustion gases outside.</tspan></text></g>
<g class="v2-reading-block" data-block="pan-processes-0" transform="translate(0 522)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Into</tspan> <tspan class="se-bold">the</tspan> <tspan class="se-bold">pan:</tspan> hot gases transfer energy to its base, and the flame radiates</tspan><tspan x="112" dy="32">energy towards it.</tspan></text></g>
<g class="v2-reading-block" data-block="pan-processes-1" transform="translate(0 596)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Through</tspan> <tspan class="se-bold">the</tspan> <tspan class="se-bold">metal:</tspan> conduction carries energy across the pan’s base and along</tspan><tspan x="112" dy="32">its sides.</tspan></text></g>
<g class="v2-reading-block" data-block="pan-processes-2" transform="translate(0 670)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Through</tspan> <tspan class="se-bold">the</tspan> <tspan class="se-bold">water:</tspan> convection circulates warmed water; conduction occurs</tspan><tspan x="112" dy="32">where water touches metal.</tspan></text></g>
<g class="v2-reading-block" data-block="pan-processes-3" transform="translate(0 744)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Into</tspan> <tspan class="se-bold">the</tspan> <tspan class="se-bold">room:</tspan> radiation from hot surfaces and convection of air both</tspan><tspan x="112" dy="32">contribute to warmth.</tspan></text></g>
<g class="v2-reading-block" data-block="stove-safety-0" transform="translate(0 824)"><text class="se-copy" x="89" y="24"><tspan x="89">A traditional bukhari can warm a room and support a cooking pot. An adult must</tspan><tspan x="89" dy="32">ensure proper ventilation and a working chimney. Never burn charcoal or use an</tspan></text></g>
<g class="v2-reading-block" data-block="stove-safety-1" transform="translate(0 888)"><text class="se-copy" x="89" y="24"><tspan x="89">unvented stove in an enclosed room: dangerous gases may be invisible and</tspan><tspan x="89" dy="32">odourless.</tspan></text></g>
<g class="v2-reading-block" data-block="mechanisms-table" transform="translate(0 968)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 7.3 · Compare the transfer mechanisms</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Process</tspan></text><text class="v2-table-heading" x="295.28" y="76.08"><tspan x="295.28">How energy travels</tspan></text><text class="v2-table-heading" x="671.1" y="76.08"><tspan x="671.1">A useful example</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Conduction</tspan></text><text class="se-copy se-table-copy" x="295.28" y="128.07999999999998"><tspan x="295.28">Through interactions within</tspan><tspan x="295.28" dy="28">matter; no bulk flow is needed.</tspan></text><text class="se-copy se-table-copy" x="671.1" y="128.07999999999998"><tspan x="671.1">Along a metal pan.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="174" y2="174"/><text class="se-copy se-table-copy" x="103" y="208.07999999999998"><tspan x="103">Convection</tspan></text><text class="se-copy se-table-copy" x="295.28" y="208.07999999999998"><tspan x="295.28">With bulk movement of a liquid or</tspan><tspan x="295.28" dy="28">gas.</tspan></text><text class="se-copy se-table-copy" x="671.1" y="208.07999999999998"><tspan x="671.1">Circulating warm water.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="254" y2="254"/><text class="se-copy se-table-copy" x="103" y="288.08"><tspan x="103">Radiation</tspan></text><text class="se-copy se-table-copy" x="295.28" y="288.08"><tspan x="295.28">By electromagnetic waves; no</tspan><tspan x="295.28" dy="28">medium is required.</tspan></text><text class="se-copy se-table-copy" x="671.1" y="288.08"><tspan x="671.1">From the Sun to Earth.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="334" y2="334"/><rect class="v2-table-frame" x="89" y="42" width="874" height="292"/><line class="v2-table-rule" x1="281.28" x2="281.28" y1="42" y2="334"/><line class="v2-table-rule" x1="657.1" x2="657.1" y1="42" y2="334"/><text class="v2-table-note" x="89" y="366.88"><tspan x="89">Read across for the mechanism and example. Compare down to distinguish energy transfer</tspan><tspan x="89" dy="26">from the movement of the material itself.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
