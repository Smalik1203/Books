<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 11"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="water-cycle" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">7.4 Water Cycle</tspan></text></g>
<g class="v2-reading-block" data-block="sun-water-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Clothes often dry faster on a warm sunny day because water evaporates more</tspan><tspan x="89" dy="32">quickly; wind and humidity matter too. Solar energy also supports evaporation</tspan></text></g>
<g class="v2-reading-block" data-block="sun-water-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">from seas, lakes and wet ground. This connects heat transfer with water’s journey</tspan><tspan x="89" dy="32">through the environment.</tspan></text></g>
<g class="v2-reading-block" data-block="water-states-0" transform="translate(0 314)"><text class="se-copy" x="89" y="24"><tspan x="89">Water occurs as liquid in rivers and oceans, as solid ice and snow, and as invisible</tspan><tspan x="89" dy="32">water vapour in the atmosphere. Snowmelt feeds some rivers. Winter snowfall</tspan></text></g>
<g class="v2-reading-block" data-block="water-states-1" transform="translate(0 378)"><text class="se-copy" x="89" y="24"><tspan x="89">can replenish snow and ice, but not necessarily as fast as they melt. The water</tspan><tspan x="89" dy="32">cycle is not a promise that every glacier or reservoir will recover.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-landscape" transform="translate(0 458)"><image class="science-illustration" data-photo="water-cycle" href="../../figures/class-7/science/ch07/water-cycle.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Land, living plants, atmosphere and sea exchange water. The processes below explain the</tspan><tspan x="89" dy="27">connections in this landscape.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-stages-0" transform="translate(0 820)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Evaporation:</tspan> liquid water changes to vapour at its surface. Solar energy</tspan><tspan x="112" dy="32">supplies much of the energy for this change.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-stages-1" transform="translate(0 894)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Transpiration:</tspan> plants take up water and release water vapour, mainly through</tspan><tspan x="112" dy="32">their leaves.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-stages-2" transform="translate(0 968)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Condensation:</tspan> cooling moist air can form tiny liquid droplets. Clouds contain</tspan><tspan x="112" dy="32">droplets, ice crystals or both; they are not simply invisible vapour.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-stages-3" transform="translate(0 1042)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Precipitation:</tspan> rain, snow or hail falls from clouds. Some water flows over land</tspan><tspan x="112" dy="32">as runoff; some enters the ground.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-stages-4" transform="translate(0 1116)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Return</tspan> <tspan class="se-bold">and</tspan> <tspan class="se-bold">storage:</tspan> streams, rivers, groundwater, snow and ice store or move</tspan><tspan x="112" dy="32">water. Different portions follow different routes and take different lengths of</tspan><tspan x="112" dy="32">time.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-conservation-0" transform="translate(0 1228)"><text class="se-copy" x="89" y="24"><tspan x="89">The <tspan class="se-bold">water</tspan> <tspan class="se-bold">cycle</tspan> continually redistributes water among air, land and water</tspan><tspan x="89" dy="32">bodies. Over ordinary human timescales, Earth’s total water is approximately</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-conservation-1" transform="translate(0 1292)"><text class="se-copy" x="89" y="24"><tspan x="89">conserved, but usable freshwater can still be scarce, polluted or stored far from</tspan><tspan x="89" dy="32">where it is needed.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">11</text></g></svg></div></div></section>
