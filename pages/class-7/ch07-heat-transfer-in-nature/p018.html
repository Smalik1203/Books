<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q5" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">5.</text><text class="se-copy" x="132" y="24"><tspan x="132">Imagine a burning incense stick fixed with its tip pointing downward. In</tspan><tspan x="132" dy="32">which direction would the warm smoky air initially move in still</tspan><tspan x="132" dy="32">surroundings? Draw and explain the movement. This is a thought question;</tspan><tspan x="132" dy="32">do not burn incense to test it.</tspan></text></g>
<g class="v2-reading-block" data-block="q6" transform="translate(0 270)"><text class="se-copy" x="111" y="24" text-anchor="end">6.</text><text class="se-copy" x="132" y="24"><tspan x="132">The two diagrams show equal amounts of water starting at the same</tspan><tspan x="132" dy="32">temperature. In (a), the flame heats the lower end and the thermometer bulb</tspan><tspan x="132" dy="32">is higher in the water. In (b), the flame heats near the upper water region and</tspan><tspan x="132" dy="32">the bulb is lower down. After equal gentle heating for a short time, which</tspan><tspan x="132" dy="32">thermometer is likely to show a greater rise? Explain using convection and</tspan><tspan x="132" dy="32">conduction. These are diagrams to reason about, not instructions for a home</tspan><tspan x="132" dy="32">experiment.</tspan></text><g transform="translate(0 240)"><g class="v2-heat-diagram" data-diagram="test-tubes"><g transform="translate(212 0)"><text class="v2-heat-label" x="80" y="28" text-anchor="middle">(a) Heating lower down</text><path class="v2-heat-glass" d="M110 56L-3 194Q-21 219 0 229Q19 239 35 216L143 78"/><path class="v2-heat-water" d="M53 125H106L35 216Q19 239 0 229Q-21 219-3 194Z"/><path class="v2-heat-line" d="M126 38L68 130"/><circle class="v2-heat-grain" cx="68" cy="130" r="5"/><g transform="translate(-6 261)"><path class="v2-heat-object" d="M-9 0H9V44H-9Z"/><path class="v2-heat-line" d="M0 0V-6"/><path class="v2-heat-flame" d="M0-29Q-16-9 0-6Q14-12 0-29"/></g><text class="v2-heat-label" x="165" y="95" text-anchor="start">Thermometer</text><path class="v2-heat-line" d="M155 91L118 57"/><text class="v2-heat-label" x="147" y="242" text-anchor="middle">Water</text><path class="v2-heat-line" d="M111 234L59 181"/></g><g transform="translate(632 0)"><text class="v2-heat-label" x="80" y="28" text-anchor="middle">(b) Heating higher up</text><path class="v2-heat-glass" d="M110 56L-3 194Q-21 219 0 229Q19 239 35 216L143 78"/><path class="v2-heat-water" d="M53 125H106L35 216Q19 239 0 229Q-21 219-3 194Z"/><path class="v2-heat-line" d="M126 38L15 204"/><circle class="v2-heat-grain" cx="15" cy="204" r="5"/><g transform="translate(94 166)"><path class="v2-heat-object" d="M-9 0H9V44H-9Z"/><path class="v2-heat-line" d="M0 0V-6"/><path class="v2-heat-flame" d="M0-29Q-16-9 0-6Q14-12 0-29"/></g><text class="v2-heat-label" x="165" y="95" text-anchor="start">Thermometer</text><path class="v2-heat-line" d="M155 91L118 57"/><text class="v2-heat-label" x="147" y="242" text-anchor="middle">Water</text><path class="v2-heat-line" d="M111 234L59 181"/></g></g></g><text class="se-caption" x="89" y="585.88"><tspan x="89">Positions of the heat source and thermometer bulb differ. Neither thermometer touches the</tspan><tspan x="89" dy="27">glass. Supports are omitted for clarity.</tspan></text></g>
<g class="v2-reading-block" data-block="q7" transform="translate(0 915)"><text class="se-copy" x="111" y="24" text-anchor="end">7.</text><text class="se-copy" x="132" y="24"><tspan x="132">Why can hollow bricks help insulate outer walls in hot regions? Explain the</tspan><tspan x="132" dy="32">role of trapped air and the direction of heat transfer during a hot afternoon.</tspan></text></g>
<g class="v2-reading-block" data-block="q8" transform="translate(0 1009)"><text class="se-copy" x="111" y="24" text-anchor="end">8.</text><text class="se-copy" x="132" y="24"><tspan x="132">Explain how a large nearby water body can moderate temperature extremes.</tspan><tspan x="132" dy="32">Connect your answer with the measured heating and cooling of soil and</tspan><tspan x="132" dy="32">water.</tspan></text></g>
<g class="v2-reading-block" data-block="q9" transform="translate(0 1135)"><text class="se-copy" x="111" y="24" text-anchor="end">9.</text><text class="se-copy" x="132" y="24"><tspan x="132">Explain how some water enters the ground and reaches groundwater stores.</tspan><tspan x="132" dy="32">Include pore spaces, connected pathways and aquifers. Why does not all rain</tspan><tspan x="132" dy="32">become groundwater?</tspan></text></g>
<g class="v2-reading-block" data-block="q10" transform="translate(0 1261)"><text class="se-copy" x="111" y="24" text-anchor="end">10.</text><text class="se-copy" x="132" y="24"><tspan x="132">The water cycle redistributes and replenishes water on Earth. Justify this</tspan><tspan x="132" dy="32">statement, then explain why it does not guarantee an unlimited local supply</tspan><tspan x="132" dy="32">of clean water.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
