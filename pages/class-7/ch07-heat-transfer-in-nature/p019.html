<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="19" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 19"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Explore Further</tspan></text></g>
<g class="v2-reading-block" data-block="project-harvesting-head" transform="translate(0 182)"><text class="se-heading" x="89" y="30"><tspan x="89">A local water-harvesting system</tspan></text></g>
<g class="v2-reading-block" data-block="project-harvesting-0" transform="translate(0 230)"><text class="se-copy" x="89" y="24"><tspan x="89">With teacher permission and an adult, visit a rainwater-harvesting site or</tspan><tspan x="89" dy="32">recharge pit. Stay outside pits and wells. Ask how water is collected, where it</tspan></text></g>
<g class="v2-reading-block" data-block="project-harvesting-1" transform="translate(0 294)"><text class="se-copy" x="89" y="24"><tspan x="89">goes, how dirty runoff is excluded and who maintains the system. Prepare an</tspan><tspan x="89" dy="32">illustrated report distinguishing what you observed from what you were told. If a</tspan><tspan x="89" dy="32">visit is not possible, interview a local engineer or use an approved site plan.</tspan></text></g>
<g class="v2-reading-block" data-block="project-paper-head" transform="translate(0 418)"><text class="se-heading" x="89" y="30"><tspan x="89">Paper around a metal rod</tspan></text></g>
<g class="v2-reading-block" data-block="project-paper-0" transform="translate(0 466)"><text class="se-copy" x="89" y="24"><tspan x="89">Can a metal rod delay the charring of paper wrapped tightly around it? Ask your</tspan><tspan x="89" dy="32">teacher to demonstrate after a school fire-safety assessment. The teacher uses a</tspan></text></g>
<g class="v2-reading-block" data-block="project-paper-1" transform="translate(0 530)"><text class="se-copy" x="89" y="24"><tspan x="89">securely supported rod, suitable tools, a heatproof tray and a controlled flame,</tspan><tspan x="89" dy="32">turning the rod with the tools while learners observe from a safe distance. Never</tspan></text></g>
<g class="v2-reading-block" data-block="project-paper-2" transform="translate(0 594)"><text class="se-copy" x="89" y="24"><tspan x="89">hold the rod by hand. Predict whether close metal contact could carry heat away</tspan><tspan x="89" dy="32">fast enough to delay charring. Compare prediction with observation; paper can</tspan></text></g>
<g class="v2-reading-block" data-block="project-paper-3" transform="translate(0 658)"><text class="se-copy" x="89" y="24"><tspan x="89">still burn, so “metal makes paper fireproof” is not a valid conclusion. If a safe</tspan><tspan x="89" dy="32">demonstration is unavailable, discuss a teacher-selected recording.</tspan></text></g>
<g class="v2-reading-block" data-block="project-spiral-head" transform="translate(0 750)"><text class="se-heading" x="89" y="30"><tspan x="89">A spiral moved by warm air</tspan></text></g>
<g class="v2-reading-block" data-block="project-spiral" transform="translate(0 798)"><text class="se-copy" x="89" y="24"><tspan x="89">Draw a spiral on paper, cut it carefully with scissors and suspend it freely from its</tspan><tspan x="89" dy="32">centre. Let a teacher show how rising warm air can turn it. Keep paper and</tspan><tspan x="89" dy="32">thread far from any heat source; use a teacher-controlled warm-air source</tspan><tspan x="89" dy="32">instead of a candle. Never place paper in a flame or over exposed heating</tspan><tspan x="89" dy="32">elements. Compare movement with and without heating, keeping draughts as</tspan><tspan x="89" dy="32">similar as possible. Record whether it turns and explain how moving air transfers</tspan><tspan x="89" dy="32">energy. A still spiral is also a result to investigate.</tspan></text></g>
<g class="v2-reading-block" data-block="project-spiral-diagram" transform="translate(0 1038)"><g class="v2-heat-diagram" data-diagram="spiral"><svg class="science-illustration" data-apparatus="spiral" x="231" y="3" width="172.74088541666666" height="169" viewBox="51 109 785 768" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch07/apparatus-spiral.png" width="1536" height="1024"/></svg><svg class="science-illustration" data-apparatus="spiral" x="661" y="3" width="113.08617021276596" height="169" viewBox="879 0 629 940" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch07/apparatus-spiral.png" width="1536" height="1024"/></svg><text class="v2-heat-label" x="318" y="198" text-anchor="middle">Cut line</text><text class="v2-heat-label" x="728" y="198" text-anchor="middle">Suspended centre</text></g><text class="se-caption" x="89" y="235.88"><tspan x="89">Cut along a spiral line, then suspend its centre. Ask the teacher to arrange safe heating and</tspan><tspan x="89" dy="27">compare with an unheated trial.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">19</text></g></svg></div></div></section>
