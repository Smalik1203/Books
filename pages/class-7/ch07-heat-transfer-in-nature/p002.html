<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="conduction" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">7.1 Conduction of Heat</tspan></text></g>
<g class="v2-reading-block" data-block="pan-question-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Metal cooking utensils transfer heat readily. To find out how heating spreads</tspan><tspan x="89" dy="32">along a solid, watch a teacher demonstrate the metal-strip investigation. Predict</tspan><tspan x="89" dy="32">first; use the observations to revise your explanation.</tspan></text></g>
<g class="v2-reading-block" data-block="strip-task" transform="translate(0 282)"><rect class="se-activity-panel" x="89" y="0" width="874" height="781" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">A teacher secures a metal strip about 15 cm long to a stand. Four pins are</tspan><tspan x="146" dy="32">attached with similar small amounts of wax, about 2 cm apart, and</tspan><tspan x="146" dy="32">labelled I to IV from the free end.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Predict which pin will fall first and the order of the others. The teacher</tspan><tspan x="146" dy="32">heats the free end with a candle, away from the stand.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Watch from a safe distance. Record the order, approximate times and</tspan><tspan x="146" dy="32">anything unexpected in your notebook. Separate your prediction,</tspan><tspan x="146" dy="32">observation and possible reason.</tspan></text><text class="se-copy" x="113" y="384"><tspan x="113">Teacher demonstration only: use a heatproof tray to catch sharp pins and</tspan><tspan x="113" dy="32">wax. Keep hair and clothing away from the flame. Do not touch the strip,</tspan><tspan x="113" dy="32">stand or fallen pins until the teacher confirms they are cool.</tspan></text><g transform="translate(0 468)"><g class="v2-heat-diagram" data-diagram="strip"><svg class="science-illustration" x="285" y="10" width="370" height="195" viewBox="-60 0 370 195"><svg class="science-illustration" data-apparatus="strip" x="0" y="0" width="291.5071283095723" height="195" viewBox="36 19 1468 982" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch07/apparatus-strip.png" width="1536" height="1024"/></svg><text class="v2-heat-label" x="51.82790224032586" y="43" text-anchor="middle">I</text><text class="v2-heat-label" x="100.67718940936862" y="43" text-anchor="middle">II</text><text class="v2-heat-label" x="147.93788187372706" y="43" text-anchor="middle">III</text><text class="v2-heat-label" x="195.19857433808554" y="43" text-anchor="middle">IV</text><svg class="science-illustration" data-apparatus="candle" x="-54.10715478022445" y="66" width="117.74587778855481" height="124" viewBox="83 186 979 1031" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch07/apparatus-candle.png" width="1145" height="1374"/></svg></svg><text class="v2-heat-label" x="232" y="54" text-anchor="middle">Metal strip</text><path class="v2-heat-line" d="M297 59L363 69"/><text class="v2-heat-label" x="792" y="70" text-anchor="middle">Clamp and stand</text><path class="v2-heat-line" d="M690 75L621 76"/><text class="v2-heat-label" x="213" y="192" text-anchor="middle">Candle</text><path class="v2-heat-line" d="M259 185L338 178"/></g></g><text class="se-caption" x="113" y="725.88"><tspan x="113">Initial setup: all four pins remain attached. Similar wax amounts make the comparison</tspan><tspan x="113" dy="27">fairer.</tspan></text></g>
<g class="v2-reading-block" data-block="strip-evidence-0" transform="translate(0 1085)"><text class="se-copy" x="89" y="24"><tspan x="89">Compare your record with another observer’s. Did the pins fall in a clear</tspan><tspan x="89" dy="32">sequence? Usually the wax nearest the heated end melts first, releasing pin I,</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
