<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="breeze-model" transform="translate(0 112)"><g class="v2-heat-diagram" data-diagram="breezes"><g transform="translate(101 0)"><text class="v2-heat-label" x="200" y="29" text-anchor="middle">Day · sea breeze</text><svg class="science-illustration" data-apparatus="coast" x="0" y="202" width="371.28" height="78" viewBox="18 210 2142 450" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch07/apparatus-coast.png" width="2172" height="724"/></svg><text class="v2-heat-label" x="92" y="297" text-anchor="middle">Cooler sea</text><text class="v2-heat-label" x="303" y="297" text-anchor="middle">Warmer land</text><path class="v2-heat-line" d="M110 215L290 215M281.22417438109625 219.79425538604204L290 215L281.22417438109625 210.20574461395796"/><path class="v2-heat-line" d="M310 205L310 100M314.79425538604204 108.77582561890372L310 100L305.20574461395796 108.77582561890372"/><path class="v2-heat-line" d="M290 89L110 89M118.77582561890372 84.20574461395798L110 89L118.77582561890372 93.79425538604202"/><path class="v2-heat-line" d="M85 103L85 194M80.20574461395798 185.22417438109628L85 194L89.79425538604202 185.22417438109628"/><text class="v2-heat-label" x="200" y="196" text-anchor="middle">Near-surface air</text><text class="v2-heat-label" x="200" y="68" text-anchor="middle">Return flow aloft</text></g><g transform="translate(541 0)"><text class="v2-heat-label" x="200" y="29" text-anchor="middle">Night · land breeze</text><svg class="science-illustration" data-apparatus="coast" x="0" y="202" width="371.28" height="78" viewBox="18 210 2142 450" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch07/apparatus-coast.png" width="2172" height="724"/></svg><text class="v2-heat-label" x="92" y="297" text-anchor="middle">Warmer sea</text><text class="v2-heat-label" x="303" y="297" text-anchor="middle">Cooler land</text><path class="v2-heat-line" d="M280 215L110 215M118.77582561890372 210.20574461395796L110 215L118.77582561890372 219.79425538604204"/><path class="v2-heat-line" d="M85 205L85 100M89.79425538604202 108.77582561890372L85 100L80.20574461395798 108.77582561890372"/><path class="v2-heat-line" d="M110 89L290 89M281.22417438109625 93.79425538604202L290 89L281.22417438109625 84.20574461395798"/><path class="v2-heat-line" d="M310 103L310 194M305.20574461395796 185.22417438109628L310 194L314.79425538604204 185.22417438109628"/><text class="v2-heat-label" x="200" y="196" text-anchor="middle">Near-surface air</text><text class="v2-heat-label" x="200" y="68" text-anchor="middle">Return flow aloft</text></g></g><text class="se-caption" x="89" y="330.88"><tspan x="89">Typical local circulation near a coast. Arrows show air movement; stronger regional winds</tspan><tspan x="89" dy="27">may alter this pattern.</tspan></text></g>
<g class="v2-reading-block" data-block="coastal-life-0" transform="translate(0 498)"><text class="se-copy" x="89" y="24"><tspan x="89">A sea breeze can make a hot coastal afternoon more comfortable, and sea-facing</tspan><tspan x="89" dy="32">windows may admit it. Large water bodies warm and cool relatively slowly,</tspan></text></g>
<g class="v2-reading-block" data-block="coastal-life-1" transform="translate(0 562)"><text class="se-copy" x="89" y="24"><tspan x="89">moderating nearby temperatures. A breeze need not reverse every day: clouds,</tspan><tspan x="89" dy="32">seasons and larger weather systems also matter.</tspan></text></g>
<g class="v2-reading-block" data-block="radiation" transform="translate(0 654)"><text class="v2-title" x="89" y="38"><tspan x="89">7.3 Radiation</tspan></text></g>
<g class="v2-reading-block" data-block="radiation-intro-0" transform="translate(0 712)"><text class="se-copy" x="89" y="24"><tspan x="89">Pema and Palden feel warmth from the stove without touching it. Heat reaches</tspan><tspan x="89" dy="32">them partly through <tspan class="se-bold">radiation</tspan>: energy carried by electromagnetic waves.</tspan></text></g>
<g class="v2-reading-block" data-block="radiation-intro-1" transform="translate(0 776)"><text class="se-copy" x="89" y="24"><tspan x="89">Radiation needs no material medium, so energy from the Sun can cross the</tspan><tspan x="89" dy="32">near-vacuum of space to Earth. Conduction and convection require matter.</tspan></text></g>
<g class="v2-reading-block" data-block="radiation-exchange-0" transform="translate(0 856)"><text class="se-copy" x="89" y="24"><tspan x="89">All everyday objects emit and absorb thermal radiation. A hot pan loses energy to</tspan><tspan x="89" dy="32">cooler surroundings through radiation, as well as through convection to air and</tspan></text></g>
<g class="v2-reading-block" data-block="radiation-exchange-1" transform="translate(0 920)"><text class="se-copy" x="89" y="24"><tspan x="89">conduction where it touches other materials. Cooling is not usually the work of</tspan><tspan x="89" dy="32">only one process.</tspan></text></g>
<g class="v2-reading-block" data-block="clothes-comparison" transform="translate(0 1000)"><g data-comparison-table="clothes-comparison"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Light and dark surfaces in sunlight</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="260.32" y="76.08"><tspan x="260.32">Light-coloured surfaces</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="618.6600000000001" y="76.08"><tspan x="618.6600000000001">Dark-coloured surfaces</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Typical</tspan><tspan x="103" dy="28">response</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="128.07999999999998"><tspan x="260.32">Often reflect more incoming</tspan><tspan x="260.32" dy="28">sunlight. May absorb less solar</tspan><tspan x="260.32" dy="28">energy than similar dark</tspan><tspan x="260.32" dy="28">surfaces.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="128.07999999999998"><tspan x="618.6600000000001">Often absorb more incoming</tspan><tspan x="618.6600000000001" dy="28">sunlight. May become warmer</tspan><tspan x="618.6600000000001" dy="28">under the same sunlight.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="230" y2="230"/><rect class="v2-table-frame" x="89" y="42" width="874" height="188"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="42" y2="230"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="42" y2="230"/></g></g>
<g class="v2-reading-block" data-block="clothing-limits-0" transform="translate(0 1246)"><text class="se-copy" x="89" y="24"><tspan x="89">Colour alone does not decide comfort. Fabric thickness, trapped air, ventilation</tspan><tspan x="89" dy="32">and wetness matter too. A dark shirt does not create heat, and colour’s effect in</tspan><tspan x="89" dy="32">sunlight is not a complete rule for insulation or infrared emission.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
