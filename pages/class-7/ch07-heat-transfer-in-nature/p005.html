<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="convection" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">7.2 Convection</tspan></text></g>
<g class="v2-reading-block" data-block="rising-air-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Pema notices smoke rising above a fire. Does heated air behave differently from</tspan><tspan x="89" dy="32">the surrounding air? A carefully balanced pair of cups can make a small</tspan><tspan x="89" dy="32">movement visible.</tspan></text></g>
<g class="v2-reading-block" data-block="cups-task" transform="translate(0 282)"><rect class="se-activity-panel" x="89" y="0" width="874" height="787" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">A teacher hangs identical inverted paper cups from equal threads at</tspan><tspan x="146" dy="32">either end of a wooden stick. Suspend it centrally and balance it</tspan><tspan x="146" dy="32">horizontally.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Predict the effect of heating below one cup. The teacher places a candle</tspan><tspan x="146" dy="32">well below it, clear of paper and thread.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Record any movement and a possible reason. Remove the candle and</tspan><tspan x="146" dy="32">watch again, keeping draughts away.</tspan></text><text class="se-copy" x="113" y="352"><tspan x="113">Teacher demonstration only: use a heatproof surface and fire-safe clearance.</tspan><tspan x="113" dy="32">Stop if paper warms excessively or browns. Do not repeat at home.</tspan></text><g transform="translate(0 404)"><g class="v2-heat-diagram" data-diagram="cups"><svg class="science-illustration" data-apparatus="cups" x="280" y="25" width="309.00686498855833" height="186" viewBox="42 0 1452 874" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch07/apparatus-cups.png" width="1536" height="1024"/></svg><svg class="science-illustration" data-apparatus="candle" x="290" y="232" width="37.98254122211445" height="40" viewBox="83 186 979 1031" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch07/apparatus-candle.png" width="1145" height="1374"/></svg><text class="v2-heat-label" x="479" y="20" text-anchor="end">Central suspension</text><path class="v2-heat-line" d="M493 17L434 31"/><text class="v2-heat-label" x="802" y="95" text-anchor="middle">Equal threads</text><path class="v2-heat-line" d="M737 102L553 111"/><text class="v2-heat-label" x="783" y="179" text-anchor="middle">Inverted cups</text><path class="v2-heat-line" d="M686 184L581 190"/><text class="v2-heat-label" x="547" y="285" text-anchor="middle">Candle well below paper</text></g></g><text class="se-caption" x="113" y="731.88"><tspan x="113">Start with the stick balanced. The drawing shows the starting arrangement, not the</tspan><tspan x="113" dy="27">result.</tspan></text></g>
<g class="v2-reading-block" data-block="cups-evidence-0" transform="translate(0 1091)"><text class="se-copy" x="89" y="24"><tspan x="89">The cup above the heat source may rise. Air near the flame warms, expands and</tspan><tspan x="89" dy="32">becomes less dense than surrounding cooler air. Rising air pushes on the</tspan></text></g>
<g class="v2-reading-block" data-block="cups-evidence-1" transform="translate(0 1155)"><text class="se-copy" x="89" y="24"><tspan x="89">inverted cup. A small imbalance or a draught can also move it, so check the</tspan><tspan x="89" dy="32">unheated setup before attributing movement to heating.</tspan></text></g>
<g class="v2-reading-block" data-block="air-expansion-0" transform="translate(0 1235)"><text class="se-copy" x="89" y="24"><tspan x="89">A partially inflated, tied balloon may grow larger when gently warmed by</tspan><tspan x="89" dy="32">sunlight: the air inside expands. It has not lost mass. Do not put balloons near</tspan></text></g>
<g class="v2-reading-block" data-block="air-expansion-1" transform="translate(0 1299)"><text class="se-copy" x="89" y="24"><tspan x="89">flames. Smoke contains gases and tiny particles; an upward flow of warm air can</tspan><tspan x="89" dy="32">carry them with it. Never breathe smoke deliberately.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">5</text></g></svg></div></div></section>
