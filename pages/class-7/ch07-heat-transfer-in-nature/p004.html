<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="insulation" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Trapping air to slow heat loss</tspan></text></g>
<g class="v2-reading-block" data-block="clothing-0" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89">Still air is a poor conductor. Woollen fibres trap small pockets of air, slowing heat</tspan><tspan x="89" dy="32">loss from our warmer bodies. Layers can do the same. Two thin blankets may</tspan></text></g>
<g class="v2-reading-block" data-block="clothing-1" transform="translate(0 224)"><text class="se-copy" x="89" y="24"><tspan x="89">insulate well if they trap air between them, but the result depends on their</tspan><tspan x="89" dy="32">material, thickness and how tightly they are pressed together. Small air pockets</tspan></text></g>
<g class="v2-reading-block" data-block="clothing-2" transform="translate(0 288)"><text class="se-copy" x="89" y="24"><tspan x="89">also restrict circulation. An open gap that lets air flow through is different from a</tspan><tspan x="89" dy="32">layer of trapped, still air.</tspan></text></g>
<g class="v2-reading-block" data-block="insulation-art" transform="translate(0 368)"><image class="science-illustration" data-photo="insulation" href="../../figures/class-7/science/ch07/insulation.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Woollen fibres and hollow bricks can trap air. Ceramic cups slow conduction compared with</tspan><tspan x="89" dy="27">similar metal cups.</tspan></text></g>
<g class="v2-reading-block" data-block="houses-0" transform="translate(0 730)"><text class="se-copy" x="89" y="24"><tspan x="89">Hollow bricks trap air and help slow heat entering a house in hot weather or</tspan><tspan x="89" dy="32">leaving it in cold weather. Traditional houses in the Mori area of Uttarkashi use</tspan></text></g>
<g class="v2-reading-block" data-block="houses-1" transform="translate(0 794)"><text class="se-copy" x="89" y="24"><tspan x="89">wooden wall layers with mud and cow-dung filling. Such construction combines</tspan><tspan x="89" dy="32">local materials to reduce heat loss; its performance also depends on gaps,</tspan><tspan x="89" dy="32">moisture and the whole building.</tspan></text></g>
<g class="v2-reading-block" data-block="blanket-pause" transform="translate(0 906)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="186" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A blanket does not generate heat. Explain why it can help a person stay</tspan><tspan x="113" dy="32">warm and also slow the melting of ice wrapped inside it. In each case, name</tspan><tspan x="113" dy="32">the warmer region, the colder region and the direction of heat transfer.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
