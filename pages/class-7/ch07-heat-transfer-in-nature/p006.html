<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="water-convection" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Tracking movement in water</tspan></text></g>
<g class="v2-reading-block" data-block="water-task" transform="translate(0 160)"><rect class="se-activity-panel" x="89" y="0" width="874" height="804" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">A teacher half-fills a heat-resistant 500 mL beaker. Using a straw guide,</tspan><tspan x="146" dy="32">they place a tiny potassium permanganate grain at the base’s centre</tspan><tspan x="146" dy="32">without stirring.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Predict the colour’s path. The teacher secures the beaker on a tripod and</tspan><tspan x="146" dy="32">gauze, then heats gently below the grain.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Sketch the streak’s movement, including near the surface and sides,</tspan><tspan x="146" dy="32">before reading the explanation.</tspan></text><text class="se-copy" x="113" y="352"><tspan x="113">Teacher demonstration only: use eye protection and laboratory precautions</tspan><tspan x="113" dy="32">for the chemical, flame and hot glass. Never taste the water or suck through</tspan><tspan x="113" dy="32">the straw. Avoid splashes; the teacher disposes of cooled waste safely.</tspan></text><g transform="translate(0 436)"><g class="v2-heat-diagram" data-diagram="beaker-setup"><svg class="science-illustration" data-apparatus="beaker" x="429" y="3" width="193.95589743589744" height="269" viewBox="415 12 703 975" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch07/apparatus-beaker.png" width="1536" height="1024"/></svg><text class="v2-heat-label" x="350" y="29" text-anchor="end">Straw guide</text><path class="v2-heat-line" d="M366 25L461 20"/><text class="v2-heat-label" x="715" y="108" text-anchor="start">Water</text><path class="v2-heat-line" d="M694 105L565 106"/><text class="v2-heat-label" x="715" y="174" text-anchor="start">Colour grain</text><path class="v2-heat-line" d="M695 168L593 168L528 136"/><text class="v2-heat-label" x="309" y="237" text-anchor="end">Gauze and tripod</text><path class="v2-heat-line" d="M326 229L461 158"/></g></g><text class="se-caption" x="113" y="748.88"><tspan x="113">Before heating: the colour source is at the base. Labels identify apparatus without</tspan><tspan x="113" dy="27">predicting the streak’s path.</tspan></text></g>
<g class="v2-reading-block" data-block="water-evidence-0" transform="translate(0 986)"><text class="se-copy" x="89" y="24"><tspan x="89">A coloured streak usually rises above the heat source, spreads and moves down</tspan><tspan x="89" dy="32">nearer the cooler sides. Water warmed at the base expands and becomes less</tspan></text></g>
<g class="v2-reading-block" data-block="water-evidence-1" transform="translate(0 1050)"><text class="se-copy" x="89" y="24"><tspan x="89">dense. It rises while cooler, denser water moves in to replace it. Continued</tspan><tspan x="89" dy="32">heating maintains this circulation.</tspan></text></g>
<g class="v2-reading-block" data-block="water-flow" transform="translate(0 1130)"><g class="v2-heat-diagram" data-diagram="beaker-flow"><svg class="science-illustration" data-apparatus="beaker-flow" x="435" y="3" width="161.89643652561247" height="147" viewBox="257 64 989 898" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch07/apparatus-beaker-flow.png" width="1536" height="1024"/></svg><path class="v2-heat-line" d="M517 126L517 78M521.794255386042 86.77582561890372L517 78L512.205744613958 86.77582561890372"/><path class="v2-heat-line" d="M509 79L465 79M473.77582561890375 74.20574461395798L465 79L473.77582561890375 83.79425538604202"/><path class="v2-heat-line" d="M525 79L574 79M565.2241743810963 83.79425538604202L574 79L565.2241743810963 74.20574461395798"/><path class="v2-heat-line" d="M465 85L465 127M460.20574461395796 118.22417438109628L465 127L469.79425538604204 118.22417438109628"/><path class="v2-heat-line" d="M574 85L574 127M569.205744613958 118.22417438109628L574 127L578.794255386042 118.22417438109628"/><path class="v2-heat-line" d="M473 130L505 130M496.22417438109625 134.79425538604204L505 130L496.22417438109625 125.20574461395798"/><path class="v2-heat-line" d="M566 130L529 130M537.7758256189037 125.20574461395798L529 130L537.7758256189037 134.79425538604204"/><text class="v2-heat-label" x="309" y="68" text-anchor="end">Warmer water</text><text class="v2-heat-label" x="309" y="96" text-anchor="end">rises</text><path class="v2-heat-line" d="M326 85H492L510 93"/><text class="v2-heat-label" x="721" y="68" text-anchor="start">Cooler water</text><text class="v2-heat-label" x="721" y="96" text-anchor="start">sinks</text><path class="v2-heat-line" d="M702 85H610L581 100"/></g><text class="se-caption" x="89" y="190.88"><tspan x="89">An explanatory model after observation: arrows show bulk movement of water, not the paths</tspan><tspan x="89" dy="27">of individual particles.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
