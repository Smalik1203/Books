<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="conduction-mechanism-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">positions and transfer energy to neighbours; the solid does not flow along with</tspan><tspan x="89" dy="32">the heat. Metals also have mobile electrons that help carry energy.</tspan></text></g>
<g class="v2-reading-block" data-block="conductors" transform="translate(0 192)"><g data-comparison-table="conductors"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Good and poor heat conductors</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="260.32" y="70.08"><tspan x="260.32">Good conductors</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="618.6600000000001" y="70.08"><tspan x="618.6600000000001">Poor conductors</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Heat</tspan><tspan x="103" dy="28">transfer</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="110.08"><tspan x="260.32">Transfer heat readily through</tspan><tspan x="260.32" dy="28">the material.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="110.08"><tspan x="618.6600000000001">Transfer heat more slowly under</tspan><tspan x="618.6600000000001" dy="28">similar conditions.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">Examples</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="178.07999999999998"><tspan x="260.32">aluminium, iron and steel.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="178.07999999999998"><tspan x="618.6600000000001">dry wood, glass, clay and</tspan><tspan x="618.6600000000001" dy="28">porcelain.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="218" y2="218"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="246.07999999999998"><tspan x="103">Use</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="246.07999999999998"><tspan x="260.32">Useful for the heated body of a</tspan><tspan x="260.32" dy="28">cooking pan.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="246.07999999999998"><tspan x="618.6600000000001">Useful where we want to slow</tspan><tspan x="618.6600000000001" dy="28">heat transfer.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="286" y2="286"/><rect class="v2-table-frame" x="89" y="42" width="874" height="244"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="42" y2="286"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="42" y2="286"/></g></g>
<g class="v2-reading-block" data-block="conductor-limits-0" transform="translate(0 494)"><text class="se-copy" x="89" y="24"><tspan x="89">Poor conductors are also called <tspan class="se-bold">insulators</tspan>. They slow heat transfer; they do not</tspan><tspan x="89" dy="32">stop it completely. A ceramic cup can still become hot. Do not repeat the flame</tspan><tspan x="89" dy="32">test with wood or ordinary glass: wood can burn and glass may crack.</tspan></text></g>
<g class="v2-reading-block" data-block="materials-table" transform="translate(0 606)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 7.1 · Classifying familiar materials</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Material</tspan></text><text class="v2-table-heading" x="304.02" y="76.08"><tspan x="304.02">Classification</tspan></text><text class="v2-table-heading" x="592.44" y="76.08"><tspan x="592.44">Reason or evidence</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Steel</tspan></text><text class="se-copy se-table-copy" x="304.02" y="128.07999999999998"><tspan x="304.02">Good conductor</tspan></text><text class="se-copy se-table-copy" x="592.44" y="128.07999999999998"><tspan x="592.44">Heat travels readily along a steel</tspan><tspan x="592.44" dy="28">utensil.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="174" y2="174"/><text class="se-copy se-table-copy" x="103" y="208.07999999999998"><tspan x="103">Dry wood</tspan></text><text class="se-copy se-table-copy" x="304.02" y="208.07999999999998"><tspan x="304.02">Poor conductor</tspan></text><text class="se-copy se-table-copy" x="592.44" y="208.07999999999998"><tspan x="592.44">A wooden handle slows heat</tspan><tspan x="592.44" dy="28">transfer.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="254" y2="254"/><text class="se-copy se-table-copy" x="103" y="288.08"><tspan x="103">Other examples</tspan></text><text class="se-copy se-table-copy" x="304.02" y="288.08"><tspan x="304.02">Classify in your notebook</tspan></text><text class="se-copy se-table-copy" x="592.44" y="288.08"><tspan x="592.44">Use experience or a reliable source;</tspan><tspan x="592.44" dy="28">do not test by touching hot objects.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="334" y2="334"/><rect class="v2-table-frame" x="89" y="42" width="874" height="292"/><line class="v2-table-rule" x1="290.02" x2="290.02" y1="42" y2="334"/><line class="v2-table-rule" x1="578.44" x2="578.44" y1="42" y2="334"/><text class="v2-table-note" x="89" y="366.88"><tspan x="89">These are sample records. Read across to connect a material, its classification and the</tspan><tspan x="89" dy="26">evidence. Add glass, clay, porcelain and still air.</tspan></text></g><g transform="translate(0 1024)"><g data-page-illustration="figures/class-7/science/ch07/apparatus-pan.png"><image class="science-illustration" href="../../figures/class-7/science/ch07/apparatus-pan.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A pan and its handle.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A pan and its handle.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
