="260.32">Transfer heat readily through</tspan><tspan x="260.32" dy="28">the material.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="134.07999999999998"><tspan x="618.6600000000001">Transfer heat more slowly under</tspan><tspan x="618.6600000000001" dy="28">similar conditions.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="210.07999999999998"><tspan x="103">Examples</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="210.07999999999998"><tspan x="260.32">aluminium, iron and steel.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="210.07999999999998"><tspan x="618.6600000000001">dry wood, glass, clay and</tspan><tspan x="618.6600000000001" dy="28">porcelain.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="254" y2="254"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="286.08"><tspan x="103">Use</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="286.08"><tspan x="260.32">Useful for the heated body of a</tspan><tspan x="260.32" dy="28">cooking pan.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="286.08"><tspan x="618.6600000000001">Useful where we want to slow</tspan><tspan x="618.6600000000001" dy="28">heat transfer.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="330" y2="330"/><rect class="v2-table-frame" x="89" y="54" width="874" height="276"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="54" y2="330"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="54" y2="330"/></g></g>
<g class="v2-reading-block" data-block="conductor-limits-0" transform="translate(0 470)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.27395" data-space-ratio="1.407">Poor<tspan dx="2.27395"> conductors</tspan><tspan dx="2.27395"> are</tspan><tspan dx="2.27395"> also</tspan><tspan dx="2.27395"> called</tspan><tspan dx="2.27395"> <tspan class="se-bold">insulators</tspan>.</tspan><tspan dx="2.27395"> They</tspan><tspan dx="2.27395"> slow</tspan><tspan dx="2.27395"> heat</tspan><tspan dx="2.27395"> transfer;</tspan><tspan dx="2.27395"> they</tspan><tspan dx="2.27395"> do</tspan><tspan dx="2.27395"> not</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.64872" data-space-ratio="1.474">stop<tspan dx="2.64872"> it</tspan><tspan dx="2.64872"> completely.</tspan><tspan dx="2.64872"> A</tspan><tspan dx="2.64872"> ceramic</tspan><tspan dx="2.64872"> cup</tspan><tspan dx="2.64872"> can</tspan><tspan dx="2.64872"> still</tspan><tspan dx="2.64872"> become</tspan><tspan dx="2.64872"> hot.</tspan><tspan dx="2.64872"> Do</tspan><tspan dx="2.64872"> not</tspan><tspan dx="2.64872"> repeat</tspan><tspan dx="2.64872"> the</tspan><tspan dx="2.64872"> flame</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">test with wood or ordinary glass: wood can burn and glass may crack.</tspan></text></g>
