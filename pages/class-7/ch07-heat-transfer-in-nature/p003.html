<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="strip-evidence-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">then pins farther away. Unequal wax amounts, pin spacing or draughts can alter</tspan><tspan x="89" dy="32">the order. An unexpected result is evidence to examine, not a result to erase.</tspan></text></g>
<g class="v2-reading-block" data-block="conduction-mechanism-0" transform="translate(0 192)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Conduction</tspan> transfers energy from a hotter region to a colder region through a</tspan><tspan x="89" dy="32">material, or between materials in contact. In a solid, particles vibrate about fixed</tspan></text></g>
<g class="v2-reading-block" data-block="conduction-mechanism-1" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">positions and transfer energy to neighbours; the solid does not flow along with</tspan><tspan x="89" dy="32">the heat. Metals also have mobile electrons that help carry energy.</tspan></text></g>
<g class="v2-reading-block" data-block="conductors" transform="translate(0 336)"><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Good conductors</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74"><tspan x="112">Transfer heat readily through the</tspan><tspan x="112" dy="32">material.</tspan></text><text class="se-copy" x="89" y="148" text-anchor="start">•</text><text class="se-copy" x="112" y="148"><tspan x="112">Examples: aluminium, iron and</tspan><tspan x="112" dy="32">steel.</tspan></text><text class="se-copy" x="89" y="222" text-anchor="start">•</text><text class="se-copy" x="112" y="222"><tspan x="112">Useful for the heated body of a</tspan><tspan x="112" dy="32">cooking pan.</tspan></text><text class="v2-comparison-title" x="526" y="30"><tspan x="526">Poor conductors</tspan></text><text class="se-copy" x="526" y="74" text-anchor="start">•</text><text class="se-copy" x="549" y="74"><tspan x="549">Transfer heat more slowly under</tspan><tspan x="549" dy="32">similar conditions.</tspan></text><text class="se-copy" x="526" y="148" text-anchor="start">•</text><text class="se-copy" x="549" y="148"><tspan x="549">Examples: dry wood, glass, clay and</tspan><tspan x="549" dy="32">porcelain.</tspan></text><text class="se-copy" x="526" y="222" text-anchor="start">•</text><text class="se-copy" x="549" y="222"><tspan x="549">Useful where we want to slow heat</tspan><tspan x="549" dy="32">transfer.</tspan></text></g>
<g class="v2-reading-block" data-block="conductor-limits-0" transform="translate(0 624)"><text class="se-copy" x="89" y="24"><tspan x="89">Poor conductors are also called <tspan class="se-bold">insulators</tspan>. They slow heat transfer; they do not</tspan><tspan x="89" dy="32">stop it completely. A ceramic cup can still become hot. Do not repeat the flame</tspan><tspan x="89" dy="32">test with wood or ordinary glass: wood can burn and glass may crack.</tspan></text></g>
<g class="v2-reading-block" data-block="materials-table" transform="translate(0 736)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 7.1 · Classifying familiar materials</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Material</tspan></text><text class="v2-table-heading" x="304.02" y="76.08"><tspan x="304.02">Classification</tspan></text><text class="v2-table-heading" x="592.44" y="76.08"><tspan x="592.44">Reason or evidence</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Steel</tspan></text><text class="se-copy se-table-copy" x="304.02" y="128.07999999999998"><tspan x="304.02">Good conductor</tspan></text><text class="se-copy se-table-copy" x="592.44" y="128.07999999999998"><tspan x="592.44">Heat travels readily along a steel</tspan><tspan x="592.44" dy="28">utensil.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="174" y2="174"/><text class="se-copy se-table-copy" x="103" y="208.07999999999998"><tspan x="103">Dry wood</tspan></text><text class="se-copy se-table-copy" x="304.02" y="208.07999999999998"><tspan x="304.02">Poor conductor</tspan></text><text class="se-copy se-table-copy" x="592.44" y="208.07999999999998"><tspan x="592.44">A wooden handle slows heat</tspan><tspan x="592.44" dy="28">transfer.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="254" y2="254"/><text class="se-copy se-table-copy" x="103" y="288.08"><tspan x="103">Other examples</tspan></text><text class="se-copy se-table-copy" x="304.02" y="288.08"><tspan x="304.02">Classify in your notebook</tspan></text><text class="se-copy se-table-copy" x="592.44" y="288.08"><tspan x="592.44">Use experience or a reliable source;</tspan><tspan x="592.44" dy="28">do not test by touching hot objects.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="334" y2="334"/><rect class="v2-table-frame" x="89" y="42" width="874" height="292"/><line class="v2-table-rule" x1="290.02" x2="290.02" y1="42" y2="334"/><line class="v2-table-rule" x1="578.44" x2="578.44" y1="42" y2="334"/><text class="v2-table-note" x="89" y="366.88"><tspan x="89">These are sample records. Read across to connect a material, its classification and the</tspan><tspan x="89" dy="26">evidence. Add glass, clay, porcelain and still air.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
