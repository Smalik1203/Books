<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="recharge-pause" transform="translate(0 112)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="218" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A town pumps more groundwater each year than rainfall replaces. Someone</tspan><tspan x="113" dy="32">says, “The water cycle will refill it, so there is no problem.” What is missing</tspan><tspan x="113" dy="32">from that argument? Explain which measurements would help compare</tspan><tspan x="113" dy="32">water taken out with water going back in.</tspan></text></g>
<g class="v2-reading-block" data-block="history" transform="translate(0 364)"><text class="se-heading" x="89" y="30"><tspan x="89">Observing rain across time</tspan></text></g>
<g class="v2-reading-block" data-block="varahamihira-0" transform="translate(0 412)"><text class="se-copy" x="89" y="24"><tspan x="89">The sixth-century astronomer and mathematician Varahamihira worked in</tspan><tspan x="89" dy="32">Ujjaini, now Ujjain. His Brihatsamhita discussed seasonal rainfall using</tspan></text></g>
<g class="v2-reading-block" data-block="varahamihira-1" transform="translate(0 476)"><text class="se-copy" x="89" y="24"><tspan x="89">observations such as clouds and winds, alongside celestial signs. This is part of</tspan><tspan x="89" dy="32">the history of enquiry. Historical prediction methods must still be tested against</tspan><tspan x="89" dy="32">evidence; they are not all accepted causes or reliable forecasting tools.</tspan></text></g>
<g class="v2-reading-block" data-block="ice-storage" transform="translate(0 600)"><text class="se-heading" x="89" y="30"><tspan x="89">Saving winter water for spring</tspan></text></g>
<g class="v2-reading-block" data-block="ice-stupa-0" transform="translate(0 648)"><text class="se-copy" x="89" y="24"><tspan x="89">In parts of Ladakh, spring water shortages can arrive before enough mountain</tspan><tspan x="89" dy="32">snow melts for irrigation. An ice stupa stores winter stream water as ice. Water</tspan></text></g>
<g class="v2-reading-block" data-block="ice-stupa-1" transform="translate(0 712)"><text class="se-copy" x="89" y="24"><tspan x="89">carried through pipes is sprayed into freezing air and builds a cone, layer by</tspan><tspan x="89" dy="32">layer. As temperatures rise, it melts and releases water when farmers need it.</tspan></text></g>
<g class="v2-reading-block" data-block="stupa-art" transform="translate(0 792)"><image class="science-illustration" data-photo="ice-stupa" href="../../figures/class-7/science/ch07/ice-stupa.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">An ice stupa shifts part of the water supply from winter towards the growing season. Its yield</tspan><tspan x="89" dy="27">and lifetime depend on weather, size and water supply.</tspan></text></g>
<g class="v2-reading-block" data-block="stupa-limits-0" transform="translate(0 1154)"><text class="se-copy" x="89" y="24"><tspan x="89">This approach uses changes of state and seasonal temperature differences; it</tspan><tspan x="89" dy="32">does not make new water. No one structure guarantees water throughout</tspan></text></g>
<g class="v2-reading-block" data-block="stupa-limits-1" transform="translate(0 1218)"><text class="se-copy" x="89" y="24"><tspan x="89">summer. Heat transfer, local knowledge and measured water needs all matter</tspan><tspan x="89" dy="32">when designing a solution.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
