<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07 page--opener" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 1"><g class="chapter-opener" data-opener="science-g7-ch07"><defs><linearGradient id="science-g7-ch07-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop class="chapter-opener__gradient-start" offset="0%"/><stop class="chapter-opener__gradient-end" offset="100%"/></linearGradient></defs><path class="chapter-opener__band" fill="url(#science-g7-ch07-gradient)" d="M-17 -17H1069V300H-17Z"/><path class="chapter-opener__edge" d="M-17 296H1069V300H-17Z"/><g class="chapter-opener__motif v2-change-motif" transform="translate(951 84) scale(1.05)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><line class="chapter-opener__divider" x1="240" x2="240" y1="94" y2="252"/><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number se-running" x="151" y="242" text-anchor="middle">7</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">Heat Transfer</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">in Nature</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch07/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>A Sikkim family watching thukpa being cooked on an enclosed stove</title></image></g><text class="se-copy v2-intro" x="89" y="981"><tspan x="89">Why does a metal pan get hot while a woollen blanket helps us stay</tspan><tspan x="89" dy="34">warm?</tspan></text><text class="se-copy" x="89" y="1067"><tspan x="89">On a winter evening in Gangtok, Pema and Palden watch their grandmother cook</tspan><tspan x="89" dy="32">thukpa. Palden remembers a warmer, more humid holiday in Kerala. Kerala is</tspan><tspan x="89" dy="32">nearer the equator and the sea; Gangtok is much higher above sea level. Their</tspan><tspan x="89" dy="32">grandfather explains that these features influence the local climate.</tspan></text><text class="se-copy" x="89" y="1211"><tspan x="89">The Sun is Earth’s main source of heat. But how does heat travel through a pan,</tspan><tspan x="89" dy="32">the air and even empty space? Follow those paths, then explore how the Sun</tspan><tspan x="89" dy="32">helps water move through our world.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
