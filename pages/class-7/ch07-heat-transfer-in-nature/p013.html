<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="seepage-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Water often passes fastest through loosely packed gravel, more slowly through</tspan><tspan x="89" dy="32">sand and slowest through clay. The size and connection of pore spaces help</tspan></text></g>
<g class="v2-reading-block" data-block="seepage-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">explain the difference. Packing, cracks, moisture and blocked outlets can change</tspan><tspan x="89" dy="32">the pattern. Keep your actual measurements even if the expected order does not</tspan><tspan x="89" dy="32">appear.</tspan></text></g>
<g class="v2-reading-block" data-block="infiltration-definition-0" transform="translate(0 288)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Infiltration</tspan> is the entry of surface water into soil. Water can then move deeper</tspan><tspan x="89" dy="32">through connected pores and fractures in soil and rock. Clay can hold water in</tspan></text></g>
<g class="v2-reading-block" data-block="infiltration-definition-1" transform="translate(0 352)"><text class="se-copy" x="89" y="24"><tspan x="89">many tiny pores yet transmit it slowly: having spaces and having well-connected</tspan><tspan x="89" dy="32">pathways are not the same thing.</tspan></text></g>
<g class="v2-reading-block" data-block="aquifers" transform="translate(0 444)"><text class="se-heading" x="89" y="30"><tspan x="89">Storing and replenishing groundwater</tspan></text></g>
<g class="v2-reading-block" data-block="aquifer-definition-0" transform="translate(0 492)"><text class="se-copy" x="89" y="24"><tspan x="89">Below the water table, connected pore spaces and rock openings are saturated</tspan><tspan x="89" dy="32">with <tspan class="se-bold">groundwater</tspan>. An <tspan class="se-bold">aquifer</tspan> is a layer of sediment or rock that can store and</tspan></text></g>
<g class="v2-reading-block" data-block="aquifer-definition-1" transform="translate(0 556)"><text class="se-copy" x="89" y="24"><tspan x="89">transmit useful amounts of this water. It is not usually an underground lake.</tspan><tspan x="89" dy="32">Wells tap these saturated layers, sometimes a few metres down and sometimes</tspan><tspan x="89" dy="32">hundreds of metres deep.</tspan></text></g>
<g class="v2-reading-block" data-block="aquifer-model" transform="translate(0 668)"><g class="v2-heat-diagram" data-diagram="aquifer"><svg class="science-illustration" data-apparatus="aquifer" x="330" y="22" width="417.7215320910973" height="271" viewBox="24 22 1489 966" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch07/apparatus-aquifer.png" width="1536" height="1024"/></svg><path class="v2-heat-line" d="M337 172H747"/><text class="v2-heat-label" x="165" y="46" text-anchor="start">Ground surface</text><path class="v2-heat-line" d="M305 51L378 90"/><text class="v2-heat-label" x="299" y="107" text-anchor="end"><tspan x="299">Unsaturated soil</tspan><tspan x="299" dy="28"> and rock</tspan></text><path class="v2-heat-line" d="M307 128L378 126"/><text class="v2-heat-label" x="161" y="181" text-anchor="start">Water table</text><path class="v2-heat-line" d="M299 174H336"/><text class="v2-heat-label" x="299" y="231" text-anchor="end"><tspan x="299">Saturated, permeable</tspan><tspan x="299" dy="28"> aquifer</tspan></text><path class="v2-heat-line" d="M310 235L379 233"/><text class="v2-heat-label" x="819" y="29" text-anchor="start">Well</text><path class="v2-heat-line" d="M798 34H729L634 44"/><text class="v2-heat-label" x="865" y="103" text-anchor="middle">Recharge</text><path class="v2-heat-line" d="M816 114L737 202M739.2949424905818 192.26689982765396L737 202L746.4300841067541 198.67231105126316"/><path class="v2-heat-line" d="M424 129L424 202M419.20574461395796 193.22417438109628L424 202L428.79425538604204 193.22417438109628"/><path class="v2-heat-line" d="M552 129L552 202M547.205744613958 193.22417438109628L552 202L556.794255386042 193.22417438109628"/><text class="v2-heat-label" x="543" y="327" text-anchor="middle">Less permeable layer</text><path class="v2-heat-line" d="M543 304V278"/><circle class="v2-heat-pore" cx="395" cy="240" r="3"/><circle class="v2-heat-pore" cx="448" cy="240" r="3"/><circle class="v2-heat-pore" cx="492" cy="240" r="3"/><circle class="v2-heat-pore" cx="579" cy="240" r="3"/><circle class="v2-heat-pore" cx="706" cy="240" r="3"/></g><text class="se-caption" x="89" y="360.88"><tspan x="89">A simplified section below ground. Blue dots represent water in pore spaces, not a large</tspan><tspan x="89" dy="27">hollow cavern; a well reaches below the water table.</tspan></text></g>
<g class="v2-reading-block" data-block="recharge-0" transform="translate(0 1084)"><text class="se-copy" x="89" y="24"><tspan x="89">Not all infiltrating water reaches an aquifer; plants use some and some returns to</tspan><tspan x="89" dy="32">the air. Recharge depends on local geology and can be slow. When pumping</tspan></text></g>
<g class="v2-reading-block" data-block="recharge-1" transform="translate(0 1148)"><text class="se-copy" x="89" y="24"><tspan x="89">exceeds recharge over time, groundwater storage falls. More paving and loss of</tspan><tspan x="89" dy="32">vegetation can reduce infiltration and increase runoff.</tspan></text></g>
<g class="v2-reading-block" data-block="harvesting-0" transform="translate(0 1228)"><text class="se-copy" x="89" y="24"><tspan x="89">Rainwater harvesting stores water or directs suitable water towards recharge</tspan><tspan x="89" dy="32">areas. Well-designed pits can help water enter the ground, but they need local</tspan></text></g>
<g class="v2-reading-block" data-block="harvesting-1" transform="translate(0 1292)"><text class="se-copy" x="89" y="24"><tspan x="89">expertise, maintenance and protection from polluted runoff. The water cycle</tspan><tspan x="89" dy="32">replenishes groundwater only at a limited rate; careful use is still essential.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
