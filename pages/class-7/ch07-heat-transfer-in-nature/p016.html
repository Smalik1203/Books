<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="582" rx="18"/><text class="se-copy" x="113" y="222" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Conduction</tspan> — Energy transfer</tspan><tspan x="113" dy="32" data-narrow-prose="true">through matter without bulk flow of</tspan><tspan x="113" dy="32" data-paragraph-end="true">the material.</tspan></text><text class="se-copy" x="113" y="338" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Convection</tspan> — Heat transfer with the</tspan><tspan x="113" dy="32" data-paragraph-end="true">bulk movement of a liquid or gas.</tspan></text><text class="se-copy" x="113" y="422" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Radiation</tspan> — Energy transfer by</tspan><tspan x="113" dy="32" data-narrow-prose="true">electromagnetic waves; no material</tspan><tspan x="113" dy="32" data-paragraph-end="true">medium is needed.</tspan></text><text class="se-copy" x="113" y="538" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Insulator</tspan> — A material that slows</tspan><tspan x="113" dy="32" data-narrow-prose="true">heat transfer under stated</tspan><tspan x="113" dy="32" data-paragraph-end="true">conditions.</tspan></text><text class="se-copy" x="113" y="654" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Density</tspan> — Mass per unit volume;</tspan><tspan x="113" dy="32" data-narrow-prose="true">warmed air usually expands and</tspan><tspan x="113" dy="32" data-paragraph-end="true">becomes less dense.</tspan></text><text class="se-copy" x="541" y="222" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Water</tspan> <tspan class="se-bold">cycle</tspan> — The continuing</tspan><tspan x="541" dy="32" data-narrow-prose="true">movement and storage of water on,</tspan><tspan x="541" dy="32" data-paragraph-end="true">above and below Earth’s surface.</tspan></text><text class="se-copy" x="541" y="338" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Transpiration</tspan> — Release of water</tspan><tspan x="541" dy="32" data-narrow-prose="true">vapour from plants, mainly through</tspan><tspan x="541" dy="32" data-paragraph-end="true">leaves.</tspan></text><text class="se-copy" x="541" y="454" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Infiltration</tspan> — Entry of water from</tspan><tspan x="541" dy="32" data-paragraph-end="true">the ground surface into soil.</tspan></text><text class="se-copy" x="541" y="538" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Groundwater</tspan> — Water in saturated</tspan><tspan x="541" dy="32" data-narrow-prose="true">pores and openings below the water</tspan><tspan x="541" dy="32" data-paragraph-end="true">table.</tspan></text><text class="se-copy" x="541" y="654" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Aquifer</tspan> — A permeable layer of</tspan><tspan x="541" dy="32" data-narrow-prose="true">sediment or rock that stores and</tspan><tspan x="541" dy="32" data-paragraph-end="true">transmits groundwater.</tspan></text><g transform="translate(0 756)"><g data-page-illustration="figures/class-6/science/ch11/rain.png"><image class="science-illustration" href="../../figures/class-6/science/ch11/rain.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Rainwater can be collected for later use.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Rainwater can be collected for later use.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
