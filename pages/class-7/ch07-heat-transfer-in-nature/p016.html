<section class="page page--food page--science-editorial page--science-v2 page--g7-ch07" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Heat Transfer in Nature, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M5 90C-8 66 27 60 14 36M30 104C13 75 54 54 38 19M56 94C38 66 78 47 62 10"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 7</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Heat Transfer in Nature</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204"><tspan x="112">Heat transfers from hotter regions to colder regions. Conduction, convection</tspan><tspan x="112" dy="32">and radiation can act together.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278"><tspan x="112">Conduction does not require bulk movement. In solids, particles vibrate about</tspan><tspan x="112" dy="32">fixed positions; metals conduct heat readily.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352"><tspan x="112">Poor conductors slow heat transfer. Trapped still air helps insulate clothing and</tspan><tspan x="112" dy="32">buildings.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426"><tspan x="112">Convection carries energy with moving liquids and gases. Heating can make a</tspan><tspan x="112" dy="32">fluid expand and become less dense.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500"><tspan x="112">Daytime sea breezes usually move from sea to land; nighttime land breezes</tspan><tspan x="112" dy="32">usually move from land to sea. Local weather can alter the pattern.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574"><tspan x="112">Radiation needs no medium. It carries solar energy across space. All everyday</tspan><tspan x="112" dy="32">objects emit and absorb thermal radiation.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648"><tspan x="112">Light and dark surfaces can absorb sunlight differently, but material, thickness</tspan><tspan x="112" dy="32">and ventilation also affect comfort.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722"><tspan x="112">Solar energy supports evaporation. Transpiration, condensation, precipitation,</tspan><tspan x="112" dy="32">runoff and groundwater movement connect water’s many routes.</tspan></text><text class="se-copy" x="89" y="796" text-anchor="start">•</text><text class="se-copy" x="112" y="796"><tspan x="112">Infiltration depends on pathways through soil and rock. Aquifers store and</tspan><tspan x="112" dy="32">transmit groundwater in connected pores and openings.</tspan></text><text class="se-copy" x="89" y="870" text-anchor="start">•</text><text class="se-copy" x="112" y="870"><tspan x="112">Pumping can exceed recharge. Careful water use, suitable rainwater harvesting</tspan><tspan x="112" dy="32">and seasonal ice storage help communities manage limited supplies.</tspan></text><g transform="translate(0 920)"><g data-page-illustration="figures/class-7/science/ch07/apparatus-pan.png"><image class="science-illustration" href="../../figures/class-7/science/ch07/apparatus-pan.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A pan and its handle.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A pan and its handle.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
