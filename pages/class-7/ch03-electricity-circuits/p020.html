<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="20"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 20"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="materials" transform="translate(0 112)"><image class="science-illustration" data-photo="materials" href="../../figures/class-7/science/ch03/materials.png" x="121" y="0" width="810" height="540" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="570.88"><tspan x="89">Choose objects with clearly identified materials. Test only safe, dry samples approved by the</tspan><tspan x="89" dy="27">teacher.</tspan></text></g>
<g class="v2-reading-block" data-block="record" transform="translate(0 744)"><g data-table-spacing="airy" data-comparison-table="record"><text class="v2-table-caption" x="89" y="33.6"><tspan x="89">Notebook recording guide: keep observations separate from conclusions</tspan></text><rect class="se-table-head" x="89" y="54" width="874" height="52"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="88.08"><tspan x="103">Record</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="312.76" y="88.08"><tspan x="312.76">What to include</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="644.88" y="88.08"><tspan x="644.88">Why it matters</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="106" y2="106"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="140.07999999999998"><tspan x="103">Object and</tspan><tspan x="103" dy="28">material</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="140.07999999999998"><tspan x="312.76">Name the object and its tested</tspan><tspan x="312.76" dy="28">surface.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="140.07999999999998"><tspan x="644.88">A metal object may have an</tspan><tspan x="644.88" dy="28">insulating coating.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="186" y2="186"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="220.07999999999998"><tspan x="103">Observation</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="220.07999999999998"><tspan x="312.76">Glow, no visible glow, or</tspan><tspan x="312.76" dy="28">uncertain; note the contact.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="220.07999999999998"><tspan x="644.88">Do not replace the</tspan><tspan x="644.88" dy="28">observation with an expected</tspan><tspan x="644.88" dy="28">answer.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="294" y2="294"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="328.08"><tspan x="103">Check and</tspan><tspan x="103" dy="28">conclusion</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="328.08"><tspan x="312.76">Record the tester check and</tspan><tspan x="312.76" dy="28">any repeat.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="644.88" y="328.08"><tspan x="644.88">State what this test supports,</tspan><tspan x="644.88" dy="28">and what it cannot settle.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="374" y2="374"/><rect class="v2-table-frame" x="89" y="54" width="874" height="320"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="54" y2="374"/><line class="v2-table-rule" x1="630.88" x2="630.88" y1="54" y2="374"/><text class="v2-table-note" x="89" y="414.88"><tspan x="89">Read across to plan each entry. Compare down your own records to look for patterns; this is</tspan><tspan x="89" dy="26">guidance, not a table of measured results.</tspan></text></g></g>
<g class="v2-reading-block" data-block="conduct-explain-0" transform="translate(0 1218)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.01971" data-space-ratio="1.361">A<tspan dx="2.01971"> <tspan class="se-bold">conductor</tspan></tspan><tspan dx="2.01971"> allows</tspan><tspan dx="2.01971"> electric</tspan><tspan dx="2.01971"> current</tspan><tspan dx="2.01971"> to</tspan><tspan dx="2.01971"> flow</tspan><tspan dx="2.01971"> relatively</tspan><tspan dx="2.01971"> easily.</tspan><tspan dx="2.01971"> An</tspan><tspan dx="2.01971"> <tspan class="se-bold">insulator</tspan></tspan><tspan dx="2.01971"> resists</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.55485" data-space-ratio="1.636">that<tspan dx="3.55485"> flow</tspan><tspan dx="3.55485"> strongly</tspan><tspan dx="3.55485"> under</tspan><tspan dx="3.55485"> the</tspan><tspan dx="3.55485"> conditions</tspan><tspan dx="3.55485"> considered.</tspan><tspan dx="3.55485"> Metals</tspan><tspan dx="3.55485"> such</tspan><tspan dx="3.55485"> as</tspan><tspan dx="3.55485"> copper</tspan><tspan dx="3.55485"> and</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="conduct-explain-1" transform="translate(0 1282)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="11.50324" data-space-ratio="3.057">aluminium<tspan dx="11.50324"> are</tspan><tspan dx="11.50324"> useful</tspan><tspan dx="11.50324"> conductors.</tspan><tspan dx="11.50324"> Dry</tspan><tspan dx="11.50324"> plastic,</tspan><tspan dx="11.50324"> rubber,</tspan><tspan dx="11.50324"> glass</tspan><tspan dx="11.50324"> and</tspan><tspan dx="11.50324"> ceramic</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="9.46871" data-space-ratio="2.693">commonly<tspan dx="9.46871"> act</tspan><tspan dx="9.46871"> as</tspan><tspan dx="9.46871"> insulators.</tspan><tspan dx="9.46871"> Graphite</tspan><tspan dx="9.46871"> is</tspan><tspan dx="9.46871"> a</tspan><tspan dx="9.46871"> non-metal</tspan><tspan dx="9.46871"> that</tspan><tspan dx="9.46871"> conducts:</tspan><tspan dx="9.46871"> being</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">metallic is not the definition of a conductor.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">20</text></g></svg></div></div></section>
