<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="20"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 20"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204"><tspan x="112">A cell has positive and negative terminals and supplies electrical energy. In a</tspan><tspan x="112" dy="32">series battery, positive joins negative between neighbouring cells.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278"><tspan x="112">An incandescent lamp has a filament connected to two separate terminals.</tspan><tspan x="112" dy="32">Heating of the filament produces light.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352"><tspan x="112">An LED has no filament. It normally emits light with a suitable forward</tspan><tspan x="112" dy="32">connection and requires current limiting.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426"><tspan x="112">A complete path, a working source, good contacts and suitable components are</tspan><tspan x="112" dy="32">needed for a lamp to glow.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500"><tspan x="112">Conventional current in the external circuit is taken from positive towards</tspan><tspan x="112" dy="32">negative. Energy is transferred; current is not used up in a lamp.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574"><tspan x="112">A switch controls a path. Opening it anywhere in a single series loop interrupts</tspan><tspan x="112" dy="32">current in the whole loop.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648"><tspan x="112">Circuit diagrams show connections using shared symbols. The longer</tspan><tspan x="112" dy="32">cell-symbol line represents the positive terminal.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722"><tspan x="112">Conductors and insulators serve different purposes. A no-glow result is limited</tspan><tspan x="112" dy="32">by the tester’s sensitivity and the quality of contact.</tspan></text><text class="se-copy" x="89" y="796" text-anchor="start">•</text><text class="se-copy" x="112" y="796"><tspan x="112">Predict before testing, record actual observations, use a working control and</tspan><tspan x="112" dy="32">investigate one possible fault at a time.</tspan></text><text class="se-copy" x="89" y="870" text-anchor="start">•</text><text class="se-copy" x="112" y="870"><tspan x="112">Use only approved small cells in these activities. Never test mains electricity,</tspan><tspan x="112" dy="32">people or damaged equipment; disconnect after testing.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">20</text></g></svg></div></div></section>
