<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="20"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 20"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="conduct-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">3.4 Conductors and Insulators</tspan></text></g>
<g class="v2-reading-block" data-block="conduct-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Why do connecting wires have a metal core and a plastic covering? Use a working</tspan><tspan x="89" dy="32">low-voltage circuit to compare materials. Begin by checking the tester itself.</tspan></text></g>
<g class="v2-reading-block" data-block="conduct-intro-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">Otherwise a dark lamp could tell you about a faulty tester rather than the object</tspan><tspan x="89" dy="32">you meant to test.</tspan></text></g>
<g class="v2-reading-block" data-block="conduct-task" transform="translate(0 314)"><rect class="se-activity-panel" x="89" y="0" width="874" height="618" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Make a loop with one cell and a matching incandescent lamp, leaving two</tspan><tspan x="146" dy="32">free wire ends as a test gap. Briefly touch those ends together. If the lamp</tspan><tspan x="146" dy="32">does not glow, fix the tester before continuing. The lamp must remain in</tspan><tspan x="146" dy="32">the loop.</tspan></text><text class="se-activity-step" x="132" y="232" text-anchor="end">2.</text><text class="se-copy" x="146" y="232"><tspan x="146">Choose safe, clean, dry objects: a spoon, coin, key, foil, cork, rubber</tspan><tspan x="146" dy="32">eraser, plastic ruler, wooden block, glass item, paper, cardboard, wax and</tspan><tspan x="146" dy="32">graphite pencil lead. Let the teacher handle any pins or needles.</tspan></text><text class="se-activity-step" x="132" y="340" text-anchor="end">3.</text><text class="se-copy" x="146" y="340"><tspan x="146">Place each object across the gap so the two wire ends touch separate</tspan><tspan x="146" dy="32">points on it, not each other. Test briefly, record the material and whether</tspan><tspan x="146" dy="32">the lamp glows, then disconnect.</tspan></text><text class="se-activity-step" x="132" y="448" text-anchor="end">4.</text><text class="se-copy" x="146" y="448"><tspan x="146">Recheck the tester by touching its free ends together between doubtful</tspan><tspan x="146" dy="32">results. Describe anything that may affect contact: a coating, dirt,</tspan><tspan x="146" dy="32">moisture or a very small contact area.</tspan></text><text class="se-activity-step" x="132" y="556" text-anchor="end">5.</text><text class="se-copy" x="146" y="556"><tspan x="146">Use the recording guide to propose a conclusion and its limits. Never test</tspan><tspan x="146" dy="32">people, sockets, liquids or connected appliances.</tspan></text></g><g transform="translate(0 954)"><g data-page-illustration="figures/class-7/science/ch03/materials.png"><image class="science-illustration" href="../../figures/class-7/science/ch03/materials.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Materials for conductivity tests.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Materials for conductivity tests.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">20</text></g></svg></div></div></section>
