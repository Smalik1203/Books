<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="21"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 21"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="materials" transform="translate(0 112)"><image class="science-illustration" data-photo="materials" href="../../figures/class-7/science/ch03/materials.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Choose objects with clearly identified materials. Test only safe, dry samples approved by the</tspan><tspan x="89" dy="27">teacher.</tspan></text></g>
<g class="v2-reading-block" data-block="record" transform="translate(0 474)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Notebook recording guide: keep observations separate from conclusions</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Record</tspan></text><text class="v2-table-heading" x="312.76" y="76.08"><tspan x="312.76">What to include</tspan></text><text class="v2-table-heading" x="644.88" y="76.08"><tspan x="644.88">Why it matters</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Object and</tspan><tspan x="103" dy="28">material</tspan></text><text class="se-copy se-table-copy" x="312.76" y="128.07999999999998"><tspan x="312.76">Name the object and its tested</tspan><tspan x="312.76" dy="28">surface.</tspan></text><text class="se-copy se-table-copy" x="644.88" y="128.07999999999998"><tspan x="644.88">A metal object may have an</tspan><tspan x="644.88" dy="28">insulating coating.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="174" y2="174"/><text class="se-copy se-table-copy" x="103" y="208.07999999999998"><tspan x="103">Observation</tspan></text><text class="se-copy se-table-copy" x="312.76" y="208.07999999999998"><tspan x="312.76">Glow, no visible glow, or</tspan><tspan x="312.76" dy="28">uncertain; note the contact.</tspan></text><text class="se-copy se-table-copy" x="644.88" y="208.07999999999998"><tspan x="644.88">Do not replace the</tspan><tspan x="644.88" dy="28">observation with an expected</tspan><tspan x="644.88" dy="28">answer.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="282" y2="282"/><text class="se-copy se-table-copy" x="103" y="316.08"><tspan x="103">Check and</tspan><tspan x="103" dy="28">conclusion</tspan></text><text class="se-copy se-table-copy" x="312.76" y="316.08"><tspan x="312.76">Record the tester check and</tspan><tspan x="312.76" dy="28">any repeat.</tspan></text><text class="se-copy se-table-copy" x="644.88" y="316.08"><tspan x="644.88">State what this test supports,</tspan><tspan x="644.88" dy="28">and what it cannot settle.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="362" y2="362"/><rect class="v2-table-frame" x="89" y="42" width="874" height="320"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="42" y2="362"/><line class="v2-table-rule" x1="630.88" x2="630.88" y1="42" y2="362"/><text class="v2-table-note" x="89" y="394.88"><tspan x="89">Read across to plan each entry. Compare down your own records to look for patterns; this is</tspan><tspan x="89" dy="26">guidance, not a table of measured results.</tspan></text></g>
<g class="v2-reading-block" data-block="conduct-explain-0" transform="translate(0 920)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">conductor</tspan> allows electric current to flow relatively easily. An <tspan class="se-bold">insulator</tspan> resists</tspan><tspan x="89" dy="32">that flow strongly under the conditions considered. Metals such as copper and</tspan></text></g>
<g class="v2-reading-block" data-block="conduct-explain-1" transform="translate(0 984)"><text class="se-copy" x="89" y="24"><tspan x="89">aluminium are useful conductors. Dry plastic, rubber, glass and ceramic</tspan><tspan x="89" dy="32">commonly act as insulators. Graphite is a non-metal that conducts: being</tspan><tspan x="89" dy="32">metallic is not the definition of a conductor.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">21</text></g></svg></div></div></section>
