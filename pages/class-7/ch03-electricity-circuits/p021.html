<g class="v2-reading-block" data-block="assessment-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Use your notebook. Support each answer with evidence and explain any</tspan><tspan x="89" dy="32">uncertainty.</tspan></text></g>
<g class="v2-reading-block" data-block="q1" transform="translate(0 250)"><text class="se-copy" x="111" y="24" text-anchor="end">1.</text><text class="se-copy" x="132" y="24"><tspan x="132">Choose the incorrect statement and correct it: (a) A switch is the source of</tspan><tspan x="132" dy="32">electric current. (b) A switch completes or breaks a circuit. (c) A switch lets</tspan><tspan x="132" dy="32">us control when a device operates. (d) The open switch used here has an air</tspan><tspan x="132" dy="32">gap between its contacts.</tspan></text></g>
<g class="v2-reading-block" data-block="q2" transform="translate(0 408)"><text class="se-copy" x="111" y="24" text-anchor="end">2.</text><text class="se-copy" x="132" y="24"><tspan x="132">The working tester below has a gap between A and B. Suggest a material that</tspan><tspan x="132" dy="32">would not make its lamp glow when placed across the gap. Give a conducting</tspan><tspan x="132" dy="32">comparison and state one limitation of a no-glow result.</tspan></text><g transform="translate(0 112)"><g class="v2-circuit" data-diagram="tester"><g transform="translate(320 10)"><path class="v2-circuit-wire" d="M40 55H140M220 55H320V80M320 125V155H220M140 155H40V55"/><path class="v2-circuit-wire" d="M140 155H173M185 155H220"/><path class="v2-circuit-wire" d="M173 134v42M185 145v20"/><circle class="v2-circuit-wire" cx="180" cy="55" r="20"/><path class="v2-circuit-wire" d="M166 41l28 28M166 69l28 -28M140 55h20M200 55h20"/><circle class="v2-circuit-contact" cx="320" cy="80" r="4"/><circle class="v2-circuit-contact" cx="320" cy="125" r="4"/><text class="v2-circuit-label" x="342" y="85" text-anchor="start">A</text><text class="v2-circuit-label" x="342" y="131" text-anchor="start">B</text></g></g></g><text class="se-caption" x="89" y="350.88"><tspan x="89">The lamp remains in the loop while an object bridges A and B.</tspan></text></g>
<g class="v2-reading-block" data-block="q3" transform="translate(0 791)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24"><tspan x="132">The two lamps below are in one series loop. If one filament breaks, will the</tspan><tspan x="132" dy="32">other lamp glow? Explain by tracing the path.</tspan></text><g transform="translate(0 80)"><g class="v2-circuit" data-diagram="two-lamps"><g transform="translate(340 10)"><path class="v2-circuit-wire" d="M40 55H50M130 55H230M310 55H320V155H220M140 155H40V55"/><circle class="v2-circuit-wire" cx="90" cy="55" r="20"/><path class="v2-circuit-wire" d="M76 41l28 28M76 69l28 -28M50 55h20M110 55h20"/><circle class="v2-circuit-wire" cx="270" cy="55" r="20"/><path class="v2-circuit-wire" d="M256 41l28 28M256 69l28 -28M230 55h20M290 55h20"/><path class="v2-circuit-wire" d="M140 155H162M196 155H220"/><path class="v2-circuit-wire" d="M162 134v42M174 145v20"/><path class="v2-circuit-wire" d="M184 134v42M196 145v20"/></g></g></g><text class="se-caption" x="89" y="320.88"><tspan x="89">Assume suitable lamps and a working battery.</tspan></text></g>
<g class="v2-reading-block" data-block="q4" transform="translate(0 1144)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24"><tspan x="132">A student leaves the plastic insulation on the wire ends where they touch the</tspan><tspan x="132" dy="32">terminals. The cell and lamp work. Will the lamp glow? Explain what must</tspan><tspan x="132" dy="32">make contact.</tspan></text></g>
<g class="v2-reading-block" data-block="q5" transform="translate(0 1270)"><text class="se-copy" x="111" y="24" text-anchor="end">5.</text><text class="se-copy" x="132" y="24"><tspan x="132">Draw a circuit diagram for a simple incandescent torch. Include the cell or</tspan><tspan x="132" dy="32">battery, lamp, connecting wires and switch. Show its ON and OFF states.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">21</text></g></svg></div></div></section>
