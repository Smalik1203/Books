<g class="v2-reading-block" data-block="path-explain-0" transform="translate(0 990)"><text class="se-copy" x="89" y="24"><tspan x="89">An <tspan class="se-bold">electrical</tspan> <tspan class="se-bold">circuit</tspan> includes a path through which current can flow. In</tspan><tspan x="89" dy="32">arrangements 1 and 6, the two lamp terminals connect to opposite cell terminals,</tspan></text></g>
<g class="v2-reading-block" data-block="path-explain-1" transform="translate(0 1054)"><text class="se-copy" x="89" y="24"><tspan x="89">making a complete path through the filament. Reversing the two connections</tspan><tspan x="89" dy="32">does not prevent a correctly rated incandescent lamp from glowing. In 2 and 3, a</tspan></text></g>
<g class="v2-reading-block" data-block="path-explain-2" transform="translate(0 1118)"><text class="se-copy" x="89" y="24"><tspan x="89">connection is missing. In 4 and 5, both lamp terminals go to the same cell</tspan><tspan x="89" dy="32">terminal, so the cell does not drive current through the lamp.</tspan></text></g>
<g class="v2-reading-block" data-block="current-0" transform="translate(0 1198)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Electric</tspan> <tspan class="se-bold">current</tspan> is the flow of electric charge. By convention, its direction in the</tspan><tspan x="89" dy="32">external circuit is from the cell’s positive terminal, through the components,</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
