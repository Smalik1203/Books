<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="switch-explain-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">switch</tspan> completes or breaks a conducting path; it is not the source of energy. In</tspan><tspan x="89" dy="32">the single-loop circuit here, opening the switch anywhere interrupts current</tspan></text></g>
<g class="v2-reading-block" data-block="switch-explain-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">everywhere in that loop. Household switches also control paths, but their</tspan><tspan x="89" dy="32">construction and installation must meet much greater safety demands. Never</tspan><tspan x="89" dy="32">open or test a mains switch.</tspan></text></g>
<g class="v2-reading-block" data-block="switch-local-0" transform="translate(0 288)"><text class="se-copy" x="89" y="24"><tspan x="89">When the switch opens, the wires and lamp have not vanished. Their material is</tspan><tspan x="89" dy="32">still conducting, but the air gap interrupts the route. Do not describe the open</tspan></text></g>
<g class="v2-reading-block" data-block="switch-local-1" transform="translate(0 352)"><text class="se-copy" x="89" y="24"><tspan x="89">switch as “using up” the current. Equally, a closed switch does not force a</tspan><tspan x="89" dy="32">defective lamp to work. Trace the whole loop and check the source before</tspan><tspan x="89" dy="32">deciding which part explains the observation.</tspan></text></g>
<g class="v2-reading-block" data-block="diagram-head" transform="translate(0 476)"><text class="v2-title" x="89" y="38"><tspan x="89">3.3 Reading Circuit Diagrams</tspan></text></g>
<g class="v2-reading-block" data-block="diagram-intro-0" transform="translate(0 534)"><text class="se-copy" x="89" y="24"><tspan x="89">A photograph shows what equipment looks like. A <tspan class="se-bold">circuit</tspan> <tspan class="se-bold">diagram</tspan> uses symbols</tspan><tspan x="89" dy="32">to show how it is connected. The drawing need not match the physical positions</tspan></text></g>
<g class="v2-reading-block" data-block="diagram-intro-1" transform="translate(0 598)"><text class="se-copy" x="89" y="24"><tspan x="89">of the parts. A long straight line can represent a bent wire; what matters is which</tspan><tspan x="89" dy="32">terminals it joins.</tspan></text></g>
<g class="v2-reading-block" data-block="trace-method-0" transform="translate(0 678)"><text class="se-copy" x="89" y="24"><tspan x="89">Start at a marked supply terminal and follow each line to the next component.</tspan><tspan x="89" dy="32">Continue through that component to the other supply terminal. If a line ends at</tspan></text></g>
<g class="v2-reading-block" data-block="trace-method-1" transform="translate(0 742)"><text class="se-copy" x="89" y="24"><tspan x="89">an open switch, your trace has reached a gap. If you return by a wire that</tspan><tspan x="89" dy="32">bypasses the lamp, you have found a different connection. Redrawing a wire with</tspan><tspan x="89" dy="32">an extra bend does not fix either problem.</tspan></text></g><g transform="translate(0 854)"><g data-page-illustration="figures/class-7/science/ch03/switch.png"><image class="science-illustration" href="../../figures/class-7/science/ch03/switch.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A switch.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A switch.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
