<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03 page--opener" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 1"><g class="chapter-opener" data-opener="science-g7-ch03"><defs><linearGradient id="science-g7-ch03-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop class="chapter-opener__gradient-start" offset="0%"/><stop class="chapter-opener__gradient-end" offset="100%"/></linearGradient></defs><path class="chapter-opener__band" fill="url(#science-g7-ch03-gradient)" d="M-17 -17H1069V300H-17Z"/><path class="chapter-opener__edge" d="M-17 296H1069V300H-17Z"/><g class="science-header-art" data-header-art="7-3" aria-hidden="true" transform="translate(886 26)"><g data-art-element="bulb" transform="translate(7 82) scale(1.12) rotate(-6 50 50)"><path class="science-header-art__soft" d="M30 65C30 54 14 50 14 30A35 35 0 0 1 84 30C84 50 68 54 68 65Z"/><path d="M32 68H66V85H32ZM36 88Q49 101 62 88M34 74H64M34 80H64M43 65L37 40L48 49L60 39L55 65M4 34H0M95 34H100"/></g><g data-art-element="cell" transform="translate(72 0) scale(0.62) rotate(8 50 50)"><path class="science-header-art__soft" d="M19 18H80V87H19Z"/><path class="science-header-art__surface" d="M35 9H64V18H35ZM19 18H80V33H19Z"/><path d="M40 48H60M50 38V58M41 75H59"/></g><g data-art-element="switch" transform="translate(64 184) scale(0.65) rotate(7 50 50)"><path class="science-header-art__soft" d="M7 60L62 45L93 62L38 80ZM7 60V76L38 95L93 77V62M38 80V95"/><circle cx="26" cy="59" r="4"/><circle cx="68" cy="57" r="4"/><path class="science-header-art__surface" d="M28 54L58 16L65 23L36 60Z"/></g></g><line class="chapter-opener__divider" x1="240" x2="240" y1="94" y2="252"/><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number se-running" x="151" y="242" text-anchor="middle">3</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">Electricity: Circuits</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">and their Components</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch03/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Students and their teacher exploring a battery torch</title></image></g><text class="se-copy v2-intro" x="89" y="981"><tspan x="89">A torch lights a dark corner. What must happen inside it before its lamp</tspan><tspan x="89" dy="34">can glow?</tspan></text><text class="se-copy" x="89" y="1067"><tspan x="89">Nihal and his classmates are preparing for a visit to the Bhakra Nangal</tspan><tspan x="89" dy="32">hydroelectric project. Falling water drives turbines connected to generators.</tspan><tspan x="89" dy="32">Their assignment begins closer to home: find out how people use electricity.</tspan></text><text class="se-copy" x="89" y="1179"><tspan x="89">In this chapter, use small cells, lamps and wires to investigate a complete path.</tspan><tspan x="89" dy="32">Predict before connecting, record what happens, and use the evidence to explain</tspan><tspan x="89" dy="32">a torch, a switch and a simple circuit.</tspan></text><text class="se-copy" x="89" y="1291"><tspan x="89">Look at the equipment in the picture. Which parts could connect the cell to the</tspan><tspan x="89" dy="32">lamp? Sketch your first idea in your notebook and mark any connections you are</tspan><tspan x="89" dy="32">unsure about. Keep this sketch: later, compare it with a working circuit and</tspan><tspan x="89" dy="32">explain what you changed.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
