<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03 page--opener" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 1"><g class="chapter-opener" data-opener="science-g7-ch03"><defs><linearGradient id="science-g7-ch03-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop class="chapter-opener__gradient-start" offset="0%"/><stop class="chapter-opener__gradient-end" offset="100%"/></linearGradient></defs><path class="chapter-opener__band" fill="url(#science-g7-ch03-gradient)" d="M-17 -17H1069V300H-17Z"/><path class="chapter-opener__edge" d="M-17 296H1069V300H-17Z"/><g class="chapter-opener__motif v2-electric-motif" transform="translate(951 72) scale(1.1)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><line class="chapter-opener__divider" x1="240" x2="240" y1="94" y2="252"/><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number se-running" x="151" y="242" text-anchor="middle">3</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">Electricity: Circuits</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">and their Components</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch03/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Students and their teacher exploring a battery torch</title></image></g><text class="se-copy v2-intro" x="89" y="981"><tspan x="89">A torch lights a dark corner. What must happen inside it before its lamp</tspan><tspan x="89" dy="34">can glow?</tspan></text><text class="se-copy" x="89" y="1067"><tspan x="89">Nihal and his classmates are preparing for a visit to the Bhakra Nangal</tspan><tspan x="89" dy="32">hydroelectric project. Falling water drives turbines connected to generators.</tspan><tspan x="89" dy="32">Their assignment begins closer to home: find out how people use electricity.</tspan></text><text class="se-copy" x="89" y="1179"><tspan x="89">In this chapter, use small cells, lamps and wires to investigate a complete path.</tspan><tspan x="89" dy="32">Predict before connecting, record what happens, and use the evidence to explain</tspan><tspan x="89" dy="32">a torch, a switch and a simple circuit.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
