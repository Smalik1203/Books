<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="torch-explain-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">A working torch commonly lights in one switch position and stays dark in the</tspan><tspan x="89" dy="32">other. Inside are a source, a lamp and conducting connections. The switch</tspan></text></g>
<g class="v2-reading-block" data-block="torch-explain-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">changes a connection. To explain why that matters, we need to examine the parts</tspan><tspan x="89" dy="32">and then trace the complete path through them.</tspan></text></g>
<g class="v2-reading-block" data-block="torch-evidence-0" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">A sketch is a record of what you can see, not a reason to invent hidden parts.</tspan><tspan x="89" dy="32">Mark any connection you cannot inspect as uncertain. When you remove and</tspan></text></g>
<g class="v2-reading-block" data-block="torch-evidence-1" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89">replace cells, notice both the metal contacts and the direction of the cells. If a</tspan><tspan x="89" dy="32">torch begins working afterwards, that observation alone cannot tell you whether</tspan><tspan x="89" dy="32">you corrected the direction or improved a contact.</tspan></text></g>
<g class="v2-reading-block" data-block="torch-path-question-0" transform="translate(0 432)"><text class="se-copy" x="89" y="24"><tspan x="89">The switch can move while the lamp stays dark. This suggests two different</tspan><tspan x="89" dy="32">questions: did the switch change its own contact, and is the rest of the path</tspan></text></g>
<g class="v2-reading-block" data-block="torch-path-question-1" transform="translate(0 496)"><text class="se-copy" x="89" y="24"><tspan x="89">working? As you study the separate components, keep these questions in mind. A</tspan><tspan x="89" dy="32">working device depends on the parts cooperating, not simply on every part being</tspan><tspan x="89" dy="32">present.</tspan></text></g>
<g class="v2-reading-block" data-block="parts-head" transform="translate(0 620)"><text class="v2-title" x="89" y="38"><tspan x="89">3.2 A Simple Electrical Circuit</tspan></text></g>
<g class="v2-reading-block" data-block="cell-head" transform="translate(0 690)"><text class="se-heading" x="89" y="30"><tspan x="89">Cells and their terminals</tspan></text></g>
<g class="v2-reading-block" data-block="cell-task" transform="translate(0 738)"><rect class="se-activity-panel" x="89" y="0" width="874" height="338" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Inspect an undamaged cylindrical 1.5 V cell supplied by your teacher.</tspan><tspan x="146" dy="32">Find its + and − markings. Compare the two ends without joining them.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Sketch the cell and label the marked ends. Describe the raised metal cap</tspan><tspan x="146" dy="32">and the flatter metal end. Check your labels against the markings.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Look at an empty cell holder. Find its spring contacts and polarity marks.</tspan><tspan x="146" dy="32">Predict how the cell should fit; ask your teacher to check before inserting</tspan><tspan x="146" dy="32">it.</tspan></text></g><g transform="translate(0 1098)"><g data-page-illustration="figures/class-7/science/ch03/components.png"><image class="science-illustration" href="../../figures/class-7/science/ch03/components.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Components for a simple circuit.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Components for a simple circuit.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
