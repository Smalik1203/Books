<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="battery-explain-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">In a <tspan class="se-bold">series</tspan> arrangement, the positive terminal of one cell joins the negative</tspan><tspan x="89" dy="32">terminal of the next. With two matching 1.5 V cells correctly connected, their</tspan></text></g>
<g class="v2-reading-block" data-block="battery-explain-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">voltages add to about 3 V. Their metal links may be hidden inside a holder, even</tspan><tspan x="89" dy="32">when the cells sit side by side. Follow the connections, not the shape of the case.</tspan><tspan x="89" dy="32">In everyday use, “battery” can mean one cell or several cells connected together.</tspan></text></g>
<g class="v2-reading-block" data-block="series-predict-0" transform="translate(0 288)"><text class="se-copy" x="89" y="24"><tspan x="89">In the simple holder, swapping two matching working cells without changing</tspan><tspan x="89" dy="32">their directions should leave the arrangement equivalent. Reversing one is</tspan></text></g>
<g class="v2-reading-block" data-block="series-predict-1" transform="translate(0 352)"><text class="se-copy" x="89" y="24"><tspan x="89">different: their voltages oppose rather than add. A weak or absent light would be</tspan><tspan x="89" dy="32">consistent with that change, but it would not by itself exclude a poor contact.</tspan><tspan x="89" dy="32">Restore the original working arrangement to check the comparison.</tspan></text></g>
<g class="v2-reading-block" data-block="series-figure" transform="translate(0 464)"><g class="v2-circuit" data-diagram="cells"><path class="v2-circuit-wire" d="M210 90H310M390 90H550M630 90H770"/><path class="v2-circuit-wire" d="M310 90H343M355 90H390"/><path class="v2-circuit-wire" d="M343 69v42M355 80v20"/><path class="v2-circuit-wire" d="M550 90H583M595 90H630"/><path class="v2-circuit-wire" d="M583 69v42M595 80v20"/><circle class="v2-circuit-contact" cx="210" cy="90" r="4"/><circle class="v2-circuit-contact" cx="770" cy="90" r="4"/><text class="v2-circuit-label" x="210" y="58" text-anchor="middle">+</text><text class="v2-circuit-label" x="770" y="58" text-anchor="middle">−</text><text class="v2-circuit-label" x="490" y="160" text-anchor="middle">Positive joins negative between cells</text><text class="v2-circuit-label" x="490" y="203" text-anchor="middle">Two 1.5 V cells in series: about 3 V</text></g><text class="se-caption" x="89" y="260.88"><tspan x="89">Connections, not physical position, determine the series arrangement. The two free</tspan><tspan x="89" dy="27">terminals supply the circuit.</tspan></text></g>
<g class="v2-reading-block" data-block="battery-limit-0" transform="translate(0 780)"><text class="se-copy" x="89" y="24"><tspan x="89">More cells do not automatically make a device run longer. The arrangement</tspan><tspan x="89" dy="32">changes the supply, and the device must be designed for it. Too high a voltage can</tspan></text></g>
<g class="v2-reading-block" data-block="battery-limit-1" transform="translate(0 844)"><text class="se-copy" x="89" y="24"><tspan x="89">damage a lamp or LED. Use the specified number and type of cells; do not mix</tspan><tspan x="89" dy="32">old and new cells or try to recharge a non-rechargeable cell.</tspan></text></g>
<g class="v2-reading-block" data-block="holder-trace-0" transform="translate(0 924)"><text class="se-copy" x="89" y="24"><tspan x="89">A holder is more than a box that keeps cells tidy. Its springs and metal strips</tspan><tspan x="89" dy="32">make electrical connections. With the cells removed, follow a visible strip from</tspan></text></g><g transform="translate(0 988)"><g data-page-illustration="figures/class-7/science/ch03/components.png"><image class="science-illustration" href="../../figures/class-7/science/ch03/components.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Components for a simple circuit.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Components for a simple circuit.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
