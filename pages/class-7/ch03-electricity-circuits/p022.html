<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="22"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 22"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="550" rx="18"/><text class="se-copy" x="113" y="222" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Cell</tspan> — A source that supplies</tspan><tspan x="113" dy="32" data-narrow-prose="true">electrical energy through chemical</tspan><tspan x="113" dy="32" data-paragraph-end="true">changes.</tspan></text><text class="se-copy" x="113" y="338" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Terminal</tspan> — A connection point on a</tspan><tspan x="113" dy="32" data-paragraph-end="true">cell or component.</tspan></text><text class="se-copy" x="113" y="422" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Circuit</tspan> — An arrangement of</tspan><tspan x="113" dy="32" data-narrow-prose="true">components and connections that</tspan><tspan x="113" dy="32" data-paragraph-end="true">can provide a path for current.</tspan></text><text class="se-copy" x="113" y="538" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Current</tspan> — The flow of electric</tspan><tspan x="113" dy="32" data-paragraph-end="true">charge.</tspan></text><text class="se-copy" x="113" y="622" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Filament</tspan> — The fine wire heated to</tspan><tspan x="113" dy="32" data-paragraph-end="true">glowing in an incandescent lamp.</tspan></text><text class="se-copy" x="541" y="222" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">LED</tspan> — A light-emitting diode, used</tspan><tspan x="541" dy="32" data-narrow-prose="true">with correct polarity and current</tspan><tspan x="541" dy="32" data-paragraph-end="true">limiting.</tspan></text><text class="se-copy" x="541" y="338" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Switch</tspan> — A device that completes or</tspan><tspan x="541" dy="32" data-paragraph-end="true">breaks a conducting path.</tspan></text><text class="se-copy" x="541" y="422" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Resistor</tspan> — A component that resists</tspan><tspan x="541" dy="32" data-narrow-prose="true">current; here it limits current</tspan><tspan x="541" dy="32" data-paragraph-end="true">through an LED.</tspan></text><text class="se-copy" x="541" y="538" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Conductor</tspan> — A material that allows</tspan><tspan x="541" dy="32" data-paragraph-end="true">current to flow relatively easily.</tspan></text><text class="se-copy" x="541" y="622" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Insulator</tspan> — A material that strongly</tspan><tspan x="541" dy="32" data-narrow-prose="true">resists current under the conditions</tspan><tspan x="541" dy="32" data-paragraph-end="true">considered.</tspan></text><g transform="translate(0 724)"><g data-page-illustration="figures/class-7/science/ch01-v2/cutouts/circuit.png"><image class="science-illustration" href="../../figures/class-7/science/ch01-v2/cutouts/circuit.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Connections link the parts of a circuit.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Connections link the parts of a circuit.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">22</text></g></svg></div></div></section>
