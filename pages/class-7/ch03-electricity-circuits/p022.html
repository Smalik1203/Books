<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="22"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 22"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q6" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">6.</text><text class="se-copy" x="132" y="24"><tspan x="132">For the single loop below, state which lamps glow in each case: (a) S2 ON, S1</tspan><tspan x="132" dy="32">OFF; (b) S2 OFF, S1 ON; (c) both ON; (d) both OFF. Explain your answers.</tspan></text><g transform="translate(0 80)"><g class="v2-circuit" data-diagram="two-switches"><path class="v2-circuit-wire" d="M275 60H305M385 60H465M545 60H625M705 60H755V200H610M530 200H425M345 200H275V60"/><circle class="v2-circuit-wire" cx="345" cy="60" r="20"/><path class="v2-circuit-wire" d="M331 46l28 28M331 74l28 -28M305 60h20M365 60h20"/><path class="v2-circuit-wire" d="M465 60h18M527 60h18M487 60L523 38"/><circle class="v2-circuit-contact" cx="485" cy="60" r="4"/><circle class="v2-circuit-contact" cx="525" cy="60" r="4"/><circle class="v2-circuit-wire" cx="665" cy="60" r="20"/><path class="v2-circuit-wire" d="M651 46l28 28M651 74l28 -28M625 60h20M685 60h20"/><path class="v2-circuit-wire" d="M530 200H552M586 200H610"/><path class="v2-circuit-wire" d="M552 179v42M564 190v20"/><path class="v2-circuit-wire" d="M574 179v42M586 190v20"/><path class="v2-circuit-wire" d="M345 200h18M407 200h18M367 200L403 178"/><circle class="v2-circuit-contact" cx="365" cy="200" r="4"/><circle class="v2-circuit-contact" cx="405" cy="200" r="4"/><text class="v2-circuit-label" x="345" y="25" text-anchor="middle">L1</text><text class="v2-circuit-label" x="505" y="25" text-anchor="middle">S2</text><text class="v2-circuit-label" x="665" y="25" text-anchor="middle">L2</text><text class="v2-circuit-label" x="385" y="244" text-anchor="middle">S1</text></g></g><text class="se-caption" x="89" y="376.88"><tspan x="89">L1 and L2 are in series with both switches; there are no branches.</tspan></text></g>
<g class="v2-reading-block" data-block="q7" transform="translate(0 521)"><text class="se-copy" x="111" y="24" text-anchor="end">7.</text><text class="se-copy" x="132" y="24"><tspan x="132">Vidyut closes the switch in a cell–lamp loop but the lamp stays dark. List</tspan><tspan x="132" dy="32">possible causes. Design checks that change one thing at a time, using known</tspan><tspan x="132" dy="32">working components. Explain how you would avoid mistaking a contact fault</tspan><tspan x="132" dy="32">for a depleted cell.</tspan></text></g>
<g class="v2-reading-block" data-block="q8" transform="translate(0 679)"><text class="se-copy" x="111" y="24" text-anchor="end">8.</text><text class="se-copy" x="132" y="24"><tspan x="132">Which of the four circuits below will not produce light when its switch is</tspan><tspan x="132" dy="32">closed? The lamps are suitable for their cells. Each LED circuit has two series</tspan><tspan x="132" dy="32">cells and a suitable current-limiting resistor. Use polarity and the complete</tspan><tspan x="132" dy="32">path in your explanation.</tspan></text><g transform="translate(0 144)"><g class="v2-circuit" data-diagram="four-circuits"><g transform="translate(120 25)"><path class="v2-circuit-wire" d="M40 55H140M220 55H320V65M320 145V155H220M140 155H40V55"/><path class="v2-circuit-wire" d="M140 155H173M185 155H220"/><path class="v2-circuit-wire" d="M173 145v20M185 134v42"/><circle class="v2-circuit-wire" cx="180" cy="55" r="20"/><path class="v2-circuit-wire" d="M166 41l28 28M166 69l28 -28M140 55h20M200 55h20"/><g transform="translate(320 105) rotate(90)"><path class="v2-circuit-wire" d="M-40 0h18M22 0h18M-18 0L18 -22"/><circle class="v2-circuit-contact" cx="-20" cy="0" r="4"/><circle class="v2-circuit-contact" cx="20" cy="0" r="4"/></g></g><text class="v2-circuit-label" x="300" y="245" text-anchor="middle">A</text><g transform="translate(570 25)"><path class="v2-circuit-wire" d="M40 55H140M220 55H320V65M320 145V155H220M140 155H40V55"/><path class="v2-circuit-wire" d="M140 155H173M185 155H220"/><path class="v2-circuit-wire" d="M173 134v42M185 145v20"/><circle class="v2-circuit-wire" cx="180" cy="55" r="20"/><path class="v2-circuit-wire" d="M166 41l28 28M166 69l28 -28M140 55h20M200 55h20"/><g transform="translate(320 105) rotate(90)"><path class="v2-circuit-wire" d="M-40 0h18M22 0h18M-18 0L18 -22"/><circle class="v2-circuit-contact" cx="-20" cy="0" r="4"/><circle class="v2-circuit-contact" cx="20" cy="0" r="4"/></g></g><text class="v2-circuit-label" x="750" y="245" text-anchor="middle">B</text><g transform="translate(120 270)"><path class="v2-circuit-wire" d="M40 55H140M220 55H320V65M320 145V155H220M140 155H40V135"/><path class="v2-circuit-wire" d="M140 155H162M196 155H220"/><path class="v2-circuit-wire" d="M162 145v20M174 134v42"/><path class="v2-circuit-wire" d="M184 145v20M196 134v42"/><path class="v2-circuit-wire" d="M140 55h24M164 38l30 17l-30 17ZM194 36v38M194 55h26M179 29l15 -17m-9 2l9 -2l-1 9M197 29l15 -17m-9 2l9 -2l-1 9"/><g transform="translate(40 95) rotate(90)"><path class="v2-circuit-wire" d="M-40 0h15M-25 -11h50v22h-50ZM25 0h15"/></g><g transform="translate(320 105) rotate(90)"><path class="v2-circuit-wire" d="M-40 0h18M22 0h18M-18 0L18 -22"/><circle class="v2-circuit-contact" cx="-20" cy="0" r="4"/><circle class="v2-circuit-contact" cx="20" cy="0" r="4"/></g></g><text class="v2-circuit-label" x="300" y="490" text-anchor="middle">C</text><g transform="translate(570 270)"><path class="v2-circuit-wire" d="M40 55H140M220 55H320V65M320 145V155H220M140 155H40V135"/><path class="v2-circuit-wire" d="M140 155H162M196 155H220"/><path class="v2-circuit-wire" d="M162 134v42M174 145v20"/><path class="v2-circuit-wire" d="M184 134v42M196 145v20"/><path class="v2-circuit-wire" d="M140 55h24M164 38l30 17l-30 17ZM194 36v38M194 55h26M179 29l15 -17m-9 2l9 -2l-1 9M197 29l15 -17m-9 2l9 -2l-1 9"/><g transform="translate(40 95) rotate(90)"><path class="v2-circuit-wire" d="M-40 0h15M-25 -11h50v22h-50ZM25 0h15"/></g><g transform="translate(320 105) rotate(90)"><path class="v2-circuit-wire" d="M-40 0h18M22 0h18M-18 0L18 -22"/><circle class="v2-circuit-contact" cx="-20" cy="0" r="4"/><circle class="v2-circuit-contact" cx="20" cy="0" r="4"/></g></g><text class="v2-circuit-label" x="750" y="490" text-anchor="middle">D</text></g></g><text class="se-caption" x="89" y="684.88"><tspan x="89">The two outward arrows identify an LED. Battery polarity differs between the paired circuits.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1=
