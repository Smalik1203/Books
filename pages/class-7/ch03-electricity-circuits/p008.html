<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="led-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="370" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Observe an unconnected, new two-lead LED. Compare it with the</tspan><tspan x="146" dy="32">incandescent lamp. Can you see a filament? Are the leads the same</tspan><tspan x="146" dy="32">length?</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Sketch the dome and both leads. Look for a flat edge on the casing. Your</tspan><tspan x="146" dy="32">teacher checks the part’s information to confirm its terminal</tspan><tspan x="146" dy="32">identification.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Do not connect the LED directly to cells. It needs a suitable</tspan><tspan x="146" dy="32">current-limiting component as well as the correct connection direction.</tspan></text></g>
<g class="v2-reading-block" data-block="components-figure" transform="translate(0 504)"><image class="science-illustration" data-photo="components" href="../../figures/class-7/science/ch03/components.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Left to right: incandescent torch lamp, LED and resistor. These enlarged component views</tspan><tspan x="89" dy="27">are not to the same scale.</tspan></text></g>
<g class="v2-reading-block" data-block="led-meaning-0" transform="translate(0 866)"><text class="se-copy" x="89" y="24"><tspan x="89">An <tspan class="se-bold">LED</tspan>, or light-emitting diode, produces light without a heated filament. On</tspan><tspan x="89" dy="32">many new two-lead LEDs, the longer lead is the anode and the shorter lead is the</tspan></text></g>
<g class="v2-reading-block" data-block="led-meaning-1" transform="translate(0 930)"><text class="se-copy" x="89" y="24"><tspan x="89">cathode. The flat side commonly marks the cathode. Leads may have been cut,</tspan><tspan x="89" dy="32">and some packages are different, so check the component information. A torch</tspan><tspan x="89" dy="32">may contain several LEDs and additional electronics.</tspan></text></g>
<g class="v2-reading-block" data-block="led-identity-0" transform="translate(0 1042)"><text class="se-copy" x="89" y="24"><tspan x="89">Look closely at the two devices before connecting them. The metal supports</tspan><tspan x="89" dy="32">visible inside an LED package are not a glowing filament. A coloured plastic</tspan></text></g>
<g class="v2-reading-block" data-block="led-identity-1" transform="translate(0 1106)"><text class="se-copy" x="89" y="24"><tspan x="89">dome also does not mean that the LED is switched on. Record the unlit</tspan><tspan x="89" dy="32">appearance first, then compare it with an approved working circuit.</tspan></text></g>
<g class="v2-reading-block" data-block="led-identity-2" transform="translate(0 1170)"><text class="se-copy" x="89" y="24"><tspan x="89">Distinguishing the material’s colour from emitted light avoids a misleading</tspan><tspan x="89" dy="32">observation.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
