<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="symbol-explain-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">lamp. The LED symbol includes a diode and two small outward arrows for</tspan><tspan x="89" dy="32">emitted light; these arrows are not extra wires. Its bar marks the cathode side. A</tspan><tspan x="89" dy="32">resistor may be drawn as a rectangle; another convention uses a zigzag.</tspan></text></g>
<g class="v2-reading-block" data-block="standards-0" transform="translate(0 224)"><text class="se-copy" x="89" y="24"><tspan x="89">Shared symbol conventions help people communicate. Organisations including</tspan><tspan x="89" dy="32">IEC, ANSI and IEEE publish standards used in electrical work. Some drawings</tspan></text></g>
<g class="v2-reading-block" data-block="standards-1" transform="translate(0 288)"><text class="se-copy" x="89" y="24"><tspan x="89">use different accepted symbol styles, so read the key. A circuit diagram is a model</tspan><tspan x="89" dy="32">of the connections, not a picture of every detail inside a device.</tspan></text></g>
<g class="v2-reading-block" data-block="drawing-check-0" transform="translate(0 368)"><text class="se-copy" x="89" y="24"><tspan x="89">A diagram can be neat and still describe the wrong circuit. Check connections</tspan><tspan x="89" dy="32">before judging appearance. Every component shown should have its intended</tspan></text></g>
<g class="v2-reading-block" data-block="drawing-check-1" transform="translate(0 432)"><text class="se-copy" x="89" y="24"><tspan x="89">terminals connected, and the supply must not have a wire-only route between its</tspan><tspan x="89" dy="32">terminals. If two lines merely cross, do not assume a junction unless the drawing</tspan></text></g>
<g class="v2-reading-block" data-block="drawing-check-2" transform="translate(0 496)"><text class="se-copy" x="89" y="24"><tspan x="89">makes that connection clear. In our diagrams, separate routes are kept apart</tspan><tspan x="89" dy="32">wherever possible.</tspan></text></g>
<g class="v2-reading-block" data-block="draw-task" transform="translate(0 576)"><rect class="se-activity-panel" x="89" y="0" width="874" height="446" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Draw the circuit for your lamp, one cell and an open switch using the</tspan><tspan x="146" dy="32">symbol key. Show a complete wire route, with the deliberate gap only at</tspan><tspan x="146" dy="32">the switch.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Draw the forward LED circuit using two series cells, a resistor and an</tspan><tspan x="146" dy="32">LED. Mark the supply polarity.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Exchange drawings. Trace each route from one supply terminal to the</tspan><tspan x="146" dy="32">other through the components. Compare the drawing with the real setup</tspan><tspan x="146" dy="32">while it is disconnected.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">4.</text><text class="se-copy" x="146" y="384"><tspan x="146">Compare your drawings with the examples below. Different wire shapes</tspan><tspan x="146" dy="32">can describe the same connections.</tspan></text></g>
