<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="switch-before-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">You have made a movable connection. Before using it, predict which position will</tspan><tspan x="89" dy="32">allow a complete path. Inspect the metal contact: painted or plastic-coated clips</tspan><tspan x="89" dy="32">may fail to conduct at their surfaces, even though there is metal underneath.</tspan></text></g>
<g class="v2-reading-block" data-block="switch-test" transform="translate(0 224)"><rect class="se-activity-panel" x="89" y="0" width="874" height="446" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Join the switch, a correctly rated incandescent lamp and one cell in a</tspan><tspan x="146" dy="32">single loop. Start with the clip away from the second fastener. Observe</tspan><tspan x="146" dy="32">and record.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Touch the clip to the second fastener. Observe briefly, record and open</tspan><tspan x="146" dy="32">the switch again. Compare your observations with your prediction.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Disconnect the cell, move the switch to a different place in the same loop,</tspan><tspan x="146" dy="32">and reconnect. Does its position change whether opening it interrupts the</tspan><tspan x="146" dy="32">path?</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">4.</text><text class="se-copy" x="146" y="384"><tspan x="146">Disconnect after the test. If the lamp does not respond, check the metal</tspan><tspan x="146" dy="32">contacts before changing your explanation.</tspan></text></g>
<g class="v2-reading-block" data-block="switch-comparison" transform="translate(0 692)"><g data-comparison-table="switch-comparison"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Open and closed circuits</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="260.32" y="70.08"><tspan x="260.32">Open circuit</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="618.6600000000001" y="70.08"><tspan x="618.6600000000001">Closed circuit</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Contact</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="110.08"><tspan x="260.32">an air gap separates conducting</tspan><tspan x="260.32" dy="28">parts.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="110.08"><tspan x="618.6600000000001">the switch terminals are joined</tspan><tspan x="618.6600000000001" dy="28">by metal.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">Path</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="178.07999999999998"><tspan x="260.32">the single loop is broken.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="178.07999999999998"><tspan x="618.6600000000001">the loop is complete.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="190" y2="190"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="218.07999999999998"><tspan x="103">Observation</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="218.07999999999998"><tspan x="260.32">a working incandescent lamp</tspan><tspan x="260.32" dy="28">stays dark.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="218.07999999999998"><tspan x="618.6600000000001">a suitable working lamp can</tspan><tspan x="618.6600000000001" dy="28">glow if the source and other</tspan><tspan x="618.6600000000001" dy="28">connections work.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="286" y2="286"/><rect class="v2-table-frame" x="89" y="42" width="874" height="244"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="42" y2="286"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="42" y2="286"/></g></g><g transform="translate(0 994)"><g data-page-illustration="figures/class-7/science/ch03/switch.png"><image class="science-illustration" href="../../figures/class-7/science/ch03/switch.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A switch.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A switch.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">15</text></g></svg></div></div></section>
