<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="path-head" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Predict, connect and observe</tspan></text></g>
<g class="v2-reading-block" data-block="lamp-build" transform="translate(0 160)"><rect class="se-activity-panel" x="89" y="0" width="874" height="818" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Use one 1.5 V cell and an incandescent torch lamp rated for that supply. Ask</tspan><tspan x="113" dy="32">your teacher to prepare short bare metal ends on the insulated wires.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">1.</text><text class="se-copy" x="146" y="168"><tspan x="146">Fit the cell according to the holder markings. Connect a wire to each</tspan><tspan x="146" dy="32">holder terminal and to each of the lamp holder’s two separate terminals.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">2.</text><text class="se-copy" x="146" y="244"><tspan x="146">Before connecting, use the six arrangements on the next page to predict</tspan><tspan x="146" dy="32">whether the lamp will glow. Record arrangement number, prediction and</tspan><tspan x="146" dy="32">reason in your notebook.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">3.</text><text class="se-copy" x="146" y="352"><tspan x="146">With your teacher, test each arrangement briefly. Record the actual</tspan><tspan x="146" dy="32">observation separately, then disconnect. Never make a wire-only path</tspan><tspan x="146" dy="32">across the cell.</tspan></text><text class="se-activity-step" x="132" y="460" text-anchor="end">4.</text><text class="se-copy" x="146" y="460"><tspan x="146">Compare the arrangements that give light with those that do not. If a</tspan><tspan x="146" dy="32">result differs from your prediction, inspect the contacts and repeat it</tspan><tspan x="146" dy="32">safely.</tspan></text><image class="science-illustration" data-photo="lamp-kit" href="../../figures/class-7/science/ch03/lamp-kit.png" x="364.75" y="544" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="789.88"><tspan x="113">Prepare the cell holder, lamp holder and insulated leads before joining the circuit.</tspan></text></g>
<g class="v2-reading-block" data-block="arrangement-intro-0" transform="translate(0 1000)"><text class="se-copy" x="89" y="24"><tspan x="89">For these connection maps, P and N are the cell terminals; X and Y are the lamp</tspan><tspan x="89" dy="32">holder’s separate terminals. The paired lines represent the cell; the circle and</tspan></text></g>
<g class="v2-reading-block" data-block="arrangement-intro-1" transform="translate(0 1064)"><text class="se-copy" x="89" y="24"><tspan x="89">cross represent the lamp and its filament. Lines joining terminals represent</tspan><tspan x="89" dy="32">wires. A loose end stops short of a terminal. These maps describe connections</tspan><tspan x="89" dy="32">without showing a glowing result.</tspan></text></g>
<g class="v2-reading-block" data-block="record-prediction-0" transform="translate(0 1176)"><text class="se-copy" x="89" y="24"><tspan x="89">Keep your prediction even if the test disagrees with it. Beside the observation,</tspan><tspan x="89" dy="32">sketch the actual connection you tested. Did a loose wire move? Did it touch</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
