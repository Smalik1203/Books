<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="lamp-comparison" transform="translate(0 112)"><g data-comparison-table="lamp-comparison"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Incandescent lamps and LEDs</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="260.32" y="70.08"><tspan x="260.32">Incandescent lamp</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="618.6600000000001" y="70.08"><tspan x="618.6600000000001">LED</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Light source</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="110.08"><tspan x="260.32">a heated filament.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="110.08"><tspan x="618.6600000000001">a semiconductor, without a</tspan><tspan x="618.6600000000001" dy="28">filament.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">Connections</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="178.07999999999998"><tspan x="260.32">two separate terminals leading</tspan><tspan x="260.32" dy="28">to the filament.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="178.07999999999998"><tspan x="618.6600000000001">anode and cathode; check their</tspan><tspan x="618.6600000000001" dy="28">identification.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="218" y2="218"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="246.07999999999998"><tspan x="103">Polarity</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="246.07999999999998"><tspan x="260.32">normally lights with either cell</tspan><tspan x="260.32" dy="28">polarity when correctly rated.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="246.07999999999998"><tspan x="618.6600000000001">normally lights in the forward</tspan><tspan x="618.6600000000001" dy="28">direction, with current limited.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="286" y2="286"/><rect class="v2-table-frame" x="89" y="42" width="874" height="244"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="42" y2="286"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="42" y2="286"/></g></g>
<g class="v2-reading-block" data-block="choose-source-0" transform="translate(0 414)"><text class="se-copy" x="89" y="24"><tspan x="89">A torch lamp and an LED can both turn electrical energy into light, but they are</tspan><tspan x="89" dy="32">not interchangeable in every holder. Their connections and supply requirements</tspan></text></g>
<g class="v2-reading-block" data-block="choose-source-1" transform="translate(0 478)"><text class="se-copy" x="89" y="24"><tspan x="89">differ. Read the component rating with your teacher before substituting one for</tspan><tspan x="89" dy="32">another. A component that does not light on a particular supply may still work on</tspan><tspan x="89" dy="32">an appropriate supply; failure in one setup is not enough to call it broken.</tspan></text></g>
<g class="v2-reading-block" data-block="light-energy-0" transform="translate(0 590)"><text class="se-copy" x="89" y="24"><tspan x="89">Both devices transfer energy, but the visible light is only part of the story. An</tspan><tspan x="89" dy="32">incandescent filament must become very hot before it glows. A working LED</tspan></text></g>
<g class="v2-reading-block" data-block="light-energy-1" transform="translate(0 654)"><text class="se-copy" x="89" y="24"><tspan x="89">usually needs much less electrical energy for a similar amount of useful light,</tspan><tspan x="89" dy="32">though it can still become warm. This helps explain why modern torches often</tspan></text></g>
<g class="v2-reading-block" data-block="light-energy-2" transform="translate(0 718)"><text class="se-copy" x="89" y="24"><tspan x="89">use LEDs. It does not remove the need for suitable connections or current</tspan><tspan x="89" dy="32">limiting.</tspan></text></g>
<g class="v2-reading-block" data-block="component-choice-0" transform="translate(0 798)"><text class="se-copy" x="89" y="24"><tspan x="89">Choose the source and the light-producing component as a pair. In our first</tspan><tspan x="89" dy="32">circuit, one small cell powers a lamp selected for that voltage. In the later LED</tspan></text></g>
<g class="v2-reading-block" data-block="component-choice-1" transform="translate(0 862)"><text class="se-copy" x="89" y="24"><tspan x="89">circuit, two cells supply a red LED through a resistor. The second arrangement is</tspan><tspan x="89" dy="32">not a general instruction to connect more cells whenever a light is dim. Identify</tspan><tspan x="89" dy="32">the component and check its rating before deciding what change is justified.</tspan></text></g><g transform="translate(0 974)"><g data-page-illustration="figures/class-7/science/ch03/components.png"><image class="science-illustration" href="../../figures/class-7/science/ch03/components.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Components for a simple circuit.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Components for a simple circuit.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
