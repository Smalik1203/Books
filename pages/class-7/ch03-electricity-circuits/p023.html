<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="23"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 23"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q9" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">9.</text><text class="se-copy" x="132" y="24"><tspan x="132">The + and − marks on a teacher-approved low-voltage battery cannot be read.</tspan><tspan x="132" dy="32">Suggest how a known LED with current limiting could help identify them.</tspan><tspan x="132" dy="32">State what a failed test would leave uncertain. Do not test an unknown</tspan><tspan x="132" dy="32">battery pack.</tspan></text></g>
<g class="v2-reading-block" data-block="q10" transform="translate(0 270)"><text class="se-copy" x="111" y="24" text-anchor="end">10.</text><text class="se-copy" x="132" y="24"><tspan x="132">Six matching cells are marked A to F; some may be depleted. Design a test to</tspan><tspan x="132" dy="32">identify those able to light a suitable working lamp. List materials,</tspan><tspan x="132" dy="32">procedure, controls and what you would record. Explain why you should</tspan><tspan x="132" dy="32">retest a cell that initially gives no light.</tspan></text></g>
<g class="v2-reading-block" data-block="q11" transform="translate(0 428)"><text class="se-copy" x="111" y="24" text-anchor="end">11.</text><text class="se-copy" x="132" y="24"><tspan x="132">Tanya joins the negative terminals of two identical cells together and</tspan><tspan x="132" dy="32">connects an LED, with a resistor, between their two positive terminals as</tspan><tspan x="132" dy="32">below. Will this provide the series supply the LED needs? Redraw the</tspan><tspan x="132" dy="32">connections as a correctly oriented series circuit.</tspan></text><g transform="translate(0 144)"><g class="v2-circuit" data-diagram="opposed-cells"><path class="v2-circuit-wire" d="M270 60H410M490 60H570M650 60H680V95M270 200H410M490 200H680V175M270 60V200"/><path class="v2-circuit-wire" d="M410 60H443M455 60H490"/><path class="v2-circuit-wire" d="M443 50v20M455 39v42"/><path class="v2-circuit-wire" d="M410 200H443M455 200H490"/><path class="v2-circuit-wire" d="M443 190v20M455 179v42"/><path class="v2-circuit-wire" d="M570 60h15M585 49h50v22h-50ZM635 60h15"/><g transform="translate(680 135) rotate(90)"><path class="v2-circuit-wire" d="M-40 0h24M-16 -17l30 17l-30 17ZM14 -19v38M14 0h26M-1 -26l15 -17m-9 2l9 -2l-1 9M17 -26l15 -17m-9 2l9 -2l-1 9"/></g><text class="v2-circuit-label" x="410" y="34" text-anchor="middle">−</text><text class="v2-circuit-label" x="490" y="34" text-anchor="middle">+</text><text class="v2-circuit-label" x="410" y="240" text-anchor="middle">−</text><text class="v2-circuit-label" x="490" y="240" text-anchor="middle">+</text><text class="v2-circuit-label" x="450" y="285" text-anchor="middle">Identical cells</text></g></g><text class="se-caption" x="89" y="479.88"><tspan x="89">This is a connection puzzle, not an instruction to assemble the incorrect arrangement.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE
