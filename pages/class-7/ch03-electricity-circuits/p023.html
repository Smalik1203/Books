<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="23"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 23"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="safety-end-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">The human body can conduct electricity. Current through it can cause severe</tspan><tspan x="89" dy="32">injury or death. Never touch plugs or switches with wet hands, use electrical</tspan></text></g>
<g class="v2-reading-block" data-block="safety-end-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">equipment in wet areas, or handle damaged cords and plugs. Tell an adult about</tspan><tspan x="89" dy="32">damage and keep away. Classroom low-voltage observations do not make it safe</tspan><tspan x="89" dy="32">to investigate household supply.</tspan></text></g>
<g class="v2-reading-block" data-block="dc-ac-0" transform="translate(0 288)"><text class="se-copy" x="89" y="24"><tspan x="89">A cell supplies direct current (DC): in a simple working circuit its direction stays</tspan><tspan x="89" dy="32">the same. Household supply is alternating current (AC), whose direction reverses</tspan></text></g>
<g class="v2-reading-block" data-block="dc-ac-1" transform="translate(0 352)"><text class="se-copy" x="89" y="24"><tspan x="89">repeatedly. DC is not limited to small devices; electric vehicles also use large</tspan><tspan x="89" dy="32">battery packs. Safety depends on the source and conditions, not merely on the</tspan><tspan x="89" dy="32">labels AC and DC.</tspan></text></g>
<g class="v2-reading-block" data-block="society-head" transform="translate(0 476)"><text class="se-heading" x="89" y="30"><tspan x="89">Portable power and responsible use</tspan></text></g>
<g class="v2-reading-block" data-block="society-0" transform="translate(0 524)"><text class="se-copy" x="89" y="24"><tspan x="89">Cylindrical cells power many torches, clocks, remotes and toys. Button cells are</tspan><tspan x="89" dy="32">used in some watches and hearing aids; rechargeable packs serve phones,</tspan></text></g>
<g class="v2-reading-block" data-block="society-1" transform="translate(0 588)"><text class="se-copy" x="89" y="24"><tspan x="89">laptops and electric vehicles. Their sizes, arrangements and charging</tspan><tspan x="89" dy="32">requirements differ. Keep loose cells away from metal objects and small</tspan></text></g>
<g class="v2-reading-block" data-block="society-2" transform="translate(0 652)"><text class="se-copy" x="89" y="24"><tspan x="89">children. Never dismantle a cell or put it in a fire. Give used cells to an adult for</tspan><tspan x="89" dy="32">an approved collection route.</tspan></text></g><g transform="translate(0 732)"><g data-page-illustration="figures/class-7/science/ch03/switch.png"><image class="science-illustration" href="../../figures/class-7/science/ch03/switch.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A switch.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A switch.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">23</text></g></svg></div></div></section>
