<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="path-explain-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">An <tspan class="se-bold">electrical</tspan> <tspan class="se-bold">circuit</tspan> includes a path through which current can flow. In</tspan><tspan x="89" dy="32">arrangements 1 and 6, the two lamp terminals connect to opposite cell terminals,</tspan></text></g>
<g class="v2-reading-block" data-block="path-explain-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">making a complete path through the filament. Reversing the two connections</tspan><tspan x="89" dy="32">does not prevent a correctly rated incandescent lamp from glowing. In 2 and 3, a</tspan></text></g>
<g class="v2-reading-block" data-block="path-explain-2" transform="translate(0 240)"><text class="se-copy" x="89" y="24"><tspan x="89">connection is missing. In 4 and 5, both lamp terminals go to the same cell</tspan><tspan x="89" dy="32">terminal, so the cell does not drive current through the lamp.</tspan></text></g>
<g class="v2-reading-block" data-block="current-0" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Electric</tspan> <tspan class="se-bold">current</tspan> is the flow of electric charge. By convention, its direction in the</tspan><tspan x="89" dy="32">external circuit is from the cell’s positive terminal, through the components,</tspan></text></g>
<g class="v2-reading-block" data-block="current-1" transform="translate(0 384)"><text class="se-copy" x="89" y="24"><tspan x="89">towards its negative terminal. A complete loop, a working source and suitable</tspan><tspan x="89" dy="32">components are all needed. The cell transfers energy to the lamp; current is not a</tspan><tspan x="89" dy="32">substance that gets used up inside the filament.</tspan></text></g>
<g class="v2-reading-block" data-block="fault-think" transform="translate(0 496)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A lamp stays dark. One group concludes, “The cell is used up.” Another says,</tspan><tspan x="113" dy="32">“The wire touches the plastic instead of the metal.” What evidence would</tspan><tspan x="113" dy="32">distinguish these explanations?</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Plan a sequence that changes one thing at a time. Include a known working</tspan><tspan x="113" dy="32">lamp, a known working cell and a contact check. Explain why replacing a</tspan><tspan x="113" dy="32">cell could also improve a loose connection.</tspan></text></g>
<g class="v2-reading-block" data-block="fused-0" transform="translate(0 812)"><text class="se-copy" x="89" y="24"><tspan x="89">A lamp with a broken filament is often called fused. Its internal path is open even</tspan><tspan x="89" dy="32">when the outside wires look correct. A dark lamp can also mean a depleted cell,</tspan></text></g><g transform="translate(0 876)"><g data-page-illustration="figures/class-7/science/ch03/components.png"><image class="science-illustration" href="../../figures/class-7/science/ch03/components.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Components for a simple circuit.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Components for a simple circuit.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
