<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="holder-trace-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">one contact to another and compare that route with the series diagram. If a link</tspan><tspan x="89" dy="32">is hidden, consult the holder’s markings or your teacher instead of guessing. Do</tspan><tspan x="89" dy="32">not bend the springs or insert metal tools to reach concealed contacts.</tspan></text></g>
<g class="v2-reading-block" data-block="lamp-head" transform="translate(0 236)"><text class="se-heading" x="89" y="30"><tspan x="89">Two ways to produce light</tspan></text></g>
<g class="v2-reading-block" data-block="lamp-task" transform="translate(0 284)"><rect class="se-activity-panel" x="89" y="0" width="874" height="370" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Your teacher supplies a small incandescent torch lamp with an intact</tspan><tspan x="146" dy="32">glass bulb. Observe its inside with a magnifier. Sketch the fine wire and its</tspan><tspan x="146" dy="32">supports.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">In a working torch or correctly rated holder, watch which part gives light</tspan><tspan x="146" dy="32">during a brief test. Do not touch the lamp while it is on.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Disconnect the source and let the lamp cool. With help, inspect the metal</tspan><tspan x="146" dy="32">case, separate centre tip and insulating material between them. Never</tspan><tspan x="146" dy="32">break the glass.</tspan></text></g>
<g class="v2-reading-block" data-block="lamp-meaning-0" transform="translate(0 676)"><text class="se-copy" x="89" y="24"><tspan x="89">The thin wire is the <tspan class="se-bold">filament</tspan>. Current through it transfers energy that heats it</tspan><tspan x="89" dy="32">until it glows. Two support wires connect its ends to separate terminals: the</tspan></text></g>
<g class="v2-reading-block" data-block="lamp-meaning-1" transform="translate(0 740)"><text class="se-copy" x="89" y="24"><tspan x="89">metal case and the centre tip. Insulating material keeps those terminals apart. A</tspan><tspan x="89" dy="32">connection to the glass does not connect to the filament.</tspan></text></g>
<g class="v2-reading-block" data-block="filament-path-0" transform="translate(0 820)"><text class="se-copy" x="89" y="24"><tspan x="89">Follow the internal route: one terminal connects to a support wire, then to the</tspan><tspan x="89" dy="32">filament, then through the other support to the other terminal. The insulating</tspan></text></g>
<g class="v2-reading-block" data-block="filament-path-1" transform="translate(0 884)"><text class="se-copy" x="89" y="24"><tspan x="89">part at the base prevents a direct metal bridge between the terminals. Current</tspan><tspan x="89" dy="32">must pass through the filament for it to heat. This is why touching two wires to</tspan><tspan x="89" dy="32">the same terminal does not substitute for using both terminals.</tspan></text></g><g transform="translate(0 996)"><g data-page-illustration="figures/class-7/science/ch03/torch.png"><image class="science-illustration" href="../../figures/class-7/science/ch03/torch.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A battery torch.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A battery torch.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
