<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="holder-figure" transform="translate(0 112)"><image class="science-illustration" data-photo="cell-holder" href="../../figures/class-7/science/ch03/cell-holder.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">A two-cell holder and loose cells. Follow the holder’s polarity marks; never force a cell into</tspan><tspan x="89" dy="27">place.</tspan></text></g>
<g class="v2-reading-block" data-block="battery-head" transform="translate(0 486)"><text class="se-heading" x="89" y="30"><tspan x="89">Connecting cells together</tspan></text></g>
<g class="v2-reading-block" data-block="battery-task" transform="translate(0 534)"><rect class="se-activity-panel" x="89" y="0" width="874" height="414" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Use an approved two-cell torch with matching cells. With the switch off,</tspan><tspan x="146" dy="32">record the original arrangement, then confirm that it works.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Switch off and swap the positions of the two cells while keeping each cell’s</tspan><tspan x="146" dy="32">marked direction correct. Test briefly and record the result.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">For comparison, draw what would happen if one cell were reversed. Your</tspan><tspan x="146" dy="32">teacher may demonstrate this briefly in a suitable simple holder; do not</tspan><tspan x="146" dy="32">reverse cells in electronic devices.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352"><tspan x="146">Restore the correct arrangement. Compare position with direction: are</tspan><tspan x="146" dy="32">they the same thing?</tspan></text></g>
<g class="v2-reading-block" data-block="battery-explain-0" transform="translate(0 970)"><text class="se-copy" x="89" y="24"><tspan x="89">In a <tspan class="se-bold">series</tspan> arrangement, the positive terminal of one cell joins the negative</tspan><tspan x="89" dy="32">terminal of the next. With two matching 1.5 V cells correctly connected, their</tspan></text></g>
<g class="v2-reading-block" data-block="battery-explain-1" transform="translate(0 1034)"><text class="se-copy" x="89" y="24"><tspan x="89">voltages add to about 3 V. Their metal links may be hidden inside a holder, even</tspan><tspan x="89" dy="32">when the cells sit side by side. Follow the connections, not the shape of the case.</tspan><tspan x="89" dy="32">In everyday use, “battery” can mean one cell or several cells connected together.</tspan></text></g>
<g class="v2-reading-block" data-block="series-predict-0" transform="translate(0 1146)"><text class="se-copy" x="89" y="24"><tspan x="89">In the simple holder, swapping two matching working cells without changing</tspan><tspan x="89" dy="32">their directions should leave the arrangement equivalent. Reversing one is</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">5</text></g></svg></div></div></section>
