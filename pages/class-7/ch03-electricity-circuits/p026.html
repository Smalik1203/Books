<g class="v2-reading-block" data-block="assessment-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Use your notebook. Support each answer with evidence and explain any</tspan><tspan x="89" dy="32">uncertainty.</tspan></text></g>
<g class="v2-reading-block" data-block="q1" transform="translate(0 250)"><text class="se-copy" x="111" y="24" text-anchor="end">1.</text><text class="se-copy" x="132" y="24"><tspan x="132">Choose the incorrect statement and correct it: (a) A switch is the source of</tspan><tspan x="132" dy="32">electric current. (b) A switch completes or breaks a circuit. (c) A switch lets</tspan><tspan x="132" dy="32">us control when a device operates. (d) The open switch used here has an air</tspan><tspan x="132" dy="32">gap between its contacts.</tspan></text></g>
<g class="v2-reading-block" data-block="q2" transform="translate(0 408)"><text class="se-copy" x="111" y="24" text-anchor="end">2.</text><text class="se-copy" x="132" y="24"><tspan x="132">The working tester below has a gap between A and B. Suggest a material that</tspan><tspan x="132" dy="32">would not make its lamp glow when placed across the gap. Give a conducting</tspan><tspan x="132" dy="32">comparison and state one limitation of a no-glow result.</tspan></text><g transform="translate(0 112)"><g class="v2-circuit" data-diagram="tester"><g transform="translate(320 10)"><path class="v2-circuit-wire" d="M40 55H140M220 55H320V80M320 125V155H220M140 155H40V55"/><path class="v2-circuit-wire" d="M140 155H173M185 155H220"/><path class="v2-circuit-wire" d="M173 134v42M185 145v20"/><circle class="v2-circuit-wire" cx="180" cy="55" r="20"/><path class="v2-circuit-wire" d="M166 41l28 28M166 69l28 -28M140 55h20M200 55h20"/><circle class="v2-circuit-contact" cx="320" cy="80" r="4"/><circle class="v2-circuit-contact" cx="320" cy="125" r="4"/><text class="v2-circuit-label" x="342" y="85" text-anchor="start">A</text><text class="v2-circuit-label" x="342" y="131" text-anchor="start">B</text></g></g></g><text class="se-caption" x="89" y="350.88"><tspan x="89">The lamp remains in the loop while an object bridges A and B.</tspan></text></g><g transform="translate(0 791)"><g data-page-illustration="figures/class-7/science/ch03/switch.png"><image class="science-illustration" href="../../figures/class-7/science/ch03/switch.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A switch.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A switch.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z
