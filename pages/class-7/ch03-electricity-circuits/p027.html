ss="se-caption" x="89" y="320.88"><tspan x="89">Assume suitable lamps and a working battery.</tspan></text></g>
<g class="v2-reading-block" data-block="q4" transform="translate(0 465)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24"><tspan x="132">A student leaves the plastic insulation on the wire ends where they touch the</tspan><tspan x="132" dy="32">terminals. The cell and lamp work. Will the lamp glow? Explain what must</tspan><tspan x="132" dy="32">make contact.</tspan></text></g>
<g class="v2-reading-block" data-block="q5" transform="translate(0 591)"><text class="se-copy" x="111" y="24" text-anchor="end">5.</text><text class="se-copy" x="132" y="24"><tspan x="132">Draw a circuit diagram for a simple incandescent torch. Include the cell or</tspan><tspan x="132" dy="32">battery, lamp, connecting wires and switch. Show its ON and OFF states.</tspan></text></g>
<g class="v2-reading-block" data-block="q6" transform="translate(0 685)"><text class="se-copy" x="111" y="24" text-anchor="end">6.</text><text class="se-copy" x="132" y="24"><tspan x="132">For the single loop below, state which lamps glow in each case: (a) S2 ON, S1</tspan><tspan x="132" dy="32">OFF; (b) S2 OFF, S1 ON; (c) both ON; (d) both OFF. Explain your answers.</tspan></text><g transform="translate(0 80)"><g class="v2-circuit" data-diagram="two-switches"><path class="v2-circuit-wire" d="M275 60H305M385 60H465M545 60H625M705 60H755V200H610M530 200H425M345 200H275V60"/><circle class="v2-circuit-wire" cx="345" cy="60" r="20"/><path class="v2-circuit-wire" d="M331 46l28 28M331 74l28 -28M305 60h20M365 60h20"/><path class="v2-circuit-wire" d="M465 60h18M527 60h18M487 60L523 38"/><circle class="v2-circuit-contact" cx="485" cy="60" r="4"/><circle class="v2-circuit-contact" cx="525" cy="60" r="4"/><circle class="v2-circuit-wire" cx="665" cy="60" r="20"/><path class="v2-circuit-wire" d="M651 46l28 28M651 74l28 -28M625 60h20M685 60h20"/><path class="v2-circuit-wire" d="M530 200H552M586 200H610"/><path class="v2-circuit-wire" d="M552 179v42M564 190v20"/><path class="v2-circuit-wire" d="M574 179v42M586 190v20"/><path class="v2-circuit-wire" d="M345 200h18M407 200h18M367 200L403 178"/><circle class="v2-circuit-contact" cx="365" cy="200" r="4"/><circle class="v2-circuit-contact" cx="405" cy="200" r="4"/><text class="v2-circuit-label" x="345" y="25" text-anchor="middle">L1</text><text class="v2-circuit-label" x="505" y="25" text-anchor="middle">S2</text><text class="v2-circuit-label" x="665" y="25" text-anchor="middle">L2</text><text class="v2-circuit-label" x="385" y="244" text-anchor="middle">S1</text></g></g><text class="se-caption" x="89" y="376.88"><tspan x="89">L1 and L2 are in series with both switches; there are no branches.</tspan></text></g><g transform="translate(0 1094)"><g data-page-illustration="figures/class-7/science/ch03/components.png"><image class="science-
