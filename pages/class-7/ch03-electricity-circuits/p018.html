<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="conduct-think" transform="translate(0 112)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A painted metal key does not light the tester, but a bare metal spoon does.</tspan><tspan x="113" dy="32">One learner calls the key an insulator. What else could explain the</tspan><tspan x="113" dy="32">observation?</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Suggest a safe comparison using an already exposed metal part or an</tspan><tspan x="113" dy="32">unpainted key; do not scrape coatings yourself. Explain what repeating the</tspan><tspan x="113" dy="32">tester check before and after the comparison would establish.</tspan></text></g>
<g class="v2-reading-block" data-block="materials-use" transform="translate(0 428)"><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Conducting parts</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74"><tspan x="112">Purpose: carry current where the</tspan><tspan x="112" dy="32">circuit needs it.</tspan></text><text class="se-copy" x="89" y="148" text-anchor="start">•</text><text class="se-copy" x="112" y="148"><tspan x="112">Examples: metal cores of wires and</tspan><tspan x="112" dy="32">metal contacts in switches.</tspan></text><text class="se-copy" x="89" y="222" text-anchor="start">•</text><text class="se-copy" x="112" y="222"><tspan x="112">Choice: silver, copper and gold</tspan><tspan x="112" dy="32">conduct well; copper is usually the</tspan><tspan x="112" dy="32">less costly choice.</tspan></text><text class="v2-comparison-title" x="526" y="30"><tspan x="526">Insulating parts</tspan></text><text class="se-copy" x="526" y="74" text-anchor="start">•</text><text class="se-copy" x="549" y="74"><tspan x="549">Purpose: separate conducting parts</tspan><tspan x="549" dy="32">and help prevent accidental</tspan><tspan x="549" dy="32">contact.</tspan></text><text class="se-copy" x="526" y="180" text-anchor="start">•</text><text class="se-copy" x="549" y="180"><tspan x="549">Examples: plastic wire coverings</tspan><tspan x="549" dy="32">and ceramic supports.</tspan></text><text class="se-copy" x="526" y="254" text-anchor="start">•</text><text class="se-copy" x="549" y="254"><tspan x="549">Limit: damaged, wet or unsuitable</tspan><tspan x="549" dy="32">insulation may not protect you.</tspan></text></g>
<g class="v2-reading-block" data-block="safety-end-0" transform="translate(0 748)"><text class="se-copy" x="89" y="24"><tspan x="89">The human body can conduct electricity. Current through it can cause severe</tspan><tspan x="89" dy="32">injury or death. Never touch plugs or switches with wet hands, use electrical</tspan></text></g>
<g class="v2-reading-block" data-block="safety-end-1" transform="translate(0 812)"><text class="se-copy" x="89" y="24"><tspan x="89">equipment in wet areas, or handle damaged cords and plugs. Tell an adult about</tspan><tspan x="89" dy="32">damage and keep away. Classroom low-voltage observations do not make it safe</tspan><tspan x="89" dy="32">to investigate household supply.</tspan></text></g>
<g class="v2-reading-block" data-block="dc-ac-0" transform="translate(0 924)"><text class="se-copy" x="89" y="24"><tspan x="89">A cell supplies direct current (DC): in a simple working circuit its direction stays</tspan><tspan x="89" dy="32">the same. Household supply is alternating current (AC), whose direction reverses</tspan></text></g>
<g class="v2-reading-block" data-block="dc-ac-1" transform="translate(0 988)"><text class="se-copy" x="89" y="24"><tspan x="89">repeatedly. DC is not limited to small devices; electric vehicles also use large</tspan><tspan x="89" dy="32">battery packs. Safety depends on the source and conditions, not merely on the</tspan><tspan x="89" dy="32">labels AC and DC.</tspan></text></g>
<g class="v2-reading-block" data-block="society-head" transform="translate(0 1112)"><text class="se-heading" x="89" y="30"><tspan x="89">Portable power and responsible use</tspan></text></g>
<g class="v2-reading-block" data-block="society-0" transform="translate(0 1160)"><text class="se-copy" x="89" y="24"><tspan x="89">Cylindrical cells power many torches, clocks, remotes and toys. Button cells are</tspan><tspan x="89" dy="32">used in some watches and hearing aids; rechargeable packs serve phones,</tspan></text></g>
<g class="v2-reading-block" data-block="society-1" transform="translate(0 1224)"><text class="se-copy" x="89" y="24"><tspan x="89">laptops and electric vehicles. Their sizes, arrangements and charging</tspan><tspan x="89" dy="32">requirements differ. Keep loose cells away from metal objects and small</tspan></text></g>
<g class="v2-reading-block" data-block="society-2" transform="translate(0 1288)"><text class="se-copy" x="89" y="24"><tspan x="89">children. Never dismantle a cell or put it in a fire. Give used cells to an adult for</tspan><tspan x="89" dy="32">an approved collection route.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
