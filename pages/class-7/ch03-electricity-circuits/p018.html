<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="conduct-think" transform="translate(0 112)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A painted metal key does not light the tester, but a bare metal spoon does.</tspan><tspan x="113" dy="32">One learner calls the key an insulator. What else could explain the</tspan><tspan x="113" dy="32">observation?</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Suggest a safe comparison using an already exposed metal part or an</tspan><tspan x="113" dy="32">unpainted key; do not scrape coatings yourself. Explain what repeating the</tspan><tspan x="113" dy="32">tester check before and after the comparison would establish.</tspan></text></g>
<g class="v2-reading-block" data-block="materials-use" transform="translate(0 428)"><g data-comparison-table="materials-use"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Conducting and insulating parts</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="260.32" y="70.08"><tspan x="260.32">Conducting parts</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="618.6600000000001" y="70.08"><tspan x="618.6600000000001">Insulating parts</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Purpose</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="110.08"><tspan x="260.32">carry current where the circuit</tspan><tspan x="260.32" dy="28">needs it.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="110.08"><tspan x="618.6600000000001">separate conducting parts and</tspan><tspan x="618.6600000000001" dy="28">help prevent accidental contact.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">Examples</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="178.07999999999998"><tspan x="260.32">metal cores of wires and metal</tspan><tspan x="260.32" dy="28">contacts in switches.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="178.07999999999998"><tspan x="618.6600000000001">plastic wire coverings and</tspan><tspan x="618.6600000000001" dy="28">ceramic supports.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="218" y2="218"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="246.07999999999998"><tspan x="103">Choice or</tspan><tspan x="103" dy="28">limit</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="246.07999999999998"><tspan x="260.32">silver, copper and gold conduct</tspan><tspan x="260.32" dy="28">well; copper is usually the less</tspan><tspan x="260.32" dy="28">costly choice.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="246.07999999999998"><tspan x="618.6600000000001">damaged, wet or unsuitable</tspan><tspan x="618.6600000000001" dy="28">insulation may not protect you.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="314" y2="314"/><rect class="v2-table-frame" x="89" y="42" width="874" height="272"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="42" y2="314"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="42" y2="314"/></g></g>
<g class="v2-reading-block" data-block="safety-end-0" transform="translate(0 758)"><text class="se-copy" x="89" y="24"><tspan x="89">The human body can conduct electricity. Current through it can cause severe</tspan><tspan x="89" dy="32">injury or death. Never touch plugs or switches with wet hands, use electrical</tspan></text></g>
<g class="v2-reading-block" data-block="safety-end-1" transform="translate(0 822)"><text class="se-copy" x="89" y="24"><tspan x="89">equipment in wet areas, or handle damaged cords and plugs. Tell an adult about</tspan><tspan x="89" dy="32">damage and keep away. Classroom low-voltage observations do not make it safe</tspan><tspan x="89" dy="32">to investigate household supply.</tspan></text></g>
<g class="v2-reading-block" data-block="dc-ac-0" transform="translate(0 934)"><text class="se-copy" x="89" y="24"><tspan x="89">A cell supplies direct current (DC): in a simple working circuit its direction stays</tspan><tspan x="89" dy="32">the same. Household supply is alternating current (AC), whose direction reverses</tspan></text></g>
<g class="v2-reading-block" data-block="dc-ac-1" transform="translate(0 998)"><text class="se-copy" x="89" y="24"><tspan x="89">repeatedly. DC is not limited to small devices; electric vehicles also use large</tspan><tspan x="89" dy="32">battery packs. Safety depends on the source and conditions, not merely on the</tspan><tspan x="89" dy="32">labels AC and DC.</tspan></text></g>
<g class="v2-reading-block" data-block="society-head" transform="translate(0 1122)"><text class="se-heading" x="89" y="30"><tspan x="89">Portable power and responsible use</tspan></text></g>
<g class="v2-reading-block" data-block="society-0" transform="translate(0 1170)"><text class="se-copy" x="89" y="24"><tspan x="89">Cylindrical cells power many torches, clocks, remotes and toys. Button cells are</tspan><tspan x="89" dy="32">used in some watches and hearing aids; rechargeable packs serve phones,</tspan></text></g>
<g class="v2-reading-block" data-block="society-1" transform="translate(0 1234)"><text class="se-copy" x="89" y="24"><tspan x="89">laptops and electric vehicles. Their sizes, arrangements and charging</tspan><tspan x="89" dy="32">requirements differ. Keep loose cells away from metal objects and small</tspan></text></g>
<g class="v2-reading-block" data-block="society-2" transform="translate(0 1298)"><text class="se-copy" x="89" y="24"><tspan x="89">children. Never dismantle a cell or put it in a fire. Give used cells to an adult for</tspan><tspan x="89" dy="32">an approved collection route.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
