<g class="v2-reading-block" data-block="trace-think" transform="translate(0 461)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A wire looks much longer in one drawing than in another, but it still joins the</tspan><tspan x="113" dy="32">same two terminals. Has the circuit connection changed? Explain what you</tspan><tspan x="113" dy="32">would trace to decide.</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Now imagine a second gap hidden under a loose connector. Would closing</tspan><tspan x="113" dy="32">the switch alone make the lamp light? Explain why the switch position is not</tspan><tspan x="113" dy="32">enough evidence that the whole loop is complete.</tspan></text></g><g transform="translate(0 777)"><g data-page-illustration="figures/class-7/science/ch03/switch.png"><image class="science-illustration" href="../../figures/class-7/science/ch03/switch.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A switch.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A switch.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/>
