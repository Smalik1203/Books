<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="19"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 19"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="550" rx="18"/><text class="se-copy" x="113" y="222"><tspan x="113"><tspan class="se-bold">Cell</tspan> — A source that supplies</tspan><tspan x="113" dy="32">electrical energy through chemical</tspan><tspan x="113" dy="32">changes.</tspan></text><text class="se-copy" x="113" y="338"><tspan x="113"><tspan class="se-bold">Terminal</tspan> — A connection point on a</tspan><tspan x="113" dy="32">cell or component.</tspan></text><text class="se-copy" x="113" y="422"><tspan x="113"><tspan class="se-bold">Circuit</tspan> — An arrangement of</tspan><tspan x="113" dy="32">components and connections that</tspan><tspan x="113" dy="32">can provide a path for current.</tspan></text><text class="se-copy" x="113" y="538"><tspan x="113"><tspan class="se-bold">Current</tspan> — The flow of electric</tspan><tspan x="113" dy="32">charge.</tspan></text><text class="se-copy" x="113" y="622"><tspan x="113"><tspan class="se-bold">Filament</tspan> — The fine wire heated to</tspan><tspan x="113" dy="32">glowing in an incandescent lamp.</tspan></text><text class="se-copy" x="541" y="222"><tspan x="541"><tspan class="se-bold">LED</tspan> — A light-emitting diode, used</tspan><tspan x="541" dy="32">with correct polarity and current</tspan><tspan x="541" dy="32">limiting.</tspan></text><text class="se-copy" x="541" y="338"><tspan x="541"><tspan class="se-bold">Switch</tspan> — A device that completes or</tspan><tspan x="541" dy="32">breaks a conducting path.</tspan></text><text class="se-copy" x="541" y="422"><tspan x="541"><tspan class="se-bold">Resistor</tspan> — A component that resists</tspan><tspan x="541" dy="32">current; here it limits current</tspan><tspan x="541" dy="32">through an LED.</tspan></text><text class="se-copy" x="541" y="538"><tspan x="541"><tspan class="se-bold">Conductor</tspan> — A material that allows</tspan><tspan x="541" dy="32">current to flow relatively easily.</tspan></text><text class="se-copy" x="541" y="622"><tspan x="541"><tspan class="se-bold">Insulator</tspan> — A material that strongly</tspan><tspan x="541" dy="32">resists current under the conditions</tspan><tspan x="541" dy="32">considered.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">19</text></g></svg></div></div></section>
