<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="safe-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">phone battery packs. Keep hands and the work area dry. Do not use leaking,</tspan><tspan x="89" dy="32">swollen or damaged cells. Never join a cell’s two terminals directly with wire: a</tspan></text></g>
<g class="v2-reading-block" data-block="safe-2" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">short circuit can make the cell and wire hot. Disconnect every circuit after a brief</tspan><tspan x="89" dy="32">test.</tspan></text></g>
<g class="v2-reading-block" data-block="safe-comparison-0" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">The small cell in a torch lets us study connections without approaching the</tspan><tspan x="89" dy="32">power network. Even then, a conducting object across its terminals can create a</tspan></text></g>
<g class="v2-reading-block" data-block="safe-comparison-1" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89">path that bypasses the lamp. That is different from an open circuit: an open path</tspan><tspan x="89" dy="32">interrupts current, while a short path can allow too much. Keep spare wires and</tspan><tspan x="89" dy="32">metal objects away from cell terminals.</tspan></text></g>
<g class="v2-reading-block" data-block="torch-head" transform="translate(0 444)"><text class="v2-title" x="89" y="38"><tspan x="89">3.1 Inside a Torch</tspan></text></g>
<g class="v2-reading-block" data-block="torch-task" transform="translate(0 502)"><rect class="se-activity-panel" x="89" y="0" width="874" height="737" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Take a small battery torch approved by your teacher. Locate its lamp and</tspan><tspan x="146" dy="32">switch. Predict what moving the switch will do.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Move the switch to each position and record what the lamp does. If it</tspan><tspan x="146" dy="32">does not light, record that too; do not assume the switch is the only</tspan><tspan x="146" dy="32">possible cause.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Switch it off. With your teacher, open only its removable cell</tspan><tspan x="146" dy="32">compartment. Note the number, direction and markings of the cells</tspan><tspan x="146" dy="32">before removing them.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">4.</text><text class="se-copy" x="146" y="384"><tspan x="146">Draw the parts you can identify in your notebook. Do not force open a</tspan><tspan x="146" dy="32">sealed or rechargeable torch.</tspan></text><image class="science-illustration" data-photo="torch" href="../../figures/class-7/science/ch03/torch.png" x="364.75" y="436" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="681.88"><tspan x="113">A battery torch, removable cap and cells. Inspect only the compartment intended to be</tspan><tspan x="113" dy="27">opened.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
