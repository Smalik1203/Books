<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="diagram-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">3.3 Reading Circuit Diagrams</tspan></text></g>
<g class="v2-reading-block" data-block="diagram-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">A photograph shows what equipment looks like. A <tspan class="se-bold">circuit</tspan> <tspan class="se-bold">diagram</tspan> uses symbols</tspan><tspan x="89" dy="32">to show how it is connected. The drawing need not match the physical positions</tspan></text></g>
<g class="v2-reading-block" data-block="diagram-intro-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">of the parts. A long straight line can represent a bent wire; what matters is which</tspan><tspan x="89" dy="32">terminals it joins.</tspan></text></g>
<g class="v2-reading-block" data-block="trace-method-0" transform="translate(0 314)"><text class="se-copy" x="89" y="24"><tspan x="89">Start at a marked supply terminal and follow each line to the next component.</tspan><tspan x="89" dy="32">Continue through that component to the other supply terminal. If a line ends at</tspan></text></g>
<g class="v2-reading-block" data-block="trace-method-1" transform="translate(0 378)"><text class="se-copy" x="89" y="24"><tspan x="89">an open switch, your trace has reached a gap. If you return by a wire that</tspan><tspan x="89" dy="32">bypasses the lamp, you have found a different connection. Redrawing a wire with</tspan><tspan x="89" dy="32">an extra bend does not fix either problem.</tspan></text></g>
<g class="v2-reading-block" data-block="symbols" transform="translate(0 490)"><g class="v2-circuit" data-diagram="symbols"><rect class="se-table-head" x="89" y="0" width="874" height="54"/><g class="v2-circuit-heading"><text class="v2-circuit-label" x="113" y="34" text-anchor="start">Component</text><text class="v2-circuit-label" x="700" y="34" text-anchor="middle">Symbol</text></g><text class="v2-circuit-label" x="113" y="99" text-anchor="start">Cell</text><path class="v2-circuit-wire" d="M660 93H693M705 93H740"/><path class="v2-circuit-wire" d="M693 72v42M705 83v20"/><line class="v2-table-rule" x1="89" x2="963" y1="132" y2="132"/><text class="v2-circuit-label" x="113" y="177" text-anchor="start">Battery (two cells)</text><path class="v2-circuit-wire" d="M660 171H682M716 171H740"/><path class="v2-circuit-wire" d="M682 150v42M694 161v20"/><path class="v2-circuit-wire" d="M704 150v42M716 161v20"/><line class="v2-table-rule" x1="89" x2="963" y1="210" y2="210"/><text class="v2-circuit-label" x="113" y="255" text-anchor="start">Incandescent lamp</text><circle class="v2-circuit-wire" cx="700" cy="249" r="20"/><path class="v2-circuit-wire" d="M686 235l28 28M686 263l28 -28M660 249h20M720 249h20"/><line class="v2-table-rule" x1="89" x2="963" y1="288" y2="288"/><text class="v2-circuit-label" x="113" y="333" text-anchor="start">LED</text><path class="v2-circuit-wire" d="M660 335h24M684 318l30 17l-30 17ZM714 316v38M714 335h26M699 309l15 -17m-9 2l9 -2l-1 9M717 309l15 -17m-9 2l9 -2l-1 9"/><line class="v2-table-rule" x1="89" x2="963" y1="366" y2="366"/><text class="v2-circuit-label" x="113" y="411" text-anchor="start">Closed switch</text><path class="v2-circuit-wire" d="M660 405h18M722 405h18M682 405L718 405"/><circle class="v2-circuit-contact" cx="680" cy="405" r="4"/><circle class="v2-circuit-contact" cx="720" cy="405" r="4"/><line class="v2-table-rule" x1="89" x2="963" y1="444" y2="444"/><text class="v2-circuit-label" x="113" y="489" text-anchor="start">Open switch</text><path class="v2-circuit-wire" d="M660 483h18M722 483h18M682 483L718 461"/><circle class="v2-circuit-contact" cx="680" cy="483" r="4"/><circle class="v2-circuit-contact" cx="720" cy="483" r="4"/><line class="v2-table-rule" x1="89" x2="963" y1="522" y2="522"/><text class="v2-circuit-label" x="113" y="567" text-anchor="start">Wire</text><path class="v2-circuit-wire" d="M660 561h80"/><line class="v2-table-rule" x1="89" x2="963" y1="600" y2="600"/><text class="v2-circuit-label" x="113" y="645" text-anchor="start">Resistor</text><path class="v2-circuit-wire" d="M660 639h15M675 628h50v22h-50ZM725 639h15"/><line class="v2-table-rule" x1="89" x2="963" y1="678" y2="678"/><rect class="v2-table-frame" x="89" y="0" width="874" height="678"/><line class="v2-table-rule" x1="580" x2="580" y1="0" y2="678"/></g><text class="se-caption" x="89" y="720.88"><tspan x="89">Read across from component name to symbol. The added resistor symbol supports our</tspan><tspan x="89" dy="27">current-limited LED circuit.</tspan></text></g>
<g class="v2-reading-block" data-block="symbol-explain-0" transform="translate(0 1266)"><text class="se-copy" x="89" y="24"><tspan x="89">In the cell symbol, the longer line is positive and the shorter line negative.</tspan><tspan x="89" dy="32">Repeated pairs represent a battery of cells. The circle with a cross represents a</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
