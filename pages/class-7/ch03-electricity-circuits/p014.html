<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="led-circuit" transform="translate(0 112)"><g class="v2-circuit" data-diagram="led"><g transform="translate(340 12)"><path class="v2-circuit-wire" d="M40 55H140M220 55H320V155H220M140 155H40V135"/><path class="v2-circuit-wire" d="M140 155H162M196 155H220"/><path class="v2-circuit-wire" d="M162 134v42M174 145v20"/><path class="v2-circuit-wire" d="M184 134v42M196 145v20"/><path class="v2-circuit-wire" d="M140 55h24M164 38l30 17l-30 17ZM194 36v38M194 55h26M179 29l15 -17m-9 2l9 -2l-1 9M197 29l15 -17m-9 2l9 -2l-1 9"/><g transform="translate(40 95) rotate(90)"><path class="v2-circuit-wire" d="M-40 0h15M-25 -11h50v22h-50ZM25 0h15"/></g></g><text class="v2-circuit-label" x="316" y="112" text-anchor="end">Resistor</text><text class="v2-circuit-label" x="480" y="34" text-anchor="end">Anode</text><text class="v2-circuit-label" x="560" y="34" text-anchor="start">Cathode</text><text class="v2-circuit-label" x="478" y="207" text-anchor="middle">+</text><text class="v2-circuit-label" x="558" y="207" text-anchor="middle">−</text><text class="v2-circuit-label" x="518" y="240" text-anchor="middle">Two-cell supply</text></g><text class="se-caption" x="89" y="295.88"><tspan x="89">Forward connection: the resistor is in the same loop as the LED. Disconnect before changing</tspan><tspan x="89" dy="27">any component.</tspan></text></g>
<g class="v2-reading-block" data-block="led-explain-0" transform="translate(0 463)"><text class="se-copy" x="89" y="24"><tspan x="89">An LED normally conducts readily in its forward direction and emits light when</tspan><tspan x="89" dy="32">enough current flows. Reversing it usually prevents light at this small supply</tspan></text></g>
<g class="v2-reading-block" data-block="led-explain-1" transform="translate(0 527)"><text class="se-copy" x="89" y="24"><tspan x="89">voltage, but excessive reverse voltage can damage it. The <tspan class="se-bold">resistor</tspan> limits current</tspan><tspan x="89" dy="32">and protects the LED. It may be on either side of the LED in this single loop.</tspan><tspan x="89" dy="32">Correct polarity alone does not make a direct connection to a battery safe.</tspan></text></g>
<g class="v2-reading-block" data-block="switch-head" transform="translate(0 651)"><text class="se-heading" x="89" y="30"><tspan x="89">A switch controls the path</tspan></text></g>
<g class="v2-reading-block" data-block="switch-build" transform="translate(0 699)"><rect class="se-activity-panel" x="89" y="0" width="874" height="602" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Collect thick cardboard, two brass split-pin fasteners, a bare metal paper</tspan><tspan x="146" dy="32">clip and two insulated wires. Your teacher makes the holes and secures</tspan><tspan x="146" dy="32">the fasteners, covering any sharp ends underneath.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Trap one end of the clip under the first fastener so it can pivot. Place the</tspan><tspan x="146" dy="32">second fastener where the clip can touch it when turned.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Attach one wire to each fastener. Check that the clip moves freely and can</tspan><tspan x="146" dy="32">leave a visible gap. Build without a cell connected.</tspan></text><image class="science-illustration" data-photo="switch" href="../../figures/class-7/science/ch03/switch.png" x="364.75" y="328" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="573.88"><tspan x="113">A paper-clip switch with an open gap. The cardboard is its insulating base.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
