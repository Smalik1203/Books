<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="24"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 24"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="2.75760" data-space-ratio="1.493">A<tspan dx="2.75760"> cell</tspan><tspan dx="2.75760"> has</tspan><tspan dx="2.75760"> positive</tspan><tspan dx="2.75760"> and</tspan><tspan dx="2.75760"> negative</tspan><tspan dx="2.75760"> terminals</tspan><tspan dx="2.75760"> and</tspan><tspan dx="2.75760"> supplies</tspan><tspan dx="2.75760"> electrical</tspan><tspan dx="2.75760"> energy.</tspan><tspan dx="2.75760"> In</tspan><tspan dx="2.75760"> a</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">series battery, positive joins negative between neighbouring cells.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="5.67909" data-space-ratio="2.016">An<tspan dx="5.67909"> incandescent</tspan><tspan dx="5.67909"> lamp</tspan><tspan dx="5.67909"> has</tspan><tspan dx="5.67909"> a</tspan><tspan dx="5.67909"> filament</tspan><tspan dx="5.67909"> connected</tspan><tspan dx="5.67909"> to</tspan><tspan dx="5.67909"> two</tspan><tspan dx="5.67909"> separate</tspan><tspan dx="5.67909"> terminals.</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">Heating of the filament produces light.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="7.77582" data-space-ratio="2.391">An<tspan dx="7.77582"> LED</tspan><tspan dx="7.77582"> has</tspan><tspan dx="7.77582"> no</tspan><tspan dx="7.77582"> filament.</tspan><tspan dx="7.77582"> It</tspan><tspan dx="7.77582"> normally</tspan><tspan dx="7.77582"> emits</tspan><tspan dx="7.77582"> light</tspan><tspan dx="7.77582"> with</tspan><tspan dx="7.77582"> a</tspan><tspan dx="7.77582"> suitable</tspan><tspan dx="7.77582"> forward</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">connection and requires current limiting.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="0.65470" data-space-ratio="1.117">A<tspan dx="0.65470"> complete</tspan><tspan dx="0.65470"> path,</tspan><tspan dx="0.65470"> a</tspan><tspan dx="0.65470"> working</tspan><tspan dx="0.65470"> source,</tspan><tspan dx="0.65470"> good</tspan><tspan dx="0.65470"> contacts</tspan><tspan dx="0.65470"> and</tspan><tspan dx="0.65470"> suitable</tspan><tspan dx="0.65470"> components</tspan><tspan dx="0.65470"> are</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">needed for a lamp to glow.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="5.95522" data-space-ratio="2.065">Conventional<tspan dx="5.95522"> current</tspan><tspan dx="5.95522"> in</tspan><tspan dx="5.95522"> the</tspan><tspan dx="5.95522"> external</tspan><tspan dx="5.95522"> circuit</tspan><tspan dx="5.95522"> is</tspan><tspan dx="5.95522"> taken</tspan><tspan dx="5.95522"> from</tspan><tspan dx="5.95522"> positive</tspan><tspan dx="5.95522"> towards</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">negative. Energy is transferred; current is not used up in a lamp.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="0.81064" data-space-ratio="1.145">A<tspan dx="0.81064"> switch</tspan><tspan dx="0.81064"> controls</tspan><tspan dx="0.81064"> a</tspan><tspan dx="0.81064"> path.</tspan><tspan dx="0.81064"> Opening</tspan><tspan dx="0.81064"> it</tspan><tspan dx="0.81064"> anywhere</tspan><tspan dx="0.81064"> in</tspan><tspan dx="0.81064"> a</tspan><tspan dx="0.81064"> single</tspan><tspan dx="0.81064"> series</tspan><tspan dx="0.81064"> loop</tspan><tspan dx="0.81064"> interrupts</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">current in the whole loop.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="13.63669" data-space-ratio="3.439">Circuit<tspan dx="13.63669"> diagrams</tspan><tspan dx="13.63669"> show</tspan><tspan dx="13.63669"> connections</tspan><tspan dx="13.63669"> using</tspan><tspan dx="13.63669"> shared</tspan><tspan dx="13.63669"> symbols.</tspan><tspan dx="13.63669"> The</tspan><tspan dx="13.63669"> longer</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">cell-symbol line represents the positive terminal.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.17615" data-space-ratio="1.210">Conductors<tspan dx="1.17615"> and</tspan><tspan dx="1.17615"> insulators</tspan><tspan dx="1.17615"> serve</tspan><tspan dx="1.17615"> different</tspan><tspan dx="1.17615"> purposes.</tspan><tspan dx="1.17615"> A</tspan><tspan dx="1.17615"> no-glow</tspan><tspan dx="1.17615"> result</tspan><tspan dx="1.17615"> is</tspan><tspan dx="1.17615"> limited</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">by the tester’s sensitivity and the quality of contact.</tspan></text><text class="se-copy" x="89" y="796" text-anchor="start">•</text><text class="se-copy" x="112" y="796" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="3.52948" data-space-ratio="1.631">Predict<tspan dx="3.52948"> before</tspan><tspan dx="3.52948"> testing,</tspan><tspan dx="3.52948"> record</tspan><tspan dx="3.52948"> actual</tspan><tspan dx="3.52948"> observations,</tspan><tspan dx="3.52948"> use</tspan><tspan dx="3.52948"> a</tspan><tspan dx="3.52948"> working</tspan><tspan dx="3.52948"> control</tspan><tspan dx="3.52948"> and</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">investigate one possible fault at a time.</tspan></text><text class="se-copy" x="89" y="870" text-anchor="start">•</text><text class="se-copy" x="112" y="870" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="3.25915" data-space-ratio="1.583">Use<tspan dx="3.25915"> only</tspan><tspan dx="3.25915"> approved</tspan><tspan dx="3.25915"> small</tspan><tspan dx="3.25915"> cells</tspan><tspan dx="3.25915"> in</tspan><tspan dx="3.25915"> these</tspan><tspan dx="3.25915"> activities.</tspan><tspan dx="3.25915"> Never</tspan><tspan dx="3.25915"> test</tspan><tspan dx="3.25915"> mains</tspan><tspan dx="3.25915"> electricity,</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">people or damaged equipment; disconnect after testing.</tspan></text><g transform="translate(0 920)"><g data-page-illustration="figures/class-7/science/ch04/foil-wire.png"><image class="science-illustration" href="../../figures/class-7/science/ch04/foil-wire.png" x="214.75" y="10" width="622.5" height="415" preserveAspectRatio="xMidYMid meet"><title>Metals have uses in electrical connections.</title></image><text class="se-caption" x="526" y="463" text-anchor="middle"><tspan x="526">Metals have uses in electrical connections.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">24</text></g></svg></div></div></section>
