<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="24" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 24"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Explore Further</tspan></text></g>
<g class="v2-reading-block" data-block="power-cut-head" transform="translate(0 182)"><text class="se-heading" x="89" y="30"><tspan x="89">Two days without mains electricity</tspan></text></g>
<g class="v2-reading-block" data-block="power-cut-0" transform="translate(0 230)"><text class="se-copy" x="89" y="24"><tspan x="89">Plan for a two-day power cut: consider light, water, communication, food storage</tspan><tspan x="89" dy="32">and transport. Which activities could use stored energy or another method?</tspan><tspan x="89" dy="32">Discuss preparation with an adult; never test generators.</tspan></text></g>
<g class="v2-reading-block" data-block="solar-head" transform="translate(0 354)"><text class="se-heading" x="89" y="30"><tspan x="89">A small solar-powered fan</tspan></text></g>
<g class="v2-reading-block" data-block="solar-0" transform="translate(0 402)"><text class="se-copy" x="89" y="24"><tspan x="89">With your teacher, connect a small educational solar panel to a matching</tspan><tspan x="89" dy="32">low-voltage toy motor and soft propeller. Use the manufacturer’s instructions and</tspan></text></g>
<g class="v2-reading-block" data-block="solar-1" transform="translate(0 466)"><text class="se-copy" x="89" y="24"><tspan x="89">secure the motor. Keep fingers, hair and clothing away from moving blades.</tspan><tspan x="89" dy="32">Compare its behaviour in bright light and partial shade without changing the</tspan><tspan x="89" dy="32">connections. Record light conditions as well as motion.</tspan></text></g>
<g class="v2-reading-block" data-block="solar-figure" transform="translate(0 578)"><image class="science-illustration" data-photo="solar-kit" href="../../figures/class-7/science/ch03/solar-kit.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Prepare the matching panel and motor before connecting; use a stable mount and soft blades.</tspan></text></g>
<g class="v2-reading-block" data-block="shop-head" transform="translate(0 925)"><text class="se-heading" x="89" y="30"><tspan x="89">Investigate cells in use</tspan></text></g>
<g class="v2-reading-block" data-block="shop-0" transform="translate(0 973)"><text class="se-copy" x="89" y="24"><tspan x="89">With adult supervision, visit an electrical shop or study its catalogue. Record cell</tspan><tspan x="89" dy="32">shapes, stated voltages, whether they are rechargeable, and suitable devices.</tspan></text></g>
<g class="v2-reading-block" data-block="shop-1" transform="translate(0 1037)"><text class="se-copy" x="89" y="24"><tspan x="89">Compare the information with manufacturer instructions. Do not handle loose</tspan><tspan x="89" dy="32">button cells or buy and dismantle battery packs for this project.</tspan></text></g>
<g class="v2-reading-block" data-block="home-materials-head" transform="translate(0 1129)"><text class="se-heading" x="89" y="30"><tspan x="89">Both materials matter</tspan></text></g>
<g class="v2-reading-block" data-block="home-materials-0" transform="translate(0 1177)"><text class="se-copy" x="89" y="24"><tspan x="89">List safe household objects made mainly of conducting materials, mainly of</tspan><tspan x="89" dy="32">insulating materials, or of both. Identify the purpose of each part in the mixed</tspan></text></g>
<g class="v2-reading-block" data-block="home-materials-1" transform="translate(0 1241)"><text class="se-copy" x="89" y="24"><tspan x="89">group. Observe externally; do not open plugs or appliances. Explain why “made</tspan><tspan x="89" dy="32">of both” is often a useful design rather than a contradiction. A plastic handle and</tspan></text></g>
<g class="v2-reading-block" data-block="home-materials-2" transform="translate(0 1305)"><text class="se-copy" x="89" y="24"><tspan x="89">a metal working part can serve different purposes; identify each material before</tspan><tspan x="89" dy="32">deciding what the whole object tells you.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">24</text></g></svg></div></div></section>
