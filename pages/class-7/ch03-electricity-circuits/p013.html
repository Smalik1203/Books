<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="switch-before-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">You have made a movable connection. Before using it, predict which position will</tspan><tspan x="89" dy="32">allow a complete path. Inspect the metal contact: painted or plastic-coated clips</tspan><tspan x="89" dy="32">may fail to conduct at their surfaces, even though there is metal underneath.</tspan></text></g>
<g class="v2-reading-block" data-block="switch-test" transform="translate(0 224)"><rect class="se-activity-panel" x="89" y="0" width="874" height="446" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Join the switch, a correctly rated incandescent lamp and one cell in a</tspan><tspan x="146" dy="32">single loop. Start with the clip away from the second fastener. Observe</tspan><tspan x="146" dy="32">and record.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Touch the clip to the second fastener. Observe briefly, record and open</tspan><tspan x="146" dy="32">the switch again. Compare your observations with your prediction.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Disconnect the cell, move the switch to a different place in the same loop,</tspan><tspan x="146" dy="32">and reconnect. Does its position change whether opening it interrupts the</tspan><tspan x="146" dy="32">path?</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">4.</text><text class="se-copy" x="146" y="384"><tspan x="146">Disconnect after the test. If the lamp does not respond, check the metal</tspan><tspan x="146" dy="32">contacts before changing your explanation.</tspan></text></g>
<g class="v2-reading-block" data-block="switch-comparison" transform="translate(0 692)"><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Open circuit</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74"><tspan x="112">Contact: an air gap separates</tspan><tspan x="112" dy="32">conducting parts.</tspan></text><text class="se-copy" x="89" y="148" text-anchor="start">•</text><text class="se-copy" x="112" y="148"><tspan x="112">Path: the single loop is broken.</tspan></text><text class="se-copy" x="89" y="190" text-anchor="start">•</text><text class="se-copy" x="112" y="190"><tspan x="112">Observation: a working</tspan><tspan x="112" dy="32">incandescent lamp stays dark.</tspan></text><text class="v2-comparison-title" x="526" y="30"><tspan x="526">Closed circuit</tspan></text><text class="se-copy" x="526" y="74" text-anchor="start">•</text><text class="se-copy" x="549" y="74"><tspan x="549">Contact: the switch terminals are</tspan><tspan x="549" dy="32">joined by metal.</tspan></text><text class="se-copy" x="526" y="148" text-anchor="start">•</text><text class="se-copy" x="549" y="148"><tspan x="549">Path: the loop is complete.</tspan></text><text class="se-copy" x="526" y="190" text-anchor="start">•</text><text class="se-copy" x="549" y="190"><tspan x="549">Observation: a suitable working</tspan><tspan x="549" dy="32">lamp can glow if the source and</tspan><tspan x="549" dy="32">other connections work.</tspan></text></g>
<g class="v2-reading-block" data-block="switch-explain-0" transform="translate(0 980)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">switch</tspan> completes or breaks a conducting path; it is not the source of energy. In</tspan><tspan x="89" dy="32">the single-loop circuit here, opening the switch anywhere interrupts current</tspan></text></g>
<g class="v2-reading-block" data-block="switch-explain-1" transform="translate(0 1044)"><text class="se-copy" x="89" y="24"><tspan x="89">everywhere in that loop. Household switches also control paths, but their</tspan><tspan x="89" dy="32">construction and installation must meet much greater safety demands. Never</tspan><tspan x="89" dy="32">open or test a mains switch.</tspan></text></g>
<g class="v2-reading-block" data-block="switch-local-0" transform="translate(0 1156)"><text class="se-copy" x="89" y="24"><tspan x="89">When the switch opens, the wires and lamp have not vanished. Their material is</tspan><tspan x="89" dy="32">still conducting, but the air gap interrupts the route. Do not describe the open</tspan></text></g>
<g class="v2-reading-block" data-block="switch-local-1" transform="translate(0 1220)"><text class="se-copy" x="89" y="24"><tspan x="89">switch as “using up” the current. Equally, a closed switch does not force a</tspan><tspan x="89" dy="32">defective lamp to work. Trace the whole loop and check the source before</tspan><tspan x="89" dy="32">deciding which part explains the observation.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
