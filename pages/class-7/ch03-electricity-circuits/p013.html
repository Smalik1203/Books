<g class="v2-reading-block" data-block="led-build" transform="translate(0 160)"><rect class="se-activity-panel" x="89" y="0" width="874" height="586" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Activity 3.7"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Activity 3.7</text></g><text class="se-copy" x="113" y="92" data-prose-align="justify"><tspan x="113" data-justify-width="826" data-natural-space="5.59200" data-extra-space="0.57819" data-space-ratio="1.103">Your<tspan dx="0.57819"> teacher</tspan><tspan dx="0.57819"> supplies</tspan><tspan dx="0.57819"> a</tspan><tspan dx="0.57819"> red</tspan><tspan dx="0.57819"> LED</tspan><tspan dx="0.57819"> suitable</tspan><tspan dx="0.57819"> for</tspan><tspan dx="0.57819"> a</tspan><tspan dx="0.57819"> 3</tspan><tspan dx="0.57819"> V</tspan><tspan dx="0.57819"> circuit,</tspan><tspan dx="0.57819"> two</tspan><tspan dx="0.57819"> matching</tspan><tspan dx="0.57819"> 1.5</tspan><tspan dx="0.57819"> V</tspan></tspan><tspan x="113" dy="32" data-justify-width="826" data-natural-space="5.59200" data-extra-space="4.79565" data-space-ratio="1.858">cells<tspan dx="4.79565"> in</tspan><tspan dx="4.79565"> a</tspan><tspan dx="4.79565"> series</tspan><tspan dx="4.79565"> holder,</tspan><tspan dx="4.79565"> a</tspan><tspan dx="4.79565"> 330</tspan><tspan dx="4.79565"> Ω</tspan><tspan dx="4.79565"> resistor</tspan><tspan dx="4.79565"> and</tspan><tspan dx="4.79565"> insulated</tspan><tspan dx="4.79565"> leads.</tspan><tspan dx="4.79565"> The</tspan><tspan dx="4.79565"> teacher</tspan></tspan><tspan x="113" dy="32" data-paragraph-end="true">checks the LED ratings first.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">1.</text><text class="se-copy" x="146" y="200" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="1.81650" data-space-ratio="1.325">Keep<tspan dx="1.81650"> the</tspan><tspan dx="1.81650"> cells</tspan><tspan dx="1.81650"> disconnected</tspan><tspan dx="1.81650"> while</tspan><tspan dx="1.81650"> building.</tspan><tspan dx="1.81650"> Connect</tspan><tspan dx="1.81650"> the</tspan><tspan dx="1.81650"> holder’s</tspan><tspan dx="1.81650"> positive</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="5.54651" data-space-ratio="1.992">lead<tspan dx="5.54651"> to</tspan><tspan dx="5.54651"> the</tspan><tspan dx="5.54651"> resistor,</tspan><tspan dx="5.54651"> the</tspan><tspan dx="5.54651"> other</tspan><tspan dx="5.54651"> resistor</tspan><tspan dx="5.54651"> end</tspan><tspan dx="5.54651"> to</tspan><tspan dx="5.54651"> the</tspan><tspan dx="5.54651"> LED</tspan><tspan dx="5.54651"> anode,</tspan><tspan dx="5.54651"> and</tspan><tspan dx="5.54651"> the</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">cathode to the holder’s negative lead.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">2.</text><text class="se-copy" x="146" y="308" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="3.06844" data-space-ratio="1.549">Ask<tspan dx="3.06844"> your</tspan><tspan dx="3.06844"> teacher</tspan><tspan dx="3.06844"> to</tspan><tspan dx="3.06844"> check</tspan><tspan dx="3.06844"> the</tspan><tspan dx="3.06844"> connections.</tspan><tspan dx="3.06844"> Connect</tspan><tspan dx="3.06844"> briefly,</tspan><tspan dx="3.06844"> observe</tspan><tspan dx="3.06844"> the</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">LED, record the result and disconnect.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">3.</text><text class="se-copy" x="146" y="384" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="6.71824" data-space-ratio="2.201">Your<tspan dx="6.71824"> teacher</tspan><tspan dx="6.71824"> may</tspan><tspan dx="6.71824"> reverse</tspan><tspan dx="6.71824"> only</tspan><tspan dx="6.71824"> the</tspan><tspan dx="6.71824"> LED</tspan><tspan dx="6.71824"> for</tspan><tspan dx="6.71824"> a</tspan><tspan dx="6.71824"> brief</tspan><tspan dx="6.71824"> comparison</tspan><tspan dx="6.71824"> if</tspan><tspan dx="6.71824"> its</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="2.41989" data-space-ratio="1.433">reverse-voltage<tspan dx="2.41989"> rating</tspan><tspan dx="2.41989"> permits</tspan><tspan dx="2.41989"> 3</tspan><tspan dx="2.41989"> V.</tspan><tspan dx="2.41989"> Predict,</tspan><tspan dx="2.41989"> observe</tspan><tspan dx="2.41989"> and</tspan><tspan dx="2.41989"> then</tspan><tspan dx="2.41989"> disconnect.</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="6.48561" data-space-ratio="2.160">If<tspan dx="6.48561"> that</tspan><tspan dx="6.48561"> rating</tspan><tspan dx="6.48561"> is</tspan><tspan dx="6.48561"> unknown,</tspan><tspan dx="6.48561"> discuss</tspan><tspan dx="6.48561"> the</tspan><tspan dx="6.48561"> comparison</tspan><tspan dx="6.48561"> using</tspan><tspan dx="6.48561"> the</tspan><tspan dx="6.48561"> diagram</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">instead.</tspan></text><text class="se-activity-step" x="132" y="524" text-anchor="end">4.</text><text class="se-copy" x="146" y="524" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="7.32181" data-space-ratio="2.309">Restore<tspan dx="7.32181"> the</tspan><tspan dx="7.32181"> approved</tspan><tspan dx="7.32181"> forward</tspan><tspan dx="7.32181"> connection.</tspan><tspan dx="7.32181"> If</tspan><tspan dx="7.32181"> no</tspan><tspan dx="7.32181"> light</tspan><tspan dx="7.32181"> appears,</tspan><tspan dx="7.32181"> check</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">polarity, contacts and component ratings; do not remove the resistor.</tspan></text></g>

<g class="v2-reading-block" data-block="led-explain-0" transform="translate(0 1119)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.13547" data-space-ratio="1.382">An<tspan dx="2.13547"> LED</tspan><tspan dx="2.13547"> normally</tspan><tspan dx="2.13547"> conducts</tspan><tspan dx="2.13547"> readily</tspan><tspan dx="2.13547"> in</tspan><tspan dx="2.13547"> its</tspan><tspan dx="2.13547"> forward</tspan><tspan dx="2.13547"> direction</tspan><tspan dx="2.13547"> and</tspan><tspan dx="2.13547"> emits</tspan><tspan dx="2.13547"> light</tspan><tspan dx="2.13547"> when</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.48645" data-space-ratio="1.981">enough<tspan dx="5.48645"> current</tspan><tspan dx="5.48645"> flows.</tspan><tspan dx="5.48645"> Reversing</tspan><tspan dx="5.48645"> it</tspan><tspan dx="5.48645"> usually</tspan><tspan dx="5.48645"> prevents</tspan><tspan dx="5.48645"> light</tspan><tspan dx="5.48645"> at</tspan><tspan dx="5.48645"> this</tspan><tspan dx="5.48645"> small</tspan><tspan dx="5.48645"> supply</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="led-explain-1" transform="translate(0 1183)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.49801" data-space-ratio="1.447">voltage,<tspan dx="2.49801"> but</tspan><tspan dx="2.49801"> excessive</tspan><tspan dx="2.49801"> reverse</tspan><tspan dx="2.49801"> voltage</tspan><tspan dx="2.49801"> can</tspan><tspan dx="2.49801"> damage</tspan><tspan dx="2.49801"> it.</tspan><tspan dx="2.49801"> The</tspan><tspan dx="2.49801"> <tspan class="se-bold">resistor</tspan></tspan><tspan dx="2.49801"> limits</tspan><tspan dx="2.49801"> current</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.20311" data-space-ratio="1.752">and<tspan dx="4.20311"> protects</tspan><tspan dx="4.20311"> the</tspan><tspan dx="4.20311"> LED.</tspan><tspan dx="4.20311"> It</tspan><tspan dx="4.20311"> may</tspan><tspan dx="4.20311"> be</tspan><tspan dx="4.20311"> on</tspan><tspan dx="4.20311"> either</tspan><tspan dx="4.20311"> side</tspan><tspan dx="4.20311"> of</tspan><tspan dx="4.20311"> the</tspan><tspan dx="4.20311"> LED</tspan><tspan dx="4.20311"> in</tspan><tspan dx="4.20311"> this</tspan><tspan dx="4.20311"> single</tspan><tspan dx="4.20311"> loop.</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">Correct polarity alone does not make a direct connection to a battery safe.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
