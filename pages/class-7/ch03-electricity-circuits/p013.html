<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="fused-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">loose or dirty contacts, the wrong lamp rating, or insulation trapped at a contact.</tspan><tspan x="89" dy="32">A test result becomes more useful when you can rule out these alternatives.</tspan></text></g>
<g class="v2-reading-block" data-block="led-head" transform="translate(0 204)"><text class="se-heading" x="89" y="30"><tspan x="89">Making an LED light</tspan></text></g>
<g class="v2-reading-block" data-block="led-build" transform="translate(0 252)"><rect class="se-activity-panel" x="89" y="0" width="874" height="586" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Your teacher supplies a red LED suitable for a 3 V circuit, two matching 1.5 V</tspan><tspan x="113" dy="32">cells in a series holder, a 330 Ω resistor and insulated leads. The teacher</tspan><tspan x="113" dy="32">checks the LED ratings first.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">1.</text><text class="se-copy" x="146" y="200"><tspan x="146">Keep the cells disconnected while building. Connect the holder’s positive</tspan><tspan x="146" dy="32">lead to the resistor, the other resistor end to the LED anode, and the</tspan><tspan x="146" dy="32">cathode to the holder’s negative lead.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">2.</text><text class="se-copy" x="146" y="308"><tspan x="146">Ask your teacher to check the connections. Connect briefly, observe the</tspan><tspan x="146" dy="32">LED, record the result and disconnect.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">3.</text><text class="se-copy" x="146" y="384"><tspan x="146">Your teacher may reverse only the LED for a brief comparison if its</tspan><tspan x="146" dy="32">reverse-voltage rating permits 3 V. Predict, observe and then disconnect.</tspan><tspan x="146" dy="32">If that rating is unknown, discuss the comparison using the diagram</tspan><tspan x="146" dy="32">instead.</tspan></text><text class="se-activity-step" x="132" y="524" text-anchor="end">4.</text><text class="se-copy" x="146" y="524"><tspan x="146">Restore the approved forward connection. If no light appears, check</tspan><tspan x="146" dy="32">polarity, contacts and component ratings; do not remove the resistor.</tspan></text></g><g transform="translate(0 860)"><g data-page-illustration="figures/class-7/science/ch03/components.png"><image class="science-illustration" href="../../figures/class-7/science/ch03/components.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Components for a simple circuit.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Components for a simple circuit.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
