<section class="page page--food page--science-editorial page--science-v2 page--g7-ch03" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Electricity: Circuits and their Components, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-electric-motif" transform="translate(26 5) scale(.55)"><path d="M0 35H20M20 10V60M34 22V48M34 35H60V85H42M18 85H0V35"/><circle cx="30" cy="85" r="12"/><path d="M22 77l16 16M22 93l16 -16"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 3</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Electricity: Circuits and their Components</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="uses-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Electricity around us</tspan></text></g>
<g class="v2-reading-block" data-block="uses-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Look around your home, school and neighbourhood without opening electrical</tspan><tspan x="89" dy="32">equipment. Nihal’s group organised its examples by purpose. Add examples in</tspan></text></g>
<g class="v2-reading-block" data-block="uses-intro-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">your notebook, then propose a different grouping. A computer might fit more</tspan><tspan x="89" dy="32">than one category: explain the purpose you have in mind.</tspan></text></g>
<g class="v2-reading-block" data-block="uses" transform="translate(0 314)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112">Cooking: electric kettles, mixer grinders, toasters, ovens and microwave ovens.</tspan></text><text class="se-copy" x="89" y="66" text-anchor="start">•</text><text class="se-copy" x="112" y="66"><tspan x="112">Lighting: lamps in homes, offices, streets, markets and factories.</tspan></text><text class="se-copy" x="89" y="108" text-anchor="start">•</text><text class="se-copy" x="112" y="108"><tspan x="112">Transport and lifting: electric trains, buses, cars, scooters, lifts and escalators.</tspan></text><text class="se-copy" x="89" y="150" text-anchor="start">•</text><text class="se-copy" x="112" y="150"><tspan x="112">Heating and cooling: fans, room heaters, immersion heaters, geysers,</tspan><tspan x="112" dy="32">refrigerators and air conditioners.</tspan></text><text class="se-copy" x="89" y="224" text-anchor="start">•</text><text class="se-copy" x="112" y="224"><tspan x="112">Entertainment and communication: televisions, radios, mobile phones and</tspan><tspan x="112" dy="32">equipment that carries internet signals.</tspan></text><text class="se-copy" x="89" y="298" text-anchor="start">•</text><text class="se-copy" x="112" y="298"><tspan x="112">Other work: water pumps, cranes and computers used in schools, hospitals and</tspan><tspan x="112" dy="32">workplaces.</tspan></text></g>
<g class="v2-reading-block" data-block="supply-0" transform="translate(0 668)"><text class="se-copy" x="89" y="24"><tspan x="89">Electrical energy can be supplied using moving water, wind, sunlight, or fuels</tspan><tspan x="89" dy="32">such as coal and natural gas. Much of the electricity used in buildings arrives</tspan></text></g>
<g class="v2-reading-block" data-block="supply-1" transform="translate(0 732)"><text class="se-copy" x="89" y="24"><tspan x="89">through a network of wires. A cell provides a portable source. The same word</tspan><tspan x="89" dy="32">“electricity” does not make every source equally safe to investigate.</tspan></text></g>
<g class="v2-reading-block" data-block="energy-uses-0" transform="translate(0 812)"><text class="se-copy" x="89" y="24"><tspan x="89">A kettle transfers electrical energy mainly into heating water. A fan transfers</tspan><tspan x="89" dy="32">some into motion of its blades and the surrounding air. A lamp transfers some</tspan></text></g>
<g class="v2-reading-block" data-block="energy-uses-1" transform="translate(0 876)"><text class="se-copy" x="89" y="24"><tspan x="89">into light and some into heating. These examples suggest another grouping: what</tspan><tspan x="89" dy="32">change does each device produce? One appliance can produce several changes,</tspan><tspan x="89" dy="32">so explain your grouping instead of treating every category as exclusive.</tspan></text></g>
<g class="v2-reading-block" data-block="safe-0" transform="translate(0 988)"><text class="se-copy" x="89" y="24"><tspan x="89">Use only teacher-approved 1.5 V cells and holders for these activities. Never</tspan><tspan x="89" dy="32">experiment with wall sockets, household wiring, generators, vehicle batteries or</tspan></text></g>
<g class="v2-reading-block" data-block="safe-1" transform="translate(0 1052)"><text class="se-copy" x="89" y="24"><tspan x="89">phone battery packs. Keep hands and the work area dry. Do not use leaking,</tspan><tspan x="89" dy="32">swollen or damaged cells. Never join a cell’s two terminals directly with wire: a</tspan></text></g>
<g class="v2-reading-block" data-block="safe-2" transform="translate(0 1116)"><text class="se-copy" x="89" y="24"><tspan x="89">short circuit can make the cell and wire hot. Disconnect every circuit after a brief</tspan><tspan x="89" dy="32">test.</tspan></text></g>
<g class="v2-reading-block" data-block="safe-comparison-0" transform="translate(0 1196)"><text class="se-copy" x="89" y="24"><tspan x="89">The small cell in a torch lets us study connections without approaching the</tspan><tspan x="89" dy="32">power network. Even then, a conducting object across its terminals can create a</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
