<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="material-limits-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">permanently assigned to one group regardless of its form: a thin layer and a thick</tspan><tspan x="89" dy="32">stack may behave differently. State what you tested.</tspan></text></g>
<g class="v2-reading-block" data-block="shadows" transform="translate(0 204)"><text class="v2-title" x="89" y="38"><tspan x="89">11.4 How Do Shadows Form?</tspan></text></g>
<g class="v2-reading-block" data-block="shadow-question-0" transform="translate(0 262)"><text class="se-copy" x="89" y="24"><tspan x="89">Return to the screen behind an opaque sample. Where less light from the source</tspan><tspan x="89" dy="32">reaches it, a darker region may be visible. Investigate which parts of the</tspan><tspan x="89" dy="32">arrangement are needed to see that region, and which changes alter its outline.</tspan></text></g>
<g class="v2-reading-block" data-block="shadow-task" transform="translate(0 374)"><rect class="se-activity-panel" x="89" y="0" width="874" height="850" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Place an opaque ball or cardboard shape between a torch and a screen.</tspan><tspan x="146" dy="32">Fix the torch and screen positions. Record the outline and approximate</tspan><tspan x="146" dy="32">size of the dark region.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Test one change at a time: remove the screen; replace it and remove the</tspan><tspan x="146" dy="32">object; replace it and switch off the torch. Restore the original</tspan><tspan x="146" dy="32">arrangement after each trial.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Replace the object with one of the same size and shape but a different</tspan><tspan x="146" dy="32">colour. Then use the original object and move it nearer the screen, then</tspan><tspan x="146" dy="32">nearer the torch.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Tilt a flat shape without moving the torch or screen. Record what changes</tspan><tspan x="146" dy="32">and what stays the same. Compare the centre and edge of each dark</tspan><tspan x="146" dy="32">region.</tspan></text><text class="se-copy" x="113" y="524"><tspan x="113">Use a cool battery torch, never the Sun viewed directly. Keep paths clear and</tspan><tspan x="113" dy="32">do not shine light towards eyes.</tspan></text><image class="science-illustration" data-photo="shadow-setup" href="../../figures/class-7/science/ch11/shadow-setup.png" x="311" y="576" width="430" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="821.88"><tspan x="113">Keep the source and screen fixed when testing the object’s position.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
