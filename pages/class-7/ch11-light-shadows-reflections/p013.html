<g class="v2-reading-block" data-block="self-task" transform="translate(0 719)"><rect class="se-activity-panel" x="89" y="0" width="874" height="414" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Activity 11.8"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Activity 11.8</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="1.62248" data-space-ratio="1.290">Stand<tspan dx="1.62248"> safely</tspan><tspan dx="1.62248"> in</tspan><tspan dx="1.62248"> front</tspan><tspan dx="1.62248"> of</tspan><tspan dx="1.62248"> a</tspan><tspan dx="1.62248"> secured</tspan><tspan dx="1.62248"> plane</tspan><tspan dx="1.62248"> mirror.</tspan><tspan dx="1.62248"> Move</tspan><tspan dx="1.62248"> closer,</tspan><tspan dx="1.62248"> then</tspan><tspan dx="1.62248"> farther</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">away. Notice where your image appears relative to the mirror.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="0.56603" data-space-ratio="1.101">Raise<tspan dx="0.56603"> your</tspan><tspan dx="0.56603"> left</tspan><tspan dx="0.56603"> arm,</tspan><tspan dx="0.56603"> then</tspan><tspan dx="0.56603"> touch</tspan><tspan dx="0.56603"> your</tspan><tspan dx="0.56603"> right</tspan><tspan dx="0.56603"> ear.</tspan><tspan dx="0.56603"> Describe</tspan><tspan dx="0.56603"> the</tspan><tspan dx="0.56603"> image</tspan><tspan dx="0.56603"> without</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">assuming it is another person who has turned around to face you.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="1.72659" data-space-ratio="1.309">Write<tspan dx="1.72659"> a</tspan><tspan dx="1.72659"> short</tspan><tspan dx="1.72659"> word</tspan><tspan dx="1.72659"> on</tspan><tspan dx="1.72659"> paper</tspan><tspan dx="1.72659"> and</tspan><tspan dx="1.72659"> hold</tspan><tspan dx="1.72659"> it</tspan><tspan dx="1.72659"> parallel</tspan><tspan dx="1.72659"> to</tspan><tspan dx="1.72659"> the</tspan><tspan dx="1.72659"> mirror,</tspan><tspan dx="1.72659"> facing</tspan><tspan dx="1.72659"> the</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">mirror. Compare the word with its image. Sketch both in your notebook.</tspan></text><text class="se-activity-step" x="132" y="320" text-anchor="end">4.</text><text class="se-copy" x="146" y="320" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="1.65327" data-space-ratio="1.296">Optional<tspan dx="1.65327"> teacher</tspan><tspan dx="1.65327"> demonstration:</tspan><tspan dx="1.65327"> use</tspan><tspan dx="1.65327"> a</tspan><tspan dx="1.65327"> safe</tspan><tspan dx="1.65327"> semi-reflecting</tspan><tspan dx="1.65327"> sheet</tspan><tspan dx="1.65327"> and</tspan><tspan dx="1.65327"> two</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="5.28402" data-space-ratio="1.945">matching<tspan dx="5.28402"> upright</tspan><tspan dx="5.28402"> objects</tspan><tspan dx="5.28402"> to</tspan><tspan dx="5.28402"> locate</tspan><tspan dx="5.28402"> the</tspan><tspan dx <g class="v2-reading-block" data-block="lateral-0" transform="translate(0 1155)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="10.58893" data-space-ratio="2.894">The<tspan dx="10.58893"> familiar</tspan><tspan dx="10.58893"> apparent</tspan><tspan dx="10.58893"> left–right</tspan><tspan dx="10.58893"> reversal</tspan><tspan dx="10.58893"> is</tspan><tspan dx="10.58893"> called</tspan><tspan dx="10.58893"> <tspan class="se-bold">lateral</tspan></tspan><tspan dx="10.58893"> <tspan class="se-bold">inversion</tspan>.</tspan><tspan dx="10.58893"> More</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.56268" data-space-ratio="1.101">precisely,<tspan dx="0.56268"> a</tspan><tspan dx="0.56268"> plane</tspan><tspan dx="0.56268"> mirror</tspan><tspan dx="0.56268"> reverses</tspan><tspan dx="0.56268"> the</tspan><tspan dx="0.56268"> direction</tspan><tspan dx="0.56268"> perpendicular</tspan><tspan dx="0.56268"> to</tspan><tspan dx="0.56268"> its</tspan><tspan dx="0.56268"> surface:</tspan><tspan dx="0.56268"> front</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="lateral-1" transform="translate(0 1219)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.47528" data-space-ratio="1.264">and<tspan dx="1.47528"> back.</tspan><tspan dx="1.47528"> It</tspan><tspan dx="1.47528"> does</tspan><tspan dx="1.47528"> not</tspan><tspan dx="1.47528"> exchange</tspan><tspan dx="1.47528"> the</tspan><tspan dx="1.47528"> top</tspan><tspan dx="1.47528"> and</tspan><tspan dx="1.47528"> bottom.</tspan><tspan dx="1.47528"> Comparing</tspan><tspan dx="1.47528"> the</tspan><tspan dx="1.47528"> image</tspan><tspan dx="1.47528"> with</tspan><tspan dx="1.47528"> a</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="6.26994" data-space-ratio="2.121">person<tspan dx="6.26994"> imagined</tspan><tspan dx="6.26994"> turning</tspan><tspan dx="6.26994"> around</tspan><tspan dx="6.26994"> to</tspan><tspan dx="6.26994"> face</tspan><tspan dx="6.26994"> you</tspan><tspan dx="6.26994"> produces</tspan><tspan dx="6.26994"> the</tspan><tspan dx="6.26994"> familiar</tspan><tspan dx="6.26994"> left–right</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">description. Letters show this especially clearly.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
