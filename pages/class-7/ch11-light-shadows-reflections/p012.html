<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reflection-rule-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">For a smooth plane mirror, the incoming and outgoing rays make equal angles</tspan><tspan x="89" dy="32">with the normal. You will study this rule more fully later. Here, the tracing helps</tspan></text></g>
<g class="v2-reading-block" data-block="reflection-rule-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">explain why a slight turn of the mirror moves a light spot: the reflecting surface,</tspan><tspan x="89" dy="32">and therefore the direction it returns light, has changed.</tspan></text></g>
<g class="v2-reading-block" data-block="mirror-images" transform="translate(0 268)"><text class="v2-title" x="89" y="38"><tspan x="89">11.6 Images in a Plane Mirror</tspan></text></g>
<g class="v2-reading-block" data-block="mirror-question-0" transform="translate(0 326)"><text class="se-copy" x="89" y="24"><tspan x="89">A bright patch on a wall is not the same as a recognisable mirror image. Look at a</tspan><tspan x="89" dy="32">pen in a mirror. Where does it appear to be, and what properties can you</tspan><tspan x="89" dy="32">compare without confusing an image with a second physical pen?</tspan></text></g>
<g class="v2-reading-block" data-block="pen-task" transform="translate(0 438)"><rect class="se-activity-panel" x="89" y="0" width="874" height="414" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Secure a plane mirror upright with covered edges. Stand a pen in front of</tspan><tspan x="146" dy="32">it. Observe the image from a fixed viewing position.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Move the pen to several distances. Compare its orientation and the</tspan><tspan x="146" dy="32">image’s apparent position. Is the pen’s top still at the top in the image?</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Try placing a white screen at different positions in front of and behind</tspan><tspan x="146" dy="32">the mirror. Distinguish a reflected bright patch from a sharp image of the</tspan><tspan x="146" dy="32">pen on the screen.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352"><tspan x="146">Record what you can observe, and which size or distance claims would</tspan><tspan x="146" dy="32">need a measurement rather than a visual guess.</tspan></text></g>
<g class="v2-reading-block" data-block="virtual-image-0" transform="translate(0 874)"><text class="se-copy" x="89" y="24"><tspan x="89">A plane mirror forms an upright image of the same size as the object. The image</tspan><tspan x="89" dy="32">appears as far behind the mirror as the object is in front, measured</tspan></text></g><g transform="translate(0 938)"><g data-page-illustration="figures/class-7/science/ch11/mirror-pen.png"><image class="science-illustration" href="../../figures/class-7/science/ch11/mirror-pen.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A pen beside a plane mirror.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A pen beside a plane mirror.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
