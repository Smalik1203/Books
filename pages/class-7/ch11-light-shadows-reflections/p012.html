<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="pen-image" transform="translate(0 112)"><g class="v2-light-diagram" data-diagram="mirror-pen"><image class="science-illustration" data-art="mirror-pen" href="../../figures/class-7/science/ch11/mirror-pen.png" x="271" y="0" width="510" height="340" preserveAspectRatio="xMidYMid meet"/></g><text class="se-caption" x="89" y="375.88"><tspan x="89">The pen is an object; its appearance in the mirror is an image. Perceived size in a perspective</tspan><tspan x="89" dy="27">view is not a ruler measurement of image size.</tspan></text></g>
<g class="v2-reading-block" data-block="mirror-size-0" transform="translate(0 543)"><text class="se-copy" x="89" y="24"><tspan x="89">Moving away can make both object and image look smaller to the eye, just as a</tspan><tspan x="89" dy="32">distant tree looks smaller. That change in viewing angle does not mean the plane</tspan></text></g>
<g class="v2-reading-block" data-block="mirror-size-1" transform="translate(0 607)"><text class="se-copy" x="89" y="24"><tspan x="89">mirror has reduced the actual image height. Compare size using a suitable</tspan><tspan x="89" dy="32">position-matching method rather than a photograph taken from an arbitrary</tspan><tspan x="89" dy="32">angle.</tspan></text></g>
<g class="v2-reading-block" data-block="self-task" transform="translate(0 719)"><rect class="se-activity-panel" x="89" y="0" width="874" height="414" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Stand safely in front of a secured plane mirror. Move closer, then farther</tspan><tspan x="146" dy="32">away. Notice where your image appears relative to the mirror.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Raise your left arm, then touch your right ear. Describe the image without</tspan><tspan x="146" dy="32">assuming it is another person who has turned around to face you.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Write a short word on paper and hold it parallel to the mirror, facing the</tspan><tspan x="146" dy="32">mirror. Compare the word with its image. Sketch both in your notebook.</tspan></text><text class="se-activity-step" x="132" y="320" text-anchor="end">4.</text><text class="se-copy" x="146" y="320"><tspan x="146">Optional teacher demonstration: use a safe semi-reflecting sheet and two</tspan><tspan x="146" dy="32">matching upright objects to locate the apparent image. Measure equal</tspan><tspan x="146" dy="32">distances from the sheet; do not move or handle large glass mirrors.</tspan></text></g>
<g class="v2-reading-block" data-block="lateral-0" transform="translate(0 1155)"><text class="se-copy" x="89" y="24"><tspan x="89">The familiar apparent left–right reversal is called <tspan class="se-bold">lateral</tspan> <tspan class="se-bold">inversion</tspan>. More</tspan><tspan x="89" dy="32">precisely, a plane mirror reverses the direction perpendicular to its surface: front</tspan></text></g>
<g class="v2-reading-block" data-block="lateral-1" transform="translate(0 1219)"><text class="se-copy" x="89" y="24"><tspan x="89">and back. It does not exchange the top and bottom. Comparing the image with a</tspan><tspan x="89" dy="32">person imagined turning around to face you produces the familiar left–right</tspan><tspan x="89" dy="32">description. Letters show this especially clearly.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
