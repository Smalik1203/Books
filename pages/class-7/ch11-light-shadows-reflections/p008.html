<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="shadow-record" transform="translate(0 112)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Record each change against the starting arrangement</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Change</tspan></text><text class="v2-table-heading" x="557.48" y="76.08"><tspan x="557.48">What to record</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Remove screen / object / torch light</tspan></text><text class="se-copy se-table-copy" x="557.48" y="128.07999999999998"><tspan x="557.48">Test separately: where is a dark region</tspan><tspan x="557.48" dy="28">visible?</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="174" y2="174"/><text class="se-copy se-table-copy" x="103" y="208.07999999999998"><tspan x="103">Change only the object’s colour</tspan></text><text class="se-copy se-table-copy" x="557.48" y="208.07999999999998"><tspan x="557.48">Compare darkness and outline.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="226" y2="226"/><text class="se-copy se-table-copy" x="103" y="260.08"><tspan x="103">Move object nearer screen or source</tspan></text><text class="se-copy se-table-copy" x="557.48" y="260.08"><tspan x="557.48">Compare size; keep the other positions</tspan><tspan x="557.48" dy="28">fixed.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="306" y2="306"/><text class="se-copy se-table-copy" x="103" y="340.08"><tspan x="103">Tilt the same flat object</tspan></text><text class="se-copy se-table-copy" x="557.48" y="340.08"><tspan x="557.48">Compare shape and sharpness.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="358" y2="358"/><rect class="v2-table-frame" x="89" y="42" width="874" height="316"/><line class="v2-table-rule" x1="543.48" x2="543.48" y1="42" y2="358"/><text class="v2-table-note" x="89" y="390.88"><tspan x="89">Use sketches and measured widths where practical. Do not replace an unexpected</tspan><tspan x="89" dy="26">observation with the result you think should occur.</tspan></text></g>
<g class="v2-reading-block" data-block="shadow-explanation-0" transform="translate(0 554)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">shadow</tspan> is a region receiving less light because an object blocks some paths</tspan><tspan x="89" dy="32">from a source. A screen makes a cross-section of that region visible. A wall,</tspan></text></g>
<g class="v2-reading-block" data-block="shadow-explanation-1" transform="translate(0 618)"><text class="se-copy" x="89" y="24"><tspan x="89">ground or floor can serve as the screen. Removing a small card screen need not</tspan><tspan x="89" dy="32">remove the shadow region itself: another surface farther away may show it.</tspan></text></g>
<g class="v2-reading-block" data-block="shadow-size-0" transform="translate(0 698)"><text class="se-copy" x="89" y="24"><tspan x="89">With a small nearby source and a fixed screen, moving an object towards the</tspan><tspan x="89" dy="32">source usually enlarges its shadow; moving it towards the screen usually makes it</tspan></text></g>
<g class="v2-reading-block" data-block="shadow-size-1" transform="translate(0 762)"><text class="se-copy" x="89" y="24"><tspan x="89">smaller and sharper. The blocked region widens as light spreads beyond the</tspan><tspan x="89" dy="32">object. Tilting a flat object changes its outline. Different objects can cast similar</tspan><tspan x="89" dy="32">outlines, so a shadow need not identify an object.</tspan></text></g><g transform="translate(0 874)"><g data-page-illustration="figures/class-7/science/ch11/shadow-setup.png"><image class="science-illustration" href="../../figures/class-7/science/ch11/shadow-setup.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A shadow investigation setup.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A shadow investigation setup.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
