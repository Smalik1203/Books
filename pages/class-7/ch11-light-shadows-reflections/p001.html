" y="156" text-anchor="start">Light: Shadows</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">and Reflections</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch11/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Children and an elder observing fireflies</title></image></g><text class="se-copy v2-intro" x="89" y="981" data-prose-align="justify"><tspan x="89" data-paragraph-end="true">Watch a patch of light move across a wall. What changed its path?</tspan></text><text class="se-copy" x="89" y="1033" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.03923" data-space-ratio="1.722">On<tspan dx="4.03923"> a</tspan><tspan dx="4.03923"> visit</tspan><tspan dx="4.03923"> to</tspan><tspan dx="4.03923"> a</tspan><tspan dx="4.03923"> village</tspan><tspan dx="4.03923"> in</tspan><tspan dx="4.03923"> Maharashtra’s</tspan><tspan dx="4.03923"> Western</tspan><tspan dx="4.03923"> Ghats,</tspan><tspan dx="4.03923"> Keshav</tspan><tspan dx="4.03923"> and</tspan><tspan dx="4.03923"> Jatin</tspan><tspan dx="4.03923"> watch</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="7.49010" data-space-ratio="2.339">fireflies<tspan dx="7.49010"> flashing</tspan><tspan dx="7.49010"> among</tspan><tspan dx="7.49010"> the</tspan><tspan dx="7.49010"> trees.</tspan><tspan dx="7.49010"> Some</tspan><tspan dx="7.49010"> living</tspan><tspan dx="7.49010"> things</tspan><tspan dx="7.49010"> produce</tspan><tspan dx="7.49010"> light.</tspan><tspan dx="7.49010"> On</tspan><tspan dx="7.49010"> the</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.24766" data-space-ratio="1.938">journey<tspan dx="5.24766"> home,</tspan><tspan dx="5.24766"> moonlit</tspan><tspan dx="5.24766"> hills</tspan><tspan dx="5.24766"> and</tspan><tspan dx="5.24766"> vehicle</tspan><tspan dx="5.24766"> headlights</tspan><tspan dx="5.24766"> raise</tspan><tspan dx="5.24766"> a</tspan><tspan dx="5.24766"> different</tspan><tspan dx="5.24766"> question:</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">which objects make light, and which return light from elsewhere?</tspan></text><text class="se-copy" x="89" y="1177" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="8.63022" data-space-ratio="2.543">Investigate<tspan dx="8.63022"> what</tspan><tspan dx="8.63022"> happens</tspan><tspan dx="8.63022"> when</tspan><tspan dx="8.63022"> light</tspan><tspan dx="8.63022"> meets</tspan><tspan dx="8.63022"> a</tspan><tspan dx="8.63022"> material,</tspan><tspan dx="8.63022"> a</tspan><tspan dx="8.63022"> mirror</tspan><tspan dx="8.63022"> or</tspan><tspan dx="8.63022"> a</tspan><tspan dx="8.63022"> tiny</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="6.48565" data-space-ratio="2.160">opening.<tspan dx="6.48565"> Use</tspan><tspan dx="6.48565"> observations</tspan><tspan dx="6.48565"> to</tspan><tspan dx="6.48565"> explain</tspan><tspan dx="6.48565"> shadows</tspan><tspan dx="6.48565"> and</tspan><tspan dx="6.48565"> images,</tspan><tspan dx="6.48565"> and</tspan><tspan dx="6.48565"> build</tspan><tspan dx="6.48565"> simple</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">devices that put these ideas to work.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle"
