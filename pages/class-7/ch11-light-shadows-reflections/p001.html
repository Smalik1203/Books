<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11 page--opener" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 1"><g class="chapter-opener" data-opener="science-g7-ch11"><defs><linearGradient id="science-g7-ch11-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop class="chapter-opener__gradient-start" offset="0%"/><stop class="chapter-opener__gradient-end" offset="100%"/></linearGradient></defs><path class="chapter-opener__band" fill="url(#science-g7-ch11-gradient)" d="M-17 -17H1069V300H-17Z"/><path class="chapter-opener__edge" d="M-17 296H1069V300H-17Z"/><g class="science-header-art" data-header-art="7-11" aria-hidden="true" transform="translate(886 26)"><g data-art-element="mirror" transform="translate(7 82) scale(1.12) rotate(-6 50 50)"><path class="science-header-art__soft" d="M25 10H77V71H25Z"/><path d="M31 16H71V65H31M51 71V85M31 91Q51 79 71 91M38 32L53 22M40 46L62 31"/></g><g data-art-element="bulb" transform="translate(72 0) scale(0.62) rotate(8 50 50)"><path class="science-header-art__soft" d="M30 65C30 54 14 50 14 30A35 35 0 0 1 84 30C84 50 68 54 68 65Z"/><path d="M32 68H66V85H32ZM36 88Q49 101 62 88M34 74H64M34 80H64M43 65L37 40L48 49L60 39L55 65M4 34H0M95 34H100"/></g><g data-art-element="prism" transform="translate(64 184) scale(0.65) rotate(7 50 50)"><path class="science-header-art__soft" d="M20 70L51 14L79 72L52 90Z"/><path d="M51 14L52 90M20 70L79 72M4 39L37 39M64 38L95 25M65 46L96 46M71 57L96 69"/></g></g><line class="chapter-opener__divider" x1="240" x2="240" y1="94" y2="252"/><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number chapter-opener__number--double se-running" x="151" y="242" text-anchor="middle">11</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">Light: Shadows</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">and Reflections</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch11/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Children and an elder observing fireflies</title></image></g><text class="se-copy v2-intro" x="89" y="981"><tspan x="89">Watch a patch of light move across a wall. What changed its path?</tspan></text><text class="se-copy" x="89" y="1033"><tspan x="89">On a visit to a village in Maharashtra’s Western Ghats, Keshav and Jatin watch</tspan><tspan x="89" dy="32">fireflies flashing among the trees. Some living things produce light. On the</tspan><tspan x="89" dy="32">journey home, moonlit hills and vehicle headlights raise a different question:</tspan><tspan x="89" dy="32">which objects make light, and which return light from elsewhere?</tspan></text><text class="se-copy" x="89" y="1177"><tspan x="89">Investigate what happens when light meets a material, a mirror or a tiny</tspan><tspan x="89" dy="32">opening. Use observations to explain shadows and images, and build simple</tspan><tspan x="89" dy="32">devices that put these ideas to work.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
