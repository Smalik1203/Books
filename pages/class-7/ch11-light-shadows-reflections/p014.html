<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="pinhole-explanation-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">The image is inverted. Light from the top of the object travels through the hole to</tspan><tspan x="89" dy="32">the lower part of the screen; light from the bottom reaches the upper part. The</tspan></text></g>
<g class="v2-reading-block" data-block="pinhole-explanation-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">paths cross at the opening. No ray has to bend there. The image can retain</tspan><tspan x="89" dy="32">colours because light from different object parts reaches different screen</tspan><tspan x="89" dy="32">regions.</tspan></text></g>
<g class="v2-reading-block" data-block="camera-task" transform="translate(0 288)"><rect class="se-activity-panel" x="89" y="0" width="874" height="909" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Find two cardboard boxes that slide snugly into each other. Open one end</tspan><tspan x="146" dy="32">of each. An adult makes a tiny pinhole in the opposite face of the larger</tspan><tspan x="146" dy="32">box.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Cut a 5–6 cm square window in the opposite face of the smaller box. Tape</tspan><tspan x="146" dy="32">tracing paper smoothly over it to make a screen.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Slide the smaller box inside the larger one with its tracing-paper face</tspan><tspan x="146" dy="32">towards the pinhole. The open viewing end remains outside. Seal</tspan><tspan x="146" dy="32">unwanted light leaks with dark tape.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">4.</text><text class="se-copy" x="146" y="384"><tspan x="146">Aim at a sunlit tree or building with the Sun safely behind you. Shade the</tspan><tspan x="146" dy="32">viewing opening with a loose dark cloth without covering your nose or</tspan><tspan x="146" dy="32">mouth. Slide the inner box and observe orientation, colour, size and</tspan><tspan x="146" dy="32">clarity.</tspan></text><text class="se-copy" x="113" y="524"><tspan x="113">Never aim at or look towards the Sun. Adults cut card; use blunt scissors</tspan><tspan x="113" dy="32">where possible. Keep the camera dry and use it from a safe standing</tspan><tspan x="113" dy="32">position.</tspan></text><image class="science-illustration" data-photo="pinhole-kit" href="../../figures/class-7/science/ch11/pinhole-kit.png" x="364.75" y="608" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="853.88"><tspan x="113">The small box’s tracing-paper face goes inside, towards the pinhole. View its screen</tspan><tspan x="113" dy="27">through the open outer end.</tspan></text></g>
<g class="v2-reading-block" data-block="camera-distance-0" transform="translate(0 1219)"><text class="se-copy" x="89" y="24"><tspan x="89">Sliding the inner box changes the distance from hole to screen. A larger</tspan><tspan x="89" dy="32">hole-to-screen distance generally gives a larger, dimmer image of the same</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
