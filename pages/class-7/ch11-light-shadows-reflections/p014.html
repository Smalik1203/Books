<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="lateral-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">The familiar apparent left–right reversal is called <tspan class="se-bold">lateral</tspan> <tspan class="se-bold">inversion</tspan>. More</tspan><tspan x="89" dy="32">precisely, a plane mirror reverses the direction perpendicular to its surface: front</tspan></text></g>
<g class="v2-reading-block" data-block="lateral-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">and back. It does not exchange the top and bottom. Comparing the image with a</tspan><tspan x="89" dy="32">person imagined turning around to face you produces the familiar left–right</tspan><tspan x="89" dy="32">description. Letters show this especially clearly.</tspan></text></g>
<g class="v2-reading-block" data-block="mirror-word" transform="translate(0 288)"><g class="v2-light-diagram" data-diagram="mirror-word"><text class="v2-light-label" x="300" y="30" text-anchor="middle">Word facing mirror</text><text class="v2-light-label" x="754" y="30" text-anchor="middle">Mirror writing</text><text class="v2-light-word" x="300" y="99" text-anchor="middle">AMBULANCE</text><g transform="translate(1508 0) scale(-1 1)"><text class="v2-light-word" x="754" y="99" text-anchor="middle">AMBULANCE</text></g></g><text class="se-caption" x="89" y="165.88"><tspan x="89">A word facing a mirror and its reversed image. The shape of each letter helps you track the</tspan><tspan x="89" dy="27">change.</tspan></text></g>
<g class="v2-reading-block" data-block="ambulance-0" transform="translate(0 509)"><text class="se-copy" x="89" y="24"><tspan x="89">Some ambulances carry mirror writing on the front so that the name reads</tspan><tspan x="89" dy="32">normally in a driver’s rear-view mirror. Symmetric printed letters such as T and O</tspan></text></g>
<g class="v2-reading-block" data-block="ambulance-1" transform="translate(0 573)"><text class="se-copy" x="89" y="24"><tspan x="89">may look unchanged under left–right reversal. This depends on the letter shape</tspan><tspan x="89" dy="32">and typeface; it is not true of every written word.</tspan></text></g>
<g class="v2-reading-block" data-block="metal-mirror-0" transform="translate(0 653)"><text class="se-copy" x="89" y="24"><tspan x="89">A mirror need not be ordinary silvered glass. Carefully polished metal can form</tspan><tspan x="89" dy="32">an image too. Aranmula Kannadi, made in Kerala, is a traditional metal-alloy</tspan></text></g>
<g class="v2-reading-block" data-block="metal-mirror-1" transform="translate(0 717)"><text class="se-copy" x="89" y="24"><tspan x="89">mirror with its reflecting surface at the front. Its craft links material properties</tspan><tspan x="89" dy="32">with the smooth surface needed for a clear image.</tspan></text></g><g transform="translate(0 797)"><g data-page-illustration="figures/class-7/science/ch11/mirror-pen.png"><image class="science-illustration" href="../../figures/class-7/science/ch11/mirror-pen.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A pen beside a plane mirror.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A pen beside a plane mirror.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
