<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 16" xmlns="http://www.w3.org/2000/svg"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="camera-distance-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.70711" data-space-ratio="1.126">distant<tspan dx="0.70711"> scene.</tspan><tspan dx="0.70711"> The</tspan><tspan dx="0.70711"> movement</tspan><tspan dx="0.70711"> changes</tspan><tspan dx="0.70711"> image</tspan><tspan dx="0.70711"> scale;</tspan><tspan dx="0.70711"> a</tspan><tspan dx="0.70711"> pinhole</tspan><tspan dx="0.70711"> has</tspan><tspan dx="0.70711"> no</tspan><tspan dx="0.70711"> lens</tspan><tspan dx="0.70711"> to</tspan><tspan dx="0.70711"> focus</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.17055" data-space-ratio="1.388">like<tspan dx="2.17055"> a</tspan><tspan dx="2.17055"> camera</tspan><tspan dx="2.17055"> lens.</tspan><tspan dx="2.17055"> Better</tspan><tspan dx="2.17055"> shading</tspan><tspan dx="2.17055"> may</tspan><tspan dx="2.17055"> reveal</tspan><tspan dx="2.17055"> an</tspan><tspan dx="2.17055"> image</tspan><tspan dx="2.17055"> that</tspan><tspan dx="2.17055"> seemed</tspan><tspan dx="2.17055"> absent</tspan><tspan dx="2.17055"> in</tspan><tspan dx="2.17055"> a</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">bright viewing opening.</tspan></text></g>
<g class="v2-reading-block" data-block="pinhole-rays" transform="translate(0 224)"><g data-instructional-figure="pinhole-rays"><g class="v2-light-diagram" data-diagram="pinhole-rays"><image class="science-illustration" data-art="tree" href="../../figures/class-7/science/ch11/tree.png" x="113.66666666666667" y="70" width="166.66666666666666" height="250" preserveAspectRatio="xMidYMid meet"/><rect class="v2-light-solid" x="519.5" y="40" width="13" height="138"/><rect class="v2-light-solid" x="519.5" y="190" width="13" height="140"/><g transform="translate(1052 368) rotate(180)"><image class="science-illustration" data-art="tree" href="../../figures/class-7/science/ch11/tree.png" x="113.66666666666667" y="70" width="166.66666666666666" height="250" preserveAspectRatio="xMidYMid meet"/></g><path class="v2-light-arrow" d="M170 80L882 288M872.2318913304676 290.14104017248786L882 288L874.9206451794245 280.9372289202896"/><path class="v2-light-arrow" d="M205 306L847 62M840.4999206813494 69.59927423187578L847 62L837.0934233840856 60.63627724481249"/><text class="v2-light-label" x="195" y="355" text-anchor="middle">Object</text><text class="v2-light-label" x="526" y="30" text-anchor="middle">Pinhole</text><text class="v2-light-label" x="855" y="355" text-anchor="middle">Image on screen</text></g></g><text class="se-caption" x="89" y="395.88"><tspan x="89">Two representative paths explain the inverted image. The object and screen are on opposite</tspan><tspan x="89" dy="27">sides of a tiny opening; the hole is enlarged in this model for clarity.</tspan></text></g>
<g class="v2-reading-block" data-block="pinhole-tradeoff-0" transform="translate(0 675)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.39461" data-space-ratio="1.249">A<tspan dx="1.39461"> larger</tspan><tspan dx="1.39461"> hole</tspan><tspan dx="1.39461"> admits</tspan><tspan dx="1.39461"> more</tspan><tspan dx="1.39461"> light,</tspan><tspan dx="1.39461"> often</tspan><tspan dx="1.39461"> giving</tspan><tspan dx="1.39461"> a</tspan><tspan dx="1.39461"> brighter</tspan><tspan dx="1.39461"> but</tspan><tspan dx="1.39461"> less</tspan><tspan dx="1.39461"> distinct</tspan><tspan dx="1.39461"> image</tspan><tspan dx="1.39461"> as</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.10991" data-space-ratio="1.914">neighbouring<tspan dx="5.10991"> object</tspan><tspan dx="5.10991"> points</tspan><tspan dx="5.10991"> overlap.</tspan><tspan dx="5.10991"> A</tspan><tspan dx="5.10991"> smaller</tspan><tspan dx="5.10991"> hole</tspan><tspan dx="5.10991"> often</tspan><tspan dx="5.10991"> improves</tspan><tspan dx="5.10991"> clarity</tspan><tspan dx="5.10991"> but</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="pinhole-tradeoff-1" transform="translate(0 739)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.84898" data-space-ratio="1.509">darkens<tspan dx="2.84898"> the</tspan><tspan dx="2.84898"> image.</tspan><tspan dx="2.84898"> An</tspan><tspan dx="2.84898"> extremely</tspan><tspan dx="2.84898"> tiny</tspan><tspan dx="2.84898"> hole</tspan><tspan dx="2.84898"> is</tspan><tspan dx="2.84898"> not</tspan><tspan dx="2.84898"> automatically</tspan><tspan dx="2.84898"> best:</tspan><tspan dx="2.84898"> diffraction</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="10.85286" data-space-ratio="2.941">eventually<tspan dx="10.85286"> limits</tspan><tspan dx="10.85286"> sharpness.</tspan><tspan dx="10.85286"> Record</tspan><tspan dx="10.85286"> what</tspan><tspan dx="10.85286"> your</tspan><tspan dx="10.85286"> camera</tspan><tspan dx="10.85286"> shows</tspan><tspan dx="10.85286"> rather</tspan><tspan dx="10.85286"> than</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">assuming one size must win.</tspan></text></g>
<g class="v2-reading-block" data-block="image-comparison" transform="translate(0 845)"><g data-comparison-table="image-comparison" data-table-spacing="airy"><text class="v2-table-caption" x="89" y="33.6"><tspan x="89">A shadow, a mirror image and a pinhole image</tspan></text><rect class="se-table-head" x="89" y="54" width="874" height="48"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="86.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="269.06" y="86.08"><tspan x="269.06">Shadow</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="505.04" y="86.08"><tspan x="505.04">Plane-mirror image</tspan></text></g><g data-comparison-cell="3"><text class="v2-table-heading" x="741.02" y="86.08"><tspan x="741.02">Pinhole image</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="102" y2="102"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="134.08"><tspan x="103">Formation</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="269.06" y="134.08"><tspan x="269.06">Light is blocked</tspan><tspan x="269.06" dy="28">from part of a</tspan><tspan x="269.06" dy="28">region.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="505.04" y="134.08"><tspan x="505.04">Reflected paths</tspan><tspan x="505.04" dy="28">appear to start</tspan><tspan x="505.04" dy="28">behind a mirror.</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="741.02" y="134.08"><tspan x="741.02">Light from object</tspan><tspan x="741.02" dy="28">points passes</tspan><tspan x="741.02" dy="28">through a tiny hole.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="206" y2="206"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="238.08"><tspan x="103">Appearance</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="269.06" y="238.08"><tspan x="269.06">Outline depends on</tspan><tspan x="269.06" dy="28">object, source and</tspan><tspan x="269.06" dy="28">screen.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="505.04" y="238.08"><tspan x="505.04">Upright, same size;</tspan><tspan x="505.04" dy="28">laterally inverted.</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="741.02" y="238.08"><tspan x="741.02">Inverted; size</tspan><tspan x="741.02" dy="28">depends on</tspan><tspan x="741.02" dy="28">distances.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="310" y2="310"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="342.08"><tspan x="103">Colour detail</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="269.06" y="342.08"><tspan x="269.06">Does not reproduce</tspan><tspan x="269.06" dy="28">surface colours.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="505.04" y="342.08"><tspan x="505.04">Retains object</tspan><tspan x="505.04" dy="28">colour information.</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="741.02" y="342.08"><tspan x="741.02">Can retain object</tspan><tspan x="741.02" dy="28">colour information.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="386" y2="386"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="418.08"><tspan x="103">Screen</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="269.06" y="418.08"><tspan x="269.06">A surface makes the</tspan><tspan x="269.06" dy="28">shadow visible.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="505.04" y="418.08"><tspan x="505.04">Cannot be directly</tspan><tspan x="505.04" dy="28">projected onto a</tspan><tspan x="505.04" dy="28">screen.</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="741.02" y="418.08"><tspan x="741.02">Forms on a screen</tspan><tspan x="741.02" dy="28">behind the hole.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="490" y2="490"/><rect class="v2-table-frame" x="89" y="54" width="874" height="436"/><line class="v2-table-rule" x1="255.06" x2="255.06" y1="54" y2="490"/><line class="v2-table-rule" x1="491.04" x2="491.04" y1="54" y2="490"/><line class="v2-table-rule" x1="727.02" x2="727.02" y1="54" y2="490"/><text class="v2-table-note" x="89" y="530.88"><tspan x="89">Compare the same criterion across all three columns. A dark silhouette alone cannot</tspan><tspan x="89" dy="26">establish whether you are seeing a shadow or an image; inspect the light path.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
