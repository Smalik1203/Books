<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="image-pause" transform="translate(0 112)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A leaf-shaped dark patch appears on paper. One learner calls it a shadow;</tspan><tspan x="113" dy="32">another calls it a pinhole image. What would you inspect in the arrangement</tspan><tspan x="113" dy="32">to decide between those explanations?</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Your camera shows no clear image. Suggest two changes that improve the</tspan><tspan x="113" dy="32">test without changing the object. Explain why “no visible image” does not yet</tspan><tspan x="113" dy="32">show that light failed to pass through the hole.</tspan></text></g>
<g class="v2-reading-block" data-block="devices" transform="translate(0 440)"><text class="v2-title" x="89" y="38"><tspan x="89">11.8 Building With Reflections</tspan></text></g>
<g class="v2-reading-block" data-block="periscope-heading" transform="translate(0 510)"><text class="se-heading" x="89" y="30"><tspan x="89">11.8.1 A Periscope</tspan></text></g>
<g class="v2-reading-block" data-block="periscope-build-0" transform="translate(0 558)"><text class="se-copy" x="89" y="24"><tspan x="89">To make a simple <tspan class="se-bold">periscope</tspan>, use a tall cardboard tube with an upper opening</tspan><tspan x="89" dy="32">facing one way and a lower opening facing the opposite way. An adult helps</tspan></text></g>
<g class="v2-reading-block" data-block="periscope-build-1" transform="translate(0 622)"><text class="se-copy" x="89" y="24"><tspan x="89">secure two small plane mirrors at the bends. Their reflecting faces must send</tspan><tspan x="89" dy="32">light into the tube and then towards the viewing opening. In this arrangement</tspan><tspan x="89" dy="32">the mirrors are parallel and each is at 45° to the tube’s length.</tspan></text></g>
