<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="holes-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">If a light spot appears with the holes aligned, disappears when one card shifts,</tspan><tspan x="89" dy="32">and returns when it is restored, the repeated change supports a straight path</tspan></text></g>
<g class="v2-reading-block" data-block="holes-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">through the openings. If no spot appears at first, check the torch and alignment.</tspan><tspan x="89" dy="32">An unsuccessful setup cannot establish how light travels.</tspan></text></g>
<g class="v2-reading-block" data-block="tube-task" transform="translate(0 256)"><rect class="se-activity-panel" x="89" y="0" width="874" height="710" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Look through a straight opaque flexible tube towards a small battery LED</tspan><tspan x="146" dy="32">tealight. Keep its lamp a safe distance beyond the tube; never look</tspan><tspan x="146" dy="32">directly into a powerful source.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Bend the tube enough that its open ends no longer have a straight line of</tspan><tspan x="146" dy="32">sight. Keep the same lamp on. Compare what you see and repeat after</tspan><tspan x="146" dy="32">straightening.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Record whether the lamp itself is visible, separately from any faint glow</tspan><tspan x="146" dy="32">inside the tube. Use a dull, dark inner surface.</tspan></text><text class="se-copy" x="113" y="384"><tspan x="113">A battery light avoids fire. If a teacher demonstrates with a candle, keep all</tspan><tspan x="113" dy="32">tubes, hair and clothing away from the flame; learners do not handle it.</tspan></text><image class="science-illustration" data-photo="tube" href="../../figures/class-7/science/ch11/tube.png" x="364.75" y="436" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="681.88"><tspan x="113">Compare a clear straight passage with a bent one using the same source.</tspan></text></g>
<g class="v2-reading-block" data-block="tube-evidence-0" transform="translate(0 988)"><text class="se-copy" x="89" y="24"><tspan x="89">A direct view of the lamp is possible along a straight passage. A sufficiently bent</tspan><tspan x="89" dy="32">opaque tube blocks that route. A shiny tube may reflect some light around a</tspan></text></g>
<g class="v2-reading-block" data-block="tube-evidence-1" transform="translate(0 1052)"><text class="se-copy" x="89" y="24"><tspan x="89">bend, so distinguish a reflected glow from an unobstructed view. Light has not</tspan><tspan x="89" dy="32">curved smoothly around the corner; it may have changed direction at surfaces.</tspan></text></g>
<g class="v2-reading-block" data-block="ray-model-0" transform="translate(0 1132)"><text class="se-copy" x="89" y="24"><tspan x="89">In a uniform transparent medium such as still air, light travels along straight</tspan><tspan x="89" dy="32">paths. We represent a selected path by a <tspan class="se-bold">ray</tspan>, a line with an arrow showing</tspan></text></g>
<g class="v2-reading-block" data-block="ray-model-1" transform="translate(0 1196)"><text class="se-copy" x="89" y="24"><tspan x="89">direction. A beam contains many such paths. Rays are a drawing model, not thin</tspan><tspan x="89" dy="32">threads coming out of the eye.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
