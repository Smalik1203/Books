">Trace<tspan dx="0.51722"> the</tspan><tspan dx="0.51722"> incoming</tspan><tspan dx="0.51722"> and</tspan><tspan dx="0.51722"> outgoing</tspan><tspan dx="0.51722"> bands</tspan><tspan dx="0.51722"> with</tspan><tspan dx="0.51722"> a</tspan><tspan dx="0.51722"> ruler</tspan><tspan dx="0.51722"> after</tspan><tspan dx="0.51722"> marking</tspan><tspan dx="0.51722"> several</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">points.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="2.02803" data-space-ratio="1.363">Turn<tspan dx="2.02803"> only</tspan><tspan dx="2.02803"> the</tspan><tspan dx="2.02803"> mirror</tspan><tspan dx="2.02803"> and</tspan><tspan dx="2.02803"> repeat</tspan><tspan dx="2.02803"> on</tspan><tspan dx="2.02803"> fresh</tspan><tspan dx="2.02803"> paper.</tspan><tspan dx="2.02803"> Describe</tspan><tspan dx="2.02803"> what</tspan><tspan dx="2.02803"> changed.</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="5.42981" data-space-ratio="1.971">Do<tspan dx="5.42981"> not</tspan><tspan dx="5.42981"> aim</tspan><tspan dx="5.42981"> the</tspan><tspan dx="5.42981"> beam</tspan><tspan dx="5.42981"> or</tspan><tspan dx="5.42981"> its</tspan><tspan dx="5.42981"> reflection</tspan><tspan dx="5.42981"> towards</tspan><tspan dx="5.42981"> eyes;</tspan><tspan dx="5.42981"> use</tspan><tspan dx="5.42981"> taped</tspan><tspan dx="5.42981"> mirror</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">edges.</tspan></text><image class="science-illustration" data-photo="reflection-setup" href="../../figures/class-7/science/ch11/reflection-setup.png" x="364.75" y="436" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="681.88"><tspan x="113">Prepare the
