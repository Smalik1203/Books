<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="kaleidoscope-explain-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">repeated images of the pieces. As the pieces move, the arrangement changes,</tspan><tspan x="89" dy="32">creating new patterns; it need not be different after every possible turn. Artists</tspan><tspan x="89" dy="32">and designers can use these repeated forms as starting points for designs.</tspan></text></g>
<g class="v2-reading-block" data-block="kaleidoscope-open-0" transform="translate(0 224)"><text class="se-copy" x="89" y="24"><tspan x="89">An open-ended triangular mirror tube can also repeat parts of an outside scene,</tspan><tspan x="89" dy="32">such as leaves. Compare it with the sealed coloured-piece version. The mirror</tspan></text></g>
<g class="v2-reading-block" data-block="kaleidoscope-open-1" transform="translate(0 288)"><text class="se-copy" x="89" y="24"><tspan x="89">arrangement supplies repeated views, while the objects supply colour and detail.</tspan><tspan x="89" dy="32">Do not confuse a change in objects with a change in the number or angle of</tspan><tspan x="89" dy="32">mirrors.</tspan></text></g>
<g class="v2-reading-block" data-block="device-comparison" transform="translate(0 400)"><g data-comparison-table="device-comparison"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Two devices using more than one reflection</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="277.8" y="70.08"><tspan x="277.8">Simple periscope</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="627.4000000000001" y="70.08"><tspan x="627.4000000000001">Kaleidoscope</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Arrangement</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="277.8" y="110.08"><tspan x="277.8">Two parallel mirrors at bends in</tspan><tspan x="277.8" dy="28">a tube.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="627.4000000000001" y="110.08"><tspan x="627.4000000000001">Three strips facing inward</tspan><tspan x="627.4000000000001" dy="28">around a triangular space.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">Main result</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="277.8" y="178.07999999999998"><tspan x="277.8">A view from beyond an</tspan><tspan x="277.8" dy="28">obstruction.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="627.4000000000001" y="178.07999999999998"><tspan x="627.4000000000001">Repeated images forming</tspan><tspan x="627.4000000000001" dy="28">patterns.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="218" y2="218"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="246.07999999999998"><tspan x="103">What to</tspan><tspan x="103" dy="28">investigate</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="277.8" y="246.07999999999998"><tspan x="277.8">Which path connects object and</tspan><tspan x="277.8" dy="28">eye?</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="627.4000000000001" y="246.07999999999998"><tspan x="627.4000000000001">How do mirror angles and</tspan><tspan x="627.4000000000001" dy="28">moving objects affect patterns?</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="286" y2="286"/><rect class="v2-table-frame" x="89" y="42" width="874" height="244"/><line class="v2-table-rule" x1="263.8" x2="263.8" y1="42" y2="286"/><line class="v2-table-rule" x1="613.4000000000001" x2="613.4000000000001" y1="42" y2="286"/><text class="v2-table-note" x="89" y="318.88"><tspan x="89">Both depend on reflection. Their different arrangements serve different purposes; the</tspan><tspan x="89" dy="26">number of reflections along a particular viewing path need not equal the number of mirrors.</tspan></text></g></g>
<g class="v2-reading-block" data-block="light-time-0" transform="translate(0 766)"><text class="se-copy" x="89" y="24"><tspan x="89">Light takes time to travel. Sunlight takes about 8 minutes 20 seconds to cover the</tspan><tspan x="89" dy="32">average Sun–Earth distance. We therefore see the Sun as it was roughly eight</tspan></text></g>
<g class="v2-reading-block" data-block="light-time-1" transform="translate(0 830)"><text class="se-copy" x="89" y="24"><tspan x="89">minutes earlier. This is a time-of-travel idea, not a suggestion to stare at the Sun.</tspan><tspan x="89" dy="32">The distances in classroom experiments are too short for our eyes to notice such</tspan><tspan x="89" dy="32">a delay.</tspan></text></g>
<g class="v2-reading-block" data-block="connections-pause" transform="translate(0 942)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A mirror lets you see a pen, a periscope lets you see past a barrier, and a</tspan><tspan x="113" dy="32">pinhole camera forms a picture on paper. Trace the route from object to eye</tspan><tspan x="113" dy="32">in each case. Which route needs a screen?</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Choose one observation from the chapter that supports straight-line travel</tspan><tspan x="113" dy="32">and one that supports reflection. Explain why neither observation alone</tspan><tspan x="113" dy="32">proves every claim about light.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
