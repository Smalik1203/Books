<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="26"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 26"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Explore Further</tspan></text></g>
<g class="v2-reading-block" data-block="project-fireflies" transform="translate(0 170)"><text class="se-heading" x="89" y="30"><tspan x="89">1. A local story about fireflies</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Ask older residents whether fireflies were seen locally in the past. Compare</tspan><tspan x="89" dy="32">accounts with any present observations made with an adult from safe paths.</tspan><tspan x="89" dy="32">Record season, weather, time and lighting. Develop an illustrated story</tspan><tspan x="89" dy="32">distinguishing observations, memories and possible explanations. Habitat loss or</tspan><tspan x="89" dy="32">light pollution may be relevant, but interviews alone cannot establish the cause</tspan><tspan x="89" dy="32">of a decline. Never catch the insects.</tspan></text></g>
<g class="v2-reading-block" data-block="project-colours" transform="translate(0 438)"><text class="se-heading" x="89" y="30"><tspan x="89">2. Coloured light and shadows</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Repeat the shadow investigation with a cool battery torch covered by coloured</tspan><tspan x="89" dy="32">transparent film. Change one colour at a time, keeping distances, object and</tspan><tspan x="89" dy="32">screen fixed. Record both the illuminated area and the darker patch. Compare in</tspan><tspan x="89" dy="32">a dim room and with ordinary room light. Explain why a filter changes the light</tspan><tspan x="89" dy="32">reaching the screen without making the shadow a copy of the object’s paint. Do</tspan><tspan x="89" dy="32">not cover hot lamps.</tspan></text></g><g transform="translate(0 706)"><g data-page-illustration="figures/class-7/science/ch11/firefly.png"><image class="science-illustration" href="../../figures/class-7/science/ch11/firefly.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A firefly.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A firefly.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">26</text></g></svg></div></div></section>
