<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reflection-definition-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Reflection</tspan> is the return of light from a surface into the medium it came from. A</tspan><tspan x="89" dy="32">smooth mirror redirects a narrow beam in a definite direction. Turning the</tspan></text></g>
<g class="v2-reading-block" data-block="reflection-definition-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">mirror changes that direction. Dull surfaces also reflect light, but roughness</tspan><tspan x="89" dy="32">spreads it into many directions; that is how a sheet of paper can be seen from</tspan><tspan x="89" dy="32">different places.</tspan></text></g>
<g class="v2-reading-block" data-block="slit-task" transform="translate(0 288)"><rect class="se-activity-panel" x="89" y="0" width="874" height="737" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Cover the gaps of a comb with black paper except for one narrow slit.</tspan><tspan x="146" dy="32">Stand the comb on a white sheet laid flat on a table.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Shine a battery torch through the slit at a shallow angle along the paper.</tspan><tspan x="146" dy="32">Adjust it until a narrow band is visible. Keep the torch and comb still.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Stand a small plane mirror upright in the band’s path. Mark its base.</tspan><tspan x="146" dy="32">Trace the incoming and outgoing bands with a ruler after marking several</tspan><tspan x="146" dy="32">points.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352"><tspan x="146">Turn only the mirror and repeat on fresh paper. Describe what changed.</tspan><tspan x="146" dy="32">Do not aim the beam or its reflection towards eyes; use taped mirror</tspan><tspan x="146" dy="32">edges.</tspan></text><image class="science-illustration" data-photo="reflection-setup" href="../../figures/class-7/science/ch11/reflection-setup.png" x="364.75" y="436" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="681.88"><tspan x="113">Prepare the slit and mirror before tracing the light paths. No result is drawn into the</tspan><tspan x="113" dy="27">setup.</tspan></text></g>
<g class="v2-reading-block" data-block="reflection-evidence-0" transform="translate(0 1047)"><text class="se-copy" x="89" y="24"><tspan x="89">The visible band changes direction at the mirror. Between the slit and mirror,</tspan><tspan x="89" dy="32">and between the mirror and another surface, the path is straight. Reflection is a</tspan></text></g>
<g class="v2-reading-block" data-block="reflection-evidence-1" transform="translate(0 1111)"><text class="se-copy" x="89" y="24"><tspan x="89">change at a boundary, not evidence that light travels in a curved path through the</tspan><tspan x="89" dy="32">surrounding air.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
