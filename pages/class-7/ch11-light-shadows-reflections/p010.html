<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reflection" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">11.5 Reflection of Light</tspan></text></g>
<g class="v2-reading-block" data-block="shiny-question-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">A polished metal plate may block light and cast a shadow, yet also send a bright</tspan><tspan x="89" dy="32">patch elsewhere. Blocking transmission does not mean absorbing every bit of</tspan><tspan x="89" dy="32">light. A surface can return some incident light to its surroundings.</tspan></text></g>
<g class="v2-reading-block" data-block="redirect-task" transform="translate(0 282)"><rect class="se-activity-panel" x="89" y="0" width="874" height="414" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Fix a battery torch so that it illuminates a small plane mirror or shiny flat</tspan><tspan x="146" dy="32">steel plate. Use a stable support and a nearby pale wall or card screen.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Slowly turn the mirror to try to send light towards a marked area on the</tspan><tspan x="146" dy="32">wall. Keep the torch fixed. Record how the spot changes when the mirror</tspan><tspan x="146" dy="32">turns.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Compare a shiny surface with a dull card at the same position. Describe</tspan><tspan x="146" dy="32">any difference in the returned light.</tspan></text><text class="se-copy" x="113" y="352"><tspan x="113">Keep every reflected beam below eye level and away from people. A teacher</tspan><tspan x="113" dy="32">may instead use sunlight, never directing it towards eyes or traffic.</tspan></text></g>
<g class="v2-reading-block" data-block="reflection-definition-0" transform="translate(0 718)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Reflection</tspan> is the return of light from a surface into the medium it came from. A</tspan><tspan x="89" dy="32">smooth mirror redirects a narrow beam in a definite direction. Turning the</tspan></text></g>
<g class="v2-reading-block" data-block="reflection-definition-1" transform="translate(0 782)"><text class="se-copy" x="89" y="24"><tspan x="89">mirror changes that direction. Dull surfaces also reflect light, but roughness</tspan><tspan x="89" dy="32">spreads it into many directions; that is how a sheet of paper can be seen from</tspan><tspan x="89" dy="32">different places.</tspan></text></g><g transform="translate(0 894)"><g data-page-illustration="figures/class-7/science/ch11/mirror-pen.png"><image class="science-illustration" href="../../figures/class-7/science/ch11/mirror-pen.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A pen beside a plane mirror.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A pen beside a plane mirror.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
