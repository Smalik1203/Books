<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="25"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 25"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q7" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">7.</text><text class="se-copy" x="132" y="24"><tspan x="132">This asymmetric tree is viewed through a</tspan><tspan x="132" dy="32">pinhole camera. Sketch its image on the</tspan><tspan x="132" dy="32">screen. Mark the taller side of the crown</tspan><tspan x="132" dy="32">and explain how light from the tree’s top</tspan><tspan x="132" dy="32">reaches the screen.</tspan></text><image class="science-illustration" data-photo="tree" href="../../figures/class-7/science/ch11/tree.png" x="705" y="0" width="180" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="302.88"><tspan x="89">Use the unequal sides of the crown to track orientation.</tspan></text></g>
<g class="v2-reading-block" data-block="q8" transform="translate(0 447)"><text class="se-copy" x="111" y="24" text-anchor="end">8.</text><text class="se-copy" x="132" y="24"><tspan x="132">Write your name on paper and hold it parallel to a plane mirror, facing the</tspan><tspan x="132" dy="32">mirror. Sketch the mirror image. What changes, and what remains the same?</tspan><tspan x="132" dy="32">Explain why a symmetric letter can look unchanged.</tspan></text></g>
<g class="v2-reading-block" data-block="q9" transform="translate(0 573)"><text class="se-copy" x="111" y="24" text-anchor="end">9.</text><text class="se-copy" x="132" y="24"><tspan x="132">With a friend, measure your shadow at 9 AM, 12 PM and 4 PM from the same</tspan><tspan x="132" dy="32">place, using the same posture and method. Never look at the Sun. Which is</tspan><tspan x="132" dy="32">shortest, and how does the Sun’s height explain it? Must the shortest shadow</tspan><tspan x="132" dy="32">occur exactly at clock noon?</tspan></text></g>
<g class="v2-reading-block" data-block="q10" transform="translate(0 731)"><text class="se-copy" x="111" y="24" text-anchor="end">10.</text><text class="se-copy" x="132" y="24"><tspan x="132">A: a plane-mirror image shows lateral inversion. B: symmetric upright block</tspan><tspan x="132" dy="32">capitals T and O appear unchanged in a plane mirror. Choose: (i) both true;</tspan><tspan x="132" dy="32">(ii) both false; (iii) only A true; (iv) only B true. Explain why the letter shapes</tspan><tspan x="132" dy="32">matter.</tspan></text></g>
<g class="v2-reading-block" data-block="q11" transform="translate(0 889)"><text class="se-copy" x="111" y="24" text-anchor="end">11.</text><text class="se-copy" x="132" y="24"><tspan x="132">Could this tube become a periscope using</tspan><tspan x="132" dy="32">two small plane mirrors? Copy the side</tspan><tspan x="132" dy="32">view, mark both mirrors and draw a route</tspan><tspan x="132" dy="32">from the upper opening to the lower one.</tspan><tspan x="132" dy="32">Explain why the tube alone does not</tspan><tspan x="132" dy="32">provide that view.</tspan></text><g class="v2-light-diagram" data-diagram="periscope-question"><path class="v2-light-housing" d="M745 20H910V265H745M745 80H850V205H745"/><text class="v2-light-label" x="725" y="57" text-anchor="end">Upper</text><text class="v2-light-label" x="725" y="240" text-anchor="end">Lower</text></g><text class="se-caption" x="89" y="317.88"><tspan x="89">Both openings face left. Choose mirror orientations for this particular tube.</tspan></text></g>
<g class="v2-reading-block" data-block="q12" transform="translate(0 1239)"><text class="se-copy" x="111" y="24" text-anchor="end">12.</text><text class="se-copy" x="132" y="24"><tspan x="132">A bird flying high may produce no easily visible shadow on the ground, while</tspan><tspan x="132" dy="32">one flying near the ground makes a clearer shadow. Explain using the Sun as</tspan><tspan x="132" dy="32">an extended source and the bird–ground distance. Does an undetectable dark</tspan><tspan x="132" dy="32">patch mean the bird blocks no sunlight?</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">25</text></g></svg></div></div></section>
