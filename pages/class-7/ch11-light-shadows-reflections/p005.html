<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="beam-visibility-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">We see a beam from the side only when some light is scattered towards our eyes.</tspan><tspan x="89" dy="32">A teacher may demonstrate this with a low-power school-approved laser through</tspan></text></g>
<g class="v2-reading-block" data-block="beam-visibility-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">water containing a drop of milk. The beam must end in a fixed non-reflective</tspan><tspan x="89" dy="32">stop, below eye level; only the teacher handles it. Never aim a laser at eyes,</tspan></text></g>
<g class="v2-reading-block" data-block="beam-visibility-2" transform="translate(0 240)"><text class="se-copy" x="89" y="24"><tspan x="89">mirrors, people or animals. A torch provides a safer alternative. Light can change</tspan><tspan x="89" dy="32">direction between materials, and diffraction around edges is studied later;</tspan><tspan x="89" dy="32">straight-line travel is a useful model with stated limits.</tspan></text></g>
<g class="v2-reading-block" data-block="transmission" transform="translate(0 364)"><text class="v2-title" x="89" y="38"><tspan x="89">11.3 Light Through Materials</tspan></text></g>
<g class="v2-reading-block" data-block="materials-question-0" transform="translate(0 422)"><text class="se-copy" x="89" y="24"><tspan x="89">Can you see a clear view through each material, and how much light reaches a</tspan><tspan x="89" dy="32">screen behind it? These questions are related, but they are not identical. Make a</tspan></text></g>
<g class="v2-reading-block" data-block="materials-question-1" transform="translate(0 486)"><text class="se-copy" x="89" y="24"><tspan x="89">prediction before testing glass or clear plastic, tracing paper, ordinary paper,</tspan><tspan x="89" dy="32">cardboard and thick cloth.</tspan></text></g>
<g class="v2-reading-block" data-block="materials-task" transform="translate(0 566)"><rect class="se-activity-panel" x="89" y="0" width="874" height="710" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Fix a torch and white screen in a dim room. Check the screen with no</tspan><tspan x="146" dy="32">sample present. Use safe sample edges; clear plastic can replace glass.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Predict what will happen with each sample between torch and screen.</tspan><tspan x="146" dy="32">Record the prediction before placing the sample in the beam.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Hold each sample at the same marked position, covering the full beam.</tspan><tspan x="146" dy="32">Record the brightness and spread of light on the screen. Also check</tspan><tspan x="146" dy="32">whether a printed shape is clearly visible through the sample in ordinary</tspan><tspan x="146" dy="32">room light.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">4.</text><text class="se-copy" x="146" y="384"><tspan x="146">Compare prediction with observation. Repeat uncertain cases without</tspan><tspan x="146" dy="32">changing sample thickness or distance. Keep torch light away from eyes.</tspan></text><image class="science-illustration" data-photo="materials" href="../../figures/class-7/science/ch11/materials.png" x="364.75" y="436" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="681.88"><tspan x="113">Material samples can transmit, scatter, absorb and reflect light in different proportions.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">5</text></g></svg></div></div></section>
