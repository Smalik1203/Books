<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="17"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 17"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="periscope-use-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Light from an object enters the upper opening, reflects down the tube, then</tspan><tspan x="89" dy="32">reflects towards the eye at the lower opening. Try looking over a low cardboard</tspan></text></g>
<g class="v2-reading-block" data-block="periscope-use-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">barrier. If no view appears, check the mirror positions and clear openings. Tape</tspan><tspan x="89" dy="32">all edges; use small safety mirrors or reflective plastic, not loose broken glass.</tspan><tspan x="89" dy="32">Never aim the device at the Sun or use it to look into private spaces.</tspan></text></g>
<g class="v2-reading-block" data-block="periscope-world-0" transform="translate(0 288)"><text class="se-copy" x="89" y="24"><tspan x="89">Periscopes and related viewing systems let observers see from protected</tspan><tspan x="89" dy="32">positions, including in submarines, armoured vehicles and shelters. Real</tspan></text></g>
<g class="v2-reading-block" data-block="periscope-world-1" transform="translate(0 352)"><text class="se-copy" x="89" y="24"><tspan x="89">instruments may include lenses, prisms or cameras. The simple classroom</tspan><tspan x="89" dy="32">model explains the two-reflection route without reproducing every part of a</tspan><tspan x="89" dy="32">modern instrument.</tspan></text></g>
<g class="v2-reading-block" data-block="kaleidoscope-heading" transform="translate(0 476)"><text class="se-heading" x="89" y="30"><tspan x="89">11.8.2 A Kaleidoscope</tspan></text></g>
<g class="v2-reading-block" data-block="kaleidoscope-build-0" transform="translate(0 524)"><text class="se-copy" x="89" y="24"><tspan x="89">Join three equal-width reflective strips into a triangular tube with the reflective</tspan><tspan x="89" dy="32">faces inward. Fit them inside a cardboard tube. At one end, make a shallow</tspan></text></g>
<g class="v2-reading-block" data-block="kaleidoscope-build-1" transform="translate(0 588)"><text class="se-copy" x="89" y="24"><tspan x="89">sealed chamber with a transparent window, a few smooth coloured plastic pieces</tspan><tspan x="89" dy="32">or beads, and a tracing-paper outer cover. Leave room for the pieces to move. At</tspan></text></g>
<g class="v2-reading-block" data-block="kaleidoscope-build-2" transform="translate(0 652)"><text class="se-copy" x="89" y="24"><tspan x="89">the other end, fit an eyehole cap. Adults cut materials and secure all edges; never</tspan><tspan x="89" dy="32">use broken bangles or glass.</tspan></text></g>
<g class="v2-reading-block" data-block="kaleidoscope-parts" transform="translate(0 732)"><g class="v2-light-diagram" data-diagram="kaleidoscope"><image class="science-illustration" data-art="kaleidoscope" href="../../figures/class-7/science/ch11/kaleidoscope.png" x="263.5" y="0" width="525" height="350" preserveAspectRatio="xMidYMid meet"/></g><text class="se-caption" x="89" y="390.88"><tspan x="89">Parts for a safe kaleidoscope. Use smooth plastic pieces, seal the end chamber and keep small</tspan><tspan x="89" dy="27">parts away from younger children.</tspan></text></g>
<g class="v2-reading-block" data-block="kaleidoscope-explain-0" transform="translate(0 1178)"><text class="se-copy" x="89" y="24"><tspan x="89">Look through the eyehole towards a softly lit window, never towards the Sun.</tspan><tspan x="89" dy="32">Gently turn the tube and compare patterns. Multiple reflections produce</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">17</text></g></svg></div></div></section>
