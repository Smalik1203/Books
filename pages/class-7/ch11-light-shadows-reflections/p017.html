<g class="v2-reading-block" data-block="periscope-build-0" transform="translate(0 558)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.66380" data-space-ratio="1.655">To<tspan dx="3.66380"> make</tspan><tspan dx="3.66380"> a</tspan><tspan dx="3.66380"> simple</tspan><tspan dx="3.66380"> <tspan class="se-bold">periscope</tspan>,</tspan><tspan dx="3.66380"> use</tspan><tspan dx="3.66380"> a</tspan><tspan dx="3.66380"> tall</tspan><tspan dx="3.66380"> cardboard</tspan><tspan dx="3.66380"> tube</tspan><tspan dx="3.66380"> with</tspan><tspan dx="3.66380"> an</tspan><tspan dx="3.66380"> upper</tspan><tspan dx="3.66380"> opening</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.35715" data-space-ratio="1.958">facing<tspan dx="5.35715"> one</tspan><tspan dx="5.35715"> way</tspan><tspan dx="5.35715"> and</tspan><tspan dx="5.35715"> a</tspan><tspan dx="5.35715"> lower</tspan><tspan dx="5.35715"> opening</tspan><tspan dx="5.35715"> facing</tspan><tspan dx="5.35715"> the</tspan><tspan dx="5.35715"> opposite</tspan><tspan dx="5.35715"> way.</tspan><tspan dx="5.35715"> An</tspan><tspan dx="5.35715"> adult</tspan><tspan dx="5.35715"> helps</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="periscope-build-1" transform="translate(0 622)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.16616" data-space-ratio="1.745">secure<tspan dx="4.16616"> two</tspan><tspan dx="4.16616"> small</tspan><tspan dx="4.16616"> plane</tspan><tspan dx="4.16616"> mirrors</tspan><tspan dx="4.16616"> at</tspan><tspan dx="4.16616"> the</tspan><tspan dx="4.16616"> bends.</tspan><tspan dx="4.16616"> Their</tspan><tspan dx="4.16616"> reflecting</tspan><tspan dx="4.16616"> faces</tspan><tspan dx="4.16616"> must</tspan><tspan dx="4.16616"> send</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.54446" data-space-ratio="1.634">light<tspan dx="3.54446"> into</tspan><tspan dx="3.54446"> the</tspan><tspan dx="3.54446"> tube</tspan><tspan dx="3.54446"> and</tspan><tspan dx="3.54446"> then</tspan><tspan dx="3.54446"> towards</tspan><tspan dx="3.54446"> the</tspan><tspan dx="3.54446"> viewing</tspan><tspan dx="3.54446"> opening.</tspan><tspan dx="3.54446"> In</tspan><tspan dx="3.54446"> this</tspan><tspan dx="3.54446"> arrangement</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">the mirrors are parallel and each is at 45° to the tube’s length.</tspan></text></g>
