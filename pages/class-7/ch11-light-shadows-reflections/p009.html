<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="shadow-rays" transform="translate(0 112)"><g class="v2-light-diagram" data-diagram="shadow-rays"><text class="v2-light-label" x="110" y="35" text-anchor="start">Object nearer source</text><rect class="v2-light-screen" x="880" y="15" width="12" height="130"/><rect class="v2-light-shadow" x="880" y="21.310344827586206" width="12" height="117.37931034482759"/><circle class="v2-light-solid" cx="140" cy="80" r="5"/><rect class="v2-light-solid" x="425" y="57" width="10" height="46"/><path class="v2-light-arrow" d="M140 80L880 21.310344827586206M871.6306891961909 26.78342774941785L880 21.310344827586206L870.8726015980059 17.224931946214813"/><path class="v2-light-arrow" d="M140 80L880 138.68965517241378M870.8726015980059 142.77506805378516L880 138.68965517241378L871.6306891961909 133.21657225058215"/><text class="v2-light-label" x="110" y="185" text-anchor="start">Object nearer screen</text><rect class="v2-light-screen" x="880" y="165" width="12" height="130"/><rect class="v2-light-shadow" x="880" y="195.96" width="12" height="68.08"/><circle class="v2-light-solid" cx="140" cy="230" r="5"/><rect class="v2-light-solid" x="635" y="207" width="10" height="46"/><path class="v2-light-arrow" d="M140 230L880 195.96M871.4537472860957 201.15245265265676L880 195.96L871.0131417049462 191.57407045375533"/><path class="v2-light-arrow" d="M140 230L880 264.04M871.0131417049462 268.4259295462447L880 264.04L871.4537472860957 258.84754734734327"/><text class="v2-light-label" x="140" y="325" text-anchor="middle">Small source</text><text class="v2-light-label" x="890" y="325" text-anchor="middle">Screen</text></g><text class="se-caption" x="89" y="360.88"><tspan x="89">A side-view model with a small source. Boundary rays show why a nearby object can block a</tspan><tspan x="89" dy="27">wider part of the screen; the lines are not physical strings.</tspan></text></g>
<g class="v2-reading-block" data-block="shadow-colour-0" transform="translate(0 528)"><text class="se-copy" x="89" y="24"><tspan x="89">A shadow does not reproduce the object’s surface colours. It marks reduced</tspan><tspan x="89" dy="32">illumination. Changing a red opaque ball to an otherwise matching blue one does</tspan></text></g>
<g class="v2-reading-block" data-block="shadow-colour-1" transform="translate(0 592)"><text class="se-copy" x="89" y="24"><tspan x="89">not make the shadow blue. Its appearance also depends on the screen and other</tspan><tspan x="89" dy="32">light reaching it, so shadows need not be perfectly black.</tspan></text></g>
<g class="v2-reading-block" data-block="soft-shadows-0" transform="translate(0 672)"><text class="se-copy" x="89" y="24"><tspan x="89">An extended source sends light from many positions. At some points the object</tspan><tspan x="89" dy="32">blocks only part of the source, making a lighter, soft edge. An opaque object can</tspan></text></g>
<g class="v2-reading-block" data-block="soft-shadows-1" transform="translate(0 736)"><text class="se-copy" x="89" y="24"><tspan x="89">produce a strong shadow; translucent material often makes a weaker one. Even</tspan><tspan x="89" dy="32">clear glass can create darker and brighter patches by reflecting or redirecting</tspan><tspan x="89" dy="32">light. Those patterns depend on shape as well as transparency.</tspan></text></g>
<g class="v2-reading-block" data-block="shadow-pause" transform="translate(0 848)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A learner removes the card screen and says, “The shadow no longer exists.”</tspan><tspan x="113" dy="32">A dark patch is then found on the wall behind it. Explain the difference</tspan><tspan x="113" dy="32">between a shadow region and the surface used to see it.</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Two differently coloured objects cast different-sized shadows. Is colour a fair</tspan><tspan x="113" dy="32">explanation? Identify the positions and object properties you would match</tspan><tspan x="113" dy="32">before testing that claim.</tspan></text></g><g transform="translate(0 1164)"><g data-page-illustration="figures/class-7/science/ch11/shadow-setup.png"><image class="science-illustration" href="../../figures/class-7/science/ch11/shadow-setup.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A shadow investigation setup.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A shadow investigation setup.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
