<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="shadow-colour-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">not make the shadow blue. Its appearance also depends on the screen and other</tspan><tspan x="89" dy="32">light reaching it, so shadows need not be perfectly black.</tspan></text></g>
<g class="v2-reading-block" data-block="soft-shadows-0" transform="translate(0 192)"><text class="se-copy" x="89" y="24"><tspan x="89">An extended source sends light from many positions. At some points the object</tspan><tspan x="89" dy="32">blocks only part of the source, making a lighter, soft edge. An opaque object can</tspan></text></g>
<g class="v2-reading-block" data-block="soft-shadows-1" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">produce a strong shadow; translucent material often makes a weaker one. Even</tspan><tspan x="89" dy="32">clear glass can create darker and brighter patches by reflecting or redirecting</tspan><tspan x="89" dy="32">light. Those patterns depend on shape as well as transparency.</tspan></text></g>
<g class="v2-reading-block" data-block="shadow-pause" transform="translate(0 368)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A learner removes the card screen and says, “The shadow no longer exists.”</tspan><tspan x="113" dy="32">A dark patch is then found on the wall behind it. Explain the difference</tspan><tspan x="113" dy="32">between a shadow region and the surface used to see it.</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Two differently coloured objects cast different-sized shadows. Is colour a fair</tspan><tspan x="113" dy="32">explanation? Identify the positions and object properties you would match</tspan><tspan x="113" dy="32">before testing that claim.</tspan></text></g>
<g class="v2-reading-block" data-block="reflection" transform="translate(0 696)"><text class="v2-title" x="89" y="38"><tspan x="89">11.5 Reflection of Light</tspan></text></g>
<g class="v2-reading-block" data-block="shiny-question-0" transform="translate(0 754)"><text class="se-copy" x="89" y="24"><tspan x="89">A polished metal plate may block light and cast a shadow, yet also send a bright</tspan><tspan x="89" dy="32">patch elsewhere. Blocking transmission does not mean absorbing every bit of</tspan><tspan x="89" dy="32">light. A surface can return some incident light to its surroundings.</tspan></text></g>
<g class="v2-reading-block" data-block="redirect-task" transform="translate(0 866)"><rect class="se-activity-panel" x="89" y="0" width="874" height="414" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Fix a battery torch so that it illuminates a small plane mirror or shiny flat</tspan><tspan x="146" dy="32">steel plate. Use a stable support and a nearby pale wall or card screen.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Slowly turn the mirror to try to send light towards a marked area on the</tspan><tspan x="146" dy="32">wall. Keep the torch fixed. Record how the spot changes when the mirror</tspan><tspan x="146" dy="32">turns.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Compare a shiny surface with a dull card at the same position. Describe</tspan><tspan x="146" dy="32">any difference in the returned light.</tspan></text><text class="se-copy" x="113" y="352"><tspan x="113">Keep every reflected beam below eye level and away from people. A teacher</tspan><tspan x="113" dy="32">may instead use sunlight, never directing it towards eyes or traffic.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
