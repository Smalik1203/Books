<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="led-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">expressed in lumens, as well as power in watts; “LED” does not mean every lamp</tspan><tspan x="89" dy="32">is brighter. India has promoted efficient lighting through programmes such as</tspan></text></g>
<g class="v2-reading-block" data-block="led-2" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">UJALA. Ask an adult to use an appropriate local collection or recycling route for</tspan><tspan x="89" dy="32">spent lamps.</tspan></text></g>
<g class="v2-reading-block" data-block="straight" transform="translate(0 268)"><text class="v2-title" x="89" y="38"><tspan x="89">11.2 Does Light Travel in Straight Lines?</tspan></text></g>
<g class="v2-reading-block" data-block="straight-question-0" transform="translate(0 326)"><text class="se-copy" x="89" y="24"><tspan x="89">A torch beam seems straight, but an impression is not a test. Arrange a path with</tspan><tspan x="89" dy="32">small openings. Predict what will happen when just one opening moves. Keep</tspan></text></g>
<g class="v2-reading-block" data-block="straight-question-1" transform="translate(0 390)"><text class="se-copy" x="89" y="24"><tspan x="89">the source and screen still so that a changed observation has a clear possible</tspan><tspan x="89" dy="32">cause.</tspan></text></g>
<g class="v2-reading-block" data-block="holes-task" transform="translate(0 470)"><rect class="se-activity-panel" x="89" y="0" width="874" height="769" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Ask an adult to make a small hole at the same position in each of three</tspan><tspan x="146" dy="32">empty matchbox trays or stiff cards. Use clean empty boxes with no</tspan><tspan x="146" dy="32">matches. Stand them upright at equal height.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">In a dim room, place a battery torch on one side and a white card screen</tspan><tspan x="146" dy="32">on the other. Align the holes with the lamp. Adjust the supports until you</tspan><tspan x="146" dy="32">can test the path reliably.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Record what appears on the screen. Move only the middle card sideways,</tspan><tspan x="146" dy="32">then restore it. Compare the screen in both positions; repeat to check the</tspan><tspan x="146" dy="32">result.</tspan></text><text class="se-copy" x="113" y="416"><tspan x="113">Do not look into the torch. Adults handle sharp tools. Keep a clear walkway</tspan><tspan x="113" dy="32">and enough room light to move safely.</tspan></text><image class="science-illustration" data-photo="aligned-holes" href="../../figures/class-7/science/ch11/aligned-holes.png" x="203.5" y="468" width="645" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="713.88"><tspan x="113">Align the lamp, three holes and screen before switching on. The drawing shows</tspan><tspan x="113" dy="27">apparatus, not a result.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
