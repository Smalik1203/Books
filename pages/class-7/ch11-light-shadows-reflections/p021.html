<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="21"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 21"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="2.65648" data-space-ratio="1.475">We<tspan dx="2.65648"> see</tspan><tspan dx="2.65648"> objects</tspan><tspan dx="2.65648"> when</tspan><tspan dx="2.65648"> light</tspan><tspan dx="2.65648"> from</tspan><tspan dx="2.65648"> them</tspan><tspan dx="2.65648"> enters</tspan><tspan dx="2.65648"> our</tspan><tspan dx="2.65648"> eyes.</tspan><tspan dx="2.65648"> Luminous</tspan><tspan dx="2.65648"> objects</tspan><tspan dx="2.65648"> emit</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">light; non-luminous objects reflect light from other sources.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="10.90701" data-space-ratio="2.950">Light<tspan dx="10.90701"> follows</tspan><tspan dx="10.90701"> straight</tspan><tspan dx="10.90701"> paths</tspan><tspan dx="10.90701"> in</tspan><tspan dx="10.90701"> a</tspan><tspan dx="10.90701"> uniform</tspan><tspan dx="10.90701"> transparent</tspan><tspan dx="10.90701"> medium.</tspan><tspan dx="10.90701"> Aligned</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">openings and straight-versus-bent passages provide evidence for this model.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="13.74904" data-space-ratio="3.459">Transparent,<tspan dx="13.74904"> translucent</tspan><tspan dx="13.74904"> and</tspan><tspan dx="13.74904"> opaque</tspan><tspan dx="13.74904"> describe</tspan><tspan dx="13.74904"> visible-light</tspan><tspan dx="13.74904"> transmission</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">through particular samples. Thickness, surface finish and scattering matter.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="3.88707" data-space-ratio="1.695">A<tspan dx="3.88707"> shadow</tspan><tspan dx="3.88707"> is</tspan><tspan dx="3.88707"> a</tspan><tspan dx="3.88707"> region</tspan><tspan dx="3.88707"> of</tspan><tspan dx="3.88707"> reduced</tspan><tspan dx="3.88707"> illumination.</tspan><tspan dx="3.88707"> A</tspan><tspan dx="3.88707"> surface</tspan><tspan dx="3.88707"> makes</tspan><tspan dx="3.88707"> it</tspan><tspan dx="3.88707"> visible;</tspan><tspan dx="3.88707"> its</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">shape, size and sharpness depend on the source, object and screen.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="0.71477" data-space-ratio="1.128">A<tspan dx="0.71477"> shadow</tspan><tspan dx="0.71477"> does</tspan><tspan dx="0.71477"> not</tspan><tspan dx="0.71477"> reproduce</tspan><tspan dx="0.71477"> surface</tspan><tspan dx="0.71477"> colours.</tspan><tspan dx="0.71477"> Other</tspan><tspan dx="0.71477"> illumination</tspan><tspan dx="0.71477"> can</tspan><tspan dx="0.71477"> soften</tspan><tspan dx="0.71477"> or</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">lighten it, and clear objects can also redirect light into patterns.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.90923" data-space-ratio="1.341">Smooth<tspan dx="1.90923"> mirrors</tspan><tspan dx="1.90923"> return</tspan><tspan dx="1.90923"> light</tspan><tspan dx="1.90923"> in</tspan><tspan dx="1.90923"> definite</tspan><tspan dx="1.90923"> directions.</tspan><tspan dx="1.90923"> Rough</tspan><tspan dx="1.90923"> surfaces</tspan><tspan dx="1.90923"> reflect</tspan><tspan dx="1.90923"> light</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">too, spreading it into many directions.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="9.07053" data-space-ratio="2.622">A<tspan dx="9.07053"> plane</tspan><tspan dx="9.07053"> mirror</tspan><tspan dx="9.07053"> forms</tspan><tspan dx="9.07053"> an</tspan><tspan dx="9.07053"> upright,</tspan><tspan dx="9.07053"> same-sized</tspan><tspan dx="9.07053"> virtual</tspan><tspan dx="9.07053"> image</tspan><tspan dx="9.07053"> at</tspan><tspan dx="9.07053"> the</tspan><tspan dx="9.07053"> same</tspan></tspan><tspan x="112" dy="32" data-justify-width="851" data-natural-space="5.59200" data-extra-space="4.51397" data-space-ratio="1.807">perpendicular<tspan dx="4.51397"> distance</tspan><tspan dx="4.51397"> behind</tspan><tspan dx="4.51397"> the</tspan><tspan dx="4.51397"> mirror</tspan><tspan dx="4.51397"> as</tspan><tspan dx="4.51397"> the</tspan><tspan dx="4.51397"> object</tspan><tspan dx="4.51397"> is</tspan><tspan dx="4.51397"> in</tspan><tspan dx="4.51397"> front.</tspan><tspan dx="4.51397"> It</tspan><tspan dx="4.51397"> shows</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">lateral inversion.</tspan></text><text class="se-copy" x="89" y="754" text-anchor="start">•</text><text class="se-copy" x="112" y="754" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="2.01835" data-space-ratio="1.361">A<tspan dx="2.01835"> pinhole</tspan><tspan dx="2.01835"> image</tspan><tspan dx="2.01835"> is</tspan><tspan dx="2.01835"> inverted</tspan><tspan dx="2.01835"> and</tspan><tspan dx="2.01835"> forms</tspan><tspan dx="2.01835"> on</tspan><tspan dx="2.01835"> a</tspan><tspan dx="2.01835"> screen.</tspan><tspan dx="2.01835"> Its</tspan><tspan dx="2.01835"> colours</tspan><tspan dx="2.01835"> come</tspan><tspan dx="2.01835"> from</tspan><tspan dx="2.01835"> the</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">object; its scale, brightness and sharpness depend on the arrangement.</tspan></text><text class="se-copy" x="89" y="828" text-anchor="start">•</text><text class="se-copy" x="112" y="828" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="0.89109" data-space-ratio="1.159">A<tspan dx="0.89109"> simple</tspan><tspan dx="0.89109"> periscope</tspan><tspan dx="0.89109"> redirects</tspan><tspan dx="0.89109"> a</tspan><tspan dx="0.89109"> view</tspan><tspan dx="0.89109"> with</tspan><tspan dx="0.89109"> two</tspan><tspan dx="0.89109"> mirrors.</tspan><tspan dx="0.89109"> A</tspan><tspan dx="0.89109"> kaleidoscope</tspan><tspan dx="0.89109"> produces</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">repeated patterns through multiple reflections.</tspan></text><text class="se-copy" x="89" y="902" text-anchor="start">•</text><text class="se-copy" x="112" y="902" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.95417" data-space-ratio="1.349">Keep<tspan dx="1.95417"> strong</tspan><tspan dx="1.95417"> and</tspan><tspan dx="1.95417"> reflected</tspan><tspan dx="1.95417"> beams</tspan><tspan dx="1.95417"> away</tspan><tspan dx="1.95417"> from</tspan><tspan dx="1.95417"> eyes.</tspan><tspan dx="1.95417"> Never</tspan><tspan dx="1.95417"> view</tspan><tspan dx="1.95417"> the</tspan><tspan dx="1.95417"> Sun</tspan><tspan dx="1.95417"> through</tspan></tspan><tspan x="112" dy="32" data-justify-width="851" data-natural-space="5.59200" data-extra-space="5.49960" data-space-ratio="1.983">an<tspan dx="5.49960"> optical</tspan><tspan dx="5.49960"> device.</tspan><tspan dx="5.49960"> Record</tspan><tspan dx="5.49960"> uncertain</tspan><tspan dx="5.49960"> results</tspan><tspan dx="5.49960"> and</tspan><tspan dx="5.49960"> check</tspan><tspan dx="5.49960"> the</tspan><tspan dx="5.49960"> apparatus</tspan><tspan dx="5.49960"> before</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">drawing conclusions.</tspan></text><g transform="translate(0 984)"><g data-page-illustration="figures/class-6/science/ch12/telescope.png"><image class="science-illustration" href="../../figures/class-6/science/ch12/telescope.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Optical instruments use the behaviour of light.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Optical instruments use the behaviour of light.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">21</text></g></svg></div></div></section>
