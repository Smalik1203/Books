<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="21"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 21"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="814" rx="18"/><text class="se-copy" x="113" y="222"><tspan x="113"><tspan class="se-bold">Luminous</tspan> — Emitting its own</tspan><tspan x="113" dy="32">visible light.</tspan></text><text class="se-copy" x="113" y="306"><tspan x="113"><tspan class="se-bold">Non-luminous</tspan> — Seen by light from</tspan><tspan x="113" dy="32">other sources, rather than its own</tspan><tspan x="113" dy="32">visible emission.</tspan></text><text class="se-copy" x="113" y="422"><tspan x="113"><tspan class="se-bold">Ray</tspan> — A model line showing a light</tspan><tspan x="113" dy="32">path and its direction.</tspan></text><text class="se-copy" x="113" y="506"><tspan x="113"><tspan class="se-bold">Transparent</tspan> — Transmitting light</tspan><tspan x="113" dy="32">with little scattering so a clear view</tspan><tspan x="113" dy="32">is possible.</tspan></text><text class="se-copy" x="113" y="622"><tspan x="113"><tspan class="se-bold">Translucent</tspan> — Transmitting light</tspan><tspan x="113" dy="32">while scattering it so a view is</tspan><tspan x="113" dy="32">blurred.</tspan></text><text class="se-copy" x="113" y="738"><tspan x="113"><tspan class="se-bold">Opaque</tspan> — Transmitting negligible</tspan><tspan x="113" dy="32">visible light at the stated thickness.</tspan></text><text class="se-copy" x="113" y="822"><tspan x="113"><tspan class="se-bold">Shadow</tspan> — A region receiving less</tspan><tspan x="113" dy="32">light because some paths are</tspan><tspan x="113" dy="32">blocked.</tspan></text><text class="se-copy" x="541" y="222"><tspan x="541"><tspan class="se-bold">Reflection</tspan> — Light returning from a</tspan><tspan x="541" dy="32">surface into the medium it came</tspan><tspan x="541" dy="32">from.</tspan></text><text class="se-copy" x="541" y="338"><tspan x="541"><tspan class="se-bold">Plane</tspan> <tspan class="se-bold">mirror</tspan> — A mirror with a flat</tspan><tspan x="541" dy="32">reflecting surface.</tspan></text><text class="se-copy" x="541" y="422"><tspan x="541"><tspan class="se-bold">Virtual</tspan> <tspan class="se-bold">image</tspan> — An apparent origin</tspan><tspan x="541" dy="32">of light where the rays do not</tspan><tspan x="541" dy="32">actually meet.</tspan></text><text class="se-copy" x="541" y="538"><tspan x="541"><tspan class="se-bold">Lateral</tspan> <tspan class="se-bold">inversion</tspan> — The familiar</tspan><tspan x="541" dy="32">apparent left–right reversal of a</tspan><tspan x="541" dy="32">mirror image.</tspan></text><text class="se-copy" x="541" y="654"><tspan x="541"><tspan class="se-bold">Pinhole</tspan> <tspan class="se-bold">camera</tspan> — A light-shielded</tspan><tspan x="541" dy="32">device forming an image through a</tspan><tspan x="541" dy="32">tiny opening.</tspan></text><text class="se-copy" x="541" y="770"><tspan x="541"><tspan class="se-bold">Periscope</tspan> — A device using</tspan><tspan x="541" dy="32">reflections to provide a view past an</tspan><tspan x="541" dy="32">obstruction.</tspan></text><text class="se-copy" x="541" y="886"><tspan x="541"><tspan class="se-bold">Kaleidoscope</tspan> — A device using</tspan><tspan x="541" dy="32">multiple reflections to make</tspan><tspan x="541" dy="32">repeated patterns.</tspan></text><g transform="translate(0 988)"><g data-page-illustration="figures/class-7/science/ch11/shadow-setup.png"><image class="science-illustration" href="../../figures/class-7/science/ch11/shadow-setup.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A shadow investigation setup.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A shadow investigation setup.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">21</text></g></svg></div></div></section>
