<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="sources" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">11.1 Sources of Light</tspan></text></g>
<g class="v2-reading-block" data-block="seeing-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">We see an object when light from it enters our eyes. Some objects emit visible</tspan><tspan x="89" dy="32">light; others become visible because they reflect light falling on them. A book in</tspan></text></g>
<g class="v2-reading-block" data-block="seeing-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">a completely dark room cannot be seen merely by opening our eyes wider. Light</tspan><tspan x="89" dy="32">must reach the book and then reach our eyes.</tspan></text></g>
<g class="v2-reading-block" data-block="luminous" transform="translate(0 314)"><g data-comparison-table="luminous"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Making light and reflecting light</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="277.8" y="70.08"><tspan x="277.8">Luminous object</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="627.4000000000001" y="70.08"><tspan x="627.4000000000001">Non-luminous object</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Visible light</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="277.8" y="110.08"><tspan x="277.8">Emits its own light.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="627.4000000000001" y="110.08"><tspan x="627.4000000000001">Does not emit its own visible</tspan><tspan x="627.4000000000001" dy="28">light.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">Examples</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="277.8" y="178.07999999999998"><tspan x="277.8">Sun, other stars, a glowing</tspan><tspan x="277.8" dy="28">firefly, a lit lamp.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="627.4000000000001" y="178.07999999999998"><tspan x="627.4000000000001">Moon, a book, a mirror, an unlit</tspan><tspan x="627.4000000000001" dy="28">lamp.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="218" y2="218"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="246.07999999999998"><tspan x="103">How we see it</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="277.8" y="246.07999999999998"><tspan x="277.8">Some emitted light reaches our</tspan><tspan x="277.8" dy="28">eyes.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="627.4000000000001" y="246.07999999999998"><tspan x="627.4000000000001">Light from another source is</tspan><tspan x="627.4000000000001" dy="28">reflected towards our eyes.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="286" y2="286"/><rect class="v2-table-frame" x="89" y="42" width="874" height="244"/><line class="v2-table-rule" x1="263.8" x2="263.8" y1="42" y2="286"/><line class="v2-table-rule" x1="613.4000000000001" x2="613.4000000000001" y1="42" y2="286"/><text class="v2-table-note" x="89" y="318.88"><tspan x="89">Describe the object in its present condition: the same lamp can be lit or unlit. A mirror</tspan><tspan x="89" dy="26">redirects light; it is not a source of its own visible light.</tspan></text></g></g>
<g class="v2-reading-block" data-block="natural-artificial-0" transform="translate(0 680)"><text class="se-copy" x="89" y="24"><tspan x="89">The Sun is Earth’s main natural light source; moonlight is reflected sunlight.</tspan><tspan x="89" dy="32">Other stars, lightning, natural fires and some animals also emit light. People have</tspan></text></g>
<g class="v2-reading-block" data-block="natural-artificial-1" transform="translate(0 744)"><text class="se-copy" x="89" y="24"><tspan x="89">used controlled fires and lamps burning oil, wax or gas for lighting. Electric</tspan><tspan x="89" dy="32">lamps convert electrical energy into light; electricity was discovered and</tspan><tspan x="89" dy="32">harnessed, not invented.</tspan></text></g>
<g class="v2-reading-block" data-block="fireflies" transform="translate(0 856)"><text class="se-heading" x="89" y="30"><tspan x="89">Light has living roles</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Fireflies are beetles. Many use light signals in</tspan><tspan x="89" dy="32">finding mates. Artificial light at night can disrupt</tspan><tspan x="89" dy="32">those signals; habitat loss and careless tourism</tspan><tspan x="89" dy="32">can also threaten populations. Watch from</tspan><tspan x="89" dy="32">paths, keep unnecessary lights off and leave</tspan><tspan x="89" dy="32">insects undisturbed. A night with no sightings</tspan><tspan x="89" dy="32">does not by itself prove that a local population</tspan><tspan x="89" dy="32">has disappeared.</tspan></text><image class="science-illustration" data-photo="firefly" href="../../figures/class-7/science/ch11/firefly.png" x="688.6330275229358" y="8" width="240.73394495412845" height="220" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="655" y="258.88"><tspan x="655">A firefly’s glow is light produced</tspan><tspan x="655" dy="27">by a living organism.</tspan></text></g>
<g class="v2-reading-block" data-block="led-0" transform="translate(0 1198)"><text class="se-copy" x="89" y="24"><tspan x="89">For a similar light output, an efficient LED lamp usually uses less electrical power</tspan><tspan x="89" dy="32">and lasts longer than a traditional incandescent lamp. Compare brightness,</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
