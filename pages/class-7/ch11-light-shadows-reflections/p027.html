<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="27" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 27"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-mirrors" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">3. More than one mirror</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">With an adult, secure two small mirrors with taped edges. Place one coloured</tspan><tspan x="89" dy="32">object between them and compare views with the mirrors at several angles, then</tspan><tspan x="89" dy="32">parallel. Sketch and count the images you can actually distinguish. State the</tspan><tspan x="89" dy="32">angle and viewing position. Explain how an image in one mirror can be reflected</tspan><tspan x="89" dy="32">in the other; do not assume a finite, dim view shows every theoretically possible</tspan><tspan x="89" dy="32">image.</tspan></text></g>
<g class="v2-reading-block" data-block="project-small-mirror" transform="translate(0 380)"><text class="se-heading" x="89" y="30"><tspan x="89">4. A small mirror and a large tree</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Predict whether a small plane mirror can show a tree much larger than itself. Use</tspan><tspan x="89" dy="32">a mirror with safe edges to view a distant tree while keeping the Sun behind you</tspan><tspan x="89" dy="32">and out of every reflected view. Change your eye’s position and distance from the</tspan><tspan x="89" dy="32">mirror; record which parts are visible. Explain the difference between image size</tspan><tspan x="89" dy="32">and the portion of a view admitted by a small mirror. Never use a loose broken</tspan><tspan x="89" dy="32">piece.</tspan></text></g><g transform="translate(0 648)"><g data-page-illustration="figures/class-7/science/ch11/mirror-pen.png"><image class="science-illustration" href="../../figures/class-7/science/ch11/mirror-pen.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A pen beside a plane mirror.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A pen beside a plane mirror.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">27</text></g></svg></div></div></section>
