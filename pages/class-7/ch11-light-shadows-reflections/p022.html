<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="22"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 22"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204"><tspan x="112">We see objects when light from them enters our eyes. Luminous objects emit</tspan><tspan x="112" dy="32">light; non-luminous objects reflect light from other sources.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278"><tspan x="112">Light follows straight paths in a uniform transparent medium. Aligned</tspan><tspan x="112" dy="32">openings and straight-versus-bent passages provide evidence for this model.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352"><tspan x="112">Transparent, translucent and opaque describe visible-light transmission</tspan><tspan x="112" dy="32">through particular samples. Thickness, surface finish and scattering matter.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426"><tspan x="112">A shadow is a region of reduced illumination. A surface makes it visible; its</tspan><tspan x="112" dy="32">shape, size and sharpness depend on the source, object and screen.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500"><tspan x="112">A shadow does not reproduce surface colours. Other illumination can soften or</tspan><tspan x="112" dy="32">lighten it, and clear objects can also redirect light into patterns.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574"><tspan x="112">Smooth mirrors return light in definite directions. Rough surfaces reflect light</tspan><tspan x="112" dy="32">too, spreading it into many directions.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648"><tspan x="112">A plane mirror forms an upright, same-sized virtual image at the same</tspan><tspan x="112" dy="32">perpendicular distance behind the mirror as the object is in front. It shows</tspan><tspan x="112" dy="32">lateral inversion.</tspan></text><text class="se-copy" x="89" y="754" text-anchor="start">•</text><text class="se-copy" x="112" y="754"><tspan x="112">A pinhole image is inverted and forms on a screen. Its colours come from the</tspan><tspan x="112" dy="32">object; its scale, brightness and sharpness depend on the arrangement.</tspan></text><text class="se-copy" x="89" y="828" text-anchor="start">•</text><text class="se-copy" x="112" y="828"><tspan x="112">A simple periscope redirects a view with two mirrors. A kaleidoscope produces</tspan><tspan x="112" dy="32">repeated patterns through multiple reflections.</tspan></text><text class="se-copy" x="89" y="902" text-anchor="start">•</text><text class="se-copy" x="112" y="902"><tspan x="112">Keep strong and reflected beams away from eyes. Never view the Sun through</tspan><tspan x="112" dy="32">an optical device. Record uncertain results and check the apparatus before</tspan><tspan x="112" dy="32">drawing conclusions.</tspan></text><g transform="translate(0 984)"><g data-page-illustration="figures/class-7/science/ch11/shadow-setup.png"><image class="science-illustration" href="../../figures/class-7/science/ch11/shadow-setup.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A shadow investigation setup.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A shadow investigation setup.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">22</text></g></svg></div></div></section>
