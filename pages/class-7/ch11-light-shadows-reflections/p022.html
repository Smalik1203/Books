<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="22"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 22"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q4" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24"><tspan x="132">A boy stands on level ground with a small lamp above and to his left. Which</tspan><tspan x="132" dy="32">shadow arrangement is possible: (a) extending left towards the lamp; (b)</tspan><tspan x="132" dy="32">extending right, away from the lamp; (c) floating above his head; (d) a</tspan><tspan x="132" dy="32">coloured copy of his clothes? Draw the boy, lamp and shadow, and explain</tspan><tspan x="132" dy="32">your choice.</tspan></text></g>
<g class="v2-reading-block" data-block="q5" transform="translate(0 302)"><text class="se-copy" x="111" y="24" text-anchor="end">5.</text><text class="se-copy" x="132" y="24"><tspan x="132">A ball is placed between a small fixed torch and a fixed wall. In case (i) it is</tspan><tspan x="132" dy="32">nearer the torch; in case (ii) it is nearer the wall. Choose the better</tspan><tspan x="132" dy="32">prediction: (a) the shadow is larger in (i) than in (ii); (b) it is smaller in (i)</tspan><tspan x="132" dy="32">than in (ii). Use boundary rays to explain your answer.</tspan></text><g transform="translate(0 144)"><g class="v2-light-diagram" data-diagram="shadow-question"><image class="science-illustration" data-art="shadow-setup" href="../../figures/class-7/science/ch11/shadow-setup.png" x="316" y="0" width="420" height="210" preserveAspectRatio="xMidYMid meet"/></g></g><text class="se-caption" x="89" y="394.88"><tspan x="89">Move the same ball along the source–screen line. The drawing identifies the apparatus; draw</tspan><tspan x="89" dy="27">your own predicted shadows.</tspan></text></g>
<g class="v2-reading-block" data-block="q6" transform="translate(0 756)"><text class="se-copy" x="111" y="24" text-anchor="end">6.</text><text class="se-copy" x="132" y="24"><tspan x="132">Keep the ball and wall fixed. Match each change with its likely result. State</tspan><tspan x="132" dy="32">how two torches must be positioned for two shadows to be distinguishable.</tspan></text><g transform="translate(0 80)"><g data-comparison-table="q6-matching"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Changes and possible results</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Change</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="505.04" y="70.08"><tspan x="505.04">Result (shuffled)</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Torch nearer the ball</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="505.04" y="110.08"><tspan x="505.04">A. Smaller shadow.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="122" y2="122"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="150.07999999999998"><tspan x="103">Torch farther from the ball</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="505.04" y="150.07999999999998"><tspan x="505.04">B. Larger shadow.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="162" y2="162"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="190.07999999999998"><tspan x="103">Ball removed</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="505.04" y="190.07999999999998"><tspan x="505.04">C. Two displaced shadows, possibly</tspan><tspan x="505.04" dy="28">overlapping.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="230" y2="230"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="258.08"><tspan x="103">Two separated torches used</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="505.04" y="258.08"><tspan x="505.04">D. Unobstructed illuminated patch.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="270" y2="270"/><rect class="v2-table-frame" x="89" y="42" width="874" height="228"/><line class="v2-table-rule" x1="491.04" x2="491.04" y1="42" y2="270"/><text class="v2-table-note" x="89" y="302.88"><tspan x="89">Use a small source and compare with the original arrangement. The rows are not supplied</tspan><tspan x="89" dy="26">answers.</tspan></text></g></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">22</text></g></svg></div></div></section>
