<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="pinhole" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">11.7 A Pinhole Camera</tspan></text></g>
<g class="v2-reading-block" data-block="pinhole-question-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Can light form an image on a screen without a mirror? A tiny opening admits</tspan><tspan x="89" dy="32">narrow bundles of light from different parts of an object. First investigate a</tspan><tspan x="89" dy="32">simple arrangement; then build an enclosed version that reduces stray light.</tspan></text></g>
<g class="v2-reading-block" data-block="pinhole-task" transform="translate(0 282)"><rect class="se-activity-panel" x="89" y="0" width="874" height="510" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">An adult makes a small clean pinhole in an opaque card. Place the card</tspan><tspan x="146" dy="32">between a bright battery LED shape and a tracing-paper screen in a dim</tspan><tspan x="146" dy="32">room.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Shield the sides with dark card so stray light does not brighten the screen.</tspan><tspan x="146" dy="32">Move the screen slowly until you can distinguish an image; note its</tspan><tspan x="146" dy="32">orientation and colour.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Change only the hole size by substituting a second card at the same</tspan><tspan x="146" dy="32">position. Compare brightness and clarity; keep the object and screen</tspan><tspan x="146" dy="32">fixed.</tspan></text><text class="se-copy" x="113" y="416"><tspan x="113">A teacher may demonstrate with a candle in a stable holder with clear space.</tspan><tspan x="113" dy="32">Learners do not handle flames. Adults use pins or blades; never view the Sun</tspan><tspan x="113" dy="32">through this apparatus.</tspan></text></g>
<g class="v2-reading-block" data-block="pinhole-explanation-0" transform="translate(0 814)"><text class="se-copy" x="89" y="24"><tspan x="89">The image is inverted. Light from the top of the object travels through the hole to</tspan><tspan x="89" dy="32">the lower part of the screen; light from the bottom reaches the upper part. The</tspan></text></g>
<g class="v2-reading-block" data-block="pinhole-explanation-1" transform="translate(0 878)"><text class="se-copy" x="89" y="24"><tspan x="89">paths cross at the opening. No ray has to bend there. The image can retain</tspan><tspan x="89" dy="32">colours because light from different object parts reaches different screen</tspan><tspan x="89" dy="32">regions.</tspan></text></g><g transform="translate(0 990)"><g data-page-illustration="figures/class-7/science/ch11/pinhole-kit.png"><image class="science-illustration" href="../../figures/class-7/science/ch11/pinhole-kit.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Parts of a pinhole camera.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Parts of a pinhole camera.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">15</text></g></svg></div></div></section>
