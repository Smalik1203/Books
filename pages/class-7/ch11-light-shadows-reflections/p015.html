<section class="page page--food page--science-editorial page--science-v2 page--g7-ch11" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Light: Shadows and Reflections, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-light-motif" transform="translate(22 8) scale(.42)"><path d="M15 98L47 44L86 96M47 44V6M47 44L10 21M47 44L89 20M14 104H88M25 112H78"/><circle cx="47" cy="44" r="6"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 11</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Light: Shadows and Reflections</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="camera-distance-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">distant scene. The movement changes image scale; a pinhole has no lens to focus</tspan><tspan x="89" dy="32">like a camera lens. Better shading may reveal an image that seemed absent in a</tspan><tspan x="89" dy="32">bright viewing opening.</tspan></text></g>
<g class="v2-reading-block" data-block="pinhole-rays" transform="translate(0 224)"><g class="v2-light-diagram" data-diagram="pinhole-rays"><image class="science-illustration" data-art="tree" href="../../figures/class-7/science/ch11/tree.png" x="113.66666666666667" y="70" width="166.66666666666666" height="250" preserveAspectRatio="xMidYMid meet"/><rect class="v2-light-solid" x="519.5" y="40" width="13" height="138"/><rect class="v2-light-solid" x="519.5" y="190" width="13" height="140"/><g transform="translate(1052 368) rotate(180)"><image class="science-illustration" data-art="tree" href="../../figures/class-7/science/ch11/tree.png" x="113.66666666666667" y="70" width="166.66666666666666" height="250" preserveAspectRatio="xMidYMid meet"/></g><path class="v2-light-arrow" d="M170 80L882 288M872.2318913304676 290.14104017248786L882 288L874.9206451794245 280.9372289202896"/><path class="v2-light-arrow" d="M205 306L847 62M840.4999206813494 69.59927423187578L847 62L837.0934233840856 60.63627724481249"/><text class="v2-light-label" x="195" y="355" text-anchor="middle">Object</text><text class="v2-light-label" x="526" y="30" text-anchor="middle">Pinhole</text><text class="v2-light-label" x="855" y="355" text-anchor="middle">Image on screen</text></g><text class="se-caption" x="89" y="395.88"><tspan x="89">Two representative paths explain the inverted image. The object and screen are on opposite</tspan><tspan x="89" dy="27">sides of a tiny opening; the hole is enlarged in this model for clarity.</tspan></text></g>
<g class="v2-reading-block" data-block="pinhole-tradeoff-0" transform="translate(0 675)"><text class="se-copy" x="89" y="24"><tspan x="89">A larger hole admits more light, often giving a brighter but less distinct image as</tspan><tspan x="89" dy="32">neighbouring object points overlap. A smaller hole often improves clarity but</tspan></text></g>
<g class="v2-reading-block" data-block="pinhole-tradeoff-1" transform="translate(0 739)"><text class="se-copy" x="89" y="24"><tspan x="89">darkens the image. An extremely tiny hole is not automatically best: diffraction</tspan><tspan x="89" dy="32">eventually limits sharpness. Record what your camera shows rather than</tspan><tspan x="89" dy="32">assuming one size must win.</tspan></text></g>
<g class="v2-reading-block" data-block="image-comparison" transform="translate(0 851)"><g data-comparison-table="image-comparison"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">A shadow, a mirror image and a pinhole image</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="269.06" y="70.08"><tspan x="269.06">Shadow</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="505.04" y="70.08"><tspan x="505.04">Plane-mirror image</tspan></text></g><g data-comparison-cell="3"><text class="v2-table-heading" x="741.02" y="70.08"><tspan x="741.02">Pinhole image</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Formation</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="269.06" y="110.08"><tspan x="269.06">Light is blocked</tspan><tspan x="269.06" dy="28">from part of a</tspan><tspan x="269.06" dy="28">region.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="505.04" y="110.08"><tspan x="505.04">Reflected paths</tspan><tspan x="505.04" dy="28">appear to start</tspan><tspan x="505.04" dy="28">behind a mirror.</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="741.02" y="110.08"><tspan x="741.02">Light from object</tspan><tspan x="741.02" dy="28">points passes</tspan><tspan x="741.02" dy="28">through a tiny hole.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="206.07999999999998"><tspan x="103">Appearance</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="269.06" y="206.07999999999998"><tspan x="269.06">Outline depends on</tspan><tspan x="269.06" dy="28">object, source and</tspan><tspan x="269.06" dy="28">screen.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="505.04" y="206.07999999999998"><tspan x="505.04">Upright, same size;</tspan><tspan x="505.04" dy="28">laterally inverted.</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="741.02" y="206.07999999999998"><tspan x="741.02">Inverted; size</tspan><tspan x="741.02" dy="28">depends on</tspan><tspan x="741.02" dy="28">distances.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="274" y2="274"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="302.08"><tspan x="103">Colour detail</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="269.06" y="302.08"><tspan x="269.06">Does not reproduce</tspan><tspan x="269.06" dy="28">surface colours.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="505.04" y="302.08"><tspan x="505.04">Retains object</tspan><tspan x="505.04" dy="28">colour information.</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="741.02" y="302.08"><tspan x="741.02">Can retain object</tspan><tspan x="741.02" dy="28">colour information.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="342" y2="342"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="370.08"><tspan x="103">Screen</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="269.06" y="370.08"><tspan x="269.06">A surface makes the</tspan><tspan x="269.06" dy="28">shadow visible.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="505.04" y="370.08"><tspan x="505.04">Cannot be directly</tspan><tspan x="505.04" dy="28">projected onto a</tspan><tspan x="505.04" dy="28">screen.</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="741.02" y="370.08"><tspan x="741.02">Forms on a screen</tspan><tspan x="741.02" dy="28">behind the hole.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="438" y2="438"/><rect class="v2-table-frame" x="89" y="42" width="874" height="396"/><line class="v2-table-rule" x1="255.06" x2="255.06" y1="42" y2="438"/><line class="v2-table-rule" x1="491.04" x2="491.04" y1="42" y2="438"/><line class="v2-table-rule" x1="727.02" x2="727.02" y1="42" y2="438"/><text class="v2-table-note" x="89" y="470.88"><tspan x="89">Compare the same criterion across all three columns. A dark silhouette alone cannot</tspan><tspan x="89" dy="26">establish whether you are seeing a shadow or an image; inspect the light path.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">15</text></g></svg></div></div></section>
