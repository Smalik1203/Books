<g class="v2-reading-block" data-block="q3" transform="translate(0 730)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24"><tspan x="132">Sahil, Rekha, Patrick and Qasima look through the labelled openings towards</tspan><tspan x="132" dy="32">the lit LED at the right. The tube is opaque, with dull inner walls and no</tspan><tspan x="132" dy="32">mirrors. Who has a direct view of the source? Trace the possible paths and</tspan><tspan x="132" dy="32">explain.</tspan></text><g transform="translate(0 144)"><g class="v2-light-diagram" data-diagram="pipe-question"><image class="science-illustration" data-art="pipe-question" href="../../figures/class-7/science/ch11/pipe-question.png" x="266" y="35" width="580" height="290" preserveAspectRatio="xMidYMid meet"/><text class="v2-light-label" x="270" y="28" text-anchor="start">Sahil</text><text class="v2-light-label" x="191" y="180" text-anchor="end">Rekha</text><text class="v2-light-label" x="270" y="349" text-anchor="start">Patrick</text><text class="v2-light-label" x="640" y="349" text-anchor="start">Qasima</text><text class="v2-light-label" x="844" y="28" text-anchor="start">LED</text></g></g><text class="se-caption" x="89" y="524.88"><tspan x="89">Each name marks a viewing opening. The branches join one horizontal passage.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">23</text></g></svg></div></div></section>
