<text class="se-copy se-table-copy" x="260.32" y="110.08"><tspan x="260.32">Diaphragm contracts and moves</tspan><tspan x="260.32" dy="28">down; ribs move up and out.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="110.08"><tspan x="618.6600000000001">Diaphragm and rib muscles</tspan><tspan x="618.6600000000001" dy="28">relax; ribs return and diaphragm</tspan><tspan x="618.6600000000001" dy="28">rises.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="206.07999999999998"><tspan x="103">Volume and</tspan><tspan x="103" dy="28">pressure</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="206.07999999999998"><tspan x="260.32">Chest volume increases;</tspan><tspan x="260.32" dy="28">pressure inside the lungs falls</tspan><tspan x="260.32" dy="28">below outside pressure.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="206.07999999999998"><tspan x="618.6600000000001">Elastic recoil reduces chest and</tspan><tspan x="618.6600000000001" dy="28">lung volume.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="274" y2="274"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="302.08"><tspan x="103">Air</tspan><tspan x="103" dy="28">movement</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="302.08"><tspan x="260.32">Air enters and lungs expand.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="302.08"><tspan x="618.6600000000001">Air leaves as pressure inside</tspan><tspan x="618.6600000000001" dy="28">rises above outside pressure.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="342" y2="342"/><rect class="v2-table-frame" x="89" y="42" width="874" height="300"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="42" y2="342"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="42" y2="342"/></g></g>
<g class="v2-reading-block" data-block="model-limits-0" transform="translate(0 470)"><text class="se-copy" x="89" y="24"><tspan x="89">Balloons represent lungs; the sheet represents the diaphragm. The rigid bottle</tspan><tspan x="89" dy="32">cannot show rib movement. A real diaphragm is a dome-shaped muscle, not a</tspan></text></g>
<g class="v2-reading-block" data-block="model-limits-1" transform="translate(0 534)"><text class="se-copy" x="89" y="24"><tspan x="89">sheet pulled by a hand, and lungs contain many tiny air spaces. A model explains</tspan><tspan x="89" dy="32">a relationship without copying every feature.</tspan></text></g>
<g class="v2-reading-block" data-block="model-pause" transform="translate(0 614)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="262" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A model’s balloons inflate when the bottom sheet is pulled. Does this show</tspan><tspan x="113" dy="32">that the lungs contain muscles that suck in air? Use the route taken by air</tspan><tspan x="113" dy="32">and the changing space around the balloons to explain.</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Would a rigid bottle show the movement of the ribs? Name one thing this</tspan><tspan x="113" dy="32">model explains and one thing it cannot represent.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
