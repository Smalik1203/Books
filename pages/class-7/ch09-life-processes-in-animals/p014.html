<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="model-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">With good seals, pulling the sheet down increases the space around the balloons</tspan><tspan x="89" dy="32">and lowers the air pressure there. Outside air enters through the tube and the</tspan></text></g>
<g class="v2-reading-block" data-block="model-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">balloons expand. Releasing the sheet reduces that space; the balloons recoil and</tspan><tspan x="89" dy="32">air leaves. If one or both do not respond, inspect the seals and tube connections</tspan><tspan x="89" dy="32">before rejecting the explanation.</tspan></text></g>
<g class="v2-reading-block" data-block="breathing-states-art" transform="translate(0 288)"><g class="v2-life-diagram" data-diagram="breathing-states"><image class="science-illustration" data-art="breathing-states" href="../../figures/class-7/science/ch09/breathing-states.png" x="331" y="38" width="390" height="260" preserveAspectRatio="xMidYMid meet"/><text class="v2-life-label" x="421" y="26" text-anchor="middle">Inhalation</text><text class="v2-life-label" x="627" y="26" text-anchor="middle">Quiet exhalation</text><path class="v2-life-arrow" d="M421 34L421 60M416.20574461395796 51.224174381096276L421 60L425.79425538604204 51.224174381096276"/><path class="v2-life-arrow" d="M627 60L627 34M631.794255386042 42.775825618903724L627 34L622.205744613958 42.775825618903724"/></g><text class="se-caption" x="89" y="350.88"><tspan x="89">The diaphragm changes shape as the chest volume changes.</tspan></text></g>
<g class="v2-reading-block" data-block="breathing-comparison" transform="translate(0 667)"><g data-comparison-table="breathing-comparison"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Inhalation and quiet exhalation</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="260.32" y="70.08"><tspan x="260.32">Inhalation</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="618.6600000000001" y="70.08"><tspan x="618.6600000000001">Quiet exhalation</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Muscle</tspan><tspan x="103" dy="28">movement</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="110.08"><tspan x="260.32">Diaphragm contracts and moves</tspan><tspan x="260.32" dy="28">down; ribs move up and out.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="110.08"><tspan x="618.6600000000001">Diaphragm and rib muscles</tspan><tspan x="618.6600000000001" dy="28">relax; ribs return and diaphragm</tspan><tspan x="618.6600000000001" dy="28">rises.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="206.07999999999998"><tspan x="103">Volume and</tspan><tspan x="103" dy="28">pressure</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="206.07999999999998"><tspan x="260.32">Chest volume increases;</tspan><tspan x="260.32" dy="28">pressure inside the lungs falls</tspan><tspan x="260.32" dy="28">below outside pressure.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="206.07999999999998"><tspan x="618.6600000000001">Elastic recoil reduces chest and</tspan><tspan x="618.6600000000001" dy="28">lung volume.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="274" y2="274"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="302.08"><tspan x="103">Air</tspan><tspan x="103" dy="28">movement</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="302.08"><tspan x="260.32">Air enters and lungs expand.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="302.08"><tspan x="618.6600000000001">Air leaves as pressure inside</tspan><tspan x="618.6600000000001" dy="28">rises above outside pressure.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="342" y2="342"/><rect class="v2-table-frame" x="89" y="42" width="874" height="300"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="42" y2="342"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="42" y2="342"/></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
