<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="model-limits-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Balloons represent lungs; the sheet represents the diaphragm. The rigid bottle</tspan><tspan x="89" dy="32">cannot show rib movement. A real diaphragm is a dome-shaped muscle, not a</tspan></text></g>
<g class="v2-reading-block" data-block="model-limits-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">sheet pulled by a hand, and lungs contain many tiny air spaces. A model explains</tspan><tspan x="89" dy="32">a relationship without copying every feature.</tspan></text></g>
<g class="v2-reading-block" data-block="model-pause" transform="translate(0 256)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="262" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A model’s balloons inflate when the bottom sheet is pulled. Does this show</tspan><tspan x="113" dy="32">that the lungs contain muscles that suck in air? Use the route taken by air</tspan><tspan x="113" dy="32">and the changing space around the balloons to explain.</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Would a rigid bottle show the movement of the ribs? Name one thing this</tspan><tspan x="113" dy="32">model explains and one thing it cannot represent.</tspan></text></g><g transform="translate(0 540)"><g data-page-illustration="figures/class-7/science/ch09/lung-model.png"><image class="science-illustration" href="../../figures/class-7/science/ch09/lung-model.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A model used to study breathing.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A model used to study breathing.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">15</text></g></svg></div></div></section>
