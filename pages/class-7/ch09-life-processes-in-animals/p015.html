<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="lime-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Earlier cloudiness with the same volume of exhaled air supports a higher</tspan><tspan x="89" dy="32">carbon-dioxide concentration in that sample. Room air can also turn lime water</tspan></text></g>
<g class="v2-reading-block" data-block="lime-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">cloudy if enough is passed through. No visible change after a small volume does</tspan><tspan x="89" dy="32">not establish that carbon dioxide is absent. Prolonged bubbling can change the</tspan><tspan x="89" dy="32">result again, so compare initial clouding using fresh samples.</tspan></text></g>
<g class="v2-reading-block" data-block="gas-exchange" transform="translate(0 300)"><text class="se-heading" x="89" y="30"><tspan x="89">Alveoli: where gases cross</tspan></text></g>
<g class="v2-reading-block" data-block="alveoli-mechanism" transform="translate(0 348)"><text class="se-copy" x="89" y="24"><tspan x="89">Alveoli have thin walls and a large combined surface closely surrounded by blood</tspan><tspan x="89" dy="32">capillaries. Oxygen passes from alveolar air into the blood by diffusion. Carbon</tspan><tspan x="89" dy="32">dioxide passes from the blood into the air sacs and is breathed out. Neither gas</tspan><tspan x="89" dy="32">needs a hole large enough for blood to leak into the lungs.</tspan></text></g>
<g class="v2-reading-block" data-block="alveoli-art" transform="translate(0 492)"><g class="v2-life-diagram" data-diagram="alveoli"><image class="science-illustration" data-art="alveoli" href="../../figures/class-7/science/ch09/alveoli.png" x="281" y="26.99999999999997" width="520" height="390.00000000000006" preserveAspectRatio="xMidYMid meet"/><text class="v2-life-label" x="100" y="115" text-anchor="start">Air space</text><line class="v2-life-line" x1="212" y1="110" x2="489" y2="193"/><text class="v2-life-label" x="100" y="300" text-anchor="start">Thin wall</text><line class="v2-life-line" x1="210" y1="295" x2="440" y2="320"/><text class="v2-life-label" x="745" y="448" text-anchor="start">Blood capillary</text><line class="v2-life-line" x1="734" y1="439" x2="621" y2="355"/><path class="v2-life-arrow" d="M469 247L469 335M464.20574461395796 326.22417438109625L469 335L473.79425538604204 326.22417438109625"/><text class="v2-life-label" x="100" y="240" text-anchor="start">Oxygen</text><line class="v2-life-line" x1="190" y1="235" x2="459" y2="251"/><path class="v2-life-arrow" d="M593 336L593 253M597.794255386042 261.77582561890375L593 253L588.205744613958 261.77582561890375"/><text class="v2-life-label" x="817" y="225" text-anchor="start">Carbon</text><text class="v2-life-label" x="817" y="253" text-anchor="start">dioxide</text><line class="v2-life-line" x1="806" y1="238" x2="611" y2="258"/></g><text class="se-caption" x="89" y="495.88"><tspan x="89">An enlarged air sac beside a blood capillary. Arrows show opposite gas movements across</tspan><tspan x="89" dy="27">thin walls; the air and blood remain in separate spaces.</tspan></text></g>
<g class="v2-reading-block" data-block="gas-transport-0" transform="translate(0 1043)"><text class="se-copy" x="89" y="24"><tspan x="89">Blood arriving from body tissues carries more carbon dioxide and less oxygen</tspan><tspan x="89" dy="32">than blood leaving the lungs. It still contains some oxygen. Oxygen-rich blood</tspan></text></g>
<g class="v2-reading-block" data-block="gas-transport-1" transform="translate(0 1107)"><text class="se-copy" x="89" y="24"><tspan x="89">travels back to the heart and is pumped to the body. The colours in the diagram</tspan><tspan x="89" dy="32">distinguish blood with different oxygen levels; real human blood is never blue.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">15</text></g></svg></div></div></section>
