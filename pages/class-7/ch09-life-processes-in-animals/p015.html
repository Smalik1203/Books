vity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="0.89831" data-space-ratio="1.161">Pass<tspan dx="0.89831"> the</tspan><tspan dx="0.89831"> straight</tspan><tspan dx="0.89831"> tube</tspan><tspan dx="0.89831"> through</tspan><tspan dx="0.89831"> the</tspan><tspan dx="0.89831"> cap.</tspan><tspan dx="0.89831"> Seal</tspan><tspan dx="0.89831"> around</tspan><tspan dx="0.89831"> it</tspan><tspan dx="0.89831"> with</tspan><tspan dx="0.89831"> modelling</tspan><tspan dx="0.89831"> clay,</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="6.21867" data-space-ratio="2.112">leaving<tspan dx="6.21867"> the</tspan><tspan dx="6.21867"> tube’s</tspan><tspan dx="6.21867"> upper</tspan><tspan dx="6.21867"> end</tspan><tspan dx="6.21867"> open</tspan><tspan dx="6.21867"> to</tspan><tspan dx="6.21867"> air.</tspan><tspan dx="6.21867"> Close</tspan><tspan dx="6.21867"> the</tspan><tspan dx="6.21867"> cap</tspan><tspan dx="6.21867"> tightly</tspan><tspan dx="6.21867"> so</tspan><tspan dx="6.21867"> air</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">cannot leak around the tube.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="1.96207" data-space-ratio="1.351">Stretch<tspan dx="1.96207"> a</tspan><tspan dx="1.96207"> thin</tspan><tspan dx="1.96207"> rubber</tspan><tspan dx="1.96207"> sheet</tspan><tspan dx="1.96207"> over</tspan><tspan dx="1.96207"> the</tspan><tspan dx="1.96207"> open</tspan><tspan dx="1.96207"> bottle</tspan><tspan dx="1.96207"> base</tspan><tspan dx="1.96207"> and</tspan><tspan dx="1.96207"> secure</tspan><tspan dx="1.96207"> its</tspan><tspan dx="1.9
