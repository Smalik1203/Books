<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="exhaled-air" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">What changes in exhaled air?</tspan></text></g>
<g class="v2-reading-block" data-block="lime-question" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89">Lime water becomes cloudy when carbon dioxide forms fine particles of calcium</tspan><tspan x="89" dy="32">carbonate in it. Both room air and exhaled air contain carbon dioxide. A fair</tspan><tspan x="89" dy="32">comparison needs equal liquid amounts and comparable volumes of each gas;</tspan><tspan x="89" dy="32">unlimited pumping into one tube would not be a fair test.</tspan></text></g>
<g class="v2-reading-block" data-block="lime-task" transform="translate(0 304)"><rect class="se-activity-panel" x="89" y="0" width="874" height="1002" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Teacher demonstration: put equal measured volumes of fresh clear lime</tspan><tspan x="146" dy="32">water in two matching tubes A and B, supported securely in a rack.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Use two separate equal-volume needle-free syringes. Fill one with room</tspan><tspan x="146" dy="32">air. Fill the other from a clean collection bag containing a teacher’s</tspan><tspan x="146" dy="32">exhaled air; use a fresh individual collection arrangement.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Through separate tubes, gently pass the same measured gas volume into</tspan><tspan x="146" dy="32">each lime-water sample at a similar rate. Compare after each equal</tspan><tspan x="146" dy="32">volume. Record cloudiness, volume passed and elapsed time.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">4.</text><text class="se-copy" x="146" y="384"><tspan x="146">Repeat with fresh lime water and new gas samples to check whether the</tspan><tspan x="146" dy="32">pattern is consistent. Record what happened, even when a difference is</tspan><tspan x="146" dy="32">unclear.</tspan></text><text class="se-copy" x="113" y="492"><tspan x="113">Wear eye protection. Lime water is alkaline: never suck or blow directly</tspan><tspan x="113" dy="32">through a tube in it, and never mouth-pipette. Students handle no breath</tspan><tspan x="113" dy="32">samples. Keep apparatus away from faces; the teacher disposes of it.</tspan></text><g transform="translate(0 576)"><g class="v2-life-diagram" data-diagram="lime-setup"><image class="science-illustration" data-art="lime-setup" href="../../figures/class-7/science/ch09/lime-setup.png" x="308.5" y="4" width="435" height="290" preserveAspectRatio="xMidYMid meet"/><text class="v2-life-label" x="359" y="327" text-anchor="middle">A: room air</text><text class="v2-life-label" x="571" y="327" text-anchor="middle">B: exhaled air</text></g></g><text class="se-caption" x="113" y="946.88"><tspan x="113">The teacher transfers matched gas volumes with separate needle-free syringes. Both</tspan><tspan x="113" dy="27">liquid samples are initially clear.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">15</text></g></svg></div></div></section>
