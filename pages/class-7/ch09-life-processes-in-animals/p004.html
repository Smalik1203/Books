<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="chewing-observation-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">not share it or hold food in your mouth while speaking. Some people notice</tspan><tspan x="89" dy="32">increasing sweetness. Record your own experience; no clear taste change is also</tspan></text></g>
<g class="v2-reading-block" data-block="chewing-observation-2" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">a valid observation. Anyone who cannot take part can analyse the evidence</tspan><tspan x="89" dy="32">instead.</tspan></text></g>
<g class="v2-reading-block" data-block="saliva-question" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">Taste alone is a subjective clue. How could we test for the starch that is present</tspan><tspan x="89" dy="32">before and after an enzyme acts? Iodine solution becomes blue-black in the</tspan><tspan x="89" dy="32">presence of starch. It tests for starch, not directly for sugar. The following</tspan><tspan x="89" dy="32">teacher-led comparison uses prepared amylase instead of collecting saliva or</tspan><tspan x="89" dy="32">chewed food.</tspan></text></g>
<g class="v2-reading-block" data-block="starch-task" transform="translate(0 432)"><rect class="se-activity-panel" x="89" y="0" width="874" height="939" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">A teacher labels two clean tubes A and B. Put equal portions of the same</tspan><tspan x="146" dy="32">mashed boiled rice and equal measured amounts of water, about 3–4 mL,</tspan><tspan x="146" dy="32">in each. Record the starting appearance.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">The teacher adds a measured amount of school-approved amylase</tspan><tspan x="146" dy="32">solution to B and the same volume of water to A. Use separate droppers.</tspan><tspan x="146" dy="32">Keep the mixtures at the same teacher-approved temperature for the</tspan><tspan x="146" dy="32">same time.</tspan></text><text class="se-activity-step" x="132" y="340" text-anchor="end">3.</text><text class="se-copy" x="146" y="340"><tspan x="146">Add the same number of drops of dilute iodine, about 3–4, to each tube.</tspan><tspan x="146" dy="32">Mix separately and compare colours under the same light. Record</tspan><tspan x="146" dy="32">observations before explaining them.</tspan></text><text class="se-activity-step" x="132" y="448" text-anchor="end">4.</text><text class="se-copy" x="146" y="448"><tspan x="146">Use the recording guide to organise your notebook. Repeat with fresh</tspan><tspan x="146" dy="32">samples if the comparison is unclear.</tspan></text><text class="se-copy" x="113" y="524"><tspan x="113">Teacher demonstration only: wear eye protection, avoid skin and eye contact</tspan><tspan x="113" dy="32">with iodine, and never taste treated food. Do not collect or share saliva. The</tspan><tspan x="113" dy="32">teacher prepares and disposes of the solutions.</tspan></text><g transform="translate(0 608)"><g class="v2-life-diagram" data-diagram="iodine-setup"><image class="science-illustration" data-art="iodine-setup" href="../../figures/class-7/science/ch09/iodine-setup.png" x="346" y="5" width="360" height="240" preserveAspectRatio="xMidYMid meet"/><text class="v2-life-label" x="459" y="267" text-anchor="middle">A</text><text class="v2-life-label" x="529" y="267" text-anchor="middle">B</text></g></g><text class="se-caption" x="113" y="910.88"><tspan x="113">Initial materials: both rice mixtures look alike. No test result is shown in the setup.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
