<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="24"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 24"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q4" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24"><tspan x="132">Match each part to its function. Parts: (i) nostrils; (ii) nasal passages; (iii)</tspan><tspan x="132" dy="32">windpipe; (iv) alveoli; (v) rib cage. Functions: (a) openings through which air</tspan><tspan x="132" dy="32">enters; (b) main lung gas-exchange surface; (c) protects lungs; (d) conditions</tspan><tspan x="132" dy="32">air and helps trap particles with mucus and hairs; (e) conducts air towards</tspan><tspan x="132" dy="32">the lungs. Write matched pairs in your notebook.</tspan></text></g>
<g class="v2-reading-block" data-block="q5" transform="translate(0 302)"><text class="se-copy" x="111" y="24" text-anchor="end">5.</text><text class="se-copy" x="132" y="24"><tspan x="132">Anil says respiration and breathing are the same process. Propose two</tspan><tspan x="132" dy="32">questions Sanvi could ask him, then explain how the answers distinguish the</tspan><tspan x="132" dy="32">processes.</tspan></text></g>
<g class="v2-reading-block" data-block="q6" transform="translate(0 428)"><text class="se-copy" x="111" y="24" text-anchor="end">6.</text><text class="se-copy" x="132" y="24"><tspan x="132">Anu says, “We inhale air.” Shanu says, “We inhale oxygen.” Tanu says, “We</tspan><tspan x="132" dy="32">inhale air rich in oxygen.” Evaluate each statement. Explain why air is a</tspan><tspan x="132" dy="32">mixture, what “rich” must be compared with, and why exhaled air is not pure</tspan><tspan x="132" dy="32">carbon dioxide.</tspan></text></g>
<g class="v2-reading-block" data-block="q7" transform="translate(0 586)"><text class="se-copy" x="111" y="24" text-anchor="end">7.</text><text class="se-copy" x="132" y="24"><tspan x="132">Why might someone sneeze after inhaling dusty air? Explain the protective</tspan><tspan x="132" dy="32">response and why it does not make dust harmless. Do not test this by</tspan><tspan x="132" dy="32">deliberately inhaling dust.</tspan></text></g>
<g class="v2-reading-block" data-block="q8" transform="translate(0 712)"><text class="se-copy" x="111" y="24" text-anchor="end">8.</text><text class="se-copy" x="132" y="24"><tspan x="132">After a morning run, Anusha counts more breaths per minute than Paridhi.</tspan><tspan x="132" dy="32">Give at least two possible explanations. What details would make the</tspan><tspan x="132" dy="32">comparison fairer? Explain why one reading cannot establish who is fitter or</tspan><tspan x="132" dy="32">who has a medical condition.</tspan></text></g><g transform="translate(0 870)"><g data-page-illustration="figures/class-7/science/ch09/respiratory.png"><image class="science-illustration" href="../../figures/class-7/science/ch09/respiratory.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>The respiratory system.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">The respiratory system.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">24</text></g></svg></div></div></section>
