<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="animal-respiration" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">9.2.2 Gas Exchange in Other Animals</tspan></text></g>
<g class="v2-reading-block" data-block="animal-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Animals share the need to exchange gases, but the exchange surface differs.</tspan><tspan x="89" dy="32">Mammals, birds and many reptiles have lungs. Bird lungs differ from mammal</tspan></text></g>
<g class="v2-reading-block" data-block="animal-intro-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">lungs, so a shared organ name does not imply identical internal structure or</tspan><tspan x="89" dy="32">airflow. Living in water does not mean that every animal has gills.</tspan></text></g>
<g class="v2-reading-block" data-block="animal-exchange-art" transform="translate(0 314)"><g class="v2-life-diagram" data-diagram="animal-gas-exchange"><image class="science-illustration" data-art="animal-gas-exchange" href="../../figures/class-7/science/ch09/animal-gas-exchange.png" x="253.94437577255871" y="30" width="540.1112484548826" height="225" preserveAspectRatio="xMidYMid meet"/><text class="v2-life-label" x="100" y="26" text-anchor="start">Gills</text><line class="v2-life-line" x1="154" y1="30" x2="329" y2="133"/><text class="v2-life-label" x="380" y="285" text-anchor="middle">Fish</text><text class="v2-life-label" x="585" y="285" text-anchor="middle">Adult frog</text><text class="v2-life-label" x="735" y="285" text-anchor="middle">Earthworm</text></g><text class="se-caption" x="89" y="344.88"><tspan x="89">Different exchange surfaces: fish gills, an adult frog’s lungs and moist skin, and an</tspan><tspan x="89" dy="27">earthworm’s moist skin. Drawings are not to the same scale.</tspan></text></g>
<g class="v2-reading-block" data-block="animal-comparison-0" transform="translate(0 714)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Fish:</tspan> water passes over thin gill surfaces supplied with blood vessels. Oxygen</tspan><tspan x="112" dy="32">dissolved in water enters the blood; carbon dioxide leaves. Fish do not split</tspan><tspan x="112" dy="32">water molecules to obtain oxygen.</tspan></text></g>
<g class="v2-reading-block" data-block="animal-comparison-1" transform="translate(0 820)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Frogs:</tspan> tadpoles usually exchange gases through gills and skin. Adults use lungs</tspan><tspan x="112" dy="32">and their moist skin; skin gas exchange can occur both in water and on land.</tspan></text></g>
<g class="v2-reading-block" data-block="animal-comparison-2" transform="translate(0 894)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Earthworms:</tspan> gases cross moist skin into and out of blood. Drying damages this</tspan><tspan x="112" dy="32">exchange surface, so observe worms in place without handling or exposing</tspan><tspan x="112" dy="32">them to dry air.</tspan></text></g>
<g class="v2-reading-block" data-block="adaptation-0" transform="translate(0 1006)"><text class="se-copy" x="89" y="24"><tspan x="89">These structures evolved over many generations in different environments. An</tspan><tspan x="89" dy="32">individual frog developing from a tadpole is undergoing growth and</tspan></text></g>
<g class="v2-reading-block" data-block="adaptation-1" transform="translate(0 1070)"><text class="se-copy" x="89" y="24"><tspan x="89">development, not deciding to evolve a new breathing system. Digestion, gas</tspan><tspan x="89" dy="32">exchange, circulation and other processes work together in living bodies; none</tspan><tspan x="89" dy="32">operates entirely on its own.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
