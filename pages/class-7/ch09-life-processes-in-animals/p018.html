data-extra-space="7.43148" data-space-ratio="2.329">air.<tspan dx="7.43148"> Fill</tspan><tspan dx="7.43148"> the</tspan><tspan dx="7.43148"> other</tspan><tspan dx="7.43148"> from</tspan><tspan dx="7.43148"> a</tspan><tspan dx="7.43148"> clean</tspan><tspan dx="7.43148"> collection</tspan><tspan dx="7.43148"> bag</tspan><tspan dx="7.43148"> containing</tspan><tspan dx="7.43148"> a</tspan><tspan dx="7.43148"> teacher’s</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">exhaled air; use a fresh individual collection arrangement.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="2.31366" data-space-ratio="1.414">Through<tspan dx="2.31366"> separate</tspan><tspan dx="2.31366"> tubes,</tspan><tspan dx="2.31366"> gently</tspan><tspan dx="2.31366"> pass</tspan><tspan dx="2.31366"> the</tspan><tspan dx="2.31366"> same</tspan><tspan dx="2.31366"> measured</tspan><tspan dx="2.31366"> gas</tspan><tspan dx="2.31366"> volume</tspan><tspan dx="2.31366"> into</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="8.04852" data-space-ratio="2.439">each<tspan dx="8.04852"> lime-water</tspan><tspan dx="8.04852"> sample</tspan><tspan dx="8.04852"> at</tspan><tspan dx="8.04852"> a</tspan><tspan dx="8.04852"> similar</tspan><tspan dx="8.04852"> rate.</tspan><tspan dx="8.04852"> Compare</tspan><tspan dx="8.04852"> after</tspan><tspan dx="8.04852"> each</tspan><tspan dx="8.04852"> equal</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">volume. Record cloudiness, volume passed and elapsed time.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">4.</text><text class="se-copy" x="146" y="384" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="2.23679" data-space-ratio="1.400">Repeat<tspan dx="2.23679"> with</tspan><tspan dx="2.23679"> fresh</tspan><tspan dx="2.23679"> lime</tspan><tspan dx="2.23679"> water</tspan><tspan dx="2.23679"> and</tspan><tspan dx="2.23679"> new</tspan><tspan dx="2.23679"> gas</tspan><tspan dx="2.23679"> samples</tspan><tspan dx="2.23679"> to</tspan><tspan dx="2.23679"> check</tspan><tspan dx="2.23679"> whether</tspan><tspan dx="2.23679"> the</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="3.33997" data-space-ratio="1.597">pattern<tspan dx="3.33997"> is</tspan><tspan dx="3.33997"> consistent.</tspan><tspan dx="3.33997"> Record</tspan><tspan dx="3.33997"> what</tspan><tspan dx="3.33997"> happened,</tspan><tspan dx="3.33997"> even</tspan><tspan dx="3.33997"> when</tspan><tspan dx="3.33997"> a</tspan><tspan dx="3.33997"> difference</tspan><tspan dx="3.33997"> is</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">unclear.</tspan></text><text class="se-copy" x="113" y="492" data-prose-align="justify"><tspan x="113" data-justify-width="826" data-natural-space="5.59200" data-extra-space="5.52409" data-space-ratio="1.988">Wear<tspan dx="5.52409"> eye</tspan><tspan dx="5.52409"> protection.</tspan><tspan dx="5.52409"> Lime</tspan><tspan dx="5.52409"> water</tspan><tspan dx="5.52409"> is</tspan><tspan dx="5.52409"> alkaline:</tspan><tspan dx="5.52409"> never</tspan><tspan dx="5.52409"> suck</tspan><tspan dx="5.52409"> or</tspan><tspan dx="5.52409"> blow</tspan><tspan dx="5.52409"> directly</tspan></tspan><tspan x="113" dy="32" data-justify-width="826" data-natural-space="5.59200" data-extra-space="4.53262" data-space-ratio="1.811">through<tspan dx="4.53262"> a</tspan><tspan dx="4.53262"> tube</tspan><tspan dx="4.53262"> in</tspan><tspan dx="4.53262"> it,</tspan><tspan dx="4.53262"> and</tspan><tspan dx="4.53262"> never</tspan><tspan dx="4.53262"> mouth-pipette.</tspan><tspan dx="4.53262"> Students</tspan><tspan dx="4.53262"> handle</tspan><tspan dx="4.53262"> no</tspan><tspan dx="4.53262"> breath</tspan></tspan><tspan x="113" dy="32" data-paragraph-end="true">samples. Keep apparatus away from faces; the teacher disposes of it.</tspan></text><g transform="translate(0 576)"><g data-instructional-figure="lime-setup"><g class="v2-life-diagram" data-diagram="lime-setup"><image class="science-illustration" data-art="lime-setup" href="../../figures/class-7/science/ch09/lime-setup.png" x="308.5" y="4" width="435" height="290" preserveAspectRatio="xMidYMid meet"/><text class="v2-life-label" x="359" y="327" text-anchor="middle">A: room air</text><text class="v2-life-label" x="571" y="327" text-anchor="middle">B: exhaled air</text></g></g></g><text class="se-caption" x="113" y="946.88"><tspan x="113">The teacher transfers matched gas volumes with separate needle-free syringes. Both</tspan><tspan x="113" dy="27">liquid samples are initially clear.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
