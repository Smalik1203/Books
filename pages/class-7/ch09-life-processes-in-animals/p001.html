class="se-copy" x="89" y="1067"><tspan x="89">At lunch, you may be sitting still, yet your stomach is mixing food, your lungs are</tspan><tspan x="89" dy="32">exchanging gases and your heart is pumping blood. Your body keeps working</tspan><tspan x="89" dy="32">between meals and while you sleep.</tspan></text><text class="se-copy" x="89" y="1179"><tspan x="89">In Class 6, you explored the characteristics of living things. Now follow nutrition</tspan><tspan x="89" dy="32">and respiration inside animals: how food becomes usable nutrients, how oxygen</tspan><tspan x="89" dy="32">reaches cells, and how different organs work together to sustain life.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
