<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="21"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 21"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="assessment-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Let Us Enhance Our Learning</tspan></text></g>
<g class="v2-reading-block" data-block="assessment-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Use your notebook. Support each answer with evidence and explain any</tspan><tspan x="89" dy="32">uncertainty.</tspan></text></g>
<g class="v2-reading-block" data-block="q1" transform="translate(0 250)"><text class="se-copy" x="111" y="24" text-anchor="end">1.</text><text class="se-copy" x="132" y="24"><tspan x="132">In your notebook, complete this route of food: mouth → [part 1] → stomach →</tspan><tspan x="132" dy="32">[part 2] → [part 3] → rectum → anus. Which two associated organs add</tspan><tspan x="132" dy="32">secretions without food passing through them?</tspan></text></g>
<g class="v2-reading-block" data-block="q2" transform="translate(0 376)"><text class="se-copy" x="111" y="24" text-anchor="end">2.</text><text class="se-copy" x="132" y="24"><tspan x="132">Sahil puts chapati pieces in tube A, Neha puts chewed chapati in B, and</tspan><tspan x="132" dy="32">Santushti puts boiled mashed potato in C. They add iodine to each. Predict</tspan><tspan x="132" dy="32">the possible observations and give reasons. Why might B still become</tspan><tspan x="132" dy="32">blue-black? Treat this as a written question; do not collect or share chewed</tspan><tspan x="132" dy="32">food.</tspan></text></g>
<g class="v2-reading-block" data-block="q3" transform="translate(0 566)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24"><tspan x="132">Which role belongs to the diaphragm? Choose and explain: (i) filtering air;</tspan><tspan x="132" dy="32">(ii) producing sound; (iii) helping inhalation and exhalation; (iv) absorbing</tspan><tspan x="132" dy="32">oxygen directly.</tspan></text></g>
<g class="v2-reading-block" data-block="q4" transform="translate(0 692)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24"><tspan x="132">Match each part to its function. Parts: (i) nostrils; (ii) nasal passages; (iii)</tspan><tspan x="132" dy="32">windpipe; (iv) alveoli; (v) rib cage. Functions: (a) openings through which air</tspan><tspan x="132" dy="32">enters; (b) main lung gas-exchange surface; (c) protects lungs; (d) conditions</tspan><tspan x="132" dy="32">air and helps trap particles with mucus and hairs; (e) conducts air towards</tspan><tspan x="132" dy="32">the lungs. Write matched pairs in your notebook.</tspan></text></g>
<g class="v2-reading-block" data-block="q5" transform="translate(0 882)"><text class="se-copy" x="111" y="24" text-anchor="end">5.</text><text class="se-copy" x="132" y="24"><tspan x="132">Anil says respiration and breathing are the same process. Propose two</tspan><tspan x="132" dy="32">questions Sanvi could ask him, then explain how the answers distinguish the</tspan><tspan x="132" dy="32">processes.</tspan></text></g>
<g class="v2-reading-block" data-block="q6" transform="translate(0 1008)"><text class="se-copy" x="111" y="24" text-anchor="end">6.</text><text class="se-copy" x="132" y="24"><tspan x="132">Anu says, “We inhale air.” Shanu says, “We inhale oxygen.” Tanu says, “We</tspan><tspan x="132" dy="32">inhale air rich in oxygen.” Evaluate each statement. Explain why air is a</tspan><tspan x="132" dy="32">mixture, what “rich” must be compared with, and why exhaled air is not pure</tspan><tspan x="132" dy="32">carbon dioxide.</tspan></text></g>
<g class="v2-reading-block" data-block="q7" transform="translate(0 1166)"><text class="se-copy" x="111" y="24" text-anchor="end">7.</text><text class="se-copy" x="132" y="24"><tspan x="132">Why might someone sneeze after inhaling dusty air? Explain the protective</tspan><tspan x="132" dy="32">response and why it does not make dust harmless. Do not test this by</tspan><tspan x="132" dy="32">deliberately inhaling dust.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">21</text></g></svg></div></div></section>
