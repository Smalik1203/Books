<g class="v2-reading-block" data-block="model-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">balloons expand. Releasing the sheet reduces that space; the balloons recoil and</tspan><tspan x="89" dy="32">air leaves. If one or both do not respond, inspect the seals and tube connections</tspan><tspan x="89" dy="32">before rejecting the explanation.</tspan></text></g>
