9628"/><text class="v2-life-label" x="440" y="355" text-anchor="middle">First</text><text class="v2-life-label" x="627" y="355" text-anchor="middle">Next</text></g><text class="se-caption" x="89" y="400.88"><tspan x="89">Two successive positions of one mouthful. Contraction behind it and relaxation ahead help</tspan><tspan x="89" dy="27">move it towards the stomach.</tspan></text></g>
<g class="v2-reading-block" data-block="stomach" transform="translate(0 580)"><text class="se-heading" x="89" y="30"><tspan x="89">The stomach: mixing and chemical digestion</tspan></text></g>
<g class="v2-reading-block" data-block="stomach-actions-0" transform="translate(0 628)"><text class="se-copy" x="89" y="24"><tspan x="89">The stomach is a muscular pouch. Its walls churn food and mix it with gastric</tspan><tspan x="89" dy="32">secretions. Different components of these secretions have different jobs; they</tspan><tspan x="89" dy="32">should not all be called acid.</tspan></text></g>
<g class="v2-reading-block" data-block="stomach-components-0" transform="translate(0 740)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Digestive</tspan> <tspan class="se-bold">enzymes:</tspan> begin the chemical breakdown of proteins into smaller</tspan><tspan x="112" dy="32">components.</tspan></text></g>
<g class="v2-reading-block" data-block="stomach-components-1" transform="translate(0 814)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Acid:</tspan> provides conditions in which stomach enzymes work and kills many</tspan><tspan x="112" dy="32">swallowed microorganisms. It does not sterilise every meal.</tspan></text></g>
<g class="v2-reading-block" data-block="stomach-components-2" transform="translate(0 888)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Mucus</tspan> <tspan class="se-bold">and</tspan> <tspan class="se-bold">other</tspan> <tspan class="se-bold">protective</tspan> <tspan class="se-bold">factors:</tspan> help protect the living stomach lining</tspan><tspan x="112" dy="32">from its own digestive contents.</tspan></text></g>
<g class="v2-reading-block" data-block="stomach-exit-0" transform="translate(0 968)"><text class="se-copy" x="89" y="24"><tspan x="89">Churning and chemical changes produce a partly digested, semi-liquid mixture.</tspan><tspan x="89" dy="32">It leaves the stomach gradually and enters the small intestine. Digestion is not</tspan><tspan x="89" dy="32">completed in the stomach, and most nutrient absorption happens farther along.</tspan></text></g>
<g class="v2-reading-block" data-block="beaumont-0" transform="translate(0 1080)"><text class="se-copy" x="89" y="24"><tspan x="89">In 1822, Alexis St. Martin survived an accidental gunshot wound that left an</tspan><tspan x="89" dy="32">opening into his stomach. Physician William Beaumont used it to study gastric</tspan></text></g>
<g class="v2-reading-block" data-block="beaumont-1" transform="translate(0 1144)"><text class="se-copy" x="89" y="24"><tspan x="89">secretions and the digestion of different foods. These observations helped</tspan><tspan x="89" dy="32">connect stomach movements and chemical action with digestion. This historical</tspan></text></g>
<g class="v2-reading-block" data-block="beaumont-2" transform="translate(0 1208)"><text class="se-copy" x="89" y="24"><tspan x="89">case also raises questions about consent and the treatment of research</tspan><tspan x="89" dy="32">participants; it is not an experiment to imitate.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
