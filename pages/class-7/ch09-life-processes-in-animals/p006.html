<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="food-pipe" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">The food pipe: a moving wall</tspan></text></g>
<g class="v2-reading-block" data-block="peristalsis" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89">Swallowed food enters the <tspan class="se-bold">oesophagus</tspan>, or food pipe. Muscles in its wall contract</tspan><tspan x="89" dy="32">behind the food and relax farther ahead. This travelling wave, called <tspan class="se-bold">peristalsis</tspan>,</tspan><tspan x="89" dy="32">pushes the mouthful towards the stomach. Similar muscular movements move</tspan><tspan x="89" dy="32">and mix contents along the digestive tract. Food does not simply drop through a</tspan><tspan x="89" dy="32">passive pipe.</tspan></text></g>
<g class="v2-reading-block" data-block="peristalsis-art" transform="translate(0 336)"><g class="v2-life-diagram" data-diagram="peristalsis"><image class="science-illustration" data-art="peristalsis" href="../../figures/class-7/science/ch09/peristalsis.png" x="296" y="10" width="480" height="320" preserveAspectRatio="xMidYMid meet"/><text class="v2-life-label" x="100" y="80" text-anchor="start">Contraction</text><line class="v2-life-line" x1="238" y1="75" x2="435" y2="77"/><text class="v2-life-label" x="100" y="139" text-anchor="start">Food</text><line class="v2-life-line" x1="160" y1="134" x2="437" y2="125"/><text class="v2-life-label" x="100" y="254" text-anchor="start">Relaxed wall</text><line class="v2-life-line" x1="241" y1="249" x2="457" y2="246"/><text class="v2-life-label" x="805" y="88" text-anchor="start">Later</text><line class="v2-life-line" x1="798" y1="94" x2="621" y2="145"/><path class="v2-life-arrow" d="M537 116L537 217M532.205744613958 208.22417438109628L537 217L541.794255386042 208.22417438109628"/><text class="v2-life-label" x="440" y="355" text-anchor="middle">First</text><text class="v2-life-label" x="627" y="355" text-anchor="middle">Next</text></g><text class="se-caption" x="89" y="400.88"><tspan x="89">Two successive positions of one mouthful. Contraction behind it and relaxation ahead help</tspan><tspan x="89" dy="27">move it towards the stomach.</tspan></text></g>
<g class="v2-reading-block" data-block="stomach" transform="translate(0 804)"><text class="se-heading" x="89" y="30"><tspan x="89">The stomach: mixing and chemical digestion</tspan></text></g>
<g class="v2-reading-block" data-block="stomach-actions-0" transform="translate(0 852)"><text class="se-copy" x="89" y="24"><tspan x="89">The stomach is a muscular pouch. Its walls churn food and mix it with gastric</tspan><tspan x="89" dy="32">secretions. Different components of these secretions have different jobs; they</tspan><tspan x="89" dy="32">should not all be called acid.</tspan></text></g>
<g class="v2-reading-block" data-block="stomach-components" transform="translate(0 964)"><g data-comparison-table="stomach-components"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Different roles in stomach secretions</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Component</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="312.76" y="70.08"><tspan x="312.76">Role</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Digestive</tspan><tspan x="103" dy="28">enzymes</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="110.08"><tspan x="312.76">begin the chemical breakdown of proteins into smaller</tspan><tspan x="312.76" dy="28">components.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">Acid</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="178.07999999999998"><tspan x="312.76">provides conditions in which stomach enzymes work and kills</tspan><tspan x="312.76" dy="28">many swallowed microorganisms. It does not sterilise every</tspan><tspan x="312.76" dy="28">meal.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="246" y2="246"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="274.08"><tspan x="103">Mucus and other</tspan><tspan x="103" dy="28">protective factors</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="274.08"><tspan x="312.76">help protect the living stomach lining from its own digestive</tspan><tspan x="312.76" dy="28">contents.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="314" y2="314"/><rect class="v2-table-frame" x="89" y="42" width="874" height="272"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="42" y2="314"/></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
