<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="20"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 20"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="814" rx="18"/><text class="se-copy" x="113" y="222"><tspan x="113"><tspan class="se-bold">Alimentary</tspan> <tspan class="se-bold">canal</tspan> — The connected</tspan><tspan x="113" dy="32">digestive passage from mouth to</tspan><tspan x="113" dy="32">anus.</tspan></text><text class="se-copy" x="113" y="338"><tspan x="113"><tspan class="se-bold">Digestion</tspan> — Breakdown of food into</tspan><tspan x="113" dy="32">smaller substances that can be</tspan><tspan x="113" dy="32">absorbed.</tspan></text><text class="se-copy" x="113" y="454"><tspan x="113"><tspan class="se-bold">Amylase</tspan> — An enzyme that helps</tspan><tspan x="113" dy="32">break starch into smaller sugars.</tspan></text><text class="se-copy" x="113" y="538"><tspan x="113"><tspan class="se-bold">Peristalsis</tspan> — Travelling muscular</tspan><tspan x="113" dy="32">contractions that move contents</tspan><tspan x="113" dy="32">along the digestive tract.</tspan></text><text class="se-copy" x="113" y="654"><tspan x="113"><tspan class="se-bold">Absorption</tspan> — Movement of digested</tspan><tspan x="113" dy="32">nutrients across the intestinal lining</tspan><tspan x="113" dy="32">into transport vessels.</tspan></text><text class="se-copy" x="113" y="770"><tspan x="113"><tspan class="se-bold">Villi</tspan> — Small projections that</tspan><tspan x="113" dy="32">increase the small intestine’s</tspan><tspan x="113" dy="32">absorbing surface.</tspan></text><text class="se-copy" x="113" y="886"><tspan x="113"><tspan class="se-bold">Egestion</tspan> — Removal of undigested</tspan><tspan x="113" dy="32">remains through the anus.</tspan></text><text class="se-copy" x="541" y="222"><tspan x="541"><tspan class="se-bold">Rumination</tspan> — Returning partly</tspan><tspan x="541" dy="32">digested food to the mouth for</tspan><tspan x="541" dy="32">further chewing.</tspan></text><text class="se-copy" x="541" y="338"><tspan x="541"><tspan class="se-bold">Gizzard</tspan> — A muscular part of a</tspan><tspan x="541" dy="32">bird’s digestive tract that grinds</tspan><tspan x="541" dy="32">food.</tspan></text><text class="se-copy" x="541" y="454"><tspan x="541"><tspan class="se-bold">Breathing</tspan> — Movement of air into</tspan><tspan x="541" dy="32">and out of lungs.</tspan></text><text class="se-copy" x="541" y="538"><tspan x="541"><tspan class="se-bold">Diaphragm</tspan> — A dome-shaped</tspan><tspan x="541" dy="32">muscle below the lungs that helps</tspan><tspan x="541" dy="32">change chest volume.</tspan></text><text class="se-copy" x="541" y="654"><tspan x="541"><tspan class="se-bold">Alveoli</tspan> — Tiny lung air sacs across</tspan><tspan x="541" dy="32">whose walls gases pass to or from</tspan><tspan x="541" dy="32">blood.</tspan></text><text class="se-copy" x="541" y="770"><tspan x="541"><tspan class="se-bold">Respiration</tspan> — Cellular chemical</tspan><tspan x="541" dy="32">processes that release usable energy</tspan><tspan x="541" dy="32">from food.</tspan></text><text class="se-copy" x="541" y="886"><tspan x="541"><tspan class="se-bold">Circulation</tspan> — Movement of blood</tspan><tspan x="541" dy="32">that transports substances around</tspan><tspan x="541" dy="32">the body.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">20</text></g></svg></div></div></section>
