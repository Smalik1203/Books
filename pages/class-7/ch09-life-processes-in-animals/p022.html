<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="22"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 22"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204"><tspan x="112">Life processes maintain organisms. Reproduction continues populations</tspan><tspan x="112" dy="32">across generations.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278"><tspan x="112">Food follows the mouth, oesophagus, stomach, small intestine, large intestine,</tspan><tspan x="112" dy="32">rectum and anus. Liver and pancreas supply secretions.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352"><tspan x="112">Chewing is mechanical breakdown; enzymes chemically digest food. Salivary</tspan><tspan x="112" dy="32">amylase begins starch digestion.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426"><tspan x="112">Most nutrient absorption occurs in the small intestine. Villi provide a large,</tspan><tspan x="112" dy="32">thin exchange surface; nutrients support energy release, growth and repair.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500"><tspan x="112">The large intestine absorbs more water and salts. Rectum stores stool; egestion</tspan><tspan x="112" dy="32">removes it through the anus.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574"><tspan x="112">Ruminants return cud for chewing; many birds grind food in a gizzard.</tspan><tspan x="112" dy="32">Digestive structures vary with feeding habits.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648"><tspan x="112">Inhalation and exhalation renew air in the lungs. Changes in chest volume and</tspan><tspan x="112" dy="32">pressure move air.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722"><tspan x="112">Oxygen and carbon dioxide cross between alveolar air and blood through thin</tspan><tspan x="112" dy="32">walls. Exhaled air still contains oxygen.</tspan></text><text class="se-copy" x="89" y="796" text-anchor="start">•</text><text class="se-copy" x="112" y="796"><tspan x="112">Aerobic respiration uses glucose and oxygen and forms carbon dioxide and</tspan><tspan x="112" dy="32">water while releasing usable energy.</tspan></text><text class="se-copy" x="89" y="870" text-anchor="start">•</text><text class="se-copy" x="112" y="870"><tspan x="112">Breathing moves air; respiration is chemical change in cells. The heart and</tspan><tspan x="112" dy="32">blood vessels connect gas exchange, absorbed nutrients and body tissues.</tspan></text><text class="se-copy" x="89" y="944" text-anchor="start">•</text><text class="se-copy" x="112" y="944"><tspan x="112">Other animals use lungs, gills or moist skin. These exchange surfaces have</tspan><tspan x="112" dy="32">structures suited to their environments.</tspan></text><text class="se-copy" x="89" y="1018" text-anchor="start">•</text><text class="se-copy" x="112" y="1018"><tspan x="112">A useful investigation compares matched conditions, records actual evidence</tspan><tspan x="112" dy="32">and recognises what a test or model cannot establish.</tspan></text><g transform="translate(0 1068)"><g data-page-illustration="figures/class-7/science/ch09/digestive.png"><image class="science-illustration" href="../../figures/class-7/science/ch09/digestive.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>The digestive system.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">The digestive system.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">22</text></g></svg></div></div></section>
