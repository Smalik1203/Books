<g class="v2-reading-block" data-block="secretions" transform="translate(0 556)"><g data-table-spacing="airy" data-comparison-table="secretions"><text class="v2-table-caption" x="89" y="33.6"><tspan x="89">Contributions to digestion in the small intestine</tspan></text><rect class="se-table-head" x="89" y="54" width="874" height="48"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="86.08"><tspan x="103">Source</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="312.76" y="86.08"><tspan x="312.76">Contribution</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="102" y2="102"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="134.07999999999998"><tspan x="103">Liver</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="134.07999999999998"><tspan x="312.76">makes bile, stored in the gallbladder. Bile disperses large fat</tspan><tspan x="312.76" dy="28">globules into smaller droplets, giving enzymes more surface to</tspan><tspan x="312.76" dy="28">work on. This physical dispersal is not the chemical digestion of</tspan><tspan x="312.76" dy="28">fat.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="234" y2="234"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="266.08"><tspan x="103">Pancreas</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="266.08"><tspan x="312.76">supplies enzymes that act on carbohydrates, proteins and fats.</tspan><tspan x="312.76" dy="28">Its bicarbonate-rich fluid helps neutralise the acidic mixture</tspan><tspan x="312.76" dy="28">arriving from the stomach.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="338" y2="338"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y=
