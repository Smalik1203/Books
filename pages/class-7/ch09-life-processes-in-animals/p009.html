<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="large-intestine" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">The large intestine: water and egestion</tspan></text></g>
<g class="v2-reading-block" data-block="colon" transform="translate(0 160)"><g data-comparison-table="colon"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Egestion and excretion</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Egestion</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="540" y="70.08"><tspan x="540">Excretion</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103"><tspan class="se-bold">Egestion</tspan> removes undigested remains.</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="110.08"><tspan x="540"><tspan class="se-bold">Excretion</tspan> removes wastes produced by</tspan><tspan x="540" dy="28">the body’s chemical processes.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><rect class="v2-table-frame" x="89" y="42" width="874" height="108"/><line class="v2-table-rule" x1="526" x2="526" y1="42" y2="150"/><text class="v2-table-note" x="89" y="182.88"><tspan x="89">Material not absorbed in the small intestine moves into the large intestine, where more water</tspan><tspan x="89" dy="26">and some salts are absorbed. Much water has already been absorbed in the small intestine.</tspan><tspan x="89" dy="26">The remaining material forms stool, which is stored in the rectum and eventually passes out</tspan><tspan x="89" dy="26">through the anus.</tspan></text></g></g>
<g class="v2-reading-block" data-block="microbes-0" transform="translate(0 442)"><text class="se-copy" x="89" y="24"><tspan x="89">Microorganisms in the large intestine use some material that our own enzymes</tspan><tspan x="89" dy="32">cannot digest, including some dietary fibre. Their products can nourish intestinal</tspan></text></g>
<g class="v2-reading-block" data-block="microbes-1" transform="translate(0 506)"><text class="se-copy" x="89" y="24"><tspan x="89">cells and contribute certain vitamins. The gut contains a community of</tspan><tspan x="89" dy="32">organisms; “all bacteria are harmful” is therefore a poor explanation of digestion.</tspan></text></g>
<g class="v2-reading-block" data-block="digestive-health-0" transform="translate(0 586)"><text class="se-copy" x="89" y="24"><tspan x="89">A varied diet containing vegetables, fruits and whole grains supplies fibre. Water</tspan><tspan x="89" dy="32">and regular activity also support normal bowel function. Fermented foods such</tspan></text></g>
<g class="v2-reading-block" data-block="digestive-health-1" transform="translate(0 650)"><text class="se-copy" x="89" y="24"><tspan x="89">as curd, buttermilk, kanji, gundruk or poita bhat differ in preparation and</tspan><tspan x="89" dy="32">microbial content. Food hygiene, storage, salt and sugar matter; being fermented</tspan><tspan x="89" dy="32">does not make every food a cure or suitable for everyone.</tspan></text></g>
<g class="v2-reading-block" data-block="oral-care-0" transform="translate(0 762)"><text class="se-copy" x="89" y="24"><tspan x="89">Care begins before food reaches the stomach: brush twice daily with fluoride</tspan><tspan x="89" dy="32">toothpaste, clean between teeth as advised, and visit a dentist for routine care.</tspan></text></g>
<g class="v2-reading-block" data-block="oral-care-1" transform="translate(0 826)"><text class="se-copy" x="89" y="24"><tspan x="89">Discuss elders’ oral-hygiene practices respectfully, then compare them with</tspan><tspan x="89" dy="32">reliable dental guidance. Rinsing after meals does not replace brushing.</tspan></text></g><g transform="translate(0 906)"><g data-page-illustration="figures/class-7/science/ch09/digestive.png"><image class="science-illustration" href="../../figures/class-7/science/ch09/digestive.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>The digestive system.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">The digestive system.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
