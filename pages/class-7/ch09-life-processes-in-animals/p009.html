<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="historical-diet-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">The Thirukkural and Charaka Samhita show a long-standing interest in eating</tspan><tspan x="89" dy="32">and digestion; the latter discusses foods and spices such as ginger, pepper and</tspan></text></g>
<g class="v2-reading-block" data-block="historical-diet-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">cumin. Historical advice is part of cultural history, not a guarantee that a food or</tspan><tspan x="89" dy="32">meal schedule prevents illness. Claims about treatment need appropriate</tspan><tspan x="89" dy="32">evidence. Eat without rushing and seek qualified help for persistent problems.</tspan></text></g>
<g class="v2-reading-block" data-block="other-digestion" transform="translate(0 300)"><text class="v2-title" x="89" y="38"><tspan x="89">9.1.2 Different Animals, Different Digestive Systems</tspan></text></g>
<g class="v2-reading-block" data-block="rumination" transform="translate(0 358)"><text class="se-copy" x="89" y="24"><tspan x="89">A cow may chew while resting after grazing. Cows, buffaloes, goats and other</tspan><tspan x="89" dy="32"><tspan class="se-bold">ruminants</tspan> swallow partly chewed food into a specialised stomach. Microbes in</tspan><tspan x="89" dy="32">its large rumen help break down plant material. Some contents return to the</tspan><tspan x="89" dy="32">mouth as cud for more chewing, then are swallowed again. This repeated</tspan><tspan x="89" dy="32">chewing is <tspan class="se-bold">rumination</tspan>.</tspan></text></g>
<g class="v2-reading-block" data-block="ruminant-art" transform="translate(0 534)"><g class="v2-life-diagram" data-diagram="ruminant"><image class="science-illustration" data-art="ruminant" href="../../figures/class-7/science/ch09/ruminant.png" x="264" y="35" width="510" height="340" preserveAspectRatio="xMidYMid meet"/><text class="v2-life-label" x="100" y="26" text-anchor="start">Oesophagus</text><line class="v2-life-line" x1="242" y1="31" x2="402" y2="163"/><text class="v2-life-label" x="755" y="24" text-anchor="start">Rumen</text><line class="v2-life-line" x1="754" y1="29" x2="566" y2="175"/><text class="v2-life-label" x="789" y="326" text-anchor="start">Intestine</text><line class="v2-life-line" x1="779" y1="319" x2="704" y2="208"/></g><text class="se-caption" x="89" y="428.88"><tspan x="89">A simplified cow cutaway. The large rumen supports microbial digestion; cud returns</tspan><tspan x="89" dy="27">through the oesophagus for further chewing.</tspan></text></g>
<g class="v2-reading-block" data-block="bird-digestion" transform="translate(0 1018)"><text class="se-copy" x="89" y="24"><tspan x="89">A bird has no teeth. In many birds, a muscular <tspan class="se-bold">gizzard</tspan> grinds swallowed food;</tspan><tspan x="89" dy="32">small swallowed stones or grit may help. A glandular part of the stomach</tspan><tspan x="89" dy="32">supplies digestive secretions. The form and strength of these parts vary with diet.</tspan><tspan x="89" dy="32">Do not offer birds grit or unusual food as an experiment.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
