<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="air-comparison" transform="translate(0 112)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Typical proportions in inhaled and exhaled air</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Gas</tspan></text><text class="v2-table-heading" x="400.16" y="76.08"><tspan x="400.16">Inhaled room air</tspan></text><text class="v2-table-heading" x="688.58" y="76.08"><tspan x="688.58">Exhaled air</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Oxygen</tspan></text><text class="se-copy se-table-copy" x="400.16" y="128.07999999999998"><tspan x="400.16">About 21%</tspan></text><text class="se-copy se-table-copy" x="688.58" y="128.07999999999998"><tspan x="688.58">About 16–17%</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="146" y2="146"/><text class="se-copy se-table-copy" x="103" y="180.07999999999998"><tspan x="103">Carbon dioxide</tspan></text><text class="se-copy se-table-copy" x="400.16" y="180.07999999999998"><tspan x="400.16">About 0.04%</tspan></text><text class="se-copy se-table-copy" x="688.58" y="180.07999999999998"><tspan x="688.58">About 4–5%</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="198" y2="198"/><rect class="v2-table-frame" x="89" y="42" width="874" height="156"/><line class="v2-table-rule" x1="386.16" x2="386.16" y1="42" y2="198"/><line class="v2-table-rule" x1="674.58" x2="674.58" y1="42" y2="198"/><text class="v2-table-note" x="89" y="230.88"><tspan x="89">These are approximate teaching values, not measurements from the lime-water test. Other</tspan><tspan x="89" dy="26">gases make up most of the remainder; exhaled air also contains water vapour. Values vary</tspan><tspan x="89" dy="26">with conditions.</tspan></text></g>
<g class="v2-reading-block" data-block="air-reading-0" transform="translate(0 420)"><text class="se-copy" x="89" y="24"><tspan x="89">Read across the oxygen row: exhaled air still contains substantial oxygen. Read</tspan><tspan x="89" dy="32">across the carbon-dioxide row: its proportion is higher after passage through the</tspan></text></g>
<g class="v2-reading-block" data-block="air-reading-1" transform="translate(0 484)"><text class="se-copy" x="89" y="24"><tspan x="89">body. We inhale a mixture called air, not pure oxygen, and we do not exhale pure</tspan><tspan x="89" dy="32">carbon dioxide.</tspan></text></g>
<g class="v2-reading-block" data-block="cell-energy" transform="translate(0 576)"><text class="se-heading" x="89" y="30"><tspan x="89">Respiration happens in cells</tspan></text></g>
<g class="v2-reading-block" data-block="cell-chemistry-0" transform="translate(0 624)"><text class="se-copy" x="89" y="24"><tspan x="89">Glucose absorbed after digestion can react with oxygen through many controlled</tspan><tspan x="89" dy="32">chemical steps in cells. Energy stored in food becomes available for movement,</tspan></text></g>
<g class="v2-reading-block" data-block="cell-chemistry-1" transform="translate(0 688)"><text class="se-copy" x="89" y="24"><tspan x="89">growth, repair and other cell activities; some is released as heat. The process is</tspan><tspan x="89" dy="32">not a tiny flame inside the body.</tspan></text></g>
<g class="v2-reading-block" data-block="respiration-equation" transform="translate(0 768)"><text class="v2-equation" x="89" y="30"><tspan x="89">Glucose + oxygen → carbon dioxide + water</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">Aerobic respiration releases usable energy. The word equation summarises many reactions;</tspan><tspan x="89" dy="27">energy is released, not a material made from nothing.</tspan></text></g>
<g class="v2-reading-block" data-block="breathing-respiration" transform="translate(0 892)"><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Breathing</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74"><tspan x="112">What happens: air moves into and</tspan><tspan x="112" dy="32">out of the lungs.</tspan></text><text class="se-copy" x="89" y="148" text-anchor="start">•</text><text class="se-copy" x="112" y="148"><tspan x="112">Where: the respiratory air passages</tspan><tspan x="112" dy="32">and lungs.</tspan></text><text class="se-copy" x="89" y="222" text-anchor="start">•</text><text class="se-copy" x="112" y="222"><tspan x="112">Role: renews air at gas-exchange</tspan><tspan x="112" dy="32">surfaces.</tspan></text><text class="v2-comparison-title" x="526" y="30"><tspan x="526">Cellular respiration</tspan></text><text class="se-copy" x="526" y="74" text-anchor="start">•</text><text class="se-copy" x="549" y="74"><tspan x="549">What happens: chemical reactions</tspan><tspan x="549" dy="32">release usable energy from food.</tspan></text><text class="se-copy" x="526" y="148" text-anchor="start">•</text><text class="se-copy" x="549" y="148"><tspan x="549">Where: living cells throughout the</tspan><tspan x="549" dy="32">body.</tspan></text><text class="se-copy" x="526" y="222" text-anchor="start">•</text><text class="se-copy" x="549" y="222"><tspan x="549">Role: powers cell functions; aerobic</tspan><tspan x="549" dy="32">respiration uses oxygen.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
