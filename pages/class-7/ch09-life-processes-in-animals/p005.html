<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="starch-record" transform="translate(0 112)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Recording the starch comparison in your notebook</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Sample</tspan></text><text class="v2-table-heading" x="277.8" y="76.08"><tspan x="277.8">Initial colour</tspan></text><text class="v2-table-heading" x="513.78" y="76.08"><tspan x="513.78">After iodine</tspan></text><text class="v2-table-heading" x="741.02" y="76.08"><tspan x="741.02">Interpretation</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">A: rice +</tspan><tspan x="103" dy="28">water</tspan></text><text class="se-copy se-table-copy" x="277.8" y="128.07999999999998"><tspan x="277.8">Observe before</tspan><tspan x="277.8" dy="28">testing</tspan></text><text class="se-copy se-table-copy" x="513.78" y="128.07999999999998"><tspan x="513.78">Record actual</tspan><tspan x="513.78" dy="28">colour</tspan></text><text class="se-copy se-table-copy" x="741.02" y="128.07999999999998"><tspan x="741.02">Evidence for starch?</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="174" y2="174"/><text class="se-copy se-table-copy" x="103" y="208.07999999999998"><tspan x="103">B: rice +</tspan><tspan x="103" dy="28">amylase</tspan></text><text class="se-copy se-table-copy" x="277.8" y="208.07999999999998"><tspan x="277.8">Observe before</tspan><tspan x="277.8" dy="28">testing</tspan></text><text class="se-copy se-table-copy" x="513.78" y="208.07999999999998"><tspan x="513.78">Record actual</tspan><tspan x="513.78" dy="28">colour</tspan></text><text class="se-copy se-table-copy" x="741.02" y="208.07999999999998"><tspan x="741.02">Compare with A</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="254" y2="254"/><rect class="v2-table-frame" x="89" y="42" width="874" height="212"/><line class="v2-table-rule" x1="263.8" x2="263.8" y1="42" y2="254"/><line class="v2-table-rule" x1="499.78000000000003" x2="499.78000000000003" y1="42" y2="254"/><line class="v2-table-rule" x1="727.02" x2="727.02" y1="42" y2="254"/><text class="v2-table-note" x="89" y="286.88"><tspan x="89">Read across to connect each sample with its evidence. Compare down to look for a</tspan><tspan x="89" dy="26">difference; these are recording instructions, not sample results.</tspan></text></g>
<g class="v2-reading-block" data-block="starch-evidence-0" transform="translate(0 450)"><text class="se-copy" x="89" y="24"><tspan x="89">If A becomes blue-black, the starting rice contained detectable starch. If B gives a</tspan><tspan x="89" dy="32">weaker or absent blue-black colour under comparable conditions, this supports</tspan></text></g>
<g class="v2-reading-block" data-block="starch-evidence-1" transform="translate(0 514)"><text class="se-copy" x="89" y="24"><tspan x="89">the idea that amylase has broken down some starch. It does not prove that every</tspan><tspan x="89" dy="32">starch molecule has disappeared or that the iodine test detected sugar.</tspan></text></g>
<g class="v2-reading-block" data-block="starch-uncertainty-0" transform="translate(0 594)"><text class="se-copy" x="89" y="24"><tspan x="89">If both mixtures remain dark, check the enzyme preparation, waiting time,</tspan><tspan x="89" dy="32">temperature, quantities and mixing. If A does not respond, first check the starch</tspan></text></g>
<g class="v2-reading-block" data-block="starch-uncertainty-1" transform="translate(0 658)"><text class="se-copy" x="89" y="24"><tspan x="89">and iodine using known samples. Record unexpected results honestly.</tspan><tspan x="89" dy="32">Comparing unchewed and chewed rice changes particle size as well as adding</tspan><tspan x="89" dy="32">saliva. The prepared-enzyme comparison controls that difference better.</tspan></text></g>
<g class="v2-reading-block" data-block="starch-pause" transform="translate(0 770)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A learner says, “Tube B is not blue-black, so I have proved that sugar</tspan><tspan x="113" dy="32">formed.” What does the iodine test actually show? What further test would</tspan><tspan x="113" dy="32">be needed for the second claim?</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Two samples have different iodine colours, but one received twice as much</tspan><tspan x="113" dy="32">water. Explain why the comparison is difficult to interpret. Which conditions</tspan><tspan x="113" dy="32">should match in a repeat?</tspan></text></g><g transform="translate(0 1086)"><g data-page-illustration="figures/class-7/science/ch09/iodine-setup.png"><image class="science-illustration" href="../../figures/class-7/science/ch09/iodine-setup.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A starch comparison setup.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A starch comparison setup.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1
