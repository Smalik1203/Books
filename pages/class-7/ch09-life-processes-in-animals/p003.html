<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="digestive-map" transform="translate(0 112)"><g class="v2-life-diagram" data-diagram="digestive"><image class="science-illustration" data-art="digestive" href="../../figures/class-7/science/ch09/digestive.png" x="330" y="15" width="400" height="600" preserveAspectRatio="xMidYMid meet"/><text class="v2-life-label" x="100" y="78" text-anchor="start">Mouth</text><line class="v2-life-line" x1="180" y1="73" x2="459" y2="70"/><text class="v2-life-label" x="100" y="180" text-anchor="start">Oesophagus</text><line class="v2-life-line" x1="241" y1="175" x2="534" y2="176"/><text class="v2-life-label" x="100" y="285" text-anchor="start">Liver</text><line class="v2-life-line" x1="157" y1="280" x2="480" y2="278"/><text class="v2-life-label" x="100" y="350" text-anchor="start">Gallbladder</text><line class="v2-life-line" x1="235" y1="345" x2="463" y2="316"/><text class="v2-life-label" x="100" y="442" text-anchor="start">Small intestine</text><line class="v2-life-line" x1="270" y1="437" x2="512" y2="445"/><text class="v2-life-label" x="100" y="565" text-anchor="start">Rectum</text><line class="v2-life-line" x1="188" y1="560" x2="526" y2="558"/><text class="v2-life-label" x="755" y="260" text-anchor="start">Stomach</text><line class="v2-life-line" x1="742" y1="255" x2="598" y2="290"/><text class="v2-life-label" x="755" y="364" text-anchor="start">Pancreas</text><line class="v2-life-line" x1="742" y1="359" x2="557" y2="340"/><text class="v2-life-label" x="755" y="477" text-anchor="start">Large intestine</text><line class="v2-life-line" x1="742" y1="472" x2="624" y2="428"/><text class="v2-life-label" x="755" y="610" text-anchor="start">Anus</text><line class="v2-life-line" x1="742" y1="605" x2="526" y2="596"/></g><text class="se-caption" x="89" y="670.88"><tspan x="89">The human digestive system, simplified. Follow the food path; the liver and pancreas send</tspan><tspan x="89" dy="27">secretions into the small intestine.</tspan></text></g>
<g class="v2-reading-block" data-block="mouth" transform="translate(0 850)"><text class="se-heading" x="89" y="30"><tspan x="89">The mouth: chewing and saliva</tspan></text></g>
<g class="v2-reading-block" data-block="mouth-work-0" transform="translate(0 898)"><text class="se-copy" x="89" y="24"><tspan x="89">Teeth cut, crush and grind food into smaller pieces. The tongue mixes it with</tspan><tspan x="89" dy="32">saliva and helps form a soft mouthful for swallowing. Saliva moistens food and</tspan></text></g>
<g class="v2-reading-block" data-block="mouth-work-1" transform="translate(0 962)"><text class="se-copy" x="89" y="24"><tspan x="89">contains the enzyme <tspan class="se-bold">amylase</tspan>, which starts breaking starch into smaller sugars.</tspan><tspan x="89" dy="32">Remembering a favourite food can stimulate saliva even before the first bite.</tspan></text></g>
<g class="v2-reading-block" data-block="chewing-observation-0" transform="translate(0 1042)"><text class="se-copy" x="89" y="24"><tspan x="89">If a teacher permits and the food is suitable for you, slowly chew a small bite of</tspan><tspan x="89" dy="32">plain chapati or boiled rice for about 30–60 seconds. Use only your own food; do</tspan></text></g>
<g class="v2-reading-block" data-block="chewing-observation-1" transform="translate(0 1106)"><text class="se-copy" x="89" y="24"><tspan x="89">not share it or hold food in your mouth while speaking. Some people notice</tspan><tspan x="89" dy="32">increasing sweetness. Record your own experience; no clear taste change is also</tspan></text></g>
<g class="v2-reading-block" data-block="chewing-observation-2" transform="translate(0 1170)"><text class="se-copy" x="89" y="24"><tspan x="89">a valid observation. Anyone who cannot take part can analyse the evidence</tspan><tspan x="89" dy="32">instead.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
