<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="19"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 19"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="animal-respiration" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">9.2.2 Gas Exchange in Other Animals</tspan></text></g>
<g class="v2-reading-block" data-block="animal-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Animals share the need to exchange gases, but the exchange surface differs.</tspan><tspan x="89" dy="32">Mammals, birds and many reptiles have lungs. Bird lungs differ from mammal</tspan></text></g>
<g class="v2-reading-block" data-block="animal-intro-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">lungs, so a shared organ name does not imply identical internal structure or</tspan><tspan x="89" dy="32">airflow. Living in water does not mean that every animal has gills.</tspan></text></g>
<g class="v2-reading-block" data-block="animal-exchange-art" transform="translate(0 314)"><g class="v2-life-diagram" data-diagram="animal-gas-exchange"><image class="science-illustration" data-art="animal-gas-exchange" href="../../figures/class-7/science/ch09/animal-gas-exchange.png" x="253.94437577255871" y="30" width="540.1112484548826" height="225" preserveAspectRatio="xMidYMid meet"/><text class="v2-life-label" x="100" y="26" text-anchor="start">Gills</text><line class="v2-life-line" x1="154" y1="30" x2="329" y2="133"/><text class="v2-life-label" x="380" y="285" text-anchor="middle">Fish</text><text class="v2-life-label" x="585" y="285" text-anchor="middle">Adult frog</text><text class="v2-life-label" x="735" y="285" text-anchor="middle">Earthworm</text></g><text class="se-caption" x="89" y="344.88"><tspan x="89">Different exchange surfaces: fish gills, an adult frog’s lungs and moist skin, and an</tspan><tspan x="89" dy="27">earthworm’s moist skin. Drawings are not to the same scale.</tspan></text></g>
<g class="v2-reading-block" data-block="animal-comparison" transform="translate(0 714)"><g data-comparison-table="animal-comparison"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Gas exchange in different animals</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Animal</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="312.76" y="70.08"><tspan x="312.76">Exchange surface and conditions</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Fish</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="110.08"><tspan x="312.76">water passes over thin gill surfaces supplied with blood vessels.</tspan><tspan x="312.76" dy="28">Oxygen dissolved in water enters the blood; carbon dioxide</tspan><tspan x="312.76" dy="28">leaves. Fish do not split water molecules to obtain oxygen.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="206.07999999999998"><tspan x="103">Frogs</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="206.07999999999998"><tspan x="312.76">tadpoles usually exchange gases through gills and skin. Adults</tspan><tspan x="312.76" dy="28">use lungs and their moist skin; skin gas exchange can occur</tspan><tspan x="312.76" dy="28">both in water and on land.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="274" y2="274"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="302.08"><tspan x="103">Earthworms</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="302.08"><tspan x="312.76">gases cross moist skin into and out of blood. Drying damages</tspan><tspan x="312.76" dy="28">this exchange surface, so observe worms in place without</tspan><tspan x="312.76" dy="28">handling or exposing them to dry air.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="370" y2="370"/><rect class="v2-table-frame" x="89" y="42" width="874" height="328"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="42" y2="370"/></g></g>
<g class="v2-reading-block" data-block="adaptation-0" transform="translate(0 1100)"><text class="se-copy" x="89" y="24"><tspan x="89">These structures evolved over many generations in different environments. An</tspan><tspan x="89" dy="32">individual frog developing from a tadpole is undergoing growth and</tspan></text></g>
<g class="v2-reading-block" data-block="adaptation-1" transform="translate(0 1164)"><text class="se-copy" x="89" y="24"><tspan x="89">development, not deciding to evolve a new breathing system. Digestion, gas</tspan><tspan x="89" dy="32">exchange, circulation and other processes work together in living bodies; none</tspan><tspan x="89" dy="32">operates entirely on its own.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">19</text></g></svg></div></div></section>
