<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="26"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 26"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Explore Further</tspan></text></g>
<g class="v2-reading-block" data-block="project-oral" transform="translate(0 170)"><text class="se-heading" x="89" y="30"><tspan x="89">Compare oral-health advice</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Compare an elder’s oral-hygiene advice with a reliable dental source. Report on</tspan><tspan x="89" dy="32">brushing, cleaning between teeth and eating habits. Distinguish cultural</tspan><tspan x="89" dy="32">practice, personal experience and evidence; do not recommend treatment for a</tspan><tspan x="89" dy="32">classmate.</tspan></text></g>
<g class="v2-reading-block" data-block="project-food" transform="translate(0 374)"><text class="se-heading" x="89" y="30"><tspan x="89">Plan a varied, hygienic menu</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Research habits supporting digestive health. Propose varied foods, including</tspan><tspan x="89" dy="32">fibre-rich choices, safe water and hygienic preparation. Explain your choices and</tspan><tspan x="89" dy="32">account for allergies or individual dietary needs. Do not prescribe restrictive</tspan><tspan x="89" dy="32">diets or call a food a cure.</tspan></text></g>
<g class="v2-reading-block" data-block="project-model" transform="translate(0 578)"><text class="se-heading" x="89" y="30"><tspan x="89">Build a connected digestive model</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Model the alimentary canal and associated organs in coloured clay with paper</tspan><tspan x="89" dy="32">labels. Check continuity from mouth to anus and where secretions enter. Explain</tspan><tspan x="89" dy="32">a limitation, including scale. Keep modelling materials away from food.</tspan></text></g><g transform="translate(0 750)"><g data-page-illustration="figures/class-7/science/ch09/digestive.png"><image class="science-illustration" href="../../figures/class-7/science/ch09/digestive.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>The digestive system.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">The digestive system.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">26</text></g></svg></div></div></section>
