<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="human-respiration" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">9.2.1 Respiration in Humans</tspan></text></g>
<g class="v2-reading-block" data-block="air-route" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Air normally enters through the nostrils and nasal passages. Hairs and mucus</tspan><tspan x="89" dy="32">trap some particles; the passages also warm and moisten the air. It passes</tspan><tspan x="89" dy="32">through the throat into the windpipe, or trachea, which divides into two main</tspan><tspan x="89" dy="32">branches, one to each lung. Smaller branches end at tiny air sacs called <tspan class="se-bold">alveoli</tspan>.</tspan></text></g>
<g class="v2-reading-block" data-block="respiratory-art" transform="translate(0 314)"><g class="v2-life-diagram" data-diagram="respiratory"><image class="science-illustration" data-art="respiratory" href="../../figures/class-7/science/ch09/respiratory.png" x="340" y="12" width="380" height="570" preserveAspectRatio="xMidYMid meet"/><text class="v2-life-label" x="100" y="139" text-anchor="start">Nostrils</text><line class="v2-life-line" x1="190" y1="134" x2="439" y2="144"/><text class="v2-life-label" x="100" y="200" text-anchor="start">Nasal passage</text><line class="v2-life-line" x1="261" y1="195" x2="478" y2="121"/><text class="v2-life-label" x="100" y="296" text-anchor="start">Windpipe</text><line class="v2-life-line" x1="210" y1="291" x2="527" y2="285"/><text class="v2-life-label" x="100" y="414" text-anchor="start">Rib cage</text><line class="v2-life-line" x1="198" y1="409" x2="395" y2="410"/><text class="v2-life-label" x="100" y="570" text-anchor="start">Diaphragm</text><line class="v2-life-line" x1="225" y1="565" x2="528" y2="520"/><text class="v2-life-label" x="752" y="327" text-anchor="start">Branch to lung</text><line class="v2-life-line" x1="741" y1="322" x2="556" y2="346"/><text class="v2-life-label" x="752" y="440" text-anchor="start">Lung</text><line class="v2-life-line" x1="741" y1="435" x2="624" y2="441"/></g><text class="se-caption" x="89" y="632.88"><tspan x="89">The human respiratory system, simplified. The ribs protect the lungs; the diaphragm forms a</tspan><tspan x="89" dy="27">muscular floor beneath them.</tspan></text></g>
<g class="v2-reading-block" data-block="nose-limits-0" transform="translate(0 1002)"><text class="se-copy" x="89" y="24"><tspan x="89">Filtering is useful but incomplete: fine particles and infectious agents can still</tspan><tspan x="89" dy="32">enter. SARS-CoV-2, the virus responsible for COVID-19, can affect the respiratory</tspan></text></g>
<g class="v2-reading-block" data-block="nose-limits-1" transform="translate(0 1066)"><text class="se-copy" x="89" y="24"><tspan x="89">system. Sneezing can help expel an irritant from the nose. Never inhale dust</tspan><tspan x="89" dy="32">deliberately to test this response. The nose conditions air, but mouth breathing</tspan><tspan x="89" dy="32">can also occur, for example during vigorous activity.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
