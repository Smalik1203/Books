<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="breathing-model" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Modelling how breathing works</tspan></text></g>
<g class="v2-reading-block" data-block="model-question" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89">Lungs have no muscles that pull air into themselves. What changes the space</tspan><tspan x="89" dy="32">around them? Build a model that lets you change an enclosed volume and watch</tspan><tspan x="89" dy="32">what happens to two balloons. Predict what an air leak might change before you</tspan><tspan x="89" dy="32">begin.</tspan></text></g>
<g class="v2-reading-block" data-block="lung-task" transform="translate(0 304)"><rect class="se-activity-panel" x="89" y="0" width="874" height="1030" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">An adult cuts the base from a wide clear plastic bottle, covers the cut edge</tspan><tspan x="146" dy="32">and makes a hole in its cap. Use a teacher-prepared Y-shaped hollow</tspan><tspan x="146" dy="32">tube; attach one small balloon tightly to each branch.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Pass the straight tube through the cap. Seal around it with modelling clay,</tspan><tspan x="146" dy="32">leaving the tube’s upper end open to air. Close the cap tightly so air</tspan><tspan x="146" dy="32">cannot leak around the tube.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Stretch a thin rubber sheet over the open bottle base and secure its edge</tspan><tspan x="146" dy="32">with a large band. Leave a small central tab to hold. Check all seals.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">4.</text><text class="se-copy" x="146" y="384"><tspan x="146">Gently pull the sheet down, then release it. Observe each balloon and</tspan><tspan x="146" dy="32">record both changes. Repeat with the same gentle movement. Do not</tspan><tspan x="146" dy="32">describe a result until you have observed it.</tspan></text><text class="se-copy" x="113" y="492"><tspan x="113">Adult cutting only. Check latex allergies and use a suitable alternative if</tspan><tspan x="113" dy="32">necessary. Keep balloons away from mouths and discard broken pieces; do</tspan><tspan x="113" dy="32">not blow through the model or share mouthpieces.</tspan></text><g transform="translate(0 576)"><g class="v2-life-diagram" data-diagram="lung-model"><image class="science-illustration" data-art="lung-model" href="../../figures/class-7/science/ch09/lung-model.png" x="388.3333333333333" y="0" width="233.33333333333334" height="350" preserveAspectRatio="xMidYMid meet"/><text class="v2-life-label" x="123" y="36" text-anchor="start">Open tube</text><line class="v2-life-line" x1="241" y1="31" x2="512" y2="24"/><text class="v2-life-label" x="123" y="100" text-anchor="start">Airtight seal</text><line class="v2-life-line" x1="261" y1="95" x2="510" y2="68"/><text class="v2-life-label" x="705" y="206" text-anchor="start">Balloon</text><line class="v2-life-line" x1="694" y1="201" x2="564" y2="221"/><text class="v2-life-label" x="123" y="315" text-anchor="start">Rubber sheet</text><line class="v2-life-line" x1="278" y1="310" x2="501" y2="305"/><text class="v2-life-label" x="705" y="340" text-anchor="start">Pull tab</text><line class="v2-life-line" x1="694" y1="335" x2="519" y2="336"/></g></g><text class="se-caption" x="113" y="974.88"><tspan x="113">Initial model at rest. The open tube connects the balloons to outside air; the bottle space</tspan><tspan x="113" dy="27">around them must be sealed.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
