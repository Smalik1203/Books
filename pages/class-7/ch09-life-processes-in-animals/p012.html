<g class="v2-reading-block" data-block="nose-limits-1" transform="translate(0 1066)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.00987" data-space-ratio="1.896">system.<tspan dx="5.00987"> Sneezing</tspan><tspan dx="5.00987"> can</tspan><tspan dx="5.00987"> help</tspan><tspan dx="5.00987"> expel</tspan><tspan dx="5.00987"> an</tspan><tspan dx="5.00987"> irritant</tspan><tspan dx="5.00987"> from</tspan><tspan dx="5.00987"> the</tspan><tspan dx="5.00987"> nose.</tspan><tspan dx="5.00987"> Never</tspan><tspan dx="5.00987"> inhale</tspan><tspan dx="5.00987"> dust</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.99271" data-space-ratio="1.535">deliberately<tspan dx="2.99271"> to</tspan><tspan dx="2.99271"> test</tspan><tspan dx="2.99271"> this</tspan><tspan dx="2.99271"> response.</tspan><tspan dx="2.99271"> The</tspan><tspan dx="2.99271"> nose</tspan><tspan dx="2.99271"> conditions</tspan><tspan dx="2.99271"> air,</tspan><tspan dx="2.99271"> but</tspan><tspan dx="2.99271"> mouth</tspan><tspan dx="2.99271"> breathing</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">can also occur, for example during vigorous activity.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
