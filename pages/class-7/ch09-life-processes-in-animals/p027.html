<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="27" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 27"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-aqi" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Investigate air-quality information</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Use an official source to explain air quality and AQI. Record location, date,</tspan><tspan x="89" dy="32">pollutants and guidance. Compare possible exposures for farmers, factory</tspan><tspan x="89" dy="32">workers and street vendors, and ways workplaces could reduce them. Do not visit</tspan><tspan x="89" dy="32">polluted places or collect health details.</tspan></text></g>
<g class="v2-reading-block" data-block="project-breathing" transform="translate(0 316)"><text class="se-heading" x="89" y="30"><tspan x="89">Evaluate a breathing-practice claim</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Research box breathing: inhalation, pause, exhalation, pause. Evaluate evidence</tspan><tspan x="89" dy="32">for relaxation claims and identify uncertainties. This is reading, not a</tspan><tspan x="89" dy="32">breath-holding exercise or treatment. Avoid forced breathing and discuss health</tspan><tspan x="89" dy="32">questions with a qualified adult.</tspan></text></g>
<g class="v2-reading-block" data-block="project-birds" transform="translate(0 520)"><text class="se-heading" x="89" y="30"><tspan x="89">How do high-flying birds obtain oxygen?</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Compare bird and mammal respiratory diagrams. Research air sacs and one-way</tspan><tspan x="89" dy="32">lung airflow. Explain why high altitude means lower oxygen pressure, not usually</tspan><tspan x="89" dy="32">a lower oxygen percentage. Air sacs move air; lung tissue exchanges gases. Name</tspan><tspan x="89" dy="32">your sources.</tspan></text></g><g transform="translate(0 724)"><g data-page-illustration="figures/class-7/science/ch09/respiratory.png"><image class="science-illustration" href="../../figures/class-7/science/ch09/respiratory.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>The respiratory system.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">The respiratory system.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">27</text></g></svg></div></div></section>
