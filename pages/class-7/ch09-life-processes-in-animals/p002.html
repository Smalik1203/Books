<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="nutrition" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">9.1 Nutrition in Animals</tspan></text></g>
<g class="v2-reading-block" data-block="life-processes-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Life</tspan> <tspan class="se-bold">processes</tspan> are the activities that maintain living organisms. Nutrition</tspan><tspan x="89" dy="32">supplies materials and energy sources; respiration releases usable energy;</tspan></text></g>
<g class="v2-reading-block" data-block="life-processes-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">circulation transports substances; excretion removes metabolic wastes.</tspan><tspan x="89" dy="32">Reproduction continues a kind of organism across generations, although an</tspan><tspan x="89" dy="32">individual can survive without reproducing.</tspan></text></g>
<g class="v2-reading-block" data-block="feeding-intro-0" transform="translate(0 346)"><text class="se-copy" x="89" y="24"><tspan x="89">Observe familiar animals without disturbing or feeding them. They obtain food</tspan><tspan x="89" dy="32">in different ways. What body parts help each animal reach, take in or break up its</tspan><tspan x="89" dy="32">food? Separate something you actually observe from an explanation you infer.</tspan></text></g>
<g class="v2-reading-block" data-block="feeding-methods-0" transform="translate(0 458)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Bees</tspan> <tspan class="se-bold">and</tspan> <tspan class="se-bold">sunbirds:</tspan> take nectar from flowers using specialised mouthparts or a</tspan><tspan x="112" dy="32">long tongue and beak.</tspan></text></g>
<g class="v2-reading-block" data-block="feeding-methods-1" transform="translate(0 532)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Young</tspan> <tspan class="se-bold">mammals:</tspan> obtain milk from their mothers. Humans, cows and many</tspan><tspan x="112" dy="32">other mammals begin life this way.</tspan></text></g>
<g class="v2-reading-block" data-block="feeding-methods-2" transform="translate(0 606)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Pythons:</tspan> swallow prey whole, then digest it internally; swallowing whole does</tspan><tspan x="112" dy="32">not mean skipping digestion.</tspan></text></g>
<g class="v2-reading-block" data-block="feeding-methods-3" transform="translate(0 680)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Filter-feeding</tspan> <tspan class="se-bold">aquatic</tspan> <tspan class="se-bold">animals:</tspan> collect small food particles carried in water.</tspan><tspan x="112" dy="32">They do not obtain all their food by taking bites.</tspan></text></g>
<g class="v2-reading-block" data-block="nutrient-intro-0" transform="translate(0 760)"><text class="se-copy" x="89" y="24"><tspan x="89">Food contains carbohydrates, proteins, fats and other nutrients. Many large food</tspan><tspan x="89" dy="32">molecules cannot be absorbed as they are. <tspan class="se-bold">Digestion</tspan> breaks them into smaller</tspan></text></g>
<g class="v2-reading-block" data-block="nutrient-intro-1" transform="translate(0 824)"><text class="se-copy" x="89" y="24"><tspan x="89">substances that the body can absorb and use. Mechanical actions break food into</tspan><tspan x="89" dy="32">pieces; digestive enzymes carry out chemical changes.</tspan></text></g>
<g class="v2-reading-block" data-block="digestion-stages-0" transform="translate(0 904)"><text class="se-copy" x="89" y="24"><tspan x="89">Taking food into the body is <tspan class="se-bold">ingestion</tspan>. After digestion, small nutrient molecules</tspan><tspan x="89" dy="32">cross the intestinal wall during <tspan class="se-bold">absorption</tspan>. Cells then use absorbed materials for</tspan></text></g>
<g class="v2-reading-block" data-block="digestion-stages-1" transform="translate(0 968)"><text class="se-copy" x="89" y="24"><tspan x="89">energy, growth and repair, called <tspan class="se-bold">assimilation</tspan>. Undigested remains eventually</tspan><tspan x="89" dy="32">leave through the anus by <tspan class="se-bold">egestion</tspan>. These terms name different steps, not five</tspan><tspan x="89" dy="32">names for digestion.</tspan></text></g>
<g class="v2-reading-block" data-block="human-digestion" transform="translate(0 1092)"><text class="v2-title" x="89" y="38"><tspan x="89">9.1.1 Digestion in Human Beings</tspan></text></g>
<g class="v2-reading-block" data-block="canal" transform="translate(0 1150)"><text class="se-copy" x="89" y="24"><tspan x="89">The <tspan class="se-bold">alimentary</tspan> <tspan class="se-bold">canal</tspan> is the continuous passage from the mouth to the anus.</tspan><tspan x="89" dy="32">Food travels along it; secretions enter from its lining and from associated organs.</tspan><tspan x="89" dy="32">The liver and pancreas contribute digestive secretions, but food does not pass</tspan><tspan x="89" dy="32">through these organs. Each region has a different job. We will follow the</tspan><tspan x="89" dy="32">connected route and ask what changes as food moves onwards.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
