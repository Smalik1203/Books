<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="nutrition" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">9.1 Nutrition in Animals</tspan></text></g>
<g class="v2-reading-block" data-block="life-processes-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Life</tspan> <tspan class="se-bold">processes</tspan> are the activities that maintain living organisms. Nutrition</tspan><tspan x="89" dy="32">supplies materials and energy sources; respiration releases usable energy;</tspan></text></g>
<g class="v2-reading-block" data-block="life-processes-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">circulation transports substances; excretion removes metabolic wastes.</tspan><tspan x="89" dy="32">Reproduction continues a kind of organism across generations, although an</tspan><tspan x="89" dy="32">individual can survive without reproducing.</tspan></text></g>
<g class="v2-reading-block" data-block="feeding-intro-0" transform="translate(0 346)"><text class="se-copy" x="89" y="24"><tspan x="89">Observe familiar animals without disturbing or feeding them. They obtain food</tspan><tspan x="89" dy="32">in different ways. What body parts help each animal reach, take in or break up its</tspan><tspan x="89" dy="32">food? Separate something you actually observe from an explanation you infer.</tspan></text></g>
<g class="v2-reading-block" data-block="feeding-methods" transform="translate(0 458)"><g data-comparison-table="feeding-methods"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Different ways of obtaining food</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Animals</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="312.76" y="70.08"><tspan x="312.76">How food is obtained</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Bees and</tspan><tspan x="103" dy="28">sunbirds</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="110.08"><tspan x="312.76">take nectar from flowers using specialised mouthparts or a long</tspan><tspan x="312.76" dy="28">tongue and beak.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">Young mammals</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="178.07999999999998"><tspan x="312.76">obtain milk from their mothers. Humans, cows and many other</tspan><tspan x="312.76" dy="28">mammals begin life this way.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="218" y2="218"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="246.07999999999998"><tspan x="103">Pythons</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="246.07999999999998"><tspan x="312.76">swallow prey whole, then digest it internally; swallowing whole</tspan><tspan x="312.76" dy="28">does not mean skipping digestion.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="286" y2="286"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="314.08"><tspan x="103">Filter-feeding</tspan><tspan x="103" dy="28">aquatic animals</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="314.08"><tspan x="312.76">collect small food particles carried in water. They do not obtain</tspan><tspan x="312.76" dy="28">all their food by taking bites.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="354" y2="354"/><rect class="v2-table-frame" x="89" y="42" width="874" height="312"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="42" y2="354"/></g></g>
<g class="v2-reading-block" data-block="nutrient-intro-0" transform="translate(0 828)"><text class="se-copy" x="89" y="24"><tspan x="89">Food contains carbohydrates, proteins, fats and other nutrients. Many large food</tspan><tspan x="89" dy="32">molecules cannot be absorbed as they are. <tspan class="se-bold">Digestion</tspan> breaks them into smaller</tspan></text></g>
<g class="v2-reading-block" data-block="nutrient-intro-1" transform="translate(0 892)"><text class="se-copy" x="89" y="24"><tspan x="89">substances that the body can absorb and use. Mechanical actions break food into</tspan><tspan x="89" dy="32">pieces; digestive enzymes carry out chemical changes.</tspan></text></g>
<g class="v2-reading-block" data-block="digestion-stages-0" transform="translate(0 972)"><text class="se-copy" x="89" y="24"><tspan x="89">Taking food into the body is <tspan class="se-bold">ingestion</tspan>. After digestion, small nutrient molecules</tspan><tspan x="89" dy="32">cross the intestinal wall during <tspan class="se-bold">absorption</tspan>. Cells then use absorbed materials for</tspan></text></g>
<g class="v2-reading-block" data-block="digestion-stages-1" transform="translate(0 1036)"><text class="se-copy" x="89" y="24"><tspan x="89">energy, growth and repair, called <tspan class="se-bold">assimilation</tspan>. Undigested remains eventually</tspan><tspan x="89" dy="32">leave through the anus by <tspan class="se-bold">egestion</tspan>. These terms name different steps, not five</tspan><tspan x="89" dy="32">names for digestion.</tspan></text></g><g transform="translate(0 1148)"><g data-page-illustration="figures/class-7/science/ch09/digestive.png"><image class="science-illustration" href="../../figures/class-7/science/ch09/digestive.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>The digestive system.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">The digestive system.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
