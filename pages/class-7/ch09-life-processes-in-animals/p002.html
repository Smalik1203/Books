<g class="v2-reading-block" data-block="life-processes-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="10.17598" data-space-ratio="2.820"><tspan class="se-bold">Life</tspan><tspan dx="10.17598"> <tspan class="se-bold">processes</tspan></tspan><tspan dx="10.17598"> are</tspan><tspan dx="10.17598"> the</tspan><tspan dx="10.17598"> activities</tspan><tspan dx="10.17598"> that</tspan><tspan dx="10.17598"> maintain</tspan><tspan dx="10.17598"> living</tspan><tspan dx="10.17598"> organisms.</tspan><tspan dx="10.17598"> Nutrition</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="10.19822" data-space-ratio="2.824">supplies<tspan dx="10.19822"> materials</tspan><tspan dx="10.19822"> and</tspan><tspan dx="10.19822"> energy</tspan><tspan dx="10.19822"> sources;</tspan><tspan dx="10.19822"> respiration</tspan><tspan dx="10.19822"> releases</tspan><tspan dx="10.19822"> usable</tspan><tspan dx="10.19822"> energy;</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="life-processes-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="18.76748" data-space-ratio="4.356">circulation<tspan dx="18.76748"> transports</tspan><tspan dx="18.76748"> substances;</tspan><tspan dx="18.76748"> excretion</tspan><tspan dx="18.76748"> removes</tspan><tspan dx="18.76748"> metabolic</tspan><tspan dx="18.76748"> wastes.</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="7.43548" data-space-ratio="2.330">Reproduction<tspan dx="7.43548"> continues</tspan><tspan dx="7.43548"> a</tspan><tspan dx="7.43548"> kind</tspan><tspan dx="7.43548"> of</tspan><tspan dx="7.43548"> organism</tspan><tspan dx="7.43548"> across</tspan><tspan dx="7.43548"> generations,</tspan><tspan dx="7.43548"> although</tspan><tspan dx="7.43548"> an</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">individual can survive without reproducing.</tspan></text></g>
<g class="v2-reading-block" data-block="feeding-intro-0" transform="translate(0 346)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.89575" data-space-ratio="1.518">Observe<tspan dx="2.89575"> familiar</tspan><tspan dx="2.89575"> animals</tspan><tspan dx="2.89575"> without</tspan><tspan dx="2.89575"> disturbing</tspan><tspan dx="2.89575"> or</tspan><tspan dx="2.89575"> feeding</tspan><tspan dx="2.89575"> them.</tspan><tspan dx="2.89575"> They</tspan><tspan dx="2.89575"> obtain</tspan><tspan dx="2.89575"> food</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.59595" data-space-ratio="1.107">in<tspan dx="0.59595"> different</tspan><tspan dx="0.59595"> ways.</tspan><tspan dx="0.59595"> What</tspan><tspan dx="0.59595"> body</tspan><tspan dx="0.59595"> parts</tspan><tspan dx="0.59595"> help</tspan><tspan dx="0.59595"> each</tspan><tspan dx="0.59595"> animal</tspan><tspan dx="0.59595"> reach,</tspan><tspan dx="0.59595"> take</tspan><tspan dx="0.59595"> in</tspan><tspan dx="0.59595"> or</tspan><tspan dx="0.59595"> break</tspan><tspan dx="0.59595"> up</tspan><tspan dx="0.59595"> its</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">food? Separate something you actually observe from an explanation you infer.</tspan></text></g>
<g class="v2-reading-block" data-block="feeding-methods" transform="translate(0 458)"><g data-table-spacing="airy" data-comparison-table="feeding-methods"><text class="v2-table-caption" x="89" y="33.6"><tspan x="89">Different ways of obtaining food</tspan></text><rect class="se-table-head" x="89" y="54" width="874" height="48"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="86.08"><tspan x="103">Animals</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="312.76" y="86.08"><tspan x="312.76">How food is obtained</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="102" y2="102"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="134.07999999999998"><tspan x="103">Bees and</tspan><tspan x="103" dy="28">sunbirds</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="134.07999999999998"><tspan x="312.76">take nectar from flowers using specialised mouthparts or a long</tspan><tspan x="312.76" dy="28">tongue and beak.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="210.07999999999998"><tspan x="103">Young mammals</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="210.07999999999998"><tspan x="312.76">obtain milk from their mothers. Humans, cows and many other</tspan><tspan x="312.76" dy="28">mammals begin life this way.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="254" y2="254"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="286.08"><tspan x="103">Pythons</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="286.08"><tspan x="312.76">swallow prey whole, then digest it internally; swallowing whole</tspan><tspan x="312.76" dy="28">does not mean skipping digestion.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="330" y2="330"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="362.08"><tspan x="103">Filter-feeding</tspan><tspan x="103" dy="28">aquatic animals</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="362.08"><tspan x="312.76">collect small food particles carried in water. They do not obtain</tspan><tspan x="312.76" dy="28">all their food by taking bites.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="406" y2="406"/><rect class="v2-table-frame" x="89" y="54" width="874" height="352"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="54" y2="406"/></g></g>
<g class="v2-reading-block" data-block="nutrient-intro-0" transform="translate(0 892)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.56110" data-space-ratio="1.279">Food<tspan dx="1.56110"> contains</tspan><tspan dx="1.56110"> carbohydrates,</tspan><tspan dx="1.56110"> proteins,</tspan><tspan dx="1.56110"> fats</tspan><tspan dx="1.56110"> and</tspan><tspan dx="1.56110"> other</tspan><tspan dx="1.56110"> nutrients.</tspan><tspan dx="1.56110"> Many</tspan><tspan dx="1.56110"> large</tspan><tspan dx="1.56110"> food</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.32200" data-space-ratio="1.594">molecules<tspan dx="3.32200"> cannot</tspan><tspan dx="3.32200"> be</tspan><tspan dx="3.32200"> absorbed</tspan><tspan dx="3.32200"> as</tspan><tspan dx="3.32200"> they</tspan><tspan dx="3.32200"> are.</tspan><tspan dx="3.32200"> <tspan class="se-bold">Digestion</tspan></tspan><tspan dx="3.32200"> breaks</tspan><tspan dx="3.32200"> them</tspan><tspan dx="3.32200"> into</tspan><tspan dx="3.32200"> smaller</tspan></tspan></text></g><g transform="translate(0 956)"><g data-page-illustration="figures/reference/food/p008-carbohydrates.png"><image class="science-illustration" href="../../figures/reference/food/p008-carbohydrates.png" x="114" y="10" width="824" height="353.2690246516613" preserveAspectRatio="xMidYMid meet"><title>Foods provide materials and energy for the body.</title></image><text class="se-caption" x="526" y="401.2690246516613" text-anchor="middle"><tspan x="526">Foods provide materials and energy for the body.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><pa
