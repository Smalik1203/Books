an><tspan dx="1.89146"> digestive</tspan><tspan dx="1.89146"> tract.</tspan><tspan dx="1.89146"> Food</tspan><tspan dx="1.89146"> does</tspan><tspan dx="1.89146"> not</tspan><tspan dx="1.89146"> simply</tspan><tspan dx="1.89146"> drop</tspan><tspan dx="1.89146"> through</tspan><tspan dx="1.89146"> a</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">passive pipe.</tspan></text></g>
