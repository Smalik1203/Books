<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="stomach-exit-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Churning and chemical changes produce a partly digested, semi-liquid mixture.</tspan><tspan x="89" dy="32">It leaves the stomach gradually and enters the small intestine. Digestion is not</tspan><tspan x="89" dy="32">completed in the stomach, and most nutrient absorption happens farther along.</tspan></text></g>
<g class="v2-reading-block" data-block="beaumont-0" transform="translate(0 224)"><text class="se-copy" x="89" y="24"><tspan x="89">In 1822, Alexis St. Martin survived an accidental gunshot wound that left an</tspan><tspan x="89" dy="32">opening into his stomach. Physician William Beaumont used it to study gastric</tspan></text></g>
<g class="v2-reading-block" data-block="beaumont-1" transform="translate(0 288)"><text class="se-copy" x="89" y="24"><tspan x="89">secretions and the digestion of different foods. These observations helped</tspan><tspan x="89" dy="32">connect stomach movements and chemical action with digestion. This historical</tspan></text></g>
<g class="v2-reading-block" data-block="beaumont-2" transform="translate(0 352)"><text class="se-copy" x="89" y="24"><tspan x="89">case also raises questions about consent and the treatment of research</tspan><tspan x="89" dy="32">participants; it is not an experiment to imitate.</tspan></text></g>
<g class="v2-reading-block" data-block="small-intestine" transform="translate(0 444)"><text class="se-heading" x="89" y="30"><tspan x="89">The small intestine: digesting and absorbing</tspan></text></g>
<g class="v2-reading-block" data-block="lengths-0" transform="translate(0 492)"><text class="se-copy" x="89" y="24"><tspan x="89">The small intestine is narrow but long and tightly coiled. An adult’s may be</tspan><tspan x="89" dy="32">around 6 m long, while the wider large intestine is about 1.5 m long; actual</tspan></text></g>
<g class="v2-reading-block" data-block="lengths-1" transform="translate(0 556)"><text class="se-copy" x="89" y="24"><tspan x="89">lengths vary with age and measurement method. The words small and large refer</tspan><tspan x="89" dy="32">mainly to width, not length. Coiling lets a long digestive surface fit inside the</tspan><tspan x="89" dy="32">abdomen.</tspan></text></g>
<g class="v2-reading-block" data-block="secretions" transform="translate(0 668)"><g data-comparison-table="secretions"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Contributions to digestion in the small intestine</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Source</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="312.76" y="70.08"><tspan x="312.76">Contribution</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Liver</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="110.08"><tspan x="312.76">makes bile, stored in the gallbladder. Bile disperses large fat</tspan><tspan x="312.76" dy="28">globules into smaller droplets, giving enzymes more surface to</tspan><tspan x="312.76" dy="28">work on. This physical dispersal is not the chemical digestion of</tspan><tspan x="312.76" dy="28">fat.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="206" y2="206"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="234.07999999999998"><tspan x="103">Pancreas</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="234.07999999999998"><tspan x="312.76">supplies enzymes that act on carbohydrates, proteins and fats.</tspan><tspan x="312.76" dy="28">Its bicarbonate-rich fluid helps neutralise the acidic mixture</tspan><tspan x="312.76" dy="28">arriving from the stomach.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="302" y2="302"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="330.08"><tspan x="103">Small-intestine</tspan><tspan x="103" dy="28">lining</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="330.08"><tspan x="312.76">supplies enzymes that help complete digestion, producing</tspan><tspan x="312.76" dy="28">substances small enough to be absorbed.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="370" y2="370"/><rect class="v2-table-frame" x="89" y="42" width="874" height="328"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="42" y2="370"/></g></g><g transform="translate(0 1054)"><g data-page-illustration="figures/class-7/science/ch09/digestive.png"><image class="science-illustration" href="../../figures/class-7/science/ch09/digestive.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>The digestive system.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">The digestive system.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
