<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="small-intestine" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">The small intestine: digesting and absorbing</tspan></text></g>
<g class="v2-reading-block" data-block="lengths-0" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89">The small intestine is narrow but long and tightly coiled. An adult’s may be</tspan><tspan x="89" dy="32">around 6 m long, while the wider large intestine is about 1.5 m long; actual</tspan></text></g>
<g class="v2-reading-block" data-block="lengths-1" transform="translate(0 224)"><text class="se-copy" x="89" y="24"><tspan x="89">lengths vary with age and measurement method. The words small and large refer</tspan><tspan x="89" dy="32">mainly to width, not length. Coiling lets a long digestive surface fit inside the</tspan><tspan x="89" dy="32">abdomen.</tspan></text></g>
<g class="v2-reading-block" data-block="secretions-0" transform="translate(0 336)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Liver:</tspan> makes bile, stored in the gallbladder. Bile disperses large fat globules</tspan><tspan x="112" dy="32">into smaller droplets, giving enzymes more surface to work on. This physical</tspan><tspan x="112" dy="32">dispersal is not the chemical digestion of fat.</tspan></text></g>
<g class="v2-reading-block" data-block="secretions-1" transform="translate(0 442)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Pancreas:</tspan> supplies enzymes that act on carbohydrates, proteins and fats. Its</tspan><tspan x="112" dy="32">bicarbonate-rich fluid helps neutralise the acidic mixture arriving from the</tspan><tspan x="112" dy="32">stomach.</tspan></text></g>
<g class="v2-reading-block" data-block="secretions-2" transform="translate(0 548)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Small-intestine</tspan> <tspan class="se-bold">lining:</tspan> supplies enzymes that help complete digestion,</tspan><tspan x="112" dy="32">producing substances small enough to be absorbed.</tspan></text></g>
<g class="v2-reading-block" data-block="neutralisation-0" transform="translate(0 628)"><text class="se-copy" x="89" y="24"><tspan x="89">This is a connection with your chapter on acids and bases. Conditions suitable</tspan><tspan x="89" dy="32">for stomach enzymes are not suitable for every intestinal enzyme. Secretions</tspan></text></g>
<g class="v2-reading-block" data-block="neutralisation-1" transform="translate(0 692)"><text class="se-copy" x="89" y="24"><tspan x="89">change the chemical conditions as food moves onwards. Food enters the</tspan><tspan x="89" dy="32">intestine; secretions reach it through small ducts.</tspan></text></g>
<g class="v2-reading-block" data-block="villi-intro" transform="translate(0 772)"><text class="se-copy" x="89" y="24"><tspan x="89">The inner surface has many small finger-like projections called <tspan class="se-bold">villi</tspan>. Their thin</tspan><tspan x="89" dy="32">covering and large combined surface bring digested nutrients close to transport</tspan><tspan x="89" dy="32">vessels. Villi project into the space carrying digested food; they are not little teeth</tspan><tspan x="89" dy="32">that chew it.</tspan></text></g>
<g class="v2-reading-block" data-block="villi-art" transform="translate(0 916)"><g class="v2-life-diagram" data-diagram="villi"><image class="science-illustration" data-art="villi" href="../../figures/class-7/science/ch09/villi.png" x="263.5" y="40" width="525" height="350" preserveAspectRatio="xMidYMid meet"/><text class="v2-life-label" x="100" y="64" text-anchor="start">Villi</text><line class="v2-life-line" x1="151" y1="58" x2="301" y2="120"/><text class="v2-life-label" x="100" y="192" text-anchor="start">Thin surface</text><line class="v2-life-line" x1="249" y1="187" x2="293" y2="193"/><text class="v2-life-label" x="783" y="36" text-anchor="start">Blood vessels</text><line class="v2-life-line" x1="798" y1="45" x2="674" y2="186"/><text class="v2-life-label" x="840" y="351" text-anchor="start">Lymph</text><text class="v2-life-label" x="840" y="377" text-anchor="start">vessel</text><line class="v2-life-line" x1="827" y1="369" x2="670" y2="243"/></g><text class="se-caption" x="89" y="435.88"><tspan x="89">An enlarged patch of intestinal lining. Villi increase the surface available for absorption; the</tspan><tspan x="89" dy="27">colours distinguish tissues and vessels.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
