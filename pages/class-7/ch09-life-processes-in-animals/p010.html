<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="bird-digestion" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">A bird has no teeth. In many birds, a muscular <tspan class="se-bold">gizzard</tspan> grinds swallowed food;</tspan><tspan x="89" dy="32">small swallowed stones or grit may help. A glandular part of the stomach</tspan><tspan x="89" dy="32">supplies digestive secretions. The form and strength of these parts vary with diet.</tspan><tspan x="89" dy="32">Do not offer birds grit or unusual food as an experiment.</tspan></text></g>
<g class="v2-reading-block" data-block="bird-art" transform="translate(0 256)"><g class="v2-life-diagram" data-diagram="bird"><image class="science-illustration" data-art="bird" href="../../figures/class-7/science/ch09/bird.png" x="277.5" y="26" width="495" height="330" preserveAspectRatio="xMidYMid meet"/><text class="v2-life-label" x="100" y="59" text-anchor="start">Oesophagus</text><line class="v2-life-line" x1="241" y1="54" x2="386" y2="105"/><text class="v2-life-label" x="100" y="139" text-anchor="start">Crop</text><line class="v2-life-line" x1="155" y1="134" x2="418" y2="174"/><text class="v2-life-label" x="100" y="228" text-anchor="start">Glandular</text><text class="v2-life-label" x="100" y="254" text-anchor="start">stomach</text><line class="v2-life-line" x1="222" y1="240" x2="454" y2="196"/><text class="v2-life-label" x="787" y="249" text-anchor="start">Gizzard</text><line class="v2-life-line" x1="776" y1="244" x2="519" y2="224"/><text class="v2-life-label" x="787" y="321" text-anchor="start">Intestine</text><line class="v2-life-line" x1="776" y1="316" x2="624" y2="243"/></g><text class="se-caption" x="89" y="405.88"><tspan x="89">A hen’s connected digestive passage: the crop stores food, the glandular stomach supplies</tspan><tspan x="89" dy="27">secretions, and the gizzard grinds it.</tspan></text></g>
<g class="v2-reading-block" data-block="digestion-comparison" transform="translate(0 717)"><g data-comparison-table="digestion-comparison"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Food processing in ruminants and birds</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="260.32" y="70.08"><tspan x="260.32">Ruminant</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="618.6600000000001" y="70.08"><tspan x="618.6600000000001">Bird</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Mechanical</tspan><tspan x="103" dy="28">action</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="110.08"><tspan x="260.32">chewing, returning cud and</tspan><tspan x="260.32" dy="28">chewing again.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="110.08"><tspan x="618.6600000000001">grinding by a muscular gizzard.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">Distinctive</tspan><tspan x="103" dy="28">part</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="178.07999999999998"><tspan x="260.32">a rumen with microbes that help</tspan><tspan x="260.32" dy="28">process plant material.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="178.07999999999998"><tspan x="618.6600000000001">a strong gizzard; grit helps in</tspan><tspan x="618.6600000000001" dy="28">many species.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="218" y2="218"/><rect class="v2-table-frame" x="89" y="42" width="874" height="176"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="42" y2="218"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="42" y2="218"/></g></g>
<g class="v2-reading-block" data-block="nutrition-respiration-link-0" transform="translate(0 951)"><text class="se-copy" x="89" y="24"><tspan x="89">These structures reflect inherited differences that developed over generations;</tspan><tspan x="89" dy="32">animals did not choose to redesign their organs. Digestion supplies small</tspan></text></g>
<g class="v2-reading-block" data-block="nutrition-respiration-link-1" transform="translate(0 1015)"><text class="se-copy" x="89" y="24"><tspan x="89">nutrients, but cells must still release usable energy from them. That brings us to</tspan><tspan x="89" dy="32">respiration.</tspan></text></g>
<g class="v2-reading-block" data-block="respiration" transform="translate(0 1107)"><text class="v2-title" x="89" y="38"><tspan x="89">9.2 Respiration in Animals</tspan></text></g>
<g class="v2-reading-block" data-block="respiration-intro-0" transform="translate(0 1165)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Respiration</tspan> is the set of chemical processes in cells that releases usable energy</tspan><tspan x="89" dy="32">from food molecules. In the aerobic respiration explored here, cells use oxygen.</tspan></text></g>
<g class="v2-reading-block" data-block="respiration-intro-1" transform="translate(0 1229)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Breathing</tspan> moves air into and out of lungs; <tspan class="se-bold">gas</tspan> <tspan class="se-bold">exchange</tspan> transfers oxygen and</tspan><tspan x="89" dy="32">carbon dioxide across a surface. These are connected processes, but they happen</tspan><tspan x="89" dy="32">in different places.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
