<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="stomach" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">The stomach: mixing and chemical digestion</tspan></text></g>
<g class="v2-reading-block" data-block="stomach-actions-0" transform="translate(0 160)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.51368" data-space-ratio="1.628">The<tspan dx="3.51368"> stomach</tspan><tspan dx="3.51368"> is</tspan><tspan dx="3.51368"> a</tspan><tspan dx="3.51368"> muscular</tspan><tspan dx="3.51368"> pouch.</tspan><tspan dx="3.51368"> Its</tspan><tspan dx="3.51368"> walls</tspan><tspan dx="3.51368"> churn</tspan><tspan dx="3.51368"> food</tspan><tspan dx="3.51368"> and</tspan><tspan dx="3.51368"> mix</tspan><tspan dx="3.51368"> it</tspan><tspan dx="3.51368"> with</tspan><tspan dx="3.51368"> gastric</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.42010" data-space-ratio="1.969">secretions.<tspan dx="5.42010"> Different</tspan><tspan dx="5.42010"> components</tspan><tspan dx="5.42010"> of</tspan><tspan dx="5.42010"> these</tspan><tspan dx="5.42010"> secretions</tspan><tspan dx="5.42010"> have</tspan><tspan dx="5.42010"> different</tspan><tspan dx="5.42010"> jobs;</tspan><tspan dx="5.42010"> they</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">should not all be called acid.</tspan></text></g>
<g class="v2-reading-block" data-block="stomach-components" transform="translate(0 272)"><g data-table-spacing="airy" data-comparison-table="stomach-components"><text class="v2-table-caption" x="89" y="33.6"><tspan x="89">Different roles in stomach secretions</tspan></text><rect class="se-table-head" x="89" y="54" width="874" height="48"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="86.08"><tspan x="103">Component</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="312.76" y="86.08"><tspan x="312.76">Role</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="102" y2="102"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="134.07999999999998"><tspan x="103">Digestive</tspan><tspan x="103" dy="28">enzymes</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="134.07999999999998"><tspan x="312.76">begin the chemical breakdown of proteins into smaller</tspan><tspan x="312.76" dy="28">components.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="210.07999999999998"><tspan x="103">Acid</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="210.07999999999998"><tspan x="312.76">provides conditions in which stomach enzymes work and kills</tspan><tspan x="312.76" dy="28">many swallowed microorganisms. It does not sterilise every</tspan><tspan x="312.76" dy="28">meal.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="282" y2="282"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="314.08"><tspan x="103">Mucus and other</tspan><tspan x="103" dy="28">protective factors</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="314.08"><tspan x="312.76">help protect the living stomach lining from its own digestive</tspan><tspan x="312.76" dy="28">contents.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="358" y2="358"/><rect class="v2-table-frame" x="89" y="54" width="874" height="304"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="54" y2="358"/></g></g>
<g class="v2-reading-block" data-block="stomach-exit-0" transform="translate(0 658)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.45831" data-space-ratio="1.440">Churning<tspan dx="2.45831"> and</tspan><tspan dx="2.45831"> chemical</tspan><tspan dx="2.45831"> changes</tspan><tspan dx="2.45831"> produce</tspan><tspan dx="2.45831"> a</tspan><tspan dx="2.45831"> partly</tspan><tspan dx="2.45831"> digested,</tspan><tspan dx="2.45831"> semi-liquid</tspan><tspan dx="2.45831"> mixture.</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.57983" data-space-ratio="1.640">It<tspan dx="3.57983"> leaves</tspan><tspan dx="3.57983"> the</tspan><tspan dx="3.57983"> stomach</tspan><tspan dx="3.57983"> gradually</tspan><tspan dx="3.57983"> and</tspan><tspan dx="3.57983"> enters</tspan><tspan dx="3.57983"> the</tspan><tspan dx="3.57983"> small</tspan><tspan dx="3.57983"> intestine.</tspan><tspan dx="3.57983"> Digestion</tspan><tspan dx="3.57983"> is</tspan><tspan dx="3.57983"> not</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">completed in the stomach, and most nutrient absorption happens farther along.</tspan></text></g><g transform="translate(0 770)"><g data-page-illustration="figures/class-7/science/layout-review/stomach.png"><image class="science-illustration" href="../../figures/class-7/science/layout-review/stomach.png" x="121" y="10" width="810" height="540" preserveAspectRatio="xMidYMid meet"><title>A cutaway shows the muscular wall and inner folds of the stomach.</title></image><text class="se-caption" x="526" y="588" text-anchor="middle"><tspan x="526">A cutaway shows the muscular wall and inner folds of the stomach.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="
