<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="absorption-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Many absorbed nutrients, including simple sugars and amino acids, enter small</tspan><tspan x="89" dy="32">blood vessels. Most absorbed fats first enter lymph vessels before reaching the</tspan></text></g>
<g class="v2-reading-block" data-block="absorption-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">blood. Transport carries nutrients away, helping maintain absorption. Cells use</tspan><tspan x="89" dy="32">these materials to release energy or to build and repair body tissues.</tspan></text></g>
<g class="v2-reading-block" data-block="celiac-0" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">In <tspan class="se-bold">coeliac</tspan> <tspan class="se-bold">(celiac)</tspan> <tspan class="se-bold">disease</tspan>, gluten triggers an immune reaction that damages the</tspan><tspan x="89" dy="32">small-intestine lining and can reduce nutrient absorption. Wheat, barley and rye</tspan></text></g>
<g class="v2-reading-block" data-block="celiac-1" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89">contain gluten. A clinician diagnoses the condition and guides a gluten-free diet;</tspan><tspan x="89" dy="32">do not diagnose it or remove foods on your own. Jowar, bajra and ragi are</tspan><tspan x="89" dy="32">naturally gluten-free, but preparation and contamination also matter.</tspan></text></g>
<g class="v2-reading-block" data-block="large-intestine" transform="translate(0 444)"><text class="se-heading" x="89" y="30"><tspan x="89">The large intestine: water and egestion</tspan></text></g>
<g class="v2-reading-block" data-block="colon-0" transform="translate(0 492)"><text class="se-copy" x="89" y="24"><tspan x="89">Material not absorbed in the small intestine moves into the large intestine, where</tspan><tspan x="89" dy="32">more water and some salts are absorbed. Much water has already been absorbed</tspan></text></g>
<g class="v2-reading-block" data-block="colon-1" transform="translate(0 556)"><text class="se-copy" x="89" y="24"><tspan x="89">in the small intestine. The remaining material forms stool, which is stored in the</tspan><tspan x="89" dy="32">rectum and eventually passes out through the anus. <tspan class="se-bold">Egestion</tspan> removes</tspan></text></g>
<g class="v2-reading-block" data-block="colon-2" transform="translate(0 620)"><text class="se-copy" x="89" y="24"><tspan x="89">undigested remains; <tspan class="se-bold">excretion</tspan> removes wastes produced by the body’s chemical</tspan><tspan x="89" dy="32">processes.</tspan></text></g>
<g class="v2-reading-block" data-block="microbes-0" transform="translate(0 700)"><text class="se-copy" x="89" y="24"><tspan x="89">Microorganisms in the large intestine use some material that our own enzymes</tspan><tspan x="89" dy="32">cannot digest, including some dietary fibre. Their products can nourish intestinal</tspan></text></g>
<g class="v2-reading-block" data-block="microbes-1" transform="translate(0 764)"><text class="se-copy" x="89" y="24"><tspan x="89">cells and contribute certain vitamins. The gut contains a community of</tspan><tspan x="89" dy="32">organisms; “all bacteria are harmful” is therefore a poor explanation of digestion.</tspan></text></g>
<g class="v2-reading-block" data-block="digestive-health-0" transform="translate(0 844)"><text class="se-copy" x="89" y="24"><tspan x="89">A varied diet containing vegetables, fruits and whole grains supplies fibre. Water</tspan><tspan x="89" dy="32">and regular activity also support normal bowel function. Fermented foods such</tspan></text></g>
<g class="v2-reading-block" data-block="digestive-health-1" transform="translate(0 908)"><text class="se-copy" x="89" y="24"><tspan x="89">as curd, buttermilk, kanji, gundruk or poita bhat differ in preparation and</tspan><tspan x="89" dy="32">microbial content. Food hygiene, storage, salt and sugar matter; being fermented</tspan><tspan x="89" dy="32">does not make every food a cure or suitable for everyone.</tspan></text></g>
<g class="v2-reading-block" data-block="oral-care-0" transform="translate(0 1020)"><text class="se-copy" x="89" y="24"><tspan x="89">Care begins before food reaches the stomach: brush twice daily with fluoride</tspan><tspan x="89" dy="32">toothpaste, clean between teeth as advised, and visit a dentist for routine care.</tspan></text></g>
<g class="v2-reading-block" data-block="oral-care-1" transform="translate(0 1084)"><text class="se-copy" x="89" y="24"><tspan x="89">Discuss elders’ oral-hygiene practices respectfully, then compare them with</tspan><tspan x="89" dy="32">reliable dental guidance. Rinsing after meals does not replace brushing.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
