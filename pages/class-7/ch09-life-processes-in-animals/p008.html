<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="neutralisation-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">This is a connection with your chapter on acids and bases. Conditions suitable</tspan><tspan x="89" dy="32">for stomach enzymes are not suitable for every intestinal enzyme. Secretions</tspan></text></g>
<g class="v2-reading-block" data-block="neutralisation-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">change the chemical conditions as food moves onwards. Food enters the</tspan><tspan x="89" dy="32">intestine; secretions reach it through small ducts.</tspan></text></g>
<g class="v2-reading-block" data-block="villi-intro" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">The inner surface has many small finger-like projections called <tspan class="se-bold">villi</tspan>. Their thin</tspan><tspan x="89" dy="32">covering and large combined surface bring digested nutrients close to transport</tspan><tspan x="89" dy="32">vessels. Villi project into the space carrying digested food; they are not little teeth</tspan><tspan x="89" dy="32">that chew it.</tspan></text></g>
<g class="v2-reading-block" data-block="villi-art" transform="translate(0 400)"><g class="v2-life-diagram" data-diagram="villi"><image class="science-illustration" data-art="villi" href="../../figures/class-7/science/ch09/villi.png" x="263.5" y="40" width="525" height="350" preserveAspectRatio="xMidYMid meet"/><text class="v2-life-label" x="100" y="64" text-anchor="start">Villi</text><line class="v2-life-line" x1="151" y1="58" x2="301" y2="120"/><text class="v2-life-label" x="100" y="192" text-anchor="start">Thin surface</text><line class="v2-life-line" x1="249" y1="187" x2="293" y2="193"/><text class="v2-life-label" x="783" y="36" text-anchor="start">Blood vessels</text><line class="v2-life-line" x1="798" y1="45" x2="674" y2="186"/><text class="v2-life-label" x="840" y="351" text-anchor="start">Lymph</text><text class="v2-life-label" x="840" y="377" text-anchor="start">vessel</text><line class="v2-life-line" x1="827" y1="369" x2="670" y2="243"/></g><text class="se-caption" x="89" y="435.88"><tspan x="89">An enlarged patch of intestinal lining. Villi increase the surface available for absorption; the</tspan><tspan x="89" dy="27">colours distinguish tissues and vessels.</tspan></text></g>
<g class="v2-reading-block" data-block="absorption-0" transform="translate(0 891)"><text class="se-copy" x="89" y="24"><tspan x="89">Many absorbed nutrients, including simple sugars and amino acids, enter small</tspan><tspan x="89" dy="32">blood vessels. Most absorbed fats first enter lymph vessels before reaching the</tspan></text></g>
<g class="v2-reading-block" data-block="absorption-1" transform="translate(0 955)"><text class="se-copy" x="89" y="24"><tspan x="89">blood. Transport carries nutrients away, helping maintain absorption. Cells use</tspan><tspan x="89" dy="32">these materials to release energy or to build and repair body tissues.</tspan></text></g>
<g class="v2-reading-block" data-block="celiac-0" transform="translate(0 1035)"><text class="se-copy" x="89" y="24"><tspan x="89">In <tspan class="se-bold">coeliac</tspan> <tspan class="se-bold">(celiac)</tspan> <tspan class="se-bold">disease</tspan>, gluten triggers an immune reaction that damages the</tspan><tspan x="89" dy="32">small-intestine lining and can reduce nutrient absorption. Wheat, barley and rye</tspan></text></g>
<g class="v2-reading-block" data-block="celiac-1" transform="translate(0 1099)"><text class="se-copy" x="89" y="24"><tspan x="89">contain gluten. A clinician diagnoses the condition and guides a gluten-free diet;</tspan><tspan x="89" dy="32">do not diagnose it or remove foods on your own. Jowar, bajra and ragi are</tspan><tspan x="89" dy="32">naturally gluten-free, but preparation and contamination also matter.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
