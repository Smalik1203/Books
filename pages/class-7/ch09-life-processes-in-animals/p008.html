<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="villi-art" transform="translate(0 112)"><g class="v2-life-diagram" data-diagram="villi"><image class="science-illustration" data-art="villi" href="../../figures/class-7/science/ch09/villi.png" x="263.5" y="40" width="525" height="350" preserveAspectRatio="xMidYMid meet"/><text class="v2-life-label" x="100" y="64" text-anchor="start">Villi</text><line class="v2-life-line" x1="151" y1="58" x2="301" y2="120"/><text class="v2-life-label" x="100" y="192" text-anchor="start">Thin surface</text><line class="v2-life-line" x1="249" y1="187" x2="293" y2="193"/><text class="v2-life-label" x="783" y="36" text-anchor="start">Blood vessels</text><line class="v2-life-line" x1="798" y1="45" x2="674" y2="186"/><text class="v2-life-label" x="840" y="351" text-anchor="start">Lymph</text><text class="v2-life-label" x="840" y="377" text-anchor="start">vessel</text><line class="v2-life-line" x1="827" y1="369" x2="670" y2="243"/></g><text class="se-caption" x="89" y="435.88"><tspan x="89">An enlarged patch of intestinal lining. Villi increase the surface available for absorption; the</tspan><tspan x="89" dy="27">colours distinguish tissues and vessels.</tspan></text></g>
<g class="v2-reading-block" data-block="absorption-0" transform="translate(0 603)"><text class="se-copy" x="89" y="24"><tspan x="89">Many absorbed nutrients, including simple sugars and amino acids, enter small</tspan><tspan x="89" dy="32">blood vessels. Most absorbed fats first enter lymph vessels before reaching the</tspan></text></g>
<g class="v2-reading-block" data-block="absorption-1" transform="translate(0 667)"><text class="se-copy" x="89" y="24"><tspan x="89">blood. Transport carries nutrients away, helping maintain absorption. Cells use</tspan><tspan x="89" dy="32">these materials to release energy or to build and repair body tissues.</tspan></text></g>
<g class="v2-reading-block" data-block="celiac-0" transform="translate(0 747)"><text class="se-copy" x="89" y="24"><tspan x="89">In <tspan class="se-bold">coeliac</tspan> <tspan class="se-bold">(celiac)</tspan> <tspan class="se-bold">disease</tspan>, gluten triggers an immune reaction that damages the</tspan><tspan x="89" dy="32">small-intestine lining and can reduce nutrient absorption. Wheat, barley and rye</tspan></text></g>
<g class="v2-reading-block" data-block="celiac-1" transform="translate(0 811)"><text class="se-copy" x="89" y="24"><tspan x="89">contain gluten. A clinician diagnoses the condition and guides a gluten-free diet;</tspan><tspan x="89" dy="32">do not diagnose it or remove foods on your own. Jowar, bajra and ragi are</tspan><tspan x="89" dy="32">naturally gluten-free, but preparation and contamination also matter.</tspan></text></g>
<g class="v2-reading-block" data-block="large-intestine" transform="translate(0 935)"><text class="se-heading" x="89" y="30"><tspan x="89">The large intestine: water and egestion</tspan></text></g>
<g class="v2-reading-block" data-block="colon" transform="translate(0 983)"><g data-comparison-table="colon"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Egestion and excretion</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Egestion</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="540" y="70.08"><tspan x="540">Excretion</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103"><tspan class="se-bold">Egestion</tspan> removes undigested remains.</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="110.08"><tspan x="540"><tspan class="se-bold">Excretion</tspan> removes wastes produced by</tspan><tspan x="540" dy="28">the body’s chemical processes.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><rect class="v2-table-frame" x="89" y="42" width="874" height="108"/><line class="v2-table-rule" x1="526" x2="526" y1="42" y2="150"/><text class="v2-table-note" x="89" y="182.88"><tspan x="89">Material not absorbed in the small intestine moves into the large intestine, where more water</tspan><tspan x="89" dy="26">and some salts are absorbed. Much water has already been absorbed in the small intestine.</tspan><tspan x="89" dy="26">The remaining material forms stool, which is stored in the rectum and eventually passes out</tspan><tspan x="89" dy="26">through the anus.</tspan></text></g></g>
<g class="v2-reading-block" data-block="microbes-0" transform="translate(0 1265)"><text class="se-copy" x="89" y="24"><tspan x="89">Microorganisms in the large intestine use some material that our own enzymes</tspan><tspan x="89" dy="32">cannot digest, including some dietary fibre. Their products can nourish intestinal</tspan></text></g>
<g class="v2-reading-block" data-block="microbes-1" transform="translate(0 1329)"><text class="se-copy" x="89" y="24"><tspan x="89">cells and contribute certain vitamins. The gut contains a community of</tspan><tspan x="89" dy="32">organisms; “all bacteria are harmful” is therefore a poor explanation of digestion.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
