<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="17"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 17"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="air-comparison" transform="translate(0 112)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Typical proportions in inhaled and exhaled air</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Gas</tspan></text><text class="v2-table-heading" x="400.16" y="76.08"><tspan x="400.16">Inhaled room air</tspan></text><text class="v2-table-heading" x="688.58" y="76.08"><tspan x="688.58">Exhaled air</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Oxygen</tspan></text><text class="se-copy se-table-copy" x="400.16" y="128.07999999999998"><tspan x="400.16">About 21%</tspan></text><text class="se-copy se-table-copy" x="688.58" y="128.07999999999998"><tspan x="688.58">About 16–17%</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="146" y2="146"/><text class="se-copy se-table-copy" x="103" y="180.07999999999998"><tspan x="103">Carbon dioxide</tspan></text><text class="se-copy se-table-copy" x="400.16" y="180.07999999999998"><tspan x="400.16">About 0.04%</tspan></text><text class="se-copy se-table-copy" x="688.58" y="180.07999999999998"><tspan x="688.58">About 4–5%</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="198" y2="198"/><rect class="v2-table-frame" x="89" y="42" width="874" height="156"/><line class="v2-table-rule" x1="386.16" x2="386.16" y1="42" y2="198"/><line class="v2-table-rule" x1="674.58" x2="674.58" y1="42" y2="198"/><text class="v2-table-note" x="89" y="230.88"><tspan x="89">These are approximate teaching values, not measurements from the lime-water test. Other</tspan><tspan x="89" dy="26">gases make up most of the remainder; exhaled air also contains water vapour. Values vary</tspan><tspan x="89" dy="26">with conditions.</tspan></text></g>
<g class="v2-reading-block" data-block="air-reading-0" transform="translate(0 420)"><text class="se-copy" x="89" y="24"><tspan x="89">Read across the oxygen row: exhaled air still contains substantial oxygen. Read</tspan><tspan x="89" dy="32">across the carbon-dioxide row: its proportion is higher after passage through the</tspan></text></g>
<g class="v2-reading-block" data-block="air-reading-1" transform="translate(0 484)"><text class="se-copy" x="89" y="24"><tspan x="89">body. We inhale a mixture called air, not pure oxygen, and we do not exhale pure</tspan><tspan x="89" dy="32">carbon dioxide.</tspan></text></g>
<g class="v2-reading-block" data-block="cell-energy" transform="translate(0 576)"><text class="se-heading" x="89" y="30"><tspan x="89">Respiration happens in cells</tspan></text></g>
<g class="v2-reading-block" data-block="cell-chemistry-0" transform="translate(0 624)"><text class="se-copy" x="89" y="24"><tspan x="89">Glucose absorbed after digestion can react with oxygen through many controlled</tspan><tspan x="89" dy="32">chemical steps in cells. Energy stored in food becomes available for movement,</tspan></text></g>
<g class="v2-reading-block" data-block="cell-chemistry-1" transform="translate(0 688)"><text class="se-copy" x="89" y="24"><tspan x="89">growth, repair and other cell activities; some is released as heat. The process is</tspan><tspan x="89" dy="32">not a tiny flame inside the body.</tspan></text></g>
<g class="v2-reading-block" data-block="respiration-equation" transform="translate(0 768)"><text class="v2-equation" x="89" y="30"><tspan x="89">Glucose + oxygen → carbon dioxide + water</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">Aerobic respiration releases usable energy. The word equation summarises many reactions;</tspan><tspan x="89" dy="27">energy is released, not a material made from nothing.</tspan></text></g>
<g class="v2-reading-block" data-block="breathing-respiration" transform="translate(0 892)"><g data-comparison-table="breathing-respiration"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Breathing and cellular respiration</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="260.32" y="70.08"><tspan x="260.32">Breathing</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="618.6600000000001" y="70.08"><tspan x="618.6600000000001">Cellular respiration</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">What</tspan><tspan x="103" dy="28">happens</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="110.08"><tspan x="260.32">air moves into and out of the</tspan><tspan x="260.32" dy="28">lungs.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="110.08"><tspan x="618.6600000000001">chemical reactions release</tspan><tspan x="618.6600000000001" dy="28">usable energy from food.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">Where</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="178.07999999999998"><tspan x="260.32">the respiratory air passages and</tspan><tspan x="260.32" dy="28">lungs.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="178.07999999999998"><tspan x="618.6600000000001">living cells throughout the body.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="218" y2="218"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="246.07999999999998"><tspan x="103">Role</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="246.07999999999998"><tspan x="260.32">renews air at gas-exchange</tspan><tspan x="260.32" dy="28">surfaces.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="246.07999999999998"><tspan x="618.6600000000001">powers cell functions; aerobic</tspan><tspan x="618.6600000000001" dy="28">respiration uses oxygen.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="286" y2="286"/><rect class="v2-table-frame" x="89" y="42" width="874" height="244"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="42" y2="286"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="42" y2="286"/></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">17</text></g></svg></div></div></section>
