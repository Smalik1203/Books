<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="17"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 17"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="circulation-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">The <tspan class="se-bold">circulatory</tspan> <tspan class="se-bold">system</tspan> contains the heart, blood and blood vessels. The heart</tspan><tspan x="89" dy="32">pumps; blood transports oxygen and absorbed nutrients towards tissues and</tspan></text></g>
<g class="v2-reading-block" data-block="circulation-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">carries carbon dioxide and other wastes away. The lungs remove carbon dioxide;</tspan><tspan x="89" dy="32">other organs handle other wastes. A blood vessel is a transport route, not a</tspan><tspan x="89" dy="32">second food pipe.</tspan></text></g>
<g class="v2-reading-block" data-block="connections-pause" transform="translate(0 288)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Trace one glucose molecule from digested food and one oxygen molecule</tspan><tspan x="113" dy="32">from inhaled air until they reach a body cell. Which surfaces must each</tspan><tspan x="113" dy="32">cross, and which system carries them onwards?</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">A person breathes faster after running. Does this mean digestion is</tspan><tspan x="113" dy="32">happening in the lungs? Explain how digestion, circulation and cellular</tspan><tspan x="113" dy="32">respiration are connected without confusing their jobs.</tspan></text></g>
<g class="v2-reading-block" data-block="respiratory-health" transform="translate(0 616)"><text class="se-heading" x="89" y="30"><tspan x="89">Air, activity and respiratory health</tspan></text></g>
<g class="v2-reading-block" data-block="activity-breathing-0" transform="translate(0 664)"><text class="se-copy" x="89" y="24"><tspan x="89">During activity, working cells usually require more energy and produce more</tspan><tspan x="89" dy="32">carbon dioxide. Breathing and circulation adjust to these demands. A breathing</tspan></text></g>
<g class="v2-reading-block" data-block="activity-breathing-1" transform="translate(0 728)"><text class="se-copy" x="89" y="24"><tspan x="89">rate also depends on recent effort, recovery time, emotion and health. One</tspan><tspan x="89" dy="32">measurement cannot rank classmates’ fitness or diagnose illness. Do not hold</tspan><tspan x="89" dy="32">your breath or exercise to exhaustion for this lesson.</tspan></text></g>
<g class="v2-reading-block" data-block="smoke-0" transform="translate(0 840)"><text class="se-copy" x="89" y="24"><tspan x="89">Tobacco smoke damages the respiratory system and increases the risk of serious</tspan><tspan x="89" dy="32">disease, including lung cancer. <tspan class="se-bold">Second-hand</tspan> <tspan class="se-bold">smoke</tspan> is smoke breathed by people</tspan></text></g>
<g class="v2-reading-block" data-block="smoke-1" transform="translate(0 904)"><text class="se-copy" x="89" y="24"><tspan x="89">who are not smoking; it also harms health and can worsen breathing problems.</tspan><tspan x="89" dy="32">Clean shared air matters, especially for children and people with respiratory</tspan><tspan x="89" dy="32">conditions.</tspan></text></g>
<g class="v2-reading-block" data-block="breathing-traditions-0" transform="translate(0 1016)"><text class="se-copy" x="89" y="24"><tspan x="89">Breathing practices appear in yoga, chanting and other traditions. Some slow,</tspan><tspan x="89" dy="32">comfortable breathing practices may help relaxation, but they are not substitutes</tspan></text></g>
<g class="v2-reading-block" data-block="breathing-traditions-1" transform="translate(0 1080)"><text class="se-copy" x="89" y="24"><tspan x="89">for medical care. Claims that a particular practice cures disease or makes cold</tspan><tspan x="89" dy="32">exposure safe need evidence. Learn about practices such as pranayama or</tspan></text></g>
<g class="v2-reading-block" data-block="breathing-traditions-2" transform="translate(0 1144)"><text class="se-copy" x="89" y="24"><tspan x="89">Tummo through reading; do not attempt breath-holding, rapid-breathing or</tspan><tspan x="89" dy="32">cold-exposure challenges.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">17</text></g></svg></div></div></section>
