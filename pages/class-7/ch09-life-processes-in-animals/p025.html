r.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="2.08137" data-space-ratio="1.372">Oxygen<tspan dx="2.08137"> and</tspan><tspan dx="2.08137"> carbon</tspan><tspan dx="2.08137"> dioxide</tspan><tspan dx="2.08137"> cross</tspan><tspan dx="2.08137"> between</tspan><tspan dx="2.08137"> alveolar</tspan><tspan dx="2.08137"> air</tspan><tspan dx="2.08137"> and</tspan><tspan dx="2.08137"> blood</tspan><tspan dx="2.08137"> through</tspan><tspan dx="2.08137"> thin</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">walls. Exhaled air still contains oxygen.</tspan></text><text class="se-copy" x="89" y="796" text-anchor="start">•</text><text class="se-copy" x="112" y="796" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="5.04822" data-space-ratio="1.903">Aerobic<tspan dx="5.04822"> respiration</tspan><tspan dx="5.04822"> uses</tspan><tspan dx="5.04822"> glucose</tspan><tspan dx="5.04822"> and</tspan><tspan dx="5.04822"> oxygen</tspan><tspan dx="5.04822"> and</tspan><tspan dx="5.04822"> forms</tspan><tspan dx="5.04822"> carbon</tspan><tspan dx="5.04822"> dioxide</tspan><tspan dx="5.04822"> and</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">water while releasing usable energy.</tspan></text><text class="se-copy" x="89" y="870" text-anchor="start">•</text><text class="se-copy" x="112" y="870" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="4.72316" data-space-ratio="1.845">Breathing<tspan dx="4.72316"> moves</tspan><tspan dx="4.72316"> air;</tspan><tspan dx="4.72316"> respiration</tspan><tspan dx="4.72316"> is</tspan><tspan dx="4.72316"> chemical</tspan><tspan dx="4.72316"> change</tspan><tspan dx="4.72316"> in</tspan><tspan dx="4.72316"> cells.</tspan><tspan dx="4.72316"> The</tspan><tspan dx="4.72316"> heart</tspan><tspan dx="4.72316"> and</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">blood vessels connect gas exchange, absorbed nutrients and body tissues.</tspan></text><text class="se-copy" x="89" y="944" text-anchor="start">•</text><text class="se-copy" x="112" y="944" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="5.16908" data-space-ratio="1.924">Other<tspan dx="5.16908"> animals</tspan><tspan dx="5.16908"> use</tspan><tspan dx="5.16908"> lungs,</tspan><tspan dx="5.16908"> gills</tspan><tspan dx="5.16908"> or</tspan><tspan dx="5.16908"> moist</tspan><tspan dx="5.16908"> skin.</tspan><tspan dx="5.16908"> These</tspan><tspan dx="5.16908"> exchange</tspan><tspan dx="5.16908"> surfaces</tspan><tspan dx="5.16908"> have</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">structures suited to their environments.</tspan></text><text class="se-copy" x="89" y="1018" text-anchor="start">•</text><text class="se-copy" x="112" y="1018" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="3.48034" data-space-ratio="1.622">A<tspan dx="3.48034"> useful</tspan><tspan dx="3.48034"> investigation</tspan><tspan dx="3.48034"> compares</tspan><tspan dx="3.48034"> matched</tspan><tspan dx="3.48034"> conditions,</tspan><tspan dx="3.48034"> records</tspan><tspan dx="3.48034"> actual</tspan><tspan dx="3.48034"> evidence</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">and recognises what a test or model cannot establish.</tspan></text><g transform="translate(0 1068)"><g data-page-illustration="figures/class-7/science/ch06/food-choices.png"><image class="science-illustration" href="../../figures/class-7/science/ch06/food-choices.png" x="325.75" y="10" width="400.5" height="267" preserveAspectRatio="xMidYMid meet"><title>Food provides the materials used in
