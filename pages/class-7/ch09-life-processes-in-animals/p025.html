<section class="page page--food page--science-editorial page--science-v2 page--g7-ch09" data-folio="25"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Animals, page 25"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M38 9V40M38 28L17 48M38 28L59 48"/><circle cx="15" cy="65" r="18"/><circle cx="61" cy="65" r="18"/><circle cx="38" cy="94" r="17"/><path d="M21 81L28 84M56 81L49 84"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 9</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Animals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q9" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">9.</text><text class="se-copy" x="132" y="24"><tspan x="132">Yadu mixes equal pinches of rice flour with water in A and B, adds a few</tspan><tspan x="132" dy="32">drops of saliva only to B, and waits 35–45 minutes before adding iodine. The</tspan><tspan x="132" dy="32">pictured results are dark blue-black in A and amber in B. What idea is he</tspan><tspan x="132" dy="32">testing? Identify the comparison, explain the evidence and propose a safer</tspan><tspan x="132" dy="32">prepared-enzyme version with matched volumes.</tspan></text><g transform="translate(0 176)"><g class="v2-life-diagram" data-diagram="iodine-results"><image class="science-illustration" data-art="iodine-results" href="../../figures/class-7/science/ch09/iodine-results.png" x="346" y="5" width="360" height="240" preserveAspectRatio="xMidYMid meet"/><text class="v2-life-label" x="471" y="267" text-anchor="middle">A</text><text class="v2-life-label" x="540" y="267" text-anchor="middle">B</text></g></g><text class="se-caption" x="89" y="476.88"><tspan x="89">Given observations for Question 9, not a result that every experiment must produce. A is on</tspan><tspan x="89" dy="27">the left; B is on the right.</tspan></text></g>
<g class="v2-reading-block" data-block="q10" transform="translate(0 648)"><text class="se-copy" x="111" y="24" text-anchor="end">10.</text><text class="se-copy" x="132" y="24"><tspan x="132">Rakshita wants to compare carbon dioxide in room air and exhaled air using</tspan><tspan x="132" dy="32">lime water. What is her question, and what should match between samples?</tspan><tspan x="132" dy="32">Explain how repeating the comparison with fresh lime water could support</tspan><tspan x="132" dy="32">her conclusion. Explain why the teacher uses syringes and a collection bag</tspan><tspan x="132" dy="32">instead of mouth-operated tubes; never suck through lime water.</tspan></text><g transform="translate(0 176)"><g class="v2-life-diagram" data-diagram="lime-setup"><image class="science-illustration" data-art="lime-setup" href="../../figures/class-7/science/ch09/lime-setup.png" x="308.5" y="4" width="435" height="290" preserveAspectRatio="xMidYMid meet"/><text class="v2-life-label" x="359" y="327" text-anchor="middle">A: room air</text><text class="v2-life-label" x="571" y="327" text-anchor="middle">B: exhaled air</text></g></g><text class="se-caption" x="89" y="544.88"><tspan x="89">Safer apparatus for Question 10. Label A for room air and B for collected exhaled air in your</tspan><tspan x="89" dy="27">notebook; do not mouth-pipette.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">25</text></g></svg></div></div></section>
