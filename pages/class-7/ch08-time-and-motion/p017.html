<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="17"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 17"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204"><tspan x="112">People have used natural cycles, shadows, flowing water, sand and burning</tspan><tspan x="112" dy="32">candles to mark time. A clock must be compared with a reliable reference.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278"><tspan x="112">For a pendulum, measure length from pivot to bob centre. One oscillation is a</tspan><tspan x="112" dy="32">complete to-and-fro motion; its duration is the time period.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352"><tspan x="112">For small swings at the same place, a longer simple pendulum has a longer</tspan><tspan x="112" dy="32">period. Its bob’s mass has little effect if other conditions stay comparable.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426"><tspan x="112">Timing several oscillations and repeating trials helps reveal variation. It does</tspan><tspan x="112" dy="32">not remove every source of error.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500"><tspan x="112">The SI time unit is the second (s): 1 min = 60 s and 1 h = 3600 s. Write unit</tspan><tspan x="112" dy="32">symbols without plural endings.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574"><tspan x="112">Average speed = total distance ÷ total time. Use the same journey interval and</tspan><tspan x="112" dy="32">compatible units; common units are m/s and km/h.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648"><tspan x="112">Distance = speed × time; time = distance ÷ speed. The speed must describe the</tspan><tspan x="112" dy="32">selected interval.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722"><tspan x="112">Uniform linear motion has constant speed along a straight line. Non-uniform</tspan><tspan x="112" dy="32">linear motion has changing speed.</tspan></text><text class="se-copy" x="89" y="796" text-anchor="start">•</text><text class="se-copy" x="112" y="796"><tspan x="112">A speedometer indicates current speed; an odometer records accumulated</tspan><tspan x="112" dy="32">distance. Equal journey averages can hide very different motion.</tspan></text><text class="se-copy" x="89" y="870" text-anchor="start">•</text><text class="se-copy" x="112" y="870"><tspan x="112">Measurements support claims only to their resolution and sampling interval.</tspan><tspan x="112" dy="32">Keep unexpected readings and consider what the evidence cannot show.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">17</text></g></svg></div></div></section>
