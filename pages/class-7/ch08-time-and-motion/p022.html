<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="22" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 22"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-repeat-head" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Improve a pendulum measurement</tspan></text></g>
<g class="v2-reading-block" data-block="project-repeat-0" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89">Revisit your repeated periods from the pendulum activity. Choose a likely source</tspan><tspan x="89" dy="32">of variation—counting, reaction delay, length reading or release angle—and</tspan></text></g>
<g class="v2-reading-block" data-block="project-repeat-1" transform="translate(0 224)"><text class="se-copy" x="89" y="24"><tspan x="89">improve the procedure. Repeat without changing the other conditions. Compare</tspan><tspan x="89" dy="32">the spread of the old and new readings. A smaller spread is useful, but does it</tspan><tspan x="89" dy="32">prove the measured length and timing are correct?</tspan></text></g>
<g class="v2-reading-block" data-block="project-swing-head" transform="translate(0 348)"><text class="se-heading" x="89" y="30"><tspan x="89">Observe a playground swing</tspan></text></g>
<g class="v2-reading-block" data-block="project-swing" transform="translate(0 396)"><text class="se-copy" x="89" y="24"><tspan x="89">With an adult’s permission, time 10 small oscillations of a safe playground swing.</tspan><tspan x="89" dy="32">Repeat with different willing riders, without weighing them or sharing body</tspan><tspan x="89" dy="32">measurements. Keep the posture and small release angle similar; do not pump or</tspan><tspan x="89" dy="32">stand. Stay outside the swing’s path. Compare approved swings with different</tspan><tspan x="89" dy="32">suspension lengths; never alter playground equipment. Calculate periods and</tspan><tspan x="89" dy="32">discuss why a moving rider and seat are only an approximate pendulum.</tspan></text></g>
<g class="v2-reading-block" data-block="project-swing-figure" transform="translate(0 604)"><image class="science-illustration" data-photo="swing" href="../../figures/class-7/science/ch08/swing.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Observe from outside the swing’s path. An adult supervises; the rider stays seated and holds</tspan><tspan x="89" dy="27">both chains.</tspan></text></g>
<g class="v2-reading-block" data-block="project-olympics-head" transform="translate(0 978)"><text class="se-heading" x="89" y="30"><tspan x="89">Compare Olympic race records</tspan></text></g>
<g class="v2-reading-block" data-block="project-olympics-0" transform="translate(0 1026)"><text class="se-copy" x="89" y="24"><tspan x="89">Use official results for the two most recent completed Summer Olympic Games.</tspan><tspan x="89" dy="32">Record the years, source links and winning times for the men’s and women’s 100</tspan></text></g>
<g class="v2-reading-block" data-block="project-olympics-1" transform="translate(0 1090)"><text class="se-copy" x="89" y="24"><tspan x="89">m, 200 m and 400 m races. Calculate distance divided by time for all twelve</tspan><tspan x="89" dy="32">results. Compare average speeds across distances and editions. These averages</tspan><tspan x="89" dy="32">do not reveal the fastest instant in a race or explain why a particular athlete won.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">22</text></g></svg></div></div></section>
