<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="water-flow-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">matters too. Marks calibrated for this bottle and hole cannot simply be copied</tspan><tspan x="89" dy="32">onto another device.</tspan></text></g>
<g class="v2-reading-block" data-block="water-pause" transform="translate(0 192)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="262" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Two learners mark their bottles differently. One copies equally spaced lines</tspan><tspan x="113" dy="32">from a ruler; the other marks the water level every minute using a watch.</tspan><tspan x="113" dy="32">Which procedure establishes a time scale? Explain.</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">A new cap has a larger hole. Can the old time marks still be trusted? Describe</tspan><tspan x="113" dy="32">a comparison that would test your answer.</tspan></text></g>
<g class="v2-reading-block" data-block="history" transform="translate(0 488)"><text class="se-heading" x="89" y="30"><tspan x="89">Clocks in history</tspan></text></g>
<g class="v2-reading-block" data-block="indian-timekeeping-0" transform="translate(0 536)"><text class="se-copy" x="89" y="24"><tspan x="89">Indian accounts of timekeeping include shadow measurements and outflow</tspan><tspan x="89" dy="32">water clocks in the Arthashastra, and water-clock descriptions in the</tspan></text></g>
<g class="v2-reading-block" data-block="indian-timekeeping-1" transform="translate(0 600)"><text class="se-copy" x="89" y="24"><tspan x="89">Shardulakarnavadana. The astronomer Varahamihira discussed finding time</tspan><tspan x="89" dy="32">from a stick’s shadow. A sinking-bowl clock, often called a ghatika-yantra, also</tspan><tspan x="89" dy="32">appears in Indian astronomical traditions associated with Aryabhata.</tspan></text></g>
<g class="v2-reading-block" data-block="ghatika-0" transform="translate(0 712)"><text class="se-copy" x="89" y="24"><tspan x="89">Such devices served monasteries, palaces and towns; drums, conches or gongs</tspan><tspan x="89" dy="32">could announce an interval. In a traditional division of the day, one ghati was 24</tspan></text></g>
<g class="v2-reading-block" data-block="ghatika-1" transform="translate(0 776)"><text class="se-copy" x="89" y="24"><tspan x="89">minutes and 60 ghatis made 24 hours. Historical devices and regional practices</tspan><tspan x="89" dy="32">varied; a named unit does not make every clock equally accurate.</tspan></text></g>
<g class="v2-reading-block" data-block="jantar-0" transform="translate(0 856)"><text class="se-copy" x="89" y="24"><tspan x="89">At Jaipur’s Jantar Mantar, an early eighteenth-century observatory and UNESCO</tspan><tspan x="89" dy="32">World Heritage Site, the roughly 27 m high Samrat Yantra is a monumental</tspan></text></g>
<g class="v2-reading-block" data-block="jantar-1" transform="translate(0 920)"><text class="se-copy" x="89" y="24"><tspan x="89">sundial. Its shadow moves over finely marked scales. A fine graduation is</tspan><tspan x="89" dy="32">different from a guarantee that every reading is accurate to that interval.</tspan></text></g>
<g class="v2-reading-block" data-block="solar-time-0" transform="translate(0 1000)"><text class="se-copy" x="89" y="24"><tspan x="89">A sundial indicates local solar time. Comparing it with Indian Standard Time</tspan><tspan x="89" dy="32">requires corrections for location and the date. Clouds, alignment and reading the</tspan></text></g><g transform="translate(0 1064)"><g data-page-illustration="figures/class-7/science/ch08/modern-clocks.png"><image class="science-illustration" href="../../figures/class-7/science/ch08/modern-clocks.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Instruments for measuring time.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Instruments for measuring time.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
