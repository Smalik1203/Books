<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="assessment-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Let Us Enhance Our Learning</tspan></text></g>
<g class="v2-reading-block" data-block="assessment-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Use your notebook. Support each answer with evidence and explain any</tspan><tspan x="89" dy="32">uncertainty.</tspan></text></g>
<g class="v2-reading-block" data-block="q1" transform="translate(0 250)"><text class="se-copy" x="111" y="24" text-anchor="end">1.</text><text class="se-copy" x="132" y="24"><tspan x="132">A car travels 150 m in 10 s. Calculate its average speed and express the</tspan><tspan x="132" dy="32">answer in km/h.</tspan></text></g>
<g class="v2-reading-block" data-block="q2" transform="translate(0 344)"><text class="se-copy" x="111" y="24" text-anchor="end">2.</text><text class="se-copy" x="132" y="24"><tspan x="132">One runner completes 400 m in 50 s and another in 45 s. Who has the greater</tspan><tspan x="132" dy="32">average speed, and by how much? Give the difference in m/s.</tspan></text></g>
<g class="v2-reading-block" data-block="q3" transform="translate(0 438)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24"><tspan x="132">A train averages 25 m/s over 360 km. How much time does it take? Express</tspan><tspan x="132" dy="32">the answer in seconds and hours.</tspan></text></g>
<g class="v2-reading-block" data-block="q4" transform="translate(0 532)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24"><tspan x="132">A train travels 180 km in 3 h. Find its average speed in (i) km/h and (ii) m/s.</tspan><tspan x="132" dy="32">(iii) How far would it travel in 4 h if it maintained that speed throughout?</tspan></text></g>
<g class="v2-reading-block" data-block="q5" transform="translate(0 626)"><text class="se-copy" x="111" y="24" text-anchor="end">5.</text><text class="se-copy" x="132" y="24"><tspan x="132">In this example, a galloping horse moves at 18 m/s and a train at 72 km/h.</tspan><tspan x="132" dy="32">Which is faster, and by how much in m/s? Do not treat the horse’s given speed</tspan><tspan x="132" dy="32">as a record for all horses.</tspan></text></g>
<g class="v2-reading-block" data-block="q6" transform="translate(0 752)"><text class="se-copy" x="111" y="24" text-anchor="end">6.</text><text class="se-copy" x="132" y="24"><tspan x="132">Compare a car maintaining a steady speed on a straight highway with one</tspan><tspan x="132" dy="32">changing speed on a straight section of a busy city road. Which motion is</tspan><tspan x="132" dy="32">uniform? Does an empty road alone prove uniform motion?</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
