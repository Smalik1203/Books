<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q7" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">7.</text><text class="se-copy" x="132" y="24"><tspan x="132">An object moves uniformly along a straight line. Reproduce this table in your</tspan><tspan x="132" dy="32">notebook and complete the missing entries. Explain the pattern you used.</tspan></text><g transform="translate(0 80)"><g class="v2-motion-diagram" data-diagram="question-seven"><rect class="v2-motion-water" x="89" y="10" width="154" height="56"/><text class="v2-motion-label" x="166" y="46" text-anchor="middle">Time (s)</text><rect class="v2-motion-soft" x="243" y="10" width="90" height="56"/><text class="v2-motion-label" x="288" y="46" text-anchor="middle">0</text><rect class="v2-motion-soft" x="333" y="10" width="90" height="56"/><text class="v2-motion-label" x="378" y="46" text-anchor="middle">10</text><rect class="v2-motion-soft" x="423" y="10" width="90" height="56"/><text class="v2-motion-label" x="468" y="46" text-anchor="middle">20</text><rect class="v2-motion-soft" x="513" y="10" width="90" height="56"/><text class="v2-motion-label" x="558" y="46" text-anchor="middle">30</text><rect class="v2-motion-soft" x="603" y="10" width="90" height="56"/><text class="v2-motion-label" x="648" y="46" text-anchor="middle">?</text><rect class="v2-motion-soft" x="693" y="10" width="90" height="56"/><text class="v2-motion-label" x="738" y="46" text-anchor="middle">50</text><rect class="v2-motion-soft" x="783" y="10" width="90" height="56"/><text class="v2-motion-label" x="828" y="46" text-anchor="middle">?</text><rect class="v2-motion-soft" x="873" y="10" width="90" height="56"/><text class="v2-motion-label" x="918" y="46" text-anchor="middle">70</text><rect class="v2-motion-water" x="89" y="66" width="154" height="56"/><text class="v2-motion-label" x="166" y="102" text-anchor="middle">Distance (m)</text><rect class="v2-motion-soft" x="243" y="66" width="90" height="56"/><text class="v2-motion-label" x="288" y="102" text-anchor="middle">0</text><rect class="v2-motion-soft" x="333" y="66" width="90" height="56"/><text class="v2-motion-label" x="378" y="102" text-anchor="middle">8</text><rect class="v2-motion-soft" x="423" y="66" width="90" height="56"/><text class="v2-motion-label" x="468" y="102" text-anchor="middle">?</text><rect class="v2-motion-soft" x="513" y="66" width="90" height="56"/><text class="v2-motion-label" x="558" y="102" text-anchor="middle">24</text><rect class="v2-motion-soft" x="603" y="66" width="90" height="56"/><text class="v2-motion-label" x="648" y="102" text-anchor="middle">32</text><rect class="v2-motion-soft" x="693" y="66" width="90" height="56"/><text class="v2-motion-label" x="738" y="102" text-anchor="middle">40</text><rect class="v2-motion-soft" x="783" y="66" width="90" height="56"/><text class="v2-motion-label" x="828" y="102" text-anchor="middle">?</text><rect class="v2-motion-soft" x="873" y="66" width="90" height="56"/><text class="v2-motion-label" x="918" y="102" text-anchor="middle">56</text></g></g><text class="se-caption" x="89" y="232.88"><tspan x="89">Question marks identify missing entries. Both time and distance are measured from the start.</tspan></text></g>
<g class="v2-reading-block" data-block="q8" transform="translate(0 377)"><text class="se-copy" x="111" y="24" text-anchor="end">8.</text><text class="se-copy" x="132" y="24"><tspan x="132">A car travels 60 km in its first hour, 70 km in its second and 50 km in its third.</tspan><tspan x="132" dy="32">Is its motion uniform? Justify your answer and calculate its average speed</tspan><tspan x="132" dy="32">over all three hours.</tspan></text></g>
<g class="v2-reading-block" data-block="q9" transform="translate(0 503)"><text class="se-copy" x="111" y="24" text-anchor="end">9.</text><text class="se-copy" x="132" y="24"><tspan x="132">Which is more common in daily life: uniform or non-uniform motion? Give</tspan><tspan x="132" dy="32">three examples from your experience. Specify the interval and path you are</tspan><tspan x="132" dy="32">describing.</tspan></text></g>
<g class="v2-reading-block" data-block="q10" transform="translate(0 629)"><text class="se-copy" x="111" y="24" text-anchor="end">10.</text><text class="se-copy" x="132" y="24"><tspan x="132">Use the recorded distances below to decide whether the motion is uniform or</tspan><tspan x="132" dy="32">non-uniform. Find the average speed over the entire 100 s. Explain why the</tspan><tspan x="132" dy="32">average alone cannot describe every interval.</tspan></text><g transform="translate(0 112)"><g class="v2-motion-diagram" data-diagram="question-ten"><rect class="v2-motion-water" x="89" y="10" width="154" height="56"/><text class="v2-motion-label" x="166" y="46" text-anchor="middle">Time (s)</text><rect class="v2-motion-soft" x="243" y="10" width="65.45454545454545" height="56"/><text class="v2-motion-label" x="275.72727272727275" y="46" text-anchor="middle">0</text><rect class="v2-motion-soft" x="308.45454545454544" y="10" width="65.45454545454545" height="56"/><text class="v2-motion-label" x="341.1818181818182" y="46" text-anchor="middle">10</text><rect class="v2-motion-soft" x="373.9090909090909" y="10" width="65.45454545454545" height="56"/><text class="v2-motion-label" x="406.6363636363636" y="46" text-anchor="middle">20</text><rect class="v2-motion-soft" x="439.3636363636363" y="10" width="65.45454545454545" height="56"/><text class="v2-motion-label" x="472.09090909090907" y="46" text-anchor="middle">30</text><rect class="v2-motion-soft" x="504.81818181818176" y="10" width="65.45454545454545" height="56"/><text class="v2-motion-label" x="537.5454545454545" y="46" text-anchor="middle">40</text><rect class="v2-motion-soft" x="570.2727272727273" y="10" width="65.45454545454545" height="56"/><text class="v2-motion-label" x="603" y="46" text-anchor="middle">50</text><rect class="v2-motion-soft" x="635.7272727272727" y="10" width="65.45454545454545" height="56"/><text class="v2-motion-label" x="668.4545454545455" y="46" text-anchor="middle">60</text><rect class="v2-motion-soft" x="701.1818181818182" y="10" width="65.45454545454545" height="56"/><text class="v2-motion-label" x="733.909090909091" y="46" text-anchor="middle">70</text><rect class="v2-motion-soft" x="766.6363636363637" y="10" width="65.45454545454545" height="56"/><text class="v2-motion-label" x="799.3636363636365" y="46" text-anchor="middle">80</text><rect class="v2-motion-soft" x="832.0909090909092" y="10" width="65.45454545454545" height="56"/><text class="v2-motion-label" x="864.818181818182" y="46" text-anchor="middle">90</text><rect class="v2-motion-soft" x="897.5454545454547" y="10" width="65.45454545454545" height="56"/><text class="v2-motion-label" x="930.2727272727275" y="46" text-anchor="middle">100</text><rect class="v2-motion-water" x="89" y="66" width="154" height="56"/><text class="v2-motion-label" x="166" y="102" text-anchor="middle">Distance (m)</text><rect class="v2-motion-soft" x="243" y="66" width="65.45454545454545" height="56"/><text class="v2-motion-label" x="275.72727272727275" y="102" text-anchor="middle">0</text><rect class="v2-motion-soft" x="308.45454545454544" y="66" width="65.45454545454545" height="56"/><text class="v2-motion-label" x="341.1818181818182" y="102" text-anchor="middle">6</text><rect class="v2-motion-soft" x="373.9090909090909" y="66" width="65.45454545454545" height="56"/><text class="v2-motion-label" x="406.6363636363636" y="102" text-anchor="middle">10</text><rect class="v2-motion-soft" x="439.3636363636363" y="66" width="65.45454545454545" height="56"/><text class="v2-motion-label" x="472.09090909090907" y="102" text-anchor="middle">16</text><rect class="v2-motion-soft" x="504.81818181818176" y="66" width="65.45454545454545" height="56"/><text class="v2-motion-label" x="537.5454545454545" y="102" text-anchor="middle">21</text><rect class="v2-motion-soft" x="570.2727272727273" y="66" width="65.45454545454545" height="56"/><text class="v2-motion-label" x="603" y="102" text-anchor="middle">29</text><rect class="v2-motion-soft" <g class="v2-reading-block" data-block="q11" transform="translate(0 926)"><text class="se-copy" x="111" y="24" text-anchor="end">11.</text><text class="se-copy" x="132" y="24"><tspan x="132">A vehicle travels 2 km along a straight line. It covers the first 500 m at 10 m/s</tspan><tspan x="132" dy="32">and the next 500 m at 5 m/s. What constant speed is needed over the</tspan><tspan x="132" dy="32">remaining distance to finish the whole journey in 200 s? What is its average</tspan><tspan x="132" dy="32">speed for the journey?</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
