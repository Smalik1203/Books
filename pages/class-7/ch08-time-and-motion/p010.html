<g class="v2-reading-block" data-block="clock-evidence-0" transform="translate(0 860)"><text class="se-copy" x="89" y="24"><tspan x="89">The pictured dial has 60 equal small intervals. Since one revolution of the second</tspan><tspan x="89" dy="32">hand takes 60 s, one interval represents 1 s. A stopwatch may display hundredths</tspan></text></g>
<g class="v2-reading-block" data-block="clock-evidence-1" transform="translate(0 924)"><text class="se-copy" x="89" y="24"><tspan x="89">of a second, but the operator’s reaction delay can still be much larger than its last</tspan><tspan x="89" dy="32">displayed digit.</tspan></text></g>
<g class="v2-reading-block" data-block="time-applications-0" transform="translate(0 1004)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Sport:</tspan> closely timed finishes require equipment that can distinguish very short</tspan><tspan x="112" dy="32">intervals.</tspan></text></g>
<g class="v2-reading-block" data-block="time-applications-1" transform="translate(0 1078)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Medicine:</tspan> an electrocardiogram records the timing of electrical activity</tspan><tspan x="112" dy="32">associated with heartbeats.</tspan></text></g>
<g class="v2-reading-block" data-block="time-applications-2" transform="translate(0 1152)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Sound</tspan> <tspan class="se-bold">and</tspan> <tspan class="se-bold">computing:</tspan> digital sound is sampled many thousands of times a</tspan><tspan x="112" dy="32">second; electronic operations can occur on microsecond or shorter time</tspan><tspan x="112" dy="32">scales.</tspan></text></g>
<g class="v2-reading-block" data-block="time-applications-3" transform="translate(0 1258)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Space</tspan> <tspan class="se-bold">science:</tspan> precise timing helps coordinate signals, measurements and</tspan><tspan x="112" dy="32">navigation.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
