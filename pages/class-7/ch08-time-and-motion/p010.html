<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="time-applications-3" transform="translate(0 112)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Space</tspan> <tspan class="se-bold">science:</tspan> precise timing helps coordinate signals, measurements and</tspan><tspan x="112" dy="32">navigation.</tspan></text></g>
<g class="v2-reading-block" data-block="slow-fast" transform="translate(0 204)"><text class="v2-title" x="89" y="38"><tspan x="89">8.2 Slow or Fast?</tspan></text></g>
<g class="v2-reading-block" data-block="race-comparison-0" transform="translate(0 262)"><text class="se-copy" x="89" y="24"><tspan x="89">When runners start together and cover the same 100 m, the one who finishes in</tspan><tspan x="89" dy="32">less time has the greater average speed over the race. At an earlier instant, a</tspan></text></g>
<g class="v2-reading-block" data-block="race-comparison-1" transform="translate(0 326)"><text class="se-copy" x="89" y="24"><tspan x="89">runner farther from the common start has covered more distance in that elapsed</tspan><tspan x="89" dy="32">time. That does not prove the runner is moving fastest at that particular instant.</tspan></text></g>
<g class="v2-reading-block" data-block="speed-comparison" transform="translate(0 406)"><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Same distance</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74"><tspan x="112">Compare the times taken.</tspan></text><text class="se-copy" x="89" y="116" text-anchor="start">•</text><text class="se-copy" x="112" y="116"><tspan x="112">Less time means greater average</tspan><tspan x="112" dy="32">speed.</tspan></text><text class="v2-comparison-title" x="526" y="30"><tspan x="526">Same elapsed time</tspan></text><text class="se-copy" x="526" y="74" text-anchor="start">•</text><text class="se-copy" x="549" y="74"><tspan x="549">Compare the distances travelled.</tspan></text><text class="se-copy" x="526" y="116" text-anchor="start">•</text><text class="se-copy" x="549" y="116"><tspan x="549">More distance means greater</tspan><tspan x="549" dy="32">average speed.</tspan></text></g>
<g class="v2-reading-block" data-block="different-distances-0" transform="translate(0 588)"><text class="se-copy" x="89" y="24"><tspan x="89">If both distance and time differ, neither number alone settles the comparison. A</tspan><tspan x="89" dy="32">cyclist travelling farther may also have taken much longer. We need the distance</tspan><tspan x="89" dy="32">covered per unit time.</tspan></text></g>
<g class="v2-reading-block" data-block="speed" transform="translate(0 712)"><text class="v2-title" x="89" y="38"><tspan x="89">8.3 Measuring Speed</tspan></text></g>
<g class="v2-reading-block" data-block="average-definition-0" transform="translate(0 770)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Average</tspan> <tspan class="se-bold">speed</tspan> is the total distance travelled divided by the total time taken. It</tspan><tspan x="89" dy="32">describes a whole chosen interval, including stops within it. The SI unit is metre</tspan><tspan x="89" dy="32">per second, written m/s. Kilometre per hour, written km/h, is also common.</tspan></text></g>
<g class="v2-reading-block" data-block="speed-rule" transform="translate(0 882)"><text class="v2-equation" x="89" y="30"><tspan x="89">Average speed = total distance ÷ total time</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">Use the same journey interval for both measurements. State the unit with the answer.</tspan></text></g>
<g class="v2-reading-block" data-block="cycling-art" transform="translate(0 979)"><image class="science-illustration" data-photo="cyclist" href="../../figures/class-7/science/ch08/cyclist.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Swati’s journey provides a distance and an elapsed time. Her speed need not stay the same at</tspan><tspan x="89" dy="27">every moment.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
