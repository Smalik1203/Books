<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="cycling-art" transform="translate(0 112)"><image class="science-illustration" data-photo="cyclist" href="../../figures/class-7/science/ch08/cyclist.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Swati’s journey provides a distance and an elapsed time. Her speed need not stay the same at</tspan><tspan x="89" dy="27">every moment.</tspan></text></g>
<g class="v2-reading-block" data-block="example-one" transform="translate(0 486)"><text class="se-heading" x="89" y="30"><tspan x="89">Example 8.1 · Swati’s bicycle ride</tspan></text></g>
<g class="v2-reading-block" data-block="swati-work" transform="translate(0 534)"><text class="se-copy" x="89" y="24"><tspan x="89">Swati cycles 3.6 km in 15 min. Convert: 3.6 × 1000 = 3600 m; 15 × 60 = 900 s. Her</tspan><tspan x="89" dy="32">average speed is 3600 m ÷ 900 s = 4 m/s.</tspan></text></g>
<g class="v2-reading-block" data-block="speed-units-0" transform="translate(0 614)"><text class="se-copy" x="89" y="24"><tspan x="89">To change m/s into km/h, multiply by 3.6: there are 3600 seconds in an hour and</tspan><tspan x="89" dy="32">1000 metres in a kilometre. Thus 4 m/s = 14.4 km/h. To change km/h into m/s,</tspan></text></g>
<g class="v2-reading-block" data-block="speed-units-1" transform="translate(0 678)"><text class="se-copy" x="89" y="24"><tspan x="89">divide by 3.6. Converting both measurements before dividing is another reliable</tspan><tspan x="89" dy="32">route.</tspan></text></g>
<g class="v2-reading-block" data-block="railways" transform="translate(0 770)"><text class="se-heading" x="89" y="30"><tspan x="89">Comparing train journeys</tspan></text></g>
<g class="v2-reading-block" data-block="train-task" transform="translate(0 818)"><rect class="se-activity-panel" x="89" y="0" width="874" height="522" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">With an adult, consult an official railway timetable. Choose a nearby</tspan><tspan x="146" dy="32">station, a next stop and four or five trains, including passenger, express or</tspan><tspan x="146" dy="32">superfast services where available.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Record each train, next stop, departure, arrival and segment distance. For</tspan><tspan x="146" dy="32">cumulative distances, subtract the two station readings.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Calculate elapsed time, including the date for a journey crossing</tspan><tspan x="146" dy="32">midnight. Convert minutes to hours before finding km/h.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352"><tspan x="146">Divide each segment distance by its elapsed time. Compare the scheduled</tspan><tspan x="146" dy="32">average speeds for these segments; note the timetable source and date.</tspan></text><text class="se-copy" x="113" y="428"><tspan x="113">This is a timetable investigation. Do not go near tracks or moving trains to</tspan><tspan x="113" dy="32">take measurements. Scheduled times are not observations of actual running</tspan><tspan x="113" dy="32">times.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
