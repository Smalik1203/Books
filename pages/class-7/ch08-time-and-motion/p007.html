<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="pendulum-evidence-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">reading the length differently can affect the result. Record these possibilities</tspan><tspan x="89" dy="32">alongside the measurements instead of replacing them with identical numbers.</tspan></text></g>
<g class="v2-reading-block" data-block="period-example" transform="translate(0 192)"><text class="v2-equation" x="89" y="30"><tspan x="89">Time period = time for 10 oscillations ÷ 10</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">Illustrative calculation: 20.4 s ÷ 10 = 2.04 s. This is a sample, not a result you must obtain.</tspan></text></g>
<g class="v2-reading-block" data-block="period-record" transform="translate(0 289)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Reading repeated trials · illustrative measurements</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Trial</tspan></text><text class="v2-table-heading" x="260.32" y="76.08"><tspan x="260.32">Time for 10 swings</tspan></text><text class="v2-table-heading" x="592.44" y="76.08"><tspan x="592.44">Period: time ÷ 10</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">1</tspan></text><text class="se-copy se-table-copy" x="260.32" y="128.07999999999998"><tspan x="260.32">20.4 s</tspan></text><text class="se-copy se-table-copy" x="592.44" y="128.07999999999998"><tspan x="592.44">2.04 s</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="146" y2="146"/><text class="se-copy se-table-copy" x="103" y="180.07999999999998"><tspan x="103">2</tspan></text><text class="se-copy se-table-copy" x="260.32" y="180.07999999999998"><tspan x="260.32">20.1 s</tspan></text><text class="se-copy se-table-copy" x="592.44" y="180.07999999999998"><tspan x="592.44">2.01 s</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="198" y2="198"/><text class="se-copy se-table-copy" x="103" y="232.07999999999998"><tspan x="103">3</tspan></text><text class="se-copy se-table-copy" x="260.32" y="232.07999999999998"><tspan x="260.32">20.3 s</tspan></text><text class="se-copy se-table-copy" x="592.44" y="232.07999999999998"><tspan x="592.44">2.03 s</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="250" y2="250"/><rect class="v2-table-frame" x="89" y="42" width="874" height="208"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="42" y2="250"/><line class="v2-table-rule" x1="578.44" x2="578.44" y1="42" y2="250"/><text class="v2-table-note" x="89" y="282.88"><tspan x="89">Same pendulum length, 100 cm, in all three sample trials. Read across to check a calculation;</tspan><tspan x="89" dy="26">compare down to see variation. Your own readings may differ.</tspan></text></g>
<g class="v2-reading-block" data-block="timing-pause" transform="translate(0 623)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="230" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Why might timing 10 oscillations and dividing by 10 be more useful than</tspan><tspan x="113" dy="32">timing one? Think about a small delay in pressing the stopwatch button.</tspan></text><text class="se-copy" x="113" y="168"><tspan x="113">Does repeating the trial remove every error? Consider a ruler that is</tspan><tspan x="113" dy="32">consistently read to the bottom of the bob instead of its centre.</tspan></text></g>
<g class="v2-reading-block" data-block="pendulum-variables" transform="translate(0 887)"><text class="se-heading" x="89" y="30"><tspan x="89">Change one variable</tspan></text></g>
<g class="v2-reading-block" data-block="length-extension" transform="translate(0 935)"><text class="se-copy" x="89" y="24"><tspan x="89">Keep the same bob and try two or three different lengths. At each length, release</tspan><tspan x="89" dy="32">from the same small angle, time 10 oscillations and repeat. Record the length</tspan><tspan x="89" dy="32">and periods together. Compare the trend only after collecting the readings.</tspan></text></g>
<g class="v2-reading-block" data-block="mass-extension" transform="translate(0 1047)"><text class="se-copy" x="89" y="24"><tspan x="89">Next keep the pivot-to-centre length fixed and use secure bobs of different</tspan><tspan x="89" dy="32">masses but similar size and shape. Keep the location and small release angle</tspan><tspan x="89" dy="32">unchanged. Predict, test and compare. Do not change length and mass together if</tspan><tspan x="89" dy="32">you want to distinguish their effects.</tspan></text></g>
<g class="v2-reading-block" data-block="pendulum-conclusion-0" transform="translate(0 1191)"><text class="se-copy" x="89" y="24"><tspan x="89">For a simple pendulum making small swings at a given place, a longer length</tspan><tspan x="89" dy="32">gives a longer period. Changing the bob’s mass has little effect under these</tspan></text></g>
<g class="v2-reading-block" data-block="pendulum-conclusion-1" transform="translate(0 1255)"><text class="se-copy" x="89" y="24"><tspan x="89">conditions. Large swings, friction, air resistance and changes in local gravity</tspan><tspan x="89" dy="32">limit this simple description; the period is not universally constant for every</tspan><tspan x="89" dy="32">pendulum.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
