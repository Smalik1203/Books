<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="20"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 20"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Explore Further</tspan></text></g>
<g class="v2-reading-block" data-block="project-bowl-head" transform="translate(0 182)"><text class="se-heading" x="89" y="30"><tspan x="89">Build a sinking-bowl clock</tspan></text></g>
<g class="v2-reading-block" data-block="project-bowl" transform="translate(0 230)"><text class="se-copy" x="89" y="24"><tspan x="89">With an adult, float a small bowl with a tiny hole in a larger water vessel and time</tspan><tspan x="89" dy="32">how long it takes to sink. Adults make all holes and smooth sharp edges. Dry and</tspan><tspan x="89" dy="32">empty the bowl before each trial; use a stable tray. Try different bowl sizes or</tspan><tspan x="89" dy="32">hole sizes, changing one variable at a time. Can repeated trials approach an</tspan><tspan x="89" dy="32">interval of 24 min? Record the actual times and limits of the design.</tspan></text></g>
<g class="v2-reading-block" data-block="project-bowl-diagram" transform="translate(0 406)"><svg class="science-illustration v2-motion-diagram" data-diagram="bowl-clock" x="89" y="0" width="874" height="221" viewBox="89 0 874 221"><svg class="science-illustration" x="331" y="30" width="390" height="189" viewBox="60 190 1415 690" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch08/apparatus-bowl-clock.png" width="1536" height="1024"/></svg><text class="v2-motion-label" x="795" y="87" text-anchor="middle">Small hole</text><path class="v2-motion-line" d="M730 84L527 138"/><text class="v2-motion-label" x="526" y="23" text-anchor="middle">Floating bowl</text><path class="v2-motion-line" d="M526 28V54"/><text class="v2-motion-label" x="244" y="113" text-anchor="middle">Water</text><path class="v2-motion-line" d="M287 108L375 111"/></svg><text class="se-caption" x="89" y="251.88"><tspan x="89">Water enters the small hole while the bowl floats. Measure the interval until sinking; reset for</tspan><tspan x="89" dy="27">each trial.</tspan></text></g>
<g class="v2-reading-block" data-block="project-pulse-head" transform="translate(0 725)"><text class="se-heading" x="89" y="30"><tspan x="89">Could your pulse be a clock?</tspan></text></g>
<g class="v2-reading-block" data-block="project-pulse-0" transform="translate(0 773)"><text class="se-copy" x="89" y="24"><tspan x="89">With teacher guidance, willing friends can count their own resting pulse for one</tspan><tspan x="89" dy="32">minute using a clock. Place the index and middle fingertips gently on the inside</tspan></text></g>
<g class="v2-reading-block" data-block="project-pulse-1" transform="translate(0 837)"><text class="se-copy" x="89" y="24"><tspan x="89">of the wrist below the thumb. Keep results private; nobody needs to participate</tspan><tspan x="89" dy="32">or share a number. This is a timing exercise, not a health test. Repeat and discuss</tspan></text></g>
<g class="v2-reading-block" data-block="project-pulse-2" transform="translate(0 901)"><text class="se-copy" x="89" y="24"><tspan x="89">why the count may vary. Invent a story about using pulse beats to estimate time,</tspan><tspan x="89" dy="32">and identify what would make the estimate uncertain.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">20</text></g></svg></div></div></section>
