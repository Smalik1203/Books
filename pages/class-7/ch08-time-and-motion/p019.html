<g class="v2-reading-block" data-block="q1" transform="translate(0 250)"><text class="se-copy" x="111" y="24" text-anchor="end">1.</text><text class="se-copy" x="132" y="24" data-prose-align="justify"><tspan x="132" data-justify-width="831" data-natural-space="5.59200" data-extra-space="6.19959" data-space-ratio="2.109">A<tspan dx="6.19959"> car</tspan><tspan dx="6.19959"> travels</tspan><tspan dx="6.19959"> 150</tspan><tspan dx="6.19959"> m</tspan><tspan dx="6.19959"> in</tspan><tspan dx="6.19959"> 10</tspan><tspan dx="6.19959"> s.</tspan><tspan dx="6.19959"> Calculate</tspan><tspan dx="6.19959"> its</tspan><tspan dx="6.19959"> average</tspan><tspan dx="6.19959"> speed</tspan><tspan dx="6.19959"> and</tspan><tspan dx="6.19959"> express</tspan><tspan dx="6.19959"> the</tspan></tspan><tspan x="132" dy="32" data-paragraph-end="true">answer in km/h.</tspan></text></g>
<g class="v2-reading-block" data-block="q2" transform="translate(0 344)"><text class="se-copy" x="111" y="24" text-anchor="end">2.</text><text class="se-copy" x="132" y="24" data-prose-align="justify"><tspan x="132" data-justify-width="831" data-natural-space="5.59200" data-extra-space="0.72601" data-space-ratio="1.130">One<tspan dx="0.72601"> runner</tspan><tspan dx="0.72601"> completes</tspan><tspan dx="0.72601"> 400</tspan><tspan dx="0.72601"> m</tspan><tspan dx="0.72601"> in</tspan><tspan dx="0.72601"> 50</tspan><tspan dx="0.72601"> s</tspan><tspan dx="0.72601"> and</tspan><tspan dx="0.72601"> another</tspan><tspan dx="0.72601"> in</tspan><tspan dx="0.72601"> 45</tspan><tspan dx="0.72601"> s.</tspan><tspan dx="0.72601"> Who</tspan><tspan dx="0.72601"> has</tspan><tspan dx="0.72601"> the</tspan><tspan dx="0.72601"> greater</tspan></tspan><tspan x="132" dy="32" data-paragraph-end="true">average speed, and by how much? Give the difference in m/s.</tspan></text></g>
<g class="v2-reading-block" data-block="q3" transform="translate(0 438)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24" data-prose-align="justify"><tspan x="132" data-justify-width="831" data-natural-space="5.59200" data-extra-space="2.97145" data-space-ratio="1.531">A<tspan dx="2.97145"> train</tspan><tspan dx="2.97145"> averages</tspan><tspan dx="2.97145"> 25</tspan><tspan dx="2.97145"> m/s</tspan><tspan dx="2.97145"> over</tspan><tspan dx="2.97145"> 360</tspan><tspan dx="2.97145"> km.</tspan><tspan dx="2.97145"> How</tspan><tspan dx="2.97145"> much</tspan><tspan dx="2.97145"> time</tspan><tspan dx="2.97145"> does</tspan><tspan dx="2.97145"> it</tspan><tspan dx="2.97145"> take?</tspan><tspan dx="2.97145"> Express</tspan></tspan><tspan x="132" dy="32" data-paragraph-end="true">the answer in seconds and hours.</tspan></text></g>
<g class="v2-reading-block" data-block="q4" transform="translate(0 532)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24" data-prose-align="justify"><tspan x="132" data-justify-width="831" data-natural-space="5.59200" data-extra-space="2.00444" data-space-ratio="1.358">A<tspan dx="2.00444"> train</tspan><tspan dx="2.00444"> travels</tspan><tspan dx="2.00444"> 180</tspan><tspan dx="2.00444"> km</tspan><tspan dx="2.00444"> in</tspan><tspan dx="2.00444"> 3</tspan><tspan dx="2.00444"> h.</tspan><tspan dx="2.00444"> Find</tspan><tspan dx="2.00444"> its</tspan><tspan dx="2.00444"> average</tspan><tspan dx="2.00444"> speed</tspan><tspan dx="2.00444"> in</tspan><tspan dx="2.00444"> (i)</tspan><tspan dx="2.00444"> km/h</tspan><tspan dx="2.00444"> and</tspan><tspan dx="2.00444"> (ii)</tspan><tspan dx="2.00444"> m/s.</tspan></tspan><tspan x="132" dy="32" data-paragraph-end="true">(iii) How far would it travel in 4 h if it maintained that speed throughout?</tspan></text></g>
<g class="v2-reading-block" data-block="q5" transform="translate(0 626)"><text class="se-copy" x="111" y="24" text-anchor="end">5.</text><text class="se-copy" x="132" y="24" data-prose-align="justify"><tspan x="132" data-justify-width="831" data-natural-space="5.59200" data-extra-space="3.29340" data-space-ratio="1.589">In<tspan dx="3.29340"> this</tspan><tspan dx="3.29340"> example,</tspan><tspan dx="3.29340"> a</tspan><tspan dx="3.29340"> galloping</tspan><tspan dx="3.29340"> horse</tspan><tspan dx="3.29340"> moves</tspan><tspan dx="3.29340"> at</tspan><tspan dx="3.29340"> 18</tspan><tspan dx="3.29340"> m/s</tspan><tspan dx="3.29340"> and</tspan><tspan dx="3.29340"> a</tspan><tspan dx="3.29340"> train</tspan><tspan dx="3.29340"> at</tspan><tspan dx="3.29340"> 72</tspan><tspan dx="3.29340"> km/h.</tspan></tspan><tspan x="132" dy="32" data-justify-width="831" data-natural-space="5.59200" data-extra-space="0.28019" data-space-ratio="1.050">Which<tspan dx="0.28019"> is</tspan><tspan dx="0.28019"> faster,</tspan><tspan dx="0.28019"> and</tspan><tspan dx="0.28019"> by</tspan><tspan dx="0.28019"> how</tspan><tspan dx="0.28019"> much</tspan><tspan dx="0.28019"> in</tspan><tspan dx="0.28019"> m/s?</tspan><tspan dx="0.28019"> Do</tspan><tspan dx="0.28019"> not</tspan><tspan dx="0.28019"> treat</tspan><tspan dx="0.28019"> the</tspan><tspan dx="0.28019"> horse’s</tspan><tspan dx="0.28019"> given</tspan><tspan dx="0.28019"> speed</tspan></tspan><tspan x="132" dy="32" data-paragraph-end="true">as a record for all horses.</tspan></text></g><g transform="translate(0 752)"><g data-page-illustration="figures/class-6/science/ch05/bus.png"><image class="science-illustration" href="../../figures/class-6/science/ch05/bus.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Use both distance and time when comparing journeys.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Use both distance and time when comparing journeys.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">19</text></g></svg></div></div></section>
