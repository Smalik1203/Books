<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="19"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 19"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="5.10122" data-space-ratio="1.912">People<tspan dx="5.10122"> have</tspan><tspan dx="5.10122"> used</tspan><tspan dx="5.10122"> natural</tspan><tspan dx="5.10122"> cycles,</tspan><tspan dx="5.10122"> shadows,</tspan><tspan dx="5.10122"> flowing</tspan><tspan dx="5.10122"> water,</tspan><tspan dx="5.10122"> sand</tspan><tspan dx="5.10122"> and</tspan><tspan dx="5.10122"> burning</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">candles to mark time. A clock must be compared with a reliable reference.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.70469" data-space-ratio="1.305">For<tspan dx="1.70469"> a</tspan><tspan dx="1.70469"> pendulum,</tspan><tspan dx="1.70469"> measure</tspan><tspan dx="1.70469"> length</tspan><tspan dx="1.70469"> from</tspan><tspan dx="1.70469"> pivot</tspan><tspan dx="1.70469"> to</tspan><tspan dx="1.70469"> bob</tspan><tspan dx="1.70469"> centre.</tspan><tspan dx="1.70469"> One</tspan><tspan dx="1.70469"> oscillation</tspan><tspan dx="1.70469"> is</tspan><tspan dx="1.70469"> a</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">complete to-and-fro motion; its duration is the time period.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="3.94534" data-space-ratio="1.706">For<tspan dx="3.94534"> small</tspan><tspan dx="3.94534"> swings</tspan><tspan dx="3.94534"> at</tspan><tspan dx="3.94534"> the</tspan><tspan dx="3.94534"> same</tspan><tspan dx="3.94534"> place,</tspan><tspan dx="3.94534"> a</tspan><tspan dx="3.94534"> longer</tspan><tspan dx="3.94534"> simple</tspan><tspan dx="3.94534"> pendulum</tspan><tspan dx="3.94534"> has</tspan><tspan dx="3.94534"> a</tspan><tspan dx="3.94534"> longer</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">period. Its bob’s mass has little effect if other conditions stay comparable.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="3.17777" data-space-ratio="1.568">Timing<tspan dx="3.17777"> several</tspan><tspan dx="3.17777"> oscillations</tspan><tspan dx="3.17777"> and</tspan><tspan dx="3.17777"> repeating</tspan><tspan dx="3.17777"> trials</tspan><tspan dx="3.17777"> helps</tspan><tspan dx="3.17777"> reveal</tspan><tspan dx="3.17777"> variation.</tspan><tspan dx="3.17777"> It</tspan><tspan dx="3.17777"> does</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">not remove every source of error.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="3.69302" data-space-ratio="1.660">The<tspan dx="3.69302"> SI</tspan><tspan dx="3.69302"> time</tspan><tspan dx="3.69302"> unit</tspan><tspan dx="3.69302"> is</tspan><tspan dx="3.69302"> the</tspan><tspan dx="3.69302"> second</tspan><tspan dx="3.69302"> (s):</tspan><tspan dx="3.69302"> 1</tspan><tspan dx="3.69302"> min</tspan><tspan dx="3.69302"> =</tspan><tspan dx="3.69302"> 60</tspan><tspan dx="3.69302"> s</tspan><tspan dx="3.69302"> and</tspan><tspan dx="3.69302"> 1</tspan><tspan dx="3.69302"> h</tspan><tspan dx="3.69302"> =</tspan><tspan dx="3.69302"> 3600</tspan><tspan dx="3.69302"> s.</tspan><tspan dx="3.69302"> Write</tspan><tspan dx="3.69302"> unit</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">symbols without plural endings.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="2.16625" data-space-ratio="1.387">Average<tspan dx="2.16625"> speed</tspan><tspan dx="2.16625"> =</tspan><tspan dx="2.16625"> total</tspan><tspan dx="2.16625"> distance</tspan><tspan dx="2.16625"> ÷</tspan><tspan dx="2.16625"> total</tspan><tspan dx="2.16625"> time.</tspan><tspan dx="2.16625"> Use</tspan><tspan dx="2.16625"> the</tspan><tspan dx="2.16625"> same</tspan><tspan dx="2.16625"> journey</tspan><tspan dx="2.16625"> interval</tspan><tspan dx="2.16625"> and</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">compatible units; common units are m/s and km/h.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.45458" data-space-ratio="1.260">Distance<tspan dx="1.45458"> =</tspan><tspan dx="1.45458"> speed</tspan><tspan dx="1.45458"> ×</tspan><tspan dx="1.45458"> time;</tspan><tspan dx="1.45458"> time</tspan><tspan dx="1.45458"> =</tspan><tspan dx="1.45458"> distance</tspan><tspan dx="1.45458"> ÷</tspan><tspan dx="1.45458"> speed.</tspan><tspan dx="1.45458"> The</tspan><tspan dx="1.45458"> speed</tspan><tspan dx="1.45458"> must</tspan><tspan dx="1.45458"> describe</tspan><tspan dx="1.45458"> the</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">selected interval.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="2.90578" data-space-ratio="1.520">Uniform<tspan dx="2.90578"> linear</tspan><tspan dx="2.90578"> motion</tspan><tspan dx="2.90578"> has</tspan><tspan dx="2.90578"> constant</tspan><tspan dx="2.90578"> speed</tspan><tspan dx="2.90578"> along</tspan><tspan dx="2.90578"> a</tspan><tspan dx="2.90578"> straight</tspan><tspan dx="2.90578"> line.</tspan><tspan dx="2.90578"> Non-uniform</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">linear motion has changing speed.</tspan></text><text class="se-copy" x="89" y="796" text-anchor="start">•</text><text class="se-copy" x="112" y="796" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="6.72973" data-space-ratio="2.203">A<tspan dx="6.72973"> speedometer</tspan><tspan dx="6.72973"> indicates</tspan><tspan dx="6.72973"> current</tspan><tspan dx="6.72973"> speed;</tspan><tspan dx="6.72973"> an</tspan><tspan dx="6.72973"> odometer</tspan><tspan dx="6.72973"> records</tspan><tspan dx="6.72973"> accumulated</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">distance. Equal journey averages can hide very different motion.</tspan></text><text class="se-copy" x="89" y="870" text-anchor="start">•</text><text class="se-copy" x="112" y="870" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="3.44904" data-space-ratio="1.617">Measurements<tspan dx="3.44904"> support</tspan><tspan dx="3.44904"> claims</tspan><tspan dx="3.44904"> only</tspan><tspan dx="3.44904"> to</tspan><tspan dx="3.44904"> their</tspan><tspan dx="3.44904"> resolution</tspan><tspan dx="3.44904"> and</tspan><tspan dx="3.44904"> sampling</tspan><tspan dx="3.44904"> interval.</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">Keep unexpected readings and consider what the evidence cannot show.</tspan></text><g transform="translate(0 920)"><g data-page-illustration="figures/class-6/science/ch05/park.png"><image class="science-illustration" href="../../figures/class-6/science/ch05/park.png" x="214.75" y="10" width="622.5" height="415" preserveAspectRatio="xMidYMid meet"><title>Objects around us show different kinds of motion.</title></image><text class="se-caption" x="526" y="463" text-anchor="middle"><tspan x="526">Objects around us show different kinds of motion.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">19</text></g></svg></div></div></section>
