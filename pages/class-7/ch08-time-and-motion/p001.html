<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08 page--opener" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 1"><g class="chapter-opener" data-opener="science-g7-ch08"><defs><linearGradient id="science-g7-ch08-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop class="chapter-opener__gradient-start" offset="0%"/><stop class="chapter-opener__gradient-end" offset="100%"/></linearGradient></defs><path class="chapter-opener__band" fill="url(#science-g7-ch08-gradient)" d="M-17 -17H1069V300H-17Z"/><path class="chapter-opener__edge" d="M-17 296H1069V300H-17Z"/><g class="chapter-opener__motif v2-change-motif" transform="translate(951 84) scale(1.05)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><line class="chapter-opener__divider" x1="240" x2="240" y1="94" y2="252"/><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number se-running" x="151" y="242" text-anchor="middle">8</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">Measurement of</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">Time and Motion</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch08/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Prerna crossing a school race finish line as her teacher times the run</title></image></g><text class="se-copy v2-intro" x="89" y="981"><tspan x="89">A close finish can be decided in a fraction of a second. How do we</tspan><tspan x="89" dy="34">measure such a short interval?</tspan></text><text class="se-copy" x="89" y="1067"><tspan x="89">Prerna has won her district’s 100 m race and is training for the state meet. She</tspan><tspan x="89" dy="32">hopes to represent India one day. Watching Olympic races with her younger</tspan><tspan x="89" dy="32">sister, she notices how closely the runners finish.</tspan></text><text class="se-copy" x="89" y="1179"><tspan x="89">Her teacher uses a stopwatch. Her mother has a wristwatch; her sister checks a</tspan><tspan x="89" dy="32">phone. Her uncle uses a tactile watch and a talking clock. These devices make</tspan><tspan x="89" dy="32">time accessible in different ways. But how did people keep time before</tspan><tspan x="89" dy="32">clocks—and what can time measurements tell us about motion?</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
