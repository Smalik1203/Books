<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="instruments" transform="translate(0 112)"><g data-comparison-table="instruments"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Speedometer and odometer</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Speedometer</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="540" y="70.08"><tspan x="540">Odometer</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">A <tspan class="se-bold">speedometer</tspan> indicates speed at the</tspan><tspan x="103" dy="28">time of the reading.</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="110.08"><tspan x="540">An <tspan class="se-bold">odometer</tspan> records accumulated</tspan><tspan x="540" dy="28">distance travelled.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><rect class="v2-table-frame" x="89" y="42" width="874" height="108"/><line class="v2-table-rule" x1="526" x2="526" y1="42" y2="150"/><text class="v2-table-note" x="89" y="182.88"><tspan x="89">Subtract two odometer readings to find the distance between them; use the elapsed time to</tspan><tspan x="89" dy="26">find average speed. Neither a single speedometer reading nor an odometer reading alone</tspan><tspan x="89" dy="26">gives the average for a journey.</tspan></text></g></g>
