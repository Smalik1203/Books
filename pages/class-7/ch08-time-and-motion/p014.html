<g class="v2-reading-block" data-block="relationships" transform="translate(0 582)"><text class="v2-title" x="89" y="38"><tspan x="89">8.3.1 Distance, Speed and Time</tspan></text></g>
<g class="v2-reading-block" data-block="relationships-intro-0" transform="translate(0 640)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.02583" data-space-ratio="1.362">The<tspan dx="2.02583"> speed</tspan><tspan dx="2.02583"> relationship</tspan><tspan dx="2.02583"> can</tspan><tspan dx="2.02583"> be</tspan><tspan dx="2.02583"> rearranged.</tspan><tspan dx="2.02583"> Use</tspan><tspan dx="2.02583"> a</tspan><tspan dx="2.02583"> speed</tspan><tspan dx="2.02583"> that</tspan><tspan dx="2.02583"> applies</tspan><tspan dx="2.02583"> to</tspan><tspan dx="2.02583"> the</tspan><tspan dx="2.02583"> whole</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.88229" data-space-ratio="1.873">interval:<tspan dx="4.88229"> either</tspan><tspan dx="4.88229"> a</tspan><tspan dx="4.88229"> constant</tspan><tspan dx="4.88229"> speed,</tspan><tspan dx="4.88229"> or</tspan><tspan dx="4.88229"> the</tspan><tspan dx="4.88229"> average</tspan><tspan dx="4.88229"> speed</tspan><tspan dx="4.88229"> for</tspan><tspan dx="4.88229"> that</tspan><tspan dx="4.88229"> interval.</tspan><tspan dx="4.88229"> Keep</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">distance, time and speed units compatible.</tspan></text></g>
<g class="v2-reading-block" data-block="distance-rule" transform="translate(0 752)"><text class="v2-equation" x="89" y="30"><tspan x="89">Distance = speed × time</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">Example 8.2: a bus maintains 50 km/h for 2 h. Distance = 50 × 2 = 100 km.</tspan></text></g>
<g class="v2-reading-block" data-block="time-rule" transform="translate(0 849)"><text class="v2-equation" x="89" y="30"><tspan x="89">Time = distance ÷ speed</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">Example 8.3: a train averages 90 km/h over 360 km. Time = 360 ÷ 90 = 4 h.</tspan></text></g><g transform="translate(0 946)"><g data-page-illustration="figures/class-7/science/review/transport-motion.png"><image class="science-illustration" href="../../figures/class-7/science/review/transport-motion.png" x="114.00000000000006" y="10" width="823.9999999999999" height="329.51689359556224" preserveAspectRatio="xMidYMid meet"><title>Travel times can be compared with distances.</title></image><text class="se-caption" x="526" y="377.51689359556224" text-anchor="middle"><tspan x="526">Travel times can be compared with distances.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
