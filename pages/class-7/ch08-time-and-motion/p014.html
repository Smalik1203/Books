<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 14" xmlns="http://www.w3.org/2000/svg"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="motion" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">8.4 Uniform and Non-uniform Motion</tspan></text></g>
<g class="v2-reading-block" data-block="linear-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.54269" data-space-ratio="1.455">Motion<tspan dx="2.54269"> along</tspan><tspan dx="2.54269"> a</tspan><tspan dx="2.54269"> straight</tspan><tspan dx="2.54269"> line</tspan><tspan dx="2.54269"> is</tspan><tspan dx="2.54269"> <tspan class="se-bold">linear</tspan></tspan><tspan dx="2.54269"> <tspan class="se-bold">motion</tspan>.</tspan><tspan dx="2.54269"> Imagine</tspan><tspan dx="2.54269"> a</tspan><tspan dx="2.54269"> train</tspan><tspan dx="2.54269"> leaving</tspan><tspan dx="2.54269"> station</tspan><tspan dx="2.54269"> A,</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.81608" data-space-ratio="1.325">gathering<tspan dx="1.81608"> speed</tspan><tspan dx="1.81608"> towards</tspan><tspan dx="1.81608"> B,</tspan><tspan dx="1.81608"> travelling</tspan><tspan dx="1.81608"> steadily</tspan><tspan dx="1.81608"> from</tspan><tspan dx="1.81608"> B</tspan><tspan dx="1.81608"> to</tspan><tspan dx="1.81608"> C</tspan><tspan dx="1.81608"> and</tspan><tspan dx="1.81608"> slowing</tspan><tspan dx="1.81608"> to</tspan><tspan dx="1.81608"> stop</tspan><tspan dx="1.81608"> at</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">D. Its speed can change even though its track remains straight.</tspan></text></g>
<g class="v2-reading-block" data-block="train-stages" transform="translate(0 282)"><g data-instructional-figure="train-stages"><g class="v2-motion-diagram" data-diagram="train-stages"><path class="v2-motion-line" d="M135 93H917"/><circle class="v2-motion-grain" cx="135" cy="93" r="5"/><text class="v2-motion-label" x="135" y="134" text-anchor="middle">A</text><circle class="v2-motion-grain" cx="390" cy="93" r="5"/><text class="v2-motion-label" x="390" y="134" text-anchor="middle">B</text><circle class="v2-motion-grain" cx="650" cy="93" r="5"/><text class="v2-motion-label" x="650" y="134" text-anchor="middle">C</text><circle class="v2-motion-grain" cx="917" cy="93" r="5"/><text class="v2-motion-label" x="917" y="134" text-anchor="middle">D</text><text class="v2-motion-label" x="260" y="45" text-anchor="middle">Speeds up</text><text class="v2-motion-label" x="522" y="45" text-anchor="middle">Steady speed</text><text class="v2-motion-label" x="790" y="45" text-anchor="middle">Slows to stop</text><path class="v2-motion-line" d="M180 75L339 75M330.22417438109625 79.79425538604202L339 75L330.22417438109625 70.20574461395798"/><path class="v2-motion-line" d="M434 75L599 75M590.2241743810963 79.79425538604202L599 75L590.2241743810963 70.20574461395798"/><path class="v2-motion-line" d="M694 75L865 75M856.2241743810963 79.79425538604202L865 75L856.2241743810963 70.20574461395798"/></g></g><text class="se-caption" x="89" y="189.88"><tspan x="89">A straight journey can contain different kinds of motion. The arrows indicate travel direction,</tspan><tspan x="89" dy="27">not equal times or a distance scale.</tspan></text></g>
<g class="v2-reading-block" data-block="motion-comparison" transform="translate(0 527)"><g data-comparison-table="motion-comparison" data-table-spacing="airy"><text class="v2-table-caption" x="89" y="33.6"><tspan x="89">Uniform and non-uniform linear motion</tspan></text><rect class="se-table-head" x="89" y="54" width="874" height="48"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="86.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="260.32" y="86.08"><tspan x="260.32">Uniform linear motion</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="618.6600000000001" y="86.08"><tspan x="618.6600000000001">Non-uniform linear motion</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="102" y2="102"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="134.08"><tspan x="103">Path and</tspan><tspan x="103" dy="28">speed</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="134.08"><tspan x="260.32">Follows a straight line at</tspan><tspan x="260.32" dy="28">constant speed.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="134.08"><tspan x="618.6600000000001">Follows a straight line with</tspan><tspan x="618.6600000000001" dy="28">changing speed.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="210.08"><tspan x="103">Equal</tspan><tspan x="103" dy="28">intervals</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="210.08"><tspan x="260.32">Covers equal distances in equal</tspan><tspan x="260.32" dy="28">time intervals.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="210.08"><tspan x="618.6600000000001">Can cover unequal distances in</tspan><tspan x="618.6600000000001" dy="28">equal time intervals.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="254" y2="254"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="286.08"><tspan x="103">Example</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="286.08"><tspan x="260.32">An ideal model of a steady part</tspan><tspan x="260.32" dy="28">of a journey.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="286.08"><tspan x="618.6600000000001">Occurs while speeding up or</tspan><tspan x="618.6600000000001" dy="28">slowing down.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="330" y2="330"/><rect class="v2-table-frame" x="89" y="54" width="874" height="276"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="54" y2="330"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="54" y2="330"/></g></g>
<g class="v2-reading-block" data-block="instruments" transform="translate(0 885)"><g data-comparison-table="instruments" data-table-spacing="airy"><text class="v2-table-caption" x="89" y="33.6"><tspan x="89">Speedometer and odometer</tspan></text><rect class="se-table-head" x="89" y="54" width="874" height="48"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="86.08"><tspan x="103">Speedometer</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="540" y="86.08"><tspan x="540">Odometer</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="102" y2="102"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="134.08"><tspan x="103">A <tspan class="se-bold">speedometer</tspan> indicates speed at the</tspan><tspan x="103" dy="28">time of the reading.</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="134.08"><tspan x="540">An <tspan class="se-bold">odometer</tspan> records accumulated</tspan><tspan x="540" dy="28">distance travelled.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><rect class="v2-table-frame" x="89" y="54" width="874" height="124"/><line class="v2-table-rule" x1="526" x2="526" y1="54" y2="178"/><text class="v2-table-note" x="89" y="218.88"><tspan x="89">Subtract two odometer readings to find the distance between them; use the elapsed time to</tspan><tspan x="89" dy="26">find average speed. Neither a single speedometer reading nor an odometer reading alone</tspan><tspan x="89" dy="26">gives the average for a journey.</tspan></text></g></g>
