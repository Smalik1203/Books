<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 11"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="example-one" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Example 8.1 · Swati’s bicycle ride</tspan></text></g>
<g class="v2-reading-block" data-block="swati-work" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89">Swati cycles 3.6 km in 15 min. Convert: 3.6 × 1000 = 3600 m; 15 × 60 = 900 s. Her</tspan><tspan x="89" dy="32">average speed is 3600 m ÷ 900 s = 4 m/s.</tspan></text></g>
<g class="v2-reading-block" data-block="speed-units-0" transform="translate(0 240)"><text class="se-copy" x="89" y="24"><tspan x="89">To change m/s into km/h, multiply by 3.6: there are 3600 seconds in an hour and</tspan><tspan x="89" dy="32">1000 metres in a kilometre. Thus 4 m/s = 14.4 km/h. To change km/h into m/s,</tspan></text></g>
<g class="v2-reading-block" data-block="speed-units-1" transform="translate(0 304)"><text class="se-copy" x="89" y="24"><tspan x="89">divide by 3.6. Converting both measurements before dividing is another reliable</tspan><tspan x="89" dy="32">route.</tspan></text></g>
<g class="v2-reading-block" data-block="railways" transform="translate(0 396)"><text class="se-heading" x="89" y="30"><tspan x="89">Comparing train journeys</tspan></text></g>
<g class="v2-reading-block" data-block="train-task" transform="translate(0 444)"><rect class="se-activity-panel" x="89" y="0" width="874" height="522" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">With an adult, consult an official railway timetable. Choose a nearby</tspan><tspan x="146" dy="32">station, a next stop and four or five trains, including passenger, express or</tspan><tspan x="146" dy="32">superfast services where available.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Record each train, next stop, departure, arrival and segment distance. For</tspan><tspan x="146" dy="32">cumulative distances, subtract the two station readings.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Calculate elapsed time, including the date for a journey crossing</tspan><tspan x="146" dy="32">midnight. Convert minutes to hours before finding km/h.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352"><tspan x="146">Divide each segment distance by its elapsed time. Compare the scheduled</tspan><tspan x="146" dy="32">average speeds for these segments; note the timetable source and date.</tspan></text><text class="se-copy" x="113" y="428"><tspan x="113">This is a timetable investigation. Do not go near tracks or moving trains to</tspan><tspan x="113" dy="32">take measurements. Scheduled times are not observations of actual running</tspan><tspan x="113" dy="32">times.</tspan></text></g>
<g class="v2-reading-block" data-block="train-record" transform="translate(0 988)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">A timetable record · illustrative data only</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="80"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Train / next</tspan><tspan x="103" dy="28">stop</tspan></text><text class="v2-table-heading" x="277.8" y="76.08"><tspan x="277.8">Segment distance</tspan></text><text class="v2-table-heading" x="513.78" y="76.08"><tspan x="513.78">Elapsed time</tspan></text><text class="v2-table-heading" x="732.28" y="76.08"><tspan x="732.28">Scheduled average</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="122" y2="122"/><text class="se-copy se-table-copy" x="103" y="156.07999999999998"><tspan x="103">Example A / B</tspan></text><text class="se-copy se-table-copy" x="277.8" y="156.07999999999998"><tspan x="277.8">84 − 24 = 60 km</tspan></text><text class="se-copy se-table-copy" x="513.78" y="156.07999999999998"><tspan x="513.78">14:00 to 15:00 = 1 h</tspan></text><text class="se-copy se-table-copy" x="732.28" y="156.07999999999998"><tspan x="732.28">60 km ÷ 1 h = 60</tspan><tspan x="732.28" dy="28">km/h</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="202" y2="202"/><rect class="v2-table-frame" x="89" y="42" width="874" height="160"/><line class="v2-table-rule" x1="263.8" x2="263.8" y1="42" y2="202"/><line class="v2-table-rule" x1="499.78000000000003" x2="499.78000000000003" y1="42" y2="202"/><line class="v2-table-rule" x1="718.28" x2="718.28" y1="42" y2="202"/><text class="v2-table-note" x="89" y="234.88"><tspan x="89">Use these column meanings for your own records. Keep departure and arrival times in your</tspan><tspan x="89" dy="26">notes. These invented values are not a railway schedule.</tspan></text></g>
<g class="v2-reading-block" data-block="train-evidence-0" transform="translate(0 1274)"><text class="se-copy" x="89" y="24"><tspan x="89">Which train has the greatest average speed for your segment? Service names</tspan><tspan x="89" dy="32">alone cannot answer this: stops, route conditions and the interval matter.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">11</text></g></svg></div></div></section>
