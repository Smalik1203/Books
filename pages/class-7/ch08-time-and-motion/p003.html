</tspan><tspan dx="1.83285"> level</tspan><tspan dx="1.83285"> after</tspan><tspan dx="1.83285"> each</tspan><tspan dx="1.83285"> minute</tspan><tspan dx="1.83285"> until</tspan><tspan dx="1.83285"> the</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="4.11368" data-space-ratio="1.736">upper<tspan dx="4.11368"> part</tspan><tspan dx="4.11368"> empties.</tspan><tspan dx="4.11368"> Number</tspan><tspan dx="4.11368"> these</tspan><tspan dx="4.11368"> marks</tspan><tspan dx="4.11368"> in</tspan><tspan dx="4.11368"> your</tspan><tspan dx="4.11368"> notebook</tspan><tspan dx="4.11368"> and</tspan><tspan dx="4.11368"> on</tspan><tspan dx="4.11368"> the</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">bottle.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="0.59571" data-space-ratio="1.107">Return<tspan dx="0.59571"> the</tspan><tspan dx="0.59571"> collected</tspan><tspan dx="0.59571"> water</tspan><tspan dx="0.59571"> to</tspan><tspan dx="0.59571"> the</tspan><tspan dx="0.59571"> upper</tspan><tspan dx="0.59571"> part,</tspan><tspan dx="0.59571"> using</tspan><tspan dx="0.59571"> the</tspan><tspan dx="0.59571"> same</tspan><tspan dx="0.59571"> starting</tspan><tspan dx="0.59571"> level</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="4.11619" data-space-ratio="1.736">and<tspan dx="4.11619"> an</tspan><tspan dx="4.11619"> empty</tspan><tspan dx="4.11619"> lower</tspan><tspan dx="4.11619"> part.</tspan><tspan dx="4.11619"> Compare</tspan><tspan dx="4.11619"> the</tspan><tspan dx="4.11619"> marks</tspan><tspan dx="4.11619"> with</tspan><tspan dx="4.11619"> the</tspan><tspan dx="4.11619"> watch</tspan><tspan dx="4.11619"> during</tspan><tspan dx="4.11619"> a</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">second run.</tspan></text><text class="se-copy" x="113" y="524" data-prose-align="justify"><tspan x="113" data-justify-width="826" data-natural-space="5.59200" data-extra-space="7.79478" data-space-ratio="2.394">Keep<tspan dx="7.79478"> water</tspan><tspan dx="7.79478"> away</tspan><tspan dx="7.79478"> from</tspan><tspan dx="7.79478"> electrical</tspan><tspan dx="7.79478"> devices.</tspan><tspan dx="7.79478"> Adults</tspan><tspan dx="7.79478"> handle</tspan><tspan dx="7.79478"> all</tspan><tspan dx="7.79478"> cutting</tspan><tspan dx="7.79478"> and</tspan></tspan><tspan x="113" dy="32" data-paragraph-end="true">piercing; do not use heated tools. Wipe up spills.</tspan></text><g transform="translate(0 576)"><g data-instructional-figure="water-clock"><svg class="science-illustration v2-motion-diagram" data-diagram="water-clock" x="89" y="0" width="874" height="284" viewBox="89 0 874 284"><svg class="science-illustration" x="409" y="0" width="224" height="284" viewBox="370 0 800 1015" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch08/apparatus-water-clock.png" width="1536" height="1024"/></svg><text class="v2-motion-label" x="252" y="59" text-anchor="middle">Same starting level</text><path class="v2-motion-line" d="M374 56L465 63"/><text class="v2-motion-label" x="756" y="58" text-anchor="middle">Covered cut edges</text><path class="v2-motion-line" d="M641 56L580 20"/><text class="v2-motion-label" x="734" y="185" text-anchor="middle">Hole in cap</text><path class="v2-motion-line" d="M661 182L525 165"/><text class="v2-motion-label" x="755" y="254" text-anchor="middle">Collecting vessel</text><path class="v2-motion-line" d="M654 248L579 225"/></svg></g></g><text class="se-caption" x="113" y="892.88"><tspan x="113">Initial assembly: the lower vessel collects water. Add time marks from your own first</tspan><tspan x="113" dy="27">run.</tspan></text></g><g class="v2-footer">
