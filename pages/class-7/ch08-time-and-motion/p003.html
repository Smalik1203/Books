<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="water-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="948" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Ask an adult to cut a clean transparent plastic bottle of at least 0.5 L into</tspan><tspan x="146" dy="32">two parts, pierce a tiny hole in its cap and cover sharp cut edges. Fit the</tspan><tspan x="146" dy="32">capped upper part upside down inside the lower part, as shown.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Stand it securely in a tray. Fill the upper part to a chosen starting level</tspan><tspan x="146" dy="32">with water; a little food colouring may help. Start timing as water begins</tspan><tspan x="146" dy="32">to enter the empty lower part.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Use a watch to mark the collected water level after each minute until the</tspan><tspan x="146" dy="32">upper part empties. Number these marks in your notebook and on the</tspan><tspan x="146" dy="32">bottle.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Return the collected water to the upper part, using the same starting level</tspan><tspan x="146" dy="32">and an empty lower part. Compare the marks with the watch during a</tspan><tspan x="146" dy="32">second run.</tspan></text><text class="se-copy" x="113" y="524"><tspan x="113">Keep water away from electrical devices. Adults handle all cutting and</tspan><tspan x="113" dy="32">piercing; do not use heated tools. Wipe up spills.</tspan></text><g transform="translate(0 576)"><svg class="science-illustration v2-motion-diagram" data-diagram="water-clock" x="89" y="0" width="874" height="284" viewBox="89 0 874 284"><svg class="science-illustration" x="409" y="0" width="224" height="284" viewBox="370 0 800 1015" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch08/apparatus-water-clock.png" width="1536" height="1024"/></svg><text class="v2-motion-label" x="252" y="59" text-anchor="middle">Same starting level</text><path class="v2-motion-line" d="M374 56L465 63"/><text class="v2-motion-label" x="756" y="58" text-anchor="middle">Covered cut edges</text><path class="v2-motion-line" d="M641 56L580 20"/><text class="v2-motion-label" x="734" y="185" text-anchor="middle">Hole in cap</text><path class="v2-motion-line" d="M661 182L525 165"/><text class="v2-motion-label" x="755" y="254" text-anchor="middle">Collecting vessel</text><path class="v2-motion-line" d="M654 248L579 225"/></svg></g><text class="se-caption" x="113" y="892.88"><tspan x="113">Initial assembly: the lower vessel collects water. Add time marks from your own first</tspan><tspan x="113" dy="27">run.</tspan></text></g>
<g class="v2-reading-block" data-block="water-evidence-0" transform="translate(0 1082)"><text class="se-copy" x="89" y="24"><tspan x="89">Compare the two runs before judging the clock. Did a given mark correspond to</tspan><tspan x="89" dy="32">nearly the same time? If not, check the starting level, cap hole, leaks and the</tspan></text></g>
<g class="v2-reading-block" data-block="water-evidence-1" transform="translate(0 1146)"><text class="se-copy" x="89" y="24"><tspan x="89">position of the upper bottle. Keep your actual readings; an inconsistent clock is</tspan><tspan x="89" dy="32">still useful evidence about its design.</tspan></text></g>
<g class="v2-reading-block" data-block="water-flow-0" transform="translate(0 1226)"><text class="se-copy" x="89" y="24"><tspan x="89">As the water level above the hole falls, the outflow generally slows. Equal time</tspan><tspan x="89" dy="32">intervals therefore need not produce equal rises in the collecting vessel; its shape</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
