<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="clock-accuracy" transform="translate(0 112)"><g data-comparison-table="clock-accuracy"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Resolution and accuracy</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Resolution</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="540" y="70.08"><tspan x="540">Accuracy</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103"><tspan class="se-bold">Resolution</tspan> is the smallest interval its</tspan><tspan x="103" dy="28">display or scale distinguishes.</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="110.08"><tspan x="540">Accuracy concerns how close a reading</tspan><tspan x="540" dy="28">is to the actual interval.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><rect class="v2-table-frame" x="89" y="42" width="874" height="108"/><line class="v2-table-rule" x1="526" x2="526" y1="42" y2="150"/><text class="v2-table-note" x="89" y="182.88"><tspan x="89">Timekeeping has improved greatly from early mechanical clocks to modern atomic</tspan><tspan x="89" dy="26">standards. Yet a device displaying many digits is not automatically accurate.</tspan></text></g></g>
<g class="v2-reading-block" data-block="units" transform="translate(0 354)"><text class="v2-title" x="89" y="38"><tspan x="89">8.1.2 Units of Time</tspan></text></g>
<g class="v2-reading-block" data-block="second-0" transform="translate(0 412)"><text class="se-copy" x="89" y="24"><tspan x="89">The SI unit of time is the <tspan class="se-bold">second</tspan>, symbol <tspan class="se-bold">s</tspan>. Its present definition uses a specified</tspan><tspan x="89" dy="32">frequency associated with caesium-133 atoms. You do not need an atomic clock</tspan></text></g>
<g class="v2-reading-block" data-block="second-1" transform="translate(0 476)"><text class="se-copy" x="89" y="24"><tspan x="89">for a classroom investigation, but standard units let people compare</tspan><tspan x="89" dy="32">measurements made in different places.</tspan></text></g>
<g class="v2-reading-block" data-block="time-units" transform="translate(0 556)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Time units and conversions</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Unit</tspan></text><text class="v2-table-heading" x="347.72" y="76.08"><tspan x="347.72">Symbol</tspan></text><text class="v2-table-heading" x="522.52" y="76.08"><tspan x="522.52">Equivalent interval</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">second</tspan></text><text class="se-copy se-table-copy" x="347.72" y="128.07999999999998"><tspan x="347.72">s</tspan></text><text class="se-copy se-table-copy" x="522.52" y="128.07999999999998"><tspan x="522.52">Base unit of time</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="146" y2="146"/><text class="se-copy se-table-copy" x="103" y="180.07999999999998"><tspan x="103">minute</tspan></text><text class="se-copy se-table-copy" x="347.72" y="180.07999999999998"><tspan x="347.72">min</tspan></text><text class="se-copy se-table-copy" x="522.52" y="180.07999999999998"><tspan x="522.52">1 min = 60 s</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="198" y2="198"/><text class="se-copy se-table-copy" x="103" y="232.07999999999998"><tspan x="103">hour</tspan></text><text class="se-copy se-table-copy" x="347.72" y="232.07999999999998"><tspan x="347.72">h</tspan></text><text class="se-copy se-table-copy" x="522.52" y="232.07999999999998"><tspan x="522.52">1 h = 60 min = 3600 s</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="250" y2="250"/><rect class="v2-table-frame" x="89" y="42" width="874" height="208"/><line class="v2-table-rule" x1="333.72" x2="333.72" y1="42" y2="250"/><line class="v2-table-rule" x1="508.52000000000004" x2="508.52000000000004" y1="42" y2="250"/><text class="v2-table-note" x="89" y="282.88"><tspan x="89">Read across for a unit’s symbol and equivalent. Convert all times to compatible units before</tspan><tspan x="89" dy="26">calculating.</tspan></text></g>
<g class="v2-reading-block" data-block="unit-writing-0" transform="translate(0 890)"><text class="se-copy" x="89" y="24"><tspan x="89">Write unit names in lower case, except at the start of a sentence. Leave a space</tspan><tspan x="89" dy="32">between a number and its unit symbol: 12 s, 5 min, 2 h. Symbols do not become</tspan></text></g>
<g class="v2-reading-block" data-block="unit-writing-1" transform="translate(0 954)"><text class="se-copy" x="89" y="24"><tspan x="89">plural: write 12 s, not 12 secs. A full stop belongs to the sentence, not to the</tspan><tspan x="89" dy="32">symbol.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
