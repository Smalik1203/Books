<g class="v2-reading-block" data-block="clock-accuracy" transform="translate(0 1137)"><g data-table-spacing="airy" data-comparison-table="clock-accuracy"><text class="v2-table-caption" x="89" y="33.6"><tspan x="89">Resolution and accuracy</tspan></text><rect class="se-table-head" x="89" y="54" width="874" height="48"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="86.08"><tspan x="103">Resolution</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="540" y="86.08"><tspan x="540">Accuracy</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="102" y2="102"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="134.07999999999998"><tspan x="103"><tspan class="se-bold">Resolution</tspan> is the smallest interval its</tspan><tspan x="103" dy="28">display or scale distinguishes.</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="134.07999999999998"><tspan x="540">Accuracy concerns how close a reading</tspan><tspan x="540" dy="28">is to the actual interval.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><rect class="v2-table-frame" x="89" y="54" width="874" height="124"/><line class="v2-table-rule" x1="526" x2="526" y1="54" y2="178"/><text class="v2-table-note" x="89" y="218.88"><tspan x="89">Timekeeping has improved greatly from early mechanical clocks to modern atomic</tspan><tspan x="89" dy="26">standards. Yet a device displaying many digits is not automatically accurate.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text cla
