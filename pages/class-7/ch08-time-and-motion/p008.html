<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="modern" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">From swinging bobs to atomic clocks</tspan></text></g>
<g class="v2-reading-block" data-block="modern-mechanisms-0" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89">Clocks count repeating processes. In a pendulum clock, a mechanism maintains</tspan><tspan x="89" dy="32">and counts swings. In a quartz clock, an electrical circuit counts regular</tspan></text></g>
<g class="v2-reading-block" data-block="modern-mechanisms-1" transform="translate(0 224)"><text class="se-copy" x="89" y="24"><tspan x="89">vibrations of a quartz crystal. Atomic clocks use the stable frequencies associated</tspan><tspan x="89" dy="32">with transitions in atoms; they do not count atoms swinging like tiny pendulum</tspan><tspan x="89" dy="32">bobs.</tspan></text></g>
<g class="v2-reading-block" data-block="accessible-clocks" transform="translate(0 336)"><image class="science-illustration" data-photo="modern-clocks" href="../../figures/class-7/science/ch08/modern-clocks.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">A wristwatch, stopwatch, tactile watch and talking clock offer different ways to read or hear</tspan><tspan x="89" dy="27">time. Choose a device suited to the task and the user.</tspan></text></g>
<g class="v2-reading-block" data-block="clock-accuracy-0" transform="translate(0 698)"><text class="se-copy" x="89" y="24"><tspan x="89">Timekeeping has improved greatly from early mechanical clocks to modern</tspan><tspan x="89" dy="32">atomic standards. Yet a device displaying many digits is not automatically</tspan></text></g>
<g class="v2-reading-block" data-block="clock-accuracy-1" transform="translate(0 762)"><text class="se-copy" x="89" y="24"><tspan x="89">accurate. <tspan class="se-bold">Resolution</tspan> is the smallest interval its display or scale distinguishes;</tspan><tspan x="89" dy="32">accuracy concerns how close a reading is to the actual interval.</tspan></text></g>
<g class="v2-reading-block" data-block="units" transform="translate(0 854)"><text class="v2-title" x="89" y="38"><tspan x="89">8.1.2 Units of Time</tspan></text></g>
<g class="v2-reading-block" data-block="second-0" transform="translate(0 912)"><text class="se-copy" x="89" y="24"><tspan x="89">The SI unit of time is the <tspan class="se-bold">second</tspan>, symbol <tspan class="se-bold">s</tspan>. Its present definition uses a specified</tspan><tspan x="89" dy="32">frequency associated with caesium-133 atoms. You do not need an atomic clock</tspan></text></g>
<g class="v2-reading-block" data-block="second-1" transform="translate(0 976)"><text class="se-copy" x="89" y="24"><tspan x="89">for a classroom investigation, but standard units let people compare</tspan><tspan x="89" dy="32">measurements made in different places.</tspan></text></g>
<g class="v2-reading-block" data-block="time-units" transform="translate(0 1056)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Time units and conversions</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Unit</tspan></text><text class="v2-table-heading" x="347.72" y="76.08"><tspan x="347.72">Symbol</tspan></text><text class="v2-table-heading" x="522.52" y="76.08"><tspan x="522.52">Equivalent interval</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">second</tspan></text><text class="se-copy se-table-copy" x="347.72" y="128.07999999999998"><tspan x="347.72">s</tspan></text><text class="se-copy se-table-copy" x="522.52" y="128.07999999999998"><tspan x="522.52">Base unit of time</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="146" y2="146"/><text class="se-copy se-table-copy" x="103" y="180.07999999999998"><tspan x="103">minute</tspan></text><text class="se-copy se-table-copy" x="347.72" y="180.07999999999998"><tspan x="347.72">min</tspan></text><text class="se-copy se-table-copy" x="522.52" y="180.07999999999998"><tspan x="522.52">1 min = 60 s</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="198" y2="198"/><text class="se-copy se-table-copy" x="103" y="232.07999999999998"><tspan x="103">hour</tspan></text><text class="se-copy se-table-copy" x="347.72" y="232.07999999999998"><tspan x="347.72">h</tspan></text><text class="se-copy se-table-copy" x="522.52" y="232.07999999999998"><tspan x="522.52">1 h = 60 min = 3600 s</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="250" y2="250"/><rect class="v2-table-frame" x="89" y="42" width="874" height="208"/><line class="v2-table-rule" x1="333.72" x2="333.72" y1="42" y2="250"/><line class="v2-table-rule" x1="508.52000000000004" x2="508.52000000000004" y1="42" y2="250"/><text class="v2-table-note" x="89" y="282.88"><tspan x="89">Read across for a unit’s symbol and equivalent. Convert all times to compatible units before</tspan><tspan x="89" dy="26">calculating.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
