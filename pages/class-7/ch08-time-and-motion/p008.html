<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="pendulum-variables" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Change one variable</tspan></text></g>
<g class="v2-reading-block" data-block="length-extension" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89">Keep the same bob and try two or three different lengths. At each length, release</tspan><tspan x="89" dy="32">from the same small angle, time 10 oscillations and repeat. Record the length</tspan><tspan x="89" dy="32">and periods together. Compare the trend only after collecting the readings.</tspan></text></g>
<g class="v2-reading-block" data-block="mass-extension" transform="translate(0 272)"><text class="se-copy" x="89" y="24"><tspan x="89">Next keep the pivot-to-centre length fixed and use secure bobs of different</tspan><tspan x="89" dy="32">masses but similar size and shape. Keep the location and small release angle</tspan><tspan x="89" dy="32">unchanged. Predict, test and compare. Do not change length and mass together if</tspan><tspan x="89" dy="32">you want to distinguish their effects.</tspan></text></g>
<g class="v2-reading-block" data-block="pendulum-conclusion-0" transform="translate(0 416)"><text class="se-copy" x="89" y="24"><tspan x="89">For a simple pendulum making small swings at a given place, a longer length</tspan><tspan x="89" dy="32">gives a longer period. Changing the bob’s mass has little effect under these</tspan></text></g>
<g class="v2-reading-block" data-block="pendulum-conclusion-1" transform="translate(0 480)"><text class="se-copy" x="89" y="24"><tspan x="89">conditions. Large swings, friction, air resistance and changes in local gravity</tspan><tspan x="89" dy="32">limit this simple description; the period is not universally constant for every</tspan><tspan x="89" dy="32">pendulum.</tspan></text></g>
<g class="v2-reading-block" data-block="modern" transform="translate(0 604)"><text class="se-heading" x="89" y="30"><tspan x="89">From swinging bobs to atomic clocks</tspan></text></g>
<g class="v2-reading-block" data-block="modern-mechanisms-0" transform="translate(0 652)"><text class="se-copy" x="89" y="24"><tspan x="89">Clocks count repeating processes. In a pendulum clock, a mechanism maintains</tspan><tspan x="89" dy="32">and counts swings. In a quartz clock, an electrical circuit counts regular</tspan></text></g>
<g class="v2-reading-block" data-block="modern-mechanisms-1" transform="translate(0 716)"><text class="se-copy" x="89" y="24"><tspan x="89">vibrations of a quartz crystal. Atomic clocks use the stable frequencies associated</tspan><tspan x="89" dy="32">with transitions in atoms; they do not count atoms swinging like tiny pendulum</tspan><tspan x="89" dy="32">bobs.</tspan></text></g>
<g class="v2-reading-block" data-block="accessible-clocks" transform="translate(0 828)"><image class="science-illustration" data-photo="modern-clocks" href="../../figures/class-7/science/ch08/modern-clocks.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">A wristwatch, stopwatch, tactile watch and talking clock offer different ways to read or hear</tspan><tspan x="89" dy="27">time. Choose a device suited to the task and the user.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
