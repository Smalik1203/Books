<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="train-evidence-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Compare matching station pairs where possible. A short-segment result does not</tspan><tspan x="89" dy="32">describe every journey.</tspan></text></g>
<g class="v2-reading-block" data-block="relationships" transform="translate(0 204)"><text class="v2-title" x="89" y="38"><tspan x="89">8.3.1 Distance, Speed and Time</tspan></text></g>
<g class="v2-reading-block" data-block="relationships-intro-0" transform="translate(0 262)"><text class="se-copy" x="89" y="24"><tspan x="89">The speed relationship can be rearranged. Use a speed that applies to the whole</tspan><tspan x="89" dy="32">interval: either a constant speed, or the average speed for that interval. Keep</tspan><tspan x="89" dy="32">distance, time and speed units compatible.</tspan></text></g>
<g class="v2-reading-block" data-block="distance-rule" transform="translate(0 374)"><text class="v2-equation" x="89" y="30"><tspan x="89">Distance = speed × time</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">Example 8.2: a bus maintains 50 km/h for 2 h. Distance = 50 × 2 = 100 km.</tspan></text></g>
<g class="v2-reading-block" data-block="time-rule" transform="translate(0 471)"><text class="v2-equation" x="89" y="30"><tspan x="89">Time = distance ÷ speed</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">Example 8.3: a train averages 90 km/h over 360 km. Time = 360 ÷ 90 = 4 h.</tspan></text></g>
<g class="v2-reading-block" data-block="interval-check-0" transform="translate(0 568)"><text class="se-copy" x="89" y="24"><tspan x="89">Multiplying km/h by hours gives kilometres; dividing kilometres by km/h gives</tspan><tspan x="89" dy="32">hours. This unit check can catch an error caused by using minutes with a speed</tspan><tspan x="89" dy="32">given per hour.</tspan></text></g>
<g class="v2-reading-block" data-block="motion" transform="translate(0 692)"><text class="v2-title" x="89" y="38"><tspan x="89">8.4 Uniform and Non-uniform Motion</tspan></text></g>
<g class="v2-reading-block" data-block="linear-0" transform="translate(0 750)"><text class="se-copy" x="89" y="24"><tspan x="89">Motion along a straight line is <tspan class="se-bold">linear</tspan> <tspan class="se-bold">motion</tspan>. Imagine a train leaving station A,</tspan><tspan x="89" dy="32">gathering speed towards B, travelling steadily from B to C and slowing to stop at</tspan><tspan x="89" dy="32">D. Its speed can change even though its track remains straight.</tspan></text></g>
<g class="v2-reading-block" data-block="train-stages" transform="translate(0 862)"><g class="v2-motion-diagram" data-diagram="train-stages"><path class="v2-motion-line" d="M135 93H917"/><circle class="v2-motion-grain" cx="135" cy="93" r="5"/><text class="v2-motion-label" x="135" y="134" text-anchor="middle">A</text><circle class="v2-motion-grain" cx="390" cy="93" r="5"/><text class="v2-motion-label" x="390" y="134" text-anchor="middle">B</text><circle class="v2-motion-grain" cx="650" cy="93" r="5"/><text class="v2-motion-label" x="650" y="134" text-anchor="middle">C</text><circle class="v2-motion-grain" cx="917" cy="93" r="5"/><text class="v2-motion-label" x="917" y="134" text-anchor="middle">D</text><text class="v2-motion-label" x="260" y="45" text-anchor="middle">Speeds up</text><text class="v2-motion-label" x="522" y="45" text-anchor="middle">Steady speed</text><text class="v2-motion-label" x="790" y="45" text-anchor="middle">Slows to stop</text><path class="v2-motion-line" d="M180 75L339 75M330.22417438109625 79.79425538604202L339 75L330.22417438109625 70.20574461395798"/><path class="v2-motion-line" d="M434 75L599 75M590.2241743810963 79.79425538604202L599 75L590.2241743810963 70.20574461395798"/><path class="v2-motion-line" d="M694 75L865 75M856.2241743810963 79.79425538604202L865 75L856.2241743810963 70.20574461395798"/></g><text class="se-caption" x="89" y="189.88"><tspan x="89">A straight journey can contain different kinds of motion. The arrows indicate travel direction,</tspan><tspan x="89" dy="27">not equal times or a distance scale.</tspan></text></g>
<g class="v2-reading-block" data-block="motion-comparison" transform="translate(0 1107)"><g data-comparison-table="motion-comparison"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Uniform and non-uniform linear motion</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="260.32" y="70.08"><tspan x="260.32">Uniform linear motion</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="618.6600000000001" y="70.08"><tspan x="618.6600000000001">Non-uniform linear motion</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Path and</tspan><tspan x="103" dy="28">speed</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="110.08"><tspan x="260.32">Follows a straight line at</tspan><tspan x="260.32" dy="28">constant speed.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="110.08"><tspan x="618.6600000000001">Follows a straight line with</tspan><tspan x="618.6600000000001" dy="28">changing speed.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">Equal</tspan><tspan x="103" dy="28">intervals</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="178.07999999999998"><tspan x="260.32">Covers equal distances in equal</tspan><tspan x="260.32" dy="28">time intervals.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="178.07999999999998"><tspan x="618.6600000000001">Can cover unequal distances in</tspan><tspan x="618.6600000000001" dy="28">equal time intervals.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="218" y2="218"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="246.07999999999998"><tspan x="103">Example</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="246.07999999999998"><tspan x="260.32">An ideal model of a steady part</tspan><tspan x="260.32" dy="28">of a journey.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="246.07999999999998"><tspan x="618.6600000000001">Occurs while speeding up or</tspan><tspan x="618.6600000000001" dy="28">slowing down.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="286" y2="286"/><rect class="v2-table-frame" x="89" y="42" width="874" height="244"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="42" y2="286"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="42" y2="286"/></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
