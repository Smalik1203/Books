<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="cycling-art" transform="translate(0 112)"><image class="science-illustration" data-photo="cyclist" href="../../figures/class-7/science/ch08/cyclist.png" x="283.75" y="0" width="484.49999999999994" height="323" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="353.88"><tspan x="89">Swati’s journey provides a distance and an elapsed time. Her speed need not stay the same at</tspan><tspan x="89" dy="27">every moment.</tspan></text></g>
<g class="v2-reading-block" data-block="example-one" transform="translate(0 539)"><text class="se-heading" x="89" y="30"><tspan x="89">Example 8.1 · Swati’s bicycle ride</tspan></text></g>
<g class="v2-reading-block" data-block="swati-work" transform="translate(0 587)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.81118" data-space-ratio="1.324">Swati<tspan dx="1.81118"> cycles</tspan><tspan dx="1.81118"> 3.6</tspan><tspan dx="1.81118"> km</tspan><tspan dx="1.81118"> in</tspan><tspan dx="1.81118"> 15</tspan><tspan dx="1.81118"> min.</tspan><tspan dx="1.81118"> Convert:</tspan><tspan dx="1.81118"> 3.6</tspan><tspan dx="1.81118"> ×</tspan><tspan dx="1.81118"> 1000</tspan><tspan dx="1.81118"> =</tspan><tspan dx="1.81118"> 3600</tspan><tspan dx="1.81118"> m;</tspan><tspan dx="1.81118"> 15</tspan><tspan dx="1.81118"> ×</tspan><tspan dx="1.81118"> 60</tspan><tspan dx="1.81118"> =</tspan><tspan dx="1.81118"> 900</tspan><tspan dx="1.81118"> s.</tspan><tspan dx="1.81118"> Her</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">average speed is 3600 m ÷ 900 s = 4 m/s.</tspan></text></g>
<g class="v2-reading-block" data-block="speed-units-0" transform="translate(0 667)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.34741" data-space-ratio="1.241">To<tspan dx="1.34741"> change</tspan><tspan dx="1.34741"> m/s</tspan><tspan dx="1.34741"> into</tspan><tspan dx="1.34741"> km/h,</tspan><tspan dx="1.34741"> multiply</tspan><tspan dx="1.34741"> by</tspan><tspan dx="1.34741"> 3.6:</tspan><tspan dx="1.34741"> there</tspan><tspan dx="1.34741"> are</tspan><tspan dx="1.34741"> 3600</tspan><tspan dx="1.34741"> seconds</tspan><tspan dx="1.34741"> in</tspan><tspan dx="1.34741"> an</tspan><tspan dx="1.34741"> hour</tspan><tspan dx="1.34741"> and</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.35117" data-space-ratio="1.599">1000<tspan dx="3.35117"> metres</tspan><tspan dx="3.35117"> in</tspan><tspan dx="3.35117"> a</tspan><tspan dx="3.35117"> kilometre.</tspan><tspan dx="3.35117"> Thus</tspan><tspan dx="3.35117"> 4</tspan><tspan dx="3.35117"> m/s</tspan><tspan dx="3.35117"> =</tspan><tspan dx="3.35117"> 14.4</tspan><tspan dx="3.35117"> km/h.</tspan><tspan dx="3.35117"> To</tspan><tspan dx="3.35117"> change</tspan><tspan dx="3.35117"> km/h</tspan><tspan dx="3.35117"> into</tspan><tspan dx="3.35117"> m/s,</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="speed-units-1" transform="translate(0 731)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="2.20787" data-space-ratio="1.395">divide<tspan dx="2.20787"> by</tspan><tspan dx="2.20787"> 3.6.</tspan><tspan dx="2.20787"> Converting</tspan><tspan dx="2.20787"> both</tspan><tspan dx="2.20787"> measurements</tspan><tspan dx="2.20787"> before</tspan><tspan dx="2.20787"> dividing</tspan><tspan dx="2.20787"> is</tspan><tspan dx="2.20787"> another</tspan><tspan dx="2.20787"> reliable</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">route.</tspan></text></g>
<g class="v2-reading-block" data-block="railways" transform="translate(0 823)"><text class="se-heading" x="89" y="30"><tspan x="89">Comparing train journeys</tspan></text></g>
<g class="v2-reading-block" data-block="train-task" transform="translate(0 871)"><rect class="se-activity-panel" x="89" y="0" width="874" height="522" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Activity 8.4"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Activity 8.4</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="6.50839" data-space-ratio="2.164">With<tspan dx="6.50839"> an</tspan><tspan dx="6.50839"> adult,</tspan><tspan dx="6.50839"> consult</tspan><tspan dx="6.50839"> an</tspan><tspan dx="6.50839"> official</tspan><tspan dx="6.50839"> railway</tspan><tspan dx="6.50839"> timetable.</tspan><tspan dx="6.50839"> Choose</tspan><tspan dx="6.50839"> a</tspan><tspan dx="6.50839"> nearby</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="0.35700" data-space-ratio="1.064">station,<tspan dx="0.35700"> a</tspan><tspan dx="0.35700"> next</tspan><tspan dx="0.35700"> stop</tspan><tspan dx="0.35700"> and</tspan><tspan dx="0.35700"> four</tspan><tspan dx="0.35700"> or</tspan><tspan dx="0.35700"> five</tspan><tspan dx="0.35700"> trains,</tspan><tspan dx="0.35700"> including</tspan><tspan dx="0.35700"> passenger,</tspan><tspan dx="0.35700"> express</tspan><tspan dx="0.35700"> or</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">superfast services where available.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="0.44476" data-space-ratio="1.080">Record<tspan dx="0.44476"> each</tspan><tspan dx="0.44476"> train,</tspan><tspan dx="0.44476"> next</tspan><tspan dx="0.44476"> stop,</tspan><tspan dx="0.44476"> departure,</tspan><tspan dx="0.44476"> arrival</tspan><tspan dx="0.44476"> and</tspan><tspan dx="0.44476"> segment</tspan><tspan dx="0.44476"> distance.</tspan><tspan dx="0.44476"> For</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">cumulative distances, subtract the two station readings.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="12.06149" data-space-ratio="3.157">Calculate<tspan dx="12.06149"> elapsed</tspan><tspan dx="12.06149"> time,</tspan><tspan dx="12.06149"> including</tspan><tspan dx="12.06149"> the</tspan><tspan dx="12.06149"> date</tspan><tspan dx="12.06149"> for</tspan><tspan dx="12.06149"> a</tspan><tspan dx="12.06149"> journey</tspan><tspan dx="12.06149"> crossing</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">midnight. Convert minutes to hours before finding km/h.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="0.74920" data-space-ratio="1.134">Divide<tspan dx="0.74920"> each</tspan><tspan dx="0.74920"> segment</tspan><tspan dx="0.74920"> distance</tspan><tspan dx="0.74920"> by</tspan><tspan dx="0.74920"> its</tspan><tspan dx="0.74920"> elapsed</tspan><tspan dx="0.74920"> time.</tspan><tspan dx="0.74920"> Compare</tspan><tspan dx="0.74920"> the</tspan><tspan dx="0.74920"> scheduled</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">average speeds for these segments; note the timetable source and date.</tspan></text><text class="se-copy" x="113" y="428" data-prose-align="justify"><tspan x="113" data-justify-width="826" data-natural-space="5.59200" data-extra-space="3.02649" data-space-ratio="1.541">This<tspan dx="3.02649"> is</tspan><tspan dx="3.02649"> a</tspan><tspan dx="3.02649"> timetable</tspan><tspan dx="3.02649"> investigation.</tspan><tspan dx="3.02649"> Do</tspan><tspan dx="3.02649"> not</tspan><tspan dx="3.02649"> go</tspan><tspan dx="3.02649"> near</tspan><tspan dx="3.02649"> tracks</tspan><tspan dx="3.02649"> or</tspan><tspan dx="3.02649"> moving</tspan><tspan dx="3.02649"> trains</tspan><tspan dx="3.02649"> to</tspan></tspan><tspan x="113" dy="32" data-justify-width="826" data-natural-space="5.59200" data-extra-space="1.55903" data-space-ratio="1.279">take<tspan dx="1.55903"> measurements.</tspan><tspan dx="1.55903"> Scheduled</tspan><tspan dx="1.55903"> times</tspan><tspan dx="1.55903"> are</tspan><tspan dx="1.55903"> not</tspan><tspan dx="1.55903"> observations</tspan><tspan dx="1.55903"> of</tspan><tspan dx="1.55903"> actual</tspan><tspan dx="1.55903"> running</tspan></tspan><tspan x="113" dy="32" data-paragraph-end="true">times.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
