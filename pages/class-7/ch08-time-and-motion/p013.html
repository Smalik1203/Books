<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="train-record" transform="translate(0 112)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">A timetable record · illustrative data only</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="80"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Train / next</tspan><tspan x="103" dy="28">stop</tspan></text><text class="v2-table-heading" x="277.8" y="76.08"><tspan x="277.8">Segment distance</tspan></text><text class="v2-table-heading" x="513.78" y="76.08"><tspan x="513.78">Elapsed time</tspan></text><text class="v2-table-heading" x="732.28" y="76.08"><tspan x="732.28">Scheduled average</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="122" y2="122"/><text class="se-copy se-table-copy" x="103" y="156.07999999999998"><tspan x="103">Example A / B</tspan></text><text class="se-copy se-table-copy" x="277.8" y="156.07999999999998"><tspan x="277.8">84 − 24 = 60 km</tspan></text><text class="se-copy se-table-copy" x="513.78" y="156.07999999999998"><tspan x="513.78">14:00 to 15:00 = 1 h</tspan></text><text class="se-copy se-table-copy" x="732.28" y="156.07999999999998"><tspan x="732.28">60 km ÷ 1 h = 60</tspan><tspan x="732.28" dy="28">km/h</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="202" y2="202"/><rect class="v2-table-frame" x="89" y="42" width="874" height="160"/><line class="v2-table-rule" x1="263.8" x2="263.8" y1="42" y2="202"/><line class="v2-table-rule" x1="499.78000000000003" x2="499.78000000000003" y1="42" y2="202"/><line class="v2-table-rule" x1="718.28" x2="718.28" y1="42" y2="202"/><text class="v2-table-note" x="89" y="234.88"><tspan x="89">Use these column meanings for your own records. Keep departure and arrival times in your</tspan><tspan x="89" dy="26">notes. These invented values are not a railway schedule.</tspan></text></g>
<g class="v2-reading-block" data-block="train-evidence-0" transform="translate(0 398)"><text class="se-copy" x="89" y="24"><tspan x="89">Which train has the greatest average speed for your segment? Service names</tspan><tspan x="89" dy="32">alone cannot answer this: stops, route conditions and the interval matter.</tspan></text></g>
<g class="v2-reading-block" data-block="train-evidence-1" transform="translate(0 462)"><text class="se-copy" x="89" y="24"><tspan x="89">Compare matching station pairs where possible. A short-segment result does not</tspan><tspan x="89" dy="32">describe every journey.</tspan></text></g>
<g class="v2-reading-block" data-block="relationships" transform="translate(0 554)"><text class="v2-title" x="89" y="38"><tspan x="89">8.3.1 Distance, Speed and Time</tspan></text></g>
<g class="v2-reading-block" data-block="relationships-intro-0" transform="translate(0 612)"><text class="se-copy" x="89" y="24"><tspan x="89">The speed relationship can be rearranged. Use a speed that applies to the whole</tspan><tspan x="89" dy="32">interval: either a constant speed, or the average speed for that interval. Keep</tspan><tspan x="89" dy="32">distance, time and speed units compatible.</tspan></text></g>
<g class="v2-reading-block" data-block="distance-rule" transform="translate(0 724)"><text class="v2-equation" x="89" y="30"><tspan x="89">Distance = speed × time</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">Example 8.2: a bus maintains 50 km/h for 2 h. Distance = 50 × 2 = 100 km.</tspan></text></g>
<g class="v2-reading-block" data-block="time-rule" transform="translate(0 821)"><text class="v2-equation" x="89" y="30"><tspan x="89">Time = distance ÷ speed</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">Example 8.3: a train averages 90 km/h over 360 km. Time = 360 ÷ 90 = 4 h.</tspan></text></g><g transform="translate(0 918)"><g data-page-illustration="figures/class-7/science/ch08/cyclist.png"><image class="science-illustration" href="../../figures/class-7/science/ch08/cyclist.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A cyclist.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A cyclist.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
