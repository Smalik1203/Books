<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="time" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">8.1 Measurement of Time</tspan></text></g>
<g class="v2-reading-block" data-block="natural-cycles-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Sunrise and sunset, the Moon’s changing phases and the returning seasons gave</tspan><tspan x="89" dy="32">people repeating patterns with which to organise days, months and years. A</tspan></text></g>
<g class="v2-reading-block" data-block="natural-cycles-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">school lesson or a race needs a much smaller interval. A useful clock connects an</tspan><tspan x="89" dy="32">observable change with a known duration.</tspan></text></g>
<g class="v2-reading-block" data-block="old-clocks" transform="translate(0 314)"><image class="science-illustration" data-photo="timekeepers" href="../../figures/class-7/science/ch08/timekeepers.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">From left: a sundial, an outflow water clock, an hourglass and a marked candle clock. Their</tspan><tspan x="89" dy="27">changing shadows, levels or lengths help indicate elapsed time.</tspan></text></g>
<g class="v2-reading-block" data-block="clock-principles" transform="translate(0 676)"><g data-comparison-table="clock-principles"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">How early clocks mark time</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Device</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="312.76" y="70.08"><tspan x="312.76">Working principle and conditions</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Sundial</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="110.08"><tspan x="312.76">the shadow moves across a marked surface as the Sun’s</tspan><tspan x="312.76" dy="28">apparent position changes. It needs sunlight and correct</tspan><tspan x="312.76" dy="28">alignment.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="206.07999999999998"><tspan x="103">Water clock</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="206.07999999999998"><tspan x="312.76">water drains from a marked vessel, or enters a floating bowl</tspan><tspan x="312.76" dy="28">through a small hole until the bowl sinks. The device must be</tspan><tspan x="312.76" dy="28">reset.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="274" y2="274"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="302.08"><tspan x="103">Hourglass</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="302.08"><tspan x="312.76">sand passes through a narrow opening between two bulbs. A</tspan><tspan x="312.76" dy="28">particular amount of sand marks an interval.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="342" y2="342"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="370.08"><tspan x="103">Candle clock</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="370.08"><tspan x="312.76">a burning candle becomes shorter. Marks can indicate intervals,</tspan><tspan x="312.76" dy="28">but draughts and uneven burning affect the result. Observe only</tspan><tspan x="312.76" dy="28">an adult’s demonstration.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="438" y2="438"/><rect class="v2-table-frame" x="89" y="42" width="874" height="396"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="42" y2="438"/></g></g>
<g class="v2-reading-block" data-block="make-clock" transform="translate(0 1142)"><text class="se-heading" x="89" y="30"><tspan x="89">Calibrating a water clock</tspan></text></g>
<g class="v2-reading-block" data-block="water-intro" transform="translate(0 1190)"><text class="se-copy" x="89" y="24"><tspan x="89">To <tspan class="se-bold">calibrate</tspan> a device, compare its readings with a reference. Here a watch</tspan><tspan x="89" dy="32">supplies the reference intervals; water levels become the scale. Predict whether</tspan><tspan x="89" dy="32">successive minute marks will be equally far apart. Decide exactly when timing</tspan><tspan x="89" dy="32">starts and how you will recognise each water level. A useful test also asks</tspan><tspan x="89" dy="32">whether resetting the same device gives similar readings on another run.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
