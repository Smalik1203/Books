<g class="v2-reading-block" data-block="old-clocks" transform="translate(0 314)"><image class="science-illustration" data-photo="timekeepers" href="../../figures/class-7/science/ch08/timekeepers.png" x="157.75000000000003" y="0" width="736.5" height="491" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="521.88"><tspan x="89">From left: a sundial, an outflow water clock, an hourglass and a marked candle clock. Their</tspan><tspan x="89" dy="27">changing shadows, levels or lengths help indicate elapsed time.</tspan></text></g>
<g class="v2-reading-block" data-block="clock-principles" transform="translate(0 897)"><g data-table-spacing="airy" data-comparison-table="clock-principles"><text class="v2-table-caption" x="89" y="33.6"><tspan x="89">How early clocks mark time</tspan></text><rect class="se-table-head" x="89" y="54" width="874" height="48"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="86.08"><tspan x="103">Device</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="312.76" y="86.08"><tspan x="312.76">Working principle and conditions</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="102" y2="102"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="134.07999999999998"><tspan x="103">Sundial</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="134.07999999999998"><tspan x="312.76">the shadow moves across a marked surface as the Sun’s</tspan><tspan x="312.76" dy="28">apparent position changes. It needs sunlight and correct</tspan><tspan x="312.76" dy="28">alignment.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="206" y2="206"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="238.07999999999998"><tspan x="103">Water clock</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="238.07999999999998"><tspan x="312.76">water drains from a marked vessel, or enters a floating bowl</tspan><tspan x="312.76" dy="28">through a small hole until the bowl sinks. The device must be</tspan><tspan x="312.76" dy="28">reset.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="310" y2="310"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="342.08"><tspan x="103">Hourglass</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="342.08"><tspan x="312.76">sand passes through a narrow opening between two bulbs. A</tspan><tspan x="312.76" dy="28">particular amount of sand marks an interval.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="386" y2="386"/><g data-comparison-row="4"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="418.08"><tspan x="103">Candle clock</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="418.08"><tspan x="312.76">a burning candle becomes shorter. Marks can indicate intervals,</tspan><tspan x="312.76" dy="28">but draughts and uneven burning affect the result. Observe only</tspan><tspan x="312.76" dy="28">an adult’s demonstration.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="490" y2="490"/><rect class="v2-table-frame" x="89" y="54" width="874" height="436"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="54" y2="490"/></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
