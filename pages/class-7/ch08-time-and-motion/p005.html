<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="solar-time-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">shadow’s edge also matter. The instrument invites careful observation as well as</tspan><tspan x="89" dy="32">admiration.</tspan></text></g>
<g class="v2-reading-block" data-block="clock-history-art" transform="translate(0 192)"><image class="science-illustration" data-photo="pendulum-clock" href="../../figures/class-7/science/ch08/pendulum-clock.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">A pendulum clock counts repeated swings; many modern watches count oscillations of a</tspan><tspan x="89" dy="27">quartz crystal. These are illustrative examples, not historical reconstructions.</tspan></text></g>
<g class="v2-reading-block" data-block="mechanical-clocks-0" transform="translate(0 554)"><text class="se-copy" x="89" y="24"><tspan x="89">Mechanical clocks using weights, gears and later springs developed over</tspan><tspan x="89" dy="32">centuries. Galileo studied swinging pendulums; the familiar story of his timing a</tspan></text></g>
<g class="v2-reading-block" data-block="mechanical-clocks-1" transform="translate(0 618)"><text class="se-copy" x="89" y="24"><tspan x="89">church lamp with his pulse is a historical tradition, not a securely documented</tspan><tspan x="89" dy="32">experiment. Christiaan Huygens developed a pendulum clock in 1656, followed</tspan><tspan x="89" dy="32">by its patent in 1657.</tspan></text></g>
<g class="v2-reading-block" data-block="pendulum" transform="translate(0 742)"><text class="v2-title" x="89" y="38"><tspan x="89">8.1.1 The Simple Pendulum</tspan></text></g>
<g class="v2-reading-block" data-block="pendulum-definition-0" transform="translate(0 800)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">simple</tspan> <tspan class="se-bold">pendulum</tspan> models a small, heavy bob suspended by a light thread from</tspan><tspan x="89" dy="32">a fixed support. Its length is measured from the point of suspension—the</tspan></text></g>
<g class="v2-reading-block" data-block="pendulum-definition-1" transform="translate(0 864)"><text class="se-copy" x="89" y="24"><tspan x="89">pivot—to the centre of the bob. At rest, the bob hangs at its <tspan class="se-bold">mean</tspan> <tspan class="se-bold">position</tspan>. When</tspan><tspan x="89" dy="32">displaced and released, it swings to and fro.</tspan></text></g>
<g class="v2-reading-block" data-block="pendulum-positions" transform="translate(0 944)"><svg class="science-illustration v2-motion-diagram" data-diagram="pendulum" x="89" y="0" width="874" height="316" viewBox="89 0 874 316"><svg class="science-illustration" x="286" y="0" width="474" height="316" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch08/apparatus-pendulum.png" width="1536" height="1024"/></svg><text class="v2-motion-label" x="449" y="311" text-anchor="middle">A</text><text class="v2-motion-label" x="523" y="311" text-anchor="middle">O</text><text class="v2-motion-label" x="596" y="311" text-anchor="middle">B</text><text class="v2-motion-label" x="397" y="32" text-anchor="middle">Pivot</text><path class="v2-motion-line" d="M435 29L518 38"/><path class="v2-motion-line" d="M650 39V275M642 39H658M642 275H658"/><text class="v2-motion-label" x="704" y="123" text-anchor="start">Length: pivot</text><text class="v2-motion-label" x="704" y="153" text-anchor="start">to bob centre</text><path class="v2-motion-line" d="M689 140H656"/><text class="v2-motion-label" x="330" y="137" text-anchor="middle">Thread</text><path class="v2-motion-line" d="M378 134L485 139"/><text class="v2-motion-label" x="340" y="260" text-anchor="middle">Bob</text><path class="v2-motion-line" d="M377 257L435 260"/></svg><text class="se-caption" x="89" y="346.88"><tspan x="89">O is the mean position; A and B are the extreme positions. The three bobs show successive</tspan><tspan x="89" dy="27">positions of one bob, not three separate pendulums.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">5</text></g></svg></div></div></section>
