<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="oscillation-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">towards A, it is O → A → O → B → O. Simply crossing the centre once is not a whole</tspan><tspan x="89" dy="32">oscillation.</tspan></text></g>
<g class="v2-reading-block" data-block="period-0" transform="translate(0 192)"><text class="se-copy" x="89" y="24"><tspan x="89">The <tspan class="se-bold">time</tspan> <tspan class="se-bold">period</tspan> is the time taken for one complete oscillation. You may have</tspan><tspan x="89" dy="32">explored a hanging eraser in Class 6. Now measure repeated swings and ask how</tspan><tspan x="89" dy="32">consistently they divide time.</tspan></text></g>
<g class="v2-reading-block" data-block="pendulum-task" transform="translate(0 304)"><rect class="se-activity-panel" x="89" y="0" width="874" height="951" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">With a teacher, use about 150 cm of strong thread and a small secure bob</tspan><tspan x="146" dy="32">to make a pendulum about 100 cm long, measured from pivot to bob</tspan><tspan x="146" dy="32">centre. Clamp the support firmly; clear the space around and below the</tspan><tspan x="146" dy="32">bob.</tspan></text><text class="se-activity-step" x="132" y="232" text-anchor="end">2.</text><text class="se-copy" x="146" y="232"><tspan x="146">Move the bob a little to one side and release it gently without a push.</tspan><tspan x="146" dy="32">Keep the thread taut. Choose a fixed reference position and a direction</tspan><tspan x="146" dy="32">for counting complete oscillations.</tspan></text><text class="se-activity-step" x="132" y="340" text-anchor="end">3.</text><text class="se-copy" x="146" y="340"><tspan x="146">Time 10 oscillations with a stopwatch. Repeat three or four times using</tspan><tspan x="146" dy="32">the same length and small release angle. One learner can count while</tspan><tspan x="146" dy="32">another times.</tspan></text><text class="se-activity-step" x="132" y="448" text-anchor="end">4.</text><text class="se-copy" x="146" y="448"><tspan x="146">In your notebook, record the measured length, trial number, time for 10</tspan><tspan x="146" dy="32">oscillations and that time divided by 10. Include seconds in both time</tspan><tspan x="146" dy="32">columns.</tspan></text><text class="se-copy" x="113" y="556"><tspan x="113">Use a compact bob that cannot detach. Keep faces and hands out of its path,</tspan><tspan x="113" dy="32">and stop the bob before adjusting the apparatus.</tspan></text><g transform="translate(0 608)"><svg class="science-illustration v2-motion-diagram" data-diagram="pendulum-setup" x="89" y="0" width="874" height="255" viewBox="89 0 874 255"><svg class="science-illustration" x="300" y="0" width="382.5" height="255" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch08/apparatus-pendulum-setup.png" width="1536" height="1024"/></svg><text class="v2-motion-label" x="291" y="36" text-anchor="middle">Firm clamp</text><path class="v2-motion-line" d="M357 31L445 36"/><text class="v2-motion-label" x="749" y="112" text-anchor="middle">Small displacement</text><path class="v2-motion-line" d="M646 109L535 109"/><text class="v2-motion-label" x="730" y="219" text-anchor="middle">Clear swing space</text><path class="v2-motion-line" d="M623 215L552 182"/></svg></g><text class="se-caption" x="113" y="895.88"><tspan x="113">Secure support and a small initial displacement. Measure to the bob’s centre, not just</tspan><tspan x="113" dy="27">the end of the thread.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
