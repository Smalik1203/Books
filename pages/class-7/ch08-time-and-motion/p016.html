<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="582" rx="18"/><text class="se-copy" x="113" y="222"><tspan x="113"><tspan class="se-bold">Calibration</tspan> — Comparing a device</tspan><tspan x="113" dy="32">with a reference to establish or</tspan><tspan x="113" dy="32">check its scale.</tspan></text><text class="se-copy" x="113" y="338"><tspan x="113"><tspan class="se-bold">Second</tspan> <tspan class="se-bold">(s)</tspan> — The SI unit of time.</tspan></text><text class="se-copy" x="113" y="390"><tspan x="113"><tspan class="se-bold">Simple</tspan> <tspan class="se-bold">pendulum</tspan> — A model with a</tspan><tspan x="113" dy="32">small heavy bob on a light thread</tspan><tspan x="113" dy="32">suspended from a fixed point.</tspan></text><text class="se-copy" x="113" y="506"><tspan x="113"><tspan class="se-bold">Oscillation</tspan> — A complete repeating</tspan><tspan x="113" dy="32">motion that returns to the same</tspan><tspan x="113" dy="32">position and direction.</tspan></text><text class="se-copy" x="113" y="622"><tspan x="113"><tspan class="se-bold">Time</tspan> <tspan class="se-bold">period</tspan> — Time taken for one</tspan><tspan x="113" dy="32">complete oscillation.</tspan></text><text class="se-copy" x="541" y="222"><tspan x="541"><tspan class="se-bold">Resolution</tspan> — The smallest interval a</tspan><tspan x="541" dy="32">scale or display distinguishes.</tspan></text><text class="se-copy" x="541" y="306"><tspan x="541"><tspan class="se-bold">Average</tspan> <tspan class="se-bold">speed</tspan> — Total distance</tspan><tspan x="541" dy="32">travelled divided by total elapsed</tspan><tspan x="541" dy="32">time.</tspan></text><text class="se-copy" x="541" y="422"><tspan x="541"><tspan class="se-bold">Uniform</tspan> <tspan class="se-bold">linear</tspan> <tspan class="se-bold">motion</tspan> — Motion</tspan><tspan x="541" dy="32">along a straight line at constant</tspan><tspan x="541" dy="32">speed.</tspan></text><text class="se-copy" x="541" y="538"><tspan x="541"><tspan class="se-bold">Non-uniform</tspan> <tspan class="se-bold">linear</tspan> <tspan class="se-bold">motion</tspan> —</tspan><tspan x="541" dy="32">Motion along a straight line with</tspan><tspan x="541" dy="32">changing speed.</tspan></text><text class="se-copy" x="541" y="654"><tspan x="541"><tspan class="se-bold">Odometer</tspan> — An instrument that</tspan><tspan x="541" dy="32">records accumulated distance</tspan><tspan x="541" dy="32">travelled.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
