<section class="page page--food page--science-editorial page--science-v2 page--g7-ch08" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Measurement of Time and Motion, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><circle cx="38" cy="62" r="34"/><path d="M38 33V39M38 85V91M9 62H15M61 62H67M38 43V62L53 71M28 16H48M38 16V27"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 8</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Measurement of Time and Motion</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="motion-table-reading-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">X covers 20 km in each recorded interval; Y’s distances vary: 20, 15, 15, 25, 20 and</tspan><tspan x="89" dy="32">25 km. Y’s motion is therefore non-uniform. X’s record is consistent with uniform</tspan><tspan x="89" dy="32">motion at this sampling interval, but cannot reveal changes between readings.</tspan></text></g>
<g class="v2-reading-block" data-block="motion-pause" transform="translate(0 224)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Both trains cover 120 km between 10:00 and 11:00. Calculate each average</tspan><tspan x="113" dy="32">speed. Can two journeys have the same average speed but different patterns</tspan><tspan x="113" dy="32">of motion?</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Could train X stop briefly and then speed up between two readings? Explain</tspan><tspan x="113" dy="32">why equal 10 min distances do not prove that its speed was constant at every</tspan><tspan x="113" dy="32">instant. What extra evidence would help?</tspan></text></g>
<g class="v2-reading-block" data-block="everyday-motion-0" transform="translate(0 540)"><text class="se-copy" x="89" y="24"><tspan x="89">Non-uniform motion is common: a bus stops, a cyclist accelerates and a runner</tspan><tspan x="89" dy="32">slows. Uniform motion is a useful idealisation for analysing a steady interval.</tspan></text></g>
<g class="v2-reading-block" data-block="everyday-motion-1" transform="translate(0 604)"><text class="se-copy" x="89" y="24"><tspan x="89">When speed changes, average speed still describes the whole interval, but does</tspan><tspan x="89" dy="32">not tell us the speed at each instant.</tspan></text></g>
<g class="v2-reading-block" data-block="time-questions-0" transform="translate(0 684)"><text class="se-copy" x="89" y="24"><tspan x="89">Clocks help us state when something happens and how long it lasts, from a</tspan><tspan x="89" dy="32">fraction of a second to centuries. Questions about time also reach into cosmology</tspan></text></g>
<g class="v2-reading-block" data-block="time-questions-1" transform="translate(0 748)"><text class="se-copy" x="89" y="24"><tspan x="89">and philosophy. Our measurements here concern observable intervals; whether</tspan><tspan x="89" dy="32">time itself had a beginning is not settled by a classroom clock.</tspan></text></g><g transform="translate(0 828)"><g data-page-illustration="figures/class-7/science/ch08/cyclist.png"><image class="science-illustration" href="../../figures/class-7/science/ch08/cyclist.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A cyclist.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A cyclist.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
