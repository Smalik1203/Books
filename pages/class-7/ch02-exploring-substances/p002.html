<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="nature-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">2.1 Nature as a Science Laboratory</tspan></text></g>
<g class="v2-reading-block" data-block="start-safe-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">A liquid can look colourless without being water. Colour, smell and familiarity do</tspan><tspan x="89" dy="32">not tell us whether it is safe. In this chapter, use only small amounts of samples</tspan></text></g>
<g class="v2-reading-block" data-block="start-safe-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">selected and diluted by your teacher. Wear eye protection, protect the work</tspan><tspan x="89" dy="32">surface and wash your hands afterwards. Never taste a test sample or touch it to</tspan><tspan x="89" dy="32">identify its nature.</tspan></text></g>
<g class="v2-reading-block" data-block="litmus-head" transform="translate(0 358)"><text class="se-heading" x="89" y="30"><tspan x="89">Compare both colours of litmus</tspan></text></g>
<g class="v2-reading-block" data-block="litmus-question-0" transform="translate(0 406)"><text class="se-copy" x="89" y="24"><tspan x="89">Blue and red litmus papers let us compare a sample in two ways. Before testing,</tspan><tspan x="89" dy="32">look at unused pieces of both papers. Will every liquid affect them in the same</tspan><tspan x="89" dy="32">way? Record what happens before assigning the samples to a group.</tspan></text></g>
<g class="v2-reading-block" data-block="litmus-task" transform="translate(0 518)"><rect class="se-activity-panel" x="89" y="0" width="874" height="818" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Test teacher-prepared lemon juice, soap solution, amla juice, tamarind</tspan><tspan x="113" dy="32">water, vinegar, baking soda solution, lime water, tap water, washing powder</tspan><tspan x="113" dy="32">solution, sugar solution and salt solution. Include one other sample only</tspan><tspan x="113" dy="32">with approval.</tspan></text><text class="se-activity-step" x="132" y="232" text-anchor="end">1.</text><text class="se-copy" x="146" y="232"><tspan x="146">Place separate small pieces of blue and red litmus on a clean, dry white</tspan><tspan x="146" dy="32">tile. Label the positions so you can identify each sample.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">2.</text><text class="se-copy" x="146" y="308"><tspan x="146">Put one drop of a sample on one blue piece and one red piece. Use</tspan><tspan x="146" dy="32">separate droppers, or clean and rinse the dropper between samples.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">3.</text><text class="se-copy" x="146" y="384"><tspan x="146">Compare each piece with unused paper. Record both final colours in your</tspan><tspan x="146" dy="32">notebook. Repeat for every sample; record unclear changes as unclear.</tspan></text><text class="se-copy" x="113" y="460"><tspan x="113">Keep samples away from eyes and mouths. Your teacher handles lime water</tspan><tspan x="113" dy="32">and washing powder solution. Do not test cleaners, bleach or unknown</tspan><tspan x="113" dy="32">liquids from home.</tspan></text><image class="science-illustration" data-photo="litmus-setup" href="../../figures/class-7/science/ch02/litmus-setup.png" x="364.75" y="544" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="789.88"><tspan x="113">Start with unused red and blue papers. Use a fresh piece for each drop.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
