<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02 page--opener" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 1"><g class="chapter-opener" data-opener="science-g7-ch02"><defs><linearGradient id="science-g7-ch02-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop class="chapter-opener__gradient-start" offset="0%"/><stop class="chapter-opener__gradient-end" offset="100%"/></linearGradient></defs><path class="chapter-opener__band" fill="url(#science-g7-ch02-gradient)" d="M-17 -17H1069V300H-17Z"/><path class="chapter-opener__edge" d="M-17 296H1069V300H-17Z"/><g class="science-header-art" data-header-art="7-2" aria-hidden="true" transform="translate(886 26)"><g data-art-element="lemon" transform="translate(0 7) scale(0.67) rotate(-8 50 50)"><path class="science-header-art__soft" d="M8 48Q7 38 18 36C25 4 72 7 83 39Q98 44 88 56C70 89 28 85 16 58Q5 59 8 48Z"/><path class="science-header-art__surface" d="M28 54Q21 31 45 23M46 11Q54 1 76 5Q71 23 55 19"/><path d="M47 22L49 68M24 45L74 47M32 28L65 64M32 66L65 29"/></g><g data-art-element="dropper" transform="translate(72 0) scale(0.61) rotate(6 50 50)"><path class="science-header-art__surface" d="M56 11Q70 0 81 12Q92 24 81 36L72 45L47 20Z"/><path class="science-header-art__soft" d="M50 25L15 63L12 80L29 76L67 41M22 62L33 71M15 89Q5 100 20 99Q25 98 15 89Z"/></g><g data-art-element="tubes" transform="translate(12 83) scale(1.12) rotate(4 50 50)"><path d="M16 9H43M20 9V78Q20 96 39 78V9M57 22H84M61 22V78Q61 96 80 78V22"/><path class="science-header-art__soft" d="M20 52H39V78Q29 95 20 78ZM61 63H80V78Q70 95 61 78Z"/><path d="M22 57Q30 61 38 57M63 67H78"/><circle cx="28" cy="37" r="3"/><circle cx="69" cy="48" r="3"/></g><g data-art-element="sprig" transform="translate(66 187) scale(0.61) rotate(-6 50 50)"><path d="M47 94Q37 52 58 7"/><path class="science-header-art__surface" d="M44 73Q12 72 10 46Q37 42 44 73ZM44 53Q70 49 86 27Q55 24 44 53ZM49 32Q22 34 21 9Q45 7 49 32Z"/><path d="M20 55L41 72M52 47L75 34M30 17L46 30"/></g></g><line class="chapter-opener__divider" x1="240" x2="240" y1="94" y2="252"/><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number se-running" x="151" y="242" text-anchor="middle">2</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">Exploring Substances:</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">Acidic, Basic, and Neutral</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch02/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Students and a teacher exploring natural indicators</title></image></g><text class="se-copy v2-intro" x="89" y="981"><tspan x="89">A blank sheet. A few drops. A hidden message appears. What changed?</tspan></text><text class="se-copy" x="89" y="1033"><tspan x="89">At a school science fair on National Science Day, 28 February, Ashwin and</tspan><tspan x="89" dy="32">Keerthi receive sheets that seem to be blank. A volunteer wets the paper with a</tspan><tspan x="89" dy="32">liquid, and a welcome message becomes visible. The children wonder whether</tspan><tspan x="89" dy="32">the paper, the writing or the liquid explains the change.</tspan></text><text class="se-copy" x="89" y="1177"><tspan x="89">At another stall, familiar substances produce different colours when mixed with</tspan><tspan x="89" dy="32">plant extracts. These observations offer a way to investigate the mystery. You will</tspan><tspan x="89" dy="32">compare substances, prepare indicators and use evidence to decide what a</tspan><tspan x="89" dy="32">colour change can tell you.</tspan></text><text class="se-copy" x="89" y="1321"><tspan x="89">Keep the message in mind as you work. By the end of the chapter, you will be</tspan><tspan x="89" dy="32">able to suggest a possible explanation and a safe way to check it.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
