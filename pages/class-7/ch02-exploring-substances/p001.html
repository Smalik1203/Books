<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02 page--opener" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 1"><g class="chapter-opener" data-opener="science-g7-ch02"><defs><linearGradient id="science-g7-ch02-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop class="chapter-opener__gradient-start" offset="0%"/><stop class="chapter-opener__gradient-end" offset="100%"/></linearGradient></defs><path class="chapter-opener__band" fill="url(#science-g7-ch02-gradient)" d="M-17 -17H1069V300H-17Z"/><path class="chapter-opener__edge" d="M-17 296H1069V300H-17Z"/><g class="chapter-opener__motif v2-drop-motif" transform="translate(983 73) scale(.48)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><line class="chapter-opener__divider" x1="240" x2="240" y1="94" y2="252"/><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number se-running" x="151" y="242" text-anchor="middle">2</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">Exploring Substances:</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">Acidic, Basic, and Neutral</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch02/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Students and a teacher exploring natural indicators</title></image></g><text class="se-copy v2-intro" x="89" y="981"><tspan x="89">A blank sheet. A few drops. A hidden message appears. What changed?</tspan></text><text class="se-copy" x="89" y="1033"><tspan x="89">At a school science fair on National Science Day, 28 February, Ashwin and</tspan><tspan x="89" dy="32">Keerthi receive sheets that seem to be blank. A volunteer wets the paper with a</tspan><tspan x="89" dy="32">liquid, and a welcome message becomes visible. The children wonder whether</tspan><tspan x="89" dy="32">the paper, the writing or the liquid explains the change.</tspan></text><text class="se-copy" x="89" y="1177"><tspan x="89">At another stall, familiar substances produce different colours when mixed with</tspan><tspan x="89" dy="32">plant extracts. These observations offer a way to investigate the mystery. You will</tspan><tspan x="89" dy="32">compare substances, prepare indicators and use evidence to decide what a</tspan><tspan x="89" dy="32">colour change can tell you.</tspan></text><text class="se-copy" x="89" y="1321"><tspan x="89">Keep the message in mind as you work. By the end of the chapter, you will be</tspan><tspan x="89" dy="32">able to suggest a possible explanation and a safe way to check it.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
