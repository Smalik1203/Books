<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 11"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="onion-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="862" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-copy" x="113" y="92"><tspan x="113">This is a teacher-led demonstration using only approved food-based</tspan><tspan x="113" dy="32">samples. Nobody is blindfolded. Do not participate in smelling if onion</tspan><tspan x="113" dy="32">triggers discomfort or an allergy.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">1.</text><text class="se-copy" x="146" y="200"><tspan x="146">An adult chops onion and puts it with clean cotton or filter-paper strips in</tspan><tspan x="146" dy="32">a closed container overnight.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">2.</text><text class="se-copy" x="146" y="276"><tspan x="146">Place three strips on separate clean surfaces. Keep one unchanged. Add a</tspan><tspan x="146" dy="32">few drops of tamarind water to one and baking soda solution to another.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">3.</text><text class="se-copy" x="146" y="352"><tspan x="146">Only if your teacher approves, compare the smells by gently wafting air</tspan><tspan x="146" dy="32">from a distance; never put a sample near your nose or inhale directly.</tspan></text><text class="se-activity-step" x="132" y="428" text-anchor="end">4.</text><text class="se-copy" x="146" y="428"><tspan x="146">Record the smell before and after, including “no clear difference”.</tspan><tspan x="146" dy="32">Compare with the unchanged strip. The teacher may repeat with other</tspan><tspan x="146" dy="32">approved dilute samples.</tspan></text><text class="se-copy" x="113" y="536"><tspan x="113">Does your record distinguish the samples? If not, use a colour indicator.</tspan><tspan x="113" dy="32">Never smell unknown laboratory chemicals or cleaning products.</tspan></text><image class="science-illustration" data-photo="onion" href="../../figures/class-7/science/ch02/onion.png" x="364.75" y="588" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="833.88"><tspan x="113">An onion container and three separate cotton strips. Keep a control strip.</tspan></text></g>
<g class="v2-reading-block" data-block="onion-explain-0" transform="translate(0 996)"><text class="se-copy" x="89" y="24"><tspan x="89">The detectable onion smell may be reduced in basic conditions while remaining</tspan><tspan x="89" dy="32">noticeable in acidic conditions. Results can be subtle with dilute baking soda. A</tspan></text></g>
<g class="v2-reading-block" data-block="onion-explain-1" transform="translate(0 1060)"><text class="se-copy" x="89" y="24"><tspan x="89">weak smell, an unsuitable concentration or differences between observers can</tspan><tspan x="89" dy="32">make the test inconclusive. It is not a way to identify arbitrary unknown liquids</tspan><tspan x="89" dy="32">safely.</tspan></text></g>
<g class="v2-reading-block" data-block="smell-evidence-0" transform="translate(0 1172)"><text class="se-copy" x="89" y="24"><tspan x="89">Suppose one observer notices less onion smell and another reports no difference.</tspan><tspan x="89" dy="32">Record both descriptions. The amount of onion on each strip, the time allowed</tspan></text></g>
<g class="v2-reading-block" data-block="smell-evidence-1" transform="translate(0 1236)"><text class="se-copy" x="89" y="24"><tspan x="89">for the drops to spread and each person’s sensitivity may affect the comparison.</tspan><tspan x="89" dy="32">Repeatedly taking a stronger sniff is not the solution. Discuss the uncertainty,</tspan><tspan x="89" dy="32">then choose a safe colour test if the class needs clearer evidence.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">11</text></g></svg></div></div></section>
