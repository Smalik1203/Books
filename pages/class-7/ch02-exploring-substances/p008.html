<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="rose-evidence-example-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Imagine that a very dark fruit juice makes the mixture look red before the</tspan><tspan x="89" dy="32">indicator has a clear effect. A red appearance alone would not show which</tspan></text></g>
<g class="v2-reading-block" data-block="rose-evidence-example-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">material supplied that colour. Look at a small portion of the sample without</tspan><tspan x="89" dy="32">indicator as well as the untreated extract. A separate litmus test provides another</tspan></text></g>
<g class="v2-reading-block" data-block="rose-evidence-example-2" transform="translate(0 240)"><text class="se-copy" x="89" y="24"><tspan x="89">line of evidence. If the colour remains hard to interpret, record that limit instead</tspan><tspan x="89" dy="32">of assigning a confident label.</tspan></text></g>
<g class="v2-reading-block" data-block="rose-colours-0" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89">A suitable red rose extract commonly becomes a shade of red or pink in an acidic</tspan><tspan x="89" dy="32">sample and green in a basic sample. A sample that gives little change needs</tspan></text></g>
<g class="v2-reading-block" data-block="rose-colours-1" transform="translate(0 384)"><text class="se-copy" x="89" y="24"><tspan x="89">comparison with the untreated extract and the litmus tests. The exact shade</tspan><tspan x="89" dy="32">depends on the extract and sample: a printed colour is a guide, not a</tspan><tspan x="89" dy="32">measurement.</tspan></text></g>
<g class="v2-reading-block" data-block="rose-result" transform="translate(0 496)"><image class="science-illustration" data-photo="rose-results" href="../../figures/class-7/science/ch02/rose-results.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Illustrative comparison after testing: green, unchanged purple and red-pink. These are</tspan><tspan x="89" dy="27">reference colours, not a record of your experiment.</tspan></text></g>
<g class="v2-reading-block" data-block="other-plants-0" transform="translate(0 858)"><text class="se-copy" x="89" y="24"><tspan x="89">Red hibiscus (gudhal), purple cabbage, jamun, beetroot and turmeric provide</tspan><tspan x="89" dy="32">other colours to investigate. Do not assume that every coloured extract</tspan></text></g>
<g class="v2-reading-block" data-block="other-plants-1" transform="translate(0 922)"><text class="se-copy" x="89" y="24"><tspan x="89">distinguishes acids and bases equally well. Compare each candidate with known</tspan><tspan x="89" dy="32">acidic and basic samples and an untreated control.</tspan></text></g>
<g class="v2-reading-block" data-block="hydrangea" transform="translate(0 1002)"><text class="se-heading" x="89" y="30"><tspan x="89">Flower colour has more than one cause</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Some hydrangeas produce blue flowers when</tspan><tspan x="89" dy="32">acidic soil makes aluminium available to the</tspan><tspan x="89" dy="32">plant. The same kinds may produce pink flowers</tspan><tspan x="89" dy="32">when less aluminium is available. Variety</tspan><tspan x="89" dy="32">matters too; white flowers do not simply turn</tspan><tspan x="89" dy="32">blue. Soil conditions can affect colour, but a</tspan><tspan x="89" dy="32">flower is not a substitute for a soil test.</tspan></text><image class="science-illustration" data-photo="hydrangea" href="../../figures/class-7/science/ch02/hydrangea.png" x="655" y="15.333333333333329" width="308" height="205.33333333333334" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="655" y="258.88"><tspan x="655">Blue and pink hydrangea flower</tspan><tspan x="655" dy="27">heads.</tspan></text></g>
<g class="v2-reading-block" data-block="plant-comparison-0" transform="translate(0 1316)"><text class="se-copy" x="89" y="24"><tspan x="89">A colour change inside a plant and a colour change in a test tube are related</tspan><tspan x="89" dy="32">questions, but they are not identical tests. Roots take up substances, and flowers</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
