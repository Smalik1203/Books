<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="three-natures" transform="translate(0 112)"><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Acidic</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74"><tspan x="112">Evidence: blue litmus</tspan><tspan x="112" dy="32">turns red.</tspan></text><text class="se-copy" x="89" y="148" text-anchor="start">•</text><text class="se-copy" x="112" y="148"><tspan x="112">Typical samples:</tspan><tspan x="112" dy="32">lemon juice, amla</tspan><tspan x="112" dy="32">juice, tamarind water</tspan><tspan x="112" dy="32">and vinegar.</tspan></text><text class="se-copy" x="89" y="286" text-anchor="start">•</text><text class="se-copy" x="112" y="286"><tspan x="112">Classroom group: A.</tspan></text><text class="v2-comparison-title" x="389" y="30"><tspan x="389">Basic</tspan></text><text class="se-copy" x="389" y="74" text-anchor="start">•</text><text class="se-copy" x="412" y="74"><tspan x="412">Evidence: red litmus</tspan><tspan x="412" dy="32">turns blue.</tspan></text><text class="se-copy" x="389" y="148" text-anchor="start">•</text><text class="se-copy" x="412" y="148"><tspan x="412">Typical samples: soap,</tspan><tspan x="412" dy="32">baking soda, lime</tspan><tspan x="412" dy="32">water and washing</tspan><tspan x="412" dy="32">powder solutions.</tspan></text><text class="se-copy" x="389" y="286" text-anchor="start">•</text><text class="se-copy" x="412" y="286"><tspan x="412">Classroom group: B.</tspan></text><text class="v2-comparison-title" x="689" y="30"><tspan x="689">Neutral</tspan></text><text class="se-copy" x="689" y="74" text-anchor="start">•</text><text class="se-copy" x="712" y="74"><tspan x="712">Meaning: neither</tspan><tspan x="712" dy="32">acidic nor basic.</tspan></text><text class="se-copy" x="689" y="148" text-anchor="start">•</text><text class="se-copy" x="712" y="148"><tspan x="712">Typical reference</tspan><tspan x="712" dy="32">samples: pure water</tspan><tspan x="712" dy="32">and suitable sugar or</tspan><tspan x="712" dy="32">common salt solutions</tspan><tspan x="712" dy="32">in pure water.</tspan></text><text class="se-copy" x="689" y="318" text-anchor="start">•</text><text class="se-copy" x="712" y="318"><tspan x="712">Classroom group: C, if</tspan><tspan x="712" dy="32">neither paper</tspan><tspan x="712" dy="32">changes; this is a</tspan><tspan x="712" dy="32">limited test.</tspan></text></g>
<g class="v2-reading-block" data-block="neutral-limit-0" transform="translate(0 560)"><text class="se-copy" x="89" y="24"><tspan x="89">Litmus does not measure an exact value of acidity. A very weak change can be</tspan><tspan x="89" dy="32">hard to see, and a coloured sample can mask it. Tap water varies from place to</tspan></text></g>
<g class="v2-reading-block" data-block="neutral-limit-1" transform="translate(0 624)"><text class="se-copy" x="89" y="24"><tspan x="89">place. “No clear change in either paper” is your observation; it does not prove</tspan><tspan x="89" dy="32">that every water sample is exactly neutral or safe to drink.</tspan></text></g>
<g class="v2-reading-block" data-block="two-paper-example-0" transform="translate(0 704)"><text class="se-copy" x="89" y="24"><tspan x="89">Consider two samples that leave blue litmus blue. One could be basic; another</tspan><tspan x="89" dy="32">could be neutral. Blue paper alone has not separated them. Red paper adds a</tspan></text></g>
<g class="v2-reading-block" data-block="two-paper-example-1" transform="translate(0 768)"><text class="se-copy" x="89" y="24"><tspan x="89">second comparison: a basic sample can turn it blue, while a neutral reference</tspan><tspan x="89" dy="32">leaves it red. This is why a test that produces no visible change can still be</tspan><tspan x="89" dy="32">informative when it is combined with another observation.</tspan></text></g>
<g class="v2-reading-block" data-block="lichen" transform="translate(0 880)"><text class="se-heading" x="89" y="30"><tspan x="89">A living source of colour</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">A lichen is a close association involving a fungus</tspan><tspan x="89" dy="32">and a photosynthetic partner, usually an alga or</tspan><tspan x="89" dy="32">a cyanobacterium. Look for lichens on bark or</tspan><tspan x="89" dy="32">rocks without removing them. Different lichens</tspan><tspan x="89" dy="32">tolerate different conditions, so finding one is</tspan><tspan x="89" dy="32">not a complete test of air quality.</tspan></text><image class="science-illustration" data-photo="lichen" href="../../figures/class-7/science/ch02/lichen.png" x="655" y="15.333333333333329" width="308" height="205.33333333333334" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="655" y="258.88"><tspan x="655">Lichen growing on a small piece</tspan><tspan x="655" dy="27">of bark.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
