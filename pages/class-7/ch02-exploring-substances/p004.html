<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="names-head" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">From observations to names</tspan></text></g>
<g class="v2-reading-block" data-block="litmus-meaning-0" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89">An <tspan class="se-bold">acid-base</tspan> <tspan class="se-bold">indicator</tspan> changes colour in response to the acidic or basic nature</tspan><tspan x="89" dy="32">of a solution. Litmus is made from dyes obtained from certain lichens and is</tspan></text></g>
<g class="v2-reading-block" data-block="litmus-meaning-1" transform="translate(0 224)"><text class="se-copy" x="89" y="24"><tspan x="89">supplied as a solution or as paper strips. Some other indicators come from</tspan><tspan x="89" dy="32">plants; synthetic indicators are manufactured. The indicator supplies evidence</tspan><tspan x="89" dy="32">through its response; the original colour of the sample alone is not the test.</tspan></text></g>
<g class="v2-reading-block" data-block="three-natures" transform="translate(0 336)"><g data-comparison-table="three-natures"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Recognising acidic, basic and neutral samples</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="251.58" y="70.08"><tspan x="251.58">Acidic</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="493.38666666666666" y="70.08"><tspan x="493.38666666666666">Basic</tspan></text></g><g data-comparison-cell="3"><text class="v2-table-heading" x="735.1933333333334" y="70.08"><tspan x="735.1933333333334">Neutral</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Test or</tspan><tspan x="103" dy="28">meaning</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="251.58" y="110.08"><tspan x="251.58">blue litmus turns</tspan><tspan x="251.58" dy="28">red.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="493.38666666666666" y="110.08"><tspan x="493.38666666666666">red litmus turns</tspan><tspan x="493.38666666666666" dy="28">blue.</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="735.1933333333334" y="110.08"><tspan x="735.1933333333334">neither acidic nor</tspan><tspan x="735.1933333333334" dy="28">basic.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">Typical</tspan><tspan x="103" dy="28">samples</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="251.58" y="178.07999999999998"><tspan x="251.58">lemon juice, amla</tspan><tspan x="251.58" dy="28">juice, tamarind</tspan><tspan x="251.58" dy="28">water and vinegar.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="493.38666666666666" y="178.07999999999998"><tspan x="493.38666666666666">soap, baking soda,</tspan><tspan x="493.38666666666666" dy="28">lime water and</tspan><tspan x="493.38666666666666" dy="28">washing powder</tspan><tspan x="493.38666666666666" dy="28">solutions.</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="735.1933333333334" y="178.07999999999998"><tspan x="735.1933333333334">pure water and</tspan><tspan x="735.1933333333334" dy="28">suitable sugar or</tspan><tspan x="735.1933333333334" dy="28">common salt</tspan><tspan x="735.1933333333334" dy="28">solutions in pure</tspan><tspan x="735.1933333333334" dy="28">water.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="302" y2="302"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="330.08"><tspan x="103">Classroom</tspan><tspan x="103" dy="28">group</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="251.58" y="330.08"><tspan x="251.58">A.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="493.38666666666666" y="330.08"><tspan x="493.38666666666666">B.</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="735.1933333333334" y="330.08"><tspan x="735.1933333333334">C, if neither paper</tspan><tspan x="735.1933333333334" dy="28">changes; this is a</tspan><tspan x="735.1933333333334" dy="28">limited test.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="398" y2="398"/><rect class="v2-table-frame" x="89" y="42" width="874" height="356"/><line class="v2-table-rule" x1="237.58" x2="237.58" y1="42" y2="398"/><line class="v2-table-rule" x1="479.38666666666666" x2="479.38666666666666" y1="42" y2="398"/><line class="v2-table-rule" x1="721.1933333333334" x2="721.1933333333334" y1="42" y2="398"/></g></g>
<g class="v2-reading-block" data-block="neutral-limit-0" transform="translate(0 750)"><text class="se-copy" x="89" y="24"><tspan x="89">Litmus does not measure an exact value of acidity. A very weak change can be</tspan><tspan x="89" dy="32">hard to see, and a coloured sample can mask it. Tap water varies from place to</tspan></text></g>
<g class="v2-reading-block" data-block="neutral-limit-1" transform="translate(0 814)"><text class="se-copy" x="89" y="24"><tspan x="89">place. “No clear change in either paper” is your observation; it does not prove</tspan><tspan x="89" dy="32">that every water sample is exactly neutral or safe to drink.</tspan></text></g>
<g class="v2-reading-block" data-block="two-paper-example-0" transform="translate(0 894)"><text class="se-copy" x="89" y="24"><tspan x="89">Consider two samples that leave blue litmus blue. One could be basic; another</tspan><tspan x="89" dy="32">could be neutral. Blue paper alone has not separated them. Red paper adds a</tspan></text></g>
<g class="v2-reading-block" data-block="two-paper-example-1" transform="translate(0 958)"><text class="se-copy" x="89" y="24"><tspan x="89">second comparison: a basic sample can turn it blue, while a neutral reference</tspan><tspan x="89" dy="32">leaves it red. This is why a test that produces no visible change can still be</tspan><tspan x="89" dy="32">informative when it is combined with another observation.</tspan></text></g>
<g class="v2-reading-block" data-block="lichen" transform="translate(0 1070)"><text class="se-heading" x="89" y="30"><tspan x="89">A living source of colour</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">A lichen is a close association involving a fungus</tspan><tspan x="89" dy="32">and a photosynthetic partner, usually an alga or</tspan><tspan x="89" dy="32">a cyanobacterium. Look for lichens on bark or</tspan><tspan x="89" dy="32">rocks without removing them. Different lichens</tspan><tspan x="89" dy="32">tolerate different conditions, so finding one is</tspan><tspan x="89" dy="32">not a complete test of air quality.</tspan></text><image class="science-illustration" data-photo="lichen" href="../../figures/class-7/science/ch02/lichen.png" x="655" y="15.333333333333329" width="308" height="205.33333333333334" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="655" y="258.88"><tspan x="655">Lichen growing on a small piece</tspan><tspan x="655" dy="27">of bark.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
