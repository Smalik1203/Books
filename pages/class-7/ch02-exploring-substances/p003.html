</text><line class="v2-table-rule" x1="89" x2="963" y1="174" y2="174"/><text class="se-copy se-table-copy" x="103" y="208.07999999999998"><tspan x="103">If a change is</tspan><tspan x="103" dy="28">unclear</tspan></text><text class="se-copy se-table-copy" x="312.76" y="208.07999999999998"><tspan x="312.76">Record what you actually see</tspan></text><text class="se-copy se-table-copy" x="644.88" y="208.07999999999998"><tspan x="644.88">Repeat with fresh paper</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="254" y2="254"/><rect class="v2-table-frame" x="89" y="42" width="874" height="212"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="42" y2="254"/><line class="v2-table-rule" x1="630.88" x2="630.88" y1="42" y2="254"/><text class="v2-table-note" x="89" y="286.88"><tspan x="89">Notebook record guide, not a table of results. Read across to pair the two observations for one</tspan><tspan x="89" dy="26">sample; compare down to find patterns.</tspan></text></g>
<g class="v2-reading-block" data-block="lime-note-0" transform="translate(0 450)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Lime</tspan> <tspan class="se-bold">water</tspan> is a solution of calcium hydroxide in water. It is not juice from the</tspan><tspan x="89" dy="32">lime fruit. A teacher can prepare it using suitable laboratory materials and</tspan></text></g>
<g class="v2-reading-block" data-block="lime-note-1" transform="translate(0 514)"><text class="se-copy" x="89" y="24"><tspan x="89">separate the clear liquid from undissolved solid. Do not mix quicklime with water</tspan><tspan x="89" dy="32">yourself: the process releases considerable heat and can splash an irritating</tspan><tspan x="89" dy="32">mixture.</tspan></text></g>
<g class="v2-reading-block" data-block="sorting" transform="translate(0 626)"><g data-comparison-table="sorting"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Group samples by both litmus observations</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Group</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="312.76" y="70.08"><tspan x="312.76">Observed pattern</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Group A</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="110.08"><tspan x="312.76">blue paper turns red; red paper remains red.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="122" y2="122"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="150.07999999999998"><tspan x="103">Group B</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="150.07999999999998"><tspan x="312.76">red paper turns blue; blue paper remains blue.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="162" y2="162"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="190.07999999999998"><tspan x="103">Group C</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="312.76" y="190.07999999999998"><tspan x="312.76">neither paper shows a clear change.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="202" y2="202"/><rect class="v2-table-frame" x="89" y="42" width="874" height="160"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="42" y2="202"/></g></g>
<g class="v2-reading-block" data-block="sort-record-0" transform="translate(0 844)"><text class="se-copy" x="89" y="24"><tspan x="89">Make three lists headed A, B and C in your notebook, using the three observed</tspan><tspan x="89" dy="32">patterns. Put each sample in the list supported by both tests. Keep doubtful</tspan><tspan x="89" dy="32">results separate for retesting rather than forcing them into a group.</tspan></text></g>
<g class="v2-reading-block" data-block="record-disagreement-0" transform="translate(0 956)"><text class="se-copy" x="89" y="24"><tspan x="89">Suppose two groups test the same soap solution and report different colours.</tspan><tspan x="89" dy="32">Check whether the papers began with the same colour, whether a dropper</tspan></text></g>
<g class="v2-reading-block" data-block="record-disagreement-1" transform="translate(0 1020)"><text class="se-copy" x="89" y="24"><tspan x="89">carried over another sample and whether the paper was wet already. Test fresh</tspan><tspan x="89" dy="32">pieces using the same solution. Keep the first observations in the record as well</tspan></text></g>
<g class="v2-reading-block" data-block="record-disagreement-2" transform="translate(0 1084)"><text class="se-copy" x="89" y="24"><tspan x="89">as the repeat; crossing out an inconvenient result would hide the reason for</tspan><tspan x="89" dy="32">checking it.</tspan></text></g><g transform="translate(0 1164)"><g data-page-illustration="figures/class-7/science/ch02/litmus-setup.png"><image class="science-illustration" href="../../figures/class-7/science/ch02/litmus-setup.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Materials for an indicator test.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Materials for an indicator test.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
