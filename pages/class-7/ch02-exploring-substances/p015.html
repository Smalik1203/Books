<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="ant-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">are not simply a beaker experiment. Tell an adult after a bite; wash the area with</tspan><tspan x="89" dy="32">soap and water and use a wrapped cold compress. Do not apply test chemicals or</tspan></text></g>
<g class="v2-reading-block" data-block="ant-2" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">baking-soda remedies. Seek urgent help for breathing difficulty or swelling of the</tspan><tspan x="89" dy="32">mouth or throat.</tspan></text></g>
<g class="v2-reading-block" data-block="waste-0" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">Gurbir notices fewer fish in a lake near factories. Acidic waste is one possible</tspan><tspan x="89" dy="32">cause, not a conclusion from the fish count alone. Oxygen shortage, toxic</tspan></text></g>
<g class="v2-reading-block" data-block="waste-1" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89">substances, temperature and other changes also matter. Treatment plants may</tspan><tspan x="89" dy="32">adjust the acidity of wastewater before discharge, but a neutral reading does not</tspan></text></g>
<g class="v2-reading-block" data-block="waste-2" transform="translate(0 384)"><text class="se-copy" x="89" y="24"><tspan x="89">prove the water is free of harmful substances. Treatment and testing belong with</tspan><tspan x="89" dy="32">trained people, before waste enters the lake.</tspan></text></g>
<g class="v2-reading-block" data-block="environment-evidence-0" transform="translate(0 464)"><text class="se-copy" x="89" y="24"><tspan x="89">To investigate the lake responsibly, trained people would compare samples from</tspan><tspan x="89" dy="32">suitable locations and times, including water away from the suspected discharge.</tspan></text></g>
<g class="v2-reading-block" data-block="environment-evidence-1" transform="translate(0 528)"><text class="se-copy" x="89" y="24"><tspan x="89">Records before and after treatment would be more useful than one photograph.</tspan><tspan x="89" dy="32">Students can discuss such evidence without collecting polluted water. Separating</tspan></text></g>
<g class="v2-reading-block" data-block="environment-evidence-2" transform="translate(0 592)"><text class="se-copy" x="89" y="24"><tspan x="89">a possible explanation from a demonstrated cause is part of deciding what action</tspan><tspan x="89" dy="32">could actually protect the fish.</tspan></text></g>
<g class="v2-reading-block" data-block="fair-return" transform="translate(0 684)"><text class="se-heading" x="89" y="30"><tspan x="89">Return to the hidden message</tspan></text></g>
<g class="v2-reading-block" data-block="fair-explain-0" transform="translate(0 732)"><text class="se-copy" x="89" y="24"><tspan x="89">One explanation for the science-fair message is that a basic soap solution was</tspan><tspan x="89" dy="32">used to write on the paper and allowed to dry. Wetting it with turmeric indicator</tspan></text></g>
<g class="v2-reading-block" data-block="fair-explain-1" transform="translate(0 796)"><text class="se-copy" x="89" y="24"><tspan x="89">would make the writing reddish-brown against yellow paper. Other</tspan><tspan x="89" dy="32">indicator-and-solution pairs are possible. Suggest a prediction that would</tspan></text></g>
<g class="v2-reading-block" data-block="fair-explain-2" transform="translate(0 860)"><text class="se-copy" x="89" y="24"><tspan x="89">distinguish two explanations, rather than claiming that a colourful result proves</tspan><tspan x="89" dy="32">one recipe.</tspan></text></g>
<g class="v2-reading-block" data-block="message-control-0" transform="translate(0 940)"><text class="se-copy" x="89" y="24"><tspan x="89">Compare a patch written with soap solution with a patch wetted only with water.</tspan><tspan x="89" dy="32">Let both dry, then apply the same indicator in the same way. If only the soap</tspan></text></g>
<g class="v2-reading-block" data-block="message-control-1" transform="translate(0 1004)"><text class="se-copy" x="89" y="24"><tspan x="89">patch develops the predicted colour, the comparison supports the role of the</tspan><tspan x="89" dy="32">writing liquid. If both patches change alike, examine the paper and indicator</tspan><tspan x="89" dy="32">before claiming that the message has been explained.</tspan></text></g>
<g class="v2-reading-block" data-block="fair-care-0" transform="translate(0 1116)"><text class="se-copy" x="89" y="24"><tspan x="89">For a teacher-approved demonstration, test a tiny patch first and brush indicator</tspan><tspan x="89" dy="32">onto paper instead of spraying it towards people. Use small quantities and keep</tspan></text></g>
<g class="v2-reading-block" data-block="fair-care-1" transform="translate(0 1180)"><text class="se-copy" x="89" y="24"><tspan x="89">food for eating separate from test materials. A visible message connects art and</tspan><tspan x="89" dy="32">chemistry; a careful comparison explains why it appears.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">15</text></g></svg></div></div></section>
