<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="food-head" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Familiar foods, careful comparisons</tspan></text></g>
<g class="v2-reading-block" data-block="food-memory" transform="translate(0 160)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="402" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Recall the taste of lemon, curd or tamarind that you have eaten as food.</tspan><tspan x="113" dy="32">What do these familiar foods have in common? Do not taste the samples</tspan><tspan x="113" dy="32">prepared for an investigation.</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Some bases feel slippery and many taste bitter, but these are unsafe</tspan><tspan x="113" dy="32">identification tests. Bitter gourd tastes bitter without being classified as a</tspan><tspan x="113" dy="32">base. Explain why “bitter” is not enough evidence for “basic”.</tspan></text><text class="se-copy" x="113" y="308"><tspan x="113">Use a reference source to identify acids commonly present in lemon, curd,</tspan><tspan x="113" dy="32">tamarind and vinegar. Compare your findings with the table below. A food</tspan><tspan x="113" dy="32">can contain more than one acid.</tspan></text></g>
<g class="v2-reading-block" data-block="food-table" transform="translate(0 584)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 2.2 Acids in familiar foods</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Food</tspan></text><text class="v2-table-heading" x="408.9" y="76.08"><tspan x="408.9">Examples of acids present</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Lemon and orange</tspan></text><text class="se-copy se-table-copy" x="408.9" y="128.07999999999998"><tspan x="408.9">Citric acid</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="146" y2="146"/><text class="se-copy se-table-copy" x="103" y="180.07999999999998"><tspan x="103">Amla</tspan></text><text class="se-copy se-table-copy" x="408.9" y="180.07999999999998"><tspan x="408.9">Ascorbic acid (vitamin C) and citric acid</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="198" y2="198"/><text class="se-copy se-table-copy" x="103" y="232.07999999999998"><tspan x="103">Tamarind</tspan></text><text class="se-copy se-table-copy" x="408.9" y="232.07999999999998"><tspan x="408.9">Tartaric acid</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="250" y2="250"/><text class="se-copy se-table-copy" x="103" y="284.08"><tspan x="103">Tomato</tspan></text><text class="se-copy se-table-copy" x="408.9" y="284.08"><tspan x="408.9">Citric acid and oxalic acid</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="302" y2="302"/><text class="se-copy se-table-copy" x="103" y="336.08"><tspan x="103">Curd</tspan></text><text class="se-copy se-table-copy" x="408.9" y="336.08"><tspan x="408.9">Lactic acid</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="354" y2="354"/><text class="se-copy se-table-copy" x="103" y="388.08"><tspan x="103">Vinegar</tspan></text><text class="se-copy se-table-copy" x="408.9" y="388.08"><tspan x="408.9">Acetic acid</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="406" y2="406"/><rect class="v2-table-frame" x="89" y="42" width="874" height="364"/><line class="v2-table-rule" x1="394.9" x2="394.9" y1="42" y2="406"/><text class="v2-table-note" x="89" y="438.88"><tspan x="89">Reference examples, not permission to taste laboratory samples. These names do not imply</tspan><tspan x="89" dy="26">that a food contains only one acid.</tspan></text></g>
<g class="v2-reading-block" data-block="food-concentration-0" transform="translate(0 1074)"><text class="se-copy" x="89" y="24"><tspan x="89">An acid named in a food is one ingredient among many. A lemon is not a</tspan><tspan x="89" dy="32">container of pure citric acid, and different fruits contain different amounts.</tspan></text></g><g transform="translate(0 1138)"><g data-page-illustration="figures/class-7/science/ch02/litmus-setup.png"><image class="science-illustration" href="../../figures/class-7/science/ch02/litmus-setup.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Materials for an indicator test.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Materials for an indicator test.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">5</text></g></svg></div></div></section>
