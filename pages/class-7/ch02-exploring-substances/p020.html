<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="20" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 20"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Explore Further</tspan></text></g>
<g class="v2-reading-block" data-block="shell-head" transform="translate(0 182)"><text class="se-heading" x="89" y="30"><tspan x="89">A different reaction</tspan></text></g>
<g class="v2-reading-block" data-block="shell-0" transform="translate(0 230)"><text class="se-copy" x="89" y="24"><tspan x="89">Vinegar produces bubbles with eggshell or marble, while soap solution produces</tspan><tspan x="89" dy="32">no clear bubbling. Both solids contain calcium carbonate. With your teacher,</tspan></text></g>
<g class="v2-reading-block" data-block="shell-1" transform="translate(0 294)"><text class="se-copy" x="89" y="24"><tspan x="89">explain how an acid reacting with a carbonate can release carbon dioxide. Why is</tspan><tspan x="89" dy="32">this not the same observable result as the lime-water neutralisation? Never seal a</tspan><tspan x="89" dy="32">gas-producing mixture in a container.</tspan></text></g>
<g class="v2-reading-block" data-block="rangoli-head" transform="translate(0 418)"><text class="se-heading" x="89" y="30"><tspan x="89">Colour, pattern and prediction</tspan></text></g>
<g class="v2-reading-block" data-block="rangoli-0" transform="translate(0 466)"><text class="se-copy" x="89" y="24"><tspan x="89">Plan a small indicator rangoli on scrap paper using approved mild substances.</tspan><tspan x="89" dy="32">Predict colours before applying drops or using a brush. Keep a record of each</tspan></text></g>
<g class="v2-reading-block" data-block="rangoli-1" transform="translate(0 530)"><text class="se-copy" x="89" y="24"><tspan x="89">mixture, minimise waste and protect skin, eyes and surfaces. Compare the</tspan><tspan x="89" dy="32">finished colours with your predictions.</tspan></text></g>
<g class="v2-reading-block" data-block="water-project-head" transform="translate(0 622)"><text class="se-heading" x="89" y="30"><tspan x="89">Compare local water safely</tspan></text></g>
<g class="v2-reading-block" data-block="water-project-0" transform="translate(0 670)"><text class="se-copy" x="89" y="24"><tspan x="89">With adult help, obtain safe samples of rainwater and tap water. A teacher may</tspan><tspan x="89" dy="32">supply other samples; do not enter a river or collect polluted water. Compare</tspan></text></g>
<g class="v2-reading-block" data-block="water-project-1" transform="translate(0 734)"><text class="se-copy" x="89" y="24"><tspan x="89">them using indicators and a reference sample. Explain why the test cannot</tspan><tspan x="89" dy="32">establish whether the water is drinkable.</tspan></text></g>
<g class="v2-reading-block" data-block="soil-project-head" transform="translate(0 826)"><text class="se-heading" x="89" y="30"><tspan x="89">Investigate a local soil</tspan></text></g>
<g class="v2-reading-block" data-block="soil-project-0" transform="translate(0 874)"><text class="se-copy" x="89" y="24"><tspan x="89">With permission, take a small soil sample without disturbing roots. Ask your</tspan><tspan x="89" dy="32">teacher to prepare a water extract or use a suitable soil-testing kit. Record where</tspan></text></g>
<g class="v2-reading-block" data-block="soil-project-1" transform="translate(0 938)"><text class="se-copy" x="89" y="24"><tspan x="89">it came from, the method and the result. Compare with the needs of a chosen</tspan><tspan x="89" dy="32">plant; do not add treatments merely to change a colour. If comparing two sites,</tspan><tspan x="89" dy="32">explain how you would keep the amounts of soil and water alike.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">20</text></g></svg></div></div></section>
