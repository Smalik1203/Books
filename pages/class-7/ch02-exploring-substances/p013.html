<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="neutralisation-meaning-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">used in this demonstration may be too small to make a temperature change easy</tspan><tspan x="89" dy="32">to notice. A colour change alone does not measure heat.</tspan></text></g>
<g class="v2-reading-block" data-block="equation" transform="translate(0 192)"><text class="v2-equation" x="89" y="30"><tspan x="89">Acid + hydroxide base → salt + water</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">Heat is released in this neutralisation. “Salt” names a family of substances, not only the</tspan><tspan x="89" dy="27">common salt used in food.</tspan></text></g>
<g class="v2-reading-block" data-block="endpoint-0" transform="translate(0 316)"><text class="se-copy" x="89" y="24"><tspan x="89">Adding lime water reduces the acidic effect of the lemon juice. Enough added</tspan><tspan x="89" dy="32">base can leave the mixture basic: blue litmus solution at the end is evidence of</tspan></text></g>
<g class="v2-reading-block" data-block="endpoint-1" transform="translate(0 380)"><text class="se-copy" x="89" y="24"><tspan x="89">excess base, not proof of neutrality. Adding enough acid can make the mixture</tspan><tspan x="89" dy="32">acidic again. The outcome depends on how much acid and base react, not just on</tspan><tspan x="89" dy="32">equal numbers of drops.</tspan></text></g>
<g class="v2-reading-block" data-block="mixture-example-0" transform="translate(0 492)"><text class="se-copy" x="89" y="24"><tspan x="89">Think of each added drop as supplying another small amount of reactant. Early</tspan><tspan x="89" dy="32">drops of base may react while acid is still left. Later drops may supply more base</tspan></text></g>
<g class="v2-reading-block" data-block="mixture-example-1" transform="translate(0 556)"><text class="se-copy" x="89" y="24"><tspan x="89">than the remaining acid can react with. Stirring matters because an unmixed</tspan><tspan x="89" dy="32">drop can briefly create a local colour different from the rest of the liquid. Judge</tspan><tspan x="89" dy="32">the well-mixed sample, and record the sequence rather than only its final colour.</tspan></text></g>
<g class="v2-reading-block" data-block="endpoint-think" transform="translate(0 668)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">One group says, “We mixed an acid with a base, so the result must be</tspan><tspan x="113" dy="32">neutral.” Another says, “Our mixture turned blue, so some base is left.”</tspan><tspan x="113" dy="32">Which statement uses the observation more carefully?</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Explain why adding one drop of lemon juice might fail to reverse the colour.</tspan><tspan x="113" dy="32">What information about the amounts and concentrations would help you</tspan><tspan x="113" dy="32">predict the next change?</tspan></text></g>
<g class="v2-reading-block" data-block="ray-head" transform="translate(0 996)"><text class="se-heading" x="89" y="30"><tspan x="89">Prafulla Chandra Ray: research and education</tspan></text></g>
<g class="v2-reading-block" data-block="ray-0" transform="translate(0 1044)"><text class="se-copy" x="89" y="24"><tspan x="89">Acharya Prafulla Chandra Ray (1861–1944) was a chemist, teacher and industrial</tspan><tspan x="89" dy="32">pioneer, often called the Father of Modern Indian Chemistry. After doctoral study</tspan></text></g>
<g class="v2-reading-block" data-block="ray-1" transform="translate(0 1108)"><text class="se-copy" x="89" y="24"><tspan x="89">in Britain, he returned to India and helped develop chemical research and</tspan><tspan x="89" dy="32">teaching. His Bengal Chemical enterprise became a limited company in 1901. He</tspan></text></g>
<g class="v2-reading-block" data-block="ray-2" transform="translate(0 1172)"><text class="se-copy" x="89" y="24"><tspan x="89">also wrote about the history of chemistry in India and supported education</tspan><tspan x="89" dy="32">through Indian languages.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
