<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="turmeric-think" transform="translate(0 112)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="262" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Two samples leave turmeric paper yellow. One is vinegar and one is sugar</tspan><tspan x="113" dy="32">solution. Can you decide which is which from that observation alone?</tspan></text><text class="se-copy" x="113" y="168"><tspan x="113">Choose another test and predict the two possible results. Explain why</tspan><tspan x="113" dy="32">repeating only the turmeric test, even very carefully, would not supply the</tspan><tspan x="113" dy="32">missing distinction.</tspan></text></g>
<g class="v2-reading-block" data-block="turmeric-control-0" transform="translate(0 396)"><text class="se-copy" x="89" y="24"><tspan x="89">An unchanged strip is useful only if the indicator is working. Use a small known</tspan><tspan x="89" dy="32">basic reference chosen by your teacher to check a fresh piece of turmeric paper.</tspan></text></g>
<g class="v2-reading-block" data-block="turmeric-control-1" transform="translate(0 460)"><text class="se-copy" x="89" y="24"><tspan x="89">If that reference also gives no clear change, investigate the paper or preparation</tspan><tspan x="89" dy="32">before judging the unknown sample. A control does not provide the unknown</tspan><tspan x="89" dy="32">answer; it checks whether the test can produce the response you are looking for.</tspan></text></g>
<g class="v2-reading-block" data-block="turmeric-life-0" transform="translate(0 572)"><text class="se-copy" x="89" y="24"><tspan x="89">A yellow curry stain may become reddish-brown when soap reaches it because</tspan><tspan x="89" dy="32">the soap solution is basic. This links an everyday observation with the indicator</tspan></text></g>
<g class="v2-reading-block" data-block="turmeric-life-1" transform="translate(0 636)"><text class="se-copy" x="89" y="24"><tspan x="89">test. Turmeric also has a long history of culinary and traditional use. Such use</tspan><tspan x="89" dy="32">does not by itself establish that a preparation treats a disease; health claims need</tspan><tspan x="89" dy="32">appropriate evidence.</tspan></text></g>
<g class="v2-reading-block" data-block="message-0" transform="translate(0 748)"><text class="se-copy" x="89" y="24"><tspan x="89">Ashwin makes a greeting card for his teacher at Guru Purnima, writing in Odia.</tspan><tspan x="89" dy="32">He coats paper with turmeric, lets it dry and uses a teacher-approved soap</tspan></text></g>
<g class="v2-reading-block" data-block="message-1" transform="translate(0 812)"><text class="se-copy" x="89" y="24"><tspan x="89">solution to write a message. Explain the colour he might see. Respect for a</tspan><tspan x="89" dy="32">teacher can be expressed in any language; the chemistry of the indicator does not</tspan><tspan x="89" dy="32">depend on the words.</tspan></text></g>
<g class="v2-reading-block" data-block="olfactory-head" transform="translate(0 936)"><text class="se-heading" x="89" y="30"><tspan x="89">An indicator detected by smell</tspan></text></g>
<g class="v2-reading-block" data-block="olfactory-intro-0" transform="translate(0 984)"><text class="se-copy" x="89" y="24"><tspan x="89">Some substances show a change in detectable smell in acidic or basic conditions.</tspan><tspan x="89" dy="32">They are called <tspan class="se-bold">olfactory</tspan> <tspan class="se-bold">indicators</tspan>. Smell is a less precise observation than it</tspan></text></g>
<g class="v2-reading-block" data-block="olfactory-intro-1" transform="translate(0 1048)"><text class="se-copy" x="89" y="24"><tspan x="89">may seem: people differ in sensitivity, and repeatedly smelling the same</tspan><tspan x="89" dy="32">substance can make it harder to notice. The sample’s own smell can also mask</tspan></text></g>
<g class="v2-reading-block" data-block="olfactory-intro-2" transform="translate(0 1112)"><text class="se-copy" x="89" y="24"><tspan x="89">another smell. A control and a second kind of indicator help you avoid treating</tspan><tspan x="89" dy="32">an uncertain impression as a definite identification.</tspan></text></g><g transform="translate(0 1192)"><g data-page-illustration="figures/class-7/science/ch02/turmeric.png"><image class="science-illustration" href="../../figures/class-7/science/ch02/turmeric.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Turmeric.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Turmeric.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
