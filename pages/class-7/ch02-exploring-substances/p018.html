<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="assessment-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Let Us Enhance Our Learning</tspan></text></g>
<g class="v2-reading-block" data-block="assessment-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Use your notebook. Support each answer with evidence and explain any</tspan><tspan x="89" dy="32">uncertainty.</tspan></text></g>
<g class="v2-reading-block" data-block="q1" transform="translate(0 250)"><text class="se-copy" x="111" y="24" text-anchor="end">1.</text><text class="se-copy" x="132" y="24"><tspan x="132">A solution turns red litmus blue. Which addition, in sufficient excess, could</tspan><tspan x="132" dy="32">make the mixture acidic again? Choose lime water, baking soda solution,</tspan><tspan x="132" dy="32">vinegar or common salt solution. Explain your choice.</tspan></text></g>
<g class="v2-reading-block" data-block="q2" transform="translate(0 376)"><text class="se-copy" x="111" y="24" text-anchor="end">2.</text><text class="se-copy" x="132" y="24"><tspan x="132">Solution A turns red litmus blue; B turns turmeric reddish-brown; C turns a</tspan><tspan x="132" dy="32">suitable red rose extract green. Which sequence describes A, B and C:</tspan><tspan x="132" dy="32">acidic/acidic/acidic; neutral/basic/basic; basic/basic/acidic; or</tspan><tspan x="132" dy="32">basic/basic/basic? Give the evidence for each.</tspan></text></g>
<g class="v2-reading-block" data-block="q3" transform="translate(0 534)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24"><tspan x="132">Three containers tested with the same red rose extract give these colours: A</tspan><tspan x="132" dy="32">green, B unchanged purple, C red-pink. Suggest the nature of each. For</tspan><tspan x="132" dy="32">which container would another indicator be especially useful, and why?</tspan></text><image class="science-illustration" data-photo="rose-results" href="../../figures/class-7/science/ch02/rose-results.png" x="400.75" y="112" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="352.88"><tspan x="89">A: green B: unchanged purple C: red-pink</tspan></text></g>
<g class="v2-reading-block" data-block="q4" transform="translate(0 919)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24"><tspan x="132">A sample leaves red litmus unchanged, turns blue litmus red and leaves</tspan><tspan x="132" dy="32">turmeric yellow. Identify the nature supported by this evidence. Which</tspan><tspan x="132" dy="32">observation is most useful, and why?</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
