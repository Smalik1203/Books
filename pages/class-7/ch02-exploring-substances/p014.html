<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="daily-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">2.3 Chemistry in Daily Life</tspan></text></g>
<g class="v2-reading-block" data-block="soil-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">A farmer notices poor growth. Is the soil too acidic, too basic, short of nutrients,</tspan><tspan x="89" dy="32">too wet or affected by something else? Plant appearance alone does not identify</tspan></text></g>
<g class="v2-reading-block" data-block="soil-intro-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">the cause. Some fertilisers can make soil more acidic over time, but a soil test</tspan><tspan x="89" dy="32">and knowledge of the crop should guide treatment.</tspan></text></g>
<g class="v2-reading-block" data-block="soil-figure" transform="translate(0 314)"><image class="science-illustration" data-photo="soil" href="../../figures/class-7/science/ch02/soil.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Compare a soil sample with a tested reference. Poor growth needs investigation before</tspan><tspan x="89" dy="27">treatment.</tspan></text></g>
<g class="v2-reading-block" data-block="soil-comparison" transform="translate(0 676)"><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Soil too acidic for</tspan><tspan x="89" dy="36">the crop</tspan></text><text class="se-copy" x="89" y="110" text-anchor="start">•</text><text class="se-copy" x="112" y="110"><tspan x="112">Evidence: a suitable</tspan><tspan x="112" dy="32">soil test shows</tspan><tspan x="112" dy="32">excessive acidity for</tspan><tspan x="112" dy="32">that crop.</tspan></text><text class="se-copy" x="89" y="248" text-anchor="start">•</text><text class="se-copy" x="112" y="248"><tspan x="112">Response: an expert</tspan><tspan x="112" dy="32">may recommend a</tspan><tspan x="112" dy="32">measured amount of</tspan><tspan x="112" dy="32">agricultural lime.</tspan></text><text class="se-copy" x="89" y="386" text-anchor="start">•</text><text class="se-copy" x="112" y="386"><tspan x="112">Check: retest later;</tspan><tspan x="112" dy="32">adding too much can</tspan><tspan x="112" dy="32">create another</tspan><tspan x="112" dy="32">problem.</tspan></text><text class="v2-comparison-title" x="389" y="30"><tspan x="389">Soil too basic for</tspan><tspan x="389" dy="36">the crop</tspan></text><text class="se-copy" x="389" y="110" text-anchor="start">•</text><text class="se-copy" x="412" y="110"><tspan x="412">Evidence: a soil test</tspan><tspan x="412" dy="32">and crop needs</tspan><tspan x="412" dy="32">identify the problem.</tspan></text><text class="se-copy" x="389" y="216" text-anchor="start">•</text><text class="se-copy" x="412" y="216"><tspan x="412">Response: seek local</tspan><tspan x="412" dy="32">agricultural advice;</tspan><tspan x="412" dy="32">suitable organic</tspan><tspan x="412" dy="32">matter may help soil</tspan><tspan x="412" dy="32">condition.</tspan></text><text class="se-copy" x="389" y="386" text-anchor="start">•</text><text class="se-copy" x="412" y="386"><tspan x="412">Check: compost is not</tspan><tspan x="412" dy="32">a guaranteed or rapid</tspan><tspan x="412" dy="32">cure for alkaline soil.</tspan></text><text class="v2-comparison-title" x="689" y="30"><tspan x="689">Soil near the</tspan><tspan x="689" dy="36">required range</tspan></text><text class="se-copy" x="689" y="110" text-anchor="start">•</text><text class="se-copy" x="712" y="110"><tspan x="712">Evidence: acidity</tspan><tspan x="712" dy="32">alone does not explain</tspan><tspan x="712" dy="32">the poor growth.</tspan></text><text class="se-copy" x="689" y="216" text-anchor="start">•</text><text class="se-copy" x="712" y="216"><tspan x="712">Response: investigate</tspan><tspan x="712" dy="32">nutrients, drainage,</tspan><tspan x="712" dy="32">watering, pests and</tspan><tspan x="712" dy="32">other conditions.</tspan></text><text class="se-copy" x="689" y="354" text-anchor="start">•</text><text class="se-copy" x="712" y="354"><tspan x="712">Check: choose a</tspan><tspan x="712" dy="32">treatment for the</tspan><tspan x="712" dy="32">cause supported by</tspan><tspan x="712" dy="32">evidence.</tspan></text></g>
<g class="v2-reading-block" data-block="ant-0" transform="translate(0 1192)"><text class="se-copy" x="89" y="24"><tspan x="89">An ant bite is sometimes described as an acid-base problem. Some ants use</tspan><tspan x="89" dy="32">formic acid in defence, but bites and stings differ between species. Skin reactions</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
