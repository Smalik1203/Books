<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="daily-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">2.3 Chemistry in Daily Life</tspan></text></g>
<g class="v2-reading-block" data-block="soil-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">A farmer notices poor growth. Is the soil too acidic, too basic, short of nutrients,</tspan><tspan x="89" dy="32">too wet or affected by something else? Plant appearance alone does not identify</tspan></text></g>
<g class="v2-reading-block" data-block="soil-intro-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">the cause. Some fertilisers can make soil more acidic over time, but a soil test</tspan><tspan x="89" dy="32">and knowledge of the crop should guide treatment.</tspan></text></g>
<g class="v2-reading-block" data-block="soil-figure" transform="translate(0 314)"><image class="science-illustration" data-photo="soil" href="../../figures/class-7/science/ch02/soil.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Compare a soil sample with a tested reference. Poor growth needs investigation before</tspan><tspan x="89" dy="27">treatment.</tspan></text></g>
<g class="v2-reading-block" data-block="soil-comparison" transform="translate(0 676)"><g data-comparison-table="soil-comparison"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Soil conditions and appropriate responses</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="68"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="251.58" y="70.08"><tspan x="251.58">Soil too acidic for</tspan><tspan x="251.58" dy="28">the crop</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="493.38666666666666" y="70.08"><tspan x="493.38666666666666">Soil too basic for the</tspan><tspan x="493.38666666666666" dy="28">crop</tspan></text></g><g data-comparison-cell="3"><text class="v2-table-heading" x="735.1933333333334" y="70.08"><tspan x="735.1933333333334">Soil near the</tspan><tspan x="735.1933333333334" dy="28">required range</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="110" y2="110"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="138.07999999999998"><tspan x="103">Evidence</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="251.58" y="138.07999999999998"><tspan x="251.58">a suitable soil test</tspan><tspan x="251.58" dy="28">shows excessive</tspan><tspan x="251.58" dy="28">acidity for that crop.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="493.38666666666666" y="138.07999999999998"><tspan x="493.38666666666666">a soil test and crop</tspan><tspan x="493.38666666666666" dy="28">needs identify the</tspan><tspan x="493.38666666666666" dy="28">problem.</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="735.1933333333334" y="138.07999999999998"><tspan x="735.1933333333334">acidity alone does</tspan><tspan x="735.1933333333334" dy="28">not explain the poor</tspan><tspan x="735.1933333333334" dy="28">growth.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="206" y2="206"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="234.07999999999998"><tspan x="103">Response</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="251.58" y="234.07999999999998"><tspan x="251.58">an expert may</tspan><tspan x="251.58" dy="28">recommend a</tspan><tspan x="251.58" dy="28">measured amount of</tspan><tspan x="251.58" dy="28">agricultural lime.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="493.38666666666666" y="234.07999999999998"><tspan x="493.38666666666666">seek local</tspan><tspan x="493.38666666666666" dy="28">agricultural advice;</tspan><tspan x="493.38666666666666" dy="28">suitable organic</tspan><tspan x="493.38666666666666" dy="28">matter may help soil</tspan><tspan x="493.38666666666666" dy="28">condition.</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="735.1933333333334" y="234.07999999999998"><tspan x="735.1933333333334">investigate nutrients,</tspan><tspan x="735.1933333333334" dy="28">drainage, watering,</tspan><tspan x="735.1933333333334" dy="28">pests and other</tspan><tspan x="735.1933333333334" dy="28">conditions.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="358" y2="358"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="386.08"><tspan x="103">Follow-up</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="251.58" y="386.08"><tspan x="251.58">retest later; adding</tspan><tspan x="251.58" dy="28">too much can create</tspan><tspan x="251.58" dy="28">another problem.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="493.38666666666666" y="386.08"><tspan x="493.38666666666666">compost is not a</tspan><tspan x="493.38666666666666" dy="28">guaranteed or rapid</tspan><tspan x="493.38666666666666" dy="28">cure for alkaline</tspan><tspan x="493.38666666666666" dy="28">soil.</tspan></text></g><g data-comparison-cell="3"><text class="se-copy se-table-copy" x="735.1933333333334" y="386.08"><tspan x="735.1933333333334">choose a treatment</tspan><tspan x="735.1933333333334" dy="28">for the cause</tspan><tspan x="735.1933333333334" dy="28">supported by</tspan><tspan x="735.1933333333334" dy="28">evidence.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="482" y2="482"/><rect class="v2-table-frame" x="89" y="42" width="874" height="440"/><line class="v2-table-rule" x1="237.58" x2="237.58" y1="42" y2="482"/><line class="v2-table-rule" x1="479.38666666666666" x2="479.38666666666666" y1="42" y2="482"/><line class="v2-table-rule" x1="721.1933333333334" x2="721.1933333333334" y1="42" y2="482"/></g></g>
<g class="v2-reading-block" data-block="ant-0" transform="translate(0 1174)"><text class="se-copy" x="89" y="24"><tspan x="89">An ant bite is sometimes described as an acid-base problem. Some ants use</tspan><tspan x="89" dy="32">formic acid in defence, but bites and stings differ between species. Skin reactions</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
