<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="food-concentration-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Dilution changes how much acid is present in each drop. Do not rank foods by</tspan><tspan x="89" dy="32">sourness in this investigation, or assume that an edible food makes every</tspan><tspan x="89" dy="32">concentrated chemical with the same acid name safe to handle.</tspan></text></g>
<g class="v2-reading-block" data-block="rose-head" transform="translate(0 236)"><text class="se-heading" x="89" y="30"><tspan x="89">Make an indicator from red roses</tspan></text></g>
<g class="v2-reading-block" data-block="rose-intro-0" transform="translate(0 284)"><text class="se-copy" x="89" y="24"><tspan x="89">Can a flower supply a useful indicator? A coloured liquid obtained from a plant is</tspan><tspan x="89" dy="32">an <tspan class="se-bold">extract</tspan>. Preparing the extract and testing it are separate tasks: first collect the</tspan></text></g>
<g class="v2-reading-block" data-block="rose-intro-1" transform="translate(0 348)"><text class="se-copy" x="89" y="24"><tspan x="89">colour, then compare its behaviour in known samples. Water carries some of the</tspan><tspan x="89" dy="32">petal pigments into the liquid. Filtering removes petal pieces, which would</tspan><tspan x="89" dy="32">otherwise make it harder to compare colours through the glass.</tspan></text></g>
<g class="v2-reading-block" data-block="rose-prepare" transform="translate(0 460)"><rect class="se-activity-panel" x="89" y="0" width="874" height="722" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Collect a handful of fallen red rose petals, without plucking flowers. Use</tspan><tspan x="146" dy="32">clean, suitable petals selected by your teacher; wash them with water.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Crush the petals with a mortar and pestle. Put them in a heat-resistant</tspan><tspan x="146" dy="32">container.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Ask an adult to add enough hot water to cover the petals. Cover the</tspan><tspan x="146" dy="32">container and wait 5–10 minutes. Let it cool before handling.</tspan></text><text class="se-activity-step" x="132" y="320" text-anchor="end">4.</text><text class="se-copy" x="146" y="320"><tspan x="146">Filter the liquid into a clean container. The liquid that passes through is</tspan><tspan x="146" dy="32">the filtrate. Keep some untreated extract for comparison.</tspan></text><text class="se-copy" x="113" y="396"><tspan x="113">Only an adult handles hot water. Label the extract; it is for testing, not</tspan><tspan x="113" dy="32">drinking.</tspan></text><image class="science-illustration" data-photo="rose-extract" href="../../figures/class-7/science/ch02/rose-extract.png" x="364.75" y="448" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="693.88"><tspan x="113">Washed petals, a mortar and a filtered extract. Let hot equipment cool.</tspan></text></g>
<g class="v2-reading-block" data-block="extract-check-0" transform="translate(0 1204)"><text class="se-copy" x="89" y="24"><tspan x="89">Describe the colour of the fresh extract before testing it. Petal variety, freshness</tspan><tspan x="89" dy="32">and the amount of water can affect its appearance. An extract that is very pale or</tspan></text></g>
<g class="v2-reading-block" data-block="extract-check-1" transform="translate(0 1268)"><text class="se-copy" x="89" y="24"><tspan x="89">cloudy may give an unclear result. Checking it with known samples helps you</tspan><tspan x="89" dy="32">decide whether it is useful.</tspan></text></g>
<g class="v2-reading-block" data-block="filter-explanation-0" transform="translate(0 1348)"><text class="se-copy" x="89" y="24"><tspan x="89">During filtration, the paper holds back larger pieces while the coloured liquid</tspan><tspan x="89" dy="32">passes through. The colour does not have to disappear for filtration to work:</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
