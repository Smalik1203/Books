<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="17"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 17"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204"><tspan x="112">Use indicators and evidence to compare acidic, basic and neutral solutions.</tspan><tspan x="112" dy="32">Never taste or touch test samples to identify them.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278"><tspan x="112">Acidic samples turn blue litmus red; basic samples turn red litmus blue. Use</tspan><tspan x="112" dy="32">both papers and record unclear results.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352"><tspan x="112">Litmus comes from certain lichens. Plant extracts can also provide indicators,</tspan><tspan x="112" dy="32">but their performance needs checking.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426"><tspan x="112">A suitable red rose extract commonly becomes red-pink in acidic samples and</tspan><tspan x="112" dy="32">green in basic ones; compare with an untreated control.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500"><tspan x="112">Turmeric turns reddish-brown with a base. Remaining yellow does not</tspan><tspan x="112" dy="32">distinguish an acidic sample from a neutral one.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574"><tspan x="112">Olfactory indicators involve a change in detectable smell. They require safe</tspan><tspan x="112" dy="32">materials and may give inconclusive observations.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648"><tspan x="112">Neutralisation of an acid by a hydroxide base forms a salt and water and</tspan><tspan x="112" dy="32">releases heat. An excess of either reactant can remain.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722"><tspan x="112">Soil and wastewater treatment require tests and suitable expertise. A neutral</tspan><tspan x="112" dy="32">result does not mean a sample is safe.</tspan></text><text class="se-copy" x="89" y="796" text-anchor="start">•</text><text class="se-copy" x="112" y="796"><tspan x="112">A hidden-message demonstration uses a difference in indicator colour. Several</tspan><tspan x="112" dy="32">recipes may explain the same visible result.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">17</text></g></svg></div></div></section>
