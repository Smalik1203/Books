<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="plant-comparison-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">develop over time. Changing garden soil today will not instantly recolour every</tspan><tspan x="89" dy="32">flower. To compare two plants fairly, consider their variety, growing conditions</tspan><tspan x="89" dy="32">and the time of observation as well as the soil result.</tspan></text></g>
<g class="v2-reading-block" data-block="turmeric-head" transform="translate(0 236)"><text class="se-heading" x="89" y="30"><tspan x="89">What can turmeric tell us?</tspan></text></g>
<g class="v2-reading-block" data-block="turmeric-intro-0" transform="translate(0 284)"><text class="se-copy" x="89" y="24"><tspan x="89">Turmeric, or haldi, is a yellow spice from a plant in the ginger family. Its colour</tspan><tspan x="89" dy="32">can be carried on paper. Unlike a two-colour litmus test, this indicator has a</tspan></text></g>
<g class="v2-reading-block" data-block="turmeric-intro-1" transform="translate(0 348)"><text class="se-copy" x="89" y="24"><tspan x="89">useful limitation: two different kinds of sample can give the same visible result.</tspan><tspan x="89" dy="32">Keep a reference strip untreated so that drying, lighting or the original shade of</tspan><tspan x="89" dy="32">the paper is not mistaken for a reaction to a sample.</tspan></text></g>
<g class="v2-reading-block" data-block="turmeric-task" transform="translate(0 460)"><rect class="se-activity-panel" x="89" y="0" width="874" height="786" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Mix a spoonful of turmeric with a little water to make a paste. Fresh</tspan><tspan x="146" dy="32">turmeric may be ground instead, with adult help.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Dip filter paper in the paste until it becomes yellow. Lift it out and let it</tspan><tspan x="146" dy="32">dry. With adult supervision, cut it into strips.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Place a drop of each approved sample on a separate strip. Leave an</tspan><tspan x="146" dy="32">unused strip beside them for comparison.</tspan></text><text class="se-activity-step" x="132" y="320" text-anchor="end">4.</text><text class="se-copy" x="146" y="320"><tspan x="146">In your notebook, record the sample name and the final colour of its</tspan><tspan x="146" dy="32">strip. Group samples with a similar result, then compare with your litmus</tspan><tspan x="146" dy="32">groups.</tspan></text><text class="se-copy" x="113" y="428"><tspan x="113">Keep the paste and samples away from eyes and mouths. Use scissors</tspan><tspan x="113" dy="32">carefully. Do not treat a missing colour change as a failed experiment; it may</tspan><tspan x="113" dy="32">be evidence about the test.</tspan></text><image class="science-illustration" data-photo="turmeric" href="../../figures/class-7/science/ch02/turmeric.png" x="364.75" y="512" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="757.88"><tspan x="113">Turmeric paste and unused yellow paper strips, ready for testing.</tspan></text></g>
<g class="v2-reading-block" data-block="turmeric-result-0" transform="translate(0 1268)"><text class="se-copy" x="89" y="24"><tspan x="89">Turmeric paper usually turns reddish-brown with a basic solution. It stays yellow</tspan><tspan x="89" dy="32">with acidic and neutral solutions. It can therefore help identify a base, but an</tspan></text></g>
<g class="v2-reading-block" data-block="turmeric-result-1" transform="translate(0 1332)"><text class="se-copy" x="89" y="24"><tspan x="89">unchanged yellow strip cannot distinguish an acid from a neutral solution. Use</tspan><tspan x="89" dy="32">both litmus papers to make that comparison.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
