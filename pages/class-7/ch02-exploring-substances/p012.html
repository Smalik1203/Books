<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="mix-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">2.2 When Acids and Bases Meet</tspan></text></g>
<g class="v2-reading-block" data-block="mix-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">An indicator reports the state of a mixture at the time you test it. If you add an</tspan><tspan x="89" dy="32">acidic solution to a basic one, will the indicator keep its original colour? A</tspan></text></g>
<g class="v2-reading-block" data-block="mix-intro-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">drop-by-drop comparison helps you watch the change without assuming that</tspan><tspan x="89" dy="32">equal volumes must balance each other. A concentrated solution contains more</tspan></text></g>
<g class="v2-reading-block" data-block="mix-intro-2" transform="translate(0 298)"><text class="se-copy" x="89" y="24"><tspan x="89">dissolved substance in a given volume than a dilute one. Similar-looking drops</tspan><tspan x="89" dy="32">can therefore supply different amounts of the substances that react.</tspan></text></g>
<g class="v2-reading-block" data-block="mix-task" transform="translate(0 378)"><rect class="se-activity-panel" x="89" y="0" width="874" height="850" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Your teacher performs this demonstration with eye protection, dilute</tspan><tspan x="113" dy="32">prepared lime water and a stable test-tube rack. Do not prepare quicklime or</tspan><tspan x="113" dy="32">mix household cleaners.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">1.</text><text class="se-copy" x="146" y="200"><tspan x="146">Put one drop of lemon juice and about twenty drops of water in a test</tspan><tspan x="146" dy="32">tube. Observe its appearance; add a drop of blue litmus solution.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">2.</text><text class="se-copy" x="146" y="276"><tspan x="146">Record the colour. Add lime water one drop at a time, gently swirling</tspan><tspan x="146" dy="32">after each drop. Record the sequence of colours and approximate drop</tspan><tspan x="146" dy="32">count.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">3.</text><text class="se-copy" x="146" y="384"><tspan x="146">If the mixture becomes blue, stop adding lime water. Predict what adding</tspan><tspan x="146" dy="32">lemon juice might do. Add one drop, mix and observe; if needed,</tspan><tspan x="146" dy="32">continue a drop at a time.</tspan></text><text class="se-copy" x="113" y="492"><tspan x="113">Does one drop always reverse the colour? Compare your prediction with the</tspan><tspan x="113" dy="32">record. The teacher disposes of the mixtures as directed for the materials</tspan><tspan x="113" dy="32">used.</tspan></text><image class="science-illustration" data-photo="neutralisation" href="../../figures/class-7/science/ch02/neutralisation.png" x="364.75" y="576" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="821.88"><tspan x="113">Teacher demonstration: a small test tube, dropper and clear solutions before mixing.</tspan></text></g>
<g class="v2-reading-block" data-block="neutralisation-meaning-0" transform="translate(0 1250)"><text class="se-copy" x="89" y="24"><tspan x="89">In <tspan class="se-bold">neutralisation</tspan>, an acid reacts with a base. For the acid and hydroxide base</tspan><tspan x="89" dy="32">used here, the reaction forms a salt and water and releases heat. The amount</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
