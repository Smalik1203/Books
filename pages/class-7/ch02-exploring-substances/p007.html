<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="filter-explanation-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">dissolved pigment can remain in the filtrate. Compare the filtered extract with</tspan><tspan x="89" dy="32">the liquid containing petals. Which one gives a clearer view of a later colour</tspan></text></g>
<g class="v2-reading-block" data-block="filter-explanation-2" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">change? This separates removing solid pieces from removing every substance in</tspan><tspan x="89" dy="32">the liquid.</tspan></text></g>
<g class="v2-reading-block" data-block="rose-test" transform="translate(0 256)"><rect class="se-activity-panel" x="89" y="0" width="874" height="522" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Put the same amount of cooled red rose extract, about 10–20 drops, into</tspan><tspan x="146" dy="32">three small transparent containers. Label them A, B and control.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Add about 20–30 drops of lemon juice to A and the same number of drops</tspan><tspan x="146" dy="32">of soap solution to B. Keep the control unchanged. Use clean droppers.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Compare all three against white paper in the same light. Record the</tspan><tspan x="146" dy="32">sample, the observed colour and the nature suggested by your earlier</tspan><tspan x="146" dy="32">litmus test.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352"><tspan x="146">Test the remaining approved samples in fresh portions of extract. Keep</tspan><tspan x="146" dy="32">the extract amount and sample amount alike across comparisons.</tspan></text><text class="se-copy" x="113" y="428"><tspan x="113">Do the samples that affected blue litmus show a similar rose-extract colour?</tspan><tspan x="113" dy="32">What about samples that affected red litmus? Record disagreement rather</tspan><tspan x="113" dy="32">than changing a result to match your prediction.</tspan></text></g>
<g class="v2-reading-block" data-block="rose-guide" transform="translate(0 800)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 2.3 Read the rose test alongside the litmus test</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Notebook column</tspan></text><text class="v2-table-heading" x="338.98" y="76.08"><tspan x="338.98">What to enter</tspan></text><text class="v2-table-heading" x="653.62" y="76.08"><tspan x="653.62">Why it matters</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Sample</tspan></text><text class="se-copy se-table-copy" x="338.98" y="128.07999999999998"><tspan x="338.98">Its name or approved code</tspan></text><text class="se-copy se-table-copy" x="653.62" y="128.07999999999998"><tspan x="653.62">Keeps observations traceable</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="146" y2="146"/><text class="se-copy se-table-copy" x="103" y="180.07999999999998"><tspan x="103">Rose extract colour</tspan></text><text class="se-copy se-table-copy" x="338.98" y="180.07999999999998"><tspan x="338.98">What you saw; compare</tspan><tspan x="338.98" dy="28">with control</tspan></text><text class="se-copy se-table-copy" x="653.62" y="180.07999999999998"><tspan x="653.62">Separates observation from a</tspan><tspan x="653.62" dy="28">name</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="226" y2="226"/><text class="se-copy se-table-copy" x="103" y="260.08"><tspan x="103">Suggested nature</tspan></text><text class="se-copy se-table-copy" x="338.98" y="260.08"><tspan x="338.98">Acidic, basic or uncertain</tspan></text><text class="se-copy se-table-copy" x="653.62" y="260.08"><tspan x="653.62">Check against both litmus</tspan><tspan x="653.62" dy="28">results</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="306" y2="306"/><rect class="v2-table-frame" x="89" y="42" width="874" height="264"/><line class="v2-table-rule" x1="324.98" x2="324.98" y1="42" y2="306"/><line class="v2-table-rule" x1="639.62" x2="639.62" y1="42" y2="306"/><text class="v2-table-note" x="89" y="338.88"><tspan x="89">This is a recording guide. Compare down only after completing your own observations.</tspan></text></g>
<g class="v2-reading-block" data-block="rose-evidence-example-0" transform="translate(0 1164)"><text class="se-copy" x="89" y="24"><tspan x="89">Imagine that a very dark fruit juice makes the mixture look red before the</tspan><tspan x="89" dy="32">indicator has a clear effect. A red appearance alone would not show which</tspan></text></g>
<g class="v2-reading-block" data-block="rose-evidence-example-1" transform="translate(0 1228)"><text class="se-copy" x="89" y="24"><tspan x="89">material supplied that colour. Look at a small portion of the sample without</tspan><tspan x="89" dy="32">indicator as well as the untreated extract. A separate litmus test provides another</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
