<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="19"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 19"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q6" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">6.</text><text class="se-copy" x="132" y="24"><tspan x="132">Suggest two possible pairs of writing liquid and revealing indicator for a</tspan><tspan x="132" dy="32">hidden message. In your notebook, make a table naming each pair and the</tspan><tspan x="132" dy="32">predicted colour. Explain how you would test the prediction safely.</tspan></text></g>
<g class="v2-reading-block" data-block="q7" transform="translate(0 238)"><text class="se-copy" x="111" y="24" text-anchor="end">7.</text><text class="se-copy" x="132" y="24"><tspan x="132">Grape juice turns red rose extract reddish. Baking soda solution is added</tspan><tspan x="132" dy="32">gradually. What changes might occur if enough is added? Explain why the</tspan><tspan x="132" dy="32">starting amounts and concentrations matter.</tspan></text></g>
<g class="v2-reading-block" data-block="q8" transform="translate(0 364)"><text class="se-copy" x="111" y="24" text-anchor="end">8.</text><text class="se-copy" x="132" y="24"><tspan x="132">Keerthi writes with orange juice and lets it dry. Suggest an indicator that</tspan><tspan x="132" dy="32">could help reveal the acidic writing. Why would turmeric alone be a poor</tspan><tspan x="132" dy="32">choice? Describe a control patch.</tspan></text></g>
<g class="v2-reading-block" data-block="q9" transform="translate(0 490)"><text class="se-copy" x="111" y="24" text-anchor="end">9.</text><text class="se-copy" x="132" y="24"><tspan x="132">Describe how to prepare one natural indicator. State the materials, the safety</tspan><tspan x="132" dy="32">precautions and how you would check that the preparation works.</tspan></text></g>
<g class="v2-reading-block" data-block="q10" transform="translate(0 584)"><text class="se-copy" x="111" y="24" text-anchor="end">10.</text><text class="se-copy" x="132" y="24"><tspan x="132">You have vinegar, baking soda solution and sugar solution. What can unused</tspan><tspan x="132" dy="32">turmeric paper identify directly, and what can it not distinguish? Suggest a</tspan><tspan x="132" dy="32">further test.</tspan></text></g>
<g class="v2-reading-block" data-block="q11" transform="translate(0 710)"><text class="se-copy" x="111" y="24" text-anchor="end">11.</text><text class="se-copy" x="132" y="24"><tspan x="132">Liquid X turns red rose extract green. What is its likely nature? Predict what</tspan><tspan x="132" dy="32">sufficient excess amla juice might do to the colour, and explain your</tspan><tspan x="132" dy="32">reasoning.</tspan></text></g>
<g class="v2-reading-block" data-block="q12" transform="translate(0 836)"><text class="se-copy" x="111" y="24" text-anchor="end">12.</text><text class="se-copy" x="132" y="24"><tspan x="132">Reconstruct this decision map in your notebook: poor plant growth → test soil</tspan><tspan x="132" dy="32">→ compare the result with the crop’s needs → choose a response. Name a</tspan><tspan x="132" dy="32">suitable indicator or soil test; describe responses for overly acidic and overly</tspan><tspan x="132" dy="32">basic soil. Add a branch for soil near the required range.</tspan></text></g><g transform="translate(0 994)"><g data-page-illustration="figures/class-7/science/ch02/rose-extract.png"><image class="science-illustration" href="../../figures/class-7/science/ch02/rose-extract.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Preparing a flower extract.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Preparing a flower extract.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">19</text></g></svg></div></div></section>
