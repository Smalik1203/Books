<section class="page page--food page--science-editorial page--science-v2 page--g7-ch02" data-folio="19"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Exploring Substances: Acidic, Basic, and Neutral, page 19"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-drop-motif" transform="translate(26 7) scale(.36)"><path d="M28 8C22 24 4 39 4 55a24 24 0 0 0 48 0C52 39 34 24 28 8Z M17 54a11 11 0 0 0 11 11"/><path d="M56 92h33M63 85v39a14 14 0 0 0 28 0V85M64 111h26"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 2</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Exploring Substances</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="550" rx="18"/><text class="se-copy" x="113" y="222" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Acidic</tspan> — A solution nature that can</tspan><tspan x="113" dy="32" data-paragraph-end="true">turn blue litmus red.</tspan></text><text class="se-copy" x="113" y="306" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Basic</tspan> — A solution nature that can</tspan><tspan x="113" dy="32" data-narrow-prose="true">turn red litmus blue; also called</tspan><tspan x="113" dy="32" data-paragraph-end="true">alkaline.</tspan></text><text class="se-copy" x="113" y="422" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Neutral</tspan> — Neither acidic nor basic;</tspan><tspan x="113" dy="32" data-paragraph-end="true">not a synonym for safe.</tspan></text><text class="se-copy" x="113" y="506" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Indicator</tspan> — A substance whose</tspan><tspan x="113" dy="32" data-narrow-prose="true">observable response helps identify a</tspan><tspan x="113" dy="32" data-paragraph-end="true">solution’s nature.</tspan></text><text class="se-copy" x="113" y="622" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Extract</tspan> — A preparation containing</tspan><tspan x="113" dy="32" data-narrow-prose="true">substances drawn out of a material,</tspan><tspan x="113" dy="32" data-paragraph-end="true">such as petals.</tspan></text><text class="se-copy" x="541" y="222" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Filtrate</tspan> — The liquid that passes</tspan><tspan x="541" dy="32" data-paragraph-end="true">through a filter.</tspan></text><text class="se-copy" x="541" y="306" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Olfactory</tspan> <tspan class="se-bold">indicator</tspan> — An indicator</tspan><tspan x="541" dy="32" data-narrow-prose="true">used through a change in detectable</tspan><tspan x="541" dy="32" data-paragraph-end="true">smell.</tspan></text><text class="se-copy" x="541" y="422" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Neutralisation</tspan> — A reaction in</tspan><tspan x="541" dy="32" data-narrow-prose="true">which an acid and a base react with</tspan><tspan x="541" dy="32" data-paragraph-end="true">one another.</tspan></text><text class="se-copy" x="541" y="538" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Control</tspan> — A comparison kept</tspan><tspan x="541" dy="32" data-narrow-prose="true">unchanged, or a known reference,</tspan><tspan x="541" dy="32" data-paragraph-end="true">used to interpret a test.</tspan></text><text class="se-copy" x="541" y="654" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Lime</tspan> <tspan class="se-bold">water</tspan> — A solution of calcium</tspan><tspan x="541" dy="32" data-paragraph-end="true">hydroxide in water, not a fruit juice.</tspan></text><g transform="translate(0 724)"><g data-page-illustration="figures/class-7/science/ch01-v2/cutouts/lemon.png"><image class="science-illustration" href="../../figures/class-7/science/ch01-v2/cutouts/lemon.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Acidity is one property of lemon juice.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Acidity is one property of lemon juice.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">19</text></g></svg></div></div></section>
