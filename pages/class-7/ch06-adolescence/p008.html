<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="feelings-choice-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Feelings do not dictate actions. Anger need not lead to harm, nor curiosity to</tspan><tspan x="89" dy="32">risk. Pause, name the feeling and consider another viewpoint. Creative interests</tspan><tspan x="89" dy="32">can support learning and cooperation.</tspan></text></g>
<g class="v2-reading-block" data-block="feelings-help-0" transform="translate(0 224)"><text class="se-copy" x="89" y="24"><tspan x="89">Support matters when sadness, worry or other feelings persist, interfere with</tspan><tspan x="89" dy="32">everyday life or feel difficult to manage. Speak to a trusted adult, counsellor or</tspan></text></g>
<g class="v2-reading-block" data-block="feelings-help-1" transform="translate(0 288)"><text class="se-copy" x="89" y="24"><tspan x="89">health professional. Asking for help is a useful action, not a personal failure.</tspan><tspan x="89" dy="32">Respect another person’s privacy when they seek support.</tspan></text></g>
<g class="v2-reading-block" data-block="wellbeing-head" transform="translate(0 380)"><text class="v2-title" x="89" y="38"><tspan x="89">6.4 Caring for Health and Well-being</tspan></text></g>
<g class="v2-reading-block" data-block="wellbeing-0" transform="translate(0 438)"><text class="se-copy" x="89" y="24"><tspan x="89">Food, hygiene, movement, relationships and access to help contribute to</tspan><tspan x="89" dy="32">well-being. Healthy habits take practice and support. A useful plan fits a person’s</tspan><tspan x="89" dy="32">needs; it does not depend on looking like someone else.</tspan></text></g>
<g class="v2-reading-block" data-block="nutrition-head" transform="translate(0 562)"><text class="se-heading" x="89" y="30"><tspan x="89">6.4.1 Meeting Nutritional Needs</tspan></text></g>
<g class="v2-reading-block" data-block="nutrition-0" transform="translate(0 610)"><text class="se-copy" x="89" y="24"><tspan x="89">A growing body needs a varied diet. Carbohydrates and fats supply energy;</tspan><tspan x="89" dy="32">proteins support growth and repair. Vitamins and minerals help many body</tspan></text></g>
<g class="v2-reading-block" data-block="nutrition-1" transform="translate(0 674)"><text class="se-copy" x="89" y="24"><tspan x="89">processes. Calcium supports bones, and iron is needed to make haemoglobin,</tspan><tspan x="89" dy="32">the substance in red blood cells that carries oxygen.</tspan></text></g>
<g class="v2-reading-block" data-block="food-task" transform="translate(0 754)"><rect class="se-activity-panel" x="89" y="0" width="874" height="306" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">List affordable local foods and seasonal choices in your notebook. Do not</tspan><tspan x="146" dy="32">compare classmates’ lunches or family spending.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Identify nutrients and their functions using a reliable food guide, label or</tspan><tspan x="146" dy="32">teacher’s guidance. Record your information source.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Compare with Table 6.3. Suggest a varied day’s meals and explain why</tspan><tspan x="146" dy="32">several foods are needed.</tspan></text></g><g transform="translate(0 1082)"><g data-page-illustration="figures/class-7/science/ch06/support.png"><image class="science-illustration" href="../../figures/class-7/science/ch06/support.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Talking with a trusted adult.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Talking with a trusted adult.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text
