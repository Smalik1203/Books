<tspan dx="6.09395"> for</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">everyone.</tspan></text><text class="se-copy" x="89" y="310" text-anchor="start">•</text><text class="se-copy" x="112" y="310" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="4.40344" data-space-ratio="1.787">Height,<tspan dx="4.40344"> body</tspan><tspan dx="4.40344"> shape,</tspan><tspan dx="4.40344"> voice,</tspan><tspan dx="4.40344"> skin</tspan><tspan dx="4.40344"> and</tspan><tspan dx="4.40344"> hair</tspan><tspan dx="4.40344"> may</tspan><tspan dx="4.40344"> change.</tspan><tspan dx="4.40344"> Variation</tspan><tspan dx="4.40344"> is</tspan><tspan dx="4.40344"> expected,</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">and people deserve privacy and respect.</tspan></text><text class="se-copy" x="89" y="384" text-anchor="start">•</text><text class="se-copy" x="112" y="384" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="9.40383" data-space-ratio="2.682">Secondary<tspan dx="9.40383"> sexual</tspan><tspan dx="9.40383"> characteristics</tspan><tspan dx="9.40383"> develop</tspan><tspan dx="9.40383"> during</tspan><tspan dx="9.40383"> puberty</tspan><tspan dx="9.40383"> but</tspan><tspan dx="9.40383"> are</tspan><tspan dx="9.40383"> not</tspan><tspan dx="9.40383"> the</tspan></tspan><tspan x="112" dy="32" data-justify-width="851" data-natural-space="5.59200" data-extra-space="6.29476" data-space-ratio="2.126">reproductive<tspan dx="6.29476"> organs.</tspan><tspan dx="6.29476"> Puberty</tspan><tspan dx="6.29476"> brings</tspan><tspan dx="6.29476"> reproductive</tspan><tspan dx="6.29476"> capability;</tspan><tspan dx="6.29476"> this</tspan><tspan dx="6.29476"> is</tspan><tspan dx="6.29476"> not</tspan><tspan dx="6.29476"> the</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">same as readiness for adult responsibilities.</tspan></text><text class="se-copy" x="89" y="490" text-anchor="start">•</text><text class="se-copy" x="112" y="490" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="2.45312" data-space-ratio="1.439">Menstruation<tspan dx="2.45312"> is</tspan><tspan dx="2.45312"> one</tspan><tspan dx="2.45312"> phase</tspan><tspan dx="2.45312"> of</tspan><tspan dx="2.45312"> the</tspan><tspan dx="2.45312"> menstrual</tspan><tspan dx="2.45312"> cycle.</tspan><tspan dx="2.45312"> Teen</tspan><tspan dx="2.45312"> cycles</tspan><tspan dx="2.45312"> commonly</tspan><tspan dx="2.45312"> last</tspan></tspan><tspan x="112" dy="32" data-justify-width="851" data-natural-space="5.59200" data-extra-space="0.94859" data-space-ratio="1.170">21–45<tspan dx="0.94859"> days,</tspan><tspan dx="0.94859"> with</tspan><tspan dx="0.94859"> variation</tspan><tspan dx="0.94859"> especially</tspan><tspan dx="0.94859"> early</tspan><tspan dx="0.94859"> on.</tspan><tspan dx="0.94859"> Menopause</tspan><tspan dx="0.94859"> usually</tspan><tspan dx="0.94859"> occurs</tspan><tspan dx="0.94859"> much</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">later, between ages 45 and 55.</tspan></text><text class="se-copy" x="89" y="596" text-anchor="start">•</text><text class="se-copy" x="112" y="596" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="2.19514" data-space-ratio="1.393">Feelings<tspan dx="2.19514"> can</tspan><tspan dx="2.19514"> influence</tspan><tspan dx="2.19514"> behaviour,</tspan><tspan dx="2.19514"> but</tspan><tspan dx="2.19514"> we</tspan><tspan dx="2.19514"> can</tspan><tspan dx="2.19514"> pause,</tspan><tspan dx="2.19514"> consider</tspan><tspan dx="2.19514"> choices</tspan><tspan dx="2.19514"> and</tspan><tspan dx="2.19514"> ask</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">for support. No single emotional pattern describes every adolescent.</tspan></text><text class="se-copy" x="89" y="670" text-anchor="start">•</text><text class="se-copy" x="112" y="670" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="0.73335" data-space-ratio="1.131">A<tspan dx="0.73335"> varied</tspan><tspan dx="0.73335"> diet</tspan><tspan dx="0.73335"> supplies</tspan><tspan dx="0.73335"> energy,</tspan><tspan dx="0.73335"> protein,</tspan><tspan dx="0.73335"> vitamins</tspan><tspan dx="0.73335"> and</tspan><tspan dx="0.73335"> minerals.</tspan><tspan dx="0.73335"> Iron</tspan><tspan dx="0.73335"> and</tspan><tspan dx="0.73335"> vitamin</tspan></tspan><tspan x="112" dy="32" data-justify-width="851" data-natural-space="5.59200" data-extra-space="15.54938" data-space-ratio="3.781">B12<tspan dx="15.54938"> help</tspan><tspan dx="15.54938"> healthy</tspan><tspan dx="15.54938"> blood</tspan><tspan dx="15.54938"> formation;</tspan><tspan dx="15.54938"> concerns</tspan><tspan dx="15.54938"> about</tspan><tspan dx="15.54938"> deficiencies</tspan><tspan dx="15.54938"> need</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">appropriate assessment.</tspan></text><text class="se-copy" x="89" y="776" text-anchor="start">•</text><text class="se-copy" x="112" y="776" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="3.42503" data-space-ratio="1.612">Hygiene,<tspan dx="3.42503"> menstrual</tspan><tspan dx="3.42503"> supplies,</tspan><tspan dx="3.42503"> private</tspan><tspan dx="3.42503"> facilities,</tspan><tspan dx="3.42503"> safe</tspan><tspan dx="3.42503"> disposal,</tspan><tspan dx="3.42503"> physical</tspan><tspan dx="3.42503"> activity</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">and rest support health and participation.</tspan></text><text class="se-copy" x="89" y="850" text-anchor="start">•</text><text class="se-copy" x="112" y="850" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="3.83915" data-space-ratio="1.687">Respect<tspan dx="3.83915"> boundaries</tspan><tspan dx="3.83915"> and</tspan><tspan dx="3.83915"> privacy</tspan><tspan dx="3.83915"> in</tspan><tspan dx="3.83915"> person</tspan><tspan dx="3.83915"> and</tspan><tspan dx="3.83915"> online.</tspan><tspan dx="3.83915"> Do</tspan><tspan dx="3.83915"> not</tspan><tspan dx="3.83915"> share</tspan><tspan dx="3.83915"> harmful</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">messages or private images; seek trusted help for bullying.</tspan></text><text class="se-copy" x="89" y="924" text-anchor="start">•</text><text class="se-copy" x="112" y="924" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="4.77857" data-space-ratio="1.855">Avoid<tspan dx="4.77857"> tobacco,</tspan><tspan dx="4.77857"> alcohol</tspan><tspan dx="4.77857"> and</tspan><tspan dx="4.77857"> harmful</tspan><tspan dx="4.77857"> drugs.</tspan><tspan dx="4.77857"> Addiction</tspan><tspan dx="4.77857"> needs</tspan><tspan dx="4.77857"> supportive</tspan><tspan dx="4.77857"> care,</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">not blame. Trusted adults and health services can help.</tspan></text><text class="se-copy" x="89" y="998" text-anchor="start">•</text><text class="se-copy" x="112" y="998" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="8.25472" data-space-ratio="2.476">Hormones<tspan dx="8.25472"> help</tspan><tspan dx="8.25472"> coordinate</tspan><tspan dx="8.25472"> growth</tspan><tspan dx="8.25472"> and</tspan><tspan dx="8.25472"> puberty.</tspan><tspan dx="8.25472"> Reliable</tspan><tspan dx="8.25472"> information</tspan><tspan dx="8.25472"> and</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">guidance help young people understand changes and make informed choices.</
