<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="17"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 17"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="assessment-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Let Us Enhance Our Learning</tspan></text></g>
<g class="v2-reading-block" data-block="assessment-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Use your notebook. Support each answer with evidence and explain any</tspan><tspan x="89" dy="32">uncertainty.</tspan></text></g>
<g class="v2-reading-block" data-block="q1" transform="translate(0 250)"><text class="se-copy" x="111" y="24" text-anchor="end">1.</text><text class="se-copy" x="132" y="24"><tspan x="132">Ramesh, aged 11, notices pimples on his face. (a) Explain how changes</tspan><tspan x="132" dy="32">during puberty may contribute to acne. (b) Suggest gentle skin-care habits</tspan><tspan x="132" dy="32">and explain when he should seek professional advice.</tspan></text></g>
<g class="v2-reading-block" data-block="q2" transform="translate(0 376)"><text class="se-copy" x="111" y="24" text-anchor="end">2.</text><text class="se-copy" x="132" y="24"><tspan x="132">Compare the two food arrangements below. Which offers a better starting</tspan><tspan x="132" dy="32">point for varied everyday meals during adolescence, and why? Discuss</tspan><tspan x="132" dy="32">nutrients, variety and portions; do not judge a person’s diet from one meal.</tspan></text><image class="science-illustration" data-photo="food-choices" href="../../figures/class-7/science/ch06/food-choices.png" x="286" y="112" width="480" height="320" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="457.88"><tspan x="89">(i) Burger, fries, pizza and doughnuts. (ii) A meal with grains, dal, vegetables, salad and curd.</tspan></text></g>
<g class="v2-reading-block" data-block="q3" transform="translate(0 866)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24"><tspan x="132">Unscramble the words in your notebook. (a) The shedding of the uterine</tspan><tspan x="132" dy="32">lining with blood is nstmnoiaretu. (b) Growth of the iceov xob can change the</tspan><tspan x="132" dy="32">voice. (c) Physical development towards reproductive capability is urtypeb.</tspan><tspan x="132" dy="32">(d) We should avoid lahoclo and harmful srugd. Explain one answer in your</tspan><tspan x="132" dy="32">own words.</tspan></text></g>
<g class="v2-reading-block" data-block="q4" transform="translate(0 1056)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24"><tspan x="132">Shalu says, “Adolescence brings only physical changes, such as growing taller</tspan><tspan x="132" dy="32">or developing body hair.” Is this complete? Rewrite her description to include</tspan><tspan x="132" dy="32">other kinds of development.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">17</text></g></svg></div></div></section>
