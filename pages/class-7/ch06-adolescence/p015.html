<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="646" rx="18"/><text class="se-copy" x="113" y="222"><tspan x="113"><tspan class="se-bold">Adolescence</tspan> — The stage between</tspan><tspan x="113" dy="32">childhood and adulthood, usually</tspan><tspan x="113" dy="32">defined as ages 10–19.</tspan></text><text class="se-copy" x="113" y="338"><tspan x="113"><tspan class="se-bold">Puberty</tspan> — Physical changes through</tspan><tspan x="113" dy="32">which the body develops</tspan><tspan x="113" dy="32">reproductive capability.</tspan></text><text class="se-copy" x="113" y="454"><tspan x="113"><tspan class="se-bold">Secondary</tspan> <tspan class="se-bold">sexual</tspan> <tspan class="se-bold">characteristics</tspan> —</tspan><tspan x="113" dy="32">Features developing at puberty that</tspan><tspan x="113" dy="32">are not the reproductive organs</tspan><tspan x="113" dy="32">themselves.</tspan></text><text class="se-copy" x="113" y="602"><tspan x="113"><tspan class="se-bold">Larynx</tspan> — The voice box, containing</tspan><tspan x="113" dy="32">the vocal folds that vibrate to</tspan><tspan x="113" dy="32">produce sound.</tspan></text><text class="se-copy" x="113" y="718"><tspan x="113"><tspan class="se-bold">Acne</tspan> — A skin condition involving</tspan><tspan x="113" dy="32">blocked follicles and inflammation,</tspan><tspan x="113" dy="32">often producing pimples.</tspan></text><text class="se-copy" x="541" y="222"><tspan x="541"><tspan class="se-bold">Menstruation</tspan> — The shedding of</tspan><tspan x="541" dy="32">part of the uterine lining, with</tspan><tspan x="541" dy="32">blood, through the vagina.</tspan></text><text class="se-copy" x="541" y="338"><tspan x="541"><tspan class="se-bold">Menopause</tspan> — The natural end of</tspan><tspan x="541" dy="32">menstrual periods later in adult life.</tspan></text><text class="se-copy" x="541" y="422"><tspan x="541"><tspan class="se-bold">Hormones</tspan> — Chemical messengers</tspan><tspan x="541" dy="32">that help regulate body processes.</tspan></text><text class="se-copy" x="541" y="506"><tspan x="541"><tspan class="se-bold">Anaemia</tspan> — A condition in which</tspan><tspan x="541" dy="32">blood has too few healthy red blood</tspan><tspan x="541" dy="32">cells or too little haemoglobin to</tspan><tspan x="541" dy="32">carry oxygen effectively.</tspan></text><text class="se-copy" x="541" y="654"><tspan x="541"><tspan class="se-bold">Addiction</tspan> — Difficulty controlling</tspan><tspan x="541" dy="32">substance use despite harm, often</tspan><tspan x="541" dy="32">with strong urges.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">15</text></g></svg></div></div></section>
