<g class="v2-reading-block" data-block="puberty" transform="translate(0 160)"><g data-table-spacing="airy" data-comparison-table="puberty"><text class="v2-table-caption" x="89" y="33.6"><tspan x="89">Puberty and adolescence</tspan></text><rect class="se-table-head" x="89" y="54" width="874" height="48"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="86.08"><tspan x="103">Puberty</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="540" y="86.08"><tspan x="540">Adolescence</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="102" y2="102"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="134.07999999999998"><tspan x="103"><tspan class="se-bold">Puberty</tspan> is the process of physical</tspan><tspan x="103" dy="28">changes through which the body</tspan><tspan x="103" dy="28">becomes capable of reproduction. It</tspan><tspan x="103" dy="28">includes internal changes as well as</tspan><tspan x="103" dy="28">visible ones.</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="134.07999999999998"><tspan x="540">Adolescence is broader: it also includes</tspan><tspan x="540" dy="28">emotional and social development.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="262" y2="262"/><rect class="v2-table-frame" x="89" y="54" width="874" height="208"/><line class="v2-table-rule" x1="526" x2="526" y1="54" y2="262"/><text class="v2-table-note" x="89" y="302.88"><tspan x="89">Reproductive maturity does not mean that a young person is ready for marriage or</tspan><tspan x="89" dy="26">parenthood.</tspan></text></g></g>
