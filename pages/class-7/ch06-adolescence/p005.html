<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="secondary-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">development and changes in facial hair and voice. These traits vary and should</tspan><tspan x="89" dy="32">not be used to label or judge individuals.</tspan></text></g>
<g class="v2-reading-block" data-block="timing-pause" transform="translate(0 192)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="230" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Two learners of the same age differ in height and voice. Does being taller</tspan><tspan x="113" dy="32">mean being more mature in every way? What evidence is missing?</tspan></text><text class="se-copy" x="113" y="168"><tspan x="113">Explain why appearance alone cannot establish health, emotional readiness</tspan><tspan x="113" dy="32">or abilities. Suggest a respectful response.</tspan></text></g>
<g class="v2-reading-block" data-block="reproductive-head" transform="translate(0 456)"><text class="v2-title" x="89" y="38"><tspan x="89">6.2 Reproductive Development</tspan></text></g>
<g class="v2-reading-block" data-block="internal-0" transform="translate(0 514)"><text class="se-copy" x="89" y="24"><tspan x="89">During puberty, reproductive organs mature gradually. These internal changes</tspan><tspan x="89" dy="32">cannot all be seen from outside. In girls, the beginning of the <tspan class="se-bold">menstrual</tspan> <tspan class="se-bold">cycle</tspan> is</tspan></text></g>
<g class="v2-reading-block" data-block="internal-1" transform="translate(0 578)"><text class="se-copy" x="89" y="24"><tspan x="89">one sign of this development. The cycle is a recurring sequence of changes</tspan><tspan x="89" dy="32">involving the ovaries and the uterus.</tspan></text></g>
<g class="v2-reading-block" data-block="menstruation-0" transform="translate(0 658)"><text class="se-copy" x="89" y="24"><tspan x="89">The uterus develops an inner lining. When pregnancy does not occur, some of</tspan><tspan x="89" dy="32">this lining leaves the body with blood through the vagina. This is <tspan class="se-bold">menstruation</tspan>,</tspan></text></g>
<g class="v2-reading-block" data-block="menstruation-1" transform="translate(0 722)"><text class="se-copy" x="89" y="24"><tspan x="89">also called a period. Menstrual blood is not dirty or poisonous. Menstruation is a</tspan><tspan x="89" dy="32">normal body process, not an illness.</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-figure" transform="translate(0 802)"><g class="v2-change-diagram" data-diagram="cycle"><path class="v2-change-line" d="M172 94L883 94"/><path class="v2-change-line" d="M875 88L883 94L875 100"/><path class="v2-change-line" d="M220 72V116M820 72V116"/><text class="v2-change-label se-bold" x="264" y="39" text-anchor="middle">First day of one period</text><text class="v2-change-label se-bold" x="784" y="39" text-anchor="middle">First day of next period</text><text class="v2-change-label" x="264" y="154" text-anchor="middle">Start counting here</text><text class="v2-change-label" x="784" y="154" text-anchor="middle">A new cycle starts</text><text class="v2-change-label se-bold" x="526" y="210" text-anchor="middle">One menstrual cycle</text></g><text class="se-caption" x="89" y="260.88"><tspan x="89">Count a menstrual cycle from the first day of one period to the first day of the next. The</tspan><tspan x="89" dy="27">interval is not identical for everyone.</tspan></text></g><g transform="translate(0 1118)"><g data-page-illustration="figures/class-7/science/ch06/support.png"><image class="science-illustration" href="../../figures/class-7/science/ch06/support.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Talking with a trusted adult.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Talking with a trusted adult.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">5</text></g></svg></div></div></section>
