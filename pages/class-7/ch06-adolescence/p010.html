<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="anaemia-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Too little iron or vitamin B12 can contribute to <tspan class="se-bold">anaemia</tspan>, in which the blood has</tspan><tspan x="89" dy="32">too few healthy red blood cells or too little haemoglobin to carry oxygen</tspan></text></g>
<g class="v2-reading-block" data-block="anaemia-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">effectively. Anaemia also has other causes. Tiredness alone cannot diagnose it. A</tspan><tspan x="89" dy="32">health professional can assess a concern and advise suitable care.</tspan></text></g>
<g class="v2-reading-block" data-block="nutrition-schemes-0" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">Find out how your school or local health centre supports good nutrition. India’s</tspan><tspan x="89" dy="32">Weekly Iron and Folic Acid Supplementation programme and Anaemia Mukt</tspan></text></g>
<g class="v2-reading-block" data-block="nutrition-schemes-1" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89">Bharat include measures to reduce anaemia. Ask the teacher or health worker</tspan><tspan x="89" dy="32">how the local programme works. Take supplements only through appropriate</tspan><tspan x="89" dy="32">professional or programme guidance.</tspan></text></g>
<g class="v2-reading-block" data-block="hodgkin-0" transform="translate(0 432)"><text class="se-copy" x="89" y="24"><tspan x="89">Dorothy Crowfoot Hodgkin used X-ray studies to work out the structures of</tspan><tspan x="89" dy="32">important molecules, including vitamin B12. She received the 1964 Nobel Prize in</tspan></text></g>
<g class="v2-reading-block" data-block="hodgkin-1" transform="translate(0 496)"><text class="se-copy" x="89" y="24"><tspan x="89">Chemistry and was the third woman to receive that chemistry prize. Her work</tspan><tspan x="89" dy="32">connects molecular structure with health. We need dietary sources of B12;</tspan><tspan x="89" dy="32">discuss suitable foods with your teacher.</tspan></text></g>
<g class="v2-reading-block" data-block="hygiene-head" transform="translate(0 620)"><text class="se-heading" x="89" y="30"><tspan x="89">6.4.2 Personal and Menstrual Hygiene</tspan></text></g>
<g class="v2-reading-block" data-block="body-hygiene-0" transform="translate(0 668)"><text class="se-copy" x="89" y="24"><tspan x="89">Bathe regularly, change into clean clothes and wash hands at appropriate times.</tspan><tspan x="89" dy="32">Gently clean areas where sweat collects, including the armpits and external</tspan></text></g>
<g class="v2-reading-block" data-block="body-hygiene-1" transform="translate(0 732)"><text class="se-copy" x="89" y="24"><tspan x="89">genital region. Cleanliness supports comfort and health; strong perfumes and</tspan><tspan x="89" dy="32">harsh products are not substitutes for washing. Everyone deserves private,</tspan><tspan x="89" dy="32">accessible washing and toilet facilities.</tspan></text></g>
<g class="v2-reading-block" data-block="hygiene-art" transform="translate(0 844)"><image class="science-illustration" data-photo="hygiene" href="../../figures/class-7/science/ch06/hygiene.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Clean pads, washing supplies and a covered bin are parts of practical menstrual hygiene</tspan><tspan x="89" dy="27">support.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
