<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="hygiene-art" transform="translate(0 112)"><image class="science-illustration" data-photo="hygiene" href="../../figures/class-7/science/ch06/hygiene.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Clean pads, washing supplies and a covered bin are parts of practical menstrual hygiene</tspan><tspan x="89" dy="27">support.</tspan></text></g>
<g class="v2-reading-block" data-block="pad-comparison" transform="translate(0 474)"><g data-comparison-table="pad-comparison"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Using and caring for menstrual pads</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="260.32" y="70.08"><tspan x="260.32">Disposable pads</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="618.6600000000001" y="70.08"><tspan x="618.6600000000001">Reusable cloth pads</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Use and</tspan><tspan x="103" dy="28">changing</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="110.08"><tspan x="260.32">Use a clean pad and change it</tspan><tspan x="260.32" dy="28">regularly, sooner if wet or soiled.</tspan><tspan x="260.32" dy="28">Follow product guidance.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="110.08"><tspan x="618.6600000000001">Use a clean, dry pad made for</tspan><tspan x="618.6600000000001" dy="28">this purpose. Change it</tspan><tspan x="618.6600000000001" dy="28">regularly.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="206.07999999999998"><tspan x="103">After use</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="206.07999999999998"><tspan x="260.32">Wrap a used pad in paper or its</tspan><tspan x="260.32" dy="28">wrapper. Put it in the designated</tspan><tspan x="260.32" dy="28">bin; never flush it.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="206.07999999999998"><tspan x="618.6600000000001">Wash with soap and clean water,</tspan><tspan x="618.6600000000001" dy="28">dry completely, and store clean</tspan><tspan x="618.6600000000001" dy="28">and dry. Follow the maker’s care</tspan><tspan x="618.6600000000001" dy="28">instructions.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="302" y2="302"/><rect class="v2-table-frame" x="89" y="42" width="874" height="260"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="42" y2="302"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="42" y2="302"/></g></g>
<g class="v2-reading-block" data-block="hygiene-access-0" transform="translate(0 792)"><text class="se-copy" x="89" y="24"><tspan x="89">Wash hands before and after changing a pad. A school needs clean water, soap,</tspan><tspan x="89" dy="32">privacy and a safe disposal system as well as access to products. Ask a trusted</tspan></text></g>
<g class="v2-reading-block" data-block="hygiene-access-1" transform="translate(0 856)"><text class="se-copy" x="89" y="24"><tspan x="89">adult for help obtaining supplies. Nobody should be mocked for carrying a pad or</tspan><tspan x="89" dy="32">needing to change one.</tspan></text></g>
<g class="v2-reading-block" data-block="pad-environment-0" transform="translate(0 936)"><text class="se-copy" x="89" y="24"><tspan x="89">Some products are described as biodegradable, but this does not mean that they</tspan><tspan x="89" dy="32">may be littered, flushed or composted at home. Disposal depends on the material</tspan></text></g>
<g class="v2-reading-block" data-block="pad-environment-1" transform="translate(0 1000)"><text class="se-copy" x="89" y="24"><tspan x="89">and the local waste system. Follow local guidance; environmental claims do not</tspan><tspan x="89" dy="32">replace safe collection and disposal.</tspan></text></g>
<g class="v2-reading-block" data-block="support-head" transform="translate(0 1092)"><text class="se-heading" x="89" y="30"><tspan x="89">Where Support Can Be Found</tspan></text></g>
<g class="v2-reading-block" data-block="support-programmes-0" transform="translate(0 1140)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Menstrual</tspan> <tspan class="se-bold">Hygiene</tspan> <tspan class="se-bold">Scheme</tspan> <tspan class="se-bold">(MHS):</tspan> supports menstrual-hygiene awareness</tspan><tspan x="112" dy="32">and access to pads for adolescent girls in rural areas.</tspan></text></g>
<g class="v2-reading-block" data-block="support-programmes-1" transform="translate(0 1214)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Rashtriya</tspan> <tspan class="se-bold">Kishor</tspan> <tspan class="se-bold">Swasthya</tspan> <tspan class="se-bold">Karyakram</tspan> <tspan class="se-bold">(RKSK):</tspan> supports adolescent health,</tspan><tspan x="112" dy="32">including nutrition, mental health and menstrual health. Trained peer</tspan><tspan x="112" dy="32">educators can help connect young people with information and services.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
