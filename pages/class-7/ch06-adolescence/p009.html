<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="food-table" transform="translate(0 112)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 6.3 Foods, nutrients and their roles</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Examples of food sources</tspan></text><text class="v2-table-heading" x="461.34" y="76.08"><tspan x="461.34">Some nutrients</tspan></text><text class="v2-table-heading" x="679.8399999999999" y="76.08"><tspan x="679.8399999999999">Roles in the body</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Milk, curd, cheese, paneer;</tspan><tspan x="103" dy="28">calcium-rich ragi millet</tspan></text><text class="se-copy se-table-copy" x="461.34" y="128.07999999999998"><tspan x="461.34">Calcium; protein</tspan><tspan x="461.34" dy="28">and fat vary</tspan></text><text class="se-copy se-table-copy" x="679.8399999999999" y="128.07999999999998"><tspan x="679.8399999999999">Bone health; growth and</tspan><tspan x="679.8399999999999" dy="28">repair</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="174" y2="174"/><text class="se-copy se-table-copy" x="103" y="208.07999999999998"><tspan x="103">Pulses, beans, eggs, fish or other</tspan><tspan x="103" dy="28">suitable protein foods</tspan></text><text class="se-copy se-table-copy" x="461.34" y="208.07999999999998"><tspan x="461.34">Protein</tspan></text><text class="se-copy se-table-copy" x="679.8399999999999" y="208.07999999999998"><tspan x="679.8399999999999">Growth and repair; can</tspan><tspan x="679.8399999999999" dy="28">also supply energy</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="254" y2="254"/><text class="se-copy se-table-copy" x="103" y="288.08"><tspan x="103">Rice, roti and other grains; oils</tspan><tspan x="103" dy="28">and nuts</tspan></text><text class="se-copy se-table-copy" x="461.34" y="288.08"><tspan x="461.34">Carbohydrates and</tspan><tspan x="461.34" dy="28">fats</tspan></text><text class="se-copy se-table-copy" x="679.8399999999999" y="288.08"><tspan x="679.8399999999999">Energy for activities and</tspan><tspan x="679.8399999999999" dy="28">growth</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="334" y2="334"/><text class="se-copy se-table-copy" x="103" y="368.08"><tspan x="103">Spinach, kidney beans, raisins</tspan><tspan x="103" dy="28">and figs</tspan></text><text class="se-copy se-table-copy" x="461.34" y="368.08"><tspan x="461.34">Iron; amounts</tspan><tspan x="461.34" dy="28">vary</tspan></text><text class="se-copy se-table-copy" x="679.8399999999999" y="368.08"><tspan x="679.8399999999999">Haemoglobin formation;</tspan><tspan x="679.8399999999999" dy="28">absorption varies</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="414" y2="414"/><text class="se-copy se-table-copy" x="103" y="448.08"><tspan x="103">Animal-source foods or</tspan><tspan x="103" dy="28">B12-fortified foods</tspan></text><text class="se-copy se-table-copy" x="461.34" y="448.08"><tspan x="461.34">Vitamin B12</tspan></text><text class="se-copy se-table-copy" x="679.8399999999999" y="448.08"><tspan x="679.8399999999999">Healthy blood and nerve</tspan><tspan x="679.8399999999999" dy="28">cells</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="494" y2="494"/><rect class="v2-table-frame" x="89" y="42" width="874" height="452"/><line class="v2-table-rule" x1="447.34" x2="447.34" y1="42" y2="494"/><line class="v2-table-rule" x1="665.8399999999999" x2="665.8399999999999" y1="42" y2="494"/><text class="v2-table-note" x="89" y="526.88"><tspan x="89">Examples, not a complete diet prescription. Read across for a connection; compare down for</tspan><tspan x="89" dy="26">variety. Nutrient amounts depend on food, portion and preparation.</tspan></text></g>
<g class="v2-reading-block" data-block="nutrition-evidence-0" transform="translate(0 690)"><text class="se-copy" x="89" y="24"><tspan x="89">A food name does not tell us everything about a meal. Portion size, variety,</tspan><tspan x="89" dy="32">preparation and the foods eaten over time matter. Plant foods can supply iron,</tspan></text></g>
<g class="v2-reading-block" data-block="nutrition-evidence-1" transform="translate(0 754)"><text class="se-copy" x="89" y="24"><tspan x="89">but the body does not absorb all sources equally. Vitamin-C-rich foods such as</tspan><tspan x="89" dy="32">guava or lemon can help the absorption of iron from plant foods.</tspan></text></g>
<g class="v2-reading-block" data-block="meal-example-0" transform="translate(0 834)"><text class="se-copy" x="89" y="24"><tspan x="89">For example, a meal with roti or rice, dal, vegetables and curd combines foods</tspan><tspan x="89" dy="32">with different contributions. If one ingredient is unavailable, ask which local</tspan></text></g>
<g class="v2-reading-block" data-block="meal-example-1" transform="translate(0 898)"><text class="se-copy" x="89" y="24"><tspan x="89">alternative could serve a similar purpose. Planning variety is more useful than</tspan><tspan x="89" dy="32">searching for a single “perfect” food or dividing all foods into simply good and</tspan><tspan x="89" dy="32">bad.</tspan></text></g><g transform="translate(0 1010)"><g data-page-illustration="figures/class-7/science/ch06/food-choices.png"><image class="science-illustration" href="../../figures/class-7/science/ch06/food-choices.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Food choices.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Food choices.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
