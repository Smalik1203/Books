<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="hygiene-art" transform="translate(0 112)"><image class="science-illustration" data-photo="hygiene" href="../../figures/class-7/science/ch06/hygiene.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Clean pads, washing supplies and a covered bin are parts of practical menstrual hygiene</tspan><tspan x="89" dy="27">support.</tspan></text></g>
<g class="v2-reading-block" data-block="pad-comparison" transform="translate(0 474)"><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Disposable pads</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74"><tspan x="112">Use a clean pad and change it</tspan><tspan x="112" dy="32">regularly, sooner if wet or soiled.</tspan><tspan x="112" dy="32">Follow product guidance.</tspan></text><text class="se-copy" x="89" y="180" text-anchor="start">•</text><text class="se-copy" x="112" y="180"><tspan x="112">Wrap a used pad in paper or its</tspan><tspan x="112" dy="32">wrapper. Put it in the designated</tspan><tspan x="112" dy="32">bin; never flush it.</tspan></text><text class="v2-comparison-title" x="526" y="30"><tspan x="526">Reusable cloth pads</tspan></text><text class="se-copy" x="526" y="74" text-anchor="start">•</text><text class="se-copy" x="549" y="74"><tspan x="549">Use a clean, dry pad made for this</tspan><tspan x="549" dy="32">purpose. Change it regularly.</tspan></text><text class="se-copy" x="526" y="148" text-anchor="start">•</text><text class="se-copy" x="549" y="148"><tspan x="549">Wash with soap and clean water,</tspan><tspan x="549" dy="32">dry completely, and store clean and</tspan><tspan x="549" dy="32">dry. Follow the maker’s care</tspan><tspan x="549" dy="32">instructions.</tspan></text></g>
<g class="v2-reading-block" data-block="hygiene-access-0" transform="translate(0 752)"><text class="se-copy" x="89" y="24"><tspan x="89">Wash hands before and after changing a pad. A school needs clean water, soap,</tspan><tspan x="89" dy="32">privacy and a safe disposal system as well as access to products. Ask a trusted</tspan></text></g>
<g class="v2-reading-block" data-block="hygiene-access-1" transform="translate(0 816)"><text class="se-copy" x="89" y="24"><tspan x="89">adult for help obtaining supplies. Nobody should be mocked for carrying a pad or</tspan><tspan x="89" dy="32">needing to change one.</tspan></text></g>
<g class="v2-reading-block" data-block="pad-environment-0" transform="translate(0 896)"><text class="se-copy" x="89" y="24"><tspan x="89">Some products are described as biodegradable, but this does not mean that they</tspan><tspan x="89" dy="32">may be littered, flushed or composted at home. Disposal depends on the material</tspan></text></g>
<g class="v2-reading-block" data-block="pad-environment-1" transform="translate(0 960)"><text class="se-copy" x="89" y="24"><tspan x="89">and the local waste system. Follow local guidance; environmental claims do not</tspan><tspan x="89" dy="32">replace safe collection and disposal.</tspan></text></g>
<g class="v2-reading-block" data-block="support-head" transform="translate(0 1052)"><text class="se-heading" x="89" y="30"><tspan x="89">Where Support Can Be Found</tspan></text></g>
<g class="v2-reading-block" data-block="support-programmes-0" transform="translate(0 1100)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Menstrual</tspan> <tspan class="se-bold">Hygiene</tspan> <tspan class="se-bold">Scheme</tspan> <tspan class="se-bold">(MHS):</tspan> supports menstrual-hygiene awareness</tspan><tspan x="112" dy="32">and access to pads for adolescent girls in rural areas.</tspan></text></g>
<g class="v2-reading-block" data-block="support-programmes-1" transform="translate(0 1174)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Rashtriya</tspan> <tspan class="se-bold">Kishor</tspan> <tspan class="se-bold">Swasthya</tspan> <tspan class="se-bold">Karyakram</tspan> <tspan class="se-bold">(RKSK):</tspan> supports adolescent health,</tspan><tspan x="112" dy="32">including nutrition, mental health and menstrual health. Trained peer</tspan><tspan x="112" dy="32">educators can help connect young people with information and services.</tspan></text></g>
<g class="v2-reading-block" data-block="support-programmes-2" transform="translate(0 1280)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Jan</tspan> <tspan class="se-bold">Aushadhi</tspan> <tspan class="se-bold">Suvidha:</tspan> makes affordable sanitary pads available through Jan</tspan><tspan x="112" dy="32">Aushadhi Kendras.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
