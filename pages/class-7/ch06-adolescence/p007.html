<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="feelings-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">6.3 Feelings and Behaviour</tspan></text></g>
<g class="v2-reading-block" data-block="feelings-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Growing up may bring stronger feelings, changing interests, a wish for</tspan><tspan x="89" dy="32">independence or increased sensitivity to others’ opinions. Some adolescents</tspan></text></g>
<g class="v2-reading-block" data-block="feelings-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">experience mood changes; others do not notice large changes. There is no single</tspan><tspan x="89" dy="32">emotional pattern that everyone must experience.</tspan></text></g>
<g class="v2-reading-block" data-block="feelings-task" transform="translate(0 314)"><rect class="se-activity-panel" x="89" y="0" width="874" height="306" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Discuss fictional situations: being left out of a game, excited about a</tspan><tspan x="146" dy="32">hobby or upset after criticism. Do not name real people.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Record possible feelings, responses and constructive alternatives in your</tspan><tspan x="146" dy="32">notebook. Use Table 6.2; several responses may be reasonable.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Consider music, dance, sport, creativity and helping others. Nobody</tspan><tspan x="146" dy="32">needs to disclose private experiences.</tspan></text></g>
<g class="v2-reading-block" data-block="feelings-table" transform="translate(0 642)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 6.2 Feelings, responses and choices</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Possible feeling</tspan></text><text class="v2-table-heading" x="321.5" y="76.08"><tspan x="321.5">Possible response</tspan></text><text class="v2-table-heading" x="627.4" y="76.08"><tspan x="627.4">A constructive choice</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Changing mood</tspan></text><text class="se-copy se-table-copy" x="321.5" y="128.07999999999998"><tspan x="321.5">Withdrawing for a while</tspan></text><text class="se-copy se-table-copy" x="627.4" y="128.07999999999998"><tspan x="627.4">Pause, talk and try a</tspan><tspan x="627.4" dy="28">manageable activity</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="174" y2="174"/><text class="se-copy se-table-copy" x="103" y="208.07999999999998"><tspan x="103">Strong excitement</tspan></text><text class="se-copy se-table-copy" x="321.5" y="208.07999999999998"><tspan x="321.5">Rushing into a plan</tspan></text><text class="se-copy se-table-copy" x="627.4" y="208.07999999999998"><tspan x="627.4">Check safety and</tspan><tspan x="627.4" dy="28">responsibilities</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="254" y2="254"/><text class="se-copy se-table-copy" x="103" y="288.08"><tspan x="103">Increased</tspan><tspan x="103" dy="28">sensitivity</tspan></text><text class="se-copy se-table-copy" x="321.5" y="288.08"><tspan x="321.5">Taking criticism personally</tspan></text><text class="se-copy se-table-copy" x="627.4" y="288.08"><tspan x="627.4">Clarify what was meant; discuss</tspan><tspan x="627.4" dy="28">calmly</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="334" y2="334"/><text class="se-copy se-table-copy" x="103" y="368.08"><tspan x="103">Compassion</tspan></text><text class="se-copy se-table-copy" x="321.5" y="368.08"><tspan x="321.5">Wanting to help</tspan></text><text class="se-copy se-table-copy" x="627.4" y="368.08"><tspan x="627.4">Join supervised community</tspan><tspan x="627.4" dy="28">work</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="414" y2="414"/><rect class="v2-table-frame" x="89" y="42" width="874" height="372"/><line class="v2-table-rule" x1="307.5" x2="307.5" y1="42" y2="414"/><line class="v2-table-rule" x1="613.4" x2="613.4" y1="42" y2="414"/><text class="v2-table-note" x="89" y="446.88"><tspan x="89">These are examples, not predictions about every adolescent. Read across for alternatives; add</tspan><tspan x="89" dy="26">a different response in your notebook.</tspan></text></g>
<g class="v2-reading-block" data-block="feelings-choice-0" transform="translate(0 1140)"><text class="se-copy" x="89" y="24"><tspan x="89">Feelings do not dictate actions. Anger need not lead to harm, nor curiosity to</tspan><tspan x="89" dy="32">risk. Pause, name the feeling and consider another viewpoint. Creative interests</tspan><tspan x="89" dy="32">can support learning and cooperation.</tspan></text></g>
<g class="v2-reading-block" data-block="feelings-help-0" transform="translate(0 1252)"><text class="se-copy" x="89" y="24"><tspan x="89">Support matters when sadness, worry or other feelings persist, interfere with</tspan><tspan x="89" dy="32">everyday life or feel difficult to manage. Speak to a trusted adult, counsellor or</tspan></text></g>
<g class="v2-reading-block" data-block="feelings-help-1" transform="translate(0 1316)"><text class="se-copy" x="89" y="24"><tspan x="89">health professional. Asking for help is a useful action, not a personal failure.</tspan><tspan x="89" dy="32">Respect another person’s privacy when they seek support.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
