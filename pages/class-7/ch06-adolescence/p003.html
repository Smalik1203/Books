<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="growth-table" transform="translate(0 112)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 6.1 Organising the class discussion</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Category</tspan></text><text class="v2-table-heading" x="365.2" y="76.08"><tspan x="365.2">What to record in your notebook</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Height</tspan></text><text class="se-copy se-table-copy" x="365.2" y="128.07999999999998"><tspan x="365.2">A general change mentioned on the slips</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="146" y2="146"/><text class="se-copy se-table-copy" x="103" y="180.07999999999998"><tspan x="103">Weight and strength</tspan></text><text class="se-copy se-table-copy" x="365.2" y="180.07999999999998"><tspan x="365.2">An idea about growth or physical ability</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="198" y2="198"/><text class="se-copy se-table-copy" x="103" y="232.07999999999998"><tspan x="103">Appearance</tspan></text><text class="se-copy se-table-copy" x="365.2" y="232.07999999999998"><tspan x="365.2">An idea about skin, hair or voice</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="250" y2="250"/><text class="se-copy se-table-copy" x="103" y="284.08"><tspan x="103">Other changes</tspan></text><text class="se-copy se-table-copy" x="365.2" y="284.08"><tspan x="365.2">Ideas about feelings, interests or behaviour</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="302" y2="302"/><rect class="v2-table-frame" x="89" y="42" width="874" height="260"/><line class="v2-table-rule" x1="351.2" x2="351.2" y1="42" y2="302"/><text class="v2-table-note" x="89" y="334.88"><tspan x="89">Read across to sort the anonymous ideas. These are recording categories, not results or a</tspan><tspan x="89" dy="26">checklist for judging classmates.</tspan></text></g>
<g class="v2-reading-block" data-block="growth-variation-0" transform="translate(0 498)"><text class="se-copy" x="89" y="24"><tspan x="89">Repeated suggestions tell you about the ideas on the slips, not how often a change</tspan><tspan x="89" dy="32">occurs in all adolescents. A classroom discussion cannot establish a timetable</tspan><tspan x="89" dy="32">that every body must follow.</tspan></text></g>
<g class="v2-reading-block" data-block="physical-head" transform="translate(0 622)"><text class="se-heading" x="89" y="30"><tspan x="89">Changes in the Body</tspan></text></g>
<g class="v2-reading-block" data-block="body-changes-0" transform="translate(0 670)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Height:</tspan> a period of faster growth, called a growth spurt, often occurs during</tspan><tspan x="112" dy="32">adolescence. Its timing and length differ.</tspan></text></g>
<g class="v2-reading-block" data-block="body-changes-1" transform="translate(0 744)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Body</tspan> <tspan class="se-bold">structure:</tspan> height, weight and muscle strength change. Broader shoulders</tspan><tspan x="112" dy="32">and a wider chest often develop in boys; breast development occurs in girls</tspan><tspan x="112" dy="32">during typical puberty. Both experience changes in body shape.</tspan></text></g>
<g class="v2-reading-block" data-block="body-changes-2" transform="translate(0 850)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Body</tspan> <tspan class="se-bold">hair:</tspan> hair develops in the armpits and pubic region in both boys and</tspan><tspan x="112" dy="32">girls. Facial hair, and sometimes chest or back hair, often becomes more</tspan><tspan x="112" dy="32">noticeable in boys. The amount and timing vary.</tspan></text></g>
<g class="v2-reading-block" data-block="variation-respect-0" transform="translate(0 962)"><text class="se-copy" x="89" y="24"><tspan x="89">These are general patterns, not rules for judging classmates. Growing later does</tspan><tspan x="89" dy="32">not make someone less capable. Avoid jokes about height, weight, skin, voice or</tspan><tspan x="89" dy="32">hair. Discuss an individual health concern privately with a health professional.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
