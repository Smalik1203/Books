<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="growth-variation-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Repeated suggestions tell you about the ideas on the slips, not how often a change</tspan><tspan x="89" dy="32">occurs in all adolescents. A classroom discussion cannot establish a timetable</tspan><tspan x="89" dy="32">that every body must follow.</tspan></text></g>
<g class="v2-reading-block" data-block="physical-head" transform="translate(0 236)"><text class="se-heading" x="89" y="30"><tspan x="89">Changes in the Body</tspan></text></g>
<g class="v2-reading-block" data-block="body-changes-0" transform="translate(0 284)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Height:</tspan> a period of faster growth, called a growth spurt, often occurs during</tspan><tspan x="112" dy="32">adolescence. Its timing and length differ.</tspan></text></g>
<g class="v2-reading-block" data-block="body-changes-1" transform="translate(0 358)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Body</tspan> <tspan class="se-bold">structure:</tspan> height, weight and muscle strength change. Broader shoulders</tspan><tspan x="112" dy="32">and a wider chest often develop in boys; breast development occurs in girls</tspan><tspan x="112" dy="32">during typical puberty. Both experience changes in body shape.</tspan></text></g>
<g class="v2-reading-block" data-block="body-changes-2" transform="translate(0 464)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Body</tspan> <tspan class="se-bold">hair:</tspan> hair develops in the armpits and pubic region in both boys and</tspan><tspan x="112" dy="32">girls. Facial hair, and sometimes chest or back hair, often becomes more</tspan><tspan x="112" dy="32">noticeable in boys. The amount and timing vary.</tspan></text></g>
<g class="v2-reading-block" data-block="variation-respect-0" transform="translate(0 576)"><text class="se-copy" x="89" y="24"><tspan x="89">These are general patterns, not rules for judging classmates. Growing later does</tspan><tspan x="89" dy="32">not make someone less capable. Avoid jokes about height, weight, skin, voice or</tspan><tspan x="89" dy="32">hair. Discuss an individual health concern privately with a health professional.</tspan></text></g>
<g class="v2-reading-block" data-block="voice-head" transform="translate(0 700)"><text class="se-heading" x="89" y="30"><tspan x="89">Why a Voice May Change</tspan></text></g>
<g class="v2-reading-block" data-block="voice-0" transform="translate(0 748)"><text class="se-copy" x="89" y="24"><tspan x="89">The <tspan class="se-bold">voice</tspan> <tspan class="se-bold">box</tspan>, or larynx, is a structure in the throat that contains the vocal folds.</tspan><tspan x="89" dy="32">Air passing through vibrating vocal folds produces sound. During puberty, the</tspan></text></g>
<g class="v2-reading-block" data-block="voice-1" transform="translate(0 812)"><text class="se-copy" x="89" y="24"><tspan x="89">larynx and vocal folds grow. The voice often becomes deeper, particularly in</tspan><tspan x="89" dy="32">boys, and may temporarily crack as it changes.</tspan></text></g>
<g class="v2-reading-block" data-block="adams-apple-0" transform="translate(0 892)"><text class="se-copy" x="89" y="24"><tspan x="89">The projection at the front of the larynx is commonly called the Adam’s apple. It</tspan><tspan x="89" dy="32">may become more noticeable, but it is not prominent in everyone. Girls’ voice</tspan></text></g>
<g class="v2-reading-block" data-block="adams-apple-1" transform="translate(0 956)"><text class="se-copy" x="89" y="24"><tspan x="89">boxes grow too, usually with less marked changes in pitch. A visible neck</tspan><tspan x="89" dy="32">swelling should not be identified from appearance alone.</tspan></text></g>
<g class="v2-reading-block" data-block="neck-figure" transform="translate(0 1036)"><g class="v2-change-diagram" data-diagram="neck"><svg class="science-illustration" data-apparatus="neck" x="379" y="4" width="298.2266545784225" height="264" viewBox="34 53 1246 1103" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch06/apparatus-neck.png" width="1312" height="1199"/></svg><text class="v2-change-label se-bold" x="791" y="62" text-anchor="middle">Larynx (voice box)</text><path class="v2-change-line" d="M685 69H626L547 81"/><text class="v2-change-label se-bold" x="246" y="162" text-anchor="middle">Thyroid gland</text><path class="v2-change-line" d="M337 169H443L492 156"/><text class="v2-change-label" x="778" y="243" text-anchor="middle">Windpipe</text><path class="v2-change-line" d="M717 236H626L545 240"/></g><text class="se-caption" x="89" y="310.88"><tspan x="89">A simplified front view: the larynx and thyroid gland are different structures. Their relative</tspan><tspan x="89" dy="27">positions are shown, not a diagnosis.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
