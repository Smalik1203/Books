<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="growing-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">6.1 Growing With Age</tspan></text></g>
<g class="v2-reading-block" data-block="life-stages-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Human life includes infancy, childhood, adolescence, adulthood and old age.</tspan><tspan x="89" dy="32"><tspan class="se-bold">Adolescence</tspan>, usually ages 10–19, connects childhood and adulthood. People</tspan><tspan x="89" dy="32">reach developmental milestones at different times.</tspan></text></g>
<g class="v2-reading-block" data-block="cousins-0" transform="translate(0 282)"><text class="se-copy" x="89" y="24"><tspan x="89">Visiting his grandparents, Venkatesh notices that his 12-year-old cousin Devyani</tspan><tspan x="89" dy="32">has grown taller. She notices his changed voice and thin moustache. What other</tspan><tspan x="89" dy="32">changes occur while young people grow?</tspan></text></g>
<g class="v2-reading-block" data-block="anonymous-task" transform="translate(0 394)"><rect class="se-activity-panel" x="89" y="0" width="874" height="602" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">On a slip, suggest a change between Grades 5 and 8: height, strength,</tspan><tspan x="146" dy="32">appearance, interests or behaviour. Fictional examples are welcome.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Do not identify anyone or describe private experiences. Fold the slips into</tspan><tspan x="146" dy="32">a jar. The teacher mixes and reads suitable slips.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Discuss respectfully, without guessing the writers. Group the ideas in</tspan><tspan x="146" dy="32">your notebook using Table 6.1. Note a repeated idea and an unanswered</tspan><tspan x="146" dy="32">question.</tspan></text><image class="science-illustration" data-photo="question-jar" href="../../figures/class-7/science/ch06/question-jar.png" x="364.75" y="328" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="573.88"><tspan x="113">Anonymous slips can help a class discuss general changes without identifying anyone.</tspan></text></g>
<g class="v2-reading-block" data-block="growth-table" transform="translate(0 1018)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 6.1 Organising the class discussion</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Category</tspan></text><text class="v2-table-heading" x="365.2" y="76.08"><tspan x="365.2">What to record in your notebook</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Height</tspan></text><text class="se-copy se-table-copy" x="365.2" y="128.07999999999998"><tspan x="365.2">A general change mentioned on the slips</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="146" y2="146"/><text class="se-copy se-table-copy" x="103" y="180.07999999999998"><tspan x="103">Weight and strength</tspan></text><text class="se-copy se-table-copy" x="365.2" y="180.07999999999998"><tspan x="365.2">An idea about growth or physical ability</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="198" y2="198"/><text class="se-copy se-table-copy" x="103" y="232.07999999999998"><tspan x="103">Appearance</tspan></text><text class="se-copy se-table-copy" x="365.2" y="232.07999999999998"><tspan x="365.2">An idea about skin, hair or voice</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="250" y2="250"/><text class="se-copy se-table-copy" x="103" y="284.08"><tspan x="103">Other changes</tspan></text><text class="se-copy se-table-copy" x="365.2" y="284.08"><tspan x="365.2">Ideas about feelings, interests or behaviour</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="302" y2="302"/><rect class="v2-table-frame" x="89" y="42" width="874" height="260"/><line class="v2-table-rule" x1="351.2" x2="351.2" y1="42" y2="302"/><text class="v2-table-note" x="89" y="334.88"><tspan x="89">Read across to sort the anonymous ideas. These are recording categories, not results or a</tspan><tspan x="89" dy="26">checklist for judging classmates.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
