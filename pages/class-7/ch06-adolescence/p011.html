<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 11"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="support-programmes-2" transform="translate(0 112)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">Jan</tspan> <tspan class="se-bold">Aushadhi</tspan> <tspan class="se-bold">Suvidha:</tspan> makes affordable sanitary pads available through Jan</tspan><tspan x="112" dy="32">Aushadhi Kendras.</tspan></text></g>
<g class="v2-reading-block" data-block="support-programmes-3" transform="translate(0 186)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112"><tspan class="se-bold">State</tspan> <tspan class="se-bold">programmes:</tspan> examples include Karnataka’s Shuchi scheme and</tspan><tspan x="112" dy="32">pad-distribution programmes in Tamil Nadu and Odisha. Ask a local school or</tspan><tspan x="112" dy="32">health worker about current eligibility and availability.</tspan></text></g>
<g class="v2-reading-block" data-block="support-access-0" transform="translate(0 298)"><text class="se-copy" x="89" y="24"><tspan x="89">Programmes and supplies differ between places. A trained health worker or</tspan><tspan x="89" dy="32">adolescent-friendly health clinic can explain local services. Share information</tspan><tspan x="89" dy="32">respectfully without publicly identifying who needs help.</tspan></text></g>
<g class="v2-reading-block" data-block="movement-head" transform="translate(0 422)"><text class="se-heading" x="89" y="30"><tspan x="89">6.4.3 Movement and Rest</tspan></text></g>
<g class="v2-reading-block" data-block="movement-0" transform="translate(0 470)"><text class="se-copy" x="89" y="24"><tspan x="89">Regular physical activity supports fitness, stamina and mood. Games, walking,</tspan><tspan x="89" dy="32">dance, cycling and suitable exercises can all provide movement. Choose safe</tspan></text></g>
<g class="v2-reading-block" data-block="movement-1" transform="translate(0 534)"><text class="se-copy" x="89" y="24"><tspan x="89">activities that you enjoy and that suit your abilities. Inclusive games let</tspan><tspan x="89" dy="32">participants take different roles instead of excluding someone who moves</tspan><tspan x="89" dy="32">differently.</tspan></text></g>
<g class="v2-reading-block" data-block="movement-art" transform="translate(0 646)"><image class="science-illustration" data-photo="movement" href="../../figures/class-7/science/ch06/movement.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Activity can be adapted so that friends with different abilities participate together.</tspan></text></g>
<g class="v2-reading-block" data-block="rest-0" transform="translate(0 981)"><text class="se-copy" x="89" y="24"><tspan x="89">Balance active time with rest and regular sleep. Drink safe water, use appropriate</tspan><tspan x="89" dy="32">equipment and follow a teacher’s guidance for unfamiliar exercises. Pain or</tspan></text></g>
<g class="v2-reading-block" data-block="rest-1" transform="translate(0 1045)"><text class="se-copy" x="89" y="24"><tspan x="89">dizziness is a reason to stop and seek help, not a challenge to push through.</tspan><tspan x="89" dy="32">Being active is about well-being, not achieving a particular body shape.</tspan></text></g>
<g class="v2-reading-block" data-block="social-head" transform="translate(0 1137)"><text class="se-heading" x="89" y="30"><tspan x="89">6.4.4 Friendships and Digital Life</tspan></text></g>
<g class="v2-reading-block" data-block="relationships-0" transform="translate(0 1185)"><text class="se-copy" x="89" y="24"><tspan x="89">Friendships, cooperation and new interests can become especially important in</tspan><tspan x="89" dy="32">adolescence. Some people feel attraction to peers. Respectful behaviour includes</tspan></text></g>
<g class="v2-reading-block" data-block="relationships-1" transform="translate(0 1249)"><text class="se-copy" x="89" y="24"><tspan x="89">listening, accepting another person’s boundaries and avoiding pressure. You do</tspan><tspan x="89" dy="32">not have to copy a group’s actions to deserve friendship.</tspan></text></g>
<g class="v2-reading-block" data-block="online-0" transform="translate(0 1329)"><text class="se-copy" x="89" y="24"><tspan x="89">Online tools can help us learn, create and stay in touch. They also allow messages</tspan><tspan x="89" dy="32">and pictures to spread beyond the audience first intended. Ask permission before</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">11</text></g></svg></div></div></section>
