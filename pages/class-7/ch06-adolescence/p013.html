<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="social-head" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">6.4.4 Friendships and Digital Life</tspan></text></g>
<g class="v2-reading-block" data-block="relationships-0" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89">Friendships, cooperation and new interests can become especially important in</tspan><tspan x="89" dy="32">adolescence. Some people feel attraction to peers. Respectful behaviour includes</tspan></text></g>
<g class="v2-reading-block" data-block="relationships-1" transform="translate(0 224)"><text class="se-copy" x="89" y="24"><tspan x="89">listening, accepting another person’s boundaries and avoiding pressure. You do</tspan><tspan x="89" dy="32">not have to copy a group’s actions to deserve friendship.</tspan></text></g>
<g class="v2-reading-block" data-block="online-0" transform="translate(0 304)"><text class="se-copy" x="89" y="24"><tspan x="89">Online tools can help us learn, create and stay in touch. They also allow messages</tspan><tspan x="89" dy="32">and pictures to spread beyond the audience first intended. Ask permission before</tspan></text></g>
<g class="v2-reading-block" data-block="online-1" transform="translate(0 368)"><text class="se-copy" x="89" y="24"><tspan x="89">sharing someone’s image or information. A person known only online may not</tspan><tspan x="89" dy="32">be who they claim to be.</tspan></text></g>
<g class="v2-reading-block" data-block="cyberbullying-0" transform="translate(0 448)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Cyberbullying</tspan> is bullying through digital devices or services. Examples include</tspan><tspan x="89" dy="32">repeated hurtful messages, spreading rumours and sharing private information</tspan></text></g>
<g class="v2-reading-block" data-block="cyberbullying-1" transform="translate(0 512)"><text class="se-copy" x="89" y="24"><tspan x="89">to embarrass someone. If this happens, tell a trusted adult. With their help, save</tspan><tspan x="89" dy="32">relevant evidence, use blocking or reporting tools, and avoid forwarding harmful</tspan><tspan x="89" dy="32">material.</tspan></text></g>
<g class="v2-reading-block" data-block="support-art" transform="translate(0 624)"><image class="science-illustration" data-photo="support" href="../../figures/class-7/science/ch06/support.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">A trusted adult can help a learner respond to an online problem without spreading the</tspan><tspan x="89" dy="27">harmful message.</tspan></text></g>
<g class="v2-reading-block" data-block="online-help-0" transform="translate(0 986)"><text class="se-copy" x="89" y="24"><tspan x="89">Being frightened or upset does not make someone responsible for bullying. If</tspan><tspan x="89" dy="32">one adult does not help, approach another. Friends can refuse to join in and help</tspan><tspan x="89" dy="32">the person find support.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
