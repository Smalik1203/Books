<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="digital-table" transform="translate(0 112)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 6.4 Responsible choices online</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Helpful actions</tspan></text><text class="v2-table-heading" x="540" y="76.08"><tspan x="540">Actions to avoid</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Be respectful and kind</tspan></text><text class="se-copy se-table-copy" x="540" y="128.07999999999998"><tspan x="540">Insults, rumours and joining in with</tspan><tspan x="540" dy="28">bullying</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="174" y2="174"/><text class="se-copy se-table-copy" x="103" y="208.07999999999998"><tspan x="103">Think before posting; check information</tspan></text><text class="se-copy se-table-copy" x="540" y="208.07999999999998"><tspan x="540">Forwarding a claim just because it is</tspan><tspan x="540" dy="28">popular</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="254" y2="254"/><text class="se-copy se-table-copy" x="103" y="288.08"><tspan x="103">Protect privacy and ask permission</tspan></text><text class="se-copy se-table-copy" x="540" y="288.08"><tspan x="540">Sharing private photos or details with</tspan><tspan x="540" dy="28">strangers or online-only contacts</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="334" y2="334"/><text class="se-copy se-table-copy" x="103" y="368.08"><tspan x="103">Seek trusted help and report problems</tspan></text><text class="se-copy se-table-copy" x="540" y="368.08"><tspan x="540">Handling threats alone or spreading</tspan><tspan x="540" dy="28">hurtful screenshots</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="414" y2="414"/><rect class="v2-table-frame" x="89" y="42" width="874" height="372"/><line class="v2-table-rule" x1="526" x2="526" y1="42" y2="414"/><text class="v2-table-note" x="89" y="446.88"><tspan x="89">Read each row as a pair. Add a practical example in your notebook without naming real</tspan><tspan x="89" dy="26">people.</tspan></text></g>
<g class="v2-reading-block" data-block="digital-pause" transform="translate(0 610)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="230" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A chat shares an embarrassing picture. Would forwarding it “so others know</tspan><tspan x="113" dy="32">what happened” increase the harm? Explain.</tspan></text><text class="se-copy" x="113" y="168"><tspan x="113">Distinguish keeping evidence privately for a trusted adult from circulating it.</tspan><tspan x="113" dy="32">Suggest a response that supports the learner and protects privacy.</tspan></text></g>
<g class="v2-reading-block" data-block="substances-head" transform="translate(0 874)"><text class="se-heading" x="89" y="30"><tspan x="89">6.4.5 Saying No and Seeking Help</tspan></text></g>
<g class="v2-reading-block" data-block="substances-0" transform="translate(0 922)"><text class="se-copy" x="89" y="24"><tspan x="89">Tobacco, gutka, cigarettes, beedis, alcohol and harmful or illegal drugs can</tspan><tspan x="89" dy="32">damage health. A friend or an older person may pressure someone to try them. A</tspan></text></g>
<g class="v2-reading-block" data-block="substances-1" transform="translate(0 986)"><text class="se-copy" x="89" y="24"><tspan x="89">firm “No, I do not want to” is enough. Move away from an unsafe situation and</tspan><tspan x="89" dy="32">seek help from a trusted adult; you do not need to win an argument.</tspan></text></g>
<g class="v2-reading-block" data-block="refusal-example-0" transform="translate(0 1066)"><text class="se-copy" x="89" y="24"><tspan x="89">Consider a friend who says, “Everyone is trying it.” You could reply, “I am not</tspan><tspan x="89" dy="32">joining in. Let us do something else.” If the pressure continues, leave with</tspan></text></g>
<g class="v2-reading-block" data-block="refusal-example-1" transform="translate(0 1130)"><text class="se-copy" x="89" y="24"><tspan x="89">someone you trust. Practise the words with a fictional situation; never bring</tspan><tspan x="89" dy="32">tobacco, alcohol or drugs into a classroom demonstration.</tspan></text></g>
<g class="v2-reading-block" data-block="addiction-0" transform="translate(0 1210)"><text class="se-copy" x="89" y="24"><tspan x="89">Some substances can cause <tspan class="se-bold">addiction</tspan>: a health condition involving strong urges</tspan><tspan x="89" dy="32">and difficulty controlling use despite harm. The risk varies, but “just once” does</tspan></text></g>
<g class="v2-reading-block" data-block="addiction-1" transform="translate(0 1274)"><text class="se-copy" x="89" y="24"><tspan x="89">not guarantee safety or the ability to stop. Addiction is not inevitable after one</tspan><tspan x="89" dy="32">use, and a person who needs help should not be blamed or mocked.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
