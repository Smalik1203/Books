<g class="v2-reading-block" data-block="acne-0" transform="translate(0 618)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.53017" data-space-ratio="1.095"><tspan class="se-bold">Acne</tspan><tspan dx="0.53017"> is</tspan><tspan dx="0.53017"> a</tspan><tspan dx="0.53017"> skin</tspan><tspan dx="0.53017"> condition</tspan><tspan dx="0.53017"> that</tspan><tspan dx="0.53017"> may</tspan><tspan dx="0.53017"> cause</tspan><tspan dx="0.53017"> pimples.</tspan><tspan dx="0.53017"> Hormonal</tspan><tspan dx="0.53017"> changes</tspan><tspan dx="0.53017"> can</tspan><tspan dx="0.53017"> increase</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.08133" data-space-ratio="1.909">the<tspan dx="5.08133"> oil</tspan><tspan dx="5.08133"> made</tspan><tspan dx="5.08133"> by</tspan><tspan dx="5.08133"> skin</tspan><tspan dx="5.08133"> glands.</tspan><tspan dx="5.08133"> Oil</tspan><tspan dx="5.08133"> and</tspan><tspan dx="5.08133"> dead</tspan><tspan dx="5.08133"> skin</tspan><tspan dx="5.08133"> cells</tspan><tspan dx="5.08133"> may</tspan><tspan dx="5.08133"> block</tspan><tspan dx="5.08133"> hair</tspan><tspan dx="5.08133"> follicles;</tspan></tspan></text></g>

<g class="v2-reading-block" data-block="puberty-head" transform="translate(0 950)"><text class="se-heading" x="89" y="30"><tspan x="89">Puberty Is Part of Adolescence</tspan></text></g>
<g class="v2-reading-block" data-block="puberty" transform="translate(0 998)"><g data-comparison-table="puberty" data-table-spacing="airy"><text class="v2-table-caption" x="89" y="33.6"><tspan x="89">Puberty and adolescence</tspan></text><rect class="se-table-head" x="89" y="54" width="874" height="48"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="86.08"><tspan x="103">Puberty</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="540" y="86.08"><tspan x="540">Adolescence</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="102" y2="102"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="134.08"><tspan x="103"><tspan class="se-bold">Puberty</tspan> is the process of physical</tspan><tspan x="103" dy="28">changes through which the body</tspan><tspan x="103" dy="28">becomes capable of reproduction. It</tspan><tspan x="103" dy="28">includes internal changes as well as</tspan><tspan x="103" dy="28">visible ones.</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="134.08"><tspan x="540">Adolescence is broader: it also includes</tspan><tspan x="540" dy="28">emotional and social development.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="262" y2="262"/><rect class="v2-table-frame" x="89" y="54" width="874" height="208"/><line class="v2-table-rule" x1="526" x2="526" y1="54" y2="262"/><text class="v2-table-note" x="89" y="302.88"><tspan x="89">Reproductive maturity does not mean that a young person is ready for marriage or</tspan><tspan x="89" dy="26">parenthood.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v
