<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="neck-figure" transform="translate(0 112)"><g class="v2-change-diagram" data-diagram="neck"><svg class="science-illustration" data-apparatus="neck" x="379" y="4" width="298.2266545784225" height="264" viewBox="34 53 1246 1103" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch06/apparatus-neck.png" width="1312" height="1199"/></svg><text class="v2-change-label se-bold" x="791" y="62" text-anchor="middle">Larynx (voice box)</text><path class="v2-change-line" d="M685 69H626L547 81"/><text class="v2-change-label se-bold" x="246" y="162" text-anchor="middle">Thyroid gland</text><path class="v2-change-line" d="M337 169H443L492 156"/><text class="v2-change-label" x="778" y="243" text-anchor="middle">Windpipe</text><path class="v2-change-line" d="M717 236H626L545 240"/></g><text class="se-caption" x="89" y="310.88"><tspan x="89">A simplified front view: the larynx and thyroid gland are different structures. Their relative</tspan><tspan x="89" dy="27">positions are shown, not a diagnosis.</tspan></text></g>
<g class="v2-reading-block" data-block="skin-head" transform="translate(0 490)"><text class="se-heading" x="89" y="30"><tspan x="89">Understanding Pimples</tspan></text></g>
<g class="v2-reading-block" data-block="acne-0" transform="translate(0 538)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Acne</tspan> is a skin condition that may cause pimples. Hormonal changes can increase</tspan><tspan x="89" dy="32">the oil made by skin glands. Oil and dead skin cells may block hair follicles;</tspan></text></g>
<g class="v2-reading-block" data-block="acne-1" transform="translate(0 602)"><text class="se-copy" x="89" y="24"><tspan x="89">inflammation and bacteria can contribute. Acne is common during adolescence.</tspan><tspan x="89" dy="32">It does not mean that a person is dirty, and it is not a reason for teasing.</tspan></text></g>
<g class="v2-reading-block" data-block="acne-care-0" transform="translate(0 682)"><text class="se-copy" x="89" y="24"><tspan x="89">Wash the face gently with a mild cleanser and water; avoid harsh scrubbing or</tspan><tspan x="89" dy="32">squeezing pimples. Excessive washing can irritate skin. Ask a trusted adult to</tspan></text></g>
<g class="v2-reading-block" data-block="acne-care-1" transform="translate(0 746)"><text class="se-copy" x="89" y="24"><tspan x="89">help seek professional advice if acne is painful, persistent, leaving scars or</tspan><tspan x="89" dy="32">causing distress. Do not borrow someone else’s medicine or apply unknown</tspan><tspan x="89" dy="32">mixtures.</tspan></text></g>
<g class="v2-reading-block" data-block="puberty-head" transform="translate(0 870)"><text class="se-heading" x="89" y="30"><tspan x="89">Puberty Is Part of Adolescence</tspan></text></g>
<g class="v2-reading-block" data-block="puberty" transform="translate(0 918)"><g data-comparison-table="puberty"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Puberty and adolescence</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Puberty</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="540" y="70.08"><tspan x="540">Adolescence</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103"><tspan class="se-bold">Puberty</tspan> is the process of physical</tspan><tspan x="103" dy="28">changes through which the body</tspan><tspan x="103" dy="28">becomes capable of reproduction. It</tspan><tspan x="103" dy="28">includes internal changes as well as</tspan><tspan x="103" dy="28">visible ones.</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="110.08"><tspan x="540">Adolescence is broader: it also includes</tspan><tspan x="540" dy="28">emotional and social development.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="234" y2="234"/><rect class="v2-table-frame" x="89" y="42" width="874" height="192"/><line class="v2-table-rule" x1="526" x2="526" y1="42" y2="234"/><text class="v2-table-note" x="89" y="266.88"><tspan x="89">Reproductive maturity does not mean that a young person is ready for marriage or</tspan><tspan x="89" dy="26">parenthood.</tspan></text></g></g>
<g class="v2-reading-block" data-block="secondary-0" transform="translate(0 1232)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Secondary</tspan> <tspan class="se-bold">sexual</tspan> <tspan class="se-bold">characteristics</tspan> are body features that develop at puberty but</tspan><tspan x="89" dy="32">are not the reproductive organs themselves. Examples include breast</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
