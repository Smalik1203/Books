<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="skin-head" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Understanding Pimples</tspan></text></g>
<g class="v2-reading-block" data-block="acne-0" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Acne</tspan> is a skin condition that may cause pimples. Hormonal changes can increase</tspan><tspan x="89" dy="32">the oil made by skin glands. Oil and dead skin cells may block hair follicles;</tspan></text></g>
<g class="v2-reading-block" data-block="acne-1" transform="translate(0 224)"><text class="se-copy" x="89" y="24"><tspan x="89">inflammation and bacteria can contribute. Acne is common during adolescence.</tspan><tspan x="89" dy="32">It does not mean that a person is dirty, and it is not a reason for teasing.</tspan></text></g>
<g class="v2-reading-block" data-block="acne-care-0" transform="translate(0 304)"><text class="se-copy" x="89" y="24"><tspan x="89">Wash the face gently with a mild cleanser and water; avoid harsh scrubbing or</tspan><tspan x="89" dy="32">squeezing pimples. Excessive washing can irritate skin. Ask a trusted adult to</tspan></text></g>
<g class="v2-reading-block" data-block="acne-care-1" transform="translate(0 368)"><text class="se-copy" x="89" y="24"><tspan x="89">help seek professional advice if acne is painful, persistent, leaving scars or</tspan><tspan x="89" dy="32">causing distress. Do not borrow someone else’s medicine or apply unknown</tspan><tspan x="89" dy="32">mixtures.</tspan></text></g>
<g class="v2-reading-block" data-block="puberty-head" transform="translate(0 492)"><text class="se-heading" x="89" y="30"><tspan x="89">Puberty Is Part of Adolescence</tspan></text></g>
<g class="v2-reading-block" data-block="puberty-0" transform="translate(0 540)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Puberty</tspan> is the process of physical changes through which the body becomes</tspan><tspan x="89" dy="32">capable of reproduction. It includes internal changes as well as visible ones.</tspan></text></g>
<g class="v2-reading-block" data-block="puberty-1" transform="translate(0 604)"><text class="se-copy" x="89" y="24"><tspan x="89">Adolescence is broader: it also includes emotional and social development.</tspan><tspan x="89" dy="32">Reproductive maturity does not mean that a young person is ready for marriage</tspan><tspan x="89" dy="32">or parenthood.</tspan></text></g>
<g class="v2-reading-block" data-block="secondary-0" transform="translate(0 716)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Secondary</tspan> <tspan class="se-bold">sexual</tspan> <tspan class="se-bold">characteristics</tspan> are body features that develop at puberty but</tspan><tspan x="89" dy="32">are not the reproductive organs themselves. Examples include breast</tspan></text></g>
<g class="v2-reading-block" data-block="secondary-1" transform="translate(0 780)"><text class="se-copy" x="89" y="24"><tspan x="89">development and changes in facial hair and voice. These traits vary and should</tspan><tspan x="89" dy="32">not be used to label or judge individuals.</tspan></text></g>
<g class="v2-reading-block" data-block="timing-pause" transform="translate(0 860)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="230" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Two learners of the same age differ in height and voice. Does being taller</tspan><tspan x="113" dy="32">mean being more mature in every way? What evidence is missing?</tspan></text><text class="se-copy" x="113" y="168"><tspan x="113">Explain why appearance alone cannot establish health, emotional readiness</tspan><tspan x="113" dy="32">or abilities. Suggest a respectful response.</tspan></text></g>
<g class="v2-reading-block" data-block="reproductive-head" transform="translate(0 1124)"><text class="v2-title" x="89" y="38"><tspan x="89">6.2 Reproductive Development</tspan></text></g>
<g class="v2-reading-block" data-block="internal-0" transform="translate(0 1182)"><text class="se-copy" x="89" y="24"><tspan x="89">During puberty, reproductive organs mature gradually. These internal changes</tspan><tspan x="89" dy="32">cannot all be seen from outside. In girls, the beginning of the <tspan class="se-bold">menstrual</tspan> <tspan class="se-bold">cycle</tspan> is</tspan></text></g>
<g class="v2-reading-block" data-block="internal-1" transform="translate(0 1246)"><text class="se-copy" x="89" y="24"><tspan x="89">one sign of this development. The cycle is a recurring sequence of changes</tspan><tspan x="89" dy="32">involving the ovaries and the uterus.</tspan></text></g>
<g class="v2-reading-block" data-block="menstruation-0" transform="translate(0 1326)"><text class="se-copy" x="89" y="24"><tspan x="89">The uterus develops an inner lining. When pregnancy does not occur, some of</tspan><tspan x="89" dy="32">this lining leaves the body with blood through the vagina. This is <tspan class="se-bold">menstruation</tspan>,</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
