<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="online-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">sharing someone’s image or information. A person known only online may not</tspan><tspan x="89" dy="32">be who they claim to be.</tspan></text></g>
<g class="v2-reading-block" data-block="cyberbullying-0" transform="translate(0 192)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Cyberbullying</tspan> is bullying through digital devices or services. Examples include</tspan><tspan x="89" dy="32">repeated hurtful messages, spreading rumours and sharing private information</tspan></text></g>
<g class="v2-reading-block" data-block="cyberbullying-1" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">to embarrass someone. If this happens, tell a trusted adult. With their help, save</tspan><tspan x="89" dy="32">relevant evidence, use blocking or reporting tools, and avoid forwarding harmful</tspan><tspan x="89" dy="32">material.</tspan></text></g>
<g class="v2-reading-block" data-block="support-art" transform="translate(0 368)"><image class="science-illustration" data-photo="support" href="../../figures/class-7/science/ch06/support.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">A trusted adult can help a learner respond to an online problem without spreading the</tspan><tspan x="89" dy="27">harmful message.</tspan></text></g>
<g class="v2-reading-block" data-block="online-help-0" transform="translate(0 730)"><text class="se-copy" x="89" y="24"><tspan x="89">Being frightened or upset does not make someone responsible for bullying. If</tspan><tspan x="89" dy="32">one adult does not help, approach another. Friends can refuse to join in and help</tspan><tspan x="89" dy="32">the person find support.</tspan></text></g>
<g class="v2-reading-block" data-block="digital-task" transform="translate(0 842)"><rect class="se-activity-panel" x="89" y="0" width="874" height="338" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Design a group poster or pamphlet about responsible social-media</tspan><tspan x="146" dy="32">behaviour. Use fictional examples, with no personal photos, private</tspan><tspan x="146" dy="32">messages or identifying details.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">List helpful actions and actions to avoid in your notebook. Compare with</tspan><tspan x="146" dy="32">Table 6.4 and explain your suggestions.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Check clarity and kindness. With teacher approval, display your work in a</tspan><tspan x="146" dy="32">designated school space. Ask readers which action they could take.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
