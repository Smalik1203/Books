<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="20"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 20"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q5" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">5.</text><text class="se-copy" x="132" y="24"><tspan x="132">What questions would you ask to examine these claims? (a) Adolescents do</tspan><tspan x="132" dy="32">not need to pay attention to changes in behaviour. (b) A person who tries a</tspan><tspan x="132" dy="32">harmful substance once can stop whenever they want. Explain what reliable</tspan><tspan x="132" dy="32">information would help assess each claim.</tspan></text></g>
<g class="v2-reading-block" data-block="q6" transform="translate(0 270)"><text class="se-copy" x="111" y="24" text-anchor="end">6.</text><text class="se-copy" x="132" y="24"><tspan x="132">Some adolescents notice changing moods. What other changes in interests,</tspan><tspan x="132" dy="32">feelings or behaviour may occur? Give examples of constructive responses,</tspan><tspan x="132" dy="32">and explain why these examples should not become labels for all</tspan><tspan x="132" dy="32">adolescents.</tspan></text></g>
<g class="v2-reading-block" data-block="q7" transform="translate(0 428)"><text class="se-copy" x="111" y="24" text-anchor="end">7.</text><text class="se-copy" x="132" y="24"><tspan x="132">Mohini notices used pads scattered near a toilet bin. What</tspan><tspan x="132" dy="32">menstrual-hygiene habits and school facilities would help? Discuss clean</tspan><tspan x="132" dy="32">products, handwashing, privacy and disposal. Explain how to report the</tspan><tspan x="132" dy="32">problem without blaming or identifying anyone.</tspan></text></g>
<g class="v2-reading-block" data-block="q8" transform="translate(0 586)"><text class="se-copy" x="111" y="24" text-anchor="end">8.</text><text class="se-copy" x="132" y="24"><tspan x="132">Mary, aged 11, and Manoj, aged 12, both notice a change at the front of the</tspan><tspan x="132" dy="32">neck. After examination, a doctor identifies iodine-related thyroid</tspan><tspan x="132" dy="32">enlargement in Mary and ordinary larynx growth in Manoj. Why is the advice</tspan><tspan x="132" dy="32">different? Use the two structures taught in the chapter. Why would looking at</tspan><tspan x="132" dy="32">a photograph be insufficient to decide whether treatment is needed?</tspan></text></g>
<g class="v2-reading-block" data-block="q9" transform="translate(0 776)"><text class="se-copy" x="111" y="24" text-anchor="end">9.</text><text class="se-copy" x="132" y="24"><tspan x="132">Group these changes: voice change, breast development, moustache growth,</tspan><tspan x="132" dy="32">other facial hair, pimples, pubic hair and armpit hair. Use “common in boys</tspan><tspan x="132" dy="32">and girls”, “typically more pronounced in boys” and “typically seen in girls”.</tspan><tspan x="132" dy="32">Explain where a change can belong in more than one description, and why</tspan><tspan x="132" dy="32">“only” may be misleading.</tspan></text></g>
<g class="v2-reading-block" data-block="q10" transform="translate(0 966)"><text class="se-copy" x="111" y="24" text-anchor="end">10.</text><text class="se-copy" x="132" y="24"><tspan x="132">Make a poster offering practical tips for well-being during adolescence.</tspan><tspan x="132" dy="32">Include food, hygiene, activity, respectful relationships and access to help.</tspan><tspan x="132" dy="32">Use inclusive language and avoid judging appearance.</tspan></text></g><g transform="translate(0 1092)"><g data-page-illustration="figures/class-7/science/ch06/support.png"><image class="science-illustration" href="../../figures/class-7/science/ch06/support.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Talking with a trusted adult.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Talking with a trusted adult.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">20</text></g></svg></div></div></section>
