<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06 page--opener" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 1"><g class="chapter-opener" data-opener="science-g7-ch06"><defs><linearGradient id="science-g7-ch06-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop class="chapter-opener__gradient-start" offset="0%"/><stop class="chapter-opener__gradient-end" offset="100%"/></linearGradient></defs><path class="chapter-opener__band" fill="url(#science-g7-ch06-gradient)" d="M-17 -17H1069V300H-17Z"/><path class="chapter-opener__edge" d="M-17 296H1069V300H-17Z"/><g class="science-header-art" data-header-art="7-6" aria-hidden="true" transform="translate(886 26)"><g data-art-element="sprig" transform="translate(7 82) scale(1.12) rotate(-6 50 50)"><path d="M47 94Q37 52 58 7"/><path class="science-header-art__surface" d="M44 73Q12 72 10 46Q37 42 44 73ZM44 53Q70 49 86 27Q55 24 44 53ZM49 32Q22 34 21 9Q45 7 49 32Z"/><path d="M20 55L41 72M52 47L75 34M30 17L46 30"/></g><g data-art-element="notebook" transform="translate(72 0) scale(0.62) rotate(8 50 50)"><path class="science-header-art__soft" d="M23 12H86V91H23Q13 91 13 81V23Q13 12 23 12Z"/><path d="M27 12V91M9 28H20M9 43H20M9 58H20M9 73H20M39 30H74M39 43H68M39 56H75M39 69H59"/></g><g data-art-element="dialogue" transform="translate(64 184) scale(0.65) rotate(7 50 50)"><path class="science-header-art__soft" d="M8 17H65Q74 17 74 26V51Q74 60 65 60H32L16 72V60H8Q2 60 2 51V26Q2 17 8 17Z"/><path d="M80 37H89Q98 37 98 46V72Q98 81 89 81H84V93L68 81H47Q38 81 38 72V67"/><path d="M17 32H58M17 44H46M51 71H82"/></g></g><line class="chapter-opener__divider" x1="240" x2="240" y1="94" y2="252"/><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number se-running" x="151" y="242" text-anchor="middle">6</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">Adolescence: A Stage</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">of Growth and Change</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch06/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Young people observing stages of plant growth</title></image></g><text class="se-copy v2-intro" x="89" y="981"><tspan x="89">A seedling grows new leaves. Later, a mature plant may flower and</tspan><tspan x="89" dy="34">produce seeds. Growth brings changes in what a living thing can do.</tspan></text><text class="se-copy" x="89" y="1067"><tspan x="89">Animals also grow before becoming capable of reproduction. Some hatch from</tspan><tspan x="89" dy="32">eggs; others, including humans, are born as live young. Growing larger is only</tspan><tspan x="89" dy="32">part of this journey.</tspan></text><text class="se-copy" x="89" y="1179"><tspan x="89">Human development includes changes in the body, feelings and relationships. In</tspan><tspan x="89" dy="32">this chapter, explore adolescence with curiosity, reliable information and respect</tspan><tspan x="89" dy="32">for everyone’s privacy.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
