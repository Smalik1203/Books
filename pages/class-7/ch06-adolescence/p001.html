er se-running" x="151" y="242" text-anchor="middle">6</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">Adolescence: A Stage</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">of Growth and Change</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch06/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Young people observing stages of plant growth</title></image></g><text class="se-copy v2-intro" x="89" y="981" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.56399" data-extra-space="7.71522" data-space-ratio="2.387">A<tspan dx="7.71522"> seedling</tspan><tspan dx="7.71522"> grows</tspan><tspan dx="7.71522"> new</tspan><tspan dx="7.71522"> leaves.</tspan><tspan dx="7.71522"> Later,</tspan><tspan dx="7.71522"> a</tspan><tspan dx="7.71522"> mature</tspan><tspan dx="7.71522"> plant</tspan><tspan dx="7.71522"> may</tspan><tspan dx="7.71522"> flower</tspan><tspan dx="7.71522"> and</tspan></tspan><tspan x="89" dy="34" data-paragraph-end="true">produce seeds. Growth brings changes in what a living thing can do.</tspan></text><text class="se-copy" x="89" y="1067" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.10549" data-space-ratio="1.555">Animals<tspan dx="3.10549"> also</tspan><tspan dx="3.10549"> grow</tspan><tspan dx="3.10549"> before</tspan><tspan dx="3.10549"> becoming</tspan><tspan dx="3.10549"> capable</tspan><tspan dx="3.10549"> of</tspan><tspan dx="3.10549"> reproduction.</tspan><tspan dx="3.10549"> Some</tspan><tspan dx="3.10549"> hatch</tspan><tspan dx="3.10549"> from</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.55935" data-space-ratio="1.637">eggs;<tspan dx="3.55935"> others,</tspan><tspan dx="3.55935"> including</tspan><tspan dx="3.55935"> humans,</tspan><tspan dx="3.55935"> are</tspan><tspan dx="3.55935"> born</tspan><tspan dx="3.55935"> as</tspan><tspan dx="3.55935"> live</tspan><tspan dx="3.55935"> young.</tspan><tspan dx="3.55935"> Growing</tspan><tspan dx="3.55935"> larger</tspan><tspan dx="3.55935"> is</tspan><tspan dx="3.55935"> only</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">part of this journey.</tspan></text><text class="se-copy" x="89" y="1179" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.26049" data-space-ratio="1.225">Human<tspan dx="1.26049"> development</tspan><tspan dx="1.26049"> includes</tspan><tspan dx="1.26049"> changes</tspan><tspan dx="1.26049"> in</tspan><tspan dx="1.26049"> the</tspan><tspan dx="1.26049"> body,</tspan><tspan dx="1.26049"> feelings</tspan><tspan dx="1.26049"> and</tspan><tspan dx="1.26049"> relationships.</tspan><tspan dx="1.26049"> In</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.98679" data-space-ratio="1.176">this<tspan dx="0.98679"> chapter,</tspan><tspan dx="0.98679"> explore</tspan><tspan dx="0.98679"> adolescence</tspan><tspan dx="0.98679"> with</tspan><tspan dx="0.98679"> curiosity,</tspan><tspan dx="0.98679"> reliable</tspan><tspan dx="0.98679"> information</tspan><tspan dx="0.98679"> and</tspan><tspan dx="0.98679"> respect</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">for everyone’s privacy.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
