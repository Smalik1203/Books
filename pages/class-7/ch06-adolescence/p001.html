<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06 page--opener" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 1"><g class="chapter-opener" data-opener="science-g7-ch06"><defs><linearGradient id="science-g7-ch06-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop class="chapter-opener__gradient-start" offset="0%"/><stop class="chapter-opener__gradient-end" offset="100%"/></linearGradient></defs><path class="chapter-opener__band" fill="url(#science-g7-ch06-gradient)" d="M-17 -17H1069V300H-17Z"/><path class="chapter-opener__edge" d="M-17 296H1069V300H-17Z"/><g class="chapter-opener__motif v2-change-motif" transform="translate(951 84) scale(1.05)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><line class="chapter-opener__divider" x1="240" x2="240" y1="94" y2="252"/><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number se-running" x="151" y="242" text-anchor="middle">6</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">Adolescence: A Stage</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">of Growth and Change</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch06/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Young people observing stages of plant growth</title></image></g><text class="se-copy v2-intro" x="89" y="981"><tspan x="89">A seedling grows new leaves. Later, a mature plant may flower and</tspan><tspan x="89" dy="34">produce seeds. Growth brings changes in what a living thing can do.</tspan></text><text class="se-copy" x="89" y="1067"><tspan x="89">Animals also grow before becoming capable of reproduction. Some hatch from</tspan><tspan x="89" dy="32">eggs; others, including humans, are born as live young. Growing larger is only</tspan><tspan x="89" dy="32">part of this journey.</tspan></text><text class="se-copy" x="89" y="1179"><tspan x="89">Human development includes changes in the body, feelings and relationships. In</tspan><tspan x="89" dy="32">this chapter, explore adolescence with curiosity, reliable information and respect</tspan><tspan x="89" dy="32">for everyone’s privacy.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
