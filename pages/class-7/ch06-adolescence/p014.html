<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="smoke-figure" transform="translate(0 112)"><g class="v2-change-diagram" data-diagram="smoke"><svg class="science-illustration" data-apparatus="airway" x="246" y="41" width="138.85819975339086" height="137" viewBox="45 35 822 811" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch06/apparatus-airway.png" width="1774" height="887"/></svg><svg class="science-illustration" data-apparatus="airway" x="666" y="41" width="138.01356350184957" height="137" viewBox="936 35 817 811" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch06/apparatus-airway.png" width="1774" height="887"/></svg><text class="v2-change-label se-bold" x="316" y="211" text-anchor="middle">Open airway</text><text class="v2-change-label" x="316" y="247" text-anchor="middle">Air moves through</text><text class="v2-change-label se-bold" x="736" y="211" text-anchor="middle">Inflamed airway</text><text class="v2-change-label" x="736" y="247" text-anchor="middle">Less space for air</text><text class="v2-change-label" x="526" y="20" text-anchor="middle">Airway cross-sections · simplified model</text></g><text class="se-caption" x="89" y="298.88"><tspan x="89">An explanatory comparison: tobacco smoke harms airways and lung tissue. This is not a</tspan><tspan x="89" dy="27">picture of how every affected lung looks.</tspan></text></g>
<g class="v2-reading-block" data-block="substance-effects-0" transform="translate(0 466)"><text class="se-copy" x="89" y="24"><tspan x="89">The effects depend on the substance and exposure. Tobacco smoke can damage</tspan><tspan x="89" dy="32">the lungs and make breathing difficult. Alcohol and other drugs can affect</tspan></text></g>
<g class="v2-reading-block" data-block="substance-effects-1" transform="translate(0 530)"><text class="se-copy" x="89" y="24"><tspan x="89">judgement, memory and physical or mental health. Avoiding harmful substances</tspan><tspan x="89" dy="32">protects health; prescribed medicines should be used only as directed.</tspan></text></g>
<g class="v2-reading-block" data-block="substance-help-0" transform="translate(0 610)"><text class="se-copy" x="89" y="24"><tspan x="89">A person finding it hard to stop needs support, counselling and sometimes</tspan><tspan x="89" dy="32">medical treatment. A trusted adult can help contact a health professional. Nasha</tspan></text></g>
<g class="v2-reading-block" data-block="substance-help-1" transform="translate(0 674)"><text class="se-copy" x="89" y="24"><tspan x="89">Mukt Bharat Abhiyaan, led by India’s Ministry of Social Justice and</tspan><tspan x="89" dy="32">Empowerment, promotes prevention and community awareness. The National</tspan><tspan x="89" dy="32">De-addiction Helpline is <tspan class="se-bold">14446</tspan>.</tspan></text></g>
<g class="v2-reading-block" data-block="hormones-head" transform="translate(0 798)"><text class="v2-title" x="89" y="38"><tspan x="89">6.5 Why Do These Changes Occur?</tspan></text></g>
<g class="v2-reading-block" data-block="hormones-0" transform="translate(0 856)"><text class="se-copy" x="89" y="24"><tspan x="89">Many changes at puberty are coordinated by <tspan class="se-bold">hormones</tspan>, chemical messengers</tspan><tspan x="89" dy="32">made in the body. They travel in the blood and act on particular cells or organs.</tspan></text></g>
<g class="v2-reading-block" data-block="hormones-1" transform="translate(0 920)"><text class="se-copy" x="89" y="24"><tspan x="89">Signals involving the brain and hormone-producing glands help regulate growth</tspan><tspan x="89" dy="32">and reproductive development.</tspan></text></g>
<g class="v2-reading-block" data-block="hormone-figure" transform="translate(0 1000)"><g class="v2-change-diagram" data-diagram="hormones"><rect class="v2-change-box" x="100" y="10" width="252" height="59" rx="9"/><text class="v2-change-label" x="226" y="43" text-anchor="middle">Brain and glands</text><path class="v2-change-line" d="M365 39L402 39"/><path class="v2-change-line" d="M394 33L402 39L394 45"/><rect class="v2-change-box" x="414" y="10" width="232" height="59" rx="9"/><text class="v2-change-label" x="530" y="43" text-anchor="middle">Hormones in blood</text><path class="v2-change-line" d="M660 39L697 39"/><path class="v2-change-line" d="M689 33L697 39L689 45"/><rect class="v2-change-box" x="709" y="10" width="244" height="59" rx="9"/><text class="v2-change-label" x="831" y="43" text-anchor="middle">Responsive tissues</text></g><text class="se-caption" x="89" y="110.88"><tspan x="89">Hormonal signals act alongside nutrition, health and inherited differences.</tspan></text></g>
<g class="v2-reading-block" data-block="hormone-limits-0" transform="translate(0 1139)"><text class="se-copy" x="89" y="24"><tspan x="89">Hormones influence feelings, but sleep, relationships, experiences and</tspan><tspan x="89" dy="32">surroundings also matter. Dismissing a worry as “just hormones” can prevent</tspan><tspan x="89" dy="32">someone from receiving support.</tspan></text></g>
<g class="v2-reading-block" data-block="closing-0" transform="translate(0 1251)"><text class="se-copy" x="89" y="24"><tspan x="89">Adolescence includes common processes and individual differences. Reliable</tspan><tspan x="89" dy="32">information, respectful relationships and healthy routines help. Questions are</tspan></text></g>
<g class="v2-reading-block" data-block="closing-1" transform="translate(0 1315)"><text class="se-copy" x="89" y="24"><tspan x="89">welcome; discuss private concerns with trusted people who can offer appropriate</tspan><tspan x="89" dy="32">guidance.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
