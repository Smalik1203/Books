<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="646" rx="18"/><text class="se-copy" x="113" y="222" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Adolescence</tspan> — The stage between</tspan><tspan x="113" dy="32" data-narrow-prose="true">childhood and adulthood, usually</tspan><tspan x="113" dy="32" data-paragraph-end="true">defined as ages 10–19.</tspan></text><text class="se-copy" x="113" y="338" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Puberty</tspan> — Physical changes through</tspan><tspan x="113" dy="32" data-narrow-prose="true">which the body develops</tspan><tspan x="113" dy="32" data-paragraph-end="true">reproductive capability.</tspan></text><text class="se-copy" x="113" y="454" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Secondary</tspan> <tspan class="se-bold">sexual</tspan> <tspan class="se-bold">characteristics</tspan> —</tspan><tspan x="113" dy="32" data-narrow-prose="true">Features developing at puberty that</tspan><tspan x="113" dy="32" data-narrow-prose="true">are not the reproductive organs</tspan><tspan x="113" dy="32" data-paragraph-end="true">themselves.</tspan></text><text class="se-copy" x="113" y="602" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Larynx</tspan> — The voice box, containing</tspan><tspan x="113" dy="32" data-narrow-prose="true">the vocal folds that vibrate to</tspan><tspan x="113" dy="32" data-paragraph-end="true">produce sound.</tspan></text><text class="se-copy" x="113" y="718" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Acne</tspan> — A skin condition involving</tspan><tspan x="113" dy="32" data-narrow-prose="true">blocked follicles and inflammation,</tspan><tspan x="113" dy="32" data-paragraph-end="true">often producing pimples.</tspan></text><text class="se-copy" x="541" y="222" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Menstruation</tspan> — The shedding of</tspan><tspan x="541" dy="32" data-narrow-prose="true">part of the uterine lining, with</tspan><tspan x="541" dy="32" data-paragraph-end="true">blood, through the vagina.</tspan></text><text class="se-copy" x="541" y="338" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Menopause</tspan> — The natural end of</tspan><tspan x="541" dy="32" data-paragraph-end="true">menstrual periods later in adult life.</tspan></text><text class="se-copy" x="541" y="422" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Hormones</tspan> — Chemical messengers</tspan><tspan x="541" dy="32" data-paragraph-end="true">that help regulate body processes.</tspan></text><text class="se-copy" x="541" y="506" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Anaemia</tspan> — A condition in which</tspan><tspan x="541" dy="32" data-narrow-prose="true">blood has too few healthy red blood</tspan><tspan x="541" dy="32" data-narrow-prose="true">cells or too little haemoglobin to</tspan><tspan x="541" dy="32" data-paragraph-end="true">carry oxygen effectively.</tspan></text><text class="se-copy" x="541" y="654" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Addiction</tspan> — Difficulty controlling</tspan><tspan x="541" dy="32" data-narrow-prose="true">substance use despite harm, often</tspan><tspan x="541" dy="32" data-paragraph-end="true">with strong urges.</tspan></text><g transform="translate(0 820)"><g data-page-illustration="figures/class-7/science/ch08/swing.png"><image class="science-illustration" href="../../figures/class-7/science/ch08/swing.png" x="166" y="10" width="720" height="280" preserveAspectRatio="xMidYMid meet"><title>Play and supportive friendships matter.</title></image><text class="se-caption" x="526" y="318" text-anchor="middle"><tspan x="526">Play and supportive friendships matter.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
