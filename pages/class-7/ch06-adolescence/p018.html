<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204"><tspan x="112">Adolescence, usually ages 10–19, connects childhood and adulthood. Physical,</tspan><tspan x="112" dy="32">emotional and social development do not follow an identical timetable for</tspan><tspan x="112" dy="32">everyone.</tspan></text><text class="se-copy" x="89" y="310" text-anchor="start">•</text><text class="se-copy" x="112" y="310"><tspan x="112">Height, body shape, voice, skin and hair may change. Variation is expected,</tspan><tspan x="112" dy="32">and people deserve privacy and respect.</tspan></text><text class="se-copy" x="89" y="384" text-anchor="start">•</text><text class="se-copy" x="112" y="384"><tspan x="112">Secondary sexual characteristics develop during puberty but are not the</tspan><tspan x="112" dy="32">reproductive organs. Puberty brings reproductive capability; this is not the</tspan><tspan x="112" dy="32">same as readiness for adult responsibilities.</tspan></text><text class="se-copy" x="89" y="490" text-anchor="start">•</text><text class="se-copy" x="112" y="490"><tspan x="112">Menstruation is one phase of the menstrual cycle. Teen cycles commonly last</tspan><tspan x="112" dy="32">21–45 days, with variation especially early on. Menopause usually occurs much</tspan><tspan x="112" dy="32">later, between ages 45 and 55.</tspan></text><text class="se-copy" x="89" y="596" text-anchor="start">•</text><text class="se-copy" x="112" y="596"><tspan x="112">Feelings can influence behaviour, but we can pause, consider choices and ask</tspan><tspan x="112" dy="32">for support. No single emotional pattern describes every adolescent.</tspan></text><text class="se-copy" x="89" y="670" text-anchor="start">•</text><text class="se-copy" x="112" y="670"><tspan x="112">A varied diet supplies energy, protein, vitamins and minerals. Iron and vitamin</tspan><tspan x="112" dy="32">B12 help healthy blood formation; concerns about deficiencies need</tspan><tspan x="112" dy="32">appropriate assessment.</tspan></text><text class="se-copy" x="89" y="776" text-anchor="start">•</text><text class="se-copy" x="112" y="776"><tspan x="112">Hygiene, menstrual supplies, private facilities, safe disposal, physical activity</tspan><tspan x="112" dy="32">and rest support health and participation.</tspan></text><text class="se-copy" x="89" y="850" text-anchor="start">•</text><text class="se-copy" x="112" y="850"><tspan x="112">Respect boundaries and privacy in person and online. Do not share harmful</tspan><tspan x="112" dy="32">messages or private images; seek trusted help for bullying.</tspan></text><text class="se-copy" x="89" y="924" text-anchor="start">•</text><text class="se-copy" x="112" y="924"><tspan x="112">Avoid tobacco, alcohol and harmful drugs. Addiction needs supportive care,</tspan><tspan x="112" dy="32">not blame. Trusted adults and health services can help.</tspan></text><text class="se-copy" x="89" y="998" text-anchor="start">•</text><text class="se-copy" x="112" y="998"><tspan x="112">Hormones help coordinate growth and puberty. Reliable information and</tspan><tspan x="112" dy="32">guidance help young people understand changes and make informed choices.</tspan></text><g transform="translate(0 1048)"><g data-page-illustration="figures/class-7/science/ch06/support.png"><image class="science-illustration" href="../../figures/class-7/science/ch06/support.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Talking with a trusted adult.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Talking with a trusted adult.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
