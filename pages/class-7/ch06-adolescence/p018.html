<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="18" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Explore Further</tspan></text></g>
<g class="v2-reading-block" data-block="project-interview-head" transform="translate(0 182)"><text class="se-heading" x="89" y="30"><tspan x="89">Find Out About Local Support</tspan></text></g>
<g class="v2-reading-block" data-block="project-interview-0" transform="translate(0 230)"><text class="se-copy" x="89" y="24"><tspan x="89">With your teacher, identify a person or organisation supporting young people’s</tspan><tspan x="89" dy="32">mental health. Prepare at least five questions about their work, available help,</tspan></text></g>
<g class="v2-reading-block" data-block="project-interview-1" transform="translate(0 294)"><text class="se-copy" x="89" y="24"><tspan x="89">privacy, access and ways schools can support learners. Let the teacher arrange</tspan><tspan x="89" dy="32">any interview and obtain permission before recording. Do not collect anyone’s</tspan></text></g>
<g class="v2-reading-block" data-block="project-interview-2" transform="translate(0 358)"><text class="se-copy" x="89" y="24"><tspan x="89">diagnosis or personal history. Summarise the service information in your</tspan><tspan x="89" dy="32">notebook.</tspan></text></g>
<g class="v2-reading-block" data-block="project-roleplay-head" transform="translate(0 450)"><text class="se-heading" x="89" y="30"><tspan x="89">A Role Play About Childhood and Choice</tspan></text></g>
<g class="v2-reading-block" data-block="project-roleplay-0" transform="translate(0 498)"><text class="se-copy" x="89" y="24"><tspan x="89">Create a fictional role play about how child marriage can harm health, education,</tspan><tspan x="89" dy="32">safety and opportunities, particularly for girls. Show a young person receiving</tspan></text></g>
<g class="v2-reading-block" data-block="project-roleplay-1" transform="translate(0 562)"><text class="se-copy" x="89" y="24"><tspan x="89">support from trusted adults. Explain why puberty is not readiness for marriage or</tspan><tspan x="89" dy="32">parenthood. Avoid using real classmates’ experiences or making anyone disclose</tspan><tspan x="89" dy="32">private information. Discuss what a supportive community could do.</tspan></text></g>
<g class="v2-reading-block" data-block="project-yoga-head" transform="translate(0 686)"><text class="se-heading" x="89" y="30"><tspan x="89">Plan an Inclusive Yoga Session</tspan></text></g>
<g class="v2-reading-block" data-block="project-yoga-0" transform="translate(0 734)"><text class="se-copy" x="89" y="24"><tspan x="89">International Yoga Day is observed on 21 June. With a trained teacher, plan a</tspan><tspan x="89" dy="32">small session of suitable asanas and gentle movement. Provide comfortable</tspan></text></g>
<g class="v2-reading-block" data-block="project-yoga-1" transform="translate(0 798)"><text class="se-copy" x="89" y="24"><tspan x="89">alternatives, including seated participation, and make participation voluntary.</tspan><tspan x="89" dy="32">Never force a stretch or hold the breath. Stop if there is pain or dizziness and tell</tspan><tspan x="89" dy="32">the teacher. Reflect on how clear guidance and inclusion helped the session.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
