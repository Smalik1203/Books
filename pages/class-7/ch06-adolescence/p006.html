<section class="page page--food page--science-editorial page--science-v2 page--g7-ch06" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Adolescence: A Stage of Growth and Change, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M32 95V35C10 36 0 21 2 7C22 5 33 19 32 35C32 13 47 0 66 0C66 23 50 36 32 35M13 95H52"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 6</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Adolescence: Growth and Change</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="cycle-variation-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">A period is only one part of the cycle. In adolescents, cycles commonly last 21 to</tspan><tspan x="89" dy="32">45 days, and bleeding generally lasts no more than seven days. Cycles can be</tspan></text></g>
<g class="v2-reading-block" data-block="cycle-variation-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">irregular during the first few years. A 28-day example is not a deadline that every</tspan><tspan x="89" dy="32">body must meet.</tspan></text></g>
<g class="v2-reading-block" data-block="period-support-0" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">Some people experience cramps or discomfort. Talk to a trusted adult or health</tspan><tspan x="89" dy="32">professional about very heavy bleeding, severe pain, a gap of more than three</tspan></text></g>
<g class="v2-reading-block" data-block="period-support-1" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89">months between periods, or any worry. Having a concern checked is more useful</tspan><tspan x="89" dy="32">than comparing private experiences with classmates.</tspan></text></g>
<g class="v2-reading-block" data-block="menopause-0" transform="translate(0 400)"><text class="se-copy" x="89" y="24"><tspan x="89">Much later in life, menstrual periods stop naturally at <tspan class="se-bold">menopause</tspan>, usually</tspan><tspan x="89" dy="32">between ages 45 and 55. This is different from the temporary irregularity that</tspan></text></g>
<g class="v2-reading-block" data-block="menopause-1" transform="translate(0 464)"><text class="se-copy" x="89" y="24"><tspan x="89">may occur when periods first begin. A person’s needs change across life, and</tspan><tspan x="89" dy="32">reliable information and care remain important.</tspan></text></g>
<g class="v2-reading-block" data-block="myths-0" transform="translate(0 544)"><text class="se-copy" x="89" y="24"><tspan x="89">No scientific reason supports treating a menstruating person as impure or</tspan><tspan x="89" dy="32">isolating them. People can learn, play and take part in daily life during periods,</tspan></text></g>
<g class="v2-reading-block" data-block="myths-1" transform="translate(0 608)"><text class="se-copy" x="89" y="24"><tspan x="89">with rest or support when needed. Privacy, clean facilities and freedom from</tspan><tspan x="89" dy="32">teasing help everyone participate comfortably.</tspan></text></g>
<g class="v2-reading-block" data-block="period-pause" transform="translate(0 688)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="262" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A learner misses a school activity because there is no private place to change</tspan><tspan x="113" dy="32">a pad. Someone says that periods themselves prevent participation.</tspan></text><text class="se-copy" x="113" y="168"><tspan x="113">Separate the body process from the problem with facilities. What practical</tspan><tspan x="113" dy="32">changes could the school make? Explain why support should not require</tspan><tspan x="113" dy="32">anyone to announce that they are menstruating.</tspan></text></g><g transform="translate(0 972)"><g data-page-illustration="figures/class-7/science/ch06/hygiene.png"><image class="science-illustration" href="../../figures/class-7/science/ch06/hygiene.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Personal hygiene supplies.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Personal hygiene supplies.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
