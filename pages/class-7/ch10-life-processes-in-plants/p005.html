<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="leaves" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">10.2.1 Leaves and the Starch Test</tspan></text></g>
<g class="v2-reading-block" data-block="leaf-structure-0" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89">Many leaves are broad and thin, exposing a large surface to light while keeping</tspan><tspan x="89" dy="32">internal cells near air spaces and veins. Green tissues contain <tspan class="se-bold">chlorophyll</tspan>, a</tspan></text></g>
<g class="v2-reading-block" data-block="leaf-structure-1" transform="translate(0 224)"><text class="se-copy" x="89" y="24"><tspan x="89">pigment that absorbs light used in making food. Leaf shapes vary with habitat;</tspan><tspan x="89" dy="32">broad leaves are not the only workable design. Some sugars made by a plant are</tspan><tspan x="89" dy="32">converted into <tspan class="se-bold">starch</tspan> for storage.</tspan></text></g>
<g class="v2-reading-block" data-block="starch-question-0" transform="translate(0 336)"><text class="se-copy" x="89" y="24"><tspan x="89">Recall the iodine test from the animal-nutrition chapter. A blue-black colour</tspan><tspan x="89" dy="32">provides evidence of detectable starch. To see the reaction in a leaf, a teacher</tspan></text></g>
<g class="v2-reading-block" data-block="starch-question-1" transform="translate(0 400)"><text class="se-copy" x="89" y="24"><tspan x="89">first removes much of its green pigment. Testing one leaf for starch does not by</tspan><tspan x="89" dy="32">itself reveal when, where or under which conditions that starch formed.</tspan></text></g>
<g class="v2-reading-block" data-block="leaf-sampling-0" transform="translate(0 480)"><text class="se-copy" x="89" y="24"><tspan x="89">A leaf test is destructive: the same leaf cannot be tested again after a day in light.</tspan><tspan x="89" dy="32">Comparisons therefore use similar leaves of the same age, from matching plants.</tspan></text></g>
<g class="v2-reading-block" data-block="leaf-sampling-1" transform="translate(0 544)"><text class="se-copy" x="89" y="24"><tspan x="89">Label samples before treatment so they cannot be confused. When comparing</tspan><tspan x="89" dy="32">patches, use a sketch to preserve their positions. Choose leaves large enough to</tspan></text></g>
<g class="v2-reading-block" data-block="leaf-sampling-2" transform="translate(0 608)"><text class="se-copy" x="89" y="24"><tspan x="89">handle safely, but do not assume that the largest leaf contains the most starch. A</tspan><tspan x="89" dy="32">photograph or drawing records appearance; iodine supplies a different kind of</tspan><tspan x="89" dy="32">evidence.</tspan></text></g><g transform="translate(0 720)"><g data-page-illustration="figures/class-7/science/ch10/variegated-leaf.png"><image class="science-illustration" href="../../figures/class-7/science/ch10/variegated-leaf.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A variegated leaf.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A variegated leaf.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">5</text></g></svg></div></div></section>
