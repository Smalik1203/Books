<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="17"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 17"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="dye-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Coloured regions above the liquid level support upward movement of water</tspan><tspan x="89" dy="32">containing the dye. Colour may be easier to see in pale petals or a cut stem than</tspan></text></g>
<g class="v2-reading-block" data-block="dye-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">in green leaves. No obvious petal colour does not prove that water failed to move:</tspan><tspan x="89" dy="32">species, dye, exposure time and the cut ends affect the result.</tspan></text></g>
<g class="v2-reading-block" data-block="transport-detail" transform="translate(0 256)"><g class="v2-plant-diagram" data-diagram="stem-detail"><image class="science-illustration" data-art="stem-detail" href="../../figures/class-7/science/ch10/stem-detail.png" x="289.75" y="25" width="472.5" height="315" preserveAspectRatio="xMidYMid meet"/><text class="v2-plant-label" x="446" y="375" text-anchor="middle">Cut stem</text><text class="v2-plant-label" x="704" y="375" text-anchor="middle">Vascular bundle</text><text class="v2-plant-label" x="100" y="91" text-anchor="start">Xylem</text><line class="v2-plant-line" x1="181" y1="86" x2="459" y2="83"/><text class="v2-plant-label" x="840" y="110" text-anchor="start">Phloem</text><line class="v2-plant-line" x1="827" y1="105" x2="737" y2="175"/></g><text class="se-caption" x="89" y="415.88"><tspan x="89">Illustrative stem tissue after a dye test and an enlarged vascular bundle. Stained</tspan><tspan x="89" dy="27">water-conducting regions are distinct from the food-conducting tissue; positions vary with</tspan><tspan x="89" dy="27">plant type.</tspan></text></g>
<g class="v2-reading-block" data-block="xylem-0" transform="translate(0 754)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Xylem</tspan> contains conducting tubes that carry water and dissolved minerals,</tspan><tspan x="89" dy="32">mainly from roots towards shoots. Evaporation from moist leaf surfaces and loss</tspan></text></g>
<g class="v2-reading-block" data-block="xylem-1" transform="translate(0 818)"><text class="se-copy" x="89" y="24"><tspan x="89">of water vapour through stomata, called <tspan class="se-bold">transpiration</tspan>, help draw water upwards</tspan><tspan x="89" dy="32">through connected columns. Roots supply water to replace what is lost. Plants do</tspan><tspan x="89" dy="32">not have a hidden pump equivalent to a heart.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">17</text></g></svg></div></div></section>
