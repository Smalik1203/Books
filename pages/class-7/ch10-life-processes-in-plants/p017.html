<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="17"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 17"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="respiration" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">10.4 Do Plants Respire?</tspan></text></g>
<g class="v2-reading-block" data-block="respiration-question-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">A germinating seed can grow before it has green leaves. Its living cells use stored</tspan><tspan x="89" dy="32">food, releasing usable energy through <tspan class="se-bold">respiration</tspan>. To look for a product of this</tspan></text></g>
<g class="v2-reading-block" data-block="respiration-question-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">process, compare air around germinating seeds with air in a matched control.</tspan><tspan x="89" dy="32">Darkness prevents photosynthesis from removing carbon dioxide during the</tspan><tspan x="89" dy="32">comparison.</tspan></text></g>
<g class="v2-reading-block" data-block="seed-task" transform="translate(0 346)"><rect class="se-activity-panel" x="89" y="0" width="874" height="930" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Teacher demonstration: germinate overnight-soaked moong beans on</tspan><tspan x="146" dy="32">moist cotton. Put a small measured sample on damp cotton in flask A. In</tspan><tspan x="146" dy="32">matching B, use the same cotton and an equal volume of clean glass</tspan><tspan x="146" dy="32">beads.</tspan></text><text class="se-activity-step" x="132" y="232" text-anchor="end">2.</text><text class="se-copy" x="146" y="232"><tspan x="146">Keep both dark for a short teacher-selected interval, with plenty of air</tspan><tspan x="146" dy="32">space. Do not flood the cotton or use mouldy seeds.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Fit two-hole stoppers. With separate needle-free syringes, gently draw</tspan><tspan x="146" dy="32">equal small volumes of headspace air. Briefly open each second tube to</tspan><tspan x="146" dy="32">admit replacement air; do not draw liquid.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Pass equal gas volumes into equal fresh lime-water samples in separate</tspan><tspan x="146" dy="32">open tubes. Compare initial and final cloudiness; repeat. Record</tspan><tspan x="146" dy="32">contents, time, volume and observation.</tspan></text><image class="science-illustration" data-photo="seed-flasks" href="../../figures/class-7/science/ch10/seed-flasks.png" x="113" y="500" width="450" height="300" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="225.5" y="828" text-anchor="middle">A: seeds</text><text class="se-caption" x="450.5" y="828" text-anchor="middle">B: control</text><text class="se-copy" x="591" y="536"><tspan x="591">Teacher handles glass and</tspan><tspan x="591" dy="32">alkaline lime water with eye</tspan><tspan x="591" dy="32">protection. Never suck or blow</tspan><tspan x="591" dy="32">through reagents or taste seeds.</tspan><tspan x="591" dy="32">Vent flasks afterwards; avoid</tspan><tspan x="591" dy="32">prolonged airtight storage.</tspan></text><text class="se-caption" x="113" y="874.88"><tspan x="113">Seeds and a matched moist-cotton control. The syringe transfers gas to separate</tspan><tspan x="113" dy="27">lime-water tubes; it never passes through a seed or contains a needle.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">17</text></g></svg></div></div></section>
