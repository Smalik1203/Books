<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="22"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 22"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="assessment-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Let Us Enhance Our Learning</tspan></text></g>
<g class="v2-reading-block" data-block="assessment-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Use your notebook. Support each answer with evidence and explain any</tspan><tspan x="89" dy="32">uncertainty.</tspan></text></g>
<g class="v2-reading-block" data-block="q1" transform="translate(0 250)"><text class="se-copy" x="111" y="24" text-anchor="end">1.</text><text class="se-copy" x="132" y="24"><tspan x="132">In your notebook, compare photosynthesis and aerobic respiration under</tspan><tspan x="132" dy="32">four matching headings: raw materials, products, word equation and</tspan><tspan x="132" dy="32">importance. State the role of light in each and show energy separately from</tspan><tspan x="132" dy="32">material substances.</tspan></text></g>
<g class="v2-reading-block" data-block="q2" transform="translate(0 408)"><text class="se-copy" x="111" y="24" text-anchor="end">2.</text><text class="se-copy" x="132" y="24"><tspan x="132">Imagine that all organisms carrying out photosynthesis disappeared. Explain</tspan><tspan x="132" dy="32">likely effects on food supplies, food chains and oxygen over time. Would</tspan><tspan x="132" dy="32">every stored food supply and all atmospheric oxygen disappear immediately?</tspan><tspan x="132" dy="32">Give reasons.</tspan></text></g>
<g class="v2-reading-block" data-block="q3" transform="translate(0 566)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24"><tspan x="132">A potato slice turns blue-black with iodine. Explain where the carbohydrate</tspan><tspan x="132" dy="32">was made, how soluble food reached the potato and why finding starch in the</tspan><tspan x="132" dy="32">tuber does not prove that it photosynthesised underground.</tspan></text></g>
<g class="v2-reading-block" data-block="q4" transform="translate(0 692)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24"><tspan x="132">How can a broad, flat leaf help photosynthesis? Give a reason involving light</tspan><tspan x="132" dy="32">and another involving gas exchange. Explain why leaves in dry environments</tspan><tspan x="132" dy="32">may have different structures.</tspan></text></g>
<g class="v2-reading-block" data-block="q5" transform="translate(0 818)"><text class="se-copy" x="111" y="24" text-anchor="end">5.</text><text class="se-copy" x="132" y="24"><tspan x="132">Identify X, Y and Z in this summary of aerobic respiration: X + Y → carbon</tspan><tspan x="132" dy="32">dioxide + Z, with usable energy released. Explain why plants need this</tspan><tspan x="132" dy="32">process even when they can make their own food.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">22</text></g></svg></div></div></section>
