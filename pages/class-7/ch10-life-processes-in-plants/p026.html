<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="26"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 26"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q8" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">8.</text><text class="se-copy" x="132" y="24"><tspan x="132">Ananya considers four tubes three-quarters full of water and the same</tspan><tspan x="132" dy="32">carbon-dioxide indicator: A with a snail, B with a water plant, C with both, D</tspan><tspan x="132" dy="32">with neither. She compares colours after 2–3 hours. What might she be</tspan><tspan x="132" dy="32">investigating, and why is D needed? State the light conditions, indicator</tspan><tspan x="132" dy="32">colour key and other controls needed before predicting results. Use supplied</tspan><tspan x="132" dy="32">records or a simulation; do not confine animals in classroom tubes.</tspan></text><g transform="translate(0 208)"><g class="v2-plant-diagram" data-diagram="snail-tubes"><image class="science-illustration" data-art="snail-tubes" href="../../figures/class-7/science/ch10/snail-tubes.png" x="304.75" y="0" width="442.5" height="295" preserveAspectRatio="xMidYMid meet"/><text class="v2-plant-label" x="388" y="323" text-anchor="middle">A</text><text class="v2-plant-label" x="478" y="323" text-anchor="middle">B</text><text class="v2-plant-label" x="570" y="323" text-anchor="middle">C</text><text class="v2-plant-label" x="661" y="323" text-anchor="middle">D</text></g></g><text class="se-caption" x="89" y="568.88"><tspan x="89">The initial liquids have the same colour. No later colours are supplied; specify the missing</tspan><tspan x="89" dy="27">information before drawing conclusions.</tspan></text></g>
<g class="v2-reading-block" data-block="q9" transform="translate(0 740)"><text class="se-copy" x="111" y="24" text-anchor="end">9.</text><text class="se-copy" x="132" y="24"><tspan x="132">Design a coloured-water investigation comparing water transport in warm</tspan><tspan x="132" dy="32">and cool conditions. Specify safe temperatures, matching stems and</tspan><tspan x="132" dy="32">solutions, what you will measure and repeats. How would changes in</tspan><tspan x="132" dy="32">humidity, leaf area or airflow complicate the comparison? Do not boil, freeze</tspan><tspan x="132" dy="32">or heat plants directly.</tspan></text></g>
<g class="v2-reading-block" data-block="q10" transform="translate(0 930)"><text class="se-copy" x="111" y="24" text-anchor="end">10.</text><text class="se-copy" x="132" y="24"><tspan x="132">Explain how photosynthesis and respiration connect food, oxygen and</tspan><tspan x="132" dy="32">carbon dioxide in nature. Why is “balance” not a claim that every plant</tspan><tspan x="132" dy="32">always produces exactly as much oxygen as it uses? Include growth and</tspan><tspan x="132" dy="32">storage in your answer.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">26</text></g></svg></div></div></section>
