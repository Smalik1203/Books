unwatered plant in</tspan><tspan x="113" dy="32">darkness. Explain why it cannot tell which difference caused the result.</tspan><tspan x="113" dy="32">Design a clearer comparison.</tspan></text></g>
<g class="v2-reading-block" data-block="vrikshayurveda" transform="translate(0 428)"><text class="se-copy" x="89" y="24"><tspan x="89">The historical text Vrikshayurveda records observations about plants, soil, crop</tspan><tspan x="89" dy="32">care and manure preparation, including mixtures involving water, barley and</tspan><tspan x="89" dy="32">pulse seeds. It recognises that planting alone does not ensure flowers and fruit.</tspan><tspan x="89" dy="32">Such records are part of agricultural history; a particular treatment still needs a</tspan><tspan x="89" dy="32">fair comparison before we assume that it works in every soil or climate.</tspan></text></g>
<g class="v2-reading-block" data-block="food" transform="translate(0 616)"><text class="v2-title" x="89" y="38"><tspan x="89">10.2 How Do Plants Obtain Food?</tspan></text></g>
<g class="v2-reading-block" data-block="food-origin-0" transform="translate(0 674)"><text class="se-copy" x="89" y="24"><tspan x="89">Most green plants make carbohydrates from carbon dioxide and water using light</tspan><tspan x="89" dy="32">energy. Roots supply water and mineral nutrients, but minerals are not the</tspan></text></g>
<g class="v2-reading-block" data-block="food-origin-1" transform="translate(0 738)"><text class="se-copy" x="89" y="24"><tspan x="89">plant’s ready-made carbohydrate food. Much of the carbon in new plant material</tspan><tspan x="89" dy="32">comes from carbon dioxide in air. Animals depend on photosynthetic producers</tspan><tspan x="89" dy="32">directly or through food chains.</tspan></text></g><g transform="translate(0 850)"><g data-page-illustration="figures/class-7/science/ch10/growth-setup.png"><image class="science-illustration" href="../../figures/class-7/science/ch10/growth-setup.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Seedlings for a growth investigation.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Seedlings for a growth investigation.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
