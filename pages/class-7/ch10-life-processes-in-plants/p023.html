<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="23"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 23"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="4.43405" data-space-ratio="1.793">Plant<tspan dx="4.43405"> growth</tspan><tspan dx="4.43405"> depends</tspan><tspan dx="4.43405"> on</tspan><tspan dx="4.43405"> materials</tspan><tspan dx="4.43405"> and</tspan><tspan dx="4.43405"> energy.</tspan><tspan dx="4.43405"> Height,</tspan><tspan dx="4.43405"> leaf</tspan><tspan dx="4.43405"> number,</tspan><tspan dx="4.43405"> colour</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">and sturdiness reveal different aspects of growth.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="3.75380" data-space-ratio="1.671">Most<tspan dx="3.75380"> green</tspan><tspan dx="3.75380"> plants</tspan><tspan dx="3.75380"> make</tspan><tspan dx="3.75380"> carbohydrates</tspan><tspan dx="3.75380"> from</tspan><tspan dx="3.75380"> carbon</tspan><tspan dx="3.75380"> dioxide</tspan><tspan dx="3.75380"> and</tspan><tspan dx="3.75380"> water</tspan><tspan dx="3.75380"> using</tspan></tspan><tspan x="112" dy="32" data-justify-width="851" data-natural-space="5.59200" data-extra-space="2.91314" data-space-ratio="1.521">light<tspan dx="2.91314"> energy.</tspan><tspan dx="2.91314"> Roots</tspan><tspan dx="2.91314"> take</tspan><tspan dx="2.91314"> up</tspan><tspan dx="2.91314"> water</tspan><tspan dx="2.91314"> and</tspan><tspan dx="2.91314"> minerals,</tspan><tspan dx="2.91314"> not</tspan><tspan dx="2.91314"> ready-made</tspan><tspan dx="2.91314"> carbohydrate</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">food.</tspan></text><text class="se-copy" x="89" y="384" text-anchor="start">•</text><text class="se-copy" x="112" y="384" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.21446" data-space-ratio="1.217">Chlorophyll<tspan dx="1.21446"> helps</tspan><tspan dx="1.21446"> capture</tspan><tspan dx="1.21446"> light.</tspan><tspan dx="1.21446"> Leaves</tspan><tspan dx="1.21446"> are</tspan><tspan dx="1.21446"> major</tspan><tspan dx="1.21446"> photosynthetic</tspan><tspan dx="1.21446"> organs;</tspan><tspan dx="1.21446"> other</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">green parts can also photosynthesise.</tspan></text><text class="se-copy" x="89" y="458" text-anchor="start">•</text><text class="se-copy" x="112" y="458" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.06082" data-space-ratio="1.190">Glucose<tspan dx="1.06082"> can</tspan><tspan dx="1.06082"> be</tspan><tspan dx="1.06082"> used</tspan><tspan dx="1.06082"> in</tspan><tspan dx="1.06082"> respiration,</tspan><tspan dx="1.06082"> converted</tspan><tspan dx="1.06082"> into</tspan><tspan dx="1.06082"> building</tspan><tspan dx="1.06082"> materials</tspan><tspan dx="1.06082"> or</tspan><tspan dx="1.06082"> stored</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">as starch. An iodine test detects starch, not every kind of food.</tspan></text><text class="se-copy" x="89" y="532" text-anchor="start">•</text><text class="se-copy" x="112" y="532" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="10.56118" data-space-ratio="2.889">Experiments<tspan dx="10.56118"> on</tspan><tspan dx="10.56118"> light,</tspan><tspan dx="10.56118"> green</tspan><tspan dx="10.56118"> patches</tspan><tspan dx="10.56118"> and</tspan><tspan dx="10.56118"> carbon</tspan><tspan dx="10.56118"> dioxide</tspan><tspan dx="10.56118"> need</tspan><tspan dx="10.56118"> matched</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">conditions, starting checks and observations recorded before conclusions.</tspan></text><text class="se-copy" x="89" y="606" text-anchor="start">•</text><text class="se-copy" x="112" y="606" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.81988" data-space-ratio="1.325">Photosynthesis<tspan dx="1.81988"> releases</tspan><tspan dx="1.81988"> oxygen.</tspan><tspan dx="1.81988"> Bubbles</tspan><tspan dx="1.81988"> alone</tspan><tspan dx="1.81988"> do</tspan><tspan dx="1.81988"> not</tspan><tspan dx="1.81988"> identify</tspan><tspan dx="1.81988"> a</tspan><tspan dx="1.81988"> gas;</tspan><tspan dx="1.81988"> a</tspan><tspan dx="1.81988"> gas</tspan><tspan dx="1.81988"> test</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">provides additional evidence.</tspan></text><text class="se-copy" x="89" y="680" text-anchor="start">•</text><text class="se-copy" x="112" y="680" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="4.82767" data-space-ratio="1.863">Stomata<tspan dx="4.82767"> allow</tspan><tspan dx="4.82767"> gas</tspan><tspan dx="4.82767"> exchange</tspan><tspan dx="4.82767"> and</tspan><tspan dx="4.82767"> water-vapour</tspan><tspan dx="4.82767"> loss.</tspan><tspan dx="4.82767"> Guard</tspan><tspan dx="4.82767"> cells</tspan><tspan dx="4.82767"> regulate</tspan><tspan dx="4.82767"> the</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">pore opening.</tspan></text><text class="se-copy" x="89" y="754" text-anchor="start">•</text><text class="se-copy" x="112" y="754" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="8.95516" data-space-ratio="2.601">Xylem<tspan dx="8.95516"> carries</tspan><tspan dx="8.95516"> water</tspan><tspan dx="8.95516"> and</tspan><tspan dx="8.95516"> minerals,</tspan><tspan dx="8.95516"> mainly</tspan><tspan dx="8.95516"> from</tspan><tspan dx="8.95516"> roots</tspan><tspan dx="8.95516"> to</tspan><tspan dx="8.95516"> shoots.</tspan><tspan dx="8.95516"> Phloem</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">transports dissolved sugars from supplying to using or storing regions.</tspan></text><text class="se-copy" x="89" y="828" text-anchor="start">•</text><text class="se-copy" x="112" y="828" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="5.04822" data-space-ratio="1.903">Aerobic<tspan dx="5.04822"> respiration</tspan><tspan dx="5.04822"> uses</tspan><tspan dx="5.04822"> glucose</tspan><tspan dx="5.04822"> and</tspan><tspan dx="5.04822"> oxygen</tspan><tspan dx="5.04822"> and</tspan><tspan dx="5.04822"> forms</tspan><tspan dx="5.04822"> carbon</tspan><tspan dx="5.04822"> dioxide</tspan><tspan dx="5.04822"> and</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">water while releasing usable energy.</tspan></text><text class="se-copy" x="89" y="902" text-anchor="start">•</text><text class="se-copy" x="112" y="902" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.47767" data-space-ratio="1.264">Living<tspan dx="1.47767"> plant</tspan><tspan dx="1.47767"> cells</tspan><tspan dx="1.47767"> respire</tspan><tspan dx="1.47767"> in</tspan><tspan dx="1.47767"> light</tspan><tspan dx="1.47767"> and</tspan><tspan dx="1.47767"> darkness.</tspan><tspan dx="1.47767"> Photosynthesis</tspan><tspan dx="1.47767"> and</tspan><tspan dx="1.47767"> respiration</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">can occur together, so observed gas exchange is their net effect.</tspan></text><g transform="translate(0 952)"><g data-page-illustration="figures/class-7/science/ch01-v2/observable-evidence.png"><image class="science-illustration" href="../../figures/class-7/science/ch01-v2/observable-evidence.png" x="114" y="10" width="824" height="343.2626158599382" preserveAspectRatio="xMidYMid meet"><title>Look for evidence when explaining plant processes.</title></image><text class="se-caption" x="526" y="391.2626158599382" text-anchor="middle"><tspan x="526">Look for evidence when explaining plant processes.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">23</text></g></svg></div></div></section>
