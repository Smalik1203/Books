"se-caption" x="89" y="484.88"><tspan x="89">Illustrative comparison: left, light; right, darkness. Appearance is given evidence here, not a</tspan><tspan x="89" dy="27">required outcome of every class experiment.</tspan></text></g>
<g class="v2-reading-block" data-block="q7" transform="translate(0 656)"><text class="se-copy" x="111" y="24" text-anchor="end">7.</text><text class="se-copy" x="132" y="24"><tspan x="132">Vani starts with comparable destarched, watered plants in four conditions</tspan><tspan x="132" dy="32">shown below. Assume temperature is suitable and the stated conditions</tspan><tspan x="132" dy="32">persist. (i) Where would you predict detectable new starch? (ii) Where would</tspan><tspan x="132" dy="32">you predict little or none? (iii) Where would photosynthesis generate oxygen?</tspan><tspan x="132" dy="32">(iv) Where would it not? Explain why oxygen collection and production need</tspan><tspan x="132" dy="32">not be equal.</tspan></text><g transform="translate(0 208)"><g class="v2-plant-diagram" data-diagram="four-conditions"><image class="science-illustration" data-art="whole-plant" href="../../figures/class-7/science/ch10/whole-plant.png" x="126" y="10" width="150" height="225" preserveAspectRatio="xMidYMid meet"/><text class="v2-plant-label" x="201" y="267" text-anchor="middle">A</text><image class="science-illustration" data-art="whole-plant" href="../../figures/class-7/science/ch10/whole-plant.png" x="344" y="10" width="150" height="225" preserveAspectRatio="xMidYMid meet"/><text class="v2-plant-label" x="419" y="267" text-anchor="middle">B</text><image class="science-illustration" data-art="whole-plant" href="../../figures/class-7/science/ch10/whole-plant.png" x="562" y="10" width="150" height="225" preserveAspectRatio="xMidYMid meet"/><text class="v2-plant-label" x="637" y="267" text-anchor="middle">C</text><image class="science-illustration" data-art="whole-plant" href="../../figures/class-7/science/ch10/whole-plant.png" x="780" y="10" width="150" height="225" preserveAspectRatio="xMidYMid meet"/><text class="v2-plant-label" x="855" y="267" text-anchor="middle">D</text></g></g><text class="se-caption" x="89" y="533.88"><tspan x="89">A: light with CO₂. B: light with CO₂ removed. C: darkness with CO₂. D: darkness with CO₂</tspan><tspan x="89" dy="27">removed. Compare A with B to test the role of carbon dioxide.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">23</text></g></svg></div></div></section>
