<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="23"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 23"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204"><tspan x="112">Plant growth depends on materials and energy. Height, leaf number, colour</tspan><tspan x="112" dy="32">and sturdiness reveal different aspects of growth.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278"><tspan x="112">Most green plants make carbohydrates from carbon dioxide and water using</tspan><tspan x="112" dy="32">light energy. Roots take up water and minerals, not ready-made carbohydrate</tspan><tspan x="112" dy="32">food.</tspan></text><text class="se-copy" x="89" y="384" text-anchor="start">•</text><text class="se-copy" x="112" y="384"><tspan x="112">Chlorophyll helps capture light. Leaves are major photosynthetic organs; other</tspan><tspan x="112" dy="32">green parts can also photosynthesise.</tspan></text><text class="se-copy" x="89" y="458" text-anchor="start">•</text><text class="se-copy" x="112" y="458"><tspan x="112">Glucose can be used in respiration, converted into building materials or stored</tspan><tspan x="112" dy="32">as starch. An iodine test detects starch, not every kind of food.</tspan></text><text class="se-copy" x="89" y="532" text-anchor="start">•</text><text class="se-copy" x="112" y="532"><tspan x="112">Experiments on light, green patches and carbon dioxide need matched</tspan><tspan x="112" dy="32">conditions, starting checks and observations recorded before conclusions.</tspan></text><text class="se-copy" x="89" y="606" text-anchor="start">•</text><text class="se-copy" x="112" y="606"><tspan x="112">Photosynthesis releases oxygen. Bubbles alone do not identify a gas; a gas test</tspan><tspan x="112" dy="32">provides additional evidence.</tspan></text><text class="se-copy" x="89" y="680" text-anchor="start">•</text><text class="se-copy" x="112" y="680"><tspan x="112">Stomata allow gas exchange and water-vapour loss. Guard cells regulate the</tspan><tspan x="112" dy="32">pore opening.</tspan></text><text class="se-copy" x="89" y="754" text-anchor="start">•</text><text class="se-copy" x="112" y="754"><tspan x="112">Xylem carries water and minerals, mainly from roots to shoots. Phloem</tspan><tspan x="112" dy="32">transports dissolved sugars from supplying to using or storing regions.</tspan></text><text class="se-copy" x="89" y="828" text-anchor="start">•</text><text class="se-copy" x="112" y="828"><tspan x="112">Aerobic respiration uses glucose and oxygen and forms carbon dioxide and</tspan><tspan x="112" dy="32">water while releasing usable energy.</tspan></text><text class="se-copy" x="89" y="902" text-anchor="start">•</text><text class="se-copy" x="112" y="902"><tspan x="112">Living plant cells respire in light and darkness. Photosynthesis and respiration</tspan><tspan x="112" dy="32">can occur together, so observed gas exchange is their net effect.</tspan></text><g transform="translate(0 952)"><g data-page-illustration="figures/class-7/science/ch10/whole-plant.png"><image class="science-illustration" href="../../figures/class-7/science/ch10/whole-plant.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A plant and its parts.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A plant and its parts.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">23</text></g></svg></div></div></section>
