<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="seed-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">If the seed flask gives earlier clouding for the same gas volume, the comparison</tspan><tspan x="89" dy="32">supports additional carbon-dioxide production associated with the germinating</tspan></text></g>
<g class="v2-reading-block" data-block="seed-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">seeds. Room air already contains some carbon dioxide, so the control is essential.</tspan><tspan x="89" dy="32">Microorganisms can also respire; clean, fresh samples reduce that competing</tspan><tspan x="89" dy="32">explanation. A CO₂ sensor can provide an alternative measurement.</tspan></text></g>
<g class="v2-reading-block" data-block="seed-method-limit-0" transform="translate(0 288)"><text class="se-copy" x="89" y="24"><tspan x="89">Merely connecting a seed flask to lime water does not ensure that enough gas</tspan><tspan x="89" dy="32">passes through it to show a change. A test needs a defined gas-transfer step and</tspan></text></g>
<g class="v2-reading-block" data-block="seed-method-limit-1" transform="translate(0 352)"><text class="se-copy" x="89" y="24"><tspan x="89">an open outlet; never pressurise a sealed reagent tube. The comparison detects a</tspan><tspan x="89" dy="32">product of respiration, not every step of the cellular process.</tspan></text></g>
<g class="v2-reading-block" data-block="respiration-equation" transform="translate(0 432)"><text class="v2-equation" x="89" y="30"><tspan x="89">Glucose + oxygen → carbon dioxide + water</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">Aerobic respiration releases usable energy and heat. Energy is released from food, not</tspan><tspan x="89" dy="27">created as an extra material product.</tspan></text></g>
<g class="v2-reading-block" data-block="living-cells-0" transform="translate(0 556)"><text class="se-copy" x="89" y="24"><tspan x="89">Living cells in roots, stems, leaves, flowers and germinating seeds respire in light</tspan><tspan x="89" dy="32">and darkness. Green cells can photosynthesise when conditions permit, and</tspan></text></g>
<g class="v2-reading-block" data-block="living-cells-1" transform="translate(0 620)"><text class="se-copy" x="89" y="24"><tspan x="89">respire at the same time. Saying “plants photosynthesise by day and respire only</tspan><tspan x="89" dy="32">at night” confuses two processes. Some mature conducting cells are no longer</tspan><tspan x="89" dy="32">living, so not every cell in a plant respires.</tspan></text></g>
<g class="v2-reading-block" data-block="process-comparison" transform="translate(0 732)"><g data-comparison-table="process-comparison"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Photosynthesis and aerobic respiration</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="260.32" y="70.08"><tspan x="260.32">Photosynthesis</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="618.6600000000001" y="70.08"><tspan x="618.6600000000001">Aerobic respiration</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Main role</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="110.08"><tspan x="260.32">stores light energy in</tspan><tspan x="260.32" dy="28">carbohydrates.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="110.08"><tspan x="618.6600000000001">releases usable energy from</tspan><tspan x="618.6600000000001" dy="28">food.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">Materials</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="178.07999999999998"><tspan x="260.32">carbon dioxide and water;</tspan><tspan x="260.32" dy="28">oxygen is released.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="178.07999999999998"><tspan x="618.6600000000001">glucose and oxygen; carbon</tspan><tspan x="618.6600000000001" dy="28">dioxide and water form.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="218" y2="218"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="246.07999999999998"><tspan x="103">Where and</tspan><tspan x="103" dy="28">when</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="246.07999999999998"><tspan x="260.32">photosynthetic tissues with</tspan><tspan x="260.32" dy="28">suitable light and conditions.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="246.07999999999998"><tspan x="618.6600000000001">living cells, in both light and</tspan><tspan x="618.6600000000001" dy="28">darkness.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="286" y2="286"/><rect class="v2-table-frame" x="89" y="42" width="874" height="244"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="42" y2="286"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="42" y2="286"/></g></g>
<g class="v2-reading-block" data-block="net-exchange-example" transform="translate(0 1034)"><text class="se-copy" x="89" y="24"><tspan x="89">Imagine a short interval in which photosynthesis removes six equal units of</tspan><tspan x="89" dy="32">carbon dioxide from a leaf’s surroundings and respiration adds two. The</tspan><tspan x="89" dy="32">surroundings show a net loss of four units, although both processes occurred.</tspan><tspan x="89" dy="32">These invented numbers illustrate the accounting; they are not measured rates or</tspan><tspan x="89" dy="32">a fixed ratio. In darkness, photosynthesis stops while respiration continues, so</tspan><tspan x="89" dy="32">the direction of net carbon-dioxide exchange can change. A measurement of the</tspan><tspan x="89" dy="32">net effect alone cannot reveal each separate rate.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
