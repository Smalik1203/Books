<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="food-transport" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">10.3.2 Food Transport</tspan></text></g>
<g class="v2-reading-block" data-block="phloem-0" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Phloem</tspan> carries dissolved sugars from regions supplying them to regions using or</tspan><tspan x="89" dy="32">storing them. A mature leaf may supply a growing root, fruit or shoot tip. Flow</tspan></text></g>
<g class="v2-reading-block" data-block="phloem-1" transform="translate(0 224)"><text class="se-copy" x="89" y="24"><tspan x="89">can therefore be upwards or downwards in different conducting paths; it is not</tspan><tspan x="89" dy="32">always a one-way journey down from leaves. Starch is converted into soluble</tspan><tspan x="89" dy="32">substances before stored carbohydrate is transported.</tspan></text></g>
<g class="v2-reading-block" data-block="transport-comparison" transform="translate(0 336)"><g data-comparison-table="transport-comparison"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Xylem and phloem</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="260.32" y="70.08"><tspan x="260.32">Xylem</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="618.6600000000001" y="70.08"><tspan x="618.6600000000001">Phloem</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Cargo</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="110.08"><tspan x="260.32">water and dissolved mineral</tspan><tspan x="260.32" dy="28">nutrients.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="110.08"><tspan x="618.6600000000001">dissolved sugars and other</tspan><tspan x="618.6600000000001" dy="28">organic substances.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="178.07999999999998"><tspan x="103">Direction</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="178.07999999999998"><tspan x="260.32">roots towards stems and leaves.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="178.07999999999998"><tspan x="618.6600000000001">from a supplying region to a</tspan><tspan x="618.6600000000001" dy="28">using or storing region.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="218" y2="218"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="246.07999999999998"><tspan x="103">Connection</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="246.07999999999998"><tspan x="260.32">replaces water used or lost from</tspan><tspan x="260.32" dy="28">shoots.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="246.07999999999998"><tspan x="618.6600000000001">feeds roots, developing shoots,</tspan><tspan x="618.6600000000001" dy="28">fruits and seeds.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="286" y2="286"/><rect class="v2-table-frame" x="89" y="42" width="874" height="244"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="42" y2="286"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="42" y2="286"/></g></g>
<g class="v2-reading-block" data-block="respiration" transform="translate(0 650)"><text class="v2-title" x="89" y="38"><tspan x="89">10.4 Do Plants Respire?</tspan></text></g>
<g class="v2-reading-block" data-block="respiration-question-0" transform="translate(0 708)"><text class="se-copy" x="89" y="24"><tspan x="89">A germinating seed can grow before it has green leaves. Its living cells use stored</tspan><tspan x="89" dy="32">food, releasing usable energy through <tspan class="se-bold">respiration</tspan>. To look for a product of this</tspan></text></g>
<g class="v2-reading-block" data-block="respiration-question-1" transform="translate(0 772)"><text class="se-copy" x="89" y="24"><tspan x="89">process, compare air around germinating seeds with air in a matched control.</tspan><tspan x="89" dy="32">Darkness prevents photosynthesis from removing carbon dioxide during the</tspan><tspan x="89" dy="32">comparison.</tspan></text></g><g transform="translate(0 884)"><g data-page-illustration="figures/class-7/science/ch10/dye-setup.png"><image class="science-illustration" href="../../figures/class-7/science/ch10/dye-setup.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Equipment for tracing water movement.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Equipment for tracing water movement.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
