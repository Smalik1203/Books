<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10 page--opener" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 1"><g class="chapter-opener" data-opener="science-g7-ch10"><defs><linearGradient id="science-g7-ch10-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop class="chapter-opener__gradient-start" offset="0%"/><stop class="chapter-opener__gradient-end" offset="100%"/></linearGradient></defs><path class="chapter-opener__band" fill="url(#science-g7-ch10-gradient)" d="M-17 -17H1069V300H-17Z"/><path class="chapter-opener__edge" d="M-17 296H1069V300H-17Z"/><g class="chapter-opener__motif v2-plant-motif" transform="translate(945 73) scale(1.05)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><line class="chapter-opener__divider" x1="240" x2="240" y1="94" y2="252"/><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number chapter-opener__number--double se-running" x="151" y="242" text-anchor="middle">10</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">Life Processes</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">in Plants</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch10/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Children observing the growth of plants in a school garden</title></image></g><text class="se-copy v2-intro" x="89" y="981"><tspan x="89">A tiny seedling can become a tree. Where does the material for its new</tspan><tspan x="89" dy="34">leaves, branches and trunk come from?</tspan></text><text class="se-copy" x="89" y="1067"><tspan x="89">You have seen animals eat and followed the journeys of food and air through</tspan><tspan x="89" dy="32">their bodies. A plant has no mouth or stomach, yet it grows, transports</tspan><tspan x="89" dy="32">substances and releases energy in living cells.</tspan></text><text class="se-copy" x="89" y="1179"><tspan x="89">Follow a plant from its roots to its leaves. Test ideas about water, light and air,</tspan><tspan x="89" dy="32">then connect the evidence with how plants make, move and use food.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
