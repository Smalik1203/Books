text-anchor="start">Life Processes</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">in Plants</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch10/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Children observing the growth of plants in a school garden</title></image></g><text class="se-copy v2-intro" x="89" y="981" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.56399" data-extra-space="2.74148" data-space-ratio="1.493">A<tspan dx="2.74148"> tiny</tspan><tspan dx="2.74148"> seedling</tspan><tspan dx="2.74148"> can</tspan><tspan dx="2.74148"> become</tspan><tspan dx="2.74148"> a</tspan><tspan dx="2.74148"> tree.</tspan><tspan dx="2.74148"> Where</tspan><tspan dx="2.74148"> does</tspan><tspan dx="2.74148"> the</tspan><tspan dx="2.74148"> material</tspan><tspan dx="2.74148"> for</tspan><tspan dx="2.74148"> its</tspan><tspan dx="2.74148"> new</tspan></tspan><tspan x="89" dy="34" data-paragraph-end="true">leaves, branches and trunk come from?</tspan></text><text class="se-copy" x="89" y="1067" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.59797" data-space-ratio="1.822">You<tspan dx="4.59797"> have</tspan><tspan dx="4.59797"> seen</tspan><tspan dx="4.59797"> animals</tspan><tspan dx="4.59797"> eat</tspan><tspan dx="4.59797"> and</tspan><tspan dx="4.59797"> followed</tspan><tspan dx="4.59797"> the</tspan><tspan dx="4.59797"> journeys</tspan><tspan dx="4.59797"> of</tspan><tspan dx="4.59797"> food</tspan><tspan dx="4.59797"> and</tspan><tspan dx="4.59797"> air</tspan><tspan dx="4.59797"> through</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="10.16228" data-space-ratio="2.817">their<tspan dx="10.16228"> bodies.</tspan><tspan dx="10.16228"> A</tspan><tspan dx="10.16228"> plant</tspan><tspan dx="10.16228"> has</tspan><tspan dx="10.16228"> no</tspan><tspan dx="10.16228"> mouth</tspan><tspan dx="10.16228"> or</tspan><tspan dx="10.16228"> stomach,</tspan><tspan dx="10.16228"> yet</tspan><tspan dx="10.16228"> it</tspan><tspan dx="10.16228"> grows,</tspan><tspan dx="10.16228"> transports</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">substances and releases energy in living cells.</tspan></text><text class="se-copy" x="89" y="1179" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.50457" data-space-ratio="1.627">Follow<tspan dx="3.50457"> a</tspan><tspan dx="3.50457"> plant</tspan><tspan dx="3.50457"> from</tspan><tspan dx="3.50457"> its</tspan><tspan dx="3.50457"> roots</tspan><tspan dx="3.50457"> to</tspan><tspan dx="3.50457"> its</tspan><tspan dx="3.50457"> leaves.</tspan><tspan dx="3.50457"> Test</tspan><tspan dx="3.50457"> ideas</tspan><tspan dx="3.50457"> about</tspan><tspan dx="3.50457"> water,</tspan><tspan dx="3.50457"> light</tspan><tspan dx="3.50457"> and</tspan><tspan dx="3.50457"> air,</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">then connect the evidence with how plants make, move and use food.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
