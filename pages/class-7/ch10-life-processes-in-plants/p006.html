<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="starch-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Blue-black areas contain starch detectable by this test. An area that remains</tspan><tspan x="89" dy="32">yellow-brown may contain little or no detectable starch; that is not a</tspan></text></g>
<g class="v2-reading-block" data-block="starch-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">measurement of every carbohydrate present. Removing chlorophyll makes the</tspan><tspan x="89" dy="32">iodine colour easier to distinguish. The treatment prepares a specimen for</tspan><tspan x="89" dy="32">testing; it is not how a living leaf normally changes colour.</tspan></text></g>
<g class="v2-reading-block" data-block="variegation-question" transform="translate(0 288)"><text class="se-heading" x="89" y="30"><tspan x="89">Comparing patches and light</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Bhaskar notices leaves with green and cream</tspan><tspan x="89" dy="32">patches. Such <tspan class="se-bold">variegated</tspan> leaves offer a</tspan><tspan x="89" dy="32">comparison within one leaf. He also asks</tspan><tspan x="89" dy="32">whether light is needed for starch accumulation.</tspan><tspan x="89" dy="32">Map the patches before removing pigment:</tspan><tspan x="89" dy="32">testing destroys the original colour guide.</tspan></text><image class="science-illustration" data-photo="variegated-leaf" href="../../figures/class-7/science/ch10/variegated-leaf.png" x="735.6666666666666" y="8" width="146.66666666666666" height="220" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="655" y="258.88"><tspan x="655">Green and cream patches on</tspan><tspan x="655" dy="27">one leaf.</tspan></text></g>
<g class="v2-reading-block" data-block="patch-task" transform="translate(0 602)"><rect class="se-activity-panel" x="89" y="0" width="874" height="446" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Keep two similar watered variegated plants in darkness for about 36–48</tspan><tspan x="146" dy="32">hours. A teacher tests a spare leaf: stored starch must fall below</tspan><tspan x="146" dy="32">detection. Time alone does not guarantee this.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Put one plant in suitable light for several hours; keep the other dark.</tspan><tspan x="146" dy="32">Match temperature, water and exposure time; prevent overheating.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Sketch a comparable leaf from each plant. Mark its green and cream</tspan><tspan x="146" dy="32">patches and light condition before the teacher carries out the same starch</tspan><tspan x="146" dy="32">test on both.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">4.</text><text class="se-copy" x="146" y="384"><tspan x="146">Match each iodine pattern to its original patch map. Record unclear</tspan><tspan x="146" dy="32">colours too. Restore both plants to suitable growing conditions.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
