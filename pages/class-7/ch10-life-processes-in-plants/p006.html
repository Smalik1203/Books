<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="starch-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="996" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Teacher demonstration: soften a suitable leaf briefly in hot water using</tspan><tspan x="146" dy="32">forceps. Place it in an open boiling tube containing enough ethanol to</tspan><tspan x="146" dy="32">cover it.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Stand the tube in a stable hot-water bath supplied by a kettle or approved</tspan><tspan x="146" dy="32">electric bath. Wait for much of the pigment to leave. Never heat ethanol</tspan><tspan x="146" dy="32">directly.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">With forceps, rinse the leaf in water to soften it. Spread it on a white tile,</tspan><tspan x="146" dy="32">cover with dilute iodine and observe for a few minutes.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">4.</text><text class="se-copy" x="146" y="384"><tspan x="146">Sketch the colour pattern before interpreting it. If unclear, check the</tspan><tspan x="146" dy="32">iodine against a known starch sample.</tspan></text><text class="se-copy" x="113" y="460"><tspan x="113">Teacher handles hot liquids, ethanol, iodine and chemical waste; wear eye</tspan><tspan x="113" dy="32">protection. Ethanol is highly flammable: keep all flames and ignition sources</tspan><tspan x="113" dy="32">away. Never taste treated leaves.</tspan></text><g transform="translate(0 544)"><g class="v2-plant-diagram" data-diagram="starch-bath"><image class="science-illustration" data-art="starch-bath" href="../../figures/class-7/science/ch10/starch-bath.png" x="293.5" y="20" width="465" height="310" preserveAspectRatio="xMidYMid meet"/><text class="v2-plant-label" x="100" y="70" text-anchor="start">Hot water</text><line class="v2-plant-line" x1="216" y1="65" x2="332" y2="167"/><text class="v2-plant-label" x="100" y="264" text-anchor="start">Ethanol</text><line class="v2-plant-line" x1="190" y1="259" x2="448" y2="194"/><text class="v2-plant-label" x="802" y="111" text-anchor="start">Iodine</text><line class="v2-plant-line" x1="790" y1="106" x2="689" y2="151"/><text class="v2-plant-label" x="670" y="355" text-anchor="middle">Pale leaf on tile</text></g></g><text class="se-caption" x="113" y="940.88"><tspan x="113">A flame-free hot-water bath and a separate leaf-testing tile. The pale leaf has not yet</tspan><tspan x="113" dy="27">been tested with iodine.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
