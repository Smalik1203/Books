<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="19"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 19"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="day-night-pause" transform="translate(0 112)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">In bright light, a plant may take in more carbon dioxide than it releases.</tspan><tspan x="113" dy="32">Does this mean its cells have stopped respiring? Explain the difference</tspan><tspan x="113" dy="32">between two simultaneous processes and their net effect.</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">At night, a seedling continues growing although it cannot photosynthesise.</tspan><tspan x="113" dy="32">Trace the stored food and oxygen it uses. Why would keeping its roots</tspan><tspan x="113" dy="32">waterlogged make the situation different?</tspan></text></g>
<g class="v2-reading-block" data-block="sohonie" transform="translate(0 428)"><text class="se-copy" x="89" y="24"><tspan x="89">Kamala Sohonie (1911–1998) studied plant respiration during her doctoral work</tspan><tspan x="89" dy="32">at Cambridge. Her research on cytochrome c helped connect energy-releasing</tspan><tspan x="89" dy="32">processes across organisms. After returning to India, she worked in medical and</tspan><tspan x="89" dy="32">nutrition research and later led the Institute of Science in Bombay. Her studies of</tspan><tspan x="89" dy="32">plant foods and the palm sap drink neera linked biochemical research with</tspan><tspan x="89" dy="32">nutrition.</tspan></text></g>
<g class="v2-reading-block" data-block="storage-over-time-0" transform="translate(0 636)"><text class="se-copy" x="89" y="24"><tspan x="89">Think across a whole day, not just one moment. During a favourable light period,</tspan><tspan x="89" dy="32">a plant may make more carbohydrate than it immediately uses. Some is</tspan></text></g>
<g class="v2-reading-block" data-block="storage-over-time-1" transform="translate(0 700)"><text class="se-copy" x="89" y="24"><tspan x="89">transported to growing or storage tissues. During darkness, stored carbohydrate</tspan><tspan x="89" dy="32">helps support continuing respiration and growth. Over longer periods, disease,</tspan></text></g>
<g class="v2-reading-block" data-block="storage-over-time-2" transform="translate(0 764)"><text class="se-copy" x="89" y="24"><tspan x="89">limited water or poor light can reduce the amount available. This is why a plant’s</tspan><tspan x="89" dy="32">condition depends on a changing supply and demand for materials, rather than</tspan><tspan x="89" dy="32">on a simple switch between making food and using it.</tspan></text></g>
<g class="v2-reading-block" data-block="plant-connections-0" transform="translate(0 876)"><text class="se-copy" x="89" y="24"><tspan x="89">Photosynthesis supplies organic matter and contributes oxygen to ecosystems.</tspan><tspan x="89" dy="32">Respiration uses food to power living cells and returns carbon dioxide and water.</tspan></text></g>
<g class="v2-reading-block" data-block="plant-connections-1" transform="translate(0 940)"><text class="se-copy" x="89" y="24"><tspan x="89">Transport connects these processes within a plant. Their rates do not have to</tspan><tspan x="89" dy="32">match at every moment: growing plants can store material, and light, water,</tspan><tspan x="89" dy="32">temperature and other conditions keep changing.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">19</text></g></svg></div></div></section>
