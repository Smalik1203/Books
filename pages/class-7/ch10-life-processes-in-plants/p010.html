<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="co2-record" transform="translate(0 112)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Record conditions before interpreting the starch test</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Condition or evidence</tspan></text><text class="v2-table-heading" x="365.2" y="76.08"><tspan x="365.2">A: absorber</tspan></text><text class="v2-table-heading" x="671.0999999999999" y="76.08"><tspan x="671.0999999999999">B: water control</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Light, water, green</tspan><tspan x="103" dy="28">tissue</tspan></text><text class="se-copy se-table-copy" x="365.2" y="128.07999999999998"><tspan x="365.2">Check and record each</tspan></text><text class="se-copy se-table-copy" x="671.0999999999999" y="128.07999999999998"><tspan x="671.0999999999999">Check and record each</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="174" y2="174"/><text class="se-copy se-table-copy" x="103" y="208.07999999999998"><tspan x="103">Carbon dioxide</tspan></text><text class="se-copy se-table-copy" x="365.2" y="208.07999999999998"><tspan x="365.2">Expected to be reduced</tspan></text><text class="se-copy se-table-copy" x="671.0999999999999" y="208.07999999999998"><tspan x="671.0999999999999">Not deliberately removed</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="226" y2="226"/><text class="se-copy se-table-copy" x="103" y="260.08"><tspan x="103">Iodine response</tspan></text><text class="se-copy se-table-copy" x="365.2" y="260.08"><tspan x="365.2">Record observed colour</tspan></text><text class="se-copy se-table-copy" x="671.0999999999999" y="260.08"><tspan x="671.0999999999999">Record observed colour</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="278" y2="278"/><rect class="v2-table-frame" x="89" y="42" width="874" height="236"/><line class="v2-table-rule" x1="351.2" x2="351.2" y1="42" y2="278"/><line class="v2-table-rule" x1="657.0999999999999" x2="657.0999999999999" y1="42" y2="278"/><text class="v2-table-note" x="89" y="310.88"><tspan x="89">Expected conditions are not measured starch results. Check seals and plant health. Compare</tspan><tspan x="89" dy="26">down to distinguish the changed condition from the conditions intended to match.</tspan></text></g>
<g class="v2-reading-block" data-block="co2-evidence-0" transform="translate(0 474)"><text class="se-copy" x="89" y="24"><tspan x="89">If the control leaf becomes blue-black but the absorber leaf does not, the contrast</tspan><tspan x="89" dy="32">supports the requirement for carbon dioxide in starch formation. If neither</tspan></text></g>
<g class="v2-reading-block" data-block="co2-evidence-1" transform="translate(0 538)"><text class="se-copy" x="89" y="24"><tspan x="89">responds, insufficient light, incomplete testing or plant stress may be</tspan><tspan x="89" dy="32">responsible. If both respond, consider residual starch or leaking seals. A</tspan><tspan x="89" dy="32">chemical absorber may also change humidity, so repeat and interpret cautiously.</tspan></text></g>
<g class="v2-reading-block" data-block="half-leaf-0" transform="translate(0 650)"><text class="se-copy" x="89" y="24"><tspan x="89">A related arrangement places half of one attached leaf inside a sealed bottle</tspan><tspan x="89" dy="32">above sodium hydroxide and leaves the other half outside. It compares the two</tspan></text></g>
<g class="v2-reading-block" data-block="half-leaf-1" transform="translate(0 714)"><text class="se-copy" x="89" y="24"><tspan x="89">halves after testing. The inside half must not touch the solution. However, bottle</tspan><tspan x="89" dy="32">shade, humidity and sealing can also differ between halves; a matched enclosure</tspan><tspan x="89" dy="32">comparison helps examine these alternatives.</tspan></text></g>
<g class="v2-reading-block" data-block="co2-control-reasoning-0" transform="translate(0 826)"><text class="se-copy" x="89" y="24"><tspan x="89">Why place a dish in the control jar at all? Both plants should experience an</tspan><tspan x="89" dy="32">enclosure and similar equipment. Otherwise a result could arise from the jar</tspan></text></g>
<g class="v2-reading-block" data-block="co2-control-reasoning-1" transform="translate(0 890)"><text class="se-copy" x="89" y="24"><tspan x="89">rather than the absorber. A fair comparison also needs a working positive</tspan><tspan x="89" dy="32">response: starch in the control leaf shows that the plant and test could produce</tspan></text></g>
<g class="v2-reading-block" data-block="co2-control-reasoning-2" transform="translate(0 954)"><text class="se-copy" x="89" y="24"><tspan x="89">the expected signal under those conditions. An absorber leaf alone cannot</tspan><tspan x="89" dy="32">provide that check. A negative result is useful only when we know what the</tspan><tspan x="89" dy="32">method was capable of detecting.</tspan></text></g><g transform="translate(0 1066)"><g data-page-illustration="figures/class-7/science/ch10/co2-setup.png"><image class="science-illustration" href="../../figures/class-7/science/ch10/co2-setup.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Comparing carbon dioxide availability.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Comparing carbon dioxide availability.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
