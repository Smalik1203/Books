<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="27" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 27"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Explore Further</tspan></text></g>
<g class="v2-reading-block" data-block="project-garden" transform="translate(0 170)"><text class="se-heading" x="89" y="30"><tspan x="89">Observe a bottle garden</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">With an adult, plant a small humidity-loving plant, such as fittonia or a suitable</tspan><tspan x="89" dy="32">fern, in a wide transparent jar. Use moist, not waterlogged, compost and bright</tspan><tspan x="89" dy="32">indirect light. After establishment, fit a lid and record growth and condensation.</tspan><tspan x="89" dy="32">Open it if overheating, decay or excess moisture develops. Do not use a closed</tspan><tspan x="89" dy="32">sunny jar for jade or other dry-loving succulents. Survival alone does not</tspan><tspan x="89" dy="32">measure the separate rates of photosynthesis and respiration.</tspan></text><image class="science-illustration" data-photo="terrarium" href="../../figures/class-7/science/ch10/terrarium.png" x="432.6666666666667" y="256" width="186.66666666666666" height="280" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="566.88"><tspan x="89">A bottle garden exchanges energy with its surroundings. Water and gases can be recycled</tspan><tspan x="89" dy="27">inside, but conditions still need monitoring.</tspan></text></g>
<g class="v2-reading-block" data-block="project-crops" transform="translate(0 794)"><text class="se-heading" x="89" y="30"><tspan x="89">Connect plant processes with crops</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Choose one local crop. Explain how light capture, respiration and the transport</tspan><tspan x="89" dy="32">of water, minerals and sugars support its growth and harvestable parts.</tspan><tspan x="89" dy="32">Investigate one limiting condition, such as dry soil or excessive heat, using</tspan><tspan x="89" dy="32">reliable agricultural sources. Distinguish evidence from a product’s advertising</tspan><tspan x="89" dy="32">claim.</tspan></text></g>
<g class="v2-reading-block" data-block="project-greenhouse" transform="translate(0 1030)"><text class="se-heading" x="89" y="30"><tspan x="89">Investigate a greenhouse</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Visit a greenhouse with a responsible adult, or interview a grower. Find out how</tspan><tspan x="89" dy="32">light, water, temperature, ventilation and sometimes carbon dioxide are</tspan><tspan x="89" dy="32">managed. Compare these conditions with outdoor growing. Do not handle</tspan><tspan x="89" dy="32">heaters, gas equipment, pesticides or fertiliser solutions; present your</tspan><tspan x="89" dy="32">observations and questions in a report.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">27</text></g></svg></div></div></section>
