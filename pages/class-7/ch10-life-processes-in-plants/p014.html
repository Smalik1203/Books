<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="stomata-art" transform="translate(0 112)"><g class="v2-plant-diagram" data-diagram="stomata"><image class="science-illustration" data-art="stomata" href="../../figures/class-7/science/ch10/stomata.png" x="263.5" y="25" width="525" height="350" preserveAspectRatio="xMidYMid meet"/><text class="v2-plant-label" x="100" y="40" text-anchor="start">Surface cells</text><line class="v2-plant-line" x1="248" y1="43" x2="327" y2="111"/><text class="v2-plant-label" x="812" y="79" text-anchor="start">Guard cells</text><line class="v2-plant-line" x1="799" y1="74" x2="555" y2="187"/><text class="v2-plant-label" x="100" y="281" text-anchor="start">Pore</text><line class="v2-plant-line" x1="159" y1="276" x2="523" y2="207"/></g><text class="se-caption" x="89" y="450.88"><tspan x="89">An enlarged interpretive drawing of leaf epidermis. A stoma is a pore bordered by guard</tspan><tspan x="89" dy="27">cells; the drawing is not a measured micrograph.</tspan></text></g>
<g class="v2-reading-block" data-block="stomata-evidence-0" transform="translate(0 618)"><text class="se-copy" x="89" y="24"><tspan x="89">The pores are <tspan class="se-bold">stomata</tspan>; one pore is a <tspan class="se-bold">stoma</tspan>. Guard cells border each pore and</tspan><tspan x="89" dy="32">regulate its opening. Gases diffuse between the air and internal leaf spaces.</tspan></text></g>
<g class="v2-reading-block" data-block="stomata-evidence-1" transform="translate(0 682)"><text class="se-copy" x="89" y="24"><tspan x="89">Stomata also allow water vapour to escape. Their distribution differs among</tspan><tspan x="89" dy="32">plants; many land plants have more on the lower surface, but that is not a rule for</tspan><tspan x="89" dy="32">every leaf.</tspan></text></g>
<g class="v2-reading-block" data-block="stomata-tradeoff-0" transform="translate(0 794)"><text class="se-copy" x="89" y="24"><tspan x="89">Opening stomata can help carbon dioxide enter, but also increases water loss.</tspan><tspan x="89" dy="32">Closing them conserves water while limiting gas exchange. A leaf does not</tspan></text></g>
<g class="v2-reading-block" data-block="stomata-tradeoff-1" transform="translate(0 858)"><text class="se-copy" x="89" y="24"><tspan x="89">simply keep every pore fully open all day. Living cells continue to respire even</tspan><tspan x="89" dy="32">when the pattern of exchange with outside air changes.</tspan></text></g>
<g class="v2-reading-block" data-block="transport" transform="translate(0 950)"><text class="v2-title" x="89" y="38"><tspan x="89">10.3 Transport in Plants</tspan></text></g>
<g class="v2-reading-block" data-block="transport-intro-0" transform="translate(0 1008)"><text class="se-copy" x="89" y="24"><tspan x="89">Roots take up water and dissolved mineral nutrients. These must reach leaves,</tspan><tspan x="89" dy="32">developing shoots and other tissues.</tspan></text></g>
<g class="v2-reading-block" data-block="water-transport" transform="translate(0 1100)"><text class="se-heading" x="89" y="30"><tspan x="89">10.3.1 Water and Mineral Transport</tspan></text></g>
<g class="v2-reading-block" data-block="water-route-0" transform="translate(0 1148)"><text class="se-copy" x="89" y="24"><tspan x="89">Unlike an animal’s heart-driven circulation, plant transport uses different</tspan><tspan x="89" dy="32">structures and mechanisms. A coloured-water comparison can help locate the</tspan></text></g>
<g class="v2-reading-block" data-block="water-route-1" transform="translate(0 1212)"><text class="se-copy" x="89" y="24"><tspan x="89">route taken by water without making the dye itself a nutrient. A cut stem</tspan><tspan x="89" dy="32">removes roots from the setup: it traces movement through a shoot, but does not</tspan><tspan x="89" dy="32">test water absorption by roots.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
