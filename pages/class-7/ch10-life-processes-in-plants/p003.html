<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="growth-record" transform="translate(0 112)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Record the same measures for each pot</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Measure</tspan></text><text class="v2-table-heading" x="338.98" y="76.08"><tspan x="338.98">Day 1</tspan></text><text class="v2-table-heading" x="644.88" y="76.08"><tspan x="644.88">Final observation</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Light and water</tspan></text><text class="se-copy se-table-copy" x="338.98" y="128.07999999999998"><tspan x="338.98">Record A, B and C</tspan><tspan x="338.98" dy="28">conditions</tspan></text><text class="se-copy se-table-copy" x="644.88" y="128.07999999999998"><tspan x="644.88">Note any treatment changes</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="174" y2="174"/><text class="se-copy se-table-copy" x="103" y="208.07999999999998"><tspan x="103">Height in cm</tspan></text><text class="se-copy se-table-copy" x="338.98" y="208.07999999999998"><tspan x="338.98">Measure from soil surface</tspan></text><text class="se-copy se-table-copy" x="644.88" y="208.07999999999998"><tspan x="644.88">Measure from the same point</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="226" y2="226"/><text class="se-copy se-table-copy" x="103" y="260.08"><tspan x="103">Leaves and colour</tspan></text><text class="se-copy se-table-copy" x="338.98" y="260.08"><tspan x="338.98">Count and describe</tspan></text><text class="se-copy se-table-copy" x="644.88" y="260.08"><tspan x="644.88">Count and describe again</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="278" y2="278"/><text class="se-copy se-table-copy" x="103" y="312.08"><tspan x="103">Other changes</tspan></text><text class="se-copy se-table-copy" x="338.98" y="312.08"><tspan x="338.98">Sketch starting appearance</tspan></text><text class="se-copy se-table-copy" x="644.88" y="312.08"><tspan x="644.88">Record date, wilting or</tspan><tspan x="644.88" dy="28">recovery</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="358" y2="358"/><rect class="v2-table-frame" x="89" y="42" width="874" height="316"/><line class="v2-table-rule" x1="324.98" x2="324.98" y1="42" y2="358"/><line class="v2-table-rule" x1="630.88" x2="630.88" y1="42" y2="358"/><text class="v2-table-note" x="89" y="390.88"><tspan x="89">Make one copy per pot in your notebook. These are recording instructions, not results.</tspan><tspan x="89" dy="26">Compare each plant with its own starting record before comparing pots.</tspan></text></g>
<g class="v2-reading-block" data-block="growth-evidence-0" transform="translate(0 554)"><text class="se-copy" x="89" y="24"><tspan x="89">Compare A with B to investigate water availability, and A with C to investigate</tspan><tspan x="89" dy="32">light. B and C differ in both water and light, so that pair cannot isolate either</tspan></text></g>
<g class="v2-reading-block" data-block="growth-evidence-1" transform="translate(0 618)"><text class="se-copy" x="89" y="24"><tspan x="89">factor. Suitable light and adequate water usually support continued growth. A</tspan><tspan x="89" dy="32">plant without water may wilt; one in darkness may become pale and elongated</tspan></text></g>
<g class="v2-reading-block" data-block="growth-evidence-2" transform="translate(0 682)"><text class="se-copy" x="89" y="24"><tspan x="89">while using stored food. Neither response is guaranteed within a fixed number of</tspan><tspan x="89" dy="32">days.</tspan></text></g>
<g class="v2-reading-block" data-block="growth-limits-0" transform="translate(0 762)"><text class="se-copy" x="89" y="24"><tspan x="89">One seedling per treatment gives limited evidence. Seedlings differ naturally, and</tspan><tspan x="89" dy="32">a dark cupboard may also be warmer or cooler. Repeat with several matched</tspan></text></g>
<g class="v2-reading-block" data-block="growth-limits-1" transform="translate(0 826)"><text class="se-copy" x="89" y="24"><tspan x="89">plants if practical. This comparison does not establish which substance becomes</tspan><tspan x="89" dy="32">new plant material or show that plants take food from soil.</tspan></text></g>
<g class="v2-reading-block" data-block="growth-pause" transform="translate(0 906)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">The dark-grown plant is tallest, but has a thin stem and pale leaves. Is height</tspan><tspan x="113" dy="32">alone a sound measure of healthy growth? Use at least two other</tspan><tspan x="113" dy="32">observations in your answer.</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">A class compares only a watered plant in sunlight with an unwatered plant in</tspan><tspan x="113" dy="32">darkness. Explain why it cannot tell which difference caused the result.</tspan><tspan x="113" dy="32">Design a clearer comparison.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
