<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="patch-record" transform="translate(0 112)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Bhaskar’s reported observations: evidence to interpret</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Leaf condition</tspan></text><text class="v2-table-heading" x="365.2" y="76.08"><tspan x="365.2">Area before treatment</tspan></text><text class="v2-table-heading" x="644.88" y="76.08"><tspan x="644.88">Reported iodine response</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Kept in light</tspan></text><text class="se-copy se-table-copy" x="365.2" y="128.07999999999998"><tspan x="365.2">Green patches</tspan></text><text class="se-copy se-table-copy" x="644.88" y="128.07999999999998"><tspan x="644.88">Blue-black</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="146" y2="146"/><text class="se-copy se-table-copy" x="103" y="180.07999999999998"><tspan x="103">Kept in light</tspan></text><text class="se-copy se-table-copy" x="365.2" y="180.07999999999998"><tspan x="365.2">Cream patches</tspan></text><text class="se-copy se-table-copy" x="644.88" y="180.07999999999998"><tspan x="644.88">No blue-black detected</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="198" y2="198"/><text class="se-copy se-table-copy" x="103" y="232.07999999999998"><tspan x="103">Kept in darkness</tspan></text><text class="se-copy se-table-copy" x="365.2" y="232.07999999999998"><tspan x="365.2">Green and cream</tspan><tspan x="365.2" dy="28">patches</tspan></text><text class="se-copy se-table-copy" x="644.88" y="232.07999999999998"><tspan x="644.88">No blue-black detected</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="278" y2="278"/><rect class="v2-table-frame" x="89" y="42" width="874" height="236"/><line class="v2-table-rule" x1="351.2" x2="351.2" y1="42" y2="278"/><line class="v2-table-rule" x1="630.88" x2="630.88" y1="42" y2="278"/><text class="v2-table-note" x="89" y="310.88"><tspan x="89">These are supplied observations, not a pattern you must obtain. Read across one area, then</tspan><tspan x="89" dy="26">compare the same area across light conditions. Record your own evidence separately.</tspan></text></g>
<g class="v2-reading-block" data-block="patch-evidence-0" transform="translate(0 474)"><text class="se-copy" x="89" y="24"><tspan x="89">The reported pattern supports a role for both light and chlorophyll in starch</tspan><tspan x="89" dy="32">accumulation. A cream patch may contain too little chlorophyll to produce</tspan></text></g>
<g class="v2-reading-block" data-block="patch-evidence-1" transform="translate(0 538)"><text class="se-copy" x="89" y="24"><tspan x="89">detectable starch under these conditions. The test does not prove an absolute</tspan><tspan x="89" dy="32">absence of chlorophyll. Starch already present before treatment, imported sugars</tspan><tspan x="89" dy="32">or an unsuccessful test can complicate an explanation.</tspan></text></g>
<g class="v2-reading-block" data-block="coloured-leaves-0" transform="translate(0 650)"><text class="se-copy" x="89" y="24"><tspan x="89">Red, violet and brown leaves may still contain chlorophyll hidden by other</tspan><tspan x="89" dy="32">pigments. Their colour alone cannot tell us whether they photosynthesise. Some</tspan></text></g>
<g class="v2-reading-block" data-block="coloured-leaves-1" transform="translate(0 714)"><text class="se-copy" x="89" y="24"><tspan x="89">accessory pigments absorb light used in photosynthesis; others have different</tspan><tspan x="89" dy="32">roles. A controlled starch investigation is more informative than calling every</tspan><tspan x="89" dy="32">non-green leaf unable to make food.</tspan></text></g>
<g class="v2-reading-block" data-block="patch-reasoning-0" transform="translate(0 826)"><text class="se-copy" x="89" y="24"><tspan x="89">Read Bhaskar’s table in two directions. Within the lit leaf, compare green and</tspan><tspan x="89" dy="32">cream patches: light is shared while pigment differs. Then compare green</tspan></text></g>
<g class="v2-reading-block" data-block="patch-reasoning-1" transform="translate(0 890)"><text class="se-copy" x="89" y="24"><tspan x="89">patches from the lit and dark plants: their colour is similar while light differs.</tspan><tspan x="89" dy="32">Agreement between these comparisons strengthens an explanation involving</tspan></text></g>
<g class="v2-reading-block" data-block="patch-reasoning-2" transform="translate(0 954)"><text class="se-copy" x="89" y="24"><tspan x="89">both factors. It does not make either comparison perfect. Patches may differ in</tspan><tspan x="89" dy="32">other tissues, and two plants are not identical. Repeating with more leaves helps</tspan><tspan x="89" dy="32">show whether the pattern persists.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
