<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="growth" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">10.1 How Do Plants Grow?</tspan></text></g>
<g class="v2-reading-block" data-block="growth-changes-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Plants grow new leaves and branches, thicken their stems and increase in height.</tspan><tspan x="89" dy="32">Their cells need building materials and energy. Height alone is not a measure of</tspan><tspan x="89" dy="32">health: a shoot stretched towards light may be taller without becoming sturdy.</tspan></text></g>
<g class="v2-reading-block" data-block="growth-ideas-0" transform="translate(0 282)"><text class="se-copy" x="89" y="24"><tspan x="89">Does a plant take ready-made food from soil or make food from surrounding</tspan><tspan x="89" dy="32">substances? Predict how water and light affect growth, and what evidence would</tspan><tspan x="89" dy="32">challenge your ideas. Change one condition at a time.</tspan></text></g>
<g class="v2-reading-block" data-block="growth-task" transform="translate(0 394)"><rect class="se-activity-panel" x="89" y="0" width="874" height="900" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Plant similar healthy chilli or tomato seedlings in three matching pots</tspan><tspan x="146" dy="32">with equal amounts of the same soil. Label A, B and C. Record starting</tspan><tspan x="146" dy="32">height, leaf number and colour.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Keep A in suitable sunlight with moist soil. Keep B in the same light</tspan><tspan x="146" dy="32">without watering. Keep C in darkness, with soil moisture similar to A.</tspan><tspan x="146" dy="32">Match temperature and other conditions.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Observe at the same time daily for up to two weeks. Measure height from</tspan><tspan x="146" dy="32">soil level and count leaves consistently. Record actual changes beside</tspan><tspan x="146" dy="32">your predictions.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Stop a treatment if sustained wilting or deterioration occurs; restore</tspan><tspan x="146" dy="32">suitable light and water and record the date. Do not continue until the</tspan><tspan x="146" dy="32">plant dies.</tspan></text><image class="science-illustration" data-photo="growth-setup" href="../../figures/class-7/science/ch10/growth-setup.png" x="113" y="500" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="185.89999999999998" y="798" text-anchor="middle">A</text><text class="se-caption" x="315.5" y="798" text-anchor="middle">B</text><text class="se-caption" x="445.09999999999997" y="798" text-anchor="middle">C</text><text class="se-copy" x="546" y="536"><tspan x="546">Use pots with drainage; an adult</tspan><tspan x="546" dy="32">cuts reused bottles. Avoid</tspan><tspan x="546" dy="32">waterlogging and overheated boxes.</tspan><tspan x="546" dy="32">Never taste soil; wash hands</tspan><tspan x="546" dy="32">afterwards.</tspan></text><text class="se-caption" x="113" y="844.88"><tspan x="113">Starting plants are comparable. The labels specify treatments; they do not predict the</tspan><tspan x="113" dy="27">outcome.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
