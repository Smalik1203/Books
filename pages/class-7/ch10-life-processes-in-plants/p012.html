<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="oxygen-evidence-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">more gas than a dark one because photosynthesis produces oxygen, while</tspan><tspan x="89" dy="32">respiration continues in both. Some oxygen remains dissolved in water or is used</tspan><tspan x="89" dy="32">by the plant, so collected volume is not its entire production.</tspan></text></g>
<g class="v2-reading-block" data-block="evidence-pause" transform="translate(0 224)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A learner sees no bubbles and concludes, “This plant cannot</tspan><tspan x="113" dy="32">photosynthesise.” Give two reasons the apparatus might show no collected</tspan><tspan x="113" dy="32">gas even when some photosynthesis occurs.</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Another learner calls every bubble oxygen. Which extra observation</tspan><tspan x="113" dy="32">strengthens that claim? Explain why a positive gas test still does not establish</tspan><tspan x="113" dy="32">that the sample is pure oxygen.</tspan></text></g>
<g class="v2-reading-block" data-block="photosynthesis" transform="translate(0 552)"><text class="se-heading" x="89" y="30"><tspan x="89">10.2.3 Photosynthesis: Connecting the Evidence</tspan></text></g>
<g class="v2-reading-block" data-block="photosynthesis-definition-0" transform="translate(0 600)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Photosynthesis</tspan> is the process by which green plants use light energy to make</tspan><tspan x="89" dy="32">carbohydrates from carbon dioxide and water, releasing oxygen. Chlorophyll</tspan></text></g>
<g class="v2-reading-block" data-block="photosynthesis-definition-1" transform="translate(0 664)"><text class="se-copy" x="89" y="24"><tspan x="89">helps capture the light. Leaves are major sites, but other green parts such as</tspan><tspan x="89" dy="32">young stems can also photosynthesise. The investigations test parts of this</tspan><tspan x="89" dy="32">account; no single one demonstrates the whole process.</tspan></text></g>
<g class="v2-reading-block" data-block="photosynthesis-equation" transform="translate(0 776)"><text class="v2-equation" x="89" y="30"><tspan x="89">Carbon dioxide + water → glucose + oxygen</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">Light supplies energy; chlorophyll helps absorb it. They are conditions for this simplified</tspan><tspan x="89" dy="27">equation, not extra material ingredients.</tspan></text></g>
<g class="v2-reading-block" data-block="photosynthesis-materials-0" transform="translate(0 900)"><text class="se-copy" x="89" y="24"><tspan x="89">Separate matter from energy as you read the equation. Carbon dioxide and water</tspan><tspan x="89" dy="32">supply atoms that are rearranged into new substances. Light supplies energy for</tspan></text></g>
<g class="v2-reading-block" data-block="photosynthesis-materials-1" transform="translate(0 964)"><text class="se-copy" x="89" y="24"><tspan x="89">this process; it is not a substance that roots absorb or a material stored</tspan><tspan x="89" dy="32">unchanged inside a potato. Some captured energy becomes stored in chemical</tspan></text></g>
<g class="v2-reading-block" data-block="photosynthesis-materials-2" transform="translate(0 1028)"><text class="se-copy" x="89" y="24"><tspan x="89">form. Later, respiration makes part of that energy available for cell activities. The</tspan><tspan x="89" dy="32">arrow summarises many reactions inside cells, not a single visible mixing step.</tspan></text></g><g transform="translate(0 1108)"><g data-page-illustration="figures/class-7/science/ch10/whole-plant.png"><image class="science-illustration" href="../../figures/class-7/science/ch10/whole-plant.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>A plant and its parts.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">A plant and its parts.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
