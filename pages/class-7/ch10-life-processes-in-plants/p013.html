<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="plant-map" transform="translate(0 112)"><g class="v2-plant-diagram" data-diagram="whole-plant"><image class="science-illustration" data-art="whole-plant" href="../../figures/class-7/science/ch10/whole-plant.png" x="352" y="20" width="320" height="480" preserveAspectRatio="xMidYMid meet"/><text class="v2-plant-label" x="100" y="48" text-anchor="start">Light energy</text><path class="v2-plant-arrow" d="M256 54L459 99M449.3945821560796 101.78135723050733L459 99L451.46973918224523 92.42009331247108"/><text class="v2-plant-label" x="100" y="209" text-anchor="start">Carbon dioxide</text><path class="v2-plant-arrow" d="M279 214L422 214M413.22417438109625 218.79425538604204L422 214L413.22417438109625 209.20574461395796"/><text class="v2-plant-label" x="767" y="166" text-anchor="start">Oxygen</text><path class="v2-plant-arrow" d="M666 185L750 170M742.2036204782635 176.26230519481817L750 170L740.5180500475313 166.8231107827185"/><text class="v2-plant-label" x="744" y="276" text-anchor="start">Sugars made</text><text class="v2-plant-label" x="744" y="303" text-anchor="start">in green tissue</text><line class="v2-plant-line" x1="731" y1="287" x2="600" y2="255"/><text class="v2-plant-label" x="100" y="415" text-anchor="start">Water and</text><text class="v2-plant-label" x="100" y="442" text-anchor="start">minerals</text><path class="v2-plant-arrow" d="M228 426L431 426M422.22417438109625 430.79425538604204L431 426L422.22417438109625 421.20574461395796"/></g><text class="se-caption" x="89" y="550.88"><tspan x="89">Carbon dioxide enters green tissues; roots supply water. Light energy supports food</tspan><tspan x="89" dy="27">production. The arrows summarise different routes, not hollow pipes through every leaf.</tspan></text></g>
<g class="v2-reading-block" data-block="sugar-use-0" transform="translate(0 718)"><text class="se-copy" x="89" y="24"><tspan x="89">Glucose is a simple carbohydrate. Plants use sugars in respiration and in building</tspan><tspan x="89" dy="32">other substances, including cellulose in cell walls. They convert some</tspan></text></g>
<g class="v2-reading-block" data-block="sugar-use-1" transform="translate(0 782)"><text class="se-copy" x="89" y="24"><tspan x="89">carbohydrate to starch for storage in leaves, roots, stems or seeds. A potato stores</tspan><tspan x="89" dy="32">starch in an underground stem called a tuber; it does not need to receive sunlight</tspan><tspan x="89" dy="32">underground to obtain carbohydrate.</tspan></text></g>
<g class="v2-reading-block" data-block="leaf-root-connection-0" transform="translate(0 894)"><text class="se-copy" x="89" y="24"><tspan x="89">A root can grow in darkness because it receives sugars from elsewhere in the</tspan><tspan x="89" dy="32">plant. These sugars provide both building material and fuel for respiration. The</tspan></text></g>
<g class="v2-reading-block" data-block="leaf-root-connection-1" transform="translate(0 958)"><text class="se-copy" x="89" y="24"><tspan x="89">root also needs mineral nutrients and a supply of oxygen. Thus a well-lit shoot</tspan><tspan x="89" dy="32">cannot solve every root problem: severely waterlogged soil can limit oxygen</tspan></text></g>
<g class="v2-reading-block" data-block="leaf-root-connection-2" transform="translate(0 1022)"><text class="se-copy" x="89" y="24"><tspan x="89">reaching root cells. Making food, transporting it and using it are linked</tspan><tspan x="89" dy="32">processes, but success in one does not guarantee that the others work normally.</tspan></text></g>
<g class="v2-reading-block" data-block="dastur" transform="translate(0 1102)"><text class="se-copy" x="89" y="24"><tspan x="89">Rustom Hormusji Dastur (1896–1961) was an Indian plant scientist who</tspan><tspan x="89" dy="32">investigated photosynthesis, including the influence of water, temperature and</tspan><tspan x="89" dy="32">light. He led botany at the Royal Institute of Science in Bombay during</tspan><tspan x="89" dy="32">1921–1935. His work illustrates why a plant’s response must be studied under</tspan><tspan x="89" dy="32">stated conditions rather than explained by light alone.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
