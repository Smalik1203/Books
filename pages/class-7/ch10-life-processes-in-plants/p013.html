<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="13"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 13"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="dastur" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Rustom Hormusji Dastur (1896–1961) was an Indian plant scientist who</tspan><tspan x="89" dy="32">investigated photosynthesis, including the influence of water, temperature and</tspan><tspan x="89" dy="32">light. He led botany at the Royal Institute of Science in Bombay during</tspan><tspan x="89" dy="32">1921–1935. His work illustrates why a plant’s response must be studied under</tspan><tspan x="89" dy="32">stated conditions rather than explained by light alone.</tspan></text></g>
<g class="v2-reading-block" data-block="stomata" transform="translate(0 300)"><text class="se-heading" x="89" y="30"><tspan x="89">10.2.4 How Do Leaves Exchange Gases?</tspan></text></g>
<g class="v2-reading-block" data-block="stomata-question-0" transform="translate(0 348)"><text class="se-copy" x="89" y="24"><tspan x="89">A leaf looks continuous to the unaided eye. A microscope reveals structures too</tspan><tspan x="89" dy="32">small to see directly. Examine its surface before explaining how gases enter and</tspan></text></g>
<g class="v2-reading-block" data-block="stomata-question-1" transform="translate(0 412)"><text class="se-copy" x="89" y="24"><tspan x="89">leave. Use a teacher-selected leaf that gives a thin, clear peel; not every species is</tspan><tspan x="89" dy="32">equally suitable.</tspan></text></g>
<g class="v2-reading-block" data-block="microscope-evidence-0" transform="translate(0 492)"><text class="se-copy" x="89" y="24"><tspan x="89">A microscope enlarges a very small field, not the entire leaf. Examine several</tspan><tspan x="89" dy="32">fields before describing what is common. Thick or folded tissue may hide pores,</tspan></text></g>
<g class="v2-reading-block" data-block="microscope-evidence-1" transform="translate(0 556)"><text class="se-copy" x="89" y="24"><tspan x="89">while a tear can resemble an opening. A good drawing selects clearly observed</tspan><tspan x="89" dy="32">structures and records magnification; it does not copy every detail of an ideal</tspan></text></g>
<g class="v2-reading-block" data-block="microscope-evidence-2" transform="translate(0 620)"><text class="se-copy" x="89" y="24"><tspan x="89">diagram. If the preparation is unclear, improve it or examine a prepared slide</tspan><tspan x="89" dy="32">before concluding that the leaf has no stomata.</tspan></text></g>
<g class="v2-reading-block" data-block="peel-task" transform="translate(0 700)"><rect class="se-activity-panel" x="89" y="0" width="874" height="446" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Teacher demonstration: use forceps to peel a thin piece from the lower</tspan><tspan x="146" dy="32">surface of a fresh Tradescantia (rhoeo) leaf. Keep it in a watch glass of</tspan><tspan x="146" dy="32">water.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Lay a flat piece in water on a clean slide. Add school-approved stain if</tspan><tspan x="146" dy="32">needed; lower a coverslip at an angle to reduce trapped air.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Start at low microscope power, increasing as directed. Sketch cells and</tspan><tspan x="146" dy="32">pores; record magnification. Distinguish repeated structures from tears</tspan><tspan x="146" dy="32">or air bubbles.</tspan></text><text class="se-copy" x="113" y="384"><tspan x="113">Handle glass carefully. No learner handles a blade; use prepared slides if</tspan><tspan x="113" dy="32">necessary. Keep stains away from skin and eyes; wash hands afterwards.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">13</text></g></svg></div></div></section>
