<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 11"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="oxygen" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Does a Lit Plant Release a Gas?</tspan></text></g>
<g class="v2-reading-block" data-block="oxygen-question-0" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89">Leaves use materials from their surroundings, but they also release substances.</tspan><tspan x="89" dy="32">An aquatic plant lets us collect some of the gas that leaves it. Seeing bubbles is</tspan><tspan x="89" dy="32">evidence that a gas is escaping, not enough to name the gas or measure its purity.</tspan></text></g>
<g class="v2-reading-block" data-block="oxygen-task" transform="translate(0 272)"><rect class="se-activity-panel" x="89" y="0" width="874" height="952" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Place equal amounts of suitable pondweed under inverted funnels in two</tspan><tspan x="146" dy="32">beakers. Use equal volumes of the same water.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Fill two tubes completely with water. Invert one over each funnel stem,</tspan><tspan x="146" dy="32">keeping its opening submerged without trapped air. Label A and B.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Keep A lit and B dark for the same time at similar temperatures. Record</tspan><tspan x="146" dy="32">whether gas collects; compare volumes over equal intervals.</tspan></text><text class="se-activity-step" x="132" y="320" text-anchor="end">4.</text><text class="se-copy" x="146" y="320"><tspan x="146">If enough gas collects, the teacher uses an approved glowing-splint test</tspan><tspan x="146" dy="32">away from ethanol and other flammables. Learners observe and record</tspan><tspan x="146" dy="32">without handling fire.</tspan></text><text class="se-copy" x="113" y="428"><tspan x="113">Use school-approved pondweed and handle glass safely. Wash hands; never</tspan><tspan x="113" dy="32">release laboratory pondweed into waterways. If too little gas collects, report</tspan><tspan x="113" dy="32">that limit rather than inventing a result.</tspan></text><g transform="translate(0 512)"><g class="v2-plant-diagram" data-diagram="pondweed"><image class="science-illustration" data-art="pondweed" href="../../figures/class-7/science/ch10/pondweed.png" x="412.6666666666667" y="0" width="226.66666666666666" height="340" preserveAspectRatio="xMidYMid meet"/><text class="v2-plant-label" x="100" y="57" text-anchor="start">Tube full</text><text class="v2-plant-label" x="100" y="84" text-anchor="start">of water</text><line class="v2-plant-line" x1="215" y1="72" x2="526" y2="57"/><text class="v2-plant-label" x="746" y="158" text-anchor="start">Water level</text><line class="v2-plant-line" x1="735" y1="153" x2="611" y2="140"/><text class="v2-plant-label" x="100" y="236" text-anchor="start">Inverted funnel</text><line class="v2-plant-line" x1="274" y1="231" x2="493" y2="227"/><text class="v2-plant-label" x="746" y="303" text-anchor="start">Pondweed</text><line class="v2-plant-line" x1="735" y1="298" x2="554" y2="280"/></g></g><text class="se-caption" x="113" y="896.88"><tspan x="113">One initial setup, before gas collects. Prepare a matching second setup; both tubes begin</tspan><tspan x="113" dy="27">completely filled with water.</tspan></text></g>
<g class="v2-reading-block" data-block="oxygen-evidence-0" transform="translate(0 1246)"><text class="se-copy" x="89" y="24"><tspan x="89">A glowing splint relighting in the collected gas supports the presence of</tspan><tspan x="89" dy="32">oxygen-rich gas. Bubbles alone would not establish this. A lit plant may collect</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">11</text></g></svg></div></div></section>
