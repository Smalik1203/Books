<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="dye-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="883" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Fill matching tumblers A and B one-third full with equal water volumes.</tspan><tspan x="146" dy="32">Add school-approved red food dye to B; leave A colourless.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Choose two similar fresh white-flowered carnation or balsam stems. An</tspan><tspan x="146" dy="32">adult cuts their bases obliquely under water and promptly puts one in</tspan><tspan x="146" dy="32">each tumbler.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Match stem length, leaf area, temperature, light and time. Record starting</tspan><tspan x="146" dy="32">colours. Next day, describe any coloured regions in stems, leaves or</tspan><tspan x="146" dy="32">petals.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">4.</text><text class="se-copy" x="146" y="384"><tspan x="146">The teacher cuts thin cross-sections above the waterline. Use a hand lens</tspan><tspan x="146" dy="32">to compare them. Sketch the colour distribution; do not assume the</tspan><tspan x="146" dy="32">whole stem stains.</tspan></text><image class="science-illustration" data-photo="dye-setup" href="../../figures/class-7/science/ch10/dye-setup.png" x="113" y="468" width="427.5" height="285" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="219.875" y="781" text-anchor="middle">A: plain water</text><text class="se-caption" x="433.625" y="781" text-anchor="middle">B: dyed water</text><text class="se-copy" x="568.5" y="504"><tspan x="568.5">Adult cutting only. Do not eat</tspan><tspan x="568.5" dy="32">flowers or drink dye solutions.</tspan><tspan x="568.5" dy="32">Avoid unknown or irritating plant</tspan><tspan x="568.5" dy="32">sap; wash hands afterwards.</tspan></text><text class="se-caption" x="113" y="827.88"><tspan x="113">Both flowers begin white. A contains plain water; B contains dyed water. No transported</tspan><tspan x="113" dy="27">dye is shown in the initial plants.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
