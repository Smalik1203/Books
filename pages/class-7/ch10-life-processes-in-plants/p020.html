<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="20"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 20"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="814" rx="18"/><text class="se-copy" x="113" y="222"><tspan x="113"><tspan class="se-bold">Photosynthesis</tspan> — Using light</tspan><tspan x="113" dy="32">energy to make carbohydrates from</tspan><tspan x="113" dy="32">carbon dioxide and water.</tspan></text><text class="se-copy" x="113" y="338"><tspan x="113"><tspan class="se-bold">Chlorophyll</tspan> — A green pigment that</tspan><tspan x="113" dy="32">absorbs light used in</tspan><tspan x="113" dy="32">photosynthesis.</tspan></text><text class="se-copy" x="113" y="454"><tspan x="113"><tspan class="se-bold">Glucose</tspan> — A simple sugar used in</tspan><tspan x="113" dy="32">respiration and in making other</tspan><tspan x="113" dy="32">substances.</tspan></text><text class="se-copy" x="113" y="570"><tspan x="113"><tspan class="se-bold">Starch</tspan> — A carbohydrate used for</tspan><tspan x="113" dy="32">storage; iodine can reveal its</tspan><tspan x="113" dy="32">presence.</tspan></text><text class="se-copy" x="113" y="686"><tspan x="113"><tspan class="se-bold">Destarching</tspan> — Reducing a plant’s</tspan><tspan x="113" dy="32">stored starch before an</tspan><tspan x="113" dy="32">investigation.</tspan></text><text class="se-copy" x="113" y="802"><tspan x="113"><tspan class="se-bold">Variegated</tspan> <tspan class="se-bold">leaf</tspan> — A leaf with</tspan><tspan x="113" dy="32">differently coloured patches, often</tspan><tspan x="113" dy="32">green and cream.</tspan></text><text class="se-copy" x="113" y="918"><tspan x="113"><tspan class="se-bold">Stoma</tspan> — A pore in the plant surface;</tspan><tspan x="113" dy="32">the plural is stomata.</tspan></text><text class="se-copy" x="541" y="222"><tspan x="541"><tspan class="se-bold">Guard</tspan> <tspan class="se-bold">cells</tspan> — Cells bordering a</tspan><tspan x="541" dy="32">stoma that regulate its opening.</tspan></text><text class="se-copy" x="541" y="306"><tspan x="541"><tspan class="se-bold">Xylem</tspan> — Tissue that conducts water</tspan><tspan x="541" dy="32">and dissolved minerals.</tspan></text><text class="se-copy" x="541" y="390"><tspan x="541"><tspan class="se-bold">Phloem</tspan> — Tissue that carries</tspan><tspan x="541" dy="32">dissolved sugars to regions that use</tspan><tspan x="541" dy="32">or store them.</tspan></text><text class="se-copy" x="541" y="506"><tspan x="541"><tspan class="se-bold">Transpiration</tspan> — Loss of water</tspan><tspan x="541" dy="32">vapour from a plant, mainly through</tspan><tspan x="541" dy="32">stomata.</tspan></text><text class="se-copy" x="541" y="622"><tspan x="541"><tspan class="se-bold">Respiration</tspan> — Cellular processes</tspan><tspan x="541" dy="32">that release usable energy from</tspan><tspan x="541" dy="32">food.</tspan></text><text class="se-copy" x="541" y="738"><tspan x="541"><tspan class="se-bold">Control</tspan> — A comparison that helps</tspan><tspan x="541" dy="32">isolate the factor being investigated.</tspan></text><text class="se-copy" x="541" y="822"><tspan x="541"><tspan class="se-bold">Net</tspan> <tspan class="se-bold">exchange</tspan> — The overall result</tspan><tspan x="541" dy="32">when substances enter and leave at</tspan><tspan x="541" dy="32">the same time.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">20</text></g></svg></div></div></section>
