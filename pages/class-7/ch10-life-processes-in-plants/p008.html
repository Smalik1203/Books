<section class="page page--food page--science-editorial page--science-v2 page--g7-ch10" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Life Processes in Plants, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-plant-motif" transform="translate(25 8) scale(.40)"><path d="M36 111C24 84 30 45 48 9M31 76C4 71 4 42 7 35C29 39 39 52 31 76ZM33 61C58 61 76 34 73 24C50 26 39 38 33 61ZM35 92C55 94 76 79 79 65C53 59 40 74 35 92Z"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 10</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Life Processes in Plants</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="air" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">10.2.2 What Does Air Contribute?</tspan></text></g>
<g class="v2-reading-block" data-block="co2-question-0" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89">Carbon dioxide is a small part of air. To investigate its role, compare leaves that</tspan><tspan x="89" dy="32">receive similar light, water and temperature but have different carbon-dioxide</tspan></text></g>
<g class="v2-reading-block" data-block="co2-question-1" transform="translate(0 224)"><text class="se-copy" x="89" y="24"><tspan x="89">availability. <tspan class="se-bold">Destarching</tspan> means reducing stored starch before a test, usually by</tspan><tspan x="89" dy="32">keeping the plant in darkness while it continues to use its reserves.</tspan></text></g>
<g class="v2-reading-block" data-block="co2-task" transform="translate(0 304)"><rect class="se-activity-panel" x="89" y="0" width="874" height="908" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Teacher demonstration: prepare two comparable watered plants with</tspan><tspan x="146" dy="32">starch reduced below detection. Enclose each under an identical</tspan><tspan x="146" dy="32">transparent bell jar on a plate.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Place a stable dish of teacher-prepared sodium hydroxide solution in A,</tspan><tspan x="146" dy="32">away from plant and soil. Put an equal dish of water in B. Seal both jars to</tspan><tspan x="146" dy="32">their plates.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">3.</text><text class="se-copy" x="146" y="308"><tspan x="146">Give both the same few hours of suitable light. Match plant kind, leaf age,</tspan><tspan x="146" dy="32">water and temperature; prevent overheating. Sodium hydroxide absorbs</tspan><tspan x="146" dy="32">carbon dioxide.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">4.</text><text class="se-copy" x="146" y="416"><tspan x="146">Test comparable leaves using the same starch procedure. Record iodine</tspan><tspan x="146" dy="32">colours before interpreting the evidence.</tspan></text><image class="science-illustration" data-photo="co2-setup" href="../../figures/class-7/science/ch10/co2-setup.png" x="113" y="468" width="465" height="310" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="229.25" y="806" text-anchor="middle">A: absorber</text><text class="se-caption" x="461.75" y="806" text-anchor="middle">B: water</text><text class="se-copy" x="606" y="504"><tspan x="606">Sodium hydroxide is</tspan><tspan x="606" dy="32">corrosive. Only the teacher</tspan><tspan x="606" dy="32">handles solutions, jars, hot</tspan><tspan x="606" dy="32">water, ethanol, iodine and</tspan><tspan x="606" dy="32">disposal, using eye protection</tspan><tspan x="606" dy="32">and suitable gloves.</tspan></text><text class="se-caption" x="113" y="852.88"><tspan x="113">Two sealed enclosures control for the jar itself. A contains a carbon-dioxide absorber; B</tspan><tspan x="113" dy="27">contains water.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
