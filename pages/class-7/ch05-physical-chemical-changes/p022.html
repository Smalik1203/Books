<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="22" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 22"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-yeast-head" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">What makes bread dough rise?</tspan></text></g>
<g class="v2-reading-block" data-block="project-yeast" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89">With your teacher, dissolve two teaspoons of sugar in a little lukewarm water in a</tspan><tspan x="89" dy="32">small bottle. Add a spoonful of fresh yeast and fit a balloon. Compare with a</tspan><tspan x="89" dy="32">matching bottle without yeast after about an hour. Do not use hot water or rigid</tspan><tspan x="89" dy="32">caps. Record balloon expansion. The teacher tests collected gas with fresh lime</tspan><tspan x="89" dy="32">water using tubing; do not shake or suck lime water. Explain each observation</tspan><tspan x="89" dy="32">and any uncertainty. Identify physical and chemical changes, then connect gas</tspan><tspan x="89" dy="32">production with bubbles in bread dough.</tspan></text></g>
<g class="v2-reading-block" data-block="project-yeast-figure" transform="translate(0 400)"><image class="science-illustration" data-photo="yeast" href="../../figures/class-7/science/ch05/yeast.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Equipment before mixing. A comparison without yeast helps test what causes any change.</tspan></text></g>
<g class="v2-reading-block" data-block="project-chameleon-head" transform="translate(0 747)"><text class="se-heading" x="89" y="30"><tspan x="89">A reversible colour change?</tspan></text></g>
<g class="v2-reading-block" data-block="project-chameleon" transform="translate(0 795)"><text class="se-copy" x="89" y="24"><tspan x="89">Research chameleon colour changes using your school library or a reliable</tspan><tspan x="89" dy="32">scientific source. Colour can relate to communication, temperature and</tspan><tspan x="89" dy="32">camouflage, not deliberate matching to every background. Can the change</tspan><tspan x="89" dy="32">reverse? Why does colour alone not prove a new substance formed? Identify the</tspan><tspan x="89" dy="32">species and evidence. Use images or video; never stress an animal.</tspan></text></g>
<g class="v2-reading-block" data-block="project-chameleon-figure" transform="translate(0 971)"><image class="science-illustration" data-photo="chameleon" href="../../figures/class-7/science/ch05/chameleon.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">A chameleon’s colour has several functions. Research the mechanism rather than classifying</tspan><tspan x="89" dy="27">it from appearance alone.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">22</text></g></svg></div></div></section>
