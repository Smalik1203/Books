<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="notice-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Noticing a Change</tspan></text></g>
<g class="v2-reading-block" data-block="notice-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Describe what you can observe before trying to name a change. Size, shape,</tspan><tspan x="89" dy="32">colour, state and temperature can change. Sometimes a sound or an odour</tspan></text></g>
<g class="v2-reading-block" data-block="notice-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">provides another clue. Use sight first; never taste an unknown substance,</tspan><tspan x="89" dy="32">deliberately inhale fumes, or touch a hot object.</tspan></text></g>
<g class="v2-reading-block" data-block="notice-task" transform="translate(0 314)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Choose three changes from the table. For each one, describe the starting</tspan><tspan x="113" dy="32">material and what you would notice afterwards. Keep an observation such as</tspan><tspan x="113" dy="32">“a liquid appears” separate from an explanation such as “the ice has melted”.</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Add one change from your surroundings. Which changes appear similar?</tspan><tspan x="113" dy="32">Propose a way to group them, and explain what you still need to find out.</tspan><tspan x="113" dy="32">Record your ideas in your notebook.</tspan></text></g>

pan></text><line class="v2-table-rule" x1="89" x2="963" y1="382" y2="382"/><text class="se-copy se-table-copy" x="103" y="416.08"><tspan x="103">Making dough balls; rolling chapatis</tspan></text><text class="se-copy se-table-copy" x="540" y="416.08"><tspan x="540">Shape, size and texture</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="434" y2="434"/><rect class="v2-table-frame" x="89" y="42" width="874" height="392"/><line class="v2-table-rule" x1="526" x2="526" y1="42" y2="434"/><text class="v2-table-note" x="89" y="466.88"><tspan x="89">Read across for observation clues; compare down to find similarities. These are prompts, not</tspan><tspan x="89" dy="26">recorded results. Discuss burning and boiling from safe adult demonstrations.</tspan></text></g><g transform="translate(0 1148)"><g data-page-illustration="figures/class-7/science/ch05/physical-objects.png"><image class="science-illustration" href="../../figures/class-7/science/ch05/physical-objects.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Objects that can change shape.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Objects that can change shape.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
