<g class="v2-reading-block" data-block="assessment-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Use your notebook. Support each answer with evidence and explain any</tspan><tspan x="89" dy="32">uncertainty.</tspan></text></g>
<g class="v2-reading-block" data-block="q1" transform="translate(0 250)"><text class="se-copy" x="111" y="24" text-anchor="end">1.</text><text class="se-copy" x="132" y="24"><tspan x="132">Which pair describes a physical change? (i) The state may or may not change.</tspan><tspan x="132" dy="32">(ii) A substance with different properties is formed. (iii) No new substance is</tspan><tspan x="132" dy="32">formed. (iv) A chemical reaction occurs. Choose: (a) i and ii; (b) ii and iii; (c) i</tspan><tspan x="132" dy="32">and iii; (d) iii and iv. Explain your choice.</tspan></text></g>
<g class="v2-reading-block" data-block="q2" transform="translate(0 408)"><text class="se-copy" x="111" y="24" text-anchor="end">2.</text><text class="se-copy" x="132" y="24"><tspan x="132">Predict whether each change can be reversed by ordinary methods. State</tspan><tspan x="132" dy="32">your conditions and any uncertainty: (i) stitching cloth into a shirt; (ii)</tspan><tspan x="132" dy="32">twisting a straight string; (iii) making idlis from batter; (iv) dissolving sugar</tspan><tspan x="132" dy="32">in water; (v) drawing water from a well; (vi) ripening fruit; (vii) boiling water</tspan><tspan x="132" dy="32">in an open pan; (viii) rolling up a mat; (ix) grinding wheat into flour; (x)</tspan><tspan x="132" dy="32">forming soil from rocks.</tspan></text></g>
<g class="v2-reading-block" data-block="q3" transform="translate(0 630)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24"><tspan x="132">State True or False and correct each false statement: (i) Melting wax helps</tspan><tspan x="132" dy="32">supply fuel to a burning candle. (ii) Collecting water vapour by condensation</tspan><tspan x="132" dy="32">is a chemical change. (iii) Converting leaves into compost involves chemical</tspan><tspan x="132" dy="32">changes. (iv) Mixing baking soda with lemon juice produces a chemical</tspan><tspan x="132" dy="32">change.</tspan></text></g><g transform="translate(0 820)"><g data-page-illustration="figures/class-7/science/ch05/physical-objects.png"><image class="science-illustration" href="../../figures/class-7/science/ch05/physical-objects.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Objects that can change shape.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Objects that can change shape.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
