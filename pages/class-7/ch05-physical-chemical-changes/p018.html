<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q8" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">8.</text><text class="se-copy" x="132" y="24"><tspan x="132">Read “Eco-friendly Prithvi” and give it your own title. Prithvi chops</tspan><tspan x="132" dy="32">vegetables, peels potatoes and cuts fruit. He gathers seeds and peelings in a</tspan><tspan x="132" dy="32">clay pot. Bacteria and fungi decompose suitable scraps into compost. He</tspan><tspan x="132" dy="32">plants some seeds, waters them and watches seedlings grow and later flower.</tspan><tspan x="132" dy="32">Identify physical changes, chemical changes, and stages involving both.</tspan><tspan x="132" dy="32">Gathering objects in a pot does not itself prove that a reaction has occurred.</tspan></text></g>
<g class="v2-reading-block" data-block="q9" transform="translate(0 334)"><text class="se-copy" x="111" y="24" text-anchor="end">9.</text><text class="se-copy" x="132" y="24"><tspan x="132">Draw two overlapping circles in your notebook. Mark physical changes only</tspan><tspan x="132" dy="32">as A, chemical changes only as B, and a process containing both as C. Place</tspan><tspan x="132" dy="32">these examples: burning a candle; tearing paper; rusting; curdling milk;</tspan><tspan x="132" dy="32">ripening fruit; melting ice; folding clothes; burning magnesium; mixing</tspan><tspan x="132" dy="32">baking soda with vinegar. Explain any classification that depends on which</tspan><tspan x="132" dy="32">part of the process you consider.</tspan></text></g>
<g class="v2-reading-block" data-block="q10" transform="translate(0 556)"><text class="se-copy" x="111" y="24" text-anchor="end">10.</text><text class="se-copy" x="132" y="24"><tspan x="132">Four teacher-prepared setups pass any gas produced into fresh lime water.</tspan><tspan x="132" dy="32">Predict which receivers will become milky and explain why. The starting</tspan><tspan x="132" dy="32">mixtures are (a) vinegar and baking soda; (b) lemon juice and vinegar; (c)</tspan><tspan x="132" dy="32">vinegar and common salt; (d) lemon juice and baking soda. Assume clean</tspan><tspan x="132" dy="32">apparatus and working delivery tubes; explain how a leak would affect your</tspan><tspan x="132" dy="32">conclusion.</tspan></text><g transform="translate(0 208)"><g class="v2-change-diagram" data-diagram="four-tests"><path class="v2-change-line" d="M133 42V107Q133 125 153 125H223Q243 125 243 107V42"/><path class="v2-change-water" d="M135 78H241V107Q241 123 223 123H153Q135 123 135 107Z"/><rect class="v2-change-cap" x="129" y="30" width="118" height="18" rx="3"/><path class="v2-change-line" d="M345 42V107Q345 125 365 125H435Q455 125 455 107V42"/><path class="v2-change-water" d="M347 78H453V107Q453 123 435 123H365Q347 123 347 107Z"/><path class="v2-change-line" d="M188 62V25Q188 17 196 17H392Q400 17 400 25V105"/><text class="v2-change-label" x="188" y="167" text-anchor="middle">(a) Vinegar</text><text class="v2-change-label" x="188" y="197" text-anchor="middle">+ baking soda</text><text class="v2-change-label" x="400" y="167" text-anchor="middle">Lime water</text><path class="v2-change-line" d="M583 42V107Q583 125 603 125H673Q693 125 693 107V42"/><path class="v2-change-water" d="M585 78H691V107Q691 123 673 123H603Q585 123 585 107Z"/><rect class="v2-change-cap" x="579" y="30" width="118" height="18" rx="3"/><path class="v2-change-line" d="M795 42V107Q795 125 815 125H885Q905 125 905 107V42"/><path class="v2-change-water" d="M797 78H903V107Q903 123 885 123H815Q797 123 797 107Z"/>
