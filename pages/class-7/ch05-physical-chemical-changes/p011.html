<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 11"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="wax-diagram" transform="translate(0 112)"><g class="v2-change-diagram" data-diagram="wax-path"><rect class="v2-change-box" x="105" y="10" width="216" height="56" rx="9"/><text class="v2-change-label" x="213" y="42" text-anchor="middle">Solid wax</text><path class="v2-change-line" d="M326 38L375 38"/><path class="v2-change-line" d="M367 32L375 38L367 44"/><rect class="v2-change-box" x="382" y="10" width="267" height="56" rx="9"/><text class="v2-change-label" x="515.5" y="42" text-anchor="middle">Liquid wax</text><path class="v2-change-line" d="M655 38L704 38"/><path class="v2-change-line" d="M696 32L704 38L696 44"/><rect class="v2-change-box" x="711" y="10" width="235" height="56" rx="9"/><text class="v2-change-label" x="828.5" y="42" text-anchor="middle">Wax vapour</text><text class="v2-change-label" x="351" y="98" text-anchor="middle">Melting</text><text class="v2-change-label" x="683" y="98" text-anchor="middle">Vaporising</text><text class="v2-change-label" x="514" y="143" text-anchor="middle">Travels up the wick</text><path class="v2-change-line" d="M829 66V181M822 173L829 181L836 173"/><rect class="v2-change-box" x="646" y="188" width="300" height="86" rx="9"/><text class="v2-change-label" x="796" y="220" text-anchor="middle">Reacts with oxygen</text><text class="v2-change-label" x="796" y="250" text-anchor="middle">in the flame</text><text class="v2-change-label" x="380" y="229" text-anchor="middle">Carbon dioxide + water</text><text class="v2-change-label" x="380" y="262" text-anchor="middle">Energy released as heat and light</text><path class="v2-change-line" d="M640 230H610M618 224L610 230L618 236"/></g><text class="se-caption" x="89" y="314.88"><tspan x="89">The wick supplies fuel to the flame. The arrows trace a sequence; they do not show the</tspan><tspan x="89" dy="27">movement of heat.</tspan></text></g>
<g class="v2-reading-block" data-block="wax-comparison" transform="translate(0 482)"><g data-comparison-table="wax-comparison"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Two kinds of change in a candle</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="260.32" y="76.08"><tspan x="260.32">Physical changes</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="618.6600000000001" y="76.08"><tspan x="618.6600000000001">Chemical change</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">What</tspan><tspan x="103" dy="28">happens</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="128.07999999999998"><tspan x="260.32">Wax melts, travels up the wick</tspan><tspan x="260.32" dy="28">and vaporises. Wax that cools</tspan><tspan x="260.32" dy="28">can solidify again.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="128.07999999999998"><tspan x="618.6600000000001">Wax vapour reacts with oxygen,</tspan><tspan x="618.6600000000001" dy="28">forming carbon dioxide and</tspan><tspan x="618.6600000000001" dy="28">water. Released heat melts and</tspan><tspan x="618.6600000000001" dy="28">vaporises more wax.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="230" y2="230"/><rect class="v2-table-frame" x="89" y="42" width="874" height="188"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="42" y2="230"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="42" y2="230"/></g></g>
<g class="v2-reading-block" data-block="wax-explanation-0" transform="translate(0 728)"><text class="se-copy" x="89" y="24"><tspan x="89">The wick draws liquid wax through its tiny spaces. Vapour near the flame is the</tspan><tspan x="89" dy="32">main fuel. Melting, solidifying and vaporising do not create new substances;</tspan><tspan x="89" dy="32">burning the vapour does. One process includes both kinds of change.</tspan></text></g><g transform="translate(0 840)"><g data-page-illustration="figures/class-7/science/ch05/candles.png"><image class="science-illustration" href="../../figures/class-7/science/ch05/candles.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Candles.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Candles.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">11</text></g></svg></div></div></section>
