<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 11"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="wax-comparison" transform="translate(0 112)"><g data-comparison-table="wax-comparison"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Two kinds of change in a candle</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="260.32" y="76.08"><tspan x="260.32">Physical changes</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="618.6600000000001" y="76.08"><tspan x="618.6600000000001">Chemical change</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">What</tspan><tspan x="103" dy="28">happens</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="128.07999999999998"><tspan x="260.32">Wax melts, travels up the wick</tspan><tspan x="260.32" dy="28">and vaporises. Wax that cools</tspan><tspan x="260.32" dy="28">can solidify again.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="128.07999999999998"><tspan x="618.6600000000001">Wax vapour reacts with oxygen,</tspan><tspan x="618.6600000000001" dy="28">forming carbon dioxide and</tspan><tspan x="618.6600000000001" dy="28">water. Released heat melts and</tspan><tspan x="618.6600000000001" dy="28">vaporises more wax.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="230" y2="230"/><rect class="v2-table-frame" x="89" y="42" width="874" height="188"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="42" y2="230"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="42" y2="230"/></g></g>
<g class="v2-reading-block" data-block="wax-explanation-0" transform="translate(0 358)"><text class="se-copy" x="89" y="24"><tspan x="89">The wick draws liquid wax through its tiny spaces. Vapour near the flame is the</tspan><tspan x="89" dy="32">main fuel. Melting, solidifying and vaporising do not create new substances;</tspan><tspan x="89" dy="32">burning the vapour does. One process includes both kinds of change.</tspan></text></g>
<g class="v2-reading-block" data-block="faraday-head" transform="translate(0 482)"><text class="se-heading" x="89" y="30"><tspan x="89">Faraday’s candle</tspan></text></g>
<g class="v2-reading-block" data-block="faraday-0" transform="translate(0 530)"><text class="se-copy" x="89" y="24"><tspan x="89">Michael Faraday explored melting, vaporisation and combustion in his lectures,</tspan><tspan x="89" dy="32"><tspan class="se-italic">The</tspan> <tspan class="se-italic">Chemical</tspan> <tspan class="se-italic">History</tspan> <tspan class="se-italic">of</tspan> <tspan class="se-italic">a</tspan> <tspan class="se-italic">Candle</tspan>, published in 1861. He showed how studying an</tspan><tspan x="89" dy="32">ordinary object carefully can open up scientific questions.</tspan></text></g>
<g class="v2-reading-block" data-block="reverse-head" transform="translate(0 654)"><text class="v2-title" x="89" y="38"><tspan x="89">5.5 Can a Change Be Reversed?</tspan></text></g>
<g class="v2-reading-block" data-block="reverse-task" transform="translate(0 712)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Return to the changes in Table 5.1 and add folding paper and bursting a</tspan><tspan x="113" dy="32">balloon. For each, decide whether you could recover the original material,</tspan><tspan x="113" dy="32">the original shape, both, or neither using ordinary methods.</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Explain the method you have in mind. If you are uncertain, state what</tspan><tspan x="113" dy="32">information is missing. Compare your reasoning with a partner before using</tspan><tspan x="113" dy="32">the sample records below.</tspan></text></g>
<g class="v2-reading-block" data-block="recover-material-0" transform="translate(0 1028)"><text class="se-copy" x="89" y="24"><tspan x="89">Consider sugar dissolved in water. The sugar has not vanished simply because its</tspan><tspan x="89" dy="32">crystals are no longer visible. If water evaporates under suitable conditions,</tspan></text></g>
<g class="v2-reading-block" data-block="recover-material-1" transform="translate(0 1092)"><text class="se-copy" x="89" y="24"><tspan x="89">sugar can be recovered, although the crystals need not have their original shapes</tspan><tspan x="89" dy="32">or sizes. Recovering both sugar and water would require collecting and</tspan></text></g>
<g class="v2-reading-block" data-block="recover-material-2" transform="translate(0 1156)"><text class="se-copy" x="89" y="24"><tspan x="89">condensing the water vapour as well. That is a different aim from recovering only</tspan><tspan x="89" dy="32">the sugar.</tspan></text></g>
<g class="v2-reading-block" data-block="recover-object-0" transform="translate(0 1236)"><text class="se-copy" x="89" y="24"><tspan x="89">Now compare a shirt stitched from cloth with wheat ground into flour. Removing</tspan><tspan x="89" dy="32">stitches may recover pieces of cloth, but needle holes or cuts may remain.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">11</text></g></svg></div></div></section>
