<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="19"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 19"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Explore Further</tspan></text></g>
<g class="v2-reading-block" data-block="project-ink-head" transform="translate(0 182)"><text class="se-heading" x="89" y="30"><tspan x="89">A message that appears on warming</tspan></text></g>
<g class="v2-reading-block" data-block="project-ink-0" transform="translate(0 230)"><text class="se-copy" x="89" y="24"><tspan x="89">Write a short message with lemon juice on plain paper and let it dry. Ask an adult</tspan><tspan x="89" dy="32">to reveal it using a gently warm iron over a protective sheet on a heatproof</tspan></text></g>
<g class="v2-reading-block" data-block="project-ink-1" transform="translate(0 294)"><text class="se-copy" x="89" y="24"><tspan x="89">surface. The adult handles the iron throughout and stops if the paper scorches;</tspan><tspan x="89" dy="32">do not hold paper over a flame. Compare drying with the later browning. Which</tspan></text></g>
<g class="v2-reading-block" data-block="project-ink-2" transform="translate(0 358)"><text class="se-copy" x="89" y="24"><tspan x="89">changes could be reversed, by what method, and what evidence supports your</tspan><tspan x="89" dy="32">answer?</tspan></text></g>
<g class="v2-reading-block" data-block="project-slopes-head" transform="translate(0 450)"><text class="se-heading" x="89" y="30"><tspan x="89">Protecting a slope</tspan></text></g>
<g class="v2-reading-block" data-block="project-slopes-0" transform="translate(0 498)"><text class="se-copy" x="89" y="24"><tspan x="89">Use reliable reports or speak with a geography teacher about landslides and rock</tspan><tspan x="89" dy="32">erosion. Discuss how vegetation, drainage, construction choices and avoiding</tspan></text></g>
<g class="v2-reading-block" data-block="project-slopes-1" transform="translate(0 562)"><text class="se-copy" x="89" y="24"><tspan x="89">disturbance of unstable slopes can affect risk. Explain why no single measure</tspan><tspan x="89" dy="32">prevents every landslide. Use photographs or published maps; do not visit a</tspan></text></g>
<g class="v2-reading-block" data-block="project-slopes-2" transform="translate(0 626)"><text class="se-copy" x="89" y="24"><tspan x="89">hazardous slope. Present two locally relevant precautions and name your</tspan><tspan x="89" dy="32">sources.</tspan></text></g>
<g class="v2-reading-block" data-block="project-kitchen-head" transform="translate(0 718)"><text class="se-heading" x="89" y="30"><tspan x="89">A kitchen change diary</tspan></text></g>
<g class="v2-reading-block" data-block="project-kitchen-0" transform="translate(0 766)"><text class="se-copy" x="89" y="24"><tspan x="89">With an adult, observe three ordinary kitchen activities from a safe distance.</tspan><tspan x="89" dy="32">Record the material before and after, whether a new substance seems to form,</tspan></text></g>
<g class="v2-reading-block" data-block="project-kitchen-1" transform="translate(0 830)"><text class="se-copy" x="89" y="24"><tspan x="89">and whether the change can be reversed under stated conditions. Include at least</tspan><tspan x="89" dy="32">one change of shape and one involving heating. Do not taste experimental</tspan><tspan x="89" dy="32">mixtures or handle a knife or hot vessel for this task.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">19</text></g></svg></div></div></section>
