<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="19"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 19"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q4" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24"><tspan x="132">Complete these statements in your notebook. (i) Nalini’s iron cycle handle</tspan><tspan x="132" dy="32">develops brown deposits called [name]; this is a [type] change. (ii) Folding a</tspan><tspan x="132" dy="32">handkerchief is a [type] change that can be [undone or not undone]. (iii) A</tspan><tspan x="132" dy="32">reaction with oxygen that releases heat is called [name] and is a [type]</tspan><tspan x="132" dy="32">change. (iv) Burning magnesium forms [substance]; with water this gives a</tspan><tspan x="132" dy="32">[acidic/basic/neutral] mixture. Burning magnesium is a [type] change.</tspan></text></g>
<g class="v2-reading-block" data-block="q5" transform="translate(0 334)"><text class="se-copy" x="111" y="24" text-anchor="end">5.</text><text class="se-copy" x="132" y="24"><tspan x="132">Are water freezing into ice and liquid water becoming water vapour physical</tspan><tspan x="132" dy="32">or chemical changes? Explain using the identity of the substance. Why</tspan><tspan x="132" dy="32">should visible mist not be confused with invisible water vapour?</tspan></text></g>
<g class="v2-reading-block" data-block="q6" transform="translate(0 460)"><text class="se-copy" x="111" y="24" text-anchor="end">6.</text><text class="se-copy" x="132" y="24"><tspan x="132">Is milk turning into curd a physical or chemical change? Justify your answer.</tspan><tspan x="132" dy="32">Explain why saying only “it looks different” is not enough.</tspan></text></g>
<g class="v2-reading-block" data-block="q7" transform="translate(0 554)"><text class="se-copy" x="111" y="24" text-anchor="end">7.</text><text class="se-copy" x="132" y="24"><tspan x="132">Wind, rain, temperature changes and other natural factors help form soil</tspan><tspan x="132" dy="32">from rock. Explain how both physical and chemical changes can be involved.</tspan><tspan x="132" dy="32">Distinguish weathering from the transport of the resulting particles.</tspan></text></g>
<g class="v2-reading-block" data-block="q8" transform="translate(0 680)"><text class="se-copy" x="111" y="24" text-anchor="end">8.</text><text class="se-copy" x="132" y="24"><tspan x="132">Read “Eco-friendly Prithvi” and give it your own title. Prithvi chops</tspan><tspan x="132" dy="32">vegetables, peels potatoes and cuts fruit. He gathers seeds and peelings in a</tspan><tspan x="132" dy="32">clay pot. Bacteria and fungi decompose suitable scraps into compost. He</tspan><tspan x="132" dy="32">plants some seeds, waters them and watches seedlings grow and later flower.</tspan><tspan x="132" dy="32">Identify physical changes, chemical changes, and stages involving both.</tspan><tspan x="132" dy="32">Gathering objects in a pot does not itself prove that a reaction has occurred.</tspan></text></g><g transform="translate(0 902)"><g data-page-illustration="figures/class-7/science/ch05/physical-objects.png"><image class="science-illustration" href="../../figures/class-7/science/ch05/physical-objects.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Objects that can change shape.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Objects that can change shape.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">19</text></g></svg></div></div></section>
