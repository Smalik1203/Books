<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="rust-time-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">coating reduces contact with air and moisture. Its usefulness depends on keeping</tspan><tspan x="89" dy="32">that barrier intact.</tspan></text></g>
<g class="v2-reading-block" data-block="combustion-head" transform="translate(0 204)"><text class="se-heading" x="89" y="30"><tspan x="89">Combustion: reacting with oxygen</tspan></text></g>
<g class="v2-reading-block" data-block="magnesium-0" transform="translate(0 252)"><text class="se-copy" x="89" y="24"><tspan x="89">In the earlier teacher demonstration, magnesium ribbon burned with a bright</tspan><tspan x="89" dy="32">light and formed a white powder, magnesium oxide. A new substance was</tspan></text></g>
<g class="v2-reading-block" data-block="magnesium-1" transform="translate(0 316)"><text class="se-copy" x="89" y="24"><tspan x="89">formed, while energy was released as heat and light. Recall the evidence; do not</tspan><tspan x="89" dy="32">repeat the burning yourself or look directly at burning magnesium.</tspan></text></g>
<g class="v2-reading-block" data-block="magnesium-equation" transform="translate(0 396)"><text class="v2-equation" x="89" y="30"><tspan x="89">Magnesium + Oxygen → Magnesium oxide</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">Energy is released as heat and light. Magnesium oxide is a new substance; light is not a</tspan><tspan x="89" dy="27">material product.</tspan></text></g>
<g class="v2-reading-block" data-block="combustion-0" transform="translate(0 520)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Combustion</tspan> is a chemical reaction with oxygen that releases energy as heat,</tspan><tspan x="89" dy="32">often with light. Wood, paper, cotton and kerosene are <tspan class="se-bold">combustible</tspan> materials:</tspan></text></g>
<g class="v2-reading-block" data-block="combustion-1" transform="translate(0 584)"><text class="se-copy" x="89" y="24"><tspan x="89">they can serve as fuels. Not every chemical change is combustion, and not every</tspan><tspan x="89" dy="32">combustion process has a visible flame.</tspan></text></g>
<g class="v2-reading-block" data-block="candle-air-task" transform="translate(0 664)"><rect class="se-activity-panel" x="89" y="0" width="874" height="710" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Teacher demonstration only. Use two identical short candles fixed upright on</tspan><tspan x="113" dy="32">non-flammable dishes, a heat-resistant jar, a heatproof surface and a means</tspan><tspan x="113" dy="32">of extinguishing the flames. Keep hair, clothing and paper away.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">1.</text><text class="se-copy" x="146" y="200"><tspan x="146">The teacher lights both candles. Watch from the agreed distance and</tspan><tspan x="146" dy="32">describe the flames before either is covered.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">2.</text><text class="se-copy" x="146" y="276"><tspan x="146">The teacher places the jar over one candle while leaving the other</tspan><tspan x="146" dy="32">uncovered. Compare what happens over the same observation period.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">3.</text><text class="se-copy" x="146" y="352"><tspan x="146">Record how long each flame remains visible. Do not touch the jar or wax:</tspan><tspan x="146" dy="32">both may stay hot after the flame is out. The teacher extinguishes the</tspan><tspan x="146" dy="32">remaining candle and allows everything to cool.</tspan></text><image class="science-illustration" data-photo="candles" href="../../figures/class-7/science/ch05/candles.png" x="364.75" y="436" width="322.5" height="215" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="113" y="681.88"><tspan x="113">Equipment before the teacher lights the candles. Only one candle will be covered.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
