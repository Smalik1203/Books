<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="triangle-diagram" transform="translate(0 112)"><g class="v2-change-diagram" data-diagram="fire-triangle"><path class="v2-change-line" d="M526 52L308 184H744Z"/><rect class="v2-change-box" x="375" y="0" width="302" height="56" rx="9"/><text class="v2-change-label" x="526" y="32" text-anchor="middle">Fuel</text><rect class="v2-change-box" x="148" y="174" width="320" height="56" rx="9"/><text class="v2-change-label" x="308" y="206" text-anchor="middle">Oxygen</text><rect class="v2-change-box" x="584" y="174" width="320" height="56" rx="9"/><text class="v2-change-label" x="744" y="206" text-anchor="middle">Enough heat</text><text class="v2-change-label se-bold" x="526" y="129" text-anchor="middle">Combustion</text></g><text class="se-caption" x="89" y="269.88"><tspan x="89">The fire triangle groups three requirements for sustained burning. Removing one can stop</tspan><tspan x="89" dy="27">combustion.</tspan></text></g>
<g class="v2-reading-block" data-block="triangle-use-0" transform="translate(0 437)"><text class="se-copy" x="89" y="24"><tspan x="89">The fuel must be combustible, oxygen must be available, and the fuel must be hot</tspan><tspan x="89" dy="32">enough. Covering a small flame with suitable equipment restricts fresh air.</tspan></text></g>
<g class="v2-reading-block" data-block="triangle-use-1" transform="translate(0 501)"><text class="se-copy" x="89" y="24"><tspan x="89">Cooling removes heat. Keeping spare fuel away prevents a fire spreading.</tspan><tspan x="89" dy="32">Choosing how to control a real fire is a job for trained adults.</tspan></text></g>
<g class="v2-reading-block" data-block="both-head" transform="translate(0 593)"><text class="v2-title" x="89" y="38"><tspan x="89">5.4 Two Kinds of Change Together</tspan></text></g>
<g class="v2-reading-block" data-block="candle-think" transform="translate(0 651)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Picture the teacher’s burning candle. One learner notices wax melting.</tspan><tspan x="113" dy="32">Another notices liquid moving up the wick. A third says wax vapour burns; a</tspan><tspan x="113" dy="32">fourth watches spilled wax become solid again.</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Discuss these four observations with a partner. Which describe changes of</tspan><tspan x="113" dy="32">state or movement? Which suggest new substances? Can all four belong to</tspan><tspan x="113" dy="32">one process? Explain your reasoning before reading on.</tspan></text></g><g transform="translate(0 967)"><g data-page-illustration="figures/class-7/science/ch05/candles.png"><image class="science-illustration" href="../../figures/class-7/science/ch05/candles.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Candles.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Candles.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
