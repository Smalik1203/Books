.08"><tspan x="260.32">Wax melts, travels up the wick</tspan><tspan x="260.32" dy="28">and vaporises. Wax that cools</tspan><tspan x="260.32" dy="28">can solidify again.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="140.08"><tspan x="618.6600000000001">Wax vapour reacts with oxygen,</tspan><tspan x="618.6600000000001" dy="28">forming carbon dioxide and</tspan><tspan x="618.6600000000001" dy="28">water. Released heat melts and</tspan><tspan x="618.6600000000001" dy="28">vaporises more wax.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="242" y2="242"/><rect class="v2-table-frame" x="89" y="54" width="874" height="188"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="54" y2="242"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="54" y2="242"/></g></g>
