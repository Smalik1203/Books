<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="recover-object-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Collecting flour does not reconstruct the original grains. In each case, explain</tspan><tspan x="89" dy="32">what “getting it back” means before choosing a category. An answer that states its</tspan><tspan x="89" dy="32">assumptions is more informative than a yes or no alone.</tspan></text></g>
<g class="v2-reading-block" data-block="reverse-table" transform="translate(0 224)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 5.2 Sample records: state your conditions</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Change</tspan></text><text class="v2-table-heading" x="347.72" y="76.08"><tspan x="347.72">Undo it?</tspan></text><text class="v2-table-heading" x="583.7" y="76.08"><tspan x="583.7">Conditions</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Melting ice</tspan></text><text class="se-copy se-table-copy" x="347.72" y="128.07999999999998"><tspan x="347.72">Yes, by cooling</tspan></text><text class="se-copy se-table-copy" x="583.7" y="128.07999999999998"><tspan x="583.7">Freeze it in a mould.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="146" y2="146"/><text class="se-copy se-table-copy" x="103" y="180.07999999999998"><tspan x="103">Chopping vegetables</tspan></text><text class="se-copy se-table-copy" x="347.72" y="180.07999999999998"><tspan x="347.72">Not to its old form</tspan></text><text class="se-copy se-table-copy" x="583.7" y="180.07999999999998"><tspan x="583.7">Pieces cannot rejoin as an intact</tspan><tspan x="583.7" dy="28">vegetable.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="226" y2="226"/><text class="se-copy se-table-copy" x="103" y="260.08"><tspan x="103">Boiling water</tspan></text><text class="se-copy se-table-copy" x="347.72" y="260.08"><tspan x="347.72">Collect vapour</tspan></text><text class="se-copy se-table-copy" x="583.7" y="260.08"><tspan x="583.7">Cool captured vapour to water.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="278" y2="278"/><text class="se-copy se-table-copy" x="103" y="312.08"><tspan x="103">Making popcorn</tspan></text><text class="se-copy se-table-copy" x="347.72" y="312.08"><tspan x="347.72">Not ordinarily</tspan></text><text class="se-copy se-table-copy" x="583.7" y="312.08"><tspan x="583.7">No intact kernel returns.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="330" y2="330"/><rect class="v2-table-frame" x="89" y="42" width="874" height="288"/><line class="v2-table-rule" x1="333.72" x2="333.72" y1="42" y2="330"/><line class="v2-table-rule" x1="569.7" x2="569.7" y1="42" y2="330"/><text class="v2-table-note" x="89" y="362.88"><tspan x="89">Read across for conditions. Compare down: what is recovered, and how?</tspan></text></g>
<g class="v2-reading-block" data-block="reverse-meaning" transform="translate(0 612)"><g data-comparison-table="reverse-meaning"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Reversible and irreversible changes</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Reversible change</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="540" y="70.08"><tspan x="540">Irreversible change</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">A <tspan class="se-bold">reversible</tspan> <tspan class="se-bold">change</tspan> can be undone</tspan><tspan x="103" dy="28">under suitable conditions.</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="110.08"><tspan x="540">An <tspan class="se-bold">irreversible</tspan> <tspan class="se-bold">change</tspan> cannot be</tspan><tspan x="540" dy="28">undone by ordinary methods.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><rect class="v2-table-frame" x="89" y="42" width="874" height="108"/><line class="v2-table-rule" x1="526" x2="526" y1="42" y2="150"/><text class="v2-table-note" x="89" y="182.88"><tspan x="89">Tearing paper and crushing chalk are physical changes that do not easily restore the objects.</tspan><tspan x="89" dy="26">Many chemical changes are difficult to reverse too. Reversibility and new-substance</tspan><tspan x="89" dy="26">formation are separate questions.</tspan></text></g></g>
<g class="v2-reading-block" data-block="desirable-head" transform="translate(0 880)"><text class="v2-title" x="89" y="38"><tspan x="89">5.6 Useful Here, Unwanted There</tspan></text></g>
<g class="v2-reading-block" data-block="desirable-comparison" transform="translate(0 938)"><g data-comparison-table="desirable-comparison"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Useful and unwanted changes</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="260.32" y="76.08"><tspan x="260.32">A useful change</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="618.6600000000001" y="76.08"><tspan x="618.6600000000001">An unwanted change</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Examples</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="128.07999999999998"><tspan x="260.32">Milk becoming curd when we</tspan><tspan x="260.32" dy="28">want curd. Fruit ripening before</tspan><tspan x="260.32" dy="28">it is eaten. Vegetable scraps</tspan><tspan x="260.32" dy="28">decomposing in a compost heap.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="128.07999999999998"><tspan x="618.6600000000001">Milk spoiling during storage.</tspan><tspan x="618.6600000000001" dy="28">Food decaying before it is eaten.</tspan><tspan x="618.6600000000001" dy="28">Iron rusting in a cycle or a</tspan><tspan x="618.6600000000001" dy="28">bridge.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="230" y2="230"/><rect class="v2-table-frame" x="89" y="42" width="874" height="188"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="42" y2="230"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="42" y2="230"/></g></g>
<g class="v2-reading-block" data-block="context-0" transform="translate(0 1184)"><text class="se-copy" x="89" y="24"><tspan x="89">Cutting fruit and cooking food can make them useful for a meal. Whether a</tspan><tspan x="89" dy="32">change is desirable depends on its purpose and circumstances. “Useful” does not</tspan><tspan x="89" dy="32">tell us whether a change is physical or chemical.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
