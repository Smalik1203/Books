<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="gas-explanation-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Vinegar and baking soda usually produce a fizzing sound and many bubbles. The</tspan><tspan x="89" dy="32">gas turns fresh lime water milky, supporting its identification as carbon dioxide.</tspan></text></g>
<g class="v2-reading-block" data-block="gas-explanation-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">Formation of this new substance is evidence of a chemical change. Lemon juice</tspan><tspan x="89" dy="32">also reacts with baking soda to release carbon dioxide.</tspan></text></g>
<g class="v2-reading-block" data-block="vinegar-equation" transform="translate(0 256)"><text class="v2-equation" x="89" y="30"><tspan x="89">Vinegar + Baking soda → Carbon dioxide + Other substances</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">Baking soda is sodium hydrogen carbonate. This simplified word equation focuses on the gas</tspan><tspan x="89" dy="27">being tested.</tspan></text></g>
<g class="v2-reading-block" data-block="dissolving-0" transform="translate(0 380)"><text class="se-copy" x="89" y="24"><tspan x="89">Baking soda stirred into water normally dissolves without the sustained fizzing</tspan><tspan x="89" dy="32">seen with vinegar. We treat this dissolving as a physical change at this level: the</tspan></text></g>
<g class="v2-reading-block" data-block="dissolving-1" transform="translate(0 444)"><text class="se-copy" x="89" y="24"><tspan x="89">substance spreads through the water. A few trapped-air bubbles during stirring</tspan><tspan x="89" dy="32">do not establish a chemical reaction.</tspan></text></g>
<g class="v2-reading-block" data-block="evidence-pause" transform="translate(0 524)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">One student says, “Any bubbles prove a chemical change.” Another says, “If a</tspan><tspan x="113" dy="32">liquid changes colour, it must be a chemical change.” Use blowing air</tspan><tspan x="113" dy="32">through water and adding beetroot extract to water to examine these claims.</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">What extra evidence did the lime-water test provide? Explain why you should</tspan><tspan x="113" dy="32">combine observations with knowledge of the materials instead of using one</tspan><tspan x="113" dy="32">visible sign as an infallible rule.</tspan></text></g>
<g class="v2-reading-block" data-block="process-head" transform="translate(0 852)"><text class="v2-title" x="89" y="38"><tspan x="89">5.3 Rusting and Combustion</tspan></text></g>
<g class="v2-reading-block" data-block="rust-head" transform="translate(0 922)"><text class="se-heading" x="89" y="30"><tspan x="89">Rusting: a slow reaction</tspan></text></g>
<g class="v2-reading-block" data-block="rust-0" transform="translate(0 970)"><text class="se-copy" x="89" y="24"><tspan x="89">Recall the iron nails studied in the previous chapter. In the presence of water and</tspan><tspan x="89" dy="32">oxygen, iron forms reddish-brown rust. Rust contains hydrated iron oxides and</tspan></text></g>
<g class="v2-reading-block" data-block="rust-1" transform="translate(0 1034)"><text class="se-copy" x="89" y="24"><tspan x="89">has different properties from iron. This is a chemical change, not simply a layer</tspan><tspan x="89" dy="32">of soil or a change in the nail’s shape.</tspan></text></g>
<g class="v2-reading-block" data-block="rust-time-0" transform="translate(0 1114)"><text class="se-copy" x="89" y="24"><tspan x="89">Compare a protected iron surface with an exposed one over several days. Rust</tspan><tspan x="89" dy="32">can weaken an object as more iron reacts. Painting or another suitable protective</tspan></text></g><g transform="translate(0 1178)"><g data-page-illustration="figures/class-7/science/ch05/physical-objects.png"><image class="science-illustration" href="../../figures/class-7/science/ch05/physical-objects.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Objects that can change shape.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Objects that can change shape.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
