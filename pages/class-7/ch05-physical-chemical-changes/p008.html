<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="oxygen-evidence-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">The uncovered candle can continue burning because fresh air reaches it. The</tspan><tspan x="89" dy="32">covered flame usually goes out after a short time. Oxygen in the enclosed air falls</tspan></text></g>
<g class="v2-reading-block" data-block="oxygen-evidence-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">to a level that no longer supports the flame; this does not mean that every bit of</tspan><tspan x="89" dy="32">oxygen has been used up.</tspan></text></g>
<g class="v2-reading-block" data-block="oxygen-product-0" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">A separate teacher-controlled test of the cooled collected gas with fresh lime</tspan><tspan x="89" dy="32">water can show carbon dioxide among the products. The milkiness tests for</tspan></text></g>
<g class="v2-reading-block" data-block="oxygen-product-1" transform="translate(0 320)"><text class="se-copy" x="89" y="24"><tspan x="89">carbon dioxide, not for oxygen. The covered-candle comparison supports the</tspan><tspan x="89" dy="32">importance of an air supply; knowledge from other experiments identifies</tspan><tspan x="89" dy="32">oxygen as the part needed for burning.</tspan></text></g>
<g class="v2-reading-block" data-block="fire-safety-head" transform="translate(0 444)"><text class="se-heading" x="89" y="30"><tspan x="89">Using this idea safely</tspan></text></g>
<g class="v2-reading-block" data-block="fire-safety-0" transform="translate(0 492)"><text class="se-copy" x="89" y="24"><tspan x="89">If your clothes catch fire, stop, drop to the ground and roll to smother the flames,</tspan><tspan x="89" dy="32">covering your face with your hands. Shout for help. An adult may use a suitable</tspan></text></g>
<g class="v2-reading-block" data-block="fire-safety-1" transform="translate(0 556)"><text class="se-copy" x="89" y="24"><tspan x="89">fire blanket; synthetic cloth can melt and must not be used. Never practise with</tspan><tspan x="89" dy="32">real flames. For a fire nearby, move to safety and alert an adult.</tspan></text></g>
<g class="v2-reading-block" data-block="firefly-note" transform="translate(0 636)"><text class="se-heading" x="89" y="30"><tspan x="89">Light from a living organism</tspan></text><text class="se-copy" x="89" y="72"><tspan x="89">Fireflies produce light through chemical</tspan><tspan x="89" dy="32">reactions in their bodies. This is called</tspan><tspan x="89" dy="32"><tspan class="se-bold">bioluminescence</tspan>. It produces very little heat</tspan><tspan x="89" dy="32">compared with an ordinary flame. A glowing</tspan><tspan x="89" dy="32">firefly is not burning like a candle. Watch living</tspan><tspan x="89" dy="32">insects without catching or disturbing them.</tspan></text><image class="science-illustration" data-photo="firefly" href="../../figures/class-7/science/ch05/firefly.png" x="655" y="15.333333333333329" width="308" height="205.33333333333334" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="655" y="258.88"><tspan x="655">A firefly: chemical energy can</tspan><tspan x="655" dy="27">produce light without a flame.</tspan></text></g>
<g class="v2-reading-block" data-block="ignition-head" transform="translate(0 962)"><text class="se-heading" x="89" y="30"><tspan x="89">Why does paper not burn in ordinary air?</tspan></text></g>
<g class="v2-reading-block" data-block="ignition-question-0" transform="translate(0 1010)"><text class="se-copy" x="89" y="24"><tspan x="89">Paper is a fuel and air contains oxygen, yet a book does not burst into flame on a</tspan><tspan x="89" dy="32">desk. Something more is needed. Compare heating by a lighted match with</tspan></text></g>
<g class="v2-reading-block" data-block="ignition-question-1" transform="translate(0 1074)"><text class="se-copy" x="89" y="24"><tspan x="89">heating by concentrated sunlight. In both cases, energy reaches the paper. Use</tspan><tspan x="89" dy="32">pieces from the same sheet: differences in thickness or dampness could affect</tspan></text></g>
<g class="v2-reading-block" data-block="ignition-question-2" transform="translate(0 1138)"><text class="se-copy" x="89" y="24"><tspan x="89">how quickly they heat. A failed attempt to ignite one piece does not prove that</tspan><tspan x="89" dy="32">paper is not combustible.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
