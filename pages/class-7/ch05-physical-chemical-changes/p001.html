75Q51 77 55 75"/></g></g><line class="chapter-opener__divider" x1="240" x2="240" y1="94" y2="252"/><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number se-running" x="151" y="242" text-anchor="middle">5</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">Changes Around Us:</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">Physical and Chemical</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch05/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Children comparing melting ice, ripening bananas and a flowering rose</title></image></g><text class="se-copy v2-intro" x="89" y="981" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.56399" data-extra-space="6.05922" data-space-ratio="2.089">An<tspan dx="6.05922"> ice</tspan><tspan dx="6.05922"> cube</tspan><tspan dx="6.05922"> becomes</tspan><tspan dx="6.05922"> a</tspan><tspan dx="6.05922"> puddle.</tspan><tspan dx="6.05922"> A</tspan><tspan dx="6.05922"> rosebud</tspan><tspan dx="6.05922"> opens.</tspan><tspan dx="6.05922"> A</tspan><tspan dx="6.05922"> banana</tspan><tspan dx="6.05922"> develops</tspan></tspan><tspan x="89" dy="34" data-paragraph-end="true">brown spots. Are all these changes alike?</tspan></text><text class="se-copy" x="89" y="1067" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.53212" data-space-ratio="1.274">Two<tspan dx="1.53212"> students</tspan><tspan dx="1.53212"> compare</tspan><tspan dx="1.53212"> what</tspan><tspan dx="1.53212"> they</tspan><tspan dx="1.53212"> notice</tspan><tspan dx="1.53212"> today</tspan><tspan dx="1.53212"> with</tspan><tspan dx="1.53212"> what</tspan><tspan dx="1.53212"> they</tspan><tspan dx="1.53212"> saw</tspan><tspan dx="1.53212"> earlier.</tspan><tspan dx="1.53212"> Even</tspan><tspan dx="1.53212"> a</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.96106" data-space-ratio="1.172">bottle<tspan dx="0.96106"> of</tspan><tspan dx="0.96106"> cold</tspan><tspan dx="0.96106"> water</tspan><tspan dx="0.96106"> grows</tspan><tspan dx="0.96106"> warmer</tspan><tspan dx="0.96106"> when</tspan><tspan dx="0.96106"> left</tspan><tspan dx="0.96106"> in</tspan><tspan dx="0.96106"> a</tspan><tspan dx="0.96106"> warm</tspan><tspan dx="0.96106"> room.</tspan><tspan dx="0.96106"> A</tspan><tspan dx="0.96106"> change</tspan><tspan dx="0.96106"> may</tspan><tspan dx="0.96106"> take</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">minutes, days or much longer.</tspan></text><text class="se-copy" x="89" y="1179" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.32609" data-space-ratio="1.952">In<tspan dx="5.32609"> this</tspan><tspan dx="5.32609"> chapter,</tspan><tspan dx="5.32609"> look</tspan><tspan dx="5.32609"> beyond</tspan><tspan dx="5.32609"> a</tspan><tspan dx="5.32609"> change</tspan><tspan dx="5.32609"> in</tspan><tspan dx="5.32609"> appearance.</tspan><tspan dx="5.32609"> Ask</tspan><tspan dx="5.32609"> what</tspan><tspan dx="5.32609"> has</tspan><tspan dx="5.32609"> changed,</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">whether a new substance has formed, and what evidence would help you decide.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></
