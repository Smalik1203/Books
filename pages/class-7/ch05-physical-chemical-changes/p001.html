<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05 page--opener" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 1"><g class="chapter-opener" data-opener="science-g7-ch05"><defs><linearGradient id="science-g7-ch05-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop class="chapter-opener__gradient-start" offset="0%"/><stop class="chapter-opener__gradient-end" offset="100%"/></linearGradient></defs><path class="chapter-opener__band" fill="url(#science-g7-ch05-gradient)" d="M-17 -17H1069V300H-17Z"/><path class="chapter-opener__edge" d="M-17 296H1069V300H-17Z"/><g class="chapter-opener__motif v2-change-motif" transform="translate(951 84) scale(1.05)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><line class="chapter-opener__divider" x1="240" x2="240" y1="94" y2="252"/><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number se-running" x="151" y="242" text-anchor="middle">5</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">Changes Around Us:</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">Physical and Chemical</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch05/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Children comparing melting ice, ripening bananas and a flowering rose</title></image></g><text class="se-copy v2-intro" x="89" y="981"><tspan x="89">An ice cube becomes a puddle. A rosebud opens. A banana develops</tspan><tspan x="89" dy="34">brown spots. Are all these changes alike?</tspan></text><text class="se-copy" x="89" y="1067"><tspan x="89">Two students compare what they notice today with what they saw earlier. Even a</tspan><tspan x="89" dy="32">bottle of cold water grows warmer when left in a warm room. A change may take</tspan><tspan x="89" dy="32">minutes, days or much longer.</tspan></text><text class="se-copy" x="89" y="1179"><tspan x="89">In this chapter, look beyond a change in appearance. Ask what has changed,</tspan><tspan x="89" dy="32">whether a new substance has formed, and what evidence would help you decide.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
