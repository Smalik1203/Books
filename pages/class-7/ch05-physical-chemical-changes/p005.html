<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="chemical-evidence-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">bubbles alone are not the evidence for a new solid. Compare the liquids after the</tspan><tspan x="89" dy="32">bubbles have stopped.</tspan></text></g>
<g class="v2-reading-block" data-block="chemical-definition-0" transform="translate(0 192)"><text class="se-copy" x="89" y="24"><tspan x="89">A <tspan class="se-bold">chemical</tspan> <tspan class="se-bold">change</tspan> forms one or more new substances through a <tspan class="se-bold">chemical</tspan></tspan><tspan x="89" dy="32"><tspan class="se-bold">reaction</tspan>. Carbon dioxide in exhaled air reacts with calcium hydroxide in lime</tspan></text></g>
<g class="v2-reading-block" data-block="chemical-definition-1" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">water. It forms calcium carbonate, a white solid that is insoluble in water, and</tspan><tspan x="89" dy="32">water. The suspended solid makes the mixture look milky.</tspan></text></g>
<g class="v2-reading-block" data-block="lime-equation" transform="translate(0 336)"><text class="v2-equation" x="89" y="30"><tspan x="89">Calcium hydroxide + Carbon dioxide → Calcium carbonate + Water</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">A word equation names the starting substances and the products. The arrow means “reacts to</tspan><tspan x="89" dy="27">form”.</tspan></text></g>
<g class="v2-reading-block" data-block="lime-limit-0" transform="translate(0 460)"><text class="se-copy" x="89" y="24"><tspan x="89">Turning fresh lime water milky is a useful test for carbon dioxide in these</tspan><tspan x="89" dy="32">experiments. Use a small amount of gas and observe promptly: passing excess</tspan></text></g>
<g class="v2-reading-block" data-block="lime-limit-1" transform="translate(0 524)"><text class="se-copy" x="89" y="24"><tspan x="89">carbon dioxide can eventually clear the cloudiness through a further reaction. A</tspan><tspan x="89" dy="32">test must be read under its stated conditions.</tspan></text></g>
<g class="v2-reading-block" data-block="kitchen-head" transform="translate(0 616)"><text class="se-heading" x="89" y="30"><tspan x="89">A Gas from Kitchen Materials</tspan></text></g>
<g class="v2-reading-block" data-block="vinegar-task" transform="translate(0 664)"><rect class="se-activity-panel" x="89" y="0" width="874" height="653" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Teacher-led; wear goggles. Never taste mixtures or block the gas outlet.</tspan></text><text class="se-activity-step" x="132" y="136" text-anchor="end">1.</text><text class="se-copy" x="146" y="136"><tspan x="146">Add a pinch of baking soda to a teaspoon of vinegar or lemon juice.</tspan><tspan x="146" dy="32">Record sounds and visible changes.</tspan></text><text class="se-activity-step" x="132" y="212" text-anchor="end">2.</text><text class="se-copy" x="146" y="212"><tspan x="146">The teacher passes the gas into fresh lime water. Record any change or</tspan><tspan x="146" dy="32">uncertainty.</tspan></text><text class="se-activity-step" x="132" y="288" text-anchor="end">3.</text><text class="se-copy" x="146" y="288"><tspan x="146">Compare with the same amount of baking soda stirred into water. The</tspan><tspan x="146" dy="32">teacher lifts the delivery tube from the lime water before disconnecting to</tspan><tspan x="146" dy="32">prevent backflow.</tspan></text><g transform="translate(0 372)"><g class="v2-change-diagram" data-diagram="gas-test"><path class="v2-change-line" d="M257 82V147Q257 165 277 165H347Q367 165 367 147V82"/><path class="v2-change-water" d="M259 118H365V147Q365 163 347 163H277Q259 163 259 147Z"/><rect class="v2-change-cap" x="253" y="70" width="118" height="18" rx="3"/><path class="v2-change-line" d="M617 82V147Q617 165 637 165H707Q727 165 727 147V82"/><path class="v2-change-water" d="M619 118H725V147Q725 163 707 163H637Q619 163 619 147Z"/><path class="v2-change-line" d="M312 102V49Q312 41 320 41H664Q672 41 672 49V145"/><text class="v2-change-label" x="490" y="25" text-anchor="middle">Delivery tube</text><text class="v2-change-label" x="814" y="90" text-anchor="middle">Open receiver</text><path class="v2-change-line" d="M749 99L715 81"/><text class="v2-change-label" x="312" y="201" text-anchor="middle">Vinegar + baking soda</text><text class="v2-change-label" x="672" y="201" text-anchor="middle">Fresh lime water</text></g></g><text class="se-caption" x="113" y="624.88"><tspan x="113">Supported test tubes or small bottles may be used; the receiver stays open.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">5</text></g></svg></div></div></section>
