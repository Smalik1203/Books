s</tspan><tspan dx="2.21465"> and</tspan><tspan dx="2.21465"> peelings</tspan><tspan dx="2.21465"> in</tspan><tspan dx="2.21465"> a</tspan></tspan><tspan x="132" dy="32" data-justify-width="831" data-natural-space="5.59200" data-extra-space="5.89738" data-space-ratio="2.055">clay<tspan dx="5.89738"> pot.</tspan><tspan dx="5.89738"> Bacteria</tspan><tspan dx="5.89738"> and</tspan><tspan dx="5.89738"> fungi</tspan><tspan dx="5.89738"> decompose</tspan><tspan dx="5.89738"> suitable</tspan><tspan dx="5.89738"> scraps</tspan><tspan dx="5.89738"> into</tspan><tspan dx="5.89738"> compost.</tspan><tspan dx="5.89738"> He</tspan></tspan><tspan x="132" dy="32" data-justify-width="831" data-natural-space="5.59200" data-extra-space="1.00585" data-space-ratio="1.180">plants<tspan dx="1.00585"> some</tspan><tspan dx="1.00585"> seeds,</tspan><tspan dx="1.00585"> waters</tspan><tspan dx="1.00585"> them</tspan><tspan dx="1.00585"> and</tspan><tspan dx="1.00585"> watches</tspan><tspan dx="1.00585"> seedlings</tspan><tspan dx="1.00585"> grow</tspan><tspan dx="1.00585"> and</tspan><tspan dx="1.00585"> later</tspan><tspan dx="1.00585"> flower.</tspan></tspan><tspan x="132" dy="32" data-justify-width="831" data-natural-space="5.59200" data-extra-space="8.41295" data-space-ratio="2.504">Identify<tspan dx="8.41295"> physical</tspan><tspan dx="8.41295"> changes,</tspan><tspan dx="8.41295"> chemical</tspan><tspan dx="8.41295"> changes,</tspan><tspan dx="8.41295"> and</tspan><tspan dx="8.41295"> stages</tspan><tspan dx="8.41295"> involving</tspan><tspan dx="8.41295"> both.</tspan></tspan><tspan x="132" dy="32" data-paragraph-end="true">Gathering objects in a pot does not itself prove that a reaction has occurred.</tspan></text></g>
