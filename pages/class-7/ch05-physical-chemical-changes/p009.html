<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="9"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 9"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="heat-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="858" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Teacher demonstration only, or use an approved video. Use tiny paper pieces</tspan><tspan x="113" dy="32">on a non-flammable tray in a cleared area, with water ready and observers</tspan><tspan x="113" dy="32">well back.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">1.</text><text class="se-copy" x="146" y="200"><tspan x="146">The teacher holds paper with tongs and brings a lighted match near it.</tspan><tspan x="146" dy="32">Record the change; let the remains cool.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">2.</text><text class="se-copy" x="146" y="276"><tspan x="146">If school rules and conditions permit, the teacher focuses sunlight onto</tspan><tspan x="146" dy="32">another piece. Never look through the lens or towards the Sun, or aim</tspan><tspan x="146" dy="32">light at eyes, skin or dry vegetation.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">3.</text><text class="se-copy" x="146" y="384"><tspan x="146">Record heating, darkening, smoke or flame, including no ignition. The</tspan><tspan x="146" dy="32">teacher extinguishes and checks all remains. Never try fire-making on</tspan><tspan x="146" dy="32">your own.</tspan></text><g transform="translate(0 468)"><g class="v2-change-diagram" data-diagram="focused-light"><svg class="science-illustration" data-photo="apparatus-focused-light" x="185" y="45" width="430" height="225" viewBox="26 114 1500 828" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch05/apparatus-focused-light.png" width="1536" height="1024"/></svg><text class="v2-change-label" x="254" y="25" text-anchor="middle">Sunlight</text><path class="v2-change-line" d="M335 32V97M380 32V97M425 32V97 M335 108L380 202M380 108V202M425 108L380 202"/><text class="v2-change-label" x="753" y="118" text-anchor="middle">Lens held by the teacher</text><path class="v2-change-line" d="M620 112H555"/><text class="v2-change-label" x="526" y="287" text-anchor="middle">Small paper piece on a heatproof tray</text><text class="v2-change-label" x="751" y="199" text-anchor="middle">Concentrated light</text><text class="v2-change-label" x="751" y="230" text-anchor="middle">heats a small spot.</text><path class="v2-change-line" d="M616 202H384"/></g></g><text class="se-caption" x="113" y="802.88"><tspan x="113">Parallel rays can be concentrated by a lens. This is a model of the teacher’s setup, not a</tspan><tspan x="113" dy="27">student fire-making task.</tspan></text></g>
<g class="v2-reading-block" data-block="ignition-0" transform="translate(0 992)"><text class="se-copy" x="89" y="24"><tspan x="89">Focused sunlight transfers energy to a small area, raising its temperature. Under</tspan><tspan x="89" dy="32">suitable conditions, paper can reach its <tspan class="se-bold">ignition</tspan> <tspan class="se-bold">temperature</tspan>, the minimum</tspan></text></g>
<g class="v2-reading-block" data-block="ignition-1" transform="translate(0 1056)"><text class="se-copy" x="89" y="24"><tspan x="89">temperature at which it catches fire under those conditions. A hot match can</tspan><tspan x="89" dy="32">provide the needed heating more quickly. A pre-existing flame is not the only</tspan><tspan x="89" dy="32">possible heat source.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
