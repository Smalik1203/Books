<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="physical-definition-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">breaking chalk are physical changes. A burst balloon and crushed chalk are</tspan><tspan x="89" dy="32">difficult to restore, but that does not make these changes chemical.</tspan></text></g>
<g class="v2-reading-block" data-block="water-states-0" transform="translate(0 192)"><text class="se-copy" x="89" y="24"><tspan x="89">Ice, liquid water and water vapour are the same substance in different states.</tspan><tspan x="89" dy="32">Water vapour is invisible. The visible white mist near a kettle contains tiny liquid</tspan></text></g>
<g class="v2-reading-block" data-block="water-states-1" transform="translate(0 256)"><text class="se-copy" x="89" y="24"><tspan x="89">droplets formed as vapour cools. Observe boiling water only from a safe distance</tspan><tspan x="89" dy="32">with an adult.</tspan></text></g>
<g class="v2-reading-block" data-block="chemical-head" transform="translate(0 348)"><text class="v2-title" x="89" y="38"><tspan x="89">5.2 Evidence of a New Substance</tspan></text></g>
<g class="v2-reading-block" data-block="chemical-intro-0" transform="translate(0 406)"><text class="se-copy" x="89" y="24"><tspan x="89">Bubbles can appear when air passes through a liquid, even if no new gas is made.</tspan><tspan x="89" dy="32">To investigate further, compare what happens in two different liquids. Describe</tspan><tspan x="89" dy="32">each observation before deciding what it means.</tspan></text></g>
<g class="v2-reading-block" data-block="exhaled-task" transform="translate(0 518)"><rect class="se-activity-panel" x="89" y="0" width="874" height="869" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Teacher-led comparison; wear goggles. Keep alkaline lime water away from</tspan><tspan x="113" dy="32">skin, eyes and mouths. Never suck liquid through a straw.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">1.</text><text class="se-copy" x="146" y="168"><tspan x="146">Put equal small volumes of tap water in A and fresh clear lime water in B.</tspan><tspan x="146" dy="32">Record their appearance; retain untouched samples for comparison.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">2.</text><text class="se-copy" x="146" y="244"><tspan x="146">The teacher collects exhaled air in a clean bag and delivers equal volumes</tspan><tspan x="146" dy="32">through separate tubes using a needle-free syringe. No mouth touches the</tspan><tspan x="146" dy="32">liquids or tubes.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">3.</text><text class="se-copy" x="146" y="352"><tspan x="146">Record bubbles, cloudiness and any deposit after standing. If little</tspan><tspan x="146" dy="32">changes, record that and ask the teacher to check the lime water and gas</tspan><tspan x="146" dy="32">delivery.</tspan></text><g transform="translate(0 436)"><g class="v2-change-diagram" data-diagram="exhaled"><svg class="science-illustration" data-photo="apparatus-exhaled" x="135" y="83" width="330" height="220" viewBox="35 74 1480 866" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch05/apparatus-exhaled.png" width="1536" height="1024"/></svg><text class="v2-change-label" x="345" y="326" text-anchor="middle">A · Tap water</text><text class="v2-change-label" x="330" y="42" text-anchor="middle">Collected exhaled air</text><text class="v2-change-label" x="330" y="72" text-anchor="middle">Needle-free syringe</text><svg class="science-illustration" data-photo="apparatus-exhaled" x="495" y="83" width="330" height="220" viewBox="35 74 1480 866" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch05/apparatus-exhaled.png" width="1536" height="1024"/></svg><text class="v2-change-label" x="705" y="326" text-anchor="middle">B · Fresh lime water</text><text class="v2-change-label" x="690" y="42" text-anchor="middle">Collected exhaled air</text><text class="v2-change-label" x="690" y="72" text-anchor="middle">Needle-free syringe</text></g></g><text class="se-caption" x="113" y="813.88"><tspan x="113">The teacher delivers collected exhaled air through separate tubes. The diagram shows</tspan><tspan x="113" dy="27">the setup before observation.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
