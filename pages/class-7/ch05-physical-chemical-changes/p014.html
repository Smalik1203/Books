<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="compost-pause-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">A family cools food to slow spoilage but encourages scraps to decompose into</tspan><tspan x="89" dy="32">compost. Are these aims contradictory? Explain how purpose and location</tspan><tspan x="89" dy="32">change what is desirable. Suggest an observation that would help judge each aim.</tspan></text></g>
<g class="v2-reading-block" data-block="environment-0" transform="translate(0 224)"><text class="se-copy" x="89" y="24"><tspan x="89">Burning fossil fuels for transport adds carbon dioxide to the atmosphere. Some</tspan><tspan x="89" dy="32">paints release volatile substances while drying, affecting air quality. Follow adult</tspan></text></g>
<g class="v2-reading-block" data-block="environment-1" transform="translate(0 288)"><text class="se-copy" x="89" y="24"><tspan x="89">guidance about ventilation and disposal, and avoid unnecessary fuel use or</tspan><tspan x="89" dy="32">waste.</tspan></text></g>
<g class="v2-reading-block" data-block="natural-head" transform="translate(0 380)"><text class="v2-title" x="89" y="38"><tspan x="89">5.7 Slow Changes in the Landscape</tspan></text></g>
<g class="v2-reading-block" data-block="weathering-head" transform="translate(0 450)"><text class="se-heading" x="89" y="30"><tspan x="89">Weathering: change in place</tspan></text></g>
<g class="v2-reading-block" data-block="weathering-0" transform="translate(0 498)"><text class="se-copy" x="89" y="24"><tspan x="89">Loose stones, sand and soil can collect below rocky slopes. <tspan class="se-bold">Weathering</tspan> means</tspan><tspan x="89" dy="32">physical breakdown or chemical alteration of rock at or near the surface. It</tspan><tspan x="89" dy="32">changes rock in place, before material is carried away.</tspan></text></g>
<g class="v2-reading-block" data-block="weathering-art" transform="translate(0 610)"><image class="science-illustration" data-photo="weathering" href="../../figures/class-7/science/ch05/weathering.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Roots can widen cracks. Iron-bearing rock can also develop a reddish weathered surface</tspan><tspan x="89" dy="27">through chemical reactions.</tspan></text></g>
<g class="v2-reading-block" data-block="weathering-comparison" transform="translate(0 972)"><g data-comparison-table="weathering-comparison"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Physical and chemical weathering</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="260.32" y="76.08"><tspan x="260.32">Physical weathering</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="618.6600000000001" y="76.08"><tspan x="618.6600000000001">Chemical weathering</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">How it</tspan><tspan x="103" dy="28">happens</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="128.07999999999998"><tspan x="260.32">Growing roots widen cracks.</tspan><tspan x="260.32" dy="28">Repeated temperature changes</tspan><tspan x="260.32" dy="28">can stress rock. Water freezing</tspan><tspan x="260.32" dy="28">in cracks can prise pieces apart.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="128.07999999999998"><tspan x="618.6600000000001">Water and dissolved substances</tspan><tspan x="618.6600000000001" dy="28">react with minerals. Mineral</tspan><tspan x="618.6600000000001" dy="28">composition changes as new</tspan><tspan x="618.6600000000001" dy="28">substances form. Iron-bearing</tspan><tspan x="618.6600000000001" dy="28">minerals may produce</tspan><tspan x="618.6600000000001" dy="28">red-brown iron oxides.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="286" y2="286"/><rect class="v2-table-frame" x="89" y="42" width="874" height="244"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="42" y2="286"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="42" y2="286"/></g></g>
<g class="v2-reading-block" data-block="basalt-0" transform="translate(0 1274)"><text class="se-copy" x="89" y="24"><tspan x="89">In dark basalt, iron-bearing minerals can react with oxygen and water, producing</tspan><tspan x="89" dy="32">reddish iron oxides. Physical and chemical weathering often work together to</tspan><tspan x="89" dy="32">help soil form.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
