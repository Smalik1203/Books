<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="reverse-meaning" transform="translate(0 112)"><g data-table-spacing="airy" data-comparison-table="reverse-meaning"><text class="v2-table-caption" x="89" y="33.6"><tspan x="89">Reversible and irreversible changes</tspan></text><rect class="se-table-head" x="89" y="54" width="874" height="48"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="86.08"><tspan x="103">Reversible change</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="540" y="86.08"><tspan x="540">Irreversible change</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="102" y2="102"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="134.07999999999998"><tspan x="103">A <tspan class="se-bold">reversible</tspan> <tspan class="se-bold">change</tspan> can be undone</tspan><tspan x="103" dy="28">under suitable conditions.</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="134.07999999999998"><tspan x="540">An <tspan class="se-bold">irreversible</tspan> <tspan class="se-bold">change</tspan> cannot be</tspan><tspan x="540" dy="28">undone by ordinary methods.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><rect class="v2-table-frame" x="89" y="54" width="874" height="124"/><line class="v2-table-rule" x1="526" x2="526" y1="54" y2="178"/><text class="v2-table-note" x="89" y="218.88"><tspan x="89">Tearing paper and crushing chalk are physical changes that do not easily restore the objects.</tspan><tspan x="89" dy="26">Many chemical changes are difficult to reverse too. Reversibility and new-substance</tspan><tspan x="89" dy="26">formation are separate questions.</tspan></text></g></g>
<g class="v2-reading-block" data-block="desirable-head" transform="translate(0 428)"><text class="v2-title" x="89" y="38"><tspan x="89">5.6 Useful Here, Unwanted There</tspan></text></g>

 x2="604.6600000000001" y1="54" y2="242"/></g></g>
<g class="v2-reading-block" data-block="context-0" transform="translate(0 756)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="5.52899" data-space-ratio="1.989">Cutting<tspan dx="5.52899"> fruit</tspan><tspan dx="5.52899"> and</tspan><tspan dx="5.52899"> cooking</tspan><tspan dx="5.52899"> food</tspan><tspan dx="5.52899"> can</tspan><tspan dx="5.52899"> make</tspan><tspan dx="5.52899"> them</tspan><tspan dx="5.52899"> useful</tspan><tspan dx="5.52899"> for</tspan><tspan dx="5.52899"> a</tspan><tspan dx="5.52899"> meal.</tspan><tspan dx="5.52899"> Whether</tspan><tspan dx="5.52899"> a</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.14811" data-space-ratio="1.205">change<tspan dx="1.14811"> is</tspan><tspan dx="1.14811"> desirable</tspan><tspan dx="1.14811"> depends</tspan><tspan dx="1.14811"> on</tspan><tspan dx="1.14811"> its</tspan><tspan dx="1.14811"> purpose</tspan><tspan dx="1.14811"> and</tspan><tspan dx="1.14811"> circumstances.</tspan><tspan dx="1.14811"> “Useful”</tspan><tspan dx="1.14811"> does</tspan><tspan dx="1.14811"> not</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">tell us whether a change is physical or chemical.</tspan></text></g>
<g class="v2-reading-block" data-block="compost-pause-0" transform="translate(0 868)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.19277" data-space-ratio="1.750">A<tspan dx="4.19277"> family</tspan><tspan dx="4.19277"> cools</tspan><tspan dx="4.19277"> food</tspan><tspan dx="4.19277"> to</tspan><tspan dx="4.19277"> slow</tspan><tspan dx="4.19277"> spoilage</tspan><tspan dx="4.19277"> but</tspan><tspan dx="4.19277"> encourages</tspan><tspan dx="4.19277"> scraps</tspan><tspan dx="4.19277"> to</tspan><tspan dx="4.19277"> decompose</tspan><tspan dx="4.19277"> into</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="8.99534" data-space-ratio="2.609">compost.<tspan dx="8.99534"> Are</tspan><tspan dx="8.99534"> these</tspan><tspan dx="8.99534"> aims</tspan><tspan dx="8.99534"> contradictory?</tspan><tspan dx="8.99534"> Explain</tspan><tspan dx="8.99534"> how</tspan><tspan dx="8.99534"> purpose</tspan><tspan dx="8.99534"> and</tspan><tspan dx="8.99534"> location</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">change what is desirable. Suggest an observation that would help judge each aim.</tspan></text></g><g transform="translate(0 980)"><g data-page-illustration="figures/class-6/science/ch11/soil.png"><image class="science-illustration" href="../../figures/class-6/science/ch11/soil.png" x="259.75" y="10" width="532.5" height="355" preserveAspectRatio="xMidYMid meet"><title>Decomposition returns materials to the soil.</title></image><text class="se-caption" x="526" y="403" text-anchor="middle"><tspan x="526">Decomposition returns materials to the soil.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d=
