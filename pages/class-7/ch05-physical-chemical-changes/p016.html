<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204"><tspan x="112">In a physical change, shape, size or state may change, but no new substance is</tspan><tspan x="112" dy="32">formed.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278"><tspan x="112">A chemical change forms new substances through a reaction. A word equation</tspan><tspan x="112" dy="32">names the starting substances and the products.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352"><tspan x="112">Bubbles, a colour change or a temperature change can be clues. Interpret them</tspan><tspan x="112" dy="32">using comparisons and suitable tests; no single clue is an infallible rule.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426"><tspan x="112">Fresh lime water turning milky provides evidence for carbon dioxide in the</tspan><tspan x="112" dy="32">experiments studied here.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500"><tspan x="112">Rusting, cooking and burning magnesium involve chemical changes.</tspan><tspan x="112" dy="32">Combustion releases heat, often with light.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574"><tspan x="112">A fuel, oxygen and enough heat to reach ignition temperature are needed for</tspan><tspan x="112" dy="32">burning to start and continue under suitable conditions.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648"><tspan x="112">A burning candle includes physical changes of wax and a chemical reaction of</tspan><tspan x="112" dy="32">wax vapour with oxygen.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722"><tspan x="112">Reversible and irreversible describe whether a change can be undone under</tspan><tspan x="112" dy="32">stated conditions. They are not synonyms for physical and chemical.</tspan></text><text class="se-copy" x="89" y="796" text-anchor="start">•</text><text class="se-copy" x="112" y="796"><tspan x="112">A desirable change is useful in a particular situation. The same process can be</tspan><tspan x="112" dy="32">unwanted elsewhere.</tspan></text><text class="se-copy" x="89" y="870" text-anchor="start">•</text><text class="se-copy" x="112" y="870"><tspan x="112">Weathering includes physical and chemical changes. Erosion transports</tspan><tspan x="112" dy="32">material, and deposition occurs when it settles.</tspan></text><text class="se-copy" x="89" y="944" text-anchor="start">•</text><text class="se-copy" x="112" y="944"><tspan x="112">Observe safely, record actual results and explain uncertainty. Heating,</tspan><tspan x="112" dy="32">lime-water tests and gas-transfer equipment belong under teacher control.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
