<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="17"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 17"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="assessment-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Let Us Enhance Our Learning</tspan></text></g>
<g class="v2-reading-block" data-block="assessment-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Use your notebook. Support each answer with evidence and explain any</tspan><tspan x="89" dy="32">uncertainty.</tspan></text></g>
<g class="v2-reading-block" data-block="q1" transform="translate(0 250)"><text class="se-copy" x="111" y="24" text-anchor="end">1.</text><text class="se-copy" x="132" y="24"><tspan x="132">Which pair describes a physical change? (i) The state may or may not change.</tspan><tspan x="132" dy="32">(ii) A substance with different properties is formed. (iii) No new substance is</tspan><tspan x="132" dy="32">formed. (iv) A chemical reaction occurs. Choose: (a) i and ii; (b) ii and iii; (c) i</tspan><tspan x="132" dy="32">and iii; (d) iii and iv. Explain your choice.</tspan></text></g>
<g class="v2-reading-block" data-block="q2" transform="translate(0 408)"><text class="se-copy" x="111" y="24" text-anchor="end">2.</text><text class="se-copy" x="132" y="24"><tspan x="132">Predict whether each change can be reversed by ordinary methods. State</tspan><tspan x="132" dy="32">your conditions and any uncertainty: (i) stitching cloth into a shirt; (ii)</tspan><tspan x="132" dy="32">twisting a straight string; (iii) making idlis from batter; (iv) dissolving sugar</tspan><tspan x="132" dy="32">in water; (v) drawing water from a well; (vi) ripening fruit; (vii) boiling water</tspan><tspan x="132" dy="32">in an open pan; (viii) rolling up a mat; (ix) grinding wheat into flour; (x)</tspan><tspan x="132" dy="32">forming soil from rocks.</tspan></text></g>
<g class="v2-reading-block" data-block="q3" transform="translate(0 630)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24"><tspan x="132">State True or False and correct each false statement: (i) Melting wax helps</tspan><tspan x="132" dy="32">supply fuel to a burning candle. (ii) Collecting water vapour by condensation</tspan><tspan x="132" dy="32">is a chemical change. (iii) Converting leaves into compost involves chemical</tspan><tspan x="132" dy="32">changes. (iv) Mixing baking soda with lemon juice produces a chemical</tspan><tspan x="132" dy="32">change.</tspan></text></g>
<g class="v2-reading-block" data-block="q4" transform="translate(0 820)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24"><tspan x="132">Complete these statements in your notebook. (i) Nalini’s iron cycle handle</tspan><tspan x="132" dy="32">develops brown deposits called [name]; this is a [type] change. (ii) Folding a</tspan><tspan x="132" dy="32">handkerchief is a [type] change that can be [undone or not undone]. (iii) A</tspan><tspan x="132" dy="32">reaction with oxygen that releases heat is called [name] and is a [type]</tspan><tspan x="132" dy="32">change. (iv) Burning magnesium forms [substance]; with water this gives a</tspan><tspan x="132" dy="32">[acidic/basic/neutral] mixture. Burning magnesium is a [type] change.</tspan></text></g>
<g class="v2-reading-block" data-block="q5" transform="translate(0 1042)"><text class="se-copy" x="111" y="24" text-anchor="end">5.</text><text class="se-copy" x="132" y="24"><tspan x="132">Are water freezing into ice and liquid water becoming water vapour physical</tspan><tspan x="132" dy="32">or chemical changes? Explain using the identity of the substance. Why</tspan><tspan x="132" dy="32">should visible mist not be confused with invisible water vapour?</tspan></text></g>
<g class="v2-reading-block" data-block="q6" transform="translate(0 1168)"><text class="se-copy" x="111" y="24" text-anchor="end">6.</text><text class="se-copy" x="132" y="24"><tspan x="132">Is milk turning into curd a physical or chemical change? Justify your answer.</tspan><tspan x="132" dy="32">Explain why saying only “it looks different” is not enough.</tspan></text></g>
<g class="v2-reading-block" data-block="q7" transform="translate(0 1262)"><text class="se-copy" x="111" y="24" text-anchor="end">7.</text><text class="se-copy" x="132" y="24"><tspan x="132">Wind, rain, temperature changes and other natural factors help form soil</tspan><tspan x="132" dy="32">from rock. Explain how both physical and chemical changes can be involved.</tspan><tspan x="132" dy="32">Distinguish weathering from the transport of the resulting particles.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">17</text></g></svg></div></div></section>
