<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="physical-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">5.1 Appearance Changes, Substance Remains</tspan></text></g>
<g class="v2-reading-block" data-block="physical-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">A sheet can become a paper boat without ceasing to be paper. Try changes in</tspan><tspan x="89" dy="32">shape and size, then ask which features remain the same. A different outline is</tspan><tspan x="89" dy="32">not enough to establish that a new substance has formed.</tspan></text></g>
<g class="v2-reading-block" data-block="physical-task" transform="translate(0 282)"><rect class="se-activity-panel" x="89" y="0" width="874" height="554" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Use paper, a balloon, a hand pump and a small piece of chalk. Keep balloon</tspan><tspan x="113" dy="32">fragments away from young children; avoid latex if anyone is allergic. Do not</tspan><tspan x="113" dy="32">breathe chalk dust.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">1.</text><text class="se-copy" x="146" y="200"><tspan x="146">Fold paper into a boat or another object, then unfold it. Describe the</tspan><tspan x="146" dy="32">shape and any creases that remain.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">2.</text><text class="se-copy" x="146" y="276"><tspan x="146">Inflate a balloon with the pump without tying it, then let the air escape.</tspan><tspan x="146" dy="32">Compare the rubber before and after. The teacher may puncture a second</tspan><tspan x="146" dy="32">inflated balloon with a pin away from faces; stand back and protect ears.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">3.</text><text class="se-copy" x="146" y="384"><tspan x="146">The teacher gently crushes chalk inside a sealed bag. Examine the</tspan><tspan x="146" dy="32">fragments through the bag. Can you restore the original chalk stick</tspan><tspan x="146" dy="32">simply by collecting its pieces?</tspan></text><text class="se-activity-step" x="132" y="492" text-anchor="end">4.</text><text class="se-copy" x="146" y="492"><tspan x="146">Record separately what changed and what material remains. Compare</tspan><tspan x="146" dy="32">changes you could undo with those you could not.</tspan></text></g>
<g class="v2-reading-block" data-block="physical-art" transform="translate(0 858)"><image class="science-illustration" data-photo="physical-objects" href="../../figures/class-7/science/ch05/physical-objects.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Paper, rubber and chalk can change shape or size. Examine the material as well as its outline.</tspan></text></g>
<g class="v2-reading-block" data-block="physical-definition-0" transform="translate(0 1193)"><text class="se-copy" x="89" y="24"><tspan x="89">In a <tspan class="se-bold">physical</tspan> <tspan class="se-bold">change</tspan>, physical properties such as shape, size or state change</tspan><tspan x="89" dy="32">without a new substance being formed. Folding paper, stretching a balloon and</tspan></text></g>
<g class="v2-reading-block" data-block="physical-definition-1" transform="translate(0 1257)"><text class="se-copy" x="89" y="24"><tspan x="89">breaking chalk are physical changes. A burst balloon and crushed chalk are</tspan><tspan x="89" dy="32">difficult to restore, but that does not make these changes chemical.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
