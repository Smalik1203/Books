<g class="v2-reading-block" data-block="weathering-head" transform="translate(0 338)"><text class="se-heading" x="89" y="30"><tspan x="89">Weathering: change in place</tspan></text></g>
<g class="v2-reading-block" data-block="weathering-0" transform="translate(0 386)"><text class="se-copy" x="89" y="24" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.47360" data-space-ratio="1.621">Loose<tspan dx="3.47360"> stones,</tspan><tspan dx="3.47360"> sand</tspan><tspan dx="3.47360"> and</tspan><tspan dx="3.47360"> soil</tspan><tspan dx="3.47360"> can</tspan><tspan dx="3.47360"> collect</tspan><tspan dx="3.47360"> below</tspan><tspan dx="3.47360"> rocky</tspan><tspan dx="3.47360"> slopes.</tspan><tspan dx="3.47360"> <tspan class="se-bold">Weathering</tspan></tspan><tspan dx="3.47360"> means</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="6.14437" data-space-ratio="2.099">physical<tspan dx="6.14437"> breakdown</tspan><tspan dx="6.14437"> or</tspan><tspan dx="6.14437"> chemical</tspan><tspan dx="6.14437"> alteration</tspan><tspan dx="6.14437"> of</tspan><tspan dx="6.14437"> rock</tspan><tspan dx="6.14437"> at</tspan><tspan dx="6.14437"> or</tspan><tspan dx="6.14437"> near</tspan><tspan dx="6.14437"> the</tspan><tspan dx="6.14437"> surface.</tspan><tspan dx="6.14437"> It</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">changes rock in place, before material is carried away.</tspan></text></g>

<g class="v2-reading-block" data-block="weathering-comparison" transform="translate(0 860)"><g data-comparison-table="weathering-comparison" data-table-spacing="airy"><text class="v2-table-caption" x="89" y="33.6"><tspan x="89">Physical and chemical weathering</tspan></text><rect class="se-table-head" x="89" y="54" width="874" height="52"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="88.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="260.32" y="88.08"><tspan x="260.32">Physical weathering</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="618.6600000000001" y="88.08"><tspan x="618.6600000000001">Chemical weathering</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="106" y2="106"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="140.08"><tspan x="103">How it</tspan><tspan x="103" dy="28">happens</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="140.08"><tspan x="260.32">Growing roots widen cracks.</tspan><tspan x="260.32" dy="28">Repeated temperature changes</tspan><tspan x="260.32" dy="28">can stress rock. Water freezing</tspan><tspan x="260.32" dy="28">in cracks can prise pieces apart.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="140.08"><tspan x="618.6600000000001">Water and dissolved substances</tspan><tspan x="618.6600000000001" dy="28">react with minerals. Mineral</tspan><tspan x="618.6600000000001" dy="28">composition changes as new</tspan><tspan x="618.6600000000001" dy="28">substances form. Iron-bearing</tspan><tspan x="618.6600000000001" dy="28">minerals may produce</tspan><tspan x="618.6600000000001" dy="28">red-brown iron oxides.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="298" y2="298"/><rect class="v2-table-frame
