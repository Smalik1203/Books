<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="646" rx="18"/><text class="se-copy" x="113" y="222"><tspan x="113"><tspan class="se-bold">Physical</tspan> <tspan class="se-bold">change</tspan> — A change of a</tspan><tspan x="113" dy="32">physical property without forming a</tspan><tspan x="113" dy="32">new substance.</tspan></text><text class="se-copy" x="113" y="338"><tspan x="113"><tspan class="se-bold">Chemical</tspan> <tspan class="se-bold">change</tspan> — A change in</tspan><tspan x="113" dy="32">which one or more new substances</tspan><tspan x="113" dy="32">form.</tspan></text><text class="se-copy" x="113" y="454"><tspan x="113"><tspan class="se-bold">Chemical</tspan> <tspan class="se-bold">reaction</tspan> — The process</tspan><tspan x="113" dy="32">that changes starting substances</tspan><tspan x="113" dy="32">into products.</tspan></text><text class="se-copy" x="113" y="570"><tspan x="113"><tspan class="se-bold">Combustion</tspan> — Reaction with</tspan><tspan x="113" dy="32">oxygen that releases heat, often with</tspan><tspan x="113" dy="32">light.</tspan></text><text class="se-copy" x="113" y="686"><tspan x="113"><tspan class="se-bold">Ignition</tspan> <tspan class="se-bold">temperature</tspan> — The</tspan><tspan x="113" dy="32">minimum temperature for a</tspan><tspan x="113" dy="32">substance to catch fire under given</tspan><tspan x="113" dy="32">conditions.</tspan></text><text class="se-copy" x="541" y="222"><tspan x="541"><tspan class="se-bold">Reversible</tspan> <tspan class="se-bold">change</tspan> — A change that</tspan><tspan x="541" dy="32">can be undone under suitable</tspan><tspan x="541" dy="32">conditions.</tspan></text><text class="se-copy" x="541" y="338"><tspan x="541"><tspan class="se-bold">Irreversible</tspan> <tspan class="se-bold">change</tspan> — A change not</tspan><tspan x="541" dy="32">undone by the ordinary methods</tspan><tspan x="541" dy="32">being considered.</tspan></text><text class="se-copy" x="541" y="454"><tspan x="541"><tspan class="se-bold">Weathering</tspan> — Physical breakdown</tspan><tspan x="541" dy="32">or chemical alteration of rock in</tspan><tspan x="541" dy="32">place.</tspan></text><text class="se-copy" x="541" y="570"><tspan x="541"><tspan class="se-bold">Erosion</tspan> — Removal and transport of</tspan><tspan x="541" dy="32">rock, soil or other particles.</tspan></text><text class="se-copy" x="541" y="654"><tspan x="541"><tspan class="se-bold">Deposition</tspan> — Settling of material</tspan><tspan x="541" dy="32">carried by water, wind or another</tspan><tspan x="541" dy="32">transporting agent.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">15</text></g></svg></div></div></section>
