<section class="page page--food page--science-editorial page--science-v2 page--g7-ch05" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="Changes Around Us: Physical and Chemical, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-change-motif" transform="translate(26 9) scale(.40)"><path d="M17 0H45M22 0V34L2 78Q-5 92 12 92H55Q71 92 64 78L40 34V0 M13 63H52 M24 72H25 M39 82H40"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 5</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">Changes Around Us</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="erosion-head" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Erosion: material moves</tspan></text></g>
<g class="v2-reading-block" data-block="erosion-0" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Erosion</tspan> removes and transports weathered material. Flowing water, wind, ice</tspan><tspan x="89" dy="32">and gravity can move particles. During transport, pieces may collide and become</tspan></text></g>
<g class="v2-reading-block" data-block="erosion-1" transform="translate(0 224)"><text class="se-copy" x="89" y="24"><tspan x="89">smaller or smoother. A landslide moves rock and soil downslope under gravity;</tspan><tspan x="89" dy="32">do not approach an unstable slope to observe it.</tspan></text></g>
<g class="v2-reading-block" data-block="landscape-diagram" transform="translate(0 304)"><g class="v2-change-diagram" data-diagram="landscape"><rect class="v2-change-box" x="89" y="0" width="255" height="86" rx="9"/><text class="v2-change-label" x="216.5" y="32" text-anchor="middle">Weathering</text><text class="v2-change-label" x="216.5" y="62" text-anchor="middle">Rock changes in place.</text><path class="v2-change-line" d="M350 43L391 43"/><path class="v2-change-line" d="M383 37L391 43L383 49"/><rect class="v2-change-box" x="398" y="0" width="255" height="86" rx="9"/><text class="v2-change-label" x="525.5" y="32" text-anchor="middle">Erosion</text><text class="v2-change-label" x="525.5" y="62" text-anchor="middle">Particles are carried.</text><path class="v2-change-line" d="M659 43L700 43"/><path class="v2-change-line" d="M692 37L700 43L692 49"/><rect class="v2-change-box" x="707" y="0" width="255" height="86" rx="9"/><text class="v2-change-label" x="834.5" y="32" text-anchor="middle">Deposition</text><text class="v2-change-label" x="834.5" y="62" text-anchor="middle">Particles settle.</text><text class="v2-change-label" x="216" y="128" text-anchor="middle">Roots, water, air</text><text class="v2-change-label" x="525" y="128" text-anchor="middle">Wind, water, gravity</text><text class="v2-change-label" x="834" y="128" text-anchor="middle">Transport slows</text></g><text class="se-caption" x="89" y="177.88"><tspan x="89">Weathering, transport and deposition are connected processes. This diagram is a model, not</tspan><tspan x="89" dy="27">a map to scale.</tspan></text></g>
<g class="v2-reading-block" data-block="deposition-0" transform="translate(0 537)"><text class="se-copy" x="89" y="24"><tspan x="89">When water or wind loses enough energy, carried material settles: <tspan class="se-bold">deposition</tspan>.</tspan><tspan x="89" dy="32">Coarser particles often settle first. Over long periods, buried sediments may be</tspan><tspan x="89" dy="32">compacted and cemented into sedimentary rock; this is not instantaneous.</tspan></text></g>
<g class="v2-reading-block" data-block="landscape-time-0" transform="translate(0 649)"><text class="se-copy" x="89" y="24"><tspan x="89">Many landscape changes take thousands of years or longer, although a landslide</tspan><tspan x="89" dy="32">can move material rapidly. The sequence above connects changes at a cliff, along</tspan><tspan x="89" dy="32">a river and on a lake bed.</tspan></text></g>
<g class="v2-reading-block" data-block="landscape-evidence-0" transform="translate(0 761)"><text class="se-copy" x="89" y="24"><tspan x="89">A rounded pebble is evidence of wear, but its shape alone does not reveal the</tspan><tspan x="89" dy="32">whole journey. Compare its surface with a freshly broken fragment of the same</tspan></text></g>
<g class="v2-reading-block" data-block="landscape-evidence-1" transform="translate(0 825)"><text class="se-copy" x="89" y="24"><tspan x="89">rock. To investigate a reddish coating, ask what minerals are present and</tspan><tspan x="89" dy="32">whether they have reacted; colour alone is insufficient. Photographs taken from</tspan></text></g>
<g class="v2-reading-block" data-block="landscape-evidence-2" transform="translate(0 889)"><text class="se-copy" x="89" y="24"><tspan x="89">the same safe viewpoint over time can reveal movement of material without</tspan><tspan x="89" dy="32">disturbing a slope.</tspan></text></g>
<g class="v2-reading-block" data-block="closing-0" transform="translate(0 969)"><text class="se-copy" x="89" y="24"><tspan x="89">Return to the opening scene. Melting ice and warming water remain water. A</tspan><tspan x="89" dy="32">growing rose and a ripening banana involve many processes, including chemical</tspan><tspan x="89" dy="32">reactions. Identify the process and support your classification with evidence.</tspan></text></g><g transform="translate(0 1081)"><g data-page-illustration="figures/class-7/science/ch05/weathering.png"><image class="science-illustration" href="../../figures/class-7/science/ch05/weathering.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Weathered rock.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Weathered rock.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">15</text></g></svg></div></div></section>
