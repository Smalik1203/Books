<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="24"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 24"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Keywords</text><rect class="se-glossary-panel" x="89" y="174" width="874" height="518" rx="18"/><text class="se-copy" x="113" y="222" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Metallic</tspan> <tspan class="se-bold">lustre</tspan> — The characteristic</tspan><tspan x="113" dy="32" data-paragraph-end="true">shine of a clean metal surface.</tspan></text><text class="se-copy" x="113" y="306" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Malleability</tspan> — Ability to form</tspan><tspan x="113" dy="32" data-paragraph-end="true">sheets without breaking.</tspan></text><text class="se-copy" x="113" y="390" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Ductility</tspan> — Ability to be drawn into</tspan><tspan x="113" dy="32" data-paragraph-end="true">wire.</tspan></text><text class="se-copy" x="113" y="474" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Brittleness</tspan> — Tendency to fracture</tspan><tspan x="113" dy="32" data-paragraph-end="true">instead of deforming substantially.</tspan></text><text class="se-copy" x="113" y="558" data-prose-align="justify"><tspan x="113" data-narrow-prose="true"><tspan class="se-bold">Sonority</tspan> — Ability to produce a</tspan><tspan x="113" dy="32" data-paragraph-end="true">ringing sound when struck.</tspan></text><text class="se-copy" x="541" y="222" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Conduction</tspan> — Transfer of energy</tspan><tspan x="541" dy="32" data-narrow-prose="true">through a material from hotter to</tspan><tspan x="541" dy="32" data-paragraph-end="true">cooler regions.</tspan></text><text class="se-copy" x="541" y="338" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Rusting</tspan> — Reaction of iron involving</tspan><tspan x="541" dy="32" data-paragraph-end="true">water and oxygen that forms rust.</tspan></text><text class="se-copy" x="541" y="422" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Corrosion</tspan> — Deterioration through</tspan><tspan x="541" dy="32" data-paragraph-end="true">reaction with the surroundings.</tspan></text><text class="se-copy" x="541" y="506" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Element</tspan> — Substance not broken</tspan><tspan x="541" dy="32" data-narrow-prose="true">into simpler substances by chemical</tspan><tspan x="541" dy="32" data-paragraph-end="true">means.</tspan></text><text class="se-copy" x="541" y="622" data-prose-align="justify"><tspan x="541" data-narrow-prose="true"><tspan class="se-bold">Alloy</tspan> — A material containing a</tspan><tspan x="541" dy="32" data-paragraph-end="true">metal mixed with other elements.</tspan></text><g transform="translate(0 692)"><g data-page-illustration="figures/class-7/science/ch01-v2/cutouts/ceramic-spoons.png"><image class="science-illustration" href="../../figures/class-7/science/ch01-v2/cutouts/ceramic-spoons.png" x="158.29767441860463" y="10" width="735.4046511627907" height="540" preserveAspectRatio="xMidYMid meet"><title>Ceramic is a non-metallic material.</title></image><text class="se-caption" x="526" y="588" text-anchor="middle"><tspan x="526">Ceramic is a non-metallic material.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">24</text></g></svg></div></div></section>
