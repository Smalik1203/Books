<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="2"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 2"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="craft-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">From a workshop to a question</tspan></text></g>
<g class="v2-reading-block" data-block="craft-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Sudarshan heats an iron workpiece in a coal-fired furnace, holds it with tongs</tspan><tspan x="89" dy="32">and shapes it with a hammer. Heating makes the iron easier to deform. The</tspan></text></g>
<g class="v2-reading-block" data-block="craft-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">children watch from a safe distance; forging is skilled work with hot metal, sharp</tspan><tspan x="89" dy="32">tools and flying particles. Do not try it at home.</tspan></text></g>
<g class="v2-reading-block" data-block="choices-0" transform="translate(0 314)"><text class="se-copy" x="89" y="24"><tspan x="89">The same workshop contains metal, wood and coal, but their jobs differ. Iron</tspan><tspan x="89" dy="32">forms strong working parts such as spades, axes, trowels and rakes. Wood can</tspan></text></g>
<g class="v2-reading-block" data-block="choices-1" transform="translate(0 378)"><text class="se-copy" x="89" y="24"><tspan x="89">form handles. Coal supplies energy when burned. Anandi asks whether every</tspan><tspan x="89" dy="32">material can be beaten into a flat shape. That is a question we can investigate</tspan><tspan x="89" dy="32">with suitable small samples.</tspan></text></g>
<g class="v2-reading-block" data-block="properties-head" transform="translate(0 502)"><text class="v2-title" x="89" y="38"><tspan x="89">4.1 Comparing Material Properties</tspan></text></g>
<g class="v2-reading-block" data-block="appearance-intro-0" transform="translate(0 560)"><text class="se-copy" x="89" y="24"><tspan x="89">Recall the properties you used to describe materials in Class 6. First record what</tspan><tspan x="89" dy="32">a sample looks like and how it behaves; name a property after considering the</tspan></text></g>
<g class="v2-reading-block" data-block="appearance-intro-1" transform="translate(0 624)"><text class="se-copy" x="89" y="24"><tspan x="89">evidence. Use teacher-identified samples rather than guessing their identity from</tspan><tspan x="89" dy="32">colour. A coating of paint or dirt can hide the surface underneath.</tspan></text></g>
<g class="v2-reading-block" data-block="same-sample-0" transform="translate(0 704)"><text class="se-copy" x="89" y="24"><tspan x="89">Before you begin, compare the pieces as well as their material names. A thin foil</tspan><tspan x="89" dy="32">sheet and a thick nail will not change shape equally under one light tap. Record</tspan></text></g>
<g class="v2-reading-block" data-block="same-sample-1" transform="translate(0 768)"><text class="se-copy" x="89" y="24"><tspan x="89">their starting shapes so that size and shape do not become hidden parts of your</tspan><tspan x="89" dy="32">explanation.</tspan></text></g>
<g class="v2-reading-block" data-block="hammer-task-equipment" transform="translate(0 848)"><image class="science-illustration" data-photo="samples" href="../../figures/class-7/science/ch04/samples.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Copper, aluminium, an iron nail, sulfur, coal and wood: compare intact samples before</tspan><tspan x="89" dy="27">testing.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">2</text></g></svg></div></div></section>
