<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="21"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 21"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="assessment-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Let Us Enhance Our Learning</tspan></text></g>
<g class="v2-reading-block" data-block="assessment-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">Use your notebook. Support each answer with evidence and explain any</tspan><tspan x="89" dy="32">uncertainty.</tspan></text></g>
<g class="v2-reading-block" data-block="q1" transform="translate(0 250)"><text class="se-copy" x="111" y="24" text-anchor="end">1.</text><text class="se-copy" x="132" y="24"><tspan x="132">Which metal is commonly used for inexpensive food-packaging foil that can</tspan><tspan x="132" dy="32">fold readily? Choose aluminium, copper, iron or gold, and name the relevant</tspan><tspan x="132" dy="32">property.</tspan></text></g>
<g class="v2-reading-block" data-block="q2" transform="translate(0 376)"><text class="se-copy" x="111" y="24" text-anchor="end">2.</text><text class="se-copy" x="132" y="24"><tspan x="132">Which metal can react so vigorously with water that a fire may result: copper,</tspan><tspan x="132" dy="32">aluminium, zinc or sodium? Explain why this is a knowledge question, not a</tspan><tspan x="132" dy="32">test to try.</tspan></text></g>
<g class="v2-reading-block" data-block="q3" transform="translate(0 502)"><text class="se-copy" x="111" y="24" text-anchor="end">3.</text><text class="se-copy" x="132" y="24"><tspan x="132">State whether each claim is true or false and explain. (a) Aluminium and</tspan><tspan x="132" dy="32">copper are non-metals used in utensils and statues. (b) All metal oxides give</tspan><tspan x="132" dy="32">solutions that turn blue litmus red. (c) Oxygen is a non-metal essential for</tspan><tspan x="132" dy="32">human respiration. (d) Copper is used to boil water because it conducts</tspan><tspan x="132" dy="32">electricity well.</tspan></text></g>
<g class="v2-reading-block" data-block="q4" transform="translate(0 692)"><text class="se-copy" x="111" y="24" text-anchor="end">4.</text><text class="se-copy" x="132" y="24"><tspan x="132">Why are only some metals and alloys suitable for jewellery? Consider</tspan><tspan x="132" dy="32">appearance, ease of shaping, corrosion, wear and contact with skin. Explain</tspan><tspan x="132" dy="32">why lustre alone is not enough.</tspan></text></g>
<g class="v2-reading-block" data-block="q5" transform="translate(0 818)"><text class="se-copy" x="111" y="24" text-anchor="end">5.</text><text class="se-copy" x="132" y="24"><tspan x="132">Unscramble the element names from these letter groups: PEPORC; OGDL;</tspan><tspan x="132" dy="32">ENXYGO; TENGOINR; NECOHIRL. Then match them to: electrical wiring;</tspan><tspan x="132" dy="32">exceptional malleability and ductility; human respiration; a plant nutrient</tspan><tspan x="132" dy="32">supplied in fertilisers; water purification.</tspan></text></g>
<g class="v2-reading-block" data-block="q6" transform="translate(0 976)"><text class="se-copy" x="111" y="24" text-anchor="end">6.</text><text class="se-copy" x="132" y="24"><tspan x="132">What products form when magnesium and sulfur react with oxygen?</tspan><tspan x="132" dy="32">Compare their physical states and the litmus evidence after each product is</tspan><tspan x="132" dy="32">mixed with water.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">21</text></g></svg></div></div></section>
