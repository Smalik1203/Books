x="113" dy="32">ringing sound when struck.</tspan></text><text class="se-copy" x="541" y="222"><tspan x="541"><tspan class="se-bold">Conduction</tspan> — Transfer of energy</tspan><tspan x="541" dy="32">through a material from hotter to</tspan><tspan x="541" dy="32">cooler regions.</tspan></text><text class="se-copy" x="541" y="338"><tspan x="541"><tspan class="se-bold">Rusting</tspan> — Reaction of iron involving</tspan><tspan x="541" dy="32">water and oxygen that forms rust.</tspan></text><text class="se-copy" x="541" y="422"><tspan x="541"><tspan class="se-bold">Corrosion</tspan> — Deterioration through</tspan><tspan x="541" dy="32">reaction with the surroundings.</tspan></text><text class="se-copy" x="541" y="506"><tspan x="541"><tspan class="se-bold">Element</tspan> — Substance not broken</tspan><tspan x="541" dy="32">into simpler substances by chemical</tspan><tspan x="541" dy="32">means.</tspan></text><text class="se-copy" x="541" y="622"><tspan x="541"><tspan class="se-bold">Alloy</tspan> — A material containing a</tspan><tspan x="541" dy="32">metal mixed with other elements.</tspan></text><g transform="translate(0 692)"><g data-page-illustration="figures/class-7/science/ch04/apparatus-rust.png"><image class="science-illustration" href="../../figures/class-7/science/ch04/apparatus-rust.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Materials for investigating rust.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Materials for investigating rust.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">21</text
