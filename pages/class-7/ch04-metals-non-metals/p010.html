<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="10"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 10"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="electric-table" transform="translate(0 112)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 4.2 Read the observation before classifying</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="80"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Notebook</tspan><tspan x="103" dy="28">column</tspan></text><text class="v2-table-heading" x="312.76" y="76.08"><tspan x="312.76">Record</tspan></text><text class="v2-table-heading" x="627.4" y="76.08"><tspan x="627.4">Check</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="122" y2="122"/><text class="se-copy se-table-copy" x="103" y="156.07999999999998"><tspan x="103">Sample</tspan></text><text class="se-copy se-table-copy" x="312.76" y="156.07999999999998"><tspan x="312.76">Material; surface condition</tspan></text><text class="se-copy se-table-copy" x="627.4" y="156.07999999999998"><tspan x="627.4">Firm contacts?</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="174" y2="174"/><text class="se-copy se-table-copy" x="103" y="208.07999999999998"><tspan x="103">Prediction</tspan></text><text class="se-copy se-table-copy" x="312.76" y="208.07999999999998"><tspan x="312.76">Glow or no glow; reason</tspan></text><text class="se-copy se-table-copy" x="627.4" y="208.07999999999998"><tspan x="627.4">Before testing?</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="226" y2="226"/><text class="se-copy se-table-copy" x="103" y="260.08"><tspan x="103">Observation</tspan></text><text class="se-copy se-table-copy" x="312.76" y="260.08"><tspan x="312.76">What the lamp did</tspan></text><text class="se-copy se-table-copy" x="627.4" y="260.08"><tspan x="627.4">Copper control working?</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="278" y2="278"/><text class="se-copy se-table-copy" x="103" y="312.08"><tspan x="103">Conclusion</tspan></text><text class="se-copy se-table-copy" x="312.76" y="312.08"><tspan x="312.76">Current detected or not</tspan></text><text class="se-copy se-table-copy" x="627.4" y="312.08"><tspan x="627.4">Limits of this tester?</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="330" y2="330"/><rect class="v2-table-frame" x="89" y="42" width="874" height="288"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="42" y2="330"/><line class="v2-table-rule" x1="613.4" x2="613.4" y1="42" y2="330"/><text class="v2-table-note" x="89" y="362.88"><tspan x="89">Make a row for each sample. No glow means too little current to light this lamp under these</tspan><tspan x="89" dy="26">conditions.</tspan></text></g>
<g class="v2-reading-block" data-block="electric-explain-0" transform="translate(0 526)"><text class="se-copy" x="89" y="24"><tspan x="89">Metals such as copper, aluminium and iron are generally good electrical</tspan><tspan x="89" dy="32">conductors. Dry wood, rubber and many plastics are poor conductors in a</tspan></text></g>
<g class="v2-reading-block" data-block="electric-explain-1" transform="translate(0 590)"><text class="se-copy" x="89" y="24"><tspan x="89">low-voltage tester. Non-metals are not all alike: graphite, a form of carbon,</tspan><tspan x="89" dy="32">conducts electricity. Coal contains carbon but is not pure graphite; a result for</tspan><tspan x="89" dy="32">one coal sample cannot classify every form of carbon.</tspan></text></g>
<g class="v2-reading-block" data-block="electric-safety-0" transform="translate(0 702)"><text class="se-copy" x="89" y="24"><tspan x="89">Insulating coverings help separate conducting parts from people and from one</tspan><tspan x="89" dy="32">another. An electrician needs equipment rated for the work and follows</tspan></text></g>
<g class="v2-reading-block" data-block="electric-safety-1" transform="translate(0 766)"><text class="se-copy" x="89" y="24"><tspan x="89">procedures that include isolating the supply. Ordinary rubber gloves, shoes or a</tspan><tspan x="89" dy="32">plastic handle do not make live electrical work safe. Our classroom tester gives</tspan><tspan x="89" dy="32">no evidence that a material will protect someone at mains voltage.</tspan></text></g>
<g class="v2-reading-block" data-block="contact-example-0" transform="translate(0 878)"><text class="se-copy" x="89" y="24"><tspan x="89">Suppose a painted metal strip gives no visible glow, but its clean exposed edge</tspan><tspan x="89" dy="32">lets the lamp light. The two observations concern different contacts on the same</tspan></text></g>
<g class="v2-reading-block" data-block="contact-example-1" transform="translate(0 942)"><text class="se-copy" x="89" y="24"><tspan x="89">object. They support an explanation involving the coating, rather than the</tspan><tspan x="89" dy="32">conclusion that the underlying metal changed from an insulator into a</tspan><tspan x="89" dy="32">conductor.</tspan></text></g><g transform="translate(0 1054)"><g data-page-illustration="figures/class-7/science/ch04/samples.png"><image class="science-illustration" href="../../figures/class-7/science/ch04/samples.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Samples of materials.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Samples of materials.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">10</text></g></svg></div></div></section>
