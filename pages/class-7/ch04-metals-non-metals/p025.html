text class="se-copy" x="112" y="500" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="7.51134" data-space-ratio="2.343">A<tspan dx="7.51134"> dark</tspan><tspan dx="7.51134"> tester</tspan><tspan dx="7.51134"> lamp</tspan><tspan dx="7.51134"> needs</tspan><tspan dx="7.51134"> a</tspan><tspan dx="7.51134"> control</tspan><tspan dx="7.51134"> and</tspan><tspan dx="7.51134"> contact</tspan><tspan dx="7.51134"> checks</tspan><tspan dx="7.51134"> before</tspan><tspan dx="7.51134"> drawing</tspan><tspan dx="7.51134"> a</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">conclusion about a sample.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="7.38386" data-space-ratio="2.320">Ordinary<tspan dx="7.38386"> rusting</tspan><tspan dx="7.38386"> of</tspan><tspan dx="7.38386"> iron</tspan><tspan dx="7.38386"> requires</tspan><tspan dx="7.38386"> water</tspan><tspan dx="7.38386"> and</tspan><tspan dx="7.38386"> oxygen.</tspan><tspan dx="7.38386"> Drying,</tspan><tspan dx="7.38386"> barriers</tspan><tspan dx="7.38386"> and</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">protective coatings can reduce corrosion.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="1.35184" data-space-ratio="1.242">Magnesium<tspan dx="1.35184"> forms</tspan><tspan dx="1.35184"> a</tspan><tspan dx="1.35184"> mainly</tspan><tspan dx="1.35184"> solid</tspan><tspan dx="1.35184"> oxide</tspan><tspan dx="1.35184"> when</tspan><tspan dx="1.35184"> burned.</tspan><tspan dx="1.35184"> Its</tspan><tspan dx="1.35184"> mixture</tspan><tspan dx="1.35184"> with</tspan><tspan dx="1.35184"> water</tspan><tspan dx="1.35184"> is</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">basic.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="3.30856" data-space-ratio="1.592">Sulfur<tspan dx="3.30856"> forms</tspan><tspan dx="3.30856"> sulfur</tspan><tspan dx="3.30856"> dioxide</tspan><tspan dx="3.30856"> when</tspan><tspan dx="3.30856"> burned.</tspan><tspan dx="3.30856"> The</tspan><tspan dx="3.30856"> gas</tspan><tspan dx="3.30856"> gives</tspan><tspan dx="3.30856"> an</tspan><tspan dx="3.30856"> acidic</tspan><tspan dx="3.30856"> solution</tspan><tspan dx="3.30856"> in</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">water; sulfur itself behaves differently.</tspan></text><text class="se-copy" x="89" y="796" text-anchor="start">•</text><text class="se-copy" x="112" y="796" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="3.99508" data-space-ratio="1.714">Metals<tspan dx="3.99508"> and</tspan><tspan dx="3.99508"> non-metals</tspan><tspan dx="3.99508"> are</tspan><tspan dx="3.99508"> groups</tspan><tspan dx="3.99508"> of</tspan><tspan dx="3.99508"> elements.</tspan><tspan dx="3.99508"> Wood,</tspan><tspan dx="3.99508"> plastic,</tspan><tspan dx="3.99508"> coal</tspan><tspan dx="3.99508"> and</tspan><tspan dx="3.99508"> steel</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">are not individual elements.</tspan></text><text class="se-copy" x="89" y="870" text-anchor="start">•</text><text class="se-copy" x="112" y="870" data-prose-align="justify"><tspan x="112" data-justify-width="851" data-natural-space="5.59200" data-extra-space="5.10840" data-space-ratio="1.914">Both<tspan dx="5.10840"> metals</tspan><tspan dx="5.10840"> and</tspan><tspan dx="5.10840"> non-metals</tspan><tspan dx="5.10840"> support</tspan><tspan dx="5.10840"> life</tspan><tspan dx="5.10840"> and</tspan><tspan dx="5.10840"> technology.</tspan><tspan dx="5.10840"> Choose,</tspan><tspan dx="5.10840"> maintain,</tspan></tspan><tspan x="112" dy="32" data-paragraph-end="true">reuse and recycle materials responsibly.</tspan></text><g transform="translate(0 920)"><g data-page-illustration="figures/class-6/science/ch06/reuse.png"><image class="science-illustration" href="../../figures/class-6/science/ch06/reuse.png" x="214.75" y="10" width="622.5" height="415" preserveAspectRatio="xMidYMid meet"><title>Consider useful life, repair and reuse.</title></image><text class="se-caption" x="526" y="463" text-anchor="middle"><tspan x="526">Consider useful life, repair and reuse.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">25</text></g></svg></div></div></section>
