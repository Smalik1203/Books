<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="25"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 25"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q8" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">8.</text><text class="se-copy" x="132" y="24"><tspan x="132">Choose a suitable pan-body material from iron, copper, sulfur, coal, plastic,</tspan><tspan x="132" dy="32">wood and cardboard. Give reasons concerning heat transfer, stability and</tspan><tspan x="132" dy="32">safe use. Would you choose the same material for the handle?</tspan></text></g>
<g class="v2-reading-block" data-block="q9" transform="translate(0 238)"><text class="se-copy" x="111" y="24" text-anchor="end">9.</text><text class="se-copy" x="132" y="24"><tspan x="132">Three similar clean iron nails are covered separately by oil, ordinary water</tspan><tspan x="132" dy="32">and vinegar and left for the same time. Which setup would you expect to</tspan><tspan x="132" dy="32">limit rusting most? State your assumptions about complete oil coverage and</tspan><tspan x="132" dy="32">access to air. Explain why vinegar can attack iron and why appearance alone</tspan><tspan x="132" dy="32">may not measure all corrosion.</tspan></text></g>
<g class="v2-reading-block" data-block="q10" transform="translate(0 428)"><text class="se-copy" x="111" y="24" text-anchor="end">10.</text><text class="se-copy" x="132" y="24"><tspan x="132">Give three uses of metals or non-metals. For each, connect the use with a</tspan><tspan x="132" dy="32">property and identify one limitation or condition that matters.</tspan></text></g>
<g class="v2-reading-block" data-block="q11" transform="translate(0 522)"><text class="se-copy" x="111" y="24" text-anchor="end">11.</text><text class="se-copy" x="132" y="24"><tspan x="132">Zinc coatings protect iron. Sulfur shows no obvious reaction with water in</tspan><tspan x="132" dy="32">our test. Is that observation enough to recommend sulfur as a protective</tspan><tspan x="132" dy="32">coating? Consider brittleness, adhesion, complete coverage and what</tspan><tspan x="132" dy="32">happens if the layer is damaged.</tspan></text></g>
<g class="v2-reading-block" data-block="q12" transform="translate(0 680)"><text class="se-copy" x="111" y="24" text-anchor="end">12.</text><text class="se-copy" x="132" y="24"><tspan x="132">Why does an ironsmith heat iron before shaping a tool? Explain how heating</tspan><tspan x="132" dy="32">helps the metal deform. Does this mean every metal must be heated before it</tspan><tspan x="132" dy="32">can be shaped?</tspan></text></g><g transform="translate(0 806)"><g data-page-illustration="figures/class-7/science/ch04/apparatus-rust.png"><image class="science-illustration" href="../../figures/class-7/science/ch04/apparatus-rust.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Materials for investigating rust.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Materials for investigating rust.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">25</text></g></svg></div></div></section>
