<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="8"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 8"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="heat-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="478" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Your teacher handles hot water in a heat-resistant container on a stable tray.</tspan><tspan x="113" dy="32">Wear eye protection; do not touch heated metal or test temperatures with</tspan><tspan x="113" dy="32">fingers.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">1.</text><text class="se-copy" x="146" y="200"><tspan x="146">Put similar-sized metal and wooden spoons into the water together,</tspan><tspan x="146" dy="32">equally immersing their bowls. Keep handles above the water.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">2.</text><text class="se-copy" x="146" y="276"><tspan x="146">The teacher places suitable contact temperature probes at matching</tspan><tspan x="146" dy="32">points above the water. Record starting readings and readings after equal</tspan><tspan x="146" dy="32">intervals.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">3.</text><text class="se-copy" x="146" y="384"><tspan x="146">Compare the temperature changes. Note differences in shape or probe</tspan><tspan x="146" dy="32">contact. Without suitable probes, use teacher-provided measurements or</tspan><tspan x="146" dy="32">a teacher demonstration.</tspan></text></g>
<g class="v2-reading-block" data-block="heat-record-0" transform="translate(0 612)"><text class="se-copy" x="89" y="24"><tspan x="89">Read your temperature record as a change from the starting value. If one handle</tspan><tspan x="89" dy="32">began warmer, its final temperature alone could mislead you. Compare the rise</tspan></text></g>
<g class="v2-reading-block" data-block="heat-record-1" transform="translate(0 676)"><text class="se-copy" x="89" y="24"><tspan x="89">over the same interval, and check whether the pattern repeats before attributing</tspan><tspan x="89" dy="32">it to the spoon material.</tspan></text></g>
<g class="v2-reading-block" data-block="heat-explain-0" transform="translate(0 756)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Conduction</tspan> transfers energy through a material from a hotter region towards a</tspan><tspan x="89" dy="32">cooler one. Here, heat passes from water into the spoon bowls and along the</tspan></text></g>
<g class="v2-reading-block" data-block="heat-explain-1" transform="translate(0 820)"><text class="se-copy" x="89" y="24"><tspan x="89">handles. The metal handle generally warms faster. Wood transfers some heat</tspan><tspan x="89" dy="32">too: a poor conductor can still become hot.</tspan></text></g>
<g class="v2-reading-block" data-block="heat-use-0" transform="translate(0 900)"><text class="se-copy" x="89" y="24"><tspan x="89">A pan needs to transfer heat to its contents, withstand its working temperature</tspan><tspan x="89" dy="32">and be suitable for contact with food. Aluminium, iron, steel and copper are used</tspan></text></g>
<g class="v2-reading-block" data-block="heat-use-1" transform="translate(0 964)"><text class="se-copy" x="89" y="24"><tspan x="89">in cookware for combinations of properties. A wooden or suitable heat-resistant</tspan><tspan x="89" dy="32">handle slows heat transfer to the hand, but it can still become hot near a flame.</tspan><tspan x="89" dy="32">We will examine heat transfer further in Chapter 7.</tspan></text></g><g transform="translate(0 1076)"><g data-page-illustration="figures/class-7/science/ch04/heat-spoons.png"><image class="science-illustration" href="../../figures/class-7/science/ch04/heat-spoons.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Spoons for a heat-transfer comparison.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Spoons for a heat-transfer comparison.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">8</text></g></svg></div></div></section>
