<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="properties-apart-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">a sheet without fracture. A material can resist a small dent yet still be shaped</tspan><tspan x="89" dy="32">with suitable tools. Keep the two descriptions separate in your notes.</tspan></text></g>
<g class="v2-reading-block" data-block="malleability-head" transform="translate(0 204)"><text class="se-heading" x="89" y="30"><tspan x="89">Sheets, fragments and exceptions</tspan></text></g>
<g class="v2-reading-block" data-block="malleability-0" transform="translate(0 252)"><text class="se-copy" x="89" y="24"><tspan x="89">The ability to be hammered or rolled into sheets without breaking is</tspan><tspan x="89" dy="32"><tspan class="se-bold">malleability</tspan>. Many metals, including copper and aluminium, are malleable. An</tspan></text></g>
<g class="v2-reading-block" data-block="malleability-1" transform="translate(0 316)"><text class="se-copy" x="89" y="24"><tspan x="89">iron nail may flatten only slightly with the force used. A small change is still</tspan><tspan x="89" dy="32">evidence to describe; failure to flatten it by hand does not show that iron cannot</tspan><tspan x="89" dy="32">be shaped.</tspan></text></g>
<g class="v2-reading-block" data-block="shape-comparison" transform="translate(0 428)"><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Malleable behaviour</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74"><tspan x="112">Under a suitable force, the sample</tspan><tspan x="112" dy="32">changes shape without breaking</tspan><tspan x="112" dy="32">apart.</tspan></text><text class="se-copy" x="89" y="180" text-anchor="start">•</text><text class="se-copy" x="112" y="180"><tspan x="112">A metal sheet can be thinner than</tspan><tspan x="112" dy="32">the starting piece.</tspan></text><text class="se-copy" x="89" y="254" text-anchor="start">•</text><text class="se-copy" x="112" y="254"><tspan x="112">Aluminium foil and silver leaf are</tspan><tspan x="112" dy="32">useful examples.</tspan></text><text class="v2-comparison-title" x="526" y="30"><tspan x="526">Brittle behaviour</tspan></text><text class="se-copy" x="526" y="74" text-anchor="start">•</text><text class="se-copy" x="549" y="74"><tspan x="549">Under a suitable force, the sample</tspan><tspan x="549" dy="32">fractures into smaller pieces.</tspan></text><text class="se-copy" x="526" y="148" text-anchor="start">•</text><text class="se-copy" x="549" y="148"><tspan x="549">Breaking is different from</tspan><tspan x="549" dy="32">spreading into a continuous sheet.</tspan></text><text class="se-copy" x="526" y="222" text-anchor="start">•</text><text class="se-copy" x="549" y="222"><tspan x="549">Sulfur and coal commonly show</tspan><tspan x="549" dy="32">this behaviour.</tspan></text></g>
<g class="v2-reading-block" data-block="exceptions-0" transform="translate(0 748)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Brittle</tspan> materials tend to fracture rather than deform substantially. Wood may</tspan><tspan x="89" dy="32">dent, split along its grain or splinter; the result depends on the piece and force.</tspan></text></g>
<g class="v2-reading-block" data-block="exceptions-1" transform="translate(0 812)"><text class="se-copy" x="89" y="24"><tspan x="89">Most familiar metals are solid at room temperature, but mercury is liquid.</tspan><tspan x="89" dy="32">Sodium and potassium are soft metals. These are examples to learn about, not</tspan></text></g>
<g class="v2-reading-block" data-block="exceptions-2" transform="translate(0 876)"><text class="se-copy" x="89" y="24"><tspan x="89">materials to handle or cut in class; mercury is toxic and sodium and potassium</tspan><tspan x="89" dy="32">react dangerously with water.</tspan></text></g>
<g class="v2-reading-block" data-block="single-test-think" transform="translate(0 956)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="262" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">“It is shiny and hard, so it must be a metal.” “It broke when tapped, so it</tspan><tspan x="113" dy="32">cannot contain metal.” What does each observation establish, and what</tspan><tspan x="113" dy="32">remains uncertain?</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Choose two further properties to examine safely. Why would several</tspan><tspan x="113" dy="32">properties provide stronger evidence than appearance or hammering alone?</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
