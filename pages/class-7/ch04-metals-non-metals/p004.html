<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="4"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 4"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="lustre-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">alone does not establish that a sample is not a metal: an oxide layer or dirt can</tspan><tspan x="89" dy="32">cover the shine. Nor does shine alone identify a metal; some non-metals also</tspan><tspan x="89" dy="32">look shiny.</tspan></text></g>
<g class="v2-reading-block" data-block="properties-apart" transform="translate(0 224)"><g data-comparison-table="properties-apart"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Hardness and malleability</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Hardness</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="540" y="70.08"><tspan x="540">Malleability</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Hardness concerns resistance to local</tspan><tspan x="103" dy="28">indentation or scratching.</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="110.08"><tspan x="540">Malleability concerns a change into a</tspan><tspan x="540" dy="28">sheet without fracture.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><rect class="v2-table-frame" x="89" y="42" width="874" height="108"/><line class="v2-table-rule" x1="526" x2="526" y1="42" y2="150"/><text class="v2-table-note" x="89" y="182.88"><tspan x="89">Hardness and malleability answer different questions. A material can resist a small dent yet</tspan><tspan x="89" dy="26">still be shaped with suitable tools. Keep the two descriptions separate in your notes.</tspan></text></g></g>
<g class="v2-reading-block" data-block="malleability-head" transform="translate(0 466)"><text class="se-heading" x="89" y="30"><tspan x="89">Sheets, fragments and exceptions</tspan></text></g>
<g class="v2-reading-block" data-block="malleability-0" transform="translate(0 514)"><text class="se-copy" x="89" y="24"><tspan x="89">The ability to be hammered or rolled into sheets without breaking is</tspan><tspan x="89" dy="32"><tspan class="se-bold">malleability</tspan>. Many metals, including copper and aluminium, are malleable. An</tspan></text></g>
<g class="v2-reading-block" data-block="malleability-1" transform="translate(0 578)"><text class="se-copy" x="89" y="24"><tspan x="89">iron nail may flatten only slightly with the force used. A small change is still</tspan><tspan x="89" dy="32">evidence to describe; failure to flatten it by hand does not show that iron cannot</tspan><tspan x="89" dy="32">be shaped.</tspan></text></g>
<g class="v2-reading-block" data-block="shape-comparison" transform="translate(0 690)"><g data-comparison-table="shape-comparison"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Malleable and brittle behaviour</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Aspect</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="260.32" y="70.08"><tspan x="260.32">Malleable behaviour</tspan></text></g><g data-comparison-cell="2"><text class="v2-table-heading" x="618.6600000000001" y="70.08"><tspan x="618.6600000000001">Brittle behaviour</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Under force</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="110.08"><tspan x="260.32">Under a suitable force, the</tspan><tspan x="260.32" dy="28">sample changes shape without</tspan><tspan x="260.32" dy="28">breaking apart.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="110.08"><tspan x="618.6600000000001">Under a suitable force, the</tspan><tspan x="618.6600000000001" dy="28">sample fractures into smaller</tspan><tspan x="618.6600000000001" dy="28">pieces.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="178" y2="178"/><g data-comparison-row="2"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="206.07999999999998"><tspan x="103">Resulting</tspan><tspan x="103" dy="28">form</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="206.07999999999998"><tspan x="260.32">A metal sheet can be thinner</tspan><tspan x="260.32" dy="28">than the starting piece.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="206.07999999999998"><tspan x="618.6600000000001">Breaking is different from</tspan><tspan x="618.6600000000001" dy="28">spreading into a continuous</tspan><tspan x="618.6600000000001" dy="28">sheet.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="274" y2="274"/><g data-comparison-row="3"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="302.08"><tspan x="103">Examples</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="260.32" y="302.08"><tspan x="260.32">Aluminium foil and silver leaf</tspan><tspan x="260.32" dy="28">are useful examples.</tspan></text></g><g data-comparison-cell="2"><text class="se-copy se-table-copy" x="618.6600000000001" y="302.08"><tspan x="618.6600000000001">Sulfur and coal commonly show</tspan><tspan x="618.6600000000001" dy="28">this behaviour.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="342" y2="342"/><rect class="v2-table-frame" x="89" y="42" width="874" height="300"/><line class="v2-table-rule" x1="246.32" x2="246.32" y1="42" y2="342"/><line class="v2-table-rule" x1="604.6600000000001" x2="604.6600000000001" y1="42" y2="342"/></g></g>
<g class="v2-reading-block" data-block="exceptions-0" transform="translate(0 1048)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Brittle</tspan> materials tend to fracture rather than deform substantially. Wood may</tspan><tspan x="89" dy="32">dent, split along its grain or splinter; the result depends on the piece and force.</tspan></text></g>
<g class="v2-reading-block" data-block="exceptions-1" transform="translate(0 1112)"><text class="se-copy" x="89" y="24"><tspan x="89">Most familiar metals are solid at room temperature, but mercury is liquid.</tspan><tspan x="89" dy="32">Sodium and potassium are soft metals. These are examples to learn about, not</tspan></text></g><g transform="translate(0 1176)"><g data-page-illustration="figures/class-7/science/ch04/samples.png"><image class="science-illustration" href="../../figures/class-7/science/ch04/samples.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Samples of materials.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Samples of materials.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">4</text></g></svg></div></div></section>
