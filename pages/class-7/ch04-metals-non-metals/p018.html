<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="modern-metals-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Metals and alloys are used in utensils, tools, buildings and transport. Titanium</tspan><tspan x="89" dy="32">alloys combine low density with useful strength for aerospace uses; zirconium</tspan></text></g>
<g class="v2-reading-block" data-block="modern-metals-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">alloys are used in parts of nuclear reactors. Choosing a material also involves</tspan><tspan x="89" dy="32">corrosion resistance, working temperature, availability and cost. A material that</tspan><tspan x="89" dy="32">works well for one job may be unsuitable for another.</tspan></text></g>
<g class="v2-reading-block" data-block="choose-table" transform="translate(0 288)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 4.4 Link a useful property with a limitation</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Application</tspan></text><text class="v2-table-heading" x="312.76" y="76.08"><tspan x="312.76">Useful property</tspan></text><text class="v2-table-heading" x="644.88" y="76.08"><tspan x="644.88">Also consider</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Pan body</tspan></text><text class="se-copy se-table-copy" x="312.76" y="128.07999999999998"><tspan x="312.76">Heat transfer</tspan></text><text class="se-copy se-table-copy" x="644.88" y="128.07999999999998"><tspan x="644.88">Food-safe surface</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="146" y2="146"/><text class="se-copy se-table-copy" x="103" y="180.07999999999998"><tspan x="103">Electrical wire</tspan></text><text class="se-copy se-table-copy" x="312.76" y="180.07999999999998"><tspan x="312.76">Conductivity; ductility</tspan></text><text class="se-copy se-table-copy" x="644.88" y="180.07999999999998"><tspan x="644.88">Insulation</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="198" y2="198"/><text class="se-copy se-table-copy" x="103" y="232.07999999999998"><tspan x="103">Jewellery</tspan></text><text class="se-copy se-table-copy" x="312.76" y="232.07999999999998"><tspan x="312.76">Lustre; shapeability</tspan></text><text class="se-copy se-table-copy" x="644.88" y="232.07999999999998"><tspan x="644.88">Tarnish; skin contact</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="250" y2="250"/><text class="se-copy se-table-copy" x="103" y="284.08"><tspan x="103">Outdoor</tspan><tspan x="103" dy="28">structure</tspan></text><text class="se-copy se-table-copy" x="312.76" y="284.08"><tspan x="312.76">Strength; durability</tspan></text><text class="se-copy se-table-copy" x="644.88" y="284.08"><tspan x="644.88">Corrosion protection</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="330" y2="330"/><rect class="v2-table-frame" x="89" y="42" width="874" height="288"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="42" y2="330"/><line class="v2-table-rule" x1="630.88" x2="630.88" y1="42" y2="330"/><text class="v2-table-note" x="89" y="362.88"><tspan x="89">Read across to weigh several requirements. These are design considerations, not test results.</tspan></text></g>
<g class="v2-reading-block" data-block="design-tradeoff-0" transform="translate(0 676)"><text class="se-copy" x="89" y="24"><tspan x="89">Choosing a material can involve a trade-off. A stronger part may be heavier or</tspan><tspan x="89" dy="32">harder to shape; a cheap unprotected part may require frequent replacement</tspan></text></g>
<g class="v2-reading-block" data-block="design-tradeoff-1" transform="translate(0 740)"><text class="se-copy" x="89" y="24"><tspan x="89">outdoors. Explain your choice using the object’s actual job and expected</tspan><tspan x="89" dy="32">conditions, rather than calling one material “best” for every use.</tspan></text></g>
<g class="v2-reading-block" data-block="recycling-0" transform="translate(0 820)"><text class="se-copy" x="89" y="24"><tspan x="89">Iron and aluminium are widely recycled in India. Collecting, sorting and</tspan><tspan x="89" dy="32">processing metal can reduce the need for new raw materials, though recycling</tspan></text></g>
<g class="v2-reading-block" data-block="recycling-1" transform="translate(0 884)"><text class="se-copy" x="89" y="24"><tspan x="89">still uses energy and careful waste handling. Repair, reuse and longer product</tspan><tspan x="89" dy="32">life can reduce waste too. Keep batteries and electronic waste separate from</tspan><tspan x="89" dy="32">ordinary scrap, and use authorised collection systems.</tspan></text></g>
<g class="v2-reading-block" data-block="closing-0" transform="translate(0 996)"><text class="se-copy" x="89" y="24"><tspan x="89">Return to Sudarshan’s workshop. Explain the iron workpiece, the wood handle</tspan><tspan x="89" dy="32">and the decision to heat metal before shaping it. Then choose another object and</tspan></text></g>
<g class="v2-reading-block" data-block="closing-1" transform="translate(0 1060)"><text class="se-copy" x="89" y="24"><tspan x="89">ask which properties its job demands. A scientific explanation links a named</tspan><tspan x="89" dy="32">material to relevant evidence, recognises exceptions and considers what happens</tspan><tspan x="89" dy="32">over the object’s whole lifetime.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
