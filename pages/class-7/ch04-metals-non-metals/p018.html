<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="18"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 18"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="sulfur-water-explain-2" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">laboratories. Do not handle it. Other forms of phosphorus have different</tspan><tspan x="89" dy="32">properties.</tspan></text></g>
<g class="v2-reading-block" data-block="elements-head" transform="translate(0 204)"><text class="se-heading" x="89" y="30"><tspan x="89">Elements and everyday materials</tspan></text></g>
<g class="v2-reading-block" data-block="elements-0" transform="translate(0 252)"><text class="se-copy" x="89" y="24"><tspan x="89">An <tspan class="se-bold">element</tspan> is a substance that cannot be broken into simpler substances by</tspan><tspan x="89" dy="32">chemical means. Metals and non-metals are groups of elements. Iron, copper</tspan></text></g>
<g class="v2-reading-block" data-block="elements-1" transform="translate(0 316)"><text class="se-copy" x="89" y="24"><tspan x="89">and aluminium are metallic elements; sulfur, oxygen, hydrogen, nitrogen and</tspan><tspan x="89" dy="32">carbon are non-metallic elements. IUPAC’s periodic table currently contains 118</tspan></text></g>
<g class="v2-reading-block" data-block="elements-2" transform="translate(0 380)"><text class="se-copy" x="89" y="24"><tspan x="89">named elements. Some are made in laboratories; some very short-lived elements</tspan><tspan x="89" dy="32">occur only fleetingly.</tspan></text></g>
<g class="v2-reading-block" data-block="material-distinction-0" transform="translate(0 460)"><text class="se-copy" x="89" y="24"><tspan x="89">Plastic, glass, wood, rubber and paper are materials, but they are not elements.</tspan><tspan x="89" dy="32">Coal is a mixture rich in carbon, and steel is an alloy. These materials can be</tspan></text></g>
<g class="v2-reading-block" data-block="material-distinction-1" transform="translate(0 524)"><text class="se-copy" x="89" y="24"><tspan x="89">compared by their properties, yet it is misleading to classify every non-metallic</tspan><tspan x="89" dy="32">object as a non-metal element. First distinguish the object, the material it is</tspan><tspan x="89" dy="32">made from and the elements it contains.</tspan></text></g>
<g class="v2-reading-block" data-block="nonmetal-properties" transform="translate(0 636)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112">Many solid non-metals are brittle; they are not readily hammered into sheets</tspan><tspan x="112" dy="32">or drawn into wires.</tspan></text><text class="se-copy" x="89" y="98" text-anchor="start">•</text><text class="se-copy" x="112" y="98"><tspan x="112">Many non-metals are poor heat and electrical conductors, but graphite</tspan><tspan x="112" dy="32">conducts electricity.</tspan></text><text class="se-copy" x="89" y="172" text-anchor="start">•</text><text class="se-copy" x="112" y="172"><tspan x="112">Non-metals do not all look or feel alike: some are gases; diamond is very hard;</tspan><tspan x="112" dy="32">iodine can look shiny.</tspan></text><text class="se-copy" x="89" y="246" text-anchor="start">•</text><text class="se-copy" x="112" y="246"><tspan x="112">Many non-metal oxides form acidic solutions with water, but some oxides are</tspan><tspan x="112" dy="32">neutral. Test the particular substance before extending a pattern.</tspan></text></g><g transform="translate(0 938)"><g data-page-illustration="figures/class-7/science/ch04/samples.png"><image class="science-illustration" href="../../figures/class-7/science/ch04/samples.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Samples of materials.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Samples of materials.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">18</text></g></svg></div></div></section>
