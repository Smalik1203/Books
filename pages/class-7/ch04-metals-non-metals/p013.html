5"> B</tspan><tspan dx="4.31025"> and</tspan><tspan dx="4.31025"> C</tspan><tspan dx="4.31025"> and</tspan><tspan dx="4.31025"> similar</tspan></tspan><tspan x="113" dy="32" data-justify-width="826" data-natural-space="5.59200" data-extra-space="1.95248" data-space-ratio="1.349">bright<tspan dx="1.95248"> iron</tspan><tspan dx="1.95248"> nails.</tspan><tspan dx="1.95248"> Handle</tspan><tspan dx="1.95248"> nail</tspan><tspan dx="1.95248"> points</tspan><tspan dx="1.95248"> carefully.</tspan><tspan dx="1.95248"> The</tspan><tspan dx="1.95248"> teacher</tspan><tspan dx="1.95248"> removes</tspan><tspan dx="1.95248"> old</tspan><tspan dx="1.95248"> rust</tspan></tspan><tspan x="113" dy="32" data-paragraph-end="true">with sandpaper, handles hot water and keeps silica gel away from mouths.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">1.</text><text class="se-copy" x="146" y="200" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="1.40279" data-space-ratio="1.251">In<tspan dx="1.40279"> A,</tspan><tspan dx="1.40279"> suspend</tspan><tspan dx="1.40279"> a</tspan><tspan dx="1.40279"> dry</tspan><tspan dx="1.40279"> nail</tspan><tspan dx="1.40279"> above</tspan><tspan dx="1.40279"> fresh</tspan><tspan dx="1.40279"> silica</tspan><tspan dx="1.40279"> gel</tspan><tspan dx="1.40279"> and</tspan><tspan dx="1.40279"> close</tspan><tspan dx="1.40279"> the</tspan><tspan dx="1.40279"> bottle</tspan><tspan dx="1.40279"> tightly.</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">The silica gel removes moisture from the trapped air.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">2.</text><text class="se-copy" x="146" y="276" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="7.25796" data-space-ratio="2.298">In<tspan dx="7.25796"> B,</tspan><tspan dx="7.25796"> the</tspan><tspan dx="7.25796"> teacher</tspan><tspan dx="7.25796"> covers</tspan><tspan dx="7.25796"> a</tspan><tspan dx="7.25796"> nail</tspan><tspan dx="7.25796"> completely</tspan><tspan dx="7.25796"> with</tspan><tspan dx="7.25796"> freshly</tspan><tspan dx="7.25796"> boiled</tspan><tspan dx="7.25796"> water</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="5.15932" data-space-ratio="1.923">cooled<tspan dx="5.15932"> with</tspan><tspan dx="5.15932"> minimal</tspan><tspan dx="5.15932"> contact</tspan><tspan dx="5.15932"> with</tspan><tspan dx="5.15932"> air,</tspan><tspan dx="5.15932"> adds</tspan><tspan dx="5.15932"> a</tspan><tspan dx="5.15932"> continuous</tspan><tspan dx="5.15932"> oil</tspan><tspan dx="5.15932"> layer</tspan><tspan dx="5.15932"> and</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">caps it. Boiling reduces dissolved oxygen; oil slows oxygen entering again.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">3.</text><text class="se-copy" x="146" y="384" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="1.10077" data-space-ratio="1.197">In<tspan dx="1.10077"> C,</tspan><tspan dx="1.10077"> partly</tspan><tspan dx="1.10077"> immerse</tspan><tspan dx="1.10077"> a</tspan><tspan dx="1.10077"> nail</tspan><tspan dx="1.10077"> in</tspan><tspan dx="1.10077"> ordinary</tspan><tspan dx="1.10077"> water</tspan><tspan dx="1.10077"> and</tspan><tspan dx="1.10077"> leave</tspan><tspan dx="1.10077"> the</tspan><tspan dx="1.10077"> bottle</tspan><tspan dx="1.10077"> open</tspan><tspan dx="1.10077"> to</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">air. Put all bottles in the same safe place at room temperature.</tspan></text><text class="se-activity-step" x="132" y="460" text-anchor="end">4.</text><text class="se-copy" x="146" y="460" data-prose-align="justify"><tspan x="146" data-justify-width="793" data-natural-space="5.59200" data-extra-space="2.97853" data-space-ratio="1.533">Predict<tspan dx="2.97853"> the</tspan><tspan dx="2.97853"> changes</tspan><tspan dx="2.97853"> separately</tspan><tspan dx="2.97853"> for</tspan><tspan dx="2.97853"> A,</tspan><tspan dx="2.97853"> B</tspan><tspan dx="2.97853"> and</tspan><tspan dx="2.97853"> C.</tspan><tspan dx="2.97853"> Observe</tspan><tspan dx="2.97853"> without</tspan><tspan dx="2.97853"> opening</tspan></tspan><tspan x="146" dy="32" data-justify-width="793" data-natural-space="5.59200" data-extra-space="7.93496" data-space-ratio="2.419">for<tspan dx="7.93496"> 8–10</tspan><tspan dx="7.93496"> days.</tspan><tspan dx="7.93496"> Record</tspan><tspan dx="7.93496"> dates,</tspan><tspan dx="7.93496"> where</tspan><tspan dx="7.93496"> any</tspan><tspan dx="7.93496"> brown</tspan><tspan dx="7.93496"> deposit</tspan><tspan dx="7.93496"> appears,</tspan><tspan dx="7.93496"> and</tspan></tspan><tspan x="146" dy="32" data-paragraph-end="true">differences between repeated observations.</tspan></text></g>
