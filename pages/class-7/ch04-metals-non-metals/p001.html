 y="156" text-anchor="start">The World of Metals</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">and Non-metals</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch04/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Students observing an ironsmith with their grandfather</title></image></g><text class="se-copy v2-intro" x="89" y="981" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.56399" data-extra-space="1.14956" data-space-ratio="1.207">A<tspan dx="1.14956"> sheet</tspan><tspan dx="1.14956"> of</tspan><tspan dx="1.14956"> foil</tspan><tspan dx="1.14956"> bends</tspan><tspan dx="1.14956"> around</tspan><tspan dx="1.14956"> food.</tspan><tspan dx="1.14956"> A</tspan><tspan dx="1.14956"> wire</tspan><tspan dx="1.14956"> carries</tspan><tspan dx="1.14956"> electricity.</tspan><tspan dx="1.14956"> What</tspan><tspan dx="1.14956"> makes</tspan></tspan><tspan x="89" dy="34" data-paragraph-end="true">a material right for its job?</tspan></text><text class="se-copy" x="89" y="1067" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="6.09217" data-space-ratio="2.089">Yashwant<tspan dx="6.09217"> and</tspan><tspan dx="6.09217"> Anandi</tspan><tspan dx="6.09217"> visit</tspan><tspan dx="6.09217"> an</tspan><tspan dx="6.09217"> ironsmith</tspan><tspan dx="6.09217"> in</tspan><tspan dx="6.09217"> Rajasthan</tspan><tspan dx="6.09217"> with</tspan><tspan dx="6.09217"> their</tspan><tspan dx="6.09217"> grandfather.</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.49513" data-space-ratio="1.625">Sudarshan<tspan dx="3.49513"> makes</tspan><tspan dx="3.49513"> tawas,</tspan><tspan dx="3.49513"> buckets,</tspan><tspan dx="3.49513"> tongs</tspan><tspan dx="3.49513"> and</tspan><tspan dx="3.49513"> farming</tspan><tspan dx="3.49513"> tools.</tspan><tspan dx="3.49513"> He</tspan><tspan dx="3.49513"> chooses</tspan><tspan dx="3.49513"> iron</tspan><tspan dx="3.49513"> for</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">some parts and wood for handles. Each choice has a reason.</tspan></text><text class="se-copy" x="89" y="1179" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="0.75126" data-space-ratio="1.134">Follow<tspan dx="0.75126"> their</tspan><tspan dx="0.75126"> questions</tspan><tspan dx="0.75126"> into</tspan><tspan dx="0.75126"> the</tspan><tspan dx="0.75126"> classroom.</tspan><tspan dx="0.75126"> Compare</tspan><tspan dx="0.75126"> how</tspan><tspan dx="0.75126"> materials</tspan><tspan dx="0.75126"> change</tspan><tspan dx="0.75126"> shape,</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="4.75305" data-space-ratio="1.850">carry<tspan dx="4.75305"> heat</tspan><tspan dx="4.75305"> and</tspan><tspan dx="4.75305"> electricity,</tspan><tspan dx="4.75305"> and</tspan><tspan dx="4.75305"> react</tspan><tspan dx="4.75305"> with</tspan><tspan dx="4.75305"> air</tspan><tspan dx="4.75305"> and</tspan><tspan dx="4.75305"> water.</tspan><tspan dx="4.75305"> Use</tspan><tspan dx="4.75305"> several</tspan><tspan dx="4.75305"> pieces</tspan><tspan dx="4.75305"> of</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">evidence before deciding what a material can do.</tspan></text><text class="se-copy" x="89" y="1291" data-prose-align="justify"><tspan x="89" data-justify-width="874" data-natural-space="5.59200" data-extra-space="3.89092" data-space-ratio="1.696">Look<tspan dx="3.89092"> closely</tspan><tspan dx="3.89092"> at</tspan><tspan dx="3.89092"> the</tspan><tspan dx="3.89092"> tools</tspan><tspan dx="3.89092"> in</tspan><tspan dx="3.89092"> the</tspan><tspan dx="3.89092"> picture.</tspan><tspan dx="3.89092"> Choose</tspan><tspan dx="3.89092"> one</tspan><tspan dx="3.89092"> and</tspan><tspan dx="3.89092"> name</tspan><tspan dx="3.89092"> the</tspan><tspan dx="3.89092"> job</tspan><tspan dx="3.89092"> of</tspan><tspan dx="3.89092"> each</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="1.11042" data-space-ratio="1.199">part.<tspan dx="1.11042"> Would</tspan><tspan dx="1.11042"> you</tspan><tspan dx="1.11042"> choose</tspan><tspan dx="1.11042"> the</tspan><tspan dx="1.11042"> same</tspan><tspan dx="1.11042"> material</tspan><tspan dx="1.11042"> for</tspan><tspan dx="1.11042"> every</tspan><tspan dx="1.11042"> part?</tspan><tspan dx="1.11042"> Record</tspan><tspan dx="1.11042"> one</tspan><tspan dx="1.11042"> choice</tspan><tspan dx="1.11042"> and</tspan></tspan><tspan x="89" dy="32" data-justify-width="874" data-natural-space="5.59200" data-extra-space="7.48834" data-space-ratio="2.339">a<tspan dx="7.48834"> reason</tspan><tspan dx="7.48834"> in</tspan><tspan dx="7.48834"> your</tspan><tspan dx="7.48834"> notebook,</tspan><tspan dx="7.48834"> then</tspan><tspan dx="7.48834"> return</tspan><tspan dx="7.48834"> to</tspan><tspan dx="7.48834"> it</tspan><tspan dx="7.48834"> after</tspan><tspan dx="7.48834"> the</tspan><tspan dx="7.48834"> investigations</tspan><tspan dx="7.48834"> to</tspan><tspan dx="7.48834"> see</tspan></tspan><tspan x="89" dy="32" data-paragraph-end="true">whether your evidence supports it.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
