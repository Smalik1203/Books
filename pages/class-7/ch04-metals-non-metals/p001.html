<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04 page--opener" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 1"><g class="chapter-opener" data-opener="science-g7-ch04"><defs><linearGradient id="science-g7-ch04-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop class="chapter-opener__gradient-start" offset="0%"/><stop class="chapter-opener__gradient-end" offset="100%"/></linearGradient></defs><path class="chapter-opener__band" fill="url(#science-g7-ch04-gradient)" d="M-17 -17H1069V300H-17Z"/><path class="chapter-opener__edge" d="M-17 296H1069V300H-17Z"/><g class="chapter-opener__motif v2-metal-motif" transform="translate(951 84) scale(1.05)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><line class="chapter-opener__divider" x1="240" x2="240" y1="94" y2="252"/><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number se-running" x="151" y="242" text-anchor="middle">4</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">The World of Metals</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">and Non-metals</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch04/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Students observing an ironsmith with their grandfather</title></image></g><text class="se-copy v2-intro" x="89" y="981"><tspan x="89">A sheet of foil bends around food. A wire carries electricity. What makes</tspan><tspan x="89" dy="34">a material right for its job?</tspan></text><text class="se-copy" x="89" y="1067"><tspan x="89">Yashwant and Anandi visit an ironsmith in Rajasthan with their grandfather.</tspan><tspan x="89" dy="32">Sudarshan makes tawas, buckets, tongs and farming tools. He chooses iron for</tspan><tspan x="89" dy="32">some parts and wood for handles. Each choice has a reason.</tspan></text><text class="se-copy" x="89" y="1179"><tspan x="89">Follow their questions into the classroom. Compare how materials change shape,</tspan><tspan x="89" dy="32">carry heat and electricity, and react with air and water. Use several pieces of</tspan><tspan x="89" dy="32">evidence before deciding what a material can do.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
