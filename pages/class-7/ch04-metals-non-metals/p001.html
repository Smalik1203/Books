<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04 page--opener" data-folio="1"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 1"><g class="chapter-opener" data-opener="science-g7-ch04"><defs><linearGradient id="science-g7-ch04-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop class="chapter-opener__gradient-start" offset="0%"/><stop class="chapter-opener__gradient-end" offset="100%"/></linearGradient></defs><path class="chapter-opener__band" fill="url(#science-g7-ch04-gradient)" d="M-17 -17H1069V300H-17Z"/><path class="chapter-opener__edge" d="M-17 296H1069V300H-17Z"/><g class="science-header-art" data-header-art="7-4" aria-hidden="true" transform="translate(886 26)"><g data-art-element="anvil" transform="translate(7 82) scale(1.12) rotate(-6 50 50)"><path class="science-header-art__soft" d="M6 28H92L82 47H63V59L73 78H88V89H20V78H34L40 59V47H24Z"/><path class="science-header-art__surface" d="M25 29V46M40 59H63M34 78H73M63 7L92 19L87 31L58 19Z"/><path d="M72 27L54 61"/></g><g data-art-element="coil" transform="translate(72 0) scale(0.62) rotate(8 50 50)"><path d="M12 29C12 9 86 9 86 29S12 49 12 29ZM12 29V43C12 63 86 63 86 43V29M12 43V58C12 78 86 78 86 58V43M12 58V72C12 92 86 92 86 72V58M12 72Q7 92 1 92M86 29Q98 22 98 8"/></g><g data-art-element="crystal" transform="translate(64 184) scale(0.65) rotate(7 50 50)"><path class="science-header-art__soft" d="M20 33L52 7L84 34L69 87H35Z"/><path d="M20 33H84M52 7L40 33L50 87L64 33L52 7M35 87L40 33M69 87L64 33"/></g></g><line class="chapter-opener__divider" x1="240" x2="240" y1="94" y2="252"/><text class="chapter-opener__label se-running" x="151" y="80" text-anchor="middle">CHAPTER</text><text class="chapter-opener__number se-running" x="151" y="242" text-anchor="middle">4</text><text class="chapter-opener__title" x="284" y="156" text-anchor="start">The World of Metals</text><text class="chapter-opener__title" x="284" y="242" text-anchor="start">and Non-metals</text><image class="science-illustration chapter-opener__image" href="../../figures/class-7/science/ch04/opener.png" x="89" y="336" width="874" height="582.6666666666666" preserveAspectRatio="xMidYMid meet"><title>Students observing an ironsmith with their grandfather</title></image></g><text class="se-copy v2-intro" x="89" y="981"><tspan x="89">A sheet of foil bends around food. A wire carries electricity. What makes</tspan><tspan x="89" dy="34">a material right for its job?</tspan></text><text class="se-copy" x="89" y="1067"><tspan x="89">Yashwant and Anandi visit an ironsmith in Rajasthan with their grandfather.</tspan><tspan x="89" dy="32">Sudarshan makes tawas, buckets, tongs and farming tools. He chooses iron for</tspan><tspan x="89" dy="32">some parts and wood for handles. Each choice has a reason.</tspan></text><text class="se-copy" x="89" y="1179"><tspan x="89">Follow their questions into the classroom. Compare how materials change shape,</tspan><tspan x="89" dy="32">carry heat and electricity, and react with air and water. Use several pieces of</tspan><tspan x="89" dy="32">evidence before deciding what a material can do.</tspan></text><text class="se-copy" x="89" y="1291"><tspan x="89">Look closely at the tools in the picture. Choose one and name the job of each</tspan><tspan x="89" dy="32">part. Would you choose the same material for every part? Record one choice and</tspan><tspan x="89" dy="32">a reason in your notebook, then return to it after the investigations to see</tspan><tspan x="89" dy="32">whether your evidence supports it.</tspan></text><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">1</text></g></svg></div></div></section>
