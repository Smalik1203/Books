<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="6"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 6"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="heritage-question-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Why might copper-working have developed before widespread iron-working?</tspan><tspan x="89" dy="32">Look for archaeological dates, evidence about ores and furnaces, and the</tspan></text></g>
<g class="v2-reading-block" data-block="heritage-question-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">difficulty of extracting and shaping each material. Test your explanation against</tspan><tspan x="89" dy="32">that evidence.</tspan></text></g>
<g class="v2-reading-block" data-block="sonority-head" transform="translate(0 268)"><text class="se-heading" x="89" y="30"><tspan x="89">Listening to a material</tspan></text></g>
<g class="v2-reading-block" data-block="sound-task" transform="translate(0 316)"><rect class="se-activity-panel" x="89" y="0" width="874" height="414" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">Select a metal spoon, coin, coal piece and small wood block with your</tspan><tspan x="146" dy="32">teacher. Use a clear, hard surface and a teacher-approved low drop</tspan><tspan x="146" dy="32">height. Keep feet and faces clear.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">2.</text><text class="se-copy" x="146" y="200"><tspan x="146">Drop each separately from the same height onto the same surface.</tspan><tspan x="146" dy="32">Compare the character and duration of the sounds, as well as loudness.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">3.</text><text class="se-copy" x="146" y="276"><tspan x="146">Repeat and record a description for each. Stop using any damaged or</tspan><tspan x="146" dy="32">crumbling object and record the damage.</tspan></text><text class="se-activity-step" x="132" y="352" text-anchor="end">4.</text><text class="se-copy" x="146" y="352"><tspan x="146">Could shape, surface or drop height affect the sound? Explain which</tspan><tspan x="146" dy="32">conditions you kept alike.</tspan></text></g>
<g class="v2-reading-block" data-block="sonority-0" transform="translate(0 752)"><text class="se-copy" x="89" y="24"><tspan x="89">Many metal objects produce a ringing sound when struck. This property is called</tspan><tspan x="89" dy="32"><tspan class="se-bold">sonority</tspan>, and such objects are described as sonorous. A school bell and</tspan></text></g>
<g class="v2-reading-block" data-block="sonority-1" transform="translate(0 816)"><text class="se-copy" x="89" y="24"><tspan x="89">ghungroos use vibrating metal to make sound. Coal and wood often produce</tspan><tspan x="89" dy="32">duller sounds in this comparison. Shape and support also matter: a spoon held</tspan><tspan x="89" dy="32">tightly may not ring like a freely hanging one.</tspan></text></g>
<g class="v2-reading-block" data-block="sound-access-0" transform="translate(0 928)"><text class="se-copy" x="89" y="24"><tspan x="89">Differences in sound can provide information about surroundings. A person</tspan><tspan x="89" dy="32">using a mobility cane may notice changes when its tip contacts wood, metal or</tspan></text></g>
<g class="v2-reading-block" data-block="sound-access-1" transform="translate(0 992)"><text class="se-copy" x="89" y="24"><tspan x="89">another surface. These sounds are useful clues alongside touch and learned</tspan><tspan x="89" dy="32">skills. A sound by itself cannot tell us everything about the material or whether a</tspan><tspan x="89" dy="32">route is safe.</tspan></text></g>
<g class="v2-reading-block" data-block="sound-context-0" transform="translate(0 1104)"><text class="se-copy" x="89" y="24"><tspan x="89">Think about a bell after it is struck. It continues vibrating for a time, so the sound</tspan><tspan x="89" dy="32">lasts beyond the impact. Holding it firmly can damp those vibrations. Comparing</tspan></text></g>
<g class="v2-reading-block" data-block="sound-context-1" transform="translate(0 1168)"><text class="se-copy" x="89" y="24"><tspan x="89">a bell with a solid block therefore tests differences in construction as well as</tspan><tspan x="89" dy="32">differences in material.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">6</text></g></svg></div></div></section>
