<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="15"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 15"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="sulfur-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="510" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Teacher demonstration only in a working fume cupboard, with eye</tspan><tspan x="113" dy="32">protection and the school’s approved method. Sulfur dioxide harms</tspan><tspan x="113" dy="32">breathing. Without these facilities, use a recorded demonstration.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">1.</text><text class="se-copy" x="146" y="200"><tspan x="146">The teacher burns a tiny amount of sulfur in a proper deflagrating spoon</tspan><tspan x="146" dy="32">and collects the product in a covered gas jar inside the cupboard. Do not</tspan><tspan x="146" dy="32">improvise a spoon from a bottle cap and wire.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">2.</text><text class="se-copy" x="146" y="308"><tspan x="146">After safe cooling and spoon removal, the teacher adds water and mixes it</tspan><tspan x="146" dy="32">with the contained gas. Observe without inhaling; never identify the gas</tspan><tspan x="146" dy="32">by smell.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">3.</text><text class="se-copy" x="146" y="416"><tspan x="146">The teacher tests separate portions with red and blue litmus against a</tspan><tspan x="146" dy="32">water control. Record both results and infer the mixture’s nature. The</tspan><tspan x="146" dy="32">teacher handles disposal.</tspan></text></g>
<g class="v2-reading-block" data-block="sulfur-explain-0" transform="translate(0 644)"><text class="se-copy" x="89" y="24"><tspan x="89">Burning sulfur in oxygen produces sulfur dioxide. When this gas dissolves in</tspan><tspan x="89" dy="32">water, it forms an acidic solution, often represented at this level as sulfurous acid</tspan></text></g>
<g class="v2-reading-block" data-block="sulfur-explain-1" transform="translate(0 708)"><text class="se-copy" x="89" y="24"><tspan x="89">in water. Blue litmus turns red while red litmus stays red. The indicator reveals</tspan><tspan x="89" dy="32">acidity; it does not directly identify every substance present.</tspan></text></g>
<g class="v2-reading-block" data-block="sulfur-equation" transform="translate(0 788)"><text class="v2-equation" x="89" y="30"><tspan x="89">Sulfur + oxygen → sulfur dioxide</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">Compare this gaseous oxide with the solid oxide formed by burning magnesium.</tspan></text></g>
<g class="v2-reading-block" data-block="oxide-comparison" transform="translate(0 885)"><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Magnesium product</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74"><tspan x="112">Starting element: a metal.</tspan></text><text class="se-copy" x="89" y="116" text-anchor="start">•</text><text class="se-copy" x="112" y="116"><tspan x="112">Product in air: mainly solid</tspan><tspan x="112" dy="32">magnesium oxide.</tspan></text><text class="se-copy" x="89" y="190" text-anchor="start">•</text><text class="se-copy" x="112" y="190"><tspan x="112">With water: a basic mixture; red</tspan><tspan x="112" dy="32">litmus turns blue.</tspan></text><text class="v2-comparison-title" x="526" y="30"><tspan x="526">Sulfur product</tspan></text><text class="se-copy" x="526" y="74" text-anchor="start">•</text><text class="se-copy" x="549" y="74"><tspan x="549">Starting element: a non-metal.</tspan></text><text class="se-copy" x="526" y="116" text-anchor="start">•</text><text class="se-copy" x="549" y="116"><tspan x="549">Product in air: sulfur dioxide gas.</tspan></text><text class="se-copy" x="526" y="158" text-anchor="start">•</text><text class="se-copy" x="549" y="158"><tspan x="549">With water: an acidic solution; blue</tspan><tspan x="549" dy="32">litmus turns red.</tspan></text></g>
<g class="v2-reading-block" data-block="sulfur-water-intro-0" transform="translate(0 1141)"><text class="se-copy" x="89" y="24"><tspan x="89">Dissolving sulfur dioxide in water is different from placing unburned sulfur in</tspan><tspan x="89" dy="32">water. The starting substances are different. Keep those two tests separate in</tspan></text></g>
<g class="v2-reading-block" data-block="sulfur-water-intro-1" transform="translate(0 1205)"><text class="se-copy" x="89" y="24"><tspan x="89">your notes: a product formed by reaction need not behave like the element from</tspan><tspan x="89" dy="32">which it was made.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">15</text></g></svg></div></div></section>
