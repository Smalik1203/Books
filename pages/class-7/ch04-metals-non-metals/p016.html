<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="16"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 16"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="compare-substances-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Write the starting substance beside each observation: magnesium, magnesium</tspan><tspan x="89" dy="32">oxide, sulfur or sulfur dioxide. These names identify different substances. A</tspan></text></g>
<g class="v2-reading-block" data-block="compare-substances-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">property of the starting element cannot automatically be assigned to its oxide,</tspan><tspan x="89" dy="32">even though the oxide contains atoms of that element.</tspan></text></g>
<g class="v2-reading-block" data-block="sulfur-water-task" transform="translate(0 256)"><rect class="se-activity-panel" x="89" y="0" width="874" height="414" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-activity-step" x="132" y="92" text-anchor="end">1.</text><text class="se-copy" x="146" y="92"><tspan x="146">With your teacher, place a small amount of sulfur in a clear container.</tspan><tspan x="146" dy="32">Avoid raising dust, touching your face or tasting it.</tspan></text><text class="se-activity-step" x="132" y="168" text-anchor="end">2.</text><text class="se-copy" x="146" y="168"><tspan x="146">Add room-temperature water and gently stir with a clean rod. Observe</tspan><tspan x="146" dy="32">whether the sulfur disappears, remains visible or shows another change.</tspan></text><text class="se-activity-step" x="132" y="244" text-anchor="end">3.</text><text class="se-copy" x="146" y="244"><tspan x="146">Record the conditions and the observation. Do not heat the mixture. Your</tspan><tspan x="146" dy="32">teacher collects the sulfur for reuse or appropriate disposal.</tspan></text><text class="se-activity-step" x="132" y="320" text-anchor="end">4.</text><text class="se-copy" x="146" y="320"><tspan x="146">Compare this observation with the teacher’s sulfur-dioxide</tspan><tspan x="146" dy="32">demonstration. Explain why the two starting substances must not be</tspan><tspan x="146" dy="32">treated as the same material.</tspan></text></g>
<g class="v2-reading-block" data-block="sulfur-water-explain-0" transform="translate(0 692)"><text class="se-copy" x="89" y="24"><tspan x="89">Sulfur remains largely undissolved and shows no obvious reaction with</tspan><tspan x="89" dy="32">room-temperature water in this test. That observation does not show that every</tspan></text></g>
<g class="v2-reading-block" data-block="sulfur-water-explain-1" transform="translate(0 756)"><text class="se-copy" x="89" y="24"><tspan x="89">non-metal is unreactive with water. White phosphorus, a particular form of the</tspan><tspan x="89" dy="32">non-metal phosphorus, can ignite in air and is stored under water in specialist</tspan></text></g>
<g class="v2-reading-block" data-block="sulfur-water-explain-2" transform="translate(0 820)"><text class="se-copy" x="89" y="24"><tspan x="89">laboratories. Do not handle it. Other forms of phosphorus have different</tspan><tspan x="89" dy="32">properties.</tspan></text></g>
<g class="v2-reading-block" data-block="elements-head" transform="translate(0 912)"><text class="se-heading" x="89" y="30"><tspan x="89">Elements and everyday materials</tspan></text></g>
<g class="v2-reading-block" data-block="elements-0" transform="translate(0 960)"><text class="se-copy" x="89" y="24"><tspan x="89">An <tspan class="se-bold">element</tspan> is a substance that cannot be broken into simpler substances by</tspan><tspan x="89" dy="32">chemical means. Metals and non-metals are groups of elements. Iron, copper</tspan></text></g>
<g class="v2-reading-block" data-block="elements-1" transform="translate(0 1024)"><text class="se-copy" x="89" y="24"><tspan x="89">and aluminium are metallic elements; sulfur, oxygen, hydrogen, nitrogen and</tspan><tspan x="89" dy="32">carbon are non-metallic elements. IUPAC’s periodic table currently contains 118</tspan></text></g>
<g class="v2-reading-block" data-block="elements-2" transform="translate(0 1088)"><text class="se-copy" x="89" y="24"><tspan x="89">named elements. Some are made in laboratories; some very short-lived elements</tspan><tspan x="89" dy="32">occur only fleetingly.</tspan></text></g>
<g class="v2-reading-block" data-block="material-distinction-0" transform="translate(0 1168)"><text class="se-copy" x="89" y="24"><tspan x="89">Plastic, glass, wood, rubber and paper are materials, but they are not elements.</tspan><tspan x="89" dy="32">Coal is a mixture rich in carbon, and steel is an alloy. These materials can be</tspan></text></g>
<g class="v2-reading-block" data-block="material-distinction-1" transform="translate(0 1232)"><text class="se-copy" x="89" y="24"><tspan x="89">compared by their properties, yet it is misleading to classify every non-metallic</tspan><tspan x="89" dy="32">object as a non-metal element. First distinguish the object, the material it is</tspan><tspan x="89" dy="32">made from and the elements it contains.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">16</text></g></svg></div></div></section>
