r="middle">Firm contacts at both ends</text></g><text class="se-caption" x="89" y="398.88"><tspan x="89">A sample bridges the gap. The lamp stays in the circuit to limit current; the drawing does not</tspan><tspan x="89" dy="27">predict a result.</tspan></text></g>
<g class="v2-reading-block" data-block="electric-table" transform="translate(0 566)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 4.2 Read the observation before classifying</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="80"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Notebook</tspan><tspan x="103" dy="28">column</tspan></text><text class="v2-table-heading" x="312.76" y="76.08"><tspan x="312.76">Record</tspan></text><text class="v2-table-heading" x="627.4" y="76.08"><tspan x="627.4">Check</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="122" y2="122"/><text class="se-copy se-table-copy" x="103" y="156.07999999999998"><tspan x="103">Sample</tspan></text><text class="se-copy se-table-copy" x="312.76" y="156.07999999999998"><tspan x="312.76">Material; surface condition</tspan></text><text class="se-copy se-table-copy" x="627.4" y="156.07999999999998"><tspan x="627.4">Firm contacts?</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="174" y2="174"/><text class="se-copy se-table-copy" x="103" y="208.07999999999998"><tspan x="103">Prediction</tspan></text><text class="se-copy se-table-copy" x="312.76" y="208.07999999999998"><tspan x="312.76">Glow or no glow; reason</tspan></text><text class="se-copy se-table-copy" x="627.4" y="208.07999999999998"><tspan x="627.4">Before testing?</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="226" y2="226"/><text class="se-copy se-table-copy" x="103" y="260.08"><tspan x="103">Observation</tspan></text><text class="se-copy se-table-copy" x="312.76" y="260.08"><tspan x="312.76">What the lamp did</tspan></text><text class="se-copy se-table-copy" x="627.4" y="260.08"><tspan x="627.4">Copper control working?</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="278" y2="278"/><text class="se-copy se-table-copy" x="103" y="312.08"><tspan x="103">Conclusion</tspan></text><text class="se-copy se-table-copy" x="312.76" y="312.08"><tspan x="312.76">Current detected or not</tspan></text><text class="se-copy se-table-copy" x="627.4" y="312.08"><tspan x="627.4">Limits of this tester?</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="330" y2="330"/><rect class="v2-table-frame" x="89" y="42" width="874" height="288"/><line class="v2-table-rule" x1="298.76" x2="298.76" y1="42" y2="330"/><line class="v2-table-rule" x1="613.4" x2="613.4" y1="42" y2="330"/><text class="v2-table-note" x="89" y="362.88"><tspan x="89">Make a row for each sample. No glow means too little current to light this lamp under these</tspan><tspan x="89" dy="26">conditions.</tspan></text></g>
<g class="v2-reading-block" data-block="electric-explain-0" transform="translate(0 980)"><text class="se-copy" x="89" y="24"><tspan x="89">Metals such as copper, aluminium and iron are generally good electrical</tspan><tspan x="89" dy="32">conductors. Dry wood, rubber and many plastics are poor conductors in a</tspan></text></g>
<g class="v2-reading-block" data-block="electric-explain-1" transform="translate(0 1044)"><text class="se-copy" x="89" y="24"><tspan x="89">low-voltage tester. Non-metals are not all alike: graphite, a form of carbon,</tspan><tspan x="89" dy="32">conducts electricity. Coal contains carbon but is not pure graphite; a result for</tspan><tspan x="89" dy="32">one coal sample cannot classify every form of carbon.</tspan></text></g>
<g class="v2-reading-block" data-block="electric-safety-0" transform="translate(0 1156)"><text class="se-copy" x="89" y="24"><tspan x="89">Insulating coverings help separate conducting parts from people and from one</tspan><tspan x="89" dy="32">another. An electrician needs equipment rated for the work and follows</tspan></text></g>
<g class="v2-reading-block" data-block="electric-safety-1" transform="translate(0 1220)"><text class="se-copy" x="89" y="24"><tspan x="89">procedures that include isolating the supply. Ordinary rubber gloves, shoes or a</tspan><tspan x="89" dy="32">plastic handle do not make live electrical work safe. Our classroom tester gives</tspan><tspan x="89" dy="32">no evidence that a material will protect someone at mains voltage.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">9</text></g></svg></div></div></section>
