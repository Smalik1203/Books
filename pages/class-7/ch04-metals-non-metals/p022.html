<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="22"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 22"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><text class="v2-title" x="89" y="150" text-anchor="start">Summary</text><text class="se-copy" x="89" y="204" text-anchor="start">•</text><text class="se-copy" x="112" y="204"><tspan x="112">Use several properties to compare materials; a single test rarely identifies a</tspan><tspan x="112" dy="32">material by itself.</tspan></text><text class="se-copy" x="89" y="278" text-anchor="start">•</text><text class="se-copy" x="112" y="278"><tspan x="112">Many metals are lustrous, malleable, ductile and sonorous, but there are</tspan><tspan x="112" dy="32">exceptions to broad property patterns.</tspan></text><text class="se-copy" x="89" y="352" text-anchor="start">•</text><text class="se-copy" x="112" y="352"><tspan x="112">Metal wires and sheets make different uses of ductility and malleability. Alloys</tspan><tspan x="112" dy="32">combine elements to obtain useful properties.</tspan></text><text class="se-copy" x="89" y="426" text-anchor="start">•</text><text class="se-copy" x="112" y="426"><tspan x="112">Metals generally conduct heat and electricity well. Poor conduction is not the</tspan><tspan x="112" dy="32">same as no conduction.</tspan></text><text class="se-copy" x="89" y="500" text-anchor="start">•</text><text class="se-copy" x="112" y="500"><tspan x="112">A dark tester lamp needs a control and contact checks before drawing a</tspan><tspan x="112" dy="32">conclusion about a sample.</tspan></text><text class="se-copy" x="89" y="574" text-anchor="start">•</text><text class="se-copy" x="112" y="574"><tspan x="112">Ordinary rusting of iron requires water and oxygen. Drying, barriers and</tspan><tspan x="112" dy="32">protective coatings can reduce corrosion.</tspan></text><text class="se-copy" x="89" y="648" text-anchor="start">•</text><text class="se-copy" x="112" y="648"><tspan x="112">Magnesium forms a mainly solid oxide when burned. Its mixture with water is</tspan><tspan x="112" dy="32">basic.</tspan></text><text class="se-copy" x="89" y="722" text-anchor="start">•</text><text class="se-copy" x="112" y="722"><tspan x="112">Sulfur forms sulfur dioxide when burned. The gas gives an acidic solution in</tspan><tspan x="112" dy="32">water; sulfur itself behaves differently.</tspan></text><text class="se-copy" x="89" y="796" text-anchor="start">•</text><text class="se-copy" x="112" y="796"><tspan x="112">Metals and non-metals are groups of elements. Wood, plastic, coal and steel</tspan><tspan x="112" dy="32">are not individual elements.</tspan></text><text class="se-copy" x="89" y="870" text-anchor="start">•</text><text class="se-copy" x="112" y="870"><tspan x="112">Both metals and non-metals support life and technology. Choose, maintain,</tspan><tspan x="112" dy="32">reuse and recycle materials responsibly.</tspan></text><g transform="translate(0 920)"><g data-page-illustration="figures/class-7/science/ch04/foil-wire.png"><image class="science-illustration" href="../../figures/class-7/science/ch04/foil-wire.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Metal foil and wire.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Metal foil and wire.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">22</text></g></svg></div></div></section>
