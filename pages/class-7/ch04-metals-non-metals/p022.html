<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="22"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 22"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="q7" transform="translate(0 112)"><text class="se-copy" x="111" y="24" text-anchor="end">7.</text><text class="se-copy" x="132" y="24"><tspan x="132">A teacher heats magnesium in air and mixes its cooled ash with water.</tspan><tspan x="132" dy="32">Complete the missing names and colour changes in this flow chart in your</tspan><tspan x="132" dy="32">notebook. Explain which observation supports the conclusion that the</tspan><tspan x="132" dy="32">mixture is basic.</tspan></text><g transform="translate(0 144)"><g data-diagram="oxide-question" class="v2-metal-diagram"><rect class="v2-metal-box" x="300" y="0" width="452" height="48" rx="9"/><text class="v2-metal-label" x="526" y="31" text-anchor="middle">Magnesium + air + heat</text><path class="v2-metal-line" d="M526 48V72M520 64L526 72L532 64"/><rect class="v2-metal-box" x="353" y="72" width="346" height="48" rx="9"/><text class="v2-metal-label" x="526" y="103" text-anchor="middle">Ash: name the oxide</text><path class="v2-metal-line" d="M526 120V158M520 150L526 158L532 150"/><text class="v2-metal-label" x="625" y="146" text-anchor="middle">Add water</text><rect class="v2-metal-box" x="300" y="158" width="452" height="48" rx="9"/><text class="v2-metal-label" x="526" y="189" text-anchor="middle">Mixture: state its nature</text><path class="v2-metal-line" d="M526 206V230H289V258M526 230H763V258M283 250L289 258L295 250M757 250L763 258L769 250"/><rect class="v2-metal-box" x="125" y="258" width="328" height="76" rx="9"/><text class="v2-metal-label" x="289" y="289" text-anchor="middle">Add blue litmus</text><text class="v2-metal-label" x="289" y="318" text-anchor="middle">Final colour: ?</text><rect class="v2-metal-box" x="599" y="258" width="328" height="76" rx="9"/><text class="v2-metal-label" x="763" y="289" text-anchor="middle">Add red litmus</text><text class="v2-metal-label" x="763" y="318" text-anchor="middle">Final colour: ?</text></g></g><text class="se-caption" x="89" y="516.88"><tspan x="89">Use separate clean portions for each litmus test. Supply the missing information in your</tspan><tspan x="89" dy="27">notebook.</tspan></text></g>
<g class="v2-reading-block" data-block="q8" transform="translate(0 688)"><text class="se-copy" x="111" y="24" text-anchor="end">8.</text><text class="se-copy" x="132" y="24"><tspan x="132">Choose a suitable pan-body material from iron, copper, sulfur, coal, plastic,</tspan><tspan x="132" dy="32">wood and cardboard. Give reasons concerning heat transfer, stability and</tspan><tspan x="132" dy="32">safe use. Would you choose the same material for the handle?</tspan></text></g>
<g class="v2-reading-block" data-block="q9" transform="translate(0 814)"><text class="se-copy" x="111" y="24" text-anchor="end">9.</text><text class="se-copy" x="132" y="24"><tspan x="132">Three similar clean iron nails are covered separately by oil, ordinary water</tspan><tspan x="132" dy="32">and vinegar and left for the same time. Which setup would you expect to</tspan><tspan x="132" dy="32">limit rusting most? State your assumptions about complete oil coverage and</tspan><tspan x="132" dy="32">access to air. Explain why vinegar can attack iron and why appearance alone</tspan><tspan x="132" dy="32">may not measure all corrosion.</tspan></text></g>
<g class="v2-reading-block" data-block="q10" transform="translate(0 1004)"><text class="se-copy" x="111" y="24" text-anchor="end">10.</text><text class="se-copy" x="132" y="24"><tspan x="132">Give three uses of metals or non-metals. For each, connect the use with a</tspan><tspan x="132" dy="32">property and identify one limitation or condition that matters.</tspan></text></g>
<g class="v2-reading-block" data-block="q11" transform="translate(0 1098)"><text class="se-copy" x="111" y="24" text-anchor="end">11.</text><text class="se-copy" x="132" y="24"><tspan x="132">Zinc coatings protect iron. Sulfur shows no obvious reaction with water in</tspan><tspan x="132" dy="32">our test. Is that observation enough to recommend sulfur as a protective</tspan><tspan x="132" dy="32">coating? Consider brittleness, adhesion, complete coverage and what</tspan><tspan x="132" dy="32">happens if the layer is damaged.</tspan></text></g>
<g class="v2-reading-block" data-block="q12" transform="translate(0 1256)"><text class="se-copy" x="111" y="24" text-anchor="end">12.</text><text class="se-copy" x="132" y="24"><tspan x="132">Why does an ironsmith heat iron before shaping a tool? Explain how heating</tspan><tspan x="132" dy="32">helps the metal deform. Does this mean every metal must be heated before it</tspan><tspan x="132" dy="32">can be shaped?</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">22</text></g></svg></div></div></section>
