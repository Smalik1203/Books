<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="rust-think" transform="translate(0 112)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="294" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Suppose bottle B develops a small rusty patch. Does that one result show that</tspan><tspan x="113" dy="32">oxygen is unnecessary? Suggest two ways oxygen could still have reached the</tspan><tspan x="113" dy="32">nail.</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Explain how you would check the water preparation, oil layer and seal. Why</tspan><tspan x="113" dy="32">are similar nails, a shared observation period and a working comparison</tspan><tspan x="113" dy="32">bottle important before changing the explanation?</tspan></text></g>
<g class="v2-reading-block" data-block="corrosion-0" transform="translate(0 428)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Corrosion</tspan> is the gradual deterioration of a material, especially a metal, through</tspan><tspan x="89" dy="32">reaction with its surroundings. Rusting is the familiar corrosion of iron. Copper</tspan></text></g>
<g class="v2-reading-block" data-block="corrosion-1" transform="translate(0 492)"><text class="se-copy" x="89" y="24"><tspan x="89">may acquire a green coating and silver may tarnish black; those coatings are not</tspan><tspan x="89" dy="32">iron rust. Air, water and other substances can contribute, so different metals do</tspan><tspan x="89" dy="32">not all corrode in the same way.</tspan></text></g>
<g class="v2-reading-block" data-block="protect" transform="translate(0 604)"><text class="v2-comparison-title" x="89" y="30"><tspan x="89">Keep the surface covered</tspan></text><text class="se-copy" x="89" y="74" text-anchor="start">•</text><text class="se-copy" x="112" y="74"><tspan x="112">Paint forms a barrier between iron</tspan><tspan x="112" dy="32">and its surroundings.</tspan></text><text class="se-copy" x="89" y="148" text-anchor="start">•</text><text class="se-copy" x="112" y="148"><tspan x="112">Oil or grease can help keep water</tspan><tspan x="112" dy="32">and air away.</tspan></text><text class="se-copy" x="89" y="222" text-anchor="start">•</text><text class="se-copy" x="112" y="222"><tspan x="112">A damaged or incomplete coating</tspan><tspan x="112" dy="32">may leave iron exposed.</tspan></text><text class="v2-comparison-title" x="526" y="30"><tspan x="526">Choose a protective coating</tspan></text><text class="se-copy" x="526" y="74" text-anchor="start">•</text><text class="se-copy" x="549" y="74"><tspan x="549">Galvanisation coats iron or steel</tspan><tspan x="549" dy="32">with zinc.</tspan></text><text class="se-copy" x="526" y="148" text-anchor="start">•</text><text class="se-copy" x="549" y="148"><tspan x="549">Zinc can protect iron as well as</tspan><tspan x="549" dy="32">forming a surface layer.</tspan></text><text class="se-copy" x="526" y="222" text-anchor="start">•</text><text class="se-copy" x="549" y="222"><tspan x="549">Check and maintain the coating</tspan><tspan x="549" dy="32">instead of assuming protection</tspan><tspan x="549" dy="32">lasts forever.</tspan></text></g>
<g class="v2-reading-block" data-block="corrosion-photo" transform="translate(0 924)"><image class="science-illustration" data-photo="corrosion" href="../../figures/class-7/science/ch04/corrosion.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Clean and rusted iron beside a painted bracket. Illustrative comparison; these are not the</tspan><tspan x="89" dy="27">results of the bottle experiment.</tspan></text></g>
<g class="v2-reading-block" data-block="pillar-0" transform="translate(0 1286)"><text class="se-copy" x="89" y="24"><tspan x="89">Repairing corroded structures costs resources and money. Yet the Iron Pillar at</tspan><tspan x="89" dy="32">Delhi, associated with the time of Chandragupta II more than 1,600 years ago, is</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
