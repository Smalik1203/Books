<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="12"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 12"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="rust-diagram" transform="translate(0 112)"><g data-diagram="rust" class="v2-metal-diagram"><svg class="science-illustration" data-photo="apparatus-rust" x="89" y="46" width="874" height="292" viewBox="0 0 874 292"><svg width="874" height="292" viewBox="70 115 2040 540" preserveAspectRatio="xMidYMid meet"><image href="../../figures/class-7/science/ch04/apparatus-rust.png" width="2172" height="724"/></svg></svg><text class="v2-metal-label se-bold" x="230" y="28" text-anchor="middle">A · Dry air</text><text class="v2-metal-label" x="230" y="367" text-anchor="middle">Capped; silica gel</text><text class="v2-metal-label" x="230" y="396" text-anchor="middle">removes moisture.</text><text class="v2-metal-label se-bold" x="524" y="28" text-anchor="middle">B · Limited oxygen</text><text class="v2-metal-label" x="524" y="367" text-anchor="middle">Capped; boiled, cooled</text><text class="v2-metal-label" x="524" y="396" text-anchor="middle">water under an oil layer.</text><text class="v2-metal-label se-bold" x="818" y="28" text-anchor="middle">C · Air and water</text><text class="v2-metal-label" x="818" y="367" text-anchor="middle">Open; nail partly</text><text class="v2-metal-label" x="818" y="396" text-anchor="middle">immersed in water.</text><text class="v2-metal-label" x="526" y="442" text-anchor="middle">Same kind of clean nail; same place and observation period.</text></g><text class="se-caption" x="89" y="486.88"><tspan x="89">Starting conditions, not results. All three nails begin clean; B reduces oxygen exposure rather</tspan><tspan x="89" dy="27">than proving oxygen is completely absent.</tspan></text></g>
<g class="v2-reading-block" data-block="rust-table" transform="translate(0 654)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 4.3 Follow each bottle through time</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Bottle</tspan></text><text class="v2-table-heading" x="242.84" y="76.08"><tspan x="242.84">Designed condition</tspan></text><text class="v2-table-heading" x="618.66" y="76.08"><tspan x="618.66">Notebook observations</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">A</tspan></text><text class="se-copy se-table-copy" x="242.84" y="128.07999999999998"><tspan x="242.84">Dry air; silica gel; capped</tspan></text><text class="se-copy se-table-copy" x="618.66" y="128.07999999999998"><tspan x="618.66">Date and nail appearance</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="146" y2="146"/><text class="se-copy se-table-copy" x="103" y="180.07999999999998"><tspan x="103">B</tspan></text><text class="se-copy se-table-copy" x="242.84" y="180.07999999999998"><tspan x="242.84">Boiled water; oil barrier; capped</tspan></text><text class="se-copy se-table-copy" x="618.66" y="180.07999999999998"><tspan x="618.66">Date and nail appearance</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="198" y2="198"/><text class="se-copy se-table-copy" x="103" y="232.07999999999998"><tspan x="103">C</tspan></text><text class="se-copy se-table-copy" x="242.84" y="232.07999999999998"><tspan x="242.84">Ordinary water and air; open</tspan></text><text class="se-copy se-table-copy" x="618.66" y="232.07999999999998"><tspan x="618.66">Date and nail appearance</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="250" y2="250"/><rect class="v2-table-frame" x="89" y="42" width="874" height="208"/><line class="v2-table-rule" x1="228.84" x2="228.84" y1="42" y2="250"/><line class="v2-table-rule" x1="604.66" x2="604.66" y1="42" y2="250"/><text class="v2-table-note" x="89" y="282.88"><tspan x="89">Read across for each setup, then compare the observed changes down the three rows. No</tspan><tspan x="89" dy="26">rusting outcome is supplied here.</tspan></text></g>
<g class="v2-reading-block" data-block="rust-explain-0" transform="translate(0 988)"><text class="se-copy" x="89" y="24"><tspan x="89">The usual result is little visible rust in A and B and more in C. This supports the</tspan><tspan x="89" dy="32">conclusion that both water and oxygen are needed for ordinary iron rusting. <tspan class="se-bold">Rust</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="rust-explain-1" transform="translate(0 1052)"><text class="se-copy" x="89" y="24"><tspan x="89">is a reddish-brown material containing hydrated iron oxides; <tspan class="se-bold">rusting</tspan> is the</tspan><tspan x="89" dy="32">process that forms it. Rust is not simply dried water or dirt resting on the surface:</tspan><tspan x="89" dy="32">the iron has reacted.</tspan></text></g>
<g class="v2-reading-block" data-block="rust-time-0" transform="translate(0 1164)"><text class="se-copy" x="89" y="24"><tspan x="89">Describe where the first change appears, not only whether a nail looks brown at</tspan><tspan x="89" dy="32">the end. A dated sequence can reveal a change that a single final glance misses.</tspan></text></g>
<g class="v2-reading-block" data-block="rust-time-1" transform="translate(0 1228)"><text class="se-copy" x="89" y="24"><tspan x="89">Use the same lighting and viewing position so that a shadow or reflection is not</tspan><tspan x="89" dy="32">mistaken for a new patch of rust.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">12</text></g></svg></div></div></section>
