<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="3"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 3"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="hammer-task" transform="translate(0 112)"><rect class="se-activity-panel" x="89" y="0" width="874" height="478" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Work with your teacher using small copper and aluminium scraps, an iron</tspan><tspan x="113" dy="32">nail, a pea-sized sulfur lump, coal and wood. Avoid sharp edges and dust;</tspan><tspan x="113" dy="32">wash hands afterwards.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">1.</text><text class="se-copy" x="146" y="200"><tspan x="146">In the same light, record each surface’s appearance and evidence of</tspan><tspan x="146" dy="32">hardness or softness. Predict flattening, fracture or another change when</tspan><tspan x="146" dy="32">tapped.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">2.</text><text class="se-copy" x="146" y="308"><tspan x="146">The teacher gives each sample controlled light taps on a stable hard</tspan><tspan x="146" dy="32">surface. Wear eye protection and stay behind the safety screen, keeping</tspan><tspan x="146" dy="32">fingers away. The teacher contains fragments and handles cleanup.</tspan></text><text class="se-activity-step" x="132" y="416" text-anchor="end">3.</text><text class="se-copy" x="146" y="416"><tspan x="146">Compare before and after. Record the actual change, including little or no</tspan><tspan x="146" dy="32">visible change, rather than forcing every sample into two outcomes.</tspan></text></g>
<g class="v2-reading-block" data-block="record-properties" transform="translate(0 612)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 4.1 Keep observations separate from predictions</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Record</tspan></text><text class="v2-table-heading" x="321.5" y="76.08"><tspan x="321.5">Include</tspan></text><text class="v2-table-heading" x="627.4" y="76.08"><tspan x="627.4">Purpose</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">Sample</tspan></text><text class="se-copy se-table-copy" x="321.5" y="128.07999999999998"><tspan x="321.5">Name; surface condition</tspan></text><text class="se-copy se-table-copy" x="627.4" y="128.07999999999998"><tspan x="627.4">Identify any coating.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="146" y2="146"/><text class="se-copy se-table-copy" x="103" y="180.07999999999998"><tspan x="103">Before tapping</tspan></text><text class="se-copy se-table-copy" x="321.5" y="180.07999999999998"><tspan x="321.5">Lustre; hardness;</tspan><tspan x="321.5" dy="28">prediction</tspan></text><text class="se-copy se-table-copy" x="627.4" y="180.07999999999998"><tspan x="627.4">Describe the starting sample.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="226" y2="226"/><text class="se-copy se-table-copy" x="103" y="260.08"><tspan x="103">After tapping</tspan></text><text class="se-copy se-table-copy" x="321.5" y="260.08"><tspan x="321.5">Flattening, fracture or</tspan><tspan x="321.5" dy="28">other change</tspan></text><text class="se-copy se-table-copy" x="627.4" y="260.08"><tspan x="627.4">Record the actual result.</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="306" y2="306"/><rect class="v2-table-frame" x="89" y="42" width="874" height="264"/><line class="v2-table-rule" x1="307.5" x2="307.5" y1="42" y2="306"/><line class="v2-table-rule" x1="613.4" x2="613.4" y1="42" y2="306"/><text class="v2-table-note" x="89" y="338.88"><tspan x="89">Give each of the six samples a notebook row. Read across for evidence; compare down for</tspan><tspan x="89" dy="26">patterns.</tspan></text></g>
<g class="v2-reading-block" data-block="lustre-0" transform="translate(0 1002)"><text class="se-copy" x="89" y="24"><tspan x="89">A clean metal surface often reflects light with a characteristic shine called</tspan><tspan x="89" dy="32"><tspan class="se-bold">metallic</tspan> <tspan class="se-bold">lustre</tspan>. Copper, aluminium and iron commonly show it. A dull surface</tspan></text></g>
<g class="v2-reading-block" data-block="lustre-1" transform="translate(0 1066)"><text class="se-copy" x="89" y="24"><tspan x="89">alone does not establish that a sample is not a metal: an oxide layer or dirt can</tspan><tspan x="89" dy="32">cover the shine. Nor does shine alone identify a metal; some non-metals also</tspan><tspan x="89" dy="32">look shiny.</tspan></text></g>
<g class="v2-reading-block" data-block="properties-apart" transform="translate(0 1178)"><g data-comparison-table="properties-apart"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Hardness and malleability</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="40"/><g data-comparison-row="0"><g data-comparison-cell="0"><text class="v2-table-heading" x="103" y="70.08"><tspan x="103">Hardness</tspan></text></g><g data-comparison-cell="1"><text class="v2-table-heading" x="540" y="70.08"><tspan x="540">Malleability</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="82" y2="82"/><g data-comparison-row="1"><g data-comparison-cell="0"><text class="se-copy se-table-copy" x="103" y="110.08"><tspan x="103">Hardness concerns resistance to local</tspan><tspan x="103" dy="28">indentation or scratching.</tspan></text></g><g data-comparison-cell="1"><text class="se-copy se-table-copy" x="540" y="110.08"><tspan x="540">Malleability concerns a change into a</tspan><tspan x="540" dy="28">sheet without fracture.</tspan></text></g></g><line class="v2-table-rule" x1="89" x2="963" y1="150" y2="150"/><rect class="v2-table-frame" x="89" y="42" width="874" height="108"/><line class="v2-table-rule" x1="526" x2="526" y1="42" y2="150"/><text class="v2-table-note" x="89" y="182.88"><tspan x="89">Hardness and malleability answer different questions. A material can resist a small dent yet</tspan><tspan x="89" dy="26">still be shaped with suitable tools. Keep the two descriptions separate in your notes.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">3</text></g></svg></div></div></section>
