<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 11"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="rust-head" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">4.2 Why Does Iron Rust?</tspan></text></g>
<g class="v2-reading-block" data-block="rust-intro-0" transform="translate(0 170)"><text class="se-copy" x="89" y="24"><tspan x="89">An iron gate left outdoors may develop a reddish-brown coating. Does air alone</tspan><tspan x="89" dy="32">cause it, does water alone cause it, or are both involved? Compare similar clean</tspan></text></g>
<g class="v2-reading-block" data-block="rust-intro-1" transform="translate(0 234)"><text class="se-copy" x="89" y="24"><tspan x="89">iron nails under three conditions. The purpose of each bottle is to limit one</tspan><tspan x="89" dy="32">condition while keeping the kind of nail, location and observation period alike.</tspan></text></g>
<g class="v2-reading-block" data-block="rust-task" transform="translate(0 314)"><rect class="se-activity-panel" x="89" y="0" width="874" height="554" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Your teacher prepares three clean bottles labelled A, B and C and similar</tspan><tspan x="113" dy="32">bright iron nails. Handle nail points carefully. The teacher removes old rust</tspan><tspan x="113" dy="32">with sandpaper, handles hot water and keeps silica gel away from mouths.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">1.</text><text class="se-copy" x="146" y="200"><tspan x="146">In A, suspend a dry nail above fresh silica gel and close the bottle tightly.</tspan><tspan x="146" dy="32">The silica gel removes moisture from the trapped air.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">2.</text><text class="se-copy" x="146" y="276"><tspan x="146">In B, the teacher covers a nail completely with freshly boiled water</tspan><tspan x="146" dy="32">cooled with minimal contact with air, adds a continuous oil layer and</tspan><tspan x="146" dy="32">caps it. Boiling reduces dissolved oxygen; oil slows oxygen entering again.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">3.</text><text class="se-copy" x="146" y="384"><tspan x="146">In C, partly immerse a nail in ordinary water and leave the bottle open to</tspan><tspan x="146" dy="32">air. Put all bottles in the same safe place at room temperature.</tspan></text><text class="se-activity-step" x="132" y="460" text-anchor="end">4.</text><text class="se-copy" x="146" y="460"><tspan x="146">Predict the changes separately for A, B and C. Observe without opening</tspan><tspan x="146" dy="32">for 8–10 days. Record dates, where any brown deposit appears, and</tspan><tspan x="146" dy="32">differences between repeated observations.</tspan></text></g>
<g class="v2-reading-block" data-block="rust-controls-0" transform="translate(0 890)"><text class="se-copy" x="89" y="24"><tspan x="89">Compare A with C to examine the role of water, and B with C to examine oxygen</tspan><tspan x="89" dy="32">exposure. Bottle C also checks that rust can develop during your observation</tspan></text></g>
<g class="v2-reading-block" data-block="rust-controls-1" transform="translate(0 954)"><text class="se-copy" x="89" y="24"><tspan x="89">period. If no bottle changes, consider whether the nails were coated or the</tspan><tspan x="89" dy="32">experiment needs more time before drawing a conclusion.</tspan></text></g><g transform="translate(0 1034)"><g data-page-illustration="figures/class-7/science/ch04/apparatus-rust.png"><image class="science-illustration" href="../../figures/class-7/science/ch04/apparatus-rust.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Materials for investigating rust.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Materials for investigating rust.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">11</text></g></svg></div></div></section>
