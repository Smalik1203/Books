<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="11"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 11"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="rust-diagram" transform="translate(0 112)"><g data-diagram="rust" class="v2-metal-diagram"><text class="v2-metal-label se-bold" x="230" y="28" text-anchor="middle">A · Dry air</text><path class="v2-metal-line" d="M150 85V111L132 135V312Q132 329 148 329H313Q328 329 328 312V135L310 111V85"/><rect class="v2-metal-cap" x="142" y="67" width="176" height="22" rx="3"/><path class="v2-metal-line" d="M230 89V166 M215 166H245 M226 166V290L230 304L234 290V166"/><circle class="v2-metal-granule" cx="147" cy="313" r="5"/><circle class="v2-metal-granule" cx="162" cy="308" r="5"/><circle class="v2-metal-granule" cx="177" cy="313" r="5"/><circle class="v2-metal-granule" cx="192" cy="308" r="5"/><circle class="v2-metal-granule" cx="207" cy="313" r="5"/><circle class="v2-metal-granule" cx="222" cy="308" r="5"/><circle class="v2-metal-granule" cx="237" cy="313" r="5"/><circle class="v2-metal-granule" cx="252" cy="308" r="5"/><circle class="v2-metal-granule" cx="267" cy="313" r="5"/><circle class="v2-metal-granule" cx="282" cy="308" r="5"/><circle class="v2-metal-granule" cx="297" cy="313" r="5"/><circle class="v2-metal-granule" cx="312" cy="308" r="5"/><text class="v2-metal-label" x="230" y="367" text-anchor="middle">Capped; silica gel</text><text class="v2-metal-label" x="230" y="396" text-anchor="middle">removes moisture.</text><text class="v2-metal-label se-bold" x="524" y="28" text-anchor="middle">B · Limited oxygen</text><path class="v2-metal-line" d="M444 85V111L426 135V312Q426 329 442 329H607Q622 329 622 312V135L604 111V85"/><rect class="v2-metal-cap" x="436" y="67" width="176" height="22" rx="3"/><path class="v2-metal-water" d="M428 159H620V312Q620 327 607 327H442Q428 327 428 312Z"/><rect class="v2-metal-oil" x="428" y="145" width="192" height="14"/><path class="v2-metal-line" d="M524 89V190 M509 190H539 M520 190V290L524 304L528 290V190"/><text class="v2-metal-label" x="524" y="367" text-anchor="middle">Capped; boiled, cooled</text><text class="v2-metal-label" x="524" y="396" text-anchor="middle">water under an oil layer.</text><text class="v2-metal-label se-bold" x="818" y="28" text-anchor="middle">C · Air and water</text><path class="v2-metal-line" d="M738 85V111L720 135V312Q720 329 736 329H901Q916 329 916 312V135L898 111V85"/><path class="v2-metal-water" d="M722 234H914V312Q914 327 901 327H736Q722 327 722 312Z"/><path class="v2-metal-line" d="M818 87V166 M803 166H833 M814 166V290L818 304L822 290V166"/><text class="v2-metal-label" x="818" y="367" text-anchor="middle">Open; nail partly</text><text class="v2-metal-label" x="818" y="396" text-anchor="middle">immersed in water.</text><text class="v2-metal-label" x="526" y="442" text-anchor="middle">Same kind of clean nail; same place and observation period.</text></g><text class="se-caption" x="89" y="486.88"><tspan x="89">Starting conditions, not results. All three nails begin clean; B reduces oxygen exposure rather</tspan><tspan x="89" dy="27">than proving oxygen is completely absent.</tspan></text></g>
<g class="v2-reading-block" data-block="rust-table" transform="translate(0 654)"><text class="v2-table-caption" x="89" y="21.6"><tspan x="89">Table 4.3 Follow each bottle through time</tspan></text><rect class="se-table-head" x="89" y="42" width="874" height="52"/><text class="v2-table-heading" x="103" y="76.08"><tspan x="103">Bottle</tspan></text><text class="v2-table-heading" x="242.84" y="76.08"><tspan x="242.84">Designed condition</tspan></text><text class="v2-table-heading" x="618.66" y="76.08"><tspan x="618.66">Notebook observations</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="94" y2="94"/><text class="se-copy se-table-copy" x="103" y="128.07999999999998"><tspan x="103">A</tspan></text><text class="se-copy se-table-copy" x="242.84" y="128.07999999999998"><tspan x="242.84">Dry air; silica gel; capped</tspan></text><text class="se-copy se-table-copy" x="618.66" y="128.07999999999998"><tspan x="618.66">Date and nail appearance</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="146" y2="146"/><text class="se-copy se-table-copy" x="103" y="180.07999999999998"><tspan x="103">B</tspan></text><text class="se-copy se-table-copy" x="242.84" y="180.07999999999998"><tspan x="242.84">Boiled water; oil barrier; capped</tspan></text><text class="se-copy se-table-copy" x="618.66" y="180.07999999999998"><tspan x="618.66">Date and nail appearance</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="198" y2="198"/><text class="se-copy se-table-copy" x="103" y="232.07999999999998"><tspan x="103">C</tspan></text><text class="se-copy se-table-copy" x="242.84" y="232.07999999999998"><tspan x="242.84">Ordinary water and air; open</tspan></text><text class="se-copy se-table-copy" x="618.66" y="232.07999999999998"><tspan x="618.66">Date and nail appearance</tspan></text><line class="v2-table-rule" x1="89" x2="963" y1="250" y2="250"/><rect class="v2-table-frame" x="89" y="42" width="874" height="208"/><line class="v2-table-rule" x1="228.84" x2="228.84" y1="42" y2="250"/><line class="v2-table-rule" x1="604.66" x2="604.66" y1="42" y2="250"/><text class="v2-table-note" x="89" y="282.88"><tspan x="89">Read across for each setup, then compare the observed changes down the three rows. No</tspan><tspan x="89" dy="26">rusting outcome is supplied here.</tspan></text></g>
<g class="v2-reading-block" data-block="rust-explain-0" transform="translate(0 988)"><text class="se-copy" x="89" y="24"><tspan x="89">The usual result is little visible rust in A and B and more in C. This supports the</tspan><tspan x="89" dy="32">conclusion that both water and oxygen are needed for ordinary iron rusting. <tspan class="se-bold">Rust</tspan></tspan></text></g>
<g class="v2-reading-block" data-block="rust-explain-1" transform="translate(0 1052)"><text class="se-copy" x="89" y="24"><tspan x="89">is a reddish-brown material containing hydrated iron oxides; <tspan class="se-bold">rusting</tspan> is the</tspan><tspan x="89" dy="32">process that forms it. Rust is not simply dried water or dirt resting on the surface:</tspan><tspan x="89" dy="32">the iron has reacted.</tspan></text></g>
<g class="v2-reading-block" data-block="rust-time-0" transform="translate(0 1164)"><text class="se-copy" x="89" y="24"><tspan x="89">Describe where the first change appears, not only whether a nail looks brown at</tspan><tspan x="89" dy="32">the end. A dated sequence can reveal a change that a single final glance misses.</tspan></text></g>
<g class="v2-reading-block" data-block="rust-time-1" transform="translate(0 1228)"><text class="se-copy" x="89" y="24"><tspan x="89">Use the same lighting and viewing position so that a shadow or reflection is not</tspan><tspan x="89" dy="32">mistaken for a new patch of rust.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">11</text></g></svg></div></div></section>
