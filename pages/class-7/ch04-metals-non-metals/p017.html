<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="17"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 17"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="nonmetal-properties" transform="translate(0 112)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112">Many solid non-metals are brittle; they are not readily hammered into sheets</tspan><tspan x="112" dy="32">or drawn into wires.</tspan></text><text class="se-copy" x="89" y="98" text-anchor="start">•</text><text class="se-copy" x="112" y="98"><tspan x="112">Many non-metals are poor heat and electrical conductors, but graphite</tspan><tspan x="112" dy="32">conducts electricity.</tspan></text><text class="se-copy" x="89" y="172" text-anchor="start">•</text><text class="se-copy" x="112" y="172"><tspan x="112">Non-metals do not all look or feel alike: some are gases; diamond is very hard;</tspan><tspan x="112" dy="32">iodine can look shiny.</tspan></text><text class="se-copy" x="89" y="246" text-anchor="start">•</text><text class="se-copy" x="112" y="246"><tspan x="112">Many non-metal oxides form acidic solutions with water, but some oxides are</tspan><tspan x="112" dy="32">neutral. Test the particular substance before extending a pattern.</tspan></text></g>
<g class="v2-reading-block" data-block="classification-think" transform="translate(0 414)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="326" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">A pencil core can carry a small current, yet it contains graphite, a non-metal</tspan><tspan x="113" dy="32">form of carbon. A steel spoon contains carbon too. Why would “conducts</tspan><tspan x="113" dy="32">electricity” and “contains carbon” each be insufficient to classify the whole</tspan><tspan x="113" dy="32">object?</tspan></text><text class="se-copy" x="113" y="232"><tspan x="113">Describe what evidence identifies an element, and what evidence describes</tspan><tspan x="113" dy="32">a material’s behaviour. Use the difference to explain why a wooden ruler is</tspan><tspan x="113" dy="32">not an example of a non-metal element.</tspan></text></g>
<g class="v2-reading-block" data-block="uses-head" transform="translate(0 774)"><text class="v2-title" x="89" y="38"><tspan x="89">4.5 Why Both Groups Matter</tspan></text></g>
<g class="v2-reading-block" data-block="uses-intro-0" transform="translate(0 832)"><text class="se-copy" x="89" y="24"><tspan x="89">Shiny metal tools are easy to notice. Non-metals may be less conspicuous, yet</tspan><tspan x="89" dy="32">living things and many technologies depend on them. Their importance cannot</tspan></text></g>
<g class="v2-reading-block" data-block="uses-intro-1" transform="translate(0 896)"><text class="se-copy" x="89" y="24"><tspan x="89">be ranked by shine, strength or price. Sometimes an element is used directly;</tspan><tspan x="89" dy="32">sometimes its compounds provide the useful function.</tspan></text></g>
<g class="v2-reading-block" data-block="nonmetal-uses" transform="translate(0 976)"><text class="se-copy" x="89" y="24" text-anchor="start">•</text><text class="se-copy" x="112" y="24"><tspan x="112">Oxygen supports human respiration and combustion. Some organisms live</tspan><tspan x="112" dy="32">without it, so it is not essential to all life.</tspan></text><text class="se-copy" x="89" y="98" text-anchor="start">•</text><text class="se-copy" x="112" y="98"><tspan x="112">Carbon forms the framework of carbohydrates, fats and proteins, supporting</tspan><tspan x="112" dy="32">growth, structures and energy supply.</tspan></text><text class="se-copy" x="89" y="172" text-anchor="start">•</text><text class="se-copy" x="112" y="172"><tspan x="112">Plants need usable nitrogen compounds. Fertilisers can supply them; most</tspan><tspan x="112" dy="32">plants cannot directly use nitrogen gas.</tspan></text><text class="se-copy" x="89" y="246" text-anchor="start">•</text><text class="se-copy" x="112" y="246"><tspan x="112">Chlorine-based disinfectants treat water under controlled conditions. Do not</tspan><tspan x="112" dy="32">add laboratory chemicals to drinking water.</tspan></text><text class="se-copy" x="89" y="320" text-anchor="start">•</text><text class="se-copy" x="112" y="320"><tspan x="112">Iodine-containing antiseptics are used in healthcare. Laboratory iodine is not a</tspan><tspan x="112" dy="32">preparation to apply to wounds.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">17</text></g></svg></div></div></section>
