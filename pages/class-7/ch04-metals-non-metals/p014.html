<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="magnesium-explain-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Magnesium burns with intense white light and forms a white solid, mainly</tspan><tspan x="89" dy="32">magnesium oxide, by combining with oxygen. With water, some oxide forms</tspan></text></g>
<g class="v2-reading-block" data-block="magnesium-explain-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">magnesium hydroxide, making a basic mixture. Red litmus turns blue; blue</tspan><tspan x="89" dy="32">litmus stays blue. The sparingly soluble oxide can leave the mixture cloudy.</tspan></text></g>
<g class="v2-reading-block" data-block="magnesium-equation" transform="translate(0 256)"><text class="v2-equation" x="89" y="30"><tspan x="89">Magnesium + oxygen → magnesium oxide</tspan></text><text class="se-caption" x="89" y="70.88"><tspan x="89">A word equation names the reactants and product. It does not represent the speed of a</tspan><tspan x="89" dy="27">reaction or a measured mass.</tspan></text></g>
<g class="v2-reading-block" data-block="oxide-qualification-0" transform="translate(0 380)"><text class="se-copy" x="89" y="24"><tspan x="89">Many metal oxides are basic, with exceptions. Our litmus evidence concerns the</tspan><tspan x="89" dy="32">magnesium product mixed with water; it cannot establish a rule for every metal</tspan><tspan x="89" dy="32">oxide. Chapter 5 revisits changes that form new substances.</tspan></text></g>
<g class="v2-reading-block" data-block="oxygen-source-0" transform="translate(0 492)"><text class="se-copy" x="89" y="24"><tspan x="89">The oxygen in this demonstration comes from the surrounding air. Water is</tspan><tspan x="89" dy="32">added only after the ribbon has burned and the product has cooled. Keeping that</tspan></text></g>
<g class="v2-reading-block" data-block="oxygen-source-1" transform="translate(0 556)"><text class="se-copy" x="89" y="24"><tspan x="89">sequence clear helps explain why the white residue is formed during burning,</tspan><tspan x="89" dy="32">while the indicator test supplies a different piece of evidence afterwards.</tspan></text></g>
<g class="v2-reading-block" data-block="sodium-0" transform="translate(0 636)"><text class="se-copy" x="89" y="24"><tspan x="89">Sodium reacts vigorously with water, releasing heat that can ignite the hydrogen</tspan><tspan x="89" dy="32">formed. In laboratories, suitable oil such as kerosene limits its contact with air</tspan></text></g>
<g class="v2-reading-block" data-block="sodium-1" transform="translate(0 700)"><text class="se-copy" x="89" y="24"><tspan x="89">and moisture. Never handle sodium, open its container or try this reaction. Its</tspan><tspan x="89" dy="32">oxide is basic, matching the broad pattern for many metal oxides.</tspan></text></g>
<g class="v2-reading-block" data-block="nonmetal-head" transform="translate(0 792)"><text class="v2-title" x="89" y="38"><tspan x="89">4.4 A Different Pattern: Non-metals</tspan></text></g>
<g class="v2-reading-block" data-block="sulfur-intro-0" transform="translate(0 850)"><text class="se-copy" x="89" y="24"><tspan x="89">Sulfur is yellow, brittle and unlike the familiar metals in several tests. What</tspan><tspan x="89" dy="32">happens when it combines with oxygen? Its product is a gas, so the</tspan></text></g>
<g class="v2-reading-block" data-block="sulfur-intro-1" transform="translate(0 914)"><text class="se-copy" x="89" y="24"><tspan x="89">demonstration needs a way to contain and extract the gas safely. Do not try to</tspan><tspan x="89" dy="32">identify it by smell.</tspan></text></g>
<g class="v2-reading-block" data-block="sulfur-task-equipment" transform="translate(0 994)"><image class="science-illustration" data-photo="sulfur-kit" href="../../figures/class-7/science/ch04/sulfur-kit.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">A proper deflagrating spoon and gas jar. The apparatus is shown before heating, without a</tspan><tspan x="89" dy="27">predicted result.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
