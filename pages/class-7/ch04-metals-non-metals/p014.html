<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="14"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 14"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="pillar-1" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">famous for resisting corrosion. Its material, manufacture and environment help</tspan><tspan x="89" dy="32">explain this resistance. It is evidence of sophisticated metalworking, not proof</tspan><tspan x="89" dy="32">that all old iron is immune to rust.</tspan></text></g>
<g class="v2-reading-block" data-block="metal-air-head" transform="translate(0 236)"><text class="v2-title" x="89" y="38"><tspan x="89">4.3 Metals React with Air and Water</tspan></text></g>
<g class="v2-reading-block" data-block="magnesium-intro-0" transform="translate(0 294)"><text class="se-copy" x="89" y="24"><tspan x="89">Rusting is a slow change. Some metal reactions occur much more quickly.</tspan><tspan x="89" dy="32">Magnesium can react with oxygen when heated. In the following teacher</tspan></text></g>
<g class="v2-reading-block" data-block="magnesium-intro-1" transform="translate(0 358)"><text class="se-copy" x="89" y="24"><tspan x="89">demonstration, separate three observations: what happens during burning, what</tspan><tspan x="89" dy="32">remains afterwards, and how the cooled product behaves when mixed with water</tspan><tspan x="89" dy="32">and tested with an indicator.</tspan></text></g>
<g class="v2-reading-block" data-block="magnesium-task-equipment" transform="translate(0 470)"><image class="science-illustration" data-photo="magnesium-kit" href="../../figures/class-7/science/ch04/magnesium-kit.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Equipment before the demonstration. The ribbon is unburned; products are examined only</tspan><tspan x="89" dy="27">after cooling.</tspan></text></g>
<g class="v2-reading-block" data-block="magnesium-task" transform="translate(0 832)"><rect class="se-activity-panel" x="89" y="0" width="874" height="478" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Teacher demonstration only under the school’s safety procedure. Wear eye</tspan><tspan x="113" dy="32">protection, keep a safe distance and do not look directly at magnesium’s</tspan><tspan x="113" dy="32">intense burning light.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">1.</text><text class="se-copy" x="146" y="200"><tspan x="146">The teacher cleans a short ribbon with sandpaper, holds it in tongs over a</tspan><tspan x="146" dy="32">heatproof surface, ignites it and safely collects the residue. Record the</tspan><tspan x="146" dy="32">changes the teacher helps you observe.</tspan></text><text class="se-activity-step" x="132" y="308" text-anchor="end">2.</text><text class="se-copy" x="146" y="308"><tspan x="146">After cooling, the teacher adds water and stirs. Test separate clean</tspan><tspan x="146" dy="32">portions with red and blue litmus; compare with water alone.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">3.</text><text class="se-copy" x="146" y="384"><tspan x="146">Record both results, including unclear changes, then decide whether the</tspan><tspan x="146" dy="32">mixture is acidic, basic or neutral. Students do not handle flames or hot</tspan><tspan x="146" dy="32">products.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">14</text></g></svg></div></div></section>
