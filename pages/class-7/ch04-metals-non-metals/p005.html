<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="5"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 5"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="exceptions-2" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">materials to handle or cut in class; mercury is toxic and sodium and potassium</tspan><tspan x="89" dy="32">react dangerously with water.</tspan></text></g>
<g class="v2-reading-block" data-block="single-test-think" transform="translate(0 192)"><rect class="se-prompt se-thought-panel" x="89" y="0" width="874" height="262" rx="18"/><g class="v2-panel-heading v2-panel-heading--think" data-feature="think" aria-label="Think It Through"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-4c-2.6-1.4-4-3.7-4-6.4C4 6.4 7.4 3 11.7 3c4.2 0 7.3 3.1 7.3 7.2v1l2 3.3h-3V18h-4v3Z M9 8a2.2 2.2 0 0 1 4.4 0c0 1.5-2.2 1.6-2.2 3.2 M11.2 14h.01"/></svg><text class="v2-panel-title se-cue-title" x="153" y="39">Think It Through</text></g><text class="se-copy" x="113" y="92"><tspan x="113">“It is shiny and hard, so it must be a metal.” “It broke when tapped, so it</tspan><tspan x="113" dy="32">cannot contain metal.” What does each observation establish, and what</tspan><tspan x="113" dy="32">remains uncertain?</tspan></text><text class="se-copy" x="113" y="200"><tspan x="113">Choose two further properties to examine safely. Why would several</tspan><tspan x="113" dy="32">properties provide stronger evidence than appearance or hammering alone?</tspan></text></g>
<g class="v2-reading-block" data-block="property-conclusion-0" transform="translate(0 476)"><text class="se-copy" x="89" y="24"><tspan x="89">A useful conclusion names both the sample and the conditions: “This copper</tspan><tspan x="89" dy="32">piece flattened under the teacher’s taps.” It is more precise than “Everything</tspan></text></g>
<g class="v2-reading-block" data-block="property-conclusion-1" transform="translate(0 540)"><text class="se-copy" x="89" y="24"><tspan x="89">shiny flattens.” Compare evidence from several identified samples before using it</tspan><tspan x="89" dy="32">to describe a broader group.</tspan></text></g>
<g class="v2-reading-block" data-block="ductility-head" transform="translate(0 632)"><text class="se-heading" x="89" y="30"><tspan x="89">Drawing a material into wire</tspan></text></g>
<g class="v2-reading-block" data-block="ductility-0" transform="translate(0 680)"><text class="se-copy" x="89" y="24"><tspan x="89"><tspan class="se-bold">Ductility</tspan> is the ability to be drawn into wire. Copper and aluminium are used in</tspan><tspan x="89" dy="32">electrical wiring; metal wires also form jewellery, mesh strainers and strings in</tspan></text></g>
<g class="v2-reading-block" data-block="ductility-1" transform="translate(0 744)"><text class="se-copy" x="89" y="24"><tspan x="89">instruments such as the veena, sitar, violin and guitar. Gold is exceptionally</tspan><tspan x="89" dy="32">ductile and malleable. The length made from a given mass depends on the wire’s</tspan><tspan x="89" dy="32">thickness, so a length claim needs that condition.</tspan></text></g>
<g class="v2-reading-block" data-block="foil-wire" transform="translate(0 856)"><image class="science-illustration" data-photo="foil-wire" href="../../figures/class-7/science/ch04/foil-wire.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">A foil sheet uses malleability; wire and woven metal mesh use ductility. These are different</tspan><tspan x="89" dy="27">ways of shaping a material.</tspan></text></g>
<g class="v2-reading-block" data-block="steel-0" transform="translate(0 1218)"><text class="se-copy" x="89" y="24"><tspan x="89">Many everyday “metal” objects are made from <tspan class="se-bold">alloys</tspan>: materials containing a</tspan><tspan x="89" dy="32">metal mixed with one or more other elements. Steel is mainly iron with a small</tspan></text></g>
<g class="v2-reading-block" data-block="steel-1" transform="translate(0 1282)"><text class="se-copy" x="89" y="24"><tspan x="89">amount of carbon, sometimes with other elements added. Strong steel wires can</tspan><tspan x="89" dy="32">be combined into ropes for cranes and suspension bridges. Ductility permits</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">5</text></g></svg></div></div></section>
