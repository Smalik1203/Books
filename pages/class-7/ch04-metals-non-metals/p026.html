<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="26" data-close><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 26"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="project-heading" transform="translate(0 112)"><text class="v2-title" x="89" y="38"><tspan x="89">Explore Further</tspan></text></g>
<g class="v2-reading-block" data-block="craft-project-head" transform="translate(0 182)"><text class="se-heading" x="89" y="30"><tspan x="89">Metal craft and place</tspan></text></g>
<g class="v2-reading-block" data-block="craft-project-0" transform="translate(0 230)"><text class="se-copy" x="89" y="24"><tspan x="89">Research Dhokra, Bidriware, Pembarthi and Kamrupi metalwork. Identify the</tspan><tspan x="89" dy="32">states or regions associated with each, the materials used and a shaping or</tspan></text></g>
<g class="v2-reading-block" data-block="craft-project-1" transform="translate(0 294)"><text class="se-copy" x="89" y="24"><tspan x="89">decorating method. Make a photograph collage in your notebook with</tspan><tspan x="89" dy="32">image-source credits. If you speak to a craftsperson, go with an adult, ask</tspan><tspan x="89" dy="32">permission and observe tools from a safe distance.</tspan></text></g>
<g class="v2-reading-block" data-block="map-project-head" transform="translate(0 418)"><text class="se-heading" x="89" y="30"><tspan x="89">Map resources carefully</tspan></text></g>
<g class="v2-reading-block" data-block="map-project-0" transform="translate(0 466)"><text class="se-copy" x="89" y="24"><tspan x="89">Use a current Geological Survey of India or Indian Bureau of Mines source to</tspan><tspan x="89" dy="32">locate important deposits or production areas for iron, gold and aluminium ores.</tspan></text></g>
<g class="v2-reading-block" data-block="map-project-1" transform="translate(0 530)"><text class="se-copy" x="89" y="24"><tspan x="89">Mark the states on an India map and add a key. Distinguish a mineral deposit, an</tspan><tspan x="89" dy="32">active mine and a processing plant; aluminium is obtained from ores such as</tspan><tspan x="89" dy="32">bauxite, not mined as shiny metal. Record the date of your source.</tspan></text></g>
<g class="v2-reading-block" data-block="phone-project-head" transform="translate(0 654)"><text class="se-heading" x="89" y="30"><tspan x="89">Materials inside a smartphone</tspan></text></g>
<g class="v2-reading-block" data-block="phone-project-0" transform="translate(0 702)"><text class="se-copy" x="89" y="24"><tspan x="89">Research how copper, aluminium, carbon and other elements or compounds</tspan><tspan x="89" dy="32">contribute to a smartphone. Use a manufacturer or scientific source and connect</tspan></text></g>
<g class="v2-reading-block" data-block="phone-project-1" transform="translate(0 766)"><text class="se-copy" x="89" y="24"><tspan x="89">each example with a function. Do not dismantle a phone or its battery. Explain</tspan><tspan x="89" dy="32">why a screen, circuit board or battery is a combination of materials rather than</tspan><tspan x="89" dy="32">one pure element, and find an authorised route for electronic waste.</tspan></text></g>
<g class="v2-reading-block" data-block="debate-project-head" transform="translate(0 890)"><text class="se-heading" x="89" y="30"><tspan x="89">Comfort, luxury and resources</tspan></text></g>
<g class="v2-reading-block" data-block="debate-project-0" transform="translate(0 938)"><text class="se-copy" x="89" y="24"><tspan x="89">Debate whether metal use for comfort and luxury should increase or decrease.</tspan><tspan x="89" dy="32">Separate essential services from optional uses. Prepare evidence about</tspan></text></g>
<g class="v2-reading-block" data-block="debate-project-1" transform="translate(0 1002)"><text class="se-copy" x="89" y="24"><tspan x="89">durability, mining, energy, repair and recycling, then consider the strongest</tspan><tspan x="89" dy="32">argument against your initial view. Agree on two practical ways your school could</tspan></text></g>
<g class="v2-reading-block" data-block="debate-project-2" transform="translate(0 1066)"><text class="se-copy" x="89" y="24"><tspan x="89">use materials more responsibly, and explain what evidence would show whether</tspan><tspan x="89" dy="32">they worked.</tspan></text></g><g transform="translate(0 1146)"><g data-page-illustration="figures/class-7/science/ch04/samples.png"><image class="science-illustration" href="../../figures/class-7/science/ch04/samples.png" x="209" y="20" width="290" height="180" preserveAspectRatio="xMidYMid meet"><title>Samples of materials.</title></image><text class="se-caption" x="539" y="100"><tspan x="539">Samples of materials.</tspan></text></g></g><g class="v2-footer"><line class="v2-furniture-rule" x1="190" x2="963" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="963" y="1465" text-anchor="end">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M0 1455H137Q152 1455 160 1470L179 1514H0Z"/><path class="v2-ribbon" d="M0 1455H117Q132 1455 140 1470L159 1514H0Z"/><text class="v2-folio se-running" x="107" y="1487" text-anchor="middle">26</text></g></svg></div></div></section>
