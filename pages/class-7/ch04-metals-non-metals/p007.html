<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="heat-head" transform="translate(0 112)"><text class="se-heading" x="89" y="30"><tspan x="89">Heat travels through materials</tspan></text></g>
<g class="v2-reading-block" data-block="heat-intro-0" transform="translate(0 160)"><text class="se-copy" x="89" y="24"><tspan x="89">Cooking vessels often have a metal body and a handle made from a poorer heat</tspan><tspan x="89" dy="32">conductor. Does heat travel along two different spoons at the same rate? To</tspan></text></g>
<g class="v2-reading-block" data-block="heat-intro-1" transform="translate(0 224)"><text class="se-copy" x="89" y="24"><tspan x="89">compare fairly, the spoons should be as similar as possible in length and</tspan><tspan x="89" dy="32">thickness, and should begin at the same temperature.</tspan></text></g>
<g class="v2-reading-block" data-block="heat-task-equipment" transform="translate(0 304)"><image class="science-illustration" data-photo="heat-spoons" href="../../figures/class-7/science/ch04/heat-spoons.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Immerse the two spoon bowls equally. Compare matching points on the handles after the</tspan><tspan x="89" dy="27">same time.</tspan></text></g>
<g class="v2-reading-block" data-block="heat-task" transform="translate(0 666)"><rect class="se-activity-panel" x="89" y="0" width="874" height="478" rx="18"/><path class="v2-activity-header" d="M107 0H945Q963 0 963 18V58H89V18Q89 0 107 0Z"/><g class="v2-panel-heading v2-panel-heading--setup" data-feature="setup" aria-label="Investigate"><svg class="v2-panel-icon" x="109" y="17" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0Z M14.7 14.7 21 21"/></svg><text class="v2-panel-title se-activity-tab-text" x="153" y="39">Investigate</text></g><text class="se-copy" x="113" y="92"><tspan x="113">Your teacher handles hot water in a heat-resistant container on a stable tray.</tspan><tspan x="113" dy="32">Wear eye protection; do not touch heated metal or test temperatures with</tspan><tspan x="113" dy="32">fingers.</tspan></text><text class="se-activity-step" x="132" y="200" text-anchor="end">1.</text><text class="se-copy" x="146" y="200"><tspan x="146">Put similar-sized metal and wooden spoons into the water together,</tspan><tspan x="146" dy="32">equally immersing their bowls. Keep handles above the water.</tspan></text><text class="se-activity-step" x="132" y="276" text-anchor="end">2.</text><text class="se-copy" x="146" y="276"><tspan x="146">The teacher places suitable contact temperature probes at matching</tspan><tspan x="146" dy="32">points above the water. Record starting readings and readings after equal</tspan><tspan x="146" dy="32">intervals.</tspan></text><text class="se-activity-step" x="132" y="384" text-anchor="end">3.</text><text class="se-copy" x="146" y="384"><tspan x="146">Compare the temperature changes. Note differences in shape or probe</tspan><tspan x="146" dy="32">contact. Without suitable probes, use teacher-provided measurements or</tspan><tspan x="146" dy="32">a teacher demonstration.</tspan></text></g>
<g class="v2-reading-block" data-block="heat-record-0" transform="translate(0 1166)"><text class="se-copy" x="89" y="24"><tspan x="89">Read your temperature record as a change from the starting value. If one handle</tspan><tspan x="89" dy="32">began warmer, its final temperature alone could mislead you. Compare the rise</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
