<section class="page page--food page--science-editorial page--science-v2 page--g7-ch04" data-folio="7"><div class="page__body"><div class="page__main"><svg class="food-sheet science-sheet science-editorial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1514" aria-label="The World of Metals and Non-metals, page 7"><g class="v2-header"><path class="v2-ribbon-underlay" d="M0 0H340L317 51Q312 63 291 63H0Z"/><path class="v2-ribbon" d="M0 0H321L300 49Q295 63 274 63H0Z"/><g class="v2-metal-motif" transform="translate(26 9) scale(.40)"><path d="M0 14L39 0L66 18L28 33Z M0 14V39L28 58L66 43V18 M28 33V58 M8 71C8 57 58 57 58 71S8 85 8 99S58 113 58 99"/></g><text class="v2-ribbon-label se-running" x="96" y="41" text-anchor="start">CHAPTER 4</text><text class="v2-running se-running" x="960" y="40" text-anchor="end">The World of Metals and Non-metals</text><line class="v2-furniture-rule" x1="340" x2="963" y1="58" y2="58"/></g><g class="v2-reading-block" data-block="sonority-0" transform="translate(0 112)"><text class="se-copy" x="89" y="24"><tspan x="89">Many metal objects produce a ringing sound when struck. This property is called</tspan><tspan x="89" dy="32"><tspan class="se-bold">sonority</tspan>, and such objects are described as sonorous. A school bell and</tspan></text></g>
<g class="v2-reading-block" data-block="sonority-1" transform="translate(0 176)"><text class="se-copy" x="89" y="24"><tspan x="89">ghungroos use vibrating metal to make sound. Coal and wood often produce</tspan><tspan x="89" dy="32">duller sounds in this comparison. Shape and support also matter: a spoon held</tspan><tspan x="89" dy="32">tightly may not ring like a freely hanging one.</tspan></text></g>
<g class="v2-reading-block" data-block="sound-access-0" transform="translate(0 288)"><text class="se-copy" x="89" y="24"><tspan x="89">Differences in sound can provide information about surroundings. A person</tspan><tspan x="89" dy="32">using a mobility cane may notice changes when its tip contacts wood, metal or</tspan></text></g>
<g class="v2-reading-block" data-block="sound-access-1" transform="translate(0 352)"><text class="se-copy" x="89" y="24"><tspan x="89">another surface. These sounds are useful clues alongside touch and learned</tspan><tspan x="89" dy="32">skills. A sound by itself cannot tell us everything about the material or whether a</tspan><tspan x="89" dy="32">route is safe.</tspan></text></g>
<g class="v2-reading-block" data-block="sound-context-0" transform="translate(0 464)"><text class="se-copy" x="89" y="24"><tspan x="89">Think about a bell after it is struck. It continues vibrating for a time, so the sound</tspan><tspan x="89" dy="32">lasts beyond the impact. Holding it firmly can damp those vibrations. Comparing</tspan></text></g>
<g class="v2-reading-block" data-block="sound-context-1" transform="translate(0 528)"><text class="se-copy" x="89" y="24"><tspan x="89">a bell with a solid block therefore tests differences in construction as well as</tspan><tspan x="89" dy="32">differences in material.</tspan></text></g>
<g class="v2-reading-block" data-block="heat-head" transform="translate(0 620)"><text class="se-heading" x="89" y="30"><tspan x="89">Heat travels through materials</tspan></text></g>
<g class="v2-reading-block" data-block="heat-intro-0" transform="translate(0 668)"><text class="se-copy" x="89" y="24"><tspan x="89">Cooking vessels often have a metal body and a handle made from a poorer heat</tspan><tspan x="89" dy="32">conductor. Does heat travel along two different spoons at the same rate? To</tspan></text></g>
<g class="v2-reading-block" data-block="heat-intro-1" transform="translate(0 732)"><text class="se-copy" x="89" y="24"><tspan x="89">compare fairly, the spoons should be as similar as possible in length and</tspan><tspan x="89" dy="32">thickness, and should begin at the same temperature.</tspan></text></g>
<g class="v2-reading-block" data-block="heat-task-equipment" transform="translate(0 812)"><image class="science-illustration" data-photo="heat-spoons" href="../../figures/class-7/science/ch04/heat-spoons.png" x="323.5" y="0" width="405" height="270" preserveAspectRatio="xMidYMid meet"/><text class="se-caption" x="89" y="300.88"><tspan x="89">Immerse the two spoon bowls equally. Compare matching points on the handles after the</tspan><tspan x="89" dy="27">same time.</tspan></text></g><g class="v2-footer"><line class="v2-furniture-rule" x1="89" x2="862" y1="1485" y2="1485"/><text class="v2-foot-label se-running" x="89" y="1465" text-anchor="start">LEARNLAB · SCIENCE 7</text><path class="v2-ribbon-underlay" d="M1052 1455H915Q900 1455 892 1470L873 1514H1052Z"/><path class="v2-ribbon" d="M1052 1455H935Q920 1455 912 1470L893 1514H1052Z"/><text class="v2-folio se-running" x="945" y="1487" text-anchor="middle">7</text></g></svg></div></div></section>
