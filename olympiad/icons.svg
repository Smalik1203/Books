<svg xmlns="http://www.w3.org/2000/svg">
<!--
  Pictures for the junior papers. A question names one as {apple} or
  {apple*5}; build-paper.mjs copies the symbol inline. Each is drawn on
  a 40 x 40 grid. Strokes and fills come from paper.css through these
  classes, so nothing here carries a colour of its own:

    r red   o orange   y yellow   g green   b blue   br brown
    dbr dark brown   gr grey   p pink   w white   k ink

  An element with no class is an outline only.
-->

<!-- Maths -->
<symbol id="ball"><circle class="r" cx="20" cy="20" r="14"/><path class="y" d="M6 20c8-4.5 20-4.5 28 0-8 4.5-20 4.5-28 0z"/><circle cx="20" cy="20" r="14"/></symbol>
<symbol id="star"><path class="y" d="M20 6.5L23.82 16.24L34.27 16.86L26.18 23.51L28.82 33.64L20 28L11.18 33.64L13.82 23.51L5.73 16.86L16.18 16.24Z"/></symbol>
<symbol id="balloon"><path d="M20 29.5c-3 3 3 5 0 9"/><ellipse class="r" cx="20" cy="15" rx="10" ry="12"/><path class="r" d="M18.5 27h3L20 29.5z"/></symbol>
<symbol id="circle"><circle class="b" cx="20" cy="20" r="14"/></symbol>
<symbol id="triangle"><path class="b" d="M20 5l16 29H4z"/></symbol>
<symbol id="square"><rect class="b" x="7" y="7" width="26" height="26"/></symbol>
<symbol id="rectangle"><rect class="b" x="3" y="11" width="34" height="18"/></symbol>
<symbol id="kite"><path d="M20 33c-3 2 3 3 0 5"/><path class="r" d="M20 3l11 13-11 17L9 16z"/><path d="M20 3v30M9 16h22"/></symbol>

<!-- Food -->
<symbol id="apple"><path class="r" d="M20 12c-3-3-11-3-12 5-1 9 5 17 9 17 1.5 0 2-1 3-1s1.5 1 3 1c4 0 10-8 9-17-1-8-9-8-12-5z"/><path d="M20 12c0-3 1-6 3-8"/><path class="g" d="M21 9c2-4 7-5 9-4-1 3-5 5-9 4z"/></symbol>
<symbol id="banana"><path class="y" d="M7 11c1 13 10 21 25 19 2-.3 2.5-2.3.5-3C22 28 15 21 13 11c-.5-2.5-6-2.5-6 0z"/><path d="M8.5 9.5L8 5"/></symbol>
<symbol id="orange"><path d="M20 9V5"/><circle class="o" cx="20" cy="22" r="13"/><path class="g" d="M20 9c2-4 6-5 8-4-1 3-4 5-8 4z"/></symbol>
<symbol id="carrot"><path class="g" d="M26 12c0-5 2-8 5-9-1 4-2 7-5 9zM27 13c4-2 8-2 10 0-3 2-7 2-10 0z"/><path class="o" d="M22 10c3-2 8 3 6 6L8 33c-1 1-2 0-1-1z"/><path d="M16 20l2 2M12 26l2 2M20 15l1.5 1.5"/></symbol>
<symbol id="egg"><path class="w" d="M20 5c7 0 12 11 12 19 0 7-5 12-12 12S8 31 8 24C8 16 13 5 20 5z"/></symbol>
<symbol id="milk"><path class="w" d="M15 4h10v5l4 6v20c0 1-1 2-2 2H13c-1 0-2-1-2-2V15l4-6z"/><rect class="b" x="14" y="2.5" width="12" height="4" rx="1"/><rect class="b" x="11" y="20" width="18" height="9"/><text class="tiny" x="20" y="24.5">MILK</text></symbol>
<symbol id="ice-cream"><path class="o" d="M12 19h16l-8 19z"/><circle class="p" cx="20" cy="14" r="9"/><circle class="r" cx="20" cy="4" r="2.2"/></symbol>

<!-- Animals -->
