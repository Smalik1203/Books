<symbol id="cow"><path d="M13 8c-3-1-4-4-3-6M27 8c3-1 4-4 3-6"/><path class="w" d="M11 11c-4-1-8 0-8 3 3 1 6 1 8-1zM29 11c4-1 8 0 8 3-3 1-6 1-8-1z"/><rect class="w" x="10" y="7" width="20" height="22" rx="8"/><ellipse class="p" cx="20" cy="29" rx="9" ry="6"/><circle class="k" cx="15" cy="17" r="1.4"/><circle class="k" cx="25" cy="17" r="1.4"/><circle class="k" cx="17" cy="29" r="1.2"/><circle class="k" cx="23" cy="29" r="1.2"/></symbol>
<symbol id="hen"><path d="M17 34v4M23 34v4M15 38h4M21 38h4"/><path class="w" d="M10 8c3 0 5.5 2.5 5.5 5.5 0 2-.5 3 0 4C19 17 24 18 28 16L31 7l5 3-2 8c3 6-1 16-13 16-10 0-15-6-15-12 0-3-1-5-1-8 0-3.5 2-6 6-6z"/><path class="r" d="M7.5 8.5c-.5-2.5 1-4 2.5-3 .5-2 3-2 3 0 1.5-.5 2.5 1 1.5 3z"/><path class="o" d="M4.2 12.5l-3.5 1.5 3.5 1.5z"/><ellipse class="r" cx="5.5" cy="18" rx="1.3" ry="2"/><circle class="k" cx="9" cy="12" r="1.1"/><path d="M15 24c4 5 11 5 14-1"/></symbol>
<symbol id="frog"><circle class="g" cx="12" cy="14" r="5"/><circle class="g" cx="28" cy="14" r="5"/><ellipse class="g" cx="20" cy="25" rx="15" ry="10"/><circle class="w" cx="12" cy="14" r="2.6"/><circle class="w" cx="28" cy="14" r="2.6"/><circle class="k" cx="12" cy="14" r="1.2"/><circle class="k" cx="28" cy="14" r="1.2"/><path d="M12 26c4 3 12 3 16 0"/></symbol>
<symbol id="ant"><path d="M13 25l-4 7M15 26v7M17 25l4 7M13 21l-4-6M17 21l4-6M15 20v-6M6 19l-3-6M8 18.5v-7"/><circle class="k" cx="8" cy="22" r="3.5"/><circle class="k" cx="15" cy="23" r="3"/><ellipse class="k" cx="27" cy="22" rx="7" ry="5.5"/></symbol>
<symbol id="butterfly"><path class="p" d="M19 19C14 8 4 5 4 12s6 9 15 8z"/><path class="p" d="M21 19c5-11 15-14 15-7s-6 9-15 8z"/><path class="y" d="M19 21c-8 0-12 4-11 8s6 3 11-6z"/><path class="y" d="M21 21c8 0 12 4 11 8s-6 3-11-6z"/><ellipse class="k" cx="20" cy="21" rx="1.6" ry="8"/><path d="M19.5 13.5c-1-3-3-5-5-6M20.5 13.5c1-3 3-5 5-6"/></symbol>
<symbol id="nest"><ellipse class="w" cx="14" cy="18" rx="3.5" ry="4.5"/><ellipse class="w" cx="20" cy="17" rx="3.5" ry="4.5"/><ellipse class="w" cx="26" cy="18" rx="3.5" ry="4.5"/><path class="br" d="M4 20c1 9 8 14 16 14s15-5 16-14z"/><path d="M7 24h26M10 29h20"/></symbol>

<!-- Plants and nature -->
<symbol id="tree"><rect class="br" x="17" y="24" width="6" height="13"/><path class="g" d="M20 4c6 0 10 4 10 9 3 1 5 4 5 7 0 5-4 8-9 8H14c-5 0-9-3-9-8 0-3 2-6 5-7 0-5 4-9 10-9z"/></symbol>
<symbol id="flower"><path d="M20 22v15"/><path class="g" d="M20 31c-4 0-7-2-8-5 4 0 7 2 8 5z"/><circle class="p" cx="20" cy="8" r="5"/><circle class="p" cx="27" cy="13.5" r="5"/><circle class="p" cx="24.5" cy="21" r="5"/><circle class="p" cx="15.5" cy="21" r="5"/><circle class="p" cx="13" cy="13.5" r="5"/><circle class="y" cx="20" cy="15" r="4"/></symbol>
